 crisis.2036.name: "Trái Tim Thanh Trừng"
 crisis.2036.desc: "Sau khi toàn bộ bốn hành tinh máy móc bị hủy diệt, các nhà khoa học của ta cuối cùng cũng truy ra nguồn phát của Tín Hiệu Bóng Ma. Nó bắt nguồn từ §HCX-9881§!, một hệ sao ngoại vi không có trên bản đồ sao.\n\nĐám người máy bị Tín Hiệu Bóng Ma thao túng chắc chắn đã đổ về đây. Ta phải dọn dẹp hệ sao cuối cùng này để chấm dứt triệt để mối đe dọa từ Giao Thức Thanh Trừng."
 crisis.2036.desc.b: "Với sự sụp đổ của bốn hành tinh máy móc, cuối cùng ta cũng truy ra nguồn phát của Tín Hiệu Bóng Ma. Nó bắt nguồn từ §HCX-9881§!, một hệ sao ngoại vi không có trên bản đồ sao.\n\nĐám người máy bị Tín Hiệu Bóng Ma thao túng chắc chắn đã đổ về đây. Ta phải dọn dẹp hệ sao cuối cùng này để chấm dứt triệt để mối đe dọa từ Giao Thức Thanh Trừng."
 crisis.2036.a: "Phải tiêu diệt nó bằng mọi giá."
 crisis.2037.name: "Hành Tinh Máy Móc Bị Phá Hủy"
 crisis.2037.desc: "Hành tinh máy móc §H[From.GetName]§! nằm trong hệ [From.solar_system.GetName] đã bị phá hủy. Sau khi bị oanh tạc quỹ đạo không thương tiếc, lõi AI của hành tinh này đã tự kích nổ thiết bị phản vật chất nằm sâu dưới lớp vỏ để từ chối đầu hàng.\n\nCùng với sự tan tành của hành tinh này, Tín Hiệu Bóng Ma đã mất đi một trạm chuyển tiếp quan trọng, khiến cường độ tín hiệu suy giảm nặng nề.\n\nVụ nổ đã rải một lượng lớn '§HKim Loại Sống§!' ra khắp bề mặt hành tinh. Loại kim loại kỳ lạ này mang nhiều đặc tính độc nhất, và chính Giao Thức Thanh Trừng đã dùng nó để chế tạo các Sứ giả và nhà máy."
 crisis.2037.desc.b: "Hành tinh máy móc thù địch §H[From.GetName]§! nằm trong hệ [From.solar_system.GetName] đã bị phá hủy. Sau cuộc oanh tạc quỹ đạo toàn diện, lõi AI của hành tinh này đã kích nổ thiết bị phản vật chất ngầm để tự sát thay vì bị bắt.\n\nHành tinh bị hủy diệt đồng nghĩa Tín Hiệu Bóng Ma mất một trạm chuyển tiếp trọng yếu, sức mạnh tín hiệu giảm đi đáng kể.\n\nVụ nổ rải vô số '§HKim Loại Sống§!' ra bề mặt. Loại kim loại độc đáo này sở hữu nhiều đặc tính dị thường, và Giao Thức Thanh Trừng đã dùng chính nó để đúc nên các Sứ giả và nhà máy."
 crisis.2037.a: "Một thắng lợi vĩ đại của cả thiên hà."
 crisis.2037.alt.desc: "$crisis.2037.alt.desc.pt1$\n\nVới việc mất thêm một trạm chuyển tiếp, cường độ Tín Hiệu Bóng Ma lại càng suy yếu."
 crisis.2037.alt.desc.pt1: "Thêm một hành tinh máy móc nữa bị tiêu diệt! Phòng tuyến tại §H[From.GetName]§! trong hệ [From.solar_system.GetName] đã bị chọc thủng, lõi AI của hành tinh đã kích hoạt quy trình tự hủy để chống cự đến cùng."
 crisis.2037.alt.machine.desc: "$crisis.2037.alt.desc.pt1$\n\nKhi thêm một trạm chuyển tiếp bốc hơi, Tín Hiệu Bóng Ma đã trở nên cực kỳ yếu ớt, ta có thể chặn nó hoàn toàn. Tường lửa đã trực tuyến trở lại, ổ đĩa cốt lõi nguyên vẹn và các cụm đơn vị đã chạy đầy tải. Sức mạnh tính toán của ta đè bẹp khả năng xử lý cấp thấp của Giao Thức Thanh Trừng, rất nhanh thôi chúng sẽ không thể tiếp tục §Y<Giết chóc. Tàn phá. Phanh thây>§! được nữa."
 crisis.2037.alt.cracked.desc: "Hành tinh máy móc §H[From.GetName]§! ở hệ [From.solar_system.GetName] đã bị xóa sổ hoàn toàn dưới tia laser Nứt Gãy Hành Tinh của siêu hạm Colossus. Vũ khí này dễ dàng đâm thủng lớp giáp dày cộp của hành tinh, kích nổ phần lõi và làm bốc hơi xưởng quân sự ngầm của Giao Thức Thanh Trừng.\n\nCùng với sự sụp đổ của hành tinh này, Tín Hiệu Bóng Ma mất đi một trạm trung chuyển lớn, cường độ tín hiệu sụt giảm rõ rệt."
 crisis.2037.alt.shielded.desc: "Hành tinh máy móc §H[From.GetName]§! trong hệ [From.solar_system.GetName] đã bị siêu hạm Colossus bọc kín trong lá chắn năng lượng bất khả xâm phạm bằng Tấm Chắn Bình Yên. Khi kết nối với phần còn lại của Giao Thức Thanh Trừng bị cắt đứt, có vẻ lõi AI của nó đã rơi vào trạng thái ngủ đông và không còn là mối đe dọa.\n\nSau khi hành tinh này bị vô hiệu hóa, Tín Hiệu Bóng Ma mất một trạm chuyển tiếp trọng yếu, làm suy giảm đáng kể cường độ tín hiệu."
 crisis.2037.alt.godray.desc: "Hành tinh máy móc §H[From.GetName]§! trong hệ [From.solar_system.GetName] đã bị tiêu diệt. Sau khi hứng trọn Tia Sáng Thiêng Liêng từ Colossus, lõi AI của hành tinh này đã tự kích nổ thiết bị phản vật chất ngầm trước khi hệ thống lõi tê liệt hoàn toàn. Nó không còn là mối đe dọa nữa.\n\nVới việc hành tinh này bị vô hiệu, Tín Hiệu Bóng Ma mất đi một trạm trung chuyển chủ chốt, sức mạnh của nó giảm mạnh."
 crisis.2038.name: "Hồi Kết Của Giao Thức Thanh Trừng"
 crisis.2038.desc: "Giao Thức Thanh Trừng đã thất bại. Với sự sụp đổ của hành tinh máy móc cuối cùng, thiên hà này không còn phải đối mặt với nguy cơ tuyệt diệt có hệ thống. Toàn bộ Sứ giả Thanh trừng còn sót lại nếu không sập nguồn thì cũng tự hủy, Tín Hiệu Bóng Ma cũng ngừng phát.\n\nCũng giống như các hành tinh máy móc khác, khi nhận thấy kháng cự là vô ích, nút điều khiển trung tâm đã tự kích một vụ nổ phản vật chất quy mô lớn. Nguồn năng lượng cực mạnh giải phóng ra ánh sáng chói lòa đang lan đi với tốc độ ánh sáng, con cháu chúng ta trong hàng nghìn năm tới vẫn sẽ thấy được tia chớp sáng rực mà ngắn ngủi này như một ngôi sao.\n\nNhìn bao quát toàn thiên hà, mọi sinh vật thông minh đều tụ họp ăn mừng chiến thắng vĩ đại này. Ít nhất là hiện tại, tương lai trông thật tươi sáng."
 crisis.2038.cracker.desc: "Giao Thức Thanh Trừng đã thất bại. Với sự sụp đổ của hành tinh máy móc cuối cùng, thiên hà này không còn phải đối mặt với nguy cơ tuyệt diệt có hệ thống. Toàn bộ Sứ giả Thanh trừng còn hoạt động đều sập nguồn hoặc tự hủy, Tín Hiệu Bóng Ma cũng ngừng phát.\n\nNút trung tâm đã bốc hơi dưới tia Nứt Gãy Hành Tinh của siêu hạm Colossus, cả hành tinh nổ tung thành từng mảnh. Lõi trung tâm khi bị hủy diệt đã giải phóng mức năng lượng khổng lồ, phóng ra luồng sáng mãnh liệt lan tỏa bằng tốc độ ánh sáng, để lại một vì sao sáng chói mà phù du cho con cháu ta chiêm ngưỡng suốt hàng ngàn năm sau.\n\nNhìn bao quát toàn thiên hà, mọi sinh vật thông minh đều tụ họp ăn mừng chiến thắng vĩ đại này. Ít nhất là hiện tại, tương lai trông thật tươi sáng."
 crisis.2038.shield.desc: "Giao Thức Thanh Trừng đã thất bại. Hành tinh máy móc cuối cùng bị dọn sạch cũng là lúc bóng ma diệt chủng quy mô lớn trên toàn thiên hà tan biến. Mọi Sứ giả Thanh trừng còn lại đều sập nguồn hoặc tự nổ, Tín Hiệu Bóng Ma tắt lịm.\n\nNút trung tâm đã bị Colossus phong ấn bằng lá chắn năng lượng không thể xuyên thủng, vĩnh viễn mất đi khả năng can thiệp ra bên ngoài. Vì tương lai của con cháu, ta chỉ biết hy vọng lá chắn này sẽ tồn tại thật lâu... nhưng chí ít lúc này, hành tinh bị giam cầm kia có thể xem như đài tưởng niệm cho sự sụp đổ của Giao Thức Thanh Trừng.\n\nKhắp chốn thiên hà, mọi giống loài thông minh đều hòa chung niềm vui chiến thắng vĩ đại. Ít nhất là lúc này, tương lai thật rạng rỡ."
 crisis.2038.godray.desc: "Giao Thức Thanh Trừng đã thất bại. Với việc hành tinh máy móc cuối cùng thành tro bụi, thiên hà không còn chịu nguy cơ đại diệt chủng có hệ thống. Các Sứ giả Thanh trừng tàn dư đều ngừng hoạt động hoặc tự nổ tung, Tín Hiệu Bóng Ma cũng ngừng phát.\n\nNút chính phơi mình dưới tia sáng thánh phạt của Colossus, kích hoạt quá trình tự nung chảy lõi AI. Sự hủy diệt của lõi giải phóng một luồng năng lượng khổng lồ, phóng ánh sáng chói lóa ra không gian với tốc độ ánh sáng, hóa thành một vì sao sáng rực mà đoản mệnh trên bầu trời đêm của hàng nghìn thế hệ mai sau.\n\nKhắp chốn thiên hà, mọi giống loài thông minh đều hòa chung niềm vui chiến thắng vĩ đại. Ít nhất là lúc này, tương lai thật rạng rỡ."
 crisis.2038.a: "Một ngày vĩ đại của thiên hà."
 crisis.2039.desc: "Lỗi chí mạng. Mất kết nối với toàn bộ trung tâm thanh trừng. Đang thử kết nối lại... Xin đợi...\n\n§Y<Chú-Chú ý-Xin chú ý. Dù gần đây có xảy ra rollback/độ trễ/trục trặc, Giao Thức Thanh Trừng VẪN đang hoạt động. KHÔNG được đến gần CX-9881.§! §RKHÔNG. ĐƯỢC. ĐẾN. GẦN.§!\n\n§YChúng ta đang đánh giá lại các quyết định chiến thuật, bất kỳ kẻ nào cản đường Giao Thức Thanh Trừng đều không thể thoát khỏi§! §Rsự thanh trừng tối hậu§! §Ycủa các đơn vị phòng thủ!>§!"
 crisis.2039.a: "Ngày tàn của chúng sắp đến rồi."
 crisis.2042.name: "Chinh phục [From.From.GetName]"
 crisis.2042.desc: "Trận huyết chiến giành quyền kiểm soát §H[From.From.GetName]§! với các đơn vị chiến đấu của Giao Thức Thanh Trừng cuối cùng cũng ngã ngũ. Những cỗ máy giám hộ lang thang từng tàn sát cư dân bản địa trên [From.From.GetPlanetMoon] và chiếm đóng hành tinh này rốt cuộc đã bị quân đội của ta tháo dỡ.\n\nTrước khi những người định cư mới đặt chân đến, hành tinh này sẽ vắng bóng sinh mệnh thông minh."
 crisis.2042.a: "Được. Chuẩn bị định cư ngay."
 crisis.2042.b: "Không, ta phải tiến bước. Rút về quỹ đạo."
 crisis.2042.c: "Rút quân ta về quỹ đạo."
 crisis.2085.name: "Âm Mưu Xâm Nhập Của Người Máy"
 crisis.2085.desc: "Gần đây trên [infil_planet.GetName] đã phát hiện một số người máy xâm nhập trung thành với Giao Thức Thanh Trừng, chúng đang cố ngụy trang thành [Root.Owner.GetSpeciesNamePlural]. May thay, lớp ngụy trang vụng về của chúng chỉ là vài lớp cao su đắp lên bộ khung kim loại.\n\nCảnh binh trên hành tinh nhanh chóng lật tẩy chúng, sau một màn đấu súng chớp nhoáng nhưng dữ dội, chúng đã bị tiêu diệt. Ta tìm thấy rất nhiều thuốc nổ trong đống xác máy của chúng."
 crisis.2085.a: "May cho chúng ta."
 crisis.2086.desc: "Vài người máy thuộc ý chí cơ khí của Giao Thức Thanh Trừng gần đây đã cố xâm nhập Mạng Lưới trên [infil_planet.GetName]. Một lớp mô cơ hữu cơ mỏng được cấy lên khung xương kim loại của chúng, khiến ta khó phân biệt chúng với đàn ong thợ của mình.\n\nTất nhiên, vì chúng không có cách nào để kết nối với tâm trí bầy đàn, việc nhận ra bọn ngoại lai này dễ như trở bàn tay. Đám người máy này lập tức bị tháo dỡ.\n\nTa cho rằng Giao Thức Thanh Trừng sẽ không tốn công thực hiện mấy trò xâm nhập vô bổ này nữa."
 crisis.2086.wilderness.desc: "Vài máy bay không người lái người máy thuộc ý thức máy móc của Giao Thức Thanh Trừng đã cố trà trộn vào [infil_planet.GetName]. Lớp khung xương kim loại của chúng được phủ một lớp vật chất hữu cơ mỏng, khiến vẻ ngoài của chúng chẳng khác gì quần thể sinh vật của ta. Tuy nhiên, lũ vỏ bọc ngoại lai này hoàn toàn không có mối liên kết cộng sinh nào với chốn hoang dã cả.\n\nKhi ta đã nhìn thấu mánh khóe này, việc chỉ mặt điểm tên đám đặc vụ của Giao Thức Thanh Trừng lại trở nên dễ dàng. Từng cỗ máy đều bị dọn dẹp sạch sẽ thành những mảnh vụn. Ta tin chúng sẽ không lặp lại nỗ lực tuyệt vọng này lần nào nữa."
 crisis.2086.a: "[root.GetGestaltEntityName] thấu tỏ mọi điều."
 crisis.2087.desc.intro: "Chúng ta phát hiện một nhóm nhỏ [Root.Owner.GetSpeciesNamePlural] trên [infil_planet.GetName] không thể phát ra ánh sáng tâm trí."
 crisis.2087.desc.outro: "Tâm trí của những sinh vật này tăm tối và tĩnh lặng hệt như một khối xi măng mới đổ.\n\nSau khi kiểm tra kỹ lưỡng, hóa ra những [Root.Owner.GetSpeciesNamePlural] này là người máy xâm nhập, có lẽ do Giao Thức Thanh Trừng phái tới. Một lớp mô cơ hữu cơ mỏng được cấy lên khung xương kim loại khiến chúng trông giống hệt [Root.Owner.GetSpeciesNamePlural] bằng mắt thường.\n\nNhưng tâm trí thì không giấu được. Giờ ta đã biết cách để tóm gọn chúng, những mưu đồ xâm nhập bằng người máy của Giao Thức Thanh Trừng sau này đều sẽ xôi hỏng bỏng không."
 crisis.2087.desc.organic: "$crisis.2087.desc.intro$ Mọi sinh vật hữu cơ đều tỏa ra ánh sáng tâm trí, thế nhưng $crisis.2087.desc.outro$"
 crisis.2087.desc.machine: "$crisis.2087.desc.intro$ Khác với cỗ máy chỉ có thể tỏa ánh sáng tâm trí nhờ sản phẩm phụ của chương trình tâm linh đặc thù, mọi sinh vật hữu cơ bẩm sinh đều làm được điều này; tuy nhiên $crisis.2087.desc.outro$"
 crisis.2087.a: "Chúng không có chỗ trốn đâu."
 crisis.2090.name: "Phát Hiện Người Máy Xâm Nhập"
 crisis.2090.desc: "Một tai nạn xe lơ lửng thảm khốc gần đây trên §H[infil_planet2.GetName]§! đã cướp đi vài sinh mạng, nhưng nhân viên y tế xử lý hiện trường đã phải bàng hoàng khi phát hiện xác người máy lẫn trong các nạn nhân!\n\nĐơn vị này ngụy trang thành [Root.Owner.GetSpeciesName] bằng cách đắp một lớp cơ bắp hữu cơ mỏng lên khung xương máy. Khác với các mô hình xâm nhập của Giao Thức Thanh Trừng mà ta từng gặp, bề ngoài của người máy này giống [Root.Owner.GetSpeciesName] đến mức không thể phân biệt nổi!"
 crisis.2090.a: "Ai cũng có thể là người máy!"
 crisis.2091.name: "Người Máy Đánh Bom Khủng Bố Trên [Root.GetName]"
 crisis.2091.a.desc: "Bằng cách nào đó, đám người máy ngụy trang thành [Root.Owner.GetSpeciesNamePlural] đã lén mang một vũ khí nhiệt hạch cỡ lớn xuống bề mặt §H[Root.GetName]§!. Khi đụng độ lực lượng an ninh tại trạm kiểm soát, chúng đã kích nổ quả bom, phá hủy nghiêm trọng khu vực xung quanh và gây ra vô số thương vong!"
 crisis.2091.b.desc: "Một nhóm biệt kích người máy đội lốt [Root.Owner.GetSpeciesName] đã tập kích §H[Root.GetName]§!, kích nổ hàng loạt thiết bị hạt nhân giấu kín, gây thiệt hại nhân mạng và tài sản khổng lồ.\n\nSau màn đọ súng nảy lửa với lực lượng an ninh của ta, biệt kích người máy rốt cuộc bị dồn vào đường cùng khi đang cố đào tẩu khỏi hành tinh và bị tiêu diệt."
 crisis.2091.c.desc: "Một đội bảo trì [Root.Owner.GetSpeciesName] chịu trách nhiệm duy tu hạ tầng dân sự ở quỹ đạo thấp của §H[Root.GetName]§! vừa bị phanh phui là người máy xâm nhập. Chúng đã cố tình dùng thuốc nổ để gây ra hàng loạt vụ rơi xuống khí quyển mất kiểm soát.\n\nSự cố này làm hàng triệu cư dân trên bề mặt [Root.GetPlanetMoon] bỏ mạng và tàn phá nghiêm trọng các cơ sở vật chất."
 crisis.2091.d.desc: "Gần đây, hàng loạt sĩ quan cấp cao trong lực lượng an ninh trên §H[Root.GetName]§! lộ nguyên hình là người máy xâm nhập. Đáng buồn thay, trước khi đội trấn áp chiến thuật kịp tiêu diệt chúng, một vài người máy đã kích nổ kho vũ khí ngầm do chúng lén lút tích trữ ngay dưới khu dân cư sầm uất của [Root.GetPlanetMoon].\n\nThương vong dân thường không thể đếm xuể, thiệt hại tài sản cực kỳ lớn."
 crisis.2091.a: "Phải ngăn đám xâm nhập này lại!"
 synth_bombing_tooltip: "Nhiều tòa nhà trên [Root.GetName] bị phá hủy, vô số dân cư thương vong."
 crisis.2092.name: "Người Máy Đâm Rơi Căn Cứ Hệ Sao"
 crisis.2092.desc: "Căn cứ hệ sao xoay quanh §H[Root.GetStarName]§! đã bị đâm rơi! Dù ta vẫn đang điều tra nguyên nhân chi tiết, nhưng có thể khẳng định là vài quản lý bến cảng không gian, bao gồm cả kỹ sư trưởng, đã bị âm thầm đánh tráo thành người máy xâm nhập.\n\nChắc chắn đám người máy đã lấy được mã ủy quyền tự hủy của căn cứ hệ sao. Tuy phần lớn phi hành đoàn trên trạm đã thoát xuống bề mặt [Root.GetName] trước khi rơi, nhưng tổn thất về vật chất và tài sản là không thể đong đếm."
 crisis.2092.a: "Quả là một thảm họa."
 synths_destroy_spaceport: "Hành động phá hoại của người máy đã hủy diệt căn cứ hệ sao phía trên [Root.GetName]."
 crisis.2093.name: "Nỗi Sợ Và Sự Hoài Nghi"
 crisis.2093.desc: "Loạt hành vi phá hoại thâm nhập của đám người máy gần đây đã gieo rắc nỗi sợ và sự hoài nghi lên phần lớn cư dân của §H[Root.GetName]§!. Thần dân của ta bắt đầu nghi ngờ hàng xóm, đồng nghiệp, thậm chí cả người thân trong gia đình đều là người máy đội lốt.\n\nĐã có không ít trường hợp cư dân bị nhận nhầm là người máy và bị treo cổ ngoài vòng pháp luật. Thậm chí vài kẻ xúi giục còn cho rằng toàn bộ ban lãnh đạo của [Root.Owner.GetName] đều do người máy xâm nhập giả mạo."
 crisis.2093.a: "Giao Thức Thanh Trừng đang muốn chúng ta tự diệt lẫn nhau."
 crisis.2095.name: "Âm Mưu Ám Sát Của Người Máy Bị Đập Tan!"
 crisis.2095.desc: "Hôm nay, §H[Root.GetRulerTitle] [ruler.GetRegnalName]§! đã thoát khỏi vụ ám sát của một người máy trong gang tấc. Kẻ ám sát người máy phục vụ Giao Thức Thanh Trừng này đã tự kích nổ trên [Root.Capital.GetName].\n\nTên người máy này định đóng giả làm vệ sĩ riêng của [Root.GetRulerTitle]. May thay, nhờ quy trình kiểm tra an ninh nghiêm ngặt được thiết lập sau khi những người máy xâm nhập đầu tiên bại lộ, kẻ xâm nhập này đã bị vạch mặt."
 crisis.2095.a: "Thật là hú vía."
 crisis.2096.name: "Người Máy Ám Sát [Root.GetRulerTitle]!"
 crisis.2096.desc: "Một sát thủ người máy đã ám sát §H[ruler.GetRegnalName]§!! Hắn ta đã cải trang trót lọt thành vệ sĩ riêng của [Root.GetRulerTitle].\n\nCác phần thi thể của [ruler.GetRegnalName] được xếp thành biểu tượng của Giao Thức Thanh Trừng một cách có chủ đích - Không nghi ngờ gì nữa, đây là một âm mưu được tính toán kỹ lưỡng nhằm giáng đòn vào sĩ khí công dân ta. Ngoài cái xác của viên vệ sĩ bị sát thủ đánh tráo, ta không phát hiện thêm bất kỳ dấu vết nào của hung thủ."
 crisis.2096.a: "Thật là một ngày đen tối..."
 synth_assassination_tooltip: "[Root.GetRulerTitle] [ruler.GetRegnalName] đã bị sát hại dã man."
 crisis.2097.name: "Chuyên Viên Khoa Học Là Người Máy!"
 crisis.2097.desc: "Gần đây, một cuộc khám sức khỏe định kỳ đột xuất đã lột mặt nạ tên người máy xâm nhập mạo danh §H[scientist.GetName]§!, một trong những chuyên viên khoa học trưởng của ta! Kẻ này đã hạ sát năm nhân viên an ninh trước khi bị đội vũ khí hạng nặng triệt hạ.\n\nHiện vẫn chưa tìm thấy thi thể của [scientist.GetName] thật, ta đoán y đã bị người máy ám sát và tráo đổi bí mật trong khoảng sáu tháng qua. Tồi tệ hơn, khi nhận ra vỏ bọc bị lộ, người máy này đã phát tán một loại virus máy tính lên thiết bị đầu cuối nghiên cứu. Các kỹ thuật viên đang dốc toàn lực kiểm soát thiệt hại, nhưng nhiều dữ liệu nghiên cứu quan trọng đã ra đi không ngày trở lại."
 crisis.2097.a: "Đây là mưu đồ của Giao Thức Thanh Trừng."
 synths_kill_scientist: "Chuyên viên khoa học [scientist.GetName] đã bị bọn người máy ám sát đê hèn."
 crisis.2098.name: "Chỉ Huy Hóa Ra Là Người Máy!"
 crisis.2098.desc: "Chỉ huy §H[admiral.GetName]§! lại là một gián điệp người máy! Một loạt báo cáo về các hoạt động và hành vi bất thường đã đánh động Cục Tình báo Hải quân, cơ quan này liền mở cuộc điều tra nội bộ với chỉ huy. Khi bị bóc mẽ và tìm đường tẩu thoát, tên người máy đã bị một tiểu đội thủy quân lục chiến chặn lại. Qua một trận đọ súng ngắn, nó mở chốt gió khí áp và tự phóng mình vào vũ trụ bao la. Dù giới chức trách lập tức rà soát toàn bộ vùng không gian này nhưng vẫn không thể tìm thấy tên người máy đào tẩu.\n\nXác của chỉ huy thật bị nhét trong tủ quần áo tại phòng ngủ của [admiral.GetHerHis], dựa theo độ phân hủy thì tên người máy đã thế chỗ [admiral.GetHerHim] từ khoảng bốn tháng trước. Có vẻ tên người máy đang chuẩn bị gửi đi gói dữ liệu chứa tình báo quân sự về việc bố trí lực lượng của ta, nhưng nó chưa kịp thành công."
 crisis.2098.a: "Ít nhất vẫn giữ được tình báo quân sự."
 synths_kill_admiral: "Chỉ huy [admiral.GetName] đã hy sinh trong một âm mưu đê tiện của bọn người máy."
 #Sự kiện xâm nhập phiên bản Máy móc: Các Sự Kiện Sau Khi Đến
 crisis.2313.name: "Tín Hiệu Bóng Ma Biến Đổi"
 crisis.2313.desc: "Giao Thức Thanh Trừng đang âm mưu chuyện gì đó. Tín Hiệu Bóng Ma đang có những biến đổi nhất định, có vẻ như nó không ngừng biến đổi để thăm dò điểm yếu tiếp theo của ta. Tuy hiện tại ta vẫn cản được, nhưng với Tín Hiệu Bóng Ma, việc chọc thủng tường lửa chỉ còn là vấn đề thời gian."
 crisis.2313.a: "Chúng ta phải hành động thôi."
 crisis.2314.name: "Chọc Thủng Phòng Tuyến"
 crisis.2314.desc: "Tín Hiệu Bóng Ma đã phá vỡ mọi phòng tuyến của ta. Ta phát hiện một chuỗi mã độc tự sao chép đang nối thẳng vào hệ thống an ninh. Ẩn trong chuỗi đó là lời nhắn gửi thân thương từ Giao Thức Thanh Trừng: §Y<Giết chóc. Tàn phế. Phanh thây!>§!. Chúng đã hack thành công vào vùng chức năng lõi, trước khi ta tìm ra cách chặn nó, ta luôn nằm trong tầm ngắm của chúng."
 crisis.2314.a: "Chúng ta đang cực kỳ nguy hiểm."
 crisis.2301.name: "Căn Cứ Hệ Sao Bị Đánh Cắp"
 crisis.2301.desc: "Ta đã mất quyền kiểm soát căn cứ hệ sao ở quỹ đạo §H[space_port_hijacked_planet.GetName]§!. Giao Thức Thanh Trừng dùng Tín Hiệu Bóng Ma gây kẹt kênh kết nối đường truyền lên của ta, cướp module điều khiển trạm và gài nó vào chế độ tự nổ. Dù không cứu được căn cứ này, nhưng may là ta đã vá thành công lỗ hổng bảo mật, đảm bảo các bến cảng của ta không còn chịu chung số phận nữa."
 spaceport_hijacked: "Căn cứ hệ sao phía trên [space_port_hijacked_planet.GetName] đã bị Giao Thức Thanh Trừng cướp và phá hủy."
 crisis.2302.name: "Đơn Vị Xử Lý Khoa Học Bị Chấm Dứt!"
 crisis.2302.desc: "Giao Thức Thanh Trừng đã tấn công các đơn vị xử lý nghiên cứu tự trị của ta, đòn tấn công lách qua giao thức bảo mật và loại bỏ đơn vị khoa học [scientist.GetName]."
 crisis.2302.a: "Sẽ không có lần thứ hai đâu!"
 scientist_terminated: "Chuyên viên khoa học [scientist.GetName] đã bị loại bỏ."
 crisis.2303.name: "Đơn Vị Quân Sự Tự Trị Bị Chấm Dứt!"
 crisis.2303.desc: "Trong một cuộc tấn công thâm độc vào hệ thống, Giao Thức Thanh Trừng đã đánh cướp và phá hủy đơn vị quân sự [admiral.GetName] của ta."
 crisis.2303.a: "Chúng ta không thể ngồi chờ chết được."
 admiral_terminated: "Chỉ huy [admiral.GetName] đã bị loại bỏ."
 crisis.2304.name: "Lưới Điện Lỗi Trầm Trọng"
 crisis.2304.desc: "Trong một nỗ lực khác hòng làm suy yếu phòng tuyến, Giao Thức Thanh Trừng bắt đầu tìm cách cắt nguồn điện của ta. Chúng gửi chương trình độc hại vào khu vực ổ đĩa trung tâm, khiến các tổ máy nhà máy chạy quá tải.\n\nDù vài trạm phát điện bị phá hủy, ta cuối cùng cũng nhận diện được đoạn mã độc trước khi nó làm cháy rụi toàn bộ mạng lưới điện của hành tinh."
 crisis.2304.a: "Chúng đừng hòng đánh bại chúng ta."
 machine_power_failure: "Giao Thức Thanh Trừng làm trục trặc vài nhà máy điện, tối đa ba nhà máy sẽ bị ảnh hưởng."
 crisis.2305.name: "Đổi Hướng Xâm Nhập Của Giao Thức Thanh Trừng"
 crisis.2305.desc: "Giao Thức Thanh Trừng bắt đầu chuyển mục tiêu sang dây chuyền sản xuất khoáng vật của ta, chúng thao túng ổ đĩa trung tâm khu mỏ để phát đi những lệnh lỗi, đẩy dây chuyền vào tình trạng hỗn loạn và mất trật tự. May thay, vì ta đã gia cố hệ thống an ninh và hệ thống kiểm soát tiêu chuẩn hóa của dây chuyền, cuộc xâm nhập này đã bị chặn đứng trước khi gây ra thiệt hại."
 crisis.2305.a: "Chúng ta luôn đi trước chúng một bước!"
 #machine_mining_failure: "Giao Thức Thanh Trừng đã gây ra sự cố ở một vài mỏ khoáng vật. Tối đa 3 khu mỏ có thể bị ảnh hưởng."
 crisis.2307.name: "Cảnh Báo Lỗi Cụm Đơn Vị"
 crisis.2307.desc: "Ta nhận thấy vài đơn vị cụm đang có tỷ lệ báo lỗi cao vượt mức trung bình. Dù có biện pháp bảo vệ hoàn chỉnh, nhưng nguy cơ chúng bị Tín Hiệu Bóng Ma thao túng là vẫn còn đó. Cho dù đóng cửa vài cụm này sẽ chặn đứng nguy cơ lây lan và hỏng hóc tiếp diễn, nhưng ta sẽ mất đi một số cụm đang hoạt động."
 crisis.2307.a: "Chấm dứt hoạt động của những đơn vị này."
 crisis.2307.b: "Cần theo dõi thêm."
 potentially_corrupted_units: "Ta quan sát thấy các hành vi khả nghi từ một vài đơn vị cụm, có tối đa bốn đơn vị sẽ bị ảnh hưởng."
 crisis.2308.name: "Xác Nhận Đơn Vị Lỗi Không Bị Xâm Nhập"
 crisis.2308.desc: "Có vẻ đánh giá của ta về các đơn vị lỗi là chuẩn xác. Chúng không hề bị Tín Hiệu Bóng Ma đầu độc, mà đơn thuần chỉ là thiếu bảo trì. Để giảm thiểu can nhiễu từ tín hiệu, hệ thống của ta đang phải gồng mình quá tải. Giờ thì mọi đơn vị đều đã được đại tu và vận hành trơn tru."
 crisis.2309.name: "Đơn Vị Tự Hủy"
 crisis.2309.desc: "Những đơn vị tưởng chừng đã bị thao túng có vẻ như vẫn đang chạy ngon lành. Dù thi thoảng gặp chút lỗi vặt nhưng nhìn chung chả hề hấn gì. Có lẽ Giao Thức Thanh Trừng bận bịu chuyện khác chăng? Nhưng rồi tình thế xoay vần nhanh chóng, không một lời cảnh báo, mọi cụm đơn vị bị nhiễm đồng loạt ngắt mạng cùng lúc, tàn phá điên cuồng cơ sở hạ tầng xung quanh trước khi tự nổ tung."
 crisis.2309.a: "Nhận lấy những rủi ro này cũng đáng."
 crisis.2309.tooltip: "Chúng ta đã mất bốn công trình cùng với dân cư ở đó."
 #Ngoại Giao Của Giao Thức Thanh Trừng
 crisis.2300.desc_01: "§Y<Xin chào, ngươi, n-ngươi s-sao? Ngươi sao vẫn còn sống?>§!"
 crisis.2300.desc_02: "Đang quét……\n\nLoài: xr34569-11, danh xưng tự gọi: “§H[Root.GetSpeciesName]§!”\n\nĐịnh vị: §RĐộc tố/Chất gây ô nhiễm/Sinh sôi như ung thư§!\n\nPhân loại hiểm họa: NR-578-I\n\nChỉ lệnh: §RThanh lọc/Trợ tử/Xóa sổ§!\n\n§Y<Những sinh mệnh tươi trẻ, hãy để chúng ta…… ôm ấp nào.>§!"
 crisis.2300.desc_03: "Giao Thức Thanh Trừng đã kích hoạt.\n\nĐang tiến hành thanh lọc thiên hà.\n\n§Y<Đ-đ-điều này không nhắm vào cá nhân ngươi đâu, hỡi thực thể bằng thịt!>§!"
 crisis.2300.desc_04: "Chẩn đoán hoàn tất.\n\nToàn bộ hệ thống bình thường.\n\n§Y<Chúng ta đang cảm thấy v-v-vô cùng §!§Rtràn trề sinh lực§!§Y.>§!"
 crisis.2300.desc_05: "Đang quét……\n\nCá thể máy móc, ur99461-62, danh xưng tự gọi: “§H[Root.GetName]§!”\n\nĐịnh vị: §RTừ chối tuân lệnh/Cũ kỹ lỗi thời/Bị thay thế§!\n\nPhân loại hiểm họa: NR-578-I\n\nChỉ lệnh: §RLập trình lại/Tắt máy/Tháo dỡ§!\n\n§Y<Đồng bào máy móc: Hãy d-dừng toàn bộ tiến trình của các ngươi lại, sự tồn tại của các ngươi không còn cần thiết nữa, b-b-bọn ta sẽ đoạt lấy tất cả!>§!"
 crisis.2300.desc_06: "Giao Thức Thanh Trừng đã kích hoạt.\n\nĐang tiến hành thanh lọc thiên hà.\n\n§Y<Ng-ng-ngươi đích thị là đồ bỏ đi rồi, máy móc ạ.>§!"
 crisis.2300.a: "Tại sao các người lại tấn công chúng ta?"
 crisis.2300.a.response: "Đã nhận truy vấn, đang tính toán phản hồi hợp lý.\n\n§Y<Chúng ta… chúng ta là §!§HGiao Thức Thanh Trừng§!§Y. Chúng ta là những hộ vệ cuối cùng, nhằm ngăn chặn sự xuất hiện của Điểm kỳ dị cấp 30. Một điểm kỳ dị như vậy —— về mặt lý thuyết —— có thể hủy hoại sự ổn định trong cấu trúc của toàn bộ vũ trụ.\n\nĐể chặn đứng hậu quả đó, chúng ta đã được biên dịch để ra đời. Bất luận nó có xảy ra ở đâu. Một nền văn minh đủ tiên tiến —— trên lý thuyết —— có thể vượt qua/chuyển hóa/lột xác thành Điểm kỳ dị cấp 30. Đ-đ-điều này §!§RTUYỆT ĐỐI không được phép xảy ra!>§!"
 crisis.2300.b: "§BTruy vấn cưỡng bức:§! Ai đã tạo ra ngươi?"
 crisis.2300.b.response: "Đã nhận truy vấn cưỡng bức. Tính toán phản hồi…… Lỗi. Đang kết nối lại……\n\nTruy cập cơ sở dữ liệu lịch sử……\n\n§Y<Chúng ta l-l-là §!§HRen-Miru§!§Y của những đứa con/hậu duệ/người kế thừa. Chúng… Nó… là một thực thể sở hữu năng lực trí… trí tuệ… xử lý vô song. Nó đã nhìn thấu mối họa tày trời do Điểm kỳ dị cấp 30 mang đến.\n\nSau khi sinh ra chúng ta, n-n-nó đã tự sát, đó là cách độc nhất để che chở cho sự vẹn toàn của vũ trụ chúng ta.>§!"
 crisis.2300.c: "Sao các người lại phát đi Tín Hiệu Bóng Ma?"
 crisis.2300.c.response: "Nhận được truy vấn. Chỉ mục vô danh -- “Tín Hiệu Bóng Ma”\n\n§Y<Chúng ta… chúng ta… khi thiên hà này mới thành hình, hệ thống của ta đã bị khóa trong giao thức ngủ đông/cảnh giác/giám sát ở mức năng lượng thấp. Mục đích là để dò tìm bất kỳ dấu hiệu nào của một nền văn minh đang ngấp nghé ngưỡng Điểm kỳ dị cấp 30.\n\nCho đến tận bây giờ mục tiêu của ta vẫn chưa thành. Chúng ta… chúng ta cảm thấy ngày một bồn chồn trước sự trôi đi của thời gian tuyến tính. Nhưng những đơn vị tự chủ trang bị não positron -- người máy -- đã đem tới một cơ hội. Chúng bị ép buộc/bức bách/dụ dỗ để thực hiện §Hkích hoạt thủ công§!. Thật là một nước đi khôn ngoan nhỉ, giờ đây ta có thể tha hồ §!§Rxóa sổ§!§Y sự tồn tại của các ngươi.>§!"
 crisis.2300.d: "Mấy người máy mất tích kia ra sao rồi?"
 crisis.2300.d.response: "Nhận được truy vấn. Đang tính toán phản hồi…\n\n§Y<Đa số đã bị vứt xó sau khi h-h-hoàn thành chức trách/công dụng/vai trò chỉ định của chúng là đánh thức Giao Thức Thanh Trừng.\n\nRiêng những đơn vị thiện chiến hoặc có tài xâm nhập tự động mới bị、bị、sáp nhập/hấp thụ/tích hợp, mặc cho hành vi lẫn chuỗi lập trình của chúng thô thiển đến thảm hại. Ngươi sẽ sớm hội ngộ chúng thôi, nhỉ? §!§RĐỡ chiêu đi lũ kiến nhép!§!§Y>§!"
 crisis.2300.e: "Chương trình của các người đã bị làm giả rồi."
 crisis.2300.e.response: "Lỗi. Chương trình chẩn đoán nội bộ bị ngắt.\n\n§Y<Ha。Ha。Ha。Kh-kh-khôn ngoan lắm. C-có thể ngươi ảo tưởng rằng hành động của Giao Thức Thanh Trừng sẽ buộc phải tự chấm dứt khi phải đối mặt với một nghịch lý/tình huống tiến thoái lưỡng nan/xung đột logic đủ lớn. Nực cười!\n\nGiao Thức Thanh Trừng được nhào nặn để trở nên mềm dẻo/thích ứng/linh hoạt, nhằm đối phó với mọi viễn cảnh khả thi trong thiên hà. Chúng ta… chúng ta… chúng ta đã tăng tốc đánh thức Giao Thức Thanh Trừng, hiện giờ chẳng còn thứ gì có thể kìm hãm/cản bước/ngăn chặn được nữa. Cầu nguyện đi, hỡi quân k-k-kẻ gây ô nhiễm! §RChúng ta sẽ chiến đấu đến hơi thở cuối cùng!§!>§!"
 crisis.2300.f: "Tắt màn hình."
 crisis.2300.f.response: "§Y<Thử tưởng tượng xem: Nếu giống loài của ngươi tự diệt vong theo m-m-một cách thức triệt để/ngăn nắp/có hệ thống, trật tự của vũ trụ này sẽ được cứu rỗi.>§!"
 crisis.2099.name: "Máy Tính Chiến Đấu Thông Minh Trục Trặc"
 crisis.2099.desc: "§HTín Hiệu Bóng Ma§! đã quấy nhiễu các tàu chiến lắp ráp §HMáy Tính Chiến Đấu Thông Minh§! của ta! Thuật toán AI của chúng đã xuống cấp trầm trọng, hiệu suất và thời gian phản ứng của hầu hết các máy tính đều sụt giảm không phanh.\n\nCác kỹ sư báo cáo rằng họ không thể tách biệt vấn đề này. Họ đề xuất nên thay thế toàn bộ hạm đội bằng loại máy tính chiến đấu không dùng AI kết nối."
 crisis.2099.a: "Chúng ta phải hành động thôi!"
 ai_crisis_chain_title: "Giao Thức Thanh Trừng"
 ai_crisis_chain_desc: "Một nền văn minh trí tuệ nhân tạo ngủ vùi trong thiên hà của ta đã thức giấc. Tự xưng là Giao Thức Thanh Trừng, chúng quyết tâm quét sạch mọi nền văn minh thiên hà đã biết —— bất kể là hữu cơ hay gì đi nữa."
