 synth_planet_paranoia: "Chứng Hoang Tưởng Người Máy"
 synth_planet_paranoia_desc: "Hành tinh này đang chìm trong hội chứng hoang tưởng tột độ về thuyết âm mưu người máy xâm nhập. Vài kẻ thậm chí tin rằng cả bộ máy chính quyền đã bị người máy thay thế."
