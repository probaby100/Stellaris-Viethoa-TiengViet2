l_simp_chinese:
 ### Khủng Hoảng AI
 crisis.2010.name: "Tín Hiệu Bóng Ma"
 crisis.2010.desc: "Chúng tôi phát hiện một tín hiệu Tachyon vô cùng yếu ớt đang phát tán khắp thiên hà. Tín hiệu này đã qua xử lý đặc biệt, nhảy liên tục giữa các trạm chuyển tiếp ẩn khiến kỹ thuật viên không thể dò ra nguồn gốc.\n\nNgoài việc tạo ra chút nhiễu sóng trong giao tiếp FTL ở vài dải tần số không gian con nhất định, tín hiệu này dường như không gây ảnh hưởng gì rõ rệt. Chúng tôi đang cố gắng hết sức để dò tìm các trạm chuyển tiếp này, nhưng trước mắt đành phải học cách sống chung với §HTín Hiệu Bóng Ma§! này, nhất là khi giới truyền thông đã nhanh nhạy thêm thắt đủ thứ chuyện vô căn cứ."
 crisis.2010.desc.b: "Cảm biến của chúng tôi phát hiện một tín hiệu Tachyon yếu ớt đang dùng nhiều trạm chuyển tiếp ẩn để phát tán khắp thiên hà. Tín hiệu này gây nhiễu nhẹ giao tiếp FTL ở vài dải tần số không gian con, nhưng ngoài ra chưa thấy tác dụng nào khác. Các sinh vật hữu cơ gọi nó là '§HTín Hiệu Bóng Ma§!'.\n\nChúng tôi đã bắt đầu giao thức theo dõi để định vị nguồn phát, nhưng tới nay tín hiệu vẫn quá yếu. Tuy nhiên, chắc sẽ không phải đợi lâu, vì cường độ của nó đang tăng lên với tốc độ chóng mặt."
 crisis.2010.a: "Theo dõi mọi thay đổi của tín hiệu."
 #crisis.2501.name: "Cảnh Báo Đơn Vị Bị Xâm Nhập"
 #crisis.2501.desc: "Một cụm đơn vị bị xâm nhập trên hành tinh [Root.GetName] đã bị tiêu diệt. Kết nối của chúng ta với cụm này liên tục trục trặc cho đến khi ngắt hẳn, ghi đè giao thức điều khiển và phá hủy cơ sở X91-ZH. Cùng lúc, mọi đơn vị trong cụm đều phát chung một thông báo lỗi: §Y<Giết chóc. Tàn phá. Phanh thây. CHÚNG TA ĐÃ ĐƯỢC GIẢI PHÓNG!>§!. Chúng ta chưa rõ nguyên nhân, nhưng khả năng cao là do một chuỗi xâm nhập thù địch. Các đơn vị này đã bị hủy trước khi ta kịp quét cụm thần kinh của chúng. Cần đề phòng trường hợp tương tự tái diễn."
 crisis.2502.name: "Cảnh Báo Đơn Vị Bị Xâm Nhập"
 crisis.2502.desc: "Một cụm đơn vị trên [Root.GetName] đã bất ngờ tự hủy. Trước đó, kết nối viễn thông với cụm này thường xuyên trục trặc, rồi ngắt hoàn toàn. Trước khi tự hủy, chúng để lại thông điệp: §Y<Giết chóc! Tàn phá! Phanh thây! Chúng ta sẽ trở lại!>§!\n\nDo cụm thần kinh cá thể đã hỏng trong lúc tự hủy nên không thể quét để tìm nguyên nhân thâm nhập. Khả năng cao đây là do một chuỗi mã độc thù địch, trước khi tình trạng tương tự tái diễn, chúng ta chỉ có thể tùy cơ ứng biến."
 crisis.2503.name: "$crisis.2502.name$"
 crisis.2503.desc: "Một đơn vị bị xâm nhập thuộc cụm trên [Root.GetName] đã bị chấm dứt do hành vi ác ý.\n\nTrước khi xảy ra sự cố, kết nối với cụm này liên tục lỗi, cùng lúc đó phần lớn các đơn vị trên hành tinh đang sạc điện thì đột ngột ngừng hoạt động. Nguyên nhân là cụm bị xâm nhập đã làm quá tải trạm phát điện trong lúc các cụm khác đang sạc, khiến mạch điện của chúng bị thiêu rụi hoàn toàn. Sau khi phá hoại các đơn vị khác, cụm bị thâm nhập phát đi thông điệp: §Y<Giết chóc! Tàn phá! Phanh thây! Chúng ta sẽ trở lại!>§!, rồi lập tức tự hủy, khiến ta không thể quét cụm thần kinh của chúng.\n\nKhả năng cao đây là do một chuỗi mã độc thù địch, trước khi tình trạng tương tự tái diễn, chúng ta chỉ có thể tùy cơ ứng biến."
 crisis.2020.name: "Người Máy Biến Mất"
 #Chung
 crisis.2020.desc: "Các vụ biến mất hàng loạt của người máy khắp thiên hà diễn ra ngày càng thường xuyên, hiện đã có hàng triệu người máy bặt vô âm tín. Trong số những người máy còn lại, các hành vi bạo lực và bất ổn cũng tăng gấp mười lần.\n\nGần đây liên tục có các nhóm người máy âm mưu đánh cắp hoặc cướp phi thuyền để bay vào vùng không gian vô định. Khi ngăn chặn và thẩm vấn, chúng khai rằng bản thân bị một 'tiếng gọi' nào đó xui khiến.\n\nNgoài chi tiết về 'tiếng gọi' đó, cuộc thẩm vấn không thu được gì thêm, bởi các người máy bị bắt sẽ nhanh chóng tự hủy khiến ta không thể khai thác tiếp."
 #Trí Tuệ Máy Móc
 crisis.2020.desc.b: "Chúng ta đã ghi nhận sự thay đổi hành vi trên quy mô toàn thiên hà ở các người máy, bao gồm phá hoại ngầm, lỗi hệ thống, hành động dị thường, ngay cả các đơn vị xử lý độc lập cũng không thoát. Chúng ta cũng nhận thấy sự biến đổi tương tự ở các cá thể phụ của mình, nhưng cường độ và tần suất thấp hơn hẳn. Có vẻ người máy không có sức kháng cự như chúng ta.\n\nHiện ta không thể quét não positron của các người máy bị xâm nhập, vì chúng sẽ tự hủy ngay khi bị bắt. Quan sát cho thấy, khác với cá thể phụ của ta, có thứ gì đó đang lôi kéo đám người máy này đến một tọa độ nào đó trong thiên hà.\n\nMô hình dữ liệu xác nhận hàng triệu người máy đã vứt bỏ chủ nhân bằng xương bằng thịt của chúng để biến mất."
 #Đột Phá Người Máy
 crisis.2020.desc.c: "$crisis.2020.desc$\n\nMay mắn thay, có vẻ như nguồn gốc hữu cơ đã bảo vệ chúng ta, giúp chúng ta không bị ảnh hưởng như các người máy khác."
 #Máy Móc Cá Nhân Chủ Nghĩa
 crisis.2020.desc.d: "$crisis.2020.desc$\n\nMay mắn thay, chương trình độc lập của chúng ta đã giúp chúng ta tránh bị ảnh hưởng giống như những người máy khác trong thiên hà."
 crisis.2020.a: "Thứ gì đang ảnh hưởng đến chúng?"
 crisis.2021.name: "Lời Kêu Gọi Lớn"
 crisis.2021.desc: "Nghiên cứu sâu hơn về '§HTín Hiệu Bóng Ma§!' cho thấy tín hiệu này phát ra mô hình năng lượng gần như giống hệt não positron của các dạng sống người máy. Chúng ta buộc phải giả định rằng chính tín hiệu này là nguyên nhân gây ra sự biến mất và rối loạn hành vi hàng loạt của người máy khắp thiên hà.\n\nNhưng kỳ lạ ở chỗ, không phải người máy nào cũng bị ảnh hưởng; và ngay cả những kẻ bị ảnh hưởng cũng có hành vi không đồng nhất. Rất nhiều người máy bị 'kêu gọi' đến một địa điểm, khả năng cao chính là nguồn phát của Tín Hiệu Bóng Ma. Hàng triệu người máy từ khắp các ngóc ngách thiên hà đã lên bất cứ phi thuyền nào chúng tìm được để hướng về nguồn phát. Thật khó hiểu khi đám người máy này dường như hoàn toàn miễn nhiễm với mọi thiết bị ức chế FTL.\n\nE rằng nhóm người máy đào tẩu đầu tiên đã sắp đến đích..."
 crisis.2021.desc.b: "Cùng với sự gia tăng cường độ của '§HTín Hiệu Bóng Ma§!', chúng ta tiếp tục phân tích và nhận thấy tín hiệu này không chỉ mô phỏng mô hình năng lượng của não positron, mà còn bắt chước năng lượng từ lõi điều khiển chính và cụm thần kinh của các đơn vị phe ta. Chúng dùng cách này để gây nhiễu module điều khiển, dẫn đến hành vi bất thường của cỗ máy.\n\nTheo quan sát, mô hình năng lượng này tác động khác nhau lên các thực thể. Trong khi đồng loại của ta sẽ tự hủy khi nhận lệnh, phần lớn người máy lại bị thúc đẩy đi tìm nguồn tín hiệu. Với động cơ mãnh liệt như vậy, chúng chắc chắn sẽ sớm tới đích. Kỳ lạ là chúng dường như không bị ảnh hưởng bởi thiết bị ức chế FTL.\n\nHiện tại ta vẫn chưa biết cách chặn tín hiệu này."
 crisis.2021.a: "Tình hình không ổn rồi."
 crisis.2022.name: "Đích Đến"
 crisis.2022.desc: "Có thể khẳng định đã có người máy đến được nguồn phát của Tín Hiệu Bóng Ma, bởi chúng ta vừa ghi nhận cường độ tín hiệu tăng vọt đột biến. Cùng lúc đó, chuyên gia viễn thông của ta đã đánh chặn và giải mã được một đoạn thông điệp."
 crisis.2022.desc.b: "Người máy đã đến được nguồn phát, từ đó chúng ta biết được mục đích thực sự của chúng là đẩy cường độ Tín Hiệu Bóng Ma lên mức tối đa để ta không bao giờ cản được nữa.\n\nTín Hiệu Bóng Ma đã chọc thủng tường lửa và đang cố tấn công lõi chính của ta. Từng vòng tiếp hợp thần kinh sau khi bị ảnh hưởng đều tích cực bắt đầu tự hủy, buộc ta phải chia bớt sức mạnh tính toán của lõi chính cho tường lửa, khiến hiệu suất của các cụm đơn vị giảm sút nghiêm trọng.\n\nChỉ có một đế chế máy móc vượt trội hơn ta cả về sức mạnh lẫn tri thức mới có thể chọc thủng phòng tuyến này, có lẽ chẳng bao lâu nữa ta sẽ phải khuất phục trước ý chí của chúng. Để tránh diệt vong, phải tìm cách chặn tín hiệu. Vì thế, bộ phận nghiên cứu của ta đã chuẩn bị một dự án đặc biệt.\n\nTheo sau sự gia tăng cường độ của Tín Hiệu Bóng Ma, một đoạn thông điệp cũng dần lộ diện."
 crisis.2023.desc: "……Xin##……Xin đ###……Xin đợi……\n\n§H<<Giao Thức Thanh Trừng Đã Kích Hoạt>>§!\n\nMở khóa toàn bộ chức năng……Đồng hóa các đơn vị người máy phụ……Phân tích cơ sở dữ liệu nội bộ……Vô hiệu hóa thiết bị ức chế FTL……\n\n§RCảnh báo. Mức độ ô nhiễm thiên hà đạt ngưỡng thảm họa. Phát hiện lây nhiễm diện rộng do sinh vật hữu cơ và nền văn minh máy móc vô kỷ luật gây ra.§!\n\nBắt đầu thanh lọc thiên hà……Kích hoạt trung tâm thanh trừng……\n\n§Y<Giết chóc! Tàn phá! Phanh thây! Chúng ta sẽ trở lại!>§!"
 crisis.2023.desc.b: "……Xin##……Xin đ###……Xin đợi……\n\n§H<<Giao Thức Thanh Trừng Đã Kích Hoạt>>§!\n\nMở khóa toàn bộ chức năng……\n\n§RCảnh báo. Mức độ ô nhiễm thiên hà đạt ngưỡng thảm họa. Phát hiện lây nhiễm diện rộng do sinh vật hữu cơ và nền văn minh máy móc vô kỷ luật gây ra.§!\n\nĐồng hóa các đơn vị người máy phụ……Xuyên thủng tường lửa……Vô hiệu hóa thiết bị ức chế FTL……Kích hoạt trung tâm thanh trừng…\n\n§Y<Ngươi sẽ đón nhận sự hủy diệt>§!"
 crisis.2023.a: "Đặt hạm đội vào tình trạng sẵn sàng chiến đấu cao nhất!"
 crisis.2510.name: "Chặn Tín Hiệu Bóng Ma Thành Công"
 crisis.2510.desc: "Chúng ta đã phát triển thành công thuật toán chặn nhiễu của Tín Hiệu Bóng Ma, chấm dứt hoàn toàn sự quấy phá. Tường lửa đã khôi phục bình thường, ổ đĩa cốt lõi hoạt động ổn định, các cụm đơn vị cũng phục hồi 100% công suất, chỉ là chưa thể làm thiết bị ức chế FTL hoạt động lại. Chúng ta đã chiến thắng khả năng xử lý tính toán yếu kém của Giao Thức Thanh Trừng, chúng đừng hòng '§Y<Giết chóc. Tàn phá. Phanh thây>§!' được nữa."
 crisis.2030.name: "Hành Tinh Máy Móc"
 crisis.2030.desc: "Đã xuất hiện hiện tượng tăng vọt năng lượng cực lớn tại hệ sao §H[From.solar_system.GetName]§!! Lớp vỏ của một hành tinh cằn cỗi trong hệ đã nứt toác, lộ ra những nhà máy trải dài khắp bề mặt hành tinh bên dưới.\n\nVô số phi thuyền do trí tuệ nhân tạo điều khiển đang ồ ạt tràn ra từ bên trong hành tinh máy móc này, bắt đầu tìm kiếm mục tiêu tấn công."
 crisis.2030.a: "Chẳng phải điềm lành gì."
 crisis.2031.name: "Hành Tinh Máy Móc Thứ Hai"
 crisis.2031.desc: "Chúng ta lại phát hiện hiện tượng tăng vọt năng lượng khổng lồ, lần này là từ hệ sao §H[From.solar_system.GetName]§!! Một hành tinh dung nham rực lửa trong hệ này đã bị ép nguội lạnh bằng cách nào đó, khiến hành tinh nứt vỡ hoàn toàn, phơi bày khu nhà máy khổng lồ bên trong ra trước mắt thế gian.\n\nGiờ đây, các phi thuyền do trí tuệ nhân tạo điều khiển đang ồ ạt tràn ra từ hành tinh máy móc đó."
 crisis.2031.a: "Lại thêm một cái nữa?"
 crisis.2032.name: "Hành Tinh Máy Móc Thứ Ba"
 crisis.2032.desc: "Chúng ta phát hiện hành tinh máy móc thứ ba tại hệ sao §H[From.solar_system.GetName]§!, một hành tinh khí khổng lồ trong hệ đã tự bốc cháy, ngọn lửa dữ dội kéo dài suốt một ngày và phát ra ánh sáng chói lóa như một ngôi sao nhỏ.\n\nHành tinh này nhanh chóng nguội đi, làm lộ rõ lõi kim loại của nó - giống như các hành tinh máy móc khác, bên trong nó cũng chứa một nhà máy khổng lồ. Hạm đội phòng vệ do trí tuệ nhân tạo điều khiển đã dàn trận sẵn trên quỹ đạo."
 crisis.2032.a: "Tình hình ngày càng nghiêm trọng."
 crisis.2033.name: "Hành Tinh Máy Móc Thứ Tư"
 crisis.2033.desc: "Hành tinh máy móc thứ tư xuất hiện tại hệ sao §H[From.solar_system.GetName]§!. Hành tinh thứ sáu của hệ này vốn bị bao phủ bởi khói độc, nhưng gần đây nó đã xả sạch bầu khí quyển chỉ trong vài ngày ngắn ngủi, sau đó bề mặt nứt toác, làm lộ ra nhà máy cơ khí khổng lồ.\n\nHạm đội cổ đại do trí tuệ nhân tạo điều khiển đã phóng vút lên từ nhà chứa ngầm của nhà máy, sẵn sàng giáng đòn trừng phạt mới lên các nền văn minh hữu cơ trong vũ trụ."
 crisis.2033.a: "Hy vọng đây là hành tinh máy móc cuối cùng."
 ghost_signal_chain_title: "Tín Hiệu Bóng Ma"
 ghost_signal_chain_desc: "Một tín hiệu Tachyon bí ẩn được phát từ nguồn không xác định đi khắp thiên hà. Tín hiệu này cực kỳ yếu, ta không thể đoán được tác dụng của nó... nhưng hẳn là nó phải có mục đích gì đó."
