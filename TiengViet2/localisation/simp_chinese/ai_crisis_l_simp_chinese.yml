 ai_crisis_poi_1: "Hành Tinh Máy Móc"
 ai_crisis_poi_1_desc: "Nhà máy cấp hành tinh trên thế giới máy móc này đang không ngừng rèn ra các Sứ giả săn lùng cho Giao Thức Thanh Trừng. Những hành tinh này hẳn là nguồn viện binh duy nhất của chúng."
