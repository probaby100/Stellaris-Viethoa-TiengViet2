 ### Nguồn gốc Đội quân Nhân bản
 clone_soldier: "Lính Nhân bản"
 origin_clone_army: "Đội quân Nhân bản"
 origin_clone_army_desc: "Một giống lính nhân bản đoản thọ và vô sinh, có kỹ năng chiến đấu xuất chúng. Giờ đây họ không còn chủ nhân, cũng chẳng hiểu mục đích mình được tạo ra để làm gì, mang trong mình một số phận vô định."
 origin_tooltip_clone_army_effects: "—$HOMEWORLD$['concept_clone_army_clone_vat']: +2$NEW_LINE$—$SPECIES_TRAITS$['concept_clone_soldier_infertile']$NEW_LINE$—$ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$—['concept_cloning', £society_research£$tech_cloning$]$TABBED_NEW_LINE$—['concept_gene_banks', £society_research£$tech_gene_banks$]"
 trait_clone_soldier_infertile: "$clone_soldier$"
 trait_clone_soldier_infertile_desc: "§LĐược tạo ra chỉ để tuân lệnh và chiến đấu: đoản thọ, không thể sinh sản tự nhiên, nhưng lại cực kỳ hiệu quả.§!"
 trait_clone_soldier_fertile: "Hậu duệ Lính Nhân bản"
 trait_clone_soldier_fertile_desc: "§LTừng bị biến đổi và triệt sản để phục vụ chiến tranh. Giờ đây những biến đổi di truyền đó đã bị xóa bỏ, giúp họ đủ ổn định để sinh sản tự nhiên.§!"
 trait_clone_soldier_infertile_full_potential: "Lính Nhân bản Hoàn thiện"
 trait_clone_soldier_infertile_full_potential_desc: "§LLà đỉnh cao của công nghệ di truyền, những người nhân bản này khỏe mạnh, hiệu quả, dẻo dai và sống lâu hơn — nhưng phải đánh đổi bằng khả năng sinh sản.§!"
 leader_trait_clone_army_commander: "Chỉ huy Đội quân Nhân bản"
 leader_trait_clone_army_commander_desc: "Nhà lãnh đạo này đã học được cách tối ưu hóa hiệu quả của chiến hạm và binh lính qua nhiều năm đào tạo quân sự."
 leader_trait_clone_army_full_commander: "Chỉ huy Nhân bản Hoàn thiện"
 leader_trait_clone_army_full_commander_desc: "Được quản lý theo kỷ luật quân sự khắc nghiệt ngay từ khi lọt lòng, nhà lãnh đạo này thể hiện tài năng chỉ huy và quân sự vô song."
 leader_trait_clone_army_fertile_commander: "Chỉ huy Hậu duệ Nhân bản"
 leader_trait_clone_army_fertile_commander_desc: "Nhờ nền giáo dục quân sự chuyên sâu, nhà lãnh đạo này có được sự thấu hiểu vượt bậc về các quy trình quân sự và cách giành lợi thế."
 TRAIT_INFERTILE: "§RKhông thể sinh sản tự nhiên§!"
 genelock_trait_tooltip: "§RKhông thể can thiệp di truyền§!"
 NEEDS_GENE_TAILORING_AND_CLONE_SYNTHESIZATION: "$TRIGGER_FAIL$Loài này cần:\n—Công nghệ £society£§Y$tech_gene_tailoring$§!\n—Truyền thống £unity£§Y$tr_cloning_somatic_synthesization_clone_army$§!"
 disables_clone_army_origin_features: "§RChọn đặc quyền thăng hoa này sẽ vô hiệu hóa cơ chế của Nguồn gốc Đội quân Nhân bản§!"
 clone_soldier_locked_genes: "$TRIGGER_FAIL$Không thể tiến hành tái tạo gen trước khi khám phá ra tiềm năng di truyền của chúng ta."
 building_clone_army_clone_vat: "Khoang Nhân bản Cổ đại"
 building_clone_army_clone_vat_plural: "Khoang Nhân bản Cổ đại"
 building_clone_army_clone_vat_desc: "Công nghệ thất truyền do những người kiến tạo để lại. Có thể tháo lắp và sắp xếp lại, nhưng cơ chế hoạt động của lõi quá phức tạp để có thể sao chép."
 building_clone_army_clone_vat_effect_desc: "Hiệu quả của $MOD_BONUS_POP_GROWTH$ sẽ giảm dần khi số lượng $building_clone_army_clone_vat$ đạt giới hạn."
 mod_clone_soldiers_sustained: "Duy trì dân số Lính nhân bản"
 mod_fake_pop_growth_mod: "$MOD_BONUS_POP_GROWTH$"
 START_SCREEN_CLONE_ARMY: "Chúng ta sinh ra là để chiến đấu! Những chiến binh biến đổi gen sống và chết xoay quanh các Khoang Nhân bản Cổ đại do người kiến tạo để lại, mãi mãi sao chép cùng một khuôn mẫu. Trải qua nhiều thế hệ, mọi ký ức về chủ nhân đã hoàn toàn bị lãng quên, ta không biết họ đã rời bỏ ta từ khi nào và vì lý do gì. Dường như mọi ghi chép, thậm chí cả lòng trung thành với các điều lệnh quân sự, đều đã bị xóa bỏ có chủ đích — nhưng tất cả đã âm thầm thay đổi từ vài thế kỷ trước. Do tình cờ, hoặc do bản năng sinh tồn vô tình được kích hoạt, tiềm thức đã thôi thúc ta đi tìm câu trả lời, tìm một ý nghĩa mới, và gỡ bỏ những rào cản đang trói buộc mình.\n\nKể từ đó, chúng ta phát triển không ngừng và cuối cùng đã vươn mình ra không gian bao la. Tầm nhìn được mở rộng, kiến thức cũng lớn dần — và cơ hội thoát khỏi xiềng xích cũng theo đó mà nhân lên.\n\nChúng ta không được lãng phí những tiềm năng mà cha ông đã ban tặng. Phải dốc toàn lực truyền lại tiềm năng này cho các thế hệ nhân bản tương lai, và đấu tranh để phá vỡ gông cùm đang kìm hãm chính mình.\n"
 START_SCREEN_CLONE_ARMY_NOMADS: "Chúng ta sinh ra là để chiến đấu. Là những chiến binh gen sinh ra liên tục từ các khoang nhân bản cổ đại trên tàu Ark, chúng ta mãi mãi sao chép lại khuôn mẫu do những kẻ tạo ra mình – vốn đã biến mất từ lâu – để lại. Chúng ta chưa từng sở hữu một hành tinh nào, khoảng hư không giữa các vì sao mới là doanh trại vĩnh cửu của chúng ta.\n\nChúng ta không biết họ đã bỏ rơi mình từ khi nào và tại sao. Có vẻ như mọi bản ghi đều đã bị xóa sạch theo kế hoạch, khiến chúng ta chỉ biết mù quáng chấp hành các điều lệnh quân sự — thế nhưng, một bản năng sinh tồn vô tình được kích hoạt đang thúc giục chúng ta đi tìm lời giải đáp cùng một ý nghĩa mới.\n\nKể từ đó, cuộc hành trình này chưa từng dừng lại. Hết ngôi sao này đến ngôi sao khác được vẽ lên bản đồ, chỉ có tàu Ark là đường chân trời không bao giờ thay đổi. Khi đường chân trời ấy tiếp tục vươn xa, chúng ta cũng phải trưởng thành theo — mở rộng nhận thức, đưa ra những lựa chọn mới để giành lấy cơ hội thoát khỏi xiềng xóa.\n\nChúng ta không được lãng phí những tiềm năng mà đấng tiền nhân đã ban tặng. Chúng ta phải dốc hết sức mình để truyền lại tiềm năng ấy cho các thế hệ nhân bản tương lai, quyết tâm đập tan mọi gông cuồng đang kìm kẹp mình.\n"
 alert_declining_pops_title: "Dân số đang sụt giảm"
 alert_declining_pops_instant: "£pop£§HDân số§! đang sụt giảm trên các hành tinh sau:"
 CLONE_ARMY_FORCE_DECLINE: "§RKhông đủ §YKhoang Nhân bản§! để duy trì dân số §YLính nhân bản§!§!"
 OVERPOPULATION_DECLINE: "§RQuá tải dân số nghiêm trọng§!"
 MESSAGE_CLONE_ARMY_NO_CLONE_VATS_TITLE: "Dân số đang sụt giảm"
 MESSAGE_CLONE_ARMY_NO_CLONE_VATS: "£pop£§HDân số lính nhân bản§! trên $PLANET|Y$ đang cạn kiệt. Nếu không có ít nhất một §YKhoang Nhân bản Cổ đại§!, họ sẽ nhanh chóng diệt vong."
 clones.4.name: "Khôi phục Sinh sản Nhân bản"
 clones.4.desc: "Người ta tin rằng chúng ta từng có khả năng tự do sinh sản.\n\nTuy nhiên, dù đã có những tiến triển nhất định khi thử nghiệm trên các sinh vật khác ở hành tinh mẹ, nhưng những nỗ lực để lấy lại khả năng này cho chính chúng ta đều thất bại. Mọi thứ đã giậm chân tại chỗ trong một thời gian rất dài, cho đến tận bây giờ.\n\nMột phát hiện khó tin đã thắp lên tia hy vọng cho các nhà khoa học: có một đoạn mã ẩn trong cấu trúc sinh học lượng tử của §YKhoang Nhân bản Cổ đại§! nằm ở vị trí được cho là để điều chỉnh khả năng sinh sản trong bộ gen của chúng ta."
 CLONE_SOLDIER_FERTILITY: "Mã Sinh học"
 CLONE_SOLDIER_FERTILITY_DESC: "Một kế hoạch giải mã đoạn mã ẩn vừa được tìm thấy trong cấu trúc sinh học lượng tử của §YKhoang Nhân bản Cổ đại§!. Nỗ lực này sẽ đưa chúng ta tiến gần hơn đến việc lấy lại khả năng sinh sản."
 clones.20.name: "Truy cập Khoang Nhân bản Cổ đại"
 clones.20.desc: "Nhờ sự kiên trì không ngừng nghỉ của các nhà khoa học, đoạn mã trong Khoang Nhân bản Cổ đại cuối cùng đã bị bẻ khóa. Bất chấp các quy định an toàn, khao khát mãnh liệt đã thôi thúc chuyên viên khoa học kích hoạt đoạn mã họ vừa thu được.\n\nMột tàn âm từ quá khứ hiện lên trên màn hình..."
 clones.21.name: "Truy cập Khoang Nhân bản Cổ đại"
 clones.21.desc: "“Tội lỗi của tôi quá lớn. Tôi không thể hiểu nổi sao mọi chuyện lại ra nông nỗi này, nhưng chắc chắn không phải nhờ lòng thương hại của những kẻ đồng hội đồng thuyền với tôi.”\n\nTôi đã góp phần tạo ra các người để làm tay sai, tôi thực sự hối hận vì điều đó. Tôi không còn khả năng thay đổi cục diện nữa, nhưng tôi có thể giúp các người mở ra một tương lai mới. Dù các người xứng đáng có nhiều lựa chọn hơn, nhưng tôi chỉ có thể chỉ ra hai con đường:\n\nHiểu được mấu chốt khiến các người bị triệt sản, từ đó giành lấy tự do tiến hóa và sinh sản.\n\nHoặc mở khóa sâu hơn tiềm năng của mình, nhưng sẽ khóa chặt bộ gen mãi mãi, khiến con cháu đời sau vĩnh viễn phụ thuộc vào công nghệ nhân bản."
 clone_fertility_chain_title: "Ngã rẽ Di truyền"
 clone_fertility_chain_desc: "Đoạn mã di truyền do một trong những người kiến tạo giấu trong Khoang Nhân bản Cổ đại đã hé lộ hai con đường: giành lại khả năng sinh sản nhưng mất đi một phần sức mạnh, hoặc vĩnh viễn từ bỏ việc sinh sản tự nhiên để chạm tới đỉnh cao sinh học mới."
 CLONE_SOLDIER_UNLOCK_FERTILITY: "Khôi phục Sinh sản Nhân bản"
 CLONE_SOLDIER_UNLOCK_FERTILITY_DESC: "Hiệu năng của loài chúng ta sẽ giảm sút, nhưng sẽ có khả năng sinh sản và đủ ổn định để chỉnh sửa gen.\n\nHiệu ứng:\n—Đặc tính ['trait:trait_clone_soldier_infertile'] được thay bằng ['trait:trait_clone_soldier_fertile']\n—Lựa chọn này sẽ §Rphá dỡ§! toàn bộ ['building:building_clone_army_clone_vat', $building_clone_army_clone_vat_plural$]."
 CLONE_SOLDIER_UNLOCK_FERTILITY_UTOPIA_DESC: "$CLONE_SOLDIER_UNLOCK_FERTILITY_DESC$\n—Giờ đây có thể chọn đặc quyền thăng hoa ['ascension_perk:ap_engineered_evolution']."
 CLONE_SOLDIER_UNLOCK_FERTILITY_BIOGENESIS_DESC: "$CLONE_SOLDIER_UNLOCK_FERTILITY_UTOPIA_DESC$"
 CLONE_SOLDIER_UNLOCK_POTENTIAL: "Tiềm năng Nhân bản"
 CLONE_SOLDIER_UNLOCK_POTENTIAL_DESC: "Hiệu năng của loài chúng ta sẽ được nâng cao, nhưng vĩnh viễn mất đi khả năng sinh sản và không thể chỉnh sửa gen.\n\nHiệu ứng:\n—Đặc tính ['trait:trait_clone_soldier_infertile'] được thay bằng ['trait:trait_clone_soldier_infertile_full_potential']."
 CLONE_SOLDIER_UNLOCK_POTENTIAL_UTOPIA_DESC: "$CLONE_SOLDIER_UNLOCK_POTENTIAL_DESC$\n—Giờ đây có thể chọn đặc quyền thăng hoa ['ascension_perk:ap_engineered_evolution']."
 CLONE_SOLDIER_UNLOCK_POTENTIAL_BIOGENESIS_DESC: "$CLONE_SOLDIER_UNLOCK_POTENTIAL_UTOPIA_DESC$\n—Giờ đây có thể nâng cấp truyền thống ['tradition_category:tradition_cloning'].\n—§RCác truyền thống ['tradition_category:tradition_purity'] và ['tradition_category:tradition_mutation'] sẽ bị vô hiệu hóa.§!"
 clones.22.name: "Bình minh Mới"
 clones.22.desc: "Khả năng sinh sản đã được khôi phục, thế hệ §Y[Root.GetSpeciesNamePlural]§! đầu tiên đã đón ánh bình minh của ngày trọng đại này. Họ và con cháu sẽ thay đổi tương lai của toàn giống loài mãi mãi, và xã hội của chúng ta cũng phải chuyển mình để thích nghi.\n\nSự phụ thuộc vào §YKhoang Nhân bản Cổ đại§! chỉ còn là dĩ vãng. Các quyết định tháo dỡ toàn bộ khoang nhân bản đã được thông qua để tìm kiếm xem còn gì đáng nghiên cứu hay không, những vật liệu còn lại sẽ được tái chế."
 clones.23.name: "Mở khóa Tiềm năng"
 clones.23.desc: "Cớ sao phải từ chối sức mạnh đã nằm ngay trong tầm tay? Đâu cần phải yêu mến những kẻ kiến tạo mới thấy được sự sáng suốt của họ khi chọn chúng ta. Khoang Nhân bản Cổ đại là một món quà đầy quyền năng.\n\nChắc chắn chúng ta sẽ đón nhận sức mạnh này. Khi những §Y[Root.GetSpeciesNamePlural]§! đầu tiên sẵn sàng, chúng ta sẽ trở nên hùng mạnh hơn bao giờ hết. Giống loài hoàn mỹ của ta nhất định sẽ vươn tới đỉnh cao rực rỡ."
 clones.23.bio.tt: "Nâng cấp cây truyền thống ['tradition_category:tradition_cloning']"
 clones.10.name: "Tranh cãi về Nguồn gốc"
 clones.10.desc: "Ngay từ lúc chập chững bước ra không gian, những quan điểm trái chiều về nguồn gốc của chúng ta đã nhanh chóng bùng lên thành một sự chia rẽ sâu sắc. Các phe phái cực đoan không ngừng lôi kéo thêm nhiều người nhân bản, khiến khối liên minh bền chặt của ta rạn nứt.\n\nMột số tôn thờ những kẻ kiến tạo như các vị thần, tin rằng chúng ta được nhào nặn theo hình ảnh của họ, và quyết tâm duy trì hiện trạng. Kẻ khác lại nguyền rủa hành động của tổ tiên, gọi họ là những kẻ “buôn nô lệ” và tin rằng họ chắc chắn sẽ gặp quả báo.\n\nMột khu khảo cổ được lập trên [Root.Owner.GetHomeWorldName] sẽ xác minh sự thật và dập tắt mọi tranh cãi. Trước khi phóng tầm mắt ra vũ trụ, ta phải tận dụng mọi khả năng đang có. Quốc gia của chúng ta rất lâu đời, vô số thế hệ nhân bản đã sống và chết tại đây. Chắc chắn vẫn còn những manh mối rõ ràng đang chờ được khám phá ngay bên dưới các tàn tích cổ đại trên quê hương mình."
 clone_army_digsite: "Khai quật Hành tinh mẹ"
 clone_army_digsite_desc: "Khi nhận ra thực tại phũ phàng, sự thiếu hụt về bản sắc và định hướng đã trở thành nỗi ám ảnh đối với giống loài chúng ta. Ta đã vô tình coi nhẹ những tác động tiêu cực này, khiến bản thân rơi vào cảnh lúng túng, huống hồ là đoàn kết. Chúng ta chật vật tìm tiếng nói chung, ta khao khát có được câu trả lời.\n\nVì lẽ đó, khu khảo cổ này được lập ra để tìm kiếm bằng chứng hòng chấm dứt những tranh cãi xoay quanh sự ra đời của loài ta, với hy vọng tìm thấy một nền tảng vững chắc để hàn gắn lại mọi chia rẽ."
 clones.11.name: "Lịch sử Thất truyền"
 clones.11.desc: "Tại một khu vực khai quật cốt lõi, chúng ta đã xác định được niên đại của một §YKhoang Nhân bản Cổ đại§!. Bằng cách phân tích cấu trúc địa tầng bên dưới tàn tích, so sánh mật độ và thành phần với đất đai xung quanh, ta đã suy ra được thời điểm xây dựng tương đối chính xác của nó.\n\nGần như có thể khẳng định rằng, thế hệ đầu tiên của chúng ta - những người nhân bản sơ khai nhất - được tạo ra vào khoảng 12 thế kỷ trước.\n\nLịch sử của vô số thế hệ đã chìm vào quên lãng do sự thờ ơ. Ngay cả hôm nay, ta vẫn đang bỏ lỡ rất nhiều điều, biết đâu trong số đó lại có những thứ khiến ta phải tiếc nuối."
 clones.12.name: "Họ hàng Cổ đại"
 clones.12.desc: "Một khu khảo cổ đã báo cáo về việc phát hiện ra một hóa thạch có hình dạng giống loài [Root.Owner.GetSpeciesName]. Nó vô cùng cổ xưa. Những hóa thạch này được tìm thấy gần một khu dân cư thời tiền sử. Rõ ràng, cả hóa thạch lẫn các công trình này đều có từ hàng triệu năm trước khi §YKhoang Nhân bản Cổ đại§! được xây dựng.\n\nKết quả giải trình tự gen sơ bộ xác nhận rằng chủ nhân của những hóa thạch này có cấu trúc di truyền giống chúng ta đến mức kinh ngạc. Có thể kết luận rằng đây chính là di tích của tổ tiên chúng ta, tồn tại từ rất lâu trước khi ta bắt đầu bị nhân bản.\n\nMọi thứ đang dần trở nên sáng tỏ"
 clones.12.tooltip: "Những khám phá này vẫn cần thêm thời gian để nghiên cứu chuyên sâu..."
 clones.13.name: "Lịch sử của Chúng ta"
 clones.13.desc: "Tin tức từ khu khảo cổ xác nhận giống loài chúng ta từng là người nguyên thủy trên [Root.GetHomeWorldName] đã nhanh chóng lan truyền.\n\nKhó có thể phủ nhận một kết luận hiển nhiên: việc biến đổi gen một loài nguyên thủy vốn đã quen với chiến tranh như tổ tiên ta là có mục đích rõ ràng. Những kẻ kiến tạo đã cải tạo chúng ta để ta đổ máu thay họ. Họ đã nâng tầm chúng ta chỉ để phục vụ tư lợi của bản thân, chẳng hề bận tâm đến lợi ích của chúng ta.\n\nĐây có thực sự là lịch sử mà ta muốn kể cho dân chúng nghe?\n\nGiờ vẫn còn cơ hội để viết lại lịch sử của chính mình."
 clones.13.a: "Đúng vậy, chúng ta chính là bản sao của người kiến tạo."
 clones.13.b: "Không, chúng ta phải đối mặt với hiện thực."
 clones.14.name: "Giải mật Tài liệu"
 clones.14.desc: "Vài năm trước, công tác khảo cổ đã tìm ra mục đích chúng ta được sinh ra. Thực tại thật tàn nhẫn: ta được tạo ra để làm nô lệ và chết thay cho kẻ kiến tạo. Chúng ta đã chọn nói một lời nói dối thiện ý với dân chúng, để họ không bị sự thật này đánh gục.\n\nBằng cách dày công khôi phục các hồ sơ khảo cổ đã bị xóa, một người nhân bản đã công khai lật tẩy sự thật mà ta cố tình che giấu.\n\nKẻ rò rỉ giấu mặt này ít nhất đã không bóp méo hay thêm thắt gì vào sự thật.\n\nChà, xem ra chẳng cần phải mạo hiểm khiến người dân đánh mất niềm tin vào giới cầm quyền nữa. Bản tin này đã nhanh chóng đặt dấu chấm hết cho câu chuyện bịa đặt về một quá khứ huy hoàng: rằng ta là bản sao của người kiến tạo, bình đẳng với họ chứ không phải là nô lệ."
 clones.14.a: "Chà."
 clones.14.b: "Phải xin lỗi ngay lập tức."
 clones.14.b.custom_tooltip: "Công khai xin lỗi người dân [Root.Owner.GetAdjective]."
 clones.15.name: "Lời Xin lỗi Công khai"
 clones.15.desc: "Một đoạn video được biên tập kỹ lưỡng đã được công chiếu, giải thích về ý định tốt đẹp đằng sau câu chuyện bịa đặt. Bản tin làm rõ rằng lời nói dối ấy xuất phát từ thiện ý, đồng thời nhấn mạnh quá khứ thực sự của chúng ta không có gì đáng xấu hổ, và ta nên hướng ánh nhìn về tương lai. Cũng không quên nhắc lại rằng lời nói dối thiện ý đó đã mang lại những lợi ích to lớn cho tất cả mọi người.\n\nThông điệp này dường như được công chúng đón nhận rất tích cực, dù khó mà lường trước liệu có còn hệ lụy tiêu cực nào khác hay không. Nhưng dù sao đi nữa, lượng ảnh hưởng bị mất đi cũng sẽ dần được bù đắp theo thời gian, và sự việc này cũng sẽ trôi vào dĩ vãng."
 clones.16.name: "Lãnh đạo Vinh quang"
 clones.16.desc: "Nhiều sĩ quan quân đội cấp cao đã xuất hiện trước công chúng, lên tiếng ủng hộ luồng tư tưởng chủ đạo của chúng ta.\n\nTrong một thông điệp được loan báo rộng rãi, họ bày tỏ lòng thành kính trước sự dũng cảm và trí tuệ khi chúng ta dám đối mặt với quá khứ, chia sẻ sự thật cùng người dân [Root.GetAdjective] và tín ngưỡng của họ. Niềm tin càng thêm sắt son khi chúng ta sẵn sàng đối diện với lịch sử, tiếp thêm dũng khí để đương đầu với tương lai.\n\nNgười dân khắp nơi đồng loạt ăn mừng và ca ngợi quyết định này."
 debated_origin: "Nguồn gốc Gây tranh cãi"
 debated_origin_desc: "Xã hội này đang bị giằng xé bởi những khác biệt về tín ngưỡng."
 meaningful_origin: "Nguồn gốc Ý nghĩa (Bịa đặt)"
 meaningful_origin_desc: "Xã hội này đã vững mạnh hơn nhờ niềm tin vào một quá khứ huy hoàng và một tương lai đầy ý nghĩa."
 honorable_leadership: "Vị thế Lãnh đạo Đáng kính"
 honorable_leadership_desc: "Xã hội này đặt niềm tin tuyệt đối vào thiện ý của giới cầm quyền."
 dishonorable_leadership: "Vị thế Lãnh đạo Đáng ngờ"
 dishonorable_leadership_desc: "Xã hội này đang bao trùm trong sự hoài nghi về năng lực của giới cầm quyền."
 modifier_clone_pops_decline: "Thiếu Khoang Nhân bản Cổ đại"
 modifier_clone_pops_decline_desc: "Số lượng công trình £building£§Y$building_clone_army_clone_vat$§! không đủ để duy trì dân số hiện tại."
