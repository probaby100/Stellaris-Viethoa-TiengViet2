 #TIỆN ÍCH
 origin_legendary_leader: "Quân Lâm Thiên Hạ"
 origin_legendary_leader_desc: "Từ trong đống tro tàn của bạo lực và lầm than, nền văn minh này đã tìm được đường đến đại thống nhất dưới ngọn cờ của một vị lãnh tụ kiệt xuất. Bằng bàn tay sắt nghiền nát các phe phái yếu thế để củng cố quyền lực, giờ đây họ vươn lên thành kẻ tiên phong vững chắc trên con đường khoa học và kỹ thuật. Kéo theo đó là một kỷ nguyên hòa bình nhưng đầy bất ổn. Thế nhưng hòa bình, suy cho cùng, cũng chỉ là một ảo ảnh mong manh."
 origin_tooltip_legendary_leader_effects: "—$SPECIES_TRAITS$['concept_perfected_genes']$NEW_LINE$—Đặc điểm quân vương：['concept_leader_trait_legendary_leader']"
 START_SCREEN_LEGENDARY_LEADER: "Nền văn minh của ta là một bức tranh ngập tràn khói lửa. Các đế quốc và vương quốc cứ thế nhô lên rồi lại vỡ vụn dưới áp lực của những cuộc nội chiến triền miên.\n\nKhi tinh cầu của ta một lần nữa bị nhấn chìm trong biển lửa, nền văn hóa bạo lực cực đoan này lại chạm đến đỉnh điểm. Ngay giữa tâm bão hỗn mang, một bậc vĩ nhân đã xuất hiện. [owner.Ruler.GetTitle][owner.Ruler.GetName] với lòng vị tha, sức hút mãnh liệt và quyền mưu tài tình đã thu phục được hàng vạn môn đồ. Cuối cùng, cũng có người đủ sức gắn kết chúng ta thành một khối vững chắc.\n\nĐại thống nhất là một con đường dằng dặc và đẫm máu, nhưng trước những hứa hẹn của [owner.Ruler.GetTitle] về một tương lai vươn tầm vũ trụ, những kẻ châm ngòi chiến tranh lần lượt buông vũ khí quy hàng. Lần đầu tiên trong lịch sử, ta được nếm mùi hòa bình kéo dài hàng thế kỷ, dù bên dưới lớp vỏ bọc êm ả ấy, những ân oán cũ mới vẫn đang sục sôi chờ ngày bùng nổ."
 origin_legendary_leader_imperial: "$origin_legendary_leader$"
 origin_legendary_leader_imperial_desc: "$origin_legendary_leader_desc$"
 origin_legendary_leader_dictatorial: "$origin_legendary_leader$"
 origin_legendary_leader_dictatorial_desc: "$origin_legendary_leader_desc$"
 origin_legendary_leader_death: "Triều đại Sụp đổ"
 origin_legendary_leader_death_desc: "Trong cơn lốc chính trị, khi ngọn hải đăng của Người Chói Lọi vụt tắt, quần chúng buộc phải tự vạch ra con đường sinh tồn giữa biển sao."
 origin_legendary_leader_no_gov_change: "Không thể thay đổi thể chế chính trị nếu chọn Nguồn gốc Quân Lâm Thiên Hạ."
 #CÔNG TRÌNH
 building_paragon_origin_academy: "Học viện Vĩ đại"
 building_paragon_origin_academy_desc: "Học viện Vĩ đại là cái nôi ươm mầm cho những cá nhân kiệt xuất nhất. Khơi thông tâm trí của họ không chỉ bồi đắp cho những nhà lãnh đạo tương lai mà còn là bệ phóng cho muôn đời sau."
 #CÁC CHỈ SỐ VÀ KHÁC
 planet_clerks: "Nghề Nhân viên"
 planet_civilians: "Nghề Thường dân"
 commanding_presence: "Uy Phong Lẫm Liệt"
 commanding_presence_desc: "Dưới ý chí sắt đá của quân vương, ta đủ sức khuếch trương thanh thế khắp dải ngân hà, buộc vạn kẻ phải cúi đầu nghe lệnh."
 paragon_origin_strengthened_government_i: "Củng cố Chính phủ I"
 paragon_origin_strengthened_government_i_desc: "Đế quốc của ta dốc toàn lực để rèn giũa nên một bộ máy chính quyền tinh gọn và vững như bàn thạch."
 paragon_origin_strengthened_government_ii: "$paragon_origin_strengthened_government_i$ II"
 paragon_origin_strengthened_government_ii_desc: "$paragon_origin_strengthened_government_i_desc$ Mở lớp đào tạo đặc biệt và rà soát kỹ lưỡng đầu vào quan chức là bước đệm không thể thiếu để chạm tới đích đến này."
 paragon_origin_strengthened_government_ii_tt: "Mỗi [civilian.GetIcon]§Y[civilian.GetName]§! nhận §Y25%§! tăng cường $POLITICAL_POWER$\n[civilian.GetIcon][civilian.GetNamePlural] tạo ra £unity£$unity$: §G+0.5§!"
 paragon_origin_strengthened_government_iii: "$paragon_origin_strengthened_government_i$ II"
 paragon_origin_strengthened_government_iii_desc: "$paragon_origin_strengthened_government_ii_desc$ Để tăng cường hiệu quả công tác văn thư, ta đã ban hành sắc lệnh mới. Chỉ những công dân hội tụ đủ lòng trung thành và tính chính trực mới đủ tư cách ngồi vào chiếc ghế này."
 paragon_origin_strengthened_government_iii_tt: "Mỗi [civilian.GetIcon]§Y[civilian.GetName]§! nhận §Y50%§! tăng cường $POLITICAL_POWER$\n[civilian.GetIcon][civilian.GetNamePlural] tạo ra £unity£$unity$: §G+1§!\n[civilian.GetIcon][civilian.GetNamePlural] tạo ra £mod_country_edict_fund_add£$MOD_COUNTRY_EDICT_FUND_ADD$: §G+1§!"
 paragon_origin_humble_monument: "Tượng đài Giản dị"
 paragon_origin_humble_monument_desc: "Bức tượng đài khiêm nhường này được dựng lên để vinh danh vị lãnh tụ kính yêu, người đã chèo lái đất nước vươn tới những vì sao."
 paragon_origin_rich_monument: "Tượng đài Tráng lệ"
 paragon_origin_rich_monument_desc: "Tượng đài nguy nga này khắc ghi công lao của những người khai hoang đầu tiên, những con người đã kề vai sát cánh cùng vị lãnh tụ kính yêu chinh phục vùng đất hoang sơ mà trù phú này."
 paragon_origin_residential_monument: "Tượng đài Dân cư"
 paragon_origin_residential_monument_desc: "Khu phức hợp tượng đài - dân cư này là minh chứng sống cho trí tuệ của vị quân vương ta sùng bái. Nó không chỉ là một kiệt tác nghệ thuật mà còn là chốn an cư lý tưởng."
 paragon_origin_pirates: "Hải tặc Cướp bóc"
 paragon_origin_pirates_desc: "Các băng nhóm hải tặc đang bắt tay nhau quấy nhiễu cõi biên thùy. Mớ bòng bong này sẽ bóp nghẹt tuyến giao thương vũ trụ của ta."
 paragon_origin_prisoners: "Tù nhân được Đặc xá"
 paragon_origin_prisoners_desc: "Phe cải cách nằng nặc đòi ban lệnh đại xá toàn quốc. Dù phần đông chỉ là tù nhân chính trị, nhưng rành rành là một đám cặn bã nguy hiểm cũng đã được thả rông."
 paragon_origin_comms_down: "Trạm Thông tin Sập nguồn"
 paragon_origin_comms_down_desc: "Mạng lưới thông tin tiêu chuẩn của ta đang dở chứng, không thể duy trì đường truyền ổn định đến các thuộc địa xa tít tắp nơi biên cương.\n\nHoàn thành dự án đặc biệt để gỡ bỏ $paragon_origin_comms_down$."
 paragon_origin_worker_strike: "Công nhân Đình công"
 paragon_origin_worker_strike_desc: "Giới công nhân đang bị vắt kiệt sức, tinh thần chạm đáy, cự tuyệt cày thêm đơn hàng. Khối lượng công việc đồ sộ đè lên vai dân chúng rõ ràng đang phản tác dụng.\n\nHoàn thành dự án đặc biệt để gỡ bỏ $paragon_origin_worker_strike$."
 paragon_origin_military_dissidents: "Lính tráng Bất mãn"
 paragon_origin_military_dissidents_desc: "Nghe đồn một đám sĩ quan quèn đang hậm hực với thực trạng đế quốc. Bọn chúng còn rêu rao chèo kéo thêm dân đen gia nhập hội nhóm.\n\nHoàn thành dự án đặc biệt để gỡ bỏ $paragon_origin_military_dissidents$."
 paragon_origin_nepotism: "Ô dù Lộng hành"
 paragon_origin_nepotism_desc: "Đế quốc của ta đang đau đầu vì nạn ô dù, khiến bộ máy tê liệt. Ghế ngon toàn rơi vào tay bè phái, họ hàng, người quen thay vì những kẻ có thực tài.\n\nHoàn thành dự án đặc biệt để gỡ bỏ $paragon_origin_nepotism$."
 paragon_origin_forgotten_deal: "Quyền lợi Lập hiến"
 paragon_origin_forgotten_deal_desc: "Ta đã lùi một bước để xoa dịu lũ kỳ đà cản mũi. Quyền tự do đã được ban phát, nhưng ta phải canh chừng không để chúng được đằng chân lân đằng đầu."
 paragon_origin_reformists_deal: "Quyền lợi Lập hiến"
 paragon_origin_reformists_deal_desc: "Ta đã nhượng bộ để vuốt ve phe đối lập. Giờ đây chúng được nhởn nhơ ra rả mấy thứ luật lệ của chúng. Chúng được trao thẻ bài miễn tử và quyền chọc ngoáy vào bộ máy lập pháp. Điểm sáng duy nhất là dân đen có vẻ khoái chí với mấy cái quyền tự do mới toanh này."
 paragon_origin_reformists: "Mầm mống Dân chủ"
 paragon_origin_reformists_desc: "Nguồn tin báo về phe dân chủ đang kéo bè kết phái rầm rộ. Chó săn của ta đang theo dõi sát sao nhất cử nhất động của bọn chúng."
 paragon_origin_reformists_empire: "Bè phái Dân chủ"
 paragon_origin_reformists_empire_desc: "$paragon_origin_reformists_desc$"
 paragon_origin_broken_promise: "Biểu tình Lớn!"
 paragon_origin_broken_promise_desc: "Vì ta nuốt lời, dân đen ở hầu khắp các tinh cầu trong đế quốc đang rủ nhau xuống đường làm loạn."
 paragon_origin_saddening_grief: "Tổn thất Nặng nề"
 paragon_origin_saddening_grief_desc: "Người Chói Lọi đã băng hà! Tin dữ như sét đánh ngang tai dân chúng. Mất đi người cầm lái vĩ đại, xã hội rơi vào vòng xoáy hỗn mang, phong trào đòi cải cách bùng nổ, còn đám chính trị gia thì cắn xé nhau tranh giành ngai vàng."
 paragon_origin_rebel_player: "Hồn cốt Cách mạng"
 paragon_origin_rebel_player_desc: "Chúng ta là một dân tộc đã tìm lại được ý thức về sự bình đẳng và đoàn kết. Ta mạnh mẽ hơn bao giờ hết, rũ bỏ ách thống trị của tên bạo chúa, dù lên voi hay xuống chó, ta sẽ mãi tự chủ tự cường."
 paragon_origin_rebel_militarist: "Chiến binh Tự do"
 paragon_origin_rebel_militarist_desc: "Chúng ta ngước nhìn dải ngân hà, truyền lửa và gông cùm giải phóng. Hạm đội thay máu của ta đã lên nòng, sẵn sàng rải thảm sự bình đẳng đến tận hang cùng ngõ hẻm của vũ trụ."
 paragon_origin_rebel_pacifist: "Xã hội Hòa hiếu"
 paragon_origin_rebel_pacifist_desc: "Khát khao tìm kiếm sự tĩnh tại trong tâm hồn luôn là kim chỉ nam của chúng ta, và cuối cùng ta đã chạm tay vào nó. Cái giá phải trả là đắt đỏ, nhưng nay là lúc nếm quả ngọt."
 paragon_origin_rebel_xenophobe: "Xã hội Khép kín"
 paragon_origin_rebel_xenophobe_desc: "Biến cố vừa qua giáng cho ta một cái tát chí mạng: mở cửa đón gió lạ chỉ rước họa vào thân. Ta phải đóng chặt cửa nẻo, rào giậu kỹ càng để tự vệ trước mọi thứ mầm mống độc hại ấy."
 paragon_origin_rebel_xenophile: "Xã hội Cởi mở"
 paragon_origin_rebel_xenophile_desc: "Cơn thịnh nộ vừa qua là minh chứng thép: bế quan tỏa cảng chỉ tự bóp nghẹt chính mình. Ta phải giang tay ôm trọn thế giới, để không bao giờ tuột mất những cơ hội ngàn vàng như vậy nữa."
 paragon_origin_rebel_materialist: "Định hướng Phát triển"
 paragon_origin_rebel_materialist_desc: "Một xã hội mới được tôi luyện từ ngọn lửa nội chiến biết rõ sức nặng của mồ hôi nước mắt. Hợp sức lại, chẳng có đỉnh núi nào mà ta không thể với tới."
 paragon_origin_rebel_spiritualist: "Kỷ luật Khắc kỷ"
 paragon_origin_rebel_spiritualist_desc: "Trải qua bao đắng cay, máu lửa nội chiến đã gõ vào đầu ta bài học về sự kiềm chế và an yên cõi lòng. Phải thề không đội trời chung với thói hư tật xấu và sự tha hóa."
 paragon_origin_fresh_start: "Đế quốc Hợp nhất"
 paragon_origin_fresh_start_desc: "Kể từ thời Đại Thống Nhất, đây là lần đầu tiên muôn dân một lòng. Trải qua những phen thay máu, đế quốc của ta giờ đây uy vũ hơn bao giờ hết."
 paragon_origin_one_system_war: "Nội chiến"
 paragon_origin_one_system_war_desc: "Chôn vùi những năm tháng huynh đệ tương tàn, nhân dân cuối cùng cũng quây quần một mối. Nhưng khi ta đưa mắt nhìn lên dải ngân hà, một mầm mống loạn lạc mới lại chồi lên. Bầu trời lại vần vũ mây đen, vòng xoáy tranh quyền đoạt vị đã kề tận cổ."
 paragon_origin_united_through_war: "Trui rèn trong Lửa đạn"
 paragon_origin_united_through_war_desc: "Chỉ gom dân chúng lại cho sự nghiệp khai hoang vũ trụ thì chưa đủ. Mặc cho đất nước tan hoang sau nội chiến, những kẻ trung thành vẫn thề chết bảo vệ quân vương, sẵn sàng tuốt gươm đâm lòi ruột đám phản tặc định phá bĩnh nồi cơm và lãnh tụ kính yêu của họ."
 council_in_tatter: "Nội các Sập nguồn"
 council_in_tatter_desc: "Với khối lượng công việc hành chính phình to như thổi những năm gần đây, nội các đang thở dốc trước gánh nặng trách nhiệm đè bẹp vai."
 d_arcane_device: "Thiết bị Bí thuật"
 d_arcane_device_desc: "Cỗ máy già nua này cắm rễ sâu tít dưới boongke chính phủ. Là di sản trí tuệ của vị quân vương ta sùng kính, công nghệ sao chép vật chất của nó vẫn là một mớ bòng bong không thể giải mã."
 sustaining_apparatus: "Cỗ máy Duy trì sinh mệnh"
 sustaining_apparatus_desc: "Thiết bị không tưởng này được giấu nhẹm dưới tầng hầm chính phủ. Là bảo vật minh chứng cho trí tuệ siêu phàm của đấng minh quân, cơ chế vận hành bên trong của nó vi diệu chẳng khác nào phép thuật. Nó giúp vắt kiệt tử thần để giữ mạng cho quân vương. Buồng kén này chỉ nhận diện duy nhất một mã DNA. Rớt đài mất thủ đô hoặc xê dịch nó đi chỗ khác đồng nghĩa với bản án tử cho kẻ đang thoi thóp bên trong."
 NAME_PARAGON_ORIGIN_CRUISER_FLEET: "Tinh thần Dân tộc"
 NAME_MavenCruiser: "Hải quân Tự hào"
 maven_cruiser_01: "Tuần dương hạm Thử nghiệm"
 maven_cruiser_01_plural: "Tuần dương hạm Thử nghiệm"
 NAME_PARAGON_ORIGIN_CRUISER: "Cái Đe"
 #Đặc điểm Khởi đầu
 leader_trait_legendary_leader: "Người Chói Lọi"
 leader_trait_legendary_leader_desc: "§GNgười Chói Lọi sẽ càng ngày càng bá đạo theo thời gian.§!\n\nCuộc chiến thống nhất đẫm máu tột cùng. Rốt cuộc, chính [Root.GetName] đã mang lại hòa bình và định hướng cho ta. Người Chói Lọi là một bức tượng đài sống bộc lộ những đỉnh cao mà giống loài ta có thể vươn tới, khơi nguồn cảm hứng cho tất thảy. [This.Paragon_Origin_Ascension_Desc]"
 leader_trait_legendary_offspring: "Huyết mạch $leader_trait_legendary_leader$"
 leader_trait_legendary_offspring_desc: "Giọt máu của $leader_trait_legendary_leader$. Gánh vác di sản khổng lồ của bậc tiền bối là một ngọn núi vô hình, nhưng nhà lãnh đạo này đã bộc lộ tiềm năng không thể đong đếm."
 trait_perfected_genes: "Gen Tinh khiết"
 trait_perfected_genes_desc: "§LHàng thiên niên kỷ vật lộn với các thí nghiệm di truyền và chiến tranh đã gọt giũa nên một giống loài siêu thích nghi.§!"
 leader_trait_legendary_story: "Ghi danh Sử sách"
 leader_trait_legendary_story_desc: "Nhà lãnh đạo này sẽ đi vào sử sách như một tượng đài bất hủ."
 paragon_origin_psionic_ascension: "\n\n§PChuyển hóa Năng lượng:§!\nSau một nghi lễ Tâm linh, nhà lãnh đạo này đã trở thành cầu nối với Không Gian Tĩnh (Shroud). Toàn bộ năng lượng tâm linh của ta được nhồi nhét vào [Root.GetHimHer], biến nhà lãnh đạo này thành một Á thần. Tuy nhiên, cái giá phải trả là ta phải hiến tế các cá nhân tâm linh khác để giữ cho cầu nối không bị đứt đoạn.\nChi phí duy trì mỗi thập kỷ: §R[owner.paragon_origin_ascension]§!£pop£ $POPS$"
 paragon_origin_cybernetic_ascension: "\n\n§PTrái tim Lõi Địa cầu:§!\nĐược đúc kết từ lõi hành tinh, thiết bị cấy ghép sinh cơ học độc nhất vô nhị này khát £sr_dark_matter£$sr_dark_matter$ không ngừng để duy trì sức mạnh."
 paragon_origin_synthetic_ascension: "\n\n§PThể xác Bất diệt:§!\nBằng cách nhồi một bộ não Positron độc bản vào thân xác đúc từ Kim loại Sống, ta đã hồi sinh $leader_trait_legendary_leader$. Để [Root.GetHimHer] tiếp tục tồn tại trên cõi đời này, ta phải bơm £sr_living_metal£$sr_living_metal$ không ngừng nghỉ."
 paragon_origin_genetic_ascension: "\n\n§PTái tạo Gen:§!\nSau vô số nỗ lực cấy ghép đoạn gen của $leader_trait_legendary_leader$ vào những cá thể xuất chúng khác, một vật chứa đã sống sót sau ca phẫu thuật và bộc lộ các hình thái vượt trội. Dù vậy, để duy trì sự ổn định của cấu trúc gen, ta phải bơm vật liệu di truyền tươi mới định kỳ.\nChi phí duy trì mỗi thập kỷ: §R[owner.paragon_origin_ascension]§!£pop£ $POPS$"
 paragon_origin_null_loc: " "
 #Đặc điểm Đạo đức
 leader_trait_legendary_origin_desc: "§GĐặc điểm của Vị vua Chói lọi§!"
 leader_trait_legendary_military_knowledge: "Danh tướng Xuất chúng"
 leader_trait_legendary_military_knowledge_desc: "Một chỉ huy quân sự kiệt xuất, được ba quân tướng sĩ mến mộ."
 leader_trait_legendary_foe_hammer: "Chiến binh Thép"
 leader_trait_legendary_foe_hammer_desc: "Nhà lãnh đạo này là bậc thầy về vũ khí hạm đội, mang đến kho tàng kiến thức vô giá cho các chiến dịch không gian."
 leader_trait_legendary_great_teacher: "Bậc thầy Thông thái"
 leader_trait_legendary_great_teacher_desc: "Nhà lãnh đạo này có biệt tài ươm mầm tài năng, rèn giũa người khác bứt phá giới hạn bản thân."
 leader_trait_legendary_pious_ascet: "Khắc kỷ Ngoan đạo"
 leader_trait_legendary_pious_ascet_desc: "Nhà lãnh đạo này là tấm gương sáng ngời về sự kỷ luật, là thước đo chuẩn mực cho toàn dân."
 leader_trait_legendary_commanding_presence: "Uy Phong Lẫm Liệt"
 leader_trait_legendary_commanding_presence_desc: "Nhà lãnh đạo này tỏa ra chân mạng đế vương, đố kẻ nào dám ho he làm trái lệnh."
 leader_trait_legendary_high_king: "Chí Cao Vương"
 leader_trait_legendary_high_king_desc: "Chỉ nội chiến công hiển hách cũng đủ để nhà lãnh đạo này thu phục sự kính trọng và lòng trung thành tuyệt đối từ các gia tộc danh giá."
 leader_trait_legendary_gunboat_diplomacy: "Ngoại giao Pháo hạm"
 leader_trait_legendary_gunboat_diplomacy_desc: "Nhà lãnh đạo này khoái trò diễu võ dương oai. Một quả đấm thép còn giá trị hơn vạn lời mật ngọt."
 leader_trait_legendary_scientific_diplomacy: "Thỏi nam châm Nhân tài"
 leader_trait_legendary_scientific_diplomacy_desc: "Giăng mồi ngon ắt sẽ dụ được cá lớn. Nhà lãnh đạo này có ngón nghề săn lùng chất xám khét lẹt."
 leader_trait_legendary_scientific_diplomacy_tt: "§YHiệp ước Di cư§! tạo ra §G$@scientific_diplomacy_1_amt$§! §Yđiểm nghiên cứu§! £physics£ £society£ £engineering£\n$t$—$leader_trait_legendary_origin_desc$"
 leader_trait_legendary_scientific_diplomacy_2_tt: "§YHiệp ước Di cư§! tạo ra §G$@scientific_diplomacy_2_amt$§! §Yđiểm nghiên cứu§! £physics£ £society£ £engineering£\n$t$—$leader_trait_legendary_origin_desc$"
 leader_trait_legendary_scientific_diplomacy_3_tt: "§YHiệp ước Di cư§! tạo ra §G$@scientific_diplomacy_3_amt$§! §Yđiểm nghiên cứu§! £physics£ £society£ £engineering£\n$t$—$leader_trait_legendary_origin_desc$"
 leader_trait_legendary_autarky: "Trùm Tự cấp"
 leader_trait_legendary_autarky_desc: "Nhà lãnh đạo này cắn răng nhồi nhét mọi nguồn lực để xoay vòng nền kinh tế khép kín."
 leader_trait_legendary_natural_ruler: "Minh Quân"
 leader_trait_legendary_natural_ruler_desc: "Đầy sức hút, thương dân như con, vắt kiệt sức mình, nhà lãnh đạo này một lòng một dạ nâng tầm cuộc sống cho muôn người."
 leader_trait_legendary_industry_titan: "Bá chủ Công nghiệp"
 leader_trait_legendary_industry_titan_desc: "Nhà lãnh đạo này coi một hầu bao rủng rỉnh là gốc rễ của mọi đế chế hùng cường."
 leader_trait_legendary_great_inventor: "Đại Phát minh"
 leader_trait_legendary_great_inventor_desc: "Nhà lãnh đạo này là cây đa cây đề trong mảng robot và là sếp sòng trong công cuộc tự động hóa dây chuyền lao động."
 leader_trait_legendary_great_inventor_tt: "Mức độ £amenities£ tiện nghi do £job_roboticist£$job_roboticist_plural$ tạo ra: §G+1§!\n$t$—$leader_trait_legendary_origin_desc$"
 leader_trait_legendary_great_inventor_2_tt: "Mức độ £amenities£ tiện nghi do £job_roboticist£$job_roboticist_plural$ tạo ra: §G+2§!\n$t$—$leader_trait_legendary_origin_desc$"
 leader_trait_legendary_great_inventor_3_tt: "Mức độ £amenities£ tiện nghi do £job_roboticist£$job_roboticist_plural$ tạo ra: §G+3§!\n$t$—$leader_trait_legendary_origin_desc$"
 leader_trait_legendary_genetic_purist: "Nghệ nhân Di truyền"
 leader_trait_legendary_genetic_purist_desc: "Trình độ nhào nặn gen của nhà lãnh đạo này phải gọi là thần sầu."
 leader_trait_legendary_evervigilant: "Chuông Cảnh báo"
 leader_trait_legendary_evervigilant_desc: "Nhà lãnh đạo này là chúa soi mói các giao thức an ninh mã hóa và tự tay cầm trịch mảng tình báo."
 #Đặc điểm Truyền thuyết - Tệ
 leader_trait_legendary_unfriendly: "Ruột để ngoài da"
 leader_trait_legendary_unfriendly_desc: "Nhà lãnh đạo này máu lạnh, ăn sóng nói gió, cứ hễ mở miệng là đắc tội ngoại giao."
 leader_trait_legendary_warmonger: "Kẻ Hiếu chiến"
 leader_trait_legendary_warmonger_desc: "Nhà lãnh đạo này có máu giang hồ, ngứa ngáy tay chân là kiếm chuyện, bất kể là đấm nhau ngoài đường hay xua quân ra trận."
 leader_trait_legendary_dreamlike: "Não cá vàng"
 leader_trait_legendary_dreamlike_desc: "Nhà lãnh đạo này làm việc như kẻ mất hồn, dăm ba cái việc lặt vặt là y như rằng quên sạch."
 leader_trait_legendary_harsh_ruler: "Tàn bạo"
 leader_trait_legendary_harsh_ruler_desc: "Lúc nào cũng vác gậy ra phang, nhà lãnh đạo này đẩy dân bản địa ra xa bằng những đòn trấn áp không gớm tay."
 leader_trait_legendary_harsh_ruler_tt: "£job_enforcer£§Y$job_enforcer_plural$§! và £job_telepath£§Y$job_telepath_plural$§! làm giảm §R2.5%§! £happiness£§Y$HAPPINESS$§!"
 leader_trait_legendary_too_open: "Ngây thơ"
 leader_trait_legendary_too_open_desc: "Nhà lãnh đạo này nhẹ dạ cả tin, dễ dãi vô cùng. Bao kẻ chỉ chực chờ xúm vào vặt lông."
 leader_trait_legendary_hoplofobia: "Thỏ đế"
 leader_trait_legendary_hoplofobia_desc: "Sợ trách nhiệm như sợ cọp, nhà lãnh đạo này rụt rè thái quá, hay vẽ rắn thêm chân bằng những thủ tục rườm rà thừa thãi."
 leader_trait_legendary_bad_meritocracy: "Sính Tinh hoa"
 leader_trait_legendary_bad_meritocracy_desc: "Nhà lãnh đạo này ghét cay ghét đắng bọn phàm phu tục tử, hở tí sai vặt là đuổi cổ nhân tài không thương tiếc."
 leader_trait_legendary_delusional: "Bảo thủ Cực đoan"
 leader_trait_legendary_delusional_desc: "Chứng hoang tưởng của nhà lãnh đạo này đang dồn [Root.GetHimHer] vào đường cùng của sự cô lập."
 leader_trait_legendary_delusional_effect: "Bệnh hoang tưởng ngày càng nặng khiến nhà lãnh đạo này tuột mất sự kìm kẹp đối với giới §YLao động§! và §YChuyên gia§!, kéo theo đó là sự tụt dốc thê thảm về sản lượng §YĐoàn kết§!."
 #SỬ DỤNG LẠI LOCS
 paragon.leader.growth.positive: "Đặc điểm §YNgười Chói Lọi§! của §Y[owner.Ruler.GetTitle][owner.Ruler.GetRegnalName]§! đã §Gđược nâng tầm§!."
 paragon.leader.growth.negative: "Đặc điểm §YNgười Chói Lọi§! của §Y[owner.Ruler.GetTitle][owner.Ruler.GetRegnalName]§! đã §Rbị hao mòn§!."
 paragon.leader.delusion.positive: "Đặc điểm §Y$leader_trait_legendary_delusional$§! của §Y[owner.Ruler.GetTitle][owner.Ruler.GetRegnalName]§! đã §Gcó tiến triển tốt§!."
 paragon.leader.delusion.negative: "Đặc điểm §Y$leader_trait_legendary_delusional$§! của §Y[owner.Ruler.GetTitle][owner.Ruler.GetRegnalName]§! đã §Rtrở nên tồi tệ hơn§!."
 paragon.ending.speech: "§HBuổi truyền tin kết thúc, trả lại sóng cho các bản tin thường nhật.§!"
 paragon.beginning.speech: "§H§Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! thình lình xuất hiện trên mọi màn hình của đế quốc. Dân chúng đang nín thở chờ đợi bài phát biểu.§!"
 paragon.origin.insight: "Ta đang nhích gần hơn tới đích!"
 paragon_origin_upgrades_overload: "Ta chỉ có thể chọn §G[ROOT.paragon_origin_ascension] nâng cấp§!, bằng không §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! sẽ văng mạng nếu cố chấp làm việc này."
 paragon.origin.grand.academy: "Mở khóa công trình £building£ §GHọc viện Vĩ đại§!, buff thêm sức mạnh cho lãnh đạo và đế quốc."
 #LỜI THỀ CỦA ĐẾ QUỐC
 paragon.5004.name: "Lời thề"
 paragon.5004.desc: "§Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§! đã bóp nghẹt cuộc chiến huynh đệ tương tàn, gom giang sơn về một mối. Ngự trên ngai vàng của một đế chế đoàn kết một lòng, [Owner.Ruler.GetHeSheCap] thề sẽ đưa ta vươn tới những vì sao và nhào nặn nên một đế quốc ngân hà vĩ đại.\n\nNhưng nay, dân chúng đang dần cạn kiên nhẫn, những tiếng xì xào bàn tán đang xoáy vào năng lực của đấng minh quân. Nội các đã vạch ra một kế hoạch 30 năm để bịt miệng lũ bới lông tìm vết, chèo lái giống loài ta bước sang trang sử mới."
 paragon.5004.a: "Xắn tay áo lên mà làm thôi!"
 paragon.5004.a.tt: "Kích hoạt nghị sự Lời Thề Thống Nhất, bơm thêm hiệu ứng cho các nghị sự theo phe phái trong thời gian diễn ra Tình huống §YLời Thề Thống Nhất§!."
 paragon_origin_promise: "Lời Thề Thống Nhất"
 paragon_origin_promise_type: "Lời Thề Cổ Đại"
 paragon_origin_promise_desc: "Trong những ngày tháng Đại Thống Nhất rực lửa, §Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§! đã thề độc rằng một ngày nào đó dân ta sẽ cắm cờ trên những tinh cầu xa lạ. Với nhiều người, lời thề ấy linh thiêng như sấm truyền. Số khác lại bĩu môi ngờ vực. Dù công nghệ FTL vừa có bước nhảy vọt, một nhóm thành phần bất hảo đang vin vào lời hứa còn đang dang dở này để cưa ghế của §Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§!.\n\nCách tốt nhất để tát vào mặt đám này là chứng minh chúng đã sai bét. Ta sẽ vươn mình ra biển sao, khai hoang những vùng đất mới, bành trướng lãnh thổ xa hết mức có thể."
 paragon_origin_promise_monthly_change_tooltip: "Ta có hẳn 40 năm để biến lời thề thành hiện thực!"
 situation_origin_first_promise_expansion: "Việc nhà"
 situation_origin_first_promise_prospecting: "Bới tìm Tài nguyên"
 situation_origin_first_promise_construction: "Công trường Khổng lồ"
 situation_origin_first_promise_engineering: "Cày Công nghệ"
 approach_allow_tooltip_promise: "Hoàn thành §Y$council_agenda_origin_legendary_leader_name$§! để mở khóa phương án này."
 approach_situation_origin_promise_expansion_tt: "Ta sẽ chốt chặt chuyện đối nội."
 approach_situation_origin_promise_prospecting_tt: "Ta sẽ xới tung mọi ngóc ngách tìm tài nguyên mới."
 approach_situation_origin_promise_construction_tt: "Mọi tâm điểm sẽ dồn vào mảng xây lắp."
 approach_situation_origin_promise_engineering_tt: "Bơm mạnh tiền cho bọn nghiên cứu."
 situation_promise_outcome: "Đối thủ đã cho ta 40 năm để chứng minh. Chúng sẽ sớm ngớ người ra vì sự ngu ngốc của mình khi dám nghi ngờ ta."
 situation_insight_stages: "§Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§! đang cày cuốc ngày đêm để thực hiện [Owner.Ruler.GetHisHer] lời thề."
 paragon_origin_promise_chain_title: "$paragon_origin_promise$"
 paragon_origin_promise_chain_desc: "Nói lời phải giữ lấy lời. Con dân [owner.GetName] đang mong ngóng ta lột xác thành đế quốc không gian trong vòng 40 năm tới. Ta phải bành trướng mạnh mẽ bằng cách §Gkiểm soát các hệ sao§!, §Gthuộc địa hóa hành tinh§!, và nếu đụng độ đế quốc khác thì phải §Gký kết hiệp ước phòng thủ§!.\n\nSau §G40 năm§!, cứ mỗi §G15 điểm tiến độ§! gom được, đặc điểm §H$leader_trait_legendary_leader$§! của thủ lĩnh sẽ lại được buff thêm sức mạnh."
 promises_delivered: "Tiến độ hiện tại"
 council_agenda_origin_legendary_leader_name: "Lời Thề Thống Nhất"
 council_agenda_origin_legendary_leader_desc: "Kế hoạch 40 năm là chìa khóa vàng đưa đế quốc đến bến đỗ vinh quang. Dưới sự dẫn dắt của Người Chói Lọi, nếu ta đồng lòng hiệp sức, thành quả thu được sẽ vĩ đại hơn vạn lần khi bơi lẻ."
 council_agenda_origin_legendary_leader_effect: "Thêm phương án giải quyết Tình huống §YLời Thề Thống Nhất§!.\nNhận ngẫu nhiên một hiệu ứng Tầm nhìn Chói lọi.\nTrong suốt quá trình Tình huống §YLời Thề Thống Nhất§! đang diễn ra, các nghị sự dựa trên phe phái sẽ được nhận hiệu ứng Tầm nhìn Chói lọi."
 origin_legendary_leader_finish: "$council_agenda_origin_legendary_leader_name$ $agenda_ref$"
 origin_legendary_leader_finish_desc: "$council_agenda_origin_legendary_leader_desc$"
 paragon.5005.name: "Cắm cờ vùng đất mới"
 paragon.5005.desc: "Trạm thuộc địa mới toanh này là viên gạch đầu tiên đắp nên Lời thề của §Y[Root.Owner.Ruler.GetTitle]§!.\n\nPhi thuyền thực dân đã được cải hoán vĩnh viễn thành đài chỉ huy cho khu định cư mới. Ta đang tất bật nối lõi phản ứng của nó vào lưới điện, truyền sức sống cho toàn thuộc địa.\n\nKhi dòng người từ trên phi thuyền ùa xuống, những khu lán trại dã chiến thi nhau mọc lên như nấm sau mưa quanh thân tàu khổng lồ. Từ nền móng đơn sơ này, một ngày nào đó nơi đây sẽ sừng sững thành phố [Root.Owner.GetSpeciesName] đầu tiên trên [Root.GetName]."
 paragon.5008.name: "Hứa lèo"
 paragon.5008.desc: "$paragon.beginning.speech$\n\nTrong thông điệp mới nhất, [Root.Owner.Ruler.GetName] rót mật vào tai bọn [Root.Owner.GetSpeciesNamePlural], kêu gọi xóa bỏ hiềm khích cũ mà hướng tới tương lai. [Root.Owner.Ruler.GetSheHeCap] thao thao bất tuyệt về những kỳ tích ta đã cùng nhau đắp nặn, và phán xanh rờn rằng để lầm lỗi quá khứ ngáng đường là một tư duy cực kỳ thiển cận. Nếu [Root.Owner.GetName] một lòng, chẳng có ngọn núi nào ta không thể vượt qua!\n\n$paragon.ending.speech$"
 paragon.5008.a: "Chúng có lọt tai nổi không?"
 paragon.5008.a.tt: "§LDù đám đông vẫn một lòng phò tá §Y[Root.Owner.Ruler.GetTitle]§!, sự thật rành rành là ta chưa hoàn thành lời hứa, và cái ghế của chính phủ đang lung lay dữ dội.§!"
 paragon.5009.name: "Lời thề Ứng nghiệm"
 paragon.5009.desc: "$paragon.beginning.speech$\n\nTrong thông điệp bốc lửa mới đây, [Root.Owner.Ruler.GetName] đã tâng bốc thành tựu của vài cá nhân sừng sỏ trước toàn thể [Root.Owner.GetSpeciesNamePlural] - đương nhiên không quên đánh bóng tên tuổi của chính [Root.Owner.Ruler.GetHerHis]. [Root.Owner.Ruler.GetSheHeCap] tiếp tục liệt kê hàng tá kỳ tích mà ta chung tay gặt hái, từ chiến thắng vang dội này nối tiếp vinh quang khác, đắp nên một tương lai ngời sáng.\n\n$paragon.ending.speech$"
 paragon.5009.a: "Nắm tay nhau vươn tới các vì sao!"
 paragon.5009.a.tt: "§LTa đã hoàn thành xuất sắc từng lời hứa và tầm nhìn với dân chúng.§!"
 paragon.5010.name: "Định hướng"
 paragon.5010.desc: "Thành phố mới mọc lên trên [Root.GetName] quả là một tuyệt tác mãn nhãn. Bằng mồ hôi và ý chí sắt đá, đám dân đi khai hoang đã bám rễ và phất lên trên hành tinh mới này.\n\nĐám [Root.Owner.GetSpeciesName] trên [Root.GetName] đang rục rịch đắp một bức tượng đài dâng lên §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! để chứng giám lòng trung thành."
 paragon.5010.a: "Cứ để chúng làm."
 paragon.5010.a_tt: "Cư dân trên [Root.GetName] sẽ dựng một tượng đài khắc tên §Y[Root.Owner.Ruler.GetTitle]§!."
 paragon.5010.b: "Rót thêm vốn cho chúng."
 paragon.5010.b_tt: "§Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! sẽ đích thân rút hầu bao hỗ trợ dự án."
 paragon.5010.c: "Tập trung vào chuyện thiết thực hơn đi."
 paragon.5010.c_tt: "Dân trên [Root.GetName] sẽ ném số tiền quyên góp được vào một dự án khác có ích hơn."
 paragon.5011.name: "Lễ hội trên [Root.GetName]!"
 paragon.5011.desc: "§HMọi màn hình nhà nước trên [Root.Owner.GetName] bị cắt sóng cái rụp, nhường chỗ cho bản tin nóng hổi từ [Root.GetName]. §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! oai vệ đứng trước một tượng đài phủ bạt mờ ảo.§!\n\nHôm nay, ta viết nên trang sử mới, một kỳ tích vô tiền khoáng hậu của giống loài. Dưới trướng của ta và sự cày cuốc của các ngươi, chẳng có gì có thể cản bước ta! Đám dân tiên phong trên [Root.GetName] muốn tạc tượng vinh danh ta, nhưng hôm nay, ta muốn cúi đầu tri ân mồ hôi công sức của từng người trong các ngươi. [Root.Owner.GetName] vạn tuế!"
 paragon.5011.a: "Vạn tuế!"
 paragon.5011.a.response: "§HKhi tấm bạt trùm tượng đài §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! rơi xuống, đám đông vỡ òa trong tiếng reo hò và những tràng pháo tay sấm dậy. §Y[Root.Owner.Ruler.GetTitle]§! sừng sững đầy kiêu hãnh, phóng tầm mắt về phía chân trời, hướng tới một tương lai chói lọi. Đây là chiến tích đầu tiên của ta khi chinh phục được một hành tinh mới!§!"
 paragon.5012.name: "Lễ hội trên [Root.Owner.GetName]!"
 paragon.5012.desc: "§HMọi màn hình nhà nước trên [Root.Owner.GetName] bị cắt sóng cái rụp, nhường chỗ cho bản tin nóng hổi từ [Root.GetName]. Trong khung hình, §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! oai vệ đứng trước một tượng đài phủ bạt mờ ảo.§!\n\nHôm nay, ta viết nên trang sử mới, một kỳ tích vô tiền khoáng hậu của giống loài. Dưới trướng của ta và sự cày cuốc của các ngươi, chẳng có gì có thể cản bước ta! Dân cư trên [Root.GetName] muốn dùng thứ này để tung hô ta, nhưng hôm nay, ta muốn tôn vinh những giọt mồ hôi ta đã cùng nhau đổ xuống, hãy siết chặt tay nhau bước vào kỷ nguyên hoàng kim!"
 paragon.5012.a: "Đoàn kết là sức mạnh!"
 paragon.5012.a.response: "§HKhi bức tượng đài khắc họa §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! được bao bọc bởi những vị anh hùng [Root.Owner.GetSpeciesNamePlural] khác lộ diện, đám đông vỡ òa trong tiếng hò reo vang trời. Họ sát cánh bên nhau như một bức tường thành, một quốc gia hòa làm một chung một nhịp đập.§!"
 paragon.5013.name: "Tưởng niệm [Root.GetName]!"
 paragon.5013.desc: "§HMọi màn hình nhà nước trên [Root.Owner.GetName] bị cắt sóng cái rụp, nhường chỗ cho bản tin nóng hổi từ [Root.GetName]. Trong khung hình, §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! oai vệ đứng trước một tượng đài phủ bạt mờ ảo.§!\n\nHôm nay, ta viết nên trang sử mới, một kỳ tích vô tiền khoáng hậu của giống loài. Dưới trướng của ta và sự cày cuốc của các ngươi, chẳng có gì có thể cản bước ta! Dân cư trên [Root.GetName] muốn dùng thứ này để tung hô ta, nhưng chính họ mới là những người hùng chân chính của nhân dân ta. Ta chẳng qua chỉ là một người đày tớ của nhân dân, nhờ có các ngươi, ta mới bước được vào kỷ nguyên ánh sáng."
 paragon.5013.a: "Thật khiêm tốn làm sao!"
 paragon.5013.a.response: "Đó là lý do ta gạt phăng ý định dựng tượng của những cư dân kiêu hãnh này. Số tiền đó sẽ được ném vào việc kiến thiết thành phố. Sự phồn vinh đang vẫy gọi ta!\n\n$paragon.ending.speech$"
 paragon.5014.name: "Nội các Kiệt sức"
 paragon.5014.desc: "Nội các đã cạn kiệt sinh lực.\n\nDù năng lượng của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! dường như vô tận, cái gánh cai trị một đế chế liên sao đã vắt kiệt dàn nội các đến giọt mồ hôi cuối cùng. Dẫu vậy, vẫn còn một đống lùm xùm chưa giải quyết xong, bắt buộc phải xẻ nhỏ gánh nặng ra cho kẻ khác gánh vác."
 paragon.5014.a: "Ta sẽ vượt qua được."
 paragon.5110.name: "Đụng độ Hải tặc"
 paragon.5110.desc: "Báo cáo báo về dồn dập việc hải tặc cắn trộm các tuyến giao thương của ta. Nội các đang cuống cuồng kêu gọi quân đội xuất kích dẹp loạn."
 paragon.5110.a: "Xua hạm đội ra đó."
 paragon.5120.name: "Cắt đứt Liên lạc"
 paragon.5120.desc: "Đám khai hoang và nhóm nghiên cứu vũ trụ sâu đang kêu trời vì hệ thống liên lạc chập chờn, họ mất kết nối mấy ngày liền rồi. Đội kỹ sư hiến kế xây trạm chuyển tiếp ngay tại thủ đô để kích sóng."
 paragon.5120.a: "Duyệt."
 paragon.5121.name: "Trạm Kích sóng"
 paragon.5121.desc: "Trạm kích sóng đã lên đèn. Test sơ qua thì ngon nghẻ, thừa sức gánh đường truyền mượt mà khắp lãnh địa của ta.\n\nNhìn lại thì mấy vụ nhiễu sóng trước đây sặc mùi phá hoại có chủ đích. Dù chưa tóm được đuôi lũ chuột nhắt này, nhưng hệ thống mới dư sức bóp nát mọi âm mưu phá rối tiếp theo."
 paragon.5121.a: "Ta đã đòi lại được tiếng nói của mình."
 paragon.5130.name: "Công nhân Đình công"
 paragon.5130.desc: "Đám thợ thuyền ngoài không gian đang vứt đồ nghề bãi công, gào thét đòi cải thiện cái môi trường làm việc khắc nghiệt như địa ngục. Chúng đòi tăng ngày nghỉ và thắt chặt an toàn lao động. Để vỗ về, ta đề xuất quăng cho chúng vài ngày xả hơi trọn vẹn và mở một cuộc diễu binh hoành tráng ở thủ đô để buff lại tinh thần yêu nước."
 paragon.5130.a: "Làm theo kế hoạch!"
 paragon.5131.name: "Cuộc Đại Diễu binh"
 paragon.5131.desc: "Buổi diễu binh thành công ngoài sức tưởng tượng! Cảnh dân chúng hò reo cuồng nhiệt gọi tên §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! được lan truyền với tốc độ ánh sáng khắp [Owner.GetName], tôn vinh đấng [Root.Owner.Ruler.GetTitle] nhân từ. Dù thủ đô có nổi lên vài vụ lộn xộn lắt nhắt, nhưng trật tự được lập lại phút mốt, không ai rụng sợi lông nào. Báo chí cũng hùa vào tâng bốc §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! lên mây xanh vì màn dẹp loạn thần tốc của lực lượng an ninh."
 paragon.5131.a: "Lũ phản động khốn khiếp!"
 paragon.5140.name: "Lính tráng Bất mãn"
 paragon.5140.desc: "Nghe phong phanh có vài báo cáo về đám sĩ quan quèn dám to gan bôi nhọ thanh danh của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!. Trò mèo này không thể dung thứ. Ít nhất cũng phải lột lon đuổi cổ bọn dính líu khỏi quân ngũ."
 paragon.5140.a: "Mở cuộc điều tra."
 paragon.5141.name: "Tóm gọn Kẻ Bất mãn"
 paragon.5141.desc: "Đám sĩ quan phản trắc đã sa lưới. May là số lượng ít, nhưng vụ này như cái tát cảnh tỉnh rằng quân đội của ta cũng đang bị lũ phản đồ thò nọc vào. Ta đã tóm được bọn đầu sỏ kích động, nhưng cũng không loại trừ khả năng chúng móc ngoặc với tổ chức dân sự nào đó."
 paragon.5141.a: "Phải căng mắt ra mà cảnh giác."
 paragon.5150.name: "Ô dù Lộng hành"
 paragon.5150.desc: "Nội các dạo này đang bị săm soi dữ dội. Đơn thư nặc danh tố cáo một đống ghế ngon đang bị đám dây mơ rễ má của các sếp lớn ngồi chễm chệ. Ta đã hứa sẽ xắn tay áo điều tra và dẹp loạn vụ này."
 paragon.5150.a: "Đã đến lúc dọn rác."
 paragon.5151.name: "Thanh lọc Nội các"
 paragon.5151.desc: "Ủy ban đặc biệt đã cày nát bộ sậu cấp cao của Nội các. Hàng tá kẻ bất tài vô dụng bị đá bay khỏi ghế. Một nhúm có vẻ xài được thì bị tống đi học khóa đào tạo lại."
 paragon.5151.a: "Thế này có phải sạch sẽ hơn không."
 #VẤN ĐỀ CỦA ĐẾ QUỐC
 PARAGON_ORIGIN_SPIRITUALIST_PROJECT: "Trạm Chuyển tiếp"
 PARAGON_ORIGIN_SPIRITUALIST_PROJECT_DESC: "Xây một trạm chuyển tiếp to đùng ngay hệ sao thủ đô để chống nhiễu sóng tầm xa. Đội kỹ sư chóp bu của ta đã xách đồ nghề sẵn sàng."
 PARAGON_ORIGIN_AUTHORITARIAN_PROJECT: "Cuộc Đại Diễu binh"
 PARAGON_ORIGIN_AUTHORITARIAN_PROJECT_DESC: "Lên mâm một cuộc diễu binh hoành tráng và chốt luôn ngày quốc khánh, vụ này tốn mồ hôi phết đấy. Muốn buff lại lòng tự tôn dân tộc thì mọi thứ phải chuẩn chỉ đến từng milimet."
 PARAGON_ORIGIN_PACIFIST_PROJECT: "Nhổ cỏ Đám Sĩ quan Bất mãn"
 PARAGON_ORIGIN_PACIFIST_PROJECT_DESC: "Lũ bất mãn đang cắm rễ ngầm trong quân đội, mở miệng ra là nói xấu §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! và nhăm nhe làm phản. Phải ra đòn sấm sét dập tắt ngay."
 PARAGON_ORIGIN_MATERIALIST_PROJECT: "Dẹp nạn Ô dù"
 PARAGON_ORIGIN_MATERIALIST_PROJECT_DESC: "Dẹp tiệm cái nạn ô dù trong nội các phải là ưu tiên số một, nó đang ngáng đường mọi kế hoạch của ta. Quét sạch đống rác này sẽ tốn chút thời gian, nhưng dân chúng đang mỏi mắt chờ mong."
 paragon.5020.name: "Tiền đồ Mù mịt"
 paragon.5020.desc: "Dù §Y[owner.Ruler.GetTitle][owner.Ruler.GetRegnalName]§! đã cày ải gấp bội, một núi việc vẫn còn đó. Cái đế quốc này vốn là lẩu thập cẩm của đủ phe phái choảng nhau chí chóe, mãi mới gò được vào một khối nhờ nỗ lực không ngừng nghỉ của [owner.Ruler.GetTitle].\n\nDù §Y[owner.Ruler.GetTitle][owner.Ruler.GetRegnalName]§! chưa từng nghĩ tới chuyện đập đi xây lại bộ máy chính quyền thời Hậu Thống nhất, nhưng một thể chế mới, độc tài hơn có lẽ sẽ dẹp loạn được đống lùm xùm này. Cơ mà làm vậy thì kiểu gì cũng chuốc lấy gạch đá từ phe đối lập."
 paragon.5020.a: "Xưng Đế!"
 paragon.5020.a.tt: "§LChỉ khi trao vào tay [owner.Ruler.GetTitle] quyền lực tuyệt đối, ta mới có cửa làm bá chủ thiên hà. Từ nay, [owner.Ruler.GetTitle] là trùm cuối của Nội các. Cầu cho vương triều của [owner.Ruler.GetHisHer] ngàn thu vạn đại!§!\nNước đi này sẽ đắp thêm sắt thép cho ngai vàng của §T[owner.Ruler.GetRegnalName]§!, nhưng coi chừng §Răn trái đắng§! về sau."
 paragon.5020.b: "Giữ nguyên hiện trạng."
 paragon.5020.b.tt: "§LQuần chúng tin sái cổ rằng [owner.Ruler.GetTitle] sẽ dẫn dắt họ lên đỉnh vinh quang, nhưng chưa bao giờ gật đầu cho cái ghế cha truyền con nối hay cái mác đế quốc cả. Giật quyền kiểu đó thì là phường bạo chúa.§! Giữ nguyên thì nước mới yên."
 paragon.5021.name: "Lễ Đăng quang"
 paragon.5021.desc: "Tin tức lan nhanh như cháy rừng. Ngay khi đám quan chức vừa đóng dấu ký tên, một lễ đăng cơ hoành tráng đã được phát sóng trực tiếp trên toàn cõi. Hầu hết bọn [Owner.GetSpeciesNamePlural] đều nhảy cỡn lên vì sung sướng khi thấy §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! nắm trọn giang sơn trong lòng bàn tay.\n\nNhưng đằng sau màn kịch hân hoan ấy là những dấu hỏi to tướng và hàng loạt ẩn số chưa có lời giải. Đế quốc mới này rồi sẽ đi về đâu?"
 paragon.5021.a: "Quân đội phải là mũi nhọn."
 paragon.5021.b: "Đức tin sẽ dẫn đường chỉ lối."
 paragon.5021.c: "Luật pháp và Trật tự là chân lý."
 paragon.5021.d: "Quốc gia ta giang tay đón chào tất thảy."
 paragon.5021.e: "Hòa bình là chìa khóa của sự phồn vinh."
 paragon.5021.f: "Có tiến bộ mới làm nên nghiệp lớn."
 paragon.5021.g: "Đế quốc sẽ là tấm khiên thép đập nát mọi thế lực ngoại bang."
 paragon.5021.h: "Chính phủ phải vững như bàn thạch."
 paragon.5022.name: "Chiếu Cáo Thiên Hạ"
 paragon.5022.desc: "§HGiờ là lúc §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! ban lời vàng ngọc tới thần dân. Báo đài quốc gia đang tiếp sóng lời của [Ruler.GetHerHis].§!\n\nHỡi đồng bào [Owner.GetSpeciesNamePlural]! Khi đứng bên bờ vực thẳm, các ngươi đã chạy đến cầu xin sự dẫn dắt của ta. Ta thề, niềm tin của các ngươi sẽ được đền đáp xứng đáng. Quyền lực càng cao, trách nhiệm càng nặng, ta xin lấy danh dự thề sẽ cống hiến trọn đời cho đất nước và thần dân. Chiếu chỉ đầu tiên của ta trên cương vị Hoàng đế là dựng lên một học viện, nơi những khối óc ưu tú nhất sẽ được nhào nặn để kiến thiết một tương lai ngời sáng cho tất cả chúng ta. Thẳng tiến tới những vì sao, thẳng tiến tới vinh quang!"
 paragon.5022.a: "Hướng tới những vì sao!"
 #CỘT MỐC NGOẠI GIAO
 paragon.5023.name: "Gia nhập Liên bang"
 paragon.5023.desc: "$paragon.beginning.speech$\n\nThông điệp của [Root.Owner.Ruler.GetName] gào lên rằng hôm nay là một ngày lịch sử! Việc nặn ra cái Liên bang này quả là đáng ăn mừng lớn. [Root.Owner.Ruler.GetHeSheCap] chém gió về tình hữu nghị thắm thiết với các đồng minh, phán rằng việc khoác vai [your_ally.GetName] sẽ đẩy cả hai nước sang một chương mới. Một thời kỳ hoàng kim ngập tràn vinh hoa phú quý!\n\n$paragon.ending.speech$"
 paragon.5023.a: "Liên bang vạn tuế!"
 paragon.5025.name: "Vua của các vị Vua"
 paragon.5025.desc: "$paragon.beginning.speech$\n\nTâm điểm của bản tuyên ngôn xoáy vào [your_ally.GetName], cái nước vừa mới ngoan ngoãn thừa nhận sự bá đạo của ta, cúi đầu nhận mệnh! Sự thức thời của chúng sẽ được thưởng xứng đáng, ta cũng mong đám nước khác biết điều mà nối gót quy hàng.\n\n$paragon.ending.speech$"
 paragon.5025.a: "Ta sinh ra là để cai trị."
 paragon.5027.name: "Nghiền nát quân thù!"
 paragon.5027.desc: "$paragon.beginning.speech$\n\nTiền tuyến báo về tin báo đã ký hiệp ước hòa bình, dân tình lại được phen sướng rơn khi nghe lũ địch bị ép phải nhè ra một đống nhượng bộ. Ta đã tận mắt chứng kiến quả ngọt chiến thắng dưới ngọn cờ của Người Chói Lọi!\n\n$paragon.ending.speech$"
 paragon.5027.a: "Khải hoàn!"
 paragon.5029.name: "Hậu quả tàn khốc"
 paragon.5029.desc: "$paragon.beginning.speech$\n\nHôm nay là một ngày đen tối của [Owner.GetName]. Tội ác tày trời của lũ xâm lăng được bêu rếu chình ình trên trang nhất, [Ruler.GetName] gào thét đòi mọi người phải nắm chặt tay nhau trong thời khắc dầu sôi lửa bỏng này. §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! thề độc sẽ vớt vát lại kết cục ít tồi tệ nhất, đồng thời khóa sổ không cho kịch bản này lặp lại.\n\n$paragon.ending.speech$"
 paragon.5029.a: "Không bao giờ có lần hai!"
 paragon.5033.name: "Cúi đầu Xưng thần"
 paragon.5033.desc: "$paragon.beginning.speech$\n\n[Root.Owner.Ruler.GetName] nín bặt. Tin tức phơi bày việc [Owner.GetName] đã cắn răng ký hiệp ước chư hầu. Dù ta vẫn mù quáng tin vào tài lèo lái của Người Chói Lọi, nhưng rành rành đây là một cú tát điếng người vào mặt nền văn minh của ta.\n\n$paragon.ending.speech$"
 paragon.5033.a: "Ta chỉ đang mượn tay chúng thôi."
 paragon.5038.name: "Người gác đền Ngân hà"
 paragon.5038.desc: "$paragon.beginning.speech$\n\nHôm nay là ngày định mệnh. [Root.Owner.Ruler.GetName] vỗ ngực tự hào báo tin: Cộng đồng Ngân hà đã bầu ta làm Giám hộ tối cao. Bọn họ phải công nhận chỉ ta mới đủ trình độ chống lưng cho cái thiên hà này. Quyền lực đổ về như thác, nhiệm vụ của ta không chỉ là gánh vác kỳ vọng của các nước mà còn phải cho chúng lác mắt.\n\n$paragon.ending.speech$"
 paragon.5038.a: "Vì Thiên hà!"
 paragon.5039.name: "Đỉnh cao Quyền lực"
 paragon.5039.desc: "$paragon.beginning.speech$\n\nNgày khải hoàn đã tới! Thượng viện Ngân hà vừa suy tôn [Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName] lên ngôi Hoàng đế Đế quốc Ngân hà. Để tạ ơn, [Root.Owner.Ruler.GetName] thề sẽ chèo lái cả cái thiên hà này cùng muôn dân vào một kỷ nguyên hoàng kim rực rỡ - từ nay và mãi mãi về sau!\n\n$paragon.ending.speech$"
 paragon.5039.a: "Bá nghiệp Đế quốc lưu truyền muôn đời!"
 #Bị Lãng quên
 paragon.5050.name: "Phe đối lập bành trướng"
 paragon.5050.desc: "Đám đối lập tư tưởng đã bắt tay nặn ra một khối chính trị khét lẹt. Chúng hô hào tay chân tụ tập, biểu tình hòa bình để chửi bới những thay đổi độc đoán mà §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! tự tiện ban hành!\n\nChúng cắn càn rằng ta đã đi chệch đường ray so với thời Đại Thống nhất, và lớn tiếng đòi §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! phải thu hồi vài đạo luật cải cách."
 paragon.5050.a: "Chúng lấy gan đâu ra mà dám nghi ngờ [Ruler.GetHimHer]?"
 paragon_origin_forgotten: "Mầm mống Phản loạn"
 paragon_origin_forgotten_type: "$paragon_origin_forgotten$"
 paragon_origin_forgotten_desc: "Đám biểu tình quây kín cổng dinh thự chính phủ, bù lu bù loa đòi §Y[owner.Ruler.GetTitle][owner.Ruler.GetRegnalName]§! phải nghe chúng than khóc. Nhìn quanh rặt một lũ trẩu tre, nhưng giật dây phía sau lại là mấy lão cựu binh thời Chiến tranh Đại thống nhất. Bịt tai làm ngơ lúc này coi bộ không phải ý hay."
 paragon_origin_forgotten_monthly_change_tooltip: "Đám phản động này không phải một khối thống nhất, ngày nào cũng đẻ ra nhánh mới. Ta đang mướt mồ hôi truy lùng bọn đầu sỏ."
 situation_origin_forgotten_propaganda: "Bật cỗ máy Tuyên truyền"
 situation_origin_forgotten_balanced: "Tìm đường Lùi"
 situation_origin_forgotten_crackdown: "Bàn tay Sắt"
 approach_situation_origin_forgotten_propaganda_tt: "Ta sẽ lấy truyền thông làm vũ khí để hút cạn máu ủng hộ của phe đối lập. Trò này có thể làm dân tình lú mề, nhưng kiểu gì cũng giữ được cái ghế bình yên."
 approach_situation_origin_forgotten_balanced_tt: "Bằng cách vuốt ve đám ôn hòa trong phe đối lập, ta có thể bịt miệng báo chí, đồng thời rảnh tay xử lý mấy thành phần... cứng đầu hơn."
 approach_situation_origin_forgotten_crackdown_tt: "Nói không với thỏa hiệp. Đứa nào dám thọc gậy bánh xe, ta đè ra đập nát tươm."
 paragon.forgotten.a: "Gạt phăng mấy luận điệu xuyên tạc này."
 paragon.forgotten.b: "Rót thêm tiền cho an ninh."
 paragon.forgotten.c: "Bịt mồm lũ phản động lại."
 paragon.5054.name: "Bản Cáo trạng"
 paragon.5054.desc: "Một băng nhóm ngầm xưng danh \"Kẻ Bị Lãng Quên\" vừa lu loa tố cáo thói bạo chúa của §Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§!. Chúng rêu rao chính quyền này chưa từng đứng về phía nhân dân, mà chỉ là bù nhìn cho một nhúm quyền lợi nhóm. Chúng chửi thẳng mặt [Owner.Ruler.GetRegnalName], còn quăng ra bằng chứng về mấy vụ thủ tiêu người bất đồng chính kiến. Mấy tin rác này cứ ra rả suốt ngày đêm, bắt đầu gieo rắc sự nghi ngờ vào đầu dân đen."
 paragon.5055.name: "Cái giá của Sự thật"
 paragon.5055.desc: "Sau khi săm soi mớ bằng chứng, có vẻ §Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§! quả thật đã lừa miếng đám Kẻ Bị Lãng Quên, hoặc chí ít là giấu nhẹm sự thật. [Owner.Ruler.GetHeShe] đã lén lút ký tá với mấy bè phái cộm cán, hứa hươu hứa vượn đủ thứ mà [Owner.Ruler.GetHeShe] thừa biết mình không gánh nổi.\n\nHôm nay, bọn Kẻ Bị Lãng Quên đứng lên làm loa phường cho những nạn nhân bị [Owner.Ruler.GetTitle] lừa gạt, gào thét đòi sang tên đổi chủ quyền lực về tay quốc hội và nhân dân."
 paragon.5056.name: "Chơi Xỏ"
 paragon.5056.desc: "Vài tài liệu mật dư sức tát vỡ mặt §Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§! vừa bị một nhóm ẩn danh tuồn ra ngoài. Cú phản thùng này như đổ thêm dầu vào đống lửa chính trị đang cháy rực. Đám Kẻ Bị Lãng Quên có động cơ rõ ràng nhất, nhưng lại giả đò ngây thơ vô số tội, vì ta tìm mỏi mắt cũng chả ra bằng chứng nào dính líu đến chúng."
 paragon.5057.name: "Đủ rồi đấy."
 paragon.5057.desc: "Ván cờ chính trị đã vuột khỏi tầm tay. Bọn xúi giục đang đổ dầu vào lửa, còn thái độ cứng đầu của §Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§! đã châm ngòi cho bão biểu tình đẫm máu càn quét khắp đế quốc. Xác chết chất thành đống, §Y[Owner.Ruler.GetTitle]§! hết đường lui, đành phải xuống lệnh nghiền nát quân phản loạn bằng bất cứ giá nào."
 paragon.5057.a: "Gông cổ hết bọn chúng lại!"
 paragon.5057.a.tt: "§LTa biết thừa hang ổ của lũ phá đám này. Tóm gọn rồi tống hết vào khám.§!"
 paragon.5057.b: "Kiềm chế."
 paragon.5057.b.tt: "§LKhi không thèm cúi đầu nhân nhượng, ta sẽ cho mọi kẻ chống đối thấy ta đang dốc hết ruột gan vì sự ấm no của muôn dân.§!"
 paragon.5057.c: "Xóa sổ bọn phản quốc!"
 paragon.5057.c.tt: "§LLũ phản động là ung nhọt của quốc gia, phải bị cắt bỏ không thương tiếc.§!"
 paragon.5058.name: "Áp lực Ngai vàng"
 paragon.5058.desc: "Dưới áp lực cực lớn, §Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§! đã phát triển một phương pháp đối phó độc đáo. Dù vài người coi đây chỉ là thói quen kỳ quặc, nó lại đang ảnh hưởng đến toàn bộ hội đồng."
 paragon.5058.a: "Chúng ta đành phải quen với nó thôi."
 paragon.5059.name: "Vị Lãnh Đạo Cần Mẫn"
 paragon.5059.desc: "§Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§! không ngừng học hỏi để trở thành một nhà lãnh đạo xuất sắc hơn. Sự cống hiến đầy mới mẻ của [Owner.Ruler.GetHisHerCap] đã thu hút sự chú ý của toàn thể Hội đồng."
 paragon.5059.a: "Trí tuệ của [Owner.Ruler.GetHisHerCap] quả là vô tận!"
 paragon.5060.name: "Khôi Phục Trật Tự"
 paragon.5060.desc.imprisioned: "$paragon.beginning.speech$\n\nXã hội đang tuột dốc không phanh. Bạo lực tràn lan, xúi giục ngầm, dối trá trắng trợn... Những vấn đề này đã ám ảnh chúng ta từ lâu. Tôi tự hào tuyên bố, những thời khắc khó khăn đó đã chấm dứt! Những kẻ rắp tâm phá hoại chúng ta đã bị bắt giữ, và tôi cam đoan, chúng sẽ phải đối mặt với toàn bộ sức mạnh của pháp luật. Chẳng bao lâu nữa, chúng sẽ phải sám hối vì những tổn thương đã gây ra cho các bạn!\n\n$paragon.ending.speech$"
 paragon.5060.desc.negotiated: "$paragon.beginning.speech$\n\nTrong thời buổi xung đột, ta rất dễ quên đi mục tiêu mà mình đang đấu tranh, và coi các đối thủ chính trị như những kẻ thù không đội trời chung. Chúng ta đã trải qua những giây phút gian nan, nhưng hôm nay, tôi tự hào thông báo rằng chúng ta đã đạt được một kết quả hòa bình. Tiếng nói của các bạn đã được lắng nghe. Các bạn từng đặt niềm tin vào tôi, nhưng tôi đã làm các bạn thất vọng.\n\nNhưng mọi chuyện sẽ chấm dứt từ đây! Với những cuộc cải cách hiến pháp sắp tới, tôi vững tin rằng chúng ta đã quay lại đúng hướng. Bằng tất cả lòng tin của các bạn, tôi sẽ khiêm nhường giám sát việc thực thi những thay đổi này. Tôi xin thề, sẽ không bao giờ làm các bạn thất vọng một lần nữa!\n\n$paragon.ending.speech$"
 paragon.5060.desc.destroyed: "$paragon.beginning.speech$\n\nHôm nay là ngày chiến thắng vĩ đại, nhưng cũng đi kèm với những hy sinh mất mát. Kẻ thù của chúng ta đã bị tiêu diệt, nhưng sự phản bội của chúng đã để lại trong tim tôi một nỗi đau khôn tả. Vì mục đích ích kỷ, chúng đã định hủy diệt tất cả chúng ta, nhưng cuối cùng, chúng không thể đọ lại sức mạnh từ sự đoàn kết của chúng ta. Chẳng bao lâu nữa, chúng sẽ bị hành quyết vì tội ác của mình. Chúng ta đã chiến thắng!\n\n$paragon.ending.speech$"
 paragon.5060.a: "Chúng ta cần một nhà lãnh đạo mạnh mẽ hơn!"
 paragon.5060.a.tt: "§LNhững sự kiện gần đây cho thấy, chỉ có sự lãnh đạo sáng suốt của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! mới có thể mang lại hòa bình và thịnh vượng. Chúng ta cần củng cố thêm quyền lực vào tay nhà lãnh đạo của mình.§!"
 paragon.5060.b: "Chúng ta cần một chính phủ hiệu quả!"
 paragon.5060.b.tt: "§LNhững sự kiện gần đây cho thấy, để vượt qua những khó khăn này trong tương lai, chúng ta phải có một chính quyền mạnh mẽ dẫn dắt. Cần phải chuyển giao thêm quyền lực cho Hội đồng.\n§!$paragon.leader.growth.negative$"
 #Phe Cải Cách và Sự Thống Trị Điên Rồ
 paragon.5061.name: "Hung Tin Chuyển Tới"
 paragon.5061.desc: "§Y[Owner.GetHeirTitle][Owner.GetHeirName]§! đã qua đời. Dù chưa xác định rõ nguyên nhân, nhưng điều tra sơ bộ cho thấy đây là cái chết tự nhiên. [Ruler.GetRegnalName] đã suy sụp hoàn toàn trước sự ra đi của đứa con [Ruler.GetHisHer] này. Một sắc lệnh chính thức tuyên bố quốc tang đã được ban hành, trong lúc chờ kết quả điều tra."
 paragon.5062.name: "Ngập Tràn Bi Thương"
 paragon.5062.desc: "Mặc cho mọi bằng chứng đều chỉ ra đây là cái chết tự nhiên, §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! vẫn từ chối chấp nhận sự thật. Sự ra đi của người thừa kế đã tác động nặng nề đến [Ruler.GetHimHer], dẫn đến một lệnh truy quét trên toàn lãnh thổ. Những kẻ ám sát hèn nhát đứng sau chuyện này phải bị tìm ra. Lực lượng an ninh đã ráo riết nhổ rễ mọi mầm mống bất đồng.\n\nMức độ bạo lực đi kèm những vụ bắt bớ này đã gây rúng động công chúng. Các cuộc biểu tình bùng nổ, lên án sự lạm quyền và đòi hỏi một vòng cải cách chính phủ mới. Đây là lần đầu tiên trong lịch sử, đại đa số cư dân trên một hành tinh đứng lên chống lại sự cai trị của [Ruler.GetTitle]."
 paragon.5062.a: "Thật phiền phức!"
 paragon.5062.a.tt: "Kích hoạt $origin_delusional_tyrant_finish$"
 origin_egalitarian_refuse: "§RNhững [Root.GetSpeciesNamePlural] theo chủ nghĩa Bình đẳng này từ chối rời khỏi [Root.Planet.GetName]!§!\n\n"
 paragon.5063.name: "Phe Cải Cách Sụp Đổ"
 paragon.5063.death.desc: "Sau cái chết của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!, sự ủng hộ dành cho phe cải cách dần cạn kiệt. Đại diện của nhóm này đã gạt bỏ những bất đồng tư tưởng để tham dự tang lễ. Dù hôm nay ngập tràn trong không khí bi thương, nhưng đây cũng là một khoảnh khắc đoàn kết - nhắc nhở về những giá trị mà [Root.Owner.GetName] đang đại diện."
 paragon.5063.norebel.desc: "Dù là nhờ việc sử dụng khéo léo tài nguyên hay các biện pháp trừng phạt mạnh tay, hành tinh nổi loạn không còn là một mối đe dọa nữa. Chúng ta một lần nữa đoàn kết, người dân tập trung vào phát triển thay vì đấu đá nội bộ. §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! đã ban sắc lệnh, lấy ngày hôm nay làm một ngày lễ kỷ niệm đặc biệt."
 paragon.5063.death.a: "Đoàn Kết Trong Sự Chết"
 paragon.5063.norebel.b: "Tái Thống Nhất."
 paragon_origin_reformists_struggle: "Yêu Cầu Của Phe Cải Cách"
 paragon_origin_reformists_struggle_type: "$paragon_origin_reformists_struggle$"
 paragon_origin_reformists_struggle_desc: "Những kẻ xúi giục phe cải cách đang vin vào cái mác tự do để cố phá nát đất nước này! Cùng với các cuộc xung đột bạo lực nổ ra trên lãnh thổ, những lời dối trá của chúng đã thuyết phục được nhiều người dân quay lưng lại với chúng ta. Chúng cho rằng §Y[Owner.Ruler.GetTitle][Owner.Ruler.GetRegnalName]§! hèn nhát, tàn bạo và vô năng, nhưng ta sẽ chứng minh cho chúng thấy điều ngược lại!"
 situation_paragon_origin_reformists_struggle_harsh: "Duy Trì Quyền Kiểm Soát"
 approach_situation_paragon_origin_reformists_struggle_harsh_tt: "Trấn áp bằng bạo lực mọi căn cứ đã biết của phe cải cách sẽ giúp khôi phục sự ổn định cho quốc gia.\nĐể chấm dứt tình trạng hiện tại, hãy hoàn thành nghị trình §Y$council_agenda_origin_delusional_tyrant_name$§!."
 situation_paragon_origin_reformists_struggle_accept: "Kêu Gọi Đàm Phán"
 approach_situation_paragon_origin_reformists_struggle_accept_tt: "Việc tấn công thường dân là không thể chấp nhận được. Chúng ta sẽ tiến hành bằng biện pháp hòa bình, kêu gọi ngừng bắn và mời phe cải cách đến bàn đàm phán. Hy vọng điều này sẽ làm giảm đi nhu cầu bạo lực."
 approach_allow_tooltip_reformists_struggle_accept: "Phe cải cách sẽ không đời nào đàm phán với một kẻ bạo chúa."
 paragon_origin_hunt: "Thế Lực Phe Cải Cách"
 paragon_origin_reformists_killed: "Đợt Đầu Tiên Bị Tiêu Diệt"
 paragon_origin_reformists_alive: "Đợt Đàm Phán Đầu Tiên"
 situation_reformists_struggle_1: "Phe cải cách đang đè bẹp những tiền đồn phòng ngự yếu kém của ta, lực lượng bảo hoàng đang dốc hết sức để đẩy lùi chúng."
 situation_reformists_struggle_2: "Phe cải cách bắt đầu giành lợi thế trong một vài cuộc xung đột, nhưng ta vẫn đang nắm giữ chặt chẽ quyền lực."
 situation_reformists_struggle_3: "Chúng ta đang có đôi chút lợi thế trước quân nổi dậy, nhưng cán cân sức mạnh có thể nghiêng về bất kỳ bên nào."
 paragon_origin_reformists_struggle_monthly_change_tooltip: "Quân nổi dậy cải cách đang không ngừng quấy rối lực lượng an ninh trung thành."
 situation_paragon_origin_reformists_struggle_complete: "Bằng bất cứ giá nào, cuộc xung đột này phải dừng lại. Quyết định của chúng ta lúc này sẽ ảnh hưởng đến kết quả của các cuộc đàm phán trong tương lai."
 decision_paragon_origin_subdue_reformists: "Đột Kích Phe Cải Cách"
 decision_paragon_origin_subdue_reformists_desc: "Chủ nghĩa Dân chủ là một căn bệnh cần phải chữa trị. Lực lượng an ninh của chúng ta sẽ đột kích toàn bộ sào huyệt của phe cải cách. Thương vong dân sự là điều không thể tránh khỏi."
 decision_paragon_origin_subdue_reformists_tt: "Sẽ gỡ bỏ §G4§! điểm tiến độ của Tình thế §YYêu Cầu Của Phe Cải Cách§!.\nNếu hành tinh không có dân số mang tư tưởng Bình đẳng, có 50% cơ hội xóa bỏ biến số hiệu chỉnh §YXu Hướng Dân Chủ§! của hành tinh đó.\nĐiều này sẽ khiến §YĐặc Điểm Khai Sáng§! của §Y[owner.Ruler.GetTitle][owner.Ruler.GetRegnalName]§! bị §Rsuy giảm§!."
 council_agenda_origin_delusional_tyrant_name: "Nhổ Cỏ Tận Gốc"
 council_agenda_origin_delusional_tyrant_desc: "Bằng cách bắt giữ những kẻ cầm đầu trên phạm vi toàn quốc, ta có thể làm suy yếu thế lực phe cải cách, ép chúng phải đàm phán theo các điều kiện của ta."
 council_agenda_origin_delusional_tyrant_effect: "Kết thúc tình thế §YYêu Cầu Của Phe Cải Cách§! bằng việc bắt giữ những thủ lĩnh cốt cán."
 origin_delusional_tyrant_finish: "$council_agenda_origin_delusional_tyrant_name$$agenda_ref$"
 origin_delusional_tyrant_finish_desc: "$council_agenda_origin_delusional_tyrant_desc$"
 paragon.5064.name: "Dấu Hiệu Phản Quốc"
 paragon.5064.desc: "§Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! phát hiện một trong những chỉ huy của ta đang chống lại chính phủ! Cách xử lý thích đáng là tử hình ngay lập tức kẻ phản bội này, nhưng hiện tại bằng chứng vẫn chưa đủ thuyết phục."
 paragon.5064.a: "Chúng ta cần thêm bằng chứng."
 paragon.5064.b: "Tử hình kẻ phản bội!"
 paragon.5065.name: "Sào Huyệt Khủng Bố"
 paragon.5065.desc: "§Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! đã ra lệnh tiến hành một cuộc thanh trừng quy mô lớn trên một trong các hành tinh của chúng ta. Rõ ràng, có một căn cứ của phe cải cách ở đó, nhưng ta chưa nắm đủ bằng chứng. Chúng ta có chắc chắn muốn đẩy sinh mạng của những công dân trung thành vào vòng nguy hiểm chỉ vì một linh cảm không?"
 paragon.5065.a: "Hủy bỏ chiến dịch."
 paragon.5065.b: "Tiến hành chiến dịch."
 paragon.5070.name: "Phát Hiện Hải Tặc"
 paragon.5070.desc: "Một nhóm nhỏ phe cải cách đã nhập bọn với băng hải tặc địa phương. Dù không phải là mối đe dọa lớn, chúng vẫn có khả năng phá rối các hoạt động và thương mại của ta trong quân khu này."
 paragon.5071.name: "Viện Trợ Bên Ngoài"
 paragon.5071.desc: "Một công dân danh tiếng từ [event_target:friendly_nation] mong muốn được hỗ trợ chúng ta trong cuộc nội chiến. Họ không chỉ mang đến thiện chí mà còn kèm theo một lượng hợp kim làm viện trợ. Có vẻ họ muốn cải thiện quan hệ giữa đôi bên, nhưng §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! nghi ngờ đây chỉ là một màn kịch để thiết lập đường dây tiếp tế cho phe đối lập."
 paragon.5071.a: "Gửi lời cảm ơn."
 paragon.5071.b: "Đây là một cái bẫy!"
 paragon.5072.name: "Triệt Phá Sào Huyệt"
 paragon.5072.desc: "Cơ quan an ninh của chúng ta đã theo dõi và triệt phá thành công một sào huyệt của phe cải cách. Chiến dịch này thành công rực rỡ, tổn thất nhân sự ở mức tối thiểu và không có thương vong dân sự."
 paragon.5073.name: "Sào Huyệt Bị Đánh Bom"
 paragon.5073.desc: "Cơ quan an ninh của chúng ta đã bám đuôi được đến một sào huyệt của phe cải cách, nhưng chúng đã gài chất nổ trên toàn bộ khu nhà. Khi các đặc vụ vừa ập vào, chúng đã kích nổ quả bom, giết chết rất nhiều người."
 paragon.5074.name: "Xung Đột Đẫm Máu"
 paragon.5074.desc: "Chúng ta đã có một cuộc đọ súng ác liệt với phe cải cách, rất nhiều thường dân bị thương. Chúng ta đã cử lực lượng phản ứng nhanh để chăm sóc những người bị nạn."
 paragon.5075.name: "Cuộc Mít-tinh Bảo Hoàng"
 paragon.5075.desc: "Những người ủng hộ trung thành đã tổ chức một cuộc mít-tinh để lên tiếng bảo vệ §Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§!! Rõ ràng chúng ta đã giành được sự ủng hộ của dân chúng trong cuộc đấu tranh này!"
 paragon.5090.name: "Cuộc Mít-tinh Cải Cách"
 paragon.5090.desc: "Bộ phận tuyên truyền của phe cải cách đã phát động một chiến dịch phao tin đồn nhảm trên một hành tinh của ta. Lực lượng trung thành đang được đặt trong tình trạng báo động cao nhất để kiểm soát tình hình, nhưng hàng ngũ những người biểu tình vẫn tiếp tục phình to."
 paragon.5095.name: "Bắt Giữ Cải Cách"
 paragon.5095.desc: "Nhờ nỗ lực không mệt mỏi của Hội đồng, những tên cầm đầu phe cải cách đã bị tóm gọn. Giờ đây số phận chúng do §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! định đoạt. Nhưng mặt khác, chúng lại có rất đông người ủng hộ trong dân chúng, thế nên cách khôn ngoan nhất là đàm phán để đạt được một kết quả đôi bên cùng có lợi — dĩ nhiên là theo điều kiện của ta."
 paragon.5095.a: "Để xem chúng có điều kiện gì."
 paragon.5200.name: "Chuẩn Bị Đàm Phán"
 paragon.5200.desc: "Sau nhiều tháng xung đột, đã đến lúc giải quyết những bất đồng và thảo luận cách để kết thúc cuộc nổi loạn vô nghĩa này. §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! đã kêu gọi ngừng bắn và bước vào đàm phán với phe cải cách. Mọi hành động thù địch đã tạm ngưng, tất cả đều nín thở chờ đợi kết quả."
 paragon.5201.name: "Bài Diễn Văn Lớn"
 paragon.5201.desc: "$paragon.beginning.speech$\n\nĐồng bào [Owner.GetSpeciesNamePlural]! Hôm nay, tôi muốn mọi người biết rằng tôi đang vô cùng tự hào. Chúng ta đã gạt đi những khác biệt, sát cánh tiến vào cõi vô định như một dân tộc thống nhất, xây dựng nên những hành tinh mới, và đẩy trí tuệ của chúng ta vươn tới những tầm cao mới.\n\nTôi muốn gửi lời cảm ơn tới sự cống hiến của tất cả các bạn...\n\nTôi còn...\n\n§H§Y[Root.Owner.Ruler.GetTitle][Root.Owner.Ruler.GetRegnalName]§! đột nhiên lảo đảo và ngã khuỵu khỏi khung hình.§!"
 paragon.5201.a: "Chuyện gì vừa xảy ra vậy?"
 paragon.5202.name: "Sụp Đổ"
 paragon.5202.regular: "Tin tức lan nhanh khắp đất nước: §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! đang trong cơn nguy kịch. Nguyên nhân của căn bệnh lạ này vẫn còn là ẩn số, và có vẻ nó sẽ không sớm kết thúc.\n\nÍt nhất cho tới hiện tại, §Y[Ruler.GetRegnalName]§! vẫn tại vị trên danh nghĩa. Tuy nhiên, nếu muốn kéo dài mạng sống của nhà lãnh đạo, có lẽ chúng ta sẽ phải dùng tới những phương pháp phi truyền thống."
 paragon.5202.synth: "Tin tức lan nhanh khắp đất nước: Mạng lưới thần kinh của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! đang bị lỗi. Sự cố bí ẩn này đã làm bối rối cả những bộ não kiệt xuất nhất của ta, và có vẻ không thể khắc phục được trong một sớm một chiều.\n\nÍt nhất cho tới hiện tại, §Y[Ruler.GetRegnalName]§! vẫn tại vị trên danh nghĩa. Tuy nhiên, nếu muốn kéo dài chu kỳ hoạt động của nhà lãnh đạo, có lẽ chúng ta sẽ phải dùng tới những phương pháp phi truyền thống."
 paragon.5202.a: "Chắc chắn phải có cách nào đó khả thi."
 paragon.5202.a.tt: "§LChúng ta sẽ khám phá mọi phương thức khả thi để cứu sống [Ruler.GetName]§!"
 paragon.5202.b: "Hãy để [Ruler.GetTitle] được an nghỉ."
 paragon.5202.b.tooltip: "§Y[Ruler.GetTitle][Ruler.GetRegnalName]§! sẽ qua đời."
 paragon.5210.name: "Ngã Rẽ Của Số Phận"
 paragon.5210.desc: "Đã đến lúc để §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! một lần nữa cầm lái lèo lái đất nước. Được ban phước với những tố chất của một $leader_trait_legendary_leader$, [Ruler.GetName] vẫn vẹn nguyên vẻ oai nghiêm. Dù vậy, khi thế lực phe cải cách lớn mạnh và một cuộc nội chiến toàn diện chực chờ bùng nổ, [Ruler.GetTitle] đã phát đi lời kêu gọi đàm phán.\n\n[Ruler.GetName] báo cáo rằng không khí giai đoạn đầu của cuộc đàm phán vô cùng căng thẳng. Các đại biểu từ khắp nơi trong [Owner.GetName] liên tục đưa ra yêu sách của riêng họ trước khi lắng nghe tuyên bố chính thức từ [Ruler.GetTitle] của chúng ta - thứ vạch ra những nhượng bộ mà ta có thể chấp nhận."
 paragon.5210.a: "Chúng ta sẽ cho họ thứ họ muốn."
 paragon.5210.b: "Chúng ta sẽ không nhượng bộ."
 paragon.5210.b.tt: "Các hành tinh có biến số hiệu chỉnh §YXu Hướng Dân Chủ§! sẽ nổi loạn."
 paragon.5210.c: "Bọn chúng thật ngốc nghếch khi tin vào cuộc đàm phán này."
 paragon.5210.c.tt: "Mọi cá nhân mang tư tưởng Bình đẳng sẽ bị kết liễu!\n$paragon.leader.delusion.negative$"
 paragon.5210.d: "Đủ rồi! Lãnh đạo của chúng ta đã làm ta thất vọng!"
 paragon.5210.d.tt: "§Y[Ruler.GetTitle][Ruler.GetRegnalName]§! sẽ bị ám sát.\n§RQuốc gia sẽ bị chia cắt và chìm trong nội chiến.§!\n§LĐất nước đang lâm vào cảnh hỗn loạn. Cả dân tộc đang sục sôi ngọn lửa cách mạng. Lời kêu gọi của họ đã được lắng nghe. Mọi ách bạo chúa đều phải bị xóa sổ!§!"
 paragon.5210.e: "Chúng ta phải cai trị thiên hà, trị vì đơn độc!"
 paragon.5211.name: "Vì Chiến Thắng!"
 paragon.5211.desc: "Chúng ta đã phá tan gông cùm! Mọi thế lực áp bức và bạo chúa đều bị lật đổ. Dù chính chúng ta có thể là đốm lửa châm ngòi cho cuộc chiến này, nhưng tất cả những gì ta làm là vì lợi ích của nhân dân. Chúng ta chắc chắn sẽ chiến thắng mọi thứ!"
 paragon.5211.a: "Chúng ta chiến đấu để bảo vệ con đường của riêng mình!"
 paragon.5211.b: "Chúng ta chiến đấu để khai phá con đường mới!"
 paragon.5213.name: "Nội Chiến Kết Thúc"
 paragon.5213.desc: "Khi tàn tro của cuộc nội chiến đang lụi tàn, một xã hội mới vươn lên từ đống đổ nát, sẵn sàng mang ngọn lửa cách mạng lan tỏa khắp các vì sao."
 paragon.5213.a: "Chúng ta sẽ xây dựng lại mọi thứ đã bị phá hủy."
 paragon.5213.b: "Chúng ta phải bảo vệ xã hội của mình!"
 paragon.5213.c: "Cuộc nội chiến đã trui rèn chúng ta."
 paragon.5213.d: "Chúng ta phải ưu tiên phát triển hòa bình và thịnh vượng."
 paragon.5213.e: "Từ thảm họa này, chúng ta nhất định sẽ trưởng thành."
 paragon.5213.f: "Chúng ta phải tìm kiếm sự khai sáng."
 psionic.trait.b: "\nNgọn Hải Đăng Tâm Linh"
 psionic.trait.c: "\nBộ Điều Hòa Tinh Tú"
 psionic.trait.d: "\nCon Mắt Toàn Tri"
 psionic.trait.e: "\nThanh Âm Xuyên Não"
