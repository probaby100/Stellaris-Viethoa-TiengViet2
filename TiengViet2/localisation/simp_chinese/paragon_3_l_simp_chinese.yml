 cybernetic.trait.c: "\nThuốc Ức Chế Giấc Ngủ"
 cybernetic.trait.d: "\nGiao Diện Chiến Thuật"
 cybernetic.trait.e: "\nPhân Tích Ý Thức"
 synthetic.trait.b: "\nMạng Lưới Học Tập Dùng Chung"
 synthetic.trait.c: "\nHệ Thống Tính Toán Tác Chiến"
 synthetic.trait.d: "\nThuật Toán Tái Chế"
 synthetic.trait.e: "\nCơ Sở Dữ Liệu Kỹ Thuật Lớn"
 genetic.trait.b: "\nKích Thích Não Bộ"
 genetic.trait.c: "\nCắt Ghép Gen"
 genetic.trait.d: "\nSức Hấp Dẫn Không Thể Chối Từ"
