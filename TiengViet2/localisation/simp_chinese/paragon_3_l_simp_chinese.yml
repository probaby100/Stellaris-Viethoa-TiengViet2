 cybernetic.trait.a: "\nHiệu Chỉnh Xác Suất"
 psionic.trait.a: "\nCái Nhìn Khỏi Cõi Vô Định"
 paragon.have.utopia.ascensions: "\n§GDanh mục Thăng Thiên Chủng Tộc hiện đã được mở khóa.§!"
 paragon.5220.name: "Cuộc Thương Lượng Kết Thúc"
 paragon.5220.desc.peace: "Ngay trước thềm đàm phán, rõ ràng các bên đã mệt mỏi với chiến tranh và sẵn sàng đi tới một thỏa thuận. Dù chưa biết hệ quả lâu dài sẽ ra sao, nhưng hiện tại, chúng ta đã thống nhất."
 paragon.5220.a: "Chúng ta chắc chắn sẽ chiến thắng."
 paragon.5220.a.tt: "§LChúng ta sẽ phải giải quyết những bất đồng bằng vũ lực hoặc thông qua đàm phán. Từ giây phút này, chúng ta sẽ thực sự đoàn kết lại.§!"
 paragon.5221.name: "Nội Chiến"
 paragon.5220.desc.war: "Ngay trước thềm đàm phán, tình thế đã quá rõ ràng: các bên không thể tìm được tiếng nói chung. Ngay lúc này, quân nổi dậy đang tập hợp lực lượng, và chiến tranh đã bùng nổ. Một lần nữa, quốc gia của chúng ta lại chìm trong chia cắt."
 paragon.5221.a: "Chúng sẽ lần lượt thất bại."
 paragon.5221.a.tt: "Các hành tinh có biến số hiệu chỉnh §YXu Hướng Dân Chủ§! sẽ hình thành hạt nhân của một đế quốc nổi dậy."
 paragon.5222.name: "Hành Quyết"
 paragon.5222.desc: "Lời kêu gọi đàm phán là một cái bẫy hoàn hảo để tóm gọn các thủ lĩnh phe cải cách. Khi chúng gom lại một chỗ, việc cất vó dễ như lấy đồ trong túi. Chúng ta lấy được thông tin về sào huyệt, mạng lưới ngầm và tài sản của chúng mà không tốn một giọt mồ hôi. Phe đối lập còn sót lại cũng bị dễ dàng xử lý, không cần phải nhân nhượng và cũng không xảy ra cuộc nội chiến thảm khốc nào. Tất cả những kẻ cải cách đều bị kết án tử hình theo sắc lệnh của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!."
 paragon.5222.a: "Giờ không còn đường lùi nữa. Chỉ có thể tiến lên."
 paragon.5223.name: "Thống Nhất"
 paragon.5223.desc: "Khi tàn tro của cuộc nội chiến đang lụi tàn, một xã hội mới vươn lên từ đống đổ nát, sẵn sàng mang theo đốm lửa trí tuệ của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! lan tỏa khắp các vì sao."
 paragon.5223.a: "Quốc gia thống nhất, tương lai ngời sáng."
 paragon.5226.name: "Hành Tinh Hư Cảnh"
 paragon.5226.desc: "Sau khi hoàn tất giai đoạn đầu, các luồng năng lượng tâm linh cuộn xoáy đã phủ kín hành tinh, càn quét toàn bộ bề mặt. Mặc dù sự sống không còn tồn tại ở đó, nhưng những nhà ngoại cảm quyền năng nhất đã tề tựu để bảo vệ ngôi đền, nơi tổ chức giai đoạn tiếp theo của nghi thức. Giờ đây, việc cần làm chỉ còn là chuyển hóa năng lượng tâm linh từ những người tình nguyện sang cơ thể của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!. Việc này sẽ cường hóa đáng kể sức mạnh tâm linh cho §Y[Ruler.GetTitle]§! của chúng ta."
 paragon.5227.name: "Nghi Thức Tâm Linh"
 paragon.5227.desc: "Vật tế ban đầu: §R[ROOT.paragon_origin_ascension] công dân§!\nVật tế yêu cầu mỗi thập kỷ: §R[ROOT.paragon_origin_ascension] công dân§!\nNăng lực tâm linh đã chọn: §G[Paragon_Origin_Ascension_Focus][Paragon_Origin_Ascension_Trait1][Paragon_Origin_Ascension_Trait2][Paragon_Origin_Ascension_Trait3][Paragon_Origin_Ascension_Trait4]§!\n\nNhững nhà ngoại cảm hùng mạnh nhất của chúng ta đang cố gắng thuần hóa nguồn năng lượng cuồng bạo sinh ra từ việc hấp thụ cả một hành tinh. Hiện họ đang hội tụ những nguồn lực đó vào trung tâm của đền thờ, nơi các vật hiến tế đang chờ sẵn. Nghi thức sẽ sớm bắt đầu, năng lượng tâm linh từ những tình nguyện viên dũng cảm sẽ được rút ra và bơm vào cơ thể của §Y[Ruler.GetTitle]§!. Càng nhiều người hiến tế, sức mạnh tâm linh sẽ càng khủng khiếp — nhưng chúng ta phải cẩn thận không để vượt quá ngưỡng kiểm soát của §Y[Ruler.GetTitle]§!, bằng không sẽ phải đối mặt với một thảm họa tàn khốc.\n\nMột khi nghi thức khép lại, ta cần cung cấp một nguồn tình nguyện viên liên tục để giữ cho cơ thể của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! không bị năng lượng xé toạc."
 paragon.5227.a: "Cái Nhìn Khỏi Cõi Vô Định"
 paragon.5227.a.tt: "§L§Y[Ruler.GetTitle][Ruler.GetRegnalName]§! có thể sẽ thoáng thấy được những chiều không gian khác, hay thậm chí là các dòng thời gian khác, mở rộng thêm trí tuệ của [Ruler.GetHerHis].§!\n\nNhận ngẫu nhiên một §GĐặc điểm của Người cai trị§!"
 paragon.5227.b: "Ngọn Hải Đăng Tâm Linh"
 paragon.5227.b.tt: "§LLuồng năng lượng mật độ cao chảy dọc cơ thể §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!, nhưng một cơ thể bằng xương bằng thịt rất khó để cầm cự được, thay vào đó, nó tràn sang những người tình nguyện xung quanh, khuếch đại sức mạnh tâm linh của họ trước khi họ bị ngọn lửa Hư Cảnh nuốt chửng.§!\n\nNhóm ngoại cảm sẽ sử dụng Ngọn Hải Đăng Tâm Linh để kết nối với §Y[Ruler.GetTitle]§! và làm chủ sức mạnh này, cung cấp cho mọi phi thuyền thêm §G$MOD_SHIP_SHIELD_HP_ADD$§! và §G$MOD_SHIP_SHIELD_REGEN_ADD_PERC$§!."
 paragon.5227.c: "Bộ Điều Hòa Tinh Tú"
 paragon.5227.c.tt: "§LLuồng năng lượng mật độ cao chảy dọc cơ thể §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!, mài giũa đáng kể các giác quan.§!\n\nHoa tiêu tâm linh của ta sẽ dùng Bộ Điều Hòa Tinh Tú để kết nối với §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! và hút lấy năng lượng đó, tăng thêm §G$MOD_SHIP_SPEED_MULT$§! và §G$MOD_SHIP_DISENGAGE_CHANCE_MULT$§! cho tất cả phi thuyền."
 paragon.5227.d: "Con Mắt Toàn Tri"
 paragon.5227.d.tt: "§LLuồng năng lượng mật độ cao chảy dọc cơ thể §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!, làm thay đổi và biến dạng những đặc tính nguyên thủy của lớp da thịt này. Bất cứ khi nào ánh mắt sắc lẹm của [Ruler.GetHerHis] lướt qua những người phục vụ nghi lễ, thì rõ ràng, tâm trí và suy nghĩ của họ không còn là của riêng họ nữa.§!\n\n§Y[Ruler.GetRegnalName]§! có thể học cách làm chủ năng lực này, giúp cả đế quốc giảm §G$MOD_PLANET_CRIME_MULT$§! và tăng thêm §GMã Hóa§!."
 paragon.5227.e: "Thanh Âm Xuyên Não"
 paragon.5227.e.tt: "§LLuồng năng lượng mật độ cao chảy dọc cơ thể §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!, truyền cho dây thanh quản của [Ruler.GetHerHis] một sức mạnh tâm linh. Với các tình nguyện viên của chúng ta, giọng nói đó mang đầy sự thống khổ nhưng lại có sức thuyết phục mãnh liệt.§!\n\n§Y[Ruler.GetRegnalName]§! có thể học cách điều khiển sức mạnh này, tăng thêm §G$tile_resource_unity_add$§! và §G$MOD_POP_GOVERNMENT_ETHIC_ATTRACTION$§! cho toàn bộ đế quốc."
 paragon.5227.f: "Hoàn thành nghi thức!"
 paragon.5227.f.tt: "Thao tác này sẽ kết thúc nghi thức theo các tùy chọn đã chỉ định.$paragon.leader.delusion.positive$"
 paragon.5230.name: "Năng Lượng Tràn Trề"
 paragon.5230.desc: "Thử thách lần này đã thành công vang dội. Nhờ vào sự kiên cường bẩm sinh của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! và tiềm năng tâm linh phi thường của dân tộc, ta đã hồi sinh người thành công! Nhưng vẫn cần vài năm nữa trước khi có thể trao lại đế quốc cho vị cai trị hợp pháp."
 paragon.5236.name: "Trái Tim Hành Tinh"
 paragon.5236.desc: "Chúng ta đã lấy được lõi của hành tinh, xử lý và bọc nó trong một bộ khung lợi dụng Vật Chất Tối để sản sinh ra mức năng lượng khổng lồ so với kích thước thật. Giờ đây, ta có thể chế tạo những cơ thể cơ khí đặc biệt để cường hóa cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!, có lẽ còn có thể chữa lành cả cơ thể lẫn tâm trí của ngài, miễn là cung cấp thêm §YVật Chất Tối§! để giữ cho thiết bị vận hành ổn định. "
 paragon.5237.name: "Trái Tim Của $leader_trait_legendary_leader$"
 paragon.5237.desc: "Phí bảo trì nâng cấp: §RMỗi tháng [ROOT.paragon_origin_ascension] Vật Chất Tối§!\nCường hóa cơ khí đã chọn: §G[ROOT.Paragon_Origin_Ascension_Focus][Paragon_Origin_Ascension_Trait1][Paragon_Origin_Ascension_Trait2][Paragon_Origin_Ascension_Trait3][Paragon_Origin_Ascension_Trait4]§!\n\nNhà máy này được xây dựng chính xác là vì mục đích đó. Chẳng bao lâu nữa, nơi đây sẽ cho ra đời những bộ phận cơ khí tân tiến nhất lịch sử quốc gia, cấp nguồn sức mạnh cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! kính yêu. Càng quyết định cài đặt nhiều nâng cấp, ta càng phải bổ sung nhiều Vật Chất Tối mỗi tháng để duy trì nhịp đập cho trái tim. Tuy nhiên ta phải cẩn thận không làm quá tay, nếu không cơ thể có thể sẽ không chịu nổi tác dụng phụ của đợt nâng cấp này."
 paragon.5237.a: "Hiệu Chỉnh Xác Suất"
 paragon.5237.a.tt: "§L§Y[Ruler.GetTitle][Ruler.GetRegnalName]§! sẽ nhận được bản hiệu chỉnh xác suất cá nhân hóa, giúp người thấu hiểu sâu sắc hơn về cách lèo lái đế quốc.§!\n\nNhận ngẫu nhiên một §GĐặc điểm của Người cai trị§!"
 paragon.5237.b: "Máy Truyền Dữ Liệu Vĩnh Cửu"
 paragon.5237.b.tt: "§LViệc lắp đặt một máy truyền dữ liệu vĩnh cửu cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! có nghĩa là các mệnh lệnh hay diễn văn có thể được truyền tải tới công chúng một cách dễ dàng.§!\n\n§Y[Ruler.GetRegnalName]§! sẽ có được khả năng liên lạc tức thời với bất kỳ công dân nửa người nửa máy nào, nhờ đó tăng §G$MOD_POP_HAPPINESS$§! và §GSản lượng của Cyborg§!."
 paragon.5237.c: "Thuốc Ức Chế Giấc Ngủ"
 paragon.5237.c.tt: "§LLoại thuốc ức chế giấc ngủ đặc biệt này sẽ giúp §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! tốn ít thời gian nghỉ ngơi hơn, nhờ vậy tăng quỹ thời gian làm việc.§!\n\n§Y[Ruler.GetRegnalName]§! sẽ dễ dàng quản lý việc thực thi các chính sách của đế quốc hơn, qua đó tăng thêm §G$MOD_COUNTRY_EDICT_FUND_ADD$§! và giảm §G$mod_edicts_upkeep_mult$§!."
 paragon.5237.d: "Giao Diện Chiến Thuật"
 paragon.5237.d.tt: "§LGiao diện chiến thuật chuyên dụng giúp §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! điều khiển Lục quân từ khoảng cách hàng triệu năm ánh sáng mà không hề bị giảm hiệu năng.§!\n\n§Y[Ruler.GetRegnalName]§! sẽ trực tiếp chỉ huy Lục quân và vạch ra các hoạt động mặt đất tiềm năng, từ đó tăng §G$MOD_ARMY_HEALTH$§! và §G$MOD_ARMY_DAMAGE_MULT$§!."
 paragon.5237.e: "Phân Tích Ý Thức"
 paragon.5237.e.tt: "§LMáy phân tích ý thức được tinh chỉnh riêng cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! thông qua các mô cấy thu tín hiệu tương ứng sẽ kiểm soát mọi trận chiến ngoài không gian do phi công thực hiện tốt hơn.§!\n\n§Y[Ruler.GetRegnalName]§! sẽ tận dụng lượng kinh nghiệm đồ sộ của mình để giúp hạm đội ta cân chỉnh tác chiến, tăng §G$MOD_SHIP_ACCURACY_ADD$§! và §G$MOD_SHIP_TRACKING_ADD$§! cho mọi phi thuyền."
 paragon.5237.f: "Hoàn thành thao tác!"
 paragon.5237.f.tt: "Thao tác này sẽ kết thúc hành động theo các tùy chọn đã chỉ định.$paragon.leader.delusion.positive$"
 paragon.5240.name: "Thông Minh Hơn, Nhanh Hơn, Mạnh Hơn"
 paragon.5240.desc: "Chúng ta đã thực hiện thành công! Nguồn năng lượng mới cho mọi bộ phận cơ khí cường hóa đang vận hành ổn định và hiệu quả, cho phép §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! một lần nữa xuất hiện trước những người dân trung thành của mình."
 paragon.5246.name: "Khung Máy Trung Thành"
 paragon.5246.desc: "Chúng ta đã chế tạo thành công một khung cơ thể thích hợp và bộ não điện tử ưu việt nhất để chứa đựng ý thức của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!. Giờ đây, việc cần làm là quét não bộ của ngài, rồi tiến hành tải lên và tái lập trình."
 paragon.5247.name: "Lập Trình Ý Thức"
 paragon.5247.desc: "Phí bảo trì nâng cấp: §RMỗi tháng [ROOT.paragon_origin_ascension] Kim Loại Sống§!\nNâng cấp chương trình đã chọn: §G[ROOT.Paragon_Origin_Ascension_Focus][Paragon_Origin_Ascension_Trait1][Paragon_Origin_Ascension_Trait2][Paragon_Origin_Ascension_Trait3][Paragon_Origin_Ascension_Trait4]§!\n\nNhà máy gần như vắng bóng nhân công bằng xương bằng thịt, chỉ có vài nền tảng tri giác đang vận hành cỗ máy tinh vi này. Ý thức của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! đã được tải lên mạng lưới, sẵn sàng đón nhận những bản nâng cấp cần thiết. Chúng ta phải thận trọng, không được tái lập trình quá nhiều, bằng không sẽ đẩy năng lực điện toán yêu cầu lên một mức mà ngay cả thiết bị tối tân nhất mà ta tạo ra cũng không thể gánh vác nổi."
 paragon.5247.a: "Thuật Toán Tiên Tri"
 paragon.5247.a.tt: "§LTa sẽ cài đặt một thuật toán tiên tri đặc biệt cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! để người lèo lái đất nước xuất sắc hơn.§!\n\nNhận ngẫu nhiên một §GĐặc điểm của Người cai trị§!"
 paragon.5247.b: "Mạng Lưới Học Tập Dùng Chung"
 paragon.5247.b.tt: "§LThông qua việc triển khai mạng lưới học tập dùng chung trên toàn đế quốc, ta có thể để các vị chỉ huy khác hưởng lợi từ tri thức uyên bác của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!.§!\n\nĐiều này sẽ cải thiện khả năng học hỏi cho các chỉ huy khác, nhưng đồng thời tăng thêm §G$MOD_LEADER_SPECIES_EXP_GAIN$§! và §GPhí bảo trì Chỉ huy§!."
 paragon.5247.c: "Hệ Thống Tính Toán Tác Chiến"
 paragon.5247.c.tt: "§LViệc tính toán tác chiến chính xác đòi hỏi khả năng điện toán khổng lồ, nhưng với bộ não điện tử được lắp đặt cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!, hạm đội của ta có thể sẵn sàng tham chiến bất cứ lúc nào§!\n\nThao tác này sẽ cường hóa toàn bộ hạm đội, tăng thêm §G$MOD_SHIP_FIRE_RATE_MULT$§! và §G$MOD_SHIP_WEAPON_DAMAGE$§! cho mọi phi thuyền."
 paragon.5247.d: "Thuật Toán Tái Chế"
 paragon.5247.d.tt: "§LCài đặt một thuật toán tái chế chuyên dụng cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! sẽ giúp người có cái nhìn từ góc độ sản xuất bền vững, qua đó giảm thiểu những lãng phí tiềm ẩn.§!\n\nThao tác này sẽ cắt giảm tài nguyên tiêu hao vào các quận và công trình, giảm bớt §G$mod_planet_districts_upkeep_mult$§! và §G$mod_planet_buildings_upkeep_mult$§!."
 paragon.5247.e: "Cơ Sở Dữ Liệu Kỹ Thuật Lớn"
 paragon.5247.e.tt: "§LBằng việc tải toàn bộ dữ liệu từ các cơ sở dữ liệu kỹ thuật vào não bộ của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!, ta có thể mở rộng đáng kể kho tàng kiến thức công nghệ.§!\n\nHiệu suất sáng chế công nghệ của §Y[Ruler.GetRegnalName]§! giờ đây đã vượt xa trước kia, dẫn đến việc tăng điểm §G$mod_MACHINE_species_trait_points_add$§! và §G$mod_MACHINE_species_trait_picks_add$§!."
 paragon.5247.f: "Hoàn thành thao tác!"
 paragon.5247.f.tt: "Thao tác này sẽ kết thúc hành động theo các tùy chọn đã chỉ định.$paragon.leader.delusion.positive$"
 paragon.5250.name: "Linh Hồn Trong Cỗ Máy"
 paragon.5250.desc: "Xong xuôi, §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! hiện đã sở hữu một thân xác mới toanh cùng khả năng nhận thức được cường hóa mạnh mẽ, và giờ có thể quay lại tiếp tục gánh vác trọng trách của mình."
 paragon.5256.name: "Độ Tương Thích DNA"
 paragon.5256.desc: "Đội ngũ khoa học của ta đã xác định được một vài ứng cử viên mang mã gen khả thi có thể dùng để cường hóa cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!. Ngay khi liệu trình kết thúc, §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! sẽ không còn phải bận tâm đến những triệu chứng của tuổi già nữa. Trong tương lai, ta có lẽ sẽ tiến hành sửa đổi gen sâu hơn. Dĩ nhiên, việc nâng cấp chuỗi gen của nhà lãnh đạo sẽ yêu cầu nguồn vật liệu di truyền tươi mới."
 paragon.5257.name: "Điều Khiển Gen"
 paragon.5257.desc: "Vật hiến tế ban đầu: §R[ROOT.paragon_origin_ascension] cá thể tương thích gen§!\nVật tế yêu cầu mỗi thập kỷ: §R[ROOT.paragon_origin_ascension] công dân§!\nNăng lực di truyền đã chọn: §G[Paragon_Origin_Ascension_Focus][Paragon_Origin_Ascension_Trait1][Paragon_Origin_Ascension_Trait2][Paragon_Origin_Ascension_Trait3][Paragon_Origin_Ascension_Trait4]§!\n\nBồn tái tổ hợp gen chuyên dụng đã được chuẩn bị, và những nhà khoa học giỏi nhất đang trực tiếp giám sát ca phẫu thuật này.\n\nCác thủ lĩnh sở hữu gen tương thích sẽ bị dung giải để chiết xuất vật liệu di truyền. Sau đó, lượng DNA cụ thể của họ sẽ được truyền sang người §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!. Ta có thể dùng thêm những cá thể phù hợp để đẩy nhanh quá trình này, tạo ra các đột biến có kiểm soát nhằm giúp §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! nhanh chóng khôi phục thanh xuân, nhưng ta phải cẩn thận không để mọi việc đi quá xa."
 paragon.5257.a: "Phục Hồi DNA"
 paragon.5257.a.tt: "§LChúng ta có thể đảo ngược quá trình lão hóa. Việc trang bị một bộ脑 trẻ trung hơn cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! sẽ nâng cấp năng lực nhận thức của người. Hội tụ trí tuệ của kẻ dạn dày kinh nghiệm và sự mẫn tiệp của tuổi trẻ, không gì là không thể.§!\n\nNhận ngẫu nhiên một §GĐặc điểm của Người cai trị§!"
 paragon.5257.b: "Kích Thích Não Bộ"
 paragon.5257.b.tt: "§LĐối với trung tâm nhận thức của não bộ, thông thường cứ càng to thì càng tốt. Ta có thể kích thích sâu hơn sự phát triển vùng não của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!.§!\n\nNhờ sự cải thiện về độ tập trung và tư duy lý trí, §Y[Ruler.GetRegnalName]§! có thể giúp đỡ các nhà khoa học của ta trong nhiệm vụ nghiên cứu cõi vô định, tăng mức §G$MOD_LEADER_SPECIES_EXP_GAIN$§! và §G$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$§!."
 paragon.5257.c: "Cắt Ghép Gen"
 paragon.5257.c.tt: "§LVới công nghệ cắt ghép gen tiên tiến, giờ đây ta có thể chiết xuất những chuỗi gen chuyên biệt từ §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! để hiểu được điều gì đã làm nên sự kiệt xuất cho nhà lãnh đạo của chúng ta.§!\n\nÁp dụng lượng tri thức này vào các công dân bình thường sẽ mang lại những kết quả vô cùng giá trị, tăng mức §G$MOD_ARMY_HEALTH$§! và §GSản lượng của Tầng lớp Lao động§!."
 paragon.5257.d: "Sức Hấp Dẫn Không Thể Chối Từ"
 paragon.5257.d.tt: "§LChúng ta có thể dùng chất khuếch đại Pheromone và các sản phẩm làm đẹp để nhào nặn cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! một ngoại hình hoàn hảo không tì vết, khiến người khác khó bề cưỡng lại.§!\n\nĐối với người §Y[Owner.GetSpeciesName]§!, họ sẽ không thể nào kháng cự lại §Y[Ruler.GetRegnalName]§!. Phản ứng hóa học giữa nhà lãnh đạo và các thần dân sẽ tăng cường §G$MOD_COUNTRY_LEADER_CAP_ADD$§! cùng §G$MOD_FACTION_APPROVAL$§! trên quy mô toàn đế quốc."
 paragon.5257.e: "Phân Đa Não Bộ"
 paragon.5257.e.tt: "§LPhân chia các bộ phận của não bộ và nhào nặn chúng thành những khu vực hoạt động độc lập, điều này sẽ giúp §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! có thể một lúc chú tâm vào nhiều mục tiêu khác nhau.§!\n\nTa có thể dùng phương pháp tương tự để cải tạo thuyền viên cùng đội ngũ tham mưu, tăng cường độ §GHiệu quả Phòng thủ Điểm§! và §G$MOD_SHIP_EVASION_MULT$§! cho tất cả phi thuyền."
 paragon.5257.f: "Hoàn thành thao tác!"
 paragon.5257.f.tt: "Thao tác này sẽ kết thúc hành động theo các tùy chọn đã chỉ định.$paragon.leader.delusion.positive$"
 paragon.5260.name: "Đỉnh Cao Tiến Hóa"
 paragon.5260.desc: "Cuộc thử nghiệm đã chứng minh được tính hiệu quả phi thường, một phiên bản §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! vô cùng hoàn mỹ đã được khắc họa. Giờ đây, khi [Ruler.GetTitle] trở lại trước những tín đồ trung thành của mình, chúng ta có thể một lần nữa bước vào cuộc viễn chinh chinh phục các vì sao!"
 paragon.5265.name: "Mở Rộng Ý Thức"
 paragon.5265.desc: "Đánh đổi bằng một chút mất mát, ta đã thành công đẩy năng lực trị quốc của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! lên một mức không thể đong đếm. Câu hỏi đặt ra là: phẩm chất nào mới là quan trọng nhất đối với một nhà lãnh đạo xuất chúng? Điểm đột phá mới nên được định hướng theo ngả nào?"
 paragon.5265.a: "Tri thức"
 paragon.5265.a.tt: "§LTri thức là thứ tài sản tối thượng.§!"
 paragon.5265.b: "Thuần Khiết"
 paragon.5265.b.tt: "§LDù thế nào đi chăng nữa, chỉ một chủng tộc hoàn mỹ mới làm nên một quốc gia thuần khiết.§!"
 paragon.5265.c: "Dũng Mãnh"
 paragon.5265.c.tt: "§LChỉ có kẻ mạnh mới đủ sức cai trị một đất nước như của chúng ta.§!"
 paragon.5265.d: "Minh Triết"
 paragon.5265.d.tt: "§LKhông có sự minh triết, thì bao nhiêu tri thức trên đời cũng vô nghĩa.§!"
 paragon.5265.e: "Oai Nghiêm"
 paragon.5265.e.tt: "§LMột vị minh quân thiếu sức ảnh hưởng thì chẳng thể nào có được người ủng hộ.§!"
 paragon.5265.f: "Cởi Mở"
 paragon.5265.f.tt: "§LCàng bao dung với người ngoài có nghĩa là ta càng có thêm đồng minh kề vai sát cánh bảo vệ tổ quốc.§!"
 paragon.5265.g: "Tiết Chế"
 paragon.5265.g.tt: "§LSức mạnh thực sự nằm ở việc khuất phục kẻ thù mà chẳng tốn một binh một tốt.§!"
 paragon.5270.name: "Đế quốc Muôn năm!"
 paragon.5270.desc: "$paragon.beginning.speech$\n\nSống sót qua lằn ranh sinh tử, Vị Khai Sáng của chúng ta đã gửi gắm một bài diễn văn chan chứa niềm tin và sự biết ơn. Sau khi nói lời cảm tạ đến các công dân và những nhà khoa học đã biến kỳ tích này thành hiện thực, [Ruler.GetName] đã hướng về tương lai: [Ruler.GetSheHe] vươn lên mạnh mẽ hơn bao giờ hết, sẵn sàng một lần nữa cầm lái lèo lái đất nước huy hoàng của ta. Đồng lòng sát cánh, chúng ta đã đập tan bè lũ phản tặc và quân phiến loạn, đồng thời sẽ mang ánh vinh quang và sự phồn vinh đến từng công dân trên mọi nẻo hành tinh! Vinh quang thuộc về [Owner.GetName]! Vinh quang thuộc về người [Owner.GetSpeciesNamePlural]!\n\nĐồng thời cũng xin ngả mũ trước Vị Khai Sáng.\n\n$paragon.ending.speech$"
 paragon.5270.a: "Vinh quang!"
 paragon.5270.a.tt: "§LVinh quang thuộc về §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!! Vinh quang thuộc về §Y[Owner.GetName]§!! Vinh quang thuộc về §Y[Owner.GetSpeciesName]§!!§!"
 paragon.5270.b: "Đã đến lúc Vị Khai Sáng tái nắm giữ bánh lái!"
 #Góc Nhìn Của Người Cai Trị
 paragon.5305.name: "Tầm Nhìn Cải Tạo Môi Trường"
 paragon.5305.desc: "Ròng rã suốt những năm qua, nhờ vào những trí tuệ khoa học lỗi lạc, ta đã tạo dựng được một nền thịnh vượng và ổn định không đâu sánh bằng. Trong công cuộc săn lùng những vùng đất mới để định cư và phát triển, họ đã ấp ủ những dự án tưởng chừng bất khả thi dựa trên những kiến thức hiện hành về sinh học dị hành: đó là mang hệ động thực vật bản địa cấy vào môi trường ngoại lai, sau đó biến đổi khí hậu hành tinh trên quy mô lớn để biến nó thành một thế giới có thể sinh sống được.\n\nDù rằng lúc này ta khó lòng lặp lại kỳ tích đó do bản chất đặc thù của hành tinh vừa được cải tạo, nhưng nó lại mở ra tia sáng rằng, thuận theo thời gian, ta có thể từng bước hoàn thiện công nghệ này để áp dụng lên mọi tinh cầu.\n\nĐến khi ấy, chúng ta có thể chuyển hướng đầu tư sang các lĩnh vực khác."
 paragon.5310.name: "Tầm Nhìn Đóng Tàu"
 paragon.5310.desc: "Hạm đội chính là tấm khiên vững chãi bảo vệ tổ quốc. §Y[Root.Owner.Ruler.GetTitle]§! đã tuyên bố sẽ đóng mới một con tàu, được cấp vốn bởi ngân khố nhà nước, nhằm gia tăng sức mạnh hạm đội. Chiếc soái hạm này sẽ đưa chúng ta tiến vào kỷ nguyên huy hoàng, nghiền nát mọi kẻ thù dám ngáng đường! Chẳng bao lâu nữa, con tàu sẽ được hạ thủy, và chúng ta sẽ tổ chức lễ ăn mừng rầm rộ.\n\nBây giờ, chúng ta có thể chuyển dòng vốn sang các mảng khác để thúc đẩy đế quốc đi lên."
 paragon.5310.tt: "Một Tàu Tuần dương Thử nghiệm đã gia nhập hạm đội!"
 paragon.5315.name: "Đột Phá Công Nghệ"
 paragon.5315.desc: "Khoa học là chiếc chìa khóa để kiến tạo một tương lai tươi sáng và tốt đẹp hơn. Được tiếp thêm động lực mới, đội ngũ khoa học của ta đang liên tục tạo ra nhiều bước tiến nhảy vọt chưa từng thấy. Sự tiến bộ này đã lọt vào mắt xanh của §Y[Root.Owner.Ruler.GetTitle]§!, người đã đích thân trao tặng huân chương danh dự cho một số nhà khoa học xuất chúng.\n\nGiờ đây ta có thể tập trung nguồn lực bành trướng vào các lĩnh vực khác."
 paragon.5320.name: "Lấy Thân Làm Gương"
 paragon.5320.desc: "§Y[Root.Owner.Ruler.GetTitle]§! là tấm gương sáng cho toàn dân, lèo lái chúng ta vươn mình ra biển sao. Giữa thời đại được dẫn dắt bởi một nhà lãnh đạo sắt đá như vậy, các quan chức đều cảm thấy tự hào khi được cống hiến cho tổ quốc và không ngừng theo đuổi sự hoàn hảo.\n\nGiờ đây ta có thể dồn tâm huyết bành trướng sang các mặt trận khác."
 paragon.5325.name: "Trạm Không Gian Thử Nghiệm"
 paragon.5325.desc: "Các báo cáo về siêu dự án mới đã tác động sâu sắc đến niềm tin của công chúng. Sau khi hoàn tất bài toán chi phí, chúng ta đang cực kỳ háo hức chờ ngày hiện thực hóa kỳ quan kỹ thuật đáng kinh ngạc này.\n\nGiờ đây ta có thể chuyển hướng bành trướng vào những mũi nhọn khác."
 paragon.5330.name: "Kim Loại Sống"
 paragon.5330.desc: "Mặc dù những bước tiến về công nghệ và khoa học đã giúp ta khám phá ra vô vàn thứ, nhưng vẫn còn đó vô số chân trời mới cần học hỏi. Đội ngũ thăm dò vừa khai quật được một loại vật chất cực kỳ lạ lẫm, mang đặc tính của cả kim loại lẫn chất lỏng. Không những thế, loại vật chất này có vẻ như còn... sống. Ta vẫn chưa rõ làm thế nào để mổ xẻ hay tận dụng thứ vật liệu này, nhưng nó đã lập tức thu hút sự tò mò của tất cả mọi người.\n\nTrước khi đào sâu hơn về loại vật chất này, ta nên tập trung trí tuệ vào những chuyên ngành khác."
 paragon.5335.name: "Ngọn Nguồn Sức Mạnh"
 paragon.5335.desc: "Dù nền khoa học kỹ thuật của ta đã có những bước sải dài vĩ đại, nhưng vũ trụ vẫn cất giấu những bí mật không thể lường trước. Đội thám hiểm vừa phát hiện một vật chất với mật độ đặc khít, được suy đoán là một dạng Vật Chất Tối. Ở thời điểm hiện tại, ta vẫn chưa thể khẳng định được những ứng dụng tiềm năng của loại vật liệu mới này.\n\nCho tới lúc tìm được phương án thích hợp, ta nên tập trung công sức để vươn xa hơn trong những chuyên ngành khác."
 paragon.5340.name: "Thống Trị Kiệt Xuất"
 paragon.5340.desc: "Lễ kỷ niệm ngày con tàu vũ trụ đầu tiên bay vào không gian đã gắn kết người dân dưới một lý tưởng chung. Được tiếp lửa từ bài diễn văn của §Y[Root.Owner.Ruler.GetTitle]§!, toàn bộ giống loài [Root.Owner.GetSpeciesName] đang chung sức đồng lòng để biến thủ đô thiên hà mới của mình thành một ngọn hải đăng phồn vinh giữa vùng không gian lạnh lẽo.\n\nBây giờ, chúng ta có thể chuyển trọng tâm nỗ lực sang những lĩnh vực khác."
 paragon.5340.tt: "Cấp độ thăng thiên của Hành tinh Thủ đô tăng §G+1§!"
 paragon.5345.name: "Thiên Tài Sáng Chế"
 paragon.5345.desc: "Những đồn đoán về một cỗ máy thế hệ mới đang được truyền tai nhau, với khả năng tinh chế một lượng lớn hợp kim từ phế liệu. Thiết bị này hoạt động với hiệu suất khó tin, nhưng cha đẻ của nó lại đột ngột qua đời ngay sau buổi diện kiến §Y[Root.Owner.Ruler.GetTitle]§!. Giới kỹ sư cho rằng cỗ máy này là độc nhất vô nhị và không thể sao chép, do đó để đảm bảo lợi ích chung, ta đã đưa cỗ máy vào một cơ sở bảo mật nghiêm ngặt.\n\nBây giờ, chúng ta có thể tái phân bổ vốn liếng sang các mảng khác."
 paragon.5360.name: "Tầm Nhìn Thăm Dò"
 paragon.5360.desc: "Những nhà thăm dò của ta một lần nữa chứng minh được năng lực của họ. Báo cáo cho hay họ đã tình cờ tìm thấy một mỏ quặng ngầm ẩn chứa vô số loại tài nguyên dị thường. Một mặt ta có thể tiếp tục triển khai công việc, xác định bản chất và trữ lượng tiềm năng của các tài nguyên mới này; mặt khác, ta có thể rót tiền để thúc đẩy một hướng đi khác."
 paragon.5370.name: "Tầm Nhìn Căn Cứ Vành Đai Tinh Tú"
 paragon.5370.desc: "Những cuộc nghiên cứu ở quy mô khổng lồ nhắm vào hoạt động định cư và vận tải giữa không gian sâu thẳm đã gặt hái được rất nhiều quả ngọt. Những khối óc khoa học sáng giá nhất đang kề vai sát cánh với những kỹ sư tài ba nhất của ta. Họ đã đưa ra một khái niệm hoàn toàn mới: Vành đai Quỹ đạo; một cấu trúc không gian hình khuyên bao trọn lấy một hành tinh, đủ sức để gồng gánh những trung tâm công nghiệp hay dân sinh bên trên nó. Dù hiện tại có lẽ ta vẫn chưa tích lũy đủ tiềm lực công nghiệp để xây dựng một siêu công trình như thế, nhưng con đường phía trước đã quá rõ ràng. Cùng lúc đó, ta có thể dồn tâm huyết bành trướng vào nơi khác."
 paragon.5900.name: "Ánh Sáng Khai Minh Đã Vụt Tắt!"
 paragon.5900.desc: "Chẳng ai có thể sống mãi với thời gian. Suy cho cùng, tất cả đều bình đẳng trước cái chết. Hôm nay, $leader_trait_legendary_leader$ đã gắn kết tất cả chúng ta lại một lần cuối. Chúng ta chưa từng chứng kiến một tang lễ nào long trọng đến thế: những bài điếu văn hùng hồn, những lời thề cao cả, cùng dòng người đưa tiễn kéo dài vô tận. Trên khắp mọi miền lãnh thổ, thần dân thầm gửi lời tri ân vì những gì $leader_trait_legendary_leader$ đã cống hiến. Chẳng có vị minh quân nào là hoàn hảo, nhưng nhà lãnh đạo của chúng ta đã làm việc không biết mệt mỏi để vun đắp một tương lai tươi sáng hơn cho vạn dân.\n\nDù đã cố gắng giảm bớt những dư chấn mà sự kiện này có thể gây ra, nhưng tinh cầu mẹ của ta vẫn rơi vào tình thế rối ren."
 paragon.5900.desc.50years: "Chẳng ai có thể sống mãi với thời gian. Suy cho cùng, tất cả đều bình đẳng trước cái chết. Hôm nay, $leader_trait_legendary_leader$ đã gắn kết tất cả chúng ta lại một lần cuối. Chúng ta chưa từng chứng kiến một tang lễ nào long trọng đến thế: những bài điếu văn hùng hồn, những lời thề cao cả, cùng dòng người đưa tiễn kéo dài vô tận. Trên khắp mọi miền lãnh thổ, thần dân thầm gửi lời tri ân vì những gì $leader_trait_legendary_leader$ đã cống hiến. Chẳng có vị minh quân nào là hoàn hảo, nhưng nhà lãnh đạo của chúng ta đã làm việc không biết mệt mỏi để vun đắp một tương lai tươi sáng hơn cho vạn dân.\n\nDù đã chuẩn bị tinh thần đón nhận biến cố, sự ra đi của $leader_trait_legendary_leader$ vẫn đẩy ta vào thế lao đao, quằn quại trong nỗi đau thương tột cùng. Vượt qua mất mát này sẽ cần đến thời gian, nhưng nó cũng giúp ta trở nên kiên cường hơn."
 paragon.5900.desc.100years: "Chẳng ai có thể sống mãi với thời gian. Suy cho cùng, tất cả đều bình đẳng trước cái chết. Hôm nay, $leader_trait_legendary_leader$ đã gắn kết tất cả chúng ta lại một lần cuối. Chúng ta chưa từng chứng kiến một tang lễ nào long trọng đến thế: những bài điếu văn hùng hồn, những lời thề cao cả, cùng dòng người đưa tiễn kéo dài vô tận. Trên khắp mọi miền lãnh thổ, thần dân thầm gửi lời tri ân vì những gì $leader_trait_legendary_leader$ đã cống hiến. Chẳng có vị minh quân nào là hoàn hảo, nhưng nhà lãnh đạo của chúng ta đã làm việc không biết mệt mỏi để vun đắp một tương lai tươi sáng hơn cho vạn dân.\n\nNhờ vào sự chuẩn bị kỹ lưỡng trước sóng gió, ta sẽ tiếp tục tiến lên một cách vững chãi ngay cả khi $leader_trait_legendary_leader$ đã tạ thế. Vượt qua mất mát này sẽ cần chút thời gian, nhưng từ đó, ta sẽ trỗi dậy mạnh mẽ hơn bao giờ hết."
 paragon.5900.a: "Giờ chúng ta phải làm gì đây?!"
 paragon.5900.a.50years: "Một ngày đen tối trong lịch sử dân tộc."
 paragon.5900.a.100years: "Ta đã có sự chuẩn bị. Lần này, ta sẽ vượt qua chông gai."
 ###Các Sự Kiện Hồi Sinh Lãnh Đạo
 paragon.6000.name: "Cơ Hội Thứ Hai"
 paragon.6000.desc: "Sức khỏe của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! đang sụp đổ nhanh chóng, vì thế đội ngũ y tế đầu ngành của ta đã đề xuất một liệu pháp phi truyền thống. Ta sẽ dựng nên một thiết bị cực kỳ phức tạp ngay giữa phòng họp của Hội đồng. Để cỗ máy này thay thế phần lớn quá trình sinh lý của [Ruler.GetHerHis], ta có thể giữ cho người sống sót vô thời hạn."
 paragon.6000.desc.ap_mind_over_matter: "$paragon.6000.desc$\n\n[GetPsychicNounPlural] của chúng ta cũng đã đưa ra một đối sách. Bằng cách dẫn dắt [GetSorrow] của đại chúng, ta có thể thao túng quyền năng vô hạn của Hư Cảnh để [GetRejuvenate] nhà lãnh đạo đang hấp hối của ta. Chỉ phải trả một cái giá nhỏ, §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! có thể được ban cho sự sống vĩnh hằng."
 paragon.6000.desc.ap_the_flesh_is_weak: "$paragon.6000.desc$\n\nCác chuyên gia điều khiển học cơ khí của chúng ta đã trình bày một kế hoạch tuyệt vời... Chỉ cần dùng những mô cấy tối tân nhất, ta có thể phẫu thuật thay thế toàn bộ mô sinh học đang héo mòn bên trong người lãnh đạo, và §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! sẽ sống mãi với thời gian."
 paragon.6000.desc.ap_synthetic_evolution: "Các kỹ sư robot của ta đã vạch ra một kế hoạch để phục hồi §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!: Dù sẽ ngốn một khoản ngân sách không nhỏ, nhưng ta có thể chuyển tải ý thức của ngài sang một mạng lưới thần kinh điện tử tự phục hồi hoàn toàn mới. Bằng cách kết nối với tất thảy mọi người, ta có thể đưa năng lực của người lãnh đạo lên một tầm cao không tưởng."
 paragon.6000.desc.ap_engineered_evolution: "\"$paragon.6000.desc$\n\nHay một cách khác, đội ngũ chuyên gia di truyền đã vạch ra một giải pháp. Dù tốn kém, nhưng việc dùng các bản sao vô tận để lưu trữ §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! sẽ giúp [Ruler.GetHimHer] có được sự bất tử."
 paragon.6000.a: "Chế tạo cỗ máy."
 paragon.6000.a.tooltip: "Chúng ta sẽ chế tạo cỗ máy dành riêng cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!, biến [Ruler.GetHimHer] trở thành bất tử, đánh đổi lại là người sẽ bị giam cầm vĩnh viễn trong cung điện."
 paragon.6000.b: "Chuẩn bị nâng cấp."
 paragon.6000.b.tooltip: "Đội ngũ điều khiển học cơ khí sẽ trang bị các cấu kiện kéo dài sự sống tối tân nhất cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!."
 paragon.6000.c.tooltip: "Các [GetPsychicNounPlural] sẽ tổ chức một nghi thức để trao sự sống vĩnh hằng cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!."
 paragon.6000.c: "Chuẩn bị Zro, sẵn sàng phi thăng."
 paragon.6000.d: "Chuẩn bị cho kỳ quan tổng hợp này."
 paragon.6000.d.tooltip: "Các kỹ sư robot sẽ tạo ra những bộ khung cơ thể tổng hợp tối tân nhất để níu giữ sinh mạng cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!."
 paragon.6000.e: "Chuẩn bị buồng nhân bản."
 paragon.6000.e.tooltip: "Các chuyên gia di truyền sẽ nuôi cấy các bản sao để kéo dài sự sống cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!."
 paragon.6000.f_common: "Thế này là đi quá giới hạn rồi, hãy để [Ruler.GetHimHer]"
 paragon.6000.f.default: "$paragon.6000.f_common$ được an nghỉ."
 paragon.6000.f.machine: "$paragon.6000.f_common$ được tắt máy."
 paragon.6000.f.common_tooltip: "Cái giá để biến đổi Vị Khai Sáng của ta là quá chát. Hãy để [Ruler.GetHimHer]"
 paragon.6000.f.tooltip.default: "$paragon.6000.f.common_tooltip$ ra đi trong phẩm giá."
 paragon.6000.f.tooltip.machine: "$paragon.6000.f.common_tooltip$ được ngắt nguồn."
 paragon.6005.name: "Sinh Khí Đế Quốc"
 paragon.6005.desc: "Quá trình này diễn ra vô cùng dai dẳng và chông gai. Chắc hẳn nó cũng mang đến sự thống khổ tột cùng cho §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!. Thế nhưng kết quả thì khỏi phải bàn: từ khi yên vị trong cỗ máy kia, căn bệnh quái ác của người cai trị đã hoàn toàn tan biến.\n\nDù vui mừng vì ngài đã bình phục, nhưng những người thân cận [Ruler.GetHimHer] lại nhận thấy những đổi thay tinh tế trong cảm xúc và hành vi của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§!.\n\nGiờ đây nhà lãnh đạo của ta sẽ không thể rời khỏi cung điện nửa bước, dù rằng ta luôn dự phòng kế hoạch sơ tán cỗ máy phòng khi thủ đô lọt vào tay giặc."
 paragon.6005.a: "Chào mừng ngài trở lại, [Ruler.GetName]."
 paragon.6010.name: "Nâng Cấp Hoàn Tất"
 paragon.6010.desc: "Công trình đã thành công! §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! đã được mang về từ cõi chết.\n\nCó lẽ bởi việc một phần cơ thể đồ sộ đã bị quy trình này biến đổi, cái nhìn của [Ruler.GetHisHer] về công nghệ cơ khí cũng xoay chuyển theo. Nếu khi xưa nó chỉ là một món công cụ đơn thuần, thì nay ngài coi nó là con đường tối thượng vươn tới sự hoàn mỹ.\n\nNhà lãnh đạo của chúng ta đã về đây. Nhưng liệu ngài có còn là ngài của hôm qua hay không thì vẫn chưa thể rõ."
 paragon.6010.a: "[Ruler.GetName] và hành trình nâng cấp không hồi kết."
 paragon.6015.name: "Bơm Năng Lượng Tâm Linh"
 paragon.6015.desc_1: "Chúng ta đã làm được rồi. Nhờ vào quyền năng của §HHư Cảnh§!, §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! đã sống sót. Với một luồng năng lượng tâm linh uy hoàng cuộn chảy bên trong cơ thể, [Ruler.GetHeShe] đã đạt tới cảnh giới bất tử."
 paragon.6015.desc_2.organic: "Dù vậy, những chuỗi ngày vật lộn dường như đã thay đổi [Ruler.GetHimHer] một cách tinh tế... Những người hầu cận thì thầm to nhỏ rằng dường như có hai linh hồn hoàn toàn tách biệt đang trú ngụ trong cơ thể đó. Có vẻ nguồn sức mạnh Hư Cảnh này đang neo giữ mạng sống cho Vị Khai Sáng bằng một cái giá tàn khốc và bào mòn hơn những gì ta mường tượng."
 paragon.6015.desc_2.machine: "Tuy nhiên, biến cố sinh tử này khiến các thông số của [Ruler.GetHimHer] trồi sụt ngoài sức tưởng tượng của ta. Kết quả chẩn đoán cho thấy có hàng loạt hàm logic xung đột đang đồng loạt vận hành bên trong các hệ thống phụ. Có vẻ nguồn năng lượng Hư Cảnh dù cứu được Vị Khai Sáng, nhưng nó lại ăn mòn hệ thống hệ thống của ngài nặng nề hơn ta dự liệu."
 paragon.6015.desc_3: "Nhưng mọi thứ đó đều có thể gác lại sau. Vấn đề nhức nhối hiện tại là phải làm sao giữ cho nguồn cung Zro không bị đứt đoạn; nếu nguồn cung cạn kiệt, nhà lãnh đạo của chúng ta sẽ ra đi mãi mãi."
 paragon.6015.a: "Sự thức tỉnh lần nữa, [Ruler.GetName]."
 paragon.6020.name: "Mở Rộng Cơ Thể Tổng Hợp"
 paragon.6020.desc: "Thành công rồi! Ý thức của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! đã được chuyển giao vào một cơ thể cơ khí mới. Bộ xử lý lượng tử giúp [Ruler.GetHimHer] kết nối ngay lập tức với bất cứ một cá thể Người Tổng hợp nào.\n\nÝ thức siêu phàm này bắt đầu thay đổi nhân sinh quan của người lãnh đạo. Giờ đây [Ruler.GetSheHe] tập trung vào hệ thống vi mô, với mục tiêu đẩy nhanh toàn diện hiệu suất của nền văn minh ta."
 paragon.6020.a: "[Ruler.GetName] đã đi vào trực tuyến."
 paragon.6025.name: "Thân Xác Hoàn Mỹ"
 paragon.6025.desc: "Các thủ tục nhân bản và phẫu thuật đã thành công mỹ mãn. Lãnh đạo của chúng ta đã được cứu sống.\n\nTuy nhiên, nhiều người đang tỏ rõ sự lo lắng trước những thay đổi đến khó đoán trong thái độ của [Ruler.GetHisHer]. §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! đắm chìm trong cơ thể mới, ngài bắt đầu ám ảnh về giai đoạn tiến hóa kế tiếp của dân tộc. [Ruler.GetSheHe] tung ra những nguồn lực đồ sộ hòng hoàn thiện bộ gen của mọi công dân."
 paragon.6025.a: "[Ruler.GetName] hiện đã là một nguyên thể di truyền hoàn hảo."
 paragon.6030.name: "Thiếu Hụt Zro"
 paragon.6030.desc_common: "Kho dự trữ Zro của ta đã cạn kiệt. Trừ phi ta xoay xở bổ sung được càng sớm càng tốt"
 paragon.6030.desc.organic: "$paragon.6030.desc_common$, bằng không ý thức của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! sẽ mãi mãi trôi dạt vào màn đêm của Hư Cảnh."
 paragon.6030.desc.machine: "$paragon.6030.desc_common$, bằng không Hư Cảnh sẽ khiến bộ xử lý của §Y[Ruler.GetTitle][Ruler.GetRegnalName]§! quá tải và phát nổ."
 paragon.6030.a: "Liên hệ nhà cung cấp Zro."
 paragon.6030.b: "[Ruler.GetName] sẽ từ trần."
 paragon.6035.name: "Kỷ Nguyên Mới"
 paragon.6035.desc: "Không lâu sau khi hồi phục nhờ cuộc phẫu thuật, một ngày hội linh đình đã diễn ra tại [capital_scope.GetName]. $leader_trait_legendary_leader$ gửi gắm đôi dòng, cảm tạ người dân cùng giới khoa học, sau đó [Ruler.GetName] hé lộ cho họ về một tương lai tươi đẹp, thịnh vượng mà ngài đang vạch ra cho §Y[Owner.GetName]§!."
 paragon.6035.a: "$leader_trait_legendary_leader$ bất tử nên tiếp tục dẫn dắt chúng ta."
 paragon.6035.b: "Chúng ta sẽ cải cách chính quyền vì nhân dân."
 paragon.6035.b.tt: "Chính quyền sẽ có một cuộc cải cách. $leader_trait_legendary_leader$ sẽ tiếp tục phò tá và dẫn dắt chúng ta, nhưng giờ đây quyền lựa chọn người đứng đầu được trao về tay công chúng."
 ###Các Đặc Điểm
 leader_trait_the_apparatus_luminary: "Giam Cầm Trong Cỗ Máy"
 leader_trait_the_apparatus_luminary_desc: "Sự bất tử, nhưng đánh đổi bằng cái giá nào? Vị lãnh đạo này đã bị giam lỏng bên trong một hệ thống duy trì sự sống cồng kềnh, án ngự ngay giữa phòng họp của Hội đồng."
 leader_trait_the_cybernetic_luminary: "Nâng Cấp Vô Tận"
 leader_trait_the_cybernetic_luminary_desc: "Sự trường sinh là hoàn toàn khả thi. Bằng một loạt những lần nâng cấp tối tân, vị lãnh đạo này có thể đồng bộ hóa trực tiếp với mọi quan chức bán cơ khí cấp cao. Tuy vậy, nó lại bóp nghẹt khả năng học hỏi độc lập của họ."
 leader_trait_the_psionic_luminary: "Kẻ Đi Mượn Hư Cảnh"
 leader_trait_the_psionic_luminary_desc: "Cái giá cho sự bất tử là quá cao... Thực thể Hư Cảnh đã lén chừa lại một cửa sau đi vào ý thức của nhà lãnh đạo. Thực thể này nay đã đặt một chân bước vào thế giới thực của chúng ta, và nhà lãnh đạo phải cần một nguồn cung Zro ổn định để giữ mạng."
 leader_trait_the_synth_luminary: "Thức Tỉnh Cơ Khí"
 leader_trait_the_synth_luminary_desc: "Cơ thể cơ khí này là kết tinh từ kỹ thuật điêu luyện của các chuyên gia robot học. Bộ xử lý lượng tử giúp họ kết nối trực tiếp với siêu liên kết của toàn dân. Mặc dù giúp tăng vọt hiệu năng, nhưng nó lại chẳng đem lại mấy điều tốt đẹp cho những kẻ bị điều chỉnh."
 leader_trait_the_genetic_luminary: "Gen Hoàn Hảo"
 leader_trait_the_genetic_luminary_desc: "Những bản sao nhân bản kéo dài vô tận đem đến cho nhà lãnh đạo một sự sống vĩnh hằng. Cứ hễ lớp da thịt này tàn phai hay hư hỏng, sẽ có hàng chục vỏ bọc khác sẵn sàng làm người thay thế. Điều này đã dấy lên sự ám ảnh điên cuồng về bộ gen hoàn hảo."
