l_simp_chinese:
 #Mô tả Lãnh đạo Tùy chỉnh
 skrand_desc: "Dù quá khứ đè nặng trên vai, Skrand không bao giờ ngừng hướng về tương lai, khám phá những thế giới chưa biết với sự nhiệt huyết và tò mò. Ông đã trang trọng thề sẽ thực hiện trọn vẹn lời hứa của mình."
 EXP_PENALTY_OVER_LEADER_CAP: "Vượt mức giới hạn lãnh đạo sẽ làm giảm lượng kinh nghiệm nhận được theo cấp số nhân: $MULT$"
 #Sự kiện Chính sách Oanh tạc Quỹ đạo
 action.600.name: "Cái chết từ trên cao"
 action.600.desc: "Cuộc oanh tạc quỹ đạo của §H[From.GetName]§! đã làm nổ ra những tranh luận trong nội các về việc chúng ta nên phản ứng ra sao nếu phải đối mặt với viễn cảnh đầu hàng."
 action.600.A: "Không chấp nhận đầu hàng."
 action.600.B: "Cho phép họ đầu hàng."
 #Các Lãnh đạo Nổi danh
 tech_xeno_linguistics: "Ngôn ngữ học ngoại lai"
 tech_xeno_linguistics_desc: "Với những lần tiếp xúc gần đây cùng các giống loài có trí tuệ, việc nâng cao khả năng ngôn ngữ học ngoại lai của chúng ta là vô cùng quan trọng."
 tech_xeno_linguistics_effect: "Mang lại một lượng nhỏ $r_influence$\nCó thể xuất hiện các §HLãnh đạo nổi danh§!."
 paragon_2.2105.name: "Cá nhân xuất chúng"
 paragon_2.2105.desc_01: "Chúng ta đã chứng minh được một điều không thể chối cãi rằng dải ngân hà tràn ngập sự sống. Ngoài các giống loài và quốc gia thống trị, còn có vô số những hành tinh khác. Những cá nhân kiệt xuất có thể thỉnh thoảng xuất hiện, làm rung chuyển nền tảng của các thế lực kiểm soát ngân hà.\n\nNếu chúng ta có thể nắm bắt được tham vọng của họ, những lãnh đạo nổi danh này có thể sẵn sàng chung tay góp sức cho mục tiêu của chúng ta."
 paragon_2.2105.desc_02: "Chúng ta đã chứng minh được một điều không thể chối cãi rằng dải ngân hà tràn ngập sự sống. Ngoài các giống loài và quốc gia thống trị, còn có vô số những hành tinh khác. Những cá nhân kiệt xuất có thể thỉnh thoảng xuất hiện, làm rung chuyển nền tảng của các thế lực kiểm soát ngân hà.\n\nMặc dù cách hành xử của những người ngoài hành tinh này có thể khá kỳ quái hoặc thậm chí đáng ghét, nhưng chỉ cần tận dụng được tài năng của những §HLãnh đạo nổi danh§! này, họ có thể sẽ giúp ích cho mục tiêu của chúng ta."
 paragon_2.2105.a: "Phát đi lời kêu gọi."
 paragon_2.2105.b: "Dù sao thì họ cũng có thể hữu dụng... tạm thời là vậy."
 paragon_2.2105.tt: "Từ bây giờ, có thể sẽ có các §HLãnh đạo nổi danh§! liên lạc với chúng ta."
 sm_recruitment_office: "Văn phòng Tuyển dụng Liên sao"
 sm_recruitment_office_desc: "Các nhà ngôn ngữ học, thợ săn tiền thưởng và những người đi tiên phong, họ cùng nhau hợp tác, lùng sục khắp mọi ngóc ngách của các hệ sao đã biết để tìm kiếm những tài năng xuất chúng. Tại đây, chúng ta có thể chiêu mộ các lãnh đạo nổi danh để phục vụ cho mục đích của mình.\n\nGiới hạn của đế chế: §Y1§!"
 sm_recruitment_office_tooltip: "Hiệu ứng Đế chế\n$t$$MOD_COUNTRY_EXTERNAL_LEADER_POOL_SIZE$: §G+1§!\n$t$Kinh nghiệm lãnh đạo nhận được: §G+10%§!\n$t$Tăng tỷ lệ các §HLãnh đạo nổi danh§! liên hệ với chúng ta."
 HIRE: "Chiêu mộ"
 HIRE.tt: "Hãy cống hiến cho đế chế của chúng ta."
 DECLINE: "Từ chối"
 DECLINE.tt: "Nghĩ lại thì, chúng ta không cần ngươi."
 CLASS: "Lớp"
 ETHIC: "Tư tưởng"
 leader_trait_gorky: "Trợ lý AI "Gorky""
 leader_trait_gorky_desc: "Người trợ lý nhỏ này có thể giúp sắp xếp và phân tích dữ liệu. Trí tuệ nhân tạo của nó là sự kết hợp độc đáo giữa robot nghiên cứu và robot đồng hành."
 LYSANDER_FLEET_NAME: "Hạm đội Tư lậu"
 NAME_xenophile1: "Lysator Syng"
 xenophile1: "Một tay hải tặc dày dạn kinh nghiệm, cùng với một thủy thủ đoàn kỳ quặc mà [Root.GetHisHer] đã chiêu mộ từ mọi ngóc ngách của dải ngân hà."
 NAME_xenophile2: "Nona"
 xenophile2: "Một nhà thám hiểm đã đi qua nhiều nơi, có hiểu biết sâu sắc về vô số nền văn hóa ngoại lai. Niềm đam mê với thương mại và lợi nhuận của cô cũng lớn không kém gì những khám phá khoa học."
 NAME_militarist1: "Nam tước Vyctor Jariden"
 militarist1: "Một nhà quý tộc đã được tôi luyện qua khói lửa chiến tranh, người đã mất đi hạm đội và gia tộc của [Root.GetHisHer] trước một kẻ thù áp đảo."
 NAME_militarist2: "Gia'Zumon"
 militarist2: "Một chiến binh sắc sảo, vào sinh ra tử. [Root.GetHeSheCap] coi chiến tranh như mạng sống và chiến trường như quê hương."
 NAME_xenophobe1: "Kỹ nghệ gia Shuladun"
 xenophobe1: "Một nhà công nghiệp hoang tưởng và luôn thích một mình. [Root.GetHeSheCap] dành phần lớn thời gian tại các nhà máy và lò đúc của [Root.GetHisHer] để tìm kiếm sự tối ưu."
 NAME_xenophobe2: "Aturion"
 xenophobe2: "Một robot chiến thuật từ một nền văn minh đã sụp đổ. Nó bị ám ảnh bởi trật tự và cấu trúc, luôn cố gắng tạo ra một xã hội hoàn hảo."
 NAME_egalitarian1: "Jynn"
 egalitarian1: "Một chiến binh kiên cường của Giáo phái Cân bằng Tuyệt đối. Được nâng cấp bằng công nghệ cấy ghép và sinh hóa, [Root.GetFirstName] thề sẽ đập tan mọi sự bạo tàn trong dải ngân hà."
 NAME_egalitarian2: "Zosira K'Tun"
 egalitarian2: "Một nhà khoa học đầy sáng tạo và khiếu hài hước, cùng với một trợ lý robot nhỏ bé thân thiện, "Gorky". [Root.GetHeSheCap] muốn chia sẻ kiến thức của [Root.GetHisHer] để cải thiện cuộc sống của những người xung quanh."
 NAME_materialist1: "Xondar"
 materialist1: "Một chỉ huy hạm đội đã đạt được sự bất tử nhờ cơ thể tổng hợp. Tâm trí của [Root.GetHisHerCap] được liên kết trực tiếp với các con tàu dưới quyền chỉ huy của [Root.GetHimHer]."
 NAME_materialist2: "Borin"
 materialist2: "Một người thu gom phế liệu đã rời bỏ thành bang của mình, [Root.GetFirstName] là một thợ máy vô song, gần như mọi sự cố đều có thể được giải quyết dễ dàng qua bàn tay của [Root.GetHisHer]."
 NAME_pacifist1: "Thẩm phán Uld Dagr"
 pacifist1: "Một thẩm phán đã nghỉ hưu, thề sẽ tiếp tục chiến đấu vì công lý."
 NAME_pacifist2: "Vas Hào Nhoáng"
 pacifist2: "Một nhà ngoại giao cực kỳ lôi cuốn, lớn lên trong Hội Chị em của Hành tinh Từ Thạch Alyssum. [Root.GetHeShe] chiến đấu cho hòa bình, thông qua mưu trí và đàm phán của [Root.GetHisHer] để đạt được mục tiêu."
 NAME_authoritarian1: "Kai-Sha"
 authoritarian1: "Một tay buôn tin tức với mối quan hệ rộng lớn, có mạng lưới trải khắp ngân hà."
 NAME_authoritarian2: "Quản đốc Q'la-Minder"
 authoritarian2: "Một kẻ giám sát tham lam, khúm núm trước những kẻ có quyền và bóc lột, làm nhục những người có địa vị thấp kém. Sự thông minh và tàn nhẫn của [Root.GetHisHerCap] lại mang đến những kết quả phi thường."
 NAME_spiritualist1: "Ulastar"
 spiritualist1: "Một nhà thần bí lang thang, trí tuệ của [Root.GetHimHer] luôn chạm đến những người xung quanh."
 NAME_spiritualist2: "Nasuz Demetor"
 spiritualist2: "Một nhà lưu trữ thu thập kiến thức từ các nền văn minh đã mất. [Root.GetHeSheCap] khai quật những kỳ quan cổ đại trên các hành tinh chết và tìm kiếm di vật trong những con tàu bỏ hoang trôi dạt giữa các vì sao."
 custom_mercenary_admiral_desc: "Một chiến binh lính đánh thuê máu lạnh, luôn theo đuổi vinh quang và danh vọng trên chiến trường."
 paragon.40100.name: "$NAME_xenophile1$"
 paragon.40100.desc: "§HQuét nhận diện khuôn mặt xác nhận cá nhân này là Lysator Syng, một tên cướp biển đang bị truy nã. Hắn ta mỉm cười xảo quyệt, gật đầu lịch sự.§!\n\nChào, tôi là Thuyền trưởng Lysator. Tôi đến đây để bàn chuyện hợp tác.\n\nTôi đang chỉ huy ba con tàu và một đám thủy thủ rách rưới bị ruồng bỏ. Cho đến nay, chúng tôi chỉ phục vụ... chính bản thân mình. Nói cách khác, thời thế đã thay đổi, và chúng tôi đã sẵn sàng tham gia vào một mục tiêu lớn hơn. Nếu các người tha thứ cho những tội lỗi trước kia của chúng tôi và cho chúng tôi một bến đỗ an toàn trong lãnh thổ của các người, chúng tôi sẽ phục vụ các người.\n\nCác người thấy sao? Có muốn ký hợp đồng không?"
 paragon.40100.a: "Chúng ta cần một tên cướp biển để làm gì?"
 paragon.40100.a.response: "À, nói về điều đó, tôi thích tự gọi mình là lính đánh thuê tư lậu hơn. Có những thứ các người không thể học được ở trường lớp đâu. Chuyên môn của tôi là nắm bắt thời cơ: khi nào nên tấn công, khi nào nên rút lui, ném mồi nhử nào trước mặt kẻ thù, vân vân. Chúng tôi đánh vào chỗ yếu nhất, rồi chuồn đi với chiến lợi phẩm trước khi bất cứ ai nhận ra chuyện gì đang xảy ra."
 paragon.40100.b: "Tại sao các ngươi lại muốn gia nhập với chúng ta?"
 paragon.40100.b.response: "Thủy thủ đoàn của tôi đã chán ngấy cảnh chạy trốn và muốn tìm một bến đỗ an toàn. Đế chế của các người có vẻ đủ cởi mở để tiếp nhận một nhóm những kẻ bị ruồng bỏ. Cuộc đời cướp biển cũng lấy đi của chúng tôi rất nhiều thứ, nhưng chúng tôi chưa định ổn định ngay, và một người bảo trợ mạnh mẽ như các người chắc chắn sẽ giúp giảm bớt gánh nặng cho chúng tôi."
 paragon.40100.c: "Dựa vào đâu mà chúng ta phải tin ngươi?"
 paragon.40100.c.response: "Chẳng dựa vào đâu cả, chỉ bằng lời nói của một kẻ thấp hèn như tôi thôi. Nếu điều đó chưa đủ thì đành tạm biệt vậy. Tôi chỉ đến đây để đưa ra một thỏa thuận làm ăn, không mong đợi gì hơn."
 paragon.40100.d: "Hãy kể về thủy thủ đoàn của ngươi."
 paragon.40100.d.response: "Những nô lệ chạy trốn, thợ săn tiền thưởng, lính đánh thuê hám tiền... và một tay đầu bếp kỳ quặc. Chúng tôi đến từ mọi vùng miền của ngân hà, cùng sát cánh bên nhau theo tiếng gọi của tự do và phiêu lưu. Theo thời gian, chúng tôi gần như đã trở thành một gia đình. Chừng nào còn tuân lệnh và không ăn thịt đồng bọn, ai muốn gia nhập tôi đều hoan nghênh. Tôi rất tự hào khi được dẫn dắt một nhóm nhân tài như vậy."
 paragon.40100.hire_custom_tooltip: "§Y$NAME_xenophile1$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!.\n3 con tàu cướp biển đã được bổ sung vào đế chế của chúng ta."
 paragon.40200.name: "$NAME_xenophile2$"
 paragon.40200.desc: "§HNgười phụ nữ mang đến những món quà đáng kinh ngạc: một mảnh sao chổi được bảo quản cẩn thận, một tác phẩm điêu khắc bằng xương Tiyanki và một loài nhuyễn thể nhỏ bé đựng trong lọ.§!\n\nXin chào, tôi là Nona, người mang phước lành vĩnh cửu của Gia tộc Kokir. Tôi xin dâng những món quà này để bày tỏ sự tôn kính. Tôi đã thám hiểm nhiều hành tinh và đúc kết được vô số bài học. Tôi nguyện học hỏi văn hóa của các người dưới sự bảo trợ của các người, đổi lại, tôi sẽ chia sẻ với các người trí tuệ của hàng trăm nền văn minh."
 paragon.40200.a: "Cô có thể làm gì cho chúng ta?"
 paragon.40200.a.response: "Sở trường của tôi là ngoại lai học và ngoại giao. Kiến thức, của cải và những cuộc trò chuyện là những thứ tôi có thể mang lại. Rốt cuộc thì người ta còn cầu mong điều gì khác ngoài những thứ đó chứ?"
 paragon.40200.b: "Tại sao cô lại muốn gia nhập với chúng ta?"
 paragon.40200.b.response: "Tôi thấy sự thẳng thắn và chân thành của các người rất hấp dẫn. Giống như tôi, các người nhìn thấy những tiềm năng to lớn trong sự hợp tác. Được chung sống với những tâm hồn cởi mở như vậy là một đặc ân."
 paragon.40200.c: "Sự hiểu biết về văn hóa của cô đến từ đâu?"
 paragon.40200.c.response: "Cách tốt nhất để thấu hiểu một nền văn hóa xa lạ là hòa mình vào nó. Lần đầu tiên tôi đắm chìm trong tình yêu là trên một hành tinh xa lạ, và nền văn hóa của họ đã mê hoặc tôi sâu sắc. Dù chúng tôi không còn bên nhau, mối tình đó đã dạy tôi ý nghĩa của sự khoan dung và tôn trọng. Kể từ đó, tôi luôn cố gắng học hỏi nhiều nhất có thể từ mọi nơi tôi ghé qua, không còn bị trói buộc bởi những định kiến nữa."
 paragon.40200.hire_custom_tooltip: "§Y$NAME_xenophile2$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.40300.name: "$NAME_militarist1$"
 paragon.40300.desc: "§HNgài Nam tước có thân hình vạm vỡ. Mọi thứ trên người ông đều toát lên tác phong quân đội nghiêm ngặt: đôi ủng không một hạt bụi, bộ đồng phục được ủi phẳng phiu, ánh mắt cảnh giác và đầy toan tính. Nhưng đằng sau vẻ ngoài nghiêm nghị đó, lại có một thứ gì đó khác: khuôn mặt ông hằn đầy nỗi bi thương.§!\n\nTôi có thể phục vụ ngài với tư cách là một chỉ huy hạm đội và một nhà chiến thuật.\n\nChỉ cần chấp nhận sự cống hiến của tôi, tôi sẽ nghiền nát bất cứ kẻ nào dám làm hại ngài."
 paragon.40300.a: "Ông nói ông là một chỉ huy hạm đội, vậy hạm đội của ông đâu?"
 paragon.40300.a.response: "Thật nhục nhã khi phải nói rằng, nó không còn nữa.\n\nKhi đó chúng tôi đang tiến hành sửa chữa khẩn cấp quanh quỹ đạo một ngôi sao lùn đỏ, và kẻ thù đã phục kích chúng tôi. Chúng bao vây từ mọi hướng.\n\nChúng tôi bị áp đảo với tỷ lệ một chọi mười, và dưới ánh sáng đỏ rực như máu của ngôi sao đó, tôi dường như đã chứng kiến ngày tàn của hạm đội và thủy thủ đoàn của mình. Chúng tha mạng cho tôi như một sự bố thí. Cho đến tận hôm nay, tôi vẫn không sao gột rửa được nỗi nhục nhã của thất bại đó."
 paragon.40300.b: "Tại sao ông lại muốn gia nhập với chúng ta?"
 paragon.40300.b.response: "Ngài hiểu mà, hòa bình là một thứ xa xỉ phải đánh đổi bằng chiến tranh."
 paragon.40300.c: "Chẳng phải ông nên đi phục vụ gia tộc của mình sao?"
 paragon.40300.c.response: "Gia tộc Jariden đã suy tàn cùng với tôi. Sau khi bại trận, khao khát trả thù đã làm tôi mờ mắt. Tin tôi đi, kẻ thù của tôi đã nhận được kết cục xứng đáng. Mặc dù tôi đã mất hết danh dự, nhưng kỹ năng của tôi sẽ luôn đồng hành cùng tôi. Vì điều đó, tôi xin lấy mạng sống của mình ra để thề."
 paragon.40300.hire_custom_tooltip: "§Y$NAME_militarist1$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.40400.name: "$NAME_militarist2$"
 paragon.40400.desc: "§HMột đội nô lệ khiêng một cỗ kiệu khổng lồ, trên đó là một sinh vật bò sát đáng sợ. Mọi định kiến về một lãnh chúa chiến tranh đều hội tụ ở ả: những vết sẹo dữ tợn, vũ khí phô trương, những bộ xương làm chiến lợi phẩm, v.v.§!\n\nTa là Gia'Zumon, và đây là điều kiện của ta!\n\n§HẢ đứng dậy từ ghế ngồi, tùy tùng từ từ quỳ rạp xuống hai bên.§!\n\nTa sẽ chỉ huy quân đội của các ngươi, đè bẹp kẻ thù của các ngươi. Hành tinh của chúng sẽ bị thiêu rụi, và của cải của chúng sẽ thuộc về các ngươi."
 paragon.40400.a: "Khoan đã. Sao ngươi lại muốn tham gia cùng chúng ta?"
 paragon.40400.a.response: "Ta đã cướp phá vô số hành tinh. Công việc đó khá dễ dàng, chỉ là ta đã chán ngấy rồi! Đám phế vật đó lãng phí quá nhiều thời gian vào quan liêu, nghệ thuật và những lời nhảm nhí vô vị.\n\n§HẢ rít lên dữ dội, khoe hàm răng lởm chởm.§!\n\nNhưng đế chế của các ngươi rất mạnh, và kẻ thù của các ngươi cũng là những khúc xương ngon lành! Hãy để ta nghiền nát chúng. Ta khao khát những trận chiến ra hồn!"
 paragon.40400.b: "Quân đội của ngươi đâu?"
 paragon.40400.b.response: "Hừ! Đó quả là một ngày đáng nhớ! Hai năm trước, chúng ta xâm lược một hành tinh xa xôi. Chúng ta tiêu diệt mọi kẻ dám chống cự, cướp lấy mọi thứ có giá trị và bắt những kẻ hữu dụng làm nô lệ. Rồi viện quân đến.\n\n§HẢ vuốt ve một hộp sọ trên thắt lưng, nhe nanh cười xảo quyệt.§!\n\nĐó là một cuộc tàn sát đẫm máu, một khúc ca bạo tàn. Cuối cùng chúng đã đánh bại chúng ta, nhưng các chiến binh của ta đã chết một cách xứng đáng. Ta đến đây không vì vinh hoa phú quý, ta muốn chiến đấu."
 paragon.40400.c: "Ngươi trông có vẻ hơi... quá khích rồi đấy."
 paragon.40400.c.response: "Chiến tranh là một trò chơi, một sự tất yếu, một công cụ. Nhưng chiến đấu... à, nó có thể nói lên rất nhiều điều. Nó là cách thuần túy nhất để thử thách giới hạn của một người. Ai mà không thấy rạo rực trước một viễn cảnh như vậy chứ?"
 paragon.40400.hire_custom_tooltip: "§Y$NAME_militarist2$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.40500.name: "$NAME_xenophobe1$"
 paragon.40500.desc: "§HNgoài hành tinh này được bao bọc trong một thiết bị duy trì sự sống phát ra tiếng lọc xọc. Chất lỏng sền sệt chảy qua các đường ống và lỗ thông hơi, biến lời nói của hắn thành một âm thanh ùng ục ẩm ướt.§!\n\nNhà máy của các người quá tệ hại."
 paragon.40500.a: "Ngươi có ý gì?"
 paragon.40500.a.response: "Chuyên môn của tôi có thể giúp ích cho các người. Hãy để tôi cho các người thấy thế nào là sự tối ưu.\n\n§HNhững xúc tu của người ngoài hành tinh vặn vẹo ướt át trên kính mũ bảo hiểm.§!\n\nKẻ mạnh sẽ vươn lên, kẻ yếu sẽ bị diệt vong. Ngân hà này không bao giờ thiếu công nhân, tôi sẽ mang vài kẻ đến cho các người. Chúng phải làm việc, hoặc là chết. Còn lợi nhuận thì sẽ không ngừng đổ về."
 paragon.40500.b: "Tại sao lại chọn chúng ta?"
 paragon.40500.b.response: "Các người đủ thuần khiết, không qua lại với người ngoài.\n\n§HVới một tiếng bắn tung tóe đáng sợ, chất lỏng tràn vào mũ bảo hiểm. Người ngoài hành tinh này vung vẩy những xúc tu, thể hiện một sự hưng phấn kỳ lạ.§!\n\nBởi vì chúng ta có chung các giá trị cốt lõi. Bởi vì tôi cũng chỉ quan tâm đến bản thân mình."
 paragon.40500.c: "Đó là lý do ngươi mặc bộ đồ cách ly này à?"
 paragon.40500.c.response: "Chính xác.\n\n§HMột tiếng hít thở dữ dội.§!\n\nỞ trong này, không ai có thể chạm vào tôi. Ở trong này tôi mới cảm thấy được sự sạch sẽ."
 paragon.40500.hire_custom_tooltip: "§Y$NAME_xenophobe1$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.40600.name: "$NAME_xenophobe2$"
 paragon.40600.desc: "§HCảm biến của chúng ta cho thấy lớp vỏ của robot này đã có lịch sử hàng trăm năm. Giọng nói của nó thiếu âm điệu, nhưng lời nói lại vang dội đến bất ngờ.§!\n\nDữ liệu cho thấy sự thiếu phối hợp giữa chính phủ và các nước chư hầu của ngài. Thiếu kỷ luật. Việc giáo hóa không đạt chuẩn. Đề xuất thao tác: Thêm Aturion vào hệ thống. Xóa bỏ các chức năng không cần thiết. Đề cao trật tự."
 paragon.40600.a: "Ngươi đến đây vì mục đích gì?"
 paragon.40600.a.response: "Mỗi xã hội là một phương trình. Xin hãy để Aturion giúp ngài giải nó. Phương trình không cần những biến số bất định."
 paragon.40600.b: "Tại sao ngươi lại muốn gia nhập với chúng ta?"
 paragon.40600.b.response: "Nền văn minh của các ngài đang tiếp cận trạng thái lý tưởng. Có thể đạt được sự cân bằng hoàn hảo trong khoảng thời gian ngắn nhất. Theo tính toán của Aturion, xác suất thành công là 91,1%."
 paragon.40600.c: "Ai đã tạo ra ngươi?"
 paragon.40600.c.response: "Không quan trọng."
 paragon.40600.d: "Hãy nói về những... phương trình đó xem."
 paragon.40600.d.response: "§HTừ một cổng trên ngực robot chiếu ra hàng chục ảnh toàn ký. Nó bắt đầu một lời giải thích đều đều và nhàm chán, bao gồm phân tích thống kê, kinh tế học, phân tích tâm lý, thao tác gen... Một trong những ảnh toàn ký đó là thanh tiến trình. Nó cho biết bài thuyết trình sẽ kéo dài thêm 127,8 ngày tiêu chuẩn nữa.§!"
 paragon.40600.hire_custom_tooltip: "§Y$NAME_xenophobe2$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.40700.name: "$NAME_egalitarian1$"
 paragon.40700.desc: "§HChiến binh này được trang bị vũ khí và áo giáp tiên tiến. Bản quét cho thấy cơ thể anh ta có mức độ cải tạo sinh hóa và nâng cấp cấy ghép cao.§!\n\nTướng quân Jynn tuân lệnh ngài. Tôi là đặc phái viên của Giáo phái Cân bằng Tuyệt đối. Tôi được phái đến để giúp đỡ tất cả những ai muốn xóa bỏ sự bạo tàn. Xin hãy nhận lời thề của tôi, sức mạnh của tôi sẽ được sử dụng vì ngài."
 paragon.40700.a: "Hãy kể về bản thân anh."
 paragon.40700.a.response: "Tôi là một người lính chiến đấu vì lý tưởng. Giáo phái của chúng tôi cam kết xóa bỏ áp bức và giải phóng nô lệ. Chúng tôi sẵn sàng đổ máu vì điều đó."
 paragon.40700.b: "Tại sao anh lại muốn gia nhập với chúng ta?"
 paragon.40700.b.response: "Các ngài là một nền văn minh đề cao sự bình đẳng, nơi mọi cá nhân đều có thể làm nên điều vĩ đại nhờ vào nỗ lực của chính mình. Điều đó chưa đủ hấp dẫn tôi sao?"
 paragon.40700.c: "Hãy nói thêm về giáo phái của anh."
 paragon.40700.c.response: "Ischadon, người sáng lập ra Giáo phái Cân bằng Tuyệt đối, truyền bá giáo lý về sự bình đẳng. Tự do là một thứ vừa đẹp đẽ vừa mỏng manh. Quyền lực không nên thuộc về một bàn tay nào - nó là một gánh nặng phải được chia sẻ cùng nhau. Các thành viên trong giáo phái của tôi đã thề sẽ bảo vệ những giá trị này."
 paragon.40700.hire_custom_tooltip: "§Y$NAME_egalitarian1$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.40800.name: "$NAME_egalitarian2$"
 paragon.40800.desc: "§HNhà khoa học này đang chăm chú nhìn vào bảng điều khiển trên tay, những ngón tay nhảy múa trên các phím bấm. Cô ấy lẩm nhẩm một giai điệu vui tươi, dường như hoàn toàn chìm đắm vào công việc. Một người bạn robot nhỏ bé đang lơ lửng trong không trung bên cạnh cô, nó phát ra những tiếng bíp bíp và huých nhẹ vào vai cô. Cô đột nhiên ngẩng đầu lên.§!\n\nÁ, xin lỗi. Xin chào! Tôi là Zosira. Rất xin lỗi vì đã làm phiền các bạn, chuyện là, phòng thí nghiệm trước đây của tôi coi như là, nổ tung rồi.\n\n§HRobot nhỏ lại tiếp tục kêu bíp bíp.§!\n\nÀ thì, chuyện là, ý tôi là, tôi muốn tìm một nơi để tôi có thể tiếp tục sáng tác nhạc."
 paragon.40800.a: "Tìm nơi... để sáng tác nhạc?"
 paragon.40800.a.response: "Đúng vậy, vũ trụ cũng giống như âm nhạc vậy. Sự dao động của những hành tinh khí khổng lồ, tiếng gầm gừ của những ngôi sao mới sinh, bài ca ngọt ngào của các nguyên tử xoay vòng...\n\n§HCô ấy vung vẩy hai tay như đang chỉ huy một dàn nhạc giao hưởng vô hình của vũ trụ.§!\n\nTáp ~ táp ~ la ~ ta ~, cộng thêm một nhịp điệu thích hợp, và rồi: Tada! Thế là chúng ta đã tạo ra phép thuật! À không, khoa học. Cũng gần như nhau thôi, thật đấy."
 paragon.40800.b: "Tại sao cô lại muốn gia nhập với chúng ta?"
 paragon.40800.b.response: "Tư tưởng của các bạn có vẻ rất hợp ý tôi. Tôi mong những khám phá của mình có thể mang lại lợi ích cho tất cả mọi người, chứ không chỉ riêng tầng lớp quyền quý. Bản giao hưởng của vũ trụ này chứa đựng muôn vàn phép màu và sự kỳ diệu! Ai cũng xứng đáng được lắng nghe nó!\n\n§HRobot nhỏ tiếp tục kêu bíp bíp.§!\n\nĐúng rồi đấy Gorky! Em nói không sai chút nào."
 paragon.40800.c: "Robot nhỏ này là ai?"
 paragon.40800.c.response: "Ồ, đây là Gorky! Cậu ấy có đáng yêu không? Tôi tự tay chế tạo cậu ấy đấy, tôi làm gì cậu ấy cũng có thể giúp một tay.\n\n§HRobot nhỏ vui vẻ kêu bíp bíp.§!\n\nĐược rồi, được rồi, tôi sẽ nói cho họ biết. Gorky sắp xếp lịch hẹn, ăn uống và ngủ nghỉ cho tôi. Các bạn biết đấy, mỗi khi tôi bị cuốn vào chuyện gì đó, là tôi... vèo một cái... quên mất cả thời gian.\n\n§HRobot nhỏ tiếp tục kêu bíp bíp.§!\n\nHaha đúng! Là vậy đó!"
 paragon.40800.d: "Cô bảo phòng thí nghiệm của cô nổ tung rồi sao?"
 paragon.40800.d.response: "Ồ, chà, nói sao nhỉ?! Các bạn thấy đó, quê hương của tôi có những quy định khá khắt khe về việc ai mới được làm nhà khoa học. Vì vậy, tôi đã gom nhặt đồ phế liệu từ khu công nghiệp cũ và bí mật xây dựng một phòng thí nghiệm cho riêng mình. Tôi cứ ngỡ trường lực ion hóa có thể làm ổn định các hạt vi mô dễ nổ, nhưng...\n\n§HRobot nhỏ vừa kêu bíp bíp vừa phát ra tiếng tít tít.§!\n\nĐúng không? Tiếng bass trầm của những hạt vi mô đó quả là quá bùng nổ. Vậy khi nào thì tôi có thể bắt đầu?"
 paragon.40800.hire_custom_tooltip: "§Y$NAME_egalitarian2$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.40900.name: "$NAME_materialist1$"
 paragon.40900.desc: "§HTrang bị trên một cần cẩu di động khổng lồ là phần đầu và thân mình của một sinh vật hình người. Rõ ràng đây từng là một sinh vật hữu cơ, nhưng giờ đây phần lớn cơ thể đã được cấu thành từ kim loại, dây cáp và nhựa. Không một dấu hiệu báo trước, thân hình đó rung lên và hoạt động, hai con mắt tổng hợp phát sáng, cất lên một giọng nói rền rĩ.§!\n\nTôi là Xondar. Tôi đang tìm kiếm một người xứng đáng để phục vụ."
 paragon.40900.a: "Ngài... ngài đã gặp chuyện gì sao?"
 paragon.40900.a.response: "Tôi từng được cấu tạo bằng máu thịt. Giống như những đồng loại khác, tôi cũng phải chịu sự tàn phá của bệnh tật và tuổi tác. Máu thịt là thứ yếu ớt, vì vậy tôi đã từ bỏ nó. Tôi đã số hóa và tải tâm trí của mình lên, giải phóng thành công bản thân khỏi nhà tù giam cầm thể xác."
 paragon.40900.b: "Tại sao ngài lại muốn gia nhập với chúng ta?"
 paragon.40900.b.response: "Mê tín, niềm tin tôn giáo... tất cả đều là những lời dối trá vô căn cứ, cuối cùng cũng chỉ để mê hoặc lòng người và biến thành những trận cuồng sát. Đó là gốc rễ của vô số cuộc chiến và đau khổ triền miên. Ngài và người dân của ngài đã nhìn thấu những điều nhảm nhí đó. Những thứ nhìn được, nếm được, chạm vào được mới là sự thật. Giống như để đạt đến sự hoàn hảo thì phải rũ bỏ thể xác, những ảo mộng ngây thơ cũng cần phải bị gạt bỏ."
 paragon.40900.c: "Ngài muốn chỉ huy một hạm đội sao?"
 paragon.40900.c.response: "Những gì ngài thấy chỉ là một phần nhỏ của tôi. Không gian mới là bến đỗ thực sự của tôi, và tôi chỉ là một phần trong hạm đội của mình. Ý thức của tôi bén rễ sâu vào hệ thống của các con tàu, cảm biến là tai mắt của tôi, vỏ tàu là da thịt của tôi. Chỉ cần có sự chỉ huy của tôi, hạm đội của ngài sẽ đạt được sức mạnh vô song."
 paragon.40900.d: "Hãy nói xem làm thế nào mà ngài lại thành ra thế này?"
 paragon.40900.d.response: "Có gì nhiều để kể đâu? Cơ thể của tôi mắc bệnh. Tôi có được một cơ hội để bảo tồn ý thức của mình, và tôi đã nắm lấy nó. Rất nhiều người khác cũng đã thử nghiệm cách này, nhưng chẳng một ai có thể sống sót đến tận bây giờ."
 paragon.40900.hire_custom_tooltip: "§Y$NAME_materialist1$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.41000.name: "$NAME_materialist2$"
 paragon.41000.desc: "§HMột hệ thống máy móc thô kệch và cứng cáp được nhồi nhét trong một bộ xương ngoài. Đồ nghề, các bộ phận linh kiện vương vãi và đôi bàn tay dính đầy dầu mỡ đều cho thấy ông ta là một thợ sửa chữa, trong ánh mắt ông lấp lánh sự tò mò và nhiệt huyết.§!\n\nChào buổi sáng, sếp! Tôi là Borin, con trai của Noja. Rất hân hạnh được làm quen!"
 paragon.41000.a: "Vậy ông có thể làm gì cho chúng ta?"
 paragon.41000.a.response: "Tôi là một người thu gom phế liệu với ba mươi năm kinh nghiệm. Bản sơ yếu lý lịch này đã đủ khủng chưa. Nếu sếp có bất cứ thứ gì cần chế tạo hoặc sửa chữa,\n\n§HÔng ta lấy ngón tay cái chỉ vào ngực mình.§!\n\nTôi đều có thể xử lý hết. Tôi không khoác lác đâu, thực sự tôi có thể sửa được mọi thứ. Hơn nữa không chỉ có mình tôi, tôi còn có một đội máy móc tùy chỉnh có thể tháo dỡ, cắt gọt, hàn, thu thập, sửa chữa và lắp ráp bất kỳ thứ gì. Chỉ cần sếp muốn, hãy giao cho tôi một đội ngũ, tôi sẽ bảo trì toàn bộ lực lượng hải quân của sếp. Tất nhiên, càng nhiều người càng tốt nha!"
 paragon.41000.b: "Tại sao lại làm việc cho chúng ta?"
 paragon.41000.b.response: "Tôi chỉ chạy vạy khắp nơi, tự tìm cho mình một lối đi. Sếp có vẻ là một người chủ biết coi trọng lao động, một nhà lãnh đạo đáng tin cậy. Sếp có thể nhìn nhận thế giới này theo đúng bản chất của nó, tận dụng những gì chúng ta đang có để xây dựng một tương lai tốt đẹp hơn."
 paragon.41000.c: "Vậy tại sao ông lại nghỉ việc ở nơi trước đây?"
 paragon.41000.c.response: "Sếp hỏi thật đấy à? Tôi chán rồi. Từ khi tôi bắt đầu có nhận thức, tôi đã mơ ước được ngao du trong không gian. Tôi muốn thúc ép bản thân xem mình có thể tiến xa đến đâu. Vì vậy tôi thu dọn đồ nghề, và giờ tôi đang ở đây. Thế nào, còn câu hỏi gì nữa không? Hay là chúng ta bắt đầu xây dựng đi!"
 paragon.41000.hire_custom_tooltip: "§Y$NAME_materialist2$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.41100.name: "$NAME_pacifist1$"
 paragon.41100.desc: "§HNgười ngoài hành tinh này khoác trên mình bộ lễ phục lộng lẫy và phức tạp. Dù tuổi đã cao, đôi mắt của ông vẫn vô cùng tinh tường, toát lên một trí tuệ sắc bén.§!\n\nXin gửi lời chào đến ngài. Tôi muốn được phục vụ ngài với tư cách là một người bảo vệ hòa bình."
 paragon.41100.a: "Hãy kể về bản thân ông."
 paragon.41100.a.response: "Tôi là một trong số ít những thẩm phán được chọn trong tộc người của mình. Đó là một vị trí vô cùng vinh dự. Tôi đã nghiên cứu luật pháp của rất nhiều hành tinh, và thông qua kinh nghiệm lâu năm, tôi còn học được cách làm sao để cân bằng cán cân công lý."
 paragon.41100.b: "Tại sao ông lại muốn làm việc với chúng ta?"
 paragon.41100.b.response: "Tôi đã già rồi. Tôi đã dành phần lớn cuộc đời mình bận rộn trong văn phòng. Mặc dù việc một người như tôi nhường bước cho thế hệ trẻ là điều vô cùng tự nhiên, nhưng tôi vẫn chưa thấy đủ. Tội ác không có biên giới, và tôi vẫn còn rất nhiều việc có thể làm. Danh tiếng của tôi ai cũng biết, đã có rất nhiều người trong ngân hà tìm đến và muốn tôi làm việc cho họ. Nhưng làm việc cho những kẻ lạm quyền thì có ý nghĩa gì chứ? Tôi tin rằng chúng ta đi chung một con đường, được phục vụ nhân dân của ngài là vinh dự to lớn nhất của tôi."
 paragon.41100.c: "Điều gì đã khiến ông chọn ngành luật?"
 paragon.41100.c.response: "Vũ trụ này là một vị thẩm phán vô tình.\n\n§HTừ sâu trong cổ họng của vị lão nhân ngoài hành tinh phát ra một âm thanh khàn đặc đáng sợ.§!\n\nLà những sinh vật có cảm xúc, chúng ta có trách nhiệm phải làm tốt hơn. Chỉ có lý trí mới có thể sinh ra sự công bằng.\n\n§HÁnh mắt của ông dừng lại ở một nơi không xa. Trong khoảnh khắc đó, dường như ông đã quên mất sự tồn tại của chính mình.§!\n\nSức mạnh của luật pháp phải được sử dụng một cách cẩn trọng, không thể để nó trở thành ngọn nguồn của sự bất công."
 paragon.41100.hire_custom_tooltip: "§Y$NAME_pacifist1$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.41200.name: "$NAME_pacifist2$"
 paragon.41200.desc: "§HTrang phục và trang sức của người phụ nữ này cho thấy sự xa hoa trong cuộc sống của cô ấy. Cô ấy khẽ cúi chào rồi cất lời,§!\n\nTôi sẵn sàng phục vụ ngài với tư cách là một thống đốc và một nhà ngoại giao. Hãy biến tôi thành đồng minh của ngài, tôi có thể giúp ngài tìm thấy những người bạn hùng mạnh ở bất kỳ góc nào của dải ngân hà."
 paragon.41200.a: "Hãy kể cho chúng tôi nghe về cô."
 paragon.41200.a.response: "Tôi lớn lên trong Hội Chị em của Hành tinh Từ Thạch Alyssum. Sau khi hoàn thành việc học giống như những người chị em khác, tôi được bổ nhiệm vào vị trí ngoại giao này. Nhiều năm qua, tôi luôn là người đứng sau hiến kế cho những người khác. Mạn phép mà nói, tôi cũng đã gặt hái được vài thành công nho nhỏ."
 paragon.41200.b: "Tại sao cô lại muốn gia nhập với chúng ta?"
 paragon.41200.b.response: "Tôi tin rằng hòa bình là thứ duy nhất có thể mang lại một tương lai ổn định cho dải ngân hà của chúng ta. Nghệ thuật ngoại giao cũng giống như khiêu vũ trên lưỡi dao vậy. Tôi tin rằng ngài chắc chắn sẽ coi trọng khía cạnh này."
 paragon.41200.c: "Cô vẫn còn phục vụ cho Hội Chị em chứ?"
 paragon.41200.c.response: "Tôi phục vụ cho mọi sinh mệnh. Nào, chúng ta hãy vừa uống một ly đồ nóng vừa tiếp tục chủ đề này nhé."
 paragon.41200.hire_custom_tooltip: "§Y$NAME_pacifist2$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.41300.name: "$NAME_authoritarian1$"
 paragon.41300.desc: "§HBản quét cho thấy có rất nhiều vũ khí đáng sợ được giấu dưới áo choàng của người phụ nữ này. Chúng ta không tìm thấy bất kỳ hồ sơ chính thức nào về sự tồn tại của cô ta, nhưng thuật toán nhận diện khuôn mặt cho thấy cô ta có liên quan đến ít nhất ba vụ ám sát gây chấn động.§!\n\nXin phép cho tôi bỏ qua những nghi thức rườm rà. Ngài là người thông minh, thừa biết rằng vũ trụ này đầy rẫy hiểm nguy, trong đó có vô số thứ ngài thậm chí không thể nhìn thấy. Chỉ cần ra một cái giá tốt, tôi có thể giúp ngài nhìn rõ mọi thứ."
 paragon.41300.a: "Cô là ai?"
 paragon.41300.a.response: "Tôi là ai không hề quan trọng. Tôi nghĩ ngài sẽ quan tâm hơn đến việc tôi có khả năng gì. Tôi là một thứ vũ khí sắc bén, chỉ cần cho tôi đủ thời gian, sẽ không có bất cứ ai dám chống lại ngài. Dù sao thì, người chết sẽ không thể phản bội ngài được."
 paragon.41300.b: "Tại sao lại hỗ trợ chúng ta?"
 paragon.41300.b.response: "Hành động đơn độc đúng là có những lợi ích riêng, nhưng nhược điểm là nó không quá ổn định. Khi phải tự mình gánh vác mọi việc trong một thời gian dài, ai rồi cũng sẽ cảm thấy mệt mỏi. Nói thật là, tôi đã bị phân tâm quá nhiều. Bóng tối phía sau ngai vàng của ngài chính là nơi ẩn náu hoàn hảo nhất cho tôi. Hơn nữa, ở đây tôi còn có thể hành động bằng những phương pháp khác, tinh vi hơn nhiều."
 paragon.41300.c: "Dựa vào đâu mà chúng ta phải tin cô?"
 paragon.41300.c.response: "Tin tưởng? Ngài không thể và cũng hoàn toàn không cần phải tin tôi. Tôi chỉ bán mình cho người trả giá cao nhất. Chừng nào ngài còn trả giá đủ cao, thì chẳng có gì phải lo lắng cả. Hơn nữa, nếu có ai đó thực sự yêu cầu ngài phải tin tưởng họ, thì đó mới là một kẻ đáng ngờ, thậm chí có thể nói là nguy hiểm. Đối với những kẻ như vậy, tôi sẽ lập tức cử một đội đến nghe lén nhà hắn, theo dõi hắn, và theo sát mọi người mà hắn tiếp xúc."
 paragon.41300.d: "Vũ trang của cô có vẻ hơi bị nặng nề đối với một điệp viên đấy."
 paragon.41300.d.response: "Trong nghề của tôi, một chút sự cố ngoài ý muốn cũng có thể khiến người ta chết không có chỗ chôn. Tôi thích chuẩn bị kỹ càng một chút."
 paragon.41300.hire_custom_tooltip: "§Y$NAME_authoritarian1$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.41400.name: "$NAME_authoritarian2$"
 paragon.41400.desc: "§HLàn da của người ngoài hành tinh này nhễ nhại những dịch tiết nhớp nháp. Hắn ta nhọc nhằn cúi rạp người xuống. Nhưng khi hắn mở miệng, giọng điệu lại lanh lảnh và chói tai đến lạ thường, giống như giọng của một đứa trẻ.§!\n\nThưa ngài, ôi! Bậc quân vương quyền uy tối thượng. Tôi, Quản đốc Q'la-Minder, chỉ là một kẻ hầu mọn mạt của ngài. Mỗi lời ngài nói đều là thánh chỉ. Hãy cho tôi quản lý một hành tinh của ngài, tôi sẽ mang lại cho ngài vinh quang và vô vàn của cải. Ôi, vô vàn của cải!"
 paragon.41400.a: "Cụ thể thì ngươi có thể làm được gì?"
 paragon.41400.a.response: "Tất cả chúng ta đều hiểu rõ một số đạo lý. Ví dụ như dân đen thì luôn lười biếng. Chúng luôn đòi hỏi nhiều quyền lợi hơn, tiền lương cao hơn, tự do nhiều hơn... Nếu không bị kiểm soát, chúng sẽ tống hết những thứ đáng lẽ thuộc về ngài vào bụng chúng! Nhưng nếu để tôi phụ trách...\n\n§HHắn ta từ từ siết chặt nắm đấm.§!\n\nHãy giao cho tôi một hành tinh, tôi sẽ vắt kiệt những cặn bã tư tưởng đó ra khỏi đầu chúng. Và rồi chúng sẽ phải đội ơn ngài, thưa vị quân vương vĩ đại. Ôi! Chúng thực sự sẽ làm thế!"
 paragon.41400.b: "Tại sao ngươi lại muốn gia nhập với chúng ta?"
 paragon.41400.b.response: "Ai lại có thể từ chối cơ hội được phục vụ một người vĩ đại như ngài chứ?\n\n§HHắn ta cười khúc khích đầy mong đợi.§!\n\nCó những người sinh ra để làm vua, những người khác thì sinh ra để cúi đầu thần phục. Đó là quy luật của vạn vật. Ngài có thể tin tưởng tôi. Tôi sẽ trung thành phục vụ ngài."
 paragon.41400.c: "Ngươi cũng giỏi nịnh bợ đấy chứ."
 paragon.41400.c.response: "Ôi, vị quân vương thánh minh! Đây chỉ là những cảm nghĩ chân thực của tôi! Xin ngài hãy để tôi tiếp tục được không? So với ngài, tôi chỉ là một đống bùn nhão, một con giòi đang trườn bò trong đống bùn đất đó! Được ca ngợi ngài là vinh dự và đặc quyền của tôi. Chỉ riêng sự tồn tại của ngài cũng đủ để khiến trái tim tôi ngập tràn hạnh phúc. Xin hãy cho phép tôi phục vụ ngài với lòng trung thành vô hạn!"
 paragon.41400.hire_custom_tooltip: "§Y$NAME_authoritarian2$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.41500.name: "$NAME_spiritualist1$"
 paragon.41500.desc: "§HNgười ngoài hành tinh này đứng bất động.§!\n\nĐịnh mệnh dẫn lối cho từng bước đi của tôi. Tôi đã vượt qua bóng tối vô tận để đến trước mặt ngài. Tôi là nhà tiên tri Ulastar."
 paragon.41500.a: "Ngươi có thể nói gì về vận mệnh của chúng ta?"
 paragon.41500.a.response: "§HÔng ta dường như đang nhìn chằm chằm bằng đôi mắt mù lòa đó.§!\n\nTrên một con đường, ngọn lửa trắng bùng cháy trong cõi hư không. Con đường còn lại thì bị bao phủ bởi những tàn tro văng tứ tung. Các ngài sẽ phải đối mặt với sự kinh hoàng, và đó sẽ là ngày tàn của các ngài. Trừ khi? Sợi chỉ của định mệnh đã dệt nên một tia hy vọng mỏng manh nhất. Cơn ác mộng có lẽ vẫn có thể tránh được."
 paragon.41500.b: "Tại sao ngươi lại muốn tham gia cùng chúng ta?"
 paragon.41500.b.response: "§HÔng ta tung ra một đám bụi xoáy tít từ một chiếc túi giấu kín. Khi nói, ông ta tuyên bố thông qua phương thức kỳ lạ này:§!\n\nTôi đến đây vì nhận được sự vẫy gọi. Các ngài chắc chắn đã hoặc sẽ gặp tôi."
 paragon.41500.c: "Cụ thể thì ngươi có thể làm được gì?"
 paragon.41500.c.response: "§HTừ chiếc túi bên trong áo choàng, $NAME_spiritualist1$ lôi ra một bộ xương điêu khắc. Sau khi ném chúng xuống đất, ông ta dường như đang quan sát sự sắp xếp của những khúc xương này bằng một loại giác quan vượt ngoài tầm nhìn.§!\n\nTôi sẽ chia sẻ những gì mình nhìn thấy với các tín đồ. Tôi sẽ giữ vững con tàu của dân tộc ngài ngay khi nó chực chờ lao vào tâm bão."
 paragon.41500.d: "Khả năng của ngươi từ đâu mà có?"
 paragon.41500.d.response: "Nhiều năm trước, tôi phải lao động cực nhọc trong một khu mỏ trên hành tinh. Mặc dù mắt thịt của tôi có thể nhìn thấy, nhưng con mắt tâm hồn của tôi lại bị thế giới vật chất che khuất. Về sau, cái ngày tôi thức tỉnh đã đến.\n\nHọ nói đó là một tai nạn, nhưng tôi biết đó là ý trời. Một tiếng nổ bất ngờ đã phá nát dây thần kinh thị giác của tôi. Trong bóng tối bao trùm sau đó, tôi đã nhìn thấy dòng sông thời gian. Cho đến tận hôm nay, nó vẫn đang cuồn cuộn chảy trước mắt tôi."
 paragon.41500.hire_custom_tooltip: "§Y$NAME_spiritualist1$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.41600.name: "$NAME_spiritualist2$"
 paragon.41600.desc: "§HNgười đàn ông này gầy gò như bộ xương khô và đầy vẻ phong sương: bộ trang phục tinh xảo của ông ta gần như đã phai màu hoàn toàn, làn da ông ta khô ráp như giấy da, và giọng nói của ông ta gần như chỉ là một tiếng thì thầm.§!\n\nTên của ta là Nasuz Demetor. Bản thân ta là sự hóa thân của những hạt bụi mịn và các truyền thuyết. Cảm ơn ngài đã đón nhận ta."
 paragon.41600.a: "Bụi mịn và truyền thuyết là thứ gì vậy?"
 paragon.41600.a.response: "§HÔng ta mỉm cười, làn da theo đó cũng căng ra.§!\n\nDải ngân hà vô cùng cổ xưa. Trước các ngài, đã có vô số nền văn minh trỗi dậy rồi lụi tàn. Những hạt bụi mịn là di sản của họ, còn truyền thuyết là sự kế thừa của chúng ta. Ta cố gắng khai quật sự thật trong quá khứ, để nhân loại có thể ghi nhớ, có thể học hỏi."
 paragon.41600.b: "Đó là lý do ngươi đến đây sao?"
 paragon.41600.b.response: "Điều này không chỉ mang lại lợi ích cho riêng ta, ta đảm bảo đấy. Lịch sử ban tặng cho chúng ta nhiều hơn những gì chúng ta có thể tưởng tượng, và ta sẽ chia sẻ điều đó với ngài."
 paragon.41600.c: "Ngươi thu được những gì thông qua khảo cổ?"
 paragon.41600.c.response: "Các di vật, trí tuệ, cảnh quan... nhưng không chỉ dừng lại ở đó. Mọi thứ trong quá khứ đều để lại tiếng vọng. Nghe có vẻ hơi mâu thuẫn phải không? Rõ ràng chúng ta đang chống lại sự lãng quên, vậy mà chúng ta lại thường quên đi việc phải lắng nghe."
 paragon.41600.hire_custom_tooltip: "§Y$NAME_spiritualist2$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 ###### Sự kiện Lãnh đạo Nổi danh #######
 #Lysator Syng / xenophile1
 paragon.40110.name: "Kho báu của Zteig Myer"
 paragon.40110.desc: "§Y[Root.GetName]§! biết rất nhiều câu chuyện về tên Vua Cướp biển đáng sợ Zteig Myer. Vài thế kỷ trước, hắn đã cướp bóc khắp dải ngân hà, vơ vét của cải, tài nguyên quý hiếm và những cổ vật vô giá. Giờ đây, nhờ một bộ bản đồ sao cổ, [Root.GetFirstName] tin rằng [Root.GetHeShe] đã phát hiện ra nơi Zteig Myer cất giấu lượng lớn chiến lợi phẩm của mình. [Root.GetFirstName] từ chối tiết lộ chi tiết về việc làm thế nào [Root.GetHeShe] lấy được những tấm hải đồ này, nhưng chúng ta có thể tin tưởng vào tính xác thực của chúng, và hi vọng chúng ta sẽ cử một con tàu công trình đến để khai quật kho báu. Nếu nơi đó thực sự còn kho báu."
 paragon.40110.a: "Có lẽ nên đi xem thử."
 LYSATOR_PIRATE_TREASURE: "Kho báu Cướp biển"
 LYSATOR_PIRATE_TREASURE_DESC: "Kho báu của Zteig Myer do [event_target:renowned_xenophile1.GetName] khám phá ra."
 paragon.40111.name: "Kho báu Cướp biển"
 paragon.40111.desc: "Chúng ta đã tìm thấy hầm ngầm nơi tên đại hải tặc Zteig Myer cất giấu kho báu của hắn. Những báu vật bị đánh cắp từ rất nhiều hành tinh này giờ đây sẽ mang lại lợi ích cho dân tộc chúng ta."
 paragon.40111.a: "Tốt lắm."
 paragon.40120.name: "Bến đỗ An toàn"
 paragon.40120.desc: "Những lời đồn đại về việc chúng ta dang tay chào đón §Y[Root.GetName]§! đã lan truyền khắp ngân hà. Giờ đây, đủ loại thành phần bị ruồng bỏ, những kẻ bất hảo và cả lũ cướp biển đều coi đế chế của chúng ta là một nơi mở cửa cho tất cả mọi người, nơi ai cũng có thể có một khởi đầu mới. [Root.GetFirstName] đang lợi dụng điều này, xây dựng lại danh tiếng và mời gọi những người quen cũ gia nhập với chúng ta. Rất nhiều người đã đáp lại lời kêu gọi, đến đây để tìm kiếm một cuộc sống mới tốt đẹp hơn."
 paragon.40120.a: "Hoan nghênh."
 paragon.40120.b: "Bảo chúng cút đi."
 pop_outcast_happy: "Kẻ lưu vong Biết ơn"
 pop_outcast_happy_desc: "Những kẻ từng bị lưu vong này thể hiện sự biết ơn sâu sắc trước cơ hội làm lại cuộc đời, và nhanh chóng chấp nhận cách sống của chúng ta."
 pop_outcast_unhappy: "Kẻ lưu vong Vô ơn"
 pop_outcast_unhappy_desc: "Những kẻ từng bị lưu vong này gặp khó khăn trong việc tìm kiếm chỗ đứng trong xã hội của chúng ta, cảm thấy bản thân không được hoan nghênh, và có xu hướng bày tỏ sự bất mãn với xã hội."
 pop_outcast_crime: "Kẻ lưu vong Phạm tội"
 pop_outcast_crime_desc: "Những kẻ từng bị lưu vong này đã cố gắng lợi dụng lòng tin và lừa gạt lòng tốt của chúng ta."
 #Nona / xenophile2
 paragon.40210.name: "Chuyến cống nạp Thất lạc"
 paragon.40210.desc: "§Y[Root.GetName]§! đã nghe được tin đồn về một hạm đội thất lạc mang theo vô số của cải. Người ta nói rằng một sứ giả người ngoài hành tinh cùng đoàn tùy tùng của ông ta được cử đi mang đồ cống nạp cho một lãnh chúa chiến tranh nào đó. Trong một nhiệm vụ gần đây, [Root.GetHeShe] đã xác định chính xác vị trí cuối cùng của hạm đội này. Chúng ta chỉ cần phái một con tàu đến để thu hồi nó."
 paragon.40210.a: "Đừng bận tâm đến những gì chúng ta làm."
 NONA_LOST_CONVOY: "Chuyến cống nạp Thất lạc"
 NONA_LOST_CONVOY_DESC: "Một hạm đội cổ đại do [event_target:renowned_xenophile2.GetName] phát hiện ra. Lời đồn nói rằng bên trong chứa một lượng lớn của cải."
 paragon.40211.name: "Hoàn tất Trục vớt"
 paragon.40211.desc: "Công việc trục vớt hạm đội thất lạc đã hoàn tất. Tất cả các tài nguyên nằm ở khu vực tai nạn đều đã được thu hồi."
 paragon.40211.a: "Tuyệt vời."
 paragon.40220.name: "Sự "đổ bộ" của Blorg"
 paragon.40220.desc: "Một người bạn cũ của §Y[Root.GetName]§!, nam hành chính quan người Blorg tên là §Y$NONA_BLORG_EX_HUSBAND_NAME$§! muốn gia nhập đế chế của chúng ta. Vị hành chính quan này đang vướng vào rắc rối và đang tìm kiếm cơ hội để bắt đầu lại. [Root.GetFirstName] khẳng định rằng $NONA_BLORG_EX_HUSBAND_NAME$ có rất nhiều kinh nghiệm trong việc quản lý các hành tinh khai khoáng, và vị hành chính quan tốt bụng đó cũng mang theo một rương khoáng thạch quý giá làm quà ra mắt."
 paragon.40220.a: "Ông ta chắc là sẽ có chút tác dụng."
 paragon.40220.a.custom_tooltip: "Một người Blorg tên là §Y$NONA_BLORG_EX_HUSBAND_NAME$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.40220.b: "Không, cảm ơn và tạm biệt."
 NONA_BLORG_EX_HUSBAND_NAME: "Kiram"
 NONA_BLORG_EX_HUSBAND_DESC: "Một người Blorg cần cù, tự lực vươn lên bằng chính đôi tay của mình."
 #Nam tước Vyctor Jariden / militarist1
 paragon.40310.name: "Phá vỡ Gông cùm của [Root.GetHisHerCap]"
 paragon.40310.desc: "Cuối cùng, §Y[Root.GetName]§! cũng đã vượt qua được khoảng thời gian suy sụp sau sự suy tàn của gia tộc. Sau khi phá vỡ gông cùm của sự mặc cảm và đau buồn, [Root.GetHeSheCap] cuối cùng đã tìm thấy ý nghĩa sống mới của [Root.GetHisHer] trong việc phục vụ nhân dân chúng ta."
 paragon.40310.a: "Rất tốt."
 paragon.40320.name: "Người Trương nở Thẳng thắn"
 paragon.40320.desc: "Trong một bài diễn thuyết đầy tâm huyết, §Y[Root.GetName]§! tuyên bố rằng đế chế phải đặt trọng tâm vào việc mở rộng bờ cõi. [Root.GetHeSheCap] đã đệ trình hai kế hoạch về việc điều chuyển thêm tài nguyên cho hạm đội để hoàn thành mục tiêu. Cả hai kế hoạch này đều rất có giá trị đối với hạm đội của chúng ta, và về lâu dài cũng sẽ mang lại lợi ích. Tuy nhiên, việc thực hiện cả hai kế hoạch cùng lúc là điều không thể."
 paragon.40320.a: "Hạm đội mạnh mới là sức mạnh thực sự."
 paragon.40320.b: "Hậu cần mới là chìa khóa của chiến thắng."
 vyctor_aggressive_expansion_plan: "Kế hoạch Bành trướng Tích cực"
 vyctor_aggressive_expansion_plan_desc: "Giành chiến thắng cần có chiến lược, nhưng sức mạnh nội tại mới là cội nguồn của thành công. Khi cần dùng đến vũ lực, đương nhiên càng mạnh càng tốt."
 vyctor_improved_fleet_logistics: "Cải thiện Hậu cần Hạm đội"
 vyctor_improved_fleet_logistics_desc: "Tác dụng của việc nâng cao hiệu quả là tuyệt đối không thể coi thường: tối ưu hóa sản lượng của các xưởng đóng tàu, quá trình bành trướng của chúng ta sẽ trở nên nhanh chóng hơn."
 #Gia'Zumon / militarist2
 paragon.40410.name: "Dày dạn Sa trường"
 paragon.40410.desc: "§Y[Root.GetName]§! đã giành chiến thắng trong vô số cuộc chiến. [Root.GetHeSheCap] từng kề vai sát cánh chiến đấu cùng một chiến binh vĩ đại khác, $GIA_ZUMON_GREAT_WARRIOR_NAME$. Người này hiện đang tìm kiếm một vị chủ nhân mới để phục vụ. Ông ta là một chỉ huy hạm đội quả cảm, và [Root.GetFirstName] dành cho ông ta những lời ca ngợi hết mực."
 paragon.40410.a: "Đến đây, vinh quang đang chờ đón ông."
 paragon.40410.a.custom_tooltip: "Một chỉ huy hạm đội người Qien tên là §Y$GIA_ZUMON_GREAT_WARRIOR_NAME$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.40410.b: "Ông ta có thể dạy chúng ta điều gì về chiến tranh?"
 GIA_ZUMON_GREAT_WARRIOR_NAME: "Hask'Gutra"
 GIA_ZUMON_GREAT_WARRIOR_DESC: "Một chỉ huy hạm đội quả cảm, vào sinh ra tử. Người ta nói [Root.GetHeSheCap] có trái tim sắt đá, chỉ quan tâm đến chết chóc và sự hủy diệt."
 gia_zumon_taught_warfare_by_great_warrior: "Sự Dạy dỗ của $GIA_ZUMON_GREAT_WARRIOR_NAME$"
 gia_zumon_taught_warfare_by_great_warrior_desc: "Hạm đội của chúng ta đã trở nên hùng mạnh hơn khi được đắm mình trong kiến thức của chiến binh vĩ đại đó, $GIA_ZUMON_GREAT_WARRIOR_NAME$."
 paragon.40420.name: "Máu và Bụi"
 paragon.40420.desc: "§Y[Root.GetName]§! đứng ngồi không yên, vô cùng khao khát được chiến đấu. [Root.GetHeSheCap] đã chịu đựng quá đủ đám hèn nhát đang đầu độc [coliseum_planet.GetName]. [Root.GetHeSheCap] đề xuất xây dựng một đấu trường khổng lồ, nơi những kẻ săn lùng danh dự và những tên tội phạm sẽ được nhốt chung vào một chỗ. Một kế hoạch như vậy có thể cung cấp cơ hội huấn luyện thực chiến quý giá cho các chiến binh của chúng ta."
 paragon.40420.a: "Hãy để [Root.GetHimHer] đi làm đi."
 paragon.40420.b: "Không được làm như vậy."
 gia_zumon_arena: "Đấu trường"
 gia_zumon_arena_opened: "Khai mạc Đấu trường"
 gia_zumon_arena_opened_desc: "Mặc dù các chiến binh của chúng ta rất trân trọng cơ hội này để xả stress, nhưng sự khát máu tột độ đã gieo rắc nỗi bất an trong công chúng."
 #Kỹ nghệ gia Shuladun / xenophobe1
 paragon.40510.name: "Đề xuất Tối ưu hóa"
 paragon.40510.desc: "§Y[Root.GetName]§! hy vọng có thể tự động hóa các phương án hậu cần trên [planet_governed.GetName]. Kế hoạch được đề xuất sẽ kết nối các nhà máy, nhà máy tinh chế và cơ sở xử lý thông qua một mạng lưới đường ống và băng chuyền phức tạp. Kế hoạch này nghe có vẻ tốt trên lý thuyết, nhưng lại tiềm ẩn rủi ro đối với người dân sống gần đó. Nguy cơ rò rỉ hóa chất công nghiệp, rò rỉ bức xạ và rung động tần số cao là hoàn toàn có thật."
 paragon.40510.a: "Khởi động kế hoạch."
 paragon.40510.b: "Không được, chúng ta phải bảo vệ người dân."
 factorator_industrial_network: "Mạng lưới Công nghiệp"
 factorator_industrial_network_desc: "Mạng lưới đường ống vận chuyển phức tạp do §Y$NAME_xenophobe1$§! thiết kế tuy cực kỳ hiệu quả, nhưng phải đánh đổi bằng sức khỏe của cư dân."
 paragon.40520.name: "Cuộc Thử nghiệm Có ý nghĩa?"
 paragon.40520.desc: "§Y[Root.GetName]§! đã đệ trình một kế hoạch nghiên cứu nhằm đánh giá sự phát triển công nghiệp trong tương lai. Nghiên cứu này sẽ mang lại lợi ích cho nền kinh tế, đồng thời thúc đẩy sự phát triển cá nhân của [Root.GetHisHer]. [Root.GetHeSheCap] đã chuẩn bị một loạt các cuộc thử nghiệm vô cùng có ý nghĩa, nhưng có thể dẫn đến cái chết của các đối tượng thử nghiệm. [Root.GetHeSheCap] cam đoan với chúng ta rằng những thử nghiệm này chỉ cần một chút hy sinh nhỏ để đạt được mục đích cao cả."
 paragon.40520.a: "Tiến hành đi."
 paragon.40520.b: "Không, chuyện này thật quá vô nhân đạo."
 factorator_inhumane_work_experiments: "Thử nghiệm Công nghiệp Tàn nhẫn"
 factorator_inhumane_work_experiments_desc: "Công việc thúc đẩy công nghiệp tiến xa hơn của §Y$NAME_xenophobe1$§! không phải là không có cái giá của nó; những người sống sót sau các cuộc thử nghiệm của hắn đã nhanh chóng chứng minh cho câu nói đó."
 factorator_inhumane_work_experiments_stopped: "Tránh các Cuộc Thử nghiệm Tàn nhẫn"
 factorator_inhumane_work_experiments_stopped_desc: "Các công nhân công nghiệp vô cùng vui mừng khi được cứu khỏi những cuộc thử nghiệm tàn nhẫn của §Y$NAME_xenophobe1$§!."
 #Aturion / xenophobe2
 paragon.40610.name: "Kế hoạch Kiểm soát Dân số"
 paragon.40610.desc: "§Y[Root.GetName]§! đã đề xuất một kế hoạch tối ưu hóa dân số, bằng cách hy sinh một số quyền tự do cá nhân nhất định để nâng cao năng suất ít nhất 6,98%."
 paragon.40610.a: "Khởi động kế hoạch."
 paragon.40610.b: "Tốt nhất là không."
 aturion_population_reform: "Cải cách Dân số"
 aturion_population_reform_desc: "Vì lợi ích của tập thể, người dân vốn dĩ phải sẵn sàng hy sinh cả tính mạng và thân thể của mình. So với điều đó, những thay đổi nhỏ nhặt này chẳng đáng để nhắc tới."
 paragon.40620.name: "Kế hoạch Cải tạo Tội phạm"
 paragon.40620.desc: "§Y[Root.GetName]§! đã phát triển một kế hoạch cải tạo phức tạp để biến những phần tử bất hảo trong xã hội thành những công dân cần mẫn. Đánh giá rủi ro ước tính rằng 17,3% tội phạm sẽ không có khả năng làm lại cuộc đời, và đây nên được coi là 'tổn thất có thể chấp nhận được'."
 paragon.40620.a: "Khởi động kế hoạch."
 paragon.40620.b: "Có thể giảm thiểu rủi ro xuống một chút nữa được không?"
 aturion_forced_rehabilitation_programs: "Chương trình Phục hồi Cưỡng chế"
 aturion_forced_rehabilitation_programs_desc: "Việc bắt một người từ bỏ thói quen phạm tội của mình đòi hỏi rất nhiều nỗ lực, và thông thường cần phải có sự can thiệp từ bên ngoài. Chúng ta sẽ cung cấp các biện pháp can thiệp đó một cách hợp lý."
 aturion_criminal_reformation_programs: "Chương trình Cải tạo Tội phạm"
 aturion_criminal_reformation_programs_desc: "Những dự án này dựa vào giáo dục và sự cải thiện, thay vì các biện pháp cưỡng chế phòng ngừa, điều này giúp người dân cảm thấy hạnh phúc hơn."
 #Jynn / egalitarian1
 paragon.40710.name: "Người Học việc Thuần thục"
 paragon.40710.desc: "Đặc phái viên của Giáo phái Cân bằng Tuyệt đối, §Y[Root.GetName]§! đã thu nhận một người học việc. Vị chiến binh trẻ tuổi đầy triển vọng này muốn thề trung thành với chúng ta."
 paragon.40710.a: "Tất nhiên là hoan nghênh."
 paragon.40710.a.custom_tooltip: "Chỉ huy thực tập của §Y$NAME_egalitarian1$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.40710.b: "Chúng ta không cần tướng quân, chúng ta cần sĩ quan."
 JYNN_APPRENTICE_DESC: "Được huấn luyện từ nhỏ bởi chiến binh [event_target:renowned_egalitarian1.GetName], sẽ giúp đỡ những người cần sự trợ giúp."
 jynn_recruited_army_officers: "Tuyển dụng Sĩ quan Lục quân"
 jynn_recruited_army_officers_desc: "Đối với mọi chỉ huy, những thuộc cấp đáng tin cậy và trung thành là điều tối quan trọng."
 paragon.40720.name: "Sự Hỗ trợ Tuyệt đối"
 paragon.40720.desc: "§Y[Root.GetName]§! đã yêu cầu sự hỗ trợ từ giáo phái "Cân bằng Tuyệt đối" của [Root.GetHisHer] để giúp đế chế của chúng ta tiếp tục chống lại sự chuyên chế và những kẻ áp bức. Tàu chở hàng mang theo những hợp kim quý giá đã cập bến từ căn cứ bí mật của họ."
 paragon.40720.a: "Thứ này rất có ích."
 #Zosira K'Tun / egalitarian2
 paragon.40810.name: "Khoa học chính là Phép thuật"
 paragon.40810.desc: "§Y[Root.GetName]§! và robot đồng hành Gorky của [Root.GetHisHer] dành phần lớn thời gian rảnh rỗi để tiến hành các thử nghiệm cá nhân. Vài thử nghiệm trong số đó đã mang lại những kết quả thú vị, và [Root.GetHeShe] đã chia sẻ những khám phá của [Root.GetHisHer] với các nhà khoa học trong đế chế của chúng ta."
 paragon.40810.a: "Đúng là tin tốt."
 paragon.40820.name: "Nhận nuôi Thú cưng Ngoại lai"
 paragon.40820.desc: "§Y[Root.GetName]§! đã nhận nuôi một sinh vật ngoài hành tinh để bầu bạn cùng với trợ lý robot Gorky của [Root.GetHisHer]. Đó là một loài nhuyễn thể màu sắc sặc sỡ, chưa khai mở trí tuệ nhưng lại thể hiện trí thông minh khá ấn tượng, có thể phản ứng với các mệnh lệnh bằng tiếng huýt sáo. Việc nhận nuôi sinh vật này dường như đã thay đổi tính cách của [Root.GetHisHer], [Root.GetHimHer] trở nên có trách nhiệm hơn và chín chắn hơn."
 paragon.40820.a: "Nó không cắn người chứ?"
 #Xondar / materialist1
 paragon.40910.name: "[Root.GetName] 2.0"
 paragon.40910.desc: "§Y[Root.GetName]§! tuyên bố rằng đã "cải thiện" cơ thể của [Root.GetHisHer] về nhiều mặt. Trong khi chưa được sự cho phép, [Root.GetHeShe] đã gửi một thông điệp đến toàn bộ hạm đội để ăn mừng việc [Root.GetHisHer] đạt đến trạng thái hoàn hảo, và phát biểu một bản tuyên ngôn rằng lối thoát duy nhất cho nền văn minh là thăng thiên tổng hợp: mọi sinh mệnh hữu cơ đều mỏng manh yếu ớt và không thể trốn thoát khỏi cái chết."
 paragon.40910.a: "[Root.GetHeSheCap] sẽ dẫn đường cho chúng ta."
 paragon.40910.b: "Thật là một kẻ không biết xấu hổ!"
 paragon.40920.name: "Hợp kim Giá cao"
 paragon.40920.desc: "§Y[Root.GetName]§! đã thu thập dữ liệu từ tất cả các cảm biến tàu vũ trụ trong lãnh thổ. Bằng cách sử dụng thuật toán để tính toán biến dạng trọng lực, [Root.GetFirstName] đã phát hiện ra có thứ gì đó ẩn giấu dưới bề mặt của một thiên thể trong không gian của chúng ta. Nếu dữ liệu chính xác, ẩn dưới khối đá cằn cỗi đó phải chứa đầy hợp kim quý hiếm. [Root.GetFirstName] coi đây là một cơ hội tuyệt vời để mở rộng và nâng cấp hạm đội, [Root.GetHeSheCap] đề xuất phái một con tàu công trình đến để khai thác số hợp kim đó."
 paragon.40920.a: "Đúng là tài nguyên có giá trị."
 XONDAR_VALUABLE_ALLOYS: "Hợp kim Giá cao"
 XONDAR_VALUABLE_ALLOYS_DESC: "Hợp kim có giá trị cao do chỉ huy hạm đội [event_target:renowned_materialist1.GetName] phát hiện trên hành tinh cằn cỗi này."
 paragon.40921.name: "Hợp kim Sẵn có"
 paragon.40921.desc: "Sau khi phá hủy lớp đất đá sâu vài km, một khối lượng hợp kim quý giá đã được phát hiện. Chúng ta đã bắt đầu các hoạt động thu hồi."
 paragon.40921.a: "Tuyệt lắm."
 #Borin / materialist2
 paragon.41010.name: "Tại hạ sinh ra ở..."
 paragon.41010.desc: "§Y[Root.GetName]§! đã đóng cửa trong phòng suốt nhiều tháng trời để viết cuốn tự truyện, trong đó không chỉ chứa đựng kinh nghiệm cả đời của [Root.GetHisHer], mà còn có những kiến thức của [Root.GetHeShe] về nghiên cứu kỹ thuật, xây dựng và vật liệu quý hiếm. Chỉ cần nghiền ngẫm kiệt tác của [Root.GetHisHer], các nhà khoa học của chúng ta nhất định sẽ tìm ra được điều gì đó mới mẻ."
 paragon.41010.a: "Chắc chắn là những kiến thức hữu ích."
 paragon.41020.name: "Gửi lời chào đến $BORIN_ROBOT_COMPANION_NAME$"
 paragon.41020.desc: "§Y[Root.GetName]§! đã chế tạo một người bạn máy móc, có tên là $BORIN_ROBOT_COMPANION_NAME$. Robot này có khả năng học hỏi nâng cao và sở hữu một ma trận nhân cách. Nó hỗ trợ [Root.GetName] trong việc tiến hành các nghiên cứu và công việc sửa chữa của [Root.GetHisHer]. Tuy nhiên, giống như người tạo ra nó, $BORIN_ROBOT_COMPANION_NAME$ cũng vô cùng tò mò và khao khát được rời nhà để dấn thân vào những cuộc phiêu lưu. [Root.GetName] hỏi chúng ta, liệu $BORIN_ROBOT_COMPANION_NAME$ có thể có một vị trí tự chủ trong xã hội của chúng ta hay không?"
 paragon.41020.a: "Ông nói cô ấy sửa tàu rất giỏi phải không?"
 paragon.41020.a.custom_tooltip: "Một nữ chỉ huy hạm đội người máy tên là §Y$BORIN_ROBOT_COMPANION_NAME$§! đã gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 paragon.41020.b: "Chúng ta có thể sắp xếp nó vào làm ở vài văn phòng..."
 BORIN_ROBOT_COMPANION_NAME: "Beryllia"
 BORIN_ROBOT_COMPANION_DESC: "Một trợ lý trí tuệ nhân tạo do người thu gom phế liệu [event_target:renowned_materialist2.GetName] chế tạo và đào tạo."
 borin_administrator_beryllia: "Quan chức $BORIN_ROBOT_COMPANION_NAME$"
 borin_administrator_beryllia_desc: "Robot đồng hành của người thu gom phế liệu §Y$NAME_materialist2$§!, hiện đang làm việc trong văn phòng, có thể tích cực tận dụng khả năng học hỏi nâng cao của mình để hợp lý hóa các quy trình của đế chế."
 #Thẩm phán Uld Dagr / pacifist1
 paragon.41110.name: "Tội ác Hiện hình"
 paragon.41110.desc: "§Y[Root.GetName]§! đã dành thời gian dài để điều tra một mạng lưới tội phạm hoạt động ngầm trong lãnh thổ của chúng ta. [Root.GetHeSheCap] đã tập hợp được bằng chứng về sự cấu kết giữa rất nhiều trùm tội phạm và cướp biển với các chính trị gia cùng các sĩ quan quân đội tham nhũng. [Root.GetName] đã áp dụng hệ thống mới để đẩy nhanh thủ tục tư pháp đối với những vụ án như vậy, nhằm mục đích tóm gọn những kẻ phạm tội trước khi chúng có cơ hội rời khỏi khu vực tài phán của chúng ta."
 paragon.41110.a: "Điều này sẽ mang lại lợi ích cho tất cả mọi người."
 judge_improved_crime_fighting_laws: "Đàn áp Tội phạm"
 judge_improved_crime_fighting_laws_desc: "Một loạt các quy định mới nhằm chống lại những âm mưu phạm tội quy mô lớn"
 paragon.41120.name: "Bàn về Bản chất của Tội ác"
 paragon.41120.desc: "§Y[Root.GetName]§! đã dành hơn nửa cuộc đời của [Root.GetHisHer] để nghiên cứu về nguồn gốc của tội ác và động cơ đằng sau những hành vi bạo lực. [Root.GetHeSheCap] tìm kiếm lời khuyên từ các chuyên gia, nghiên cứu nền văn hóa của các đế chế khác hiện tại và trong quá khứ, và sử dụng các thuật toán tiên tiến để phác thảo hình ảnh của một xã hội không tưởng. Tâm huyết cả đời của [Root.GetHisHerCap] đã được đúc kết thành một luận văn xã hội học đồ sộ, thứ sẽ đóng vai trò dẫn lối cho nhiều thế hệ mai sau."
 paragon.41120.a: "Một điều tuyệt vời cho tất cả mọi người."
 #Vas Hào Nhoáng / pacifist2
 paragon.41210.name: "Hòa bình và Thịnh vượng"
 paragon.41210.desc: "§Y[Root.GetName]§! nổi tiếng nhờ tổ chức những bữa tiệc xa hoa. Những bữa yến tiệc này được biết đến với những màn trình diễn đặc sắc của các thành viên Hội Chị em của Hành tinh Từ Thạch Alyssum, đồ ăn thức uống kỳ lạ, cũng như các cuộc thảo luận về triết học và luân lý. Tại đây, con người xây dựng các mối quan hệ, xúc tiến giao dịch và gỡ bỏ những nút thắt trong lòng. Khả năng kết nối biết bao con người có sự khác biệt lớn lao như vậy của [Root.GetHisHerCap] chính là nền tảng vững chắc cho sự thịnh vượng của chúng ta."
 paragon.41210.a: "Đoàn kết là sức mạnh."
 vas_population_united: "Nhân dân Đoàn kết"
 vas_population_united_desc: "§Y$NAME_pacifist2$§! vô cùng được yêu mến, khả năng và uy tín của cô ấy đã kéo mọi người xích lại gần nhau, một xã hội đoàn kết đã trở nên vững chắc hơn."
 paragon.41220.name: "Khi Chúng ta Cần"
 paragon.41220.desc: "§Y§![Root.GetName] thực sự là một nghệ nhân trong nghệ thuật thuyết phục. [Root.GetHeSheCap] đã tận dụng mạng lưới quan hệ và sức ảnh hưởng chính trị của [Root.GetHisHer] để thu thập những thông tin quan trọng từ khắp dải ngân hà. [Root.GetFirstName] lưu giữ toàn bộ kiến thức của [Root.GetHisHer] trong một món đồ gia truyền: một viên pha lê màu xanh lục nhạt mà [Root.GetHeShe] thi thoảng sẽ đeo trong những bữa tiệc xa xỉ của [Root.GetHisHer]. Khi được quan sát dưới một quang phổ đặc biệt, bí mật của viên pha lê sẽ được chiếu ra dưới hình dạng một quầng sáng rực rỡ. Giờ đây [Root.GetHeShe] cho rằng đã đến lúc sử dụng những kiến thức này vì lợi ích của xã hội."
 paragon.41220.a: "Chúng ta sẽ sử dụng nó một cách hợp lý."
 #Kai-Sha / authoritarian1
 paragon.41310.name: "Kho Tình báo"
 paragon.41310.desc: "§Y[Root.GetName]§! đã đệ trình một cơ sở dữ liệu chứa đựng những thông tin nhạy cảm thu thập được qua nhiều năm từ các đặc tình của [Root.GetHisHer]. Cơ sở dữ liệu khổng lồ này bao gồm các kế hoạch triển khai quân sự, nghiên cứu mật, dữ liệu đọc ý thức và nhiều thông tin khác. Những thứ này tất nhiên cực kỳ có giá trị, nhưng việc sử dụng chúng có thể làm trầm trọng thêm các xung đột cả bên trong lẫn bên ngoài."
 paragon.41310.a: "Sử dụng dữ liệu."
 paragon.41310.a.custom_tooltip: "§Y25%§! xác suất các đế chế khác sẽ giảm §R-25§! điểm đánh giá đối với chúng ta."
 paragon.41310.b: "Tiêu hủy dữ liệu."
 opinion_has_sensitive_information_about_us: "Sở hữu thông tin nhạy cảm về chúng ta"
 paragon.41320.name: "Mở rộng Mạng lưới Thông tin"
 paragon.41320.desc: "§Y[Root.GetName]§! tiếp tục mở rộng mạng lưới đặc tình của [Root.GetHisHer] trên toàn dải ngân hà. Một số người tự nguyện cung cấp thông tin, trong khi những người khác thì bị tống tiền hoặc tẩy não. Nhưng dù thế nào đi nữa, thông tin mà [Root.GetHeShe] thu thập được sẽ vô cùng hữu ích."
 paragon.41320.a: "Tri thức là sức mạnh."
 paragon.41320.a.intel.custom_tooltip: "Thông tin tình báo đối với các đế chế khác: §G+$@paragon_41320_a_intel_amt$§!"
 #Quản đốc Q'la-Minder / authoritarian2
 paragon.41410.name: "Cung điện Xa hoa"
 paragon.41410.desc: "§Y[Root.GetName],§! vị hành chính quan sống vô cùng xa hoa lãng phí đó, đã cho xây dựng một cung điện tráng lệ tại [planet_governed.GetName] cho riêng [Root.GetHimselfHerself]. Cung điện này vừa phô trương quyền lực và sự giàu có của [Root.GetHisHer], vừa vạch trần thói phô trương và sự thối nát của [Root.GetHisHer]. Để ăn mừng sự kiện hoàn thành cung điện, [Root.GetHeShe] sẽ tổ chức một bữa tiệc khổng lồ, tất cả những nhân vật tầm cỡ đều được mời tham dự. [Root.GetHeShe] cũng sẽ hiếm hoi thể hiện sự hào phóng khi chia sẻ một phần của cải của [Root.GetHisHer] với người dân."
 paragon.41410.a: "Chúng ta còn có thể mong đợi gì ở hắn chứ?"
 qla_minder_vanity_palace: "Cung điện Xa hoa"
 qla_minder_vanity_palace_desc: "Công trình kiến trúc đồ sộ này vừa lố lăng lại vừa cuốn hút."
 paragon.41420.name: "Kẻ Tham nhũng"
 paragon.41420.desc: "Hành vi tham nhũng của vị hành chính quan xa hoa vô độ §Y[Root.GetName]§! đã bị vạch trần. Tình trạng này đã diễn ra trong một khoảng thời gian khá dài, [Root.GetHeShe] không chỉ gửi tài sản của [Root.GetHisHer] vào ngân hàng, mà còn giấu trong các hầm ngầm bí mật và những nơi cất giấu sâu trong không gian nằm rải rác khắp các hệ sao. Khi bị chất vấn, [Root.GetHeShe] nước mắt ngắn nước mắt dài, dập đầu lia lịa và thề thốt rằng mục đích thực sự của những khối tài sản này là để chuẩn bị làm quà dâng lên quân vương."
 paragon.41420.a: "Đồ sâu mọt!"
 #Ulastar / spiritualist1
 paragon.41510.name: "Lời Tiên tri Vĩ đại"
 paragon.41510.desc: "Trong nhiều năm qua, con người bí ẩn §Y[Root.GetName]§! đã giải mã rất nhiều điềm báo và dấu hiệu hé lộ những vận mệnh lớn lao hơn. Giờ đây, [Root.GetSheHe] tuyên bố đã nhìn thấy viễn cảnh toàn bộ dải ngân hà sẽ thống nhất dưới một lá cờ duy nhất - và đó chính là lá cờ của chúng ta. Vinh quang thực sự vẫn đang chờ ở phía trước."
 paragon.41510.a: "Vinh quang vĩ đại đang chờ đón chúng ta."
 ulastar_prophesied_greater_destiny: "Tiên tri về Vận mệnh Vĩ đại"
 ulastar_prophesied_greater_destiny_desc: "Lời tiên tri của §Y$NAME_spiritualist1$§! về một tương lai huy hoàng đã tiếp thêm ngọn lửa nhiệt huyết cho mọi người."
 paragon.41520.name: "Đi theo Tiếng gọi"
 paragon.41520.desc: "Trong nhiều năm, §Y[Root.GetName]§! đã luôn truyền những giấc mơ tâm linh mạnh mẽ ra ngoài không gian hư không. Giờ đây, một vài tàu dân sự chở theo thành viên của nhiều chủng tộc khác nhau đã xuất hiện trên quỹ đạo của [planet_governed.GetName]. Họ nguyện phục vụ cho chúng ta, với mong muốn được sống cùng với nhà tiên tri của họ."
 paragon.41520.a: "Họ sẽ gia nhập dân tộc của chúng ta."
 paragon.41520.a.custom_tooltip: "Bổ sung thêm §Y300§! dân số tâm linh mang tư tưởng Duy tâm trên hành tinh [event_target:planet_governed.GetName]."
 paragon.41520.b: "Chúng ta không chào đón họ."
 #Nasuz Demetor / spiritualist2
 paragon.41610.name: "Di vật Cổ đại"
 paragon.41610.desc: "Nhà lưu trữ §Y[Root.GetName]§! đã phát hiện ra một nơi cất giấu di vật cổ đại. [Root.GetHeSheCap] đã xâu chuỗi thông tin về hành tung của chúng từ những truyền thuyết cổ xưa và nhật ký cảm biến trao đổi của hải tặc. Nguồn gốc của những đồ vật bí ẩn này vẫn chưa được làm rõ, nhưng thông qua việc hấp thụ âm thanh tần số thấp, chúng thỉnh thoảng sẽ tạo ra những sự bẻ cong thời gian nhẹ. Công nghệ này có lẽ sẽ có ích cho chúng ta."
 paragon.41610.a: "Đúng là một khám phá có giá trị."
 paragon.41620.name: "Lời nói từ Hư không"
 paragon.41620.desc: "Nhà lưu trữ §Y[Root.GetName]§! đã thu chặn được một đoạn thông điệp kỳ lạ. Đoạn thông điệp này đã vang vọng giữa các vì sao trong suốt hàng ngàn năm, và bị nhiễu tĩnh điện nghiêm trọng. Nó chứa đựng những lời chào hỏi từ một nền văn minh ngoài hành tinh, cũng như vị trí chính xác của hành tinh quê hương của họ. Loài này đã tuyệt chủng từ rất lâu, nhưng có thể vẫn còn những di tích quan trọng và kiến thức cổ đại đang chờ được khám phá trên hành tinh mẹ của họ."
 paragon.41620.a: "Ai biết được liệu chúng ta có tìm thấy thứ gì tốt không?"
 paragon.41620.a.custom_tooltip: "Khám phá một khu di tích khảo cổ mới trên hành tinh §Y[event_target:nasuz_arcsite_planet.GetName]§!."
 #Các hiệu ứng Đế chế
 integrated_command: "Hệ thống Chỉ huy Tích hợp"
 integrated_command_desc: "Quy trình chỉ huy tích hợp của chúng ta cho phép đổi mới phương thức sử dụng các tàu tấn công trong chiến đấu. Chúng ta cũng sẽ thoát khỏi những cuộc tranh cãi phiền toái trong nội bộ bộ tư lệnh hải quân."
 crisis_studied: "Sự thấu hiểu Khủng hoảng của Skrand"
 crisis_studied_desc: "Nhờ vào sự thấu hiểu của Skrand, chúng ta có thể vạch ra những chiến lược hiệu quả để chiến đấu với các thế lực Khủng hoảng."
 crisis_studied_damage_desc: "Sát thương gây ra cho thế lực Khủng hoảng: §G+20%§!"
 talon_armor: "Phân lớp Thiết giáp"
 talon_armor_desc: "Việc nghiên cứu lớp lá chắn bề mặt của con tàu Móng Vuốt đã mang lại cho chúng ta ý tưởng tối ưu hóa thân tàu. Điều này có thể tăng cường khả năng phòng vệ bằng lá chắn của các con tàu mà không làm tăng tổng trọng lượng của chúng."
 talon_hull: "Gia cố Thân tàu"
 talon_hull_desc: "Thông qua việc nghiên cứu thân tàu của con tàu Móng Vuốt, sự hiểu biết của chúng ta về cấu trúc tàu vũ trụ đã đạt được tiến bộ đáng kể, và sẽ sớm được áp dụng vào hoạt động gia cố thân tàu thực tế."
 skrand_story: "Cảm nhận Từ Lịch sử"
 skrand_story_desc: "Người dân của chúng ta đã cảm động trước những lời chia sẻ của Skrand, coi ông là hình mẫu của phẩm chất quân nhân, và là nhân vật quan trọng nhắc nhở mọi người phải luôn cảnh giác."
 #Đô đốc Cổng Không gian
 paragon.3000.desc: "Chúng ta đã khôi phục thành công nguồn năng lượng của cánh Cổng Không gian cổ đại trong hệ sao [gateway_system.GetName]! Bất chấp tuổi đời của nó, thiết bị này vẫn tạo ra một lối đi không gian thứ nguyên ổn định hoàn toàn có thể đi lại được.\n\nChúng ta cũng đã phát hiện các tín hiệu năng lượng bất thường, tương tự như khi có vật thể ra vào Cổng Không gian, nhưng không có bất kỳ dấu vết nào của các con tàu đi qua."
 paragon.3000.a: "Giám sát tình hình."
 paragon.3001.name: "Sự Xuất hiện"
 paragon.3001.desc: "Một con tàu khổng lồ xuất hiện từ Cổng Không gian, kích thước khổng lồ của nó là thứ chúng ta chưa từng thấy trước đây. Quân đội đã được đặt trong tình trạng báo động cao.\n\nCon tàu lạ không phản hồi các tín hiệu liên lạc của chúng ta, nhưng do có vẻ như nó đã hoàn toàn tê liệt, chúng ta sẽ tạm thời không giao chiến với nó. Chúng ta vẫn đang tiến hành điều tra và cố gắng mở lại liên lạc."
 paragon.3001.a: "Thật là quá lớn!"
 paragon.3001.b: "Thực hiện quy trình quét."
 paragon.3002.name: "Thấu hiểu"
 paragon.3002.desc: "Cuộc điều tra của chúng ta đối với con tàu khổng lồ này không thu thập được nhiều thông tin. Tuy nhiên, chúng ta đã có thể giải mã được một số dữ liệu nhận được vào thời điểm Cổng Không gian mở ra lần đầu tiên. Có vẻ như, con tàu này đã bị mắc kẹt trong Cổng Không gian một thời gian (có thể là lâu đến mức khó có thể tưởng tượng được).\n\nĐể tìm hiểu thêm, chúng ta cần phải lên tàu. Do đây là một tàu chiến quân sự, nên tôi đề xuất cử lực lượng đặc nhiệm đi."
 paragon.3002.a: "Chuẩn bị tàu vận tải lục quân."
 PARAGON_GATEWAY_DUDE_PROJECT: "Chiến dịch Lên tàu"
 PARAGON_GATEWAY_DUDE_PROJECT_DESC: "Chúng ta phải lên con tàu của người ngoài hành tinh này. Những tín hiệu năng lượng yếu ớt cho thấy có thể vẫn còn một hệ thống duy trì sự sống đang hoạt động bên trong. Có khả năng có người hoặc thứ gì đó đang ẩn nấp trên tàu. Những người lính của chúng ta rất háo hức muốn tìm ra câu trả lời."
 paragon.3003.name: "Sự Chào đón Căng thẳng"
 paragon.3003.desc: "Ngay sau khi lên tàu, chúng tôi đã chạm trán với một nhóm người ngoài hành tinh kỳ dị. Do sự xuất hiện đột ngột của chúng tôi, nhiều người ngoài hành tinh đã bị hoảng sợ và rút vũ khí ra. Ơn giời, cuộc đọ súng đã được tránh khỏi!\n\nSau khi yêu cầu cả hai bên bình tĩnh, người chỉ huy ngoài hành tinh giải thích rằng con tàu này cần được sửa chữa khẩn cấp. Một khi tất cả các hệ thống hoạt động bình thường, ông ta và thủy thủ đoàn dự định trở về hành tinh quê hương của họ, Skalavid.\n\nVị chỉ huy này mặc quân phục chỉnh tề, hình ảnh của ông ta rất ấn tượng. Thủy thủ đoàn của con tàu này đều tỏ ra vô cùng kính trọng khi nhắc đến ông, sức hút cá nhân của ông thậm chí còn ảnh hưởng đến cả nhân sự của chúng ta. Ông ta đã tạo ra khả năng thiết lập quan hệ ngoại giao chính thức giữa hai bên."
 paragon.3003.desc_gestalt: "Bên trong con tàu, chúng tôi tìm thấy một nhóm người ngoài hành tinh đang cố gắng khôi phục các chức năng của con tàu. Sự xuất hiện đột ngột của chúng tôi khiến họ cảm thấy bị đe dọa, và nhiều người ngoài hành tinh nhanh chóng rút vũ khí ra. Mặc dù xung đột đã được tránh khỏi, chỉ huy người ngoài hành tinh rõ ràng vẫn coi chúng ta là kẻ thù.\n\nÔng ta mặc quân phục chỉnh tề, khí phách phi phàm. Ngay cả trong mắt chúng ta, sức hút cá nhân của ông ta cũng rất rõ ràng. Tuy nhiên, hiện tại có vẻ rất khó để giao tiếp thêm."
 paragon.3003.a: "Giúp người chỉ huy sửa chữa tàu của ông ta."
 paragon.3003.b: "Mặc kệ ông ta. Chuyển sang chiếm giữ con tàu này."
 PARAGON_GATEWAY_DUDE_REPAIR_PROJECT: "Sửa chữa Tàu của Người Ngoài hành tinh."
 PARAGON_GATEWAY_DUDE_REPAIR_PROJECT_DESC: "Con tàu này cần được bảo trì toàn diện. Chúng ta tự nguyện hỗ trợ công việc sửa chữa."
 paragon.3004.name: "Vị Chỉ huy Bị lãng quên"
 paragon.3004.intro: "Đội ngũ kỹ thuật của chúng ta đã hỗ trợ cho thủy thủ đoàn người ngoài hành tinh. Phiên hiệu của con tàu này đại khái có thể dịch là "Móng Vuốt Một", và người chỉ huy ngoài hành tinh tự xưng là Skrand Sharpbeak, một vị đô đốc hải quân cực kỳ uy danh.\n\nThông qua việc so sánh dữ liệu của Móng Vuốt Một với dữ liệu của chúng ta, chúng ta xác nhận rằng Skrand và thủy thủ đoàn của ông ta đã bị mắc kẹt trong Cổng Không gian tới vài ngàn năm. Đối với họ, đó chỉ là một chuyến đi ngắn ngủi, nhưng đối với các khu vực khác của ngân hà, hàng ngàn năm đã trôi qua."
 paragon.3004.a.desc: "$paragon.3004.intro$\n\nNhờ vào các cuộc khai quật tại Skalavid, ít nhất chúng ta đã có thể chỉ cho Chỉ huy Sharpbeak vị trí hành tinh quê hương của ông, nhưng tất cả những người và những điều ông từng yêu thương đều đã ra đi mãi mãi."
 paragon.3004.b.desc: "$paragon.3004.intro$\n\nHọ đã mất đi nhà cửa, tất cả những người và những điều họ từng yêu thương đều đã ra đi mãi mãi."
 paragon.3004.a: "Một định mệnh bi thảm."
 paragon.3005.name: "Skrand Sharpbeak"
 paragon.3005.desc: "§HChỉ huy của Móng Vuốt Một, Skrand Sharpbeak, gửi lời chào đến chúng ta. Ông ấy trông có vẻ kiệt sức.§!\n\nSkalavid đã sụp đổ. Quê hương của tôi không còn nữa. Hàng tỷ sinh mạng... đã ra đi.\n\nMóng Vuốt Một giờ đây đã trở thành chiếc Móng Vuốt cuối cùng, và tôi cũng trở thành một người lính không nơi nương tựa. Cảm ơn sự giúp đỡ của các bạn, thay mặt cho thủy thủ đoàn, tôi xin thề sẽ trung thành với các bạn."
 paragon.3005.a: "Cảm ơn. Nhưng chúng ta cũng có những chỉ huy đáng kính."
 paragon.3005.a.response: "§HSkrand chớp mắt và ho lên vài tiếng.§!\n\nTôi dĩ nhiên biết điều đó. Nhưng các bạn phải hiểu rằng sự cống hiến của tôi không hề được trao đi một cách dễ dàng. Để thể hiện thiện chí, tôi sẽ ra lệnh cho các kỹ sư của mình duy trì hoạt động của tàu Móng Vuốt, và hướng dẫn các kỹ sư của các bạn cách bảo trì nó."
 paragon.3005.b: "Vậy ông có bản lĩnh gì để ngăn chúng ta chiếm lấy nó không?"
 paragon.3005.b.response: "§HSharpbeak lùi lại vài bước, chiếc mỏ của ông ta phát ra một chuỗi tiếng rít vô cùng chói tai.§!\n\nCon tàu này là niềm vinh quang của quê hương đã khuất của tôi, được những người thợ chế tạo bằng cả đôi vuốt và sinh mạng của họ! Đây là chiếc lông vũ cuối cùng của vùng đất quê hương, là chỗ dựa cuối cùng để chúng tôi hoài niệm về những tổ ấm tuổi thơ.\n\n§HSkrand điều chỉnh lại tư thế, bình tĩnh lại.§!\n\nNói tóm lại, tôi sẽ chiến đấu bằng cả mỏ và vuốt, cho đến lúc chết mới thôi."
 paragon.3005.c: "Chiêu mộ lãnh đạo"
 paragon.3005.c_custom_tooltip: "§LTốt lắm. Chúng ta chấp nhận sự cống hiến của ông. Hãy chiến đấu vì vinh quang, Chỉ huy.§!\n$SEPARATOR$\n"
 paragon.3005.c.response: "§HSharpbeak vươn mình chỉnh lại những chiếc lông vũ.§!\n\nTôi sẽ làm vậy. Móng Vuốt Cuối Cùng sẽ lại bay lượn trên bầu trời với một danh phận mới. Các bạn đã cho chúng tôi tìm thấy ý nghĩa để tiếp tục sống. Cảm ơn các bạn."
 paragon.3005.d_custom_tooltip: "§LNgôn từ luôn thật yếu ớt. Tạm biệt, Chỉ huy.§!"
 paragon.3005.d: "Giải tán"
 paragon.3005.d.response: "§HÁnh mắt của Sharpbeak rực lửa.§!\n\nVậy cũng tốt. Móng Vuốt Cuối Cùng sẽ bay lượn đơn độc một mình. Tạm biệt."
 NAME_LastTalon: "Móng Vuốt Cuối Cùng"
 paragon.3006.name: "Chiến thắng!"
 paragon.3006.desc: "Binh lính của chúng ta dễ dàng đánh bại thủy thủ đoàn của con tàu ngoài hành tinh. Chúng ta đã phá hủy hàng phòng thủ của họ, và quét sạch lính địch trên đài chỉ huy. Con tàu này đã thuộc về chúng ta!"
 paragon.3006.a: "Chúng ta sẽ nghiên cứu bí mật của nó."
 paragon.3007.name: "Một cuộc Tàn sát!"
 paragon.3007.desc: "Lực lượng đổ bộ lên tàu ngoài hành tinh của chúng ta đã bị tàn sát! Kẻ thù hung hãn đến khó tin. Sau khi trận chiến kết thúc, chúng ta đã khởi động lại hệ thống chiến thuật của con tàu. Hệ thống cho thấy động cơ siêu quang tốc vẫn chưa thể khởi động, nhưng chính bản thân con tàu đang chủ động tranh giành quyền điều khiển với chúng ta."
 paragon.3007.a: "Phái hạm đội đến!"
 paragon.3902.name: "Con tàu Khổng lồ"
 paragon.3902.desc: "Trong cuộc khảo sát thông thường, chúng ta phát hiện con tàu này vẫn luôn canh gác bên cạnh Cổng Không gian đang hoạt động, nhưng nó không hề phản hồi bất kỳ tín hiệu liên lạc nào của chúng ta, và dường như nó đang hoạt động ở mức năng lượng cao."
 paragon.3902.a: "Tiến hành điều tra sâu hơn."
 first_claw: "Móng Vuốt"
 first_claw_plural: "Móng Vuốt"
 NAME_Skrand_Sharpbeak: "Skrand Sharpbeak"
 NAME_WingsOfGlory: "Chuyến bay Cuối cùng"
 NAME_FirstTalon: "Móng Vuốt Một"
 NAME_FirstClaw: "Móng Vuốt"
 NAME_Unknown2: "Chưa rõ"
 talon_power: "Nâng cấp Móng Vuốt"
 tech_strike_craft_skrand: "Phi thuyền Tấn công Skalavid"
 tech_strike_craft_skrand_desc: "Nhờ vào kinh nghiệm thiết kế học được từ Skrand và người của ông, những phi thuyền tấn công tiên tiến này có thể sử dụng các chiến thuật linh hoạt để tham chiến trong thời gian dài."
 STRIKE_CRAFT_SKRAND: "$tech_strike_craft_skrand$"
 STRIKE_CRAFT_SKRAND_DESC: "$tech_strike_craft_skrand_desc$"
 paragon.3010.name: "Bệnh Hỏng Lông"
 paragon.3010.desc: "Cùng với sự lây lan của một căn bệnh dịch mới trên tàu, thủy thủ đoàn của tàu Móng Vuốt Một bắt đầu rơi vào hoảng loạn. Theo đánh giá phân tích ban đầu, đối với tộc người của chúng ta, đây là một loại virus tương đối vô hại. Tuy nhiên, đối với thủy thủ đoàn người chim trên tàu thì tình hình lại khác, virus đầu tiên sẽ bám vào lông vũ, khiến chân lông bị nhiễm trùng và thối rữa, chỉ trong vài ngày, nhiễm trùng sẽ lan vào máu.\n\nNếu cứ mặc kệ tình trạng này tiếp diễn, cuối cùng sẽ dẫn đến kết cục không thể cứu vãn."
 paragon.3010.a: "Nghiên cứu phương thuốc chữa trị!"
 paragon.3011.name: "Cái chết của một Anh hùng"
 paragon.3011.desc: "Bất chấp mọi nỗ lực của chúng ta, Skrand vẫn gục ngã trước sự tấn công của căn Bệnh Hỏng Lông. Những người đồng đội đang chuẩn bị tổ chức một nghi lễ tang lễ truyền thống cho ông."
 paragon.3012.name: "Bệnh dịch Lây lan"
 paragon.3012.desc: "Mặc dù chúng ta đã áp dụng các biện pháp cách ly nghiêm ngặt trên tàu Móng Vuốt Một, nhưng theo báo cáo vừa được Skrand đệ trình, ước tính có khoảng 60% thủy thủ đoàn trên tàu đã bị nhiễm bệnh."
 paragon.3013.name: "Triệu chứng Mới"
 paragon.3013.desc: "Đến hiện tại, những triệu chứng mới của Bệnh Hỏng Lông đã bùng phát gần như chỉ sau một đêm, điều này đã vượt quá giới hạn xử lý của phòng y tế trên tàu Móng Vuốt Một, hành lang của con tàu chật kín bệnh nhân và những thành viên thủy thủ đoàn đang hấp hối."
 paragon.3014.name: "Tình trạng Xấu đi"
 paragon.3014.desc: "Con tàu đã báo cáo trường hợp tử vong đầu tiên do Bệnh Hỏng Lông gây ra. Những thủy thủ đoàn người chim đó hiện tại vẫn không thể chống lại sự lây nhiễm của virus, trừ khi chúng ta có thể tìm ra phương pháp điều trị, nếu không theo tính toán tỷ lệ tử vong cuối cùng có thể lên tới 95%."
 paragon.3015.name: "Đã tìm ra phương thuốc!"
 paragon.3015.desc: "Sau nhiều tháng nỗ lực, chúng ta đã chữa khỏi thành công cho những thủy thủ đoàn nhiễm bệnh trên tàu Móng Vuốt Một, và con tàu đang dần hoạt động trở lại bình thường. Không còn nghi ngờ gì nữa, Skrand sẽ vô cùng biết ơn sự giúp đỡ của chúng ta trong chuyện này."
 paragon.3020.name: "Bày tỏ Sự Biết ơn"
 paragon.3020.desc: "Người của chúng ta vẫn luôn cố gắng xây dựng quan hệ với Skrand và phi hành đoàn của ông ta. Nỗ lực giao lưu văn hóa này đã bước đầu đơm hoa kết trái: Skrand vừa đồng ý chia sẻ thiết kế phi cơ trên hạm đầy uy lực của họ. Điều này có thể giúp ta hiểu sâu hơn rất nhiều về cách chiến đấu ngoài không gian."
 paragon.3020.a: "Chúng ta bày tỏ lòng biết ơn với món quà này"
 paragon.3021.name: "Đã nghiên cứu tàu ngoài hành tinh"
 paragon.3021.desc: "Nhiều tháng trời miệt mài nghiên cứu, giải mã và thử nghiệm cuối cùng cũng mang lại tia sáng. Kho dữ liệu trên tàu ngoài hành tinh chứa đựng các chiến thuật đội hình phi cơ vô cùng linh hoạt. Giờ đây công nghệ này đã nằm trong tay chúng ta."
 paragon.3021.a: "Ta có thể tận dụng thứ này."
 paragon.3030.c: "Cứ để họ tự giải quyết."
 paragon.3031.name: "Hợp nhất cơ cấu"
 paragon.3031.desc: "Dù các sĩ quan và chỉ huy cấp dưới của ta đang làm việc sát sao cùng Skrand, họ cũng không hoàn toàn nhất nhất nghe theo. Khác biệt trong cơ cấu chỉ huy quen thuộc của hai bên đã gây ra vài căng thẳng không đáng có. Do đó, ta rất cần một cuộc diễn tập quân sự chung.\n\nCuộc diễn tập này có thể làm giảm khả năng chỉ huy hạm đội của ta trong ngắn hạn, nhưng nếu không chuẩn bị sẵn sàng cho quân đội thì hậu quả có thể khôn lường."
 paragon.3031.a: "Chuẩn bị các bài huấn luyện chỉ huy."
 paragon.3031.b: "Diễn tập kiểu này có ích lợi gì đâu."
 paragon.3032.name: "Hoàn tất huấn luyện"
 paragon.3032.desc: "Cả hai bên đều có tiến bộ rõ rệt, ta có thể nói dự án diễn tập chung đã thành công rực rỡ. Ta học được từ Skrand rất nhiều về tác chiến không gian tầm gần, đồng thời ông ta cùng các sĩ quan cũng đã làm quen với hệ thống hậu cần của ta. Bầu không khí lạc quan và tình đồng chí đang dần lan tỏa khắp các quân chủng."
 paragon.3033.name: "Góc nhìn quân sự"
 paragon.3033.desc: "Vấn đề cốt lõi là chiến thuật sử dụng phi cơ của ta và họ hoàn toàn khác biệt. Skrand tung ra nhiều nhóm máy bay tấn công cỡ lớn để xé toạc chuỗi chỉ huy của địch. Chúng phối hợp hành động dưới mục tiêu rõ ràng từ tàu mẹ.\n\nCách của ta thì linh hoạt hơn, giao cho phi công các nhiệm vụ do thám tình hình và thực hiện những pha mạo hiểm nhưng mang lại lợi ích lớn, đổi lại ta thiếu đi tầm nhìn bao quát như Skrand và các sĩ quan của ông ta. Hiện tại, ta vẫn đang cố tìm tiếng nói chung để cùng nhau phát triển."
 paragon.3034.name: "Chiến thuật bị lãng quên"
 paragon.3034.desc: "Các trận đấu mô phỏng cho thấy chiến thuật tập trung hỏa lực của Skrand rất hiệu quả ở giai đoạn đầu, nhưng nhanh chóng bị khắc chế. Dù vậy, kết quả của ông ta vẫn tốt hơn nhiều so với ta.\n\nViệc áp dụng cả hai chiến thuật cùng lúc chỉ gây thêm rối loạn. May mắn thay, từ những thất bại này đã lóe lên vài ý tưởng mới có thể tháo gỡ vấn đề."
 paragon.admiral_fight.name: "Vấn đề chỉ huy"
 paragon.admiral_fight.desc: "Rõ ràng là Skrand đã xảy ra xô xát với [leader_to_fire_skrand.GetName], một chỉ huy của phe ta. Vấn đề bắt nguồn từ lòng tự ái của vị Tư lệnh hạm đội. Tóm lại, Skrand cảm thấy bị xúc phạm và tuyên bố rằng trừ khi ta cách chức [leader_to_fire_skrand.GetName], nếu không ông ta sẽ rời đi ngay lập tức."
 paragon.admiral_fight.a: "Đứng về phía Skrand."
 paragon.admiral_fight.b: "Đứng về phía [leader_to_fire_skrand.GetName]."
 paragon.admiral_fight.c: "Biết đâu có thể ngồi lại bàn bạc..."
 paragon.admiral_fight.a.tt: "§LNếu chọn Skrand trong chuyện này, ta có thể sẽ hứng chịu làn sóng phản đối dữ dội hơn.§!"
 paragon.3036.name: "Bộ Hải quân chia năm xẻ bảy"
 paragon.3036.a.tt: "§LHành động này sẽ tống khứ mọi kẻ bất đồng ý kiến khỏi Bộ Hải quân.§!"
 paragon.3040.name: "Tiềm năng nâng cấp"
 paragon.3040.desc: "Quá trình cùng nghiên cứu tàu Claw đã mang lại cái nhìn độc đáo về cách vận hành bên trong của con quái thú bọc thép này. Ta tin rằng nếu nhóm nghiên cứu hợp lực cùng phi hành đoàn tàu Claw, ta có thể cải tiến thêm kết cấu bên ngoài của con tàu, giúp nó chịu đòn và chống hư hại tốt hơn.\n\nTa đã được Skrand bật đèn xanh, nhưng dự án vẫn cần thêm vốn."
 paragon.3040.a: "Tiếp tục dự án nâng cấp."
 paragon.3040.b: "Ta đào đâu ra tài nguyên cho việc này."
 paragon.3041.name: "Tàu Claw 2.0"
 paragon.3041.desc: "Dù chưa đạt được mọi mục tiêu đề ra, ta vẫn độ lại thành công hệ thống giáp cho tàu Claw. Các kỹ sư của ta cũng tìm thấy vài ý tưởng hay ho để nâng cấp cho chính tàu của phe mình."
 paragon.3042.name: "Tiến độ chậm chạp"
 paragon.3042.desc: "Ta đã nỗ lực hết sức để tăng cường độ bền cho tàu Claw mà không làm giảm tốc độ hay sự cơ động, nhưng mọi chuyện diễn ra khá chậm. Kỹ sư của Skrand giúp đỡ rất nhiều, nhưng họ không muốn ta đụng tay vào thiết kế mà thiếu sự giám sát gắt gao của họ. Dẫu vậy, công việc vẫn đang được tiến hành."
 paragon.3043.name: "Vật liệu không tương thích"
 paragon.3043.desc: "Một số vật liệu của tàu Claw không giống với loại ta hay dùng. Những hợp kim này giòn hơn, khiến vỏ tàu bất ngờ nứt rách khi lắp thêm các tấm giáp phụ. Kỹ sư của họ giám sát ta là có lý do cả, may mà họ ở ngay đó khi sự cố xảy ra.\n\nGiờ ta phải dùng một phần vật liệu vốn dành cho việc nâng cấp để sửa vỏ tàu, việc này sẽ làm trễ toàn bộ tiến độ dự án."
 paragon.3043.a: "Rót thêm vốn."
 paragon.3043.b: "Tốn công vô ích, dẹp dự án này đi."
 paragon.3050.name: "Chuyến bay cuối cùng"
 paragon.3050.desc: "§HMàn hình chớp nháy hiện lên giao diện chỉ huy của Skrand. Lông cánh của vị Tư lệnh dựng đứng, đôi mắt phát ra ánh nhìn sắc lẹm.§!\n\nLũ... khốn khiếp! Chúng chỉ biết chém giết và phá hoại!\n\n§HÔng ta giận dữ nghiến chặt mỏ, tiếp tục nói.§!\n\nTôi thỉnh cầu... không, tôi yêu cầu phát động chiến tranh! Ta không thể để chúng hủy hoại mọi thứ và tước đoạt tất cả của ta một lần nữa! Tôi tin rằng nếu chung sức, ta có thể ngăn thảm kịch từng xảy đến với đồng bào tôi lặp lại. Tôi đã sẵn sàng chia sẻ mọi thứ mình biết cho các vị."
 paragon.3050.a: "Ông từng đụng độ những mối đe dọa này trước đây rồi sao?"
 paragon.3050.a.response: "Không hẳn thế. Nhưng tôi từng chứng kiến cảnh này rồi... một kiểu mẫu quá đỗi quen thuộc. Mối đe dọa này cũng mang bản chất y như vậy. Nếu ta không hành động sớm, ta sẽ chịu chung số phận với những người đồng bào mà tôi đã bỏ lại phía sau.\n\n§HToàn bộ lông vũ trên người ông ta xù lên.§!\n\nTôi sẽ không để bất kỳ ai phải hứng chịu thảm cảnh đó nữa."
 paragon.3050.b: "Ông muốn chia sẻ thông tin gì?"
 paragon.3050.b.response: "Chúng tôi gọi loại kẻ thù này là “Mối đe dọa”. Chúng chẳng bao giờ đáp lời truyền tin, chứ đừng nói đến ngoại giao, ai ngáng đường chúng chỉ có con đường chết.\n\n§HÔng ta rít lên một tiếng chói tai.§!\n\nChúng thình lình xuất hiện từ hư không, đốt phá và cướp bóc! Chúng tôi gần như không thể phản kháng, nhưng chúng tôi hiểu rõ chiến đấu với loại kẻ địch này có nghĩa là gì. Chiến tranh thông thường là chưa đủ. Phải làm tới cùng. Ta phải diệt sạch chúng, không chừa một mống, nếu không ta sẽ chẳng còn thấy ánh mặt trời ngày mai."
 paragon.3050.c: "Hành động thôi."
 paragon.3050.c.response: "Thời gian là sinh mệnh. Ta phải đẩy nhanh tiến độ. Trước mắt ta là nguy cơ diệt vong hoàn toàn. Bằng mọi giá phải chặn chúng lại!"
 paragon.3050.d: "Ta không thể lãng phí tài nguyên ở đây."
 paragon.3050.d.response: "§HSkrand hét lên,§!\n\nCái gì?! Không... Các vị đang phạm phải một sai lầm chết người."
 paragon.3051.name: "Đã phân tích Tai Ương"
 paragon.3051.desc: "Nhờ kinh nghiệm đối phó với “Mối đe dọa” cùng kho dữ liệu khổng lồ do Skrand cung cấp, giờ đây ta đã có sự chuẩn bị kỹ càng hơn nhiều trước những Tai Ương đang nổi lên này. Bước tiếp theo là áp dụng những kiến thức đó vào thực tiễn."
 paragon.3052.name: "Cách thức tác chiến của Tai Ương"
 paragon.3052.desc: "Cơ sở dữ liệu ta thu được chứa các ví dụ thực tế về cách thức tác chiến của những mối đe dọa này từ thời đế quốc của Skrand. Có vẻ chiến lược của chúng quả thực rất giống với những gì ta đang đối mặt ngày nay. Hạm đội của chúng không dùng chuỗi cung ứng thông thường mà thường tự cung tự cấp.\n\nQuan trọng hơn, công nghệ gây nhiễu gần như vô hiệu với chúng. Các hoạt động phá hoại cũng chẳng ăn thua."
 paragon.3053.name: "Đội hình chiến đấu của Tai Ương"
 paragon.3053.desc: "Việc đối chiếu dữ liệu của ta với của Skrand đã đưa ra vài kết luận thú vị. Những kẻ địch này có vẻ khá cứng nhắc: các hạm đội lớn của chúng chỉ nhắm vào một mục tiêu duy nhất cùng lúc, bỏ qua mọi thứ khác. Ta có thể nhận diện được mục tiêu của chúng và tổ chức phòng thủ tương ứng."
 paragon.3060.name: "Nghiên cứu tàu Claw"
 paragon.3060.desc: "Nhóm kỹ sư trên tàu Claw vừa truyền đạt một chỉ thị từ Skrand. Họ nhờ ta giúp bảo dưỡng bộ khung của tàu Claw và chuẩn bị sẵn ụ tàu để tiến hành sửa chữa. Như đã biết, những kế hoạch này sẽ ngốn một khoản không nhỏ. Còn một vấn đề nữa: do tính chất tinh tế của công việc, đích thân Skrand sẽ phải giám sát dự án này."
 paragon.3060.a: "Chúng tôi sẽ giúp."
 paragon.3060.b: "Ta không còn dư tài nguyên."
 paragon.3061.name: "Công nghệ bị lãng quên"
 paragon.3061.desc: "Dưới sự giúp đỡ của ta, các kỹ sư tàu Claw đã hoán cải thành công ụ tàu theo kiểu hoài cổ để đi sâu nghiên cứu cấu trúc bên trong con tàu. Họ áp dụng các thiết kế thử nghiệm của ta để độ lại động cơ siêu quang tốc, cho phép tàu thực hiện bước nhảy ngay cả khi vỏ tàu bị hư hại nặng nề. Dù động cơ này có thể đưa tàu đến đích gần như tức thời, nó cũng sẽ quét sạch mạng sống của toàn bộ người trên khoang và làm con tàu tê liệt trong nhiều năm. Mặt khác, nếu con tàu bị phá hủy trong chiến đấu, ta vẫn có thể cố kích hoạt hệ thống này và trục vớt tàn tích."
 paragon.3071.name: "Tàu Claw lại nhổ neo!"
 paragon.3071.desc: "Dưới sự hỗ trợ và giám sát sát sao của đội ngũ kỹ sư tàu Claw, ta đã tái thiết thành công vỏ tàu. Tàu Claw lại vươn mình ra biển sao!"
 paragon.3072.name: "Tàu Claw mất rồi lại tìm thấy"
 paragon.3072.desc: "Nhờ hệ thống an toàn bổ sung và giao thức khẩn cấp, soái hạm của Skrand vẫn thực hiện thành công bước nhảy khẩn cấp dù đã hứng chịu thiệt hại nặng nề. Dù đống tàn tích xuất hiện trên bầu trời thủ đô nhìn chẳng còn ra hình thù một chiếc phi thuyền, bộ khung vẫn có thể làm nền tảng để tái thiết. Đống đổ nát này hiện đang nằm tại ụ tàu chờ ngày được phục hồi. Hoặc, ta có thể rã xác nó ra để thu hồi vật liệu. Dựa vào thảm trạng của nó, kể cả khi ta quyết định con tàu này vô phương cứu chữa, Skrand chắc hẳn cũng sẽ thấu hiểu quyết định đó."
 paragon.3072.a: "Sửa chữa tàu Claw."
 paragon.3072.b: "Tháo dỡ đi, ta cần Hợp Kim."
 paragon.3080.name: "Niềm hi vọng mới"
 paragon.3080.desc: "Những bước tiến gần đây trong công nghệ di truyền có thể giúp hồi sinh giống loài của Tư lệnh hạm đội Skrand. Có thể tạm thời ta chưa có đủ sự đa dạng gen để đảm bảo chúng tự sinh sôi, nhưng việc dùng các bộ gen tương thích để lấp đầy khoảng trống sẽ giải quyết được vấn đề. Việc ta cần bây giờ chỉ là rót đủ tiền để dự án lăn bánh."
 paragon.3080.a: "Skrand đã cống hiến rất nhiều. Ông ấy hoàn toàn xứng đáng với điều này."
 paragon.3080.b: "Ta không rảnh để làm mấy việc này."
 paragon.3081.name: "Những “Skrand”"
 paragon.3081.desc: "Công cuộc nhân bản gen của Skrand nhìn chung đã thành công. Dù vẻ ngoài giống nhau như đúc, nhưng cấu trúc di truyền của các bản sao lại khác biệt hoàn toàn với Skrand gốc, biến chúng thành một giống loài mới. Họ đã bắt đầu tự gọi mình là người Talon."
 paragon.3081.tt: "§LNgười Talon sẽ xuất hiện trên hành tinh mẹ của ta.§!"
 paragon.3082.name: "Lo ngại"
 paragon.3082.desc: "Cấu trúc gen gốc chim của Skrand cứng đầu hơn ta tưởng, buộc ta phải cấy ghép thêm gen của các loài chim khác vào. Cách này không thực sự hoàn hảo, nhưng chắc cũng đủ để làm nên chuyện."
 paragon.3083.name: "Không hề giống nhau"
 paragon.3083.desc: "§HTrang phục của Skrand sạch sẽ không tì vết, bộ lông cánh bóng mượt.§!\n\nTôi đã xem qua kết quả từ thí nghiệm di truyền nhỏ bé của các vị. Dù những bản sao này chỉ ở mức tạm chấp nhận được, tôi vẫn vô cùng biết ơn sự nỗ lực của các vị."
 paragon.3083.a: "Ta rất lấy làm tiếc về điều này."
 paragon.3083.a.response: "Không có gì phải tiếc cả. Những bản sao này cho phép chúng tôi ôn lại lối sống thuở xưa. Cho chúng thời gian, chúng thậm chí có thể ấp nở ra bầy chim non. Các vị đã trao cho chúng tôi hi vọng. Chúng tôi chân thành ghi nhận điều đó. Nguyện cho đôi cánh của các vị luôn rực rỡ."
 NAME_Skrand_Species: "Người Talon"
 NAME_Skrand_Species_P: "Người Talon"
 NAME_Skrand_Planet: "Skaravid"
 paragon.3090.name: "Nghiên cứu Lịch sử"
 paragon.3090.desc: "Ta vừa nhận được lời thỉnh cầu từ đông đảo thành viên phi hành đoàn tàu Claw. Họ mong ta trích tài nguyên để nghiên cứu về quá khứ của dân tộc họ. Đã có rất nhiều chuyện xảy ra trong quãng thời gian tàu Claw kẹt lại ở vùng Không gian ngầm. Họ hi vọng có thể ghi chép lại đôi điều để truyền lại cho thế hệ mai sau."
 paragon.3090.a: "Đến phòng lưu trữ thôi!"
 paragon.3090.b: "Chúng tôi sẽ duyệt việc này."
 paragon.3091.name: "Cuộc Đại Di Cư"
 paragon.3091.desc: "Ta đã nhận được báo cáo đầu tiên về lịch sử của Skrand và dân tộc ông:\n\nỞ thời đại của họ, thiên hà là một khoảng không bao la và đầy rẫy những bí ẩn, với vùng rìa ngoài bị coi là nơi tử địa, cấm kỵ thăm dò.\n\nQuanh lõi thiên hà, những đế quốc khổng lồ cấu xé nhau tranh giành quyền lực. Một trong số đó là nền văn minh mang hình dáng loài chim. Ở những nơi tăm tối mà chẳng kẻ nào dám bước tới, những nhà thám hiểm quả cảm này lại nhìn thấy cơ hội. Cuộc Đại Di Cư cứ thế bắt đầu."
 paragon.3092.name: "Tổ ấm vụn vỡ"
 paragon.3092.desc: "Đây là một báo cáo khác về lịch sử của Skrand và dân tộc ông:\n\nCuộc Đại Di Cư đã lùi vào dĩ vãng từ rất lâu. Ẩn mình ở một góc thiên hà, đồng bào của Skrand tận hưởng những tháng ngày hòa bình và thịnh vượng. Nhưng chuỗi ngày êm đềm đã khiến họ ngủ quên trên chiến thắng, không một chút phòng bị trước họa diệt vong.\n\nKẻ thù tập kích mà không thèm tuyên chiến. Chẳng một đôi cánh nào kịp giang rộng, những chiếc mỏ và móng vuốt kiêu hãnh cũng mất đi ánh hào quang. Lũ xâm lăng vô diện giáng xuống từ quỹ đạo, dội bom lên các hành tinh của loài chim, chỉ để lại những biển máu và núi xác."
 paragon.3093.name: "Claw số Một"
 paragon.3093.desc: "Ta đã có báo cáo tiếp theo về lịch sử của Skrand và dân tộc ông:\n\nChính phủ Skaravid sụp đổ, nền kinh tế bị đình trệ trong đống tro tàn. Thế nhưng ý chí kiên cường của nhân dân thì chưa từng lụi tắt. Ở một nơi xa xôi khuất tầm mắt tiền tuyến, một dự án đang được âm thầm thai nghén.\n\nMột con tàu vô tiền khoáng hậu sắp được khai sinh. Kích thước khổng lồ của nó đủ sức làm kinh hồn bạt vía quân thù. Khi Claw số Một cất cánh, nó được giao cho vị chỉ huy cuối cùng của Skaravid. Chàng trai trẻ Skrand Sharpbeak, dù chưa từng nếm mùi khói lửa, đã bước ra chiến trường. Chẳng bao lâu sau, nhân dân đã tung hô ông là Kẻ khắc tinh của Mối đe dọa, là Chiếc Vuốt Đệ Nhất của Skaravid."
 paragon.3094.name: "Chuyến bay cuối cùng"
 paragon.3094.desc: "Dưới đây là báo cáo cuối cùng về lịch sử của Skrand và dân tộc ông:\n\nClaw số Một, và cũng là chiếc cuối cùng, đã cày nát phòng tuyến địch. Sự mưu lược và lòng can đảm của chỉ huy cùng phi hành đoàn đã kiến tạo nên hết chiến thắng này đến chiến thắng khác. Tuy nhiên, hành trình của nó lại vô cùng ngắn ngủi: dù là siêu hạm như Claw cũng không thể đơn độc lật ngược thế cờ. Dồn vào chân tường, Skrand cùng các sĩ quan đã vạch ra kế hoạch đồng quy vu tận trong trận tuyến phòng ngự cuối cùng. Trong một nước đi táo bạo nhằm bọc hậu quân thù, Skrand lệnh cho tàu Claw lao vào một Cổng Sao chưa từng được thử nghiệm. Từ đó, ông và tàu Claw bặt vô âm tín."
 paragon_is_not_keides: "§RDi chỉ này phải do chính §YKeides§! khai quật.§!"
 #Tình huống Paragon
 paragon.situations.tt: "§LDự án này có thể ngốn một khoản tiền khổng lồ, và một khi khởi động thì không thể dừng lại.§!"
 situation_paragon_skrand_monthly_change_tooltip: "Tiến độ phụ thuộc vào thái độ của ta đối với kế hoạch này."
 situation_paragon_skrand_sickness: "Dịch bệnh bùng phát"
 situation_paragon_skrand_sickness_type: "Bệnh tật"
 situation_paragon_skrand_sickness_desc: "Căn bệnh tử thần mang tên 'Thối Lông' đang càn quét phần lớn phi hành đoàn của Skrand. Ta đã lường trước được hậu quả khốc liệt này. Hiện tại, ta chỉ có thể hạn chế sự lây lan bằng cách chăm sóc y tế bài bản và dập tắt các triệu chứng."
 situation_paragon_skrand_sickness_standard: "Phác đồ tiêu chuẩn"
 approach_situation_paragon_skrand_sickness_standard_tt: "Ta sẽ áp dụng các biện pháp tiêu chuẩn để đối phó với dịch bệnh nguy hiểm này. "
 situation_paragon_skrand_sickness_generous: "Điều trị tăng cường"
 approach_situation_paragon_skrand_sickness_generous_tt: "Đầu tư vào nghiên cứu y khoa và duy trì các biện pháp phòng dịch gắt gao chắc chắn sẽ dập tắt đà lây lan."
 situation_paragon_skrand_sickness_nothing: "Điều trị qua loa"
 approach_situation_paragon_skrand_sickness_nothing_tt: "Nếu không rót đủ nguồn lực y tế, dịch bệnh sẽ bùng phát với tốc độ kinh hoàng."
 situation_paragon_skrand_sickness_tech_tt: "Thuốc tăng cường sinh lực"
 situation_paragon_skrand_sickness_ascension_tt: "Chuyên gia di truyền"
 situation_paragon_skrand_sickness_monthly_change_tooltip: "$situation_paragon_skrand_monthly_change_tooltip$"
 situation_paragon_skrand_cure: "Tiến độ chữa trị"
 situation_paragon_skrand_cure_type: "Chữa trị"
 situation_paragon_skrand_cure_desc: "Giống như bất kỳ mầm bệnh mới nào, chìa khóa để trị chứng Thối Lông luôn nằm ở khâu nghiên cứu. Tổ khoa học đang thức trắng đêm để chế ra thuốc giải, trong khi đội ngũ y tế thì căng mình xoa dịu triệu chứng, níu giữ chút thời gian trước lưỡi hái tử thần."
 situation_paragon_skrand_cure_regular: "Nghiên cứu tiêu chuẩn"
 approach_situation_paragon_skrand_cure_regular_tt: "Dựa trên kinh nghiệm ứng phó bệnh truyền nhiễm, ta đã lập ra một loạt nhóm nghiên cứu. Mục tiêu của họ là bào chế thuốc giải, nhưng vẫn phải cáng đáng các nhiệm vụ ưu tiên khác."
 situation_paragon_skrand_cure_generous: "Nghiên cứu chuyên sâu"
 approach_situation_paragon_skrand_cure_generous_tt: "Dựa trên kinh nghiệm ứng phó bệnh truyền nhiễm, ta đã lập ra một loạt nhóm nghiên cứu. Mục tiêu sống còn của họ là tìm ra thuốc chữa tận gốc, thay vì chỉ xoa dịu triệu chứng hay cầm chân dịch bệnh."
 situation_paragon_skrand_cure_nothing: "Nghiên cứu hời hợt"
 approach_situation_paragon_skrand_cure_nothing_tt: "Ta không thể hi sinh tiến trình khoa học của mình chỉ vì việc này, nên đành giao phó việc chữa bệnh cho một nhóm tình nguyện viên. Tiến độ chắc chắn sẽ chậm như rùa bò."
 situation_paragon_skrand_cure_ascension_tt: "Chuyên gia di truyền"
 situation_paragon_skrand_cure_monthly_change_tooltip: "$situation_paragon_skrand_monthly_change_tooltip$"
 situation_paragon_skrand_integration: "Hợp nhất chỉ huy"
 situation_paragon_skrand_integration_type: "Hợp nhất chỉ huy"
 situation_paragon_skrand_integration_desc: "Kế hoạch hợp nhất chỉ huy nhắm vào việc xoa dịu xích mích trong bộ sậu Hải quân, đặc biệt là giữa Skrand và người của ta. Bắt đúng mạch nguyên nhân gây căng thẳng sẽ bôi trơn đáng kể guồng máy tác chiến."
 situation_paragon_skrand_integration_monthly_change_tooltip: "$situation_paragon_skrand_monthly_change_tooltip$"
 situation_paragon_skrand_upgrade: "Nâng cấp tàu Claw"
 situation_paragon_skrand_upgrade_type: "Nâng cấp tàu Claw"
 situation_paragon_skrand_upgrade_desc: "Đội cơ khí liên hợp đã tìm ra cách đắp thêm một lớp giáp vào sâu trong vùng lõi của tàu Claw. Chỉ cần đủ thời gian và tài nguyên, ta dư sức biến nó thành một pháo đài thép thực thụ."
 situation_paragon_skrand_upgrade_monthly_change_tooltip: "$situation_paragon_skrand_monthly_change_tooltip$"
 situation_paragon_skrand_crisis: "Nghiên cứu Khủng hoảng"
 situation_paragon_skrand_crisis_type: "Nghiên cứu Khủng hoảng"
 situation_paragon_skrand_crisis_desc: "Một thế lực khổng lồ đang giáng đòn xuống ta, thề sẽ xóa sổ mọi mầm sống trong thiên hà mà ta từng biết. Skrand đã móc ruột gan truyền lại kinh nghiệm cùng những dòng dữ liệu vô giá từ nhật ký tàu Claw, nhưng ta vẫn cần thêm thời gian để phân tích triệt để."
 situation_paragon_skrand_crisis_monthly_change_tooltip: "$situation_paragon_skrand_monthly_change_tooltip$"
 situation_paragon_skrand_study: "Nghiên cứu tàu Claw"
 situation_paragon_skrand_study_type: "Nghiên cứu tàu Claw"
 situation_paragon_skrand_study_desc: "Mổ xẻ thiết kế của tàu Claw giúp ta học lỏm được những bí quyết chế tạo đỉnh cao, đồng thời hỗ trợ phi hành đoàn của họ bảo trì con tàu."
 situation_paragon_skrand_study_monthly_change_tooltip: "$situation_paragon_skrand_monthly_change_tooltip$"
 situation_paragon_skrand_rebuild: "Tái thiết tàu Claw"
 situation_paragon_skrand_rebuild_type: "Tái thiết tàu Claw"
 situation_paragon_skrand_rebuild_desc: "Tàu Claw đã tan tành mây khói. Nhưng mớ kiến thức ta tích cóp được chắc hẳn đủ để biến đống phế liệu kia thành nền móng hồi sinh con tàu."
 NAME_WingsOfGlory2: "Phượng Hoàng Lửa"
 situation_paragon_skrand_rebuild_monthly_change_tooltip: "$situation_paragon_skrand_monthly_change_tooltip$"
 situation_paragon_skrand_species: "Giống loài mới"
 situation_paragon_skrand_species_type: "Thử nghiệm Gen"
 situation_paragon_skrand_species_desc: "Nhờ tay nghề điêu luyện trong lĩnh vực di truyền học, ta có thể hồi sinh đồng bào của Skrand, gieo cho họ hạt giống hi vọng và mang đến một khởi đầu mới mẻ cho đế quốc của ta."
 situation_paragon_skrand_species_monthly_change_tooltip: "$situation_paragon_skrand_monthly_change_tooltip$"
 situation_paragon_skrand_story: "Bài học từ Lịch sử"
 situation_paragon_skrand_story_type: "Bài học từ Lịch sử"
 situation_paragon_skrand_story_desc: "Khai thác cơ sở dữ liệu của tàu Claw, việc nghiền ngẫm lịch sử của Skrand và dân tộc ông sẽ mở ra vô số góc nhìn độc đáo."
 situation_paragon_skrand_story_monthly_change_tooltip: "$situation_paragon_skrand_monthly_change_tooltip$"
 situation_paragon_skrand_balanced: "Tài trợ Cân bằng"
 approach_situation_paragon_skrand_balanced_tt: "Nguồn vốn ổn định giúp dự án băng băng tiến bước mà không vắt kiệt nền kinh tế của ta."
 situation_paragon_skrand_generous: "Tài trợ Phóng khoáng"
 approach_situation_paragon_skrand_generous_tt: "Rót tiền như nước sẽ đẩy nhanh tiến độ, nhưng coi chừng vắt kiệt nền kinh tế."
 situation_paragon_skrand_low: "Tài trợ Nhỏ giọt"
 approach_situation_paragon_skrand_low_tt: "Vốn mỏng thì tiến độ rùa bò, nhưng trong thời buổi thắt lưng buộc bụng thì đây là nước cờ an toàn nhất."
 situation_paragon_skrand_none: "Cắt Tài trợ"
 approach_situation_paragon_skrand_none_tt: "Dự án sẽ đóng băng cho đến khi ta rủng rỉnh tiền để bơm vào."
 situation_paragon_skrand_balanced_researchers: "Nguồn vốn ổn định giúp dự án băng băng tiến bước mà không vắt kiệt nền kinh tế của ta. Nhanh hay chậm phụ thuộc vào việc ta đổ bao nhiêu chất xám vào đây."
 situation_paragon_skrand_low_researchers: "Vốn mỏng thì tiến độ rùa bò, nhưng trong thời buổi thắt lưng buộc bụng thì đây là nước cờ an toàn nhất. Nhanh hay chậm phụ thuộc vào việc ta đổ bao nhiêu chất xám vào đây."
