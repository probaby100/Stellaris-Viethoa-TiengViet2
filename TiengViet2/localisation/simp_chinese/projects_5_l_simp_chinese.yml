l_simp_chinese:
 LIMBO_2_PROJECT: "Lửng Lơ Ranh Giới Tử Sinh: Tái Sinh"
 LIMBO_2_PROJECT_DESC: "Bằng cách tải dữ liệu quét thần kinh của chúng lên các cơ thể máy móc, ta có thể trao cho giống loài ngoài hành tinh cổ đại đã tuyệt diệt này một cơ hội tái sinh."
 GHOST_SHIP_PROJECT: "Nghiên Cứu \"Con Tàu Ma\""
 GHOST_SHIP_PROJECT_DESC: "Ta đã phát hiện một con tàu khoa học bị bỏ hoang, nó đã lảng vảng tuần tra trong hệ sao $NAME_Hillos$ suốt cả một thế kỷ. Có uẩn khúc gì ẩn giấu đằng sau chuyến hành trình đơn độc này?"
 GHOST_SHIP_PROJECT_02: "Hồi Đáp \"Đứa Trẻ\" Của $NAME_Hillos_ship$"
 GHOST_SHIP_PROJECT_02_DESC: "Những lời thì thầm tâm linh dò được trong hệ sao $NAME_Hillos$ rõ ràng là của một thực thể ý thức nhân tạo đang bị mắc kẹt trên \"con tàu ma\" $NAME_Hillos_ship$."
 ANCIENT_MANUFACTORIUM_PROJECT: "Khởi Động Xưởng Đúc"
 ANCIENT_MANUFACTORIUM_PROJECT_DESC: "Sau khi đã chuẩn bị đâu vào đấy, đến lúc cho mấy cỗ máy này hoạt động rồi, hãy kết nối chúng vào mạng lưới điện của hành tinh!"
 STRATOVENTS_PROJECT: "Dự Án Ống Phun Bình Lưu"
 STRATOVENTS_PROJECT_DESC: "Nghiên cứu cấu trúc độc đáo của các ống phun bình lưu trên §Y[planet.GetName]§! cũng như tầm quan trọng của chúng đối với các bầy thú không gian."
