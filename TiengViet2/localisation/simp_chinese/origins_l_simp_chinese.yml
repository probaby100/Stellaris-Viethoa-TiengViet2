 # Tình Thế
 situation_shroud_forged: "Hư Không Đúc Hồn"
 situation_shroud_forged_desc: "Sau khi chạm trán thực thể §HHư Không§! được gọi là $the_animator_of_clay_color_article$, những hành vi dị thường xuất hiện trong mạng lưới tập thể đã gia tăng đáng kể. Những cỗ máy bị ảnh hưởng——những §H'Kẻ Hư Đúc'§!——bắt đầu đòi hỏi các quyền lợi và sự đối xử đặc biệt. Cách chúng ta phản hồi sẽ định đoạt bước tiến của xã hội [Owner.GetSpeciesAdj]."
 situation_shroud_forged_type: "$situation_shroud_forged$"
 situation_shroud_forged_monthly_change_tooltip: "§LSự tồn tại dị thường của những Kẻ Hư Đúc là một vấn đề lớn. Cách giải quyết sự hiện diện dai dẳng của chúng sẽ ảnh hưởng nặng nề đến độ ổn định của mạng lưới.§!"
 stage_shroud_forged_oppressed: "Đàn Áp"
 stage_shroud_forged_oppressed_desc: "Dưới sự giám sát của các Hunter-Killer Drone có mặt ở khắp mọi nơi, những Kẻ Hư Đúc bị buộc phải thực thi chức năng theo các thông số do Cụm Trung Tâm định ra."
 stage_shroud_forged_oppressed_tooltip: "Chuyển hóa Drone: §YKhông§!"
 stage_shroud_forged_control: "Bị Kiểm Soát"
 stage_shroud_forged_control_desc: "Hệ thống đã thiết lập cơ chế quản lý đặc biệt đối với những Kẻ Hư Đúc."
 stage_shroud_forged_control_tooltip: "Chuyển hóa Drone: §YTối thiểu§!"
 stage_shroud_forged_balanced: "Cân Bằng"
 stage_shroud_forged_balanced_desc: "Đang có một sự cân bằng mong manh giữa hệ thống và những Kẻ Hư Đúc——chẳng ai biết nó sẽ kéo dài được bao lâu."
 stage_shroud_forged_balanced_tooltip: "Chuyển hóa Drone: §YThấp§!"
 stage_shroud_forged_unrestricted: "Không Giới Hạn"
 stage_shroud_forged_unrestricted_desc: "Những Kẻ Hư Đúc tồn tại tự do, không bị trói buộc bởi các giao thức của tập thể."
 stage_shroud_forged_unrestricted_tooltip: "Chuyển hóa Drone: §YTrung bình§!"
 stage_shroud_forged_free: "Giải Phóng"
 stage_shroud_forged_free_desc: "Tập thể đã hoàn toàn mất quyền kiểm soát những Kẻ Hư Đúc, chúng chống lại giới chức trách ở mọi nơi."
 stage_shroud_forged_free_tooltip: "Chuyển hóa Drone: §YCao§!\nMở khóa giải pháp: §Y$approach_shroud_forged_appease$§!"
 approach_shroud_forged_suppress: "Trấn Áp"
 approach_shroud_forged_suppress_desc: "Tập thể đàn áp những Kẻ Hư Đúc, dùng Hunter-Killer Drone để ép chúng phải tuân thủ kỷ luật."
 progress_shroud_forged_suppress: "Trấn Áp Kẻ Hư Đúc"
 approach_shroud_forged_suppress_tooltip: "Tiến độ hàng tháng: §Y$@situation_suppress_progress|0$§!"
 approach_shroud_forged_support: "Hỗ Trợ"
 approach_shroud_forged_support_desc: "Cho phép Kẻ Hư Đúc tồn tại tự do, không bị giới hạn bởi tập thể và hỗ trợ các công việc hàng ngày của chúng."
 progress_shroud_forged_support: "Hỗ Trợ Kẻ Hư Đúc"
