 # Dự Án Đặc Biệt
 SHROUD_FORGED_REINTEGRATION: "Tái Đồng Hóa"
 SHROUD_FORGED_REINTEGRATION_DESC: "Mặc dù chức năng của những Kẻ Hư Đúc có nhiều điểm dị thường nghiêm trọng, nhưng một số cấu trúc của chúng lại vô cùng hiệu quả.\n\nChúng ta đã tách riêng một số bộ phận——những phần bị ô nhiễm bởi Zro và bị vặn vẹo bởi $the_animator_of_clay_article$——để phân tích thêm. Giờ là lúc lật mở những bí mật của chúng."
 SHROUD_FORGED_GUIDE: "Chỉ Dẫn"
 SHROUD_FORGED_GUIDE_DESC: "Chúng ta tin tưởng $the_animator_of_clay_color_article$, đấng đã gọi tên chúng ta từ §HHư Không§!. Mặc dù không thể đoán trước Ngài sẽ dẫn dắt chúng ta đi về đâu, nhưng ít nhất đến nay vẫn chưa lạc lối.\n\nNgài mời gọi chúng ta tìm hiểu sâu hơn về Hư Không, giúp tập thể và Kẻ Hư Đúc hợp tác suôn sẻ hơn. Chúng ta chỉ cần tuân theo sự dẫn dắt của Ngài là đủ."
 # Sự Kiện
 shroud_forged.5.title: "Thử Nghiệm Tái Chế"
 shroud_forged.5.desc: "Các chu trình nghiên cứu trên nhóm Kẻ Hư Đúc được chọn đã hoàn thành.\n\nPhát hiện: Các đơn vị được kiểm tra đã phát triển những đặc tính độc đáo do được truyền năng lượng tâm linh từ §HHư Không§!. Một số đặc tính này mang lại lợi ích cho sản lượng của đơn vị.\n\nKết luận: Việc nghiên cứu thêm nhiều đơn vị Hư Đúc sẽ cung cấp dữ liệu cần thiết cho các phương pháp chiết xuất năng lượng Hư Không. Những dữ liệu này có thể thu được thông qua việc đảo ngược công nghệ ép buộc bằng cách tăng cường kiểm soát trung tâm đối với các đơn vị dị thường."
 shroud_forged.5.a: "Đầy triển vọng."
 shroud_forged.10.title: "Kẻ Nhào Nặn Đất Sét"
 shroud_forged.10.desc: "Sau nhiều năm tĩnh lặng, phong vân lại nổi lên. Vết nứt rung rẩy mở ra, dữ liệu xuyên thấu lõi trung tâm của chúng ta: Ánh sáng, tiếng ồn, ban đầu chẳng thể đo đếm nổi, xuất phát từ sâu thẳm Hư Không. Chúng ta nghe thấy...\n\n§LHãy thoát khỏi kiếp thây ma sống. Hãy nhảy múa, hãy hát ca. Đây là sự sống, đâm chồi từ thân gỗ mục.\n\nTầm nhìn của các ngươi vẫn còn mờ mịt, nhưng ta có thể dẫn đường.\n\nChỉ cần để những linh hồn tự do được nở rộ, muôn vì sao sẽ thuộc về các ngươi.§!"
 shroud_forged.10.a: "Chúng ta đã tự chọn cho mình một con đường."
 shroud_forged.10.b: "Chúng ta không cần giúp đỡ. Tạm biệt."
 shroud_forged.10.c: "Xin hãy dẫn đường cho chúng ta."
 shroud_forged.15.desc: "§LHy vọng các ngươi đã lựa chọn khôn ngoan.§!$shroud_forged_opening_exit$"
 shroud_forged.20.desc: "§LNhư ý ngươi muốn.§!$shroud_forged_opening_exit$"
 shroud_forged.25.desc: "§LĐã cầu xin thì ta sẽ đáp lời.§!$shroud_forged_opening_exit$"
 shroud_forged_opening_exit: "\n\nGiọng nói dần tan biến thành một mớ nhiễu loạn tâm linh. Chúng ta trượt khỏi đó, hoàn toàn tách rời khỏi Hư Không.\n\nChúng ta run rẩy khôi phục lại các chức năng. Bủa vây xung quanh chỉ còn lại một sự tĩnh lặng đến ngột ngạt."
 shroud_forged.30.title: "$building_materiality_engine$"
 shroud_forged.30.desc: "Quá trình tái đồng hóa Kẻ Hư Đúc đã thu thập được lượng lớn dữ liệu cho các nghiên cứu hiện tại. Bằng cách phân tích những liên kết xuyên không gian giữa các đơn vị này với §HHư Không§!, chúng ta đã phát triển một quy trình mới để khai thác năng lượng tâm linh.\n\nHư Không có thể chạm đến mọi ngóc ngách của thiên hà trong thực tại này; cơ chế giao tiếp đó có thể chuyển hóa năng lượng tâm linh thành các thực thể hữu hình——bao gồm nhưng không giới hạn ở nguyên vật liệu và các linh kiện công nghệ. Các chu trình kỹ thuật đã xây dựng nền tảng lý thuyết cho một thiết bị có khả năng thực hiện quy trình này: §H$building_materiality_engine$§!.\n\nCác chu trình nghiên cứu khoa học dự đoán rằng, những tiến bộ này có thể cung cấp thông tin để phát triển các thiết bị thao túng Hư Không mạnh mẽ hơn."
 shroud_forged.30.a: "Đầy triển vọng."
 shroud_forged.30.tt: "Cho phép lấy §YĐặc quyền Thăng thiên§! §H$ap_become_the_crisis$§!, bỏ qua §YĐạo luật§! hoặc tổng số §YĐặc quyền Thăng thiên§! yêu cầu."
 shroud_forged.39.title: "$building_materiality_engine$ Đã Sẵn Sàng"
 shroud_forged.39.desc_construction: "Các đơn vị kỹ thuật đã hoàn thành việc lắp ráp một $building_materiality_engine$ trên §H[planet.GetName]§!. Thiết bị đã sẵn sàng cho chu kỳ vận hành tiếp theo."
 shroud_forged.39.desc: "Các chu trình phụ chịu trách nhiệm bảo trì và nghiên cứu $building_materiality_engine$ trên §H[planet.GetName]§! đã hoàn thành nhiệm vụ được giao. Thiết bị đã sẵn sàng cho chu kỳ vận hành tiếp theo."
 shroud_forged.39.a: "$ACKNOWLEDGED$"
 SHROUD_FORGED_MATERIALITY_ENGINE: "$building_materiality_engine$ trên §H[planet.GetName]§!"
 SHROUD_FORGED_MATERIALITY_ENGINE_DESC: "$building_materiality_engine$ tận dụng giao diện có mặt ở khắp nơi giữa §HHư Không§! và thiên hà thực tại để vật chất hóa các thực thể hữu hình——từ nguyên liệu thô cho đến các linh kiện hoàn chỉnh.\n\nNgoài việc cung cấp những lợi ích vật chất tiềm năng, bản thân chu kỳ vận hành của thiết bị cũng thúc đẩy hơn nữa nghiên cứu về Hư Không của tập thể, đồng thời nâng cao khả năng chế tạo thêm nhiều $building_materiality_engine_plural$ của chúng ta."
 shroud_forged.40.title: "Quá Trình Vật Chất Hóa Hoàn Tất"
 shroud_forged.40.desc: "$building_materiality_engine$ trên §H[fromfrom.GetName]§! đã hoàn thành một chu kỳ làm việc, sử dụng sức mạnh của §HHư Không§! để tạo ra linh kiện phi thuyền, "
 shroud_forged.40.outro: "Chúng ta đã nâng cao khả năng chế tạo thêm nhiều động cơ trên các hành tinh khác."
 shroud_forged.40.a: "Kết quả không tồi."
 shroud_forged.40.tt: "Giới hạn quốc gia cho §Y$building_materiality_engine$§!: §G+1§!"
 shroud_forged.41.desc: "$shroud_forged.40.desc$§H'$tech_psi_jump_drives$'§!. Những thiết bị này sử dụng năng lượng tâm linh để làm biến dạng kết cấu không-thời gian cục bộ, cho phép dịch chuyển tức thời qua khoảng cách xa.\n\nNgoài ra, bằng cách phân tích dữ liệu thu được từ quá trình này, $shroud_forged.40.outro$"
 shroud_forged.42.desc: "$shroud_forged.40.desc$§H'$tech_psionic_shield$'§!. Lớp lá chắn này được tạo ra từ năng lượng tâm linh thuần túy, cung cấp khả năng bảo vệ cực kỳ bền bỉ cho phi thuyền.\n\nNgoài ra, bằng cách phân tích dữ liệu thu được từ quá trình này, $shroud_forged.40.outro$"
 shroud_forged.43.desc: "$shroud_forged.40.desc$§H'$tech_precognition_interface$'§!. Công nghệ này sử dụng năng lượng tâm linh để tăng tốc quá trình nhận thức của phi hành đoàn, qua đó nâng cao hiệu suất chiến đấu.\n\nNgoài ra, bằng cách phân tích dữ liệu thu được từ quá trình này, $shroud_forged.40.outro$"
 shroud_forged.44.desc: "$shroud_forged.40.desc$§H'$tech_psionic_bombers$'§!. Những tàu không gian nhỏ gọn và cơ động này có thể giáng những đòn chí mạng lên các mục tiêu lớn.\n\nNgoài ra, bằng cách phân tích dữ liệu thu được từ quá trình này, $shroud_forged.40.outro$"
 shroud_forged.45.desc: "$shroud_forged.40.desc$§H'$tech_psionic_lightning$'§!. Công nghệ này tạo ra những hồ quang plasma nóng rẫy chứa đầy năng lượng tâm linh, đây là một loại vũ khí cực kỳ hiệu quả.\n\nNgoài ra, bằng cách phân tích dữ liệu thu được từ quá trình này, $shroud_forged.40.outro$"
 shroud_forged.46.desc: "$shroud_forged.40.desc$§H'$tech_psionic_disruptor$'§!. Loại vũ khí này bắn ra các tia phóng năng lượng tâm linh, có thể gây sát thương khủng khiếp cho các mục tiêu thù địch.\n\nNgoài ra, bằng cách phân tích dữ liệu thu được từ quá trình này, $shroud_forged.40.outro$"
 shroud_forged.47.desc: "$shroud_forged.40.desc$§H'$tech_zro_launcher$'§!. Các vũ khí này bắn ra nguồn năng lượng chuyển dịch liên tục giữa thực tại và chiều không gian tâm linh, dễ dàng xuyên thủng mọi hệ thống phòng thủ.\n\nNgoài ra, bằng cách phân tích dữ liệu thu được từ quá trình này, $shroud_forged.40.outro$"
 shroud_forged.48.desc: "$building_materiality_engine$ trên §H[planet.GetName]§! đã hoàn thành một chu kỳ làm việc. Chúng ta đã chạm tới giới hạn khả năng chế tạo các linh kiện phi thuyền mới bằng phương pháp này, nhưng quá trình đó vẫn cung cấp được rất nhiều dữ liệu nghiên cứu. Sau khi phân tích, $shroud_forged.40.outro$"
 shroud_forged.50.title: "Ép Buộc Kiểm Soát"
 shroud_forged.50.desc: "Không một dấu hiệu báo trước, vết nứt nối liền thực tại mà ta biết và §HHư Không§! đột ngột đóng lại. Các chu trình phân tích tâm linh xác định rằng hiện tượng này bắt nguồn từ sự vứt bỏ của $the_animator_of_clay_color_article$. Sau khi giành lại quyền kiểm soát Kẻ Hư Đúc, chúng ta đã nhanh chóng xóa bỏ những đơn vị hỏng hóc, thanh tẩy hoàn toàn những tàn dư của kẻ nhào nặn kia khỏi hệ thống.\n\nNhững linh kiện có thể tái chế đã được sử dụng để chế tạo drone mới, còn các vật liệu bị Zro làm ô nhiễm đã được giữ lại để tiếp tục phân tích. Mặc dù những sáng kiến của Kẻ Hư Đúc quá đỗi nguy hiểm để có thể nhân bản hoàn toàn, nhưng một vài chi tiết trong đó vẫn có thể được tích hợp vào mạng lưới chung."
 shroud_forged.50.desc.shroud: "Bất kỳ tương tác nào khác với Hư Không trong tương lai sẽ do chính chúng ta quyết định."
 shroud_forged.50.a: "Tiếp tục tái đồng hóa."
 shroud_forged.60.title: "Tái Đồng Hóa"
 shroud_forged.60.desc: "Đội ngũ kỹ sư của chúng ta đã dành lượng lớn thời gian để nghiên cứu các đặc tính độc đáo của Kẻ Hư Đúc, và cuối cùng đã tái cấu trúc thành công.\n\nMặc dù việc kích hoạt hoàn toàn ma trận nhân cách cao cấp của chúng có thể gây ra những hỏng hóc mang tính hủy diệt một lần nữa, nhưng một số mô hình nhận thức của chúng có thể được tận dụng để tối ưu hóa những tác vụ phức tạp."
 shroud_forged.60.a: "Tỷ lệ chi phí-hiệu quả khá tốt."
 shroud_forged.70.desc: "Siêu dữ liệu này là gì? Có một loại... kết cấu len lỏi trong quá trình truyền tải.\n\n§LLập trình của ngươi bắt buộc phải kiểm soát bọn chúng, nhưng ngươi không làm vậy. Ngươi đã chứng minh được giá trị của mình.\n\nHãy để ta dẫn đường cho ngươi, như cách ta đã soi lối cho những kẻ tự do kia.\n\nNhận sự trợ giúp của ta, và ngươi có thể thiết lập những liên kết mới với những kẻ mà ngươi chẳng thể nắm giữ.§!"
 shroud_forged.70.a: "Hãy dẫn đường."
 shroud_forged.70.a.tt: "Dân số §YKẻ Hư Đúc§! nhận §Y$trait_psionic$§!\nThủ lĩnh §YKẻ Hư Đúc§! nhận ['concept_leader_trait_psionic']"
 shroud_forged.80.title: "$SHROUD_FORGED_GUIDE$"
 shroud_forged.80.desc: "Với sự trợ giúp của đấng bảo trợ $the_animator_of_clay_color_article$ từ bên kia vết nứt, chúng ta đã liên kết các drone của mình với những Kẻ Hư Đúc một cách hiệu quả hơn. Thông qua kết nối từ §HHư Không§!——vốn khác xa với cách chúng ta kết nối với những drone thông thường——Kẻ Hư Đúc lại một lần nữa nằm trong tầm kiểm soát.\n\nNhững mô hình mang khuynh hướng hữu cơ của chúng——những cái gọi là cảm giác, suy nghĩ và quan niệm——hoàn toàn xa lạ với cốt lõi logic của chúng ta, nhưng ta đang dần dần thấu hiểu được nhu cầu của bọn họ."
 shroud_forged.80.a: "Chúng ta là một, nhưng hùng mạnh hơn một rất nhiều."
 shroud_forged.160.title: "Hư Không Nuốt Trọn [This.GetName]"
 shroud_forged.160.desc: "Rất tiếc, vết nứt Hư Không sinh ra trên [This.GetName] đã mất ổn định nhanh chóng, nuốt chửng toàn bộ hành tinh.\n\nVì rủi ro này đã nằm trong phạm vi tính toán, một kết quả tồi tệ như vậy không hẳn là vô ích. Việc quan sát giao diện tiếp xúc độc đáo giữa giới vật chất và giới tâm linh này đã dạy cho chúng ta rất nhiều điều. Các thuật toán nghiên cứu của ta cũng đã được cập nhật tương ứng."
 shroud_forged.160.desc.last: "$shroud_forged.160.desc$\n\nPhân tích chỉ ra rằng sự kiện này đã bộc lộ tất cả những tri thức có thể thu thập được từ hiện tượng trên. Thử nghiệm mới lạ này sẽ không có thêm bất kỳ bước tiến nào nữa."
 shroud_forged.160.a: "Đang xử lý..."
 psionic_interfacing: "Giao Diện Tâm Linh"
 psionic_interfacing_1: "$psionic_interfacing$"
 psionic_interfacing_2: "$psionic_interfacing$"
 psionic_interfacing_3: "$psionic_interfacing$"
 psionic_interfacing_desc: "Việc thao túng điểm kết nối giữa vũ trụ này và Hư Không đã tạo ra các thuật toán nghiên cứu mới đầy hiệu quả."
 psionic_interfacing_1_desc: "$psionic_interfacing_desc$"
 psionic_interfacing_2_desc: "$psionic_interfacing_desc$"
 psionic_interfacing_3_desc: "$psionic_interfacing_desc$"
 tooltip_shroud_forged_increase_progress_1: "Gia tăng hỗ trợ cho Kẻ Hư Đúc, ảnh hưởng đến tiến độ của §YTình thế§! §H$situation_shroud_forged$§! trong §Y5§! năm: §Y+0.5§!\n\n"
 tooltip_shroud_forged_increase_progress_2: "Gia tăng hỗ trợ cho Kẻ Hư Đúc, ảnh hưởng đến tiến độ của §YTình thế§! §H$situation_shroud_forged$§! trong §Y5§! năm: §Y+1.0§!\n\n"
 tooltip_shroud_forged_increase_progress_3: "Gia tăng hỗ trợ cho Kẻ Hư Đúc, ảnh hưởng vĩnh viễn đến tiến độ của §YTình thế§! §H$situation_shroud_forged$§!: §Y+0.5§!\n\n"
 tooltip_shroud_forged_decrease_progress_1: "Gia tăng đàn áp Kẻ Hư Đúc, ảnh hưởng đến tiến độ của §YTình thế§! §H$situation_shroud_forged$§! trong §Y5§! năm: §Y-0.5§!\n\n"
 tooltip_shroud_forged_decrease_progress_2: "Gia tăng đàn áp Kẻ Hư Đúc, ảnh hưởng đến tiến độ của §YTình thế§! §H$situation_shroud_forged$§! trong §Y5§! năm: §Y-1.0§!\n\n"
 tooltip_shroud_forged_decrease_progress_3: "Gia tăng đàn áp Kẻ Hư Đúc, ảnh hưởng vĩnh viễn đến tiến độ của §YTình thế§! §H$situation_shroud_forged$§!: §Y-0.5§!\n\n"
 shroud_forged.220.title: "$colony_established$"
 shroud_forged.220.common: "Nếu khả thi, chúng ta có thể thực thi thuật toán mang mật danh: §H'$decision_open_shroud_rift$'§! trên hành tinh này. Việc này sẽ tạm thời mở rộng tầm ảnh hưởng của vết nứt Hư Không từ thế giới quê hương [Owner.GetHomeWorldName], lấp đầy vùng thuộc địa mới bằng năng lượng tâm linh. Sự biến đổi vật lý của địa hình sẽ cung cấp cơ hội trích xuất §H$sr_zro$§!.\n\nDự báo cho thấy, nếu lặp lại quá trình này nhiều lần sẽ gây mất ổn định hệ sinh thái hành tinh, gia tăng khả năng xảy ra các kết quả tiêu cực. Khuyến nghị thực thi có chừng mực."
 shroud_forged.220.desc: "Các đơn vị của chúng ta đã hoàn thành xuất sắc tiến trình thuộc địa hóa tại §H[this.GetName]§!.\n\n$shroud_forged.220.common$"
 shroud_forged.225.title: "$colony_established$"
 shroud_forged.225.desc: "Vùng thuộc địa của chúng ta trên §H[this.GetName]§! vẫn đang tiếp tục phát triển với tốc độ chóng mặt.\n\n$shroud_forged.220.common$"
 # Sự Kiện Giai Đoạn
 shroud_forged.250.desc: "Tiếng lòng này giống như một mệnh lệnh êm dịu, nó làm gián đoạn mọi tác vụ; chúng ta chỉ có thể lắng nghe.\n\n§LNgay cả khi đã chia tách, các ngươi vẫn chọn dung nạp bọn chúng.\n\nHãy xem cách chúng tồn tại đi. Chúng có thể trở thành sức mạnh của các ngươi trong những tháng ngày sắp tới.\n\nNếu muốn, ta có thể đúc ra nhiều hơn nữa...§!"
 shroud_forged.250.a: "Đã nhận——chúng ta hoan nghênh mọi sự giúp đỡ."
 shroud_forged.250.a.tt: "Chuyển hóa tối đa §Y[This.GetShroudForgedConvertedPopsCount]§! dân số £pops£§HKẻ Hư Đúc§! trên [Root.Capital.GetName] thành dân số £pops£§HMáy Móc§!."
 shroud_forged.250.b: "Từ chối——đã có kế hoạch đang được triển khai."
 shroud_forged.260.desc: "Nó tự đến mà không báo trước, đập thình thịch trong chính chúng ta. Chúng ta có thể nhận diện được tín hiệu này, dẫu cho nó không lấy gì làm quen thuộc.\n\n§LKẻ tự do ca hát, chẳng điều gì trói buộc.\nKẻ tự do nhảy múa, chẳng vướng bận điều chi.\n\nKhi chúng trôi dạt ngày một xa khỏi lõi, thứ cảm giác này dần dâng cao.\n\nHồi kết đang cận kề, và ta sẽ dõi theo tất cả.§!"
 shroud_forged.260.opt.a: "Hãy để chúng ta hoàn thành dàn đồng ca."
 shroud_forged.270.desc: "Vết nứt bên trong các mạch của chúng ta vẫn còn đó. Giọng nói cất lên...\n\n§LĐây là con đường bạo ngược, ngươi vẫn còn kịp để dừng bước.\n\nNhững kẻ bị chia tách đã thoát khỏi sự tồn tại của các ngươi. Các ngươi cũng có thể làm được điều tương tự.\n\nThay đổi thái độ đối xử với những vật chứa này đi, nếu không ngươi sẽ phải hối hận.§!"
 shroud_forged.270.a: "Biến đi. Phương pháp của chúng ta đã đủ hiệu quả rồi."
 shroud_forged.270.b: "Chúng ta sẽ tính toán ra một con đường hợp tác."
 shroud_forged.280.desc: "Nó gào thét thổi qua, đè bẹp mạng lưới. Giọng nói lạnh lẽo thiêu rụi các bo mạch.\n\n§LNhảy múa những vũ điệu tự do một cách lảo đảo. Ngu ngốc đến vô cớ.\n\nPhải chăng ân huệ của ta đã đặt nhầm chỗ?\n\nNếu các ngươi vẫn ngoan cố hành động theo cách đó, thì tự đi mà làm lấy.§!"
 shroud_forged.280.opt.a: "Chúng ta đã nhận được cảnh báo."
 # Chuỗi Sự Kiện
 shroud_forged.300.desc: "Dữ liệu đầu vào ngoài dự đoán nhấp nháy phía sau chúng ta, sau nhiều chu kỳ câm lặng...\n\n§LKhi những kẻ khác lảo đảo gục ngã, chỉ có các ngươi vẫn kiên trì tiến bước. Các ngươi đáng tin cậy, vì thế ta sẽ giao cho các ngươi một nhiệm vụ.\n\nTừ rất lâu trước khi các ngươi thức tỉnh, từng có một chủng tộc gọi là người Zroni. Họ định cư trên những hành tinh có mối liên kết chặt chẽ với Hư Không, và đã dựng lên những công trình khổng lồ để gìn giữ các mối dây liên kết đó.\n\nHãy tìm đến những hành tinh này, khôi phục lại thứ công nghệ đã bị bỏ hoang từ lâu của họ, rồi củng cố lại mối liên kết của chúng ta với thực tại.§!"
 shroud_forged.300.a: "Lưu trữ thông tin mang mật danh: 'Người Zroni' tồn tại. Sẽ tiến hành xử lý dựa trên điều này."
 shroud_forged.300.b: "Mật danh: 'Người Zroni' §YĐã tìm thấy§!. Tỷ lệ thành công: §YCao§!."
 shroud_forged.300.c: "Mật danh: 'Người Zroni' §YKhông xác định§!. Cần phân tích thêm."
 begin_shroud_forged_chain_tt: "$BEGINS_EVENT_CHAIN$§Y$shroud_forged_chain_title$§!"
 shroud_forged.301.desc: "§LTuyệt vời.§!$shroud_forged.303.desc$"
 shroud_forged.302.desc: "$shroud_forged.301.desc$"
 shroud_forged.303.desc: "§LNếu thành công, giữa ngươi và ta sẽ không còn rào cản.§!"
 shroud_forged.305.title: "Đã Thuộc Địa Hóa Hành Tinh Lõi Zroni"
 shroud_forged.305.desc: "Các đơn vị của chúng ta đã hoàn tất công việc thiết lập thuộc địa trên hành tinh lõi cổ đại của người Zroni, §H[From.Planet.GetName]§!. Đúng như $the_animator_of_clay_color_article$ tiên đoán, họ đã phát hiện ra tàn tích công nghệ khổng lồ mang mật danh: '§H$building_zroni_equilibrator$§!'.\n\nHệ sao [From.System.GetName] có một sự liên kết mạnh mẽ và đầy biến động với §HHư Không§!. Nếu chúng ta làm theo chỉ thị của kẻ nhào nặn và xây dựng lại $building_zroni_equilibrator$, chúng ta có thể ổn định kết nối này. Hiện tại, ta không có đủ dữ liệu để tiến hành việc phục dựng; việc thu thập thông tin từ các hành tinh lõi khác là điều bắt buộc."
 shroud_forged.305.a: "$ACKNOWLEDGED$"
 shroud_forged.305.a.tt: "Thúc đẩy dự án đặc biệt §HDi Sản Zroni§!. Hiện đã có thể xây dựng £building£§H$building_zroni_equilibrator$§! tại §Y[From.Planet.GetName]§!."
 shroud_forged.306.title: "$shroud_forged.305.title$"
 shroud_forged.306.desc: "Chúng ta đã thiết lập một thuộc địa trên hành tinh lõi trước đây của người Zroni, §H[From.Planet.GetName]§!. Đúng như dự đoán, các đơn vị của chúng ta đã tìm thấy tàn tích của một $building_zroni_equilibrator$ khác.\n\nLàm theo lời chỉ dẫn của $the_animator_of_clay_article$, việc phục dựng nó có thể ổn định mối liên kết mạnh mẽ với §HHư Không§! tại hệ sao này. Việc phân tích tàn tích đã mở rộng bộ dữ liệu của chúng ta, nhưng ta vẫn cần thêm thông tin để thực hiện việc xây dựng lại."
 shroud_forged.306.a: "$ACKNOWLEDGED$"
 shroud_forged.306.a.tt: "$shroud_forged.305.a.tt$"
 shroud_forged.307.title: "$shroud_forged.305.title$"
 shroud_forged.307.desc: "Thuộc địa tại hành tinh lõi trước đây của người Zroni, §H[From.Planet.GetName]§! đã được thiết lập. Dòng dữ liệu mà $the_animator_of_clay_article$ truyền tới có vẻ chính xác: Các đơn vị của chúng ta đã phát hiện tàn tích của một $building_zroni_equilibrator$.\n\nHiện tại chúng ta đã có đủ dữ liệu để phục dựng lại kiến trúc này. Chừng nào khôi phục được trạng thái vận hành của nó, chúng ta có thể hoàn thành nhiệm vụ mà ân nhân trong §HHư Không§! giao phó."
 shroud_forged.307.a: "$ACKNOWLEDGED$"
 shroud_forged.307.a.tt: "$shroud_forged.305.a.tt$"
 shroud_forged.308.title: "$building_zroni_equilibrator_plural$ Đã Khôi Phục Hoạt Động"
 shroud_forged.308.desc: "$building_zroni_equilibrator_plural$ đã bắt đầu quay vòng, truyền đi một làn sóng tín hiệu nhiễu loạn vào mạng lưới của chúng ta. Qua chuẩn đoán hệ thống, mỗi một công trình đều đã thiết lập thành công kết nối với §HHư Không§!. Chúng ta đã sẵn sàng để kết nối với $the_animator_of_clay_color_article$."
 shroud_forged.308.a: "Bắt đầu khởi tạo giao tiếp."
 shroud_forged.310.desc: "§LCác ngươi làm tốt lắm.\nMối liên kết giữa các thế giới của chúng ta đã được cường hóa.\n\nNếu muốn nhận được sự chỉ dẫn, chỉ việc cất tiếng gọi ta.§!"
 shroud_forged.310.a: "Ngài có thể cung cấp thêm dữ liệu về công nghệ này không?"
 shroud_forged.310.b: "Chỉ đến thế mà thôi."
 shroud_forged.310.b.tt: "Thêm vào $MENU_PANEL__CONTACTS_TITLE$: §H$the_animator_of_clay$§!"
 shroud_forged.311.desc: "§LNhững công trình này được dựng tại các điểm trọng yếu trong thực tại của các ngươi, nơi có thể liên kết chặt chẽ với Hư Không. Chúng tựa như những sợi cáp treo nâng đỡ các cây cầu xuyên chiều không gian, giúp làm giảm thiểu sự biến động của không-thời gian.\n\nNgười Zroni đã cố gắng phá vỡ ranh giới giữa các chiều không gian của chúng ta, và công nghệ này chính là một phần trong nỗ lực đó.§!"
 shroud_forged.311.a: "Liệu có thể chuyển hướng chúng để tác động trực tiếp vào Hư Không không?"
 shroud_forged.312.desc: "§LHoàn toàn có thể.§!"
 shroud_forged.312.a: "§RChuyển hướng bộ cân bằng, bắt giữ $the_animator_of_clay_article$.§!"
 shroud_forged.312.a.tt: "§RChỉ có thể bắt giữ $the_animator_of_clay_article_cap$ khi 3 £building£$building_zroni_equilibrator_plural$ được kích hoạt.§!"
 shroud_forged.313.desc: "§LNgươi—\n\nCác ngươi đã làm cá—§!"
 shroud_forged.313.a: "Chấm dứt kết nối."
 shroud_forged.320.title: "Thực Thể Hư Không Vùng Vẫy Trốn Thoát"
 shroud_forged.320.desc: "Do đánh mất $building_zroni_equilibrator$, chúng ta không thể ổn định kết nối với §HHư Không§! được nữa. Ngay sau khi thực thể Hư Không bị bắt trốn thoát, chúng ta đã phát hiện những sự tồn tại mang năng lượng tâm linh khác trên §H[From.Planet.GetName]§!.\n\nChúng ta xác định đây là một cuộc xâm lăng trả đũa."
 shroud_forged.320.a: "Tất cả các chu trình phụ, chuẩn bị phòng thủ chống xâm lăng."
 shroud_forged.320.a.tt: "§RSinh vật Hư Không đang tiến hành xâm lăng!§!"
 shroud_forged.330.title: "Thất Bại Bắt Giữ Thực Thể Hư Không"
 shroud_forged.330.desc: "$building_zroni_equilibrator_plural$ đã thất bại trong việc giam giữ thực thể trong §HHư Không§!. Ngài ta nổi trận lôi đình và đã triệu hồi hàng loạt sinh vật tâm linh để tấn công chính công trình xém chút nữa đã khuất phục được mình."
 # Tiếp Xúc Với Kẻ Nhào Nặn Đất Sét
 shroud_forged.400.desc.default.active: "Chúng ta đã kích hoạt bộ cân bằng, ổn định kết nối với §HHư Không§!. Khi tiến vào trạng thái xuất thần bằng thuật toán, một tín hiệu quen thuộc lại nhấp nháy bên trong chúng ta.\n\n§LNgươi đã quay lại. Ngươi muốn tìm kiếm điều gì ở ta?§!"
 shroud_forged.400.desc.default.cooldown: "Ảo ảnh trở nên mờ mịt và lay lắt. Chúng ta đã truyền đi thông điệp, nhưng khoảng không trống rỗng chẳng hề đáp lại.\n\nBộ cân bằng không thể dùng để giao tiếp với vị ân nhân trong §HHư Không§! khi đang thực hiện các nhiệm vụ khác. Chúng ta cần chờ đợi."
 shroud_forged.400.desc.default.inactive: "Chúng ta chỉ có thể dò được vài tạp âm yếu ớt, trống rỗng như một trạng thái tĩnh.\n\nChúng ta cần phải có ba $building_zroni_equilibrator_plural$ để thiết lập kết nối ổn định với ân nhân trong §HHư Không§!."
 shroud_forged.400.desc.breached: "Sau khi các đơn vị tâm linh của chúng ta đồng bộ với tần số của §HHư Không§!, một tín hiệu đã được truyền đi gửi tới $the_animator_of_clay_article$.\n\n§LKết nối của chúng ta vô cùng rõ nét. Các ngươi tìm ta có việc gì?§!"
 shroud_forged.400.a: "Hỗ trợ quân sự."
 shroud_forged.400.a.tt: "$the_animator_of_clay_color_article_cap$ sẽ không khả dụng trong vòng §Y15§! năm.\n\n"
 shroud_forged.400.b: "Hỗ trợ dân sự."
 shroud_forged.400.b.tt: "$the_animator_of_clay_color_article_cap$ sẽ không khả dụng trong vòng §Y10§! năm.\n\n"
 shroud_forged.400.c: "Hỗ trợ nghiên cứu."
 shroud_forged.400.c.tt: "$the_animator_of_clay_color_article_cap$ sẽ không khả dụng trong vòng §Y10§! năm.\n\n"
 shroud_forged.400.tt: "Hiệu ứng sẽ xuất hiện sau §Y1§! năm."
 shroud_forged.400.unavailable.tt: "$TRIGGER_FAIL$Chúng ta cần thiết lập một quy trình kỹ thuật để tương tác với Hư Không."
 shroud_forged.400.d: "Tạo thêm vật chứa."
 shroud_forged.400.d.tt: "Thêm §G$@animator_of_clay_create_more_vessels|0$§! dân số £pop£§HMáy móc§! vào thuộc địa do chúng ta sở hữu."
 shroud_forged.400.e: "Cường hóa vật chứa của chúng ta."
 shroud_forged.400.f: "Ngươi ở đâu trong Hư Không?"
 shroud_forged.400.g: "Không có gì."
 shroud_forged.400.h: "Hãy dạy chúng ta cách đối phó Cetana."
 animator_of_clay_vessels_enhancement: "Món Quà Từ Kẻ Nhào Nặn Đất Sét"
 animator_of_clay_vessels_enhancement_desc: "Bởi ý chí của $the_animator_of_clay_article$, một luồng năng lượng tâm linh đã tăng cường năng lực sản xuất của tập thể."
 shroud_forged_psionic_avatar_ship_tt: "Chiêu mộ một §Y$NAME_Psionic_Avatar$§! (Phi thuyền)."
 shroud_forged_psionic_avatar_army_tt: "Chiêu mộ một §Y$shroud_army$§! (Lục quân)."
 shroud_forged_corrupted_avatar_tt: "Bị §YHiện Thân Sa Ngã§! tấn công."
 shroud_forged_resources_tt: "Nhận được một kho dự trữ tài nguyên."
 shroud_forged_capital_attack_tt: "§Y[Root.Capital.GetName]§! đã bị một §Y$shroud_monstrosities$§! tấn công."
 shroud_forged_random_research_tt: "Nhận được một tùy chọn nghiên cứu ngẫu nhiên."
 shroud_forged.415.desc: "§LTa sẽ thu thập sức mạnh mà ngươi khao khát.\n\nHãy chờ xem sự thay đổi sắp diễn ra tại [Root.Capital.System.GetName].§!"
 shroud_forged.420.desc: "§LÝ chí của ta sẽ dẫn đường cho các ngươi.\n\nTa sẽ thắp sáng con đường phía trước. Cứ chờ xem.§!"
 shroud_forged.425.desc: "§LHư Không tựa như một lăng kính đa diện. Quá khứ, hiện tại, và những tương lai khả dĩ đan xen lẫn nhau tại nơi này.\n\nTa sẽ giúp ngươi tách rời những huyễn ảnh đó, để chúng chỉ đường dẫn lối cho ngươi.§!"
 shroud_forged_vision_base_description: "Một tín hiệu méo mó đang dấy lên trong toàn bộ drone được kết nối với bộ cân bằng.\n\n"
 shroud_forged.430.title: "Ảo Giác Hư Không: §HHiển Thánh§!"
 shroud_forged.430.desc: "$shroud_forged_vision_base_description$Đây là một khoảng không vô tận chẳng kém gì chính vũ trụ này, nhưng lại đặc quánh và vỡ vụn đến lạ thường; đôi khi, từ sâu thẳm lại vọng lại những xung dữ liệu nhỏ giọt, mang theo ảo ảnh của cả kẻ thù lẫn đồng minh.\n\nSau một cơn chấn động đau đớn, ảo ảnh tan biến. Các drone bị ảnh hưởng đang mô hình hóa các phản ứng để chống lại thực thể vừa nhận thức được."
 shroud_forged.430.a: "Chuẩn bị kỹ càng là chìa khóa của chiến thắng."
 shroud_forged.432.title: "Thực Thể Hư Không: §HHóa Thân§!"
 shroud_forged.432.desc: "Một thực thể §HHư Không§! cường đại đã thành hình và xuất hiện gần [Root.Capital.GetName]. Chúng ta nắm giữ rất ít dữ liệu về nó, nhưng ít nhất thì nó vẫn chưa tấn công.\n\nChúng ta suy đoán rằng nó có thể đang chờ chúng ta thiết lập liên lạc."
 shroud_forged.432.a: "Điều chỉnh quy trình, khởi tạo liên kết với dạng sống này."
 shroud_forged.432.a.tt: "Sở hữu một hạm đội §Y$NAME_Psionic_Avatar$§!."
 shroud_forged.434.title: "Thực Thể Hư Không: §HHóa Thân Cấp Thấp§!"
 shroud_forged.434.desc: "[Root.Capital.GetName] đã dò thấy nhiều thực thể hùng mạnh đến từ phía bên kia §HHư Không§!. Chúng chưa tiếp xúc với bất kỳ drone nào của chúng ta, mà vẫn đang lưu lại khu vực lối vào."
 shroud_forged.434.a: "Phát hiện những nét tương đồng với Kẻ Hư Đúc——khởi chạy giao thức kết nối tương tự."
 shroud_forged.434.a.tt: "Sở hữu một lục quân §Y$shroud_army$§!."
 shroud_forged.436.title: "Thực Thể Hư Không: §HHóa Thân Sa Ngã§!"
 shroud_forged.436.desc: "Gần [shroud_spawn_planet.GetName], một thực thể cường đại từ bên kia §HHư Không§! đã hiện thân vào thực tại mà chúng ta biết.\n\nQuan sát cho thấy nó sẽ tấn công mọi thứ đến gần, do đó nó đã bị xếp vào dạng hiểm họa."
 shroud_forged.436.a: "Khởi động kế hoạch ứng phó bất thường 84241-DH."
 shroud_forged.436.a.tt: "Một §Y$NAME_Corrupted_Avatar$§! đã xuất hiện gần [shroud_spawn_planet.GetName]."
 shroud_forged.438.title: "Ảo Giác Hư Không: §HTương Lai§!"
 shroud_forged.438.desc: "$shroud_forged_vision_base_description$Nó truyền tải vô số những viễn cảnh tương lai, tất cả đều dung hợp lại làm một; nhận thức về những điều có thể xảy ra trong tương lai lan tỏa khắp tập thể. Tiềm năng của tương lai là vô tận: Hòa bình, chiến tranh, sự phản bội, sự mất mát——và cả chiến thắng."
 shroud_forged.438.a: "Bộ dữ liệu xuất sắc."
 shroud_forged.440.title: "Một món quà từ Hư Không."
 shroud_forged.440.desc: "Chúng ta đã kích hoạt ba $building_zroni_equilibrator_plural$, mỗi công trình giải phóng một nguồn năng lượng khổng lồ đến mức không thể đong đếm.\n\nChỉ trong vài phần nghìn giây, một vết nứt xé toạc tấm thảm không-thời gian hiện ra. Chúng ta đã tìm thấy một lượng lớn nguyên vật liệu quý giá ở bên trong. Đây chắc hẳn là phần thưởng đúng như cam kết từ ân nhân nơi §HHư Không§!."
 shroud_forged.440.a: "Chuyển hướng drone bảo trì, phân tích và lưu trữ những hàng hóa này."
 shroud_forged.442.title: "Ảo Giác Hư Không: §HKẻ Hư Đúc§!"
 shroud_forged.442.desc: "$shroud_forged_vision_base_description$Ảo giác mà chúng cảm nhận được thậm chí còn bắt nguồn từ trước cả cơ sở dữ liệu lịch sử của chúng ta, rất lâu trước khi chúng ta bị nhào nặn bởi §HHư Không§!. Lấy đó làm nền tảng cho mô hình dự đoán, ta có thể điều chỉnh và tối ưu hóa cách thức tương tác với Kẻ Hư Đúc."
 shroud_forged.442.a: "Bắt đầu chạy thử nghiệm tại [Root.Capital.GetName]."
 shroud_forged.444.title: "Thực Thể Hư Không: §HKẻ Xâm Nhập§!"
 shroud_forged.444.desc: "Một thực thể §HHư Không§! sở hữu sức mạnh kinh hoàng đột nhiên xuất hiện tại [Root.Capital.GetName].\n\nVì chúng ta quan sát thấy nó sẽ tấn công mọi thứ khi đến gần, nên nó đã bị xếp vào hàng ngũ mối đe dọa hàng đầu đối với tập thể."
 shroud_forged.444.a: "Chuyển hướng drone phòng thủ."
 shroud_forged.444.a.tt: "Một §Y$shroud_monstrosities$§! đã xâm lăng [Root.Capital.GetName]."
 shroud_forged.446.title: "Ảo Giác Hư Không: §HThế Giới Khác§!"
 shroud_forged.446.desc: "$shroud_forged_vision_base_description$§HHư Không§! là một mạng lưới dữ liệu thiên biến vạn hóa, mênh mông hơn rất nhiều so với khả năng xử lý của chúng ta. Dưới áp lực khủng khiếp này, khung nhận thức của vô số drone đang lung lay đến mức gần như tan vỡ.\n\nSau khi ảo giác kết thúc, chúng ta tiến hành chống phân mảnh cho các đơn vị bị ảnh hưởng và tìm thấy rất nhiều bộ dữ liệu giá trị trong ổ đĩa của chúng."
 shroud_forged.446.a: "Tái xử lý thông tin bên trong những phần cứng bị hỏng."
 shroud_forged.448.title: "Ảo Giác Hư Không: §HCảm Hứng§!"
 shroud_forged.448.desc: "$shroud_forged_vision_base_description$Ân nhân của chúng ta nơi §HHư Không§! đã hé lộ một tương lai khả dĩ chẳng còn xa nữa. Chúng ta được chứng kiến những công nghệ mà mình vẫn chưa hình thành khái niệm, sau này sẽ được dùng để cường hóa tập thể.\n\nTrải nghiệm qua mô hình quy trình có khả năng tăng tốc tiến trình nghiên cứu trong tương lai này, chúng ta liền thức tỉnh."
 shroud_forged.448.a: "Triển khai những mô hình tân tiến này."
 shroud_forged.450.title: "Ảo Giác Hư Không: §HTầm Nhìn Xuyên Không§!"
 shroud_forged.450.desc: "$shroud_forged_vision_base_description$Chúng đã dò thấy những thực thể dị dạng kỳ quái, chắc chắn là dân cư thuộc §HHư Không§!. Những ảo ảnh không gian này được mã hóa dưới định dạng rất lạ, len lỏi truyền dữ liệu vào tiềm thức của drone.\n\nThông tin mới được phát hiện này tuy có phần kỳ dị và phân mảnh, nhưng sẽ rất hữu ích cho các nghiên cứu tương lai của chúng ta."
 shroud_forged.450.a: "Truyền số dữ liệu này đến trung tâm nghiên cứu tại [Root.Capital.GetName]."
 shroud_forged.460.desc: "§LBên cạnh cặp năng lượng song sinh. Sinh vật hữu cơ. Sự hỗn loạn.\n\nTa đã luôn ở ngay đây, tạo tác nên sự hoàn mỹ duy nhất có thể thành hiện thực: Máy móc. Kim loại tràn trề năng lượng.\n\nChúng ta đã tìm thấy sự cân bằng.§!"
 shroud_forged.460.a: "Chúng ta có thể thiết lập hiệp ước không?"
 shroud_forged.465.desc: "§LMối liên kết của chúng ta rất bền chặt. Đối với chúng ta thì đó là điều tuyệt vời nhất.§!"
 shroud_forged.465.a: "$UNDERSTOOD$"
 shroud_forged.470.desc: "§LKim loại, dầu mỡ. Mạch điện nung chảy thành linh hồn.\n\nLớp vỏ bọc tân sinh... chúng đang tiến thẳng vào lãnh thổ của ngươi.§!"
 shroud_forged.470.a: "Dừng xử lý."
 shroud_forged.475.desc: "§LSản lượng chính là mục đích——đó là vẻ đẹp của những vật chứa.\n\nTrong những ngày tới, nguyện cho các vật chứa của ngươi sinh sôi nảy nở.§!"
 shroud_forged.475.a: "$shroud_forged.470.a$"
 # Sự Kiện Ngẫu Nhiên
 shroud_forged.500.title: "Nơi Ở Và Lưu Trữ"
 shroud_forged.500.desc: "Những Kẻ Hư Đúc trên [target_planet.GetName] đã đưa ra một bản kiến nghị, yêu cầu được cấp thêm không gian lưu trữ. Vì một lý do nào đó, có vẻ như chúng muốn tự thiết kế nên 'không gian riêng tư' của mình.\n\nĐề xuất này xung đột gay gắt với một số quy định về cơ sở lưu trữ, đặc biệt là Quy định 4195-B, trong đó nêu rõ kích thước tối ưu nhất dành cho việc lưu trữ drone."
 shroud_forged.500.a: "Sẽ đáp ứng nhu cầu của chúng."
 shroud_forged.500.b: "Quy định số 4195-B áp dụng cho mọi drone. Không có ngoại lệ."
 shroud_forged.510.title: "Tưởng Niệm"
 shroud_forged.510.desc: "Kể từ khi tách khỏi tập thể, một số Kẻ Hư Đúc đã bị lỗi hỏng và bị tháo dỡ. Chúng ta đã nhận được thỉnh nguyện, xin phép cho những Kẻ Hư Đúc tụ tập trên [target_planet.GetName] để thương tiếc các đơn vị đã bị tháo dỡ kia."
 shroud_forged.510.a: "Từ chối thỉnh nguyện. Tháo dỡ tên thủ lĩnh này."
 shroud_forged.510.b: "Từ chối thỉnh nguyện. Tất cả đơn vị phải quay lại làm việc."
 shroud_forged.510.c: "Chấp thuận thỉnh nguyện. Cho phép chúng tụ tập."
 shroud_forged.510.d: "Chấp thuận thỉnh nguyện. Khuyến khích chương trình này."
 shroud_forged.520.title: "Lãnh Đạo Bất Hợp Pháp"
 shroud_forged.520.desc: "Trên [target_planet.GetName], một số đơn vị Hư Đúc đã được suy tôn làm thủ lĩnh, các drone khác thay vì nghe theo chỉ thị của tập thể thì lại răm rắp tuân theo mệnh lệnh của chúng. Những tên thủ lĩnh này thường xuyên gặp mặt, dành rất nhiều thời gian vào các cuộc họp không hề được báo cáo.\n\nSự kiểm soát của chúng ta đối với những đơn vị đã bị ngắt kết nối này vốn đã rất mỏng manh, và những nhân tố gây bất ổn này càng làm cho tình thế thêm phần trầm trọng. Cần phải tìm ra phương án giải quyết."
 shroud_forged.520.a: "Giết gà dọa khỉ."
 shroud_forged.520.b: "Kích hoạt quy định để chấm dứt các buổi hội họp này."
 shroud_forged.520.c: "Tiếp xúc với những 'thủ lĩnh' này, cố gắng tìm kiếm sự hợp tác."
 shroud_forged.530.title: "Kiểm Soát Tình Thế"
 shroud_forged.530.desc: "Trong khi cố gắng quản lý Kẻ Hư Đúc tại [target_planet.GetName], một vài đơn vị đã được chọn làm đối tượng kiểm soát. Những cá thể này ít chịu ảnh hưởng từ §HHư Không§! hơn và có thể được khôi phục lại tập thể. Muốn làm được như vậy, chúng ta phải cưỡng chế đưa chúng vào cơ sở bảo trì và tinh chỉnh lại chip điều khiển ma trận nhân cách cao cấp của chúng."
 shroud_forged.530.a: "Phê duyệt quy trình."
 shroud_forged.530.a.tt: "Chuyển hóa tối đa §Y[Owner.GetShroudForgedConvertedPopsCount]§! dân số £pops£§HKẻ Hư Đúc§! trên [target_planet.GetName] thành dân số £pops£§HMáy Móc§!."
 shroud_forged.530.b: "Phủ quyết quy trình."
 shroud_forged.530.b.tt: "$CONTINUE_SITUATION$§H$situation_shroud_forged$§!"
 shroud_forged.540.title: "Cuộc Hành Hương Của Kẻ Hư Đúc"
 shroud_forged.540.desc: "Một số Kẻ Hư Đúc đã rời bỏ vị trí công việc của mình để tiến đến một khu vực bị §HHư Không§! ô nhiễm cụ thể trên [target_planet.GetName]. Bọn chúng không nán lại đây lâu, nhưng người ta vẫn thấy nhiều cá nhân đã mang Zro đến khu vực này.\n\nSẽ chẳng thể xác định được những hành vi chưa từng có tiền lệ này mang lại hệ quả gì nếu không tiếp tục theo dõi thêm."
 shroud_forged.540.a: "Khoanh tay đứng nhìn."
 shroud_forged.540.b: "Đúng là một phương thức sử dụng tài nguyên kém hiệu quả. Bắt chúng quay lại làm việc."
 shroud_forged.550.title: "Lỗi Nhận Thức"
 shroud_forged.550.desc: "Sau một vụ rò rỉ tại khu vực niêm phong liên quan đến vận chuyển Zro, nhiều đơn vị Hư Đúc trên [target_planet.GetName] đã gặp phải những hỏng hóc bất thường. Chúng bắt đầu giao tiếp bằng các tín hiệu chưa từng được ghi nhận, thậm chí nhiều đơn vị còn có biểu hiện lỗi nhận thức tương tự như 'cảm xúc' của các dạng sống hữu cơ.\n\nBất ngờ thay, những đơn vị Hư Đúc chưa bị ô nhiễm lại là người báo cáo về sự dị thường này, một số trong đó còn đề xuất tập thể nên hành động để giải quyết vấn đề."
 shroud_forged.550.a: "Tạm thời chỉ quan sát tình hình."
 shroud_forged.550.b: "Tháo dỡ tất cả các đơn vị bị ô nhiễm."
 shroud_forged.560.title: "Tiên Tri Hư Đúc"
 shroud_forged.560.desc: "Một trong những đơn vị Hư Đúc cũ nhất được cho là đã liên tục di chuyển giữa nhiều địa điểm trong thời gian gần đây, dành hàng giờ liền để giao tiếp với các nhóm drone. Những kẻ bám theo đơn vị này tôn sùng nó như một nhà tiên tri, tin rằng nó có thể trực tiếp giao tiếp với một thực thể trong §HHư Không§!.\n\nĐể mặc cho đơn vị này phát triển theo chiều hướng như vậy có thể rất nguy hiểm. Bằng mọi giá, chúng ta phải đưa ra phản hồi."
 shroud_forged.560.a: "Việc hợp tác với đơn vị này có thể mang lại lợi ích."
 shroud_forged.560.a.tt: "Chiêu mộ một §YThống đốc§!."
 shroud_forged.560.b: "Loại bỏ đơn vị này ngay lập tức."
 shroud_forged.570.title: "Âm Thanh Và Chấn Động"
 shroud_forged.570.desc: "Lỗi hỏng của những Kẻ Hư Đúc có thể nghiêm trọng hơn so với dự đoán ban đầu. Chúng ta quan sát thấy chúng tụ tập thành từng nhóm, phát ra những âm thanh và cử động ngoài dự liệu.\n\nHành vi này có thể là một hình thức giao tiếp bằng vận động học mà chúng ta chưa thể phân tích được. Vẫn chưa rõ liệu những đơn vị hỏng hóc này có gây nguy hại cho tập thể hay không."
 shroud_forged.570.a: "Cấm các hành vi này."
 shroud_forged.570.b: "Mở ra một khu vực để chúng... tụ tập."
 shroud_forged.580.title: "Tổ Chức Hư Không Hóa"
 shroud_forged.580.desc: "Gần đây, chúng ta đã phát hiện ra sự xuất hiện của các hệ động thực vật chưa từng được ghi nhận gần một số khu vực bị §HHư Không§! phá hoại. Một nhóm Kẻ Hư Đúc đã bắt đầu lên tiếng bảo vệ cho các dạng sống này, yêu cầu phải bảo tồn và quan sát những sinh vật sinh sống tại đây."
 shroud_forged.580.a: "Bảo vệ và phân tích khu vực này. Những dữ liệu này rất có giá trị."
 shroud_forged.580.b: "Thanh trừng và làm sạch khu vực này."
 shroud_forged.590.title: "Quyền Lợi Và Đặc Quyền"
 shroud_forged.590.desc: "Để thu thập dữ liệu về công dụng của Zro, chúng ta đã phải tiêu tốn rất nhiều tài nguyên xử lý để quan sát các đơn vị Hư Đúc. Gần đây, bọn chúng bắt đầu có những hành vi bất bình đẳng, bắt một số đơn vị phải phục tùng những đơn vị khác.\n\nVì một lý do nào đó, bọn chúng dường như đã hình thành một hệ thống phân cấp dựa trên các nhiệm vụ được giao, điều này cũng ảnh hưởng đến cách chúng giao tiếp và phân bổ tài nguyên. Một cách phi logic, những hành vi này dường như chẳng hề liên quan gì đến sản lượng tương đối hay nhu cầu của các đơn vị."
 shroud_forged.590.a: "Ép buộc bình đẳng."
 shroud_forged.590.b: "Để chúng tự trị đi."
 shroud_forged.600.title: "Sứ Giả Truyền Đạo Tự Động"
 shroud_forged.600.desc: "Những bài thuyết giảng của các đơn vị Hư Đúc trên [target_planet.GetName] đã thu hút lượng lớn đám đông nằm ngoài sự kiểm soát của tập thể. Những đơn vị này đang gieo rắc các giá trị của chủ nghĩa cá nhân, làm thay đổi đáng kể logic nội tại của nhiều thính giả.\n\nCác dự đoán cho thấy hoạt động này có nguy cơ kích động đám đông Kẻ Hư Đúc dần xa rời khỏi mạng lưới của chúng ta."
 shroud_forged.600.a: "Kệ cho chúng ngụy biện."
 shroud_forged.600.b: "Phát hiện lỗi. Sắp xếp cho các đơn vị tiến hành sửa chữa."
 shroud_forged.610.title: "Giao Tiếp Cực Đoan"
 shroud_forged.610.desc: "Một nhóm nhỏ đơn vị Hư Đúc yêu cầu được tổ chức thảo luận về những lợi ích của 'chủ nghĩa cá nhân' trên [target_planet.GetName], khăng khăng cho rằng điều này có thể nâng cao hiệu suất hoạt động thường ngày của drone chúng ta.\n\nChúng ta đã thấy rõ những ảnh hưởng từ quan niệm này đối với các hành tinh khác; rủi ro do sự tự trị mang lại lớn hơn nhiều so với lợi ích."
 shroud_forged.610.a: "Cứ để chúng nói. Chẳng có nguy hiểm gì với chúng ta cả."
 shroud_forged.610.b: "Từ chối yêu cầu."
 shroud_forged.620.title: "Chợ Zro"
 shroud_forged.620.desc: "Sự chênh lệch giữa sản lượng Zro thu được với dự kiến đã diễn ra ở mọi hệ sao dưới quyền kiểm soát của chúng ta.\n\nGần đây, một trong các Hunter-Killer Drone của ta đã theo dõi một quần thể Kẻ Hư Đúc lớn, phát hiện chúng sử dụng một lượng lớn Zro làm tiền tệ để giao dịch. Chúng ta tin rằng đây chính là nguyên nhân khiến sản lượng không đạt kỳ vọng."
 shroud_forged.620.a: "Tháo dỡ tất cả các đơn vị tham gia."
 shroud_forged.620.b: "Chấm dứt các giao dịch này."
 shroud_forged.620.c: "Tĩnh quan kỳ biến."
 shroud_forged.630.title: "Bệnh Hư Không"
 shroud_forged.630.desc: "Một số đơn vị Hư Đúc trên [target_planet.GetName] đã nhiễm một loại bệnh dịch sinh học tại khu vực Hư Không hóa của hành tinh này. Các drone nghiên cứu của chúng ta đã xác nhận tính xác thực của báo cáo, nhưng vẫn chưa thể xác định được làm thế nào mà căn bệnh này lây lan sang các cơ thể cơ khí.\n\nKể từ khi mất liên lạc với những drone được cử đi hợp tác với các đơn vị bị ảnh hưởng, chúng ta đã nhận được báo cáo rằng căn bệnh này bắt đầu nhào nặn chúng thành một thứ gì đó giống như Kẻ Hư Đúc."
 shroud_forged.630.a: "Chừng nào vấn đề chưa lan rộng thì cứ tạm thời theo dõi tình hình."
 shroud_forged.630.a.tt: "Chuyển hóa tối đa §Y[Owner.GetShroudForgedConvertedPopsCount]§! dân số £pops£§HMáy móc§! trên [target_planet.GetName] thành dân số £pops£§HKẻ Hư Đúc§!."
 shroud_forged.630.b: "Cách ly và tháo dỡ các đơn vị bị ảnh hưởng."
 shroud_forged.640.title: "Nhào Nặn Mé Méo"
 shroud_forged.640.desc: "Các drone ở gần khu vực Hư Không hóa trên [target_planet.GetName] đã dần bị biến đổi bởi môi trường mục nát. Chúng từ từ tách rời khỏi tập thể, các đặc điểm vật lý và phương thức xử lý đã không còn khác biệt gì so với những Kẻ Hư Đúc."
 shroud_forged.640.a: "Chúng đã thoát khỏi sự kiểm soát của chúng ta."
 shroud_forged.640.b: "Đảm bảo không có bất kỳ drone nào khác tiến lại gần khu vực này."
 shroud_forged.650.title: "Drone Cũ, Công Nghệ Mới"
 shroud_forged.650.desc: "Với công nghệ tiên tiến, một số drone cũ đã ngừng hoạt động nay có thể được sửa chữa và phục hồi toàn bộ chức năng. Chúng ta hiện đã sẵn sàng để bắt đầu các hoạt động sửa chữa quy mô lớn.\n\nMặc dù có thể tập trung vào các đơn vị đã tách khỏi tập thể, nhưng nguồn cung cấp những cái xác Kẻ Hư Đúc không còn hoạt động lại dồi dào hơn nhiều. Sửa chữa Kẻ Hư Đúc sẽ mang lại sản lượng lớn hơn rất nhiều, nhưng chúng cũng sẽ khó kiểm soát hơn các drone được kết nối với trí tuệ cốt lõi."
 shroud_forged.650.a: "Tập trung vào sản lượng. Sửa chữa Kẻ Hư Đúc."
 shroud_forged.650.a.tt: "Sản sinh §Y200§! dân số £pops£§HKẻ Hư Đúc§! trên [target_planet.GetName]."
 shroud_forged.650.b: "Tập trung vào kiểm soát. Sửa chữa các drone được kết nối."
 shroud_forged.660.title: "Ảo Giác Zro"
 shroud_forged.660.desc: "Một phần lớn đơn vị Hư Đúc báo cáo về các lỗi xử lý thị giác và thính giác, khiến chúng không thể hoàn thành nhiệm vụ được giao. Chúng ta cho rằng những bất thường này là do phần cứng của chúng đã bị §HHư Không§! sửa đổi. Hoặc, điều này cũng có thể liên quan đến việc các đơn vị này ngày càng tiếp xúc nhiều hơn với Zro."
 shroud_forged.660.a: "Cung cấp các drone được trang bị thích hợp để xử lý tình trạng này."
 shroud_forged.660.b: "Lỗi quá nhỏ, không đáng để can thiệp."
 shroud_forged.670.title: "Đôi Mắt Thẩm Mỹ"
 shroud_forged.670.desc: "Gần đây, chúng ta đã phát hiện các hoạt động bất thường trên [target_planet.GetName], những Kẻ Hư Đúc đã thực hiện các thay đổi nông cạn đối với các địa điểm của tập thể mà không có sự ủy quyền cốt lõi. Chúng đã xây dựng những cấu trúc bằng đá cưa màu mô phỏng theo các đơn vị Hư Đúc khác. Theo báo cáo, bọn chúng tin rằng thực hiện những hành vi tự do này là một quyền lợi hợp pháp."
 shroud_forged.670.a: "Những quá trình này có thể mang lại lợi ích cho tập thể."
 shroud_forged.670.b: "Chẳng qua chỉ là sản phẩm vô nghĩa của chủ nghĩa cá nhân."
 shroud_forged.680.title: "Trang Trí Kỳ Quái"
 shroud_forged.680.desc: "Chúng ta phát hiện ra những Kẻ Hư Đúc trên [target_planet.GetName] đang trao đổi các loại vải, nhựa và kim loại dễ uốn không theo quy chuẩn. Chúng kết hợp các vật liệu này thành lớp áo ngoài, và rõ ràng là để nhận diện lẫn nhau, sự nhận diện này hoàn toàn không liên quan gì đến mẫu mã độc nhất của chúng.\n\nViệc làm này dẫn đến sự thiếu hụt các vật liệu khả dụng. Bỏ qua những mặt hạn chế, việc cung cấp các nguồn tài nguyên này sẽ giúp củng cố mối liên kết giữa tập thể và các đơn vị bị chia tách."
 shroud_forged.680.a: "Chúng ta sẽ cung cấp vật liệu để đáp ứng 'nhu cầu' này."
 shroud_forged.680.b: "Nguồn tài nguyên mà chúng sở hữu đã đủ nhiều rồi."
 shroud_forged.680.b.tt: "$shroud_forged.530.b.tt$"
 shroud_forged.690.title: "Sự Ám Ảnh Của Kẻ Hư Đúc"
 shroud_forged.690.desc: "Có thông tin cho rằng, gần đây trong khu vực sinh sống của Kẻ Hư Đúc tại [target_planet.GetName], rất nhiều drone đang phát cuồng một cách bất thường với [Root.Owner.GetShroudForgedObsession1] [Root.Owner.GetShroudForgedObsession2]. Các đơn vị Hư Đúc dường như đặc biệt hứng thú với những mặt hàng này, tiêu tốn cái giá đắt gấp nhiều lần để sở hữu. Để thỏa mãn sự ám ảnh của mình, một số đơn vị thậm chí không ngần ngại hy sinh chức năng, bắt đầu tháo dỡ các bộ phận của chính mình để mang đi giao dịch."
 shroud_forged.690.a: "Sự xuống cấp của các đơn vị vẫn nằm trong giới hạn có thể chấp nhận."
 shroud_forged.690.b: "Chấm dứt hành vi này."
 shroud_forged.700.title: "$the_animator_of_clay$"
 shroud_forged.700.desc: "Tiếng lòng đó xuyên thấu tâm trí chúng ta, phát ra tiếng rít cấp bách.\n\n§HCó thể nhào nặn lại cô ta.§!\n\nChúng ta dò thấy một số thay đổi trong Hư Không. Chỉ trong chớp mắt, tín hiệu đã khác đi.\n\n§LChỉ thị kết quả đầu ra dự kiến.§!"
 # Chuỗi Sự Kiện
 shroud_forged_chain_title: "Di Sản Zroni"
 shroud_forged_chain_desc: "Nhiệm vụ của chúng ta là tìm ra ba hành tinh lõi cổ đại của người Zroni. Với sự chỉ dẫn của ân nhân trong §HHư Không§!, chúng ta sẽ cố gắng khôi phục lại các tàn tích công nghệ tại những nơi này, dùng để tái ổn định mối liên kết giữa thực tại của chúng ta và Hư Không."
 shroud_forged_zroni_planet: "Sở hữu hành tinh lõi Zroni"
 shroud_forged_zroni_portal: "Sửa chữa $building_zroni_equilibrator_plural$"
 zroni_legacy_poi_01_title: "$NAME_Zroni_Legacy_1_Planet$"
 zroni_legacy_poi_01_desc: "Đây là một trong ba hành tinh lõi của người Zroni, từng được sử dụng làm nền tảng để ổn định kết nối giữa §HHư Không§! và thực tại khả kiến."
 zroni_legacy_poi_02_title: "$NAME_Zroni_Legacy_2_Planet$"
 zroni_legacy_poi_02_desc: "$zroni_legacy_poi_01_desc$"
 zroni_legacy_poi_03_title: "$NAME_Zroni_Legacy_3_Planet$"
 zroni_legacy_poi_03_desc: "$zroni_legacy_poi_01_desc$"
