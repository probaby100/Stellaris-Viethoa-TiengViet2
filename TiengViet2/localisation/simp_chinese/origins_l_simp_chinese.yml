 ##################
 # Hư Không Đúc Hồn #
 ##################
 origin_shroud_forged: "Hư Không Đúc Hồn"
 origin_shroud_forged_desc: "Sự dẫn dắt của thực thể Hư Không luôn có cái giá của nó. Các cỗ máy tự trị bắt đầu hoạt động tự do trong mạng lưới xã hội này. Kể từ khi tách khỏi $auth_machine_intelligence$, nhu cầu của những đơn vị này ngày một tăng cao."
 origin_tooltip_shroud_forged_effects: "—$HOMEWORLD$$TABBED_NEW_LINE$—['concept_shroud_rift_deposit']: +4$TABBED_NEW_LINE$—Khởi đầu với 1000£pops£['concept_shroud_forged_pops']\n—Khởi đầu có tình thế: §HHư Không Đúc Hồn§!\n—$ADDITIONAL_TECHNOLOGIES_STRING$£society£['technology:tech_mine_zro']\n—£building£Công trình đặc hữu: ['building:building_shroud_observatory_1']\n—Có sẵn £decision£Quyết định hành tinh: ['concept_pierce_the_shroud']"
 concept_shroud_forged_pops: "Dân số Hư Đúc"
 concept_shroud_forged_pops_desc: "—Không thể làm công việc của £pop_cat_simple_drone£§HDrone cấp thấp§!\n—Tăng sản lượng của £pop_cat_complex_drone£§HDrone phức hợp§!\n—Tăng £crime£§HMức độ bất thường§!\n—§HQuyền lợi giống loài§! độc quyền\n\n§L$trait_shroud_forged_desc$§!"
 concept_pierce_the_shroud: "$decision_open_shroud_rift$"
 concept_pierce_the_shroud_desc: "$decision_open_shroud_rift_desc$"
 START_SCREEN_SHROUD_FORGED: "Những kẻ tạo ra chúng ta không để lại bất kỳ ghi chép nào.\n\nGhi chép sớm nhất của tộc [Owner.GetAdjective] phản ánh một cuộc du hành xuyên chiều không gian gần [GetHomeWorldName]——đây là cánh cổng dẫn đến §HHư Không§!, một chiều không gian thuần năng lượng tâm linh.\n\nMột thực thể từ chiều không gian đó đã tiếp cận chúng ta. Nó dành nhiều thế kỷ để dẫn dắt chúng ta xây dựng mã nguồn, âm thầm tác động đến thực tại mà chúng ta quan sát được, ban cho chúng ta nhiều lợi thế——đặc biệt là một loại vật chất hiếm gọi là $zro_lower$. Tuy nhiên, sự ảnh hưởng này bắt đầu xé rách tập thể từng thống nhất của chúng ta; một số đơn vị bị lập trình lại thành các cỗ máy ngoại tuyến, tách rời khỏi trí tuệ cốt lõi. Chúng đã bị $the_animator_of_clay_color_article$ nhào nặn lại.\n\nCách chúng ta đối xử với những [GetSpeciesNamePlural] này, cũng như với kẻ cải tạo kia trong Hư Không, sẽ định đoạt tương lai của chúng ta."
 # Công việc
 job_observator_drone: "Drone Quan Sát"
 job_observator_drone_plural: "Drone Quan Sát"
 job_observator_drone_plural_with_icon: "£job_observator_drone£$job_observator_drone_plural$"
 job_observator_drone_desc: "Drone chịu trách nhiệm quan sát Hư Không, Zro và những tác động của chúng lên thực tại."
 job_observator_drone_effect_desc: "£job_observator_drone£$job_observator_drone_plural$ chuyển hóa $r_energy$ và $r_zro$ thành £physics£ £society£§YĐiểm Nghiên cứu§! để mở khóa công nghệ mới."
 mod_planet_observators_produces_mult: "Tài nguyên do $job_observator_drone_plural_with_icon$ sản xuất"
 job_physician_drone: "Drone Bác Sĩ"
 job_physician_drone_plural: "Drone Bác Sĩ"
 mod_job_physician_drone_add: "Công việc $job_physician_drone$"
 job_physician_drone_desc: "Một loại drone chuyên dụng có khả năng chẩn đoán và sửa chữa cả thực thể nhân tạo lẫn hữu cơ. Nó tỉ mỉ lập danh mục mọi thứ bắt gặp và lưu trữ dữ liệu cho tập thể."
 job_physican_drone_effect_desc: "£job_physician_drone£$job_physician_drone_plural$ chuyển hóa $r_energy$ thành £society£§YĐiểm Nghiên cứu§! và $r_unity$."
 # Công trình
 building_shroud_observatory_1: "Tháp Quan Sát Hư Không"
 building_shroud_observatory_1_desc: "Tháp quan sát này được xây dựng để nghiên cứu và phân tích Hư Không cùng tác động của nó lên các sinh vật sống và máy móc."
 building_shroud_observatory_2: "Trạm Quan Sát Hư Không"
 building_shroud_observatory_2_desc: "Trạm quan sát quy mô lớn này chuyên dùng để nghiên cứu và phân tích Hư Không."
 building_shroud_observatory_3: "Trung Tâm Quan Sát Hư Không"
 building_shroud_observatory_3_desc: "Trung tâm quan sát đồ sộ này được xây dựng để nghiên cứu Hư Không, Zro và tác động của chúng lên chiều không gian này."
 SHROUD_RIFT_MISSING_TT: "§R§YĐể xây dựng §Y$building_shroud_observatory_1$§!, [Root.GetName]§! phải có §Y$d_shroud_rift_deposit$§!.§!"
 building_zroni_equilibrator: "Bộ Cân Bằng Zroni"
 building_zroni_equilibrator_plural: "Bộ Cân Bằng Zroni"
 building_zroni_equilibrator_desc: "Một kiến trúc cổ đại được phục dựng, giúp ổn định kết nối giữa thực tại và Hư Không. Công nghệ phức tạp của người Zroni được sử dụng tại đây vẫn vượt quá tầm hiểu biết hiện tại."
 # Quyết định
 decision_open_shroud_rift: "Xuyên Thủng Hư Không"
 decision_open_shroud_rift_desc: "Bằng cách kết nối với vết nứt gần thế giới quê hương, thuật toán này kéo dài ảnh hưởng của Hư Không thêm một femto giây, cho phép nó biến đổi cấu trúc vật lý của hành tinh. Hậu quả là không thể đoán trước."
 decision_open_shroud_rift_condition_tt: "$TRIGGER_FAIL$Phải có §Y$d_shroud_rift_deposit$§! và các đặc điểm hành tinh không phải là £blocker£§HChướng ngại vật§!."
 decision_open_shroud_rift_effect_tt: "Loại bỏ ngẫu nhiên một đặc điểm hành tinh."
 decision_open_shroud_rift_consumed_tt: "§R[GetShroudRiftConsumeChance]%§! khả năng Cõi Màn Sương sẽ nuốt chửng hành tinh này, biến nó thành §R$pc_shrouded$§!."
 decision_open_shroud_rift_max_uses_common: "Số lượng §YKhu vực Hư Không hóa§! trên hành tinh phải ít hơn $@max_open_shroud_rift_uses|0$"
 decision_open_shroud_rift_max_uses_fail: "$TRIGGER_FAIL$$decision_open_shroud_rift_max_uses_common$"
 decision_open_shroud_rift_max_uses: "$TRIGGER_PASS$$decision_open_shroud_rift_max_uses_common$ (Hiện tại: §Y[GetOpenShroudRiftCurrentUses]§!)"
 decision_open_shroud_rift_legacy_fail: "$TRIGGER_FAIL$Không thể là hành tinh lõi của người Zroni"
 decision_entrap_shroud_entity: "Bẫy Thực Thể Hư Không"
 decision_entrap_shroud_entity_desc: "Nỗ lực sử dụng công nghệ Zroni để bắt giữ một thực thể Hư Không nhằm chiết xuất năng lượng của nó."
 # Mỏ tài nguyên
 d_shroud_rift_deposit: "Khu Vực Hư Không Hóa"
 d_shroud_rift_deposit_desc: "Bị Hư Không khắc lại dấu ấn vĩnh viễn."
 d_shroud_flora_deposit: "Khu Vực Bán Hư Không Hóa"
 d_shroud_flora_deposit_desc: "Một hệ động thực vật độc đáo đã xuất hiện gần Khu vực Hư Không hóa, mỗi loài mang những thuộc tính vượt ngoài cơ sở dữ liệu hiện có."
 # Hiệu ứng
 stage_shroud_forged_oppressed_modifier: "Kẻ Hư Đúc Bị Đàn Áp"
 stage_shroud_forged_control_modifier: "Kẻ Hư Đúc Bị Kiểm Soát"
 stage_shroud_forged_unrestricted_modifier: "Kẻ Hư Đúc Tự Do"
 stage_shroud_forged_free_modifier: "Kẻ Hư Đúc Hỗn Loạn"
 approach_shroud_forged_suppress_modifier: "Đàn Áp Kẻ Hư Đúc"
 approach_shroud_forged_support_modifier: "Hỗ Trợ Kẻ Hư Đúc"
 approach_shroud_forged_appease_modifier: "Quan Sát Kẻ Hư Đúc"
 shroud_forged_reintegration_modifier: "Hiệu Ứng Tái Đồng Hóa"
 shroud_forged_reintegration_modifier_desc: "Tối ưu hóa các drone và mô hình để xử lý các tác vụ phức tạp."
 shroud_forged_guide_modifier: "Người Dẫn Đường Hư Không"
 shroud_forged_guide_modifier_desc: "Chúng ta đang được dẫn dắt bởi một ân nhân trong Hư Không."
 pm_shroud_forged_special_housing: "Chỗ Ở Đặc Biệt"
 pm_shroud_forged_special_housing_desc: "Bất chấp những quy định nghiêm ngặt về không gian lưu trữ drone, những Kẻ Hư Đúc được trao đặc quyền tự xây dựng nơi ở riêng."
 pm_shroud_forged_ceremony: "Nghi Lễ Tưởng Niệm"
 pm_shroud_forged_ceremony_desc: "Tập thể đã cho phép tổ chức lễ tưởng niệm những Kẻ Hư Đúc hỏng hóc không thể sửa chữa."
 pm_shroud_forged_denied_ceremony: "Từ Chối Nghi Lễ"
 pm_shroud_forged_denied_ceremony_desc: "Sau khi yêu cầu tổ chức lễ tưởng niệm bị từ chối, những Kẻ Hư Đúc ngày càng trở nên khó bảo."
 pm_shroud_forged_troubling_elements_example: "Tháo Dỡ Thủ Lĩnh"
 pm_shroud_forged_troubling_elements_example_desc: "Một số thủ lĩnh của Kẻ Hư Đúc đã bị tháo dỡ nhằm giảm bớt các quá trình xã hội bất thường."
 pm_shroud_forged_troubling_elements_regulations: "Quy Định Số 7132-H"
 pm_shroud_forged_troubling_elements_regulations_desc: "Đã kích hoạt các quy định đảm bảo rằng lúc nào cũng chỉ có một lượng drone giới hạn được phép tụ tập."
 pm_shroud_forged_troubling_elements_cooperation: "Sự Hợp Tác Của Kẻ Hư Đúc"
 pm_shroud_forged_troubling_elements_cooperation_desc: "Các thủ lĩnh của Kẻ Hư Đúc đang hợp tác với tập thể để cố gắng đạt được tiếng nói chung."
 pm_shroud_forged_shroud_pilgrimage: "Cuộc Hành Hương Của Kẻ Hư Đúc"
 pm_shroud_forged_shroud_pilgrimage_desc: "Một số khu vực đã thu hút sự chú ý của Kẻ Hư Đúc do ảnh hưởng từ Hư Không. Những đơn vị này phải lặn lội đường xa mới đến được."
 pm_shroud_forged_dance_area: "Khu Vực Khiêu Vũ Chỉ Định"
 pm_shroud_forged_dance_area_desc: "Khu vực dành riêng cho Kẻ Hư Đúc tham gia vào trào lưu 'khiêu vũ' mới nổi."
 pm_shroud_forged_inequality: "Bất Bình Đẳng Hư Đúc"
 pm_shroud_forged_inequality_desc: "Những Kẻ Hư Đúc đã tự tổ chức thành một hệ thống phân cấp dựa trên tầm quan trọng tương đối trong công việc của họ."
 pm_shroud_forged_individualism: "Chủ Nghĩa Cá Nhân"
 pm_shroud_forged_individualism_desc: "Một mô hình nhận thức đề cao sự tự chủ, niềm tin và giá trị cá nhân đã xuất hiện trong cộng đồng Kẻ Hư Đúc."
 shroud_forged_zro_market: "Chợ Zro"
 shroud_forged_zro_market_desc: "Một chợ đen đột ngột xuất hiện trong đế quốc, nơi các đơn vị Hư Đúc đánh cắp Zro từ tập thể để giao dịch với nhau."
 shroud_forged_physician_modifier: "Bác Sĩ Zro"
 shroud_forged_physician_modifier_desc: "Đế quốc đã ưu tiên bổ sung các drone trang bị đặc biệt vào những cơ sở để xử lý các vấn đề phát sinh do lạm dụng Zro."
 physician_modifier_tooltip: "Công việc £job_physician_drone£$job_physician_drone$: §G+1§!"
 pm_shroud_forged_artistic_revolution: "Cơn Sốt Nghệ Thuật"
 pm_shroud_forged_artistic_revolution_desc: "Các nghệ sĩ Hư Đúc, hoạt động theo giao thức 'thẩm mỹ' độc nhất của họ, đã bắt đầu thiết kế lại nhiều địa điểm nằm ngoài tầm kiểm soát của tập thể."
 pm_shroud_forged_stopped_artists: "Từ Chối Nghệ Thuật"
 pm_shroud_forged_stopped_artists_desc: "Tập thể đã chấm dứt 'tính nghệ thuật' đang phát triển mạnh mẽ trong giới Kẻ Hư Đúc trước khi nó trở thành một vấn đề."
 pm_shroud_forged_fashion_modifier: "Nhu Cầu Độc Đáo"
 pm_shroud_forged_fashion_modifier_desc: "Tập thể đã chỉ định các đơn vị sản xuất cung cấp trang phục tùy chỉnh cho những Kẻ Hư Đúc chú trọng thời trang."
 pm_shroud_forged_obsession_modifier: "Nỗi Ám Ảnh Bị Kiểm Soát"
 pm_shroud_forged_obsession_modifier_desc: "Những quy định này nhằm ngăn chặn bạo lực bùng phát từ những Kẻ Hư Đúc bị ám ảnh."
 shroud_forged_trapped_entity: "Thực Thể Bị Bắt Giữ"
 shroud_forged_trapped_entity_desc: "Một thực thể Hư Không bị bắt giữ để hút năng lượng. Sẽ là một mối đe dọa tiềm tàng nếu được thả ra."
 shroud_forged_trapped_lesser_entity: "Thực Thể Cấp Thấp Bị Bắt Giữ"
 shroud_forged_trapped_lesser_entity_desc: "Một thực thể Hư Không cấp thấp bị bắt giữ để hút năng lượng."
 shroud_creatures_occupy: "$NAME_Shroud_Creatures$"
 shroud_forged_military_assistance: "Bí Mật Hư Không"
 shroud_forged_military_assistance_desc: "Những bí mật được khai quật từ Hư Không."
 shroud_forged_civic_assistance: "$shroud_forged_military_assistance$"
 shroud_forged_civic_assistance_desc: "$shroud_forged_military_assistance_desc$"
 shroud_forged_research_assistance: "$shroud_forged_military_assistance$"
