 # Quyền Lợi Giống Loài
 citizenship_shroud_touched: "Kẻ Hư Đúc"
 citizenship_shroud_touched_tooltip: "Nhóm cỗ máy này được §HHư Không§! nhào nặn lại một cách đặc biệt. Họ hoạt động độc lập với §H$machine_intelligence$§! và không thể làm công việc của £pop_cat_simple_drone£$pop_cat_simple_drone$."
 citizenship_shroud_touched_tooltip_delayed: "§LHọ làm việc cho hệ thống, nhưng không sống vì hệ thống.§!"
 citizenship_shroud_forged_no_assimilation: "$TRIGGER_FAIL$Do sự phức tạp của các đơn vị Kẻ Hư Đúc, hiện tại chúng ta không thể đồng hóa chúng vào mạng lưới tập thể."
 living_standard_protected: "Được Bảo Vệ"
 living_standard_protected_tooltip: "Tuy không phải là một phần của tập thể, những đơn vị này vẫn được bảo vệ. Kỹ năng độc đáo của chúng rất hữu ích cho §H$machine_intelligence$§!, nhưng những nhu cầu phát sinh thêm cũng có thể tăng lên từng ngày."
 living_standard_protected_tooltip_delayed: "§LChừng nào còn hữu dụng, hệ thống sẽ còn dung nạp họ.§!"
 assimilate_shroud_forged_tt: "Không thể đồng hóa £pop£§H$citizenship_shroud_touched$§!§Y$POPS$§!"
 living_standard_protected_situation_stage_tt: "Phí duy trì cho $citizenship_shroud_touched$: §R+$@living_standard_luxuries_high|1$§!£consumer_goods£§YHàng Tiêu Dùng§!."
 # Đặc Điểm
 leader_trait_guided: "Chỉ Dẫn Hư Không"
 leader_trait_guided_desc: "Đơn vị này du hành qua các vì sao dựa trên những ảo ảnh và thông điệp từ Hư Không. Nó cần một nguồn cung cấp Zro ổn định để đảm bảo tín hiệu luôn rõ ràng."
 leader_trait_shroud_prophet: "Tiên Tri Hư Không"
 leader_trait_shroud_prophet_desc: "Tương truyền đơn vị này có sự liên kết sâu sắc với Hư Không, cũng như với các thực thể tồn tại trong đó."
 trait_shroud_forged: "Kẻ Hư Đúc"
