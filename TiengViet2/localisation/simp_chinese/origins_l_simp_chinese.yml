 # Lục Quân
 shroud_monstrosities: "Vật Thể Thế Giới Khác"
 shroud_monstrosities_desc: "Nhìn thẳng vào những thực thể này trên chiến trường đồng nghĩa với việc đối mặt với sự điên loạn; hình thể của chúng vặn vẹo nhấp nháy, không bao giờ ngừng lại, không thể cố định."
