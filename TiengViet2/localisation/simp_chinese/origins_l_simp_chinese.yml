 finish_shroud_forged_liberation: "—Mở khóa lắp ráp dân số §YKẻ Hư Đúc§!\n—Mở khóa §YĐặc quyền Thăng thiên§!: §H$ap_become_the_crisis$§!\n—Mở khóa §YSắc lệnh§!: ['edict:shroud_bonded', $edict_shroud_bonded$]\n—Mở khóa §YDự án đặc biệt§!: §HNgười Dẫn Đường§!\n$t$—£crime£$MOD_PLANET_CRIME_NO_HAPPINESS_MULT$: §G-15%§!\n$t$—$mod_planet_observators_produces_mult$: §G+10%§!\n—Mở khóa §YCây Truyền thống§!: §H$tradition_psionics_shroud$§!\n—Nhận tùy chọn nghiên cứu: ['technology:tech_psionic_theory']\n—Nhận tiến độ công nghệ: ['technology:tech_psionic_theory'] §G+50%§!\n—Giống loài §YKẻ Hư Đúc§! nhận đặc điểm §Y$trait_psionic$§!\n—Thủ lĩnh §YKẻ Hư Đúc§! trở thành ['concept_leader_trait_psionic']\n—§YKẻ Hư Đúc§! trở thành giống loài thống trị Đế quốc."
