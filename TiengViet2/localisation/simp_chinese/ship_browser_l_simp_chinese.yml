l_simp_chinese:
 SHIPSET_LABEL: "Kiểu dáng tàu"
 SHIPSETS_LABEL: "Kiểu dáng tàu"
 SHIP_GRAPHICS_PREVIEW: "Xem trước tàu"
 SHIP_GRAPHICS_REQUIRED_DLC: "Yêu cầu DLC"
 SHIP_GRAPHICS_MISSING_DLC_TOOLTIP: "§GNhấn để xem trước tàu $CULTURE_NAME$§!"
 SHIP_GRAPHICS_CAMERA_TRANSFORM_TOOLTIP: "£camera_zoom_in£Lăn §Gcon lăn chuột lên§! để phóng to.\n£camera_zoom_out£Lăn §Gcon lăn chuột xuống§! để thu nhỏ.\n£camera_rotate£Nhấn giữ và kéo §Gchuột phải§! trên mô hình để xoay."
 SHIP_GRAPHICS_CORVETTE_DESC: "Tàu Hộ Tống là lớp tàu chiến đầu tiên mà một đế chế có thể chế tạo. Chúng di chuyển chớp nhoáng, cực kỳ cơ động và có giá thành rẻ."
 SHIP_GRAPHICS_FRIGATE_DESC: "Tàu Frigate là phiên bản nâng cấp của Tàu Hộ Tống, chuyên dùng để phóng ngư lôi. Chúng chậm chạp và mỏng manh hơn, nhưng lại có thể gây sát thương tàn khốc cho các mục tiêu cỡ lớn."
 SHIP_GRAPHICS_DESTROYER_DESC: "Tàu Khu Trục phải đánh đổi một phần độ cơ động và tốc độ của Tàu Hộ Tống để đổi lấy hỏa lực mạnh mẽ cùng lớp vỏ tàu bền bỉ hơn."
 SHIP_GRAPHICS_CRUISER_DESC: "Tàu Tuần Dương là loại tàu đa năng với sức bền đáng nể, vừa có thể chống chịu sát thương, vừa đóng vai trò hỏa lực chủ lực."
 SHIP_GRAPHICS_BATTLESHIP_DESC: "Thiết Giáp Hạm cực kỳ đắt đỏ nhưng lại mang sức mạnh áp đảo. Tầm bắn vượt trội của chúng có thể thổi bay kẻ địch trước cả khi chúng kịp phản kháng."
 SHIP_GRAPHICS_TITAN_DESC: "Bản thân Tàu Titan đã mang sức mạnh vô song, nhưng chúng còn có thể tỏa ra vầng hào quang cường hóa cho toàn bộ hạm đội đồng minh."
 SHIP_GRAPHICS_BIO_TITAN_DESC: "$SHIP_GRAPHICS_TITAN_DESC$"
 SHIP_GRAPHICS_JUGGERNAUT_DESC: "Với bất kỳ đế chế nào, việc chế tạo được một Tàu Juggernaut luôn là một kỳ tích vĩ đại. Lớp tàu khổng lồ này vừa là một xưởng đóng tàu di động, vừa đóng vai trò kỳ hạm hỗ trợ đắc lực."
 SHIP_GRAPHICS_COLOSSUS_DESC: "Những con tàu hùng mạnh này không hề trang bị vũ khí đối hạm, thay vào đó, mục đích tồn tại duy nhất của chúng là xóa sổ cả một hành tinh."
 SHIP_GRAPHICS_OUTPOST_DESC: "Tiền đồn là cấp độ cơ bản nhất của căn cứ sao, không có chức năng nào khác ngoài việc khẳng định chủ quyền của ta tại một hệ sao."
 SHIP_GRAPHICS_STARBASE_CITADEL_DESC: "Thành Trì Sao là cấp bậc tối cao của căn cứ sao. Được vũ trang tận răng với mạng lưới phòng thủ dày đặc, một Thành Trì Sao chắc chắn là khúc xương vô cùng khó nhằn đối với bất kỳ hạm đội đối phương nào."
 SHIP_GRAPHICS_TRANSPORT_DESC: "Trong thời chiến, tàu vận tải mang theo binh lính để đổ bộ lên các hành tinh địch. Do không có vũ trang và mỏng manh, chúng cần có hạm đội hộ tống mới có thể tiến vào lãnh thổ địch."
 SHIP_GRAPHICS_SCIENCE_DESC: "Tàu khoa học chuyên dùng để khám phá các hệ sao mới và nghiên cứu các hiện tượng dị thường. Là tàu dân sự, chúng không hề có vũ trang và rất dễ bị tổn thương."
 SHIP_GRAPHICS_CONSTRUCTOR_DESC: "Tàu công trình là trụ cột không thể thiếu để xây dựng bất kỳ trạm không gian nào. Là tàu dân sự, chúng không hề có vũ trang và rất dễ bị tổn thương."
 SHIP_GRAPHICS_COLONIZER_DESC: "Tàu thuộc địa được phóng từ các hành tinh có người ở để đưa dân đi khai phá những hành tinh mới. Là tàu dân sự, chúng không hề có vũ trang và rất dễ bị tổn thương."
 SHIP_GRAPHICS_SHIP_SIZE_LOCKED_DESC: "§RLớp tàu này yêu cầu phải có DLC $SHIP_SIZE_NAME$.§!"
 SHIP_GRAPHICS_ION_CANNON_DESC: "Một tổ hợp phòng thủ khổng lồ, phóng ra những luồng năng lượng hủy diệt để nghiền nát tàu địch. Dù chậm chạp nhưng uy lực của nó đủ sức răn đe bất kỳ vị khách không mời nào."
 SHIP_GRAPHICS_MILITARY_STATION_SMALL_DESC: "Nền tảng phòng thủ là một trạm quỹ đạo cố định, được thiết kế để bảo vệ căn cứ sao khỏi các thế lực thù địch."
 SHIP_GRAPHICS_STARBASE_DEEP_SPACE_CITADEL_1_DESC: "Một trạm quỹ đạo đóng vai trò là tiền tuyến phòng thủ của hệ sao. Được thiết kế để mở rộng tầm ảnh hưởng và canh gác các cứ điểm chiến lược."
 SHIP_GRAPHICS_STARBASE_DEEP_SPACE_CITADEL_2_DESC: "Một cứ điểm tiên tiến dày đặc các ụ vũ khí và hệ thống phòng ngự. Được gia cố đặc biệt cho các cuộc giao tranh kéo dài, nó có thể cầm chân hạm đội địch tại những vùng không gian tranh chấp."
 SHIP_GRAPHICS_STARBASE_DEEP_SPACE_CITADEL_3_DESC: "Trạm không gian khổng lồ này là đỉnh cao của công trình phòng thủ không gian sâu, một pháo đài gần như bất khả xâm phạm. Nó có thể chống chọi mọi quy mô tấn công trong khi vẫn duy trì mạch máu hậu cần cho hệ sao."
 SHIP_SIZE_SELECTOR_LOC: "SHIP_GRAPHICS_$SIZE$_DESC"
 SHIPSETS_DESCRIPTION_LABEL: "Mô tả"
 SHIP_GRAPHICS_NANITE_SWARMER_DESC: "Một loại phi thuyền cỡ nhỏ siêu linh hoạt được cấu thành từ các robot nano tự nhân bản. Không cần phi công điều khiển, bầy đàn tự trị này áp đảo kẻ thù bằng số lượng vượt trội và xé toạc lớp phòng ngự với độ chính xác đến lạnh người."
 SHIP_GRAPHICS_NANITE_INTERDICTOR_DESC: "Tàu Đánh Chặn là phi thuyền thích ứng được cấu tạo từ robot nano tự nhân bản, đặt tính đồng bộ lên trên sự hỗn loạn. Hoạt động như một khối thống nhất, các cấu trúc tự trị này đánh chặn và triệt hạ mối đe dọa với hiệu suất đáng sợ, phá vỡ đội hình địch bằng đòn phối hợp tàn phá và truy cùng diệt tận."
 SHIP_GRAPHICS_CRISIS_CORVETTE_DESC: "Tàu Hộ Tống Khủng Hoảng được thiết kế để xuất kích chớp nhoáng và đè bẹp mọi thứ bằng số lượng áp đảo. Chúng vượt trội hơn hẳn các tàu hộ tống thông thường, gieo rắc nỗi kinh hoàng cho những kẻ dám cản bước cơn bão sắp ập tới."
 SHIP_GRAPHICS_CRISIS_DESTROYER_DESC: "Một chiến hạm bọc thép hạng nặng được thiết kế với triết lý tối đa hóa hiệu suất tàn sát. Nặng nề và cứng cáp hơn Tàu Hộ Tống, nó vừa có thể trút xuống hỏa lực kinh hoàng, vừa duy trì được tốc độ cao để săn lùng những tàn quân đang bỏ chạy."
 SHIP_GRAPHICS_CRISIS_CRUISER_DESC: "Một chiến hạm hùng mạnh sở hữu sự cân bằng hoàn hảo giữa hỏa lực, độ bền và khả năng chi phối chiến lược. Với lớp giáp dày và phòng thủ kiên cố, nó đóng vai trò trụ cột trong mọi cuộc tấn công rực lửa, dùng sức mạnh bạo liệt xé toang phòng tuyến của kẻ thù."
 SHIP_GRAPHICS_STAR_EATER_DESC: "Một con tàu khổng lồ có khả năng nuốt chửng cả một vì sao, kích hoạt vụ nổ siêu tân tinh để quét sạch toàn bộ hệ sao. Kẻ Thực Tinh không chỉ là một chiến hạm, nó là sứ giả của ngày tận thế thiên hà, biến vô số hành tinh trên đường đi của nó thành hư vô chết chóc."
 SHIP_GRAPHICS_COSMO_CRISIS_DESTROYER_DESC: "Một chiến hạm hào nhoáng ngập tràn năng lượng vũ trụ, giáng đòn một cách chuẩn xác và tàn nhẫn. Nó không chỉ là một con tàu, mà còn là điềm báo cho một hiện thực mới."
 SHIP_GRAPHICS_COSMO_CRISIS_BATTLECRUISER_DESC: "Sự hòa quyện tuyệt mỹ giữa công nghệ và định mệnh, sở hữu hỏa lực hủy diệt vạn vật. Chiến hạm này có thể định đoạt lại chiến trường, hệt như cách mà chủ nhân của nó đang tái tạo lại cả dải ngân hà."
 SHIP_GRAPHICS_COSMO_CRISIS_TITAN_DESC: "Đây là cỗ máy chiến tranh của vũ trụ, tản ra sức mạnh của một biến cố sắp chực chờ nổ ra. Sự hiện diện của nó bóp méo cả thực tại, báo hiệu bình minh của một vũ trụ được tái sinh."
