 ## Event Chain: Sa mạc hóa nhanh chóng
 RAPID_DESERTIFICATION_CAT: "Sa mạc hóa nhanh chóng"
 RAPID_DESERTIFICATION_CAT_DESC: "Hình ảnh từ trên không của [From.Planet.GetName] cho thấy thảm thực vật suy giảm nhanh chóng, có thể là dấu hiệu cho một dạng sống chưa biết đang cư ngụ trên bề mặt."
 anomaly.7135.name: "Đã xác định quần thể động vật ngoại lai"
 anomaly.7135.desc: "Chúng ta đã tìm thấy sự sống trên [desertling_planet.GetName]. Các bầy động vật có vú nhỏ kém thông minh xuất hiện khắp hành tinh.\n\nCác nhà khoa học đặt tên chúng là \"Sa Sinh Thú\", số lượng của chúng đang tăng với tốc độ chóng mặt. Hành tinh này đã vượt quá khả năng chịu đựng, và hệ sinh thái đang suy thoái nhanh chóng."
 anomaly.7135.a: "Điều tra xem tại sao chuyện này lại xảy ra vào lúc này."
 anomaly.7135.b: "Tốt nhất là đừng can thiệp."
 anomaly.7135.b.tooltip: "Chúng ta sẽ giám sát tình hình từ xa."
 RAPID_DESERTIFICATION_PROJECT: "Hệ sinh thái bị tàn phá"
 RAPID_DESERTIFICATION_PROJECT_DESC: "Một bầy động vật có vú đang sinh sôi quá mức trên hành tinh [desertling_planet.Planet.GetName]. Với nguồn lực thích hợp, các nhà khoa học có thể thu thập thêm manh mối về nguồn gốc và khả năng của loài vật kém thông minh này."
 anomaly.7140.name: "Loài xâm lấn"
 anomaly.7140.desc: "Trong khi nghiên cứu Sa Sinh Thú trên [desertling_planet.GetName], các nhà khoa học đã quan sát được một hiện tượng mấu chốt. Dù loài này có mặt khắp nơi nhưng lại không hề có hồ sơ hóa thạch tương ứng. Những kẻ xâm lược sinh thái này đã gây ra thiệt hại môi trường cực đoan trong thời gian ngắn, rất có thể do ai đó mang từ bên ngoài vào.\n\nTình hình đã quá rõ ràng, chúng ta cần can thiệp gấp. Nếu không hành động, những sinh vật này sẽ phá hủy mọi thứ còn lại của hệ sinh thái tự nhiên trên hành tinh này."
 anomaly.7140.a: "Chúng ta sẽ nhận nuôi lũ nhỏ này nhiều nhất có thể."
 anomaly.7140.a.tooltip: "Chúng ta sẽ chịu trách nhiệm về hành vi của chúng."
 anomaly.7140.b: "Thiết lập chính sách kiểm soát số lượng động vật."
 anomaly.7140.b.tooltip: "Chọn chỉnh sửa di truyền để kìm hãm sự phát triển..."
 anomaly.7140.c: "Tiêu diệt bầy thú này."
 anomaly.7140.c.tooltip: "Phải bảo vệ hành tinh bằng mọi giá."
 anomaly.7140.d: "Chúng ta sẽ dùng một số con làm gia súc."
 anomaly.7140.d.tooltip: "Chúng ta sẽ mang hai nô lệ đến mỗi hành tinh."
 POPULATION_CONTROL_PROJECT: "Kiểm soát quần thể"
 POPULATION_CONTROL_PROJECT_DESC: "Để cứu vãn tình trạng sinh thái của [desertling_planet.GetName], phải ức chế sự gia tăng số lượng theo cấp số nhân của quần thể động vật xâm lấn. Các nhà khoa học cần thời gian và nguồn lực để tìm giải pháp khả thi."
 anomaly.7145.name: "Sự kiện diệt vong"
 anomaly.7145.base: "đã đầu hàng trước sự xâm lấn của loài động vật có vú sinh sản theo cấp số nhân. Một sự im lặng chết chóc bao trùm lên vùng đất cằn cỗi, toàn bộ thảm thực vật còn sót lại đều bị ăn tận rễ.\n\nLoài thú ăn tạp này đang thoi thóp, hoặc là chết đói trực tiếp, hoặc bị đồng loại ăn thịt trong nạn đói ngày càng dữ dội."
 anomaly.7145.desc: "Chúng ta nhận được tin, [desertling_planet.GetName]$anomaly.7145.base$"
 anomaly.7145.b.desc: "Chúng ta nhận được tin rằng [desertling_planet.GetName]$anomaly.7145.base$"
 anomaly.7145.a: "Ít nhất thì nỗi đau cũng đã kết thúc."
 anomaly.7145.b: "Thuộc địa của chúng ta đã bị hủy hoại."
 anomaly.7150.name: "Sự hồi sinh của tự nhiên"
 anomaly.7150.desc: "Sau những nỗ lực gian khổ, chúng ta đã tiêu hủy và cải tạo gen loài sinh vật sa mạc trên [desertling_planet.GetName], số lượng của chúng cuối cùng đã giảm xuống mức bền vững.\n\nKhi không còn quá nhiều động vật ăn cỏ, một sự cân bằng tinh tế đã xuất hiện. Thiên nhiên đang hồi phục nhanh chóng, những đồng cỏ tươi mới bắt đầu mọc lên trên vùng sa mạc từng hoang tàn."
 anomaly.7150.a: "Một thiên đường ẩn giấu."
 anomaly.7155.name: "Sa mạc Đỏ"
 anomaly.7155.desc: "Cuối cùng, con gặm nhấm cuối cùng trên [desertling_planet.GetName] đã chết. Bản thân cát đã bị nhuộm đỏ, đó là cái giá cho nỗ lực khổng lồ nhằm cứu hành tinh khỏi sự xâm lấn, nhưng những mầm xanh mới đã bắt đầu nảy nở. Chúng ta đã ra tay đúng lúc."
 anomaly.7155.a: "Đây là điều cần phải làm."
 colony.7160.name: "Báu vật quốc gia"
 colony.7160.desc: "Khi chúng ta mở cửa hành tinh cho những con Sa Sinh Thú này, không ai có thể ngờ tới kết quả như vậy. Những con vật nhỏ bé này đã thích nghi hoàn hảo với lối sống của chúng ta, trở thành những người bạn đồng hành đáng yêu trong đời sống gia đình.\n\nSự hòa nhập nhanh chóng của chúng làm dấy lên suy đoán rằng loài này chắc hẳn đã từng được thuần hóa. Dù nguyên nhân nào dẫn đến sự thân thiện bẩm sinh này, tin đồn đó chỉ càng làm tăng thêm sự quan tâm của mọi người đối với những sinh vật phi thường này."
 colony.7160.a: "Theo một cách nào đó, chúng đã cứu rỗi chúng ta."
 colony.7165.name: "Lũ nhỏ phiền phức"
 colony.7165.desc: "Tin xấu ập đến. Một vài con Sa Sinh Thú đã trốn thoát trong quá trình vận chuyển, hình thành một quần thể hoang dã đang mở rộng nhanh chóng. Chúng ta phải xử lý tình huống này thật nhanh để tránh sụp đổ môi trường."
 colony.7165.a: "Săn lùng lũ thú đó!"
 colony.7165.b: "Xây dựng khu bảo tồn có tường bao quanh."
 colony.7170.name: "Số lượng thú có vú ổn định"
 colony.7170.desc: "Chúng ta đã đạt được thành công nhất định trong việc kiềm chế sự xâm lấn tràn lan của Sa Sinh Thú. Đáng tiếc là không thể tận diệt những con thú lẩn lút này. Việc tiếp tục giám sát tình hình là vô cùng quan trọng, vì nó có thể chạm ngưỡng tới hạn bất cứ lúc nào."
 colony.7170.a: "Cuộc săn đuổi tiếp tục."
 colony.7175.name: "Sự xâm lấn mất kiểm soát"
 colony.7175.desc: "Nỗ lực kiểm soát Sa Sinh Thú của chúng ta đã công cốc. Những sinh vật tham lam này đào hang rất sâu, chúng mở rộng thuộc địa nhanh hơn tốc độ chúng ta tiêu diệt chúng. Trừ khi cho phép quân đội sử dụng kho vũ khí chất nổ và khí độc khổng lồ, nếu không cuộc chiến này sẽ thất bại và đe dọa đến sự an nguy của mọi người trên bề mặt."
 colony.7175.a: "Lũ thú sẽ ở lại đây..."
 colony.7175.b: "Chúng ta sẽ không thua lũ gặm nhấm tầm thường đâu."
 colony.7175.b.tooltip: "Nếu cần thiết, chúng ta sẽ hủy diệt cả hành tinh."
 job_alien_hunter: "Thợ săn thú ngoại lai"
 job_alien_hunter_plural: "Thợ săn thú ngoại lai"
 job_alien_hunter_desc: "Một đội đặc nhiệm chuyên săn lùng các động vật ngoại lai."
