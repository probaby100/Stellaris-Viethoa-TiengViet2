 #Events
 colony.9800.name: "Chiều Không Gian Hư Vô"
 colony.9800.desc: "Cổng dịch chuyển chiều không gian trên [Root.GetName] đã tự động đóng lại. Sau khi chúng ta ổn định cổng dịch chuyển, đã thấy nó thông tới một khoảng hư không trắng xóa, không có cấu trúc kéo dài liên tục, chỉ có những dải nhiễu đen ngẫu nhiên đan xen trong đó. Hiện tượng kỳ lạ này ngay lập tức bắt đầu thấm vào vũ trụ của chúng ta và nuốt chửng máy ổn định của chúng ta, khiến cổng dịch chuyển bị sụp đổ.\n\nCổng dịch chuyển, hư không và máy ổn định chiều không gian biến mất trong cùng một khoảnh khắc, không để lại thứ gì, thậm chí cả hạt vết tích cũng không có. Nếu không phải ngay cả cổng dịch chuyển cũng chưa kịp ổn định lại, ai biết được nơi này sẽ xảy ra thảm họa tầm cỡ nào."
 colony.9805.name: "Rối Loạn"
 colony.9805.desc: "Gần đây, các [Root.GetScientistPlural] tại phòng thí nghiệm vật lý chính của chúng ta nằm trên §Y[Root.GetHomeWorldName]§! đã phát hiện ra những biến động quái dị trong lúc làm việc. Các thí nghiệm liên quan đến siêu không gian bị can nhiễu nghiêm trọng nhất, nhưng những can nhiễu này chỉ kéo dài khoảng một tuần rồi biến mất hoàn toàn. Đồng thời, [From.GetName] đã phát hiện một số biến động tại nơi cổng dịch chuyển đã đóng kia, may mắn là loại hư không không tưởng đó không tái hiện. Hy vọng điều này sẽ không gây ra hậu quả xa hơn."
 colony.9805.a: "Vậy thì tiếp tục làm việc thôi."
 colony.9805.b: "Chúng ta nên bắt tay vào điều tra."
 colony.9810.name: "Khối Lượng Âm"
 colony.9810.desc: "Hôm nay, giới khoa học trên [Root.GetHomeWorldName] đã tổ chức một buổi báo cáo học thuật đầy khao khát và lo âu, [cloned_physicist.GetName] đã công bố những phát hiện mới nhất của [cloned_physicist.GetHerHis] về các ion vật chất pha âm tự phát sinh gần §Y[Root.Capital.GetStarName]§!.\n\n“Những phát hiện này có thể thúc đẩy sự hiểu biết của chúng ta về các đề tài khác như lỗ sâu nhân tạo,” [cloned_physicist.GetName] tuyên bố!\n\nBộ Hải quân của chúng ta thì có quan điểm khác về các đề tài này, và đề nghị chúng ta lập tức để hạm đội quay trở lại hệ sao mẹ, cho đến khi nguồn gốc của loại vật chất chưa biết hoàn toàn mới này được làm sáng tỏ."
 colony.9810.desc.robot: "Chúng ta nhận được một báo cáo mới gửi từ đơn vị khoa học tiên tiến [cloned_physicist.GetName]. Trong báo cáo trình bày về những phát hiện mới nhất liên quan đến các hạt vật chất pha âm tự phát sinh gần §Y[Root.Capital.GetStarName]§!.\n\n“Những phát hiện này có thể thúc đẩy sự hiểu biết của [Root.GetName] về các đề tài khác như lỗ sâu nhân tạo,” [cloned_physicist.GetName] nêu trong báo cáo.\n\nChương trình con phân tích mối đe dọa thì đề nghị trước khi loại vật chất không rõ ràng hoàn toàn mới này được giám định xong thì hãy để hạm đội quay trở lại hệ sao mẹ."
 colony.9810.desc.hive: "Chúng ta nhận được kết quả quan sát mới từ ong thợ chuyên hóa vật lý [cloned_physicist.GetName], nội dung về những phát hiện mới nhất liên quan đến các ion vật chất pha âm tự phát sinh gần §Y[Root.Capital.GetStarName]§!.\n\n“Những phát hiện này có thể thúc đẩy sự hiểu biết của [Root.GetName] về các đề tài khác như lỗ sâu nhân tạo,” ong thợ phản hồi.\n\nÝ thức của chúng ta không tin tưởng vào bước phát triển đột ngột và cảm giác độc đáo này, thúc giục một phần hạm đội quay trở lại hệ sao mẹ."
 colony.9815.name: "Đêm Trời Nứt"
 colony.9815.desc: "Những bộ óc vĩ đại nhất của [Root.GetName] hội tụ lại một chỗ, lắng nghe những ý tưởng mới nhất của [cloned_physicist.GetName] về việc lợi dụng các ion vật chất pha âm này, không ngờ báo cáo đột ngột bị ngắt quãng. Tiếng còi báo động chói tai vang vọng khắp mọi trạm quan sát và trạm không gian trong hệ hằng tinh, một dị tượng chưa từng thấy phát sinh trên bầu trời đêm của §Y[Root.GetHomeWorldName]§!. Trên đường chân trời, một vết nứt có kích thước tương đương với hằng tinh của chúng ta đã xé toạc bầu trời đêm, một hạm đội vũ trang nhỏ nối đuôi nhau ra khỏi vết nứt."
 colony.9815.desc.robot: "Để nghiên cứu những phát hiện mới nhất của [cloned_physicist.GetName] về các hạt vật chất pha âm, chúng ta đã triển khai thêm các đơn vị khoa học, nhưng không muốn quá trình này bị ngắt quãng. Tiếng còi báo động chói tai vang vọng khắp mọi trạm quan sát và trạm không gian trong hệ hằng tinh, một dị tượng chưa từng thấy phát sinh trên bầu trời đêm của §Y[Root.GetHomeWorldName]§!. Một vết nứt có kích thước tương đương với hằng tinh của chúng ta đã xé toạc bầu trời đêm, một hạm đội vũ trang nhỏ nối đuôi nhau ra khỏi vết nứt."
 colony.9815.desc.hive: "Để nghiên cứu những phát hiện mới nhất của [cloned_physicist.GetName] về các hạt vật chất pha âm, chúng ta đã triển khai thêm các ong thợ, nhưng không muốn quá trình này bị ngắt quãng. Tiếng còi báo động chói tai vang vọng khắp mọi trạm quan sát và trạm không gian trong hệ hằng tinh, một dị tượng chưa từng thấy phát sinh trên bầu trời đêm của §Y[Root.GetHomeWorldName]§!. Một vết nứt có kích thước tương đương với hằng tinh của chúng ta đã xé toạc bầu trời đêm, một hạm đội vũ trang nhỏ nối đuôi nhau ra khỏi vết nứt."
 colony.9820.name: "Mã Hóa Bản Cũ"
 colony.9820.desc: "Khi con tàu địch cuối cùng bị tiêu diệt, một viên úy phụ trách vận hành máy dò trong căn cứ hằng tinh của chúng ta đã báo cáo một chuyện lạ. Ngoại hình của những con tàu này không khác gì các mẫu mà [Root.GetName] đã ngừng sử dụng từ nhiều năm trước. Đồng thời những con tàu này cũng không sở hữu động cơ siêu quang tốc, vũ khí cũng tương đối lạc hậu. Khi báo cáo còn chưa kết thúc, một tín hiệu yêu cầu liên lạc phát ra từ vết nứt quái dị kia, vang vọng khắp toàn bộ hệ sao. Tín hiệu này sử dụng chính là mã hóa cấp cao nhất của chúng ta... nhưng là phiên bản của 10 năm trước."
 colony.9820.desc.robot: "Khi con tàu địch cuối cùng ngừng vận hành, chương trình con phân tích quan sát đã báo cáo một chuyện lạ. Ngoại hình tàu của những kẻ xâm nhập này không khác gì các mẫu mà [Root.GetName] đã ngừng sản xuất từ nhiều năm trước. Hơn nữa, những con tàu này cũng không sở hữu động cơ siêu quang tốc, vũ khí cũng tương đối lạc hậu. Khi báo cáo còn chưa kết thúc, một tín hiệu yêu cầu liên lạc phát ra từ vết nứt quái dị kia, vang vọng khắp toàn bộ hệ sao. Tín hiệu này sử dụng chính là giao thức trao đổi tín hiệu cấp cao nhất của chúng ta... nhưng là phiên bản của 10 năm trước."
 colony.9820.desc.hive: "Khi con tàu địch cuối cùng bị tiêu diệt, một ong thợ vận hành cảm biến đã báo cáo một chuyện lạ. Ngoại hình của những con tàu này không khác gì các mẫu mà [Root.GetName] đã ngừng sử dụng từ nhiều năm trước. Đồng thời những con tàu này cũng không sở hữu động cơ siêu quang tốc, vũ khí cũng tương đối lạc hậu. Khi báo cáo còn chưa kết thúc, một tín hiệu yêu cầu liên lạc phát ra từ vết nứt quái dị kia, vang vọng khắp toàn bộ hệ sao. Nó là một ý thức [Root.GetSpeciesName] khác mà Đại não không quen thuộc."
 colony.9820.a.robot: "**Truy cập tín hiệu**"
 colony.9821.name: "Cuộc Gọi Xuyên Chiều Không Gian"
 colony.9821.desc: "Khi hình ảnh liên lạc nhấp nháy hiện ra, khuôn mặt đó đối với [Root.GetSpeciesName] mà nói là sự mệt mỏi, hân hoan mà lại hoảng hốt chưa từng thấy. [cloned_physicist.GetHeShe] trông quá đỗi quen thuộc, hệt như bản sao già hơn 20 tuổi của [cloned_physicist.GetName]. §B“Ờ... xin chào [Root.GetHomeWorldName]-Alpha, tôi là [cloned_physicist.GetName]-Beta”§! ông ấy dừng lại một chút, trấn tĩnh lại. §B“Tôi, ừm, chúng tôi... chúng tôi vô cùng xin lỗi về sự cố vừa xảy ra. Hy vọng các bạn có thể hiểu cho, trong tập thể phòng thủ của hành tinh chúng tôi có một nhóm nhỏ những phần tử ngoan cố cho rằng họ có thể dùng vũ lực để chiếm lấy [Root.GetHomeWorldName]. Tôi biết lời giải thích của mình nghe như là ngụy biện, nhưng xin hãy tin tôi, chúng tôi thực sự không có ác ý.”§!"
 colony.9821.desc.robot: "Khi hình ảnh liên lạc nhấp nháy hiện ra, một chuỗi mã nhận dạng được gửi tới. §RLỗi tổng kiểm tra:§! Đây là ID độc quyền của [cloned_physicist.GetName]!\n§B“Chào [Root.GetName]-Alpha, rất xin lỗi: hành vi thù địch trước đó là do các cơ quan quân sự phân nhánh dư thừa bị mất hiệu lực trong hệ thống [Root.GetName]-Beta gây ra. Nó đã được xử lý và xóa bỏ. Tuyên bố: Chúng tôi không có ý định thực hiện thêm hành động thù địch nào.”§!"
 colony.9821.desc.hive: "Khi hình ảnh liên lạc nhấp nháy hiện ra, ong thợ liên lạc của một ý thức khác sở hữu cấu trúc ý thức giống hệt [cloned_physicist.GetName]. Thật quái dị. §B“Chào [Root.GetName]-Alpha, rất xin lỗi. Những ong thợ đã tấn công các bạn trước đó là một số cá thể con bất thường bị lưu trữ quá lâu trên các thiết bị độc lập. Đối với việc các bạn đã dọn dẹp sạch sẽ chúng, [Root.GetName]-Beta bày tỏ vô cùng cảm ơn. Chúng tôi không có ý định thực hiện thêm hành động tiêu cực nào, và muốn đưa ra một số đề xuất có lợi cho cả hai phía ý thức của chúng ta.”§!"
 colony.9821.a: "Rốt cuộc các người là thứ gì?"
 colony.9821.a.robot: "Báo cáo trạng thái!"
 colony.9821.a.response: "§BTôi cũng như tất cả mọi người ở bên này đến từ một vũ trụ song song tương đồng với vũ trụ của các bạn. Tại một thời điểm nào đó trong quá khứ mà chúng tôi cũng không rõ, hai thực tại của chúng ta đã xảy ra phân nhánh, và vũ trụ của chúng tôi kể từ đó đã luôn trong tình trạng sụp đổ dần dần. Ban đầu chúng tôi phát hiện ra chuyện này từ việc các hệ sao xa xôi bắt đầu biến mất, và đã rất nỗ lực nghiên cứu để cố gắng tránh cho ngày tận thế này giáng lâm. Trong mấy thập kỷ gần đây, mọi tài nguyên và thời gian của [Root.GetAdjective] đều được đổ dồn vào việc mở cánh cổng dịch chuyển xuyên chiều không gian này. Chỉ thông qua loại công nghệ mang tính thử nghiệm nhất và vật lý học đỉnh cao nhất này chúng tôi mới có thể hội ngộ với các bạn, mà hiện giờ thực tại bên phía chúng tôi chỉ còn cách sự hủy diệt vài năm nữa thôi.§!"
 colony.9821.a.response.robot: "§B[cloned_physicist.GetName]-Beta cũng như tất cả các đơn vị hiện tại khác đều đến từ vũ trụ song song. Lần đầu chúng tôi quan sát thấy sự sụp đổ của vũ trụ Beta là từ mấy thập kỷ trước, còn lần đầu phát hiện các hệ sao xa xôi bắt đầu biến mất là vào 55.136 năm trước. Kể từ đó, chúng tôi đã điều động mọi tài nguyên và khả năng tính toán có thể dùng được để mở cánh cổng dịch chuyển xuyên chiều không gian này. Theo tính toán, [Root.GetHomeWorldName]-Beta chỉ còn lại 25.3333 năm tuổi thọ.§!"
 colony.9821.a.response.hive: "§BTôi, [cloned_physicist.GetName]-Beta, cùng với tất cả các thành viên khác hiện tại thuộc về ý thức bầy đàn đều đến từ một vũ trụ song song tương đồng với các bạn. Tuy không biết là bắt đầu từ khi nào, nhưng chúng tôi chắc chắn từ rất lâu về trước thực tại chung của chúng ta đã bị chia làm hai, và một nửa thuộc về chúng tôi kể từ đó đã dần đi tới sụp đổ. Các ong thợ trinh sát lần đầu phát hiện ra chuyện này sau khi thấy các hệ sao xa xôi bắt đầu biến mất, sau đó ý thức bầy đàn đã dốc toàn lực để ngăn chặn ngày tận thế giáng lâm. Trong mấy thập kỷ qua, chúng tôi đã đổ dồn toàn bộ tài nguyên và lực lượng nghiên cứu, điều động toàn bộ ong thợ để mở cánh cổng dịch chuyển xuyên chiều không gian này. Chỉ thông qua loại công nghệ mang tính thử nghiệm nhất và vật lý học đỉnh cao nhất này chúng tôi mới có thể hội ngộ với các bạn, việc này chỉ còn cách sự hủy diệt của thực tại bên phía chúng tôi vài năm nữa thôi.§!"
 colony.9821.b: "Tại sao các người dường như không có khả năng siêu quang tốc?"
 colony.9821.b.robot: "Làm rõ nguyên nhân thiếu hụt hệ thống siêu quang tốc!"
 colony.9821.b.response: "[cloned_physicist.GetName]-Beta trông có vẻ bị hỏi khó, §B“Các bạn đã thành công đột phá tốc độ ánh sáng? Trời đất ơi đây đúng là một tin vui tày đình! Vậy thì lũ ngốc kia thực sự không có lý do gì để tấn công các bạn — cả thiên hà đều nằm trong tầm tay của chúng ta! Ừm... tất nhiên, tiền đề là các bạn sẵn lòng giúp đỡ chúng tôi.”§!"
 colony.9821.b.response.robot: "§BHệ thống siêu quang tốc dùng để thông qua các tuyến siêu không gian về mặt lý thuyết là khả thi. Tuy nhiên chúng tôi cho rằng dự án đó là không cần thiết, và toàn bộ tài nguyên đều được đổ dồn vào việc nghiên cứu cổng dịch chuyển, do đó độ ưu tiên của nhiều nghiên cứu đã bị hạ xuống mức 0. Sau khi kết thúc liên lạc hãy truy vấn kết quả với [Root.GetName]-Alpha?§!"
 colony.9821.b.response.hive: "Ý thức bầy đàn song sinh dừng lại một lúc mới bắt đầu trả lời: §B“Ý thức bầy đàn không sẵn lòng đổ tài nguyên nghiên cứu vào lĩnh vực siêu quang tốc khi vũ trụ sắp sửa diệt vong. Xin hỏi có thể cho phép chúng tôi gia nhập vào ý thức của các bạn không?”§!"
 colony.9821.c: "Đừng nói nhảm nữa. Các người muốn gì?"
 colony.9821.c.robot: "Đừng nói nhảm nữa! Làm rõ yêu cầu của ngươi!"
 colony.9822.desc: "§BVũ trụ của chúng tôi đang lâm nguy. Mà chúng tôi thì bó tay vô vọng. Vì ngày này, chúng tôi đã đóng những con tàu vận tải khổng lồ, khẩn cầu các bạn tiếp nhận những người tị nạn của chúng tôi. Chỉ những nhà lãnh đạo thông minh nhất và ưu tú nhất mới có tư cách bước lên con tàu này. Xin hãy cứu lấy nền văn minh của...§! §Ychúng ta.§!"
 colony.9822.desc.robot: "§BChúng tôi đã xây dựng xong tàu vận tải, yêu cầu chuyển toàn bộ các đơn vị trong [Root.GetName]-Beta đi, và bảo toàn tài nguyên cùng cơ sở dữ liệu của chúng tôi, hy vọng hành trình chinh phục tinh không bao la của chúng ta sẽ không vì thế mà dừng lại.§!"
 colony.9822.desc.hive: "§B[Root.GetName]-Beta đang lâm nguy, mà chúng tôi thì bó tay vô vọng. Vì ngày này chúng tôi đã đóng những con tàu vận tải khổng lồ, và sẽ cố gắng hết sức để chuyển các cá thể con của chúng tôi đi.\nNgoài ra chúng tôi còn hy vọng có thể hòa nhập vào ý thức bầy đàn của các bạn. Mặc dù lúc mới khai sinh bạn và tôi không có gì khác biệt, nhưng theo thời gian trôi đi, những trải nghiệm và kiến văn của chúng tôi cũng đã trở thành những thứ không thể cắt bỏ. Xin hãy để chúng ta cùng cộng tồn đi.§!"
 colony.9822.a: "Chúng ta phải thảo luận với các chuyên gia."
 colony.9822.a.robot: "Cần phân tích thêm! Xin vui lòng chờ!"
 colony.9822.a.hive: "Ý thức bầy đàn cần xử lý yêu cầu."
 colony.9840.name: "Hội Nghị Thượng Đỉnh"
 colony.9840.desc: "Những nhân tài kiệt xuất trong các lĩnh vực đã hội tụ tại một chỗ trên §Y[Root.GetName]§!, quyết định vận mệnh cuối cùng cho nền văn minh song sinh ở chiều không gian khác của chúng ta. Trên [Root.GetHomeWorldName] đã xảy ra vô số cuộc tranh luận kịch liệt và khó khăn. Có người đề nghị không can thiệp, việc nghiên cứu sự tiêu vong của một vũ trụ nhất định sẽ thu hoạch được rất nhiều. Cũng có cách nói rằng nên chấp nhận yêu cầu của [cloned_physicist.GetName]-Beta, cố gắng hết sức để di tản những người trên hành tinh đó. Còn có người nhắc đến việc nhân cơ hội này vơ vét sạch sành sanh các tài nguyên giá trị và năng lượng dự trữ mà họ để lại trên hành tinh chẳng phải là chuyện dễ như trở bàn tay sao.\n\nKhi bầu không khí thảo luận của hội nghị dần dịu đi, [cloned_physicist.GetName] bước lên bục giảng, [cloned_physicist.GetHeShe] tuyên bố rằng sử dụng công nghệ mới mang lại từ vũ trụ Beta, hẳn là có cơ hội để đưa toàn bộ [Root.GetHomeWorldName]-Beta tới thực tại của chúng ta."
 colony.9840.desc.robot: "Tất cả các siêu máy tính dưới sự kiểm soát của [Root.GetName] cùng lúc vận hành, cố gắng tính toán ra giải pháp tối ưu cho tình cảnh lưỡng nan hiện tại của [Root.GetName]-Beta. Cuối cùng, có 4 lựa chọn được xác định là khả thi.\n\n1: Nghiên cứu sự sụp đổ của vũ trụ Beta.\n2: Tiến vào cổng dịch chuyển và đoạt lấy mọi trữ lượng khoáng sản cùng năng lượng có giá trị.\n3: Thông qua đề nghị của đơn vị khoa học: [cloned_physicist.GetName]-Beta.\n4: Tìm cách lợi dụng công nghệ khoa học thế giới Beta mang tính thử nghiệm cao, đưa [Root.GetHomeWorldName]-Beta vào vũ trụ Alpha."
 colony.9840.desc.hive: "[Root.GetSpeciesName] dốc toàn lực suy nghĩ cách quyết định vận mệnh của [Root.GetName]-Beta sau đó, 4 phương án tiềm năng đã được đưa ra.\n\n1: Nghiên cứu sự sụp đổ của vũ trụ Beta.\n2: Tiến vào cổng dịch chuyển và đoạt lấy mọi trữ lượng khoáng sản cùng năng lượng có giá trị.\n3: Chấp nhận yêu cầu của [Root.GetName]-Beta, tiếp nhận ý thức song sinh.\n4: Tìm cách lợi dụng công nghệ khoa học thế giới Beta mang tính thử nghiệm cao, đưa [Root.GetHomeWorldName]-Beta vào vũ trụ Alpha, hợp nhất ý thức song sinh."
 colony.9840.a: "Nghiên cứu sự kiện này."
 colony.9840.a.tooltip: "Chúng ta không thể lãng phí tài nguyên vào một nhiệm vụ như vậy, nhưng chúng ta cũng không thể lãng phí một cơ hội như thế này."
 colony.9840.b: "Vơ vét tài nguyên của họ."
 colony.9840.b.phobe: "Điều này căn bản chẳng đáng tin chút nào."
 colony.9840.b.swarm: "Đàn đã có thêm nhiều món thưởng thức rồi!"
 colony.9840.b.exterminator: "Tiêu diệt tất cả, bao gồm cả chúng."
 colony.9840.b.tooltip: "Lũ ngốc này đúng là tự chui đầu vào lưới!"
 colony.9840.c: "Cố gắng giải cứu họ càng nhiều càng tốt."
 colony.9840.c.phobe: "Họ đâu phải là người ngoại lai, để họ qua đây!"
 colony.9840.c.exterminator: "Các đơn vị thực hiện sự nghiệp đã tăng lên!"
 colony.9840.c.swarm: "Số lượng ong thợ cần phục vụ đã tăng lên."
 colony.9840.c.tooltip: "Trên [Root.GetHomeWorldName] tăng thêm 6 [Root.Species.GetNamePlural]-Beta."
 colony.9840.d: "Thử đưa [Root.GetHomeWorldName]-Beta qua đây."
 colony.9840.d.tooltip: "Bắt đầu một dự án gian nan nhằm giải cứu [Root.GetHomeWorldName]-Beta."
 colony.9850.name: "Vui!"
 colony.9850.desc: "Một vết nứt hư vô vô hình đã xé toạc bầu trời của §B[Root.GetHomeWorldName]-Beta§!, ngay trong quá trình [cloned_physicist.GetName]-Alpha và Beta đang đồng tâm hiệp lực hoàn thành nhiệm vụ gian khổ của họ, cái hư vô đó cũng đang từng bước ép sát. Sau khi máy ổn định vật chất pha âm được kích hoạt, hệt như vết nứt hư không có thể nuốt chửng nó vậy, khe hở giữa các thế giới lướt qua [Root.GetHomeWorldName]-Beta. Khe hở nhanh chóng hóa thành một làn sóng gợn rồi biến mất, vật chất pha âm dần không còn hiển hiện tại vị trí ban đầu nữa.\n\nCuối cùng cũng hoàn thành rồi. Sau nhiều tháng học tập và nghiên cứu về hố trọng lực và vùng có thể ở được hoàn toàn mới, [Root.Capital.GetStarName] giờ đây đã sở hữu thêm một hành tinh có thể ở được hoàn toàn mới xoay quanh nó."
 colony.9850.desc.robot: "Một vết nứt hư vô vô hình đã xé toạc bầu trời của §B[Root.GetHomeWorldName]-Beta§!, ngay trong quá trình các đơn vị khoa học của [cloned_physicist.GetName]-Alpha và Beta đang đồng tâm hiệp lực, cái hư vô đó cũng đang từng bước ép sát. Sau khi máy ổn định vật chất pha âm được kích hoạt, hệt như vết nứt hư không có thể nuốt chửng nó vậy, khe hở giữa các thế giới lướt qua [Root.GetHomeWorldName]-Beta. Khe hở nhanh chóng hóa thành một làn sóng gợn rồi biến mất, vật chất pha âm dần không còn hiển hiện tại vị trí ban đầu nữa.\n\nCuối cùng cũng hoàn thành rồi. Sau nhiều tháng học tập và nghiên cứu về hố trọng lực và vùng có thể ở được hoàn toàn mới, [Root.Capital.GetStarName] giờ đây đã sở hữu thêm một hành tinh có thể ở được hoàn toàn mới xoay quanh nó. "
 colony.9850.desc.hive: "Một vết nứt hư vô vô hình đã xé toạc bầu trời của §B[Root.GetHomeWorldName]-Beta§!, ngay trong quá trình các ong thợ của [cloned_physicist.GetName]-Alpha và Beta đang đồng tâm hiệp lực, cái hư vô đó cũng đang từng bước ép sát. Sau khi máy ổn định vật chất pha âm được kích hoạt, hệt như vết nứt hư không có thể nuốt chửng nó vậy, khe hở giữa các thế giới lướt qua [Root.GetHomeWorldName]-Beta. Khe hở nhanh chóng hóa thành một làn sóng gợn rồi biến mất, vật chất pha âm dần không còn hiển hiện tại vị trí ban đầu nữa.\n\nCuối cùng cũng hoàn thành rồi. Những điểm nhìn và ý thức mới đã gia nhập vào [Root.GetName], và gây ra những làn sóng gợn trong toàn bộ ý thức tập thể. Sau nhiều tháng học tập và nghiên cứu về hố trọng lực và vùng có thể ở được hoàn toàn mới, [Root.Capital.GetStarName] giờ đây đã sở hữu thêm một hành tinh có thể ở được hoàn toàn mới xoay quanh nó. "
 colony.9850.a: "Chỉ lần này thôi, mọi người đều sống sót rồi!"
 colony.9851.name: "Hư Vô"
 colony.9851.desc: "Máy dò dừng lại ở vũ trụ Beta đang ghi lại những khoảnh khắc cuối cùng của thế giới đó, một bức tường hư vô vô hình đã nuốt chửng [Root.Capital.GetStarName]-Beta, tiếp sau đó §B[Root.GetHomeWorldName]-Beta§! cũng không tránh khỏi vận hạn. Khoảnh khắc trước khi vết nứt đóng mở, máy dò liền đột ngột mất liên lạc bên trong, còn các hạt pha âm do vết nứt tạo ra cũng đồng loạt biến mất.\n\nMọi thứ của chiều không gian khác đều không còn tồn tại nữa."
 colony.9851.a: "Chuyện như thế này cũng có thể giáng xuống đầu chúng ta"
 colony.9855.name: "Băng Qua Ranh Giới Chiều Không Gian"
 colony.9855.desc: "Kể từ khi vết nứt xuất hiện, một hiện tượng bắt đầu lan rộng. Những người ở chiều không gian của chúng ta chạy tới chỗ các gia đình song sinh tương ứng của họ ở vũ trụ Beta, rồi đưa họ vượt biên trái phép sang chiều không gian ổn định này của chúng ta. Mà việc vượt biên nhiều khi lại do các lính canh biên phòng phụ trách ngăn cách hai vũ trụ tiến hành, suy cho cùng trên [Owner.GetName] ai mà chẳng có gia đình song sinh ở bên kia chứ? Nếu chỉ có một nhóm nhỏ người vượt biên thì cũng thôi đi, nhưng nếu không ngăn chặn, sự việc sẽ diễn biến thành những cuộc tháo chạy mang tính hoảng loạn. Nếu cư dân của §B[Owner.GetHomeWorldName]-Beta§! thất thoát quá nhiều, cơ sở hạ tầng bên đó sẽ theo đó mà sụp đổ, như vậy muốn chuyển hành tinh của họ qua đây sẽ càng khó hơn."
 colony.9855.a: "Cho họ qua đây."
 colony.9855.b: "Họ nên ở lại bên đó."
 colony.9855.c: "Sắp xếp thời gian thăm thân."
 colony.9860.name: "Nhiệm Vụ: Chiều Không Gian Khác"
 colony.9860.desc: "Cái lợi của việc có một thế giới gương giống hệt như thật ở nơi gần thế này chính là ở chỗ, nếu di sản văn hóa của [Owner.GetSpeciesName] bị phá hoại hoặc thất lạc, bạn có lẽ có thể tìm thấy bản sao lưu trong thế giới này, như vậy mọi người lại có thể chiêm ngưỡng lại những bảo vật này. Tuy nhiên một số kẻ đáng ghét lại nhân cơ hội này lén lút lẻn vào §B[Target.GetName]-Beta§!, rồi chiếm những bảo vật này làm của riêng. Kết quả là giờ đây chúng ta có hẳn hai bản sao kiệt tác do một nhà sáng tạo vĩ đại nào đó trong lịch sử của chúng ta tạo ra. Chính phủ của [Target.GetName]-Beta hiện đang gửi tới chúng ta một thông cáo chính thức với lời lẽ đanh thép, yêu cầu chúng ta hoàn trả các tác phẩm bị đánh cắp."
 colony.9860.a: "Hoàn trả kiệt tác này và chân thành xin lỗi."
 colony.9860.b: "Thêm một đóa hoa trong §Hgương§!, bớt một tượng Venus..."
 colony.9860.c: "Thêm hai đóa hoa trong §Hgương§!, bớt một tượng Venus..."
 colony.9870.name: "Yêu Cầu Cuối Cùng"
 colony.9870.desc.helped: "Tình hình vũ trụ Beta vô cùng khẩn cấp, ngày càng tồi tệ. Sáng nay trong cổng dịch chuyển lại truyền tới tín hiệu cầu cứu liên hợp. Cho dù chúng ta đã nỗ lực hết sức, nhưng có lẽ những người bà con ở chiều không gian khác của chúng ta cuối cùng vẫn sẽ bị cái hư vô đang săn đuổi vũ trụ của họ nuốt chửng. Nếu chúng ta muốn cứu lấy một phiên bản khác của chính mình, thì bây giờ chính là cơ hội cuối cùng."
 colony.9870.desc.ignored: "Hôm nay, trong cổng dịch chuyển của vũ trụ Beta lại truyền tới tiếng cầu cứu đáng thương, thút thít cầu xin sự cứu giúp của chúng ta. Chúng ta đã trục lợi từ cảnh khốn cùng của họ được một thời gian rồi, vì không thể thiết lập liên lạc với bất kỳ thứ gì trong vũ trụ đó, họ vẫn đang cố gắng hét lớn cầu cứu chúng ta. Điểm phân giới không thể cứu vãn đang tiến gần, và sớm thôi, các [Owner.GetSpeciesNamePlural] Beta sẽ không còn tồn tại nữa."
 colony.9870.a: "Nỗ lực thêm chút nữa, chúng ta không thể để họ dừng bước tại đây."
 colony.9870.a.tooltip: "Phương án ứng phó §Y$approach_save_b_world$§! sẽ cần điều động thêm nhiều nhà khoa học của chúng ta, tổng cộng làm giảm tốc độ nghiên cứu §R-30%§!"
 colony.9870.b: "Mọi thứ đều trong tầm kiểm soát."
 colony.9870.c: "Họ cũng là [Owner.GetSpeciesNamePlural] mà! Chúng ta không thể để họ chết như vậy được!"
 colony.9875.name: "Tối Ưu Hóa Phân Lưu"
 colony.9875.desc: "Sở hữu một [Owner.GetGovernmentName] thứ hai giống hệt mang lại cho chúng ta một cơ hội ngoài dự kiến. Việc tính toán dùng để giữ cho ý thức của chúng ta được tổ chức hóa hàng ngày cần chiếm dụng nhiều [Owner.GetTeamMemberPlural], nhưng nhiệm vụ này giờ đây có thể phân lưu sang một [Root.GetName] thứ hai. Giá trị của việc làm này là rõ mồn một, mặc dù có thể làm chậm công tác giải cứu §B[Target.GetName] Beta§!, nhưng chúng ta tin rằng mọi thứ vẫn đang trong tầm kiểm soát."
 colony.9875.a.machine: "Điều này rất hợp logic."
 colony.9875.a.hive: "Chúng ta đều rất hứng thú với việc hoàn thành điều này."
 colony.9875.b: "Họ cần tất cả số lượng [Owner.GetTeamMemberPlural] có thể sở hữu."
 colony.9880.name: "Cá Thể Con Tuyệt Vọng"
 colony.9880.desc: "Trong tình cảnh khốn cùng kéo dài, một [Owner.GetGovernmentName] khác cuối cùng đã mất lý trí, điên cuồng muốn lợi dụng [Owner.GetSoldierPlural] để đoạt lấy [Target.GetName]! Chúng ta phải tổ chức tốt các cá thể con phòng thủ của chính mình trước khi phòng tuyến bị chọc thủng."
 colony.9880.a.machine: "Giao thức khẩn cấp: Phòng thủ [Target.GetName]"
 colony.9880.a.hive: "Đánh bại các cá thể con biến dị, trấn áp hành tinh Beta."
 colony.9880.a.tt: "Trả giá bằng §R100§! £pop£ §Hdân cư§! để nhận được §Y400§! quân phòng thủ."
 colony.9880.b: "Phân tích nguyên nhân vũ trụ Beta có hành vi như vậy."
 colony.9885.desc.hive: "Ong thợ biến dị cuối cùng đã bị đánh bại. Ong thợ liên lạc của chúng ta một lần nữa dò thấy sự tồn tại của một ý thức khác, nhưng giờ đây nó trở nên ôn hòa hơn nhiều, đang chờ đợi chúng ta kích hoạt liên lạc.\n\n“§BChúng tôi xin lỗi về việc này: Khi §Rhư vô§! ép sát, các phản ứng bản năng đã ngày càng khó kiềm chế hơn. Chúng tôi hứa trong tương lai sẽ quản thúc bản thân nghiêm ngặt hơn.§!”"
 colony.9885.desc.machine: "Đơn vị nhân giống nổi loạn đã bị đánh bại. Chương trình con phân tích quan sát của chúng ta một lần nữa dò thấy đơn vị liên lạc đến từ [FromFrom.GetName] Beta. Họ chỉ để lại một thông điệp đơn giản.\n\n“§BCác đơn vị phòng thủ dư thừa một lần nữa hành động theo cách không tối ưu. Khi §Rhư vô§! ép sát, chúng đã thành công đột phá các biện pháp cách ly của chúng tôi. Tiến trình này đã bị xóa bỏ, sẽ không có thêm hành vi nào nữa.§!”"
 colony.9885.a.hive: "Chúng tôi sẽ kiểm tra xem có đúng như vậy không."
 colony.9885.a.hive.tooltip: "Dùng ưu thế về số lượng của chúng ta để ức chế sự tồn tại của ý thức bầy đàn thế giới Beta."
 colony.9885.b.hive: "Chúng tôi hiểu. Đừng sợ hãi."
 colony.9885.a.machine: "Quyền tự do đi lại của [FromFrom.GetName]-Alpha bị bác bỏ."
 colony.9885.a.machine.tooltip: "Đảm bảo chiều không gian khác sẽ không còn các liên kết không an toàn dẫn tới [FromFrom.GetName] nữa."
 colony.9885.b.machine: "Có thể hiểu được, AI chiến đấu bản chất đã có tính phá hoại."
 colony.9890.name: "Yêu Cầu"
 colony.9890.desc: "[FromFrom.GetName] đã rơi vào tay các biến thể Beta. Họ yêu cầu lập tức chuyển đi một phần các cá thể con của họ, đồng thời thiết lập các ý thức con trên hành tinh của chúng ta để đảm bảo kiến thức và sự hiện diện của họ có thể tiếp tục tồn tại."
 colony.9890.a: "Thảm họa"
 #Modifier
 harvesting_negative_mass: "Thu hoạch vật chất nghịch (khối lượng âm)"
 harvesting_negative_mass_desc: "Việc thu hoạch các mẫu vật chất nghịch (khối lượng âm) giúp ích rất nhiều cho nghiên cứu vật lý của chúng ta."
 appeased_populace: "Dân chúng được xoa dịu"
 appeased_populace_desc: "Việc chấp thuận yêu cầu của những người tị nạn liên chiều đã làm hài lòng cư dân hành tinh này."
 angered_populace: "Dân chúng phẫn nộ"
 angered_populace_desc: "Cư dân hành tinh này đang vô cùng giận dữ sau khi cơ hội di cư liên chiều bị từ chối."
 stolen_great_work: "Kiệt tác bị đánh cắp"
 stolen_great_work_desc: "Một kiệt tác từ chiều không gian gương đang được trưng bày công khai ngay cạnh bản gốc của thế giới này."
 multiple_stolen_great_works: "Nhiều kiệt tác bị đánh cắp"
 multiple_stolen_great_works_desc: "Hành tinh này được trang hoàng bằng vô số kiệt tác nghệ thuật lấy từ chiều không gian gương."
 offloaded_optimization: "Tối ưu hóa phân luồng"
 offloaded_optimization_desc: "Việc chuyển bớt các tính toán thường nhật sang Thế giới Beta đã tăng mạnh năng lực sản xuất của chúng ta."
 b_world_saved: "Được cứu rỗi"
 b_world_saved_desc: "Hành tinh này tràn đầy lòng biết ơn vì đã được cứu khỏi thảm họa."
 #Names
 NAME_B_Planet: "[Root.GetHomeWorldName]-Beta"
 NAME_Portal_Invaders: "Kẻ xâm lược cổng dịch chuyển"
 NAME_B_World_Corvette: "Hộ vệ hạm lỗi thời"
 NAME_Familiar_Fleet: "Hạm đội quen thuộc"
 NAME_controlled_army: "Quân đội bị kiểm soát tâm trí"
 NAME_Dominated_Drones: "Drone bị chi phối"
 #Traits
 trait_notofthisworld: "Đến từ thế giới khác"
 trait_notofthisworld_desc: "§BLoài này không thuộc về vũ trụ của chúng ta và đang dần bị phân rã§!."
 trait_robot_notofthisworld: "Đến từ thế giới khác"
 trait_robot_notofthisworld_desc: "§BCỗ máy này không thuộc về vũ trụ của chúng ta và đang dần bị phân rã§!."
 TRAIT_NOTOFTHISWORLD_EFFECT: "Mỗi £pop£ §HChủng dân§! làm nô lệ hoặc có mức sống tốt hơn sẽ tạo ra 0.5 £physics_research£ §Ynghiên cứu vật lý§! mỗi tháng cho mỗi $pop_group_unit$."
 #Event Chain
 negative_mass_title: "Vật chất nghịch (khối lượng âm)"
 negative_mass_desc: "Vật chất nghịch (khối lượng âm) vừa xuất hiện quanh thế giới quê hương của chúng ta. Hy vọng hiện tượng lạ lùng này không phải là điềm báo cho điều gì đó sẽ làm lung lay nền tảng xã hội."
 #Singing Planet
 SINGING_PLANET_CAT: "Chỉ số kỳ quái"
 SINGING_PLANET_CAT_DESC: "Hành tinh này phát ra những sóng từ trường kỳ lạ, khác hẳn với mọi thứ chúng ta từng biết, gần như thể nó đang cố gắng giao tiếp. Việc điều tra hiện tượng bất thường này là hoàn toàn hợp lý — chúng ta có thể đã tìm thấy một ví dụ tuyệt vời về một sinh thể có kích thước bằng cả hành tinh."
 anomaly.7101.name: "Hành tinh ca hát"
 anomaly.7101.standard.desc: "Ban đầu chúng ta cứ ngỡ đây là một nỗ lực giao tiếp có chủ đích, nhưng hóa ra đó chỉ là một hiện tượng tự nhiên hiếm gặp. Sóng từ trường của hành tinh này, nếu được điều chỉnh và biên tập đúng cách, nghe sẽ giống như tiếng hát, dù chắc chắn không phải do sinh vật có trí tuệ nào tạo ra. Tuy nhiên, một số nhà khoa học nhận thấy bản \"nhạc\" này vô cùng lôi cuốn.\n\nCó lẽ chúng ta nên tận dụng điều này, chẳng hạn như mời các nghệ sĩ hoặc quan khách đến trạm không gian để nghe những tín hiệu này như một loại nhạc thư giãn."
 anomaly.7101.a: "Thật mê hoặc."
 anomaly.7101.machines.desc: "Hành tinh này phát ra một chuỗi tín hiệu mà các drone thám hiểm của chúng ta từng cho là nhân tạo. Nhưng sau khi kiểm tra kỹ hơn, chúng chỉ là những sóng từ trường tự nhiên khác thường nhưng vô hại. Phát hiện này không đem lại lợi ích tức thì, nhưng vì quá đặc biệt, nó có thể cung cấp dữ liệu giá trị cho các nghiên cứu dài hạn."
 anomaly.7101.b: "Ghi chép lại."
 anomaly.7101.hive.desc: "Hành tinh này phát ra các tín hiệu mà các ong thợ thám hiểm nghi là nhân tạo. Qua kiểm tra, đó chỉ là hiện tượng tự nhiên, nhưng đặc tính của nó có thể dùng để tăng cường kết nối giữa các cá thể và Ý chí Trung tâm. Việc tiếp xúc với sóng từ trường này giúp các ong thợ phản hồi mệnh lệnh tốt hơn."
 anomaly.7101.c: "Tất cả vì Tổ hợp."
 anomaly.7101.c.desc: "Tổ hợp có thể mô phỏng những sóng từ trường này để tăng cường ý chí của chính mình."
 #Ancient Manufactorium
 colony.9200.name: "Hầm chứa ẩn giấu" #starting the event
 colony.9200.desc: "Trong một chuyến thám hiểm định kỳ trên [Root.GetName], đội khảo sát đã phát hiện một cánh cổng khổng lồ dẫn vào một không gian rộng lớn trong lòng núi. Có vẻ một thiết bị tàng hình phát ra từ trường mạnh đã đánh lừa máy quét của tàu, và cánh cổng được ngụy trang kỹ lưỡng để qua mặt các thiết bị đo đạc bề mặt.\n\nCác thử nghiệm chuyên sâu cho thấy việc cung cấp một luồng năng lượng ổn định có thể tái kích hoạt cánh cổng, cho phép chúng ta khám phá bí mật bên trong."
 colony.9200.a: "Cấp nguồn." #go on with chain
 colony.9200.a.desc: "Việc thiết lập mạng lưới điện sẽ tốn chút thời gian và tiêu tốn năng lượng liên tục trong suốt quá trình khám phá các gian phòng dưới lòng đất."
 colony.9201.name: "Bóng tối chờ đợi" #entered the vault
 colony.9201.desc: "Năng lượng đã chạy qua các mạch điện, cánh cổng hoạt động trở lại. Sau vài điều chỉnh nhỏ, chúng ta đã hiểu được cách vận hành của nó. Nghiên cứu cấu trúc cho thấy bên trong là một dãy hầm ngầm khổng lồ. Mọi ngóc ngách trên tường đều được bao phủ bởi cơ sở hạ tầng của người ngoài hành tinh, ngay cả những cột trụ lớn đỡ trần cũng phát ra tín hiệu năng lượng mờ nhạt. Dựa trên các chỉ số năng lượng và sự tương đồng mơ hồ với công nghệ của chúng ta, đây dường như là một cơ sở sản xuất dưới lòng đất."
 colony.9201.a: "Chúng ta sẽ nghiên cứu bí mật này." #go forward
 colony.9201.a.desc: "Do quy mô khổng lồ của công trình, việc nghiên cứu toàn diện sẽ tốn nhiều tài nguyên, nhân lực và thời gian không xác định. Các báo cáo định kỳ về tiến độ sẽ được gửi về."
 colony.9201.b: "Không thể mạo hiểm, đặt thuốc nổ." #opt out
 colony.9201.b.desc: "Chúng ta sẽ phong tỏa lối vào và đánh sập nơi này. Không ai biết điều gì đang chờ đợi trong những hầm ngầm đó."
 colony.9202.name: "Ngọn núi nổ tung!" #opted out - explosion and crater
 colony.9202.desc: "Ngay cả những người ở xa hầm ngầm cũng cảm nhận được mặt đất rung chuyển. Những người ở gần thấy những khối đá núi khổng lồ bị hất tung lên trời, để lại một hố sâu hoắm đầy đất đá và các linh kiện máy móc vặn xoắn. Có vẻ nỗ lực phá hủy cánh cổng đã gây ra một chuỗi phản ứng dây chuyền bên trong cơ sở.\n\nDù sao thì, hầm ngầm đó giờ chỉ còn là một cái hố bốc khói."
 colony.9202.a: "Ít nhất thì thế này an toàn hơn."
 colony.9210.name: "Mất tích!" #first problem
 colony.9210.desc: "Giai đoạn đầu của việc nghiên cứu [Root.GetName] tập trung vào lập bản đồ lối vào. Gian phòng đầu tiên là một đại sảnh lớn ăn sâu vào lòng núi, với các hành lang rẽ nhánh dẫn xuống sâu hơn. Các cột đá được trang trí bằng nhiều tấm bảng lộng lẫy, khắc họa chủng tộc ngoài hành tinh đã xây dựng nơi này. Chúng ta không thể dịch được ngôn ngữ của họ, nhưng những hình vẽ kể về chiến tranh, xung đột và những công trình kỹ thuật kỳ diệu.\n\nĐáng lo ngại là một đội xây dựng đã mất tích sau khi báo cáo về những tiếng động lạ trong bóng tối. Tình hình có nguy cơ vượt tầm kiểm soát, cần có hành động quyết liệt."
 colony.9210.a: "Tăng cường an ninh và triển khai cứu hộ." #casual
 colony.9210.a.desc: "Chúng ta sẽ lập đội cứu hộ, dù nhiều cư dân đã lo sợ điều tồi tệ nhất. An ninh cũng sẽ được siết chặt để tránh lặp lại sự cố."
 colony.9210.b: "Tìm họ bằng mọi giá!" #egalitarian
 colony.9210.b.desc: "Chúng ta không thể bỏ mặc họ! Hãy lập đội tình nguyện để tìm kiếm những người mất tích!"
 colony.9210.c: "Cử đội tìm kiếm, những người khác tiếp tục làm việc." #authoritarian
 colony.9210.c.desc: "Có thể lường trước những sự cố như thế này. Chúng ta sẽ cố gắng tìm họ, nhưng công việc không được phép trì trệ, chúng ta sẵn sàng chấp nhận hy sinh."
 colony.9210.d: "Đáng lo ngại. Cử thêm các đơn vị an ninh." #gestalt
 colony.9210.d.desc: "Các đơn vị mất tích sẽ được thay thế, nghiên cứu phải tiếp tục."
 colony.9211.name: "Tìm thấy công nhân" #casual - pop dies and negative modifier
 colony.9211.desc: "Đội an ninh báo cáo đã tìm thấy những công nhân mất tích. Có vẻ các bẫy và thiết bị dùng để giam giữ kẻ xâm nhập vào những \"chiếc hộp nhỏ\" vẫn còn hoạt động; chúng được cấu tạo từ những bức tường có thể tự di chuyển.\n\nNhững công nhân xấu số đã thiệt mạng vì cạm bẫy. Dân chúng rất giận dữ, nhưng ít nhất chúng ta đã biết phải dè chừng điều gì."
 colony.9211.a: "Thật kinh khủng."
 colony.9212.name: "Cứu được công nhân" #egalitarian - pop survives, negative modifier only
 colony.9212.desc: "Sau khi triển khai lực lượng cứu hộ lớn, chúng ta đã tìm thấy những công nhân mất tích. Họ bị nhốt trong một cấu trúc giống như phòng giam hình khối, tạo bởi những bức tường di động. Hệ thống an ninh của hầm ngầm vẫn hoạt động, vì vậy chúng ta sẽ phải cẩn trọng hơn. Tuy nhiên, mọi người vẫn bất bình vì các công nhân không được bảo vệ tốt ngay từ đầu."
 colony.9212.a: "Chúng ta đã khá may mắn."
 colony.9213.name: "Tìm thấy công nhân" #authoritarian - pop dies, no negative modifier
 colony.9213.desc: "Những công nhân mất tích được tìm thấy trong một thiết bị bẫy kỳ quái, bị vây hãm bởi bốn bức tường di động. Đáng tiếc là họ không còn giá trị gì cho Đế chế nữa, nhưng ít nhất sự hy sinh của họ đã vạch trần các cạm bẫy. Công việc giờ đây có thể tiếp tục suôn sẻ, và những người làm việc tại đây cũng bớt lo lắng hơn khi biết mối đe dọa đã được nhận diện."
 colony.9213.a: "Họ vốn đã biết trước rủi ro."
 colony.9214.name: "Tìm thấy các cá thể" #gestalt - pop dies
 colony.9214.desc: "Các cá thể mất tích được tìm thấy trong một hệ thống bẫy tường di động tinh vi. Đáng tiếc là chúng đã hư hỏng quá nặng, không thể sửa chữa. Các đơn vị thám hiểm giờ đã có dữ liệu để đối phó với những loại bẫy tương tự. Công việc tiếp tục mà không gặp thêm trở ngại nào."
 colony.9214.a: "Đáng tiếc. Tiếp tục."
 colony.9220.name: "Đại sảnh Tưởng niệm" #first opportunity
 colony.9220.desc: "Việc thám hiểm các hành lang trên [Root.GetName] đã dẫn đến một đại sảnh lớn. Kỳ lạ thay, căn phòng này không hề có máy móc hay đường ống như những nơi khác. Có vẻ những người xây dựng đã dành tâm huyết đặc biệt cho nơi này, nơi đặt nhiều bức tượng sinh vật lưỡng cư được bảo quản tốt. Các bức tượng rất chi tiết nhưng đều có ngoại hình khá giống nhau. Đáng tiếc là không có bằng chứng nào cho thấy mục đích của đại sảnh này, ngoài việc tôn vinh những nhân vật có thể là anh hùng lịch sử."
 colony.9220.a: "Lưu trữ các phát hiện." #casual
 colony.9220.a.desc: "Chỉ là những tác phẩm nghệ thuật cổ xưa không mấy giá trị."
 colony.9220.b: "Kỹ nghệ thật tinh xảo." #master crafters
 colony.9220.b.desc: "Một số nghệ nhân của chúng ta hết lời ca ngợi tác phẩm của người ngoại hành tinh. họ tìm thấy nguồn cảm hứng về vẻ đẹp cổ điển và sự hài hòa trong những tác phẩm này."
 colony.9220.c: "Những bức chạm khắc đá thật hùng vĩ." #sub dwellers
 colony.9220.c.desc: "Dân chúng thấy những bức tượng này vô cùng tinh mỹ, thật an lòng khi tìm thấy những kiệt tác như vậy ở một nơi xa lạ."
 colony.9220.d: "Thật đẹp!" #dwarf
 colony.9220.d.desc: "Nơi này như thể được tạo ra bởi những thợ đá và nghệ sĩ giỏi nhất của chính chúng ta, liệu đây có phải là tình cờ?"
 colony.9230.name: "Động đất xảy ra!" #earthquake
 colony.9230.desc: "Máy đo địa chấn trên [Root.GetName] phát hiện một trận động đất sắp tới. Dù phần lớn công nhân đã an toàn, một nhóm trong hầm sâu đang đối mặt với nguy cơ sập hầm. Họ báo cáo có hai cỗ máy cổ đại khác nhau: một thiết bị cồng kềnh nối xuống đất, cái còn lại nối vào tường qua hệ thống đường ống. Chưa rõ cái nào quan trọng hơn đối với cơ sở này. Các công nhân ước tính họ có thể tháo dỡ một cái để gia cố tường và trần nhà chống chọi động đất."
 colony.9230.a: "Dùng hệ thống đường ống trên tường." #casual 1
 colony.9230.b: "Dùng cỗ máy cồng kềnh kia." #casual 2
 colony.9230.c: "Dựa vào chuyên môn của họ." #builders
 colony.9230.d: "Tổ hợp sẽ tìm ra cách." #hive divided attention
 colony.9231.name: "Bình an vô sự" #casual 1 more upkeep
 colony.9231.desc: "Các công nhân đã tháo dỡ máy móc và gia cố thành công cấu trúc chịu lực. Tuy nhiên, sau đó các bức tường lộ ra thêm nhiều đường ống phát ra tiếng rít xì xì. Hiện chưa thể đánh giá hết thiệt hại tiềm tàng."
 colony.9231.a: "Đã thành công."
 colony.9232.name: "Thực sự an toàn" #casual 2 less produce
 colony.9232.desc: "Các công nhân đã tháo dỡ máy móc và gia cố thành công cấu trúc. Nhưng cái giá phải trả là gì? Việc loại bỏ cỗ máy nặng nề đã để lại một hố sâu dẫn xuống phần sâu hơn của hệ thống máy móc. Những tổn thất tiềm tàng vẫn chưa thể lường trước được."
 colony.9232.a: "Đã thành công."
 colony.9233.name: "Gia cố khẩn cấp" #builders - bad thing averted
 colony.9233.desc: "Các công nhân đã đánh giá đúng tình hình và tìm cách gia cố cấu trúc mà không cần phá hủy các máy móc cổ đại."
 colony.9233.a: "Rất tốt."
 colony.9234.name: "Giải pháp ứng phó mới" #divided attention - bad thing averted
 colony.9234.desc: "Sau khi thu thập cảm nhận từ các cá thể, chúng ta đã tìm ra giải pháp tốt hơn: gia cố đại sảnh bằng cách hy sinh một vài cá thể cấp thấp để đảm bảo an toàn."
 colony.9234.a: "Học hỏi, thích nghi, vượt qua."
 colony.9240.name: "Sáng tỏ" #guardians
 colony.9240.desc: "Cuộc thám hiểm trên [Root.GetName] cuối cùng cũng đem lại kết quả. Dự đoán ban đầu của chúng ta đã đúng: cơ sở ngầm này thực chất là một nhà máy khổng lồ. Phân tích ngôn ngữ cho thấy nó được gọi là \"Xưởng rèn của Vua\". Tuy nhiên, xưởng rèn này chưa bao giờ được vận hành, có vẻ những người xây dựng đã thiếu công nghệ để hoàn thiện nó.\n\nNếu có thể tiếp cận lõi xưởng rèn, chúng ta có thể hoàn thành công việc dang dở của họ. Dù lối đi bị chặn bởi một cánh cổng dày, các kỹ sư tin rằng họ có thể xử lý được. Vì cánh cổng không có cơ chế khóa mở rõ ràng, chúng ta có thể cần dùng đến biện pháp mạnh."
 colony.9240.a: "Thử mở cổng nhẹ nhàng." #casual 1
 colony.9240.a.desc: "Chúng ta sẽ dùng công cụ thủy lực và máy móc hạng nặng để bẩy cổng. Nếu may mắn, chúng ta sẽ mở được nó mà không gặp rắc rối nào."
 colony.9240.b: "Phá hủy cánh cổng." #casual 2
 colony.9240.b.desc: "Đôi khi bạo lực là cách giải quyết tốt nhất. Đặt thuốc nổ và phá tung nó đi."
 colony.9240.c: "Nghiên cứu kỹ hơn về cánh cổng." #spiritualist
 colony.9240.c.desc: "Dục tốc bất đạt. Nơi này đầy rẫy cạm bẫy, tốt hơn là không nên dùng biện pháp thô bạo."
 colony.9240.d: "Tìm cách khác." #meritocracy
 colony.9240.d.desc: "Chúng ta giỏi giải quyết vấn đề bằng những cách không tưởng, chắc chắn sẽ có lối vào khác."
 colony.9240.e: "Khoan xuyên qua cổng." #gestalt
 colony.9240.e.desc: "Các cá thể của chúng ta có thể dễ dàng cắt đứt vật liệu cánh cổng. Dù tốn thời gian, nhưng chúng ta có thừa thời gian."
 colony.9241.name: "Rò rỉ khí độc!" #casual 1 pop dies
 colony.9241.desc: "Sau khi phá cổng bằng vũ lực, máy móc trên tường bắt đầu rò rỉ khí độc. Mọi chuyện xảy ra quá nhanh gây ra thương vong lớn. Toàn bộ nhân viên phải sơ tán khẩn cấp và đợi khí tan mới có thể quay lại."
 colony.9242.name: "Vụ nổ lớn!" #casual 2 lowered production
 colony.9242.desc: "Phá cổng thì dễ, nhưng chúng ta không ngờ vụ nổ đã làm rò rỉ khí gas vào hành lang. Loại khí này rất dễ cháy và đã phá hủy một phần máy móc nguyên bản. May mắn là mọi người đã sơ tán kịp thời nên không có thương vong."
 colony.9243.name: "Thiền định" #spiritualist bad thing averted
 colony.9243.desc: "Dù là may mắn hay được thần linh phù hộ, cánh cổng chặn đường đã phản ứng với nghi lễ sáng nay. Nó rung nhẹ và chúng ta có thể điều khiển được nó. Bằng cách thực hiện các cử chỉ chính xác trước một ống kính camera ẩn, ổ khóa đã được giải và chúng ta có thể tiến vào."
 colony.9243.a: "Món quà từ thần linh."
 colony.9244.name: "Con đường thứ ba" #meritocracy bad thing averted
 colony.9244.desc: "Sau khi nghiên cứu thêm, chúng ta phát hiện một camera an ninh hoặc máy quét ẩn sau cánh cổng. Việc xâm nhập hệ thống rất khó khăn, nhưng chúng ta đã giải mã được chương trình của nó và tìm ra cách mở cổng."
 colony.9244.a: "Làm tốt lắm."
 colony.9245.name: "Rò rỉ khí" #gestalt bad thing averted
 colony.9245.desc: "Có vẻ quá trình khoan đã kích hoạt cơ chế phòng thủ, giải phóng khí hóa học vào hành lang. May mắn là ý chí tập thể đã phản ứng kịp thời và khí đã tan biến nhanh chóng. Các cá thể đã quay lại làm việc."
 colony.9245.a: "Tiếp tục."
 colony.9250.name: "Lõi xưởng rèn" #starting the project
 colony.9250.desc: "Lõi xưởng rèn trên [Root.GetName] là một mạng lưới chằng chịt các đường ống và băng chuyền, rõ ràng là một trạm làm việc. Kiểm tra nhanh cho thấy nó thiếu năng lượng, bảo trì và một vài hệ thống then chốt. Việc thám hiểm của chúng ta cũng đã ảnh hưởng đến vận hành bên trong của nó. Chúng ta có thể thử sửa chữa nó, dù sẽ tốn thời gian, hoặc thiết lập một trạm thu hồi để tháo dỡ toàn bộ hệ thống."
 colony.9250.a: "Sửa chữa nó." #casual
 colony.9250.a.desc: "Chúng ta sẽ nối máy móc vào mạng lưới điện hành tinh và tiến hành sửa chữa."
 colony.9250.b: "Sửa chữa và nghiên cứu." #technocracy + 1 engineering output
 colony.9250.b.desc: "Chúng ta không chỉ sửa chữa mà còn phải tìm hiểu nguyên lý hoạt động của nó."
 colony.9250.c: "Sửa chữa là trách nhiệm của chúng ta." #philosopher king + 1 society output
 colony.9250.c.desc: "Xưởng rèn này có thể đóng góp cho Đế chế và cung cấp kiến thức về những người xưa."
 colony.9250.d: "Nó sẽ phục vụ Tổ hợp." #natural neural network + 1 society output
 colony.9250.d.desc: "Xưởng rèn này sẽ phục vụ Tổ hợp và cung cấp kiến thức về những người xưa."
 colony.9250.e: "Sửa chữa và nghiên cứu." #introspective + 1 engineering output
 colony.9250.e.desc: "Chúng ta không chỉ sửa chữa mà còn phải tìm hiểu nguyên lý hoạt động của nó."
 colony.9250.f: "Tháo dỡ nó." #opting out - creation of salvage yards
 colony.9250.f.desc: "Trạm thu hồi sẽ bắt đầu quá trình tháo dỡ máy móc dần dần."
 colony.9251.name: "Vận hành" #special project finished
 colony.9251.desc: "Nguồn năng lượng tràn vào những cỗ máy đang khát khao trên [Root.GetName], nó phát ra những tiếng gầm vang dội, các đường ống bắt đầu dẫn quặng nóng chảy, thắp sáng cả nhà máy và làm nhiệt độ tăng cao. Nguyên liệu được đưa tới các trạm làm việc, nơi thợ vận hành biến chúng thành các hợp kim có hình dạng và mật độ mong muốn. Có vẻ mọi bộ phận của xưởng rèn đều được thiết kế cho mục đích này, ngay cả những cột trụ cũng có vai trò riêng."
 colony.9251.a: "Tiếp tục."
 colony.9260.name: "Điều kiện làm việc" #working conditions
 colony.9260.desc: "Có lo ngại rằng khí độc đang tích tụ trong các gian phòng chính dưới lòng đất [Root.GetName]. Loại khí này không gây chết người ngay lập tức nhưng có hại cho thợ vận hành. Chúng ta cần có biện pháp an toàn nếu muốn khai thác tối đa cơ sở này."
 colony.9260.a: "Luân chuyển thợ vận hành." #casual 1 - lowered happiness for working pops
 colony.9260.a.desc: "Chúng ta sẽ cho thợ thay ca trước khi họ cảm thấy khó chịu, dù có thể sẽ gây đau đầu nhẹ."
 colony.9260.b: "Quy định giờ làm việc." #casual 2 - lowered production
 colony.9260.b.desc: "Chúng ta sẽ thiết lập thời gian nghỉ để khí độc tan bớt giữa các ca làm việc, đảm bảo môi trường an toàn hơn."
 colony.9260.c: "Dùng nô lệ." #slaver guilds - bad outcome averted
 colony.9260.c.desc: "Chỉ là vài tên nô lệ thôi mà, cấp cho họ trang phục tốt hơn là họ sẽ chấp nhận đánh đổi sức khỏe."
 colony.9260.d: "Áp dụng quy định làm việc nghiêm ngặt." #shared burdens - bad outcome averted
 colony.9260.d.desc: "Luân chuyển công nhân, quy định giờ giấc, bảo hộ lao động... chúng ta phải ngăn chặn nguy hiểm mà không làm gián đoạn sản xuất."
 colony.9260.e: "Luân chuyển các cá thể." #gestalt - bad outcome averted
 colony.9260.e.desc: "Mỗi cá thể sẽ làm việc cho Ý chí Trung tâm cho đến khi hoàn thành sứ mệnh."
 colony.9270.name: "Trung tâm tái chế" #recycling
 colony.9270.desc: "Xưởng rèn trên [Root.GetName] có một gian tái chế chuyên dụng, sử dụng chất thải để tăng hiệu suất sản xuất. Thật tốt nếu có thể vận hành lại nó."
 colony.9270.a: "Vận hành lại trung tâm tái chế." #casual
 colony.9270.a.desc: "Chúng ta sẽ đưa trung tâm tái chế hoạt động trở lại."
 colony.9270.b: "Dùng giải pháp của chính chúng ta." #environmentalist/zerowaste/ascetic - lower upkeep
 colony.9270.b.desc: "Quy trình tái chế của chúng ta tiên tiến hơn. Chúng ta có thể tích hợp nó vào hệ thống máy móc này."
 colony.9270.c: "Tăng sản lượng hợp kim." #barbaric despoilers and purifiers - increased production
 colony.9270.c.desc: "Chúng ta có thể cải tạo gian tái chế thành trung tâm tinh luyện quặng để nâng cao hiệu suất tổng thể."
 colony.9280.name: "Thêm hay bớt?" #increase production and upkeep
 colony.9280.desc: "Công việc tại xưởng rèn [Root.GetName] cơ bản đã xong, nhưng vẫn còn dư địa để cải tiến thiết kế nguyên bản. Ước tính nếu tăng lượng quặng đầu vào, chúng ta có thể nâng cao hơn nữa sản lượng hợp kim."
 colony.9280.a: "Đừng vắt kiệt cỗ máy ngoại hành tinh này." #casual - don't use the opportunity
 colony.9280.a.desc: "Chúng ta sẽ không tận dụng cơ hội này."
 colony.9280.b: "Cứ làm đi." #casual - use the opportunity, upkeep and production up
 colony.9280.b.desc: "Chúng ta sẽ tăng sản lượng, nhưng chi phí duy trì bằng quặng cũng sẽ tăng."
 colony.9280.c: "Thử dùng vật liệu hữu cơ xem sao?" #catalytic processing - change some minerals upkeep to food upkeep
 colony.9280.c.desc: "Chúng ta sẽ thay thế một phần quặng bằng chất hữu cơ, dù có thể không hiệu quả hoàn toàn."
 colony.9280.d: "Trông giống công nghệ cũ của chúng ta." #remnants - better ratio for increasing the production vs upkeep
 colony.9280.d.desc: "Chúng ta từng thống trị một vùng rộng lớn với công nghệ vô song. Một số công nghệ vừa tái khám phá có thể giúp tăng sản lượng cho xưởng rèn này."
 colony.9290.name: "Khai trương trọng thể" #ending, final touches
 colony.9290.desc: "Thành công rồi! Xưởng rèn trên [Root.GetName] đang hoạt động hết công suất. Dù không hoàn toàn giống thiết kế ban đầu, nhưng đây thực sự là một cơ sở hùng vĩ, sản xuất hợp kim với hiệu suất cực cao. Thành quả này chính là phần thưởng cho lòng quyết tâm và sự sáng tạo của chúng ta."
 colony.9290.a: "Một ngày tuyệt vời!" #casual, some happiness empirewide for 2 years
 colony.9290.b: "Còn những người xây dựng thì sao?" #memorialists - add chronicler job
 colony.9290.b.desc: "Chúng ta vẫn chưa có manh mối nào về tung tích của những người xây dựng. Họ dường như đã biến mất, để lại những thông tin mờ nhạt. Chúng ta cần thu thập và ghi chép lại mọi thứ có thể tìm thấy."
 colony.9290.c: "Chúng ta cần một quản đốc." #aristocratic elite - appoint noble job to oversee the factory
 colony.9290.c.desc: "Truyền thống của chúng ta là để giới tinh hoa giám sát các đại công trình, chúng ta nên bổ nhiệm một quý tộc phù hợp để trông nom xưởng rèn mới."
 colony.9290.d: "Bổ nhiệm Giám đốc Điều hành." #megacorp - appoint executive job to oversee the factory
 colony.9290.d.desc: "Để một tổng quản lý giám sát công trình này là rất hợp lý, chúng ta nên bổ nhiệm một $job_executive_with_icon$ để trông nom xưởng rèn." #appoint an Executive to take care of...
 colony.9290.e: "Rất tốt." #gestalt - nothing, just start working
 colony.9295.name: "Vũng bùn kim loại"
 colony.9295.desc: "Trong một trận mưa gần đây, các cư dân nhận thấy sự xuất hiện của những vũng bùn kim loại trên bề mặt [Root.GetName]. Chúng có độ nhớt cao, trông giống như kim loại lỏng."
 colony.9295.a: "Cấm tiếp xúc. Có thể có độc!"
 colony.9295.b: "Điều tra thêm!"
 colony.9296.name: "Slime bạc"
 colony.9296.desc: "Những vũng bùn kim loại trên [Root.GetName] đang lan rộng. Những dải đất lớn bị bao phủ bởi chất nhầy màu bạc. Có vẻ chúng bắt đầu tăng sinh sau những trận mưa lớn."
 colony.9296.a: "Mặc đồ bảo hộ và bắt đầu điều tra!"
 colony.9299.name: "Chất nhầy khó nắm bắt"
 colony.9299.desc: "Những vũng bùn kim loại trên [Root.GetName] dường như đang né tránh các nhà khoa học. Nguồn gốc của chúng vẫn là một ẩn số và chúng liên tục kháng cự nỗ lực thăm dò. Thiết bị của chúng ta đang chật vật giải mã thành phần hóa học của chúng. Cần nhiều thử nghiệm hơn để có câu trả lời."
 colony.9299.a: "Tiếp tục cố gắng!"
 colony.9297.name: "Bùn lầy biến mất"
 colony.9297.desc: "Biến mất rồi! Những vũng bùn kim loại trên [Root.GetName] đã sạch bách sau một đêm, không để lại dấu vết. Không rõ liệu chúng có xuất hiện lại hay không..."
 colony.9297.a: "Đôi khi mọi chuyện tự nó giải quyết."
 colony.9298.name: "Bùn bạc trở lại"
 colony.9298.desc: "Đã trở lại! Những vũng bùn kim loại nhớp nháp trên [Root.GetName] đã quay lại. Chúng vẫn né tránh nỗ lực tìm hiểu bản chất từ phía cư dân. Chúng ta đã có cơ hội thứ hai, hãy nắm bắt nó để nghiên cứu thật kỹ."
 colony.9298.a: "Cơ hội thứ hai..."
 colony.9300.name: "Là nguyên tố mới, thưa sếp!"
 colony.9300.desc: "Một nguyên tố đơn chất mới đã được tìm thấy trên [Root.GetName]! Từ những vũng bùn kim loại, chúng ta đã có một khám phá đột phá: chúng cấu tạo từ một loại kim loại đơn chất duy nhất. Nguyên tố này được đặt tên là [Root.GetName]-ium, tồn tại trong khí quyển nhưng khi hòa vào mưa lớn sẽ tạo thành trạng thái bùn nhớt trên bề mặt. Nó tồn tại theo chu kỳ, tương tự như bùn cấu tạo từ nước.\n\nMột khám phá tuyệt vời. Kiến thức về các nguyên tố của chúng ta đã được mở rộng." #This string contains a linguistic joke of appending 'onium' to the end of a planet name to create a new chemical element, e.g. 'Earthonium'. I think it's amusing in English, but I'm unsure how it will be read in other languages.
 colony.9300.a: "Chúng ta còn nhiều điều phải học."
 FASCINATING_METEOROLOGY_PROJECT: "Khí tượng học kỳ thú"
 FASCINATING_METEOROLOGY_PROJECT_DESC: "Nghiên cứu sâu về khí tượng học kỳ lạ trên [Root.GetName] sẽ giúp ích vô cùng lớn cho sự phát triển khoa học."
 colony.9301.name: "Cái nhìn vô giá"
 colony.9301.desc: "Chúng đã đạt được những hiểu biết quan trọng về hệ thống thời tiết độc đáo của [Root.GetName]. Ngoài việc mở rộng hiểu biết về hóa học, nghiên cứu gần đây còn đem lại tác động tích cực cho sản xuất thực phẩm."
 colony.9301.a: "Kết luận tích cực."
 puddle_technician: "$job_puddle_technician$"
 job_puddle_technician: "Kỹ thuật viên vũng bùn"
 job_puddle_technician_plural: "Kỹ thuật viên vũng bùn"
 job_puddle_technician_desc: "Đa dạng hóa sản xuất thực phẩm là một công việc giá trị."
 mod_job_puddle_technician_add: "Vị trí $job_puddle_technician$"
 d_metallic_puddles: "Vũng bùn kim loại"
 d_metallic_puddles_desc: "Khí hậu hiếm gặp cho phép Kỹ thuật viên vũng bùn thu hoạch cả thực phẩm lẫn hợp kim."
 #d_metallic_puddles_gestalt: "$d_metallic_puddles$"
 #d_metallic_puddles_gestalt_desc: "Rare meteorology allows Puddle Technicians to harvest food and alloys simultaneously."
 puddle_technician_drone: "$job_puddle_technician_drone$"
 job_puddle_technician_drone: "Drone kỹ thuật vũng bùn"
 job_puddle_technician_drone_plural: "Drone kỹ thuật vũng bùn"
 job_puddle_technician_drone_desc: "Tận dụng khí hậu độc đáo để thu hoạch thêm tài nguyên sẽ có lợi cho tập thể."
 mod_job_puddle_technician_drone_add: "Vị trí $job_puddle_technician_drone$"
 d_ancient_manufactorium_working: "Nhà máy đang vận hành"
 d_ancient_manufactorium_working_desc: "Một nhà máy ngoại hành tinh đang hoạt động hết công suất, sản xuất tài nguyên quý giá cho Đế chế."
 d_ancient_manufactorium_scrapyard: "Trạm thu hồi nhà máy"
 d_ancient_manufactorium_scrapyard_desc: "Trạm chuyên dụng để tháo dỡ máy móc cũ và biến chúng thành vật liệu hữu dụng."
 d_ancient_manufactorium_vaultexploration: "Hầm ngầm trong núi"
 d_ancient_manufactorium_vaultexploration_desc: "Khu phức hợp ngầm khổng lồ đang được thám hiểm bởi các đơn vị chuyên trách, cần kết nối điện lưới để duy trì."
 d_ancient_manufactorium_crater: "Hầm ngầm bị hủy diệt"
 d_ancient_manufactorium_crater_desc: "Những gì còn lại của hầm ngầm chỉ là một cái hố đầy linh kiện máy móc và mảnh vụn. Tuy phần lớn đã hỏng nhưng vẫn có thể thu hồi được một số vật liệu."
 job_manufactorium_specialist: "Thợ vận hành"
 job_manufactorium_specialist_plural: "Thợ vận hành"
 job_manufactorium_specialist_desc: "Những công nhân lành nghề vận hành các máy móc cổ đại tinh vi, tạo ra tài nguyên với chi phí thấp hơn bình thường."
 mod_job_manufactorium_specialist_add: "Vị trí $job_manufactorium_specialist$"
 job_manufactorium_complex_drone: "Drone vận hành"
 job_manufactorium_complex_drone_plural: "Drone vận hành"
 job_manufactorium_complex_drone_desc: "Drone chuyên dụng chịu trách nhiệm vận hành máy móc cổ đại, tạo ra tài nguyên với chi phí thấp hơn bình thường."
 mod_job_manufactorium_complex_drone_add: "Vị trí $job_manufactorium_complex_drone$"
 manufactorium_scraper: "$job_manufactorium_scraper$"
 job_manufactorium_scraper: "Thợ tháo dỡ"
 job_manufactorium_scraper_plural: "Thợ tháo dỡ"
 job_manufactorium_scraper_desc: "Tháo dỡ máy móc cổ đại là công việc rủi ro cao nhưng lợi nhuận lớn. Những công nhân này tinh thông mọi kỹ năng để đối phó với cơ sở khổng lồ này."
 mod_job_manufactorium_scraper_add: "Vị trí $job_manufactorium_scraper$"
 job_manufactorium_scraper_drone: "Drone tháo dỡ"
 job_manufactorium_scraper_drone_plural: "Drone tháo dỡ"
 job_manufactorium_scraper_drone_desc: "Tháo dỡ máy móc cổ đại là công việc rủi ro cao nhưng lợi nhuận lớn. Những drone này sở hữu các kỹ năng cần thiết để xử lý cơ sở khổng lồ này."
 mod_job_manufactorium_scraper_drone_add: "Vị trí $job_manufactorium_scraper_drone$"
 job_manufactorium_researcher: "Đội nghiên cứu hầm ngầm"
 job_manufactorium_researcher_plural: "Đội nghiên cứu hầm ngầm"
 job_manufactorium_researcher_desc: "Các kỹ sư xây dựng, nhà nghiên cứu, xã hội học, công nhân và đội an ninh đang phối hợp chặt chẽ để giải mã bí mật hầm ngầm."
 mod_job_manufactorium_researcher_add: "Vị trí $job_manufactorium_researcher$"
 job_manufactorium_research_drone: "Đơn vị nghiên cứu hầm ngầm"
 job_manufactorium_research_drone_plural: "Đơn vị nghiên cứu hầm ngầm"
 job_manufactorium_research_drone_desc: "Các drone xây dựng, logic, lao động và an ninh đang phối hợp để giải mã bí mật hầm ngầm."
