 #The Adjudicator
 THE_JUDGE_CAT: "Bức xạ tăng vọt"
 THE_JUDGE_CAT_DESC: "Đột nhiên phát hiện một đợt tăng vọt bức xạ ở gần [From.GetName]. Cần phải cẩn trọng hơn khi tiến hành điều tra."
 anomaly.9000.name: "Con tàu bí ẩn"
 anomaly.9000.desc: "Cuộc điều tra của chúng ta tại [From.GetName] hiện đã thu được một số kết quả thú vị. Tâm của tiểu hành tinh này có một khoang rỗng hình cầu hoàn hảo, với những bức tường nhẵn bóng như thể được điêu khắc chính xác đến từng cấp độ nguyên tử. Treo lơ lửng ở chính giữa khoang rỗng là một con tàu nhỏ, nó dường như đang gửi lời chào đến [Root.GetName], và cũng chỉ trò chuyện riêng với [Root.GetLeaderName]."
 anomaly.9000.a: "Chuyển tín hiệu lên màn hình chính"
 anomaly.9001.name: "Quan Thẩm Phán"
 anomaly.9001.desc: "Theo tính toán thống kê, ngươi đã lãng phí 63% tiềm năng của bản thân.\nTrong 47 giây tới, hãy chứng minh cho ta thấy giá trị sự tồn tại của ngươi, bằng không ta sẽ xóa bỏ ngươi khỏi nhân quả."
 anomaly.9001.a: "Ngươi là ai? Ngươi muốn làm gì?"
 anomaly.9001.a.response: "Ta là Quan Thẩm Phán. Mạng sống là món quà quý giá chỉ một số ít nhận được, vậy mà ngươi lại phung phí nó.\n\nCòn lại 38 giây..."
 anomaly.9001.b: "Ngươi nói \"xóa bỏ\" nghĩa là sao?"
 anomaly.9001.b.response: "Ta sẽ nhường vị trí mà ngươi đang chiếm giữ trên dòng thời gian này cho một người khác xứng đáng hơn. Người đó vốn dĩ chưa từng có cơ hội được sống. Còn ngươi sẽ bị lãng quên hoàn toàn, cuộc đời vô giá trị của ngươi sẽ mãi mãi không ai hay biết."
 anomaly.9001.c: "Căn cứ vào đâu mà ngươi ở đây xét xử? Ai cho ngươi cái quyền đó?"
 anomaly.9001.c.response: "Ta dùng hành vi để định dở hay, dùng lựa chọn để quyết đúng sai.\n\nHít thở tốn bao không khí, chiếm dụng bấy nhiêu không gian lẫn băng thông, ngoài việc tạo ra hỗn loạn, ngươi chẳng tạo ra được thêm bất cứ giá trị gì. Đa vũ trụ sẽ không than khóc cho sự mất đi của một thứ tải trọng vô dụng đâu.\n\nCòn lại 0 giây..."
 anomaly.9002.name: "Xung xạ nhiệt"
 anomaly.9002.desc: "Nghiên cứu của chúng ta tại [From.GetName] hiện đã thu được một số kết quả thú vị. Lõi của tiểu hành tinh này chứa các chất phóng xạ, và trong quá trình phân rã chúng phát ra các xung nhịp theo chu kỳ. Dù nhà khoa học [Root.GetLeaderName] có thể không bao giờ hồi phục được sau khi hứng chịu liều bức xạ gamma lớn như vậy, nhưng đợt xung nhịp này hoàn toàn có thể dự đoán được, những nhà nghiên cứu sau này sẽ không gặp nguy hiểm nữa."
 anomaly.9002.a: "Xin lỗi anh nhé, [Root.GetLeaderName]."
