l_simp_chinese:
 #Anomaly Category
 the_lonely_bot_category: "Dấu vết sự sống cổ xưa"
 the_lonely_bot_category_desc: "Có dấu hiệu cho thấy [Root.GetName] từng là quê hương của một nền văn minh cổ đại."
 NANO_SWARM_CAT: "Sa mạc hoang vu"
 NANO_SWARM_CAT_DESC: "[Root.GetName] sở hữu những vùng nước đáng kể, trong khi các lục địa lại là hoang mạc không bóng hành sự sống. Đã cấp phép nghiên cứu sâu hơn."
 STAR_RESONANCE_CAT: "Cộng hưởng kỳ lạ"
 STAR_RESONANCE_DESC: "Các chuyên viên khoa học của chúng ta phát hiện những lỗi cảm biến nghi vấn xuất hiện gần vành nhật hoa của [root.GetName] vẫn tồn tại sau khi khởi động lại hệ thống. Đã phê duyệt nghiên cứu thêm."
 ALPHA_CENTAURI_CAT: "Trạng thái ổn định"
 ALPHA_CENTAURI_CAT_DESC: "Quỹ đạo kỳ lạ của [From.GetName] quanh sao lùn đỏ khiến hành tinh này rơi vào trạng thái khóa thủy triều, rất đáng để khảo sát thêm."
 FROZEN_SPRINGS_CAT: "Nguồn nhiệt bí ẩn"
 FROZEN_SPRINGS_CAT_desc: "Đội ngũ nghiên cứu trong khi khảo sát [From.GetName] đã phát hiện một tín hiệu nhiệt bất thường đến từ bên dưới lớp băng của hành tinh."
 #Deposits
 d_hab_lonely_bot_deposit: "Robot bí ẩn"
 d_hab_lonely_bot_deposit_desc: "Một robot nhỏ cổ xưa và bí ẩn, đang canh giữ một nhà máy có từ thời nền văn minh trước đó."
 d_hab_lonely_bot_deposit_2: "$d_hab_lonely_bot_deposit$"
 d_hab_lonely_bot_deposit_2_desc: "$d_hab_lonely_bot_deposit_desc$"
 d_hab_lonely_bot_deposit_3: "$d_hab_lonely_bot_deposit$"
 d_hab_lonely_bot_deposit_3_desc: "$d_hab_lonely_bot_deposit_desc$"
 d_house_turtle: "Nemma non"
 d_house_turtle_desc: "Một con Nemma trẻ do chúng ta nhân giống, giờ đã đủ lớn để gánh vác một phần cơ sở sản xuất của chúng ta."
 d_turtle_miner: "Khai thác Nemma"
 d_turtle_miner_desc: "Bằng cách cân bằng cẩn thận giữa dược phẩm và thiết bị ức chế cơn đau, chúng ta có thể vừa sinh sống vừa khoan sâu vào cơ thể Nemma."
 d_turtle_corpse: "Xác Nemma"
 d_turtle_corpse_desc: "Xác của một con Nemma khổng lồ từng sống tại đây đang trôi nổi, có thể nhìn rõ ngay cả từ quỹ đạo. Sinh vật lưỡng cư này giờ đây chỉ còn là một hòn đảo nổi."
 d_nano_corpses: "Di hài bầy đàn Nano"
 d_nano_corpses_desc: "Lớp bụi cực mịn để lại bởi bầy đàn Nano khổng lồ từng tiến hóa và bao phủ khắp Parvus III."
 #Jobs
 job_robot_caretaker: "Người chăm sóc Robot"
 job_robot_caretaker_plural: "Người chăm sóc Robot"
 job_robot_caretaker_desc: "Những người phụ trách chăm nom robot đóng vai trò là linh vật của hành tinh này."
 mod_job_robot_caretaker_add: "Nghề $job_robot_caretaker$"
 turtle_miner: "$job_turtle_miner$"
 job_turtle_miner: "Thợ mỏ Nemma"
 job_turtle_miner_plural: "Thợ mỏ Nemma"
 job_turtle_miner_desc: "Sử dụng các mũi khoan công suất lớn, chúng ta có thể khai thác lớp vỏ khoáng vật và nội tạng hữu cơ từ những con Nemma địa phương khổng lồ."
 job_turtle_miner_gestalt: "Cá thể khai thác Nemma"
 job_turtle_miner_gestalt_plural: "Cá thể khai thác Nemma"
 job_turtle_miner_gestalt_desc: "Sử dụng các mũi khoan công suất lớn, các cá thể này khai thác khoáng vật và vật chất hữu cơ trực tiếp từ cơ thể Nemma."
 miner_is_turtle_miner_tt: "Chuyển đổi $job_miner_plural_with_icon$ thành [miner.GetIcon]$job_turtle_miner_plural$"
 mod_job_turtle_miner_add: "Nghề $job_turtle_miner$"
 mod_job_turtle_miner_gestalt_add: "Nghề $job_turtle_miner_gestalt$"
 mod_job_turtle_miner_per_pop: "Mỗi $VALUE$ dân cư cung cấp §G+1§! nghề $job_turtle_miner$"
 mod_job_turtle_miner_per_pop_short: "\nMỗi $VALUE$£pop£§G+1§!£job_turtle_miner£"
 mod_job_turtle_miner_gestalt_per_pop: "Mỗi $VALUE$ dân cư cung cấp §G+1§! nghề $job_turtle_miner_gestalt$"
 mod_job_turtle_miner_gestalt_per_pop_short: "\nMỗi $VALUE$£pop£§G+1§!£job_turtle_miner_gestalt£"
 #Projects
 LONELY_BOT_PROJECT: "Phục hồi nhà máy"
 LONELY_BOT_PROJECT_DESC: "Nhà máy trên [Root.GetName] đã bị bỏ hoang suốt nhiều thế kỷ, tưởng chừng như có thể sụp đổ bất cứ lúc nào. Nó từng đóng vai trò quan trọng khi thuộc địa mới thành lập. Các cư dân yêu cầu chúng ta phục hồi nó về trạng thái ban đầu.\n\nPhần thưởng: £alloys£§G Hợp kim§!"
 LONELY_BOT_MISSING_PROJECT: "Robot mất tích"
 LONELY_BOT_MISSING_PROJECT_DESC: "Robot sống trên hành tinh này gần đây đã biến mất, cùng với nhiều cư dân khác. Các kỹ sư đang cố gắng dò tìm tín hiệu cuối cùng của chúng để truy vết nguồn gốc và tìm lại mọi người."
 breed_turtle_world_project: "Bắt đầu kế hoạch nhân giống Nemma"
 breed_turtle_world_project_DESC: "Thông qua các nghiên cứu sơ bộ và kiến thức động vật học, giờ đây chúng ta có thể khuyến khích loài sinh vật hiền lành này phát triển mạnh mẽ trong giới hạn chịu tải của môi trường sống."
 enslave_turtle_world_project: "Bắt đầu nô dịch Nemma"
 enslave_turtle_world_project_DESC: "Dược phẩm tiên tiến và các thiết bị cấy ghép điều khiển có thể khiến Nemma trở nên phục tùng và dễ kiểm soát hơn, biến chúng thành những quái thú thồ hàng khổng lồ."
 mine_turtle_world_project: "Bắt đầu khai khoáng trên Nemma"
 mine_turtle_world_project_DESC: "Sau khi nghiên cứu kỹ cấu tạo sinh học của Nemma, các [Root.owner.GetScientistPlural] của chúng ta có thể thu hoạch khoáng sản hữu ích từ lớp vỏ của những loài bò sát khổng lồ này một cách hiệu quả."
 kill_turtle_world_project: "Tiêu diệt Nemma"
 kill_turtle_world_project_DESC: "Chúng ta sẽ dùng mọi biện pháp để quét sạch mối đe dọa từ Nemma khỏi hành tinh này."
 study_turtle_world_project: "Nghiên cứu Nemma"
 study_turtle_world_project_DESC: "Cần đặt Nemma dưới sự bảo vệ của các [Owner.GetScientistPlural] giỏi nhất để tìm kiếm giải pháp chung sống."
 STUDY_NANITE_SWARM: "Nghiên cứu bầy đàn Nanite"
 STUDY_NANITE_SWARM_DESC: "Bầy đàn Nanite trên [nanite_swarm_planet.GetName] vừa là một kỳ quan khoa học vừa là một mối nguy hiểm. Việc tìm hiểu nguồn gốc và mối liên hệ của chúng với hệ sinh thái hành tinh là một thách thức đầy phấn khích, có khả năng thúc đẩy hiểu biết của chúng ta về trí tuệ máy móc."
 DESTROY_SWARM: "Tiêu diệt bầy đàn"
 DESTROY_SWARM_DESC: "Ra lệnh oanh tạc quỹ đạo để xóa sổ bầy đàn. Nếu có bất kỳ bí mật nào đáng để khám phá, chúng ta sẽ tìm chúng trong xác của lũ sâu bọ này."
 TAME_THE_SWARM: "Thuần hóa bầy đàn"
 TAME_THE_SWARM_DESC: "Công nghệ AI cao cấp có thể dùng để lập trình lại và thuần hóa các hạt nano này. Chúng sẽ giúp ích lớn trong việc xây dựng trên hành tinh, tạo ra một quê hương thứ hai."
 TAME_THE_SWARM_DESC_ARTIFICIAL: "Công nghệ AI cao cấp có thể dùng để lập trình lại và thuần hóa các hạt nano này. Chúng sẽ hỗ trợ xây dựng cơ sở hạ tầng và biến hành tinh này thành một thiên đường thực sự."
 ENLIGHTEN_RADIO: "Khai sáng thực vật hội tụ"
 ENLIGHTEN_RADIO_DESC: "Những loài thực vật có thể sinh trưởng trong môi trường bức xạ cực cao này sẽ là sự bổ sung tuyệt vời cho đế chế. Chúng ta cần nâng cao nhận thức và dạy cho chúng những tiến bộ hàng ngàn năm của chúng ta trong vài tháng."
 GAS_RESTORATION: "Kế hoạch phục hồi [From.GetName]"
 GAS_RESTORATION_DESC: "Sửa chữa sai lầm là đặc quyền của kẻ mạnh. Thảm họa trên [From.GetName] thật kinh khủng, và hy vọng duy nhất là các nhà khoa học có thể đảo ngược cực tính của máy dò để thắp lại ngọn lửa sự sống bên trong hành tinh khí khổng lồ này."
 RESCUE_STORM: "Giải cứu [Root.GetName]"
 RESCUE_STORM_DESC: "[Root.GetName] đang bị vây hãm bởi cơn bão trên [FromFrom.GetName]. Hy vọng duy nhất là phóng một tàu mới đến để điều chỉnh lại tần số lá chắn của họ từ xa."
 STUDY_SLEEPING_CRYSTAL: "Nghiên cứu tiểu hành tinh kỳ lạ"
 STUDY_SLEEPING_CRYSTAL_DESC: "[From.GetName] là một tiểu hành tinh lạ lùng, dường như nó có thể tự xoay chuyển để né tránh các trạm khai thác của chúng ta. Cần cử tàu khoa học đến nghiên cứu."
 CRACK_THE_EGG: "Phá vỏ"
 CRACK_THE_EGG_DESC: "Quả trứng khổng lồ phát hiện tại [Solar_System.GetName] bắt đầu xuất hiện các vết nứt. Đây là cơ hội hiếm có để nghiên cứu chu kỳ sinh sản của những dạng sống khổng lồ này."
 #Decisions
 decision_crystalline_refugees: "Định cư người tị nạn tinh thể"
 decision_crystalline_refugees_desc: "$NAME_Central_Crystal_Species$ đã bị trục xuất khỏi quê hương $NAME_Central_Crystal_Country$, hãy tìm cho họ một mái nhà mới."
 decision_crystalling_refugees_effect_tt: "§G500§!£pop£ dân cư §H$NAME_Central_Crystal_Species$§! sẽ di cư đến §Y[Root.GetName]§!."
 decision_crystalline_architecture: "Kiến trúc tinh thể"
 decision_crystalline_architecture_desc: "Một đội ngũ kỹ sư từ $NAME_Central_Crystal_Country$ sẽ giúp cải thiện bố cục của trạm cư trú."
 decision_expand_dayside: "Mở rộng hạ tầng vùng ban ngày"
 decision_expand_dayside_desc: "Nhờ vào điều kiện độc đáo của [Root.GetName], chúng ta có thể lắp đặt vô số tấm pin mặt trời ở vùng ban ngày để tăng mạnh sản lượng năng lượng."
 decision_introduce_chaos: "Đưa vào sự hỗn loạn"
 decision_introduce_chaos_desc: "Hành tinh này quá hoàn hảo đến mức cư dân bắt đầu suy nhược tinh thần vì sự đơn điệu. Lựa chọn duy nhất là đưa vào một vài yếu tố bất toàn."
 #Enigmatic Robot
 anomaly.2080.name: "Robot bí ẩn"
 anomaly.2580.desc: "Trong quá trình điều tra nền văn minh trước đây trên [From.GetName], các nhà khoa học phát hiện một robot nhỏ đang cố ẩn mình. Sau nhiều tuần tiếp cận, nó đã dẫn chúng ta đến một nhà máy vẫn còn hoạt động được nó chăm sóc từ khi chủ nhân rời đi.\n\nTại đây, đoàn nghiên cứu được tặng một lượng lớn tài nguyên. Dù khó giao tiếp, robot này dường như đã xem các nhà khoa học của chúng ta là bạn."
 #The Inhabitants of Parvus III
 anomaly.6700.name: "Thoát chết trong gang tấc"
 anomaly.6700.desc: "Đội ngũ trên [Root.GetName] khi khám phá các cồn cát hoang vu trên §H[nanite_swarm_planet.GetName]§! đã báo cáo một kết quả không mấy bất ngờ: đây là một vùng đất chết chóc, không có dấu hiệu sự sống trên mặt nước. Tuy nhiên, sự sống dưới nước của hành tinh này đã tiến hóa vượt xa mong đợi.\n\nNgoài ra, họ còn tìm thấy những cấu trúc giống như kiến trúc cổ bị cát bao phủ. Ngay khi bắt đầu đào bới, một nhóm Nanite xuất hiện và tấn công. Hóa ra công trình này không được làm từ cát, mà từ hàng tỷ máy móc nano siêu nhỏ! Khi bị kích hoạt, chúng bắt đầu tự nhân bản hàng loạt. [Root.GetLeaderName] đã ra lệnh di tản khẩn cấp, giúp tàu thoát khỏi bầu khí quyển ngay trước khi cơn bão Nanite ập đến."
 anomaly.6700.a: "Tìm hiểu xem chuyện gì đã xảy ra."
 anomaly.6705.name: "Nguồn gốc của Nanite"
 anomaly.6705.desc.start: "[root.GetName] đã hoàn thành nghiên cứu về Nanite trên §H[nanite_swarm_planet.GetName]§!. Kết quả thật kinh ngạc: hàng ngàn năm trước, một con tàu từ nền văn minh tiên tiến đã rơi xuống đây, mang theo hàng chục loại robot khác nhau."
 anomaly.6705.desc.L: "Điều tò mò là những robot này dường như là công cụ của những \"Kẻ xây cổng\" (Gatebuilders) bí ẩn, còn cổ xưa hơn cả các Cổng L-星门 mà chúng ta biết."
 anomaly.6705.desc.noL: "Dù là ai, những người tạo ra chúng đã nắm giữ công nghệ vượt xa chúng ta từ rất lâu trước đây."
 anomaly.6705.desc.end: "\nCác robot này hoạt động tự chủ và cố gắng bảo vệ hành tinh theo chương trình. Khi không còn chủ nhân điều phối, một cuộc chiến đã nổ ra giữa chúng.\n\nKẻ chiến thắng là một nhóm hệ thống nano có khả năng thích nghi cực cao và tự nhân bản. chúng đã quét sạch mọi đối thủ và các loài địa phương để trở thành kẻ thống trị hành tinh. Những gì chúng ta thấy hiện nay là tàn dư của cuộc đại chiến đó: một hành tinh không hề chết, mà đang chứa đựng những kẻ săn mồi đỉnh cao nhất."
 anomaly.6705.a: "Thuần hóa bầy đàn"
 anomaly.6705.b: "Nghiên cứu thêm về bầy đàn."
 anomaly.6705.b.tooltip: "Chỉ thị các [Root.Owner.GetScientistPlural] giải mã bí mật của Nanite trên [nanite_swarm_planet.GetName]."
 anomaly.6705.c: "Tiêu diệt bầy đàn."
 anomaly.6710.name: "Hệ miễn dịch nhân tạo"
 anomaly.6710.desc.start: "Cư dân của §H[nanite_swarm_planet.GetName]§! thật ấn tượng. Bất kỳ máy thăm dò nào gửi vào bầu khí quyển đều bị bầy đàn phân tích và tháo dỡ nhanh chóng. Ngay sau đó, toàn bộ bầy đàn đều học được cách phá hủy thiết bị của chúng ta hiệu quả nhất. Hiểu biết của chúng về công nghệ của chúng ta đang tăng vọt."
 anomaly.6710.desc.normal: "Một số [Root.Owner.GetScientistPlural] cho rằng hành vi này chứng minh bầy đàn là một thực thể có trí tuệ, hoặc một dạng sinh vật sống.\n\nĐã đến lúc quyết định: thả tự do, tiêu diệt, hay chiếm hữu chúng để phục vụ lợi ích của chúng ta?"
 anomaly.6710.desc.gestalt: "Đây là những hành vi bầy đàn đang phát triển, nếu để mặc, chúng có thể đạt tới trí tuệ thực thụ. Chúng ta nên để yên, tiêu diệt trước khi thành mối họa, hay tìm cách lợi dụng thực thể này?"
 anomaly.6710.a: "Thuần hóa bầy đàn."
 anomaly.6710.b: "Tiêu diệt bầy đàn."
 anomaly.6710.c: "Đây không chỉ là máy móc, chúng là sinh vật sống!"
 anomaly.6715.name: "Đất lành cho bầy đàn"
 anomaly.6715.desc: "Dù bầy đàn trên §H[nanite_swarm_planet.GetName]§! rất mạnh khi tập hợp, nhưng từng cá thể lại khá mong manh. Bằng cách thu thập một mẫu nhỏ và dùng AI tiên tiến, chúng ta đã ghi đè thành công hệ thống liên lạc của chúng. Khi thả các robot đã lập trình lại về bầy đàn, sự thay đổi lan tỏa toàn cầu ngay lập tức.\n\nSau khi kiểm soát mạng lưới, việc đầu tiên là ổn định bầu khí quyển của hành tinh theo hướng có lợi cho [Root.Owner.GetSpeciesNamePlural]. Hành tinh hiện đã sẵn sàng cho công cuộc thuộc địa hóa."
 anomaly.6715.a: "Tàu thuộc địa! Xuất phát!"
 anomaly.6720.name: "Oanh tạc thay lời nói"
 anomaly.6720.desc: "Sau khi [root.fleet.GetName] hoàn tất oanh tạc §H[nanite_swarm_planet.GetName]§!, bụi mù dần lắng xuống. Dù bầy Nanite chống trả quyết liệt, nhưng cuối cùng không còn dấu hiệu sự sống máy móc nào nữa.\n\nCác cư dân tương lai có thể thu thập xác của chúng để phục vụ nghiên cứu và sản xuất."
 anomaly.6725.name: "Chuẩn bị thiếu sót"
 anomaly.6725.desc: "Các biện pháp phòng ngừa của chúng ta vẫn chưa đủ. Ngay sau khi thiết lập thuộc địa trên §H[nanite_swarm_planet.GetName]§!, chúng ta đã mất liên lạc với đội ngũ mặt đất. Thông điệp cuối cùng cho thấy bầu trời bị che khuất bởi vô số vật thể đen nhỏ li ti đang nhấn chìm tiền đồn."
 anomaly.6725.a: "Lũ Nanite chết tiệt!"
 parvus_III_chain_title: "Cư dân của Parvus III"
 parvus_III_chain_desc: "Parvus III không có sự sống hữu cơ, nhưng lại đầy rẫy các hoạt động. Những thực thể này là gì, và liệu có thể giải thích chúng một cách hợp lý?"
 #Color of Science
 anomaly.6740.name: "Màu sắc của khoa học"
 anomaly.6740.desc: "Nguyên nhân gây ra sự cộng hưởng bức xạ tại vành nhật hoa của §Y[From.GetName]§! hóa ra là một dãy tinh thể dị thường chịu nhiệt cao.\n\nKhi mang các tinh thể này lên tàu, các [Root.Owner.GetScientistPlural] kinh ngạc thấy rằng sự cộng hưởng này có thể tái tạo được. Chúng tạo ra những màu sắc và âm thanh mà người [Owner.GetSpeciesNamePlural] chưa từng thấy trước đây!\n\nTần số này có thể thay đổi cách chúng ta nhận thức vũ trụ. Nói cách khác, chúng ta có thể dùng cấu trúc tinh thể để phát triển thiết bị nghiên cứu chịu được nhiệt độ cực hạn của các ngôi sao."
 anomaly.6740.a: "Gửi tần số mới này về cho các nghệ sĩ của chúng ta."
 anomaly.6740.a.gestalt: "Thu thập các tần số này để phân tích thêm."
 anomaly.6740.b: "Thu thập tinh thể để cách nhiệt cho vũ khí năng lượng."
 #Alpha Centauri Anomaly
 anomaly.6745.name: "[From.GetName]"
 anomaly.6745.desc: "Từ khi [Root.Owner.GetSpeciesNamePlural] bắt đầu nhìn lên bầu trời, [From.GetName] luôn là một giấc mơ thuần khiết về một ngôi nhà mới. Đáng buồn thay, với sự phát triển của kính viễn vọng, chúng ta nhận ra đây là một địa ngục bị khóa thủy triều và băng giá vĩnh cửu.\n\nTuy nhiên hy vọng vẫn còn, thế giới này hội đủ các yếu tố của một hành tinh có thể ở được. Có lẽ chúng ta chỉ cần đẩy nhẹ nó một chút..."
 anomaly.6745.a: "Cảm ơn vì đã truyền cảm hứng cho chúng tôi, [From.GetName]."
 anomaly.6745.b: "Thêm một hành tinh ngoại lai vào danh sách vinh danh."
 anomaly.6750.name: "[From.GetName]"
 anomaly.6750.desc: "Hành tinh khóa thủy triều này dường như sở hữu các nền tảng của một thế giới có thể định cư. Có lẽ có thể xây dựng thứ gì đó ở đây."
 #Target Practice Anomaly
 anomaly.6800.name: "Luyện tập tác xạ"
 anomaly.6800.desc: "Cảm biến phát hiện xác tàu trên [From.GetName] đến đó theo một cách rất hiếm thấy. Có vẻ chúng được điều khiển đâm thẳng vào tiểu hành tinh từ khoảng cách vài năm ánh sáng để thử nghiệm độ chính xác của động cơ đẩy. Chúng ta đã tìm thấy một bộ động cơ còn khá nguyên vẹn."
 anomaly.6800.a: "Thu hồi động cơ đó!"
 anomaly.6800.b: "Chúng ta sẽ không lãng phí số hợp kim này."
 #ASR: Asteroid Sensor Relay
 anomaly.6805.name: "Trạm chuyển tiếp cảm biến tiểu hành tinh"
 anomaly.6805.desc: "Các [Owner.GetScientistPlural] mong đợi tìm thấy tài nguyên hiếm bên trong [From.GetName], nhưng lại tình cờ va phải một thứ kỳ lạ. Vật thể trông như tiểu hành tinh bình thường này thực chất là một trạm chuyển tiếp ngủ yên, chứa các linh kiện điện tử và cảm biến tiên tiến để gửi tín hiệu về một đế chế cổ đại. Cú va chạm đã làm hỏng một phần cấu trúc, chúng ta chỉ có thể trích xuất được thông tin về một hệ sao."
 anomaly.6805.a: "Thu hồi cảm biến."
 anomaly.6805.b: "Giải mã phần mềm mã hóa của chúng."
 anomaly.6810.name: "Nhiễm khuẩn"
 anomaly.6810.desc: "Chúng ta đã nhầm. Trạm không gian quanh [From.GetName] không hề bị bỏ hoang; ngược lại, nó đầy rẫy những sinh vật chân khớp ngoài hành tinh khổng lồ! Các cảm biến gửi vào trạm chỉ kịp truyền về hình ảnh những bóng đen di chuyển nhanh và bộ hàm khổng lồ trước khi mất tín hiệu. Qua quét sâu, chúng ta thấy một kho dữ liệu cực kỳ phức tạp. Để tiếp cận nó, chúng ta phải vượt qua những \"người gác cổng\" nhiều chân này."
 anomaly.6810.a: "Rút lui thôi, lũ chân khớp đó không phải chuyện đùa!"
 anomaly.6810.b: "Tốt nhất là không nên làm phiền chúng."
 anomaly.6810.c: "§BThử liên lạc với những người bạn chân khớp này.§!"
 anomaly.6810.d: "§BHút sạch không khí của chúng.§!"
 anomaly.6810.d.tooltip: "Sử dụng kiến thức về trạm cư trú để tạo ra một vết nứt trong bầu khí quyển của trạm."
 anomaly.6810.e.evopred: "§BThu thập gen của chúng!§!"
 anomaly.6815.name: "Sinh vật chân khớp khổng lồ"
 anomaly.6815.desc: "Ồ, chào các bạn! Rất tiếc vì đã phá hủy máy thăm dò của các bạn trước đó. Đó là vì chúng tôi đang thực hiện một thí nghiệm rất tinh vi và lo ngại các tác động bên ngoài sẽ ảnh hưởng đến kết quả — tôi tin các bạn hiểu điều đó. Vậy, chúng tôi có thể giúp gì không?"
 anomaly.6815.a: "Khoan đã, vậy các bạn không phải là lũ sâu bọ hung hãn sao?"
 anomaly.6820.desc: "Điều gì khiến bạn nghĩ vậy? Chúng tôi là một đội ngũ Giám sát (Curators) được cử đến đây để nghiên cứu đặc tính độc đáo của hệ sao này. Nếu bạn muốn chia sẻ những quyền lợi mà tổ chức chúng tôi thường cung cấp, tôi khuyên bạn nên liên hệ với phòng thí nghiệm chính. Tôi có thể cung cấp bản sao những gì chúng tôi tìm thấy ở đây."
 anomaly.6820.a: "Chúc thí nghiệm của các bạn thành công."
 #Crystal Growths Anomaly
 anomaly.6825.name: "Tinh thể sinh trưởng"
 anomaly.6825.desc.start: "Dạng sống trên [From.GetName] hoàn toàn khác với dự đoán. Các [owner.GetScientistPlural] báo cáo rằng có những tinh thể đang không ngừng sinh trưởng bên trong tiểu hành tinh. Chúng tận dụng bức xạ từ [From.System.GetName] kết hợp với khoáng vật để tự duy trì và phát triển."
 anomaly.6825.desc.nofood: "Những tinh thể này chủ yếu cấu tạo từ đường sucrose, rất dễ vỡ."
 anomaly.6825.desc.food: "Những tinh thể này chủ yếu cấu tạo từ đường sucrose, chắc hẳn có giá trị dinh dưỡng tiềm năng."
 anomaly.6825.b: "Cái gì, ăn được sao?"
 anomaly.6835.name: "Tiếng gọi của tinh thể"
 anomaly.6835.desc: "Sau vài năm ăn kẹo tinh thể không gian, nhu cầu của người dân đối với món ngon này ngày càng tăng. Các [Root.GetScientistPlural] đã lập danh sách các địa điểm tiềm năng để xây dựng trang trại kẹo tinh thể."
 anomaly.6835.a: "Tìm thêm tiểu hành tinh để mở rộng trang trại kẹo."
 anomaly.6835.a.tooltip: "Tối đa §Y3§! tiểu hành tinh ngẫu nhiên sẽ sản xuất §G3§!£food£ Thức ăn."
 anomaly.6835.b: "Thôi, không cần mở rộng thêm đâu."
 #Too Few Sheep Asteroid Anomaly
 anomaly.6840.name: "Quá ít 'Cừu'"
 anomaly.6840.desc: "[From.GetName] là một hành tinh khí độc đáo. Theo kiến thức vật lý thiên văn, nó lẽ ra phải có vành đai, nhưng thực tế lại không. Sau khi quan sát kỹ các vệ tinh kỳ lạ quanh nó, nguyên nhân đã rõ: hành tinh này được bao quanh bởi các vệ tinh \"người chăn cừu\", chúng tích tụ lượng khoáng sản khổng lồ qua mỗi năm. Chúng ta có thể phá hủy chúng để thu hoạch ngay, hoặc để chúng tiếp tục thu gom tàn dư không gian."
 anomaly.6840.a: "Chúng ta cần số khoáng sản đó ngay bây giờ."
 anomaly.6840.b: "Dục tốc bất đạt, hãy cứ để chúng tích tụ."
 #Cascading Catastrophe
 anomaly.6845.name: "Thảm họa dây chuyền"
 anomaly.6845.desc: "Chúng ta đã tìm thấy sự sống trên [From.GetName], nhưng cũng chính vì hành động của chúng ta mà sự sống đó đã tuyệt diệt. Những vi sinh vật sống ở tầng ngoài hành tinh khí đã phản ứng tiêu cực với sóng quét sâu. Tần số quét gây cộng hưởng với cấu trúc tế bào — hiệu ứng này lan nhanh như thác đổ từ cá thể này sang cá thể khác. Tất cả đều ngừng hoạt động ngay sau đó.\n\nChúng ta đang bay quanh nghĩa địa lớn nhất vũ trụ."
 anomaly.6845.a: "Còn có thể làm gì không?"
 anomaly.6850.name: "Đảo ngược cực tính quét sâu"
 anomaly.6850.desc: "Thành công rồi! Như một phép màu, khi các [Owner.GetScientistPlural] điều chỉnh lại thiết bị trên tàu, họ đã tái hiện hiệu ứng dây chuyền ban đầu nhưng với tác động ngược lại. Sự sống trên [FromFromFrom.GetName] đã bừng tỉnh trở lại như một làn sóng khổng lồ."
 anomaly.6850.desc.valuesothers: "Quá trình này dạy chúng ta nhiều điều về vũ trụ, và có lẽ là về chính bản thân mình."
 anomaly.6850.desc.novaluesothers: "Trong tương lai, chúng ta phải cẩn trọng hơn khi sử dụng máy quét."
 anomaly.6850.a: "Tin tuyệt vời!"
 #Caught in the Eye
 anomaly.6855.name: "Bị cuốn vào tâm bão"
 anomaly.6855.desc.regular: "Tín hiệu cuối cùng từ [Root.GetName] chỉ là những tiếng nhiễu loạn. Họ đang nghiên cứu cơn bão khu vực kỳ lạ trên [From.GetName] và đã gửi về những báo cáo sơ bộ khó tin. Cơn bão này phản ứng với các máy thăm dò, tạo ra các túi chân không để né tránh rồi từ từ bao vây chúng. Trước khi mất liên lạc, [Root.GetName] định thử nghiệm nhiều tần số quét khác nhau. Con tàu dường như đã chìm sâu vào hành tinh khí và rơi vào im lặng."
 anomaly.6855.desc.gestalt: "Tín hiệu từ [Root.GetName] đột ngột bị cắt đứt khỏi nhận thức chung. Các [Owner.GetScientistPlural] dường như chưa chết, nhưng không thể giao tiếp. Cơn bão trên [From.GetName] đang phản ứng một cách chủ động với sự hiện diện của chúng ta. Con tàu đã chìm sâu vào bóng tối."
 anomaly.6855.a: "Chúng ta cần cứu [Root.GetName]!"
 anomaly.6855.b: "Chờ đã, tình hình trên [From.GetName] giờ còn thú vị hơn nhiều."
 anomaly.6855.b.tooltip: "Bỏ mặc [Root.GetName] để nghiên cứu các phản ứng."
 anomaly.6860.name: "Tần số lá chắn dao động"
 anomaly.6860.desc: "Sau vài tháng làm việc, các [Owner.GetScientistPlural] cuối cùng đã điều chỉnh được cách hoạt động của lá chắn trên [FromFrom.GetName], khiến cơn bão trên [FromFromFrom.GetName] nới lỏng vòng vây. Liên lạc với [trapped_in_storm.GetName] được thiết lập lại, nhưng kỳ lạ là không ai trên tàu nhớ gì về quãng thời gian bị kẹt trong bão."
 anomaly.6860.a: "Quay lại làm việc thôi."
 #Express Mail
 anomaly.6865.name: "Thư hỏa tốc"
 anomaly.6865.desc: "Khi [Root.GetName] đến đủ gần để quét khoang hàng, các cảm biến dường như bị lỗi. Khoang này sử dụng [Owner.GetBioAlloy] giống hệt loại chúng ta dùng. Khả năng một loài ngoài hành tinh chế tạo ra vật liệu trùng khớp hoàn toàn là không thể, nhưng kết quả vẫn không đổi.\n\nKhi mở khoang, chúng ta chỉ thấy một tập tài liệu chi tiết cách phân bổ từng [Owner.GetScientistPlural] và kế hoạch nghiên cứu của họ trong 10 năm tới, kết thúc vào một ngày cụ thể."
 anomaly.6865.a: "Gửi những ghi chép này về [Owner.Capital.GetName]."
 anomaly.6865.b: "Chuyện này hơi rợn người đấy."
 anomaly.6870.name: "Đóng vòng lặp"
 anomaly.6870.desc: "Sau vài năm phát triển không mấy suôn sẻ, một vết nứt thời gian xuất hiện phía trên [Root.Capital.GetName]. Thật đáng sợ khi ngày hôm nay trùng khớp với ngày ghi trong tập tài liệu 10 năm trước. Giờ chúng ta chỉ cần làm một việc: phóng những ghi chép đó vào vết nứt để đóng vòng lặp này lại."
 anomaly.6870.a: "Để bản thân chúng ta trong quá khứ giải quyết rắc rối này vậy."
 #Convenient Mining
 anomaly.6875.name: "Khai thác tiện lợi"
 anomaly.6875.desc: "Quỹ đạo của tiểu hành tinh gần [From.GetName] ổn định một cách hoàn hảo đến mức các [Owner.GetScientistPlural] nghi ngờ nó được đặt ở đó một cách nhân tạo. Tuy nhiên, không có dấu hiệu của động cơ đẩy hay sự can thiệp nào. Kết luận tự nhiên duy nhất là do một tỷ lệ cực thấp, nó đã bị trường trọng lực của [From.GetName] bắt giữ. Chúng ta còn tìm thấy vài loại tinh thể quý hiếm trên bề mặt của nó."
 anomaly.6875.a: "Thật là tiện lợi."
 anomaly.6880.name: "Sự xoay chuyển không lời giải"
 anomaly.6880.desc: "Chỉ vài ngày sau khi trạm khai thác trên tiểu hành tinh hoàn thành, khối đá đột ngột xoay chuyển, phá hủy trạm nhưng đồng thời làm lộ ra thêm nhiều quặng tinh thể hiếm trước các cảm biến!"
 anomaly.6880.a: "Xây lại lần nữa!"
 anomaly.6880.b: "Tại sao nó lại làm thế?"
 anomaly.6885.name: "Tinh thể nổi giận"
 anomaly.6885.desc: "Còi báo động vang khắp [Solar_System.GetName], một lượng lớn quái thú tinh thể lao ra từ tiểu hành tinh — chính là nơi chúng ta đang khoan để lấy tài nguyên. Có vẻ như nó đang §Rgiận dữ§!."
 anomaly.6890.name: "Tổ tinh thể ngủ yên"
 anomaly.6890.desc: "Tiểu hành tinh này thực chất là tổ của một dạng sống tinh thể. Thật may là chúng ta không đào sâu hơn, vì có vẻ chúng ta đã chọc giận những sinh vật đang ngủ đông bên trong. Nếu chúng ta chỉ nghiên cứu từ xa, chúng sẽ bình tĩnh lại."
 anomaly.6890.a: "Chúng ta có thể học được gì từ đây?"
 #Toxic Biological Industry
 anomaly.6895.name: "Công nghiệp sinh học độc hại"
 anomaly.6895.desc.catano: "Tín hiệu sự sống trong bầu khí quyển độc hại của [From.GetName] hóa ra là những cỗ máy bán hữu cơ khổng lồ! Thực thể công nghiệp này chính là nguyên nhân khiến hành tinh mịt mù khói bụi, và nó vẫn đang hoạt động. Không có dấu hiệu sự sống nào khác, chủ nhân của chúng chắc hẳn đã bỏ rơi chúng. Những công trình này sẽ giúp chúng ta hiểu rõ hơn về kỹ thuật công trình."
 anomaly.6895.desc.catayes: "Tín hiệu sự sống trong bầu khí quyển độc hại của [From.GetName] là những cỗ máy bán hữu cơ khổng lồ! Giống như chúng ta, những người tạo ra cơ sở này cũng yêu thích vẻ đẹp của sự kết hợp giữa sinh học và máy móc. Dù chủ nhân đã đi xa, nhưng nhà máy vẫn vận hành, tạo ra một môi trường độc hại đặc trưng."
 anomaly.6895.b: "Thu thập những phần có thể."
 anomaly.6895.c: "Thu thập tất cả."
 anomaly.6895.d: "Cứ để kẻ ngu ngốc đang ngủ đó nằm yên đi."
 #Cool Thoughts
 anomaly.6900.name: "Tư duy lạnh lẽo"
 anomaly.6900.desc: "Chúng ta không chỉ phát hiện sự sống dưới bề mặt, mà thực tế là cả hành tinh này là một thực thể sống! Bên trong hành tinh băng giá này chằng chịt các ống dẫn siêu nhỏ kết nối với nhau như một máy tính sơ khai. Quy mô khổng lồ của nó cho phép sức mạnh tính toán sánh ngang với các siêu máy tính tại [Owner.Capital.GetName]. Nó vẫn đang hoạt động — các nhà khoa học có thể tương tác với nó, nhưng vì nó chạy rất chậm, chúng ta chỉ có thể hỏi một câu đơn giản."
 anomaly.6900.a: "Bạn có thể giải các phép tính này không?"
 anomaly.6900.a.tooltip: "Sử dụng hành tinh này để hỗ trợ giải quyết các bài toán vật lý thiên văn hiện tại."
 anomaly.6900.b: "Ai đã tạo ra bạn?"
 anomaly.6900.c: "Trước chúng tôi còn ai từng đến đây?"
 anomaly.6900.d: "Chúng tôi là gì?"
 anomaly.6900.evopred: "Hương vị tuyệt hảo nhất là gì?"
 anomaly.6900.e: "Tốt nhất nên quan sát từ xa."
 #Don't Count Your Planets
 anomaly.6905.name: "Đừng vội đếm hành tinh"
 anomaly.6905.desc: "Các [Owner.GetScientistPlural] vừa có một phát hiện kinh hoàng. Những dãy núi họ quét thấy trước đây thực chất là lớp màng của một quả trứng khổng lồ. Chúng ta không biết quái thú nào đã đẻ ra nó, và càng không biết thứ kinh khủng gì sẽ nở ra từ bên trong."
 anomaly.6905.a: "Nghiên cứu từ xa."
 anomaly.6905.b: "Đập vỏ nó ra!"
 anomaly.6905.c: "Làm một bữa thịnh soạn."
 anomaly.6910.name: "Trứng cuộn tinh hà"
 anomaly.6910.desc.start: "Bên trong [FromFromFrom.GetName] có thứ nằm ngoài dự liệu. Không có ấu trùng quái thú nào, thay vào đó là một khối vật chất di truyền khổng lồ. Toàn bộ ruột hành tinh đầy rẫy tài nguyên và gen. Dù không biết nó sẽ trở thành thứ gì, nhưng có lẽ không đào sâu thêm sẽ an toàn hơn cho thiên hà."
 anomaly.6910.desc.hatchling: "Dù quả trứng này rất giống với Hư Không Nghiệt Chủng (Voidspawn) từng gặp, nhưng nó đang ấp ủ một thực thể vĩ đại hơn."
 anomaly.6910.b.evopred: "Đại tiệc lòng đỏ!"
 anomaly.6915.name: "Lòng biết ơn"
 anomaly.6915.desc.regular: "§R“Nó sống rồi! Nó đã hồi sinh! So với tạo vật vĩ đại này, chúng ta chỉ là cát bụi; trước mặt nó, những chuyện vặt vãnh giữa các đế chế vì sao thật nực cười—”§!\n\nTín hiệu từ [Root.GetName] bị ngắt quãng. Khi máy thăm dò quét qua xác của [FromFromFrom.GetName], chúng ta chỉ thấy một cái vỏ rỗng. Có vẻ sinh vật này không mấy biết ơn kẻ đã giải phóng mình."
 anomaly.6915.desc.gestalt: "Mọi đơn vị tại [Solar_System.GetName] đều báo động trước khi mất kết nối với [Owner.GetBrainName]. Thông điệp duy nhất còn lại là §R“Nó đã thoát ra.”§! Quả trứng đã nở, và thực thể bên trong đã biến mất vào không gian."
 anomaly.6915.b.evopred: "Thu thập tàn dư."
 #Heat from Below
 anomaly.3140.name: "Suối nhiệt dưới lòng đất"
 anomaly.3140.desc: "Sau khi thăm dò dưới lớp băng, chúng ta kết luận rằng tín hiệu nhiệt bất thường trên [From.GetName] là do các suối nhiệt dịch gây ra. Có vẻ còn nhiều nơi như vậy trên hành tinh này nhưng chúng ta chưa phát hiện hết."
 anomaly.3140.a: "Thật tuyệt, nhưng không cần phí sức thêm vào việc này đâu."
 anomaly.3141.name: "Độ sâu của sự sống ngoại lai"
 anomaly.3141.desc: "Thăm dò sâu hơn của đội ngũ trên [From.GetName] tiết lộ rằng nơi khởi nguồn của dòng nước nóng sâu trong lớp vỏ hành tinh lại dày đặc các vi sinh vật! Hành tinh băng giá vốn tưởng như trống rỗng này thực chất đang nuôi dưỡng một hệ sinh thái dưới nước phồn vinh."
 colony.5000.name: "Người bạn bất ngờ"
 colony.5000.desc: "Robot bí ẩn trên [Root.GetName] tỏ ra rất chào đón cư dân ngay từ khi họ đặt chân lên hành tinh. Dù ban đầu còn nghi ngại, nhưng nó đã giúp ích rất nhiều trong việc thiết lập thuộc địa. Trong những năm đầu, hình ảnh của nó đã trở thành linh vật biểu tượng cho cả hành tinh."
 colony.5000.a: "Chú robot nhỏ đáng yêu này đã giúp đỡ chúng ta rất nhiều."
 colony.5005.name: "Nhà máy cổ xưa"
 colony.5005.desc: "Nhà máy do robot trên [Root.GetName] trông coi đã đóng vai trò quan trọng trong những năm đầu thành lập thuộc địa. Khi cư dân có thời gian tìm hiểu về linh vật của mình, họ nhận ra nhà máy cổ mà nó canh giữ suốt bao thế kỷ đã xuống cấp trầm trọng và cần được đại tu."
 colony.5005.a: "Hãy xem chúng ta có thể giúp gì được nó không."
 colony.5006.name: "Nhà máy sụp đổ"
 colony.5006.desc: "Sau nhiều năm bị xói mòn, nhà máy khổng lồ trên [Root.GetName] cuối cùng đã đổ sập hoàn toàn. Trong đống đổ nát, cư dân tìm thấy một kho kim loại lớn dưới tầng hầm. Ở chính giữa là xác chú robot từng niềm nở chào đón chúng ta, nó đã bị đè nát trong lúc cố gắng bảo vệ nhà máy."
 colony.5006.a: "Linh vật đã không còn nữa..."
 colony.5010.name: "Nhà máy hoạt động trở lại"
 colony.5010.desc: "Các kỹ sư từng nghĩ họ đã thất bại trong việc sửa chữa nhà máy trên [Root.GetName]. Nhưng ngay khi họ định rời đi, các động cơ bỗng vang lên rầm rộ. Không chỉ hoạt động lại, mà dường như mọi thứ còn vận hành tốt hơn trước. Báo cáo cuối cùng nhắc đến chú robot nhỏ đang nhảy một điệu nhảy kỳ lạ khi thấy nhà máy hồi sinh."
 colony.5010.a: "Kết quả tốt đẹp là điều quan trọng nhất."
 colony.5010.tt: "Đặc điểm hành tinh §Y$d_hab_lonely_bot_deposit$§! giờ đây sản xuất §G1§!£volatile_motes£ §YVi hạt dễ cháy§! và §G1§!£exotic_gases£ §YKhí hiếm ngoại lai§!."
 colony.5015.name: "Robot mất tích"
 colony.5015.desc: "Chúng ta nhận được báo cáo về việc chú robot bí ẩn trên [Root.GetName] lại gây rắc rối. Nó đã biến mất cùng lúc với một số cư dân trong thành phố. Mọi người bắt đầu đổ lỗi cho nó về sự mất tích của người thân. Các kỹ sư đang truy tìm tín hiệu từ nhà máy để tìm ra dấu vết của nó."
 colony.5015.a: "Hy vọng chúng ta có thể giải quyết việc này nhanh nhất có thể."
 colony.5020.name: "Di cốt"
 colony.5020.desc: "Sau nhiều tuần truy vết, các kỹ sư đã tìm thấy một hầm lò cổ sâu dưới lòng đất. Tại đó, họ phát hiện những người mất tích đang bị kẹt cùng với đống đổ nát của robot. Hóa ra những cư dân này thuộc một giáo phái, họ vô tình rơi xuống đây và chú robot đã hy sinh để ngăn công trình sụp đổ lên người họ. Cư dân mong muốn chúng ta có thể sửa chữa và đưa linh vật của họ trở lại."
 colony.5020.a: "Hãy mang linh vật của mọi người trở lại."
 colony.5020.tt: "Đặc điểm hành tinh §Y$d_hab_lonely_bot_deposit$§! giờ đây cung cấp thêm một nghề £job_robot_caretaker£ §YNgười chăm sóc Robot§!."
 colony.5020.b: "Để kỹ sư tháo dỡ nó để tìm kiếm bí mật công nghệ."
 ancrel.11000.name: "Tầng thứ nhất"
 ancrel.11000.desc: "Phế tích này trông có vẻ đã hàng trăm, thậm chí hàng ngàn năm tuổi. Ban đầu nó giống như một công trình lộ thiên lớn, nhưng khi đào sâu, chúng ta nhận ra đây là một khu ổ chuột bị bỏ hoang trong một thành phố. Một cánh cổng khổng lồ chặn đường vào sâu hơn. Có vẻ xã hội này chia thành nhiều tầng lớp, mỗi tầng của công trình dành cho một giai cấp.\n\nDưới nền bê tông vỡ nát, chúng ta tìm thấy vô số di hài ngoại alien. Khung cảnh thật rợn người khi xác chết nằm la liệt ở mọi ngóc ngách, thậm chí treo lơ lửng trên trần nhà."
 ancrel.11000.a: "Vậy các tầng khác còn che giấu điều gì nữa?"
 ancrel.11005.name: "Tầng thứ hai"
 ancrel.11005.desc: "Nếu tầng một là những lều lán rách nát của dân nghèo, thì tầng hai lại có quy hoạch đô thị khá giống với [Root.GetAdj]. Chúng ta tìm thấy các quảng trường chợ búa, dù mọi thứ đã mục nát. Cảnh tượng chết chóc ở đây cũng tương tự như tầng dưới."
 ancrel.11005.a: "Lại là một khung cảnh thảm khốc."
 ancrel.11010.name: "Tầng thứ ba"
 ancrel.11010.desc: "Khi cánh cổng tầng ba mở ra, các nhà khoa học bước vào một khu vực giàu có hơn hẳn. Nhưng đột nhiên, một thành viên trong đoàn nổi điên tấn công đồng nghiệp đến chết. Người này liên tục lẩm bẩm những điều vô nghĩa. Tầng này nhỏ hơn và có lẽ là tầng cuối cùng trước khi đến trung tâm."
 ancrel.11010.a: "Các nhà khoa học đã sẵn sàng khám phá tầng cuối cùng."
 ancrel.11015.name: "Tầng cuối cùng"
 ancrel.11015.desc: "Một luồng sóng linh năng cực mạnh ập đến khi cánh cổng cuối cùng mở ra. Đa số gục ngã trong đau đớn, chỉ vài người tiến được vào trong. Nơi này trông như một ngôi đền lớn với tế đàn ở giữa. Trên tường đầy các biểu đồ tinh hệ tập trung vào chính [Root.System.GetName]. Tế đàn đó thực chất là một cỗ máy hùng vĩ được thiết kế dưới hình dạng cổ xưa."
 ancrel.11015.a: "Hãy thử sửa cỗ máy này xem có gì bên trong."
 ancrel.11020.name: "Kẻ viễn cổ"
 ancrel.11020.desc: "Khi việc sửa chữa bắt đầu, họ rơi vào một ảo giác chung — một thực thể đang bị phong ấn gào thét ra lệnh. Hình ảnh một sinh vật xé toạc hệ sao [From.System.GetName] lặp đi lặp lại trong tâm trí họ. Các nhà khoa học bất tỉnh vì sự tra tấn tinh thần và thể xác này."
 ancrel.11020.a: "Tháo dỡ cỗ máy này ngay trước khi nó gây thêm họa!"
 ancrel.11020.b: "Thả nó ra!"
 ancrel.11020.tt: "Một §Y$NAME_Eldritch_Horror$§! sẽ được giải phóng tại hệ sao §Y[eldritch_location.GetName]§!."
 ancrel.11025.desc: "Cuối cùng thì...\n\nLũ phàm nhân, hãy quỳ xuống! Hãy phủ phục trước ta, ta sẽ ban cho các ngươi sự bảo hộ và trí tuệ.\n\nNếu dám kháng lệnh, ta sẽ mang đến sự diệt vong cho các ngươi!"
 ancrel.11025.a: "Ôi thực thể vĩ đại! Hãy đến che chở cho những con chiên lạc lối này!"
 ancrel.11025.a.tt: "§Y[Root.GetName]§! sẽ xây dựng lại trạm sao tại §Y[eldritch_location.GetName]§!."
 ancrel.11025.b: "Giải phóng ngươi là một sai lầm."
 ancrel.11025.b.tt: "§Y[Root.GetName]§! sẽ rơi vào trạng thái thù địch với §Y$NAME_Eldritch_Horror$§!."
 ancrel.11027.desc: "Các ngươi đã chọn con đường của trí tuệ.\nMọi thứ sẽ diễn ra như nó vốn phải thế."
 ancrel.11027.a: "Mọi việc sẽ như ý ngài, thưa thực thể vĩ đại."
 ancrel.11030.desc: "Các ngươi đã chọn cái chết."
 ancrel.11030.a: "Ngắt liên lạc."
 ancrel.11035.name: "Mất hạm đội tại [eldritch_location.GetName]"
 ancrel.11035.desc: "Chúng ta mất liên lạc với hạm đội băng qua [eldritch_location.GetName]. Ngay sau đó là tin tức về việc ngôi sao sụp đổ và mọi thứ bị hủy diệt."
 ancrel.11035.a: "Một bi kịch."
 central.5.name: "Tín hiệu từ trung tâm thiên hà"
 central.5.desc: "Một tín hiệu mạnh mẽ phát ra từ trung tâm thiên hà vốn được coi là vùng đất chết. Ngay sau đó là một thông điệp khác được truyền đến."
 central.5.a: "Kết nối chúng đi."
 central.10.desc: "Chào những người trẻ tuổi của thiên hà.\n\nChúng ta, những cư dân từ Thiên Đường Trung Tâm, một lần nữa rời khỏi nơi ẩn náu để xem những kẻ sống ở vùng rìa như các ngươi có gì để cống hiến. Hy vọng các ngươi không gieo rắc kinh hoàng như những kẻ đi trước."
 central.10.a: "Chào ngài, ờ..."
 central.15.desc: "............"
 central.15.a: "Họ cắt đứt truyền tin rồi sao?"
 central.20.name: "$NAME_Central_Crystal_Country$"
 central.20.1.desc: "Các ngươi còn điều gì muốn thảo luận với chúng ta không?"
 central.20.2.desc: "Ngươi đang đứng trước chỉ huy hạm đội ngoại vi của Đế quốc Tinh thể, người bảo vệ vùng nội biên. Ngươi muốn thảo luận điều gì?"
 central.20.a: "Có thể kể thêm cho chúng tôi về quê hương của các ngài không?"
 central.20.a.response: "Quê hương chúng ta như bọt nước hư ảo, nếu nói quá nhiều sẽ mang đến sự tận diệt cho nó. Những chủng tộc non trẻ như các ngươi còn nhiều điều phải học trước khi được phép bước chân vào thánh địa đó.\n\nNếu chứng minh được giá trị, một ngày nào đó chúng ta sẽ hé lộ chân lý cho các ngươi."
 central.20.b: "Tại sao các ngài lại xuất hiện?"
 central.20.b.response: "Chúng ta đã quan sát các chủng tộc trong thiên hà từ lâu và thấy tiềm năng ở những người hàng xóm mới. Khi nhận được tin có một chủng tộc chính là kẻ chúng ta đang chờ đợi, chúng ta đã xuất hiện ngay.\n\nChưa rõ ai trong số các ngươi là kẻ đó, nhưng chúng ta tin các ngươi đều có khả năng chứng minh bản thân. Đừng làm chúng ta thất vọng."
 central.20.c: "Có điều gì các ngài đang tìm kiếm, hoặc cần chúng tôi giúp đỡ không?"
 central.20.c.response: "Chưa phải lúc. Chúng ta sẽ quay lại sau, hy vọng khi đó có thể chia sẻ nhiều hơn."
 central.20.d: "Vậy thôi."
 central.21.desc: "Tạm biệt, lũ khủng bố, chúng ta không có gì để nói với các ngươi."
 central.21.a: "……"
 central.50.desc: "Một số thành phần bất hảo trong xã hội chúng ta đang gây rối tại thủ đô. Thực thể vĩ đại định chuyển họ ra thế giới bên ngoài để không đe dọa đến sự hài hòa nội tại.\n\nSẽ là một sự giúp đỡ lớn nếu các ngươi chấp nhận những kẻ bị lưu đày này."
 central.50.a: "Chúng tôi sẽ cố gắng tìm chỗ ở cho họ."
 central.50.a.tt: "Trong vòng §Y10 năm§! tới, chúng ta có thể thực hiện quyết sách §Y$decision_crystalline_refugees$§! trên một §YTrạm cư trú§!."
 central.50.b: "Lãnh thổ của chúng tôi không còn chỗ trống."
 central.quest.transmission.end: "Còn điều gì khác các ngươi muốn thảo luận không?"
 crystalline_hostility_trigger_tt: "£trigger_no£§Y$NAME_Central_Crystal_Country$§! đang thù địch với chúng ta."
 central.51.desc: "Rất vui khi nghe điều đó. Hy vọng họ sẽ sống tốt và đóng góp cho đế chế của các ngươi.\n\n$central.quest.transmission.end$"
 central.51.a: "Vâng, chúng tôi còn việc khác."
 central.51.b: "Không, vậy là đủ rồi."
 central.52.desc: "Thật đáng tiếc. Vậy chúng ta sẽ tìm nơi khác cho họ.\n\n$central.quest.transmission.end$"
 central.60.desc: "Chúng ta vừa gặp một thảm họa nhỏ tại một trong những thành phố lớn nhất. Để phục hồi, chúng ta cần sự đóng góp tài nguyên từ các ngươi. Đương nhiên, chúng ta sẽ trả thù lao xứng đáng và cử đội kỹ sư đến chia sẻ bí mật kiến trúc."
 central.60.a: "Chúng tôi có thể trích ra một phần tài nguyên giúp đỡ."
 central.60.a.tt: "Trong vòng §Y10 năm§! tới, chúng ta có thể thực hiện quyết sách §Y$decision_crystalline_architecture$§! trên một §YTrạm cư trú§!."
 central.60.b: "Chúng tôi hiện không dư dả."
 central.61.desc: "Rất cảm kích trước sự giúp đỡ của các ngươi. Món quà này sẽ cứu giúp hàng triệu người $NAME_Central_Crystal_Species$.\n\n$central.quest.transmission.end$"
 central.62.desc: "Thật tiếc vì các ngươi không giúp đỡ. Chúng ta đành tìm nơi khác vậy.\n\n$central.quest.transmission.end$"
 central.70.desc: "Một quan chức khoa học cấp cao của chúng ta rất quan tâm đến đế chế của các ngươi. Họ muốn di cư sang nước các ngươi để học hỏi từ những người xuất chúng nhất."
 central.70.a: "Chúng tôi đã có vị trí thích hợp cho họ."
 central.70.a.tt: "§YQuan chức khoa học§! §H$NAME_Central_Crystal_Species$§! sẽ di cư đến §Y[Root.GetName]§!."
 central.70.b: "Ở đây không có chỗ cho họ."
 central.71.desc: "Tin tốt. Hy vọng họ đóng góp cho các ngươi nhiều hơn là ở đây.\n\n$central.quest.transmission.end$"
 central.72.desc: "Vậy họ phải tìm việc khác để làm rồi.\n\n$central.quest.transmission.end$"
 colony.9000.name: "Mặt đất không ổn định"
 colony.9000.desc: "Chúng ta gặp một tình huống kỳ lạ trên [Root.GetName]: hóa ra chúng ta đã định cư trên lưng những sinh vật lưỡng cư khổng lồ với lớp vỏ khoáng vật đặc biệt. Cư dân gọi chúng là “§YNemma§!”. Chúng có vẻ vô hại và chưa nhận ra sự hiện diện của chúng ta do chúng ta chưa khoan sâu vào lớp vỏ."
 colony.9000.a: "Tiếp tục đi."
 colony.9000.a.turtle: "Trông chúng... thật thân thiện."
 colony.9005.name: "Khám phá liều lĩnh"
 colony.9005.desc: "Một nhóm thanh thiếu niên trên [Root.GetName] đã bày ra trò chơi thi xem ai tiếp cận được đầu của Nemma. Không may, con thú bị giật mình và hất văng họ xuống, gây ra nhiều thương vong. Cư dân hiện yêu cầu phải có biện pháp đối phó với những \"quái thú hung bạo\" này."
 colony.9005.desc.gestalt: "Nemma tỏ ra khó chịu với các máy bay không người lái tiếp cận vùng đầu của nó. Nó đã hất văng nhiều cá thể [Root.Owner.GetSpeciesNamePlural] gây tổn thất. Cần có biện pháp xử lý để không ảnh hưởng đến tiến độ."
 colony.9005.a: "Phải hành động thôi."
 colony.9005.b: "Cứ để bọn trẻ chơi đùa đi."
 colony.9005.b.gestalt: "Chúng ta sẽ cố gắng tránh kích động chúng trong tương lai."
 colony.9010.name: "Biệt đội Nemma"
 colony.9010.desc: "Các nhà sinh học và kỹ sư đã đưa ra nhiều đề xuất để giải quyết vấn đề Nemma trên [Root.GetName], từ ôn hòa đến cực đoan."
 colony.9010.a: "Nhân giống thêm Nemma và bảo vệ họ để có thêm không gian sống."
 colony.9010.b: "Nô dịch Nemma để phục vụ chúng ta."
 colony.9010.c: "Đủ rồi! Hãy khoan sâu vào vỏ của chúng để lấy tài nguyên."
 colony.9010.d: "Dọn dẹp sạch sẽ lũ sinh vật này đi."
 colony.9015.name: "Mở rộng quần đảo"
 colony.9015.desc: "Chúng ta đã thiết lập hệ thống nhân giống Nemma trên [Root.GetName]. Tuy nhiên hành tinh chỉ có thể chứa thêm 3 đến 4 con nữa. Phải mất khoảng §Ymười năm§! để có con tiếp theo."
 colony.9015.a: "Vậy hãy bắt đầu nhân giống thôi!"
 colony.9020.name: "Điều kỳ diệu của sự sống"
 colony.9020.desc: "Kế hoạch nhân giống đã thành công, một con Nemma non đã gia nhập hạm đội! Nó thích nghi nhanh và đã sẵn sàng để gánh vác các khu công nghiệp của chúng ta."
 colony.9020.desc.full: "$colony.9020.desc$\n\nTuy nhiên, hành tinh đã đạt giới hạn chịu tải. Đây là con Nemma cuối cùng có thể sinh thêm. Giờ chúng ta cần tập trung bảo trì những cá thể đang có."
 colony.9020.a: "Thật đáng kinh ngạc! Làm lại lần nữa xem nào!"
 colony.9020.b: "Mọi người làm tốt lắm."
 colony.9020.b.gestalt: "Một kết quả mỹ mãn cho dự án này."
 colony.9025.name: "Quá tải môi trường"
 colony.9025.desc: "Đáng tiếc là nỗ lực nhân giống thêm Nemma đã thất bại do không còn đủ không gian sống cho sinh vật khổng lồ như vậy. Nhưng các nhà khoa học hứa sẽ có kết quả tốt hơn trong tương lai."
 colony.9025.a: "Hãy thử lại lần nữa."
 colony.9030.name: "Cưỡng chế phục tùng"
 colony.9030.desc: "Chúng ta đã khuất phục được Nemma! Giờ đây chúng trở thành những con thú thồ hàng cao cấp nhất, mang vác lượng vật liệu khổng lồ theo lộ trình tối ưu được điều khiển bởi thiết bị cấy ghép thần kinh. Tốc độ thuộc địa hóa đã tăng vọt."
 colony.9030.a: "Tuyệt vời, giờ hãy bắt tay vào việc chính thôi."
 colony.9035.name: "Những người ôm Nemma"
 colony.9035.desc: "Biểu tình nổ ra trên [Root.GetName] phản đối việc đối xử tệ bạc với Nemma. Họ lập hàng rào người quanh đầu Nemma — nơi đặt thủ phủ — yêu cầu trả tự do cho chúng. Xung đột giữa phe ủng hộ và phe phản đối đang leo thang có nguy cơ dẫn đến bạo lực."
 colony.9035.a: "Chuyển sang kế hoạch nhân giống."
 colony.9035.b: "Bắt giữ những kẻ xúi giục và bắt họ đi quét đường."
 colony.9040.name: "Khai quật lớp vỏ"
 colony.9040.desc: "Với các mũi khoan siêu chính xác và dược phẩm mới, chúng ta có thể khai thác khoáng sản và sinh khối từ vỏ tinh thể của Nemma mà không làm hỏng hạ tầng bên trên. Đây là nguồn tài nguyên độc nhất vô nhị."
 colony.9045.name: "Xóa sổ lũ bò sát"
 colony.9045.desc: "Việc thanh trừng Nemma đã hoàn tất một cách hệ thống, không gây ô nhiễm đại dương hay hỏng hạ tầng. Giờ chúng ta có thể tận dụng xác của chúng để xây dựng thêm các thuộc địa vĩnh viễn trên [Root.GetName]."
 colony.9045.a: "Đây là cách tốt nhất để xử lý lũ thú không não này."
 colony.9950.name: "Lỗ thông tầng bình lưu"
 colony.9950.desc: "Sau khi thuộc địa ổn định, các nhà khoa học chú ý đến những cột tháp cao vút trên §Y[planet.GetName]§!. Những tháp khoáng vật này rỗng ruột, dẫn khí từ lòng đất lên tận tầng nhiệt. Khí này thu hút Tiyanki và các sinh vật không gian khác tìm đến. Chúng ta có thể nghiên cứu hoặc tìm cách thu thập loại khí hiếm này."
 colony.9950.a: "Nghiên cứu các lỗ thông khí này."
 colony.9950.b: "Chúng ta không có thời gian cho việc đó."
 colony.9955.name: "Hoàn tất nghiên cứu lỗ thông tầng bình lưu"
 colony.9955.desc: "Các lỗ thông khí được hình thành từ khí nóng lắng đọng qua hàng triệu năm. Khí thoát ra được các đàn Tiyanki ăn. Chúng ta có thể dùng nơi này làm khu tham quan nghiên cứu hoặc cải tạo thành trạm tinh luyện khí hiếm, nhưng sẽ phải đuổi lũ sinh vật kia đi."
 colony.9955.a: "Dùng cho tham quan và nghiên cứu."
 colony.9955.b: "Cải tạo thành nơi tinh luyện khí."
 colony.9960.name: "Đài quan sát lỗ thông tầng bình lưu"
 colony.9960.desc: "Xây dựng các đài quan sát sang trọng giúp tăng trải nghiệm du lịch trên §Y[planet.GetName]§!. Du khách có thể tiếp cận gần Tiyanki, thậm chí tham gia các chuyến thám hiểm lấy mẫu khoa học hoặc trải nghiệm cảm giác bước lên cơ thể Tiyanki sống!"
 colony.9960.a: "Xây dựng đài quan sát."
 colony.9960.b: "Những tài nguyên này còn có việc khác cần hơn."
 colony.9965.name: "Mở rộng lỗ thông tầng bình lưu"
 colony.9965.desc: "Kỹ sư đề xuất dùng thuốc nổ để mở rộng lỗ thông nhằm khai thác tối đa lượng khí ngầm. Dù có rủi ro sập lỗ thông nhưng lợi ích mang lại là rất lớn."
 colony.9965.a: "Đặt thuốc nổ!"
 colony.9965.b: "Không đáng để mạo hiểm."
 colony.9965.c: "Để Hiệp hội xử lý việc này."
 colony.9970.name: "Mở rộng lỗ thông thành công"
 colony.9970.desc: "Kế hoạch thành công, sản lượng khí tăng vọt. Dù vài lỗ thông yếu bị sập gây hư hại nhẹ cho công trình, nhưng nhìn chung chúng ta đã chế ngự được thiên nhiên để thu lợi."
 colony.9975.name: "Mở rộng lỗ thông thất bại"
 colony.9975.desc: "Sai sót trong tính toán khiến nhiều lỗ thông sụp đổ, gây thiệt hại nặng cho cơ sở hạ tầng. Tuy nhiên, đống đổ nát lại làm lộ ra những mỏ khoáng sản bất ngờ. Dù sao thì, muốn xây dựng văn minh tinh hà cũng phải chấp nhận đánh đổi."
 nemma_world_chain_title: "Hành tinh Nemma"
 nemma_world_chain_desc: "Những con Nemma khổng lồ sống trên hành tinh của chúng ta, nơi chúng ta đã xây dựng nền móng thuộc địa trên lưng chúng. Chúng ta sẽ quyết định số phận của chúng."
 stratovent_researcher: "$job_stratovent_researcher$"
 job_stratovent_researcher: "Nghiên cứu viên lỗ thông"
 job_stratovent_researcher_with_icon: "£job_xeno_zoo_keeper£$job_stratovent_researcher$"
 job_stratovent_researcher_plural: "Nghiên cứu viên lỗ thông"
 job_stratovent_researcher_plural_with_icon: "£job_xeno_zoo_keeper£$job_stratovent_researcher_plural$"
 job_stratovent_researcher_desc: "Chuyên trách hướng dẫn du khách và nghiên cứu sinh vật không gian."
 biologist_is_vent_researcher_tt: "Chuyển đổi $job_biologist_plural_with_icon$ thành $job_stratovent_researcher_plural_with_icon$"
 job_stratovent_refiner: "Thợ tinh luyện lỗ thông"
 job_stratovent_refiner_plural: "Thợ tinh luyện lỗ thông"
 job_stratovent_refiner_desc: "Chuyên trách thu thập và tinh luyện khí quý hiếm từ các lỗ thông tầng bình lưu."
 job_stratovent_refiner_upg: "Thợ tinh luyện lỗ thông mở rộng"
 job_stratovent_refiner_upg_plural: "Thợ tinh luyện lỗ thông mở rộng"
 job_stratovent_refiner_upg_desc: "Chuyên trách nghiên cứu sinh vật không gian và hướng dẫn quy tắc tham quan cho du khách."
 job_stratovent_refiner_minerals: "Thợ tinh luyện lỗ thông sập"
 job_stratovent_refiner_minerals_plural: "Thợ tinh luyện lỗ thông sập"
 job_stratovent_refiner_minerals_desc: "Chuyên trách thu thập và tinh luyện khí từ các lỗ thông đã bị sụp đổ."
 mod_job_stratovent_researcher_add: "Nghề Nghiên cứu viên lỗ thông"
 mod_job_stratovent_refiner_add: "Nghề Nghiên cứu viên lỗ thông"
 mod_job_stratovent_refiner_upg_add: "Nghề Thợ tinh luyện lỗ thông mở rộng"
 mod_job_stratovent_refiner_minerals_add: "Nghề Thợ tinh luyện lỗ thông sập"
 stratovent_world_chain_title: "Lỗ thông tầng bình lưu"
 stratovent_world_chain_desc: "Chúng ta có thể thu được nguồn tài nguyên phong phú từ các lỗ thông tự nhiên phun khí vào không gian. Giờ là lúc quyết định cách xử lý chúng."
 #Arc Sites
 broken_world_digsite: "Cánh cổng hư tổn"
 broken_world_digsite_desc: "Phát hiện tín hiệu lạ tại một mái vòm bị hỏng trên [From.Planet.GetName]."
 site_tombworld_weapon_cache: "Kho vũ khí"
 site_tombworld_weapon_cache_desc: "Phát hiện một kho chứa kiên cố dưới mặt đất vỡ nát của [From.Planet.GetName]. Thật ngạc nhiên khi nó vẫn nguyên vẹn sau bao năm trong vùng đất chết đầy phóng xạ này."
 #Messages
 MESSAGE_HYPERDRIVE_SECURED_TITLE: "Đảm bảo động cơ siêu không gian"
 MESSAGE_HYPERDRIVE_SECURED: "Đội ngũ của chúng ta dự định quét sạch lũ chân khớp này và rời khỏi khu vực nghiên cứu."
 #Modifiers
 the_lonely_bot_welcome: "Bàn tay trợ giúp"
 the_lonely_bot_welcome_desc: "Chú robot nhỏ trên hành tinh này đã nỗ lực hết mình để giúp cư dân ổn định cuộc sống."
 eldritch_horror_mod: "Kiến thức quái dị"
 eldritch_horror_mod_desc: "Kiến thức do một thực thể kỳ quái ban cho đế chế. Đổi lại, nó lấy đi một phần nhỏ dân số của chúng ta."
 crystalline_architecture_mod: "Kiến trúc tinh thể"
 crystalline_architecture_mod_desc: "Cải thiện bố cục giúp mở rộng thêm không gian sống cho cư dân trạm cư trú."
 nanite_swarm_modifier: "Bầy đàn Nanite"
 nanite_swarm_modifier_desc: "Hành tinh đầy rẫy máy móc nano tấn công bất cứ thứ gì xâm nhập — dù là sinh học hay máy móc."
 tamed_nanite_swarm_modifier: "Bầy đàn Nanite đã thuần hóa"
 tamed_nanite_swarm_modifier_desc: "Bầy Nanite tự tiến hóa đã được thuần hóa và đang hỗ trợ đắc lực cho đời sống cư dân."
 new_resonance_music_art: "Nghệ thuật cộng hưởng"
 new_resonance_study: "Nghiên cứu cộng hưởng mới"
 turtle_world_modifier: "Hòn đảo di động"
 turtle_world_modifier_desc: "Những thứ vốn tưởng là đảo thực chất là lưng của các loài bò sát khổng lồ. Việc này khiến cư dân gặp nhiều khó khăn khi phải di dời nhà cửa."
 turtle_world_modifier_alone: "Trên lưng Nemma"
 turtle_world_modifier_alone_desc: "$turtle_world_modifier_desc$ Cư dân quyết định chung sống cùng chúng."
 turtle_world_slaves_modifier: "Nô dịch Nemma"
 turtle_world_slaves_modifier_desc: "Hành tinh này nô dịch lũ Nemma khổng lồ để tối ưu hóa việc khai thác tài nguyên."
 embraced_turtle_slavery_modifier: "Thực thi nô dịch Nemma"
 embraced_turtle_slavery_modifier_desc: "Việc nô dịch Nemma giúp tăng cường sự chấp nhận đối với chế độ nô lệ trên diện rộng."
 asteroid_relay_stations: "Trạm chuyển tiếp tiểu hành tinh"
 asteroid_relay_stations_desc: "Đế chế đặt cảm biến trong các tiểu hành tinh lân cận để mở rộng phạm vi dò tìm."
 asteroid_encryption: "Mã hóa tiểu hành tinh"
 asteroid_encryption_desc: "Sử dụng công nghệ mã hóa cổ đại từ các trạm chuyển tiếp bỏ hoang để bảo vệ bí mật quốc gia."
 #Names
 gas_cascade_sad: "Vô tình gây diệt chủng"
 gas_cascade_sad_desc: "Đế chế đang mặc niệm vì vô tình gây ra sự tuyệt chủng của cả một hệ sinh thái."
 gas_cascade_happy: "Giải tỏa đạo đức"
 gas_cascade_happy_desc: "Sau khi khắc phục hậu quả diệt chủng, đế chế đã đưa mọi thứ trở lại quỹ đạo. Thời kỳ mặc niệm giờ trở thành một lễ hội."
 unexplained_insights: "Manh mối không lời giải"
 unexplained_insights_desc: "Đế chế nhận được các chỉ dẫn về việc nên nghiên cứu cái gì và nghiên cứu như thế nào."
 closed_loop: "Đóng vòng lặp"
 closed_loop_desc: "Đế chế đã đóng vòng lặp và được giải thoát."
 asteroid_thrusters: "Động cơ tiểu hành tinh"
 asteroid_thrusters_desc: "Sử dụng động cơ cổ đại dành cho tiểu hành tinh giúp đế chế di chuyển nhanh hơn."
 #Names
 NAME_Eldritch_Horror: "Kinh Hoàng Viễn Cổ"
 NAME_The_Outer_Gate: "Ngoại Môn"
 NAME_Snow_Crystal: "Tuyết Tinh Thể"
 NAME_Central_Crystal_Country: "Thanh Tinh Chi Quốc"
 NAME_Central_Crystal_Species: "Xe-ay-a-ki"
