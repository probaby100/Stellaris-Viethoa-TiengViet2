 #Intemporal Orb
 INTEMPORAL_ORB_CAT: "Thiên thể hình cầu"
 INTEMPORAL_ORB_CAT_DESC: "Chúng ta phát hiện tín hiệu năng lượng mật độ cao có dạng hình cầu. Đề xuất điều tra sâu hơn."
 ## Event: Concentrated Energy
 anomaly.7105.name: "Năng lượng nén"
 anomaly.7105.desc: "Nguồn gốc của các chỉ số năng lượng bất thường trên [From.GetName] được xác định là một quả cầu màu xanh nhỏ. Các [Owner.GetScientistPlural] báo cáo rằng cảm biến đã phát hiện các hạt tachyon có cực tính ngược bên trong nó.\n\nMặt đất quanh vật thể được khắc các ký hiệu, có lẽ do một nền văn minh cổ xưa để lại. Chưa rõ các ký hiệu này là chỉ dẫn hay cảnh báo.\n\nVẫn chưa thể dịch toàn bộ văn bản, nhưng một số ký hiệu dường như liên quan đến phép đo thời gian và vị trí tương đối của các thiên thể trong hệ sao [Solar_System.GetName]."
 anomaly.7105.a.standard: "Nghiên cứu quả cầu."
 anomaly.7105.a.devouring: "Ăn quả cầu."
 anomaly.7105.b: "Quá nguy hiểm, hãy rời đi!"
 ## Event: Local Time Reversal
 anomaly.7110.name: "Đảo ngược thời gian cục bộ"
 anomaly.7110.desc: "Quả cầu năng lượng xanh được tìm thấy trên [FromFrom.GetName] đã biến mất. Quét thực địa không thấy bất kỳ dấu vết nào của quả cầu. Kỳ lạ hơn, các ký hiệu trên mặt đất cũng biến mất không dấu vết, như thể chưa từng tồn tại.\n\nDựa trên tín hiệu tachyon bất thường, các [Owner.GetScientistPlural] suy luận rằng quả cầu và các ký hiệu đã cùng nhau quay ngược thời gian."
 ## Event: Timeless
 anomaly.7115.name: "Thời gian như dòng nước"
 ### Regular empires are non-gestalt empires with a non-robot scientist
 anomaly.7115.desc.regular: "Khi đang làm việc tại trạm trên [FromFrom.GetName], [Root.GetLeaderName] đã vô tình chạm vào quả cầu xanh.\n\n[leader.GetHeSheCap] sau đó kể lại đã thấy thời gian trải dài như một dòng sông, kết nối quá khứ và tương lai vô tận. Trước mắt [leader.GetHimHer], năng lượng xanh tuôn ra từ dòng thời gian và bị hút vào cơ thể [leader.GetHisHer]. Dù sự cố chỉ diễn ra chưa đầy một giây theo đồng hồ của các [Owner.GetScientistPlural], nhưng [leader.GetHeShe] cảm thấy như đã trôi qua hơn một giờ.\n\nSau khi ảo giác kết thúc, [Root.GetLeaderName] tin rằng thời gian không còn ảnh hưởng đến mình nữa. Với tuổi thọ vô tận, [leader.GetHeShe] muốn tự mình khám phá vũ trụ."
 ### Scientist is already immortal
 anomaly.7115.desc.immortal: "Khi đang làm việc tại trạm trên [FromFrom.GetName], thực tập sinh [Owner.GetScientist] [intemporal_leader.GetName] đã vô tình chạm vào quả cầu xanh.\n\n[intemporal_leader.GetHeSheCap] kể lại đã thấy thời gian như một dòng sông vô tận. Năng lượng xanh tuôn ra và được hấp thụ vào cơ thể [intemporal_leader.GetHimHer]. Dù chỉ diễn ra trong tích tắc, [intemporal_leader.GetHeShe] cảm thấy như đã qua cả tiếng đồng hồ.\n\nSau đó, [intemporal_leader.GetName] tin rằng mình đã thoát khỏi sự kìm kẹp của thời gian và muốn dùng tuổi thọ vô hạn để khám phá vũ trụ."
 ### Empire is a gestalt consciousness (hive or machine intelligence)
 anomaly.7115.desc.hive: "Khi đang làm việc trên [FromFrom.GetName], [Root.GetLeaderName] đã vô tình chạm vào quả cầu xanh.\n\n[leader.GetHeSheCap] nhận được hình ảnh thời gian như một dòng sông kết nối quá khứ và tương lai. Năng lượng xanh đã được hấp thụ vào cơ thể [leader.GetHimHer]. Dù chỉ diễn ra trong chớp mắt, [leader.GetHeShe] cảm thấy như đã trôi qua một giờ.\n\nChúng ta xác nhận thời gian không còn ảnh hưởng đến [Root.GetLeaderName] nữa. Với tuổi thọ vô hạn của [leader.GetHimHer], chúng ta có thể để cá thể này tự mình khám phá vũ trụ."
 ### Empire is devouring swarm
 anomaly.7115.desc.devouring: "[Root.GetLeaderName] đã ăn quả cầu trên [FromFrom.GetName].\n\n[leader.GetHeSheCap] nhận được hình ảnh thời gian như một dòng sông vô tận. Năng lượng xanh được hấp thụ vào cơ thể [leader.GetHimHer]. Dù chỉ diễn ra trong tích tắc, [leader.GetHeShe] cảm thấy như đã qua một giờ.\n\nChúng ta xác nhận thời gian không còn ảnh hưởng đến [Root.GetLeaderName] nữa. Với tuổi thọ vô hạn này, chúng ta có thể để cá thể này tự mình khám phá vũ trụ."
 anomaly.7115.a: "Được rồi, thượng lộ bình an!"
 anomaly.7115.a.regular.tt: "[intemporal_leader.GetName] nhận được một tàu nhỏ để du hành không gian một mình.\nCần chỉ định một §HNhà khoa học§! mới để điều hành [From.GetName]."
 anomaly.7115.a.immortal.tt: "[intemporal_leader.GetName] nhận được một tàu nhỏ để du hành không gian một mình."
 anomaly.7115.b.regular: "Không, hãy ở lại vị trí của bạn."
 anomaly.7115.b.immortal: "Không, bạn đã được thăng chức."
 anomaly.7115.b.regular.tt: "[intemporal_leader.GetName] tiếp tục công việc tại trạm."
 anomaly.7115.b.immortal.tt: "[intemporal_leader.GetName] trở thành một §HNhà khoa học§! mới."
 ## Event: The Return
 anomaly.7120.name: "Trở về"
 anomaly.7120.desc.regular: "Máy quét tầm xa phát hiện một con tàu đang hướng về [Root.Capital.GetName]. Khi nó đến gần, chúng ta nhận ra thiết kế của nó y hệt các tàu của chúng ta một thế kỷ trước.\n\nSau khi kết nối liên lạc, chúng ta phát hiện người điều khiển là [intemporal_explorer.GetName], chính là nhà khoa học đã bị quả cầu xanh đưa đi.\n\n[intemporal_explorer.GetHeSheCap] đã du ngoạn quanh các sao nơ-tron va chạm và những hố đen đảo ngược thời gian trước khi quay về. Đáng chú ý là các nhà vật lý xác nhận thông tin ông mang về không chỉ đáng tin mà còn mang tính đột phá.\n\nCơ thể của [intemporal_explorer.GetName] dường như không hề già đi, ngay cả công nghệ hiện đại nhất cũng không giải thích nổi chức năng quả cầu đó. [intemporal_explorer.GetHeShe] đã thoát khỏi cái chết tự nhiên và sẽ tiếp tục khám phá vũ trụ cho đến ngày tận thế."
 anomaly.7120.desc.hive: "Máy quét tầm xa phát hiện một con tàu hướng về [Root.Capital.GetName] với thiết kế từ một thế kỷ trước. Người điều khiển là [intemporal_explorer.GetName], nhà khoa học đã biến mất cùng quả cầu xanh.\n\nCá thể này đã kết nối lại với chúng ta, truyền tải kiến thức về các sao nơ-tron và hố đen vào Ý chí Trung tâm. Sau đó con tàu lại rời đi. Các [Owner.GetScientistPlural] xác nhận những thông tin này có giá trị khoa học cực lớn.\n\n[intemporal_explorer.GetName] dường như bất tử trước thời gian. Cá thể này sẽ tiếp tục hành trình khám phá cho đến tận cùng của thời gian."
 DATA_DIAMOND_CAT: "Băng mỏng"
 DATA_DIAMOND_CAT_DESC: "Tầng trên cùng của lớp băng bề mặt [From.GetName] được bao phủ bởi những trầm tích tinh thể khổng lồ bất thường. Chúng ta cũng phát hiện một tín hiệu yếu phát ra từ đó."
 DATA_DIAMOND_PROJECT: "Nghiên cứu trầm tích tinh thể [From.GetName]"
 DATA_DIAMOND_PROJECT_DESC: "Tín hiệu gây nhiễu từ các tinh thể trên [From.GetName] rất đáng ngờ. Đề xuất nghiên cứu thêm."
 anomaly.3145.name: "Ảo giác khoan đào"
 anomaly.3145.desc: "Ngay khi bắt đầu hoạt động khoan trên [From.GetName], [Root.GetLeaderName] đã gặp ảo giác mạnh. Dù không bị thương tích về thể chất, họ báo cáo đã bị choáng ngợp bởi những hình ảnh và mùi hương rời rạc về một chủng tộc ngoại hành tinh chưa từng biết.\n\nMột dự án đặc biệt đã được thiết lập để điều tra thêm về những kho tinh thể kỳ lạ này."
 anomaly.3145.a: "Thật đáng lo ngại."
 anomaly.3150.name: "Kim cương dữ liệu"
 anomaly.3150.desc: "Dưới lớp băng, các tinh thể cấu thành nên phần lớn vật chất của hành tinh. Phân tích mẫu vật cho thấy một cấu trúc mạng tinh thể nhân tạo dùng để lưu trữ dữ liệu với mật độ cực cao. Ước tính lượng dữ liệu này lớn hơn toàn bộ cơ sở dữ liệu tập thể của chúng ta.\n\nCó vẻ những người tạo ra nó đã dùng cộng hưởng tâm linh để ghi dữ liệu. [Root.GetLeaderName] rất tò mò và xin phép xây dựng một trạm nghiên cứu tự động trên bề mặt."
 anomaly.3150.a: "Chỉ nghiên cứu từ quỹ đạo là đủ rồi."
 anomaly.3150.b: "Chúc may mắn dưới mặt đất, [Root.GetLeaderName]."
 anomaly.3150.c: "Khai thác tinh thể như một nguồn tài nguyên."
 anomaly.3165.name: "Cơ hội không thể bỏ lỡ"
 anomaly.3165.desc: "Khi trạm nghiên cứu sắp hoàn thành, các tinh thể đột ngột giải phóng một luồng năng lượng cực mạnh, khiến [Root.GetLeaderName] tử vong tại chỗ. Ngay sau đó, chúng ta nhận được một tin nhắn tự động tự xưng là từ họ.\n\nDù cơ thể sinh học đã chết, nhưng ý thức của họ đã bị kẹt lại trong tinh thể. Với trạng thái mới này, họ có thể giúp chúng ta thâm nhập vào cơ sở dữ liệu tinh thể để nghiên cứu sâu hơn trong tương lai."
 anomaly.3165.a: "Một kết quả buồn vui lẫn lộn."
 anomaly.3150.a.tooltip: "Sẽ có thêm một điểm khai thác nghiên cứu nhỏ trên [FromFromFrom.GetName]."
 anomaly.3150.b.tooltip: "Sẽ có thêm một điểm khai thác nghiên cứu lớn trên [FromFromFrom.GetName], nhưng có thể gây nguy hiểm cho [Root.GetLeaderName]."
 anomaly.3150.c.tooltip: "Sẽ có thêm một mỏ tinh thể hiếm trên [FromFromFrom.GetName], có thể khai thác sau khi nghiên cứu công nghệ tương ứng."
 ###Event: Holding Pattern
 #Modifiers
 reassured_tracking: "Kết quả giám sát khả quan"
 reassured_tracking_desc: "Hệ thống theo dõi tích hợp đang giám sát dân số. Dù nỗi lo âu vẫn còn, nhưng việc biết rằng có người đang giải quyết vấn đề đã giúp thuộc địa ổn định lại."
 collective_autophobia: "Chứng sợ cô độc tập thể"
 collective_autophobia_desc: "Một nỗi sợ mất tích bao trùm thuộc địa. Mong muốn được ở gần nhau đã ảnh hưởng đến hiệu quả công việc hàng ngày."
 freed_stasis_criminals: "Tội phạm ngoan cố được thả"
 freed_stasis_criminals_desc: "Đa số tù nhân được thả là tội phạm tái phạm. Cú sốc văn hóa khiến họ khó hòa nhập, dẫn đến tỷ lệ tội phạm tăng cao."
 freed_stasis_dissidents: "Người bất đồng chính kiến được thả"
 freed_stasis_dissidents_desc: "Hầu hết tù nhân là những người bất đồng chính kiến, họ đang tích cực truyền bá nghệ thuật và văn hóa của mình."
 #Events
 colony.9900.name: "Vắng mặt ca sáng"
 colony.9900.desc: "Gần đây, trên [Root.GetName] xảy ra hàng loạt vụ mất tích. Điểm chung duy nhất là họ đều mất tích khi ở một mình. Nỗi sợ hãi bắt đầu lan rộng, gây ảnh hưởng nghiêm trọng đến các hoạt động thường nhật của thuộc địa."
 colony.9900.a: "Triển khai dự án cấy chip theo dõi."
 colony.9900.a.tooltip: "§Y100§! £pop£ dân cư trên [Root.GetName] đã biến mất. Chúng ta sẽ triển khai hệ thống giám sát đắt đỏ để giải mã bí ẩn này."
 colony.9900.b: "Không cần phải hoảng loạn."
 colony.9900.b.tooltip: "§Y100§! £pop£ dân cư trên [Root.GetName] đã biến mất."
 colony.9905.name: "Quét thành công"
 colony.9905.desc.a: "Nhờ hệ thống theo dõi trên [Root.GetName], chúng ta đã có manh mối quan trọng.\n\nTrong các vụ mất tích gần đây, chúng ta đã quét hiện trường ngay lập tức và tìm thấy vị trí cuối cùng của họ. Tại mỗi địa điểm, chúng ta đều phát hiện dư lượng hạt tích điện đang phân rã.\n\nMột dự án đặc biệt đã được lập ra để xác định bản chất của những hạt này và mối liên hệ của chúng với những người mất tích."
 colony.9905.desc.b: "Chúng ta đã có một bước tiến may mắn trên [Root.GetName]! Dấu vết của những người mất tích đã được tìm thấy. Quét chi tiết khu vực phát hiện dư lượng hạt tích điện đang phân rã.\n\nMột dự án đặc biệt đã được lập ra để tìm hiểu bản chất các hạt này."
 colony.9905.a: "Phải tìm hiểu cho bằng được."
 colony.9905.a.tooltip: "Lại có thêm một người nữa mất tích trên [Root.GetName]."
 colony.9910.name: "Chế độ chờ"
 colony.9910.desc: "Lần theo dấu vết, chúng ta đã quét toàn hệ sao và tìm thấy bằng chứng về các hạt đó trên mặt trăng của [Root.GetName].\n\nTại đó, chúng ta tìm thấy một trạm khí bị cát bụi vùi lấp hàng thế kỷ. Bên trong là một khu văn phòng hành chính bị bỏ hoang, một máy dịch chuyển vật chất tầm xa và hệ thống điều khiển lực trường kết nối với mạng lưới buồng ngủ đông cực kỳ tiên tiến.\n\nCác buồng này đang giam giữ nhiều cá thể, bao gồm cả những cư dân mất tích của chúng ta. Rõ ràng đây là một nhà tù. Chúng ta cần tìm hiểu lý do họ bị bắt và cách giải cứu."
 colony.9910.a: "Tuyệt vời"
 colony.9915.name: "Thoát khỏi mặt trăng"
 colony.9915.desc: "Sự thật không phải là một âm mưu, cư dân của chúng ta bị giam giữ do lỗi hệ thống.\n\nMột sự cố máy tính đã kích hoạt hệ thống dịch chuyển cũ kỹ, tự động chọn ngẫu nhiên vài cư dân của chúng ta làm \"tội phạm\". Những người xây dựng nơi này đã dùng các buồng ngủ đông để vừa giam giữ vừa tái giáo dục. Giải cứu người của chúng ta khá dễ, nhưng nhiều tù nhân khác vẫn bị kẹt. Chúng ta có thể thả họ, nhưng vì không có hồ sơ, chúng ta không biết họ đã phạm tội gì.\n\nHoặc chúng ta có thể sửa chữa nhà tù này và bổ nhiệm một cai ngục để kiểm soát hệ thống dịch chuyển."
 colony.9915.a: "Đây sẽ là nơi lý tưởng cho những kẻ ngỗ ngược."
 colony.9915.a.tooltip: "Những cư dân mất tích sẽ trở về. Chúng ta cũng sẽ có một Nhà tù Ngủ đông hoạt động được."
 colony.9915.b: "Không thể nhốt người trong một nhà tù như vậy."
 colony.9915.b.tooltip: "Dân cư mất tích sẽ trở về và chúng ta sẽ đóng cửa nhà tù này. Các tù nhân khác sẽ được thả, nhưng có thể gây tác động tiêu cực đến thuộc địa."
 colony.9915.c: "Thiết lập kế hoạch trả tự do dần dần."
 colony.9915.c.tooltip: "Chúng ta sẽ sàng lọc và hỗ trợ các tù nhân khi họ rời tù để đảm bảo sự chuyển giao êm đẹp cho thuộc địa."
 colony.9915.d: "Nhiều thịt tươi thế này sao? Tuyệt."
 colony.9915.d.tooltip: "Cư dân mất tích sẽ trở về. Chúng ta sẽ biến nhà tù này thành nhà máy thực phẩm, Tổ hợp sẽ được thưởng thức những món thịt tươi từ các tù nhân ngủ đông."
 colony.9920.name: "Láng giềng xấu"
 colony.9920.desc: "Đa số tù nhân được thả trên [Root.GetName] là những tên tội phạm nguy hiểm. Việc thả họ hàng loạt đang gây rắc rối cho thuộc địa."
 colony.9920.a: "Thật không may."
 colony.9925.name: "Thượng vàng hạ cám"
 colony.9925.desc: "Tù nhân được thả trên [Root.GetName] bao gồm cả tội phạm nguy hiểm lẫn những người bất đồng chính kiến: nghệ sĩ, nhà văn, nhạc sĩ...\n\nTrong khi những người làm văn hóa sẵn lòng chia sẻ kiến thức, thì nhiều tên tội phạm lại chứng nào tật nấy."
 colony.9925.a: "Đã rõ."
 colony.9930.name: "Láng giềng tốt"
 colony.9930.desc: "Hầu hết tù nhân được thả trên [Root.GetName] là những người bất đồng chính kiến có học thức.\n\nSau khi tự do, họ rất vui lòng chia sẻ văn hóa và kiến thức với chúng ta."
 colony.9930.a: "Rất tốt."
 #Scripted Loc
 colonist_key: "Cư dân thuộc địa"
 colonists_key: "Cư dân thuộc địa"
 #Deposit
 d_stasis_prison: "Nhà tù Ngủ đông"
 d_stasis_prison_desc: "Bên trong mặt trăng của hành tinh này là một khu phức hợp nhà tù bỏ hoang kết nối với mạng lưới buồng ngủ đông tiên tiến. Tù nhân bị nhốt bên trong không thể thoát ra."
 d_prisoner_intergration: "Tích hợp cấu trúc"
 d_prisoner_intergration_desc: "Thả tự do hàng loạt các tù nhân ngủ đông là một sai lầm. Chỉ bằng cách phân tích từng trường hợp, chúng ta mới đảm bảo họ hòa nhập hoàn toàn vào xã hội."
 d_meals_in_pods: "Tiệc tự chọn trong buồng"
 d_meals_in_pods_desc: "Những thứ được đông lạnh trong buồng này là nguồn thịt chế biến sẵn tuyệt hảo."
 #Special Project
 STASIS_PRISON_PROJECT: "Câu đố về các hạt"
 STASIS_PRISON_PROJECT_DESC: "Nhiều cư dân trên [Root.GetName] đã mất tích. Cuộc điều tra phát hiện dư lượng hạt tích điện lạ. Chúng ta sẽ dùng thông tin này để tìm kiếm họ."
 #Jobs
 job_stasis_warden: "Cai ngục Ngủ đông"
 job_stasis_warden_plural: "Cai ngục Ngủ đông"
 job_stasis_warden_desc: "Nhân viên vận hành nhà tù ngủ đông, đồng thời theo dõi các vụ mất tích của công dân."
