 mod_job_astrogarbage_collector_gestalt_per_pop_short: "\nMỗi $VALUE$ £pop£ §G+1§! £job_astrogarbage_collector_gestalt£"
 d_astrogarbage_collector: "Đơn vị thu gom rác vũ trụ"
 d_astrogarbage_collector_desc: "Bằng cách giảm lượng mảnh vỡ quỹ đạo, hành tinh này có thể duy trì khả năng lưu thông không gian."
 d_sprawling_landfill_blocker: "Bãi rác tràn lan"
 d_sprawling_landfill_blocker_desc: "Những núi rác khổng lồ đang tràn ra khỏi khu vực chôn lấp dự kiến với tốc độ chóng mặt."
 trash_rings: "Vành đai rác"
 trash_rings_desc: "Hành tinh này bị bao quanh bởi một vành đai rác thải không gian nhân tạo."
 ground_locked: "Vùng đất bị phong tỏa"
 ground_locked_desc: "Do hậu quả từ vụ va chạm mảnh vỡ nghiêm trọng trên quỹ đạo, không có tàu thuyền nào được phép ra vào cho đến khi có thông báo mới."
 clear_skies: "Trời quang mây tạnh"
 clear_skies_desc: "Các mảnh vỡ nguy hiểm vừa được dọn sạch khỏi bầu trời, người dân giờ có thể tự do ra vào hành tinh này."
 shooting_stars: "Sao băng"
 shooting_stars_desc: "Do các mảnh vỡ bốc cháy khi rơi xuống, hành tinh này thường xuyên xuất hiện mưa sao băng."
 ### MYRMEKU
 #Event Chain
 myrmeku_chain_title: "Kiến Myrmeku"
 myrmeku_chain_desc: "Các đàn côn trùng nhỏ bé đột ngột bùng phát, càn quét khắp bề mặt [myrmeku_planet.GetName]."
 #Deposit and Job
 d_myrmeku_power_farms: "Trang trại năng lượng Myrmeku"
 d_myrmeku_power_farms_desc: "Những sinh vật nhỏ bé này có thể tạo ra nguồn năng lượng mà chúng ta có thể khai thác."
 job_myrmeku_power_farmer: "Nông dân năng lượng Myrmeku"
 job_myrmeku_power_farmer_plural: "Nông dân năng lượng Myrmeku"
 job_myrmeku_power_farmer_desc: "Kỹ thuật viên chuyên chiết xuất năng lượng từ các đàn kiến Myrmeku."
 mod_job_myrmeku_power_farmer_add: "Vị trí $job_myrmeku_power_farmer$"
 mod_job_myrmeku_power_farmer_per_pop: "Mỗi $VALUE$ dân số cung cấp §G+1§! vị trí $job_myrmeku_power_farmer$"
 mod_job_myrmeku_power_farmer_per_pop_short: "\nMỗi $VALUE$ £pop£ §G+1§! [technician.GetIcon]"
 job_myrmeku_power_farmer_gestalt: "Drone năng lượng Myrmeku"
 job_myrmeku_power_farmer_gestalt_plural: "Drone năng lượng Myrmeku"
 job_myrmeku_power_farmer_gestalt_desc: "Ong thợ kỹ thuật thu thập năng lượng từ bầy kiến Myrmeku."
 mod_job_myrmeku_power_farmer_gestalt_add: "Vị trí $job_myrmeku_power_farmer_gestalt$"
 mod_job_myrmeku_power_farmer_gestalt_per_pop: "Mỗi $VALUE$ dân số cung cấp §G+1§! vị trí $job_myrmeku_power_farmer_gestalt$"
 mod_job_myrmeku_power_farmer_gestalt_per_pop_short: "\nMỗi $VALUE$ £pop£ §G+1§! [technician_drone.GetIcon]"
 #Planet Modifiers
 planet_myrmeku_attacks: "Kiến Myrmeku tấn công"
 planet_myrmeku_attacks_desc: "Cư dân đang bị lũ côn trùng nhỏ bé tấn công."
 planet_myrmeku_seal_colony: "$planet_myrmeku_attacks$"
 planet_myrmeku_seal_colony_desc: "Mọi công trình đều được áp dụng biện pháp bảo vệ đặc biệt để ngăn chặn sinh vật bản địa xâm nhập."
 planet_myrmeku_upgrade_robots: "$planet_myrmeku_attacks$"
 planet_myrmeku_upgrade_robots_desc: "Cư dân được thiết kế lại với lớp bảo vệ tăng cường cho các bộ phận cơ khí bên trong."
 planet_myrmeku_pest_control: "$planet_myrmeku_attacks$"
 planet_myrmeku_pest_control_desc: "Tiêu diệt bầy kiến trên bề mặt là nhiệm vụ ưu tiên hàng đầu."
 planet_myrmeku_lured: "Chuyển hướng nguồn lực"
 planet_myrmeku_lured_desc: "Vật liệu cách điện cho chip nhớ đã được phân phát khắp nơi."
 #Special Project
 MYRMEKU_STUDY_PROJECT: "Nghiên cứu kiến Myrmeku"
 MYRMEKU_STUDY_PROJECT_DESC: "Nghiên cứu bầy kiến trên [myrmeku_planet.GetName] để xem liệu hành vi hung hãn của chúng có thể chuyển hóa thành lợi ích hay không."
 #Events
 colony.9350.name: "Hoạt động của kiến Myrmeku"
 colony.9350.desc: "Ngay khi định cư trên §Y[Root.GetName]§!, chúng ta đã phát hiện rất nhiều sinh vật chân khớp. Cụ thể là một loài côn trùng nhỏ xây tổ theo đàn gọi là \"kiến Myrmeku\" xuất hiện với số lượng lớn bất thường.\n\nCác tổ ngầm của chúng rải rác khắp châu lục, nhưng cho đến nay vẫn chưa gây ra rắc rối gì. Hiện chưa rõ chúng đang tìm kiếm thứ gì trên bề mặt, hay đang chạy trốn điều gì đó dưới lòng đất."
 colony.9350.a.mem_vault: "Ghi chép về kiến Myrmeku vào Kho tri thức." #Civic Vaults of Knowledge
 colony.9350.a.exp_prot: "Đúng là những sinh vật kỳ thú." #Civic Exploration Protocols
 colony.9355.name: "Cư dân bị tấn công"
 colony.9355.desc: "Cư dân của chúng ta trên §Y[Root.GetName]§! đang bị tấn công dữ dội! Do ở quá gần tổ kiến Myrmeku, họ đã bị chúng bủa vây. Lũ côn trùng nhỏ bé này chui vào bên trong khung thân của các cư dân, khiến họ nhanh chóng bị vô hiệu hóa.\n\nNhững người gặp nạn bị tháo rời trong tích tắc, nhưng không có dữ liệu nào về mục đích của lũ kiến được ghi lại. Lớp vỏ kitin nhiễm từ của chúng gây nhiễu mạch điện nội bộ; khi hai con kiến chạm nhau, chúng tạo ra tia lửa điện nhỏ — cả hai trường hợp đều dẫn đến hỏng hóc hệ thống nghiêm trọng.\n\nViệc mất mát cư dân theo cách này đang làm chậm tiến độ phát triển của [Root.GetPlanetMoon]. Chúng ta phải hành động."
 colony.9355.a: "Tìm giải pháp."
 colony.9360.name: "Kẻ nuốt chửng ký ức"
 colony.9360.desc: "Lũ kiến Myrmeku đã xây dựng nhiều tổ lớn gần các khu định cư của chúng ta với tốc độ chóng mặt. Chúng không còn quanh quẩn bên ngoài mà bắt đầu xâm nhập vào các khu dân cư.\n\nPhẫu thuật giải phẫu hàng loạt cá thể kiến đã tiết lộ lý do đáng lo ngại: loài côn trùng này ăn vật liệu cách điện của §Ychip nhớ§!.\n\nThảm họa này chỉ mang tính tạm thời vì mạch ký ức có thể thay thế và khôi phục từ bản sao lưu. Tuy nhiên, việc thay thế linh kiện đang làm chậm quá trình chế tạo cư dân mới."
 colony.9360.a: "Phong tỏa thuộc địa."
 colony.9360.a.tt: "Tập trung bảo vệ các công trình.\n\nSửa đổi §Y$planet_myrmeku_attacks$§! thành:\nTốc độ lắp ráp dân số máy móc: §R-10%§!\nTốc độ xây dựng hạ tầng hành tinh: §R-10%§!"
 colony.9360.b: "Nâng cấp cơ thể."
 colony.9360.b.tt: "Tập trung bảo vệ cư dân.\n\nSửa đổi §Y$planet_myrmeku_attacks$§! thành:\nTốc độ lắp ráp dân số máy móc: §R-10%§!\nChi phí duy trì Robot: §R+10%§!"
 colony.9360.c: "Tiêu diệt các đàn kiến Myrmeku."
 colony.9360.c.tt: "Tấn công là cách phòng thủ tốt nhất.\n\nSửa đổi §Y$planet_myrmeku_attacks$§! thành:\nTốc độ lắp ráp dân số máy móc: §R-30%§!\n\n"
 colony.9360.d.org_repro: "Bắt giữ lũ côn trùng này." #Civic Organic Reprocessing
 colony.9360.d.tt: "Chúng ta sẽ tìm ra cách sử dụng cho mọi sinh vật hữu cơ.\n\nSửa đổi §Y$planet_myrmeku_attacks$§! thành:\nTốc độ lắp ráp dân số máy móc: §R-30%§!\n\n"
 colony.9360.e.purifier: "Quét sạch mọi sự sống trên hành tinh này." #Civic Determined Exterminator
 colony.9360.e.tt: "Diệt tận gốc kiến Myrmeku."
 colony.9365.desc: "Kiểm soát dịch hại"
 colony.9365.desc.seal_colony: "Các công trình trên §Y[Root.GetName]§! đã được phong tỏa hoàn toàn để ngăn kiến Myrmeku.\n\nMọi lối vào đều được lắp các dải kim loại nhiễm từ để bắt kiến, nhưng các cư dân làm việc ngoài thực địa vẫn có nguy cơ bị tấn công."
 colony.9365.desc.upgrade_robots: "Bộ nâng cấp vỏ bọc bảo vệ chip nhớ đang được phát triển và thử nghiệm thực tế.\n\nĐáng tiếc là hàm của kiến Myrmeku đủ khỏe để nhai nát mọi vật liệu nếu chúng có đủ thời gian và quân số."
 colony.9365.desc.pest_control: "Để tiêu diệt kiến Myrmeku, chúng ta cử các đội tuần tra truy tìm tổ của chúng. Các cấu trúc trên bề mặt dễ dàng bị thiêu rụi hoặc phá hủy, nhưng tổ ngầm quá sâu nên không thể dọn sạch hoàn toàn.\n\nTrong quá trình thực hiện, chúng ta thậm chí còn mất thêm nhiều cư dân hơn."
 colony.9365.desc.harvest: "Để kiểm soát kiến Myrmeku, chúng ta xây các bẫy sinh học gần tổ của chúng. Việc thu hoạch trên bề mặt diễn ra thuận lợi, nhưng tổ ngầm quá sâu để có thể khai thác triệt để.\n\nChúng ta cũng chịu tổn thất thêm về cư dân trong quá trình này."
 colony.9365.a: "Chúng ta cần giải pháp tốt hơn."
 colony.9370.name: "Lựa chọn hạt nhân"
 colony.9370.desc: "Công tác chuẩn bị tiêu diệt mọi sinh vật hữu cơ trên §Y[Root.GetName]§! đã hoàn tất.\n\nTừ quỹ đạo, chúng ta có cơ hội chiêm ngưỡng sự thanh lọc các tạp chất hữu cơ trên bề mặt [Root.GetPlanetMoon]."
 colony.9370.a: "Thật tao nhã."
 colony.9375.name: "Đề xuất chương trình phân tích"
 colony.9375.desc: "Cho đến nay, nỗ lực giải quyết vấn đề kiến Myrmeku vẫn chưa thành công. Lũ côn trùng vẫn hoành hành khắp §Y[Root.GetName]§!, gây ảnh hưởng nghiêm trọng đến mọi hoạt động. Chương trình phân tích của chúng ta đã mô phỏng các kịch bản tương lai và đưa ra các phương án sau.\n\nPhương án A: Thả vật liệu cách điện chip nhớ xuống các khu vực xa thuộc địa để dụ kiến đi nơi khác, đồng thời thu hồi các cư dân bị hỏng.\n\nPhương án B: Nghiên cứu loài kiến Myrmeku để tìm cách biến bản tính hung hãn của chúng thành lợi ích."
 colony.9375.a: "Dụ chúng đi chỗ khác."
 colony.9375.a.tt: "Sửa đổi §Y$planet_myrmeku_attacks$§! thành:\nChi phí duy trì Robot: §R+5%§!\n\n"
 colony.9375.b: "Nghiên cứu chúng."
 colony.9380.name: "Kết quả khả quan"
 colony.9380.desc: "Nghiên cứu về kiến Myrmeku đã hoàn tất. Khi đặt các nam châm đã hiệu chuẩn gần lối vào tổ của chúng, lớp vỏ nhiễm từ của lũ côn trùng sẽ giải phóng điện năng mà chúng ta có thể tận dụng.\n\nNghiên cứu cũng chỉ ra rằng kiến Myrmeku di chuyển theo từ trường địa phương, vì vậy chỉ cần lắp vỏ bảo vệ khử từ cho chip nhớ là có thể tránh được các cuộc tấn công."
 colony.9380.a: "Tuyệt vời."
 ## Sự kiện: Khủng hoảng Băng hà
 colony.7230.name: "Khủng hoảng Băng hà"
 colony.7230.desc: "Báo cáo khí hậu mới nhất từ [planet.GetName] mang đến một kết luận đáng lo ngại. Kỳ lạ thay, nhiệt độ bề mặt trên hành tinh băng giá này đang tăng với tốc độ chóng mặt.\n\nNếu chúng ta không thể xác định nguyên nhân khiến hệ sinh thái suy thoái nhanh chóng, tình trạng này có thể dẫn đến việc các sông băng rộng lớn của hành tinh tan chảy thảm khốc."
 colony.7230.a: "Tìm nguyên nhân khiến hành tinh nóng lên."
 colony.7230.a.tooltip: "Điều gì có thể gây ra chuyện này?"
 colony.7230.b: "Không có gì đáng lo cả."
 colony.7235.name: "Vết nứt trong băng"
 colony.7235.desc: "Sự gia tăng nhiệt độ trên [flooding_planet.GetName] đang tăng tốc dữ dội. Điều này tạo ra những vết nứt khổng lồ bên dưới lớp bề mặt băng giá, hé lộ một đại dương ngầm rộng lớn.\n\nMay mắn thay, cuộc điều tra của chúng ta đã xác định được nguyên nhân tiềm tàng của hiện tượng này. Do sự hiện diện của chúng ta, lá chắn khí quyển đặc biệt bảo vệ hành tinh đã trở nên cực kỳ mong manh và có thể sụp đổ bất cứ lúc nào. Việc áp dụng các biện pháp nghiêm ngặt để hạn chế năng suất sẽ giảm thiểu tối đa tác động sinh thái. Làm như vậy là đủ để giải quyết vấn đề."
 colony.7235.a: "Điều chỉnh các chỉ số sản xuất."
 colony.7235.b: "Kỷ băng hà kết thúc tại đây."
 colony.7235.b.tooltip: "Tăng tốc hết mức!"
 colony.7240.name: "Lõi địa nhiệt tan chảy"
 colony.7240.desc: "Nỗ lực hạn chế lượng khí thải trên [flooding_planet.GetName] đã không mang lại kết quả như ý. Chúng ta chỉ đạt được thành công khiêm tốn trong việc giải quyết cuộc khủng hoảng sinh thái kéo dài, và do mực nước biển dâng cao, các vùng đất thấp về mặt địa lý đang bị đe dọa.\n\nHiện tại, các trung tâm dân cư của chúng ta vẫn chưa bị ảnh hưởng trực tiếp, nhưng gần như chắc chắn rằng việc hành tinh tan chảy hoàn toàn là không thể tránh khỏi."
 colony.7240.a: "Cố gắng giảm thiểu thiệt hại."
 colony.7240.b: "Ban bố tình trạng khẩn cấp!"
 colony.7240.b.tooltip: "Dừng mọi hoạt động sản xuất cho đến khi tìm ra giải pháp."
 colony.7245.name: "Vùng ngập lụt khổng lồ"
 colony.7245.desc: "Sau khi chúng ta phớt lờ tình trạng sinh thái đang suy giảm nhanh chóng của [flooding_planet.GetName], cục diện đã dần rơi vào một thảm họa chưa từng có.\n\nSự tan rã của các tảng băng khổng lồ khiến đại dương tràn lan, mang lại sự phá hủy và biến động lớn. Bằng cách xây dựng các đập ngăn lũ, chúng ta có thể bảo vệ những thành phố còn lại, nhưng nhiều hệ lụy không lường trước được sẽ nối gót theo sau."
 colony.7245.a: "Hành tinh đang bị nhấn chìm!"
 colony.7247.name: "Bí mật vĩnh cửu"
 colony.7247.desc: "Khi hành tinh [flooding_planet.GetName] tiếp tục tan chảy, một khám phá thú vị đã xuất hiện bên dưới lớp đất đóng băng vĩnh cửu. Một kho báu cực địa giàu tài nguyên hiếm và khoáng sản, chưa từng được biết đến hay khai thác, đang lặng lẽ chờ đợi chúng ta."
 colony.7247.a: "Chúng ta trúng số rồi, mau khai thác thôi!"
 colony.7247.b: "Vùng đất đóng băng đã chịu quá đủ đau thương rồi."
 colony.7247.b.tooltip: "Chúng ta không thể mạo hiểm làm tình hình tệ thêm."
 colony.7250.name: "Mầm bệnh rã đông"
 colony.7250.desc: "Trạm khai thác cực địa của chúng ta trên [flooding_planet.GetName] đã xuất hiện những diễn biến đáng ngại. Các công nhân đột ngột bất tỉnh, vì sự an toàn, phải thiết lập các khu vực cấm nghiêm ngặt.\n\nĐiều tra ban đầu cho thấy do môi trường băng giá bị thay đổi, các virus ngủ đông đã thức tỉnh. Bản chất thực sự và đặc điểm của mầm bệnh này vẫn là ẩn số, mang lại cho chúng ta nhiều câu hỏi chưa có lời giải. Khả năng lây lan và mức độ nguy hiểm tiềm tàng đối với người dân vẫn chưa chắc chắn."
 colony.7250.a: "Đừng mạo hiểm. Khử trùng khu vực này ngay lập tức."
 colony.7250.b: "Giữ cách ly."
 colony.7255.name: "Tài lộc cực địa"
 colony.7255.desc: "Tại các hốc sâu vùng cực của [flooding_planet.GetName], một đội khai thác đã phát hiện ra khối tài sản khổng lồ. Bên dưới lớp màn tuyết, những tinh thể khổng lồ uy nghi như sông băng đã được tìm thấy.\n\nNhững cấu trúc phi thường này, được đúc kết dưới áp suất cực lớn qua vô số năm tháng, là minh chứng cho tiềm năng vô hạn mà chúng ta vẫn chưa khám phá hết."
 colony.7255.a: "Thật là một khám phá khó tin."
 colony.7260.name: "Khí hậu ổn định"
 colony.7260.desc: "Chúng ta đã đạt được bước đột phá về môi trường.\n\nCác phụ phẩm không gây hại từ việc đốt nhiên liệu, khi tiếp xúc với các đám mây vi khuẩn của [flooding_planet.GetName] đã tạo ra một phản ứng phụ kỳ lạ. Giờ đây chúng ta biết rằng, những đám mây này đóng vai trò sống còn bằng cách che bớt ánh sáng ngôi sao để duy trì nhịp sinh học tự nhiên của hành tinh. Khi vi khuẩn dần ít đi, chúng ta đã vô tình làm trầm trọng thêm tác động của khí thải.\n\nVới kiến thức mới phát hiện này, chúng ta đã nhanh chóng đề ra các biện pháp để khôi phục sự cân bằng."
 colony.7260.a: "Cuối cùng, khí hậu đã ổn định trở lại."
 colony.7265.name: "Kỷ băng hà kết thúc"
 colony.7265.desc: "Tảng băng cuối cùng trên [flooding_planet.GetName] đã chìm vào đại dương, một kỷ nguyên mới bắt đầu. Sự biến mất của lớp đất đóng băng vĩnh cửu hé lộ một vùng lãnh thổ dưới nước rộng lớn, tràn đầy tài nguyên chưa được khai phá."
 colony.7265.a: "Đến giờ đi nghỉ mát ở bãi biển rồi."
 PLANET_MELTDOWN_PROJECT: "Khủng hoảng khí hậu"
 PLANET_MELTDOWN_PROJECT_DESC: "Khí hậu trên [flooding_planet.GetName] đang suy thoái nhanh chóng. Hy vọng chúng ta có thể tìm ra nguyên nhân trước khi tình hình không thể cứu vãn."
 MELTING_RESEARCH_PROJECT: "Bề mặt đang tan chảy"
 MELTING_RESEARCH_PROJECT_DESC: "Nhiệt độ trên [flooding_planet.GetName] tăng nhanh. Các [Root.GetScientistPlural] cần mở rộng phạm vi nghiên cứu để giải quyết những vấn đề mới do tình trạng hiện tại gây ra."
 active_melting: "Nước dâng"
 active_melting_desc: "Bề mặt băng giá của hành tinh này đang tan chảy với tốc độ đáng báo động."
 boosted_melting: "Hiệu ứng tuyết lăn"
 boosted_melting_desc: "Chúng ta đã tăng lượng khí thải công nghiệp để đẩy nhanh quá trình tan chảy các tảng băng của hành tinh."
 halted_production: "Ngừng sản xuất"
 halted_production_desc: "Chúng ta đã hạn chế công nghiệp, giảm thiểu tác động để bảo vệ môi trường mong manh của hành tinh này."
 ecological_emergency: "Tình trạng khẩn cấp sinh thái"
 ecological_emergency_desc: "Hành tinh này đã hoàn toàn ngừng sản xuất cho đến khi kết thúc nghiên cứu môi trường."
 ancient_plague: "Virus cổ đại"
 ancient_plague_desc: "Hành tinh này đã trở thành nạn nhân của mầm bệnh cổ xưa thức tỉnh từ lớp đất đóng băng vĩnh cửu."
 cruel_actions: "Biện pháp phòng ngừa tàn khốc"
 cruel_actions_desc: "Nhân danh sự an toàn, chúng ta đã tiêu diệt những người định cư bị nhiễm bệnh dịch cổ xưa."
 d_floodplains: "Vùng ngập lụt mở rộng"
 d_floodplains_desc: "Do mực nước biển dâng nhanh, những vùng đất rộng lớn trên hành tinh đã bị nhấn chìm."
 d_crystalline_glacier: "Lớp băng tinh thể"
 d_crystalline_glacier_desc: "Những tinh thể màu xanh băng giá này từng là cốt lõi của các sông băng nguyên thủy."
 d_mineral_seabed: "Đáy biển giàu khoáng sản"
 d_mineral_seabed_desc: "Đáy biển rải rác các khoáng sản chất lượng cao."
 mineral_diver: "$job_mineral_diver$"
 job_mineral_diver: "Thợ lặn nước sâu"
 job_mineral_diver_plural: "Thợ lặn nước sâu"
 job_mineral_diver_desc: "Các chuyên gia nước sâu trục vớt khoáng sản chìm dưới đáy đại dương."
