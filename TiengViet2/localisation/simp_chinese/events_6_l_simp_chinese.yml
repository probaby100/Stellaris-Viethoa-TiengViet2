 ## Event: Junkyard Orbit
 colony.9310.name: "Bãi rác quỹ đạo"
 colony.9310.desc: "Tin mới nhất từ [planet.GetName] cho biết tính toán về năng lực quản lý rác thải của hành tinh đã sai lầm. Các bãi rác khổng lồ kết nối với nhau tạo thành một vùng hoang mạc không thể vượt qua, lan sát tận rìa các trung tâm dân cư.\n\nDân địa phương bắt đầu phóng rác lên quỹ đạo như một biện pháp tạm thời."
 colony.9310.a: "Đáng lo ngại."
 colony.9310.a.tooltip: "Hãy dọn dẹp đống hỗn độn này ngay."
 colony.9315.name: "Mảnh vỡ bao phủ"
 colony.9315.desc: "Tai nạn đã xảy ra.\n\nDo một sự cố nghiêm trọng, nhiều kho chứa rác trên quỹ đạo [planet.GetName] đã va chạm, khiến một lượng lớn mảnh vỡ rơi vào tầng khí quyển thấp. Sự cố này đã hạn chế khả năng hàng không vũ trụ của hành tinh, và dự báo tình hình sẽ tệ hơn khi rác thải tiếp tục phân rã. Việc thu gom đống rác này là một công việc cực kỳ tốn kém."
 colony.9315.a: "Dọn dẹp quỹ đạo."
 colony.9315.a.tooltip: "Triển khai các đơn vị đặc biệt."
 colony.9315.b: "Không gian rộng lớn thế mà. Chút rác này có đáng gì."
 colony.9315.b.tooltip: "Đang có nhiều vấn đề cấp bách hơn trong thiên hà."
 colony.9315.c: "Tuyên bố tình trạng khẩn cấp."
 colony.9315.c.tooltip: "Chúng ta phải dốc toàn lực để dọn sạch đống mảnh vỡ này."
 colony.9320.name: "Hoàn tất dọn dẹp quỹ đạo"
 colony.9320.desc: "Hôm nay là một ngày lịch sử trên [planet.GetName], các đội thu gom rác vũ trụ đã hoàn thành ca làm việc cuối cùng. Vành đai rác quanh hành tinh đã thu hẹp đến mức không còn đe dọa đáng kể đối với tàu thuyền qua lại.\n\nTrong những ngày tới, các hoạt động dọn dẹp quy mô nhỏ vẫn sẽ tiếp tục. Dù không thể làm sạch hoàn toàn quỹ đạo, nhưng ít nhất tình trạng tồi tệ nhất đã qua đi."
 colony.9320.a: "Cuối cùng mọi thứ cũng trở lại bình thường."
 colony.9325.name: "Vùng trời bị phong tỏa"
 colony.9325.desc: "Sau khi vành đai rác quanh [Planet.GetName] có vẻ ổn định, tình hình bỗng nhiên chuyển biến xấu.\n\nCác nhà khoa học thuộc địa cho biết các mảnh vỡ va chạm lẫn nhau tạo thành một vành đai bụi mịn, gây rủi ro cực lớn cho việc vận chuyển tài nguyên và dân số ra vào thuộc địa."
 colony.9325.a: "Tệ thật."
 colony.9330.name: "Mưa sao băng"
 colony.9330.desc: "Sau khi vành đai rác quanh [Planet.GetName] lắng xuống, mọi chuyện dường như đã được giải quyết êm đẹp.\n\nDưới tác động của trọng lực mạnh, vô số mảnh vỡ bắt đầu rơi vào khí quyển và bốc cháy. Mỗi khi đêm xuống, mọi người lại tụ tập để chiêm ngưỡng những trận mưa sao băng lộng lẫy và độc đáo này."
 colony.9330.a: "Đến giờ ngắm sao rồi."
 colony.9335.name: "Trời quang mây tạnh"
 colony.9335.desc: "Khi đội thu gom rác hoàn thành nhiệm vụ, một lễ kỷ niệm lớn đã diễn ra trên [planet.GetName].\n\nTừ hôm nay, vành đai rác từng ám ảnh quỹ đạo hành tinh đã giảm đến mức không thể phát hiện. Nhờ thành quả rực rỡ này, người dân nhiệt liệt ủng hộ các hành động tiếp theo của đội thu gom để đảm bảo thế hệ mai sau có một bầu trời trong lành."
 colony.9335.a: "Một ngày đáng nhớ."
 orbital_cleanup: "Làm sạch quỹ đạo"
 orbital_cleanup_DESC: "Sau một vụ va chạm ở tầng khí quyển thấp, quỹ đạo [Root.GetName] đầy rẫy mảnh vỡ. Nếu không dọn dẹp sớm, tai họa có thể khiến giao thông của hành tinh bị gián đoạn."
 orbital_cleanup_intense: "Tổng lực làm sạch quỹ đạo"
 orbital_cleanup_intense_DESC: "Sau vụ va chạm mảnh vỡ trên [Root.GetName], phải thực hiện dọn dẹp triệt để bằng mọi giá để đảm bảo an toàn cho cư dân trong tương lai."
 job_astrogarbage_collector: "Người thu gom rác vũ trụ"
 job_astrogarbage_collector_plural: "Người thu gom rác vũ trụ"
 job_astrogarbage_collector_desc: "Một đơn vị chuyên trách việc thu gom mảnh vỡ trên quỹ đạo hành tinh."
