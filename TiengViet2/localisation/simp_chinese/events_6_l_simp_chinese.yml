 anomaly.7020.desc: "Chúng ta tìm thấy một con tàu vũ trụ cổ đại có thiết kế độc đáo. Phương thức đẩy nó sử dụng không giống với các con tàu hiện đại, mà dựa vào những cánh buồm khổng lồ xòe ra trong chân không để tiến hành. Có lẽ con tàu này có thể thu thập năng lượng hằng tinh, và tiến về phía trước dưới sự thúc đẩy của ánh sáng sao và gió hằng tinh."
