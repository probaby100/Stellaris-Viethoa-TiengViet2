 mod_job_alien_hunter_per_pop_short: "\nMỗi $VALUE$ £pop£ §G+1§!£job_alien_hunter£"
 d_desertling_infestation: "Quần thể thú xâm lấn"
 d_desertling_infestation_desc: "Một loài động vật có vú ngoại lai xâm lấn."
 d_red_desert: "Sa mạc Đỏ"
 d_red_desert_desc: "Vùng sa mạc rộng lớn bị nhuộm đỏ bởi những hy sinh đẫm máu tại đây."
 d_alien_sanctuary: "Công viên thú hoang ngoại lai"
 d_alien_sanctuary_desc: "Khu bảo tồn được xây dựng cho quần thể thú ngoại lai, nơi du khách có thể tương tác với các loài vật phi thường."
 rodent_war: "Tận diệt triệt để"
 rodent_war_desc: "Chúng ta đã giao nhiệm vụ cho quân đội tiêu diệt quần thể thú xâm lấn ngoại lai trên hành tinh này."
 alien_infestation: "Sự xâm nhiễm ngoại lai"
 alien_infestation_desc: "Hành tinh này đã bị xâm nhiễm bởi quần thể thú ngoại lai lan rộng nhanh chóng."
 adopted_aliens: "Thuần hóa thú ngoại lai"
 adopted_aliens_desc: "Hành tinh này tham gia vào dự án nhận nuôi thú cưng ngoại lai và phối hợp thuần hóa chúng."
 national_pets: "Mối liên kết bất ngờ"
 national_pets_desc: "Những con Sa Sinh Thú mà chúng ta quyết định nhận nuôi đã được thuần hóa hoàn toàn, được người dân khắp cả nước yêu mến."
 trait_presapient_unintelligent: "Kém thông minh"
 trait_presapient_unintelligent_desc: "§HLoài này thậm chí không thể hoàn thành những nhiệm vụ đơn giản nhất. Kỹ năng duy nhất của chúng là tốc độ sinh sản nhanh đến khó tin.§!"
 rapid_desertification_species: "Sa Sinh Thú"
 #Closing Aperture
 BREACHSEALER_CAT: "Khám phá vết rách vũ trụ"
 BREACHSEALER_CAT_DESC: "Hệ sao Thurton mờ nhạt ẩn giấu một vết rách trong cấu trúc vũ trụ. Điều bất thường hơn là vết rách này đang co lại, dường như có thứ gì đó hoặc ai đó đang sửa chữa nó."
 anomaly.7200.name: "Khâu vá vết rách"
 anomaly.7200.desc: "Cảnh tượng bên trong Thurton thật quái dị. Các hành tinh xoáy tròn lờ mờ trong bóng tối; bên cạnh là một lỗ hổng trong cấu trúc vũ trụ của chúng ta, một cái dạ dày vũ trụ đang nuốt chửng ánh sáng sao.\n\nDù sự sắp xếp của các thiên thể trông có vẻ bình thường, nhưng nghiên cứu sâu hơn cho thấy chúng được đặt vào nhau theo một mối quan hệ toán học cực kỳ chính xác. Hàng triệu năm trước, một lực lượng khó tin nào đó đã biên soạn quỹ đạo các thiên thể trong hệ sao này thành một đồ án độc đáo, đồ án này không chỉ tác động đến vết nứt mà còn ngăn nó xé toạc sang các hệ sao rộng lớn hơn.\n\nChúng ta dường như đã đến đúng lúc — công trình sử thi này sắp hoàn thành. Hệ sao này sắp trở lại bình thường."
 anomaly.7200.a: "Cảm ơn vì đã sửa chữa hệ sao của chúng ta."
 #Geocentric Experiment
 NAME_Orrery_Site: "Trạm Thiên Nghi"
 GEOCENTRIC_EXPERIMENT_CAT: "Thiên Nghi"
 GEOCENTRIC_EXPERIMENT_CAT_DESC: "Nhiều chỉ số trọng lực kỳ quái đã được phát hiện trong hệ sao [from.Solar_System.GetName], các tín hiệu này nhấp nháy khắp nơi từ vành đai tiểu hành tinh nội vi đến hành tinh hoang vu ở trung tâm hệ sao."
 anomaly.8000.name: "$GEOCENTRIC_EXPERIMENT_CAT$"
 anomaly.8000.desc: "Sự ổn định trọng lực của hệ sao [from.Solar_System.GetName] được duy trì bởi §Y$sr_dark_matter$§! giải phóng từ vành đai tiểu hành tinh. Các nguồn phát này được điều khiển bởi một siêu máy tính nằm trên hành tinh trung tâm. Bản ghi của máy tính trung tâm cho thấy, toàn bộ hệ sao là một cơ sở thí nghiệm điều khiển trọng lực được xây dựng bởi một nền văn minh cổ đại nào đó."
 anomaly.8000.tt: "Thêm §Y$d_physics_1$§! và §Y$d_dark_matter_deposit_1$§! vào tất cả tiểu hành tinh §Y$GRAVITY_STABILIZER$§!"
 anomaly.8000.b: "Tháo dỡ các thiết bị này."
 anomaly.8000.b.tt: "§RĐây không phải một ý hay đâu§!"
 GRAVITY_STABILIZER: "Thiết bị điều khiển trọng lực"
 NAME_GRAVITY_STABILIZER_I: "$GRAVITY_STABILIZER$ I"
 NAME_GRAVITY_STABILIZER_II: "$GRAVITY_STABILIZER$ II"
 NAME_GRAVITY_STABILIZER_III: "$GRAVITY_STABILIZER$ III"
 NAME_GRAVITY_STABILIZER_IIII: "$GRAVITY_STABILIZER$ IIII"
 d_geocentric_experiment: "Siêu máy tính Thiên Nghi"
 d_geocentric_experiment_desc: "Siêu máy tính dùng để duy trì sự ổn định trọng lực của Thiên Nghi."
 #Mysterious Rocks Formation
 MYSTERIOUS_ROCK_CAT: "Cấu trúc đá bí ẩn"
 MYSTERIOUS_ROCK_CAT_DESC: "Trong khi khảo sát [From.GetName], chúng ta đã phát hiện ra một cấu trúc đá quái dị, sừng sững trên hành tinh hoang vu vốn tưởng như trống rỗng này."
 anomaly.2000.name: "Cự thạch quái dị"
 anomaly.2000.start.desc: "Việc khám phá thêm [From.GetName] không những không giải mã được bí ẩn mà còn khiến nó thêm phần nghi vấn. Trên bề mặt nơi này rải rác những bức tượng sống động như thật, khuôn mặt đông cứng trong biểu cảm đau đớn thầm lặng."
 anomaly.2000.default.desc: "$anomaly.2000.start.desc$\n\nÝ kiến của các nhà khoa học bị chia rẽ; một số cho rằng những thứ này từng là sinh vật sống bị một lực lượng chưa biết biến thành đá. Số khác lại tin rằng chúng đại diện cho những vị thần được thờ phụng bởi một nền văn minh đã mất từ lâu. Một số ít thận trọng hơn thì cho rằng, những bức tượng này không phải để tôn vinh, mà là một lời cảnh báo: lời cảnh báo nghiêm khắc cho bất kỳ ai dám quấy rầy hành tinh này."
 anomaly.2000.hive.desc: "$anomaly.2000.start.desc$\n\nTrong tâm thức tập thể của chúng ta trào dâng nhiều suy nghĩ khác nhau về những bức tượng này, chẳng hạn như chúng có thể là sinh vật sống bị biến thành đá bởi lực lượng chưa biết, hoặc đại diện cho thần linh của nền văn minh cổ đại. Hoặc có lẽ chúng không phải để tôn vinh mà là lời cảnh báo cho bất kỳ kẻ nào dám quấy nhiễu nơi đây."
 anomaly.2000.a: "Tiếp tục nghiên cứu."
 anomaly.2000.b: "Ngừng điều tra."
 anomaly.2005.desc: "Cuộc điều tra sâu hơn của phi hành đoàn [From.GetName] phát hiện ra những bức tượng này là hài cốt của một loài cổ đại có độ tương đồng cao với dạng sống thạch tinh. Lực lượng từng duy trì hình dạng của chúng đã tan biến từ lâu. Giờ đây, chúng lộ ra trước môi trường tự nhiên, dần bị xói mòn thành bụi mịn, gieo rắc những tàn dư lịch sử vào cơn gió khắc nghiệt của [From.GetName]."
 anomaly.2005.a: "Thật mê hoặc."
 anomaly.2006.desc: "Nỗ lực tiếp theo của phi hành đoàn [From.GetName] đã bị cắt ngang bởi một trận cuồng phong bất ngờ quét qua toàn bộ hiện trường nghiên cứu. Những bức tượng đá mong manh lập tức hóa thành tro bụi, những bí ẩn chúng từng mang theo cũng theo đó mà tan biến không tàn tích. Do thiếu bằng chứng còn sót lại để phân tích, cũng không thể đưa ra kết luận rõ ràng, chúng ta không còn cách nào khác ngoài việc chấm dứt cuộc điều tra này."
 anomaly.2006.a: "Thật không may."
 GROTESQUE_ROCK_PROJECT: "Khám phá cấu trúc đá quái dị"
 GROTESQUE_ROCK_PROJECT_DESC: "Chúng ta tình cờ phát hiện một cấu trúc đá quái dị trên bề mặt [From.GetName]. Cần nghiên cứu thêm để xác định tại sao nó lại tồn tại trên hành tinh vốn nghèo nàn này."
 ## Icy Flowers
 ICY_FLOWERS_CAT: "Khám phá lạnh lẽo"
 ICY_FLOWERS_CAT_DESC: "Nhiều lần quét lớp băng dày trên bề mặt [From.GetName], các thiết bị đều tạo ra dữ liệu hỗn loạn và mô hình nhiễu bất thường. Có vật thể nào đó bên dưới lớp băng liên tục gây nhiễu thiết bị dò tìm, chúng tôi đề xuất điều tra thêm."
 anomaly.2010.name: "Vườn bách thảo địa hạ"
 anomaly.2010.desc: "Thăm dò bên dưới lớp vỏ băng của [From.GetName], chúng ta đã phát hiện một hệ thống hang động ngầm rộng lớn. Thật kinh ngạc, trong nhà kính ẩn giấu này tồn tại một hệ sinh thái tươi tốt — các loài động thực vật dày đặc đang sinh trưởng mạnh mẽ trong môi trường biệt lập, được lớp băng bảo vệ khỏi môi trường khắc nghiệt trên bề mặt. Trong hang duy trì một khí hậu vi mô ổn định, rất có thể được duy trì bởi các lỗ thông địa nhiệt."
 anomaly.2010.a: "Phải khám phá thêm."
 anomaly.2010.b: "Dừng dự án."
 anomaly.2015.name: "Tỉ năm có một"
 anomaly.2015.desc: "Sâu hơn trong hang động, chúng ta gặp một cánh đồng hoa rộng lớn. Khi bắt đầu quan sát chủ động, cả cánh đồng hoa lập tức bừng nở, toàn bộ hang động bị nhấn chìm trong ánh sáng sinh học rực rỡ. Phân tích thực vật học cho thấy, loài này mỗi một trăm triệu năm mới nở hoa một lần, cần các yếu tố môi trường đạt được sự sắp xếp chính xác mới có thể kích hoạt.\n\nSự xuất hiện của chúng ta lại trùng khớp với một sự kiện hiếm có như vậy, xác suất này là cực nhỏ. Nhưng dù là tình cờ thuần túy hay có ẩn tình khác, đây chắc chắn là một trải nghiệm phi thường."
 anomaly.2015.a: "Khám phá kinh ngạc."
 anomaly.2020.name: "Bí mật không thể khám phá"
 anomaly.2020.desc: "Khi tiến sâu hơn vào hang, hoạt động địa chấn đột ngột khiến cấu trúc mất ổn định. Những rung chấn kiến tạo bất ngờ truyền qua vách đá, có thể gây sập bất cứ lúc nào. Đối mặt với môi trường suy thoái nhanh chóng, chúng ta lập tức kích hoạt quy trình sơ tán khẩn cấp. Những bí mật trong hang đành để lại trong tiếc nuối, không thể khám phá thêm."
 anomaly.2020.a: "Thật không may."
 BOTANICAL_GARDEN_PROJECT: "Khám phá vườn bách thảo"
 BOTANICAL_GARDEN_PROJECT_DESC: "Bên dưới lớp vỏ băng của [From.GetName] tồn tại một hang động ngầm rộng lớn. Chúng tôi dự định cử một đội khảo sát triển khai nghiên cứu thêm về môi trường đặc biệt này."
 ## A Court of Blossoms
 colony.10000.name: "Dấu chân kỳ quái"
 colony.10000.desc: "Chúng ta đã nhận được báo cáo từ các trạm nông nghiệp vùng biên của [Root.GetName]. Nhiều [Owner.GetFarmerPlural] đã mất tích không rõ lý do, ngoài những dấu chân khổng lồ để lại trên lớp đất xung quanh, nhà cửa của họ không hề bị ảnh hưởng.\n\nNhững dấu vết này không giống với bất cứ thứ gì từng phát hiện trong các cuộc khảo sát hành tinh trước đó: dấu chân bốn chân, ngón rộng, có móng vuốt, độ sâu của chúng cho thấy đến từ một sinh vật khá lớn. Những người định cư lo lắng rằng chúng ta có thể đã chạm trán với một kẻ săn mồi chưa biết."
 colony.10000.a: "Điều tra thêm!"
 colony.10000.b: "Đúng là suy đoán vô căn cứ. Quay lại làm việc đi."
 colony.10005.name: "Quái thú tử trận"
 colony.10005.desc: "Cuộc thám hiểm sâu vào nơi hoang dã đầy gian khổ, nhưng cuối cùng chúng ta đã gặt hái được thành quả. Sau nhiều ngày theo dấu sinh vật đó, đội của chúng ta đã đến được một hiện trường đổ nát: xác một con quái thú khổng lồ — hiện ra trước mắt chúng ta là lớp vỏ ngoài bằng chitin dày, những dải gai nhọn dọc sống lưng, và cái đuôi phân đốt với ngòi độc cong vút ở đầu. Trên xác đầy những vết thương xuyên thấu.\n\nPhía sau nó, thiết bị phát hiện một khu vườn cổ xưa được che giấu khéo léo bởi những dây leo rêu sáng, bên trong đầy những cột đá cẩm thạch quấn quýt thường xuân và những lối đi bằng đá obsidian nhẵn bóng. Đội thận trọng tiến bước cho đến khi nhìn thấy những người canh giữ khu vườn — một chủng tộc dạng người cử chỉ tao nhã, làn da tỏa sáng nhẹ. Dù cảnh tượng thanh bình, nhưng những dây hoa phát sáng đó lại tạo thành một rào chắn hữu hiệu. Chúng ta phải xuyên qua lớp màn che lấp lánh này mới có thể tiếp cận những thực thể sống bên kia rào chắn."
 colony.10005.a: "Thử xuyên qua lớp ngụy trang này."
 colony.10010.name: "Vụ mất tích tiếp diễn"
 colony.10010.desc: "Tần suất xảy ra các vụ việc đã leo thang. Lần này, những dấu chân không chỉ đi ngang qua nông trại, mà đâm thẳng vào nhà cửa. Toàn bộ công trình bị xé nát bởi một lực lượng kinh hoàng. Dấu vết chống trả cho thấy nạn nhân bị bắt sống, và không hề chịu trói.\n\nNhững người định cư không còn chỉ thấy bất an nữa, mà đã rơi vào hoảng loạn. Đã có nhiều hộ gia đình bỏ đất đai để chạy về trung tâm thuộc địa."
 colony.10010.a: "Đã đến lúc tìm ra kẻ thủ ác."
 colony.10010.b: "Bạo lực là một phần của cuộc sống."
 colony.10015.name: "Hoa Đình"
 colony.10015.desc: "Ta nhân danh Hoa Đình, chào mừng các lữ khách. Ta là Vua Tamperion, hay như dân tộc ta thường gọi là \"Kẻ Có Trái Tim Vàng\", ta không cai trị bằng vũ lực, mà chấp chưởng quyền bính thông qua di huấn tiền nhân và nghi lễ. Ta vừa là người bảo hộ thế giới này, vừa là người dẫn dắt dân tộc ta — người Anathari. Các ngươi thấy ngạc nhiên khi nghe thấy ngôn ngữ của chính mình sao? Đừng sợ. Từ khi các ngươi quyết định coi [Root.GetName] là nhà, chúng ta đã luôn nghiên cứu các ngươi. Người dân của các ngươi chắc hẳn rất mạnh mẽ mới có thể xuyên qua rào chắn của chúng ta. Chúng ta rất vinh dự được gặp các ngươi."
 colony.10015.a.question: "Hoa Đình là gì?"
 colony.10015.a.answer: "Hoa Đình của chúng ta đại diện cho sự thịnh vượng vĩnh cửu. Văn hóa của chúng ta tự hào rằng nó không được định nghĩa bằng vũ khí hay cai trị bạo lực, mà bằng sự hài hòa, và sự hài hòa được thực hiện thông qua sự hiểu biết lẫn nhau và lòng tốt trong trái tim mỗi người. Trong Hoa Đình, truyền thống không phải là tàn dư của ngày cũ, mà là luật lệ của chúng ta. Hãy chia sẻ với chúng ta những câu chuyện, bài hát và cây trồng của các ngươi, các ngươi sẽ thấy được lối sống của chúng ta, giao lưu thông qua sự thấu hiểu lẫn nhau."
 colony.10015.b.question: "Ông có thể cho chúng tôi biết vài thông tin về con quái vật đó không?"
 colony.10015.b.answer: "Sinh vật mà các ngươi gặp, Đại Hộ Vệ, đã từng là người bảo vệ của chúng ta. Nhưng theo thời gian, nó bị gặm nhấm bởi một căn bệnh bên trong, một chủng nấm đông trùng hạ thảo ký sinh trong não nó đã gieo mầm họa, đục khoét tâm trí và làm tha hóa mục đích của nó. Chúng ta đã kết thúc nỗi đau của nó, không phải vì giận dữ mà vì bi thương. Nó không phải dã thú ngoại lai, mà là một phần của chúng ta."
 colony.10015.c.question: "Các ông muốn gì ở chúng tôi?"
 colony.10015.c.answer: "Các ngươi có lẽ thấy cách hành sự của chúng ta rất kỳ lạ. Nghi lễ, lễ hội, tụng ca, cộng sinh với những loài thực vật biết suy nghĩ và mơ ước. Nhưng xin hãy hiểu rằng: cộng tồn với chúng ta không phải là sự ban phát miễn phí. Những kẻ từ chối học hỏi sẽ phải chịu hậu quả. Đây là đề nghị của chúng ta. Không phải thần phục, cũng không phải kiểm soát, mà là thấu hiểu và chấp nhận lẫn nhau. Nếu các ngươi sẵn lòng chấp nhận đề nghị này, chúng ta sẽ ăn mừng. Đây chính là bản chất thuần khiết của sự hòa hợp giữa các tộc người mà chúng ta định nghĩa. Nếu các ngươi chọn đồng hành cùng chúng ta, các ngươi sẽ không đơn độc."
 colony.10015.a: "Chúng tôi sẵn lòng học hỏi."
 colony.10015.b: "Chúng tôi đến đây để thiết lập thuộc địa."
 colony.10016.name: "$colony.10015.name$"
 colony.10016.desc: "Thay mặt toàn thể Hoa Đình, chân thành cảm ơn sự hợp tác của các bạn. Hãy yên tâm, những nhân viên mà bạn phái đến trước đây, chúng tôi coi họ là quý khách, khiến họ cảm thấy như ở nhà. Tuyệt đối không để họ thiếu thốn bất cứ nhu cầu nào."
 colony.10016.a: "Tốt lắm."
 colony.10017.name: "$colony.10015.name$"
 colony.10017.desc: "Đã vậy thì tùy ngươi. Ngươi đã quyết định, và chúng ta cũng vậy. Ta đã làm tròn trách nhiệm khuyên bảo của mình, giờ đây ngươi phải gánh chịu hậu quả từ lựa chọn của mình."
 colony.10017.a: "Chúng ta phải chuẩn bị cho bất cứ tình huống nào có thể xảy ra tiếp theo."
 colony.10020.name: "Cuộc tấn công bất ngờ"
 colony.10020.desc: "Không có bất kỳ dấu hiệu báo trước nào. Vua Tamperion xuất hiện từ trung tâm khu vườn, trên người khoác bộ giáp nghi lễ dệt từ dây leo sống và những đóa hoa phát sáng. Ông đi dọc theo rìa thuộc địa, mỗi bước chân đều chậm rãi và trang trọng, và cả thế giới cũng đang thức tỉnh. Dây leo uốn lượn nhô lên từ lòng đất, cánh hoa nở rộ sắc bén như lưỡi dao. Trong không khí tràn ngập phấn hoa màu vàng, mịn màng và lấp lánh. Nó xâm nhập vào các lỗ thông gió và phổi. Trong vài giờ, nó đã tước đi mạng sống của nhiều người, gây ra co giật, điên loạn và cuối cùng dẫn đến tử vong.\n\nCuối cùng, phải nhờ đến sự can thiệp của hệ thống phòng thủ tự động của thuộc địa mới hạ gục được ông ta. Vua Tamperion ngã xuống mà không nói một lời; những người chứng kiến nói rằng ánh mắt cuối cùng của ông không có hận thù, chỉ có sự thất vọng sâu sắc và trang nghiêm.\n\nCác trinh sát của chúng ta phát hiện ra rằng, nơi từng là Hoa Đình giờ đây chỉ còn lại rừng rậm. Như thể vương quốc này đã tự gập mình lại vào lòng đất, mang theo những bí mật và nỗi đau của nó."
 colony.10020.a: "Một kết thúc cay đắng."
 colony.10025.name: "Một thành viên trong đó"
 colony.10025.desc: "Chúng ta đã toàn tâm toàn ý hòa mình vào vòng tay của người Anathari. Chúng ta tham gia vào các nghi lễ của họ và điều hòa với các nghi thức độc đáo, các mô hình đã xuất hiện, và ý nghĩa cũng bắt đầu bén rễ.\n\nTrong các nghi lễ công khai ban đêm tập trung vào chu kỳ trường thọ và sinh sản, người Anathari bắt đầu hé lộ những mảnh lịch sử bị kìm nén. Họ nói về một chứng bệnh khô héo cổ xưa và dai dẳng, thứ không chỉ từng bao trùm hành tinh này mà hiện giờ vẫn đang đe dọa người Anathari."
 colony.10025.a: "Có quá nhiều thứ để trò chuyện."
 colony.10026.name: "Vua Tamperion"
 colony.10026.desc: "Ngày xửa ngày xưa, rất lâu trước khi các bạn đặt chân lên vùng đất này, người Anathari chúng ta từng chẳng qua là những người quản gia khiêm nhường. Chúng ta nhào nặn hành tinh này theo nhịp thở của nó, dẫn dắt hệ sinh thái, cân bằng dòng nước, chăm sóc hành tinh sống này như những người làm vườn kiên nhẫn vô hạn chăm sóc khu vườn của mình. Nhưng sự cân bằng này đã sớm bị thách thức."
 colony.10026.a.question: "Ai đã phá vỡ sự bình yên đó?"
 colony.10026.a.answer: "Sâu bên dưới cội rễ lịch sử, một thực thể mang tên \"Vĩnh Hủ Chi Ám\" đã trồi lên từ lòng đất, sức mạnh của nó không nguồn gốc cũng chẳng có sự kiềm tỏa. Ban đầu chúng ta tưởng nó không có ác ý nên đã mở cửa đón chào, mời nó tham gia vào sự trao đổi tương trợ của chúng ta. Nhưng ngay khi bước vào nhà, nó đã trút toàn bộ sức mạnh xuống, biến tất cả chúng ta thành nô lệ. Tâm can chúng ta đang dần mục nát, chậm rãi thôi, chúng ta sẽ héo tàn."
 colony.10026.b.question: "Chúng tôi đóng vai trò gì trong đó?"
 colony.10026.b.answer: "Trên người các [Owner.GetSpeciesNamePlural] có một sự kiên cường mà chúng ta đã đánh mất từ lâu, một sức sống không bị lịch sử của chúng ta trói buộc. Vì vậy, ta với tư cách là một kẻ sót lại chứ không phải quân vương để cầu xin sự giúp đỡ từ các bạn? Nguồn cơn của thực thể này tăng trưởng theo từng chu kỳ trôi qua, ta không chắc người Anathari còn có thể chống chọi với sự khô héo này bao lâu nữa."
 colony.10026.c.question: "Các ông cần chúng tôi làm gì?"
 colony.10026.c.answer: "Phải trực diện đối đầu với Vĩnh Hủ Chi Ám. Ngày trước, từng có một dũng sĩ đã thử, nhưng nàng đã thất bại. Trong hơi thở cuối cùng, nàng vẫn kịp xé toạc một phần linh hồn của nó. Có lẽ các bạn có thể giải mã nó, và tìm ra chủ nhân thực sự của nó trên [Root.GetName]. Công nghệ của các bạn chắc hẳn đã đủ để nhìn thấu lớp ngụy trang của nó.\n\nSự sống sót của chúng ta chỉ có thể trông chờ vào sự đoàn kết. Hãy nhớ rằng: một khi thất bại, kẻ đối mặt với sự kết thúc không chỉ là người Anathari chúng ta và thuộc địa của các bạn. Nếu không bị kiềm chế, nó thậm chí có thể nuốt chửng cả hành tinh."
 colony.10026.a: "Chúng ta phải ngăn chặn Vĩnh Hủ Chi Ám"
 colony.10026.b: "Chúng ta không thể tin tay vua chúa này được."
 colony.10027.name: "Hạt giống nghi kỵ"
 colony.10027.desc: "Cuộc giao lưu hòa bình ban đầu bắt đầu lộ ra những khía cạnh tinh vi đáng lo ngại hơn. Tham gia nghi lễ Anathari dẫn đến các báo cáo về sự chậm trễ, ký ức bị phân mảnh và giấc ngủ bị thay đổi. Vua Tamperion vẫn lịch thiệp, nhưng khi được hỏi về mục đích sâu xa của các nghi lễ này, ông ta lại giữ kín như bưng. Những lời giải thích của ông dù đầy tính thi vị nhưng cũng rất lấp liếm. Ngay cả danh hiệu \"Kẻ Có Trái Tim Vàng\" cũng không xuất hiện trong các ghi chép giáo lý Anathari. Một số người hiện cho rằng, các nghi lễ này không chỉ là mối liên kết văn hóa mà còn là công cụ hiệu chuẩn tâm lý.\n\nBất kể phương thức là gì, kết quả đều rõ ràng: chúng ta đang liên minh với Tamperion và gia tộc của ông ta. Khi ông ta nói về Vĩnh Hủ Chi Ám, cảm giác đó không giống như một lời cầu khẩn từ bên ngoài, mà giống như một nghĩa vụ thiêng liêng từ bên trong, giúp đỡ đồng minh thân thiết nhất của chúng ta — người Anathari."
 colony.10027.a: "Tất nhiên rồi, chúng tôi sẽ giúp các ông."
 colony.10027.b: "Nghịch ngợm thế đủ rồi!"
 colony.10030.name: "Sau cái chết"
 colony.10030.desc: "Chúng ta nhanh chóng hành động. Một đội dân binh đột kích đã thâm nhập Hoa Đình. Khi chúng ta tấn công, Vua Tamperion đang thiền định trong vườn, nhưng ông ta cũng không phải dạng vừa. Mô tả của các nhân chứng giống như một điệu nhảy tử thần của thực vật, dây leo xuyên đá mà mọc, cuống hoa cào nát cả thép. Khi nhà vua cuối cùng bị hạ gục, cả khu vườn đã đẫm trong máu tươi rực rỡ và tro bụi.\n\nThứ chôn giấu bên dưới khu vườn khiến chúng ta kinh ngạc, đó đơn giản là một kho báu sinh học: kiến thức cổ xưa, kỹ thuật thực vật và trữ lượng di truyền của vô số chu kỳ thu hoạch. Đất đai ở đây màu mỡ hơn bất cứ nơi nào khác trên hành tinh, giờ đây cũng không còn bị ràng buộc bởi những người trông nom cổ xưa. Chúng ta có lẽ đang bước vào một thời đại hoàng kim về vật chất dồi dào."
 colony.10030.a: "Đây là cách duy nhất."
 A_CRYPTIC_ESSENCE_PROJECT: "Nghiên cứu linh hồn"
 A_CRYPTIC_ESSENCE_PROJECT_DESC: "Vua Tamperion đã giao phó mảnh vỡ của Vĩnh Hủ Chi Ám cho chúng ta. Bằng cách nghiên cứu mảnh linh hồn của nó, chúng ta có thể tìm ra vị trí sào huyệt, tìm cách phá vỡ sự kiểm soát của nó đối với người Anathari."
 THE_CRYPTIC_ESSENCE_PROJECT: "$A_CRYPTIC_ESSENCE_PROJECT$"
 THE_CRYPTIC_ESSENCE_PROJECT_DESC: "$A_CRYPTIC_ESSENCE_PROJECT_DESC$"
 colony.10035.name: "Vĩnh Hủ Chi Ám"
 colony.10035.desc: "Các nhà khoa học đã thành công giải mã linh hồn, xác định vị trí của Vĩnh Hủ Chi Ám trên một đỉnh núi hoang vu. Chẳng mấy chốc, một đội thám hiểm đã đến cao nguyên trên núi, tìm thấy sào huyệt của nó.\n\nỞ trung tâm hiện lên kẻ dàn dựng cuộc thử thách này: Vĩnh Hủ Chi Ám. Thực thể này không rõ nguồn gốc, hình dạng của nó là sự dung hợp không ổn định giữa plasma, khói, xương và vật chất có hoạt tính tâm linh. Lời nói của nó đi xuyên qua âm thanh, đâm thẳng vào cấu trúc thần kinh của mỗi thành viên trong đội tại hiện trường.\n\n\"Các ngươi đến để quy hàng ta sao, lũ [Owner.GetSpeciesNamePluralInsult] nhỏ bé?\" nó nói một cách trầm bổng, trong truyền âm tâm linh pha lẫn sự chế nhạo. \"Người Anathari là tài sản quý giá nhất của ta. Nhưng ta cho các ngươi một cơ hội. Hãy tham gia thử thách, chứng minh các ngươi xứng đáng để ta để mắt tới.\""
 colony.10035.a: "Chúng tôi chấp nhận thử thách."
 colony.10035.a.tt: "Bắt đầu Thử thách Lòng dũng cảm."
 colony.10035.b: "Chúng tôi từ chối. Tấn công trực tiếp."
 colony.10040.name: "Thử thách Lòng dũng cảm"
 colony.10040.desc: "Dưới sự dẫn dắt của Vĩnh Hủ Chi Ám, một người định cư được truyền tống vào một hang động sâu trong núi. Trong góc tối tăm, một con quái trùng hung dữ đang chờ đợi. Thứ đó trông giống một con động vật giáp xác có kích thước quá khổ, lớp vỏ lấp lánh những khoáng vật kỳ lạ và hợp kim cổ xưa. Nó như thể đang bảo vệ lãnh thổ, động tác phối hợp nhịp nhàng đến rợn người, cho thấy nó sở hữu trí tuệ khá cao."
 colony.10040.a: "Thử giết chết con quái trùng này."
 colony.10040.a.militarist: "Dùng lửa thiêu chết nó."
 colony.10040.b: "Thử dùng mưu mẹo hạ gục nó."
 colony.10045.name: "Vượt qua Thử thách Dũng sĩ"
 colony.10045.desc: "Người định cư được chọn lao lên tấn công, thép và lớp vỏ giáp chạm nhau chan chát trong hang động tối tăm.\n\nCon quái trùng khổng lồ phản ứng tức thì, đôi càng của nó chẻ đôi đá tảng, thân hình đồ sộ làm rung chuyển cả ngọn núi. Nhưng người định cư đã chuẩn bị sẵn. Anh ta dụ con quái vật vào lối đi hẹp hơn, dự đoán các chuyển động của nó, đánh chính xác vào các khớp và nút cảm biến đã được đánh dấu trước.\n\nKhi bụi bặm lắng xuống, con quái trùng cuối cùng cũng đổ gục, những cái giật mình cuối cùng của nó vang vọng như sấm rền trong núi. Người định cư đầy máu và bụi đất, nhưng đã sống sót bước ra.\n\nVĩnh Hủ Chi Ám chậm rãi gật đầu, dường như tán thưởng hành động liều lĩnh này. Thử thách lòng dũng cảm, đến đây là hoàn thành."
 colony.10045.a: "Để chúng ta tiếp tục nào..."
 colony.10045.a.tt: "Bắt đầu Thử thách Trí tuệ."
 colony.10046.name: "$colony.10045.name$"
 colony.10046.desc: "Chiến đấu trực diện tuyệt đối không phải là chiến thuật khả thi. Người định cư quan sát sự di chuyển của quái trùng, sự ghét ánh sáng của nó, phản ứng cực nhạy với rung động, và quan trọng nhất, sự mù lòa của nó. Nó chỉ phản ứng với âm thanh. Mỗi cử động đều là phản xạ với tiếng vang và va chạm. Người định cư đã vạch ra một kế hoạch, không phải đối đầu mà là đánh lạc hướng.\n\nNgười định cư ném một loạt đá vào cột đá trung tâm của thạch thất. Theo âm thanh vang vọng, con quái thú lập tức phản ứng, lao về phía tiếng ồn.\n\nCột đá trung tâm vỡ vụn, khiến trần thạch thất sụp đổ. Người định cư đã tìm thấy chỗ trú ẩn trong một hốc hẹp, tránh được phần lớn đá rơi. Con quái trùng bị vùi lấp dưới hàng tấn đá, bị kẹt lại và cuối cùng trút hơi thở cuối cùng.\n\nVĩnh Hủ Chi Ám dường như rất trân trọng trí thông minh của người định cư. Thử thách lòng dũng cảm, đến đây là hoàn thành."
 colony.10047.name: "Thử thách Lòng dũng cảm thất bại"
 colony.10047.desc: "Móng vuốt của con quái thú nhanh như chớp, phát ra những tiếng u u khẽ trong bóng tối hang động, mỗi động tác đều mờ ảo, mỗi đòn tấn công đều đi kèm với xung mạch tần số thấp, làm rung chuyển cả đá tảng.\n\nNgười định cư di chuyển cẩn thận, cân nhắc các biện pháp đối phó có thể thực hiện. Đánh lừa, dụ dỗ, tìm cách tấn công, hoặc có lẽ là đánh lạc hướng. Nhưng sinh vật này thích nghi nhanh hơn dự kiến. Đòn tấn công tiếp theo của nó trúng đích chính xác, sinh vật này vì giận dữ mà cơ thể phát sáng, thắp sáng cả hang động.\n\nKhi bụi bặm lắng xuống, người định cư đã chết. Chúng ta đã không thể vượt qua thử thách."
 colony.10047.a: "Một hành động anh dũng"
 colony.10050.name: "Thử thách Trí tuệ"
 colony.10050.desc: "Một giọng nói bắt đầu vang lên trong căn phòng. Ban đầu run rẩy và do dự, nhưng chẳng mấy chốc đã vang dội như thể cả vách đá đang tụng niệm:\n\n§H“Không dựa binh luật thoát tịch liêu,\nNgậm miệng kết ước hận xưa tiêu.\nÝ chí cơ quan không dùng được,\nNgầm chuyển dời thay ngân hà điều.\nĐại tượng hy hình tạo hóa chí,\nThái bình quy cảnh hỗn độn tiêu.”§!"
 colony.10050.a: "Đáp án là “Phi thăng”."
 colony.10050.b: "Đáp án là “Tinh hải đại đồng”."
 colony.10055.name: "Thử thách Trí tuệ thất bại"
 colony.10055.desc: "Lời của người định cư vừa rời khỏi [Owner.Species.GetMouthName], ánh sáng đã rút lui. Giọng của Vĩnh Hủ Chi Ám xé toạc sự im lặng: “[Owner.GetSpeciesNameInsult],” nó nói, “ngươi nghĩ khao khát quyền lực có thể giải thích được tất cả sao?”\n\nNgay khoảnh khắc đó, người định cư bị đánh trúng. Nuốt chửng anh ta không phải lửa hay vũ khí, mà chỉ có áp lực và sự im lặng. Anh ta lặng lẽ ngã xuống, hang núi nuốt trọn thi thể. Thử thách của chúng ta đã thất bại."
 colony.10060.name: "Vượt qua Thử thách Trí tuệ"
 colony.10060.desc: "Sau khi nói ra đáp án, người định cư nín thở, hy vọng mình đã đoán đúng. Trong thạch thất vang lên những tiếng ầm ầm tán thưởng, Vĩnh Hủ Chi Ám trông có vẻ rất vui mừng.\n\n“Ngươi hiểu rồi,” nó nói. “Không phải mọi thử thách đều kiểm tra sức mạnh. Cũng có những thử thách chỉ cần ngươi có lòng dũng cảm để mở rộng trái tim.”\n\nCâu đố dần tan biến, ánh sáng dịu nhẹ tràn ngập hang động. Thử thách đã thành công, con đường phía trước vẫn đang chờ đợi chúng ta."
 colony.10060.a: "Chúng ta phải tiếp tục tiến lên..."
 colony.10060.a.tt: "Bắt đầu Thử thách Hy sinh."
 colony.10065.name: "Thử thách Hy sinh"
 colony.10065.desc: "Một người định cư bước lên đón nhận thử thách. Anh ta được đưa lên một bàn tế khổng lồ tối đen như mực, ở giữa đặt hai chiếc ghế obsidian và một chiếc bàn dài thấp. Trên đó chỉ đặt một món vũ khí, một thanh đoản đao tao nhã. Người định cư dùng [Owner.Species.GetHandName] cầm đao lên, cảm nhận được sức mạnh bên trong đang rung động nhè nhẹ.\n\nVua Tamperion bị trói trên một trong hai chiếc ghế, trói ông không phải dây thừng thông thường mà là những sợi chỉ phát sáng cấu thành từ một lực cơ bản nào đó. Biểu cảm của ông thật khó đoán, không sợ hãi cũng chẳng bình thản, chỉ có một sự im lặng chết chóc. Chiếc ghế còn lại thì trống không.\n\nSau đó giọng nói đó lại một lần nữa vang lên trong đầu người định cư.\n\n“Trước thanh đao này, dù quốc vương hay kẻ hèn nhát đều bình đẳng như nhau.” Vĩnh Hủ Chi Ám thì thầm, “Muốn vượt qua cuộc thẩm phán này, phải tước đi một mạng sống. Hoặc là móc trái tim của Vua Tamperion, hoặc là hy sinh chính ngươi; tự chọn đi. Chọn sai... thử thách sẽ kết thúc.”"
 colony.10065.a: "Vĩnh biệt nhà vua."
 colony.10065.b: "Chúng tôi sẽ hy sinh."
 colony.10070.name: "Vượt qua Thử thách Hy sinh"
 colony.10070.desc: "Người định cư đứng trước Vua Tamperion, đứng lặng yên. Thanh đoản đao nằm trên mặt bàn obsidian nhẵn bóng. Vĩnh Hủ Chi Ám không đưa ra bất kỳ chỉ dẫn nào.\n\nNgười định cư cầm thanh đao, dứt khoát đâm vào lồng ngực Vua Tamperion, động tác nhanh chóng và quyết đoán. Ông không kêu la, chỉ có tiếng kim loại kêu vang dịu nhẹ, như tiếng chuông từ phương xa.\n\nVua Tamperion ngẩng đầu lên, ánh mắt bình thản. Lưỡi đao ngập sâu, thứ bị đâm xuyên không phải da thịt mà là một loại vật chất hoàn toàn khác biệt. Lồng ngực ông phát sáng nhè nhẹ, lấp lánh ánh vàng. Vua Tamperion quả thực là “Kẻ Có Trái Tim Vàng”...\n\nSự trói buộc quanh nhà vua biến mất, bàn tế cũng mờ dần. Vĩnh Hủ Chi Ám lại một lần nữa nói với chúng ta: “Các ngươi có thể tiếp tục rồi.”"
 colony.10070.a: "Thật là một kết quả kinh ngạc."
 colony.10075.name: "Thử thách Hy sinh thất bại"
 colony.10075.desc: "Người định cư nhìn Vua Tamperion, tay nắm chặt thanh đao. Vua Tamperion ngồi yên lặng, ánh nhìn dịu dàng của ông không hề có sự cầu xin, cũng không có sự cho phép. Người định cư do dự một chút, rồi hướng lưỡi đao về phía chính mình.\n\nNgười định cư hít một hơi thật mạnh, ngã xuống đất, tiếng đoản đao rơi trên bàn tế vang lên. Lựa chọn đã rõ ràng: tha cho thủ lĩnh người Anathari, một mình gánh vác trọng trách.\n\nNhưng lời của Vĩnh Hủ Chi Ám không có giận dữ cũng chẳng có vui mừng: “Lòng trắc ẩn không phải là sự khoan dung. Thanh đao này không nên dùng cho chính mình.”\n\nMột giọt nước mắt lặng lẽ lăn dài trên khuôn mặt Vua Tamperion. Chúng ta đã dùng ý tốt lớn nhất để định đoạt số phận của con dân ông.\nThử thách kết thúc, không có vinh quang, chỉ có bi ai. Người định cư đó đã chết, con đường phía trước không hề mở ra."
 colony.10080.name: "Khao khát nội tâm"
 colony.10080.desc: "Vĩnh Hủ Chi Ám đứng trước mặt chúng ta, vẫn khó đoán như vậy. Hình dạng của nó chỉ là một bóng đen khổng lồ và mờ ảo in trên đá, như thể thuộc về một thực tại chỉ giao thoa một phần với chiều không gian này. Nó không phát ra âm thanh, mà trực tiếp bộc lộ sự hiện diện trong tâm trí chúng ta, mỗi suy nghĩ đều không cần nói ra, cũng không thể trốn tránh.\n\nTrong tĩnh lặng, Kẻ Bất Tử Bóng Tối truyền đi một ý nghĩ dịu dàng và gần như vui sướng: “Các ngươi đã có được sự ưu ái của ta, lũ [Owner.GetSpeciesNamePlural] bé nhỏ. Ta rất ấn tượng về các ngươi. Nói đi, các ngươi muốn gì?”"
 colony.10080.a: "Cút khỏi hành tinh này và đừng bao giờ quay lại."
 colony.10080.b: "Tiêu diệt người Anathari."
 colony.10081.name: "Thành công rực rỡ"
 colony.10081.desc: "Một sự im lặng. Một sự im lặng xuyên qua tư tưởng và thời gian. Tiếp theo đó là một lời hứa không lời. “Ta không cần phải nhìn chằm chằm vào người Anathari nữa.” Vĩnh Hủ Chi Ám nói, “Giờ thuộc quyền quản lý của ngươi.” Nói xong, nó biến mất. Không có ánh sáng, cũng không có âm thanh, chỉ có sự thay đổi nhỏ trong không khí khiến người ta nhận ra thứ gì đó khổng lồ đã rời đi.\n\nTrong chu kỳ sau lần tiếp xúc đầu tiên, sự giao thoa giữa người định cư và người Anathari trở nên suôn sẻ hơn. Mùa màng bội thu, thành phố và thiên nhiên phát triển hài hòa, thực vật và công nghệ song hành. Lần đầu tiên sau nhiều thế kỷ, [Root.GetName] trở nên phồn vinh, tràn ngập một bầu không khí không bị sức nặng của xung đột đè nén, chỉ có sự điều hòa hòa bình."
 colony.10081.a: "Thành công vang dội."
 colony.10082.name: "Cơn mưa cánh hoa vàng"
 colony.10082.desc: "“Như ngươi mong muốn.”\n\nVĩnh Hủ Chi Ám rút lui khỏi tâm trí chúng ta, cũng tiện tay thay đổi một thứ gì đó rất cơ bản. Những người định cư cảm thấy một sự bất an và buồn nôn thấu xương tủy. Trên khắp hành tinh, người Anathari bắt đầu sụp đổ. Không có tiếng thét, không có sự vùng vẫy, chỉ có tiếng sột soạt của những bộ y phục lộng lẫy hóa thành tro bụi, như tiếng thì thầm của những cánh hoa phiêu tán trong gió.\n\nTrong thạch thất, Vua Tamperion vẫn còn thoi thóp. Ông chớp mắt không thể tin nổi, bên trong tràn đầy sự thất vọng trước sự phản bội đột ngột của các [Owner.GetSpeciesNamePlural]. Ông không hề giơ tay, cũng không hề cầu xin. Một bông hoa vàng trượt từ ống tay áo ông xuống đất. Sau đó ông cũng qua đời. Không có nỗi đau, cũng chẳng có sự nhẹ nhõm, chỉ có sự trống rỗng khổng lồ để lại sau khi một cộng đồng, một bài ca, một nền văn minh từng tồn tại đã biến mất khỏi [Root.GetName].\n\nVĩnh Hủ Chi Ám trông có vẻ rất vui sướng."
 colony.10082.a: "Chúng ta vốn không cần họ."
 colony.10085.name: "Thất bại thảm hại"
 colony.10085.desc: "Dù những người định cư đã đặt chân lên con đường dẫn đến Anathari, nhưng cuối cùng bấy nhiêu vẫn chưa đủ. Thử thách thất bại. Vĩnh Hủ Chi Ám sẽ tiếp tục tồn tại, tiếp tục bao trùm lên vùng đất này như một căn bệnh khô héo.\n\nVua Tamperion cũng cần quay lại Hoa Đình, nhưng không phải với tư cách một người bạn, mà một lần nữa trở thành tôi tớ cho Vĩnh Hủ Chi Ám, một vị vua héo tàn của một vương quốc đổ nát. Những người định cư của chúng ta vẫn được phép ở lại hành tinh này, nhưng sẽ không còn nhận được bất kỳ sự tin tưởng nào nữa.\n\n“Ngươi vốn muốn trao cho họ tự do, [Owner.GetSpeciesNamePluralInsult],” Vĩnh Hủ Chi Ám nói trong đầu chúng ta, “nhưng các ngươi không xứng đáng.”"
 colony.10085.a: "Không còn đường lui rồi. Chuẩn bị tử chiến."
 colony.10085.b: "Tiêu diệt người Anathari. Chúng tôi sẽ trở thành tôi tớ trung thành của ngài."
 colony.10085.c: "Rút quân về thuộc địa."
 colony.10086.name: "Chiến tranh là đáp án duy nhất"
 colony.10086.desc: "Chúng ta biết sức mạnh của Vĩnh Hủ Chi Ám là vô cùng lớn. Cuộc tấn công của chúng ta rất quyết đoán và mạnh mẽ. Vĩnh Hủ Chi Ám phát ra một tiếng thét cuồng loạn, cả hang động rung chuyển dữ dội.\n\nDù quân đội chịu tổn thất nặng nề, nhưng chúng ta vẫn tóm được Vĩnh Hủ Chi Ám. Hang động gào rú, không khí như nứt ra như tiếng xương bị nghiền nát. Vĩnh Hủ Chi Ám tan biến.\n\nSau đó, Vua Tamperion đã tiếp kiến những người sống sót. Ông tiến lại gần người định cư, cúi chào sâu sắc. Dù tổn thất nặng nề, nhưng cơn ác mộng cuối cùng đã kết thúc."
 colony.10086.a: "Bất kể thế nào chúng ta vẫn giữ được hành tinh."
 colony.10087.name: "Con đường tôi tớ"
 colony.10087.desc: "Người Anathari khắp hành tinh lung lay trước gió. Xương thịt và ký ức, tất cả những gì họ từng sở hữu bắt đầu biến mất. Vua Tamperion là người cuối cùng. Ông chết mà không nói một lời. Người định cư kể lại rằng, vào giây phút cuối cùng ông đã hóa thành một tia sáng và một vòng cánh hoa vàng.\n\nGiờ chỉ còn lại Vĩnh Hủ Chi Ám. Chúng ta cảm thấy nó lắng xuống trong sự trống rỗng của tâm hồn. Thứ gì đó tối tăm và cổ xưa đang ngọ nguậy trong cơ thể chúng ta, chậm rãi và kiên định chảy từ Vĩnh Hủ Chi Ám đến chúng ta, từ quá khứ đến hiện tại.\n\nNhững người định cư của chúng ta không còn chỉ là [Owner.GetSpeciesNamePlural], mà là một... sự tồn tại mới."
 colony.10087.a: "Chúng tôi chấp nhận số phận."
 colony.10090.name: "Vạn vật hữu chung"
 colony.10090.desc: "Một thực thể khổng lồ hiện ra từ trong bóng tối, không phải dã thú cũng chẳng phải máy móc, mà là thứ gì đó kỳ quái hơn. Hình dạng của nó biến đổi giữa một khối tập hợp nóng chảy và bóng đen sôi sục. Nó không có ý định giao tiếp, chỉ mở rộng cái miệng khổng lồ.\n\nNhà cửa sụp đổ hàng loạt, những người định cư bị xé thành từng mảnh nhỏ tung lên không trung, bị áp lực vô hình nghiền nát. Trong vài giờ, cả vùng đồng bằng chẳng còn lại gì, chỉ có sự im lặng chết chóc khắp nơi.\n\nSau đó, nó biến mất đột ngột như lúc đến, chỉ để lại những dấu vết của cái chết và sự hủy diệt trên hành tinh này."
 colony.10090.a: "Thật là một sức mạnh kinh hoàng..."
 colony.10090.a.tt: "50% dân số trên [Root.GetName] tử vong, nửa còn lại cũng bị tàn phá nghiêm trọng."
 colony.10095.name: "Tình cờ hay định mệnh?"
 colony.10095.desc: "Các đội tuần tra báo cáo phát hiện những cái xác hình thù kỳ dị trong rừng rậm quanh [Root.GetName]. Da của chúng bị cháy thành than, xương cốt cũng ám đen, biểu cảm của sự sợ hãi nguyên thủy đông cứng trên mặt. Không phát hiện bất kỳ vũ khí nào xung quanh, cũng không có dấu hiệu của sự xung đột. Trên thảm thực vật gần đó còn sót lại dấu vết của sự tiếp xúc nhiệt độ cực cao và dị thường trọng lực cục bộ trong thời gian ngắn.\n\nBất kể thứ bị săn đuổi là gì, nó đã chết. Những loài thực vật khô héo bừng nở rực rỡ, các quần thể động vật địa phương cũng mang theo sự hài hòa thận trọng quay lại nơi cũ. Đất đai màu mỡ dường như báo hiệu một vụ mùa bội thu chưa từng có.\n\nHiện tại, thuộc địa đã an toàn."
 colony.10095.a: "Một kết quả may mắn."
