 NAME_Central_Crystal_Station: "Trạm Tinh Thể"
 #Opinions
 opinion_small_boon_crystal_empire: "Đế chế hào hiệp"
 #Triggered Loc
 not_bio_alloy: "Hợp kim"
 bio_alloy: "Hợp kim sinh học"
 #Fumongus Anomaly
 fungal_emitters_category: "Bức xạ quái lạ"
 fungal_emitters_category_desc: "Bức xạ bất ngờ phát ra từ các hang động dưới lòng đất của [From.GetName]. Liệu đây có phải tín hiệu của thứ gì đó?"
 anomaly.6755.name: "Máy phát nấm"
 anomaly.6755.desc: "Dưới bề mặt [From.GetName] có một sinh vật kỳ lạ: một hệ sợi nấm phát tán bào tử với kích thước khổng lồ. Bề mặt chúng lấp lánh và thay đổi màu sắc theo môi trường. Kỳ lạ hơn, chúng tạo thành một mạng lưới phát ra tín hiệu khoa học. Hiện bức xạ còn yếu, nhưng có thể tìm ra đích đến của chúng nếu cố gắng thêm."
 anomaly.6755.a: "Chúng ta sẽ thử xác định đích đến của tín hiệu."
 anomaly.6755.b: "Mang chúng về bán lấy tiền."
 anomaly.6755.c: "Không rảnh quan tâm việc này."
 anomaly.6760.intro: "Dưới lòng đất [From.GetName] là một hệ sợi nấm liên kết trực tiếp với các \"Nấm Khổng Lồ\". Các bào tử biến đổi thành những khối cầu rực rỡ và phát ra tín hiệu mạnh hơn bình thường."
 anomaly.6760.desc: "$anomaly.6760.intro$\n\nCác nhà khoa học cho rằng có thể tăng cường mạng lưới bằng cách mang các bào tử này về cấy lại vào \"Nấm Khổng Lồ\"."
 anomaly.6760.a: "Chuẩn bị dự án để thực hiện."
 anomaly.6760.b: "Chỉ mang dữ liệu về thôi."
 anomaly.6765.desc: "$anomaly.6760.intro$\n\nDo chúng ta đã tháo dỡ mạng lưới nên số thông tin này không còn nhiều giá trị."
 anomaly.6770.name: "Lần theo dấu nấm"
 anomaly.6770.intro: "Việc truy vết tín hiệu từ sợi nấm hóa ra vô cùng khó khăn."
 anomaly.6770.desc: "$anomaly.6770.intro$ Các nhà khoa học đưa ra giả thuyết về việc \"nhìn thấu chiều không gian cao hơn qua nấm\". Dù thiếu chi tiết về kết quả, nhưng hoạt động này đã thành công chỉ ra một mục tiêu cụ thể."
 anomaly.6770.a: "Chỉ đường đi!"
 anomaly.6780.desc: "$anomaly.6770.intro$ Dù [Root.GetLeaderName] đã hết sức cố gắng nhưng vẫn không thể xác định đích đến, nấm vẫn là một bí ẩn. Dù vậy chúng ta cũng thu được lượng lớn dữ liệu."
 anomaly.6785.name: "Mạng lưới nấm"
 anomaly.6785.desc: "Ghép bào tử biến dị vào nấm hiện có là một kỳ tích sinh học. Nấm đã lớn gấp mười lần, đòi hỏi lượng nước khổng lồ từ các tiểu hành tinh băng lân cận. Với mạng lưới lớn hơn và thiết bị được nâng cấp, chúng ta đã sẵn sàng nghe xem các bào tử muốn nói gì."
 FOLLOWING_FUNGI_PROJECT: "Hành trình nấm"
 FOLLOWING_FUNGI_PROJECT_DESC: "Một dị thường trên [From.GetName] tiết lộ quần thể nấm kỳ lạ phát ra tín hiệu. Bằng cách khuếch đại nguồn phát, chúng ta có thể tìm ra đích đến của nó."
 MUSHROOMING_NETWORK_PROJECT: "Ghép bào tử"
 MUSHROOMING_NETWORK_PROJECT_DESC: "Phát hiện bào tử đột biến mang lại cơ hội phát triển mảng lắng nghe của hệ sợi nấm, giúp thúc đẩy sự phát triển của \"Nấm Khổng Lồ\"."
 fumongus_chain_title: "$FOLLOWING_FUNGI_PROJECT$"
 fumongus_chain_desc: "$anomaly.6770.desc$"
 fumongus_poi_1: "$FOLLOWING_FUNGI_PROJECT$"
 fumongus_1_desc: "$anomaly.6770.desc$"
 ### Các Sự Kiện Thuộc Địa Fumongus
 #Events
 colony.2060.name: "Thu Hoạch Nấm"
 colony.2060.desc: "Trong một cuộc nghiên cứu sinh thái định kỳ tại thuộc địa trên [Root.GetName], chúng ta đã tình cờ phát hiện ra một dạng sống nấm kỳ lạ. Nhóm khoa học báo cáo rằng bề mặt của hệ sợi nấm phát ra ánh sáng rực rỡ và đa sắc, nhưng điều khiến họ quan tâm nhất là các cụm nấm khác nhau dường như đang giao tiếp với nhau mỗi khi có sự kiện gì đó xảy ra trên diện rộng.\n\nNgoài ra, đặc điểm sinh học của sinh vật này dường như khác biệt hoàn toàn với hệ sinh thái của thuộc địa. Đội ngũ khoa học địa phương đang khá lúng túng và yêu cầu hỗ trợ chuyên môn, vì chúng ta có thể đang đối mặt với một loài có tri giác."
 colony.2060.a: "Dọn dẹp chúng đi."
 colony.2060.b: "Khảo sát chuyên sâu"
 colony.2060.c: "...Chúng có liên quan đến Nấm Khổng Lồ!"
 colony.2065.name: "Bào Tử Có Tai"
 colony.2065.desc: "Chúng ta đã nhận được báo cáo từ [Root.GetName]. Sau khi kiểm tra kỹ hơn, chúng ta phát hiện loài nấm ngoại lai này dường như đang phát tín hiệu đến một vị trí nào đó trong thiên hà mà hiện tại chưa thể xác định. Các phép đo từ xa và phân tích an ninh cho thấy hệ sợi nấm hoàn toàn có khả năng là một loại sinh vật gián điệp cao cấp.\n\nTuy nhiên, đáng lưu ý là sinh vật này đã rất già. Những kẻ thiết kế ra loại nấm gián điệp này có lẽ đã không còn nữa. Nhưng nếu chúng còn tồn tại, tốt nhất là đừng đánh thức những kẻ săn mồi đang ngủ say này."
 colony.2065.a: "Chúng ta muốn biết thêm."
 colony.2065.b: "Quá mạo hiểm. Tiêu hủy chúng."
 colony.2070.intro: "Phân tích kỹ lưỡng hệ sợi nấm và các tín hiệu cho thấy nó có thể là một phần của mạng lưới sinh học tương tự, có khả năng bao phủ toàn bộ thiên hà hoặc thậm chí xa hơn. Dù chưa biết nhiều, chúng ta phát hiện ra rằng với tư cách là một phần của mạng lưới, hệ sợi nấm này cũng đang nhận tín hiệu từ những nơi khác."
 colony.2070.name: "Tai Vách Mạch Rừng"
 colony.2070.desc: "$colony.2070.intro$\n\nChúng ta chưa thể chắc chắn, nhưng dựa trên một vài yếu tố bao gồm lượng dữ liệu truyền tải, chúng ta tin rằng có ai đó đang tích cực sử dụng mạng lưới này để thu thập thông tin. Chúng ta đã bắt đầu lập kế hoạch phản gián bằng thông tin giả và đang cập nhật các biện pháp an ninh trên toàn đế chế để đối phó với hình thức gián điệp này."
 colony.2070.a: "Bắt đầu tung tin giả!"
 colony.2075.name: "Không Người Lắng Nghe"
 colony.2075.desc: "$colony.2070.intro$\n\nDựa trên một vài yếu tố bao gồm lượng dữ liệu truyền tải, chúng ta tin rằng mạng lưới này không còn được sử dụng. Việc nó vẫn còn hoạt động một phần cho thấy nó có thể chỉ đang ở trạng thái ngủ đông thay vì bị hỏng."
 colony.2075.a: "Chúng ta có thể học được gì?"
 colony.2080.name: "Kết Nối Bào Tử"
 colony.2080.desc: "Mọi nghi ngờ về mối liên hệ giữa loại nấm này và mạng lưới lắng nghe bằng hệ sợi nấm đã nhanh chóng được giải tỏa sau một cuộc so sánh ngắn. Đây là một trong nhiều hậu duệ giao tiếp với Nấm Khổng Lồ, đây có thể là cơ hội tốt để chúng ta hiểu thêm về sinh vật này."
 colony.2080.a: "Thử xem liệu chúng ta có thể tăng cường mạng lưới này không."
 colony.2080.b: "Dùng nó để giám sát thuộc địa."
 colony.2080.c: "Tháo dỡ mạng lưới, nhưng chúng ta vẫn có thể nghiên cứu nó."
 colony.2085.name: "Cuộc Nổi Loạn Tại [Root.GetName]."
 colony.2085.desc: "Tin tức về việc chúng ta sử dụng mạng lưới nấm địa phương để giám sát chặt chẽ thuộc địa đã lan rộng, nhưng không được đón nhận nồng nhiệt. Mặc dù chúng ta đã nỗ lực hết sức để xoa dịu tình hình, người dân địa phương nhìn chung cho rằng điều này đi ngược lại nguyên tắc tin tưởng lẫn nhau và yêu cầu chúng ta chấm dứt dự án ngay lập tức.\n\nTình hình leo thang nhanh chóng, lực lượng hành pháp địa phương của chúng ta đã quá tải. Nếu chọn tiếp tục dự án, họ sẽ cần chúng ta giúp đỡ để duy trì quyền kiểm soát thuộc địa."
 colony.2085.a: "Người dân đã đúng. Từ bỏ."
 colony.2085.b: "Nếu họ không có gì khuất tất, họ chẳng có gì phải sợ."
 colony.2090.name: "Bào Tử Thính Tai"
 colony.2090.desc: "Chúng ta đã nuôi cấy hệ sợi nấm trên [Root.GetName] và tinh chỉnh các thiết bị tính toán tại chỗ để loại bỏ nhiễu. Đội ngũ phụ trách báo cáo rằng mạng lưới hiện đang giám sát chặt chẽ những người định cư. Một vài tội phạm nhỏ đã bị xử lý thích đáng.\n\nĐáng tiếc là các nỗ lực sao chép và lắp đặt ở những nơi khác đều thất bại. Rất có thể một vài yếu tố mà chúng ta chưa biết đang tác động vào."
 colony.2095.name: "Nấm Thất Bại"
 colony.2095.desc: "Những nỗ lực thúc đẩy sự lan rộng của hệ sợi nấm trên [Root.GetName] đã dẫn đến sự phát triển của nhiều loại nấm \"truyền thống\" hơn. Một vài sự việc từ phía người định cư cho thấy chúng có thể ăn được. Sự việc này khiến toàn bộ mạng lưới mất cân bằng trong một thời gian, nhưng hiện tại nó dường như đã ổn định và hoạt động bình thường. Tuy nhiên, nhìn chung không có sự cải thiện rõ rệt nào. Có vẻ như những loại nấm này chỉ dùng để trữ nước. Chúng không đóng góp gì cho mạng lưới, và việc tiêu hủy chúng cũng không ảnh hưởng đến mạng lưới."
 colony.2095.a: "Thu hoạch chúng."
 colony.2095.b: "Nghiên cứu chúng."
 terra.15.name: "Thiết Bị Cải Tạo Môi Trường Dư Thừa"
 terra.15.desc: "Sau khi hoàn thành việc cải tạo môi trường cho §Y[From.GetName]§!, những người [Owner.GetTerraformerPlural] của chúng ta đã nhận thấy một cơ hội vàng. Các thiết bị cải tạo môi trường còn lại sau khi được điều chỉnh có thể dùng làm cơ sở hạ tầng cho hành tinh này."
 terra.15.a: "Chúng ta có thể cần thêm nhiều nhà ở."
 terra.15.b: "Xây dựng một số xưởng đúc hợp kim."
 terra.15.c: "Mở rộng khả năng sản xuất năng lượng của hành tinh này."
 terra.15.c.tooltip: "Hành tinh này được thêm §G2§! §Y$district_generator_plural$§!"
 terra.15.d: "Mỏ khoáng sản bao nhiêu cũng không đủ."
 terra.15.d.tooltip: "Hành tinh này được thêm §G2§! §Y$district_mining_plural$§!"
 terra.15.e: "[From.GetName] cần thêm nhiều trang trại."
 terra.15.e.tooltip: "Hành tinh này được thêm §G2§! §Y$district_farming_plural$§!"
 terra.15.f: "Chỉ cần tháo dỡ các thiết bị này là được."
 terra.20.name: "Cảnh Đẹp Cải Tạo"
 terra.20.desc: "Việc cải tạo môi trường §Y[From.GetName]§! hoàn thành nhanh hơn dự tính ban đầu, điều này cho phép những người [Root.GetTerraformerPlural] của chúng ta có thêm thời gian để thực hiện một số thí nghiệm, và kết quả rất ấn tượng. Các đặc tính tự nhiên của hành tinh này đã được tăng cường, vừa mang tính thẩm mỹ vừa đảm bảo tính thực dụng."
 terra.20.a: "Thật tuyệt vời."
 terra.20.b: "Nó nhất thiết phải trông nhân tạo thế này sao?"
 terra.25.name: "Nan Đề Cải Tạo Môi Trường"
 terra.25.desc: "Dự án kéo dài của chúng ta trên §Y[From.GetName]§! đã kết thúc trong sự thất vọng khi chỉ đạt được một phần thành công. Trong lúc thay đổi địa hình của vài thung lũng cuối cùng, máy điều chỉnh sinh khối đã gặp sự cố, dẫn đến việc tạo ra một đống §YPhế tích cải tạo môi trường§!. Dù không gây nguy hiểm cho người định cư, nó khiến hành tinh hiện tại có chút chật chội."
 terra.25.a: "Đừng để chuyện này lặp lại."
 terra.30.name: "Lấy Sai Làm Gương"
 terra.30.desc: "Những người [Owner.GetTerraformerPlural] của chúng ta hiện đã dọn sạch những §YPhế tích cải tạo môi trường§! cuối cùng trên §Y[Root.GetName]§!. Dù công việc dọn dẹp rất vất vả và nhớp nháp, nhưng tất cả không phải là vô giá trị. Việc phân tích nguyên nhân và hậu quả của sự cố này đã giúp chúng ta có hiểu biết sâu sắc hơn về địa hình học."
 terra.30.a: "Dù sao thì cũng có chút lợi ích."
 terra.35.name: "[Root.GetHomeWorldName] Đệ Nhị"
 terra.35.desc: "Chúng ta không chỉ cải tạo môi trường §Y[From.GetName]§! thành công, mà còn làm tốt hơn mong đợi. Ở giai đoạn cuối cùng, những người [Root.GetTerraformerPlural] của chúng ta đã cố gắng biến hành tinh này thành ngôi nhà hoàn hảo cho hệ động vật bản địa của chúng ta, tạo ra một [From.GetPlanetMoon] cực kỳ giống với [Root.GetHomeWorldName]. Tất cả thực vật bản địa của chúng ta cũng sẽ được chuyển đến đó, chỉ là địa hình hơi khác một chút."
 terra.35.a: "[From.GetPlanetMoon] này nên được biết đến là [Root.GetHomeWorldName] Đệ Nhị"
 terra.35.a.tooltip: "Đổi tên §Y[From.GetName]§! thành §Y$terra.35.name$§!"
 terra.35.b: "Một bước phát triển may mắn."
 terra.40.name: "Chiến Lược Hành Tinh"
 terra.40.desc: "Ngay khi công trình cải tạo môi trường §Y[From.GetName]§! sắp hoàn tất, một tình huống độc đáo đã xảy ra. Những người [Root.GetTerraformerPlural] của chúng ta phát hiện ra rằng, chúng ta có khả năng biến [From.GetPlanetMoon] này thành trạng thái bị khóa thủy triều. Nếu hiện tượng này xảy ra tự nhiên, nó có thể gây hại cho thuộc địa. Tuy nhiên, nếu thực hiện trong quá trình cải tạo, chúng ta có thể tận dụng triệt để thời gian chiếu sáng mặt trời vô tận ở bán cầu ngày để sản xuất nguồn năng lượng cực kỳ dồi dào. Tất nhiên, chúng ta cũng cần lập một kế hoạch tập trung để bố trí các khu công nghiệp và nhà ở còn lại ở bán cầu đêm hoặc khu vực đường ranh giới tối sáng."
 terra.40.a: "Hãy để [From.GetPlanetMoon] quay trở lại, làm vậy quá rủi ro."
 terra.40.b: "Cứ làm thế đi."
 terra.40.b.tooltip: "Mở khóa một §YQuyết sách hành tinh§! đặc biệt, có thể khai thác toàn bộ tiềm năng của [From.GetPlanetMoon] này."
 terra.45.name: "Thành Công Quá Mức"
 terra.45.desc: "Khi việc cải tạo §Y[From.GetName]§! hoàn tất, chúng ta thấy công trình này đã đưa chúng ta vào một tình huống bất ngờ. Lượng tài nguyên chúng ta thực sự cần ít hơn so với dự tính ban đầu khi lập dự án, và giờ chúng ta có cơ hội thêm một đặc tính phụ cho [From.GetPlanetMoon] này. Những người [Root.GetTerraformerPlural] đã trình lên ba lựa chọn khác nhau."
 terra.45.a: "Chúng ta có thể sử dụng thêm nhiều $district_generator_plural$."
 terra.45.b: "Xem thử liệu chúng ta có thể cung cấp thêm không gian cho $district_mining_plural$ không."
 terra.45.c: "Hành tinh này cần thêm nhiều $district_farming_plural$."
 terra.50.name: "Chân Nhất"
 terra.50.desc: "Trong quá trình biến đổi §Y[From.GetName]§! thành một hành tinh [This.GetAAnPlanetClass][This.GetClassAdj], những người [Root.GetTerraformerPlural] dự định không chỉ kết nối hệ động vật địa phương vào ý chí tập thể, mà còn muốn kết nối chính hành tinh này vào mạng lưới, dù có chút lo ngại rằng việc tiếp xúc với khí cải tạo môi trường có thể gây ra đột biến. Đàn giờ đây có cơ hội trở nên trọn vẹn hơn bao giờ hết dưới một nhận thức chân thực hơn."
 terra.50.a: "Đúng vậy, đó là ý chí của Đại não."
 terra.50.b: "Không, đó không phải là ý định của hành tinh này."
 terra.55.name: "Tổ Chức Hoàn Hảo"
 terra.55.desc: "Đối với Đàn, việc vượt qua tự nhiên không phải là điều gì mới mẻ. Trong quá trình cải tạo địa hình §Y[From.GetName]§!, từng ngọn núi đều được cân nhắc, từng vị trí của hệ động vật đều được tính toán chiến lược. [From.GetPlanetMoon] này hiện đã trở thành một thiên đường hậu cần được tổ chức hoàn hảo, giúp các [Root.GetUnitDronePlural] của chúng ta đóng góp hiệu quả vào việc xây dựng tổng thể của Đàn."
 terra.60.name: "Khai Quật Được [GetPreFTLUpperPlural]"
 terra.60.desc: "Trong quá trình bón phân cho đất và đưa khí quyển vào §Y[From.GetName]§!, những người [Root.GetTerraformerPlural] của chúng ta đã có một phát hiện bất ngờ. Bên dưới bề mặt của [From.GetName] tồn tại một nền văn minh ngoại lai dưới lòng đất. Có lẽ do mật độ khoáng sản của [From.GetPlanetMoon] nên các máy quét của chúng ta trước đó không phát hiện ra họ.\nNhững [GetPreFTLLowerPlural] này dường như hoàn toàn không nhận ra bề mặt hành tinh đã thay đổi, điều này cho phép chúng ta chủ động quyết định cách tiếp cận với họ."
 terra.60.a: "Thật thú vị."
 terra.60.b: "Nghĩa là dưới đất có lũ sâu bọ chứ gì."
 terra.60.c: "Thật tốt khi thấy vũ trụ không thiếu sinh vật có trí tuệ."
 terra.55.a: "Thật đáng chúc mừng."
 terra.65.name: "Khiếm Khuyết Hữu Ích"
 terra.65.desc: "Những người [Root.GetTerraformerPlural] của chúng ta ban đầu nghĩ rằng một khu đất chỉ là một túi khí hôi thối trên §Y[From.GetName]§!, kết quả không ngờ nơi đó lại là một vùng đất lành! Loại khí độc mà nó phun ra thực chất là §YKhí tự nhiên ngoại lai§! chưa qua tinh chế. Với nguồn tài nguyên thiên nhiên mới này, năng lượng cần thiết để đưa khí quyển vào [From.GetPlanetMoon] đã giảm đáng kể, và chúng ta còn có thể khai thác khí tự nhiên ở đây trong nhiều năm tới!"
 terra.65.a: "Tuyệt vời."
 terra.70.name: "Đột Biến Ngoài Dự Tính"
 terra.70.desc: "Những người [Root.GetTerraformerPlural] mang đến cả tin tốt và tin xấu về tình hình trên §Y[From.GetName]§!. Tin tốt là tiến trình cải tạo môi trường diễn ra rất thuận lợi, chúng ta đã có một hành tinh Gaia tuyệt đẹp. Tin xấu là, tất cả những người sống trên [From.GetPlanetMoon] này đều đã tiếp xúc với khí cải tạo môi trường và không còn thích nghi được với môi trường không phải Gaia nữa. Những cư dân \"bị nhốt tại Gaia\" này thể hiện năng suất tăng vọt đáng kinh ngạc khi sống trên hành tinh Gaia. So với những người nhập cư không bị ảnh hưởng bởi khí cải tạo và mới chuyển đến sau đó, biểu hiện của những cư dân này tốt hơn rất nhiều."
 terra.70.a: "Ít nhất trông họ không có vẻ gì là khó chịu."
 terra.75.name: "[From.GetName] Chính Là Thiên Đường"
 terra.75.desc_regular: "Trong số các [Root.GetTerraformerPlural] chúng ta cử đến §Y[From.GetName]§!, dường như có một bộ phận là tín đồ của một giáo phái cổ xưa trên [Root.GetHomeWorldName]. Những [Root.GetSpeciesNamePlural] này tin rằng trong vũ trụ có một nơi thiên đường dành riêng cho dân tộc chúng ta, kết quả là họ chọn không đi tìm kiếm mà tự tay tạo ra thiên đường đó. [From.GetName] giờ đây đã biến thành một [From.GetPlanetMoon] được ban phước, hệt như những hình ảnh hiện ra từ các chương sách lịch sử cổ đại của chúng ta."
 terra.75.desc_spirit: "Những người thợ cải tạo môi trường của chúng ta đã hoàn thành một kỳ tích chưa từng có! Xem lại toàn bộ lịch sử của [Root.GetName], luôn có một huyền thoại hoặc truyền thuyết kể về vùng đất ban phước được hứa hẹn cho nhân dân chúng ta — một thiên đường. Khi chúng ta dong buồm đến các vì sao nhưng không tìm thấy nơi phước lành này, các [Root.GetTerraformerPlural] của chúng ta đã bắt đầu một kế hoạch để tự tay biến truyền thuyết đó thành hiện thực. Giờ đây, đường chân trời của §Y[From.GetName]§! trải dài trước mặt chúng ta, mọi người đều kính cẩn, biết rằng chúng ta đã tự tay tạo dựng thiên đường của riêng mình."
 terra.75.a: "Đẹp không sao tả xiết."
 terra.75.b: "Nó cũng chỉ là một hành tinh Gaia bình thường thôi phải không?"
 terra.80.name: "Thực Vật Phóng Xạ"
 terra.80.desc: "Trong quá trình làm sạch phóng xạ trong khí quyển và đất của §Y[From.GetName]§!, những người [Root.GetTerraformerPlural] của chúng ta đã phải nhờ đến các nhà sinh vật học ngoại lai. Họ phát hiện ra một loài sinh vật sống nhờ vào phóng xạ, và hiện đang héo úa. Đáng kinh ngạc hơn, loài này trông vẫn ở trạng thái chưa khai mở trí tuệ, nhưng sắp sửa tiến hóa thành thông minh. Giờ đây, khi những lớp bùn cuối cùng sắp được gột rửa sạch sẽ, chúng ta phải quyết định cách xử lý sự sống mới này."
 terra.80.a: "Chúng ta đã phá hủy môi trường sống của chúng, giờ chúng ta nên bảo vệ chúng."
 terra.80.a.tooltip: "400 dân cư chưa khai trí £pop£ §HDân cư Tổng hợp Phóng xạ§! sẽ được thêm vào [This.GetName]."
 terra.80.b: "Tại sao không để chúng gia nhập với chúng ta?"
 terra.80.c.indifferent: "Thu thập vật chất di truyền của chúng."
 terra.80.c.xenophile: "Nghiên cứu sinh học của chúng."
 terra.80.c.cantuse: "Dù không thể áp dụng lên bản thân, nhưng vật chất di truyền của chúng có thể hữu ích."
 terra.80.c.tooltip: "Mở khóa đặc tính §Y$trait_plantoid_radiotrophic$§! để dùng cho biến đổi gen."
 terra.80.d: "Chúng ta bận tâm đến mấy thứ cỏ dại này làm gì. Hoàn thành cải tạo môi trường."
 terra.85.name: "Sự Tiếp Đón Rạng Rỡ"
 terra.85.desc: "Sau nhiều năm điều chỉnh những loài thực vật tổng hợp phóng xạ mà chúng ta phát hiện trên §Y[FromFromFrom.GetName]§! và giúp chúng thích nghi với môi trường, giờ đây chúng ta có thể đưa chúng vào xã hội. Dù loài này còn trẻ một cách bất ngờ, nhưng chúng trông rất giỏi việc thu thập năng lượng."
 terra.85.a: "Chào mừng!"
 terra.85.a.tooltip: "§G600§! £pop£ §HDân cư Tổng hợp Phóng xạ§! gia nhập đế chế của chúng ta."
 terra.90.name: "Kho Vũ Khí"
 terra.90.desc: "Khôi phục một hành tinh chết là một công việc gian khổ, lại còn lặp đi lặp lại một cách đơn điệu: cách ly một khu vực, dọn sạch sỏi đá, thay thế đất đai, thanh lọc mọi nguồn nước còn sót lại, thêm các loài động vật mới. Khi tiến trình cải tạo môi trường của §Y[From.GetName]§! dần đi đến hồi kết, những người [Root.GetTerraformerPlural] của chúng ta đã phát hiện ra một thùng chứa kim loại khổng lồ dưới lòng đất, dựa trên các công sự phòng thủ của nó, chúng ta giả định đây là một kho vũ khí."
 terra.90.a: "Thật tò mò."
 terra.95.name: "Lật Mở Quá Khứ Bụi Phủ"
 terra.95.desc: "Kho chứa của [From.Planet.GetName] không hề dễ đào bới, vì vị trí phát hiện nằm sâu dưới các tàn tích đô thị. Lại vì bất kể bên trong chứa thứ gì, chúng ta đều được yêu cầu phải thận trọng để tránh vô tình kích hoạt nó, khiến tiến độ khai quật bị chậm lại thêm. Giờ đây công trình này sừng sững trước mặt chúng ta, chờ đợi chúng ta bắt đầu điều tra bất cứ lúc nào. Những ký tự ngoại lai phức tạp được khắc trên hai bên của kho chứa, có lẽ có thể gợi ý cho chúng ta biết bên trong có nội dung gì."
 terra.100.name: "Kho Khí Giới"
 terra.100.desc: "Các [Owner.GetLinguists] của chúng ta đã hoàn thành việc dịch các văn bia ngoại lai, phát hiện bên ngoài kho chứa khắc một lời cảnh báo. §Y\"Trong thời kỳ chiến tranh, trong bất kỳ tình huống nào, không cho phép bất kỳ chính phủ nào tiến vào kho khí giới này!\"§!\n\nBất kể loại vũ khí nào được lưu trữ ở đây, nó đủ sức hủy diệt cả một nền văn minh, có thể biến họ thành tro bụi. Việc còn lại của chúng ta là cẩn thận mở kho khí giới này ra, và sau đó lấy phần thưởng của mình."
 terra.105.name: "Sai Sót Dịch Thuật"
 terra.105.desc.generic: "Có vẻ như các [Owner.GetLinguists] của chúng ta đã dịch sai từ \"Thư viện\" thành \"Kho khí giới\". Chúng ta đã luôn hiểu sai về cụm từ \"Nguồn gốc của quyền lực\", cho đến khi mở kho chứa ra và thấy thêm nhiều văn bản ngoại lai. §Y\"Nếu bạn đang đọc đoạn này, điều đó có nghĩa là chúng tôi đã sống sót sau chiến tranh và giờ chuẩn bị bắt đầu tái thiết. Khi tình hình hành tinh của chúng tôi ngày càng tồi tệ, tôi đã dành nhiều tháng để xây dựng thư viện này, những người bạn và đồng nghiệp trung thành luôn ở bên cạnh tôi. Nhưng vì bạn đang đọc đoạn này, nghĩa là một ai đó trong chúng tôi đã sống sót, vì vậy xin hãy đón nhận di sản này. Tất cả thành quả liên quan đến văn hóa của nhân dân chúng tôi mà tôi và bạn bè thu thập được đều tập trung ở đây. Người đầu tiên nhìn thấy đoạn này sẽ trở thành biểu tượng cho người bạn thân yêu nhất của tôi.\"§!\n\nPhía dưới tấm bảng là di hài của một sinh vật có vú hai chân, cùng với một bức tượng kim loại của một sinh vật bốn chân mũi dài."
 terra.105.desc.earth: "Có vẻ như các [Owner.GetLinguists] của chúng ta đã dịch sai từ \"Thư viện\" thành \"Kho khí giới\". Chúng ta đã luôn hiểu sai về cụm từ \"Nguồn gốc của quyền lực\", cho đến khi mở kho chứa ra và thấy thêm nhiều văn bản ngoại lai. §Y\"Nếu bạn đang đọc đoạn này, điều đó có nghĩa là chúng tôi đã sống sót sau chiến tranh và giờ chuẩn bị bắt đầu tái thiết. Khi tình hình hành tinh của chúng tôi ngày càng tồi tệ, tôi đã dành nhiều tháng để xây dựng thư viện này, những người bạn và đồng nghiệp trung thành — Walter — luôn ở bên cạnh tôi. Nhưng vì bạn đang đọc đoạn này, nghĩa là một ai đó trong chúng tôi đã sống sót, vì vậy xin hãy đón nhận di sản này. Tất cả thành quả liên quan đến văn hóa của nhân dân chúng tôi mà tôi và Walter thu thập được đều tập trung ở đây. Người đầu tiên nhìn thấy đoạn này sẽ trở thành biểu tượng cho người bạn thân yêu nhất của tôi.\"§!\n\nPhía dưới tấm bảng là di hài của một sinh vật có vú hai chân, cùng với một bức tượng kim loại của một sinh vật bốn chân mũi dài."
 terra.105.a: "Vuốt ve bức tượng."
 terra.105.b: "Ghi danh truyền thông ngoại lai."
 terra.105.c: "Đã hứa cho vũ khí mà, đem nấu chảy thư viện và bức tượng để chế tên lửa đi."
 #Deposit
 d_fungal_study_zone: "Vùng Nghiên Cứu Nấm"
 d_fungal_study_zone_desc: "Những loại nấm \"gián điệp\" được phát hiện ở đây là nguồn cung cấp vô tận những hiểu biết bí ẩn về đặc điểm sinh học kỳ lạ của chúng và cách chúng liên kết với nhau."
 d_terraforming_blocker: "£blocker£ Phế Tích Cải Tạo Môi Trường"
 d_terraforming_blocker_desc: "Kết quả của một công trình cải tạo môi trường thành công một phần là việc tạo ra các di hài sinh học kỳ lạ ở nhiều khu vực."
 d_dayside_farm: "Nhà Máy Điện Mặt Trời Bán Cầu Ngày"
 d_dayside_farm_desc: "Hành tinh này bị khóa thủy triều, toàn bộ năng lượng mặt trời đều chiếu vào bán cầu ngày, khiến khu vực này có thời gian ban ngày vô tận."
 d_radiotrophic_preserve: "Khu Bảo Tồn Tổng Hợp Phóng Xạ"
 d_radiotrophic_preserve_desc: "Một khu vực cách ly, đầy áp suất thấp và khí quyển tràn ngập phóng xạ, cho phép các loài bản địa của hành tinh này sống sót."
 #Modifier
 fumongus_monitor_pops: "Mạng Lưới Nấm Địa Phương"
 fumongus_monitor_pops_desc: "Chúng ta đã thiết lập việc sử dụng mạng lưới nấm địa phương để giám sát những người định cư trên hành tinh."
 disinformation_protocols: "Giao Thức Tin Giả"
 UBUME_BABY_CAT: "Mảnh Vỡ Kỳ Lạ"
 UBUME_BABY_CAT_DESC: "Quét dọn phát hiện một bãi mảnh vỡ không rõ nguồn gốc. Điều này có liên quan đến con tàu khoa học bị bỏ rơi đang tuần tra trong hệ sao này không?"
 anomaly.6791.name: "Tàu Ma"
 anomaly.6791.desc: "Việc quét bãi mảnh vỡ $NAME_Hillos$ đã hoàn tất. Cấu trúc hóa học của nó vừa mang tính sinh học vừa mang tính phi sinh học, chúng ta chưa từng thấy thứ gì tương tự.\n\nMối liên hệ giữa bãi mảnh vỡ này và con tàu kỳ lạ đang tuần tra trong hệ sao này vẫn còn mờ mịt. Không có dấu hiệu sự sống trên tàu. Thực tế, chúng ta không thể dò thấy bất kỳ loại tín hiệu năng lượng nào. Có thể nói là chúng ta đã vấp phải một con tàu ma."
 anomaly.6791.a: "Thật đáng sợ."
 anomaly.6792.name: "Ấu Thể của $NAME_Hillos_ship$"
 anomaly.6792.desc: "Nhóm nghiên cứu của chúng ta kết luận rằng, con tàu bị bỏ rơi được gọi là \"$NAME_Hillos_ship$\" trong nhật ký lệnh đã từng tiến hành thí nghiệm trong hệ sao $NAME_Hillos$ với mục đích tạo ra sự sống tổng hợp nhân dạng. Thiết bị giam giữ phản vật chất bị rò rỉ dẫn đến việc toàn bộ nhân viên trên tàu cùng với \"đứa trẻ\" mới chào đời thiệt mạng. Tuy nhiên, một lượng nhỏ năng lượng tâm linh được dò thấy trong các hệ thống của tàu cho thấy thực thể sống tổng hợp đó đã \"hiện hồn\" và chiếm quyền kiểm soát con tàu vài giây trước khi tai nạn xảy ra.\n\nCó thể hình dung, ý thức mới sinh này đã mất hàng thế kỷ lang thang tìm kiếm mẹ mình một cách vô ích. Thật không may, lúc này chúng ta không có cách nào giao tiếp với thực thể đó, cũng không thể giúp nó siêu thoát. Hiện tại, hệ sao $NAME_Hillos$ có lẽ định sẵn sẽ tiếp tục có tàu ma ám ảnh."
 anomaly.6792.alt.desc: "Nhóm nghiên cứu của chúng ta kết luận rằng, con tàu bị bỏ rơi được gọi là \"$NAME_Hillos_ship$\" trong nhật ký lệnh đã từng tiến hành thí nghiệm trong hệ sao $NAME_Hillos$ với mục đích tạo ra sự sống tổng hợp nhân dạng. Thiết bị giam giữ phản vật chất bị rò rỉ dẫn đến việc toàn bộ nhân viên trên tàu cùng với \"đứa trẻ\" mới chào đời thiệt mạng. Trong các hệ thống của tàu, chúng ta dò thấy sự tồn tại của năng lượng tâm linh. Cảm giác như còn điều gì đó khác đã xảy ra ở đây, một thứ gì đó quái dị hơn một vụ tai nạn đơn thuần.\n\nRất có khả năng thực thể sống tổng hợp này sở hữu một loại năng lực tâm linh tiềm tàng, \"linh hồn\" của nó đã chiếm quyền kiểm soát con tàu vài giây trước khi tai nạn xảy ra. Nếu đúng như vậy, ý thức mới sinh này có thể đã mất hàng thế kỷ lang thang tìm kiếm mẹ mình một cách vô ích. Thật không may, lúc này chúng ta không có cách nào giao tiếp với thực thể đó, cũng không thể giúp nó siêu thoát. Hiện tại, hệ sao $NAME_Hillos$ có lẽ định sẵn sẽ tiếp tục có tàu ma ám ảnh."
 anomaly.6792.alt_hive_robot.desc: "Đánh giá của chúng ta về con tàu trong hệ sao $NAME_Hillos$ đã hoàn tất. Dựa trên nhật ký chỉ huy nội bộ xác định là \"$NAME_Hillos_ship$\", từ các ghi chép tàu phục hồi được có thể biết mục tiêu nhiệm vụ của nó là tạo ra thực thể sống tổng hợp. Một bình chứa phản vật chất bị vỡ dẫn đến cái chết của phi hành đoàn và \"đứa trẻ\" thí nghiệm trên tàu.\n\nCác [Owner.GetTelepathPlural] của chúng ta đã dò thấy vết tích năng lượng tâm linh vất vưởng trong hệ thống của tàu, chúng ta theo đó phát hiện ra vết nứt đó không chỉ đơn thuần là sản phẩm của sự cố kỹ thuật.\n\nCác tín hiệu năng lượng này cho thấy, dạng sống tổng hợp có một loại năng lực tâm linh tiềm tàng, và những năng lực này có khả năng đã hiển lộ trước khi xảy ra sự cố, tất cả dẫn đến một ý thức mới sinh đang tìm kiếm sự chăm sóc của người mẹ. Do không có thêm dữ liệu, chúng ta không thể xác nhận lý thuyết này, vẫn cần nghiên cứu thêm."
 anomaly.6792.a: "Một số phận đau thương."
 anomaly.6792.b: "Thật nản lòng."
 anomaly.6793.name: "Tiếng Thút Thít Tâm Linh"
 anomaly.6793.desc: "Chúng ta dò thấy thứ gì đó phát ra từ hệ sao $NAME_Hillos$. Con tàu ma mang tên $NAME_Hillos_ship$ sử dụng một thứ chỉ có thể gọi là \"băng tần tâm linh\" để không ngừng phát ra tiếng khóc than sầu thảm. Rõ ràng, nó đã luôn như vậy kể từ lần đầu chúng ta gặp con tàu này và ý thức mới sinh bị kẹt trên đó. Có vẻ như việc chúng ta thăng hoa tâm linh gần đây là lý do chúng ta có thể nghe thấy tiếng khóc của đứa trẻ này. Thông qua nghiên cứu thêm, chúng ta có lẽ có thể liên lạc được với nó."
 anomaly.6793.desc.hive_robot: "Chúng ta dò thấy thứ gì đó phát ra từ hệ sao $NAME_Hillos$. Các [Root.GetTelepathPlural] mới điều chỉnh của chúng ta đã bắt đầu nhận được tín hiệu từ tàu $NAME_Hillos_ship$. Những liên lạc này có điểm tương đồng với sinh vật trẻ tuổi, và cho thấy dấu hiệu đã lan truyền kể từ khi chúng ta gặp nhau lần đầu, sự phát triển tâm linh gần đây của chúng ta đã giúp việc phát hiện ra chúng trở nên khả thi.\n\nThông qua nghiên cứu thêm, chúng ta có lẽ có thể giao tiếp nhiều hơn."
 anomaly.6794.name: "Xem Ai Đang Nói Nè"
 anomaly.6794.desc: "Sau nhiều tháng nghiên cứu khổ cực, các sứ giả tâm linh của chúng ta cuối cùng đã thành công trong việc thiết lập liên lạc với ý thức chiếm giữ con tàu ma $NAME_Hillos_ship$. Dù vốn từ của nó rất ít ỏi, nhưng thực thể sống tổng hợp này có thể biểu đạt bằng cảm xúc và ấn tượng. Sự cô đơn của \"đứa trẻ\" này là rõ mồn một, điều này cũng có thể thấy qua sự hân hoan khi nó tiếp xúc với những linh hồn khác. Nó dường như cũng thích công việc nghiên cứu của chúng ta, vui đùa lướt qua hệ sao $NAME_Hillos$ bên cạnh con tàu, hệt như một con cá voi con quấn quýt quanh mẹ mình. Ít nhất, hệ sao $NAME_Hillos$ \"bị ma ám\" cuối cùng cũng có một kết thúc dễ chịu."
 anomaly.6794.desc.hive_robot: "Sau nhiều tháng nghiên cứu cường độ cao, các [Root.GetTelepathPlural] của chúng ta cuối cùng đã có thể giao tiếp với ý thức chiếm giữ con tàu ma $NAME_Hillos_ship$. Dù vốn từ của nó rất ít ỏi, nhưng thực thể sống tổng hợp này có thể biểu đạt bằng cảm xúc và ấn tượng.\n\nSự cô đơn của \"đứa trẻ\" này là rõ mồn một, điều này cũng có thể thấy qua sự hân hoan khi nó tiếp xúc với những linh hồn khác. Hơn nữa, nó dường như cũng thích công việc nghiên cứu của chúng ta, vui đùa lướt qua hệ sao $NAME_Hillos$ bên cạnh con tàu, hệt như một con cá voi con quấn quýt quanh mẹ mình. Ít nhất, hệ sao $NAME_Hillos$ quái dị cuối cùng cũng có một kết thúc dễ chịu."
 anomaly.6794.a: "Xin lỗi, tuyến lệ của tôi hơi quá tải rồi."
 anomaly.6794.a.hive_robot: "Thật là một thực thể thú vị."
 anomaly.6795.desc: "Chúng ta nhận được tin nhắn từ một trong những nhà tâm linh học hàng đầu của mình. Hiện tại, sau khi nghiên cứu sự hiện diện trong hệ sao $NAME_Hillos$, họ đã đảm nhận trọng trách cố gắng giao tiếp với ý thức tâm linh đang chiếm giữ con tàu ma $NAME_Hillos_ship$. Sau nhiều tháng nỗ lực gian khổ, cuối cùng họ đã thành công trong việc thiết lập liên lạc.\n\nSự cô đơn của \"đứa trẻ\" này là rõ mồn một, điều này cũng có thể thấy qua sự hân hoan khi nó tiếp xúc với những linh hồn tương tự khác. Giờ đây nó tinh nghịch lướt qua hệ sao $NAME_Hillos$, dùng năng lực tâm linh để tâm sự với bất kỳ cá nhân nào sẵn lòng lắng nghe giọng nói của nó."
 anomaly.6795.desc.hive_robot: "Sau nhiều tháng nghiên cứu tiếp theo, các [Root.GetTelepathPlural] của chúng ta đã thành công trong việc tiếp xúc với ý thức tâm linh chiếm giữ tàu $NAME_Hillos_ship$.\n\nDù vốn từ của nó rất ít ỏi, nhưng thực thể sống tổng hợp này khi tiếp xúc với các ý thức tâm linh khác, có thể biểu đạt thứ mà chúng ta thường cho là \"niềm vui\". Vì hiện tại nó không biểu hiện bất kỳ mối đe dọa hữu hình nào, chúng ta sẽ tiếp tục để nó lại trong thiết bị đó bên trong hệ sao $NAME_Hillos$."
 anomaly.6795.a: "Một kết thúc tốt đẹp."
 #The Mask of Transformation
 mask_of_transformation: "Mặt Nạ Tạo Hóa"
 site_transformation_dig: "Truyền Tin Vòm Rừng"
 site_transformation_intro: "Các nhà khoa học của chúng ta đã phát hiện ra điều gì đó kỳ lạ trên [From.Planet.GetName]. Là một hành tinh nhiệt đới, phần lớn bề mặt của nó được bao phủ bởi rừng rậm rạp: những cái cây cổ thụ khổng lồ thọ hàng ngàn năm vươn lên đột ngột từ vòm rừng, những tán lá rậm rạp của chúng nhìn xuống các cảnh quan đất liền khác.\n\nMới nhìn qua, sự phân bố của những cái cây cao chót vót này dường như lộn xộn. Tuy nhiên, phân tích chi tiết hơn cho thấy sự phân bố của những cây này có độ chính xác toán học, có lẽ được trồng bởi một nền văn minh đã biến mất từ lâu. Không chỉ vậy, trưởng nhóm tin rằng, cách sắp xếp của cây cối có thể chứa một bộ tọa độ, trỏ đến một khu vực chưa được khám phá sâu trong rừng rậm."
 ancrel.15010.name: "Truyền Tin Vòm Rừng"
 ancrel.15010.desc: "Các nhà khoa học của chúng ta đã phát hiện ra điều gì đó kỳ lạ trên [From.Planet.GetName]. Là một hành tinh nhiệt đới, phần lớn bề mặt của nó được bao phủ bởi rừng rậm rạp: những cái cây cổ thụ khổng lồ thọ hàng ngàn năm vươn lên đột ngột từ vòm rừng, những tán lá rậm rạp của chúng nhìn xuống các cảnh quan đất liền khác.\n\nMới nhìn qua, sự phân bố của những cái cây cao chót vót này dường như lộn xộn. Tuy nhiên, phân tích chi tiết hơn cho thấy sự phân bố của những cây này có độ chính xác toán học, có lẽ được trồng bởi một nền văn minh đã biến mất từ lâu. Không chỉ vậy, trưởng nhóm tin rằng, cách sắp xếp của cây cối có thể chứa một bộ tọa độ, trỏ đến một khu vực chưa được khám phá sâu trong rừng rậm."
 ancrel.15000.name: "Chào Mừng Đến Với Rừng Rậm"
 ancrel.15000.desc: "Do vòm rừng của [From.Planet.GetName] quá dày đặc khó xuyên thấu, việc tìm kiếm con đường tắt băng qua rừng từ trên không gần như không thu được kết quả gì. Bên dưới vòm rừng tràn đầy sức sống: có những kẻ săn mồi không chi, những loài linh trưởng mặt xệ và bầy côn trùng hút máu. Tầng đất của rừng rất màu mỡ, nhưng những vũng nước hôi thối khiến đội thám hiểm khó lòng tiến bước. Không chỉ vậy, còn có thứ gì đó, không biết là thảm thực vật dày đặc hay nhiễu điện từ chưa biết, khiến các thiết bị máy móc thường xuyên gặp sự cố.\n\nTrưởng dự án tin rằng họ vẫn có thể tìm thấy lối đi giữa những hàng cây, chỉ là tiến trình có thể sẽ rất chậm chạp."
 ancrel.15000.a: "Đã hiểu."
 ancrel.15001.name: "Chất Biến Tâm Linh"
 ancrel.15001.desc: "Phân tích đất cho thấy [From.Planet.GetName] đã trải qua một cuộc biến đổi khí hậu kinh ngạc trong vòng một trăm chu kỳ quay vừa qua. Khác hẳn với khung cảnh cây cối rậm rạp hôm nay, hành tinh này từng hoang vu và đầy đá sỏi. Trưởng dự án tin rằng chính những thực vật khổng lồ này là nguyên nhân: quét cộng hưởng hiển thị phát hiện có sự tồn tại của năng lượng tâm linh trong nhựa cây của chúng. Những năng lượng này được hệ rễ khổng lồ của thực vật hút lên từ mạch nước ngầm, và thông qua quá trình tương tự quang hợp để dần phát tán vào khí quyển toàn hành tinh. Đây rất có thể là nguyên nhân khiến thiết bị của đội ngũ gặp sự cố.\n\nĐiều thú vị là, ánh trăng dường như thúc đẩy sự khuếch tán tâm linh. Vào những đêm quang đãng, thậm chí không khí trông như đang rung động, hiện tượng này càng trở nên mạnh mẽ khi đội ngũ tiến gần đến đích. Cảnh tượng này chúng ta chưa từng thấy trước đây."
 ancrel.15001.a: "Rất mê hoặc."
 ancrel.15002.name: "Hang Động"
 ancrel.15002.desc: "Sau khi cuối cùng cũng đến được tọa độ họ tìm kiếm, đội khảo cổ phát hiện ra một thung lũng sông quanh co khúc khuỷu ẩn dưới vòm rừng. Nước sông chảy xiết ra từ một cửa hang hình tròn, rõ ràng con sông này hẳn bắt nguồn từ một suối ngầm khổng lồ nào đó. Một cầu thang lung lay được đục vào vách đá từ hàng ngàn năm trước đã dẫn đội ngũ hướng tới một đường hầm dưới lòng đất.\n\nTường và trần hang dày đặc những chữ tượng hình nguệch ngoạc, trong đó đáng chú ý nhất là một biểu tượng hình khuôn mặt giống người. Thuật toán dịch thuật của chúng ta đã giải mã thành công nhiều biểu tượng loại này, trong đó biểu tượng này ám chỉ vệ tinh của hành tinh này.\n\nTrong hang động, sự hiện diện của năng lượng tâm linh đã vượt mức đo. Thật không may, cuối đường bị chặn bởi một đống đổ nát từ nhiều thế kỷ trước, chỉ cần cho chút thời gian, đội thám hiểm hẳn có thể tìm cách vượt qua."
 ancrel.15002.a: "Đào thôi!"
 ancrel.15003.name: "Trụ Đá Măng"
 ancrel.15003.desc: "Nhóm khoa học trên [From.Planet.GetName] đã gửi về một tin mừng! Sau khi thâm nhập thành công vào tầng dưới của hang động, cuối cùng họ đã đến được một thạch thất hình bán cầu rộng mở. Tại đây, dòng sông chảy quanh một hòn đảo nhỏ, giữa đảo là một cột đá măng cấu tạo từ các tinh thể hiếm. Cột đá măng này được hình thành dần dần từ những giọt nước qua hàng triệu năm, và nó dường như chính là nguồn cơn cho năng lượng tâm linh kỳ dị của toàn bộ hành tinh. Nhóm nghiên cứu đã tìm thấy dấu vết của các nghi lễ tôn giáo, còn có một số vật tế thủ công dùng trong nghi lễ rải rác quanh trụ đá măng. Ngoài ra, quét đa pha còn phát hiện một vật thể hình tròn trong nền móng của trụ đá. Một khi được khai quật, vật thể này có hy vọng lớn sẽ cung cấp một số manh mối về bản chất của địa điểm huyền bí này."
 ancrel.15003.a: "Thận trọng hành động."
 ancrel.15003.b: "Chúng ta phải lật mở bí mật về nguồn năng lượng này."
 ancrel.15004.name: "Mặt Nạ Tạo Hóa"
 ancrel.15004.desc: "Nhóm khoa học trên [From.Planet.GetName] đã có bước đột phá mới! Họ đã cẩn thận khai quật nguyên vẹn trụ tinh thể. Bên trong bảo tồn một chiếc mặt nạ cổ xưa giống người. Mặt trong của nó viết một số chữ tượng hình, chỉ rõ tên của món cổ vật này là \"Mặt Nạ Tạo Hóa\". Những ký tự này có thể ngụ ý về sức mạnh biến đổi mà vệ tinh của hành tinh này sở hữu, tức là điều khiển thủy triều lên xuống theo sự thay đổi của các pha mặt trăng.\n\nBản thân chiếc mặt nạ có tính chất tâm linh khó tin, rất có thể là nguyên nhân khiến hành tinh này xảy ra biến đổi khí hậu nhanh chóng. Bất kể là ai đã nuôi dưỡng trụ tinh thể đó, và ai đã dày công trồng bản đồ vòm rừng phức tạp kia, rõ ràng họ đều xuất phát từ mục đích tôn thờ và bảo vệ cổ vật này. Nhóm nghiên cứu đưa ra giả thuyết rằng, nếu vận dụng đúng cách, chiếc mặt nạ này có thể hỗ trợ đế chế chúng ta biến đổi toàn bộ hành tinh."
 ancrel.15004.a: "Khó mà tin được."
 ancrel.15005.name: "Tan Thành Mây Khói!"
 ancrel.15005.desc: "Tin xấu truyền về từ [From.Planet.GetName], nhóm nghiên cứu của chúng ta đã không thành công trong việc lấy món cổ vật đó ra khỏi thạch nhũ tinh thể. Có lẽ do thao tác quá bạo lực, nhóm đã đập nát hoàn toàn trụ đá này. Tệ hơn nữa, cổ vật bên trong bị hư hại đến mức không thể nhận dạng, và năng lượng tâm linh tràn ngập trong thạch thất đột nhiên tan biến không dấu vết.\n\nMay mắn là bản thân những tinh thể này vẫn khá có giá trị. Thậm chí nếu chúng ta có lẽ sẽ không bao giờ hiểu hết mục đích của nền văn minh tiền bối khi xây dựng nơi này, nỗ lực của chúng ta ít nhất cũng không hoàn toàn uổng phí."
 ancrel.15005.a: "Nản lòng, nhưng cũng thu hoạch được nhiều."
 ancrel.15006.name: "Phục Kích Trong Rừng"
 ancrel.15006.desc: "Nhóm nghiên cứu trên [From.Planet.GetName] gửi liên lạc khẩn cấp! Việc họ dấn thân một cách liều lĩnh vào rừng rậm dường như đã chọc giận nghiêm trọng một số quần thể địa phương.\n\nTrong vài đêm, các thành viên đội ngũ đã thấy những bóng đen vụt qua, lúc ẩn lúc hiện trong các bụi rậm dưới tán rừng. Sau đó, vào đêm trăng tròn, một đội quân gồm những sinh vật giống vượn từ trên trời rơi xuống, hú hét và vung gậy. Nhờ vào công nghệ tiên tiến của chúng ta, những kẻ tấn công này nhanh chóng bị đuổi ngược lên cây, tuy nhiên vẫn có vài thành viên đội thám hiểm bị chúng bắt đi. Trong rừng rậm dày đặc vẫn còn nghe thấy tiếng khóc than vang vọng của họ.\n\nMặc dù gặp phải nguy hiểm, nhà khoa học [Root.GetLeaderName] hứa rằng vẫn sẽ tiếp tục khám phá."
 ancrel.15006.a: "Đáng lo ngại."
 ancrel.15007.name: "Của Rơi Tìm Thấy"
 ancrel.15007.desc: "Chúng ta nhận được tin tức mới từ đội thám hiểm trên [From.Planet.GetName]. Việc khám phá trong rừng rậm mê cung khó khăn hơn dự tính ban đầu. Đội ngũ của chúng ta mỗi khi cố gắng tiến thêm một bước đều phải đấu tranh với những đầm lầy ngoài dự kiến, những dây leo cứng cáp kỳ dị, đồng thời còn phải đối mặt với những sinh vật giống vượn thông minh lạ thường. Nhóm nghiên cứu thông qua việc thuần phục một số sinh vật có móng hiền lành, cuối cùng đã băng qua được khu vực khó khăn nhất trong rừng rậm. Chúng còn có thể tìm thấy những điểm chôn lấp thịt của một loại sinh vật giống sâu dưới rễ những cái cây khổng lồ. Vì những sinh vật này trông rất phấn khích, loại thịt sâu này hẳn là một món cao lương mỹ vị địa phương nào đó. Quan trọng hơn, nhóm nghiên cứu cũng nhanh chóng khai quật được một số vật dụng chế tạo từ bên dưới mặt đất rừng, những phát hiện nhỏ này cũng cho thấy thêm rằng trên hành tinh này từng tồn tại nền văn minh tiền bối."
 ancrel.15007.a: "Mấy con vượn đó cũng chẳng có gì ghê gớm!"
 ancrel.15008.name: "Tiệc Tùng Trong Bụi Rậm"
 ancrel.15008a.desc: "Nhóm nghiên cứu trên [From.Planet.GetName] gặp phải một số khó khăn. Do tình cờ phát hiện ra một thung lũng sông quanh co trong rừng, việc thám hiểm trên mặt đất rừng của họ gần như đình trệ. Nước sông chảy xiết với những tảng đá nhọn hoắt, lởm chởm, gần như không thể đi qua theo lộ trình hiện tại. Việc đi đường vòng kéo theo những hậu quả bất ngờ: một bầy vượn sống bầy đàn địa phương đã tiếp cận họ. Những sinh vật có lông mày xếch này lấy việc làm vui lòng đội thám hiểm làm thú vui, mỗi đêm chúng đều mang đến một lượng lớn quả mọng lên men. Mặc dù tinh thần cao chưa từng có, nhưng tiến độ vẫn chậm chạp, trưởng dự án khi báo cáo đã cảnh báo toàn đội có thể thiếu khả năng hành động."
 ancrel.15008b.desc: "Nhóm nghiên cứu trên [From.Planet.GetName] gặp phải một số khó khăn. Do tình cờ phát hiện ra một thung lũng sông quanh co trong rừng, việc thám hiểm trên mặt đất rừng của họ gần như đình trệ. Nước sông chảy xiết với những tảng đá nhọn hoắt, lởm chởm, gần như không thể đi qua theo lộ trình hiện tại. Việc đi đường vòng kéo theo những hậu quả bất ngờ: một bầy vượn sống bầy đàn địa phương đã tiếp cận họ. Những sinh vật có lông mày xếch này lấy việc làm vui lòng đội thám hiểm làm thú vui, mỗi đêm chúng đều mang đến một lượng lớn quả mọng lên men. Mặc dù chúng ta không thể tiêu hóa món quà của chúng, đội ngũ này vẫn bị bầy vượn thu hút, say mê hành vi thú vị của những sinh vật này mà bỏ bê nhiệm vụ."
 ancrel.15008.a: "Quay lại làm việc đi."
 engineered_nature: "Tự Nhiên Được Cải Tạo"
 engineered_nature_desc: "[Root.GetPlanetMoon] này đã được cải tạo kỹ thuật, cung cấp cả hình thái và chức năng cho cư dân."
 second_home: "Ngôi Nhà Thứ Hai"
 second_home_desc: "[Root.GetPlanetMoon] này trông có vẻ giống một cách kinh ngạc với hành tinh mẹ của những kẻ tạo ra nó."
 intentionally_tidally_locked: "Cố Ý Khóa Thủy Triều"
 intentionally_tidally_locked_desc: "Trong quá trình cải tạo môi trường, hành tinh này đã được cố ý cải tạo thành trạng thái bị khóa thủy triều, giúp mọi người có thể tận dụng triệt để năng lượng thu thập được ở mặt hướng nắng."
 perfect_organization_modifier: "Tổ Chức Hoàn Hảo"
 perfect_organization_modifier_desc: "Mọi sự trên [Root.GetPlanetMoon] này đều được tổ chức hoàn hảo đến mức, bất kỳ ai có tâm trí đơn thuần sau khi ghé thăm nơi này đều cảm thấy vô cùng nản lòng."
 imperfect_organization_modifier: "Tổ Chức Không Hoàn Hảo"
 imperfect_organization_modifier_desc: "Hành tinh này từng hoàn hảo và có trật tự đến mức khiến mọi người nhìn chung cảm thấy nản lòng."
 paradise_made: "Thiên Đường Giả Lập"
 paradise_made_desc: "[Root.GetPlanetMoon] đã được cải tạo môi trường thành vùng đất hứa của những kẻ tạo ra nó."
 #lostsoulanomaly
 lost_soul_cat: "Linh Hồn Lạc Lối"
 lost_soul_cat_desc: "Trong không gian, chúng ta đã phát hiện một robot hai chân bị hư hại nặng nề. Chúng ta chưa rõ nguồn năng lượng của nó, nhưng có thể thu thập được một số thông tin từ bộ nhớ của nó."
 anomaly.6786.name: "Linh Hồn Lạc Lối"
 anomaly.6786.desc: "Trong không gian, chúng ta đã phát hiện một robot hai chân bị hư hại nặng nề. Khuôn mặt của nó không có đặc điểm gì, và cấu trúc bên ngoài bằng kim loại của nó bị hư hại nghiêm trọng. Quét sơ bộ cho thấy nó còn năng lượng dư thừa, nhưng năng lượng nó sử dụng khác xa với chúng ta. Có lẽ các mạch điện bên trong của nó còn lưu giữ một số dữ liệu quá khứ, nhưng việc nạp điện và dịch dữ liệu sẽ tốn một chút thời gian."
 anomaly.6786.a: "Quét robot này."
 anomaly.6786.a.tooltip: "§LĐể chúng tôi xem ký ức của bạn, hỡi lữ khách vũ trụ.§!"
 anomaly.6786.b: "Từ bỏ nó."
 anomaly.6786.b.tooltip: "§LTạm biệt, một đống rác rưởi.§!"
 anomaly.6787.name: "Linh Hồn Cổ Xưa"
 anomaly.6787.desc: "Thông qua những nỗ lực không ngừng, chúng ta đã tìm ra phương pháp nạp điện cho robot và quét bộ nhớ của nó. Đáng buồn thay, máy móc này đã xuống cấp nghiêm trọng, chúng ta khó lòng lấy lại được thông tin có hệ thống. Chúng ta sẽ cân nhắc khởi động nghiên cứu tiếp theo, có thể là nghiên cứu các đồng loại khác của nó, nhưng số phận của kẻ lang thang cơ khí này sẽ mãi là một ẩn số."
 #TEMPORAL PRISM
 TEMPORAL_PRISM_CAT: "Biến Động Thời Gian Bất Thường"
 TEMPORAL_PRISM_CAT_DESC: "Phát hiện biến động thời không bất thường ở khu vực lân cận [From.GetName]. Cần phân tích thêm."
 anomaly.6788.name: "Lăng Kính Thời Gian"
 anomaly.6788.desc: "Phân tích biến động thời gian trong hệ sao [From.GetStarName] đã phát hiện điều đáng chú ý: một lăng kính khổng lồ đang trôi nổi trong không gian. Lăng kính này không khúc xạ ánh sáng, mà là khúc xạ thời gian. Tùy thuộc vào các góc tới khác nhau, phi hành đoàn của [Root.GetName] cảm nhận được thời gian trôi đi với tốc độ khác nhau. Quét cũng cho thấy, một số người trong họ già đi nhanh chóng, trong khi những người khác lại trẻ hơn vài ngày hoặc thậm chí vài năm so với dự kiến.\n\nNghiên cứu của chúng ta về lăng kính này thực sự đã làm sâu sắc thêm hiểu biết của chúng ta về bản chất và đặc tính của thời gian, nhưng nguồn gốc và tác dụng của nó vẫn chưa được biết rõ."
 #snek
 colony.8099.name: "Loài Rắn Ẩn Nấp"
 colony.8099.desc: "Chúng ta dò thấy những đàn sinh vật đang đào bới từ dưới thuộc địa của chúng ta tại [root.GetName] lên trên. Chúng có thể trồi lên mặt đất bất cứ lúc nào. Các nhà khoa học của chúng ta đưa ra lý thuyết rằng, có lẽ rung động bề mặt đã đánh thức chúng từ một trạng thái ngủ đông dưới lòng đất nào đó."
 colony.8099.a: "Huy động các nhà khoa học và binh lính."
 colony.9100.name: "Mưu Đồ Quanh Co"
 colony.9100.desc: "Người định cư trên [root.GetName] báo cáo rằng một số ngôi nhà đang bị rắn khổng lồ quấy nhiễu, và nhiều tòa nhà đang trong tình trạng mất điện. Chúng ta nên làm rõ liệu có mối liên hệ nào giữa hai việc này không,"
 colony.9100.a: "Quan sát những sinh vật kỳ lạ này."
 colony.9100.b: "Dùng lửa đuổi chúng ra khỏi thuộc địa."
 colony.9101.desc: "Lũ rắn khổng lồ bị thu hút bởi nguồn điện năng, có thể là đang tìm kiếm dưỡng chất hoặc tìm kiếm niềm vui. Nếu chúng ta có thể chuyển đổi nguồn năng lượng của mình, có lẽ chúng sẽ thấy việc làm này không hợp khẩu vị... hoặc sẽ phải nếm mùi đau khổ."
 colony.9102.desc: "Tính hung hăng của lũ rắn khổng lồ trên [root.GetName] giờ đây đã giảm bớt, nhưng chúng dường như đang tập trung tháo dỡ các thiết bị máy móc của người định cư. Kỹ năng của chúng gợi ý rằng chúng ít nhất sở hữu trí tuệ sơ khai."
 colony.9103.name: "Tiếng Rít Bất Tường"
 colony.9103.desc: "Cũng giống như chúng ta đã quan sát lũ rắn khổng lồ xâm nhập trên [root.GetName], chúng cũng đang dõi theo chúng ta. Lũ rắn đã tìm ra cách xâm nhập và thao túng bừa bãi các phương tiện, máy tính và thiết bị khai thác mỏ của chúng ta."
 colony.9103.desc.science: "Cũng giống như chúng ta đã quan sát lũ rắn khổng lồ xâm nhập trên [root.GetName], chúng cũng đang dõi theo chúng ta. Lũ rắn đã tìm ra cách xâm nhập và thao túng bừa bãi các phương tiện, máy tính và thiết bị khai thác mỏ của chúng ta.\n\nChúng ta được biết bầy sinh vật dạng rắn này có một ngôn ngữ đơn giản. Vì mục đích ngoại giao, các nhà khoa học của chúng ta giờ gọi chúng là \"Xà tộc\". Chúng tự gọi mình là \"Hây-xì-xì\", nhưng chúng ta thường đọc sai tên này, từ đó chọc giận chúng, dẫn đến việc có nhiều vụ rắn cắn hơn."
 colony.9103.desc.soldier: "Cũng giống như chúng ta đã quan sát lũ rắn khổng lồ xâm nhập trên [root.GetName], chúng cũng đang dõi theo chúng ta. Lũ rắn đã tìm ra cách xâm nhập và thao túng bừa bãi các phương tiện, máy tính và thiết bị khai thác mỏ của chúng ta.\n\nTheo các trinh sát của chúng ta, những \"loài rắn\" này sống sâu dưới lòng đất. Súng phun lửa có thể dùng làm công cụ răn đe hiệu quả. Chúng ghét chúng ta, nhưng chúng còn ghét lửa hơn."
 colony.9103.a: "Để chúng ăn năng lượng của chúng ta. Kích hoạt máy dịch thuật vạn năng."
 colony.9103.b: "Huy động lực lượng đột kích. Sử dụng súng phun lửa để tấn công."
 colony.9104.name: "Thế Giới Dưới Lòng Đất"
 colony.9104.desc: "Lũ rắn khổng lồ trên [root.GetName] đã biến một số thiết bị khai thác của chúng ta thành phương tiện giao thông, dùng để du hành giữa thế giới dưới lòng đất của chúng và thế giới trên bề mặt của chúng ta. Điều này đã phá hoại đáng kể hệ sinh thái của chúng ta.\n\nCác nhà khoa học tại thuộc địa của chúng ta bắt đầu gọi những kẻ xâm nhập dạng rắn này là \"Hây-xì\". Binh lính thì đặt cho chúng một số tên gọi khác, phần lớn những tên này tốt nhất là không nên nhắc đến."
 colony.9104.desc.science: "Lũ rắn khổng lồ trên [root.GetName] đã biến một số thiết bị khai thác của chúng ta thành phương tiện giao thông, dùng để du hành giữa thế giới dưới lòng đất của chúng và thế giới trên bề mặt của chúng ta. Điều này đã phá hoại đáng kể hệ sinh thái của chúng ta.\n\nMặc dù lũ \"Hây-xì\" đã gây ra hỗn loạn, các nhà khoa học của chúng ta nghi ngờ chúng có thể đang giải trí. Những sinh vật dạng rắn này vẫn chưa mang đi toàn bộ thiết bị khai thác của chúng ta, vì vậy chúng ta có thể muốn ngừng sử dụng một số máy móc để sửa chữa."
 colony.9104.desc.soldier: "Lũ rắn khổng lồ trên [root.GetName] đã biến một số thiết bị khai thác của chúng ta thành phương tiện giao thông, dùng để du hành giữa thế giới dưới lòng đất của chúng và thế giới trên bề mặt của chúng ta. Điều này đã phá hoại đáng kể hệ sinh thái của chúng ta.\n\nBất kể động cơ của loài rắn là gì, binh lính của chúng ta vẫn kiên quyết cho rằng việc khai thác mỏ phải được tiếp tục. Chúng ta có thể mất đi nhân viên an ninh và binh lính, nhưng tuyệt đối không được để một con rắn nào lẻn vào nhà mình... hoặc tiếp xúc với công nghệ của chúng ta."
 colony.9104.a: "Ngừng sử dụng các thiết bị khai thác mỏ còn lại."
 colony.9104.b: "Vẫn là dùng lửa đốt chưa đủ."
 colony.9105.name: "Thảm Họa Hoành Hành"
 colony.9105.desc: "Hành động phá hoại tàn khốc của những kẻ xâm nhập Xà tộc, cùng với các hoạt động đào bới phức tạp trên [root.GetName], đã phá hủy hoàn toàn hệ sinh thái của hành tinh này."
 colony.9106.name: "Nâng Tầm và Ban Tặng"
 colony.9106.desc: "Lũ rắn khổng lồ trên [root.GetName] đã biến một số thiết bị khai thác của chúng ta thành phương tiện giao thông, dùng để du hành giữa thế giới dưới lòng đất của chúng và thế giới trên bề mặt của chúng ta. Có phải công nghệ của chúng ta đang khiến chúng trở nên mạnh mẽ theo những cách mới không?"
 colony.9106.desc.science: "Lũ rắn khổng lồ trên [root.GetName] đã biến một số thiết bị khai thác của chúng ta thành phương tiện giao thông, dùng để du hành giữa thế giới dưới lòng đất của chúng và thế giới trên bề mặt của chúng ta. Có phải công nghệ của chúng ta đang khiến chúng trở nên mạnh mẽ theo những cách mới không?\n\nCác nhà khoa học của chúng ta báo cáo rằng, những con \"Hây-xì\" này đã vẽ cùng một biểu tượng bên cạnh mỗi phương tiện giao thông. Chúng ta nghi ngờ chúng còn sở hữu một hệ thống ngôn ngữ viết thô sơ."
 colony.9106.a: "Đường hầm Xà tộc mới toanh này đã khai quật ra... các mỏ khoáng sản!"
 colony.9107.name: "Phi Thuyền Xà Tộc"
 colony.9107.desc: "Xà tộc trên [root.GetName] đang kiên nhẫn chờ đợi một con tàu tiến vào hệ sao này. Xem ra, một gã xúi quẩy nào đó nghĩ rằng việc hạ cánh xuống thuộc địa của chúng ta là một ý hay, và giờ đây phi thuyền của gã chứa đầy rắn."
 colony.9107.a: "Cứ để những con rắn đào tẩu đó sở hữu con tàu này đi."
 colony.9107.a.tooltip: "Khi những sinh vật dạng rắn thông minh này lao vào vũ trụ bao la, chúng ta cũng chẳng giúp gì được, chỉ có thể tò mò về số phận cuối cùng của chúng ra sao."
 colony.9107.b: "Tiêu hủy con tàu rắn này."
 colony.9107.b.tooltip: "Những sinh vật dạng rắn thông minh này đã chuyển đồng tộc của chúng sang một con tàu mồi nhử của chúng ta. Chúng ta nên để chúng lên tàu... và sau đó làm quá tải lõi phản ứng."
 colony.9108.name: "Vì Sao Hây Xì"
 colony.9108.desc: "Một con tàu cô độc lặng lẽ lách qua toàn bộ thiết bị dò tìm của chúng ta, đi đến các hệ sao lân cận. Những Xà tộc này đã để lại trên [root.GetName] một đống cần cẩu dưới lòng đất và một bãi khoáng sản phong phú."
 colony.9108.a: "Tạm biệt, rắn."
 #colony.9108.a.tooltip: "§LCâu chuyện của các bạn quả là... nâng đỡ tâm hồn.§!"
 colony.9109.name: "Giai Thoại Hây Xì"
 colony.9109.desc: "Tại ngoại vi thuộc địa quy mô lớn nhất nằm trên [root.GetName], đã xảy ra một vụ nổ. Chúng ta sẽ giữ cảnh giác, nhưng trong tình hình hiện tại, chúng ta đã đốt sạch đợt Xà tộc xâm nhập cuối cùng."
 colony.9109.a: "Tạm biệt, rắn."
 #colony.9109.a.tooltip: "§LCâu chuyện dài của các ngươi đã khép lại. Giờ các ngươi... chỉ còn là quá khứ.§!"
 #VENDING MACHINE
 VENDING_MACHINE_CAT: "Một Lời Mời"
 VENDING_MACHINE_CAT_DESC: "Một ngọn hải đăng xoay quanh [From.GetName], kêu gọi những người đi ngang qua lại gần. Trên tiểu hành tinh này, có một tháp bia kim loại khổng lồ sừng sững hiện ra, tác dụng của nó hiện chưa rõ ràng."
 anomaly.7000.name: "Tháp Bia Bí Ẩn"
 anomaly.7000.desc: "Tòa tháp bia khổng lồ được phát hiện trên [From.GetName] khiến con tàu khoa học của chúng ta phái đến trông nhỏ bé như hạt bụi. Trên bề mặt kim loại dạng tấm nhẵn bóng, tráng lệ này, những hoa văn màu sắc rực rỡ một thời giờ đây đã trở nên loang lổ.\n\nMột lỗ thoát năng lượng nhỏ ở bên hông máy dường như ám chỉ rằng chỉ cần trao đổi bằng một lượng tín dụng năng lượng thích hợp, những bí mật của nó sẽ được hé lộ hoàn toàn,"
 anomaly.7000.a: "Kích hoạt máy móc."
 anomaly.7000.b: "Tốt nhất là đừng đụng vào."
 anomaly.7010.name: "Cơ Khí Phục Hồi"
 anomaly.7010.desc.base: "Máy móc bắt đầu hoạt động, những cơ cấu truyền động viễn cổ kêu lách cách bên dưới bề mặt nhẵn bóng. Sau một hồi tiếng vù vù, tiếng rè rè thì tiếng ồn đột ngột dừng lại, một tấm chắn kim loại trượt ra, từ trong máy lăn ra một thùng chứa hình trụ có kích thước tương đương một con tàu...\n\n"
 anomaly.7010.a: "Đăng ký bằng sáng chế cho loại đồ uống trong thùng, sau đó đem bán cho toàn thiên hà."
 anomaly.7010.desc.full: "Thùng chứa hình trụ bảo tồn một loại đồ uống viễn cổ nào đó, chống lại sự xói mòn của thời gian một cách thần kỳ."
 anomaly.7010.desc.full.megacorp: "$anomaly.7010.desc.base$$anomaly.7010.desc.full$Dựa trên dữ liệu thị trường, loại thức uống thất truyền đã lâu này ngon hơn 20% so với loại đồ uống tốt nhất mà chúng ta có thể cung cấp cho các sinh vật hiện tại."
 anomaly.7010.desc.full.nonbio: "$anomaly.7010.desc.base$ $anomaly.7010.desc.full$Mặc dù loại thức uống này không có tác dụng trực tiếp đối với chúng ta, các [Owner.GetScientistPlural] của chúng ta đã có thể chuyển hóa chúng thành tài nguyên hữu ích hơn: §YKhí tự nhiên ngoại lai§!."
 anomaly.7010.desc.full.bio: "$anomaly.7010.desc.base$$anomaly.7010.desc.full$Loại thức uống này đã dễ dàng được các [Owner.GetScientistPlural] của chúng ta sao chép lại, sau khi trải qua nhiều cuộc kiểm tra kỹ lưỡng xác nhận, loại chất lỏng này sạch sẽ vệ sinh, giàu dinh dưỡng, và quan trọng là nó còn rất ngon."
 anomaly.7010.desc.empty: "$anomaly.7010.desc.base$Bên trong thùng chứa hình trụ này là rỗng tuếch, nội dung bên trong nó từ lâu đã bay hơi sạch qua nắp đậy bị ăn mòn. Bản thân thùng chứa này ở trạng thái tốt, hợp kim chưa rõ cấu thành nên nó tương đương với trình độ hợp kim chúng ta dùng để đóng tàu."
 anomaly.7010.desc.rot.bio: "$anomaly.7010.desc.base$Chất lỏng chứa bên trong bốc mùi hôi thối; loại dưỡng chất từng ngon lành này đã bị hư hỏng theo năm tháng trôi qua. Thông qua việc nghiên cứu những chất này, các [Owner.GetScientistPlural] của chúng ta hy vọng có thể biết thêm một số thông tin sinh học về những người ngoại lai từng ưa thích loại đồ uống này, giả định là chúng ta có thể xử lý được mùi hôi của nó trước đã."
 anomaly.7010.desc.rot.nonbio: "$anomaly.7010.desc.base$Hỗn hợp chất lỏng chứa bên trong thùng hình trụ có chứa đường mía, axit citric và các chất sinh học khác. Các [Owner.GetScientistPlural] của chúng ta tin rằng nó là một loại vật chất giàu dinh dưỡng do sinh mạng dựa trên carbon tạo ra và uống. Nghiên cứu sâu hơn có khả năng cung cấp manh mối sinh học về loài đã diệt vong này."
 #GREED IS BAD
 colony.9050.name: "Lớp Khoáng Sản Bất Ngờ"
 colony.9050.desc: "Khảo sát địa chất trên [Root.GetName] đã tiết lộ hành tinh này giàu khoáng sản hơn nhiều so với dự kiến trước đây của chúng ta. Sau khi điều chỉnh cảm biến để có thể quét sâu hơn dưới lòng đất, đã phát hiện được nhiều bãi khai thác đầy hứa hẹn. Chúng ta nên cử thêm nhân lực vật lực tiến hành thăm dò, có lẽ có thể phát hiện được các mạch khoáng sản hữu ích ở tầng sâu hơn."
 colony.9050.a: "Không có tiền, đào trực tiếp luôn đi."
 colony.9050.b: "Phê duyệt kinh phí, tiến hành thăm dò tầng sâu."
 colony.9055.name: "Mạch Khoáng Sản Tầng Sâu"
 colony.9055.desc: "Thăm dò lòng đất của [Root.GetName] là một quá trình dài: thiết bị dò tìm của chúng ta phản hồi không tốt với cấu tạo địa tầng, các đứt gãy trong cấu trúc địa chất lại khiến chúng ta cần thường xuyên điều chỉnh máy móc. Tuy nhiên, chúng ta vẫn phát hiện thêm nhiều loại quặng giá trị cao đáng để khai thác. Độ sâu của chúng khiến công tác hậu cần cho việc khai thác phức tạp hơn nhiều so với bình thường, nhưng dù sao thì điều này cũng xứng đáng. Không có dấu hiệu nào cho thấy việc tiếp tục thăm dò có thể giúp chúng ta tìm thêm được mạch khoáng sản nào khác."
 colony.9055.a: "Bắt đầu công tác khai thác mỏ."
 colony.9055.b: "Chắc chắn vẫn còn nhiều khoáng sản hơn."
 colony.9060.name: "Quá Sớm Cho \"Đá\""
 colony.9060.desc: "Công tác thăm dò gần đây trên [Root.GetName] gần như không thu được kết quả gì. Tất cả các khoáng sản khác mà chúng ta có thể tìm thấy đều bị chôn vùi quá sâu, trữ lượng không lớn, và nằm trong địa tầng không ổn định. Chi phí khai thác những khoáng sản này sẽ cao hơn lợi nhuận thu được. Mặc dù vậy, những phát hiện trước đây của chúng ta đã cho thấy tài nguyên ở đây cực kỳ phong phú, chúng ta cần hàng thập kỷ thậm chí hàng trăm năm mới có thể khai thác hết."
 colony.9060.a: "Tốt rồi. Xắn tay áo lên làm thôi."
 colony.9065.name: "Thêm Nhiều Khoáng Sản"
 colony.9065.desc: "Bất kể khoáng sản trên [Root.GetName] giấu sâu đến mức nào, chúng ta cũng phải tìm thấy chúng, khai thác chúng. Chúng ta đã luôn như vậy. Những người khác có lẽ sẽ chùn bước trước địa tầng không ổn định, độ sâu đáng sợ và công tác hậu cần vận chuyển khai thác mỏ, còn chúng ta thì tuyệt đối không. Thế giới bên dưới chính là nhà của chúng ta, chỉ cần tìm đúng hướng nhất định sẽ thu hoạch được gì đó. Càng đào xuống sâu, chất lượng và trữ lượng khoáng sản càng cao. Mẫu vật mới nhất của chúng ta thậm chí còn cho thấy sự hiện diện của tinh thể hiếm trong tầng sâu."
 colony.9065.a: "Chúng ta đã tìm thấy đủ rồi, bắt đầu khai thác thôi."
 colony.9065.b: "Những tinh thể này là của chúng ta!"
 colony.9070.name: "Tinh Thể Rực Lửa"
 colony.9070.desc: "Đội thăm dò của chúng ta trên [Root.GetName] đã chạm đến độ sâu mới nhất. Đúng như dự đoán, nơi ánh đèn rọi đến, chúng ta quả nhiên tìm thấy từng cụm tinh thể lấp lánh ánh sáng linh động màu cam, vàng và đỏ. Một số trông giống như lò sưởi thắp sáng hang động, đổ những bóng đen loang lổ lên vách đá. Chúng ta còn có một phát hiện đầy bí ẩn: nếu quan sát theo quy mô thiên niên kỷ, những tinh thể này dường như đang di chuyển chậm chạp về phía lõi hành tinh. Chúng ta tin rằng, nếu đào sâu hơn nữa về phía tâm trái đất, chúng ta nhất định sẽ có thêm nhiều phát hiện."
 colony.9070.a: "Những công tác thăm dò này chi phí quá cao rồi."
 colony.9070.b: "Chúng ta nên tiếp tục đào xuống."
 colony.9075.name: "Cái Giá Của Sự Tham Lam"
 colony.9075.intro: "Trong quá trình đội thăm dò của chúng ta tìm kiếm quặng sâu hơn vào lòng [Root.GetName], họ thấy ngày càng nhiều tinh thể rải rác trên lộ trình của mình. Cuối cùng, họ đã đến được một hang động khổng lồ gần lõi của [Root.GetName], và sau đó thì mất liên lạc. Tin nhắn cuối cùng của họ là đang lắp đặt ánh sáng và cảm biến để nghiên cứu hang động, rồi sau đó là nghe thấy tiếng la hét đau đớn, cái chết và sự hủy diệt theo sau đó.\n\nNguyên nhân vụ tai nạn nhanh chóng được xác định, những nhà thăm dò địa chất khác dò thấy đa tầng tiếng vang đường hầm đang lao nhanh về phía thuộc địa của chúng ta. Không lâu sau, chuyện kinh hoàng đã xảy ra, chúng ta bị tấn công bởi một thực thể tinh thể to lớn vô cùng. Nó trông không khác gì các thực thể tinh thể trong không gian, nhưng hung hãn hơn nhiều, và có thể sử dụng khả năng tái cấu trúc để thay đổi hình dạng cơ thể của chúng trong tích tắc.\n\n"
 colony.9075.outro: "Mặc dù lõi của thực thể tinh thể vẫn còn vùi sâu dưới đất, nhưng nó đã phân tách ra nhiều phần phụ giống như xúc tu đang trồi lên mặt đất, chuẩn bị tấn công chúng ta đồng thời hấp thụ thêm tinh thể để sinh trưởng. Tiên lượng vô cùng xấu, chúng ta sẽ sớm thấy hoạt động thuộc địa trên [Root.GetName] đi đến hồi kết."
 colony.9075.desc.a: "$colony.9075.intro$Trước đây các tín hiệu vô tuyến chúng ta dùng để xoa dịu tinh thể không gian đều không có tác dụng. $colony.9075.outro$" #Pacified Crystals
 colony.9075.desc.b: "$colony.9075.intro$Trong không gian hạm đội của chúng ta có thể dùng tính cơ động cao và hỏa lực để chiến thắng những tinh thể này, nhưng trên hành tinh chúng ta bó tay với nó. $colony.9075.outro$" #Regular
 NAME_Crystal_Kraken: "Tai Ương Tinh Thể"
 crystal_kraken_army: "Thực Thể Tinh Thể Dưới Lòng Đất"
 crystal_kraken_army_desc: "Nó đã ngủ say dưới lớp vỏ hành tinh hàng tỷ năm, cho đến khi cơn đói vô tận buộc nó phải xé toạc hang ổ cổ xưa."
 crystal_kraken: "Tai Ương Tinh Thể"
 NAME_Crystal_Shard: "Mảnh Tinh Thể"
 colony.9080.name: "Đánh Bại Thực Thể Tinh Thể"
 colony.9080.desc: "Sau một cuộc chiến kiệt quệ, thực thể tinh thể bám rễ tại lõi hành tinh cuối cùng đã bị đánh bại. Trận quyết chiến diễn ra dưới lòng đất tầng sâu, ngay trong hang ổ cốt lõi của con quái vật tinh thể này, chỉ có đập nát nó mới có thể dừng triệt để hoạt động của nó. Vô số phần phụ của nó tan rã, xảy ra sự phân rã ở cấp độ phân tử, gieo rắc bụi tinh thể trên toàn bộ hành tinh. Vô số đường hầm do xúc tu tinh thể đào ra sẽ giúp chúng ta vô cùng thuận tiện trong việc khai thác các mỏ giàu có cấu thành nên tầng sâu của hành tinh này. Về nguồn gốc của thực thể tinh thể này chúng ta vẫn còn nhiều ẩn số, nhưng chúng ta cũng đã thu được một số hiểu biết về cách các tinh thể trong không gian được tạo ra."
 colony.9080.a: "Cuối cùng cũng thắng lợi rồi."
 d_crystal_kraken_body: "Di Hài Tinh Thể"
 d_crystal_kraken_body_desc: "Di hài vỡ vụn của thực thể tinh thể vùi sâu bên dưới lớp vỏ của hành tinh này. Các xúc tu của nó đều đã chuyển hóa thành các mạch khoáng sản phong phú."
 d_crystal_kraken_body_bombed: "Di Hài Tinh Thể Tan Tác"
 d_crystal_kraken_body_bombed_desc: "$d_crystal_kraken_body_desc$"
 colony.9085.name: "Sự Kiện Bất Thường"
 colony.9085.desc: "Công tác khai thác mỏ của chúng ta trên [Root.GetName] gặp phải những khó khăn ngoài dự kiến, bao gồm một số trận động đất quy mô nhỏ và sự dịch chuyển của các mạch khoáng tinh thể, tóm lại đã xảy ra chuyện gì đó kỳ lạ. Tận dụng mọi kinh nghiệm về khai thác mỏ của chúng ta cũng không thể giải thích nổi rốt cuộc là chuyện gì. Những tình huống này khiến việc đảm bảo an toàn cho công tác khai thác trở nên rất khó khăn, chúng ta đã mất một số thiết bị, nhân sự và quặng trong một vài vụ tai nạn và sập hầm không thể dự báo. Có lẽ chúng ta nên biết dừng lại đúng lúc, ngừng khai thác mỏ ở một độ sâu nhất định."
 colony.9085.a: "Không sao, cứ tiếp tục khai thác."
 colony.9085.b: "An toàn là trên hết."
 #### Rage Sage
 site_rage_sage_dig: "Hạt Giống Hủy Diệt"
 seeds_of_destruction_intro: "Chúng ta đã phát hiện ra một phi thuyền ngoại lai cổ xưa, nó bị chôn vùi một nửa ở giữa một hố va chạm tiểu hành tinh. Tinh thể băng bao phủ phần lớn thân tàu, nhưng chúng ta vẫn thuận lợi tìm thấy cửa khí... và bắt đầu tìm kiếm những bí mật ẩn giấu của con tàu này."
 ancrel.14001.name: "Cơn Thịnh Nộ Trong Lồng"
 ancrel.14001.desc: "Khi chúng ta mở cửa khí của phi thuyền ngoại lai này, chờ đợi ở phía bên kia là một chốn địa ngục tu la. Điều tra sơ bộ của chúng ta phát hiện, nơi đây chẳng khác nào một hiện trường thảm sát. Sau khi kiểm tra những thi thể phi hành đoàn tan nát, chúng ta rất chắc chắn lúc sinh thời họ đã xâu xé chân tay của nhau. Chúng ta có thể quay lưng bỏ đi... nhưng làm vậy chúng ta sẽ không bao giờ phát hiện ra thảm kịch này đã xảy ra như thế nào."
 ancrel.14002.name: "Phòng Thí Nghiệm Tinh Vi"
 ancrel.14002.desc: "Theo chân cuộc khai quật sâu hơn, chúng ta đã tìm thấy phòng thí nghiệm khoa học của con tàu. Năng lượng yếu ớt bao phủ khu vực này, tỏa ra ánh sáng cực tím dịu nhẹ. Một cụm bụi cây màu tím lộn xộn đang nằm trong đám mây bào tử dày đặc. Xem ra, bác sĩ của con tàu này đã lợi dụng phòng thí nghiệm và cửa thông gió để xả một đám mây độc hại vào mọi ngóc ngách của phi thuyền."
 ancrel.14003.name: "Bỏ Đi Công Tắc!"
 ancrel.14003.desc: "Chúng ta cho rằng mình có thể miễn nhiễm với những tác hại do đám mây độc này mang lại. Nếu chúng ta có thể làm cho động cơ phi thuyền hoạt động trở lại, chúng ta có thể khởi động con tàu này và đưa nó về hành tinh mẹ để nghiên cứu. Việc này cần thời gian, nhưng phòng thí nghiệm dược học tinh vi này có thể cung cấp các chất tăng cường sinh học hữu ích cho binh lính của đế chế chúng ta."
 ancrel.14003.a: "Để lò phản ứng hoạt động trở lại!"
 ancrel.14003.b: "Chạy chương trình chẩn đoán, và bắt đầu sửa chữa."
 ancrel.14004.name: "Bùng Nổ Cực Lạc"
 ancrel.14004.desc: "Chúng ta đã ngu ngốc tưởng rằng mình có thể miễn nhiễm với đám mây này, nhưng các kỹ sư của chúng ta đã rơi vào trạng thái cực lạc ngây ngất. Họ nhảy múa trong hành lang phi thuyền, hát hò ầm ĩ. Chúng ta cần thời gian để thanh lọc không khí, bắt lấy đám kỹ sư này, rồi mới có thể khởi động phi thuyền. Những sự chậm trễ này sẽ tiêu tốn thời gian của chúng ta."
 ancrel.14004.a: "Bắt lấy những kỹ sư đã rơi vào trạng thái \"cực lạc\"."
 ancrel.14005.name: "Bùng Nổ Cuồng Nộ"
 ancrel.14005.desc: "Chúng ta đã ngu ngốc tưởng rằng mình có thể miễn nhiễm với đám mây này, nhưng các nhà khoa học của chúng ta đang phải chịu đựng hậu quả của sự cuồng loạn tâm lý. Ở mọi ngóc ngách của phi thuyền đều xảy ra ẩu đả. Chúng ta cần thời gian để thanh lọc không khí, trấn áp nhóm nạn nhân của đám mây này, rồi mới có thể khởi động phi thuyền. Những sự chậm trễ này sẽ tiêu tốn thời gian của chúng ta."
 ancrel.14005.a: "Khống chế những nhà khoa học điên loạn."
 ancrel.14006.name: "Sự Cám Dỗ Của Công Nghệ"
 ancrel.14006.desc: "Chúng ta đã cất cánh! Mặc dù rất nguy hiểm, nhưng màn sương độc hại của phi thuyền ngoại lai thực sự có thể tăng cường sức chiến đấu và lòng trung thành của binh lính đế chế chúng ta. Tuy nhiên, vấn đề vẫn tồn tại: chúng ta có nên để binh lính của mình tiếp xúc với loại vật chất có hại này không? Hoặc chúng ta rút ra bài học từ những sai lầm của thảm kịch này, và từ bỏ tất cả?"
 ancrel.14006.a: "Tận dụng tốt công nghệ kinh ngạc này."
 ancrel.14006.a.tooltip: "Chiến thắng đang chờ đợi! Binh lính của chúng ta nên sẵn sàng mạo hiểm."
 ancrel.14006.b: "Từ bỏ công nghệ nguy hiểm này."
 ancrel.14006.b.tooltip: "Có những bí mật chúng ta tốt nhất là không nên biết."
 on_crashed_ship_cat: "Địa Điểm Gặp Nạn"
 on_crashed_ship_desc: "Chúng ta đã phát hiện ra một phi thuyền ngoại lai cổ xưa, nó bị chôn vùi một nửa ở giữa một hố va chạm tiểu hành tinh."
 anomaly.7030.name: "Địa Điểm Gặp Nạn"
 anomaly.7030.desc: "Chúng ta đã phát hiện ra một phi thuyền ngoại lai cổ xưa, nó bị chôn vùi một nửa ở giữa một hố va chạm tiểu hành tinh. Con tàu khoa học này có vỏ ngoài trang bị một mảng cảm biến mở rộng, không trang bị vũ khí. Bên ngoài thân tàu không chịu bất kỳ hư hại nào trước khi va chạm. Chúng ta có thể giả định rằng, thảm họa này xảy ra là do một sai lầm chết người nào đó của phi hành đoàn."
 anomaly.7030.desc.a: "Thật là một bi kịch."
 #ĐIỆU HÒ THỦY THỦ KHÔNG GIAN (sáng tác bởi Brian Campbell), Giai điệu: "Cá giữa biển khơi"
 site_space_shanty_dig: "Thư Trong Chai"
 space_shanty_intro: "Chúng ta tìm thấy mảnh vỡ của một con tàu vũ trụ cổ đại có thiết kế độc đáo. Phương thức đẩy nó sử dụng không giống với các con tàu hiện đại, mà dựa vào những cánh buồm khổng lồ xòe ra trong chân không để tiến hành. Có lẽ con tàu này có thể thu thập năng lượng hằng tinh, và tiến về phía trước dưới sự thúc đẩy của ánh sáng sao và gió hằng tinh. Các nhà khảo cổ của chúng ta đang khao khát lật mở những bí mật ẩn giấu trong con tàu cổ xưa này."
 space_shanty_intro_bio: "Trong không gian sâu thẳm xuất hiện di hài của một thực thể viễn cổ. Hình dạng của nó khác với bất kỳ con tàu sống nào đã biết, sở hữu những cánh buồm dạng màng khổng lồ có thể từ từ xòe ra trong gió vũ trụ, cưỡi lên bức xạ từ những vì sao xa xôi, hóa thân thành quái thú tinh tế bay lượn trong những dòng hải lưu vô hình.\n\nGiờ đây, nó chẳng qua chỉ là một bộ xác khô khốc, bộ khung nứt vỡ lộ ra ngoài, màng buồm từng rạng rỡ giờ đã rách nát tơi tả. Hiện chưa chắc chắn sinh vật này được thiết kế ra hay tiến hóa mà thành, hoặc có lẽ là nằm giữa cả hai. Các nhà khảo cổ sinh học đang khao khát nghiên cứu di hài này, để lắng nghe tiếng vang từ hành trình cuối cùng của nó, có lẽ, chỉ là có lẽ, học hỏi những bài ca mà nó từng hát cho những vì sao."
 ancrel.15021.name: "Thư Trong Chai"
 ancrel.15021.desc: "Đúng như dự đoán, bên trong con tàu \"thuyền buồm hằng tinh\" này khá là cổ kính. Buồng lái của nó thậm chí vẫn được thiết kế mô phỏng theo kiểu thuyền buồm chạy trên mặt biển lỏng ở các hành tinh thời xưa.\n\nVật liệu của boong tàu dường như là kim loại, nhưng phần lớn bề mặt lại được phủ bằng gỗ chạm khắc, còn cửa sổ quan sát và màn hình hiển thị dữ liệu lại được làm bằng vật liệu giống như thủy tinh.\n\nSau khi cấp điện cho máy tính của con tàu, chúng ta đã phát hiện ra một tệp dữ liệu về một bài hát của những nhà hàng hải kiểu cũ. Theo các nhà khảo cổ của chúng ta, giai điệu này từng được gọi là \"thuyền ca\" hoặc \"tàu không gian ca\". Chúng ta hiện đang cố gắng dịch lời bài hát."
 ancrel.15022.name: "Tàu Không Gian Ca"
 ancrel.15022.desc: "Sau khi chúng ta hoàn thành việc phục hồi và kích hoạt lại tệp dữ liệu, rất nhanh một giai điệu âm nhạc nhịp nhàng đã tràn ngập khắp con tàu, đi kèm với giọng hát của một nhà hàng hải cổ đại đã qua bộ lọc tự động điều chỉnh tông. Đại ý lời bài hát:\n\n“Nào, hỡi những chàng trai trẻ đang du hành không gian, hãy lắng nghe!\nTôi sẽ hát một bài về loài cá bơi lội giữa biển khơi!\n\nNày các chàng trai, cuồng phong sắp nổi, bão tố sắp đến\nKhi gió lớn thổi lên, chúng ta hãy ra khơi thôi!\nGió lớn hãy thổi đi xa nhé, hây! Thổi nhanh lên!\nHướng về biển sao, nàng từ từ khởi hành.\n\nGió hằng tinh nổi lên,\nĐưa tôi đi phương xa.\nBăng qua con đường không gian kia,\nChúng ta hướng về ánh sao!\n\nNày các chàng trai, cuồng phong sắp nổi, bão tố sắp đến\nKhi gió lớn thổi lên, chúng ta hãy ra khơi thôi!\nGió lớn hãy thổi đi xa nhé, hây! Thổi nhanh lên!\nHướng về biển sao, nàng từ từ khởi hành.”"
 ancrel.15023.name: "Quái Thú Không Gian Sâu"
 ancrel.15023.desc: "Trong quá trình chúng ta thám hiểm con tàu này, việc nạp điện thêm và phục hồi tệp dữ liệu đã mở khóa thêm nhiều chương của bài tàu không gian ca viễn cổ này. Hình chiếu toàn ảnh của con tàu hiển thị hình ảnh những thủy thủ, những nhà hàng hải đang cùng nhau ca hát nhảy múa một cách vặn vẹo:\n\n“Rồng khổng lồ bỗng giáng lâm\nTìm kiếm quê hương của chúng ta\nBăng qua không gian bao la\nTìm thấy nơi đó dưới làn sóng xanh!\n\nNày các chàng trai, cuồng phong sắp nổi, bão tố sắp đến\nKhi gió lớn thổi lên, chúng ta hãy ra khơi thôi!\nGió lớn hãy thổi đi xa nhé, hây! Thổi nhanh lên!\nHướng về biển sao, nàng từ từ khởi hành.\n\nTiyanki vụt nhảy\nNó là vua của không gian sâu\nTrong cuộc đua siêu không gian này\nChẳng hề kém cạnh tàu của ta\n\n(Hợp xướng lặp lại)\n\nTinh thần thú xuất hiện rồi!\nNó vươn xúc tu ra\nSiết chặt lấy con tàu của ta\nChúng ta kinh hãi khôn cùng!”\n\n"
 ancrel.15024.name: "Có Lẽ Là Đồ Uống"
 ancrel.15024.desc: "Các nhà khảo cổ của chúng ta đã phát hiện ra một nơi có lẽ là điểm lưu trữ đồ uống. Có phải những thủy thủ đó đã uống thứ chất lỏng bốc mùi hôi hám này không? Chúng ta chắc chắn là sẽ không uống những thứ chất lỏng kỳ lạ này. Nhưng thành quả thám hiểm con tàu này của chúng ta thực sự khiến người ta say mê!\n\n“Người đá đến rồi\nHọ sinh ra từ đá tảng khổng lồ\nKhi họ tụ họp lại\nNhững tảng đá này sẽ mạnh mẽ vô song!\n\n(Hợp xướng)\n\nNecroid đến rồi\nKinh hãi mà cao lớn\nAnh bạn à, anh không thể nào giết được chúng đâu\nChúng còn có thể hồi sinh nữa kìa!\n\n(Hợp xướng)\n\nMáy móc bầy đàn đến rồi\nMọi người mau chạy đi thôi\nAnh phải đánh một, mười, một trăm con\n1101!\n\n(Hợp xướng)”"
 ancrel.15025.name: "Quăng Xích Neo Đi!"
 ancrel.15025.desc: "Những nhân viên thám hiểm của chúng ta đã phát hiện ra một góc của lịch sử viễn cổ, cho thế nhân thấy được bầu nhiệt huyết và sự dũng cảm của các nhà thám hiểm cổ đại. Rõ ràng, thuyền trưởng sử dụng bài \"tàu không gian ca\" này để khích lệ thuyền viên, phối hợp hành động. Thậm chí những lúc ở một mình họ cũng thích hát bài này! Các nhà khảo cổ của chúng ta cho rằng, tác phẩm này nên được bảo tồn trong bảo tàng.\n\nVề bài hát cổ xưa này, chúng ta đã dịch toàn bộ lời bài hát có thể tìm thấy, và lưu vào cơ sở dữ liệu của mình. Những \"thủy thủ\" của chúng ta thậm chí còn từ đó lấy cảm hứng, hát vang bài tàu không gian ca phiên bản của chính mình, điều này cũng có thể kích phát mạnh mẽ sĩ khí và hiệu suất của họ.\n\n“Chúng ta sinh ra từ biển sâu\nTiến thẳng tới vòm trời\nChúng ta xây dựng nhà cửa\nCho đến mãi mãi về sau!\n\nNày các chàng trai, cuồng phong sắp nổi, bão tố sắp đến\nKhi gió lớn thổi lên, chúng ta hãy ra khơi thôi!\nGió lớn hãy thổi đi xa nhé, hây! Thổi nhanh lên!\nHướng về biển sao, nàng từ từ khởi hành.”\n\nGiờ là lúc rời khỏi con tàu cổ xưa này, \"quăng xích neo đi\", nhờ gió hằng tinh mà căng buồm khởi hành. Con tàu lớn của chúng ta sẽ vững vàng hành trình hướng về nơi sâu thẳm của biển sao!"
 ancrel.15022.a: "Dịch thêm lời bài hát đi."
 ancrel.15023.a: "Dịch thêm lời bài hát đi!"
 ancrel.15024.a: "Tôi muốn nghe thêm lời bài hát!"
 ancrel.15025.a: "Ghi lại những lời bài hát này, thiết lập lộ trình mới!"
