 job_evosymbiont_desc: "Thân xác của những cá thể cộng sinh này chính là những bản giả thuyết sống động. Lưng chúng mọc đầy những sợi râu kỳ lạ, màng khúc xạ và cả những gai nhọn đan chéo, tiến hóa ra khả năng cảm nhận lực hấp dẫn và bẻ khóa các phương trình hóa học."
