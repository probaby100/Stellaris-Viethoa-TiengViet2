 district_hollow_mountains_plural: "Các Rặng núi Rỗng"
 district_hollow_mountains_desc: "Khắp dải đất đá lởm chởm này chi chít những hố quặng, vết tích để lại của những cá thể cộng sinh bền bỉ mải mê đào bới tìm kiếm khoáng sản quý giá."
