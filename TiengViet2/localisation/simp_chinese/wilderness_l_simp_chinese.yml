 job_broodsymbiont_plural_with_icon: "[spawning_drone.GetIcon]$job_broodsymbiont_plural$"
 job_broodsymbiont_desc: "Những cá thể cộng sinh này nhuộm đẫm vùng hoang dã bằng thứ sinh khối dẻo dai: thứ vật chất nguyên sơ, tươi rói ấy luôn trực chờ để chuyển hóa thành bất cứ thứ gì mà hành tinh khao khát."
