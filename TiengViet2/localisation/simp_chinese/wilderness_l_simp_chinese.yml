 district_orchard_forests_desc: "Khu vực chuyên biệt được khoanh vùng cho săn bắn hái lượm, ươm mầm đủ mọi thứ từ thức ăn tế bào cho tới ngũ cốc ăn được và cả những con mồi cộng sinh."
