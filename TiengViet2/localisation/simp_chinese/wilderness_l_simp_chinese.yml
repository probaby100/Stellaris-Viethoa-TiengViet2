 ####################################
 # Truyền thống
 ####################################
 tr_adaptability_appropriation_wilderness: "Đi đày"
 tr_adaptability_appropriation_wilderness_delayed: "Những hệ sinh thái bị bỏ xó chẳng mảy may đóng góp gì cho đế chế. Các [GetIndividualNamePluralCap] buộc phải rồng rắn kéo nhau tới những hành tinh đang cần chúng nhất một cách thật triệt để."
 tr_discovery_faith_in_science_wilderness: "Mạng lưới Sợi nấm"
 tr_discovery_faith_in_science_wilderness_delayed: "Khai thác tối đa bản tính tò mò cố hữu của mọi [GetIndividualNamePlural], để khi gắn kết lại trong một mạng lưới chân khuẩn, chúng ta sẽ gặt hái được những thành tựu khám phá rực rỡ hơn."
 tr_domination_wilderness_network: "Gia tốc Chuyển hóa Vĩ mô"
 tr_domination_wilderness_network_delayed: "Bơm thêm tốc độ cho vòng quay trao đổi năng lượng trên toàn lục địa, sức mạnh tương trợ giữa các vùng đất sẽ được khuếch đại thấy rõ."
 tr_domination_wilderness_network_effect: "§YMở khóa Chỉ dụ:§! $edict_drone_overdrive_wilderness$"
 tr_domination_imperious_architecture_wilderness: "Tương thích Pheromone Liên loài"
 tr_domination_imperious_architecture_wilderness_desc: "§Y$district_craglands_plural$§! tạo thêm £defense_army£ §Y$defense_army_plural$§!: §G+2§!"
 tr_domination_imperious_architecture_wilderness_delayed: "Ép buộc mọi [GetIndividualNamePlural] phải ném cho nhau những thông điệp pheromone, giúp phản ứng chớp nhoáng trước mọi hiểm họa rình rập bên ngoài."
 tr_expansion_colonization_fever_wilderness: "Trái tim của Muôn vàn Thế giới"
 tr_expansion_colonization_fever_wilderness_desc: "Lúc đặt chân thuộc địa hóa hành tinh mới, sẽ được đính kèm ngẫu nhiên một §Y£district£Khu vực§!."
 tr_expansion_colonization_fever_wilderness_delayed: "[GetGestaltEntityName] là bản hòa ca của hằng hà sa số ý thức, một bản hòa tấu mà ngay cả màn đêm câm lặng của hư không cũng chẳng tài nào dập tắt."
 tr_expansion_a_new_life_wilderness: "Đâm chồi Nảy lộc"
 tr_expansion_a_new_life_wilderness_delayed: "Sự bành trướng của [GetGestaltEntityName] chính là liều thuốc chữa bách bệnh."
 tr_expansion_courier_network_wilderness: "$tr_expansion_courier_network_hive$"
 tr_expansion_courier_network_wilderness_delayed: "Chẻ nhỏ từng quần xã sinh vật thành những mảnh vụn của một đại thể lớn hơn, thế là chúng ta có thể thoải mái tung hứng thông tin mà chẳng cần tới sự dòm ngó sát sao của ý thức hành tinh."
 tr_expansion_galactic_ambition_wilderness: "$tr_expansion_galactic_ambition_hive$"
 tr_expansion_galactic_ambition_wilderness_delayed: "Khi chúng ta rũ bỏ cái nôi đã ôm ấp mình, rụt rè cắm rễ vào màn đêm tăm tối lần đầu tiên, nỗi kinh hoàng nguyên thủy cũng bám riết lấy. Đè bẹp và xé vụn nỗi sợ đó là con đường duy nhất để chúng ta tiếp tục lớn mạnh. Hàng chục triệu [GetIndividualNamePlural] sẽ ngã xuống, để duy nhất một [GetGestaltEntityName] trường tồn."
 tr_prosperity_pursuit_of_profit_wilderness: "Vận chuyển Chất lỏng Toàn cục"
 tr_prosperity_pursuit_of_profit_wilderness_delayed: "Những mạch máu vắt ngang lục địa sẽ bơm đầy dưỡng chất và vật liệu xây dựng thiết yếu, tiếp sức cho các hệ sinh thái đang mòn mỏi chờ cứu viện."
 tr_prosperity_public_works_wilderness: "Hang hốc Dưới lòng đất"
 tr_prosperity_public_works_wilderness_desc: "Mọi £district£§YKhu vực§! cung cấp thêm §G+50§! £housing£§Y$MOD_PLANET_HOUSING_ADD$§!"
 tr_prosperity_public_works_wilderness_delayed: "Bằng cách xúi giục các [GetIndividualNamePlural] chui lủi xuống tận lớp vỏ hành tinh và trét thêm sáp vào tổ của chúng, sức chứa cá thể sẽ phình to ra đáng kể."
 tr_synchronicity_kinship_wilderness: "Đồng bộ Nhịp điệu Sinh học"
 tr_synchronicity_kinship_wilderness_delayed: "Nắm thóp thời gian ngơi nghỉ của [GetIndividualNamePlural] sẽ tự khắc kiến tạo nên một mạng lưới điều phối và ban phát lại dưỡng chất trên quy mô toàn hành tinh."
 ####################################
 # Đặc quyền Thăng thiên
 ####################################
 ap_mastery_of_nature_wilderness: "$ap_mastery_of_nature$"
 ap_mastery_of_nature_wilderness_desc: "Chúng ta là kẻ săn mồi, mà cũng là mồi ngon trong vòng tuần hoàn vô tận. Từ tế bào còm cõi nhất cho tới đại thụ chọc trời, thảy đều phải quỳ rạp trước quy luật sinh tồn này. Chúng ta chính là tự nhiên."
 ap_engineered_evolution_wilderness: "$ap_engineered_evolution$"
 ap_engineered_evolution_wilderness_desc: "Ý thức của chúng ta sinh ra là để giẫm đạp lên mọi thử thách của môi trường. Môi trường đã thay da đổi thịt, và chúng ta cũng thế."
 engineered_evolution_wilderness_tt: "—Kích hoạt §YTình huống $genetic_ascension_situation$§!, thứ sẽ mở khóa cây truyền thống ['tradition_category:tradition_purity'].$TABBED_NEW_LINE$—$REQUIRES_TRADITION_SLOT$\n—$UNLOCKS_AGENDA$ §Y$council_agenda_agenda_engineered_evolution_name$§!, từ đó mở khóa công nghệ chỉnh sửa gen thành một tùy chọn nghiên cứu."
 ############
 # Tình báo
 ############
 operation_embed_planetary_roots: "Gieo rắc Rễ Hành tinh" # rễ cây thực sự, như trong đời sống thực vật
 operation_embed_planetary_roots_desc: "Lúc này, đám [owner.GetIndividualNamePlural] do thám của chúng ta đang bận ngập đầu. Thế nhưng, nếu vung vãi đám vi sinh vật bán thông minh lên hành tinh mục tiêu, chúng ta sẽ giữ lại được phần lớn mạng lưới tình báo, và còn thừa nước đục thả câu quậy tung chuỗi cung ứng thực phẩm của chúng." # Vùng hoang dã cắm một phần của nó vào, do đó gọi là 'hệ vi sinh vật'
 operation_embed_planetary_roots_on_success: "$operation_sleeper_cells_on_success$"
 espionage_planetary_roots: "Rễ Hành tinh"
 espionage_planetary_roots_desc: "Chúng ta đã tuồn vào một hệ vi sinh vật bán nhận thức, giúp chúng ta luôn hóng hớt được nhất cử nhất động của đế chế này. Những cá thể cộng sinh nguyên thủy này lúc nào cũng sẵn sàng hầu hạ các [owner.GetIndividualNamePlural] của chúng ta trong công cuộc đào bới thông tin."
 operation_embed_planetary_roots_requires_blocker: "$TRIGGER_FAIL$§R$espionage_planetary_roots$ của chúng ta khát khao một ['concept_natural_blocker'] trên hành tinh mục tiêu.§!"
 operation_embed_planetary_roots_dont_stack_this: "$TRIGGER_FAIL$§RChúng ta đã vung $espionage_planetary_roots$ lên [target.GetName] rồi. Trò vờn này sẽ kéo dài đến tận §Y[planet_roots_success]§!.§!"
 operation_embed_planetary_roots_not_cleared: "$TRIGGER_FAIL$§RChúng ta vẫn còn đánh hơi thấy $espionage_planetary_roots$ của mình lẩn khuất đâu đó trên [target.GetName].§!"
 d_wilderness_root_blocker: "Bụi rậm Xâm lăng"
 d_wilderness_root_blocker_desc: "Một thảm thực vật hoang dại bán trí tuệ không phải người bản địa đã cắm rễ chặt cứng nơi chốn đồng quê hẻo lánh này, bóp nghẹt mọi thứ xung quanh."
 wilderness.4500.name: "Lùng sục Hoang dã"
 wilderness.4500.desc: "Đám [owner.GetOperativesLowerPlural] bán tự chủ của chúng ta đã chấm được vài mảnh đất màu mỡ cho quần thể vi sinh vật độc dị của mình. Giờ chúng sẽ cắm trại rình rập ở đó một thời gian, ưu tiên những bãi đáp hứa hẹn mang lại lợi lộc dài lâu béo bở nhất."
 wilderness.4505.name: "Chốt Điểm Đổ bộ"
 wilderness.4505.desc: "Chúng ta đã lừa được một tên [target.GetSpeciesAdj] ngờ nghệch ra tay giúp sức, hắn cứ đinh ninh mình đang làm một chuyện tốt đẹp bảo vệ thiên nhiên. Đâu ngờ rằng, hắn sắp sửa ném thẳng chùm vi sinh vật \"bom hạt giống\" của chúng ta vào vùng khỉ ho cò gáy của §H[roots_planet.GetPlanetMoon] [roots_planet.GetName]§!.\n\nDù đám cộng sinh phọt ra từ cái kén ươm này có thể yểu mệnh, chẳng bao giờ với tới đẳng cấp là một mảnh ý thức trọn vẹn của chúng ta, nhưng chúng ta vẫn cảm nhận được sự háo hức sục sôi của chúng, muốn đào bới và xoi mói cái cảnh quan ngoại lai này tới tận cùng."
 wilderness.4510.name: "Rải $espionage_planetary_roots$"
 wilderness.4510.desc: "Kể từ cái khoảnh khắc quần thể vi sinh vật của chúng ta được thả xuống sào huyệt [GetRootsBlockerName] mới, chúng ta đã bắt đầu tham lam hít hà bầu không khí cấm kỵ của nó, và mường tượng ra một thế giới mang tên §H[roots_planet.GetName]§!.\n\nChừng nào lũ cộng sinh này còn đứt đoạn với cái tôi rộng lớn hơn của chúng ta, thì cái sự hiện diện của chúng ta ở đây vẫn mong manh như sợi bún. Thế nhưng, khi thời cơ chín muồi, lúc chúng ta vùng lên khuấy đảo lãnh thổ của bọn [target.GetAdj], chúng sẽ trở thành tay sai đắc lực nhất."
 wilderness.4510.a: "Rễ của chúng ta phải đâm sâu hơn, sống dai hơn."
 wilderness.4510.b: "Cứ để rễ của chúng ta mọc hoang dại ở đây đi."
 ####################################
 # Công nghệ
 ####################################
 tech_wilderness_terraform: "Mầm mống Hành tinh"
 tech_wilderness_terraform_desc: "Muốn vươn rễ sang một thế giới mới, thì việc đầu tiên là phải nhào nặn ra đất đai màu mỡ. Đánh phủ đầu bằng việc cải tạo môi trường hành tinh chính là tấm vé bảo kê cho thuộc địa phát triển bùng nổ."
 tech_terrestrial_sculpting_wilderness: "$tech_terrestrial_sculpting$"
 tech_terrestrial_sculpting_wilderness_desc: "$tech_terrestrial_sculpting_desc$"
 tech_terrestrial_sculpting_wilderness_effect: "§HMở khóa tính năng:§! Cho phép giở trò cải tạo môi trường trên các nhóm hành tinh thông thường."
 tech_wilderness_node: "Lõi Hiện sinh"
 tech_wilderness_node_desc: "Bằng việc thúc giục các cá thể cộng sinh đang rải rác khắp cái tôi phân tán của chúng ta cắm rễ suy nghĩ sâu hơn, cái ý chí tập thể của chúng ta sẽ len lỏi một cách sắc sảo vào tâm can của tất thảy."
 tech_wilderness_cluster: "$tech_hive_cluster$"
 tech_wilderness_cluster_desc: "Chúng ta có thể nhấn ga cho sự trơn tru của tâm trí tập thể toàn cầu bằng cách bơm sức vào những hội nghị của lũ cộng sinh, đám này sống chỉ với một lẽ duy nhất: đẩy nhanh việc hiện thực hóa ý chí chung này."
 tech_wilderness_confluence: "$tech_hive_confluence$"
 tech_wilderness_confluence_desc: "Cái ý chí tương trợ của chúng ta sẽ được chắp thêm cánh khi có sự hội tụ rầm rộ của những cá thể cộng sinh đồng cảm sâu sắc, tụi này rất giỏi đi guốc trong bụng môi trường, có thể vắt kiệt và lan tỏa lại những tư tưởng tập thể của chúng ta."
 tech_genome_mapping_wilderness: "$tech_genome_mapping$"
 tech_genome_mapping_wilderness_desc: "Việc phác họa bản đồ gen cho vô số phiên bản DNA biến dị sẽ giúp chúng ta moi móc tận gốc rễ cách thức bản thân nảy mầm, đồng thời dẹp loạn những mớ bòng bong rắc rối."
 tech_mining_1_wilderness: "$tech_mining_1$"
 tech_mining_1_wilderness_desc: "Bơm thẳng chất làm đặc niêm mạc và thủy áp vào các mỏ khoáng sản hiện có, tha hồ khoan chọc sâu hơn và vắt kiệt thêm sản lượng."
 tech_powered_exoskeletons_wilderness: "$tech_powered_exoskeletons$"
 tech_powered_exoskeletons_wilderness_desc: "Những bộ áo giáp trợ lực sẽ bơm thêm hàng tấn cơ bắp và tốc độ cho người dùng, vừa ném ra chiến trường như một cỗ máy giết chóc, vừa đập tan sự ỳ ạch của đám lao động chân tay."
 tech_colonization_1_wilderness: "Chiến dịch Thế giới Mới"
 tech_colonization_1_wilderness_desc: "Chúng ta sẽ dồn hết chất xám để cân đo đong đếm xem cần bao nhiêu tài nguyên và vật liệu để lay tỉnh một thế giới mới, qua đó dọn đường cho lũ cộng sinh tiên phong vượt qua chuyến hải trình trần ai giữa các vì sao."
 tech_wilderness_government: "$tech_planetary_government$"
 tech_wilderness_government_desc: "Từ cái giây phút mà một hành tinh mới bừng tỉnh, việc hệ trọng số một là phải đắp nặn ra một môi trường ổn định và sung túc, chứ không phải đi lo mấy cái lợi ích hão huyền xa xôi của chúng ta."
 tech_wilderness_colonial_centralization: "$tech_colonial_centralization$"
