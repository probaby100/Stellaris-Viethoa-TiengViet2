 job_gaseosymbiote: "Cá thể Phóng khí"
 job_gaseosymbiote_plural: "Các Cá thể Phóng khí"
 job_gaseosymbiote_desc: "Những cá thể cộng sinh này đích thị là bậc thầy thuật giả kim vi sinh, chúng luôn duy trì một điều kiện cực kỳ chuẩn xác để ấp ủ ra các dòng khí kỳ lạ trong tự nhiên."
 job_gaseosymbiote_effect_desc: "[gas_refiner_drone.GetIcon]$job_gaseosymbiote_drone_plural$ chuyển hóa [GetCatalyticMineralsOrFood] thành £exotic_gases£§Y$exotic_gases$§!"
