 job_wilderness_maintenance_drone: "Sinh khối Dẻo"
 job_wilderness_maintenance_drone_plural: "$job_wilderness_maintenance_drone$"
 job_wilderness_maintenance_drone_desc: "Lượng sinh khối dồi dào tiềm năng, được gìn giữ và bảo quản kỹ lưỡng, chỉ chờ ngày hữu dụng."
 neurosymbiont: "$job_neurosymbiont$"
 job_neurosymbiont: "Cá thể Thần kinh"
 job_neurosymbiont_plural: "Các Cá thể Thần kinh"
 job_neurosymbiont_plural_with_icon: "£job_neurosymbiont£$job_neurosymbiont_plural$"
 job_neurosymbiont_desc: "Đây là cầu nối sống động giữa con thú khổng lồ nuốt chửng bầu trời và chúng ta, những cá thể cộng sinh này đốt cháy sinh mệnh chỉ để từng chút một tiêm nhiễm tâm trí chúng ta vào tâm hồn con quái thú."
 job_neurosymbiont_effect_desc: "£job_neurosymbiont£$job_neurosymbiont_plural$ sản xuất £energy£§Y$energy$§!"
