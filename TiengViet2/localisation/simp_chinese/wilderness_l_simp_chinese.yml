 job_forgesymbiont_desc: "Ngoi lên từ dòng dung nham, dưới sự thôi thúc của bản năng, những cá thể cộng sinh này tôi luyện quặng thô thành hợp kim, rồi nâng niu dâng lên như những món tế phẩm dành tặng cho vùng hoang dã."
