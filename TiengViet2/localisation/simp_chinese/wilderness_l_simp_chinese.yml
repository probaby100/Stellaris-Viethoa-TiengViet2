 ####################################
 # Phân khu
 ####################################
 zone_urban_wilderness: "Lõi Rừng"
 zone_urban_wilderness_desc: "Trái tim đang đập thình thịch của sinh khối và bản năng. Nó không ngừng nở rộ và tái tạo, giúp vùng hoang dã cắm rễ thật sâu và vươn thật xa tại nơi này, chực chờ tiếp sức cho những chức năng đang đâm chồi nảy lộc."
 zone_foundry_wilderness: "Ruột Luyện kim"
 zone_foundry_wilderness_desc: "Căn buồng bỏng rẫy này đang nhào nặn đá nóng chảy và sức mạnh của các nguyên tố. Các $job_forgesymbiont_plural$ dùng những cơn co bóp tiêu hóa để định hình lại kim loại, bồi bổ cho bộ xương không ngừng lớn lên của hành tinh."
 zone_research_wilderness: "Cọng Tư duy"
 zone_research_wilderness_desc: "Một cụm nút rễ thần kinh vươn cao xen lẫn những đóa hoa đột biến. Các $job_evosymbiont_plural$ tề tựu về đây, mang theo tứ chi mới, giác quan mới và cả những nhận thức mới mẻ."
 zone_unity_wilderness: "Vách Vọng âm"
 zone_unity_wilderness_desc: "Tầng đá sừng sững găm đầy những khúc xương rỗng và những mảnh thịt hóa thạch, nơi những cơn gió lùa qua bề mặt hành tinh ngân lên những nốt trầm bổng đan xen. Các $job_choirsymbiont_plural$ tụ hội về đây, cất lên khúc hát của cả hành tinh."
 zone_fortress_wilderness: "Nụ Chỉ huy"
 zone_fortress_wilderness_desc: "Một điểm nút cảm quan ngập tràn do các $job_tamersymbiont_plural$ đan kết lại, triệu tập và sai khiến các bầy thú tiền trí tuệ thông qua những luồng mùi hương khuếch tán. Vùng hoang dã chẳng cần hạ lệnh, chỉ cần tiết ra mùi hương."
 zone_minerals_wilderness: "Sống lưng Quặng"
 zone_minerals_wilderness_desc: "Một cấu trúc đá sống nhô cao thành vệt dài, vừa là rặng núi, lại vừa là cơ quan nội tạng. Sâu bên trong bộ xương hang động ấy, các khoáng chất đang tích tụ và rung lên theo từng nhịp thở chậm rãi của vùng hoang dã."
 zone_energy_wilderness: "Phổi Quang năng"
 zone_energy_wilderness_desc: "Những mảng mô quang hợp khổng lồ phình to ra khi hứng lấy ánh sáng, tạo nên áp suất rồi lại nhịp nhàng thở hắt ra. Nương theo những nhịp đập bức xạ ấy, các $job_photosymbiont_plural$ bị bắn vọt lên bầu trời, cưỡi trên những luồng nhiệt để rượt đuổi vầng sáng rực rỡ của các vì sao."
 zone_food_wilderness: "Đài Hoa"
 zone_food_wilderness_desc: "Một khối não ngát hương chìm ngập trong những cánh hoa rực rỡ và pheromone, đan dệt nên vô vàn lộ trình truyền phấn tựa như những sợi chỉ trên tấm thảm thêu. Chính từ nơi đây, khả năng sinh sôi nảy nở của hành tinh này được bài binh bố trận với năng suất hệt như một nhà máy cơ khí."
 zone_research_unity_wilderness: "Lõi Đồng điệu"
 zone_research_unity_wilderness_desc: "Một cơ quan đầy nhịp điệu nằm chễm chệ ngay giữa trung tâm vùng hoang dã, nơi những luồng tư tưởng rung lên bần bật thông qua ký ức và tri thức, chúng không phải sinh ra tại đây, mà là vang vọng tại đây."
 zone_trade_wilderness: "Lối Tua cuốn"
 zone_trade_wilderness_desc: "Những vòng xơ sợi, những nhánh chân xoắn xuýt và các túi dự trữ đã hợp lại thành một trung tâm hậu cần không biết mỏi mệt, nơi các $job_spindlesymbiont_plural$ cắm cúi bện thắt và vận chuyển đi những nhu yếu phẩm của sự sống. Vùng hoang dã sẽ tự mình giao hàng."
 ####################################
