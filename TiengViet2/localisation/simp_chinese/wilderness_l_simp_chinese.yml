 job_choirsymbiont_desc: "Những cá thể cộng sinh này cất lên những âm thanh du dương đầy tầng lớp, sóng âm cứ thế lan tỏa dào dạt khắp sinh quyển. Khúc ca tuyệt diệu của sự sống này dẫn lối và thăng hoa vạn vật."
 job_choirsymbiont_effect_desc: "£job_choirsymbiont£$job_choirsymbiont_plural$ chuyển hóa £energy£§Y$energy$§! và £food£§Y$food$§! (hoặc £minerals£§Y$minerals$§!) thành £unity£§Y$unity$§!"
