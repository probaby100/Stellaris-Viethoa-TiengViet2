 immunosymbiont: "$job_immunosymbiont$"
 job_immunosymbiont: "Cá thể Miễn dịch"
 job_immunosymbiont_plural: "Các Cá thể Miễn dịch"
 job_immunosymbiont_desc: "Những cá thể cộng sinh này miệt mài tuần tra dọc theo bộ rễ của vùng hoang dã, đánh hơi và trừ khử mọi hành vi dị thường. Một cơ thể khổng lồ thì cũng cần những kháng thể khổng lồ."
 job_immunosymbiont_effect_desc: "[patrol_drone.GetIcon]$job_immunosymbiont_plural$ làm giảm £crime£§Y$PLANET_CRIME_NO_HAPPINESS_TITLE$§!, tạo ra £defense_army£§YLực lượng Phòng vệ§!, và sản xuất £unity£§Y$unity$§!"
 broodsymbiont: "$job_broodsymbiont$"
 job_broodsymbiont: "Cá thể Ấp ủ"
