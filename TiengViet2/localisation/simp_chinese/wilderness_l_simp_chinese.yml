 ####################################
 # City Appearance
 ####################################
 WILDERNESS: "生体荒野"
 ####################################
 # Deposits
 ####################################
 d_wilderness_mining: "空穴系统"
 d_wilderness_mining_desc: "曾经占据这个世界的生物匆忙地遗弃了他们的矿场，许多隧道被粗暴地挖掘一空，并且容易坍塌。"
 d_wilderness_mining_2: "坑洼高原"
 d_wilderness_mining_2_desc: "这个危险区域遍布着毫无价值的废土和潜在的塌陷区，这一切都源于其过去大规模的采矿活动。"
 d_wilderness_farming: "脱水森林"
 d_wilderness_farming_desc: "昔日的广袤丰饶之林，如今只余枯槁残躯。干枯的枝桠再也结不出果实。"
 d_wilderness_farming_2: "森林化石"
 d_wilderness_farming_2_desc: "一片曾拥有丰富多样林木资源的广袤区域遗迹。繁茂的植被与菌类在极短时间内消亡，其残骸呈现出晶体化形态，且具有生物化学惰性特征。"
 d_wilderness_generator: "烧焦光伏场"
 d_wilderness_generator_desc: "这片废弃的太阳能农场里，只剩下一片枯萎的顶棚和干枯易折的茎秆。"
 d_wilderness_generator_2: "光伏废土"
 d_wilderness_generator_2_desc: "这片广袤的区域遍布着曾经繁茂的太阳森林留下的多刺残骸。干燥、受到轻微辐射的叶片物质如今已化为大气尘埃漂浮着。"
 d_wilderness_city: "恶臭沼泽"
 d_wilderness_city_desc: "这里曾是一片生机盎然的栖息地，孕育着无数生命形态，如今却遭废弃，沦为污秽横流的溃烂泥潭。"
 d_wilderness_city_2: "溃烂泥沼"
 d_wilderness_city_2_desc: "无数形态各异的生命在此消亡。它们腐烂的残骸渗入大地，释放出大量具有腐蚀性的刺鼻生化物质。"
 d_wilderness_industrial: "金属泥沼"
 d_wilderness_industrial_desc: "几处露天矿物浴池的遗迹，因周围地质结构的崩塌，池中物质已变得有毒且失去活性。"
 d_wilderness_industrial_2: "生化恶地"
 d_wilderness_industrial_2_desc: "石制的碗状容器与布满化学粉尘的沟壑，就是这片曾延绵不绝的半有机矿物处理厂区仅存的遗迹。"
 d_scorched_plains: "烧焦平原"
 d_scorched_plains_desc: "这片区域曾经生机勃勃，直到被恒星超级耀斑的爆发所摧毁。"
 concept_scorched_plains: "$d_scorched_plains$"
 concept_scorched_plains_desc: "—$MOD_PLANET_MAX_DISTRICTS_ADD$：§R-2§!\n—清理时间：£time£ 180§I天§!\n—清理花费：\n$t$- 900 $i_energy$\n\n§L$d_scorched_plains_desc$§!"
 ####################################
 # Colony Types
 ####################################
 col_wilderness_default: "荒野殖地"
 ####################################
 # Planet Designations
 ####################################
 col_wilderness_capital: "心脏星球"
 col_wilderness_capital_tt: "$col_wilderness_capital_desc$"
 col_wilderness_capital_desc: "这个世界的每个角落都跃动着共生生命，其数量之庞大，足以构成一个活生生的星体。"
 col_wilderness_generator: "光合星球"
 col_wilderness_generator_desc: "$col_generator_desc$"
 col_wilderness_generator_tt: "在这个世界上，无数簇叶绿体共生体聚集并储存着能量。"
 col_wilderness_mining: "石屑星球"
 col_wilderness_mining_desc: "$col_mining_desc$"
 col_wilderness_mining_tt: "在这颗看似贫瘠的星球地表之下，蓬勃的生命琴瑟和谐地潜藏在地下，它们正热切地开采着丰饶的矿藏。"
 col_wilderness_farming: "授粉星球"
 col_wilderness_farming_desc: "$col_farming_desc$"
 col_wilderness_farming_tt: "遍布这个世界的特化共生体维持着理想的生长环境，促进了营养丰富的动植物繁衍生息。"
 col_wilderness_fortress: "狩猎星球"
 col_wilderness_fortress_desc: "$col_fortress_desc$"
 col_wilderness_fortress_tt: "这个世界的地表因领地意识极强的兽群奔腾和可怕掠食者的嚎叫而震颤。"
 col_wilderness_tech: "认知星球"
 col_wilderness_tech_desc: "$col_research_desc$"
 col_wilderness_tech_tt: "这个生机勃勃的世界充满了奇观异象，任由那些求知若渴、充满好奇的头脑去探索和把玩。"
 col_wilderness_nest: "织巢星球"
 col_wilderness_nest_desc: "$col_city_desc$"
 col_wilderness_nest_tt: "这片庇护所孕育着如此繁多的共生生命体，以至于大气成分都可能随荒野的需求与情绪而改变。"
 col_wilderness_refinery: "精炼星球"
 col_wilderness_refinery_desc: "专门生产£exotic_gases£§H$exotic_gases$§!以及其他£strategic_resource£§H战略资源§!。"
 col_wilderness_refinery_tt: "这颗星球表面遍布地热喷口，大量纳米级生物与其他奇特共生体可能在此聚集并加工原始物质。"
 col_wilderness_forge: "熔炉星球"
 col_wilderness_forge_desc: "$col_foundry_desc$"
 col_wilderness_forge_tt: "一个行星规模的熔炉，用于将原始矿物加工成高效且多用途的合金。"
 col_wilderness_unification: "平宁星球"
 col_wilderness_unification_desc: "$col_bureau_desc$"
 col_wilderness_unification_tt: "一种从容不迫的共生氛围在这个世界中交织，深化了共生体之间错综复杂的关系。"
 ####################################
 # Personalities
 ####################################
 personality_benevolent_wilderness: "谐和荒野"
 personality_benevolent_wilderness_desc: "这片浩瀚而具有智慧的生物圈，所求不过是与星辰交织相融。它们的根系耐心地伸展遍及星系，并非出于贪婪，而是为了和谐共生。"
 personality_rampant_wilderness: "狂乱荒野"
 personality_rampant_wilderness_desc: "狂乱荒野并不肆虐；它蔓延、吞噬、持久。万物无论生死，都在无尽生长与腐朽的循环中被重归尘土。"
 ####################################
 # Policies
 ####################################
 policy_symbiont_policy: "$policy_drone_policy$"
 policy_symbiont_policy_desc: "我们的共生集体有非常强大的产出能力，但并非无限。我们必须决定资源的最佳使用方式和场所。"
 symbiont_policy_balanced: "$drone_policy_balanced$"
 symbiont_policy_balanced_name: "$symbiont_policy_balanced$"
 symbiont_policy_balanced_desc: "荒野致力于均等得生产原始资源和产成品。\n\n§E资源生产没有任何加成或惩罚。§!"
 symbiont_policy_worker: "$drone_policy_worker$"
 symbiont_policy_worker_name: "$symbiont_policy_worker$"
 symbiont_policy_worker_desc: "该荒野优先提取原材料，相关的共生体的生产力会提高，代价是一些更特化的制造产出会下降。\n\n"
 symbiont_policy_thinker: "$drone_policy_thinker$"
 symbiont_policy_thinker_name: "$symbiont_policy_thinker$"
 symbiont_policy_thinker_desc: "该荒野优先制造产成品，从而提升其效能，不过会降低提取原材料的效率。\n\n"
 ####################################
 # Edicts
 ####################################
 edict_capacity_subsidies_wilderness: "$edict_capacity_subsidies$"
 edict_capacity_subsidies_wilderness_desc: "该法令鼓励我们的光合作用共生体形成横跨地表跟随恒星的迁徙群，提升了能量产出。"
 edict_mining_subsidies_wilderness: "$edict_mining_subsidies$"
 edict_mining_subsidies_wilderness_desc: "该法令增强我们的根系，使我们的破土共生体在深挖时降低结构坍塌的风险。"
 edict_farming_subsidies_wilderness: "$edict_farming_subsidies$"
 edict_farming_subsidies_wilderness_desc: "该法令向土壤中释放的高能化学物质，以提高我们的营养产出。"
 edict_forge_subsidies_wilderness: "$edict_forge_subsidies$"
 edict_forge_subsidies_wilderness_desc: "让我们的岩性藻类池营养饱和以实现季节性爆发来收获更多的合金副产物。"
 edict_research_subsidies_wilderness: "$edict_research_subsidies$"
 edict_research_subsidies_wilderness_desc: "$edict_research_subsidies_desc$"
 edict_clearing_motes_wilderness: "$edict_clearing_motes$"
 edict_clearing_motes_wilderness_desc: "用易爆微粒添加入共生体的饮食中使其可以消化有机和无机物质。我们的共生功能体将通过吞噬来适应环境。"
 edict_learning_campaign_wilderness: "$edict_learning_campaign$"
 edict_learning_campaign_wilderness_desc: "向共生体提供更多的营养，我们就可以提高产出。"
 edict_war_drone_campaign_wilderness: "作战共生体运动"
 edict_war_drone_campaign_wilderness_desc: "给我们的猎食者和兽群共生体分配额外的营养，这样我们就能提升力量和战斗准备度。"
 edict_scientific_revolution_wilderness: "$edict_scientific_revolution$"
 edict_scientific_revolution_wilderness_desc: "$edict_scientific_revolution_desc$"
 edict_drone_overdrive_wilderness: "共生体过载"
 edict_drone_overdrive_wilderness_desc: "我们的共生会有更多的竞争，因而需要更多资源。"
 ####################################
 # Colonization Rules
 ####################################
 COLONIZATION_IMPOSSIBLE_WILDERNESS_TECH: "§R没有£society£§H$tech_ecological_adaptation$§!我们无法殖民与母星差异过大的星球。§!"
 ####################################
 # Agendas
 ####################################
 council_agenda_agenda_purity_perfection_wilderness_name: "$council_agenda_agenda_purity_perfection_name$"
 council_agenda_agenda_purity_perfection_wilderness_desc: "我们应该以最高的精确度指挥这场共生体的基因交响乐。"
 agenda_purity_perfection_wilderness_finish: "$council_agenda_agenda_purity_perfection_wilderness_name$"
 agenda_purity_perfection_wilderness_finish_desc: "$council_agenda_agenda_purity_perfection_wilderness_desc$"
 council_agenda_agenda_superior_colonies_wilderness_name: "优选嫩芽"
 council_agenda_agenda_superior_colonies_wilderness_desc: "$council_agenda_agenda_superior_colonies_desc$"
