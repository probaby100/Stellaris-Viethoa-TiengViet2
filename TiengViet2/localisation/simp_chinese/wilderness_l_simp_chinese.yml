 job_spindlesymbiont: "Cá thể Thoi sợi"
 job_spindlesymbiont_plural: "Các Cá thể Thoi sợi"
 job_spindlesymbiont_desc: "Dạng cộng sinh này được trang bị vô vàn chi gãy gọn và các giác quan kỳ dị, có thể điều hướng dòng chảy tài nguyên, chuyển phát dinh dưỡng và vật chất tới bất cứ nơi nào khát khao nhất. Mỗi cái nhấc tay đều là vì sự cân bằng của vùng hoang dã."
 job_spindlesymbiont_with_icon: "£job_spindlesymbiont£ $job_spindlesymbiont$"
 job_spindlesymbiont_plural_with_icon: "£job_spindlesymbiont£ $job_spindlesymbiont_plural$"
