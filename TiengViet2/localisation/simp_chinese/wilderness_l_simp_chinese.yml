 job_tamersymbiont_desc: "Những cá thể cộng sinh này tiết ra các luồng tín hiệu pheromone vô cùng phức tạp, dẫn dắt các bầy thú chưa có trí tuệ, biến bản năng hoang dại thành mạng lưới phòng vệ hành tinh nhịp nhàng."
