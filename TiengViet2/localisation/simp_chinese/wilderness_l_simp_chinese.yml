 ####################################
 decision_wilderness_expand: "Mở rộng Quy mô Hành tinh"
 decision_wilderness_expand_desc: "Hấp thụ lại lượng sinh khối tinh khiết mà chúng ta đã tích cóp được, để tẩm bổ cho thế giới của chúng ta."
 decision_wilderness_mastery_over_nature_desc: "Bản ngã tập thể của chúng ta đang khát khao không gian để đâm chồi, thế nên chúng ta sẽ tự mình mở lối. Chúng ta sẽ làm quen với mọi ngóc ngách môi trường trên hành tinh này."
