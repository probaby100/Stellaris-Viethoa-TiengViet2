 job_crystalsymbiote: "Cá thể Nuôi tinh thể"
 job_crystalsymbiote_plural: "Các Cá thể Nuôi tinh thể"
 job_crystalsymbiote_desc: "Những cá thể cộng sinh này cấy ghép những khối tinh thể cực hiếm ngay trên da thịt mình. Mọi sự nảy mầm của tinh thể đều bị chi phối bởi môi trường, công năng và tiếng gọi của tập thể."
 job_crystalsymbiote_effect_desc: "[translucer_drone.GetIcon]$job_crystalsymbiote_plural$ chuyển hóa [GetCatalyticMineralsOrFood] thành £rare_crystals£§Y$rare_crystals$§!"
