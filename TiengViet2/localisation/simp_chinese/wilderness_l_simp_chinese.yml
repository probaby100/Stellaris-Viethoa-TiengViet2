l_simp_chinese:
 ####################################
 # Sự kiện
 ####################################
 # Sự kiện giới thiệu
 progress.2.desc.wilderness: "[Root.GetName] đã có một phát hiện chấn động trên [from.GetName] —— [from.GetPlanetMoon] này tràn ngập sự sống ngoài hành tinh! Đây là lần đầu tiên chúng ta chạm trán một dạng sống hoàn toàn khác biệt với chính mình.\n\nPhát hiện này cuối cùng đã củng cố niềm tin rằng hành tinh [root.owner.capital_scope.GetName] không hề đơn độc trong vũ trụ. Dù những sinh vật ngoài hành tinh trên [from.GetName] này có vẻ chưa có trí tuệ bậc cao, nhưng rất có thể chẳng bao lâu nữa chúng ta sẽ bắt gặp..."
 # Sự kiện Thuộc địa hóa
 wilderness.1010.name: "[from.GetName] Thức tỉnh"
 wilderness.1010.desc.intro: "Các bào tử cải tạo môi trường của chúng ta đã hoàn thành nhiệm vụ, lần đầu tiên mang một phần của chúng ta cắm rễ sang một thế giới khác."
 wilderness.1010.desc.same: "Trở thành [from.GetName] trong khi vẫn là [root.GetHomeWorldName]... Cảm giác này vô cùng thân thuộc: một trạng thái tồn tại dễ chịu, dẫu cho nó đang khoác lên muôn vàn hình hài mới dưới ánh sáng của một ngôi sao từng xa lạ. Chúng ta dễ dàng hòa hợp với những điều kiện vốn có nơi đây." #VD: 'vừa trở thành Sao Hỏa vừa là Trái Đất...'
 wilderness.1010.desc.similar_cold: "Thích nghi với một §Y[from.GetName]§! [from.GetClassAdj] quả là một thử thách, nhưng chúng ta đã tìm ra cách. Những chiếc tua vươn tới đâu, nơi trú ẩn thành hình tới đó, và những cái miệng đói khát cũng bắt đầu chuyến đi săn." #VD: 'Thay đổi bản thân để phù hợp với Sao Diêm Vương lạnh giá...'
 wilderness.1010.desc.similar_dry: "Dưới tư cách là hành tinh [root.GetHomeWorldName], chúng ta luôn phát triển mạnh mẽ trong bầu khí quyển khô cằn. Vậy nên chúng ta cũng sẵn sàng đương đầu với thử thách để trở thành một §Y[from.GetName]§! [from.GetClassAdj]. Chúng ta đã tìm ra những phương thức mới để tìm kiếm và lưu trữ độ ẩm, học cách hòa hợp với môi trường địa lý khắc nghiệt mới mẻ này thay vì chống lại nó." #VD: 'thử thách trở thành Sao Hỏa xavan'
 wilderness.1010.desc.similar_wet: "Giống như cách chúng ta từng sinh sôi nảy nở trong vùng nước của [root.GetHomeWorldName], chúng ta cũng sẽ vươn mình rực rỡ dưới hình hài một §Y[from.GetName]§! [from.GetClassAdj]. Lượng khoáng chất, dòng chảy, và cả ánh nắng nơi đây đều mang nét xa lạ, nhưng chúng ta đã tìm ra cách để chắt lọc những tài nguyên thiết yếu." #VD: 'chúng ta vươn mình như Sao Hải Vương ngập nước'
 wilderness.1010.desc.diff_cold: "Chúng ta thấu hiểu rằng việc trở thành §Y[from.GetName]§! sẽ đầy rẫy khó khăn. Quả thực, một phần của chúng ta từng cấu thành nên hành tinh [root.GetHomeWorldName] [root.capital_scope.GetClassAdj] đã dần héo mòn tại đây, nhưng những phần sống sót lại vô cùng dẻo dai và đã bắt đầu thích nghi với môi trường mới. Khung cảnh xa lạ này khiến việc thu thập các nguồn tài nguyên sinh tồn cơ bản trở nên nhọc nhằn hơn —— tuy nhiên, ngay trên mảnh đất lạnh giá này, chúng ta đã thấy sự sống tự tìm ra lối thoát." #VD: 'trở thành Trái Đất'
 wilderness.1010.desc.diff_dry: "Nơi này khơi dậy nỗi sợ hãi nguyên thủy sâu thẳm nhất trong chúng ta: sự khô nóng tột độ đánh thức những ký ức bản năng về vùng đất cháy khét. Dẫu vậy, nếu chúng ta có thể thích nghi và đâm chồi nảy lộc tại đây... thì việc trở thành §Y[from.GetName]§! biết đâu sẽ đánh thức một thứ gì đó hoàn toàn mới mẻ ngay bên trong chính chúng ta. Nơi nào có nước, chúng ta đã tìm ra cách giữ lại. Nơi nào thiếu bóng râm, chúng ta đã tự mình che rợp."
 wilderness.1010.desc.diff_wet: "Hành trình nỗ lực trở thành §Y[from.GetName]§! của chúng ta sẽ đầy rẫy gian truân, nhưng chúng ta đã sẵn sàng chống chọi với sự mục nát và những cơn đại hồng thủy. Những thành phần trong chúng ta giỏi xử lý nước hơn giờ đang làm nhiệm vụ dẫn dòng để bảo vệ cho những phần yếu ớt. Chúng ta đã hòa vào nhịp chảy độc tôn của vùng đất này." #VD: 'Nỗ lực để trở thành Sao Hỏa của chúng ta'
 wilderness.1010.desc.other: "Khi chúng ta tự nhào nặn bản thân để trở thành §Y[from.GetName]§!, chúng ta sẽ nhận ra phần nào trong mình sẽ đâm chồi nảy lộc, phần nào sẽ dần lụi tàn. Trạng thái tồn tại [from.GetClassAdj] này có nhiều nét tương đồng với những gì chúng ta từng biết, nhưng cũng xen lẫn vô vàn điều xa lạ —— vì lẽ đó, chúng ta quan sát, và chúng ta thử nghiệm." #VD: 'nhào nặn bản thân để trở thành Mặt Trăng'
 wilderness.1010.desc.outro: "Cấu trúc bề mặt, nguồn dinh dưỡng, và thậm chí cả DNA của chúng ta đã bắt đầu thích ứng và đan xen với các dạng sống bản địa tại đây. [from.GetName] đang bừng tỉnh."
 wilderness.1010.a: "Chẳng bao lâu nữa, thế giới của chúng ta sẽ hòa làm một."
 # Sự kiện Cải tạo Địa hình
 terra.25.desc.wilderness: "Dự án dài hơi nhằm đánh thức §Y[From.GetName]§! lại không diễn ra suôn sẻ như dự tính. Một trong những máy tái tổ hợp sinh khối của chúng ta đã bị vỡ, giải phóng một lượng nhỏ §YCặn Cải tạo Địa hình§! làm tắc nghẽn các thung lũng và tạo ra một lớp vỏ nhầy nhụa che phủ một vài khu vực có thể cư trú.\n\nDù bản thân chất này không gây hại cho chúng ta, nhưng lượng mủ nhầy dư thừa này đồng nghĩa với việc một số đơn vị có khả năng di chuyển linh hoạt hơn của chúng ta sẽ gặp chút khó khăn trong một khoảng thời gian."
 terra.80.desc.wilderness: "Chúng ta vừa gột sạch thêm một lớp bức xạ nữa khỏi bầu khí quyển và đất đai của §Y[From.GetName]§!, mở đường cho tương lai của chính mình. Tuy nhiên, các [Root.GetTerraformerPlural] cảnh giác của chúng ta đã buộc phải can thiệp và tạm thời phong tỏa một vài khu vực trên thế giới này. Hành động của chúng ta dường như đã làm xáo trộn một giống loài bản địa cực kỳ khó nắm bắt, chúng vốn dĩ sinh sôi mạnh mẽ trong môi trường phóng xạ, nhưng giờ đây lại bắt đầu héo úa vì sự can thiệp của chúng ta.\n\nĐáng kinh ngạc hơn, giống loài này dường như đang ở giai đoạn tiền trí tuệ, mấp mé bước qua ngưỡng cửa tiến hóa để trở thành sinh vật có nhận thức. Giờ đây, khi [From.GetName] sắp sửa quét sạch những tàn dư môi trường độc hại cuối cùng, chúng ta phải đối mặt với một quyết định quan trọng: phải làm gì với dạng sống mới mẻ và độc đáo này?"
 terra.80.b.wilderness: "Thế giới này là của chúng. Chúng ta nên để chúng thức tỉnh."
 terra.80.d.wilderness: "Hãy nuốt chửng chúng."
 wilderness.2000.name: "Sự Thức tỉnh Trong tầm kiểm soát"
 #wilderness.2000.desc.reg: "Chúng ta cảm nhận được tiềm năng to lớn của [from.GetName]. Sợ hãi xen lẫn vui sướng có lẽ là thứ cảm xúc phù hợp nhất trước sức mạnh khủng khiếp mà chúng ta sắp sửa thi triển tại đây: uốn nắn [from.GetPlanetMoon] này bằng ý chí và những công cụ mà chúng ta đã chế tạo; đặt nền móng cho sự thức tỉnh cuối cùng của nó.\n\nTừ lâu, chúng ta đã dựa dẫm vào các quá trình tự nhiên để nuôi dưỡng và duy trì [root.GetName]. Nhưng những phép thử đó cũng khiến chúng ta phải trả giá đắt, và dạy cho chúng ta vô vàn bài học. Giờ đây, chúng ta sẽ được chiêm ngưỡng những điều kỳ diệu nào sẽ nảy nở khi một thế giới có thể cư trú bỏ qua quá trình tiến hóa tự thân để tiếp nhận tri thức đánh đổi từ sự sinh trưởng và lụi tàn đầy gian truân."
 wilderness.2000.desc.barren: "Chứng kiến sự hoang tàn của [from.GetName] có thể khiến người ta đau lòng, nhưng tình trạng này sẽ không kéo dài lâu nữa. Cho đến nay, sự sống trong dải ngân hà dường như vẫn luôn ngó lơ hành tinh cằn cỗi này, nhưng hiện tại, chúng ta, [root.GetName], đang nắm trong tay công cụ và tri thức để thay đổi tất cả.\n\nDù đã đúc kết được nhiều bài học, việc hồi sinh [from.GetName] vẫn là một thử thách khổng lồ. Bằng ý chí của mình, cùng với những công cụ thay đổi khí hậu mà chúng ta đã khám phá ra, sự sống sẽ sớm đâm chồi nảy lộc tại nơi từng là chốn không người."
 wilderness.2000.desc.tomb_detox: "Dù sự sống mà chúng ta từng biết trên [from.GetName] có thể đã lụi tàn, nhưng giờ đây chúng ta đã sẵn sàng trao cho thế giới này cơ hội thứ hai. Chúng ta đã bắt tay vào việc phục hồi bầu khí quyển, mạch nước và đất đai, để [from.GetName] có thể một lần nữa cưu mang sự sống dưới nhân dạng của [root.GetName]."
 wilderness.2000.desc.gaia: "Lò luyện tiến hóa đã tạo ra phép màu trên cơ thể [root.GetName] của chúng ta. Giờ đây, chúng ta có cơ hội để mang đến những điều vĩ đại hơn thế cho [from.GetPlanetMoon] [from.GetName]. Với những công cụ và tri thức mà những bản thể trước đây của chúng ta không thể nào tưởng tượng nổi, chúng ta đã bắt đầu biến [from.GetName] thành một nơi mà sự thức tỉnh của nó chắc chắn sẽ là độc nhất vô nhị.\n\nNền đất của [from.GetName] một ngày nào đó sẽ căng tràn dưỡng chất, được nuôi lớn bởi vòng đời sôi động của hệ động thực vật của chúng ta. Các thung lũng, rặng núi và cao nguyên sẽ trải rộng thênh thang làm chốn săn bắt, hái lượm và nương thân. Sự sống sẽ bừng nở rực rỡ tại nơi đây."
 wilderness.2000.a: "Bắt đầu thôi."
 wilderness_pre_sapient_defence_army: "Bầy thú Tiền trí tuệ"
 seq_wilderness_pre_sapient_defence_army: "Bầy Cộng sinh $R$"
 wilderness_pre_sapient_defence_army_plural: "Các Bầy thú Tiền trí tuệ"
 wilderness_pre_sapient_defence_army_desc: "Loài sinh vật này có ý thức lãnh thổ cực kỳ cao, ngày thường rất hiền lành, nhưng một khi bị chọc giận, chúng sẽ vứt bỏ mọi lý trí, bùng nổ bản năng nguyên thủy để dốc sức bảo vệ những kẻ mà chúng coi là người nhà."
 wilderness_pre_sapient_assault_army: "Bầy thú Tiền trí tuệ"
 seq_wilderness_pre_sapient_assault_army: "Bầy thú Cộng sinh $R$"
 wilderness_pre_sapient_assault_army_plural: "Các Bầy thú Tiền trí tuệ"
 wilderness_pre_sapient_assault_army_desc: "Những sinh vật hung hãn mang trong mình sự ranh mãnh và sức bền nguyên thủy, đủ sức nghiền nát bất cứ kẻ nào chúng coi là kẻ thù."
 ####################################
 # Nguồn gốc
 ####################################
 origin_wilderness: "Vùng hoang dã Sống"
 origin_wilderness_desc: "§RCảnh báo: Vô hiệu hóa mọi con đường thăng thiên, ngoại trừ ['concept_purity_ascension'].§!\n\nThực thể này chẳng khác nào một sinh quyển có tư duy: vô số dạng sống khác biệt đã sớm hòa quyện thành một ý thức hệ hình mẫu quy mô hành tinh."
 origin_tooltip_wilderness_effects: "—Đặc điểm giống loài: ['trait:trait_wilderness']\n—Thay thế tất cả £building£['concept_buildings'], £district£['concept_districts'] và £zone£['concept_district_specialization'] bằng phiên bản độc quyền\n—Thay thế Tàu thực dân bằng việc ['concept_terraforming']\n——Mở khóa tài nguyên mới: £biomass£['concept_biomass']\n—Hành tinh mẹ$TABBED_NEW_LINE$—Kích thước: £planetsize£18$TABBED_NEW_LINE$—['concept_scorched_plains', £blocker£$d_scorched_plains$]"
 trait_wilderness: "Hoang dã"
 trait_wilderness_desc: "§LLà một cá thể cộng sinh cùng có lợi, tư duy và những gì giống loài này tạo ra đã bám rễ sâu vào môi trường xung quanh, khó lòng mà tách bạch rõ ràng.§!"
 WILDERNESS_NATURAL_WORLDS_DECLINE: "§R§YHoang dã§! không thể sống sót trên các hành tinh phi tự nhiên.§!"
 WILDERNESS_DEAD_WORLD: "$TRIGGER_FAIL$§YHoang dã§! không thể sống trong một đế chế không có đặc tính Hoang dã."
 country_virtual_jobs: "Tất cả các vị trí việc làm trong đế chế này sẽ tự động được lấp đầy."
 concept_wilderness_trait: "$trait_wilderness$"
 concept_wilderness_trait_desc: "—$MOD_LOGISTIC_GROWTH_MULT$: §R-100%§!\n—§RKhông thể di cư hoặc bị cưỡng chế di dời§!$NEW_LINE$—§RKhông thể sinh sản tự nhiên§!\n\n§L$trait_wilderness_desc$§!"
 PRESCRIPTED_adjective_zhardmehka: "Tụ hoa"
 PRESCRIPTED_ship_prefix_zhardmehka: "ZMV"
 PRESCRIPTED_species_name_zhardmehka: "Zhardkalin"
 PRESCRIPTED_species_name_plural_zhardmehka: "Zhardkalin"
 PRESCRIPTED_species_adjective_zhardmehka: "Zhardkalin"
 PRESCRIPTED_planet_name_zhardmehka: "Thellon"
 PRESCRIPTED_system_name_zhardmehka: "Tatra"
 PRESCRIPTED_ruler_name_zhardmehka: "$FUN3_CHR_Obanva$ $FUN3_CHR_uvi-Livve$"
 PRESCRIPTED_ruler_title_zhardmehka: "Hóa thân"
 START_SCREEN_WILDERNESS_INTRO: "Kể từ thuở hồng hoang của ký ức, [root.GetHomeWorldName] vẫn luôn là hành tinh mang tên [root.GetHomeWorldName]. Từng nhánh cây, cành leo và cả enzyme đều là một phần cấu thành nên bản ngã —— một sự cân bằng vĩnh cửu giữa sinh sôi, lụi tàn và săn mồi. Suốt bao tháng năm đằng đẵng, [root.GetHomeWorldName] chỉ có thể cảm nhận lờ mờ nhịp đập của dải ngân hà, thế nhưng những vì sao từ lâu đã chẳng còn yên ắng.\n\nMột trận chiến đã nổ ra ngay trên bầu trời của [root.GetHomeWorldName]. Xác những con tàu khổng lồ trút xuống như mưa, những tạo tác ngoại lai này lập tức bị đồng hóa và tận dụng. Và rồi, một cơn bão mặt trời cực mạnh ập tới..."
 START_SCREEN_WILDERNESS_DEFAULT: "[root.GetHomeWorldName] cảm nhận được thứ ánh sáng chói lòa thiêu đốt. Hàng tỷ cá thể cộng sinh bị bão lửa và bức xạ quét sạch, dấu vết sự sống trên toàn bộ lục địa bị xóa sổ không thương tiếc."
 START_SCREEN_WILDERNESS_COLD: "[root.GetHomeWorldName] cảm nhận được thứ ánh sáng chói lòa thiêu đốt. Những dòng sông băng tan chảy thành cơn lũ cuồn cuộn, trong khi bức xạ từ ngôi sao thiêu rụi [root.GetHomeWorldName]. Toàn bộ lục địa đã bị gột rửa sạch trơn."
 START_SCREEN_WILDERNESS_DRY: "[root.GetHomeWorldName] cảm nhận được thứ ánh sáng chói lòa thiêu đốt. Những cồn cát bị nung chảy thành thủy tinh, những cơn cuồng phong cuốn phăng mọi thứ bám trên vách đá của chúng ta. Toàn bộ lục địa đã hoàn toàn biến thành chốn cằn cỗi."
 START_SCREEN_WILDERNESS_WET: "[root.GetHomeWorldName] cảm nhận được thứ ánh sáng chói lòa thiêu đốt. Mặt hồ sục sôi, chỏm băng tan chảy, bức xạ từ ngôi sao thiêu đốt [root.GetHomeWorldName] tới tận gốc rễ. Cả một lục địa đã bốc hơi."
 START_SCREEN_WILDERNESS_OUTRO: "Nỗi đau đớn đã thức tỉnh chúng ta. Lần đầu tiên, chúng ta nhận ra sự mỏng manh của chính mình. Biển sao đầy rẫy hiểm nguy, nhưng cũng ẩn chứa vô vàn phép màu. Vận dụng những gì đã học, chúng ta sẽ đâm chồi nảy lộc. Và cuối cùng, chúng ta sẽ mang theo thân xác này vươn tới những vì sao."
 ####################################
 # Chế độ Quyền lực
 ####################################
 auth_mutualistic_intelligence: "Trí tuệ Cộng sinh"
 auth_mutualistic_intelligence_plural: "Các Trí tuệ Cộng sinh"
 auth_mutualistic_intelligence_desc: "$auth_mutualistic_intelligence_plural$ vươn ra vũ đài ngân hà dưới dạng một ý thức phân tán quy mô hành tinh. Chúng được tạo thành từ những giống loài cộng sinh tới từ vô vàn quần thể sinh vật, mọi cá thể đều hành động tuân theo ý chí tập thể của môi trường mà chúng đang sống.\n\nMột số cá thể cộng sinh được chọn lọc có thể thực hiện các nhiệm vụ chuyên biệt một cách bán tự chủ, nhưng đại đa số vẫn phải thường xuyên tiếp xúc với môi trường cộng sinh. Nếu bị cô lập, chúng sẽ thoái hóa về các hành vi bản năng hoang dã, và cuối cùng sẽ chết."
 tt_auth_mutualistic_intelligence: "Có chế độ quyền lực §Y$auth_mutualistic_intelligence$§! (§Y$auth_hive_mind$§!)"
 gov_wilderness: "$gov_hive_mind$"
 gov_wilderness_desc: "Chính phủ này vận hành như một ý thức duy nhất, người dân hoàn toàn không có ý chí tự chủ, họ chỉ tồn tại để thỏa mãn những nhu cầu và khao khát của $RT_WILDERNESS$."
 RT_WILDERNESS: "Hoang dã"
 RT_WILDERNESS_FEMALE: "$RT_WILDERNESS$"
 ####################################
 # Tòa nhà
 ####################################
 building_colony_shelter_wilderness: "Xúc tu Hành tinh"
 building_colony_shelter_wilderness_desc: "Một ranh giới được dệt nên từ các sinh vật đa bào bành trướng khắp thế giới này, đảm bảo cho sự tồn tại vững chắc của vùng hoang dã."
 building_capital_wilderness: "Chùm rễ Hành tinh"
 building_capital_wilderness_desc: "Một quần thể sinh vật đơn giản đầy sức sống và vươn rễ khắp nơi, chung sống hài hòa với các cá thể cộng sinh năng động để củng cố khả năng phối hợp và năng suất của chúng."
 building_major_capital_wilderness: "Khóm rễ Hành tinh"
 building_major_capital_wilderness_desc: "Một cụm sinh tồn dày đặc đến mức các cá thể cộng sinh có thể sinh sống, làm việc và sinh sản ngay bên trong, mọi hoạt động đều diễn ra trong một không gian hình cầu được giới hạn nghiêm ngặt."
 building_system_capital_wilderness: "Trục rễ Hành tinh"
 building_system_capital_wilderness_desc: "Một khối liên kết khổng lồ tạo nên từ vô số dạng sống khác nhau, chúng phối hợp cùng nhau với quy mô lớn đến mức có thể tự tạo ra một vi khí hậu lý tưởng cho riêng mình."
 requires_building_wilderness_capital: "§RCần có §Y$building_capital_wilderness$§! trên hành tinh.§!"
 requires_building_wilderness_major_capital: "§RCần có §Y$building_major_capital_wilderness$§! trên hành tinh.§!"
 requires_building_wilderness_system_capital: "§RCần có §Y$building_system_capital_wilderness$§! trên hành tinh.§!"
 building_imperial_capital_wilderness: "Tổ chính Đế chế"
 building_imperial_capital_wilderness_desc: "Vùng hoang dã cai trị cả một đế chế thiên hà ngay bên trong cấu trúc khổng lồ và chằng chịt này. Vận mệnh của cả dải ngân hà được định đoạt tại đây."
 building_tendril_cradle_1: "Ngọn nguồn Xúc tu"
 building_tendril_cradle_1_desc: "Một cụm những sợi tua ngắn như tơ vươn ra từ nơi này, chắt lọc nguyên liệu thô xung quanh rồi chuyển tới các cơ quan trọng yếu gần nhất."
 building_tendril_cradle_2: "Mạng lưới Xúc tu"
 building_tendril_cradle_2_desc: "Những xúc tu dài mỏng mảnh vắt ngang mặt đất, hút lấy tài nguyên từ các khu vực lân cận để xử lý và điều phối."
 building_tendril_cradle_3: "Tổ rễ Vận chuyển"
 building_tendril_cradle_3_desc: "Những sợi rễ đan xen nhịp nhàng len lỏi dưới lòng đất, chuyên chở sinh khối qua các đường ống phân tầng để tới những trung tâm sinh học ở xa."
 building_tendril_cradle_4: "Lõi Xúc tu Hành tinh"
 building_tendril_cradle_4_desc: "Những xúc tu hậu cần khổng lồ tỏa ra khắp cơ thể hành tinh, không biết mệt mỏi điều hướng, bắt nhịp và sắp xếp lại các nguồn tài nguyên của vùng hoang dã một cách đồng bộ."
 planet_research_buildings: "Tòa nhà Nghiên cứu Hành tinh"
 mod_planet_research_buildings_upkeep_mult: "Phí bảo trì $planet_research_buildings$"
 building_brain_node_1: "Dây leo Nghiên cứu"
 building_brain_node_1_desc: "Những công việc cộng sinh mang đầy tính tò mò và ham khám phá đã tạo nên bước đệm cho các nghiên cứu phổ thông."
 mod_planet_building_brain_node_1_build_speed_mult: "Tốc độ xây dựng $building_brain_node_1$"
 building_brain_node_2: "Rừng rậm Nghiên cứu"
 building_brain_node_2_desc: "Một môi trường sống độc đáo chuyên dung dưỡng những hành vi tò mò, thúc đẩy việc nghiên cứu chuyên sâu hơn về cả những tạo tác nhân tạo lẫn hiện tượng tự nhiên."
 mod_planet_building_brain_node_2_build_speed_mult: "Tốc độ xây dựng $building_brain_node_2$"
 building_brain_node_3: "Vỏ bọc Nghiên cứu Ngoại lai"
 building_brain_node_3_desc: "Những khu rào kín khổng lồ này cho phép vô số cá thể cộng sinh chịu cực hạn thực hiện thử nghiệm trên đủ loại vật liệu dị thường và nguy hiểm."
 mod_planet_building_brain_node_3_build_speed_mult: "Tốc độ xây dựng $building_brain_node_3$"
 building_brain_node_4: "Rào nghiên cứu Cấp cao"
 building_brain_node_4_desc: "Sự kết hợp giữa công nghệ ngoại lai và các khu rào cộng sinh khổng lồ đã thúc đẩy những nghiên cứu tối tân trong hàng loạt môi trường hộp cát đa dạng."
 mod_planet_building_brain_node_4_build_speed_mult: "Tốc độ xây dựng $building_brain_node_4$"
 building_commensal_clearing_1: "Trảng cây Hội sinh"
 building_commensal_clearing_1_desc: "Những hòn đảo tĩnh tại này là nơi để các sinh vật di chuyển tự do có thể tụ tập, nghỉ ngơi và tái đồng bộ hóa bản thân với vùng hoang dã."
 building_commensal_clearing_2: "Rừng rậm Hội sinh"
 building_commensal_clearing_2_desc: "Một chốn nương tựa tuyệt vời cho những cuộc hội tụ quy mô lớn của các cá thể cộng sinh. Sự tương tác qua lại của chúng tại đây tạo nên những góc nhìn sâu sắc hơn về cái tôi phân tán."
 building_commensal_clearing_3: "Thung lũng Hội sinh"
 building_commensal_clearing_3_desc: "Những quần thể cộng sinh đông đúc và đa dạng thường xuyên di cư qua các tầng địa chất nguyên sơ này, thắt chặt thêm sự liên kết giữa đôi bên."
 building_commensal_clearing_4: "Quần xã Hội sinh"
 building_commensal_clearing_4_desc: "Những môi trường sống đan xen trải dài là nơi chứng kiến vô vàn cuộc hội ngộ, mỗi lần chạm trán lại thổi bùng lên một tia lửa quan trọng gắn kết khối cộng sinh thống nhất."
 building_massive_growth_1: "Thung lũng Dinh dưỡng"
 building_massive_growth_1_desc: "Việc cải tạo địa hình quy mô nhỏ giúp tạo ra một điều kiện vi khí hậu lý tưởng và ổn định quanh năm cho mùa màng."
 building_massive_growth_2: "Bụi rậm Dinh dưỡng"
 building_massive_growth_2_desc: "Một tán rừng khổng lồ bán trong suốt che chở cho vùng cây bụi này khỏi mọi tác động của môi trường, đảm bảo nguồn cung thực phẩm căng mọng luôn dồi dào."
 building_massive_growth_3: "Ruộng bậc thang Khổng lồ"
 building_massive_growth_3_desc: "Đây là chốn thiên đường cho các vi sinh vật và hệ động vật bán thủy sinh, những thửa ruộng bậc thang bạt ngàn này cho ra sản lượng dồi dào các loại ngũ cốc và protein."
 building_massive_growth_4: "Đồn điền Lâm học"
 building_massive_growth_4_desc: "Bóng râm của hệ thực vật khổng lồ xum xuê lá vảo bọc cho sản lượng lương thực của các tầng cây bụi thấp, cung cấp thức ăn cho toàn bộ chuỗi thức ăn."
 building_bioelectric_stimulator_1: "Máy điều ứng Lục lạp"
 building_bioelectric_stimulator_1_desc: "Những chùm bong bóng hình thấu kính hội tụ ánh nắng đi xuyên qua lớp dung dịch nuôi cấy đặc tảo, chuyển hóa và cất giữ năng lượng để dùng cho sau này."
 building_bioelectric_stimulator_2: "Máy gia tốc Lục lạp"
 building_bioelectric_stimulator_2_desc: "Các túi kính chứa đầy tảo quang hợp tận dụng năng lượng mặt trời để đan kết các liên kết hóa sinh bền chặt hơn, qua đó giảm thiểu tình trạng tự phóng điện."
 building_bioelectric_stimulator_3: "Mảng thấu kính Lục lạp"
 building_bioelectric_stimulator_3_desc: "Những nhánh cây mang theo máy thu năng lượng mặt trời có khả năng tự động vươn lên hay hạ xuống tùy theo nhu cầu và công suất phát điện, tạo thành một trạm điện đa năng cực kỳ đáng tin cậy."
 building_bioelectric_stimulator_4: "Túi Lục lạp"
 building_bioelectric_stimulator_4_desc: "Những bọc kính đầy tảo này có khả năng di chuyển tới những nơi đang khát năng lượng nhất để sinh sôi, gần như triệt tiêu hoàn toàn sự hao hụt năng lượng khi truyền tải đi xa."
 building_churning_tunnels_1: "Lỗ khoan Thạch nham"
 building_churning_tunnels_1_desc: "Những phần thân thực vật cứng tựa pha lê bị ép trồi lên và bao bọc lấy các điểm khai thác hiện hữu, giúp chắt lọc thêm nhiều khoáng chất hữu dụng."
 building_churning_tunnels_2: "Lưới lọc Thạch nham"
 building_churning_tunnels_2_desc: "Một quần thể màng sinh học bán thấm có thể giữ lại các khoáng chất quý giá vốn rất dễ trôi theo dòng nước xả của hoạt động khai thác quặng dạng lỏng."
 building_churning_tunnels_3: "Máy nghiền Thạch nham"
 building_churning_tunnels_3_desc: "Những chiếc kìm và tấm mài đầy sức mạnh sẽ xé nát đất đá thành dạng bùn hóa học, giúp việc tách khoáng chất trở nên dễ dàng hơn bao giờ hết."
 building_churning_tunnels_4: "Bồn khai thác Thạch nham"
 building_churning_tunnels_4_desc: "Sự kết hợp hoàn hảo giữa máy nghiền, chế phẩm sinh hóa và màng sinh học giúp hiện thực hóa việc khai thác khoáng chất tại chỗ ở bất kỳ nơi nào có mạch quặng dồi dào."
 building_natural_furnace_0: "Ao Nhiệt Luyện kim"
 building_natural_furnace_0_desc: "Các cá thể cộng sinh ưa nhiệt cặm cụi làm việc không ngơi nghỉ bên trong và xung quanh nguồn nhiệt tự nhiên này để cho ra lò những mẻ hợp kim thượng hạng."
 building_natural_furnace_1: "Lò Nhiệt Luyện kim"
 building_natural_furnace_1_desc: "Lớp sinh trưởng chịu nhiệt giúp tận dụng nhiệt lượng hiệu quả hơn hẳn, từ đó tạo ra những loại hợp kim chất lượng cao."
 building_natural_furnace_2: "Lò Luyện kim Quang học Thể rắn"
 building_natural_furnace_2_desc: "Những lò hữu cơ khắc quang học siêu chính xác nhờ ứng dụng công nghệ ảnh toàn ký, có thể tinh luyện ra các hợp kim đa dụng đỉnh cao."
 building_natural_furnace_3: "Lò nung Nano"
 building_natural_furnace_3_desc: "Bên trong những bồn nung và lò luyện rừng rực này là nơi trú ngụ của các sinh vật nano ưa nhiệt, chúng có khả năng thanh lọc mọi tạp chất độc hại khỏi hợp kim."
 building_avatar_chamber_1: "Cái nôi Hóa thân"
 building_avatar_chamber_1_desc: "Vùng hoang dã bắt đầu đâm chồi những cơ quan mang hình hài sơ khai. Mục đích là để thiết lập cho chúng một bản năng đủ sức sinh tồn giữa những dạng sống và địa hình dị biệt nằm ngoài sinh quyển bản địa."
 building_avatar_chamber_2: "Hang động Hóa thân"
 building_avatar_chamber_2_desc: "Những bản sao cơ thể được nuôi dưỡng và định hướng thông qua các thử nghiệm nội bộ, nhằm mô phỏng lại hệ sinh thái và sinh vật ngoại lai. Tri thức được lan tỏa bằng cách hiện thực hóa những điều chưa biết."
 building_avatar_chamber_2_effect: "$building_avatar_chamber_1$ sản xuất thêm §G200§! £amenities£Tiện nghi"
 building_avatar_chamber_3: "Rừng rậm Hóa thân"
 building_avatar_chamber_3_desc: "Cơ quan khổng lồ này gieo rắc những bản mẫu hóa thân được nặn ra từ các hình thái và cảnh quan ngoài hành tinh. Vùng hoang dã sẽ tự mình trải nghiệm để học hỏi về những thứ mà nó chưa từng được tiếp xúc trước đây."
 building_avatar_chamber_3_effect: "$building_avatar_chamber_1$ sản xuất thêm §G400§! £amenities£Tiện nghi"
 building_avatar_chamber_4: "Vỏ não Hóa thân"
 building_avatar_chamber_4_desc: "Một động cơ hóa thân quy mô hành tinh, có khả năng giả lập cả một nền văn minh, những hệ sinh thái ngoại lai và cả các môi trường cực đoan. Vùng hoang dã đang tập dượt tại đây cho từng cuộc đụng độ với dải ngân hà."
 building_avatar_chamber_4_effect: "$building_avatar_chamber_1$ sản xuất thêm §G800§! £amenities£Tiện nghi"
 building_mote_aggravator: "Máy Tiêu hóa Hóa học"
 building_mote_aggravator_desc: "Một hệ thống mô mạch và chuyển hóa hóa học tinh vi, có khả năng biến đất đá thông thường thành $volatile_motes$."
 building_churning_stomach: "Lưới lọc Khí Ngoại lai"
 building_churning_stomach_desc: "Các vi sinh vật và sinh vật nano chuyên biệt cao sẽ phản ứng với những hạt bụi lơ lửng bình thường, từ đó nhả ra $exotic_gases$ tinh khiết này."
 building_crystal_growth: "Tầng chứa Pha lê"
 building_crystal_growth_desc: "Những tấm mái che đặc biệt có thể điều chỉnh độ ẩm và nhiệt độ cực kỳ chuẩn xác, tạo ra môi trường tất yếu để nuôi cấy nhân tạo $rare_crystals$ đầy khắt khe."
 building_planetary_carapace: "Trạm đồn trú Hài cốt"
 building_planetary_carapace_desc: "Bên trong thao trường hình kén này có thể là nơi cắm trại của vô vàn cá thể cộng sinh với ý thức lãnh thổ cực mạnh, chúng luôn trong tư thế sẵn sàng chờ lệnh xuất chinh."
 mod_planet_building_planetary_carapace_build_speed_mult: "Tốc độ xây dựng $building_planetary_carapace$"
 building_planetary_carapace_2: "Pháo đài Hài cốt"
 building_planetary_carapace_2_desc: "Cơ sở này có quy mô khổng lồ, sở hữu bãi tập kiên cố và doanh trại hoàn bị, đảm bảo lực lượng phòng vệ đồn trú tại đây có thể đương đầu với bất kỳ cuộc đổ bộ hành tinh nào."
 building_ozone_thickener: "Màn chắn Bảo vệ Hành tinh"
 building_ozone_thickener_desc: "$tech_planetary_shield_generator_desc$"
 building_subterranean_cache: "Kho chứa Dưới lòng đất"
 building_subterranean_cache_desc: "$building_resource_silo_desc$"
 building_cradle_of_rebirth: "Cái nôi Tái sinh"
 building_cradle_of_rebirth_desc: "Cấu trúc này đâm rễ sâu xuống lòng đất, tiêu hóa xác thối và con mồi săn được thành sinh khối, rồi dùng từng nhịp đập âm thầm để tẩm bổ cho cơ thể hành tinh này."
 building_wilderness_storm_relief: "$building_storm_resistant_production$"
 building_wilderness_storm_relief_desc: "Một vòm lá xum xuê kết từ những chiếc lá xơ cứng chứa điện sinh học, không chỉ bảo bọc sự an nguy cho các cá thể cộng sinh quanh nó mà còn phản ứng chớp nhoáng với các trận bão vũ trụ, đảm bảo sinh mạng và năng suất không bị đe dọa."
 building_wilderness_storm_relief_tt: "Hiệu ứng bất lợi từ §Y$default_storm$§! lên năng suất của hành tinh giảm §G25%§!."
 holding_wilderness_glade: "Trảng hoang dã"
 holding_wilderness_glade_plural: "Các Trảng hoang dã"
 holding_wilderness_glade_desc: "Một vạt đất hoang dã trù phú có liên kết mong manh với quần thể cộng sinh mẹ. Dù phải sống bám vào nguồn thức ăn tại chỗ, nhưng các cá thể cộng sinh trong vi sinh cảnh này lại rất sành sỏi trong việc bòn rút các tài nguyên khác từ môi trường quanh đó."
 holding_wilderness_glade_effect_desc: "Nước chư hầu sẽ chuyển hóa [owner.WildernessGladeProvides] thành $r_basic_plural$ cho quốc gia bá chủ.\nQuốc gia bá chủ giúp giảm $mod_planet_jobs_productive_upkeep_mult$ trên các hành tinh của nước chư hầu.\nTạo ra một chướng ngại £blocker£§Y$holding_wilderness_glade$§! trên hành tinh, chiếm lấy một khe khu vực."
 no_free_district_for_wilderness_glade: "$TRIGGER_FAIL$§RTrên hành tinh này không còn dải đất trống nào phù hợp cho vi sinh cảnh của chúng ta.§!"
 blocker_tied_to_wilderness_glade: "$TRIGGER_FAIL$§RChừng nào khu đất §Y$holding_wilderness_glade$§! còn tồn tại, chướng ngại địa hình này vẫn sẽ nằm lỳ ở đó.§!"
 d_wilderness_glade_blocker: "$d_wilderness_root_blocker$"
 d_wilderness_glade_blocker_desc: "Đòi hỏi một hệ thống rễ phát triển mạnh mẽ để chống đỡ cho $holding_wilderness_glade$ gần đó, thì vi sinh cảnh này mới có thể bám trụ trong một môi trường xa lạ."
 holding_wilderness_glade_modifier: "Những Trảng hoang dã Rải rác"
 holding_wilderness_glade_modifier_desc: "Hành tinh chư hầu chung sống chan hòa cùng thế giới của chúng ta, các bên cùng chia sẻ sự sung túc để cùng nhau hưởng lợi."
 holding_wilderness_glade_modifier_tt: "Con số cụ thể sẽ dao động tùy theo số lượng hành tinh chư hầu đang có §Y$holding_wilderness_glade_plural$§! đóng quân."
