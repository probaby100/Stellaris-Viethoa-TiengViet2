l_simp_chinese:
 ####################################
 #Event Chains
 ####################################
 test_chain_title: "Bí ẩn trên [Root.GetName]"
 test_chain_desc: "Chúng ta đã phát hiện ra một số hiện tượng bí ẩn trên [Root.GetName]."
 test_chain_2_title: "Bí ẩn trên [Root.GetName]"
 test_chain_2_desc: "Chúng ta đã phát hiện ra một số hiện tượng bí ẩn trên [Root.GetName]."
 test_counter: "Bộ đếm thử nghiệm"
 migrating_forests_chain_title: "Khu Rừng Di Cư Trên [Root.GetName]"
 migrating_forests_chain_desc: "Khu rừng di cư trên [Root.GetName] sẽ cản trở sự phát triển thuộc địa của chúng ta. Nếu muốn thiết lập thuộc địa trên hành tinh này, chúng ta phải tìm cách giải quyết vấn đề này."
 subterranean_civilization_chain_title: "Nền Văn Minh [Root.owner.GetSubMantleUpper]"
 subterranean_civilization_chain_desc: "Một nền văn minh ngoài hành tinh dưới lòng đất trên [Root.GetName] đang đào đường hầm hướng lên bề mặt thuộc địa của chúng ta. Số lượng cũng như ý đồ của chúng đều là ẩn số, đây có thể là một mối đe dọa lớn đối với thuộc địa của chúng ta."
 abandoned_terraforming_chain_title: "Dự Án Cải Tạo Môi Trường Bị Bỏ Hoang"
 abandoned_terraforming_chain_desc: "Một phần của [Root.GetName] đã từng được một nền văn minh cổ đại cải tạo từ hàng ngàn năm trước, nhưng vì lý do không rõ nào đó, quá trình cải tạo đã bị đình trệ. Kết quả là nơi đây biến thành một hệ thống khí hậu và sinh quyển cực kỳ bất ổn. Chúng ta đã tìm thấy các thiết bị cải tạo môi trường bị bỏ hoang, và phải quyết định xem nên làm gì tiếp theo."
 vultaum_chain_title: "Bậc Tiền Bối - Vultaum"
 vultaum_chain_desc: "Chúng ta đã tìm thấy một số cổ vật thời tiền sử trong cụm sao Vultaum. Vultaum là một nền văn minh ngoài hành tinh hoạt động cách đây khoảng 12 triệu năm. Mặc dù hình dạng chính xác của chủng tộc này đã bị thất lạc trong màn sương mù thời gian, nhưng từ những tàn tích của họ, chúng ta có thể suy đoán rằng họ là động vật đốt hình giun dài khoảng ba đến bốn mét. Có vẻ như họ chủ yếu giao tiếp thông qua sự rung động của các đốt trên cơ thể.\n\nNếu có thể thu thập đủ thông tin từ các tàn tích văn minh của họ, có lẽ chúng ta có thể xác định được vị trí chính xác của hệ sao quê hương họ."
 vultaum_artifacts: "Cổ Vật Vultaum Đã Thu Hồi"
 vultaum_homeworld_chain_title: "Hệ Sao Quê Hương Nền Văn Minh Vultaum"
 vultaum_homeworld_chain_desc: "Chúng ta đã phát hiện ra vị trí hệ sao quê hương của nền văn minh Vultaum. Chúng ta phải nhanh chóng phái tàu khoa học đến khám phá nơi đó trước khi có kẻ khác phát hiện ra bí mật của hệ sao quê hương nền văn minh này!"
 yuht_chain_title: "Bậc Tiền Bối - Yuht"
 yuht_chain_desc: "Chúng ta đã tìm thấy một số cổ vật thời tiền sử đến từ Đế quốc Yuht. Họ là một nền văn minh ngoài hành tinh từng chiếm giữ một phần dải ngân hà vào khoảng sáu triệu năm trước. Về mặt sinh lý, người Yuht là một loại động vật chân đốt rất to và dẹt. Kích thước của một người Yuht trưởng thành có thể dài tới một trăm mét, khiến việc hai hoặc từ ba người Yuht trở lên đi chung một con tàu vũ trụ để du hành liên sao là một chuyện vô cùng hiếm gặp.\n\nNếu có thể tìm thấy thêm nhiều tàn tích văn minh của họ, có lẽ chúng ta có thể xác định được vị trí chính xác của hệ sao quê hương họ."
 yuht_artifacts: "Cổ Vật Yuht Đã Thu Hồi"
 yuht_homeworld_chain_title: "Hệ Sao Quê Hương Yuht"
 yuht_homeworld_chain_desc: "Chúng ta đã phát hiện ra vị trí hệ sao quê hương của nền văn minh Yuht đã thất lạc từ lâu. Chúng ta phải nhanh chóng phái tàu khoa học đến khám phá nơi đó trước khi có kẻ khác phát hiện ra bí mật của hệ sao quê hương nền văn minh này!"
 first_league_chain_title: "Bậc Tiền Bối - Liên Minh Đệ Nhất"
 first_league_chain_desc: "Chúng ta đã tìm thấy một số cổ vật thời tiền sử đến từ Liên Minh Đệ Nhất. Họ là một liên bang vĩ đại gồm các chủng tộc ngoài hành tinh chung sống hòa bình với nhau vào khoảng hai triệu năm trước. Trước khi sụp đổ hoàn toàn, lãnh thổ của Liên Minh Đệ Nhất đã bao trùm một phần rất lớn dải ngân hà.\n\nNếu có thể tìm thấy thêm nhiều tàn tích văn minh của họ, có lẽ chúng ta có thể xác định được vị trí chính xác của hệ sao quê hương họ."
 first_league_artifacts: "Cổ Vật Liên Minh Đệ Nhất Đã Thu Hồi"
 first_league_homeworld_chain_title: "Hệ Sao Thủ Đô Liên Minh Đệ Nhất"
 first_league_homeworld_chain_desc: "Chúng ta đã phát hiện ra vị trí hệ sao thủ đô của Liên Minh Đệ Nhất đã thất lạc từ lâu, Thượng viện vĩ đại của họ nằm ở đó. Chúng ta phải nhanh chóng phái tàu khoa học đến khám phá nơi đó trước khi có kẻ khác phát hiện ra bí mật của nền văn minh này!"
 irassian_chain_title: "Bậc Tiền Bối - Người Irassian"
 irassian_chain_desc: "Chúng ta đã tìm thấy một số cổ vật thời tiền sử đến từ Khối Hiệp Ước Irassian. Họ là một chính quyền liên sao từng thống trị một vùng sao rộng lớn vào khoảng một triệu năm trước. Động vật có vú sáu chi Irassian có hệ miễn dịch vô cùng yếu ớt, khiến chúng rất dễ chết yểu khi đối mặt với các bệnh truyền nhiễm ngoài hành tinh. Nghe nói, người Irassian dường như đã bị tuyệt chủng bởi một trận dịch càn quét toàn cõi có tên là Javorian Pox.\n\nNếu có thể tìm thấy thêm nhiều tàn tích văn minh của họ, có lẽ chúng ta có thể xác định được vị trí chính xác của hệ sao quê hương họ."
 irassian_artifacts: "Cổ Vật Người Irassian Đã Thu Hồi"
 irassian_homeworld_chain_title: "Hệ Sao Quê Hương Người Irassian"
 irassian_homeworld_chain_desc: "Chúng ta đã phát hiện ra vị trí hệ sao quê hương Irassian đã thất lạc từ lâu. Chúng ta phải nhanh chóng phái tàu khoa học đến khám phá nơi đó trước khi có kẻ khác phát hiện ra bí mật của nền văn minh này!"
 cybrex_chain_title: "Bậc Tiền Bối - Cybrex"
 cybrex_chain_desc: "Chúng ta đã tìm thấy một số cổ vật thời tiền sử của nền văn minh Cybrex trên [From.GetName]. Họ là một ý thức tập thể cơ khí từng kiểm soát một phần dải ngân hà vào khoảng 600.000 năm trước. Nguồn gốc cũng như bản chất chính xác của họ đều bị bao phủ bởi bức màn bí ẩn, nhưng được biết nền văn minh này đã phát động một cuộc chiến chống lại toàn thể các nền văn minh sinh vật hữu cơ có trí tuệ. Cuộc chiến này kéo dài suốt nhiều thế kỷ, cướp đi sinh mạng của hàng nghìn tỷ sinh linh.\n\nNếu có thể tìm thấy thêm nhiều tàn tích văn minh của họ, có lẽ chúng ta có thể xác định được vị trí chính xác của hệ sao quê hương họ."
 cybrex_artifacts: "Cổ Vật Cybrex Đã Thu Hồi"
 cybrex_homeworld_chain_title: "Hệ Sao Quê Hương Cybrex"
 cybrex_homeworld_chain_desc: "Chúng ta đã phát hiện ra vị trí hệ sao quê hương Cybrex đã thất lạc từ lâu. Chúng ta phải nhanh chóng phái tàu khoa học đến khám phá nơi đó trước khi có kẻ khác phát hiện ra bí mật của nền văn minh này!"
 sublight_probes_chain_title: "Tàu Thăm Dò Cận Tốc Độ Ánh Sáng"
 sublight_probes_chain_desc: "Từ rất lâu trước khi làm chủ được công nghệ du hành siêu tốc độ ánh sáng, chúng ta đã phóng một số tàu thăm dò cận tốc độ ánh sáng từ [Root.Capital.GetName] đến các hệ sao lân cận. Chúng ta phải thu hồi chúng trước khi chúng rơi vào tay kẻ thù."
 probes_recovered: "Tàu Thăm Dò Đã Thu Hồi"
 survey_habitable_worlds_chain_title: "Khảo Sát Hành Tinh Có Thể Sinh Sống Được"
 survey_habitable_worlds_chain_desc: "Các nhà sinh vật học ngoài hành tinh của chúng ta đang hối thúc chúng ta tiến hành khảo sát tất cả các hành tinh được phát hiện có tồn tại sinh quyển. Họ khao khát được tìm hiểu sâu hơn về các hệ sinh thái ngoài hành tinh đa dạng trong dải ngân hà."
 habitable_worlds_surveyed: "Khảo Sát Hành Tinh Có Thể Sinh Sống Được Hoàn Tất"
 specimen_procurement_chain_title: "Thu Thập Sinh Vật Ngoài Hành Tinh"
 specimen_procurement_chain_desc: "Bảo tàng sinh vật ngoài không gian trên [Root.Capital.GetName] đã gửi một yêu cầu, họ muốn xin hỗ trợ thu thập một số dạng sống ngoài hành tinh quý hiếm đã được xác định trên các hành tinh khác nhau."
 specimens_collected: "Sinh Vật Đã Thu Thập"
 radical_cult_title: "[radical_cult.GetName]"
 radical_cult_desc: "Tổ chức cực đoan tự xưng là "[radical_cult.GetName]" đang âm mưu lật đổ chúng ta trong bóng tối, đầu độc người dân tin vào những giáo lý vặn vẹo của chúng. Bọn chúng đã rèn binh mãi mã trên [Root.Capital.GetName] suốt nhiều thế kỷ, hiện tại thủ lĩnh của chúng đã chạy trốn ra ngoài không gian, để tiếp tục tiến hành các chiến dịch chống lại chúng ta."
 survey_home_system_title: "Khảo Sát Hệ Sao Quê Hương"
 survey_home_system_desc: "Trước khi khởi hành khám phá dải ngân hà, chúng ta phải tiến hành khảo sát toàn diện hệ sao [home_system.GetName]. Chúng ta phải hiểu rõ "sân sau" của chính mình."
 establish_colony_title: "Thiết Lập Thuộc Địa Đầu Tiên"
 establish_colony_desc: "Để đảm bảo cho sự sinh tồn lâu dài, giống loài [This.GetSpeciesName] cần phải mở rộng ra ngoài [This.Capital.GetName]. Hãy thiết lập thuộc địa đầu tiên của chúng ta, và cắm lá cờ của [This.GetName] lên bề mặt hành tinh xa lạ."
 first_colony: "Thuộc Địa Đầu Tiên Đã Được Thiết Lập"
 asteroid_sighted_chain_title: "Phát Hiện Tiểu Hành Tinh"
 asteroid_sighted_chain_desc: "Phát hiện một tiểu hành tinh có kích thước khổng lồ nằm trên quỹ đạo va chạm với [Root.GetName]. Bắt buộc phải phá hủy nó trước khi nó đâm xuống mặt đất!"
 asteroid_destroyed: "Tiểu Hành Tinh Đã Bị Phá Hủy"
 coming_storm_chain_title: "Cơn Bão Đang Chờ Đón"
 coming_storm_chain_desc: "Chúng ta đã dò thấy một nhóm tín hiệu không gian phụ bí ẩn có vectơ tiếp cận dải ngân hà của chúng ta. Có vẻ như sắp có khách tới thăm rồi..."
 prethoryn_scourge_chain_title: "Tai Ương Prethoryn"
 prethoryn_scourge_chain_desc: "Dải ngân hà của chúng ta đã bị xâm lược bởi một bầy sinh vật liên sao tham lam, chúng rắp tâm nuốt chửng mọi dạng sống mà chúng bắt gặp. Bắt buộc phải tiêu diệt những kẻ xâm lược Prethoryn này trước khi số lượng của chúng vượt qua chúng ta."
 extradimensional_invasion_chain_title: "Kẻ Xé Rách Không Gian"
 extradimensional_invasion_chain_desc: "Trong dải ngân hà của chúng ta đã xuất hiện những vết rách kết cấu không gian khổng lồ, đóng vai trò như những cánh cổng một chiều kết nối với các chiều không gian khác. Những con tàu hư thể kỳ lạ ùa ra từ đó, chúng sẽ hút cạn năng lượng từ mọi vật thể mà chúng gặp trên đường đi, cho tới khi vật thể xấu số đó cạn kiệt năng lượng hoàn toàn."
 star_power_chain_title: "Hiện Tượng Dị Thường Từ Ngôi Sao"
 star_power_chain_desc: "Tìm kiếm các chỉ số bức xạ bất thường."
 hunting_hyacinth_title: "Truy Tìm Tàu Hyacinth"
 hunting_hyacinth_desc: "Tàu Ark đã đưa tổ tiên chúng ta đến hệ sao [Root.Capital.GetName] này, còn tàu Hyacinth chính là con tàu chị em của nó. Một thế kỷ trước, con tàu Hyacinth xuất phát từ Trái Đất đáng lẽ đã phải theo gót chúng ta đến được đây. Bây giờ chúng ta bắt buộc phải làm rõ xem rốt cuộc chuyện gì đã xảy ra với nó."
 nomads_observation_chain_title: "Tàu Vũ Trụ Bất Thường"
 nomads_observation_chain_desc: "Đã phát hiện sự xuất hiện của những người ngoài hành tinh kỳ lạ trong lãnh thổ của chúng ta, nhưng chúng ta không thể thiết lập được kênh liên lạc với họ. Hơn nữa do không thể dịch được ngôn ngữ của họ, nên hiện tại chúng ta chỉ đành án binh bất động."
 shrouded_ship_chain_title: "Lạc Lối Trong Hư Không"
 shrouded_ship_chain_desc: "Một trong những con tàu của chúng ta đã đi lạc vào Cõi Màn Sương."
 ####################################
 #Điểm Quan Tâm
 ####################################
 hijacked_cult_fleet_poi: "Hạm Đội Tà Giáo"
 hijacked_cult_fleet_poi_desc: "Những tín đồ tà giáo đã rắp tâm chế tạo một hạm đội nhỏ tại một cơ sở bí mật trên [Root.Capital.GetName]. Sau khi bị chúng ta phát hiện, bọn chúng đã lái những con tàu đó bỏ trốn về hướng [hijacked_fleet_planet.GetName]. Bắt buộc phải tiêu diệt bọn chúng trước khi chúng gây ra tổn thất lớn hơn!"
 cultist_search_1_poi: "Tìm kiếm [cultists_1.GetName]"
 cultist_search_1_poi_desc: "Chúng ta đã dò thấy vệt ion của con tàu tà giáo đang bỏ trốn gần hệ sao này. Tốt nhất là nên tiến hành tìm kiếm trên diện rộng."
 cultist_search_2_poi: "Tìm kiếm [cultists_2.GetName]"
 cultist_search_3_poi: "Tìm kiếm [cultists_3.GetName]"
 cultist_shipyard_poi: "Phá Hủy Xưởng Tàu Tà Giáo"
 cultist_shipyard_poi_desc: "Cuối cùng chúng ta cũng đã tìm ra nguồn gốc các con tàu của bọn tà giáo - bọn chúng đã ngang nhiên chiếm đoạt một xưởng tàu ngoài hành tinh cổ đại trên [cult_planet.GetStarName]! Bắt buộc phải phá hủy cơ sở không gian này trước khi bọn cực đoan đó có cơ hội khởi động toàn bộ công suất sản xuất."
 cultist_flagship_poi: "Tìm Kiếm Soái Hạm Tà Giáo"
 cultist_flagship_poi_desc: "Nghe nói chiếc soái hạm tà giáo thoắt ẩn thoắt hiện đang lảng vảng gần khu vực hệ sao này. Chúng ta phải phái hạm đội vũ trang hạng nặng đến để đối phó."
 probe_search_1_poi: "Tìm kiếm [probe_system_1.GetName]"
 probe_search_1_poi_desc: "Dựa theo quỹ đạo tách rời và thời gian rời khỏi hệ sao quê hương, một trong những tàu thăm dò cận tốc độ ánh sáng bị thất lạc hẳn là đang ở đâu đó trong hệ sao này."
 probe_search_2_poi: "Tìm kiếm [probe_system_2.GetName]"
 probe_search_3_poi: "Tìm kiếm [probe_system_3.GetName]"
 probe_search_4_poi: "Tìm kiếm [probe_system_4.GetName]"
 probe_ion_trail_poi: "Lần Theo Vệt Ion"
 probe_ion_trail_poi_desc: "Vệt ion của một trong những tàu thăm dò cận tốc độ ánh sáng bị thất lạc đang chỉ về hệ sao này."
 probe_subspace_anomaly_poi: "Bị Kẻ Thù Chặn Đầu"
 probe_subspace_anomaly_poi_desc: "Kẻ thù đang ra sức ngăn cản chúng ta tiếp cận tàu thăm dò không gian phụ của hệ sao này."
 coming_storm_poi_1_poi: "Lỗ Hổng"
 coming_storm_poi_1_poi_desc: "Dựa vào vectơ mục tiêu hiện tại, thực thể không gian phụ đang tiến đến kia sẽ xông vào dải ngân hà của chúng ta ở khu vực gần những hệ sao này."
 systems_visited_poi: "Hệ Sao Đã Ghé Thăm"
 hunting_hyacinth_poi: "Khảo Sát Hệ Sao"
 hunting_hyacinth_poi_desc: "Để tìm ra tung tích của tàu Hyacinth, chúng ta bắt buộc phải khảo sát kỹ lưỡng những hệ sao này. Động cơ nguyên thủy của tàu Ark đáng lý phải lưu lại vệt ion mới đúng."
 hunting_hyacinth_2_poi: "Khảo Sát Hệ Sao"
 hunting_hyacinth_2_poi_desc: "Vệt ion của tàu Hyacinth chỉ về hệ sao này. Chúng ta phải nhanh chóng tiến hành khảo sát."
 extradimensional_invasion_1_poi: "Cổng Dịch Chuyển Dị Thứ Nguyên"
 extradimensional_invasion_1_poi_desc: "Phát hiện quân xâm lược dị thứ nguyên đang liên tục tuôn ra từ một cánh cổng dịch chuyển tại hệ sao [extradimensional_system.GetName]. Nếu không phá hủy cánh cổng này, bọn chúng sẽ không ngừng gửi viện binh đến."
 extradimensional_invasion_2_poi: "Cổng Dịch Chuyển Thứ Hai"
 extradimensional_invasion_2_poi_desc: "Cánh cổng dịch chuyển không gian thứ hai đã xuất hiện tại hệ sao [second_portal_system.GetName]. Giống như cái thứ nhất, tàu chiến của đám thực thể dị thứ nguyên thù địch đang lũ lượt tràn vào dải ngân hà của chúng ta từ trong đó."
 extradimensional_invasion_3_poi: "Cổng Dịch Chuyển Thứ Ba"
 extradimensional_invasion_3_poi_desc: "Phát hiện cánh cổng dịch chuyển thứ ba tại hệ sao [third_portal_system.GetName]. Nó hiện đang không ngừng dịch chuyển tàu chiến của đám dị thứ nguyên vào không gian thế giới của chúng ta."
 vultaum_1_poi: "Vultaumar"
 vultaum_1_poi_desc: "Chúng ta đã xác định được tọa độ hệ sao quê hương Vultaum."
 yuht_1_poi: "Yuht'aan"
 yuht_1_poi_desc: "Tọa độ hành tinh mẹ cổ đại của tộc Yuht cuối cùng đã được xác định."
 first_league_1_poi: "Vũng Lầy Fen Habbanis"
 first_league_1_poi_desc: "Hệ sao Vũng Lầy Fen Habbanis là trung tâm hành chính và trung tâm kinh tế của Liên Minh Đệ Nhất cổ đại."
 irassian_1_poi: "Irass"
 irassian_1_poi_desc: "Hệ sao Irass là trung tâm cốt lõi của Khối Hiệp Ước Irassian cổ đại."
 cybrex_1_poi: "Cybrex Alpha"
 cybrex_1_poi_desc: "Tộc Cybrex dường như đã rút lui đến hệ sao này vào phút cuối."
 nomad_poi_1: "Theo Dõi Vị Trí"
 nomad_poi_1_desc: "Tàu bay khả nghi đã neo đậu tại địa điểm này. Mọi nỗ lực liên lạc mà chúng ta khởi xướng đều không nhận được phản hồi từ bọn họ, hiện tại chúng ta chỉ đành án binh bất động, xem tiếp theo sẽ xảy ra chuyện gì."
 extradimensional_invasion_4_poi: "Mỏ Neo Không Gian"
 extradimensional_invasion_4_poi_desc: "Quân xâm lược đang hì hục xây dựng một loại trạm không gian cỡ lớn nào đó, dùng làm "Mỏ neo không gian" - với những "con đường" này, chúng có thể nâng cao khả năng cho phi thuyền của mình chui qua lỗ sâu. Càng có nhiều Mỏ neo không gian, số lần chúng nhận được chi viện từ chiều không gian gốc sẽ càng nhiều.\n\nNhững Mỏ neo không gian này dường như còn có tác dụng cường hóa hữu hiệu cường độ không gian phụ của Cổng dịch chuyển dị thứ nguyên. Chừng nào Mỏ neo không gian vẫn còn tồn tại, vũ khí của chúng ta sẽ không thể nào gây ra sát thương cho Cổng dịch chuyển dị thứ nguyên!"
 extradimensional_invasion_chain_2_title: "Kẻ Lầm Đường Lạc Lối"
 extradimensional_invasion_chain_2_desc: "Một phe phái xâm lược dị thứ nguyên thứ hai đã bắt đầu ló mặt ở dải ngân hà của chúng ta, khao khát tấn công của bọn chúng cũng không hề thua kém gì làn sóng trước. May mắn thay, hai đạo quân dị thứ nguyên này dường như cũng đang choảng nhau."
 extradimensional_invasion_chain_3_title: "Kẻ Cuồng Tín"
 extradimensional_invasion_chain_3_desc: "Đạo quân dị thứ nguyên phe phái số ba đến từ một lỗ sâu khác đã xuất hiện. Bọn chúng cũng rắp tâm nuốt chửng mọi sinh vật trong dải ngân hà này, nhưng hiện tại đã sa vào trận chiến khốc liệt với hai làn sóng xâm lược trước đó."
 precursor_activity: "Dấu Hiệu Hoạt Động Của Bậc Tiền Bối"
 new_precursor.1_poi: "Báo Cáo Hoạt Động Của Bậc Tiền Bối"
 new_precursor.1_poi_desc: "Chúng ta được biết, tại những tọa độ này có thể có di vật hoặc thông tin quan trọng do nền văn minh tiền bối để lại."
 new_precursor_anomaly: "Đã phát hiện một hiện tượng dị thường mới liên quan đến các bậc tiền bối tại §L[precursor_planet.GetName]§!."
