 refugees.1.name: "Người Tị Nạn [Root.GetSpeciesName] Đã Đến"
 refugees.1.desc.1: "Một nhóm nhỏ tàu dân sự từ §Y[RefugeeEscapedFrom.GetName]§! đã đến biên giới của chúng ta, chở đầy người tị nạn §Y[Root.GetSpeciesName]§!. Họ đã được phép định cư trên §H[Root.Planet.GetName]§!.\n\nNhững người lưu vong khốn khổ này đã bị đế chế [RefugeeEscapedFrom.GetSpeciesName] đuổi khỏi quê hương. Kể từ đó, họ phải lang bạt khắp nơi, liều mạng tìm kiếm một bến đỗ mới trước khi cạn kiệt nhu yếu phẩm."
 refugees.1.desc.2: "Một nhóm nhỏ tàu dân sự tàn tạ từ §Y[RefugeeEscapedFrom.GetName]§! đã tiến vào lãnh thổ của chúng ta, chở đầy người tị nạn §Y[Root.GetSpeciesNamePlural]§!. Sau khi được chúng ta cung cấp thức ăn và chăm sóc y tế, những người này đã được phép định cư trên §H[Root.Planet.GetName]§!.\n\nNhững người tị nạn hoảng loạn và tiều tụy này là những người sống sót trốn thoát khỏi cuộc thanh trừng của đế chế [RefugeeEscapedFrom.GetSpeciesName]. Họ thoát được là nhờ mạng lưới ngầm được tập hợp khẩn cấp cùng những thuyền trưởng tàu buôn giàu lòng thương cảm."
 refugees.1.desc.2.b: "Một hạm đội tàu dân sự tàn tạ, chở đầy người §Y[Root.GetSpeciesNamePlural]§! tháo chạy khỏi §Y[RefugeeEscapedFrom.GetName]§!, đã đến được lãnh thổ của chúng ta. Sau khi được chúng ta cung cấp thức ăn và chăm sóc y tế, những người tị nạn này đã được phép định cư trên §H[Root.Planet.GetName]§!.\n\nNhững người tị nạn hoảng loạn và tiều tụy này là những người sống sót sau cuộc tấn công tàn nhẫn của [RefugeeEscapedFrom.GetSpeciesAdj]. Họ thoát được nhờ liều mạng đánh cắp vài con tàu vũ trụ bỏ đi từ một bến cảng quân sự cũ trên hành tinh."
 refugees.1.desc.3: "Một hạm đội dân sự nhỏ mang đầy thương tích, chở theo những người §Y[Root.GetSpeciesNamePlural]§! tháo chạy khỏi §Y[RefugeeEscapedFrom.GetName]§!, vừa mới đến hệ sao của chúng ta. Sau khi chúng ta cung cấp thức ăn và cứu trợ y tế, họ đã được phép định cư trên §H[Root.Planet.GetName]§!.\n\nNhững người tị nạn rách rưới và bàng hoàng này đang chạy trốn khỏi sự tàn phá của §H[RefugeeEscapedCrisis.GetName]§! trong hệ sao [RefugeeEscapedFrom.GetSpeciesName]. Họ tháo chạy trong gang tấc ngay trước khi lực lượng [RefugeeEscapedCrisis.GetSpeciesAdj] ập đến thế giới quê hương §H[RefugeeEscapedPlanet.GetName]§! của họ, đành bỏ lại phần lớn tài sản trên hành tinh cam chịu diệt vong ấy."
 refugees.1.a: "Chúng ta chào đón họ."
