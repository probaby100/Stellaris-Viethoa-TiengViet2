 pm_rural_privilege_regular: "Đặc Quyền Nông Thôn"
 pm_rural_privilege_regular_desc: "Việc đứng về phía nông thôn trong các cuộc tranh chấp khu vực khiến cho vùng thành thị cảm thấy vô cùng bất an."
 pm_rural_privilege_broken_shackles: "$pm_rural_privilege_regular$"
 pm_rural_privilege_broken_shackles_desc: "$pm_rural_privilege_regular_desc$"
 pm_peacekeeper_deployment: "Triển Khai Gìn Giữ Hòa Bình"
 pm_peacekeeper_deployment_desc: "Đã điều động thêm lực lượng gìn giữ hòa bình để giải quyết cuộc tranh chấp khu vực này."
 bacterial_drive_modifier_desc: "Việc bổ sung vi khuẩn biến đổi gen vào nguồn nước cấp đã khơi dậy khát vọng phi thường trong cộng đồng về một mục tiêu chung."
 pm_bd_reproduction: "Động Lực Vi Khuẩn: Sinh Sản"
 pm_bd_reproduction_desc: "$bacterial_drive_modifier_desc$"
 pm_bd_strength: "Động Lực Vi Khuẩn: Sức Mạnh"
 pm_bd_strength_desc: "$bacterial_drive_modifier_desc$"
 pm_bd_creativity: "Động Lực Vi Khuẩn: Sáng Tạo"
 pm_bd_creativity_desc: "$bacterial_drive_modifier_desc$"
 ladder_wars_pre_ftl: "Di Chứng Đại Chiến Thang Trời"
 ladder_wars_pre_ftl_desc: "Khi thế giới bị tàn phá bởi chiến tranh này bắt đầu tái thiết, chứng hoang tưởng ngày càng tồi tệ của họ khiến cho việc tương tác với những người khác trở thành một thách thức cho cả hai bên."
 living_metal_mega_construction_insight: "Thông Hiểu Siêu Cấu Trúc Kim Loại Sống"
 living_metal_mega_construction_insight_desc: "Cổ vật Kim Loại Sống mà chúng ta thu hồi được đã mang lại những hiểu biết đáng kinh ngạc về sự phát triển của các Công trình Siêu Cấu Trúc."
 living_metal_mega_construction_insight_ct: "Chi phí cơ bản của Sắc Lệnh Siêu Cấu Trúc Kim Loại Sống: §G-50%§!"
 d_coagulated_landscape: "Cảnh Quan Đông Đặc"
 d_coagulated_landscape_desc: "Một chất lỏng nhớt phun trào từ bề mặt hành tinh, đông đặc lại thành một loại vật chất nguy hiểm và gần như không thể xuyên thủng. Điều này khiến cho không gian xây dựng an toàn còn lại rất ít."
 d_shimmering_structure: "Kiến Trúc Nhấp Nháy"
 d_shimmering_structure_desc: "Một tòa nhà khổng lồ sáng lấp lánh với nguồn gốc chưa xác định."
 d_geothermal_hotspot: "Điểm Nóng Địa Nhiệt"
 d_geothermal_hotspot_desc: "Hành tinh này sở hữu một điểm nóng địa nhiệt tuyệt vời, cung cấp năng lượng cũng như các cơ hội nghiên cứu."
 d_ancient_cloaking_array: "Mảng Tàng Hình Cổ Đại"
 d_ancient_cloaking_array_desc: "Thuộc địa đã được hỗ trợ bởi các mảng tàng hình cổ đại của người ngoài hành tinh. Kẻ thù rất khó tấn công, giúp thuộc địa cảm thấy an toàn hơn."
 d_psionic_sands: "Cát Ngoại Cảm"
 d_psionic_sands_desc: "Cát trên hành tinh này có chứa nồng độ Zro cao ở khắp mọi nơi. Thậm chí có thể giao tiếp với nó."
 d_mountains_of_steel: "Dãy Núi Thép"
 d_mountains_of_steel_desc: "Được rèn trong sức nóng khắc nghiệt của quá trình cải tạo môi trường, những dãy núi khổng lồ và cứng cáp này là những mỏ tài nguyên dồi dào."
 d_lava_tubes: "Đường Ống Dung Nham"
 d_lava_tubes_desc: "Dòng chảy magma đã tạo ra những đường hầm sâu chứa các quặng giàu ở đây. Có nhiều cơ hội khai thác béo bở bên trong các đường ống nhiệt độ cao này."
 d_lava_tubes_ct: "Phí duy trì £energy£ cho Công việc [miner.GetIcon] [miner.GetName] của $t$: §R+$@lava_tubes_mining_job_upkeep$§!"
 d_lava_tubes_ct_short: "Phí duy trì £energy£ §R+$@lava_tubes_mining_job_upkeep$§! cho Công việc [miner.GetIcon] [miner.GetName]"
 d_hydroactive_eggs: "Trứng Nở Khi Gặp Nước"
 d_hydroactive_eggs_desc: "Môi trường tự nhiên ở đây có nguồn nước dồi dào dễ dàng tiếp cận, khiến cho tỷ lệ sinh sản của hệ động vật địa phương rất cao."
 d_explosive_atmosphere: "Bầu Khí Quyển Gây Nổ"
 d_explosive_atmosphere_desc: "Nồng độ vi hạt gây nổ cao trong không khí khiến bầu khí quyển của hành tinh này cực kỳ dễ cháy."
 d_explosive_atmosphere_ct: "£volatile_motes£ §Y$volatile_motes$§! sản xuất bởi [mote_harvester.GetIcon] $mote_harvester$ của $t$: §G+50%§!"
 d_explosive_atmosphere_ct_short: "§G+50%§! £volatile_motes£ §Y$volatile_motes$§! sản xuất bởi Công việc [mote_harvester.GetIcon] $mote_harvester$"
 d_blue_lava: "Dung Nham Xanh"
 d_blue_lava_desc: "Việc cải tạo môi trường đã gây ra phản ứng giữa các mỏ khí đốt và hợp kim phong phú nằm sâu trong hành tinh, để lại một lớp dung nham màu xanh rực rỡ quyến rũ trên bề mặt hành tinh."
 d_crystaline_growths: "Khóm Tinh Thể"
 d_crystaline_growths_desc: "Hành tinh này có một lượng lớn tinh thể đang phát triển, có thể được khai thác và sử dụng."
 d_bogplants: "Thực Vật Đầm Lầy"
 d_bogplants_desc: "Loài thực vật độc đáo này sinh sống trong các đầm lầy siêu axit, chúng sẽ tiết ra Khí Ngoại Lai sau khi ăn."
 d_liquid_dark_matter: "Vật Chất Tối Dạng Lỏng"
 d_liquid_dark_matter_desc: "Một mạch nước phun kỳ lạ đã sụp đổ và biến thành một vũng Vật Chất Tối dạng lỏng."
 d_space_junk_hazards: "Hiểm Họa Rác Không Gian"
 d_space_junk_hazards_desc: "Rác không gian trên quỹ đạo gây nguy hiểm cho tàu con thoi đi qua, nếu rơi vào bầu khí quyển của hành tinh, chúng còn đe dọa đến các tòa nhà trên mặt đất."
 trait_inner_darkness: "Bóng Tối Nội Tại"
 trait_inner_darkness_desc: "Lượng Vật Chất Tối bão hòa đã cường hóa cơ thể họ, giờ đây cứ cách một khoảng thời gian họ sẽ thải ra một lượng vi mô các hạt phi baryon, nhưng tuổi thọ của họ sẽ cạn kiệt nhanh hơn."
 trait_inner_darkness_tt: "£sr_dark_matter£ $produced_per_pop_group_unit$ £pop£ Pop: §G+$@inner_darkness_dark_matter_production$§!"
 trait_geleboric_mutations: "Đột Biến Gelebor"
 trait_geleboric_mutations_desc: "Phản ứng không may từ cuộc thử nghiệm đã làm thay đổi mạnh mẽ các đặc điểm sinh lý của loài này."
 trait_psionic_ephapse: "Khớp Thần Kinh Psionic"
 trait_psionic_ephapse_desc: "Sau khi tiếp xúc lâu dài với vi khuẩn điều chỉnh ý thức, hệ tiêu hóa của sinh vật đã sản sinh ra các lợi khuẩn tâm linh thúc đẩy giao tiếp ngoại cảm giữa các cá thể."
 trait_psionic_ephapse_modifier_tooltip: "Nếu chủng tộc có đặc điểm §Y$trait_psionic$§! hoặc §Y$trait_latent_psionic$§!:\n$bureaucrat_jobs_bonus_workforce_mult$: §G+5%§!\n$researcher_jobs_bonus_workforce_mult$: §G+5%§!"
