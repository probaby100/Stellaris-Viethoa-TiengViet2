l_simp_chinese:
 ## THẾ GIỚI ĐANG RỈ MÁU
 strange_worlds.1.name: "Hành Tinh Rỉ Máu"
 strange_worlds.1.desc: "Bề mặt của §Y[Root.GetName]§! đang có những phản ứng chưa từng thấy đối với các hoạt động xây dựng của chúng ta. Một chất nhầy không xác định bắt đầu rỉ ra từ nền móng của các cơ sở quan trọng.\n\nChất dịch này là một chất lỏng màu đỏ thẫm, dạng keo và rất dính khi chạm vào.\n\nCác [Owner.GetScientistPlural] của chúng ta rất nóng lòng muốn nghiên cứu thêm về hiện tượng xả thải này. Mặc dù hiện tại nó chỉ gây ra chút bất tiện, nhưng để đảm bảo an toàn cho các [Owner.GetColonistPlural], tốt nhất là nên cẩn trọng."
 strange_worlds.5.name: "Rỉ Máu Diện Rộng"
 strange_worlds.5.desc: "§Y[Root.GetName]§! vừa báo cáo những diễn biến mới đáng lo ngại về loại chất nhầy màu đỏ tươi bí ẩn.\n\nChất này đang trở nên khó kiểm soát, trào ra với tốc độ nhanh hơn tại các khu vực bị ảnh hưởng.\n\nTuy nhiên, chất nhầy này không phải là vô dụng. Khi đông đặc lại, đặc tính kết dính của nó trở nên rõ rệt, tạo thành một loại xi măng tự nhiên rất hữu ích, giúp bổ sung hiệu quả cho tiến độ xây dựng của chúng ta.\n\nĐáng lo ngại là chất này gần như không thể tẩy sạch khỏi bất kỳ [Owner.GetColonistPlural] nào chạm vào nó. Nỗ lực điều trị và nghiên cứu những công nhân bị ảnh hưởng sẽ giúp chúng ta thu thập thêm thông tin, nhưng sẽ làm chậm tiến độ xây dựng."
 strange_worlds.5.a: "Điều trị và nghiên cứu những người nhiễm chất nhầy."
 strange_worlds.5.b: "Tiếp tục xây dựng."
 strange_worlds.15.name: "Núi Máu"
 strange_worlds.15.desc: "Tiến độ xây dựng trên §Y[Root.GetName]§! đang diễn ra thuận lợi đến mức bất thường, nhưng sự xuất hiện của chất nhầy đó không còn giới hạn ở nền móng các cơ sở của chúng ta nữa.\n\nNhiều vết nứt rỉ dịch đã được phát hiện. Ban đầu, chỉ những vật thể ngoại lai trên [Root.GetName] mới bị ảnh hưởng bởi chất này, nhưng giờ đây nó đang lan rộng không phân biệt.\n\nChất này hiện đã nuốt chửng phần lớn bề mặt của [Root.GetName] và nhanh chóng đông lại thành những lớp khoáng chất dày đặc, bao bọc lấy [Root.GetName].\n\nSau nhiều lần thử nghiệm thất bại và phải trả giá đắt, các kỹ sư của chúng ta đã tìm ra cách giảm thiểu thiệt hại thêm và thu thập hiệu quả chất này. Tuy nhiên, điều này chỉ có thể thực hiện được bằng cách nhượng lại những vùng đất rộng lớn cho loại chất nhầy này."
 strange_worlds.15.a: "Một diễn biến thú vị."
 strange_worlds.20.name: "Ký Sinh Trùng"
 strange_worlds.20.desc: "Sau quá trình nghiên cứu chuyên sâu và điều trị cho các công nhân bị ảnh hưởng trên §Y[Root.GetName]§!, các nhà khoa học của chúng ta đã phân lập thành công nguồn gốc của vấn đề.\n\nMặc dù bề ngoài trông giống như một dạng gel dính, nhưng thực chất đây là một quần thể vi sinh vật ký sinh có mối quan hệ cộng sinh với hành tinh này. Những ký sinh trùng này phân hủy chất hữu cơ dưới lớp vỏ của [Root.GetName] và tái chế chúng thành vật chất mới.\n\nCác hoạt động khai phá trên [Root.GetName] đã phá vỡ vòng đời tự nhiên của chúng, khiến chúng phản ứng với những vật chất lạ mà chúng ta đưa vào hệ sinh thái của chúng.\n\nNhóm nghiên cứu của chúng ta tin rằng, theo thời gian, chúng ta có thể tìm ra cách chung sống hòa bình với những sinh vật này và tích hợp các đặc tính sinh học độc đáo của chúng vào quy trình sản xuất trên [Root.GetName]."
 strange_worlds.20.a: "Thật hấp dẫn, hãy tiếp tục."
 strange_worlds.25.name: "Mối Quan Hệ Có Lợi"
 strange_worlds.25.desc: "Qua các nghiên cứu sâu rộng, các nhà khoa học của chúng ta đã can thiệp gen thành công vào các vi sinh vật ký sinh trên §Y[Root.GetName]§!. Đột biến này nhằm mục đích làm cho chúng nhận diện vật liệu của chúng ta như một sự bổ sung vô hại đối với hệ sinh thái tự nhiên, cho phép chúng ta tiếp tục xây dựng mà không gặp thêm trở ngại nào.\n\nSau khi đưa những ký sinh trùng biến đổi gen này vào sinh quyển hành tinh, chúng đã hòa nhập thành công.\n\nHơn nữa, bằng cách tận dụng lại hiệu ứng phân hủy vốn có của vi sinh vật, chúng ta đã khai thác thành công đặc tính kết dính của vật chất này để nâng cao năng suất của hành tinh."
 strange_worlds.25.a.evopred: "Chúng có thể dạy ta điều gì?"
 strange_worlds.30.name: "Xuất Hiện Từ Hư Vô"
 strange_worlds.30.desc: "Khi đang dọn dẹp mặt bằng để chuẩn bị mở rộng khu vực trên §Y[Root.GetName]§!, một cấu trúc khổng lồ bỗng nhiên xuất hiện như từ hư không.\n\nCấu trúc này phát ra những làn sóng năng lượng cực kỳ bất ổn, khiến hình dạng của nó lúc ẩn lúc hiện, đó là lý do vì sao chúng ta không phát hiện ra tòa nhà này trong các cuộc quét sơ bộ khu vực.\n\nKhi nó hiện hình, có thể thấy các bức tường bên ngoài được bịt kín và trang trí bằng những biểu tượng khó hiểu, không khớp với bất kỳ ngôn ngữ nào trong cơ sở dữ liệu của chúng ta.\n\nChức năng của nó vẫn chưa được làm rõ. Cho đến nay, công trình này chưa gây ra bất kỳ nguy hại nào, nhưng nó chắc chắn đang cản trở công việc phát triển của chúng ta."
 strange_worlds.30.a: "Hãy điều tra xem."
 strange_worlds.35.name: "Dị Thường Thị Giác"
 strange_worlds.35.desc.no_cloak: "Sau khi phân tích tòa nhà nhấp nháy trên §Y[Root.GetName]§!, chúng ta tin rằng vật thể này bằng cách nào đó có thể bẻ cong ánh sáng.$strange_worlds.35.desc.common_1$Mặc dù hiểu biết của chúng ta về bản chất của cấu trúc này đang dần sâu sắc hơn, nhưng vẫn chưa thể tiến vào bên trong - nếu quả thực có thể vào được.$strange_worlds.35.desc.common_2$"
 strange_worlds.35.desc.cloak: "Sau khi phân tích tòa nhà nhấp nháy trên §Y[Root.GetName]§!, chúng ta tin chắc rằng vật thể này có khả năng tàng hình ngắt quãng.$strange_worlds.35.desc.common_1$Mặc dù hiểu biết của chúng ta về bản chất của cấu trúc này đang dần sâu sắc hơn, nhưng vẫn chưa thể tiến vào bên trong - nếu quả thực có thể vào được.$strange_worlds.35.desc.common_2$"
 strange_worlds.35.desc.common_1: "\n\nMột hoạt động địa nhiệt bất thường đã được phát hiện trong lớp phủ silicat bên dưới. Nguồn năng lượng mạnh mẽ này cung cấp sức mạnh cho công trình đơn độc này, nhưng mức năng lượng của nó dao động rất lớn.\n\n"
 strange_worlds.35.desc.common_2: "\n\nBức tường bên ngoài được bịt kín của nó được làm từ một loại vật liệu có độ phản ứng cao chưa xác định. Cố gắng cưỡng ép vào tòa nhà sẽ chỉ làm cho từ trường của nó thêm bất ổn. Chúng ta có thể cố gắng cắt một lối đi để vào nghiên cứu, nhưng nguy cơ mất ổn định khó lường là rất lớn."
 strange_worlds.35.a: "Dùng vũ lực."
 strange_worlds.35.b: "Tiếp tục nghiên cứu bên ngoài."
 strange_worlds.40.name: "Phản Ứng Mất Kiểm Soát"
 strange_worlds.40.desc: "Nỗ lực dùng vũ lực để xâm nhập vào công trình trên §Y[Root.GetName]§! đã dẫn đến thảm họa. Thiết bị của chúng ta đã làm mất ổn định thêm các mô hình năng lượng của tòa nhà, gây ra một loạt vụ nổ dữ dội. Giờ đây, nó chỉ còn là một đống tro tàn.\n\nSự phá hủy ngoài ý muốn của nó lại mang đến một kết quả bất ngờ. Trong thung lũng gần đó, tàn tích của một khu định cư ngoài hành tinh bị bỏ hoang từ lâu bỗng lộ diện.\n\nCó vẻ như vật thể này bằng cách nào đó đã tạo ra một trường tàng hình mạnh mẽ bao trùm thuộc địa cũ; mục đích là để trốn tránh điều gì thì vẫn còn là một bí ẩn, nhưng chắc chắn một điều là, bất kể họ đã nỗ lực ra sao, nơi này giờ đây chỉ còn là sự im lặng chết chóc. Không một món đồ khảo cổ nào còn nguyên vẹn.\n\nCơ chế hoạt động chính xác của công nghệ bất thường này vẫn là một ẩn số đối với chúng ta, nhưng chúng ta cũng đã thu được một vài kiến thức mới từ trải nghiệm này. Chúng ta sẽ tái sử dụng nguồn năng lượng địa nhiệt mạnh mẽ này để phục vụ cho thuộc địa của mình."
 strange_worlds.40.a: "Một khám phá có giá trị."
 strange_worlds.40.a_ct: "Đã xóa bỏ chướng ngại vật §YKiến Trúc Nhấp Nháy§!"
 strange_worlds.45.name: "Phòng Chỉ Huy"
 strange_worlds.45.desc.intro: "Nghiên cứu về những ký tự kỳ lạ bên ngoài cấu trúc trên §Y[Root.GetName]§! cho thấy nó thực chất là một loại giao diện tương tác. Chúng ta đã sử dụng nó để mở một cánh cửa ẩn dẫn vào bên trong trống rỗng của tòa nhà, một phòng điều khiển rộng lớn hiện ra trước mắt.\n\nMặc dù không hiểu rõ cơ chế hoạt động sâu xa của nó, chúng ta đã nắm được một số lệnh cơ bản thông qua thử nghiệm và sai sót. Việc ngắt các chức năng của nó đã dẫn đến một kết quả bất ngờ; trong thung lũng gần đó bỗng lộ ra tàn tích của một khu định cư ngoài hành tinh bị bỏ hoang từ lâu.\n\nCó vẻ như vật thể này bằng cách nào đó đã tạo ra một trường tàng hình mạnh mẽ bao trùm thuộc địa cũ; mục đích là để trốn tránh điều gì thì vẫn còn là một bí ẩn, nhưng chắc chắn một điều là, bất kể họ đã nỗ lực ra sao, nơi này giờ đây chỉ còn là sự im lặng chết chóc. Không một món đồ khảo cổ nào còn nguyên vẹn, nhưng ít nhất các nhà khoa học của chúng ta đã hoàn toàn kiểm soát được phòng điều khiển này."
 strange_worlds.45.desc.a: "$strange_worlds.45.desc.intro$\n\nGiờ đây, chúng ta có thể ổn định trường tàng hình kỳ lạ của cấu trúc này và mở rộng nó ra toàn bộ thung lũng. Điều này có thể gia tăng đáng kể mức độ an toàn cho thuộc địa của chúng ta."
 strange_worlds.45.desc.b: "$strange_worlds.45.desc.intro$\n\nGiờ đây, chúng ta có thể ổn định trường tàng hình của cấu trúc này, mở rộng nó ra toàn bộ thung lũng, và nâng cao đáng kể hiểu biết của chúng ta về công nghệ tàng hình."
 strange_worlds.45.a: "Một khám phá có giá trị."
 strange_worlds.55.name: "Điện Giật Tự Nhiên"
 strange_worlds.55.desc.intro: "Một lượng lớn các loài động vật ăn cỏ khổng lồ bắt đầu cản trở sản lượng năng lượng của §Y[Root.GetName]§!. Những sinh vật này đang thể hiện những hành vi tự sát tập thể đầy kịch tính, tự nướng chín mình bằng cách lao vào trạm phát điện của chúng ta.\n\nNhững loài động vật này có sự thôi thúc mãnh liệt đến mức chúng phá vỡ cả hàng rào xung quanh lưới điện để đạt được mục đích. Vì hành vi kỳ lạ này, việc sản xuất năng lượng đã bị ảnh hưởng.\n\n"
 strange_worlds.55.desc.outro: "Loài sinh vật này đóng vai trò quan trọng trong hệ sinh thái của hành tinh. Nếu các sự cố tiếp diễn với tần suất như hiện tại, chúng sẽ sớm tự đưa mình đến chỗ tuyệt chủng."
 strange_worlds.55.desc.a: "$strange_worlds.55.desc.intro$Tuy nhiên, điều này lại mang đến một nguồn thực phẩm ngoài mong đợi, khi [Owner.GetColonistPlural] địa phương phát hiện ra thịt của loài sinh vật này rất ngon.\n\n$strange_worlds.55.desc.outro$"
 strange_worlds.55.desc.b: "$strange_worlds.55.desc.intro$Mặc dù điều này làm tăng sản lượng thu hoạch sinh khối của chúng ta, nhưng nó cũng mang lại nhiều rắc rối.\n\n$strange_worlds.55.desc.outro$"
 strange_worlds.55.a: "Nghiên cứu hành vi này."
 strange_worlds.60.name: "Sinh Lý Xúc Tác"
 strange_worlds.60.desc: "Chúng ta đã thu được những hiểu biết vô cùng giá trị về hiện tượng tự sát của loài sinh vật trên §Y[Root.GetName]§!.\n\nNhững loài động vật khổng lồ này về cơ bản là bị mù, chúng sử dụng khả năng định vị bằng tiếng vang để quan sát và nhận biết nhau. Chúng ta nghi ngờ rằng các tần số phát ra từ lưới điện đã vượt quá mức mà thính giác nhạy bén của chúng có thể chịu đựng, kích hoạt hành vi tấn công vào các trạm phát điện của chúng ta.\n\nNgoài ra, chúng ta còn phát hiện ra rằng các enzym tiêu hóa độc đáo của chúng có thể hoạt động như một chất xúc tác trong quá trình luyện kim. Các thử nghiệm ban đầu cho thấy sản lượng hợp kim có khả năng được cải thiện.\n\nMặc dù có những khám phá này, chúng ta vẫn còn một chặng đường dài để khôi phục lại việc sản xuất năng lượng bình thường. Các nhà khoa học của chúng ta sẽ tiếp tục điều tra vấn đề này."
 strange_worlds.60.a: "$FASCINATING$"
 strange_worlds.65.name: "Sức Hút Động Vật"
 strange_worlds.65.desc.intro: "Chúng ta đã tìm ra nguyên nhân khiến các sinh vật trên [Root.GetName] có xung động tấn công tự sát.\n\nViệc nghiên cứu sâu hơn về hệ thống định vị bằng tiếng vang và hành vi xã hội của chúng đã hé lộ một sự thật đáng kinh ngạc: tiếng gọi giao phối của chúng có tần số gần như trùng khớp hoàn toàn với tiếng ồn phát ra từ lưới điện của chúng ta.\n\n"
 strange_worlds.65.desc.common: "Chúng ta có thể sao chép tiếng kêu của những sinh vật khổng lồ này, hướng đường di cư của chúng ra xa khỏi thuộc địa, qua đó ổn định số lượng cá thể của chúng. Như vậy, chúng ta có thể thu hoạch các enzyme xúc tác từ chất thải của chúng để gia tăng sản lượng hợp kim, đồng thời tiếp tục nghiên cứu cấu tạo sinh lý độc đáo của chúng.\n\nMặt khác,\n\n"
 strange_worlds.65.desc.outro: "Chúng ta có thể dễ dàng chế tạo các bẫy điện chuyên dụng để xử lý những động vật này một cách hiệu quả mà không làm gián đoạn quá trình sản xuất năng lượng."
 strange_worlds.65.desc.devouring_swarm: "$strange_worlds.65.desc.intro$Chúng ta có thể dễ dàng sử dụng kiến thức này để dẫn dụ những sinh vật đó vào các bẫy chuyên dụng. Bữa tiệc bắt đầu thôi."
 strange_worlds.65.desc.food: "$strange_worlds.65.desc.intro$$strange_worlds.65.desc.common$Những sinh vật này đã trở thành một trong những nguồn thực phẩm chính yếu của §Y[Root.GetName]§!.\n\n$strange_worlds.65.desc.outro$"
 strange_worlds.65.desc.no_food: "$strange_worlds.65.desc.intro$Những sinh vật này là một nguồn sinh khối bền vững trên §Y[Root.GetName]§!\n\n$strange_worlds.65.desc.outro$"
 strange_worlds.65.a: "Thu gom phân của chúng."
 strange_worlds.65.b_devouring_swarm: "Mở tiệc thôi!"
 strange_worlds.65.b_default: "Thu hoạch thịt của chúng."
 strange_worlds.75.name: "Cát Kỳ Dị"
 strange_worlds.75.desc: "Các [Owner.GetColonistPlural] đã báo cáo về một hiện tượng kỳ lạ liên quan đến cát trên §Y[Root.GetName]§!.\n\nVào một ngày thời tiết đáng lẽ phải trong xanh, một cơn bão cát dữ dội bất ngờ ập đến gần khu định cư của chúng ta. Những đụn cát chảy như lũ lụt xuất hiện từ hư không rồi lại biến mất trong chớp mắt. Thậm chí có người còn thấy cồn cát di chuyển theo chiều ngang trong một ngày lặng gió.\n\nCho đến nay, những sự kiện này vẫn chưa có lời giải thích nào về mặt khí tượng hay địa lý.\n\nNhững lớp cát kỳ dị này chưa gây ra tổn hại trực tiếp nào, nhưng đã cản trở hoạt động của thuộc địa. Quá trình nghiên cứu hiện tượng tự nhiên độc đáo này vẫn đang được tiến hành."
 strange_worlds.75.a: "Thật kỳ lạ."
 strange_worlds.80.name: "Cát Biết Hát"
 strange_worlds.80.desc: "Những trận bão cát trên §Y[Root.GetName]§! bắt đầu phát ra những tiếng gầm gừ trầm thấp. Âm thanh này thường xuyên thay đổi cao độ và lặp lại theo những khuôn mẫu nhất định.\n\nMặc dù hiện tượng \"cát biết hát\" này có thể được quy cho các đặc tính đã biết của các hạt tự do, nhưng sự thay đổi cao độ thường xuyên như vậy không thể chỉ giải thích bằng ma sát.\n\nChúng ta cũng tìm thấy một thung lũng bị cồn cát vùi lấp, trên đó khắc đầy những ký hiệu kỳ lạ. Mảng hoa văn này thỉnh thoảng nổi lên rõ rệt rồi lại gần như biến mất hoàn toàn không để lại dấu vết.\n\nNguyên nhân khiến cát chuyển động vẫn chưa rõ ràng, nhưng sự nhất quán của các khuôn mẫu này cho thấy hẳn phải có một mục đích hoặc ý định nào đó đằng sau hành vi này."
 strange_worlds.80.a: "Nghiên cứu quy luật."
 strange_worlds.85.name: "Cát Ngoại Cảm"
 strange_worlds.85.desc_part1_no_zro: "Các [Owner.GetScientistPlural] nghiên cứu bão cát trên §Y[Root.GetName]§! đã phát hiện ra một loại vật chất hoàn toàn mới và độc đáo phân bố trong silicat."
 strange_worlds.85.desc_part1_zro: "Các [Owner.GetScientistPlural] nghiên cứu bão cát trên §Y[Root.GetName]§! đã phát hiện ra vật chất phân bố trong silicat chính là Zro."
 strange_worlds.85.desc_part2_non_machine_common_no_psionic_zroni: "\nTrong quá trình xử lý mẫu vật, các [Owner.GetResearchers] đã trải qua những ảo giác ngắn nhưng vô cùng chân thực, nhìn thấy bóng dáng của tộc Zroni lang thang trên những cồn cát phủ đầy bùa chú của hành tinh này."
 strange_worlds.85.desc_part2_non_machine_common_no_psionic_no_zroni: "\nTrong quá trình xử lý mẫu vật, các [Owner.GetResearchers] đã trải qua những ảo giác ngắn nhưng vô cùng chân thực, nhìn thấy bóng dáng của một chủng tộc ngoài hành tinh chưa biết lang thang trên những cồn cát phủ đầy bùa chú của hành tinh này."
 strange_worlds.85.desc_part2_non_machine_common_psionic_zroni: "\nTrong quá trình xử lý mẫu vật, các [Owner.GetResearchers] đã trải qua những ảo ảnh ngoại cảm ngắn nhưng vô cùng chân thực, nhìn thấy bóng dáng của tộc Zroni lang thang trên những cồn cát phủ đầy bùa chú của hành tinh này."
 strange_worlds.85.desc_part2_non_machine_common_psionic_no_zroni: "\nTrong quá trình xử lý mẫu vật, các [Owner.GetResearchers] đã trải qua những ảo ảnh ngoại cảm ngắn nhưng vô cùng chân thực, nhìn thấy bóng dáng của một chủng tộc ngoài hành tinh chưa biết lang thang trên những cồn cát phủ đầy bùa chú của hành tinh này."
 strange_worlds.85.desc_part2_machine_common: "\nTrong quá trình xử lý mẫu vật, các mạch bên trong của [Owner.GetResearchers] đã bị nhiễu sóng.\n\n"
 strange_worlds.85.desc_part2_machine_zroni: "$strange_worlds.85.desc_part2_machine_common$Sự nhiễu loạn mạnh mẽ này gây ra lỗi xử lý hình ảnh, tạo ra ảo ảnh về tộc Zroni lang thang trên những cồn cát phủ đầy bùa chú của hành tinh này."
 strange_worlds.85.desc_part2_machine_no_zroni: "$strange_worlds.85.desc_part2_machine_common$Sự nhiễu loạn mạnh mẽ này gây ra lỗi xử lý hình ảnh, tạo ra ảo ảnh về một chủng tộc ngoài hành tinh chưa biết lang thang trên những cồn cát phủ đầy bùa chú của hành tinh này."
 strange_worlds.85.desc_part3_common: "\nNhững ảo ảnh này dường như là khởi nguồn của các chữ rune. Sẽ mất thêm một chút thời gian để giải mã các ký hiệu, nhưng chúng ta tin rằng đây chắc chắn là một dạng ngôn ngữ viết.\n\n"
 strange_worlds.85.desc_part3_zro: "$strange_worlds.85.desc_part3_common$Chúng ta có thể dễ dàng chiết xuất Zro từ cát, nhưng điều này có thể khiến các ảo ảnh tan biến. Dù vậy, số lượng loại vật chất quý giá này là rất lớn."
 strange_worlds.85.desc_part3_no_zro: "$strange_worlds.85.desc_part3_common$Chúng ta có thể dễ dàng chiết xuất loại vật chất kỳ lạ này từ cát, nhưng điều này có thể khiến các ảo ảnh tan biến. Dù vậy, loại vật chất đi ngược lại các hiện tượng vật lý này có thể có giá trị cực cao."
 strange_worlds.85.a: "Tiếp tục cố gắng dịch thuật."
 strange_worlds.85.b_no_zro: "Chiết xuất vật chất kỳ lạ ngay lập tức."
 strange_worlds.85.b_zro: "Chiết xuất Zro ngay lập tức."
 strange_worlds.90.name: "Dị Cảnh Trong Cát"
 strange_worlds.90.desc_intro_zroni: "Dựa trên những kiến thức hiện có về văn hóa Zroni, chúng ta đã vẽ một chữ rune mới lên cát trên §Y[Root.GetName]§!; đó là lời chào bằng ngôn ngữ Zroni. Chúng ta ngay lập tức nhận được phản hồi."
 strange_worlds.90.desc_intro_no_zroni: "Sử dụng cơ sở dữ liệu ngôn ngữ của mình, chúng ta đã viết hàng trăm biểu tượng chào hỏi của tất cả các ngôn ngữ ngoài hành tinh đã biết lên cát trên §Y[Root.GetName]§!. Cuối cùng, chúng ta cũng nhận được một lời hồi đáp."
 strange_worlds.90.desc_common: "\nBão cát tan biến, dòng lũ ngừng lại, và bài ca của những cồn cát cũng chìm vào im lặng. Toàn bộ cồn cát lơ lửng giữa không trung, dần dần nặn thành một hình dạng mới. Cát chuyển động tạo thành những hình người xoáy lốc giữa không trung, vẽ nên một khung cảnh phức tạp và kỳ diệu.\n\n"
 strange_worlds.90.desc_storyline_started: "$strange_worlds.90.desc_common$Chúng ta ngay lập tức nhận ra đây là một câu chuyện của tộc Zroni; một ảo ảnh về thứ sức mạnh hoàn toàn mới và một cuộc xung đột tàn khốc. Những hạt cát này, được điều khiển bởi lượng Zro ẩn chứa bên trong, đã tạo ra một tiếng vọng vũ trụ của chủng tộc Zroni cổ đại.$strange_worlds.90.desc_outro$"
 strange_worlds.90.desc_storyline_finished: "$strange_worlds.90.desc_common$Chúng ta ngay lập tức nhận ra đây là câu chuyện của tộc Zroni; về cách họ Thăng thiên vào Shroud và rồi rước lấy diệt vong. Những hạt cát này, được điều khiển bởi lượng Zro ẩn chứa bên trong, đã tạo ra một tiếng vọng vũ trụ về bi kịch số phận của tộc Zroni.$strange_worlds.90.desc_outro$"
 strange_worlds.90.desc_storyline_not_started: "$strange_worlds.90.desc_common$Điều duy nhất chúng ta hiểu được là đây là câu chuyện về một chủng tộc ngoài hành tinh nào đó đã tìm ra sức mạnh mới và dẫn đến sự chia rẽ, diệt vong.$strange_worlds.90.desc_outro$"
 strange_worlds.90.desc_outro: "\n\nSau đó, lớp cát ngoại cảm lại trở nên yên tĩnh. Bão cát không bao giờ xuất hiện nữa, chúng ta chỉ có thể hiểu rằng lớp cát này đã quen hơn với sự hiện diện của chúng ta trên §Y[Root.GetName]§!."
 strange_worlds.90.a: "$FASCINATING$"
 strange_worlds.95.name: "Chiến Dịch Thu Hoạch"
 strange_worlds.95.desc_zroni_tech: "Sử dụng chuyên môn về chưng cất Zro, chúng ta đã chiết xuất được một lượng lớn Zro từ cát trên §Y[Root.GetName]§!, đồng thời học hỏi được rất nhiều điều trong quá trình này.$strange_worlds.95.desc_outro$"
 strange_worlds.95.desc_no_zroni_tech: "Tiến độ thu hoạch Zro trên §Y[Root.GetName]§! có kết quả buồn vui lẫn lộn. Dù trích xuất thành công một phần nhỏ, nhưng phần lớn đã bị hao hụt trong quá trình thử nghiệm. Tuy nhiên, chúng ta thực sự đã học hỏi được rất nhiều từ quá trình này.$strange_worlds.95.desc_outro$"
 strange_worlds.95.desc_outro: "\n\nSau khi loại bỏ các tạp chất Zro, hành vi của lớp cát này đã trở lại bình thường. Thuộc địa của chúng ta không còn bị quấy rầy bởi những trận bão cát khó lường nữa. Dù trước đây thứ gì đang thao túng lớp cát này, giờ chúng đã tan biến vào hư không."
 strange_worlds.105.name: "Biến Mất Đột Ngột"
 strange_worlds.105.desc_intro: "Một [Owner.GetExplorer] của chúng ta trên §Y[Root.GetName]§! đã đột ngột mất liên lạc, ngay sau khi người này vừa báo cáo về việc tìm thấy tiềm năng §YKhí Ngoại Lai§! trong một thung lũng chưa từng được lập bản đồ.\n\n"
 strange_worlds.105.desc_gestalt_non_machine: "Trước khi thực thể này rơi vào im lặng hoàn toàn, chúng ta đã cảm nhận được một cơn đau dữ dội và chóng vánh."
 strange_worlds.105.desc_gestalt_machine: "Dữ liệu của điểm kết nối này đã bị hỏng nặng trước khi mất liên lạc và ngoại tuyến. Hiện tại nó đã hoàn toàn bị ngắt khỏi mạng lưới của chúng ta."
 strange_worlds.105.desc_non_gestalt: "Đáng lo ngại là, lần liên lạc cuối cùng của người này bị cắt đứt đột ngột ngay sau một âm thanh nghe như tiếng la hét thảm thiết. Chúng ta đã chuẩn bị cho tình huống xấu nhất."
 strange_worlds.105.a: "Đáng quan ngại."
 strange_worlds.110.name: "Đầm Lầy Ăn Mòn"
 strange_worlds.110.desc: "Trong lúc điều tra vị trí cuối cùng được biết đến của [Owner.GetExplorer] mất tích trên §Y[Root.GetName]§!, chúng ta đã phát hiện ra một vùng đầm lầy bùn đất có tính axit cực mạnh, đang sủi bọt phun ra một làn sương §YKhí Ngoại Lai§! tinh khiết. Khu vực đầm lầy này là nơi sinh sống của một loài thực vật bản địa vô cùng dẻo dai, có khả năng chống chịu được mức axit cực đoan như vậy.\n\nMặc dù khu vực này cực kỳ nguy hiểm, việc nghiên cứu thêm về làn khí mù này có thể mang lại lợi ích to lớn cho năng suất tài nguyên của thuộc địa."
 strange_worlds.110.a: "Nghiên cứu làn khí mù này."
 strange_worlds.115.name: "Đầm Lầy Tiêu Hóa"
 strange_worlds.115.desc: "Trong lúc nghiên cứu đầm lầy axit trên §Y[Root.GetName]§!, một trong số các [Owner.GetScientistPlural] cùng với thiết bị nghiên cứu của chúng ta đã bị những xúc tu của một loài thực vật địa phương quấn lấy và kéo tuột vào một vũng bùn có tính ăn mòn cực cao. Người này đã bị hòa tan gần như ngay lập tức, chúng ta tin rằng [Owner.GetExplorer] mất tích cũng đã phải chịu chung số phận bi thảm tương tự.\n\nNgay sau đó, những xúc tu của loài cây này phình to lên một cách rõ rệt và nhả ra một lượng nhỏ §YKhí Ngoại Lai§!. Loài thực vật ăn thịt này dường như sử dụng đầm lầy axit như một hệ tiêu hóa ngoài; chúng dùng xúc tu để săn mồi, kéo con mồi vào vũng bùn để hòa tan, và sau đó hấp thụ chất dinh dưỡng. Quá trình này sẽ giải phóng một lượng nhỏ Khí Ngoại Lai có thể thu hoạch được.\n\nChúng ta suy đoán rằng có thể lợi dụng đặc tính sinh học của loài cây này bằng cách cho nó ăn chất thải của thuộc địa để tạo ra nhiều khí đốt hơn cho chúng ta sử dụng. Hoặc chúng ta có thể trung hòa các đầm lầy axit này, cải tạo lại những vùng đất giàu dinh dưỡng để phục vụ nông nghiệp."
 strange_worlds.115.a: "Nuôi trồng loài sinh vật này."
 strange_worlds.115.b: "Cải tạo vùng đất này."
 strange_worlds.120.name: "Đã Giải Trừ Mối Đe Dọa Từ Thực Vật Đầm Lầy"
 strange_worlds.120.desc: "Chúng ta đã trung hòa thành công đầm lầy axit trên §Y[Root.GetName]§!, đồng thời tiêu diệt luôn loài thực vật sinh sống trong đó. Do đó, làn sương §YKhí Ngoại Lai§! cũng đã biến mất.\n\nNhững vùng đất được cải tạo này màu mỡ lạ thường nhờ lượng dinh dưỡng còn sót lại từ loài thực vật bản địa, tạo thêm cho chúng ta những vùng đất nông nghiệp vô giá."
 strange_worlds.120.a_ct: "Thêm §G2§! §Y$district_farming_plural$§! vào [This.GetName]"
 strange_worlds.120.b.evopred: "Rất tốt, hãy thu hoạch luôn cả những gì còn sót lại."
 strange_worlds.130.name: "Bùng Nổ Vật Chất Tối"
 strange_worlds.130.desc: "Một mạch nước phun địa nhiệt từng được cho là đã ngủ yên từ lâu trên §Y[Root.GetName]§! vừa phun trào dữ dội, xả một lượng khí chứa §YVật Chất Tối§! vào bầu khí quyển.\n\nVụ phun trào này đã che khuất bầu trời, gây ra những dị thường trọng lực nghiêm trọng, cản trở việc liên lạc và du hành giữa các vì sao.\n\nChúng ta cho rằng Vật Chất Tối có thể bắt nguồn từ lõi độc đáo của hành tinh này. Môi trường khắc nghiệt này đang đe dọa các [Owner.GetColonistPlural], vì vậy chúng ta đã triển khai thiết bị hút trên quỹ đạo để hút lớp sương mù này từ tầng bình lưu."
 strange_worlds.130.a: "Theo dõi sát sao chuyện này."
 strange_worlds.135.name: "Vật Chất Tối Dạng Lỏng"
 strange_worlds.135.desc_common_1: "Chúng ta đã hút thành công lớp sương mù §YVật Chất Tối§! khỏi bầu khí quyển của §Y[Root.GetName]§! và bắt đầu đánh giá thiệt hại."
 strange_worlds.135.desc_common_2: "\nSau khi liên lạc lại được với thuộc địa, chúng ta phát hiện các [Owner.GetColonistPlural] đã bị hóa thạch bởi một thứ dường như là Vật Chất Tối đông đặc."
 strange_worlds.135.desc_organic_non_gestalt: "$strange_worlds.135.desc_common_2$Sau khi phát hiện dấu hiệu sự sống bên trong những chiếc vỏ rỗng này, chúng ta đã cẩn thận trích xuất họ ra."
 strange_worlds.135.desc_machine: "$strange_worlds.135.desc_common_2$Sau khi phát hiện tín hiệu điện tử còn hoạt động bên trong đống tàn tích, chúng ta đã giải phóng chúng ra."
 strange_worlds.135.desc_gestalt: "$strange_worlds.135.desc_common_2$Nhận thấy những nỗ lực của chúng nhằm tái hòa nhập vào Tập Thể, chúng ta đã giải cứu chúng khỏi những nấm mồ vật lý này."
 strange_worlds.135.desc_outro: "\nTrái với mọi dự đoán, các [Owner.GetColonistPlural] dường như không bị ảnh hưởng gì bởi việc tiếp xúc lâu dài và trạng thái ngưng trệ.\n\nMạch nước phun gây ra sự cố ban đầu hiện đã sụp đổ tạo thành một hồ Vật Chất Tối dạng lỏng.\n\nĐây là một sự kiện chưa từng có tiền lệ và đòi hỏi phải tập trung nghiên cứu. Các [Owner.GetScientistPlural] của chúng ta hiện không chắc chắn nên phân bổ nguồn tài nguyên vốn đã eo hẹp của họ như thế nào."
 strange_worlds.135.a: "Cách ly và nghiên cứu dân số."
 strange_worlds.135.b: "Ưu tiên nghiên cứu Vật Chất Tối."
 strange_worlds.140.name: "Ô Nhiễm Vật Chất Tối"
 strange_worlds.140_intro: "Các [Owner.GetScientistPlural] của chúng ta tin rằng, hồ Vật Chất Tối trên §Y[Root.GetName]§! ít có khả năng gây thêm mối đe dọa nào cho hành tinh. Nhưng những triệu chứng đang xuất hiện trên dân số thì không như vậy.\n\nTrong lúc nghiên cứu những [Owner.GetColonistPlural] bị cách ly, chúng ta nhận thấy cơ thể họ đang trải qua những biến đổi liên tục sau khi bị vật chất này bao bọc."
 strange_worlds.140_common: "\nViệc tiếp xúc trong thời gian dài đã khiến các phân tử trong cơ thể họ ngập tràn Vật Chất Tối,"
 strange_worlds.140_machine_1: "$strange_worlds.140_common$phá hủy hoàn toàn hệ thống của chúng."
 strange_worlds.140_non_machine_1: "$strange_worlds.140_common$làm ô nhiễm hệ tuần hoàn của họ."
 strange_worlds.140_machine_2: "\nMặc dù các chất gây ô nhiễm này thực sự có nguy cơ khiến hệ thống hỏng hóc sớm, nhưng nếu tích hợp chúng vào quá trình lắp ráp, chúng sẽ cho phép các thiết bị được chế tạo trên hành tinh này xử lý và thu thập Vật Chất Tối một cách cực kỳ hiệu quả như một quy trình phụ."
 strange_worlds.140_non_machine_2: "\nChúng ta có thể nuôi dưỡng những dị thường này, cho phép cơ thể của các [Owner.GetColonistPlural] có thể tự xử lý và tiết ra Vật Chất Tối có thể thu hoạch được, nhưng cái giá phải trả là tuổi thọ của họ bị rút ngắn."
 strange_worlds.140.a.dc_empire: "Đón nhận món quà này."
 strange_worlds.140.a.machine_empire: "Nuôi dưỡng dị thường."
 strange_worlds.140.a.normal: "Xử lý chất ô nhiễm."
 strange_worlds.140.b: "Thanh tẩy chất ô nhiễm."
 strange_worlds.145.name: "Hố Đen Vi Mô"
 strange_worlds.145.desc: "Việc nghiên cứu sâu hơn về hồ Vật Chất Tối trên §Y[Root.GetName]§! đã hé lộ thông tin địa chất mấu chốt, có thể giải thích nguyên nhân của sự cố ban đầu.\n\nLõi của hành tinh này có chứa một hố đen vi mô, với kích thước chưa tới một mét. Khối lượng khổng lồ của bản thân hành tinh đã triệt tiêu lực hấp dẫn dự kiến mà lẽ ra chúng ta phải phát hiện được từ dị thường này. Mối quan hệ giữa các khối lượng này dường như đã đạt đến một sự cân bằng tinh tế và đáng lẽ sẽ còn kéo dài rất lâu.\n\nTuy nhiên, các hoạt động địa chấn gần đây đã làm dịch chuyển lớp phủ bên trong, gây ra vụ phun trào mạch nước ban đầu. Bản thân hồ Vật Chất Tối có tác dụng ổn định lõi hành tinh và ngăn chặn các vụ bùng nổ tiếp theo.\n\nThế nhưng, lượng Vật Chất Tối bão hòa lâu ngày lại không vô hại như thoạt nhìn.\n\nNhững hố đen vi mô không ổn định đã hình thành tại tâm khối lượng của các [Owner.GetColonistPlural], khiến cơ thể họ sụp đổ dữ dội vào trong. Những gì còn sót lại chỉ là những cái vỏ vô hồn làm từ Vật Chất Tối kết tinh. Máy quét không phát hiện ra bất kỳ dấu hiệu hoạt động nào bên trong.\n\nThống kê cuối cùng cho thấy §Y[Root.GetName]§! đã mất khoảng một phần tư dân số chỉ trong chớp mắt. Thay vào đó, hàng loạt bức tượng Vật Chất Tối rắn với đủ loại tư thế đang nằm rải rác khắp hành tinh."
 strange_worlds.145.a.no_gestalt: "Thật bất hạnh."
 strange_worlds.145.a.gestalt: "Thật kinh khủng."
 strange_worlds.155.name: "Côn Trùng Gây Buồn Nôn"
 strange_worlds.155.desc_homicidal: "Chúng ta đã phát hiện ra một sinh vật bản địa cực kỳ gớm ghiếc trên §Y[Root.GetName]§!.\n\nChúng đã tiến hóa ra một cơ chế phòng vệ, đồng thời cũng là cách thức kiếm ăn chính của chúng. Do thiếu các enzym tiêu hóa cần thiết để phân hủy thức ăn rắn, chúng sẽ tiết ra một loại khí nặng mùi và kinh tởm, khi các sinh vật có hệ tiêu hóa bình thường hít phải, sẽ gây ra nôn mửa dữ dội. Những bãi chiến trường bị thải ra đó sau đó trở thành nguồn dinh dưỡng chính của chúng.\n\nViệc tận diệt những sinh vật gớm ghiếc này sẽ mang lại cho chúng ta nguồn tài nguyên §YKhí Ngoại Lai§! và §YThực Phẩm§! dồi dào."
 strange_worlds.155.desc_normal: "Các [Owner.GetColonistPlural] của chúng ta trên §Y[Root.GetName]§! đã chạm trán với một loài động vật bản địa có cách thức kiếm ăn khá là... độc đáo.\n\nMặc dù ban đầu những sinh vật này khá nhút nhát, nhưng chúng đã dần quen với sự hiện diện của chúng ta, và nhờ bản tính thân thiện, chúng thậm chí còn trở nên rất phổ biến đối với một số [Root.Owner.GetSpeciesNamePlural] ngây thơ.\n\nDù không tạo ra mối đe dọa trực tiếp nào, nhưng chúng lại tiến hóa một cơ chế phòng vệ, và đây tình cờ cũng là cách kiếm ăn chính của chúng. Do thiếu enzym tiêu hóa để tự phân hủy thức ăn rắn, chúng sẽ tiết ra một loại khí nặng mùi và cực kỳ khó ngửi. Khi những sinh vật có hệ tiêu hóa bình thường khác hít phải sẽ lập tức nôn mửa dữ dội. Những gì bị ói ra sau đó lại được chúng dùng làm nguồn dinh dưỡng chính.\n\nNhìn chung, tình trạng này mang theo nguy cơ lây lan dịch bệnh, các nhà lãnh đạo địa phương đã liên tục kêu gọi các [Owner.GetColonistPlural] tránh xa những sinh vật kỳ lạ này."
 strange_worlds.155.a: "Thật là một kiến thức sinh học ngoại lai kỳ quái."
 strange_worlds.155.b_purifiers: "Ọe."
 strange_worlds.155.b_swarm: "Phải nhấm nháp từ từ!"
 strange_worlds.155.b_normal: "Giết không tha."
 strange_worlds.160.name: "Diễn Biến Buồn Nôn"
 strange_worlds.160.desc: "Việc tiêu diệt lũ côn trùng gây buồn nôn trên §Y[Root.GetName]§! đã được chứng minh là vô cùng khó khăn. Bất chấp các cảnh báo chính thức, những thành viên trẻ tuổi trong thuộc địa vẫn tiếp tục chơi đùa với loài động vật này.\n\nVì lý do này, protein của [Root.Owner.GetSpeciesOrganName] chúng ta đã trở thành nguồn thức ăn ưa thích của chúng. So với những động vật khác trên hành tinh biết tránh xa mùi khí hôi thối của chúng, thuộc địa của chúng ta đã trở thành mục tiêu dễ xơi hơn. Những sinh vật này đã thích nghi hơn với sự hiện diện của chúng ta, và đã có người chứng kiến chúng áp dụng chiến thuật phục kích bất kỳ [Owner.GetColonist] nào đi lang thang một mình sau bữa ăn.\n\nĐáng kinh ngạc là, tình huống này cũng mang lại một vài lợi ích. Các nhà khoa học của chúng ta phát hiện ra rằng khí gây nôn do những sinh vật này phát ra có chứa các hạt §YKhí Ngoại Lai§! vô giá, có thể thu thập được bằng cách thuần hóa những con thú này và nuôi nhốt chúng trong các cơ sở cách ly.\n\nTuy nhiên, phần lớn cư dân lại đề xuất chúng ta nên tận diệt chúng."
 strange_worlds.160.a: "Gom chúng lại."
 strange_worlds.160.b: "Đủ rồi. Giết sạch chúng đi."
 strange_worlds.165.name: "Không Khí Trong Lành"
 strange_worlds.165.desc: "Các sinh vật trên §Y[Root.GetName]§! không còn gây ra hiện tượng nôn mửa hàng loạt nữa.\n\nVới việc phát triển loại bột dinh dưỡng tổng hợp nhắm vào cấu tạo sinh học ngoại lai của chúng, chúng ta đã điều chỉnh chu kỳ ăn uống của chúng, triệt để loại bỏ những cuộc tập kích lén lút nhắm vào các [Owner.GetColonistPlural] của chúng ta.\n\nChúng ta đã chuyển chúng đến một khu bảo tồn động vật hoang dã được thiết kế kỹ lưỡng, nơi công chúng có thể quan sát những động vật này trong một môi trường an toàn. Những nhân viên chăn nuôi chuyên nghiệp đã được đào tạo để có thể trích xuất §YKhí Ngoại Lai§! của chúng mà không gây thêm bất kỳ tổn hại nào."
 strange_worlds.165.a: "Nhẹ cả người."
 strange_worlds.165.a.evopred: "Đảm bảo chúng ta không phát ra cái mùi đó."
 strange_worlds.170.name: "Hạ Lệnh Tiêu Diệt"
 strange_worlds.170.desc: "Kể từ khi áp dụng chính sách chính thức \"thấy là bắn\", đã vài tháng trôi qua, không còn ai nhìn thấy những sinh vật đáng ghét đó gần thuộc địa §Y[Root.GetName]§! nữa.\n\nMặc dù một số [Owner.GetColonistPlural] có chút nhớ nhung những sinh vật đầy lông lá đó, nhưng hiện tại mọi người đều vui vẻ hơn vì họ có thể tự do đi lại mà không còn phải nơm nớp lo sợ bị ép nôn mửa.\n\nCác nhà khoa học của chúng ta đã thu thập xác của những động vật này và trực tiếp trích xuất một lượng §YKhí Ngoại Lai§! từ nội tạng của chúng."
 strange_worlds.170.a: "Chúng tự chuốc lấy thôi."
 strange_worlds.185.name: "Thù Hận Vùng Miền"
 strange_worlds.185.desc: "Các báo cáo từ §Y[Root.GetName]§! cho thấy đang có một sự thù địch đáng lo ngại giữa người dân nông thôn và thành thị. Ngoại trừ vị trí địa lý của họ, hiện tại vẫn chưa tìm thấy nguyên nhân rõ ràng nào dẫn đến sự thù hận này.\n\nNhững người mới đến định cư ban đầu sẽ phải đối mặt với sự thù địch, nhưng sau khi được phân bổ về khu vực tương ứng được vài tuần, họ sẽ nhanh chóng được tiếp nhận. Dựa trên điều này, các nhà khoa học của chúng ta tin chắc rằng, hành vi bất thường này bị thúc đẩy bởi các yếu tố cục bộ trong từng khu vực.\n\nTrong lúc điều tra vấn đề, chúng ta cần ổn định tình hình để ngăn chặn tình trạng leo thang thêm. Chúng ta có thể chọn chính thức ủng hộ khu vực nông thôn hoặc thành thị, hoặc triển khai thêm lực lượng thực thi pháp luật để duy trì hòa bình."
 strange_worlds.185.a: "Ủng hộ khu vực thành thị."
 strange_worlds.185.b: "Ủng hộ khu vực nông thôn."
 strange_worlds.185.c: "Tăng cường lực lượng trị an."
 strange_worlds.190.name: "Mối Nghi Ngờ Dưới Nước"
 strange_worlds.190.desc_intro: "Sau khi tiến hành các cuộc khảo sát môi trường trên diện rộng tại §Y[Root.GetName]§!, các nhà khoa học của chúng ta đã xác định được nguồn gốc của hành vi thù hận vùng miền.\n\nNằm sâu dưới lớp phủ của hành tinh, có một cái xác khổng lồ của một sinh vật đang thối rữa. Trải qua hàng ngàn năm phân hủy, dịch tủy sống của sinh vật đã chết từ lâu này rỉ vào nguồn nước ngầm của hành tinh, sản sinh ra một loại vi khuẩn tâm linh. Vi sinh vật thay đổi tâm trí này sau đó xâm nhập vào hệ thần kinh của các [Owner.GetColonistPlural] chúng ta, kích thích ý thức lãnh thổ mạnh mẽ, rất có thể đây vốn là đặc tính của loài động vật nguyên thủy đó.\n"
 strange_worlds.190.desc_non_psionic: "Chúng ta có thể giải quyết vấn đề này bằng cách cho hệ thống cấp nước đi qua một loạt các bộ lọc cao cấp được thiết kế chuyên biệt.\n\n"
 strange_worlds.190.desc_psionic: "Tạp chất ngoại lai này đang gây nhiễu năng lượng tâm linh tự nhiên của chúng ta.$strange_worlds.190.desc_non_psionic$"
 strange_worlds.190.desc_outro_non_psionic: "Ngoài ra, các nhà khoa học của chúng ta tin chắc rằng có thể can thiệp gen loại vi khuẩn này ở cấp độ tế bào, hướng xu hướng lãnh thổ của chúng sang một hướng năng suất hơn."
 strange_worlds.190.a: "Lọc nước ngầm."
 strange_worlds.190.b: "Thử biến đổi gen vi khuẩn."
 strange_worlds.195.name: "Năng Lực Phản Ứng"
 strange_worlds.195.desc_intro: "Trạm lọc nước được triển khai trên §Y[Root.GetName]§! đã đạt được những thành công đáng kể.\n\n"
 strange_worlds.195.desc_psionic: "Hành vi thù địch giành giật lãnh thổ gay gắt đã lắng xuống, không chỉ sự nhiễu loạn đối với khả năng ngoại cảm của chúng ta đã kết thúc, mà những khả năng này còn được cường hóa nhờ vào lợi khuẩn tự nhiên, thúc đẩy sự hình thành §YKhớp Thần Kinh Psionic§! giữa các cá thể trên §Y[Root.GetName]§!. Điều này củng cố liên kết ngoại cảm chung của chúng ta, nuôi dưỡng ý thức cộng đồng mạnh mẽ hơn, đồng thời nâng cao năng suất."
 strange_worlds.195.desc_non_psionic: "Mặc dù hành vi thù địch giành giật lãnh thổ gay gắt đã lắng xuống, nhưng vẫn còn một số tác dụng phụ tàn dư lại khá có lợi trên dân số, đó là các lợi khuẩn tự nhiên, chúng thúc đẩy sự hình thành §YKhớp Thần Kinh Psionic§! giữa các cá thể trên §Y[Root.GetName]§!. Điều này cho phép các [Owner.GetColonistPlural] của chúng ta có thể giao tiếp với nhau ở cấp độ ngoại cảm, tăng cường ý thức cộng đồng và nâng cao năng suất."
 strange_worlds.195.a: "Rất tốt."
 strange_worlds.195.a_ct: "Tất cả Pop trên §Y[Root.GetName]§! nhận được §YKhớp Thần Kinh Psionic§!"
 strange_worlds.195.a.evopred: "Nếm thử thấy... §Mkỳ kỳ§!."
 strange_worlds.195.a_ct.evopred: "Chủng tộc chính của chúng ta nhận được §YKhớp Thần Kinh Psionic§!"
 strange_worlds.200.name: "Tái Tổ Hợp Gen Vi Khuẩn"
 strange_worlds.200.desc: "Chúng ta đã loại bỏ thành công các tác động tiêu cực của sinh vật vi khuẩn đối với §Y[Root.GetName]§!. Cuộc đấu đá nội bộ giữa các [Owner.GetColonistPlural] đã lắng xuống, và họ đã bắt đầu có dấu hiệu tăng năng suất.\n\nCác nhà khoa học của chúng ta tự tin có thể chỉnh sửa thêm mã gen của loại vi sinh vật này. Bằng cách giải trình tự gen của nó một cách chính xác, chúng ta có thể cải thiện hơn nữa hiệu suất của các [Owner.GetColonistPlural] ở một khía cạnh nào đó.\n\nTuy nhiên, loại vi sinh vật này sẽ không thể sống sót nếu bị đưa ra khỏi hành tinh. Mối liên kết tâm linh giữa ty thể của nó và cái xác sinh vật ngoài hành tinh phải được giữ nguyên vẹn thì vi khuẩn mới có thể sinh sản. Chúng ta vẫn chưa hoàn toàn hiểu được nguyên nhân của việc này."
 strange_worlds.200.a: "Tăng cường khả năng sinh sản."
 strange_worlds.200.b: "Tăng cường sức mạnh."
 strange_worlds.200.c: "Tăng cường khả năng nhận thức."
 strange_worlds.1000.name: "Đường Hầm Dung Nham Khoáng Hóa"
 strange_worlds.1000.desc: "Việc cải tạo khí hậu khô hạn trên §Y[From.GetName]§! đã làm lộ ra một mạng lưới đường hầm dung nham khổng lồ trên tầng đáy biển mới nổi của toàn bộ hành tinh.\n\nCác dòng magma tạo nên những đường hầm sâu này hiện đã ngưng hoạt động, để lại những mạch khoáng sản trù phú được hình thành từ rất lâu dưới nhiệt độ và áp suất khắc nghiệt tại lõi nóng chảy của §Y[From.GetName]§!.\n\nNhững mỏ đá magma này cực kỳ dày đặc; hoạt động khai thác tại đây có chi phí đắt đỏ nhưng lợi nhuận mang lại vô cùng lớn."
 strange_worlds.1005.name: "Trứng Nở Khi Gặp Nước"
 strange_worlds.1005.desc: "Dự án cải tạo môi trường trên §Y[From.GetName]§! vô tình gây ra sự bùng nổ dân số của các loài động vật bản địa.\n\nChúng ta phát hiện ra rằng chu kỳ sinh sản của nhiều loài bản địa gắn bó chặt chẽ với nguồn cung cấp nước trong môi trường. Những quả trứng của chúng vốn phải được chôn dưới đất nhiều tháng, hấp thụ đủ độ ẩm mới có thể nở, thì nay lại nằm rải rác la liệt trên bề mặt. Số lượng động vật của hành tinh đang tăng vọt với tốc độ logarit.\n\nNhiều sinh vật trong số này rất giàu dinh dưỡng, sẽ cung cấp một nguồn thực phẩm dồi dào cho §Y[From.GetName]§!, đồng thời cũng mở ra cơ hội nghiên cứu một hệ sinh thái cực kỳ năng động. Những vị khách đến hành tinh này giờ đây sẽ phải trải qua quy trình kiểm tra nghiêm ngặt khi rời đi, nhằm ngăn chặn việc gây ô nhiễm ra bên ngoài."
 strange_worlds.1005.evopred: "Tốc độ này có thể sao chép được không?"
 strange_worlds.1010.name: "Dị Chủng Bị Đóng Băng"
 strange_worlds.1010.intro: "Trong quá trình cải tạo môi trường hành tinh trên §Y[From.GetName]§!, chúng ta đã tình cờ phát hiện ra một số lượng lớn sinh vật bản địa bị chôn vùi dưới lớp băng trên bề mặt. Đáng kinh ngạc hơn nữa là những sinh vật này vẫn còn sống.\n\nLoài này dường như đang trong trạng thái ngủ đông sâu bất thường, đây là chiến lược sinh tồn hiệu quả của chúng để đối phó với kỷ băng hà kéo dài của §Y[From.GetName]§!. Tuy nhiên, hiện tượng băng tan trong quá trình cải tạo hành tinh đã sớm kết thúc trạng thái ngủ đông của chúng.\n\nSau khi tỉnh dậy từ giấc ngủ vùi trong băng, những sinh vật này đã thể hiện những dấu hiệu trí tuệ sơ khai và biết sử dụng các công cụ đơn giản trong quá trình tìm kiếm thức ăn.\n\n"
 strange_worlds.1010.desc_exterminate: "$strange_worlds.1010.intro$Chúng sẽ bị tiêu diệt ngay lập tức. Chúng ta sẽ sử dụng sinh khối thu được cho các mục đích riêng."
 strange_worlds.1010.desc_hunted: "$strange_worlds.1010.intro$Cấu tạo sinh lý độc đáo của chúng sẽ cung cấp cho chúng ta nguồn thực phẩm dồi dào."
 strange_worlds.1010.desc_tolerated: "$strange_worlds.1010.intro$Chúng ta có thể nghiên cứu khả năng ngủ đông phi thường của loài này, hoặc thu hoạch chúng để lấy sinh khối."
 strange_worlds.1010.desc_protected: "$strange_worlds.1010.intro$Chúng ta nên bảo vệ những dạng sống này. Khả năng ngủ đông phi thường của chúng rất đáng để nghiên cứu sâu hơn."
 strange_worlds.1010.a.purge: "Thanh trừng chúng."
 strange_worlds.1010.b.hunted: "Săn lùng chúng."
 strange_worlds.1010.c.study: "Nghiên cứu chúng."
 strange_worlds.1010.d.purge: "Thanh trừng chúng."
 strange_worlds.1010.e.protect: "Bảo vệ chúng."
 strange_worlds.1015.name: "Núi Thép"
 strange_worlds.1015.desc: "Các chuyên gia cải tạo môi trường của chúng ta đã cảnh báo về những vấn đề sắp xảy ra trên §Y[From.GetName]§!.\n\nBên dưới những dãy núi băng giá của hành tinh này, ẩn chứa một lượng lớn tài nguyên Sắt và Carbon có độ dồi dào cao, những tài nguyên này đã bị làm nóng quá mức trong quá trình cải tạo môi trường.\n\nGiờ đây, chúng ta có thể di dời an toàn những nguồn tài nguyên gần như đang nóng chảy này. Hoặc, bằng cách để trạng thái siêu nhiệt tiếp diễn, chúng ta sẽ nuôi dưỡng được một nguồn cung cấp hợp kim vĩnh viễn. Đương nhiên, điều này sẽ phải trả giá bằng việc giảm thiểu không gian sống."
 strange_worlds.1015.a: "Ưu tiên khai thác tài nguyên."
 strange_worlds.1015.b: "Không làm gì cả."
 strange_worlds.1020.name: "Bầu Khí Quyển Dễ Cháy"
 strange_worlds.1020.desc: "Việc cải tạo môi trường trên §Y[From.GetName]§! đã mang lại những hậu quả ngoài mong đợi. Chúng ta đã không nhận ra rằng, lớp đất trên bề mặt hành tinh là một hỗn hợp hạt mịn chứa nồng độ cao các §YVi Hạt Nổ§!, và quá trình cải tạo của chúng ta đã làm xáo trộn những vi hạt này, phát tán chúng vào toàn bộ bầu khí quyển của hành tinh.\n\nThật không may, những hạt mang năng lượng cao lơ lửng trong không khí này đã làm tăng nguy cơ xảy ra các sự cố cháy nổ ngoài ý muốn trên bề mặt. Bất kỳ thuộc địa nào trong tương lai cũng phải ưu tiên việc phòng ngừa tai nạn và xung đột để tránh những hậu quả thảm khốc.\n\nTuy nhiên, nếu chúng ta có thể quản lý cẩn thận những rủi ro này, bầu khí quyển của §Y[From.GetName]§! sẽ trở thành một nguồn cung cấp dồi dào các loại vật liệu quý hiếm này."
 strange_worlds.1025.name: "Dung Nham Xanh"
 strange_worlds.1025.desc: "Lớp vỏ hành tinh của §Y[From.GetName]§! đã bị dịch chuyển do quá trình cải tạo môi trường, dẫn đến một hiện tượng tự nhiên bất thường.\n\nSự dịch chuyển của các mảng kiến tạo đã làm xê dịch nhiều túi §YKhí Ngoại Lai§!, những loại khí này phản ứng với các mạch khoáng sản giàu §YHợp Kim§! bên trong núi lửa của hành tinh, khiến cho các đợt phun trào núi lửa có màu xanh rực rỡ.\n\nSự bất ổn định của hiện tượng này đã làm giảm khả năng định cư của hành tinh, qua đó ảnh hưởng đến kế hoạch tạo không gian sống cho các [Root.GetColonistPlural] của chúng ta.\n\nBù lại, vùng đất xung quanh những ngọn núi lửa này giờ đây rất giàu tài nguyên, sẵn sàng cho chúng ta khai thác."
 strange_worlds.1030.name: "Sét Vĩnh Cửu"
 strange_worlds.1030.desc: "Chúng ta nhận được báo cáo về một hiện tượng thời tiết mới xuất hiện trên §Y[From.GetName]§!.\n\nTrong quá trình cải tạo môi trường của hành tinh, các mỏ pha lê dưới lớp vỏ đã bị lộ ra, phản ứng với các hóa chất được sử dụng trong quá trình cải tạo, và sau đó bị nhiễm phóng xạ. Sự dao động nhiệt độ không khí do việc này gây ra đã tạo nên một cơn bão sấm chớp liên tục bao trùm toàn bộ hành tinh.\n\nĐiều kiện thời tiết độc đáo này chắc chắn sẽ ảnh hưởng đến việc xây dựng cơ sở hạ tầng, và các mỏ pha lê nhiễm phóng xạ cũng tất yếu tác động đến khả năng định cư lâu dài. Tuy nhiên, các [Owner.GetScientistPlural] của chúng ta tin rằng, một khi quá trình cải tạo hoàn tất, họ sẽ có thể khai thác năng lượng từ những cơn bão này.\n\nNgoài ra, các [Owner.GetEngineerPlural] của chúng ta cũng đã vạch ra kế hoạch để trung hòa an toàn điện tích của các mỏ pha lê. Điều này sẽ làm tan cơn bão và cho phép chúng ta khai thác an toàn những viên pha lê này cho các mục đích khác."
 strange_worlds.1030.a: "Khai thác năng lượng từ những cơn bão này."
 strange_worlds.1030.b: "Trung hòa điện tích trong những tinh thể này."
 strange_worlds.1035.name: "Chất Xúc Tác Ngủ Đông"
 strange_worlds.1035.desc: "Việc nghiên cứu quần thể sinh vật bán tri giác trên §Y[event_target:hibernator_planet.GetName]§! đã hé lộ mô hình ngủ đông phi thường của chúng. Mô hình này được điều chỉnh bởi một loại enzym đặc biệt, kích hoạt quá trình sinh vật tiến vào và thoát khỏi trạng thái ngủ đông sâu. Ở trạng thái này, các phản ứng hóa học bên trong cơ thể chúng giảm xuống mức gần như không đáng kể.\n\nChúng ta đã chiết xuất loại enzym này và áp dụng thành công lên nhiều sinh vật khác thông qua các hợp chất an thần. Trong mọi trường hợp, các loài vốn không có khả năng ngủ đông đều có thể tiến vào trạng thái ngủ đông kéo dài, trong khoảng thời gian đó quá trình lão hóa tế bào bị chậm lại đáng kể.\n\nBước đột phá phi thường này đã mở đường cho công nghệ ngủ đông nhân tạo tiên tiến, sẽ giảm bớt đáng kể gánh nặng thể chất cho các loài hữu cơ trong những chuyến du hành không gian dài ngày."
 strange_worlds.1040.name: "Nấm Mồ Trên Không"
 strange_worlds.1040.desc: "Khi chúng ta hoàn thành việc cải tạo môi trường trên §Y[From.GetName]§!, những cái xác bắt đầu từ trên trời rơi xuống.\n\nRơi từ độ cao như vậy, những hài cốt cổ xưa này nát bét khi chạm đất. Lẫn với nội tạng, chúng ta tìm thấy một bộ sưu tập các vật thể nhỏ - đồ trang trí và những di vật kỳ lạ - tất cả đều rơi xuống từ cùng một đám mây dày đặc ở tầng khí quyển cao của hành tinh.\n\nChúng ta chỉ có thể suy đoán rằng, những đám mây dày đặc này đã được một chủng tộc ngoài hành tinh vô danh nào đó dùng làm nơi an nghỉ cuối cùng. Giờ đây, quá trình cải tạo hành tinh của chúng ta đã làm cho các đám mây mỏng đi, giải phóng những vật thể lơ lửng bên trong đó. Có thể lường trước rằng, khi bầu khí quyển ổn định, những hài cốt này sẽ tiếp tục rơi xuống cho đến khi nấm mồ mây hoàn toàn trống rỗng."
 strange_worlds.1040.a: "Sởn cả gai ốc, nhưng biết đâu lại nhặt được thứ gì đó."
 strange_worlds.1040.b: "Mất vệ sinh. Hãy dọn sạch ngay lập tức."
 strange_worlds.1050.name: "Mảnh Vỡ Quỹ Đạo"
 strange_worlds.1050.desc: "Do sự hiện diện của một lượng lớn rác thải không gian và các mảnh vỡ quỹ đạo nhỏ, các kỹ sư cải tạo môi trường của chúng ta trên §Y[event_target:junk_moon_planet.GetName]§! đang phải đối mặt với môi trường làm việc vô cùng nguy hiểm. Số lượng khổng lồ của chúng gây nguy hiểm cho các tàu con thoi khi di chuyển qua lại giữa bề mặt và quỹ đạo.\n\nVì mật độ của những vật thể này cực kỳ dày đặc, chúng ta đã khởi xướng một kế hoạch từ sớm: từ hóa một số mảnh vỡ lớn nhất, để chúng hút các mảnh vỡ khác trên quỹ đạo, cuối cùng dần dần hợp nhất thành một khối dễ quản lý hơn. Nhiệm vụ của chúng ta có thể sẽ tạo ra một vệ tinh nhân tạo.\n\nMặc dù điều này sẽ làm tăng thời gian cải tạo môi trường, nhưng nó sẽ tạo điều kiện thuận lợi hơn nhiều cho tàu con thoi đáp xuống bề mặt và loại bỏ rủi ro các mảnh vỡ quỹ đạo lớn thường xuyên rơi vào bầu khí quyển của hành tinh."
 strange_worlds.1050.a: "Vậy thì tạo ra một vệ tinh đi."
 strange_worlds.1050.b: "Chúng sẽ từ từ cháy rụi thôi."
 strange_worlds.1060.name: "Mặt Trăng Rác"
 strange_worlds.1060.desc: "Công việc hợp nhất rác thải không gian bay quanh §Y[event_target:junk_moon_planet.GetName]§! đã thành công.\n\nBằng cách từ hóa nhiều mảnh vỡ lớn, chúng ta đã dần tập hợp tất cả các vật thể thành một khối kim loại phế liệu khổng lồ. Mật độ của nó đã tăng lên mức đáng kể, đủ để tạo ra lực hấp dẫn của riêng mình. Vệ tinh mới được hình thành này sau đó đã được đưa vào một quỹ đạo ổn định.\n\nSau khi loại bỏ được những mảnh vỡ quỹ đạo nguy hiểm này, việc đi tới bề mặt của §Y[event_target:junk_moon_planet.GetName]§! đã trở nên dễ dàng hơn rất nhiều, chúng ta không còn phải lo lắng về việc những thứ này rơi vào bầu khí quyển nữa. Không những vậy, các kỹ sư của chúng ta còn tin chắc rằng vệ tinh mới này thậm chí có thể chứa một trạm khai thác riêng của mình."
 strange_worlds.1060.create_moon_ct: "[event_target:junk_moon_planet.GetName] có một mặt trăng mới: Mặt Trăng Rác"
 site_abandoned_bio_lab: "Cơ Sở Cổ Đại"
 abandoned_bio_lab_desc: "Quá trình quét §Y[fromfrom.planet.GetName]§! đã phát hiện ra một cơ sở biệt lập nằm ở khu vực khó tiếp cận nhất của hành tinh này. Cấu trúc này dường như đang trong trạng thái ngủ đông hoặc đã bị bỏ hoang, không có bất kỳ dấu hiệu năng lượng nào và trông có vẻ bị phong hóa nghiêm trọng. Tiến hành khai quật khảo cổ có thể mang lại cái nhìn sâu sắc hơn."
 strange_worlds.2000.name: "Phòng Thí Nghiệm Sinh Học Bị Bỏ Hoang"
 strange_worlds.2000.desc: "Bên trong cơ sở này chứa vô số máy móc y tế bị vứt bỏ, các khoang điều trị và một nhà xác. Trong các khoang lưu trữ của nhà xác, người ta tìm thấy một số hài cốt hữu cơ được bảo quản nguyên vẹn có dấu hiệu của bệnh tật và tổn thương. Sự hiện diện của các cửa an ninh, thiết bị giám sát và phòng giam giữ đã khiến §H[universal_macrophage_scientist.GetName]§! kết luận rằng một số cá thể đã bị giam giữ ở đây bằng vũ lực.\n\nChúng ta đã thu hồi được một số bộ phận thiết bị, nhưng hầu hết đã bị hư hỏng nặng. Dữ liệu còn sót lại trong hệ thống máy tính rất hạn chế, dù chúng ta đã khôi phục được một số tệp nhưng vẫn cần phải được dịch thuật."
 strange_worlds.2005.name: "Nghiên Cứu Miễn Dịch Cổ Đại"
 strange_worlds.2005.desc: "§H[universal_macrophage_scientist.GetName]§! đã đệ trình bản dịch một phần của dữ liệu được khôi phục từ cơ sở trên §Y[fromfrom.planet.GetName]§!.\n\n§LPhòng thí nghiệm 17 - Báo cáo tiến độ - Giám đốc Nghiên cứu Gelebor\n\nNguyên mẫu mới đã cho thấy một số tiềm năng ban đầu. Hệ thống miễn dịch của đối tượng đã được tăng cường gấp hàng triệu lần và mọi mầm bệnh đều đã bị đào thải. Tuy nhiên, tác dụng phụ vẫn còn đó: các đột biến chết người xảy ra ngay sau đó, không một ai sống sót. Sẽ thử nghiệm thêm. Tôi tin chắc rằng Đại Thực Bào Vạn Năng đã sắp thành công.§!"
 strange_worlds.2010.name: "Lựa Chọn Của Gelebor"
 strange_worlds.2010.desc: "§H[universal_macrophage_scientist.GetName]§! đã dịch được một tài liệu khác thu hồi từ phòng thí nghiệm bỏ hoang trên §Y[fromfrom.planet.GetName]§!.\n\n§LPhòng thí nghiệm 17 - Ghi chú nội bộ của nhân viên - Giám đốc Nghiên cứu Gelebor\n\nThưa các đồng nghiệp, lệnh chấm dứt dự án đã đến vào hôm nay; Chúa tể đã cạn kiên nhẫn. Nhưng chúng ta chỉ cách mục tiêu một bước nữa thôi! Đại Thực Bào Vạn Năng quan trọng hơn mọi ý tưởng bốc đồng của bất kỳ ai. Chúng ta có thể có một tương lai không còn bệnh tật! Để đạt được tiến bộ như vậy, hy sinh thêm vài sinh mạng nữa thì có đáng là bao?\n\nNếu họ không gửi thêm đối tượng thí nghiệm - tôi sẽ tự thử nghiệm trên chính mình. Các bạn có sát cánh cùng tôi không?§!"
 strange_worlds.2010.a: "Hành sự cẩn trọng."
 strange_worlds.2015.name: "Đại Thực Bào Vạn Năng"
 strange_worlds.2015.desc: "§H[universal_macrophage_scientist.GetName]§! đã dịch được nhật ký cuối cùng trong máy tính của phòng thí nghiệm sinh học trên §Y[fromfrom.planet.GetName]§!.\n\n§LPhòng thí nghiệm 17 - Báo cáo cuối cùng - Trợ lý Nghiên cứu Philedo\n\nSự tự tin của Gelebor chính là thứ chúng tôi mù quáng tin theo.\n\nKhi thử nghiệm nguyên mẫu trên chính bản thân chúng tôi, ban đầu hệ thống miễn dịch đã được tăng cường; chúng tôi gần như có thể miễn nhiễm với mọi mầm bệnh bên ngoài. Sau đó, đột biến bắt đầu diễn ra.\n\nGelebor là người chết đầu tiên. Cái chết cực kỳ bi thảm. Giờ đây toàn bộ nhóm nghiên cứu đều đang nằm trong nhà xác, và tôi cũng sẽ sớm tham gia cùng họ.\n\nChúng tôi đã thất bại. Chúng tôi đã giao phó mạng sống của mình cho công thức sai lầm của Gelebor. Đại Thực Bào Vạn Năng có chức năng quá mạnh - nó cuối cùng sẽ tấn công chính vật chủ. Mọi thứ ở đây phải bị tiêu hủy.§!"
 strange_worlds.2015.a: "Phá hủy toàn bộ"
 strange_worlds.2015.b: "Tiếp tục hoàn thành công việc của Gelebor, điều này có vẻ rất hứa hẹn."
 strange_worlds.2015.b.mutation: "Chúng ta là bậc thầy của đột biến. Hãy hoàn thành công việc này."
 has_tr_mutation_finish_tt: "Lựa chọn này khả dụng vì chúng ta đã hoàn thành Cây Truyền thống §Y$Mutation$§!."
 strange_worlds.2015.c: "Ngay cả nghiên cứu nhiều thiếu sót này cũng có lúc dùng được."
 strange_worlds.2030.name: "Đột Biến Chí Mạng"
 strange_worlds.2030.desc: "Cư dân trên §Y[Root.GetName]§! đang trải qua những đột biến cơ thể nghiêm trọng, chức năng của các tế bào và cơ quan quan trọng đã bị phá hủy. Mặc dù trong một số trường hợp, những thay đổi này làm tăng hiệu quả trao đổi chất, nhưng kết quả phổ biến hơn lại là cái chết.\n\nNhững tác dụng phụ này hoàn toàn trùng khớp với những gì được mô tả trong các ghi chú nghiên cứu ban đầu về §YĐại Thực Bào Vạn Năng§!. Bất chấp nỗ lực của chúng ta, những đột biến chết người do công thức này gây ra dường như là không thể tránh khỏi. Công nghệ này không còn đáng tin cậy nữa. Chúng ta đang tiêu hủy tất cả các công thức còn sót lại và sẽ ngừng sử dụng nó."
 strange_worlds.2030.ct: "§Y[Root.GetName]§! mất 100 £pop£ Pop, và cứ thêm mỗi $@macrophage_kill_pop_every_x$ £pop£ thì mất thêm 100 £pop£ Pop\nTất cả £pop£ Pop hữu cơ trên §Y[Root.GetName]§! nhận đặc điểm §YĐột Biến Gelebor§! và sinh lý bị thay đổi mạnh mẽ."
 site_anomalous_cube: "Khối Lập Phương Bất Thường"
 anomalous_cube_desc: "Một khối lập phương kim loại khổng lồ đã được phát hiện trên §Y[Planet.GetName]§!. Bề mặt hoàn hảo không một vết xước của nó ám chỉ một khả năng công nghệ tiên tiến, nhưng chúng ta vẫn chưa thể suy đoán được nguồn gốc hay chức năng của nó. Các cuộc khai quật khảo cổ có thể cung cấp câu trả lời."
 strange_worlds.2035.name: "Gợn Sóng Kim Loại"
 strange_worlds.2035.desc_intro: "Việc điều tra sâu hơn về khối lập phương bí ẩn khổng lồ trên [fromfrom.planet.GetName] lại mang đến nhiều câu hỏi hơn là câu trả lời. Bề mặt ngoài của nó mịn màng và liền mạch tuyệt đối, máy quét của chúng ta không thể đâm xuyên qua. Khi chúng ta tiến lại gần khối lập phương, bề mặt sáng bóng hùng vĩ của nó đột nhiên gợn sóng nhè nhẹ, phản ứng lại sự xuất hiện của chúng ta."
 strange_worlds.2035.desc_lm: "$strange_worlds.2035.desc_intro$§H[event_target:anomalous_cube_scientist.GetName]§! kết luận rằng nó được chế tạo từ một dạng §YKim Loại Sống§! nào đó."
 strange_worlds.2035.desc_no_lm: "$strange_worlds.2035.desc_intro$§H[event_target:anomalous_cube_scientist.GetName]§! kết luận rằng nó được chế tạo từ một dạng kim loại kỳ lạ chưa từng thấy trước đây."
 strange_worlds.2035.a: "Tiếp tục điều tra."
 strange_worlds.2040.name: "Tiến Vào Khối Lập Phương"
 strange_worlds.2040.desc: "Khi §H[event_target:anomalous_cube_scientist.GetName]§! kiểm tra khối kim loại trên [fromfrom.planet.GetName], một trong các bề mặt đột nhiên gợn sóng và tạo thành một lối mở dẫn vào bên trong vật thể. Vừa bước vào, chúng ta đã phát hiện ra một bảng điều khiển vẫn đang bị chiếm giữ bởi xác thối rữa của một sinh vật thân mềm; bất kể thân xác của nó trước đây ra sao, thì nay chỉ còn là một nắm cát vàng.\n\nChúng ta tìm thấy một thùng chứa bất thường trên bảng điều khiển, bên trong thỉnh thoảng lại phát ra tiếng lạch cạch như thể có thứ gì đó đang chuyển động. Tuy nhiên, lớp niêm phong của thùng chứa này rất phức tạp, §H[event_target:anomalous_cube_scientist.GetName]§! hiện tại vẫn chưa thể mở nó ra."
 strange_worlds.2040.evopred: "Chúng ta chắc chắn có thể thu hồi được mớ bụi này."
 strange_worlds.2045.name: "Phát Hiện Nhật Ký Âm Thanh"
 strange_worlds.2045.desc: "Trong quá trình khai thác dữ liệu từ bảng điều khiển trung tâm của khối lập phương, §H[event_target:anomalous_cube_scientist.GetName]§! đã khôi phục và giải mã được hai đoạn nhật ký âm thanh ngắn, bên trong là một chuỗi những âm thanh gầm gừ và tiếng lách cách chói tai phát ra từ cùng một người nói. Sau khi kiểm tra chéo trong cơ sở dữ liệu ngôn ngữ học, §H[event_target:anomalous_cube_scientist.GetName]§! đã tìm thấy một ngôn ngữ cổ đại khớp với nó, và đưa ra bản dịch dễ hiểu của đoạn nhật ký âm thanh đầu tiên:\n\n§L\"Hỡi các thành viên Đoàn chủ tịch, xin hãy nghe tôi nói. Vẫn còn thời gian để ngăn chặn cuộc chiến này. Sự tự tin của Chúa tể các vị chẳng qua chỉ là nông cạn và thiếu thận trọng mà thôi, làm sao chúng ta có thể đánh bại [event_target:anomalous_cube_fallen_empire.GetName]. Chúng ta sẽ bị hủy diệt!\"\n\n\"Chúng ta chỉ có thể xoa dịu họ. Trong chiếc hộp này là một món quà, có thể dùng làm biểu tượng cho hòa bình: đây chính là kỹ nghệ chế tác tinh xảo của Kim Loại Sống của chúng ta. Muốn thoát khỏi kiếp nạn này, chỉ còn cách mang vật này tặng cho họ.\"§!"
 strange_worlds.2045.a: "Dịch đoạn nhật ký âm thanh thứ hai."
 strange_worlds.2050.name: "Kỳ Quan Kim Loại Sống"
 strange_worlds.2050.desc_intro: "Đoạn tin nhắn âm thanh thứ hai từ bảng điều khiển của khối lập phương cũng đã được dịch xong.\n\n§L\"Hỡi các thành viên Đoàn chủ tịch, tôi đã thất bại. Sự diệt vong của chúng ta là không thể tránh khỏi.\n\nCon tàu khối sáu mặt của tôi đã bị hư hại, sẽ cố gắng hạ cánh khẩn cấp xuống [fromfrom.planet.GetName]. Ngay cả khi tôi may mắn sống sót, tín vật hòa bình này cũng không thể được chuyển giao. [event_target:anomalous_cube_fallen_empire.GetName] sẽ tấn công chúng ta đúng như những gì chúng ta lo sợ.\"§!\n\n§H[event_target:anomalous_cube_scientist.GetName]§! đã phá khóa thành công chiếc hộp. Bên trong là một khối kim loại vô cùng khác thường. Nó có tính dễ uốn và độ phản hồi siêu nhạy, cứ vài giây lại định hình lại thành những hình dạng phức tạp mới."
 strange_worlds.2050.desc_no_war_lm: "\nChúng ta có thể tự giữ lấy thứ kỳ lạ này để đào sâu hiểu biết về Kim Loại Sống, hoặc thay mặt chủ cũ của nó hoàn thành nhiệm vụ ban đầu; tặng nó như một món quà cho [event_target:anomalous_cube_fallen_empire.GetName] để cải thiện quan hệ với họ."
 strange_worlds.2050.desc_no_war_no_lm: "\nChúng ta có thể tự giữ lấy thứ kỳ lạ này để đào sâu hiểu biết về thứ kim loại xuất sắc này, hoặc thay mặt chủ cũ của nó hoàn thành nhiệm vụ ban đầu; tặng nó như một món quà cho [event_target:anomalous_cube_fallen_empire.GetName] để cải thiện quan hệ với họ."
 strange_worlds.2050.desc_war_lm: "\nMón đồ độc đáo này cùng với nguồn gốc của con tàu lập phương có thể làm sâu sắc thêm sự hiểu biết của chúng ta về Kim Loại Sống."
 strange_worlds.2050.desc_war_no_lm: "\nMón đồ độc đáo này cùng với nguồn gốc của con tàu lập phương có thể làm sâu sắc thêm sự hiểu biết của chúng ta về cấu trúc và hợp chất kim loại."
 strange_worlds.2050.a_no_war: "Tặng nó cho [event_target:anomalous_cube_fallen_empire.GetName]."
 strange_worlds.2050.b_fallen_not_defeated_no_war: "Giữ làm của riêng."
 strange_worlds.3005.name: "Nhà Tiên Tri Khả Nghi"
 strange_worlds.3005.desc: "Khi quan sát cư dân bản địa trên §Y[event_target:pre_ftl_planet.GetName]§!, đội ngoại tuyến của chúng ta đã phát hiện ra một điều thú vị.\n\nKhắp các hang cùng ngõ hẻm ở thủ đô nơi đây đều đang rỉ tai nhau về một \"Người Được Chọn\", tương truyền là giáng trần từ giữa các vì sao để thực hiện một lời tiên tri cổ đại, và sẽ dẫn dắt [event_target:pre_ftl_planet.Owner.GetSpeciesName] bước vào kỷ nguyên vàng tiếp theo.\n\nTất cả nhân viên của chúng ta đều đang được ghi nhận làm việc đúng vị trí, vậy nên rốt cuộc ai đang viếng thăm hành tinh này là một điều rất đáng để điều tra sâu hơn."
 strange_worlds.3005.a: "Tiếp tục điều tra."
 strange_worlds.3010.name: "Nhà Tiên Tri Giả"
 strange_worlds.3010.desc_intro: "Đội ngoại tuyến của chúng ta đang điều tra sâu hơn về kẻ tự xưng là \"Người Được Chọn\" trên §Y[event_target:pre_ftl_planet.GetName]§! để vạch trần bộ mặt thật của hắn.\n\n"
 strange_worlds.3010.desc_no_megacorp: "Một §Ykẻ lang thang Numa§! đã ngụy trang thành nhân vật cốt lõi trong thần thoại của [event_target:pre_ftl_planet.Owner.GetSpeciesName], \"giáng trần từ giữa các vì sao\"."
 strange_worlds.3010.desc_megacorp: "Một kẻ lang thang §Y[event_target:caravaneer_fleet3_country.GetSpeciesName]§! đã ngụy trang thành nhân vật cốt lõi trong thần thoại của [event_target:pre_ftl_planet.Owner.GetSpeciesName], \"giáng trần từ giữa các vì sao\"."
 strange_worlds.3010.desc_outro: "\nViệc khám phá sâu hơn trên hành tinh này tiết lộ rằng hắn đã giấu con tàu bị rơi của mình trong một hẻm núi không thể tiếp cận, cách xa thủ đô. Dựa trên mẫu động cơ hyperdrive cũ rích của nó, có vẻ như tên này đã ở đây được vài năm rồi.\n\nKể từ khi bị mắc kẹt tại đây, hắn dường như bắt đầu lợi dụng sự mê tín của người dân địa phương để trục lợi. Hắn được bổ nhiệm làm một người trị vì mang \"trí tuệ thiên đàng\" và thản nhiên tiếp nhận sự tôn thờ của dân chúng.\n\nNếu cứ để mặc, sự hiện diện của kẻ lừa đảo này trên hành tinh rất có thể sẽ gây ra những tác động nghiêm trọng đến sự phát triển của xã hội, tốt nhất là nên can thiệp và giải quyết."
 strange_worlds.3010.a: "Vạch trần chân tướng của tên lừa đảo này."
 strange_worlds.3010.b: "Đề nghị đưa hắn rời đi."
 strange_worlds.3015.name: "Sự Thật Phơi Bày"
 strange_worlds.3015.desc_no_megacorp: "Chúng ta đã vạch trần chân tướng của §Ykẻ lang thang Numa§! giả dạng làm \"Người Được Chọn\" trong thần thoại của [event_target:pre_ftl_planet.Owner.GetSpeciesName] trên §Y[event_target:pre_ftl_planet.GetName]§!."
 strange_worlds.3015.desc_megacorp: "Chúng ta đã vạch trần chân tướng của tên §Y[event_target:caravaneer_fleet3_country.GetSpeciesName]§! giả dạng làm \"Người Được Chọn\" trong thần thoại của [event_target:pre_ftl_planet.Owner.GetSpeciesName] trên §Y[event_target:pre_ftl_planet.GetName]§!."
 strange_worlds.3015.desc_outro: "\nSau khi điều tra sâu hơn về các truyền thuyết địa phương, chúng ta đã nói với họ rằng giai cấp thống trị tự xưng là Người Được Chọn thực chất là một con quỷ được phái xuống để lừa gạt họ, và sẽ mang đến cho thế giới này hàng ngàn năm tăm tối.\n\nChúng ta đã tháo dỡ hoàn toàn con tàu bị rơi thành từng mảnh vụn, để người dân địa phương không thể tìm thấy dấu vết nào. Tuy nhiên, một số vật dụng cá nhân đã bị phát hiện, và chủng tộc này đã bắt đầu có được cái nhìn thoáng qua về công nghệ vượt xa tầm hiểu biết hiện tại của họ."
 strange_worlds.3015.a: "Thật bất hạnh."
 strange_worlds.3020.name: "Hồi Hương"
 strange_worlds.3020.desc_intro: "Đội ngoại tuyến của chúng ta đã có cơ hội gặp mặt riêng với kẻ tự xưng là \"Người Được Chọn\" trên §Y[event_target:pre_ftl_planet.GetName]§!, đề nghị sửa chữa tàu và đưa hắn trở lại không gian.\n\n"
 strange_worlds.3020.desc_no_megacorp: "Tên §Ylang thang Numa§! đó vội vàng đồng ý với lời mời của chúng ta, liên tục thanh minh rằng hắn vô tình bị nhầm là thần thánh khi mắc kẹt trên §Y[event_target:pre_ftl_planet.GetName]§!, và sau đó luôn sống trong nơm nớp lo sợ bị hãm hại nếu sự việc bại lộ."
 strange_worlds.3020.desc_megacorp: "Tên §Y[event_target:caravaneer_fleet3_country.GetSpeciesName]§! đó vội vàng đồng ý với lời mời của chúng ta, liên tục thanh minh rằng hắn vô tình bị nhầm là thần thánh khi mắc kẹt trên §Y[event_target:pre_ftl_planet.GetName]§!, và sau đó luôn sống trong nơm nớp lo sợ bị hãm hại nếu sự việc bại lộ."
 strange_worlds.3020.desc_outro: "\nSau khi đưa hắn đến trạm nghiên cứu của chúng ta và sửa chữa xong con tàu, lữ khách đầy lòng biết ơn này đã tặng lại cho chúng ta phần lớn vật tư có trên tàu và trịnh trọng gửi lời chào tạm biệt.\n\nKhoảng trống quyền lực do sự ra đi của hắn để lại đã châm ngòi cho một cuộc đấu tranh ngắn ngủi nhưng đẫm máu giữa các giáo phái khác nhau trên §Y[event_target:pre_ftl_planet.GetName]§!, và hiện tại cũng đang có dấu hiệu lắng xuống."
 strange_worlds.3020.a: "Thật thú vị."
 strange_worlds.3025.name: "[event_target:nomad01_country.GetName]"
 strange_worlds.3025.desc: "Xin chào [Owner.GetSpeciesName]. Chúng tôi được biết các bạn vừa xử lý một tên du côn Numa tách khỏi hạm đội của chúng tôi.\n\nCác bạn đã giúp đỡ rất nhiều. Kẻ lầm đường lạc lối này luôn là một gánh nặng, những tham vọng điên rồ của hắn đã mang lại rủi ro cho hành trình của chúng tôi.\n\nXin hãy nhận món quà này như một lời cảm ơn."
 strange_worlds.3025.a: "Vô cùng cảm ơn."
 strange_worlds.3030.name: "[event_target:caravaneer_home_country.GetName]"
 strange_worlds.3030.desc: "[Owner.GetSpeciesNamePlural] đã dọn dẹp thứ §YRác rưởi§! mà chúng tôi đánh mất sao? Các bạn tốt bụng thật đấy! Tên ngốc đó ngoài việc rước họa vào thân thì chẳng làm được trò trống gì. Còn mấy lời nhảm nhí của hắn thì sao? Thật đáng tiếc, đây đã là lần thứ năm của hắn rồi. Thật chứ? Chúng tôi rất vui vì hắn đã cút xéo.\nXin hãy nhận lấy thứ này, đây là quà cảm ơn vì các bạn đã giải quyết giúp một đống rắc rối. Thuận mua vừa bán, đây là đồ tốt đấy."
 strange_worlds.3030.a: "Vô cùng cảm ơn."
 strange_worlds.3040.name: "Vật Bị Bỏ Quên"
 strange_worlds.3040.desc: "Trạm quan sát của chúng ta trên quỹ đạo của §Y[event_target:pre_ftl_planet.GetName]§! đã báo cáo về việc mất tích một thùng tiếp tế sau cuộc khảo sát địa chất bề mặt gần đây.\n\nTrong quá trình định vị địa lý thùng tiếp tế, chúng ta phát hiện nó đã bị một ngôi làng địa phương tìm thấy và chiếm dụng.\n\nSự hiện diện của thùng tiếp tế có thể gây ảnh hưởng bất lợi cho sự phát triển của xã hội [event_target:pre_ftl_planet.Owner.GetSpeciesAdj]."
 strange_worlds.3040.a: "Thật không may."
 strange_worlds.3045.name: "Vật Quy Nguyên Chủ"
 strange_worlds.3045.desc_common: "Có vẻ như, thùng tiếp tế vô tình rơi xuống §Y[event_target:pre_ftl_planet.GetName]§! đã tạo ra một ảnh hưởng kỳ lạ đối với văn hóa địa phương.\n\nCư dân [Root.GetPreFTLUpper] địa phương đã chế tạo một bản sao thô kệch của tàu quan sát của chúng ta. Dù những \"con tàu\" này rõ ràng là không thể hoạt động, nhưng điều này chứng tỏ rằng các nhà nghiên cứu của chúng ta đã bị người dân địa phương phát hiện trong quá trình khảo sát.\n\nDưới sự hướng dẫn của một già làng địa phương, có thể thấy một nhóm [event_target:pre_ftl_planet.Owner.GetSpeciesName] đang bắt chước quy trình phân tích đất đá địa chất của chúng ta: họ đổ đầy bùn và đất đá vào cái thùng mà chúng ta bỏ quên, mang chúng lên \"con tàu\" của họ và kiên nhẫn chờ đợi."
 strange_worlds.3045.desc_non_homicidal: "\n[event_target:pre_ftl_planet.Owner.GetSpeciesName] nghĩ rằng bằng cách bắt chước hành động của chúng ta, sẽ có thêm hàng hóa xuất hiện. Chúng ta nên can thiệp trước khi hành vi này gây ra tác động lớn hơn đến xã hội của họ."
 strange_worlds.3045.desc_homicidal: "\nLàm vậy chỉ phí công vô ích, thứ chờ đợi họ chỉ có cái chết mà thôi."
 strange_worlds.3045.a_normal: "Lặng lẽ thu hồi thùng đồ của chúng ta."
 strange_worlds.3045.a_megacorp: "Thu hồi tài sản của chúng ta một cách riêng biệt."
 strange_worlds.3045.b_normal: "Dùng thực phẩm để đổi lấy khoáng sản của họ."
 strange_worlds.3045.b_megacorp: "Làm một vụ giao dịch thôi!"
 strange_worlds.3045.c: "Làm thịt lũ sinh vật nguyên thủy này."
 strange_worlds.3045.ct: "Trạm quan sát đang theo dõi §Y[event_target:pre_ftl_planet.GetName]§! sẽ sản xuất $@observation_outpost_crate_minerals_production$$i_minerals$, phí duy trì $@observation_outpost_crate_food_upkeep$$i_food$"
 strange_worlds.3050.name: "Sự Vắng Mặt Đáng Căm Phẫn"
 strange_worlds.3050.desc: "Sau khi thu hồi chiếc rương thất lạc trên §Y[event_target:pre_ftl_planet.GetName]§!, nghi lễ chất đồ lên \"tàu\" vẫn tiếp diễn thêm một thời gian, cho đến khi những [event_target:pre_ftl_planet.Owner.GetSpeciesName] giận dữ tìm đến già làng, ném họ vào chiếc \"tàu con thoi\" rởm và thiêu rụi họ thành tro.\n\nMặc dù mọi người đã quay trở lại với cuộc sống thường nhật, nhưng sự căm phẫn đối với \"những người từ trên trời\" vẫn còn in hằn trong văn hóa của họ."
 strange_worlds.3050.a: "Đã rõ."
 strange_worlds.3060.name: "Hủy Bỏ Dịch Vụ"
 strange_worlds.3060.desc: "Cùng với sự phát triển xã hội của [Root.GetPreFTLLower] [event_target:pre_ftl_planet.Owner.GetSpeciesName], chúng ta đã ngừng trao đổi tài nguyên với họ từ trạm quan sát.\n\nMặc dù đây là một thử nghiệm rất thú vị, nhưng việc tiếp tục gây ảnh hưởng đến xã hội của họ sẽ chỉ khiến chúng ta bại lộ trước mặt họ quá sớm."
 strange_worlds.3060.a: "Một biện pháp có thể hiểu được."
 strange_worlds.3060.ct: "Trạm quan sát này không còn sản xuất khoáng sản và cũng không cần thực phẩm để duy trì nữa"
 strange_worlds.3070.name: "Dị Thường Quỹ Đạo"
 strange_worlds.3070.desc: "Một đợt dị thường trọng lực đã làm trạm quan sát của chúng ta chệch khỏi quỹ đạo của §Y[event_target:pre_ftl_planet.GetName]§!, khiến nó rơi vào bầu khí quyển tầng thấp của hành tinh trong thời gian ngắn.\n\nMặc dù phi hành đoàn không bị thương và đã khôi phục lại quỹ đạo ban đầu, nhưng có một nỗi lo ngại rằng trạm quan sát có thể đã bị những [event_target:pre_ftl_planet.Owner.GetSpeciesNamePlural] trên mặt đất phát hiện.\n\nChỉ có thời gian mới trả lời được liệu chúng ta có bị lộ hay không, và điều này sẽ tác động thế nào đến xã hội của họ."
 strange_worlds.3070.a: "Tiếp tục quan sát."
 strange_worlds.3075.name: "Chiếc Thang Lên Trời"
 strange_worlds.3075.desc_common: "Khi trạm quan sát của chúng ta rơi vào quỹ đạo tầng thấp của §Y[event_target:pre_ftl_planet.GetName]§!, nó đã bị ghi lại bởi công nghệ hình ảnh nguyên thủy. Cùng với bằng chứng của các nhân chứng, những bức ảnh này đã tạo động lực cho một số quốc gia chế tạo \"Chiếc thang lên trời\" để tiếp tục điều tra nghiên cứu.\n\nMặc dù đây là một nỗ lực vô ích, sự cạnh tranh giữa các quốc gia dân tộc đã dẫn đến sự bất ổn. Bị thôi thúc bởi lòng tự hào dân tộc và sự khan hiếm tài nguyên, trong cuộc đua hoàn thành \"nấc thang\" đầu tiên, những căng thẳng cũ đã bùng cháy trở lại."
 strange_worlds.3075.desc_non_homicidal: "\nNếu có thể bác bỏ các bằng chứng về sự tồn tại của chúng ta, chúng ta có thể làm dịu bớt căng thẳng trước khi tình hình vượt khỏi tầm kiểm soát.\n\nThái độ ngoại giao giữa các thực thể chính trị [Root.GetPreFTLUpper] này cũng có thể đóng vai trò như một trường hợp nghiên cứu xã hội học rất thú vị, mặc dù nó vẫn có nguy cơ trở thành mồi lửa cho sự leo thang bạo lực."
 strange_worlds.3075.desc_homicidal: "\nSự hỗn loạn sắp tới sẽ là một cơ hội nghiên cứu tuyệt vời."
 strange_worlds.3075.a: "Bác bỏ sự tồn tại của chúng ta."
 strange_worlds.3075.b: "Tiếp tục quan sát."
 strange_worlds.3075.b_ct: "Sản lượng nghiên cứu £society£ §YXã Hội Học§! của Trạm quan sát tăng gấp đôi"
 strange_worlds.3080.name: "Một Sự Thật Khác"
 strange_worlds.3080.desc: "Các đặc vụ của chúng ta đã thành công trong việc lật đổ những bằng chứng về sự tồn tại của chúng ta trên §Y[event_target:pre_ftl_planet.GetName]§!.\n\nSau khi những hình ảnh bị lật tẩy và độ tin cậy của các nhân chứng bị phá hủy, việc xây dựng \"Chiếc thang lên trời\" đã dừng lại. Hai quốc gia từng chia rẽ nay cảm thấy xấu hổ vì bị coi là ngu ngốc, họ đã cam kết sẽ theo đuổi sự khám phá hợp lý và phương pháp khoa học.\n\nCùng với việc một thế hệ học giả mới tập hợp lại, bức màn bí ẩn về truyền thuyết \"Lâu đài trên không\" đã được vén lên, và công trường xây dựng chiếc thang nay đã được cải tạo thành trung tâm giáo dục đại học."
 strange_worlds.3080.a: "$FASCINATING$"
 strange_worlds.3080.a_ct: "[event_target:pre_ftl_country.GetName] tiến thêm 50% đến Thời đại tiếp theo\n[event_target:pre_ftl_country.GetName] chuyển sang Duy vật luận."
 strange_worlds.3085.name: "Đại Chiến Thang Trời"
 strange_worlds.3085.desc: "Trong quá trình xây dựng \"Chiếc thang lên trời\", căng thẳng giữa các quốc gia [Root.GetPreFTLLower] trên §Y[event_target:pre_ftl_planet.GetName]§! đã dẫn đến một cuộc xung đột quét qua toàn cầu. Vì tranh giành nguồn tài nguyên đang cạn kiệt, cuộc thảm sát kéo dài hai năm mang tên \"Đại Chiến Thang Trời\" cuối cùng cũng đã kết thúc.\n\nĐiều khoản quan trọng nhất trong hiệp ước hòa bình là hình thành một mặt trận thống nhất để chống lại kẻ thù chung, \"Pháo Đài Trên Không\". Khi những [event_target:pre_ftl_planet.Owner.GetSpeciesNamePlural] bắt đầu công cuộc tái thiết hành tinh đang bị tàn phá bởi chiến tranh, hội chứng hoang tưởng và sự thù hận đối với những điều chưa biết của họ sẽ khiến cho việc tương tác với họ trong tương lai trở nên vô cùng khó khăn."
 strange_worlds.3085.a: "Đó là chuyện của sau này."
 strange_worlds.3085.a_ct: "Sản lượng nghiên cứu £society£ §YXã Hội Học§! từ Trạm quan sát trở lại bình thường"
 create_hibernators_pops_ct: "Tạo $@hibernators_pops_created|*0$ £job_pre_sapient£ Pop Bán tri giác với đặc điểm §Y$trait_seasonal_dormancy$§!"
 pm_bleeding_planet: "Hành Tinh Rỉ Máu"
 pm_bleeding_planet_desc: "Thậm chí cả mặt đất cũng đang rỉ máu. Những cư dân cần phải thận trọng khi xáo trộn vùng đất dưới chân mình.\n"
 pm_contruction_coagulate: "Đông Máu Xây Dựng"
 pm_contruction_coagulate_desc: "Mặt đất đang rỉ máu vì sự hiện diện của cư dân, chất bùn dính giống như một loại chất kết dính tự nhiên nhưng đầy nguy hiểm.\n"
 pm_hemosymbiosis: "Huyết Cộng Sinh"
 pm_hemosymbiosis_desc: "Chất lỏng kỳ lạ đến từ sâu bên trong hành tinh này đang cản trở việc tiếp tục phát triển. Mặc dù nó giúp rút ngắn thời gian xây dựng và thúc đẩy công việc khai thác, nhưng cái giá phải trả là sự tăng trưởng của thuộc địa.\n"
 pm_parasitic_production: "Sản Xuất Ký Sinh"
 pm_parasitic_production_desc: "Các dạng sống ký sinh trên hành tinh này đang được tận dụng để gia tăng sản lượng của tất cả công nhân.\n"
 pm_frying_fauna: "Nướng Chín Động Vật"
 pm_frying_fauna_desc: "Hệ động vật khổng lồ của hành tinh phát triển mạnh mẽ trong điều kiện tối ưu. Các enzym tiêu hóa độc đáo của chúng rất hữu ích trong quá trình luyện kim."
 pm_frying_fauna_machine: "$pm_frying_fauna$"
 pm_frying_fauna_machine_desc: "$pm_frying_fauna_desc$"
 pm_frying_fauna_2: "$pm_frying_fauna$"
 pm_frying_fauna_2_desc: "Các thiết bị thu hoạch bằng điện giật đã biến những động vật khổng lồ trên hành tinh này thành một nguồn cung cấp dinh dưỡng ổn định."
 pm_frying_fauna_2_machine: "$pm_frying_fauna$"
 pm_frying_fauna_2_machine_desc: "$pm_frying_fauna_2_desc$"
 pm_catalytic_excrement: "Phân Xúc Tác"
 pm_catalytic_excrement_ct: "Hệ động vật khổng lồ của hành tinh phát triển mạnh mẽ trong điều kiện tối ưu. Các enzym tiêu hóa độc đáo của chúng rất hữu ích trong quá trình luyện kim."
 pm_strange_sandstorm: "Bão Cát Kỳ Dị"
 pm_strange_sandstorm_ct: "Hiện tượng độc đáo của cát trên hành tinh này đang gây ảnh hưởng đến hoạt động của thuộc địa."
 pm_perpetual_lightning: "Sét Vĩnh Cửu"
 pm_perpetual_lightning_desc: "Các tinh thể nhiễm bức xạ bị phơi bày trong quá trình dị thường cải tạo môi trường đã tạo ra điều kiện thời tiết hoàn hảo cho những cơn bão sấm chớp vĩnh cửu trên hành tinh."
 pm_dark_matter_geyser: "Mạch Nước Phun Vật Chất Tối"
 pm_dark_matter_geyser_desc: "Hành tinh này đang chìm trong màn sương mù Vật Chất Tối."
 pm_population_quarantine: "Cách Ly Dân Số"
 pm_population_quarantine_desc: "Trong quá trình điều tra ảnh hưởng của quá trình hóa thạch Vật Chất Tối, dân số đang bị cách ly."
 pm_dark_matter_statue: "Bức Tượng Vật Chất Tối"
 pm_dark_matter_statue_desc: "Cơ thể bị hóa thạch được tạo ra bởi Vật Chất Tối đông đặc đang nằm rải rác khắp hành tinh. Phần còn lại của những Pop này mang đến một số cơ hội để nghiên cứu."
 pm_raining_corpses: "Mưa Xác Chết"
 pm_raining_corpses_desc: "Những đám mây dày đặc từng được một chủng tộc ngoài hành tinh sử dụng làm nghĩa trang nay đang mỏng dần, đổ các phần bên trong của ngôi mộ mây này xuống bề mặt hành tinh."
 pm_raining_corpses_tt: "Các Công việc £job£ $WORKERS$ sản xuất £minor_artifacts£ $minor_artifacts$"
 pm_raining_corpses_no_ancrel: "$pm_raining_corpses$"
 pm_raining_corpses_no_ancrel_desc: "$pm_raining_corpses$"
 pm_raining_corpses_no_ancrel_tt: "Các Công việc £job£ £pop_cat_worker£ $pop_cat_worker$ sản xuất £consumer_goods£ $consumer_goods$"
 pm_revolting_pests: "Côn Trùng Gây Buồn Nôn"
 pm_revolting_pests_desc: "Động vật trên hành tinh này vừa bí ẩn vừa gớm ghiếc. Không khuyến cáo đến gần những sinh vật này."
 pm_gaseous_fauna: "Động Vật Khí Cấp"
 pm_gaseous_fauna_desc: "Một loài động vật bản địa ngoan ngoãn đang cung cấp sự giải trí và chất tiết dạng khí có thể thu hoạch được cho cư dân trên hành tinh."
 pm_gaseous_fauna_ct: "Tất cả £pop£ Pop sản xuất §G$@gaseous_fauna_exotic_gases_production$§! $i_exotic_gases$"
 pm_urban_privilege_regular: "Đặc Quyền Thành Thị"
 pm_urban_privilege_regular_desc: "Việc đứng về phía thành thị trong các cuộc tranh chấp khu vực khiến cho vùng nông thôn cảm thấy vô cùng bất an."
