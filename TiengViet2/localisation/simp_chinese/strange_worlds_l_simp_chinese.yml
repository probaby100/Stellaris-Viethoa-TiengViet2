 tech_enhanced_cryosleep_sedatives: "Thuốc An Thần Ngủ Đông Tăng Cường"
 tech_enhanced_cryosleep_sedatives_desc: "Loại thuốc an thần dựa trên một enzym hiếm có này có thể kích hoạt trạng thái ngủ đông sâu, nâng cao đáng kể khả năng chịu đựng của các loài hữu cơ trong những chuyến du hành không gian đường dài."
 tech_universal_marcophage: "Đại Thực Bào Vạn Năng"
 tech_universal_marcophage_desc: "Những chất tăng cường miễn dịch mạnh mẽ này khiến bệnh tật chỉ còn là dĩ vãng, giúp các Pop hữu cơ sống lâu hơn, khỏe mạnh hơn. Nhưng có thể gây ra những tác dụng phụ nghiêm trọng."
