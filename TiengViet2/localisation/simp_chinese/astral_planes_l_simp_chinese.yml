 action_dimensional_lock_desc: "Bằng cách điều chỉnh tàu của chúng ta để có tính chất lượng tử đồng bộ hoàn toàn với một vùng không gian gấp khúc, chúng ta có thể làm cho tần số của nó song song với chúng ta. Tuy nhiên, sự đồng bộ này không phải là mãi mãi. Những kẽ hở kiểu này sẽ dần dần trở lại khuynh hướng tự nhiên của chúng."
