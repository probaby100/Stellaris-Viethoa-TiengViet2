 r_continuum: "Continuum"
 r_continuum_desc: "Một lõi vàng thuộc cơ chế trình tự thời gian siêu không gian, thiết bị phi thường này có thể thao túng thời gian tựa như cách nó điều khiển các bánh răng của chính mình."
 r_eternal_throne: "Ngai vàng Vĩnh cửu"
 r_eternal_throne_desc: "Một bến cảng siêu không gian có khả năng ban tặng sự sống vĩnh hằng. Những ai chịu ảnh hưởng của nó sẽ tồn tại trong một thực tại không có sợ hãi, không có kỳ tích, và cũng không có điểm kết thúc."
 eternal_throne_active_effect_tt: "Tất cả nhà lãnh đạo trở nên bất tử."
 eternal_throne_modifier: "Đồng điệu Cõi sao"
