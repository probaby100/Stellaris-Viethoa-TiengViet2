l_simp_chinese:
 ASTRAL_PLANES_TITLE: "Astral Planes" # Không dịch
 DLC_ASTRAL_PLANES_RECOMMENDATION_DESC: "§S$ASTRAL_PLANES_TITLE$§! là một bản mở rộng thiên về cốt truyện với nội dung phong phú, nơi bạn có thể khám phá các chiều không gian khác, hoặc tùy ý nhào nặn cấu trúc của thực tại."
 DLC_ASTRAL_PLANES_RECOMMENDATION_REC_1: "Chúng tôi đề xuất §SAstral Planes§!, nó có thể kết hợp với DLC §SOverlord§! để khai thác sâu hơn tính linh hoạt của Trạm trung chuyển Siêu không gian và Máy phóng Lượng tử."
 DLC_ASTRAL_PLANES_RECOMMENDATION_REC_2: "Chúng tôi đề xuất §SAstral Planes§!, nó có thể mang đến những cơ hội khám phá mới về các nền văn minh Tiền bối trong §SAncient Relics§!."
 ##################
 #Astral Actions #
 ##################
 ASTRAL_ACTIONS: "Hành động Cõi sao"
 ASTRAL_ACTIONS_TAB_DISABLED: "Được mở khóa thông qua công nghệ £physics£ §Y$tech_astral_harvesting$§!."
 ASTRAL_ACTION_REMAINING_USAGES: "($LEFT|0$/$TOTAL|0$)"
 ASTRAL_ACTION_REMAINING_USAGES_DESC: "Hành động này có thể được sử dụng tổng cộng $TOTAL|0$ lần. Bạn còn lại $LEFT|0$ lần sử dụng."
 ASTRAL_ACTION_UNIQUE_USAGE_DESC: "Hành động này chỉ có thể sử dụng một lần."
 ASTRAL_ACTION_UNIQUE_USAGE_DESC_FLEET_ABILITY: "Hành động này chỉ có thể sử dụng một lần và sẽ bổ sung thêm tính năng mới cho phi thuyền của bạn."
 ASTRAL_ACTION_RIFT_REQUIREMENT_DESC: "Bạn phải hoàn thành §Y1§! nhiệm vụ Vết nứt Cõi sao để mở khóa hành động này."
 ASTRAL_ACTION_RIFT_REQUIREMENT_DESC_PLURAL: "Bạn phải hoàn thành $NUM_RIFTS|Y$ nhiệm vụ Vết nứt Cõi sao để mở khóa hành động này."
 ASTRAL_ACTION_COOLDOWN_VALUE: "£time£$VALUE|0$"
 ASTRAL_ACTION_COOLDOWN_TOOLTIP: "Thời gian hồi Hành động Cõi sao: £time£§Y$VALUE|0$§!"
 ASTRAL_ACTION_COOLDOWN_ACTIVE: "$TRIGGER_FAIL$§RHành động này cần thêm $VALUE|Y$ ngày để hồi chiêu.§!"
 MESSAGE_ASTRAL_ACTION_UNLOCKED_TITLE: "Có Hành động Cõi sao mới."
 alert_astral_action_available_title: "$ASTRAL_ACTIONS$"
 alert_astral_action_available_instant: "Có ít nhất một Hành động Cõi sao khả dụng."
 alert_astral_action_available_instruction: "§GClick để mở giao diện Hành động Cõi sao§!"
 ALERT_ASTRAL_ACTION_AVAILABLE_DETAIL: "$ACTION_NAME$ đã chuẩn bị xong."
 action_astral_boost: "Tăng tốc Cõi sao"
 action_astral_boost_desc: "Trang bị $ASTRAL_THREADS_ICON$ lên động cơ phi thuyền của chúng ta, giúp tăng cường khả năng cơ động."
 action_hyper_relay_insight: "Nhận thấu hiểu về Trạm trung chuyển Siêu không gian"
 action_hyper_relay_insight_desc: "Đặc tính độc đáo của $ASTRAL_THREADS_ICON$ giúp chúng ta hiểu rõ hơn về cách gấp khúc không gian."
 action_quantum_catapult_insight: "Nhận thấu hiểu về Máy phóng Lượng tử"
 action_quantum_catapult_insight_desc: "Đặc tính độc đáo của $ASTRAL_THREADS_ICON$ giúp chúng ta hiểu rõ hơn về cách vượt qua giới hạn của du hành siêu quang tốc."
 action_quantum_catapult_insight_2: "Hiệu chỉnh Cõi sao"
 action_quantum_catapult_insight_2_desc: "Bằng cách khai thác sâu hơn sức mạnh của $ASTRAL_THREADS_ICON$, chúng ta có thể nâng cao độ chính xác của Máy phóng Lượng tử."
 action_quantum_catapult_insight_2_requirement_tooltip: "$TRIGGER_FAIL$§RCần sở hữu một §YMáy phóng Lượng tử§!.§!"
 action_exodus_jump_insight: "Nắm vững Kỹ thuật Nhảy vọt Di tản"
 action_exodus_jump_insight_desc: "$action_quantum_catapult_insight_desc$"
 action_exodus_jump_insight_2: "$action_quantum_catapult_insight_2$"
 action_exodus_jump_insight_2_desc: "Khai thác sâu hơn sức mạnh của $ASTRAL_THREADS_ICON$ giúp chúng ta nâng cao độ chuẩn xác cho $sm_arkship_exodus_jump$."
 action_exodus_jump_insight_2_requirement_tooltip: "$TRIGGER_FAIL$§RCần có Tàu cứu thế trang bị §Y$sm_arkship_exodus_jump$§!.§!"
 action_summon_dimensional_fleet: "Triệu hồi Hạm đội Đa chiều"
 action_summon_dimensional_fleet_desc: "Sự hòa hợp của chúng ta với mặt phẳng Cõi sao đã trở nên sâu sắc hơn. Giờ đây, chúng ta có thể triệu hồi các chiến binh Đa chiều đến hỗ trợ cho sự nghiệp của mình. Về việc họ đến từ đâu và vì sao lại đến, hiện tại vẫn chưa thể biết rõ."
 action_summon_dimensional_fleet_tooltip: "Triệu hồi một hạm đội hùng mạnh từ một không thời gian vô định. Họ có thể ở lại chiều không gian của chúng ta tối đa 10 năm."
 NAME_Astral_Avatar: "Hóa thân Cõi sao"
 NAME_Astral_Avatar_Small: "$NAME_Astral_Avatar$ cỡ nhỏ"
 NAME_Dimensional_Fleet: "Hạm đội Đa chiều"
 MESSAGE_DIMENSIONAL_FLEET_DESTROYED_TITLE: "Hạm đội Đa chiều rút lui"
 MESSAGE_DIMENSIONAL_FLEET_DESTROYED_DESC: "Hạm đội Đa chiều mà chúng ta triệu hồi đã quay trở về mặt phẳng tồn tại ban đầu của họ. Không để lại một dấu vết nào."
 action_astral_splitting: "Phân hạch Cõi sao"
 action_astral_splitting_desc: "Bằng cách dệt thêm nhiều $ASTRAL_THREADS_ICON$ vào kết cấu mỏng manh của không gian, chúng ta có thể nhân tạo ra một vết nứt thực tại. Tuy nhiên, nếu thử quá thường xuyên, hệ sao sẽ có nguy cơ bị xé toạc thành từng mảnh."
 action_astral_splitting_no_rift_spawning_location: "$TRIGGER_FAIL$§RChúng ta không có hệ sao nào khả dụng để tạo ra vết nứt mới.§!"
 action_astral_splitting_tooltip: "Tạo ra một $ASTRAL_RIFT$ trong một hệ sao ngẫu nhiên do bạn kiểm soát.\nPhải kiểm soát một hệ sao không nằm kề các $ASTRAL_RIFTS$ khác."
 action_astral_splitting_nomad_tooltip: "Tạo ngẫu nhiên một $ASTRAL_RIFT$ tại hệ sao có $waystation$ của chúng ta.\nPhải có một $waystation$ nằm trong hệ sao không giáp ranh với $ASTRAL_RIFTS$."
 action_astral_splitting_too_many_rifts: "$TRIGGER_FAIL$§RChúng ta đã đẩy khả năng cưỡng chế mở ra các vết nứt không thời gian mới đến giới hạn cực đại.§!"
 action_astral_splitting_no_rift_spawning_location_tt: "§RChúng ta không có hệ sao khả dụng để phân hạch tạo vết nứt mới.§!"
 action_gain_physics_insight: "Nhận thấu hiểu Vật lý học"
 action_gain_physics_insight_desc: "Cho phép các nhà khoa học sử dụng $ASTRAL_THREADS_ICON$ để thúc đẩy sự hiểu biết của chúng ta về vật lý học."
 action_lateral_artifacting: "Trưng bày Song song"
 action_lateral_artifacting_desc: "Chúng ta có thể thao túng dòng thời gian để cho phép sử dụng đồng thời hai Di vật hùng mạnh."
 action_lateral_artifacting_tooltip: "Có thể kích hoạt Di vật thứ hai khi thời hạn chuyến lưu diễn hiện tại chưa kết thúc."
 action_lateral_artifacting_not_same_relic: "$TRIGGER_FAIL$§RDi vật này đã được kích hoạt.§!"
 astral_jump: "Bước nhảy Cõi sao"
 gain_physics_insight_modifier: "$action_gain_physics_insight$"
 astral_boost_modifier: "$action_astral_boost$"
 quantum_catapult_insight_2_modifier: "$action_quantum_catapult_insight_2$"
 quantum_catapult_insight_2_modifier_tt: "$quantic_ambush$$MOD_SHIP_FIRE_RATE_MULT$. §G+[GetQuantumCatapulInsight2QuanticAmbush]§!\nThời gian duy trì biến đổi $quantic_ambush$: §G+100%§!"
 fold_hyperspace_modifier: "$artifact_fold_hyperspace$"
 action_remaining_astral_actions_locked: "$artifact_action_locked$"
 action_remaining_astral_actions_locked_desc: "Các nhà khoa học của chúng ta tin chắc rằng, việc khám phá ra các công nghệ mới có thể giúp mở khóa thêm nhiều hành động $ASTRAL_THREADS_ICON$ bổ sung."
 action_astral_action_locked_failtext: "Mở khóa một Hành động Cõi sao mới."
 action_flash_forge_hyper_relay: "Đúc tốc hành Trạm trung chuyển Siêu không gian"
 action_flash_forge_hyper_relay_desc: "Bản thân các tuyến siêu không gian đã mang những tính chất lượng tử thú vị, nhưng bằng cách đan xen chúng với một lượng Sợi Cõi sao nhất định, chúng ta có thể đạt được kết quả tuyệt vời. Sau khi xuyên thủng các chiều không gian khác, chúng ta có thể lấy các Trạm trung chuyển Siêu không gian hiện tại (hoặc sẽ tồn tại trong tương lai) ra để sử dụng. Gần như chắc chắn rằng chúng ta là những người duy nhất có thể thực hiện việc “mượn” này."
 action_flash_forge_hyper_relay_tooltip: "Cho phép Tàu Công trình của chúng ta xây dựng ngay lập tức một Trạm trung chuyển Siêu không gian trong một hệ sao mà không tốn bất kỳ chi phí nào."
 action_flash_forge_hyper_relay_available_tooltip: "$TRIGGER_FAIL$§RChúng ta đã chuẩn bị sẵn cơ sở để Tàu Công trình tiến hành xây dựng rồi.§!"
 action_flash_forge_hyper_relay_executing_tooltip: "$TRIGGER_FAIL$§RMột trong những Tàu Công trình của chúng ta đang trên đường thực hiện hành động này rồi.§!"
 FLASH_FORGE_MEGASTRUCTURE: "Đúc tốc hành $MEGASTRUCTURE|H$"
 action_dimensional_shifting: "Dịch chuyển Đa chiều"
 action_dimensional_shifting_desc: "Bằng cách thao túng tài tình kết cấu giữa chiều không gian này và các chiều không gian khác, chúng ta có thể khiến chúng tự gấp nếp để tạo ra một vài hiệu ứng kỳ diệu."
 action_dimensional_shifting_tooltip: "Mở khóa hành động hạm đội §YDi chuyển Pha§!, cho phép hạm đội thoát khỏi pha thực tại để trú ngụ tại một chiều không gian an toàn trong vòng §Y180§! ngày.\n\nKhi hạm đội quay về, nó sẽ được sửa chữa hoàn toàn."
 action_folding_hyperspace: "Gấp Siêu không gian"
 action_folding_hyperspace_desc: "Bằng cách thao tác tinh vi với các mặt phẳng nằm giữa các chiều không gian, chúng ta có thể khiến không gian tự gấp nếp để tạo ra những kết quả vô cùng ấn tượng."
 action_folding_hyperspace_tooltip: "Mở khóa hành động hạm đội §YBước nhảy Cõi sao§!, cho phép hạm đội của bạn nhảy vọt tức thời tới bất kỳ hệ sao nào nằm trong biên giới của bạn."
 action_folding_hyperspace_tooltip_nomad: "Mở khóa hành động hạm đội §YBước nhảy Cõi sao§!, cho phép hạm đội của bạn nhảy vọt tức thời đến bất kỳ hệ sao nào bạn đã dựng trạm tiếp vận."
 action_astral_siphon: "Bơm hút Cõi sao"
 action_astral_siphon_desc: "Kết cấu không thời gian có thể bị tháo dỡ bằng một phương pháp nào đó. Nếu xây dựng một vài thiết bị chiết xuất được hiệu chỉnh kỹ lưỡng, chúng ta có thể sản xuất ổn định một lượng $astral_threads$."
 action_astral_siphon_unlock_tooltip_common: "Tăng giới hạn dự trữ $ASTRAL_THREADS_ICON$, cung cấp vị trí việc làm §Y[GetAstralResearcherJobWithIcon]§!.\n[GetAstralResearcherEffect]"
 action_astral_siphon_unlock_tooltip_lvl1: "Mở khóa công trình hành tinh §Y$building_astral_siphon_1$§!.\n§Y$building_astral_siphon_1$§!$action_astral_siphon_unlock_tooltip_common$"
 action_astral_siphon_unlock_tooltip_lvl2: "Cho phép nâng cấp §Y$building_astral_siphon_1$§! thành §Y$building_astral_siphon_2$§!.\n§Y$building_astral_siphon_2$§!$action_astral_siphon_unlock_tooltip_common$"
 action_astral_siphon_unlock_tooltip_lvl3: "Cho phép nâng cấp §Y$building_astral_siphon_2$§! thành §Y$building_astral_siphon_3$§!.\n§Y$building_astral_siphon_3$§!$action_astral_siphon_unlock_tooltip_common$"
 building_astral_siphon_1: "Trạm Bơm hút Cõi sao"
 building_astral_siphon_1_desc: "Tách các sợi cõi sao ra khỏi kết cấu của thực tại là một công việc đầy tinh tế. Cấu trúc này sẽ bảo vệ biên giới của thực tại để nó không bị sụp đổ."
 building_astral_siphon_2: "Phễu Cõi sao"
 building_astral_siphon_2_desc: "$building_astral_siphon_1_desc$"
 building_astral_siphon_3: "Nút giao Cõi sao"
 building_astral_siphon_3_desc: "$building_astral_siphon_1_desc$"
 astral_siphon_modifier_1: "$action_astral_siphon$"
 astral_siphon_modifier_2: "$action_astral_siphon$"
 astral_siphon_modifier_3: "$action_astral_siphon$"
 action_planar_mastery: "Bậc thầy Mặt phẳng"
 action_planar_mastery_desc: "Hành trình tới các mặt phẳng Cõi sao đã giúp chúng ta thấu hiểu sâu sắc hơn về kết cấu duy trì vũ trụ. Hầu như không một ai có thể hiểu được những sợi tơ này, nhưng chúng ta lại có thể mặc sức dệt chúng."
 edict_astral_binding: "Bện Cõi sao"
 edict_astral_binding_desc: "Chúng ta đã học được cách đan dệt các Sợi Cõi sao thành bất kỳ loại vật chất nào khác trong vũ trụ này. Bản thân nó chính là kết cấu của không gian."
 edict_astral_binding_effects: "Sản lượng thu thập các tài nguyên vật liệu khác tăng §Y10%§!."
 edict_astral_shielding: "Lá chắn Cõi sao"
 edict_astral_shielding_desc: "Không một rào chắn nào có thể vững chắc hơn mạng lưới Sợi Cõi sao được đan bện dày đặc."
 edict_dimensional_artificing: "Trưng bày Đa chiều"
 edict_dimensional_artificing_desc: "Việc đưa một vật phẩm có ý nghĩa văn hóa quan trọng qua các chiều không gian khác để trưng bày là hoàn toàn khả thi trong những điều kiện cụ thể. Nhưng hành động này có bị chú ý bởi các mặt phẳng khác hay không thì chúng ta không thể biết được."
 edict_dimensional_artificing_tooltip: "Mỗi tháng §G+5§! £minor_artifacts£ $MINOR_ARTIFACTS$"
 action_planar_mastery_tooltip: "Mở khóa $EDICTS$ mới: §Y$edict_astral_binding$§!, §Y$edict_astral_shielding$§! và §Y$edict_dimensional_artificing$§!."
 ASTRAL_RIFTS_COMPLETED: "Số Vết nứt Cõi sao đã hoàn thành: $VAL|0$"
 ASTRAL_ACTIONS_RIFTS_COMPLETED_TT: "Mỗi khi hoàn thành một §YVết nứt Cõi sao§!:\n$t$Mở khóa thêm §YHành động Cõi sao§!.\n$t$Sức chứa tối đa §Y$ASTRAL_THREADS_ICON$§!: §G+$@astral_threads_capacity_from_each_explored_rift|*0$§!."
 ASTRAL_ACTIONS_RIFTS_COMPLETED_TT_DESC: "Càng đi sâu vào sự hòa hợp với mặt phẳng Cõi sao, càng có nhiều khả năng mới được mở khóa."
 #################
 #Astral Thread #
 #################
 astral_threads: "Sợi Cõi sao"
 astral_threads_custom_tooltip: "$ASTRAL_ACTIONS_RIFTS_COMPLETED_TT$"
 astral_threads_desc: "£astral_threads£ $astral_threads$ là những sợi tơ tinh xảo ngưng tụ từ không thời gian, là sản phẩm khi các mặt phẳng không gian đa chiều va chạm với nhau. Chúng có thể được dùng để tạo ra nhiều loại hiệu ứng ở cấp độ quốc gia."
 ASTRAL_THREADS: "$astral_threads$"
 ASTRAL_THREADS_ICON: "£astral_threads£ $astral_threads$"
 ASTRAL_THREADS_VALUE: "£astral_threads£ $VAL|0$"
 ASTRAL_THREADS_FULL: "$ASTRAL_THREADS$: $VAL|Y0$"
 ASTRAL_THREADS_DESC: "$astral_threads_desc$"
 action.92.astral_threads: "Trong lúc khảo sát §Y[From.GetStarName]§!, [Root.GetName] đã phát hiện ra một loại tài nguyên chiến lược mới, được gọi là §H$astral_threads$§!. Đặc tính bóp méo không thời gian độc đáo của nó có thể được áp dụng vào vô số những mục đích vô cùng thú vị."
 action.92.astral_threads.tooltip: "£astral_threads£ §Y$astral_threads$§!\n§E$astral_threads_desc$§!"
 distar.305.astral_threads: "[Root.GetName] đã phát hiện ra một loại tài nguyên chiến lược mới ở [FromFrom.GetName], gọi là §H$astral_threads$§!. Tính chất làm biến dạng không thời gian đặc trưng của nó có thể được tận dụng cho nhiều ứng dụng thú vị."
 astral_threads_found: "Đã tìm thấy $astral_threads$:"
 feature_unlock_astral_rift_exploration: "Khám phá Vết nứt Cõi sao"
 feature_unlock_astral_rift_exploration_desc: "Cho phép tàu khoa học của chúng ta tiến hành khám phá Vết nứt Cõi sao."
 feature_unlock_astral_threads_actions: "Hành động Cõi sao"
 feature_unlock_astral_threads_actions_desc: "Sử dụng $ASTRAL_THREADS_ICON$ để phục vụ chúng ta theo nhiều phương thức khác nhau."
 ###############################
 #Astral Rift Discovery Steps #
 ###############################
 astral_planes.100.name: "$situation_a_rift_in_space$"
 astral_planes.100.desc.split: "Khe hở trong hệ sao [From.solar_system.GetName] đã mất ổn định, mở ra một vết nứt thông tới một không thời gian khác.\n\nChúng ta phải hết sức cẩn thận để đối phó."
 astral_planes.100.desc.default: "Chúng ta đã phát hiện một vết nứt không thời gian dị thường ở hệ sao [from.solar_system.GetName]. Có lẽ nếu dành thời gian nghiên cứu các đặc tính của nó, chúng ta sẽ tìm ra được cách thức để tiến hành khám phá sâu hơn."
 astral_planes.100.a: "Thật khó tin."
 astral_planes.101.name: "Tiếp cận Vết nứt"
 astral_planes.101.desc: "Người của chúng ta cuối cùng cũng đã tiếp cận được vị trí có thể với tới vết nứt trên bầu trời.\n\nCó lẽ việc bỏ thời gian nghiên cứu tính chất của nó sẽ mang lại cách thức để tiếp tục khám phá. Chúng ta hiện hoàn toàn không có chút manh mối nào về việc có thứ gì đang nằm bên trong đó."
 astral_planes.101.a: "Chúng ta đã làm được điều mà tổ tiên chưa từng chạm tới."
 astral_planes.110.name: "Hành động Cõi sao"
 astral_planes.110.desc: "Chúng ta đã vén bức màn bí mật về cách thức thu thập và dự trữ những sợi tơ mờ ảo, được tạo ra từ loại vật chất Cõi sao vốn dùng để cấu thành nên ranh giới vũ trụ của chúng ta.\n\nLoài tài nguyên vô cùng quý hiếm này có thể được sử dụng theo vô vàn cách khác nhau, và mang lại cho chúng ta rất nhiều lợi ích to lớn."
 astral_planes.120.name: "$situation_a_rift_in_space$"
 astral_planes.120.desc: "Chúng ta đã đánh mất quyền kiểm soát hệ sao [FromFrom.GetName], và cùng với đó là vết nứt không thời gian nằm bên trong nó.\n\nNhững nỗ lực để khám phá sâu hơn của chúng ta tạm thời sẽ bị gián đoạn."
 approach_situation_speed_tooltip: "\nPhương án đối phó này sẽ đẩy nhanh đáng kể tốc độ nghiên cứu của chúng ta."
 situation_a_rift_in_space: "Vết nứt Không gian"
 situation_a_rift_in_space_riftworld: "Tiếp cận Vết nứt"
 situation_a_rift_in_space_type: "$situation_a_rift_in_space$"
 situation_a_rift_in_space_riftworld_type: "$situation_a_rift_in_space_riftworld$"
 situation_a_rift_in_space_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 situation_a_rift_in_space_desc: "Chúng ta đã phát hiện một vết nứt không thời gian đáng kinh ngạc. Nếu dành thời gian nghiên cứu tính chất của nó, có lẽ chúng ta sẽ tìm ra được cách thức để khám phá xa hơn. Chúng ta hoàn toàn không biết bên trong rốt cuộc có những gì."
 situation_a_rift_in_space_desc_riftworld_origin: "Người của chúng ta cuối cùng cũng đã tiếp cận được vị trí có thể với tới vết nứt trên bầu trời.\n\nCó lẽ việc bỏ thời gian nghiên cứu tính chất của nó sẽ mang lại cách thức để tiếp tục khám phá. Chúng ta hiện hoàn toàn không có chút manh mối nào về việc có thứ gì đang nằm bên trong đó."
 situation_a_rift_in_space_standard: "Nghiên cứu Thụ động"
 approach_situation_a_rift_in_space_standard_tt: "Tình hình hiện tại không cho phép chúng ta tiêu tốn những nguồn lực quý giá như vậy. Chỉ cần quan sát hiện tượng này từ xa là đủ."
 situation_a_rift_in_space_devote_research: "Dốc sức Nghiên cứu"
 approach_situation_a_rift_in_space_devote_research_tt: "Có thể yêu cầu các nhà khoa học của chúng ta phân bổ một lượng lớn tài nguyên nghiên cứu nhằm giải mã những bí mật của vết nứt không thời gian này."
 situation_a_rift_in_space_send_probes: "Phóng Tàu thăm dò"
 approach_situation_a_rift_in_space_send_probes_tt: "Mỗi tàu thăm dò được phóng vào vết nứt đều giúp củng cố thêm hiểu biết của chúng ta về cách vượt qua ranh giới của nó. Chúng ta có thể trích một phần sản lượng hợp kim để phục vụ cho dự án này."
 situation_a_rift_in_space_finisher_effect: "Mở khóa công nghệ §Y$tech_rift_sphere$§!."
 NAME_Astral_Entity: "Thực thể Cõi sao"
 NAME_Planet_Rift_In_Space: "Hành tinh Cõi sao"
 astral_rift_discovery_event_title: "Không thời gian Mất ổn định"
 astral_rift_discovery_event_text: "Trong quá trình nghiên cứu Vết nứt Cõi sao tại §Y[target.solar_system.GetName]§!, chúng ta đã vô tình làm xáo trộn vùng dị thường không gian này, gây ra sự biến dạng không thời gian nghiêm trọng, khiến cho vùng thực tại xung quanh bị bóp méo theo cách thức không thể lường trước."
 astral_situation.55.name: "$astral_rift_discovery_event_title$"
 astral_situation.55.desc: "$astral_rift_discovery_event_text$\n\nMột hành tinh bí ẩn mà chúng ta gọi là §Y[planet_rift_in_space.GetName]§! bỗng chốc xuất hiện như thể từ hư vô. Bất kỳ bản đồ tinh tú nào của chúng ta trước đây cũng chưa từng ghi nhận sự tồn tại của nó.\n\nNó mang theo một nền văn minh [GetPreFTLLower].\n\nChúng ta chỉ có thể suy đoán rằng nó đã đến từ bên ngoài vũ trụ của chúng ta thông qua một phương thức nào đó."
 astral_situation.60.name: "$astral_rift_discovery_event_title$"
 astral_situation.60.desc: "$astral_rift_discovery_event_text$\n\nTại §Y[rift_temporary_species_planet.GetName]§!, một giống loài có tri giác đã xuất hiện từ hư không, và đang chung sống chan hòa cùng với cư dân bản địa của chúng ta.\n\nNgười [rift_temporary_species.GetName] hoàn toàn không có chút ký ức nào về nơi họ sinh ra, và không thể hiện bất kỳ sự thù địch nào.\n\nCho dù họ đến từ nơi đâu, có vẻ như chúng ta cũng chẳng có cách nào để đưa họ về nhà."
 astral_situation.65.name: "$astral_rift_discovery_event_title$"
 astral_situation.65.desc: "$astral_rift_discovery_event_text$\n\nSự biến dạng nghiêm trọng trên §Y[rift_temporary_planet.GetName]§! đã khiến thời gian ở đây trôi nhanh gấp đôi. Chúng ta cần theo dõi chặt chẽ tình trạng này để đảm bảo rằng nguồn tiếp tế được tăng lên gấp đôi."
 rift_in_space_time_acceleration_modifier: "Vặn xoắn Thời gian"
 rift_in_space_time_acceleration_modifier_desc: "Tốc độ trôi của thời gian trên hành tinh này đã nhân đôi."
 astral_situation.20.name: "Vấn đề Ma sát"
 astral_situation.20.desc: "Chúng ta phát hiện ra rằng, để lách qua những nếp gấp của không thời gian, cần phải có một thân tàu láng bóng và nhẵn nhụi một cách tuyệt đối.\n\nMiễn là có đủ thời gian và tài nguyên nghiên cứu, chúng ta hoàn toàn tin tưởng mình sẽ chế tạo thành công thiết bị này, và tạm thời gọi nó là \"§Y$tech_rift_sphere$§!\". Bằng cách này, chúng ta có thể sẽ khám phá ra được những bí mật ẩn giấu phía sau vùng dị thường không gian này."
 astral_planes.2005.name: "Đã phát triển Công nghệ $tech_rift_sphere$"
 astral_planes.2005.desc: "Chúng ta đã phát triển thành công một công nghệ có khả năng lách qua các nếp gấp của Vết nứt Cõi sao: §Y$tech_rift_sphere_plural$§!.\n\nKhối cầu này được cấu tạo từ vật liệu nano tối tân, mịn màng không tì vết, giúp nó có thể lướt đi trong những dòng hải lưu nhiễu loạn của không thời gian mà không sinh ra ma sát.\n\nBởi vì không biết nơi chúng ta sắp tới sẽ như thế nào, mỗi §Y$tech_rift_sphere$§! đều sẽ được buộc một sợi dây cáp neo đậu. Dây cáp này sẽ nối thẳng tới một chiếc Tàu Khoa học của chúng ta trong vũ trụ, để có thể kéo quả cầu trở về nếu xảy ra bất cứ sự cố nào."
 astral_planes.2005.a: "Vậy hãy xem thử chúng ta sẽ tìm thấy được gì..."
 ASTRAL_RIFT_IN_SYSTEM: "Hệ sao này có chứa ít nhất một vết rách cõi sao"
 CRYSTAL_RIFT_IN_SYSTEM: "Hệ sao này có chứa một §Yvết rách pha lê§! độc đáo và kỳ lạ."
 tech_rift_sphere: "Cầu Thăm dò Vết nứt"
 tech_rift_sphere_plural: "Cầu Thăm dò Vết nứt"
 tech_rift_sphere_desc: "Có vẻ như không thời gian có xu hướng hội tụ thành các mặt phẳng xếp chồng lên nhau. Kỹ thuật luồn lách qua các nếp gấp chính là chìa khóa then chốt."
 tech_astral_harvesting: "Thu hoạch Cõi sao"
 tech_astral_harvesting_desc: "Thu thập các Sợi Cõi sao bong ra từ rìa vết nứt không thời gian cho phép chúng ta nâng cấp cực kỳ tinh xảo các trạm nghiên cứu của mình."
 ASTRAL_RIFT_NOT_EXPLORABLE_EXPLANATION: "Chúng ta thiếu công nghệ cần thiết\nđể có thể khám phá hiện tượng dị thường này."
 ASTRAL_RIFT_NOT_EXPLORABLE_STAGE_SUBTITLE: "Chúng ta thiếu công nghệ cần thiết và không thể khám phá hiện tượng dị thường này."
 MESSAGE_ASTRAL_RIFT_FINISHED_TITLE: "Đã khám phá Vết nứt Cõi sao"
 MESSAGE_ASTRAL_RIFT_FINISHED_DESC: "Đã hoàn tất việc thám hiểm một Vết nứt Cõi sao"
 ASTRAL_RIFT_IS_EXPLORED: "Đã khám phá vết nứt $RIFT|Y$"
 ASTRAL_RIFT_IS_NOT_EXPLORED: "Chưa khám phá vết nứt $RIFT|Y$"
 ################
 #Astral Scars #
 ################
 NAME_Astral_Scar: "$pc_astral_scar$"
 pc_astral_scar: "Vết sẹo Cõi sao"
 pc_astral_scar_desc: "Đây là một không thời gian gấp khúc một cách dị thường. Các vật chất kỳ lạ đang bị rò rỉ ra khỏi ranh giới của nó, nhưng chúng ta chưa thể tiến sâu vào bên trong."
 MESSAGE_ASTRAL_SCAR_DISCOVERED_TITLE: "Đã phát hiện Vết sẹo Cõi sao"
 MESSAGE_ASTRAL_SCAR_DISCOVERED_DESC: "Chúng ta vừa tìm thấy một Vết sẹo Cõi sao."
 ################
 #Astral Rifts #
 ################
 ASTRAL_RIFT: "Vết nứt Cõi sao"
 ASTRAL_RIFTS: "Vết nứt Cõi sao"
 CRYSTAL_RIFT: "Vết nứt Pha lê"
 astral_rift: "$ASTRAL_RIFT$"
 MESSAGE_ASTRAL_RIFT_DISCOVERED_TITLE: "Đã phát hiện Vết nứt Cõi sao"
 MESSAGE_ASTRAL_RIFT_DISCOVERED_DESC: "Một Vết nứt Cõi sao mới đã sẵn sàng để được khám phá."
 MESSAGE_ASTRAL_RIFT_STARTED_TITLE: "Khám phá Vết nứt Cõi sao"
 MESSAGE_ASTRAL_RIFT_STARTED_DESC: "Tàu Khoa học của chúng ta đã thả neo đậu tại một Vết nứt Cõi sao. Cho đến khi việc thám hiểm kết thúc, con tàu và phi hành đoàn sẽ không thể thực hiện bất kỳ nhiệm vụ nào khác."
 ASTRAL_RIFT_REWARDS: "Phần thưởng:"
 alert_mia_phase_out_fleet_title: "Dịch chuyển Pha Hạm đội"
 alert_mia_phase_out_fleet_instant: "Hạm đội của bạn đã thực hiện dịch chuyển pha để rời khỏi mặt phẳng tồn tại của chúng ta. Nếu quay về suôn sẻ, họ có lẽ sẽ tiếp tục thực hiện các nhiệm vụ trước đó."
 alert_astral_rift_event_title: "Có sự kiện Vết nứt Cõi sao đang chờ quyết định"
 alert_astral_rift_event_instant: "Đang có chút biến cố xảy ra với Vết nứt Cõi sao mà chúng ta hiện đang thám hiểm."
 ALERT_ASTRAL_RIFT_EVENT_DETAIL: "$FLEET_NAME|Y$ tại $SYSTEM_NAME|Y$."
 RIFT_DIFFICULTY_TYPE: "Độ khó"
 RIFT_DIFFICULTY_TYPE_DESC: "Mức độ khó của việc khám phá Vết nứt Cõi sao có thể có sự khác biệt qua từng giai đoạn.\nGiai đoạn $RIFT_DIFFICULTY_EASY$ có độ khó từ 0-2, $RIFT_DIFFICULTY_NORMAL$ từ 3-5, còn $RIFT_DIFFICULTY_HARD$ là từ 6 trở lên. Độ khó càng cao thì khả năng đạt được thành công khi kết thúc một chu kỳ thám hiểm càng thấp."
 RIFT_DIFFICULTY_TYPE_TT: "§H$RIFT_DIFFICULTY_TYPE$§!\n$VALUE$\n\n$RIFT_DIFFICULTY_TYPE_DESC$"
 RIFT_DIFFICULTY_EASY: "§GDễ§!"
 RIFT_DIFFICULTY_NORMAL: "§YTrung bình§!"
 RIFT_DIFFICULTY_HARD: "§RKhó§!"
 RIFT_LEADER_BONUS: "Phần thưởng Kỹ năng"
 RIFT_LEADER_BONUS_DESC: "Phần thưởng Kỹ năng sẽ tăng khả năng thu được kết quả thành công khi kết thúc chu kỳ thám hiểm.\n\nPhần thưởng này sẽ gia tăng §YTỷ lệ Đột phá§!."
 RIFT_LEADER_BONUS_TT: "§H$RIFT_LEADER_BONUS$§!\n$RIFT_LEADER_BONUS_DESC$"
 EXPLORATION_PROGRESS_TOOLTIP: "§HChu kỳ Thám hiểm§!\nViệc thám hiểm Vết nứt Cõi sao sẽ được tiến hành theo các chu kỳ, và xúc xắc để tính toán tiến độ sẽ được tung sau khi mỗi chu kỳ khép lại.\n\nChu kỳ tiếp theo sẽ kết thúc sau £time£$DAYS|Y$"
 RIFT_GO_TO: "§HĐi đến§!\n§GClick để di chuyển góc nhìn nhanh chóng đến vị trí của vết nứt này§!"
 RIFT_CLUES: "Manh mối"
 RIFT_CLUES_DESC: "Manh mối đại diện cho khối lượng thông tin mà bạn đã nắm bắt được ở một giai đoạn nhất định trong việc khám phá Vết nứt Cõi sao.\n\nSở hữu các manh mối sẽ giúp cải thiện §YTỷ lệ Đột phá§!."
 RIFT_CLUES_TT: "§H$RIFT_CLUES$§!\n$RIFT_CLUES_DESC$"
 ASTRAL_RIFT_EXPLORATION_LOG: "Nhật ký Thám hiểm"
 ASTRAL_RIFT_EXPLORATION_LOG_TT: "§H$ASTRAL_RIFT_EXPLORATION_LOG$§!\n$ASTRAL_RIFT_EXPLORATION_LOG$ hiển thị kết quả của chu kỳ điều tra trước đó."
 EXPLORATION_LOG_ROLL_TOOLTIP: "§HKết quả Chu kỳ Thám hiểm§!\nManh mối đã thu thập: $GAINED|Y$\n\nKết quả: $RESULT|Y$\n  Điểm xúc xắc: $ROLL|Y$\n  Số manh mối: $CLUES|Y$\n  Phần thưởng kỹ năng: $BONUS|Y$\n  Hệ số độ khó: $DIFFICULTY|R$\n\n§EKết quả Cuối cùng:§!\n§RThất bại§!: Giá trị kết quả nhỏ hơn hoặc bằng §Y4§!, cộng thêm §Y0§! manh mối.\n§YCó Tiến triển§!: Giá trị kết quả rơi vào khoảng §Y5-9§!, cộng thêm §Y1§! manh mối.\n§GĐột phá§!: Giá trị kết quả rơi vào khoảng §Y10-13§!, cộng thêm §Y2§! manh mối."
 ASTRAL_RIFT_BREAKTHROUGH: "Tỷ lệ Đột phá"
 astral_rift_roll_header: "§H$ASTRAL_RIFT_BREAKTHROUGH$§!\nChỉ số này phản ánh khả năng tạo ra sự đột phá của Cán bộ Khoa học khi đang thăm dò vết nứt hiện tại.\n\nMỗi khi một chu kỳ thám hiểm kết thúc, trò chơi sẽ tự động tung ra một con xúc xắc (với kết quả từ §Y1§! đến §Y10§!). Điểm của xúc xắc sẽ được cộng với §YPhần thưởng Kỹ năng§! và số §YManh mối§!, sau đó đem trừ đi mức §YĐộ khó§!.\n\nKết quả trước khi gieo xúc xắc là $SCORE|0Y$.\n\n§EKết quả Cuối cùng:§!"
 FLEETORDER_EXPLORE_RIFT: "Thám hiểm §Y$ASTRAL_RIFT_NAME$§! tại §Y$SYSTEM_NAME$§!"
 FLEETORDER_EXPLORE_RIFT_BUTTON: "Thám hiểm $ASTRAL_RIFT_NAME$"
 ASTRAL_RIFT_DESCRIPTION: "Một khe hở của không thời gian. Chúng ta hiện chưa thể biết chính xác phía bên kia của nó là thứ gì."
 CRYSTAL_RIFT_DESCRIPTION: "Một khe hở không thời gian dị thường. Có thể nhìn thấy những viên pha lê kỳ quái đang trôi nổi bên trong vết nứt."
 ASTRAL_RIFT_FINISHED: "Việc thám hiểm vết nứt đã hoàn tất"
 ASTRAL_RIFT_EXPLORED_BY_OTHER: "Vết nứt này đã bị một đế chế khác khám phá.\nNó hiện đang rất mất ổn định, chúng ta không thể đi vào."
 ASTRAL_RIFT_LOCKED: "Đang tiến hành thám hiểm vết nứt"
 ASTRAL_RIFT_POOL_IS_EMPTY: "Vết nứt Cõi sao này có vẻ như không thông đến đâu cả."
 CANNOT_EXPLORE_OUTSIDE_EMPIRE_BORDERS: "$TRIGGER_FAIL$§RKhông thể khám phá các Vết nứt Cõi sao nằm ngoài ranh giới đế chế§!"
 CANNOT_EXPLORE_OUTSIDE_EMPIRE_BORDERS_CLOAKED: "$TRIGGER_FAIL$§RTầm ảnh hưởng của chúng ta tại hệ sao này là chưa đủ để đảm bảo an toàn cho chuyến thám hiểm này.§!"
 CANNOT_EXPLORE_ALREADY_BEING_EXPLORED: "$TRIGGER_FAIL$§RVết nứt Cõi sao này đã bị thám hiểm trước đó.§!"
 CANNOT_EXPLORE_ALREADY_BEING_EXPLORED_BY_OTHER: "$TRIGGER_FAIL$§RVết nứt này đã bị một đế chế khác khám phá.\nNó hiện đang rất mất ổn định, chúng ta không thể đi vào.§!"
