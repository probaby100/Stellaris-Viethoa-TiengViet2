 #Edicts #
 ##########
 edict_shadow_matrix: "Ma trận Bóng tối"
 edict_shadow_matrix_desc: "Sự mơ hồ điện tử do bộ xử lý Vật chất Tối cung cấp sẽ tạo ra một phần mềm mà ngay cả những chuyên gia giải mã xuất chúng nhất cũng khó lòng mà phá vỡ được."
 edict_obsidian_veil: "Bức màn Hắc diện thạch"
 edict_obsidian_veil_desc: "Muốn ẩn mình trong rừng, thì nên lấp trong đất. Muốn giấu mình trong không gian, thì nên khoác lên hư không."
 edict_dark_matter_forging: "Đúc Vật chất Tối"
 edict_dark_matter_forging_desc: "Vật chất Tối dưới dạng chất trợ dung dùng trong các xưởng đúc của chúng ta sở hữu đặc tính liên kết độc đáo, giúp nâng cao sản lượng một cách đáng kể."
 edict_dark_matter_unravelling: "Phân tách Vật chất Tối"
 edict_dark_matter_unravelling_desc: "Năng lượng được chứa đựng trong các liên kết cấu tạo nên Vật chất Tối có thể được phân tách ra, để thu về một số thành phẩm có giá trị."
 edict_inner_focus: "Nội trị Chi pháp"
 edict_inner_focus_desc: "Việc mở rộng biên giới quốc gia một cách quá đà sẽ đem lại vô vàn rủi ro. Việc hiểu rõ bản thân mình chính là một nỗ lực đáng tin cậy và có thành quả hơn."
 edict_baryonic_insight: "Thấu hiểu Baryon"
 edict_baryonic_insight_desc: "Để có thể hiểu sâu hơn về kết cấu của vũ trụ, chúng ta phải vượt ra ngoài khái niệm về nguyên tử."
