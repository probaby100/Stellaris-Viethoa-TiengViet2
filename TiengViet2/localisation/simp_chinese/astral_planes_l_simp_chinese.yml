 #Relics #
 ##########
 r_infinity_root: "Rễ Vô tận"
 r_infinity_root_desc: "Một tập hợp vật chất hữu cơ, bất kể được đặt ở đâu, cũng sẽ phát triển và bành trướng một cách dữ dội."
 infinity_root_active_effect_tt: "Nuôi dưỡng một nhà lãnh đạo mới. Người này sẽ không cần phí bảo trì và cũng không bị tính vào tổng số lượng nhà lãnh đạo."
 r_time_crystal: "Pha lê Thời gian"
 r_time_crystal_desc: "Một khoang tinh thể bị phong ấn, bên trong chứa một vòng lặp thời gian hoàn toàn cách biệt với thế giới bên ngoài."
 r_daedalus_seal: "Ấn chú Daedalus"
 r_daedalus_seal_desc: "Thiết bị tối tân này có khả năng rung động với tần số cộng hưởng cùng các nếp gấp không thời gian lân cận, tạm thời phong tỏa chúng."
 daedalus_seal_active_effect_tt: "Đóng tất cả các Lỗ sâu và L-Cổng trong ranh giới quốc gia của bạn trong vòng §Y5§! năm."
 daedalus_seal_acquisition_tt: "Thời gian duy trì Khóa Đa chiều: §G+25%§!"
 daedalus_seal_acquisition_tt: "Thời gian duy trì Khóa chiều không gian: §G+25%§!"
 daedalus_seal_no_bypasses_fail: "$TRIGGER_FAIL$Trong ranh giới quốc gia của bạn không có Lỗ sâu hoặc L-Cổng nào."
 MOD_DIMENSIONAL_LOCK_DURATION_MULT: "Thời gian duy trì Khóa Đa chiều"
 r_ever_spinning_top: "Con quay Vĩnh cửu"
 r_ever_spinning_top_desc: "Một con quay xoay tròn ở chiều không gian bậc cao. Chuyển động của nó mượt mà và có khả năng gây thôi miên; là một dạng chuyển động hoàn mỹ vĩnh hằng."
 ever_spinning_top_modifier: "Động cơ Vĩnh cửu"
 r_celestial_tear: "Nước mắt Thiên thể"
 r_celestial_tear_desc: "Một mẫu giọt nước mắt cõi sao rơi xuống từ một thiên thể đau thương nào đó. Càng ở gần một ngôi sao đang hoạt động, nó càng phát sáng rực rỡ."
 celestial_tear_modifier: "$r_celestial_tear$"
 celestial_tear_acquisition_tt: "Độ phù hợp của các hành tinh xoay quanh các ngôi sao loại §YA§!, §YB§!, §YF§! và §YG§!: §G+5%§!"
 celestial_tear_acquisition_nomads_tt: "Độ thích nghi của Tàu cứu thế trong các hệ sao thuộc loại quang phổ §YA§!, §YB§!, §YF§! và §YG§!: §G+5%§!"
 r_plasmic_core: "Lõi Huyết tương"
 r_plasmic_core_desc: "Hạt nhân của một tế bào khổng lồ đến từ một mặt phẳng không gian dị biệt. Nó nhắc nhở chúng ta về sự đa dạng vô tận của sự sống hữu cơ."
 machine_plasmic_core_effect: "Trao cho một nhà lãnh đạo ngẫu nhiên 3 đặc điểm tích cực ngẫu nhiên."
 plasmic_core_effect: "Toàn bộ nhân khẩu trên một hành tinh ngẫu nhiên sẽ nhận được đặc điểm §Y$trait_plasmic$§!."
 plasmic_core_no_suitable_planet: "$TRIGGER_FAIL$§RKhông có hành tinh nào chứa cư dân mà không mang đặc điểm §Y$trait_plasmic$§!.§!"
 plasmic_core_effect_evopred: "Tiến độ tình hình §Y$evolutionary_predators_situation$§! tăng thêm §G50%§!. Khi hoàn thành có thể nhận thêm đặc điểm §Y$trait_plasmic$§!."
