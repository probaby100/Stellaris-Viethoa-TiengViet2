 #Tutorials #
 #############
 TUTORIAL_ASTRAL_ACTIONS_VIEW_TITLE: "Hướng dẫn: Hành động Cõi sao"
 TUTORIAL_ASTRAL_ACTIONS_VIEW_DESC: "Giao diện Hành động Cõi sao cho phép chúng ta sử dụng $ASTRAL_THREADS_ICON$ để tạo ra nhiều hiệu ứng đa dạng trên phạm vi toàn quốc. Chúng ta càng khám phá nhiều §SVết nứt Cõi sao§!, thì càng mở khóa được nhiều hành động hơn. Có một số hành động có thể được sử dụng nhiều lần theo thời gian, trong khi những hành động khác chỉ có thể được sử dụng một lần để mở khóa khả năng hoặc công nghệ mới."
 TUTORIAL_ASTRAL_RIFT_VIEW_TITLE: "Giao diện Vết nứt Cõi sao"
 TUTORIAL_ASTRAL_RIFT_VIEW_DESC: "Cửa sổ Vết nứt Cõi sao hiển thị thông tin chi tiết về §SVết nứt Cõi sao§! đang được lựa chọn. Ở mỗi một giai đoạn trong quá trình thực hiện dự án, bạn sẽ cần phải dựa vào những đề xuất đã đưa ra để ra lệnh cho Cán bộ Khoa học, việc này sẽ dẫn đến những kết quả khác biệt, đôi khi không thể ngờ tới. Hầu như những cuộc thám hiểm chinh phục Vết nứt Cõi sao nào cũng có vô vàn con đường để chọn lựa.\n\nĐể giải mã được bí mật của một Vết nứt Cõi sao, Cán bộ Khoa học phải tạo ra sự §SĐột phá§!, để có thể phát triển ở từng giai đoạn của Vết nứt Cõi sao. Một Cán bộ Khoa học có §SĐặc điểm liên quan và trình độ kỹ năng cao hơn§! sẽ có thể tiến đến giai đoạn tiếp theo nhanh hơn, trong khi đánh giá độ khó cao hơn ở lộ trình được chọn sẽ khiến cho tốc độ tiến triển bị chậm lại. Bất kỳ một Cán bộ Khoa học nào làm nhiệm vụ điều tra vết nứt trong thời gian dài sẽ thu được nhiều §SManh mối§!, qua đó làm tăng khả năng Đột phá.\n\nTrong quá trình thám hiểm §SVết nứt Cõi sao§!, Cán bộ Khoa học bị giam cầm trong một chiều không gian khác, và không thể bãi miễn chức vụ của họ cho đến khi chuyến thám hiểm kết thúc. Bởi vì họ bị nhốt bên ngoài không thời gian bằng phương thức này, họ sẽ không chết đi vì già yếu."
 #Mercedes Romero Lives!
 astral_planes.6100.name: "Kẻ Đào tẩu Cuối cùng"
 astral_planes.6100.desc: "Cùng với Tàu Thăm dò Vết nứt vừa thoát khỏi Vết nứt Cõi sao tại [FromFromFrom.GetName], là một khung cảnh dị thường khiến chúng ta phải chú ý: bám theo dấu vết của Tàu Thăm dò là một khoang thoát hiểm đang trong trạng thái ngủ đông. Rất nhanh, chúng ta đã nhận được một tín hiệu cầu cứu đơn giản, kèm theo đó là một đoạn video thời gian thực."
 astral_planes.6100.b: "Chuyện này không liên quan đến chúng ta."
 astral_planes.6100.c: "Cứ coi nó như bia ngắm bắn đi."
 NAME_Mercedes: "Mercedes Romero"
 Mercedes_DESC: "Ông cụ người Blorg trăm tuổi vui vẻ này có niềm đam mê mãnh liệt đối với các nền văn hóa ngoài hành tinh, đặc biệt là loài người. Ông đã dũng cảm xuyên qua những vết nứt liên sao để đến đây, với một nhiệm vụ duy nhất: kết bạn."
 mercedes_catch_phrase: "Chúng ta có thể làm bạn không?"
 astral_planes.6105.desc.reg: "§HĐứng ngay trước mặt chúng ta là một sinh vật ngoài hành tinh gớm ghiếc, lặng im một cách đầy bối rối, chỉ có những sợi lông mao trên cơ thể nhấp nhô theo nhịp điệu như những gợn sóng. Bỗng nhiên, sinh vật này như choàng tỉnh, nó khua khoắng những chiếc xúc tu của mình và tự giới thiệu:§!\n\nHả? Sao cơ? Đây là đâu? Xin lỗi nhé. Tên tôi là Mercedes Romero, tôi là một nhà thám hiểm kiêm nhà ngoại giao của Hợp chủng quốc Blorg. Các bạn đã từng nghe nói về loài người chưa?"
 astral_planes.6105.desc.human: "§HĐứng ngay trước mặt chúng ta là một sinh vật ngoài hành tinh gớm ghiếc, lặng im một cách đầy bối rối, chỉ có những sợi lông mao trên cơ thể nhấp nhô theo nhịp điệu như những gợn sóng. Sau khi nhận ra chúng ta, cô ta như muốn chồm tới vồ lấy, nhưng rồi lại kìm nén được.§!\n\nCác bạn... các bạn là người!? §H*Hét toáng lên*§! Tôi——tôi thực sự rất xin lỗi, từ hồi còn là một bào tử bé tí tôi đã cực kỳ hứng thú với văn hóa của các bạn rồi!\n\n§HSinh vật ngoài hành tinh này vươn một cái xúc tu ra, cố gắng vụng về mô phỏng lại động tác bắt tay.§!\n\nTên tôi là Mercedes Romero, rất hân hạnh được gặp các bạn."
 astral_planes.6105.a: "Ngươi còn nhớ được những gì?"
 astral_planes.6105.a.response: "Ký ức cuối cùng của tôi là ở hệ sao Antares. Lúc đó tôi đang thực hiện nhiệm vụ hạm đội cùng một nhóm bạn thì đột nhiên nhìn thấy một tia sáng chói lòa. Sau đó thì tôi không còn nhớ gì nữa. Tôi đã đến đây bằng khoang thoát hiểm. Cô độc và chẳng có lấy một người bạn."
 astral_planes.6105.b: "Tại sao ngươi lại quan tâm đến loài người đến vậy?"
 astral_planes.6105.b.response: "Ôi, con người, sinh vật tuyệt vời nhất thế gian. Người Blorg chúng tôi đã luôn dõi theo họ trong suốt nhiều thế kỷ qua. Thực ra, phần lớn nền văn hóa của chúng tôi đều được hình thành dựa trên việc quan sát cuộc sống của loài người. Đầy màu sắc! Đầy tính kịch! Tình bằng hữu! Họ đã dạy cho chúng tôi hiểu rằng cuộc sống không chỉ có mục đích sinh tồn, mà còn có thể kết giao bằng hữu! Khái niệm này thực sự quá tuyệt vời, có thể nói đó là một phép màu!"
 astral_planes.6105.c: "Ngươi có thể làm gì cho chúng tôi?"
 astral_planes.6105.c.response: "Câu hỏi này nghe chẳng thân thiện chút nào, nhưng tôi có thể đáp ứng mọi yêu cầu của các bạn! Đương nhiên rồi, tôi có cả trăm năm kinh nghiệm trong việc lái tàu khoa học, nhưng điều khiến tôi thực sự say mê lại là các mối quan hệ liên ngân hà. Cứ coi tôi là một người bạn đi, tôi có thể giúp các bạn kết thân với nhiều người hơn nữa. Xin hãy đồng ý đi mà, nếu các bạn có hứng thú, nhất định phải để tôi đại diện cho những lợi ích ngoại giao của các bạn nhé!"
 astral_planes.6105.hire_custom_tooltip: "§Y$NAME_Mercedes$§! đã gia nhập đế chế của chúng ta với tư cách là một §HNhà Lãnh đạo§!."
 leader_trait_blorg_insight: "Sự Sáng suốt của người Blorg"
 leader_trait_blorg_insight_desc: "Trải qua hàng trăm năm nghiên cứu sâu sắc về các chương trình phát thanh và nền văn hóa của một giống loài động vật có vú đi bằng hai chân cụ thể, cá thể này đã trở nên vô cùng mạnh bạo trong việc khao khát lấy lòng người khác, hay nói một cách trần trụi hơn là mặt dày vô sỉ."
