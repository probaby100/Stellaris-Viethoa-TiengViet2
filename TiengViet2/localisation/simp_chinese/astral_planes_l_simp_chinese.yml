 astral_planes.210.name: "Nhà khoa học trở về"
 astral_planes.210.desc: "[fromfrom.leader.GetName] vừa trở về từ một chuyến thám hiểm $ASTRAL_RIFT$ để tìm kiếm một hệ sao bị biến mất vào thời khắc mạt thế. Rất nhiều nơi thân thuộc với ông ấy giờ đây đã hoàn toàn bốc hơi khỏi thực tại này.\n\nÔng ấy hiện tại vẫn chưa thể xác định được đây có đúng là chiều không gian mình từng sống hay không, rõ ràng là ông đang phải chịu đựng một cú sốc nhận thức không hề nhỏ."
