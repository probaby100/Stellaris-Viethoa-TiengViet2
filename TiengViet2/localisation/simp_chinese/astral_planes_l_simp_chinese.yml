 EXIT_BYPASS_STRANGE_WORMHOLE: "$BYPASS_TYPE$"
 astral_planes.45.name: "$STRANGE_WORMHOLE$"
 astral_planes.45.desc.event_chain_owner: "Một lỗ sâu dị thường đã xuất hiện tại §HVết nứt Pha lê§! lân cận bên trong hệ sao §H[From.GetName]§!.\n\nChúng ta chỉ có thể suy đoán rằng đây là một Cổng Sao do Kẻ Vô hình mở ra để mang viện binh tới cho họ. Chúng ta phát hiện thấy hệ sao ở phía bên kia đã bị kéo từ một nơi khác vào không gian của chúng ta.\n\nNếu chúng ta quyết định tiến vào nơi này, chúng ta nên chuẩn bị sẵn hạm đội mạnh nhất của mình."
 astral_planes.45.desc.locked: "Chúng ta đã phát hiện ra một lỗ sâu dị thường. Cho dù phi thuyền của chúng ta cố gắng tiếp cận gần đến mức nào, cũng sẽ bị một thế lực vô danh đẩy lùi. Đã có một chuyện vô cùng kỳ lạ xảy ra trong hệ sao §H[From.GetName]§!."
 astral_planes.45.desc.unlocked: "Chúng ta đã phát hiện ra một lỗ sâu dị thường trong hệ sao §H[From.GetName]§!. Cảm biến cho thấy nó dẫn thẳng đến trung tâm ngân hà. Chuyện này sao có thể xảy ra được?"
 astral_planes.50.name: "$STRANGE_WORMHOLE$"
 astral_planes.50.desc: "Lỗ sâu dị thường mà chúng ta tìm thấy trong hệ sao §H[crystal_sphere_system.GetName]§! đang dao động dữ dội. Cảm biến phát hiện ra nó là một lối đi trực tiếp dẫn đến trung tâm ngân hà.\n\nChuyện này sao có thể xảy ra được?"
 astral_planes.3000: "Chúng ta đang ở đâu?"
 astral_planes.3000.desc: "Có vẻ như phía bên kia của lỗ sâu này đã đưa chúng ta đến... trung tâm ngân hà?\n\nChúng ta vốn dĩ không nên tồn tại ở đây, chứ đừng nói đến việc có nguyên cả một hệ sao ở đây. Phải chăng có một sự thao túng chiều không gian nào đó đang diễn ra ở đây?\n\nChúng ta không có nhiều thời gian để điều tra, bởi vì chúng ta đang nhận được tín hiệu truyền tải từ một thực thể vô danh."
 astral_planes.3005.desc: "Cái gì đây... ngươi đã mang bọn ngốc nào đến để giúp ngươi vậy, Shadagun? Hay là... ngươi đã mang thức ăn đến dâng cho bọn ta..."
 astral_planes.3005.a: "Chúng ta bị coi là con mồi và bị lừa đến nơi này?"
 astral_planes.3015: "Sứ giả"
 astral_planes.3015.desc: "Hạm đội của chúng ta đã đánh bại những con tàu kỳ lạ canh gác vết nứt này, nhưng có vẻ như chúng không hề đơn độc.\n\nChúng ta vừa nhận được một tín hiệu truyền tải, bắt nguồn từ một thực thể bên trong một công trình kiến trúc nằm cạnh hành tinh duy nhất của hệ sao này."
 astral_planes.3020.desc: "Sẽ còn nhiều kẻ nữa kéo đến... chúng ta phải đóng vết nứt này lại... chúng ta là những người duy nhất còn sống sót..."
 astral_planes.3020.a: "Sẽ còn nhiều kẻ nữa kéo đến?"
 astral_planes.3050.desc: "Chúng ta là những người duy nhất còn sót lại... chúng ta phải tái thiết... chúng ta cần thời gian..."
 astral_planes.3050.a: "Các ngươi có thể tận dụng §Ythứ này§! không?"
 astral_planes.3050.a.tt: "Nếu chúng ta có thể cung cấp một lượng lớn sợi cõi sao, những sinh vật này chắc chắn có thể củng cố hàng phòng thủ của họ."
 number_formless_fleet_max_reached: "Kẻ Vô hình không còn hạm đội nào."
 astral_planes.3050.b: "Không cần để bận tâm."
 astral_planes.3070.desc: "Cuối cùng... thoái vị... chuỗi xích của chúng ta đã bị phá vỡ... chứng kiến sự thăng hoa của chúng ta... chúng ta sẽ tìm thấy những gì họ đã giấu..."
 astral_planes.3070.a: "Chúng ta phải rời khỏi đây."
 astral_planes.3070.a.tt: "Thực thể được chúng ta biết đến với tên gọi Kẻ Vô hình, đã bị tiêu diệt bởi những kẻ tấn công đến từ một chiều không gian khác. Cổng dịch chuyển nằm trong hệ sao $NAME_Formless_System$ cũng đã bị đóng kín và phong ấn."
 astral_planes.3100.desc: "§HTrong trạng thái không ngừng biến đổi, hình dáng có thể nhìn thấy của thực thể này liên tục chuyển đổi giữa thực tại này và một thực tại khác. Giọng nói của Ngài vang vọng như muôn vàn giọng ca hòa quyện vào nhau, như thể đang đại diện cho nhiều sự tồn tại cùng lúc.§!\n\n...Đã hoàn tất... Phong ấn đã được thiết lập... Những đứa trẻ của ta sẽ không bao giờ có thể tìm thấy nơi này nữa..."
 astral_planes.3100.a: "Ngài là thứ gì?"
 astral_planes.3100.a.desc: "Các ngươi biết chúng ta... chúng ta vượt lên trên cả vết nứt... và cũng thuộc về vết nứt... Các ngươi đã từng nhìn thấy rồi..."
 astral_planes.3100.b: "Tại sao Ngài lại ở đây?"
 astral_planes.3100.b.desc: "Những đứa trẻ của chúng ta... những đứa trẻ bị tan vỡ... đang săn lùng chúng ta... chúng đang tìm kiếm ngai vàng... chúng ta đã giấu nó..."
 astral_planes.3100.c: "“Ngai vàng” là cái gì?"
 astral_planes.3100.c.desc: "Sự vĩnh hằng của chúng ta... ký ức của chúng ta... Nếu chúng ta là máu... thì đó chính là trái tim... Bây giờ an toàn rồi... chúng ta cảm ơn các ngươi..."
 astral_planes.3100.d: "§YĐầu hàng chúng ta, các ngươi sẽ tiếp tục được sống sót.§!"
 formless_subjugation_path_success_tt: "§Y$NAME_Formless$§! trở thành một quốc gia phụ thuộc dưới trướng của §Y[This.GetName]§! với tư cách là một §Y$preset_luminarium$§!."
 astral_planes.3100.e: "§RGiao “Ngai vàng” mà Ngài vừa nhắc đến cho chúng ta.§!"
 astral_planes.3100.f: "Hãy hợp tác cùng nhau."
 astral_planes.3101.desc: "Điều này đã được dự báo trước... chúng ta sẽ thần phục các ngươi... đây là số phận của chúng ta..."
 astral_planes.3102.desc.fail: "Chúng ta đã đánh giá sai các ngươi... Cực kỳ đau buồn... Hãy kết thúc chuyện này đi..."
 astral_planes.3102.desc: "Ngai vàng Vĩnh cửu... không đến lượt các ngươi chiếm đoạt...\n$astral_planes.3102.desc.fail$"
 astral_planes.3102.a: "Vậy thì đành thế thôi."
 astral_planes.3110.desc: "Biết ơn…… Bình yên…… Đền đáp……"
 astral_planes.3110.a: "Chúng ta cần §Ysức mạnh§! của ngươi."
 astral_planes.3110.a.tt: "Giao một hạm đội Kẻ Vô Hình cho bạn nắm quyền điều khiển."
 astral_planes.3110.b: "Chúng ta cần §Yhiểu biết§! của ngươi."
 astral_planes.3110.b.tt: "Nhận được một công nghệ vật lý ngẫu nhiên."
 astral_planes.3110.c: "Chúng ta cần §YSợi tơ cõi sao§! của ngươi."
 astral_planes.3110.d: "Ai phái ngươi đến tìm chúng ta?"
 astral_planes.3110.d.desc: "§Y$NAME_Formless_leader$§!…… Người dựng xây Ngai vàng Bất diệt……\n\nNgài đã dành trọn ngàn năm để tạo ra nó……\n\nMột cỗ máy gắn kết chúng tôi lại thật bền chặt…… tinh xảo và vĩnh cửu……\n\nNó sinh ra là để phục vụ người……\n\nChẳng còn ai sáng suốt hơn người nữa……"
 astral_planes.3110.e: "Ai là “Kẻ Phá Ranh Giới”?"
 astral_planes.3110.f: "Ai là “Kẻ Lệch Lối”?"
 astral_planes.3110.g: "Ai là “Kẻ Cuồng Tín”?"
 astral_planes.3110.h: "§Y$NAME_Formless_leader$§! đã ngã xuống."
 astral_planes.3110.h.desc: "Tiếc nuối……\n\nNhưng đã thấy trước……\n\nSố phận……\n\nKhông cần phải xót thương."
 astral_planes.3114.desc.unbidden: "Shabanash... người thân bị tan vỡ... mãi mãi đói khát...\n\nLòng tham của chúng ta... bị phóng đại...\n\nTội lỗi bị phơi bày...\n\nMột sự sỉ nhục to lớn..."
 astral_planes.3114.desc.aberrant: "Dagal... phớt lờ... đầy giận dữ...\n\nCơn thịnh nộ của chúng ta... hiển hiện...\n\nSự xung đột của chúng sẽ không bao giờ chấm dứt..."
 astral_planes.3114.desc.vehement: "Onzai... kẻ theo đuổi ngai vàng...\n\nSự ghen tị to lớn...\n\nKhái niệm bị chúng ta lãng quên..."
 astral_planes.3114.a: "Chúng có điểm yếu nào không?"
 astral_planes.3114.b: "Chúng tôi muốn hỏi chuyện khác."
 astral_planes.3115.desc.common: "Theo cách mà chúng ta biết... Đây là một... vấn đề về tần số...?\n\nTrong ngôn ngữ của các ngươi không có từ ngữ này...\n\nChúng ta cần... Vật liệu Cõi sao..."
 astral_planes.3115.desc.unbidden: "Lòng tham của chúng sẽ bị hủy diệt...\n\n$astral_planes.3115.desc.common$"
 astral_planes.3115.desc.aberrant: "Cơn thịnh nộ của chúng thiếu mục đích...\n\n$astral_planes.3115.desc.common$"
 astral_planes.3115.desc.vehement: "Sự ham muốn của chúng thật là ngu xuẩn...\n\n$astral_planes.3115.desc.common$"
 astral_planes.3115.a: "Chúng tôi có thể cung cấp."
 astral_planes.3116.desc: "Đã hoàn tất... Quá trình đồng bộ hóa của các ngươi đã hoàn công..."
 secret_of_the_unbidden_modifier: "Bí mật của Kẻ Phá vỡ Ranh giới"
 pacification_of_the_aberrant_modifier: "Sự khuất phục của Kẻ Trệch hướng"
 folly_of_the_vehement_modifier: "Hành động Ngu xuẩn của Kẻ Cuồng tín"
 astral_planes.3121.desc: "§Y$NAME_Formless_leader$§! của Shadagun... Sao ngươi lại ở đây...\n\nNgươi sẽ trở thành một bữa tiệc thịnh soạn...\n\nHãy đến đây, hãy va chạm cùng chúng ta..."
 astral_planes.3122.desc: "Chúng ta vẫn chưa kết thúc đâu... §Y$NAME_Formless_leader$§! của Shadagun...\n\nNgươi đã cứu vớt đồng bào của mình... nhưng lại ngu ngốc theo đuổi... kiêu ngạo...\n\nHãy chứng kiến cơn thịnh nộ... sau đó là sự lãng quên..."
 astral_planes.3123.desc: "Kiến trúc sư... §Y$NAME_Formless_leader$§! của Shadagun...\n\nChúng ta sẽ nuốt chửng ngươi... hấp thụ tâm trí của ngươi...\n\nBí mật của Ngai vàng... Món quà vĩ đại mà ngươi dâng tặng...\n\nBây giờ hãy hòa nhập với chúng ta... Chúng ta sẽ tôn vinh ngươi..."
 alert_formless_reward_available_title: "Quà tặng của Kẻ Vô hình"
 alert_formless_reward_available_instant: "Kẻ Vô hình trao cho chúng ta một phần thưởng."
 ALERT_FORMLESS_REWARD_AVAILABLE_DETAIL: "Thực thể ngự trị tại trung tâm ngân hà bày tỏ sự cảm kích trước sự giúp đỡ của chúng ta, và hứa hẹn sẽ thỉnh thoảng gửi quà tặng cho chúng ta."
 NAME_Formless_leader: "Zadiga"
 formless_leader_desc: "Một trong những nhà lãnh đạo cuối cùng của Kẻ Vô hình, thực thể đa chiều này đã chỉ huy hạm đội trong một khoảng thời gian dài hơn cả tuổi thọ của hầu hết các giống loài."
 formless_leader_catch_phrase: "Cảm kích... Đón nhận..."
 astral_planes.3155.name: "Tuyên chiến với Kẻ Vô hình"
 astral_planes.3155.desc: "Hành động xâm lược của chúng ta nhắm vào Kẻ Vô hình đã khiến [this.GetName] từ chối ủy nhiệm hạm đội cho chúng ta, những hạm đội này đã tái gia nhập vào hàng ngũ của họ."
 astral_planes.3155.a: "Rất tốt."
 astral_planes.3165.name: "Kẻ Vô hình bị Tiêu diệt"
 astral_planes.3165.desc: "Chúng ta đã tiêu diệt thành công nhóm Kẻ Vô hình cuối cùng còn sót lại ở [event_target:formless_system.GetName].\n\nThứ duy nhất còn sót lại là một thiết bị bí ẩn. Chỉ cần đặt [this.species.GetHandNamePlural] của mình lên trên đó, người ta sẽ có thể kích hoạt đặc tính tái sinh kỳ diệu của nó. Thiết bị này hoạt động như một lối đi dẫn vào mặt phẳng Cõi sao, thông qua nó một lượng lớn vật liệu siêu không gian đang tự do tuôn chảy."
 astral_planes.3170.desc: "Mặc dù chúng ta biết các ngươi...\nNhưng lúc này chưa phải là thời điểm chúng ta hội ngộ..."
 pm_formless_haven: "Nơi trú ẩn của Kẻ Vô hình"
 pm_formless_haven_desc: "Thành trì cuối cùng thuộc sở hữu của thực thể được gọi là Kẻ Vô hình. Dưới sự bảo hộ của họ, các giống loài đến từ những không gian khác sẽ dần dần định cư tại đây."
 pm_formless_haven_tt: "Tạo ra §Y500§! £pop£ §HNhân khẩu§! từ một giống loài khác trên hành tinh này."
 preset_luminarium: "Cõi Rạng đông"
 preset_luminarium_desc: "Cõi Rạng đông là loại hình quốc gia phụ thuộc được tạo ra bởi chủ nhân của Ngai vàng Vĩnh cửu. Đế chế liên không gian của Kẻ Vô hình nay đã lụi tàn thành tro bụi, một khi sở hữu ngai vàng, bạn sẽ có thể sai khiến họ."
 preset_luminarium_flavor_desc: "$preset_luminarium_desc$"
 modifiers_eternal_throne: "$preset_luminarium$"
 eternal_throne_conditions: "$MODIFIER$"
 not_allowed_for_luminarium: "$TRIGGER_FAIL$Không được phép cài đặt trước §Y$preset_luminarium$§!."
