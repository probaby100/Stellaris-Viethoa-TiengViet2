 civic_sovereign_guardianship: "Quyền giám hộ Tối cao"
 civic_sovereign_guardianship_desc: "Tập hợp các bộ tộc thường xuyên giao chiến này đã hình thành nên một khuynh hướng bảo vệ lãnh thổ và luôn trong tư thế phòng thủ trong suốt chiều dài lịch sử đằng đẵng của họ. Giờ đây, khi đã sát cánh bên nhau, họ đã sẵn sàng để mang triết lý này vươn tới các vì sao, với mục đích duy trì một ranh giới vững chắc, và làm giảm bớt những bầu không khí căng thẳng."
 civic_sovereign_guardianship_effects: "Mở khóa §Y$fanatic_guardian_plural$§! để làm lực lượng phòng thủ.\n$civic_sovereign_guardianship_effects_common$"
 civic_hive_sovereign_guardianship: "Tổ đàn Giám hộ"
 civic_hive_sovereign_guardianship_desc: "Cộng đồng này đã dần hình thành được khuynh hướng bảo vệ lãnh thổ và luôn trong tư thế phòng thủ trong suốt chiều dài lịch sử đằng đẵng của họ. Giờ đây, họ đã sẵn sàng để mang triết lý này vươn tới các vì sao, với mục đích duy trì một ranh giới vững chắc, và làm giảm bớt những bầu không khí căng thẳng."
 civic_hive_sovereign_guardianship_effects: "Mở khóa lực lượng phòng thủ §Y$machine_fanatic_guardian_plural$§!.\n$civic_sovereign_guardianship_effects_common$"
 civic_machine_sovereign_guardianship: "Ma trận Giám hộ"
 civic_machine_sovereign_guardianship_desc: "Cộng đồng cơ khí này đã dần hình thành được khuynh hướng bảo vệ lãnh thổ và luôn trong tư thế phòng thủ trong suốt chiều dài lịch sử đằng đẵng của họ. Giờ đây, họ đã sẵn sàng để mang triết lý này vươn tới các vì sao, với mục đích duy trì một ranh giới vững chắc, và làm giảm bớt những bầu không khí căng thẳng."
 civic_machine_sovereign_guardianship_effects: "Mở khóa §Y$machine_fanatic_guardian_plural$§! để làm lực lượng phòng thủ.\n$civic_sovereign_guardianship_effects_common$"
 civic_corporate_sovereign_guardianship: "Quyền giám hộ Doanh nghiệp"
 civic_corporate_sovereign_guardianship_desc: "Xã hội được hình thành bởi những tập đoàn cạnh tranh khốc liệt này đã nhận ra rằng, sự bảo hộ tuyệt vời nhất dành cho các khoản đầu tư của họ chính là một hệ thống phòng ngự kiên cố. Giờ đây, khi đã sát cánh bên nhau, họ đã sẵn sàng để mang triết lý này vươn tới các vì sao, với mục đích duy trì một ranh giới vững chắc, và làm giảm bớt những bầu không khí căng thẳng."
 civic_corporate_sovereign_guardianship_effects: "$civic_sovereign_guardianship_effects$"
 civic_sovereign_guardianship_effects_common: "Cho phép xây dựng §Y$sm_reloading_bay$§! trong Căn cứ Sao.\nMở khóa §HSắc lệnh§! §Y$edict_inner_focus$§!, chuyển đổi £influence£ §YẢnh hưởng§! thành £unity£ §YĐoàn kết§!."
 civic_tooltip_not_guardian: "Không có loại cấu trúc xã hội ['concept_guardian_civics']"
 concept_guardian_civics: "Quyền giám hộ Tối cao"
 concept_guardian_civics_desc: "Loại cấu trúc xã hội $concept_guardian_civics$ bao gồm\n—['civic:civic_sovereign_guardianship']$NEW_LINE$—['civic:civic_corporate_sovereign_guardianship']$NEW_LINE$—['civic:civic_hive_sovereign_guardianship']$NEW_LINE$—['civic:civic_machine_sovereign_guardianship']"
 fanatic_guardian: "Đội Bảo vệ Cuồng nhiệt"
 fanatic_guardian_plural: "Đội Bảo vệ Cuồng nhiệt"
 fanatic_guardian_desc: "Là những người bảo vệ kiên cường cho quê hương chúng ta, những người lính này phát huy khả năng chiến đấu tốt nhất khi bảo vệ những sinh mạng có quan hệ mật thiết với họ."
 machine_fanatic_guardian: "Đơn vị Ma trận"
 machine_fanatic_guardian_plural: "Đơn vị Ma trận"
 machine_fanatic_guardian_desc: "Những máy bay không người lái hộ vệ cực kỳ nguy hiểm này hoạt động với hiệu suất tối đa khi duy trì sự liên kết chặt chẽ với toàn bộ các nút chiến lược khác."
