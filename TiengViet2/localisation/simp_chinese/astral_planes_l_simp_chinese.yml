 FLEETORDER_ASTRAL_JUMP_DESC: "Bằng cách gấp nếp siêu không gian, hạm đội được trang bị Động cơ Nhảy có thể dịch chuyển tức thời tới bất kỳ địa điểm nào trong ranh giới lãnh thổ. Mỗi lần thực hiện một cú gấp sẽ mất $COOLDOWN|Y$ ngày để hồi chiêu, và tiêu tốn $COST|Y$."
