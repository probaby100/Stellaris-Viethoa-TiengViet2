 council_agenda_agenda_dark_matter_breakthrough_name: "Đột phá Vật chất Tối"
 council_agenda_agenda_dark_matter_breakthrough_desc: "Việc thao túng Vật chất Tối, vẫn còn những ứng dụng vô cùng mạnh mẽ mà chúng ta chưa khám phá hết."
 council_agenda_agenda_dark_matter_breakthrough_init_effect_desc: "§RKhóa loại cấu trúc xã hội §Y$civic_dark_consortium$§!, ngăn chặn việc gỡ bỏ nó thông qua cải cách.§!"
 council_agenda_agenda_dark_matter_breakthrough_effect_desc: "Mở khóa một tùy chọn nghiên cứu cho một công nghệ £sr_dark_matter£ Vật chất Tối ngẫu nhiên."
 agenda_dark_matter_breakthrough_techs_obsolete: "$TRIGGER_FAIL$Bí mật của Vật chất Tối đều đã được làm sáng tỏ."
 civic_dark_consortium_locked: "Lịch trình Nội các $council_agenda_agenda_dark_matter_breakthrough_name$ đã được khởi động"
 ########################
 #Anomalies & Projects #
 ########################
 ASTRAL_SCAR_CAT: "$pc_astral_scar$"
 anomaly_astral_scar_desc: "Chúng ta đã phát hiện một vết nứt dị thường trong không thời gian. Càng đến gần nó, những định luật tương đối vật lý đã biết càng không còn tác dụng.\n\nViệc nghiên cứu hiện tượng này rất có thể sẽ nâng tầm hiểu biết khoa học của chúng ta về cơ chế hoạt động của vũ trụ lên một tầm cao mới."
 astral_planes.6000.name: "$pc_astral_scar$"
 astral_planes.6000.desc: "Chúng ta đã hoàn thành việc phân tích §Y$pc_astral_scar$§! nằm tại §Y[FromFrom.System.GetName]§!.\n\nNó đang làm rò rỉ vật chất từ những nơi khác vào vũ trụ của chúng ta. Nguồn vật chất xung quanh vết nứt không được bảo toàn —— ít nhất là theo phương pháp đo lường của chúng ta. Dù ở quy mô tương đối nhỏ, nhưng vết nứt này dường như đang làm gia tăng tổng khối lượng vật chất trong vũ trụ của chúng ta.\n\nNghiên cứu hiện tượng này sẽ giúp chúng ta hiểu rõ hơn về nguồn gốc của năng lượng bí ẩn này."
 ASTRAL_SCAR_PROJECT: "$pc_astral_scar$"
 ASTRAL_SCAR_PROJECT_DESC: "Chúng ta đã phát hiện một vết nứt dị thường trong không thời gian. Nghiên cứu các đặc tính độc đáo của nó sẽ cung cấp cho chúng ta những nhận thức khoa học có giá trị."
 astral_planes.6001.name: "$pc_astral_scar$"
 astral_planes.6001.desc: "Chúng ta đã xác nhận được rằng tồn tại một vũ trụ nằm ngoài vũ trụ của chúng ta bên trong hệ sao §Y[FromFromFrom.System.GetName]§!.\n\nThông qua vết nứt, mặt phẳng vật chất của vũ trụ đó đã tạo ra một áp lực khổng lồ lên vũ trụ của chúng ta, dẫn đến một dòng chảy vật chất nhỏ nhưng liên tục. Chúng ta vẫn chưa thể thấu hiểu được những ảnh hưởng lâu dài của tình trạng này, nhưng trong thời gian tới, chúng ta nên tiếp tục phân tích những vật chất trào ra từ vũ trụ này."
 astral_planes.6001.a: "Bên kia vết nứt ẩn chứa những kỳ quan nào?"
 ASTRAL_SCAR_INSTABILITY: "$pc_astral_scar$ Mất ổn định"
 ASTRAL_SCAR_INSTABILITY_DESC: "Những dị thường trọng lực không ổn định đang rò rỉ ra khỏi §Y$pc_astral_scar$§! tại [From.System.GetName], biểu hiện dưới dạng những điểm kỳ dị di chuyển chậm rãi lan tỏa trong không gian lân cận, trước khi phát nổ ngược vào trong một cách dữ dội. Các phi thuyền băng qua hệ sao này có thể tránh được chúng, nhưng cần phải di chuyển hết sức thận trọng.\n\nTiến hành điều tra sâu hơn về tình trạng này, có thể giúp phát hiện ra phương pháp ổn định lại các vết nứt không gian đa chiều."
 instable_astral_scar_modifier: "$ASTRAL_SCAR_INSTABILITY$"
 astral_planes.6006.name: "Khâu vá Không thời gian"
 astral_planes.6006.desc: "Sau khi phân tích kỹ lưỡng, chúng ta xác định được rằng §Y$pc_astral_scar$§! trong hệ sao [From.System.GetName] đang cực kỳ mất ổn định, cần phải có sự can thiệp ngay lập tức để ngăn chặn hệ sao này tiếp tục sụp đổ thành một điểm kỳ dị trọng lực.\n\nCó thể cân nhắc việc chuyển hướng, tái sử dụng một lượng lớn §Y$astral_threads$§! đang phun trào để “khâu” kín vết rách này. Việc này sẽ sửa chữa lại vết rách của không thời gian, và có thể sẽ để lại một lượng lớn vật chất Cõi sao.\n\nHoặc, chúng ta có thể ném một lượng lớn đạn dược vào để mở rộng vết rách này ra. Chúng ta dự đoán rằng, làm như vậy sẽ giúp chúng ta có cơ hội khám phá những thứ có thể tồn tại ở phía bên kia vết sẹo này."
 astral_planes.6006.a: "Khâu chặt nó lại."
 astral_planes.6006.b: "Cho nổ tung nó đi."
 astral_planes.6007.name: "Vết thương Vũ trụ"
 astral_planes.6007.desc: "Bằng cách thao tác tinh vi với kết cấu bị rách của nó, chúng ta đã thành công trong việc phong ấn hoàn toàn §Y$pc_astral_scar$§! tại [From.System.GetName]. Những điểm dị thường trọng lực kể từ đó đã dừng lại, và trong suốt quá trình chúng ta đã thu hồi được một lượng lớn §Y$astral_threads$§!.\n\nBất kể thực tại phía bên kia vết nứt có ra sao, nó cũng không còn là mối đe dọa đối với chúng ta nữa."
 astral_planes.6008.name: "$astral_planes.6007.name$"
 astral_planes.6008.desc: "Số đạn dược mà chúng ta ném vào phần cốt lõi của §Y$pc_astral_scar$§! tại [From.System.GetName] đã làm nếp gấp của không thời gian ngày càng giãn rộng. Nơi đây từng chỉ là một vết rách nhỏ trên kết cấu của vũ trụ, nhưng nay đã biến thành một vết nứt lớn hơn, đủ để chúng ta tiến vào thám hiểm.\n\nSự ổn định từ đó đã làm suy yếu những dị thường trọng lực, và chúng ta đã chuẩn bị sẵn sàng để khám phá những bí ẩn được chôn giấu bên trong."
 astral_planes.6009.name: "Cõi sao Sụp đổ"
 astral_planes.6009.desc: "§Y$pc_astral_scar$§! tại [FromFromFromFrom.System.GetName] đã sụp đổ vào trong, và phun ra một lượng lớn $astral_threads$ vào các hệ sao lân cận. Từng có một vết rách nhỏ xuất hiện trên kết cấu của vũ trụ tại đây, nhưng giờ đã hóa thành khoảng không tĩnh lặng.\n\nBất kể thực tại phía bên kia vết nứt có ra sao, nó cũng không còn là mối đe dọa đối với chúng ta nữa."
 GREATEST_SHOW_CAT: "Phát hiện Vật thể Phát sáng"
 anomaly_greatest_show_desc: "Chúng ta đã phát hiện được một vật thể phát sáng rực rỡ bên trong một tiểu hành tinh thuộc §Y[from.System.GetName]§!.\n\nĐược chế tạo từ một vật liệu vô cùng tiên tiến, nó đang phát ra một dải sóng vô tuyến ổn định trên mọi tần số. Máy quét của chúng ta cho thấy không có bất kỳ hợp chất hóa học dễ nổ hay dễ bay hơi nào bên trong nó. Có vẻ như chúng ta có thể tiếp cận an toàn và tiến hành nghiên cứu sâu hơn."
 astral_planes.6010.name: "Chương trình Giải trí Hấp dẫn nhất Đa vũ trụ"
 astral_planes.6010.desc: "Vật thể phát sáng mà chúng ta tìm thấy trên tiểu hành tinh này là một mẫu quảng cáo.\n\nThiết bị trưng bày khổng lồ này được hỗ trợ bởi hệ thống hạ tầng cơ khí nằm sâu trong lòng tiểu hành tinh. Bản thân tiểu hành tinh này cũng đang lơ lửng tại một điểm trong không gian một cách dị thường, không chịu sự tác động lực hấp dẫn từ bất kỳ vật thể nào xung quanh.\n\nMẫu quảng cáo này có nội dung về một thứ mà nó gọi là “Chương trình Giải trí Hấp dẫn nhất Đa vũ trụ”. Nó có một cổng thanh toán để nhận năng lượng, từ đó sẽ đưa chúng ta đi thẳng đến địa điểm này."
 astral_planes.6010.a: "Thanh toán."
 astral_planes.6010.b: "Cải tạo lại bảng hiệu này để phục vụ cho mục đích riêng của chúng ta."
 astral_planes.6010.c: "Tháo dỡ nó để lấy linh kiện thừa."
 astral_planes.6011.name: "Vết nứt Xuất hiện"
 astral_planes.6011.desc: "Sau khi xử lý khoản thanh toán của chúng ta, hệ thống máy móc bên trong tiểu hành tinh bắt đầu kêu rè rè. Một luồng ánh sáng xanh chói mắt phóng ra, xé toạc kết cấu không thời gian một cách chuẩn xác. Khi quá trình này kết thúc, tiểu hành tinh cũng biến mất, thay vào đó là một vết nứt cõi sao xuất hiện ngay tại vị trí cũ của nó."
 astral_planes.6011.a: "Rất ấn tượng."
 astral_planes.6012.name: "Chiến dịch Quảng bá Hiệu quả"
 astral_planes.6012.desc: "Chúng ta đã dùng một doanh nghiệp địa phương uy tín để thay thế cho đơn vị quảng cáo kỳ quặc ở [fromfrom.GetName]. Sau khi cẩn thận tháo dỡ thiết bị thanh toán, chúng ta tìm thấy một lượng nhỏ năng lượng bên trong nó."
 astral_planes.6012.a: "Thật biết cách kinh doanh."
 astral_planes.6013.name: "Hệ thống Bảng hiệu Phức tạp"
 astral_planes.6013.desc: "Công nghệ được ứng dụng trong hệ thống máy móc bên trong tiểu hành tinh này tiến tiến hơn nhiều so với dự đoán ban đầu của chúng ta. Vì vậy, công tác tái chế đã mang lại những giá trị rất đáng kể. Chúng ta đã tìm thấy vô số vật liệu quý hiếm —— trong đó có lượng §Y$astral_threads$§! nhiều đến ngạc nhiên. Tiểu hành tinh rỗng ruột này chắc hẳn được thiết kế để có thể thao túng không gian và thời gian theo một phương thức nào đó."
 astral_planes.6013.a: "Chúng ta phải tận dụng tối đa những thứ này."
 BLACK_HOLE_INSTABLE_CAT: "$sc_black_hole$ Mất ổn định"
 anomaly_black_hole_instable_desc: "Máy quét của chúng ta đã phát hiện ra các đặc tính vật lý của hố đen trong hệ sao [from.System.GetName] có sự sai lệch đáng kể so với dự tính. Lực hấp dẫn của nó là không thể đoán trước, dẫn đến việc khoảng cách giữa điểm này tới điểm khác trong không gian có sự sai biệt rõ rệt về mặt thời gian."
 astral_planes.6020.name: "Hố đen Mất ổn định"
 astral_planes.6020.desc: "Một vài hạt do hố đen tại [from.System.GetName] giải phóng ra thực chất là §Y$astral_threads$§!. Điều này có nghĩa là tại một thời điểm nào đó, một vết sẹo cõi sao đã bị hút vào điểm kỳ dị của hố đen, và giờ đây đang từ từ bị phun trào ra ngoài. Một sự kiện như vậy trước đây được cho là bất khả thi.\n\nCó lẽ, tồn tại một phương pháp nào đó để bơm các chùm tia §Y$astral_threads$§! nồng độ cao vào trong điểm kỳ dị, từ đó khiến vết sẹo cõi sao bị đẩy ra ngoài, và ổn định lại không gian trong hệ sao này.\n\nTuy nhiên, nếu không thực hiện bất kỳ hành động nào nữa, chúng ta vẫn có thể tiếp tục thu thập thứ vật liệu vũ trụ này từ một khoảng cách an toàn."
 astral_planes.6020.a: "Bơm vật chất cõi sao vào điểm kỳ dị."
 astral_planes.6020.b: "Thu thập các sợi tơ từ khoảng cách an toàn."
 astral_planes.6021.name: "Vết nứt Xuất hiện"
 astral_planes.6021.desc: "Việc bơm §Y$astral_threads$§! vào điểm kỳ dị ngay lập tức tạo ra một phản ứng dữ dội, do lực hấp dẫn của hố đen, một lượng lớn các hạt siêu không gian bị đẩy ra ngoài. Những hạt này đã tập hợp lại tạo thành một $astral_rift$ lơ lửng trong hố trọng lực của nó.\n\nChúng ta vẫn chưa hiểu được bằng cách nào mà dị thường thiên thể này có thể bị điểm kỳ dị hút vào, nhưng ít nhất hiện tại chúng ta có thể điều tra xem có thứ gì đang tồn tại ở bên kia vết nứt."
 astral_planes.6022.name: "Vết sẹo Ra đời"
 astral_planes.6022.desc: "Hố đen tại [from.System.GetName] đã tống $pc_astral_scar$ từng bị điểm kỳ dị của nó hấp thụ ra ngoài, kéo theo đó là một lượng lớn vật chất cõi sao bị mắc kẹt bên trong.\n\nLực hấp dẫn của hố đen hiện tại đã trở lại bình thường."
 astral_planes.6030.name: "Kỳ quan Cõi sao"
 astralnomical_interest_modifier: "Hứng thú Cõi sao"
 astralnomical_interest_tt: "Mỗi £pop£ §Hnhân khẩu hữu cơ§! không phải nô lệ mỗi tháng sản xuất 1 £physics_research£ §YĐiểm nghiên cứu Vật lý§!."
 astral_planes.6030.desc.common_1: "Cư dân trên [this.GetName] đã hình thành một sở thích, đó là say mê một "
 astral_planes.6030.desc.common_2: ", nằm trên vùng trời có thể quan sát được thuộc bán cầu nam của hành tinh. Mọi người đều suy đoán sôi nổi về nguồn gốc của nó, cũng như những mối nguy hiểm hay cơ hội mà nó mang lại.\n\nNhững người đam mê thiên văn học nghiệp dư từ khắp nơi trên [owner.GetName] đã tụ hội về hành tinh này, để tận mắt chứng kiến cảnh tượng kỳ vĩ này."
 astral_planes.6030.desc.rift: "$astral_planes.6030.desc.common_1$$astral_rift$ $astral_planes.6030.desc.common_2$"
 astral_planes.6030.desc.scar: "$astral_planes.6030.desc.common_1$$pc_astral_scar$ $astral_planes.6030.desc.common_2$"
 astral_planes.6035.name: "Cảnh tượng Xung đột"
 astral_planes.6035.tt: "Thuộc địa bị trừ 5 $r_stability$"
 conflicting_visions: "$astral_planes.6035.name$"
 astral_planes.6035.desc.common_1: "Niềm đam mê với "
 astral_planes.6035.desc.common_2: " tại địa phương đã biến thành một cơn cuồng nhiệt trên [this.GetName]. Rất nhiều người báo cáo rằng, họ đã nhìn thấy một nơi nào đó nằm ngoài thế giới của chúng ta.\n\nTrong đó, một nhóm tuyên bố rằng "
 astral_planes.6035.desc.common_3: " này dẫn tới trung tâm của một vũ trụ đồng hồ, nơi một vị Thần Cơ Khí đang lên dây cót cho bảng thời gian, nhằm duy trì sự cân bằng giữa vô vàn thế giới.\n\nNgược lại, có những người khác nói rằng trong ảo ảnh của họ xuất hiện một ngôi sao màu đen, và nó chính là chiếc chìa khóa để khai sáng."
 astral_planes.6035.desc.rift: "$astral_planes.6035.desc.common_1$$astral_rift$ $astral_planes.6035.desc.common_2$vết nứt$astral_planes.6035.desc.common_3$"
 astral_planes.6035.desc.scar: "$astral_planes.6035.desc.common_1$$pc_astral_scar$ $astral_planes.6035.desc.common_2$vết nứt$astral_planes.6035.desc.common_3$"
 astral_planes.6040.name: "Rạn nứt Ngày càng lớn"
 astral_planes.6040.tt: "Thuộc địa bị trừ 5 tới 10 $r_stability$"
 widening_divide_1: "$astral_planes.6040.name$"
 widening_divide_2: "$widening_divide_1$"
 widening_divide_3: "$widening_divide_1$"
 widening_divide_4: "$widening_divide_1$"
 widening_divide_5: "$widening_divide_1$"
 widening_divide_6: "$widening_divide_1$"
 astral_planes.6040.desc.common: "Sự rạn nứt giữa các nhóm người ngày càng trở nên sâu sắc trên [this.GetName]. Những ảo ảnh kỳ lạ do cư dân báo cáo đã châm ngòi cho những cuộc tranh luận gay gắt, và cuối cùng biến thành các vụ bạo lực. Các nhà lãnh đạo địa phương đã kêu gọi đưa ra một tuyên bố chính thức.\n\nMặc dù có vẻ hoang đường, nhưng chúng ta được yêu cầu phải đưa ra một lời giải thích đáng tin cậy về sự tồn tại của vị Thần Cơ Khí hay Ngôi sao Đen, coi đó như là lời giải thích đối với "
 astral_planes.6040.desc.rift: "$astral_planes.6040.desc.common$$astral_rift$."
 astral_planes.6040.desc.scar: "$astral_planes.6040.desc.common$$pc_astral_scar$."
 astral_planes.6040.a: "Vị Thần Cơ Khí muôn năm."
 astral_planes.6040.b: "Hãy để họ chứng kiến Ngôi sao Đen."
 astral_planes.6040.c: "Dù là cảnh tượng nào đi chăng nữa thì cũng chẳng có ích lợi gì."
 astral_planes.6045.name: "Xung đột Hậu Lý thuyết"
 astral_planes.6045.desc: "Thảm họa đã xảy ra trên [this.GetName]!\n\nNhững ảo ảnh xung đột nhau mà mọi người trải qua đã dẫn đến tình trạng bất ổn lan rộng. Các nhóm đối địch đã cầm vũ khí lên, và những cuộc đụng độ lẻ tẻ ở quy mô nhỏ đã bùng phát thành các cuộc xung đột bạo lực trên phạm vi toàn cầu.\n\nTình trạng này không thể cứ tiếp diễn mãi được."
 astral_planes.6045.a: "Chấm dứt sự điên rồ này đi."
 astral_planes.6050.name: "Sự Sùng bái Cõi sao"
 astral_zeal_modifier: "Sự Sùng bái Cõi sao"
 astral_zeal_modifier_tt: "Nhận được một lượng nhỏ $r_unity$ sau khi hoàn thành nhiệm vụ §Y$astral_rift$§!."
 astral_planes.6050.desc.common_1: "Khi những luận điểm trong ảo ảnh về "
 astral_planes.6050.desc.common_2: " bắt đầu được mọi người tin tưởng, các cuộc tranh cãi về "
 astral_planes.6050.desc.common_3: " cũng giảm đi đáng kể. Cùng lúc đó, sự cuồng nhiệt của công chúng dành cho việc nghiên cứu nó cũng đạt đến một đỉnh cao chưa từng thấy."
 astral_planes.6050.desc.mechgod: "Thần Đồng Hồ"
 astral_planes.6050.desc.blackstar: "Ngôi sao Đen Mở mang Tâm trí"
 astral_planes.6050.desc.rift_mechgod: "$astral_planes.6050.desc.common_1$$astral_planes.6050.desc.mechgod$ $astral_planes.6050.desc.common_2$$astral_rift$$astral_planes.6050.desc.common_3$"
 astral_planes.6050.desc.rift_blackstar: "$astral_planes.6050.desc.common_1$$astral_planes.6050.desc.blackstar$ $astral_planes.6050.desc.common_2$$astral_rift$$astral_planes.6050.desc.common_3$"
 astral_planes.6050.desc.scar_mechgod: "$astral_planes.6050.desc.common_1$$astral_planes.6050.desc.mechgod$ $astral_planes.6050.desc.common_2$$pc_astral_scar$ $astral_planes.6050.desc.common_3$"
 astral_planes.6050.desc.scar_blackstar: "$astral_planes.6050.desc.common_1$$astral_planes.6050.desc.blackstar$ $astral_planes.6050.desc.common_2$$pc_astral_scar$$astral_planes.6050.desc.common_3$"
 astral_planes.6055.name: "Kiểm duyệt Tranh luận"
 astral_aficionados_modifier: "Kẻ hâm mộ Cuồng nhiệt Cõi sao"
 astral_planes.6055.desc.common: "Tất cả những cuộc thảo luận công khai về những ảo ảnh kỳ lạ trên [this.GetName] đã bị nghiêm cấm. Bất kỳ ai bị phát hiện đang nói về chủ đề cấm kỵ này đều sẽ phải chịu những hình phạt nghiêm khắc, điều này đã giúp ngăn chặn các cuộc xung đột công khai.\n\nRất nhiều cư dân đã chuyển sang theo đuổi những điểm nóng mới, nhưng vẫn còn một nhóm nhỏ những người đam mê thiên văn học cực đoan tiếp tục tận hưởng cảnh quan hùng vĩ này, "
 astral_planes.6055.desc.rift: "$astral_planes.6055.desc.common$tiếp tục quan sát $astral_rift$."
 astral_planes.6055.desc.scar: "$astral_planes.6055.desc.common$tiếp tục quan sát $pc_astral_scar$."
 astral_planes.6055.a: "Đây là một biện pháp có thể hiểu được."
 SPONTANEOUS_EXPLOSIONS_CAT: "Phát nổ Tự phát"
 COLONIZATION_IMPOSSIBLE_UNDER_INVESTIGATION: "$TRIGGER_FAIL$§RHành tinh đã được khảo sát.§!"
 anomaly_spontaneous_explosions_desc: "Chúng ta phát hiện ra những vụ nổ tự phát trên bề mặt của §Y[this.GetName]§!! Trong tình trạng không có chiến hạm trên quỹ đạo cũng như không có sự sống có thể dò tìm trên mặt đất, nguyên nhân dẫn đến những vụ nổ kinh hoàng này vẫn còn là một ẩn số."
 astral_planes.6060.name: "Đạn dược Dễ nổ"
 astral_planes.6060.desc: "Bề mặt của §Y[from.GetName]§! phủ đầy những vũ khí hỏng hóc, và mỗi vụ nổ đều chia cắt hành tinh thành từng mảnh vụn.\n\nChúng ta hoàn toàn lạ lẫm với những thứ vũ khí này, và bản thân chúng cũng cực kỳ dễ kích nổ. Thêm vào đó, đồ hình hình thành từ các vụ nổ cho thấy có cả một mạng lưới kích nổ được chôn sâu trên toàn bộ hành tinh này."
 astral_planes.6060.a: "Tiến hành điều tra sâu hơn."
 SPONTANEOUS_EXPLOSIONS: "$astral_planes.6060.name$"
 SPONTANEOUS_EXPLOSIONS_DESC: "$astral_planes.6060.desc$"
 astral_planes.6065.name: "$SPONTANEOUS_EXPLOSIONS$"
 astral_planes.6065.desc: "Phân tích kỹ lưỡng hơn cho thấy, hành tinh này đã từng được sử dụng như một kho chứa vũ khí khổng lồ. Sau hàng thiên niên kỷ ngủ yên, một số vũ khí hiện tại đã bắt đầu gặp trục trặc, biến toàn bộ hành tinh thành một bãi chiến trường đầy bất ổn.\n\nChúng ta có đủ khả năng để kích nổ tất cả đạn dược còn lại theo một cách có kiểm soát. Hoặc, chúng ta có thể thử thu hồi một số loại vũ khí và vô hiệu hóa chúng trước khi chúng phát nổ."
 astral_planes.6065.a: "Thổi tung nó lên tận trời xanh đi."
 astral_planes.6065.b: "Cố gắng tái chế những khối thuốc nổ cổ đại này."
 astral_planes.6065.c: "Cứ để nơi này tự sinh tự diệt đi."
 astral_planes.6070.name: "Vết nứt Xuất hiện"
 astral_planes.6070.desc.common_1: "Sau khi bố trí một loạt thuốc nổ được thiết kế tinh xảo xung quanh [from.GetName], chúng ta đã kích hoạt một phản ứng dây chuyền, hủy diệt hoàn toàn hành tinh này."
 astral_planes.6070.desc.common_2: "Chúng ta suy luận về mặt lý thuyết rằng vết nứt này được hình thành do một vụ nổ vô cùng khủng khiếp có khả năng tạo ra điểm kỳ dị, bắt nguồn từ một loại vũ khí nào đó trong kho lưu trữ vũ khí."
 astral_planes.6070.desc.no_rift: "$astral_planes.6070.desc.common_1$\n\nVụ nổ tạo ra sở hữu uy lực vô cùng khủng khiếp, không những phá hủy hành tinh mà còn xé toạc kết cấu không thời gian, dẫn đến sự hình thành của thứ mà giờ đây chúng ta gọi là §Y$astral_rift$§!.\n\n$astral_planes.6070.desc.common_2$"
 astral_planes.6070.desc.rift: "$astral_planes.6070.desc.common_1$\n\nVụ nổ tạo ra sở hữu uy lực vô cùng khủng khiếp, không những phá hủy hành tinh mà còn tạo ra một §Y$astral_rift$§! mới.\n\n$astral_planes.6070.desc.common_2$"
 astral_planes.6075.name: "Thu hồi Vũ khí Thành công"
 astral_planes.6075.desc: "Chúng ta đã có thể thiết lập một đường ống thu hồi vũ khí được cất giữ trên bề mặt hành tinh, chuyển đổi loại vũ khí đang trong trạng thái kích hoạt về trạng thái trơ, sau đó đưa vào để lưu trữ và phân tích.\n\nViệc thành lập một khu định cư cố định trên hành tinh này sẽ cho phép chúng ta khai thác kho dự trữ còn lại một cách hiệu quả hơn."
 astral_planes.6076.name: "Tìm thấy Đạn dược Kỳ dị"
 astral_planes.6076.desc: "Những nhà nghiên cứu đang làm việc tại [from.GetName] đã tìm thấy một tên lửa tạo điểm kỳ dị đã bị hư hỏng trong kho vũ khí bị bỏ hoang trên hành tinh này. Loại vũ khí này dường như được thiết kế để tạo ra một đợt sụp đổ hấp dẫn bằng phương pháp bạo lực, có khả năng xé toạc kết cấu của không thời gian.\n\nĐáng tiếc thay, thứ vũ khí này đã bị hư hỏng đến mức không thể sửa chữa được nữa, và công nghệ để chế tạo ra nó cũng vượt quá khả năng sao chép của chúng ta. Mặc dù vậy, chúng ta có lẽ vẫn có thể tái sử dụng nó để nghiên cứu các loại vũ khí có tính bùng nổ tương đương."
 astral_planes.6076.a: "Tốt lắm."
 astral_planes.6080.name: "Cướp Cò"
 astral_planes.6080.desc.common_1: "Trong lúc nỗ lực thiết lập hệ thống thu hồi những vũ khí bị bỏ hoang tại [from.GetName], [this.GetName] đã bị phá hủy bởi một thiết bị nổ gặp trục trặc. Tất cả mọi người trên tàu đều thiệt mạng, bao gồm cả [leader.GetName].\n\nVụ nổ của con tàu còn kích hoạt thêm một loạt các phản ứng dây chuyền bất ổn trong mạng lưới kho chứa vũ khí."
 astral_planes.6080.desc.common_2: "$astral_planes.6070.desc.common_2$"
 astral_planes.6080.desc.no_rift: "$astral_planes.6070.desc.common_1$\n\nVụ nổ tạo ra sở hữu uy lực vô cùng khủng khiếp, không những phá hủy hành tinh mà còn xé toạc kết cấu không thời gian, dẫn đến sự hình thành của thứ mà giờ đây chúng ta gọi là §Y$astral_rift$§!.\n\n$astral_planes.6070.desc.common_2$"
 astral_planes.6080.desc.rift: "$astral_planes.6070.desc.common_1$\n\nVụ nổ tạo ra sở hữu uy lực vô cùng khủng khiếp, không những phá hủy hành tinh mà còn tạo ra một §Y$astral_rift$§! mới.\n\n$astral_planes.6070.desc.common_2$"
 astral_planes.6085.name: "Phản ứng Dây chuyền"
 astral_planes.6085.desc: "Vũ khí thiếu ổn định trên [from.GetName] do tự phát nổ đã gây ra một chuỗi các phản ứng dây chuyền, dẫn đến việc hành tinh này bị chia cắt hoàn toàn.\n\nGiữa đống đổ nát, chúng ta đã phát hiện ra một lượng lớn §Y$volatile_motes$§!. Loại tài nguyên này chắc hẳn là thành phần cốt lõi của loại vũ khí được chôn cất sâu dưới bề mặt hành tinh."
 d_weapon_extraction_facility: "Cơ sở Thu hồi Vũ khí"
 d_weapon_extraction_facility_desc: "Cơ sở này được sử dụng để xử lý những vũ khí cổ đại còn sót lại trong kho tàng của một nền văn minh đã bị diệt vong."
 munitions_decommissioner: "$job_munitions_decommissioner$"
 job_munitions_decommissioner: "Sĩ quan Giải trừ Quân trang"
 job_munitions_decommissioner_plural: "Sĩ quan Giải trừ Quân trang"
 job_munitions_decommissioner_desc: "Những nhà nghiên cứu theo phái thực dụng này chịu trách nhiệm kiểm tra các loại vũ khí cổ đại, đảo ngược công nghệ của chúng để biến chúng thành những thiết bị phù hợp với trang bị hiện đại của chúng ta."
 mod_job_munitions_decommissioner_add: "Vị trí $job_munitions_decommissioner$"
 job_munitions_decommissioning_unit: "Đơn vị Giải trừ Quân trang và Đạn dược"
 job_munitions_decommissioning_unit_plural: "Đơn vị Giải trừ Quân trang"
 job_munitions_decommissioning_unit_desc: "Đơn vị chuyên trách, được sử dụng để tháo dỡ và phân tích vũ khí cổ đại."
 mod_job_munitions_decommissioning_unit_add: "Vị trí $job_munitions_decommissioning_unit$"
 job_munitions_decommissioning_drone: "Thiết bị Không người lái Giải trừ Quân trang"
 job_munitions_decommissioning_drone_plural: "Thiết bị Không người lái Giải trừ Quân trang"
 job_munitions_decommissioning_drone_desc: "Những thiết bị không người lái này có khả năng tháo dỡ hiệu quả vũ khí cổ đại, khiến chúng tương thích với cấu hình trang bị hiện đại của chúng ta."
