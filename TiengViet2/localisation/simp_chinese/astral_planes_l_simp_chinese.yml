 situation_crystal_sphere_desc: "Một vật thể bí ẩn đã xuất hiện. Chúng ta tin rằng việc thám hiểm các vết nứt không thời gian của chúng ta đã thu hút sự chú ý của một người hay một thứ gì đó."
 rift_sphere_missing: "Chúng ta chưa có được công nghệ §Y$tech_rift_sphere$§! cần thiết để tiến hành nghiên cứu một cách bài bản."
 formless_seal_defeat_all_fleets: "Chúng ta phải tiêu diệt toàn bộ những kẻ xâm nhập cuối cùng, để Kẻ Vô hình có thể phong ấn hệ sao [Root.Target.GetName] một cách chính xác."
