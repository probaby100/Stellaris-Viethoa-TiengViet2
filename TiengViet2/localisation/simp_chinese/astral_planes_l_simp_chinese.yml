 FLEETORDER_PHASE_FLEET_DESC: "Các hạm đội quân sự có thể thực hiện dịch chuyển pha để rời khỏi mặt phẳng thực tại hiện tại của chúng ta. Hạm đội Dịch chuyển Pha sẽ quay trở lại sau $DURATION|Y$ ngày —— và được sửa chữa hoàn toàn. Mỗi hạm đội chỉ có thể thực hiện hành động Dịch chuyển Pha sau mỗi $COOLDOWN|Y$ ngày, đồng thời tiêu tốn $COST|Y$."
