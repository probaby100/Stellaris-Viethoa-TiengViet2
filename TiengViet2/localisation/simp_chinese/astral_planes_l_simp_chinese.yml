 job_astral_researcher_desc: "Những sợi tơ của không thời gian ẩn chứa bí mật của mọi chiều không gian, bao gồm cả chiều không gian của chính chúng ta. Những nhà nghiên cứu này làm việc không biết mệt mỏi, nỗ lực giải mã ý nghĩa của chúng, đồng thời hạn chế tối đa các nghịch lý có thể xảy ra."
