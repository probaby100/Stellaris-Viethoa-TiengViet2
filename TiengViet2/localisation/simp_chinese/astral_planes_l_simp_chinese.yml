 leader_trait_rift_warped: "Biến dạng Vết nứt"
 leader_trait_rift_warped_desc: "Nhà lãnh đạo này từng băng qua mặt phẳng Cõi sao, chuyến hành trình ấy đã mang lại những ảnh hưởng to lớn và sâu sắc"
 leader_trait_partially_digested: "Bị tiêu hóa một phần"
 leader_trait_partially_digested_desc: "Nhà lãnh đạo này đã không may chạm trán một con sâu khổng lồ đến từ chiều không gian khác. Mặc dù cơ thể không còn lành lặn như trước, nhưng giờ đây họ lại có một cái nhìn vô cùng thấu đáo về sinh học phân tử."
 leader_trait_planar_theorist: "Nhà lý thuyết Mặt phẳng"
 leader_trait_planar_theorist_desc: "Nhà lãnh đạo này chuyên nghiên cứu về hành vi của Vết nứt Cõi sao và các chiều không gian khác."
 leader_trait_spacebender: "Kẻ uốn cong Không gian"
 leader_trait_spacebender_desc: "Có khả năng đồng bộ cực kỳ sâu sắc với những khoảng hở giữa không gian, nhà lãnh đạo này có thể dễ dàng luồn lách giữa các hệ sao."
 leader_trait_spacebender_effect: "$THIS_LEADER_TXT$:\n$t$Không cần phí bảo trì"
 leader_trait_energy_weapon_specialist: "Chuyên gia Vũ khí Năng lượng"
 leader_trait_energy_weapon_specialist_desc: "Khả năng tính toán và lấy nét cực kỳ chuẩn xác cần thiết để hiệu chỉnh hoàn hảo các loại vũ khí năng lượng thường đòi hỏi hàng giờ học tập, nhưng đối với vị chỉ huy này, dường như đó là một tài năng thiên bẩm."
 trait_plasmic: "Huyết tương (Plasmic)"
 trait_plasmic_desc: "Lớp màng ngoài và cơ thể vô định hình của giống loài này giúp chúng dễ dàng thích ứng với mọi môi trường, và hoàn toàn miễn nhiễm trước mọi loại bệnh tật."
 trait_exd: "Thể Đa chiều (EXD)"
 trait_exd_desc: "Giống loài này có nguồn gốc từ một chiều không gian khác, do đó chúng tiêu thụ một lượng năng lượng khổng lồ để có thể tồn tại trong vũ trụ của chúng ta."
 TRAIT_EXD_EFFECT: "—Chi phí bảo trì $energy_with_icon$ cho mỗi $pop_group_unit$ £pop£ dân số: §R+$@living_standard_energy_normal|*0$§!\n$t$—Mỗi $pop_group_unit$ £pop£ §Hnhân khẩu§! thuộc giai cấp nô lệ hoặc cao hơn mỗi tháng sản xuất 0.5 £physics_research£ §YĐiểm nghiên cứu Vật lý§!"
 ######################
 # Nguồn Gốc - Thế Giới Khe Nứt #
 ######################
 origin_riftworld: "Khe Nứt Trên Bầu Trời"
 origin_riftworld_desc: "Một khe nứt không-thời gian khổng lồ treo lơ lửng trên bầu trời hành tinh quê hương của nền văn minh này. Sau gần một thiên niên kỷ nghiên cứu hiện tượng này, những tiến bộ gần đây trong công nghệ phi thuyền cuối cùng đã cho phép họ tiếp cận nó và khám phá những bí mật ẩn giấu bên trong."
 origin_tooltip_riftworld_effects: "—Có một ['concept_archaeology_site', 'địa điểm khảo cổ'] ['concept_riftworld_digsite', 'độc đáo'] trên $HOMEWORLD$$NEW_LINE$—Hành tinh thuộc địa trong hệ sao có ['concept_astral_rift', $ASTRAL_RIFTS$]: ['modifier:riftworld_affinity']$NEW_LINE$—Tỷ lệ xuất hiện §Y$ASTRAL_RIFTS$§! trong các hệ sao do bạn kiểm soát: §G+100%§!"
 START_SCREEN_RIFTWORLD: "Kể từ khi chúng ta có ký ức, Đại Khe Nứt đã treo lơ lửng trên bầu trời của [GetHomeWorldName]. Truyền thuyết kể rằng quá khứ xa xôi của chúng ta gắn liền với vết sẹo trên bầu trời này và với Hố Thiên thạch gần thủ đô của chúng ta.\n\nTừ thế hệ này sang thế hệ khác, chúng ta đã coi hố thiên thạch này là thánh địa, nhưng lại biết rất ít về nó. Tuy nhiên, hoạt động địa chấn gần đây đã làm lộ ra một điểm dị thường bên dưới hố. Chúng ta đang bắt đầu khoan vào tâm của nó. Về việc sẽ tìm thấy gì trong đó, vẫn còn nhiều ý kiến khác nhau. $START_SCREEN_RIFTWORLD_END$"
 START_SCREEN_RIFTWORLD_MACHINE: "Đại Khe Nứt đã treo lơ lửng trên bầu trời của [GetHomeWorldName] từ thời điểm sớm nhất mà cơ sở dữ liệu của chúng ta có thể truy xuất. Đồng hồ nội bộ của chúng ta được đồng bộ hóa với tần số của thiên thể khe nứt này, trong khi những hồ sơ sớm nhất ghi lại một hố thiên thạch cổ đại nằm gần thủ đô của chúng ta.\n\nQua vô số vòng lặp, hố thiên thạch này đã được bảo tồn, nhưng chúng ta hầu như không có hiểu biết gì về nó. Tuy nhiên, hoạt động địa chấn gần đây đã làm lộ ra một điểm dị thường bên dưới hố. Chúng ta đang chuẩn bị khoan vào tâm của nó. $START_SCREEN_RIFTWORLD_END$"
 START_SCREEN_RIFTWORLD_END: "\n\nĐây chỉ là một sự trùng hợp ngẫu nhiên khi công nghệ động cơ siêu không gian của chúng ta đạt được những tiến bộ? Ngay khi chúng ta vươn tới bầu trời, sự chú ý của chúng ta lại bị kéo trở lại mặt đất. Có lẽ bên dưới lòng đất của hành tinh này ẩn chứa những sự soi sáng cho chuyến du hành giữa các vì sao của chúng ta, có lẽ nó có thể giúp chúng ta chuẩn bị để đối phó với những gì ở đầu bên kia của khe nứt."
 START_SCREEN_RIFTWORLD_NOMADS: "Từ thuở ban sơ trong ký ức của chúng ta, Vết rách Lớn đã luôn ngự trị giữa cõi hư không — sừng sững nơi chân trời của chuyến hành trình, vừa bí ẩn khôn lường lại vừa thân thuộc khôn nguôi. Truyền thuyết kể rằng quá khứ xa xăm của ta gắn liền mật thiết với vết sẹo trời cao này, cùng một điểm va chạm cổ xưa ẩn sâu bên trong thân Tàu cứu thế.\n\nSuốt nhiều năm qua, nơi ấy tựa như một chốn linh thiêng, dẫu hiếm ai thực sự hiểu rõ về nó. Thế nhưng, những dao động gần đây từ hệ thống lõi của Tàu cứu thế đã kéo sự chú ý về các khoang tàu bị niêm phong từ lâu quanh điểm va chạm. Chúng ta đang chuẩn bị phá mở những khoang tàu này, còn về thứ đang đón đợi bên trong, ai nấy đều có phỏng đoán cho riêng mình.\n\nDao động hệ thống xuất hiện trùng khớp vào thời điểm công nghệ động cơ vượt tốc ánh sáng ra đời, liệu có đơn thuần là ngẫu nhiên? Ngay khi chúng ta toan vươn tay chạm tới muôn vì sao, tâm trí lại bị kéo ngược về chính con tàu của mình. Có lẽ, thứ được phong kín bên trong Tàu cứu thế vốn dĩ sinh ra để trợ lực cho ta. Biết đâu, nó sẽ chuẩn bị cho chúng ta hành trang sẵn sàng đối mặt với bất cứ điều gì đang ẩn nấp phía bên kia Vết rách Lớn."
 riftworld_affinity: "Thích Ứng Khe Nứt"
 riftworld_affinity_desc: "Sự phát triển xã hội của chúng ta dưới ảnh hưởng của sự tồn tại xuyên không gian, đã khơi dậy niềm đam mê khám phá sâu hơn trong nghiên cứu khoa học."
 astral_planes.2105.name: "Tín Hiệu Liên Lạc Kỳ Lạ"
 astral_planes.2105.desc: "Chúng ta đã nhận được một đoạn tín hiệu liên lạc kỳ lạ từ dư âm của vụ nổ Khe Nứt Tinh Thể trong §H[From.solar_system.GetName]§!.\n\n[GetScientistPlural] tin rằng nó bắt nguồn từ một nơi vượt xa chính khe nứt và hiện tại chúng ta mới chỉ giải mã được một vài từ và cụm từ rời rạc."
 astral_planes.2110.name: "$astral_planes.2105.name$"
 astral_planes.2110.desc: "...đồng điệu... với chiều không gian này... chúng tôi... sẽ tìm thấy bạn..."
 astral_planes.2120.name: "Phát Hiện Dị Thường Địa Chấn"
 astral_planes.2120.desc: "Hoạt động địa chấn gần đây đã vô tình làm lộ ra bộ mặt thật của một hố thiên thạch cổ đại nằm liền kề với thủ đô của chúng ta.\n\nCái hố độc đáo này chắc chắn có liên quan mật thiết đến nguồn gốc thực sự của giống loài [Owner.GetSpeciesNamePlural] chúng ta."
 riftworld_digsite: "Hố Thiên Thạch Cổ Đại"
 riftworld_digsite_desc: "Chúng ta đã phát hiện ra hoạt động địa chấn dị thường ở tận sâu bên dưới hố thiên thạch trên bề mặt [Planet.GetName]. Sóng âm dưới lòng đất đã phát hiện ra một hang động chưa từng được biết đến."
 astral_planes.2125.name: "Va Chạm Tốc Độ Cao"
 astral_planes.2125.desc: "Trong các công việc khai quật sơ bộ ở đáy hố thiên thạch, chúng ta đã phát hiện ra một khối đá va chạm hình trụ đâm sâu vào các tầng dưới lòng đất.\n\nLớp đá này hẳn có nguồn gốc từ một vụ va chạm ở tốc độ cực cao của một vật thể giống thiên thạch. Các tính toán sơ bộ cho thấy vật thể này đã va chạm với tốc độ gần bằng tốc độ ánh sáng. Việc nó được đưa ra ánh sáng giống như một phép màu."
 astral_planes.2125.a: "Tiếp tục khai quật."
 astral_planes.2130.name: "Hang Động Dưới Lòng Đất"
 astral_planes.2130.desc: "Tại điểm kết thúc của lớp đá va chạm, chúng ta đã phát hiện ra một hệ thống hang động rộng lớn.\n\nCác vũng nước ngầm nuôi dưỡng thảm thực vật mỏng manh, sẫm màu trên các bức tường đá. Bên dưới một trong những vũng nước đó, nằm tĩnh lặng một vật thể hình cầu khác thường. Rõ ràng nó không được tạo ra tự nhiên mà là nguyên nhân của điểm va chạm này."
 astral_planes.2130.a: "Thu hồi vật thể đó."
 astral_planes.2135.name: "Khối Cầu Cổ Đại"
 astral_planes.2135.desc: "Chúng ta đã thu hồi khối cầu từ hồ nước ngầm.\n\nMặc dù bị bao phủ bởi một số thảm thực vật, nhưng phần lớn của nó vẫn còn khá nguyên vẹn. Cách nó được chế tạo là một sự pha trộn kỳ lạ giữa thiết kế cực kỳ phức tạp và lắp ráp thô sơ. Những tấm kim loại nhẵn bóng hoàn hảo bao phủ nửa trước của con tàu, có thể được sử dụng để giảm đáng kể lực cản khi quay lại bầu khí quyển.\n\nĐường đạn lùi từ vị trí của nó nằm trên một đường thẳng với lớp đá va chạm, qua đó xác nhận rằng khối cầu này chính là vật thể giống thiên thạch đã đưa chúng ta đến đây."
 astral_planes.2140.name: "Tổ Tiên"
 astral_planes.2140.desc.common: "Chúng ta đã thu được một rương tài liệu lưu trữ bên trong khối cầu cổ đại này, được viết bằng một phiên bản cổ đại của ngôn ngữ chúng ta. Nhiều cái tên được nhắc đến tương ứng với những truyền thuyết thiêng liêng nhất của chúng ta.\n\nMột mạng lưới cầu thang chằng chịt uốn lượn từ đáy hố thiên thạch lên một hệ thống đường hầm khổng lồ. Từ niên đại của các sợi dây thừng bên trong, những đường hầm này là nơi sinh sống của nhiều thế hệ, những người sống sót này đã từng chút một đục khoét con đường lên bề mặt.\n\nTuy nhiên, những khám phá cho đến nay vẫn không thể chuẩn bị tâm lý cho chúng ta về khám phá cuối cùng: đó là một hang động chứa một khu mộ. Phân tích di truyền hài cốt bên trong đã mang lại kết quả đáng kinh ngạc: những người này chính là tổ tiên của chúng ta.\n\nCòn về việc họ đến từ đâu và tại sao nơi này lại bị lãng quên trong dòng chảy lịch sử, lại là một bí ẩn mới. Các tài liệu lưu trữ được cứu vãn không ở trong tình trạng tốt, nhưng chúng ta vẫn khôi phục được một số nhật ký dữ liệu từ khối cầu. Rõ ràng, con tàu này đã đến hệ sao của chúng ta thông qua Khe Nứt Tinh Thể gần [from.planet.GetName]."
 astral_planes.2140.desc.has_rift_sphere: "$astral_planes.2140.desc.common$\n\nMặc dù rõ ràng là cấp thấp hơn công nghệ của chúng ta, khối cầu này là minh chứng cho khát vọng và trí tuệ của những người chế tạo ra nó. Đây là một phương tiện tối thượng để thoát khỏi số phận bi thảm ở phía bên kia của khe nứt."
 astral_planes.2140.desc.default: "$astral_planes.2140.desc.common$\n\nThông qua một số nghiên cứu, chúng ta có thể sao chép hoặc thậm chí cải thiện công nghệ được sử dụng để chế tạo con tàu có khả năng xuyên không gian này."
 astral_planes.2140.desc.machine.common: "Chúng ta đã tìm thấy một thiết bị lưu trữ bên trong khối cầu cổ đại, trong đó mã hóa một phiên bản cổ đại của hệ thống chúng ta.\n\nMột mạng lưới cầu thang chằng chịt uốn lượn từ đáy hố thiên thạch lên một hệ thống đường hầm khổng lồ. Từ niên đại của các sợi cáp bên trong, những đường hầm này từng chứa nhiều vòng lặp, những người sống sót sau vụ va chạm này đã từng chút một đục khoét con đường lên bề mặt.\n\nDi tích trên cùng chứa một số thứ rất giống với các bộ phận của những mẫu máy đầu tiên của chúng ta. Những người sống sót này có thể là tổ tiên của chúng ta.\n\nCòn về việc họ đến từ đâu và tại sao nơi này lại bị lãng quên trong dòng chảy lịch sử thì vẫn chưa được biết. Dữ liệu chúng ta thu hồi từ khối cầu chỉ ra rõ ràng rằng con tàu hình cầu đến hệ sao của chúng ta có nguồn gốc từ Khe Nứt Tinh Thể gần [from.planet.GetName]."
 astral_planes.2140.desc.machine.has_rift_sphere: "$astral_planes.2140.desc.machine.common$\n\nMặc dù rõ ràng là không tiên tiến bằng công nghệ của chúng ta, nhưng khối cầu này là minh chứng cho sự tuyệt vọng và sự sáng tạo của những người xây dựng nó. Đây là nỗ lực cuối cùng của họ để trốn thoát khỏi số phận kinh hoàng ở phía bên kia của khe nứt."
 astral_planes.2140.desc.machine: "$astral_planes.2140.desc.machine.common$\n\nThông qua một số nghiên cứu, chúng ta có thể sao chép hoặc thậm chí cải thiện công nghệ được sử dụng để chế tạo con tàu có khả năng xuyên không gian này."
 astral_planes.2140.a: "Chúng ta đã tìm thấy nguồn gốc của mình."
 astral_planes.2140.a.synthetic: "Lò rèn đầu tiên của chúng ta đã được tìm thấy."
