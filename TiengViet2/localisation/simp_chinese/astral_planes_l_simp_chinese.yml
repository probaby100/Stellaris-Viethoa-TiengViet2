 #Government & Empire Names #
 #############################
 gov_defensive_union: "Liên minh Phòng thủ"
 gov_defensive_union_desc: "Chính phủ này tập hợp người dân lại với nhau vì một mục tiêu chung đó là kề vai sát cánh chống lại các mối đe dọa từ bên ngoài."
 RT_DEFENSIVE_UNION: "Thủ vệ Tối cao"
 HT_DEFENSIVE_UNION: "Người bảo vệ Tối cao"
 Guardianship: "Vùng Giám hộ"
 Protectorate: "Chính phủ Bảo hộ"
 Stalwart_Legion: "Quân đoàn Tiên phong"
 gov_dimensional_covenant: "Giao ước Đa chiều"
 gov_dimensional_covenant_desc: "Xã hội này được đặt nền móng bằng một sự đồng thuận sâu sắc về mặt tâm hồn. Họ áp dụng các quy chuẩn đạo đức nghiêm ngặt để đảm bảo rằng đông đảo quần chúng đều có thể vững tin vào kiếp sau."
 RT_DIMENSIONAL_COVENANT: "Đấng Tiên khởi"
 HT_DIMENSIONAL_COVENANT: "Đấng Thứ hai"
 Church_of_Otherworlds: "Giáo hội Dị giới"
 Astral_Fellowship: "Hội Ái hữu Cõi sao"
 Dimensional_Commune: "Công xã Đa chiều"
 ##########
 #Civics #
 ##########
 sm_dimensional_shrine: "Ngôi đền Đa chiều"
 sm_dimensional_shrine_desc: "Nằm bên ngoài vũ trụ mà chúng ta đã biết, vẫn tồn tại những lối đi dẫn đến các thế giới khác, cấu tạo tại nơi những thế giới đó kết nối với nhau là vô cùng tinh xảo. Đây chính là nơi chúng ta xây dựng nên những ngôi đền thiêng liêng nhất của mình.\n"
 sm_reloading_bay: "Vịnh Tiếp tế"
 sm_reloading_bay_desc: "Dành một phần quan trọng của Căn cứ Sao để nạp lại đạn dược cho các tổ hợp vũ khí của chúng ta, đồng thời cung cấp thêm các trạm phòng thủ bổ sung.\n"
 requires_dimensional_space_object: "§R Yêu cầu một §Y$WORMHOLE$§!, một §Y$pc_rift_star$§!, một §Y$ASTRAL_RIFT$§!, một §Y$LGATE_GALACTIC$§! hoặc một §Y$SHROUD_TUNNEL_GALACTIC$§!.§!"
 civic_hyperspace_specialty: "Chuyên môn Siêu không gian"
 civic_hyperspace_specialty_desc: "Tốc độ là thứ được hoan nghênh nhất trong xã hội này. Việc điều khiển siêu không gian chỉ là một cách để thăng tiến, cho phép những người có tài năng xuất chúng nhất trong lĩnh vực này có thể được thăng cấp lên tầng lớp cao nhất."
 civic_hyperspace_specialty_effects: "Chắc chắn có tùy chọn nghiên cứu £physics£ §Y$tech_hyper_drive_2$§!.\nSở hữu cấp độ tình báo thấp của các hệ sao nằm trong phạm vi 3 bước nhảy siêu không gian tính từ hệ sao ban đầu."
 civic_hive_hyperspace_specialty: "Đồng bộ Siêu không gian"
 civic_hive_hyperspace_specialty_desc: "Tập thể này luôn theo đuổi tốc độ. Nền tảng phương pháp luận về việc điều khiển siêu không gian đã bám rễ sâu vào cốt lõi của toàn thể cộng đồng, từ đó giúp họ từng bước thấu hiểu được những nguyên lý cơ bản của tỷ lệ thời gian-khoảng cách."
 civic_hive_hyperspace_specialty_effects: "$civic_hyperspace_specialty_effects$"
 civic_machine_hyperspace_specialty: "Tính toán Siêu không gian"
 civic_machine_hyperspace_specialty_desc: "Tập hợp này luôn theo đuổi tốc độ. Lý thuyết về thao tác siêu không gian đã được khắc sâu vào bên trong bộ xử lý của từng cá thể con, khiến cho tập hợp có được sự hiểu biết không ngừng được nâng cao về các nguyên tắc cốt lõi của tỷ lệ thời gian-khoảng cách."
 civic_machine_hyperspace_specialty_effects: "$civic_hyperspace_specialty_effects$"
 civic_corporate_hyperspace_specialty: "Thương mại Siêu không gian"
 civic_corporate_hyperspace_specialty_desc: "Thời gian chính là tiền bạc, và tập đoàn vũ trụ này cũng vô cùng coi trọng tốc độ. Những khoản đầu tư mạnh tay cho R&D đã mang về những trái ngọt, mang lại cho tập đoàn này đặc quyền độc quyền đối với các công nghệ thao túng siêu không gian tiên tiến nhất."
 civic_corporate_hyperspace_specialty_effects: "$civic_hyperspace_specialty_effects$\n£building£ §Y$building_amusement_megaplex$§!$megacorp_civic_branch_office_building_effect$"
 civic_tooltip_not_hyperspace_specialty: "Không có loại cấu trúc xã hội ['concept_hyperspace_specialty_civics']"
 concept_hyperspace_specialty_civics: "Chuyên môn Siêu không gian"
 concept_hyperspace_specialty_civics_desc: "Loại cấu trúc xã hội $concept_hyperspace_specialty_civics$ bao gồm\n—['civic:civic_hyperspace_specialty']$NEW_LINE$—['civic:civic_corporate_hyperspace_specialty']$NEW_LINE$—['civic:civic_hive_hyperspace_specialty']$NEW_LINE$—['civic:civic_machine_hyperspace_specialty']"
 civic_dimensional_worship: "Sùng bái Đa chiều"
 civic_dimensional_worship_desc: "Xã hội này có một niềm tin sắt đá rằng, có một sự tồn tại vô cùng thiêng liêng ở đằng sau nếp gấp của không thời gian. Đối với họ, hệ thống có mức độ thiếu ổn định cao nhất chính là thứ mang ý nghĩa thiêng liêng nhất, vừa là nơi hành hương, vừa là chốn nghiên cứu khoa học."
 civic_dimensional_worship_effects: "$t$—$AVAILABLE_STARBASE_BUILDINGS$['starbase_building:dimensional_shrine', $sm_dimensional_shrine$]"
 civic_dimensional_worship_effects_additional: "—Xác suất hệ sao sở hữu ['concept_astral_rift', $ASTRAL_RIFTS$]: §G+100%§!"
 civic_corporate_dimensional_worship: "Doanh nghiệp Đa chiều"
 civic_corporate_dimensional_worship_desc: "$civic_dimensional_worship_desc$"
