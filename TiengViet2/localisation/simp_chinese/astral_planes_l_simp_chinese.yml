 situation_study_crystal_sphere_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 situation_study_crystal_sphere_observe: "Quan sát và Báo cáo"
 approach_situation_study_crystal_sphere_observe_tt: "Thiết bị này có vẻ như đang từ từ tự điều chỉnh chính nó. Chúng ta tin rằng, theo thời gian, nó sẽ hoàn thành nhiệm vụ mà nó được thiết kế để thực thi."
 situation_study_crystal_sphere_mundane: "Phương pháp Thông thường"
 approach_situation_study_crystal_sphere_mundane_tt: "Nếu chúng ta có thể đầu tư đủ nguồn lực nghiên cứu khoa học để khai thác tiềm năng của thiết bị này, chúng ta tin rằng có thể đẩy nhanh quá trình kích hoạt của nó."
 situation_study_crystal_sphere_astral: "Phương pháp Cõi sao"
 approach_situation_study_crystal_sphere_astral_tt: "Các sợi cõi sao dường như có thể kích thích thiết bị này. Chúng ta càng kích thích, nó kích hoạt càng nhanh."
 study_observe_method: "Thiết bị này có vẻ như đang từ từ tự điều chỉnh chính nó theo một cách thức đã được tính toán kỹ lưỡng. Chúng ta tin rằng, theo thời gian, nó sẽ hoàn thành nhiệm vụ mà nó được thiết kế để thực thi."
 study_mundane_method: "Nếu chúng ta có thể đầu tư đủ nguồn lực nghiên cứu khoa học để khai thác tiềm năng của thiết bị này, chúng ta tin rằng có thể đẩy nhanh quá trình kích hoạt của nó."
 study_astral_method: "Các sợi cõi sao dường như có thể kích thích thiết bị này. Chúng ta càng kích thích, nó kích hoạt càng nhanh."
 finisher_effects_study: "Chúng ta không chắc thiết bị này có thể chứa đựng bí mật gì.\n\nChúng ta lạc quan một cách thận trọng rằng, sau khi kiểm tra xong cấu trúc của nó, chúng ta sẽ có thể thúc đẩy sự tiến bộ của xã hội mình đi xa hơn."
 situation_the_seal: "Phong ấn"
 situation_the_seal_type: "Phong ấn"
 situation_the_seal_desc: "Các cư dân ở trung tâm ngân hà hiện đang bị tấn công bởi một thế lực vô danh, họ thỉnh cầu sự trợ giúp từ chúng ta. Nếu họ thất bại, chúng ta có lẽ sẽ vĩnh viễn không bao giờ có thể biết được vận mệnh của chính mình."
 situation_the_seal_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 situation_the_seal_do_nothing: "Án binh bất động"
 approach_situation_the_seal_do_nothing_tt: "Chúng ta hiện tại sẽ không thực hiện bất kỳ hành động đặc biệt nào."
 situation_the_seal_weave_astral_fabric: "Dệt sợi Cõi sao"
 approach_situation_the_seal_weave_astral_fabric_tt: "Tất cả các phi thuyền đồng minh nằm trong hệ sao §H$NAME_Formless_System$§! nhận §G+50%§! giá trị khiên."
 situation_the_seal_pump_exotic_gases: "Bơm khí lạ"
 approach_situation_the_seal_pump_exotic_gases_tt: "Tất cả các phi thuyền đồng minh nằm trong hệ sao §H$NAME_Formless_System$§! nhận §G+10%§! sát thương vũ khí năng lượng."
 finisher_effects_the_seal: "Nếu chúng ta giải cứu những dạng sống này, chúng ta không dám chắc kết quả sẽ ra sao."
 the_seal_do_nothing_method: "Chúng ta không can thiệp, để mặc cho cuộc xung đột tự diễn biến."
 the_seal_weave_method: "Nếu chúng ta giao những sợi cõi sao thu hồi được cho những thực thể này, họ có thể dùng nó để gia cố khiên phòng thủ của mình."
 the_seal_pump_method: "Các loại khí lạ có tác dụng khuếch đại bên trong bong bóng kỳ lạ của thực thể này. Chúng ta có thể tận dụng nó để cường hóa vũ khí của mình."
 the_seal_weave_astral_fabric_modifiers: "Nếu chúng ta giao những sợi cõi sao thu hồi được cho những thực thể này, họ có thể vận dụng kiến thức uyên thâm về đặc tính của nó để gia cố khiên phòng thủ của mình."
 the_seal_pump_exotic_gases_modifier: "Các loại khí lạ có tác dụng khuếch đại bên trong bong bóng kỳ lạ của thực thể này. Chúng ta có thể tận dụng nó để cường hóa vũ khí của mình."
 destroy_sphere_modifier: "Hòa bình Đa chiều"
 aberrant_fleet_spawn_countdown: "Đợt hạm đội Kẻ Trệch hướng tiếp theo sẽ xuất hiện trong [this.days_before_spawn]."
 astral_situation.1.name: "Quả cầu Pha lê Bị phá hủy"
 astral_situation.1.desc: "Kết thúc rồi.\n\nQuả cầu pha lê đã bị đập vỡ thành vô số mảnh vụn lấp lánh.\n\nChúng ta đã lập tức thu hồi được một lượng lớn vật liệu quý giá. Các nguyên tố cơ bản cấu thành nên nó hoàn toàn khác biệt với bất cứ thứ gì chúng ta từng gặp trước đây.\n\nNgười dân của chúng ta đang ăn mừng quyết định quyết liệt này vì nó đã bảo vệ an toàn cho quê hương. Việc để một thiết bị như vậy tồn tại ở biên giới của chúng ta là một sự vô trách nhiệm."
 astral_situation.5.name: "Kết thúc Nghiên cứu"
 astral_situation.5.desc: "Đây là một thông điệp.\n\nĐược khắc sâu bên trong tinh thể, trên một mạng lưới mà theo lý thuyết là không thể tồn tại, là một bộ chỉ thị.\n\nChúng ta đã tuân thủ nghiêm ngặt các chỉ thị này, và tái tạo thành công những điều kiện được ám chỉ xung quanh quả cầu pha lê. Sự kết hợp chính xác giữa chất khí và các sợi cõi sao đã đóng vai trò “kích hoạt” quả cầu này.\n\nNgay sau đó, nó đột ngột biến mất. Thay vào đó là cảnh tượng ngưng tụ của một vết nứt cõi sao mà chúng ta chưa từng thấy bao giờ.\n\nSự tồn tại của nó đang vẫy gọi chúng ta đến khám phá."
 astral_planes.15.name: "Quả cầu Pha lê"
 astral_planes.15.desc.default: "Một vật thể kỳ lạ đã tiến vào quỹ đạo của [Root.GetHomeWorldName].\n\nVật thể hình cầu bằng tinh thể này khiến chúng ta liên tưởng đến công nghệ §Y$tech_rift_sphere$§! của chính mình, nó đột nhiên xuất hiện mà không có bất kỳ quỹ đạo di chuyển nào được biết đến.\n\nDo ở quá gần [Root.GetHomeWorldName], quả cầu này có thể tạo thành một mối đe dọa nghiêm trọng đối với người dân của chúng ta.\n\nMặt khác, rất có thể nó ẩn chứa những manh mối quý giá về bản chất của việc du hành đa chiều."
 astral_planes.15.desc.win: "Chúng ta đã nắm quyền kiểm soát một vật thể kỳ lạ trên quỹ đạo của [crystal_sphere_system.GetName].\n\nĐây là một vật thể hình cầu bằng tinh thể, cực kỳ giống với công nghệ §Y$tech_rift_sphere$§! mà chúng ta đã phát triển để khám phá các chiều không gian khác.\n\nNó có thể tạo thành một mối nguy hiểm khôn lường đối với đế chế của chúng ta.\n\nMặt khác, chúng ta tin rằng nó có thể chứa một số manh mối quý giá liên quan đến việc du hành đa chiều."
 astral_planes.15.desc.win_delayed: "Dựa trên những nghiên cứu gần đây về các vết nứt cõi sao, chúng ta nhận thấy vật thể hình cầu bằng tinh thể nằm tại [crystal_sphere_system.GetName] có rất nhiều điểm tương đồng với công nghệ §Y$tech_rift_sphere$§! do chúng ta phát triển.\n\nNó có thể tạo thành một mối nguy hiểm khôn lường đối với đế chế của chúng ta.\n\nMặt khác, chúng ta tin rằng nó có thể ẩn chứa một số manh mối quý giá về việc du hành đa chiều."
 astral_planes.15.a: "Nghiên cứu nó."
 astral_planes.15.b: "Phá hủy nó."
 astral_planes.30.name: "Quả cầu Kỳ lạ"
 astral_planes.30.desc: "Chúng ta đã nắm quyền kiểm soát một vật thể kỳ lạ trên quỹ đạo của [crystal_sphere_system.GetName].\n\nChúng ta chưa biết rõ mục đích và nguồn gốc của nó. Có lẽ, nhờ những tiến bộ nghiên cứu trong tương lai, chúng ta sẽ có thể tìm ra manh mối về cách sử dụng nó."
 astral_planes.30.a: "Chúng ta sẽ luôn theo dõi sát sao nó."
