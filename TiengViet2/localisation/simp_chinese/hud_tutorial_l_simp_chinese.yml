l_simp_chinese:
 TIME_CONTROLS_TITLE: "Điều khiển Thời gian"
 TIME_CONTROLS_DESC: "Trò chơi đã tạm dừng. Nhấn vào đây để tiếp tục khi bạn đã sẵn sàng."
 OUTLINER_TITLE: "Tổng quan"
 OUTLINER_DESC: "Mở bảng tổng quan để xem tóm tắt tình hình đế chế ở bất kỳ thời điểm nào. Tại đây hiển thị tất cả hành tinh, hạm đội và các dự án đang tiến hành của đế chế."
 RESOURCE_PANEL_TITLE: "Bảng Tài nguyên"
 RESOURCE_PANEL_DESC: "Tại bảng này, bạn có thể xem tất cả các tài nguyên liên quan của đế chế."
 MENU_PANEL_TITLE: "Bảng Menu"
 MENU_PANEL_DESC: "Bảng này cho phép truy cập các menu chính như công nghệ, truyền thống, chính sách và thiết kế tàu."
 GOVERNMENT_VIEW_TITLE: "Giao diện Đế chế"
 GOVERNMENT_VIEW_DESC: "Nhấn vào đây để mở giao diện, xem cái nhìn tổng quát về đế chế của bạn."
 GALAXY_VIEW_TITLE: "Bản đồ Thiên hà"
 GALAXY_VIEW_DESC: "Bản đồ thiên hà cung cấp cái nhìn tổng quan về thiên hà và đế chế của bạn trong đó. Phần lớn các tương tác trong game đều nên sử dụng bản đồ này."
 TUTORIAL_MISSION_VIEW_TITLE: "Nhiệm vụ"
 TUTORIAL_MISSION_VIEW_DESC: "Cửa sổ nhiệm vụ cung cấp cái nhìn tổng quan về các khía cạnh chính trong trò chơi Stellaris, giúp người chơi xác định bước đi tiếp theo."
 TUTORIAL_MISSION_VIEW_TITLE_HUDONLY: "Menu Trợ giúp"
 TUTORIAL_MISSION_VIEW_DESC_HUDONLY: "Bạn có thể truy cập toàn bộ hướng dẫn giao diện và bách khoa toàn thư của trò chơi bất cứ lúc nào trong menu trợ giúp."
 OUTLINER__SECTORS_TITLE: "Phân khu"
 OUTLINER__SECTORS_DESC: "Phân khu là khu vực hành chính trong đế chế, gồm nhiều hành tinh thuộc địa. Mỗi phân khu có thể được chỉ định một §SThống đốc§! và thiết lập §SĐịnh hướng Phát triển Phân khu§!, giúp phân khu tự phát triển theo định hướng đó, giảm bớt gánh nặng quản lý liên tục cho người chơi."
 OUTLINER__MILITARY_FLEETS_TITLE: "Hạm đội Quân sự"
 OUTLINER__MILITARY_FLEETS_DESC: "Sử dụng các tàu trong hạm đội để bảo vệ quốc gia, hoặc chinh phục kẻ thù."
 OUTLINER__CIVILIAN_SHIPS_TITLE: "Tàu Dân sự"
 OUTLINER__CIVILIAN_SHIPS_DESC: "Dùng những con tàu dân sự này để khảo sát các hệ sao lân cận cũng như xây dựng các trạm không gian mới trong hệ sao."
 RESOURCE_PANEL__EMPIRE_MANAGEMENT_TITLE: "Quản lý Đế chế"
 RESOURCE_PANEL__EMPIRE_MANAGEMENT_DESC: "Đế chế rộng lớn rất khó quản lý, vì vậy hãy chú ý đến các chỉ số này khi phát triển đế chế của bạn."
 RESOURCE_PANEL__FLEET_MANAGEMENT_TITLE: "Quản lý Căn cứ Sao và Hạm đội"
 RESOURCE_PANEL__FLEET_MANAGEMENT_DESC: "Số lượng căn cứ sao và tàu chiến mà bạn có thể duy trì hiệu quả."
 CONTROL_GROUPS_TITLE: "Nhóm Điều khiển"
 CONTROL_GROUPS_DESC: "Bạn có thể thiết lập phím tắt cho hầu hết mọi đối tượng bằng cách chọn mục tiêu và nhấn phím Ctrl cùng một phím số (ví dụ: Ctrl + 5). Để xóa phím tắt, hãy nhấn chuột phải vào nhóm đã chọn."
 MAP_MODES_TITLE: "Chế độ Bản đồ"
 MAP_MODES_DESC: "Các chế độ bản đồ là cách rất tốt để hiển thị thông tin quan trọng về các đế chế được chọn. Các chế độ hiện có gồm: Phân khu, Mạng lưới Siêu không gian, Liên minh Chính trị, Ngoại giao, Đánh giá, Thái độ AI và Các nước Láng giềng."
 SHOW_MORE: "Hiển thị Thêm"
 HUD_TUTORIAL_CLOSE_CONFIRMATION_TITLE: "Thoát hướng dẫn giao diện"
 HUD_TUTORIAL_CLOSE_CONFIRMATION_DESC: "Bạn có chắc chắn muốn thoát khỏi phần hướng dẫn giao diện không? Bạn có thể xem lại bất cứ lúc nào qua §SCửa sổ Trợ giúp§!."
 MENU_PANEL__CONTACTS_TITLE: "Liên lạc"
 MENU_PANEL__CONTACTS_DESC: "Hiển thị tất cả các đế chế và giống loài ngoài hành tinh đã biết trong thiên hà."
 MENU_PANEL__SITUATION_LOG_TITLE: "Nhật ký Tình huống"
 MENU_PANEL__SITUATION_LOG_DESC: "Mở nhật ký của tất cả các sự kiện và dự án đặc biệt đang diễn ra."
 MENU_PANEL__MARKET_TITLE: "Thị trường"
 MENU_PANEL__MARKET_DESC: "Cho phép người chơi bán bớt tài nguyên thừa và mua vào những tài nguyên đang thiếu."
 MENU_PANEL__PLANETS_AND_SECTORS_TITLE: "Hành tinh và Phân khu"
 MENU_PANEL__PLANETS_AND_SECTORS_DESC: "Hiển thị tổng quan về các hành tinh, nhà lãnh đạo và phe phái trong đế chế."
 MENU_PANEL__EXPANSION_PLANNER_TITLE: "Kế hoạch Bành trướng"
 MENU_PANEL__EXPANSION_PLANNER_DESC: "Cho phép người chơi lên kế hoạch cho dự án thuộc địa hóa tiếp theo."
 MENU_PANEL__POLICIES_TITLE: "Chính sách"
 MENU_PANEL__POLICIES_DESC: "Mở giao diện chính sách, nơi bạn có thể xem và ban hành các chính sách của đế chế."
 MENU_PANEL__EDICTS_TITLE: "Sắc lệnh"
 MENU_PANEL__EDICTS_DESC: "Mở giao diện sắc lệnh, nơi bạn có thể xem và ban hành các sắc lệnh của đế chế."
 MENU_PANEL__TRADITIONS_AND_RELICS_TITLE: "Truyền thống và Di vật"
 MENU_PANEL__TRADITIONS_AND_RELICS_DESC: "Cho phép người chơi định hình con đường phát triển độc đáo của đế chế thông qua các truyền thống."
 MENU_PANEL__SHIP_DESIGNER_TITLE: "Thiết kế Tàu"
 MENU_PANEL__SHIP_DESIGNER_DESC: "Mở trình thiết kế tàu, nơi bạn có thể tự tay tạo ra các mẫu thiết kế tàu của riêng mình."
 MENU_PANEL__FLEET_MANAGER_TITLE: "Quản lý Hạm đội"
 MENU_PANEL__FLEET_MANAGER_DESC: "Cho phép người chơi quản lý, chế tạo và nâng cấp tàu chiến."
 MENU_PANEL__TECHNOLOGY_TITLE: "Công nghệ"
 MENU_PANEL__TECHNOLOGY_DESC: "Mở giao diện công nghệ, nơi bạn có thể tiến hành các nghiên cứu khoa học."
 MENU_PANEL__FACTIONS_TITLE: "Phe phái"
 MENU_PANEL__FACTIONS_DESC: "Mở giao diện phe phái, hiển thị các thế lực chính trị hiện có trong đế chế."
 MENU_PANEL__CLAIMS_TITLE: "Yêu sách"
 MENU_PANEL__CLAIMS_DESC: "Cho phép người chơi tạo yêu sách lãnh thổ đối với các hệ sao. Yêu sách có thể được dùng làm lý do để phát động chiến tranh với đế chế khác."
 MENU_PANEL__SPECIES_TITLE: "Giống loài"
 MENU_PANEL__SPECIES_DESC: "Xem danh sách các giống loài sống trong đế chế."
 MENU_PANEL__LEADERS_TITLE: "Lãnh đạo"
 MENU_PANEL__LEADERS_DESC: "Mở giao diện tổng quan về các nhà lãnh đạo của đế chế, bạn cũng có thể sử dụng giao diện này để chiêu mộ lãnh đạo mới."
