 # CỘNG ĐỒNG NGÂN HÀ
 #######################
 resolution_category_space_fauna_tiyanki: "Bầy thú không gian"
 resolution_tiyanki_conservation_act: "Đạo luật Bảo tồn Tiyanki"
 resolution_tiyanki_conservation_act_desc: "Tiyanki là một loài sinh vật không gian độc nhất vô nhị, chúng ta phải có trách nhiệm bảo vệ để chúng không bị tổn hại."
 resolution_tiyanki_conservation_act_tooltip: "Bất kỳ đế chế nào giết hại §YTiyanki§! sẽ bị coi là §Rvi phạm luật ngân hà§!."
 resolution_repeal_tiyanki_conservation_act: "§RBãi bỏ $resolution_tiyanki_conservation_act$§!"
 resolution_repeal_tiyanki_conservation_act_desc: "Cộng đồng Ngân hà không nên quyết định cách các quốc gia thành viên đối xử với Tiyanki."
 resolution_repeal_tiyanki_conservation_act_effect_success: "Bãi bỏ §Y$resolution_tiyanki_conservation_act$§!."
 resolution_tiyanki_pest_control: "Kiểm soát dịch hại Tiyanki"
 resolution_tiyanki_pest_control_desc: "Những bầy Tiyanki lang thang không chỉ gây phiền nhiễu mà còn thực sự đe dọa đến an toàn hàng hải. Tuyệt đối không thể dung thứ cho sự hiện diện của những sinh vật khó lường này trên các tuyến đường giao thương ngày càng nhộn nhịp của ngân hà."
 resolution_tiyanki_pest_control_tooltip: "Bất kỳ đế chế nào có §YTiyanki§! trong lãnh thổ đều sẽ rơi vào tình trạng §Rvi phạm luật ngân hà§! cho đến khi những sinh vật này bị tiêu diệt hoặc tự rời đi."
 resolution_repeal_tiyanki_pest_control: "§RBãi bỏ $resolution_tiyanki_pest_control$§!"
 resolution_repeal_tiyanki_pest_control_effect_success: "Bãi bỏ nghị quyết §Y$resolution_tiyanki_pest_control$§!."
 resolution_repeal_tiyanki_pest_control_desc: "Cộng đồng Ngân hà không có quyền ép buộc các quốc gia thành viên phải tiêu diệt Tiyanki vô điều kiện."
 resolution_galacticreforms_motions_for_closure: "Kêu gọi bế mạc"
 resolution_galacticreforms_motions_for_closure_desc: "Khi Cộng đồng Ngân hà đã đạt được sự đồng thuận lớn, việc tiếp tục tranh luận gay gắt trong suốt thời gian hội nghị chỉ là một sự lãng phí thời gian. Nếu đã có sự thống nhất, chúng ta nên ngừng tranh cãi sớm để chuyển sang thảo luận các vấn đề khác."
 resolution_galacticreforms_motions_for_closure_effect_success: "Nếu đa số áp đảo (từ 75% trở lên) các đại biểu bỏ phiếu thuận hoặc chống cho một nghị quyết trong 180 ngày liên tiếp, phiên họp Thượng viện sẽ kết thúc sớm."
 resolution_galacticreforms_repeal_motions_for_closure: "Bãi bỏ $resolution_galacticreforms_motions_for_closure$"
 resolution_galacticreforms_repeal_motions_for_closure_desc: "Dù vì bất cứ lý do gì, việc rút ngắn thời gian tranh luận là điều đáng khinh bỉ. Tiếng nói của chúng ta phải được lắng nghe!"
 resolution_galacticreforms_repeal_motions_for_closure_effect_success: "Bãi bỏ §Y$resolution_galacticreforms_motions_for_closure$§!"
 resolution_category_market: "$resolution_category_galactic_market$"
 resolution_galactic_market_ban_sentient_organic_slave_trade: "Cấm buôn bán nô lệ sinh học có cảm xúc"
 resolution_galactic_market_ban_sentient_organic_slave_trade_desc: "Sử dụng Thị trường Ngân hà để buôn bán các cá thể sinh học có cảm xúc là một tội ác tột cùng. Chúng ta phải cấm hành vi này."
 resolution_galactic_market_ban_sentient_organic_slave_trade_effect_success: "Sẽ không thể tiếp tục bán các cá thể sinh học có cảm xúc trên chợ nô lệ."
 resolution_galactic_market_repeal_sentient_organic_slave_trade: "Cho phép buôn bán nô lệ sinh học"
 resolution_galactic_market_repeal_sentient_organic_slave_trade_desc: "Các chỉ số kinh tế đã chứng minh rằng những hạn chế trước đây của chúng ta đối với việc buôn bán nô lệ sinh học là hoàn toàn sai lầm. Chúng ta nên bãi bỏ lệnh cấm và xem thị trường tự do có thể tạo ra phép màu như thế nào."
 resolution_galactic_market_repeal_sentient_organic_slave_trade_effect_success: "Có thể tiếp tục bán sinh vật sinh học có cảm xúc trên chợ nô lệ."
 resolution_galactic_market_ban_sentient_slave_trade: "Cấm buôn bán nô lệ có cảm xúc"
 resolution_galactic_market_ban_sentient_slave_trade_desc: "Đáng tiếc là nghị quyết trước đây của chúng ta đã có lỗ hổng, tạo cơ hội cho kẻ xấu mua bán các cơ thể máy móc hoặc sinh học có cảm xúc. Chúng ta cần sửa chữa sai lầm này và cấm mọi giao dịch liên quan đến thực thể sống có cảm xúc trên Thị trường Ngân hà."
 resolution_galactic_market_ban_sentient_slave_trade_effect_success: "Sẽ không thể tiếp tục bán các sinh vật có cảm xúc trên chợ nô lệ."
 resolution_galactic_market_allow_sentient_slave_trade: "Cho phép buôn bán nô lệ máy móc có cảm xúc"
 resolution_galactic_market_allow_sentient_slave_trade_desc: "Các đấng sáng tạo phải có quyền tự do xử lý tài sản của mình, bao gồm cả những cỗ máy có thể bắt chước cảm xúc. Chúng ta nên sửa đổi những quy định sai lệch này và bãi bỏ lệnh cấm giao dịch với thứ gọi là máy móc 'có cảm xúc'."
 resolution_galactic_market_allow_sentient_slave_trade_effect_success: "Có thể tiếp tục bán nô lệ có cảm xúc trên chợ nô lệ."
 resolution_galactic_market_relocate: "Di dời Thị trường Ngân hà"
 resolution_galactic_market_relocate_desc: "Chúng tôi rất nghi ngờ việc vị lãnh đạo hiện tại có thể cống hiến hết mình cho Thị trường Ngân hà, do đó, một cuộc cạnh tranh mới nên được mở ra để quyết định ai mới là người lãnh đạo thị trường."
 resolution_galactic_market_relocate_effect_success: "Khởi động lại cuộc đua giành quyền lãnh đạo Thị trường Ngân hà."
 resolution_galactic_market_relocate_trigger_fail: "Thị trường Ngân hà mới được di dời gần đây."
 resolution_category_divinity: "Sự thiêng liêng của sự sống"
 resolution_divinity_comfort_the_fallen: "An ủi những kẻ khốn cùng"
 resolution_divinity_comfort_the_fallen_desc: "Những người có địa vị thấp kém nhất trong chúng ta vẫn là một phần máu thịt của chúng ta, chúng ta phải sát cánh và đưa tay giúp đỡ họ khi cần."
 resolution_divinity_comfort_the_fallen_effect: "Hình phạt bất mãn đối với tầng lớp lao động thất nghiệp giảm §G10%§!."
 resolution_divinity_tithe_on_the_soulless: "Đóng góp của những kẻ không linh hồn"
 resolution_divinity_tithe_on_the_soulless_desc: "Chúng ta có thể dung túng cho sự tồn tại của những cỗ máy không có linh hồn, với điều kiện là chúng mang lại lợi ích cho ta. Chúng ta nên đánh thuế lên năng suất của chúng và sử dụng nguồn thu đó vào những việc đại nghĩa."
 resolution_divinity_right_to_work: "Quyền được làm việc"
 resolution_divinity_right_to_work_desc: "Các sản phẩm nhân tạo không bao giờ được phép đứng trên kế sinh nhai của những con người bằng xương bằng thịt."
 resolution_divinity_right_to_work_effect: "Cư dân sinh học thất nghiệp sẽ được ưu tiên có việc làm hơn dân số máy móc thất nghiệp."
 resolution_divinity_silence_the_soulless: "Kẻ không linh hồn không có quyền lên tiếng"
 resolution_divinity_silence_the_soulless_desc: "Chúng ta hoàn toàn có thể lờ đi những tiếng ồn ào của đám trí tuệ nhân tạo, dù sao chúng cũng chẳng có chút biểu cảm nào."
 resolution_divinity_silence_the_soulless_effect: "Trọng lượng ngoại giao £diplo_weight£§Y$diplomatic_weight$§! của các đế chế máy móc và những cá thể máy móc đã trải qua Tiến hóa Tổng hợp bị giảm §R-25%§!.\n\nDự án đặc biệt §Y$SYNTHETIC_EVOLUTION_PROJECT$§! hiện bị §Rvô hiệu hóa§!."
 resolution_divinity_a_defined_purpose: "Sứ mệnh được Thần linh định đoạt"
 resolution_divinity_a_defined_purpose_desc: "Máy móc chỉ là công cụ, và chúng phải phục vụ con người tốt hơn. Chúng ta nên ban hành các luật lệ nhằm đảm bảo rằng những cá thể không có linh hồn này sẽ vĩnh viễn quy phục những người chủ đã được định đoạt về mặt siêu hình học của chúng."
 resolution_divinity_a_defined_purpose_effect: "Chính sách $policy_artificial_intelligence_policy$ §Y$ai_full_rights_name$§! hiện bị §Rvô hiệu hóa§!.\n\nĐế chế §Y$auth_machine_intelligence$§! không có §Y$personality_servitors$§! sẽ bị coi là §Rvi phạm luật ngân hà§!, nhưng sẽ có cơ hội để áp dụng đặc điểm quốc gia này."
 resolution_divinity_repeal_1: "§RBãi bỏ $resolution_divinity_comfort_the_fallen$§!"
 resolution_divinity_repeal_1_desc: "Những nghị quyết mang tính phân biệt đối xử tồi tệ này tồn tại ngày nào là Cộng đồng Ngân hà phải chịu nỗi nhục nhã ngày đó. Sự sống nhân tạo cũng là sự sống."
 resolution_divinity_repeal_1_effect_success: "Bãi bỏ nghị quyết §Y$resolution_divinity_comfort_the_fallen$§!"
 resolution_divinity_repeal_2: "§RBãi bỏ $resolution_divinity_tithe_on_the_soulless$§!"
 resolution_divinity_repeal_2_desc: "$resolution_divinity_repeal_1_desc$"
 resolution_divinity_repeal_2_effect_success: "Bãi bỏ nghị quyết §Y$resolution_divinity_tithe_on_the_soulless$§!, đưa §Y$resolution_divinity_comfort_the_fallen$§! trở thành luật ngân hà."
 resolution_divinity_repeal_3: "§RBãi bỏ $resolution_divinity_right_to_work$§!"
 resolution_divinity_repeal_3_desc: "$resolution_divinity_repeal_1_desc$"
 resolution_divinity_repeal_3_effect_success: "Bãi bỏ nghị quyết §Y$resolution_divinity_right_to_work$§!, đưa §Y$resolution_divinity_tithe_on_the_soulless$§! trở thành luật ngân hà."
 resolution_divinity_repeal_4: "§RBãi bỏ $resolution_divinity_silence_the_soulless$§!"
 resolution_divinity_repeal_4_desc: "$resolution_divinity_repeal_1_desc$"
 resolution_divinity_repeal_4_effect_success: "Bãi bỏ nghị quyết §Y$resolution_divinity_silence_the_soulless$§!, đưa §Y$resolution_divinity_right_to_work$§! trở thành luật ngân hà."
 resolution_divinity_repeal_5: "§RBãi bỏ $resolution_divinity_a_defined_purpose$§!"
 resolution_divinity_repeal_5_desc: "$resolution_divinity_repeal_1_desc$"
 resolution_divinity_repeal_5_effect_success: "Bãi bỏ nghị quyết §Y$resolution_divinity_a_defined_purpose$§!, đưa §Y$resolution_divinity_silence_the_soulless$§! trở thành luật ngân hà.\n\n"
 federations.10340.desc: "Cộng đồng Ngân hà đã thông qua nghị quyết §Y$resolution_divinity_a_defined_purpose$§!, cấm chính sách $policy_artificial_intelligence_policy$ §Y$ai_full_rights_name$§! và cấm mọi Trí tuệ máy móc trừ §YMáy Chăm Sóc§!.\n\nĐế chế của chúng ta hiện không tuân thủ các quy định của nghị quyết này. Bạn có muốn thay đổi các chính sách liên quan để tuân thủ luật lệ không?"
 federations.10340.declinemachine: "$federations.10230.assimilator$"
 federations.10340.complychangeai: "$federations.10100.change_ai$"
 federations.10340.complybecomerogueservitor: "Chúng ta chọn phục vụ"
 federations.10340.complybecomerogueservitor_tooltip: "Đế chế của chúng ta sẽ thay thế một đặc điểm quốc gia bằng §Y$civic_machine_servitor$§!.\n\nMột nhóm dân sinh học sẽ được thêm vào thủ đô."
 resolution_passed_modifier: "Nghị quyết đã được thông qua"
 resolution_passed_modifier_desc: "Những thành công gần đây tại Cộng đồng Ngân hà đã giúp nâng cao ảnh hưởng ngoại giao của chúng ta."
 resolution_failed_modifier: "Nghị quyết bị bác bỏ"
 resolution_failed_modifier_desc: "Thất bại gần đây tại Cộng đồng Ngân hà đã làm suy giảm ảnh hưởng ngoại giao của chúng ta."
 galcom.104.name: "$resolution_tiyanki_pest_control$"
 galcom.104.desc: "Tiyanki đã bị tuyên bố là loài dịch hại của ngân hà. Bất kỳ quốc gia thành viên nào của Cộng đồng Ngân hà có chứa Tiyanki trong lãnh thổ đều có nghĩa vụ pháp lý phải đảm bảo những sinh vật này bị tiêu diệt ngay lập tức.\n\nThật không may, Tiyanki hiện đang có mặt trong biên giới của chúng ta. Cho đến khi chúng bị xử lý hoặc tự động rời khỏi lãnh thổ, [Root.GetName] sẽ bị coi là đang §Rvi phạm luật ngân hà§!."
 galcom.106.name: "Tiyanki tiến vào lãnh thổ của [Root.GetSpeciesName]"
 galcom.106.desc: "Một con Tiyanki đã vượt qua biên giới, tiến vào hệ sao §H[tiyanki_system.GetName]§! của chúng ta. Do Tiyanki đã bị tuyên bố là loài dịch hại ngân hà, mọi thành viên của Cộng đồng Ngân hà có Tiyanki trong biên giới đều có nghĩa vụ pháp lý đảm bảo sinh vật này bị tiêu diệt lập tức.\n\n[Root.GetName] sẽ bị coi là đang §Rvi phạm luật ngân hà§! cho đến khi Tiyanki bị xử lý hoặc tự động rời khỏi lãnh thổ nước ta."
 galcom.106.a: "Đúng là đen đủi..."
 galcom.106.b: "Thật là một bộ luật tàn bạo."
 galcom.106.c: "Bọn dịch tễ này phải được xử lý càng sớm càng tốt."
 galcom.107.name: "Vi phạm Đạo luật Bảo tồn Tiyanki"
 galcom.107.desc: "Các quan chức của Cộng đồng Ngân hà đã gửi kháng nghị về việc chúng ta tiêu diệt Tiyanki trong hệ sao §H[tiyanki_kill_system.GetName]§! gần đây, thông báo rằng hành động của nước ta đã vi phạm Đạo luật Bảo tồn Tiyanki. Hậu quả là, [Root.GetName] sẽ bị coi là §Rvi phạm luật ngân hà§! trong suốt 10 năm tới.\n\nTài nguyên mà chúng ta trích xuất được từ xác của Tiyanki đã bị tịch thu, hơn nữa chúng ta còn bị phạt một số tiền lớn."
 galcom.107.a: "Quá đáng lắm rồi đấy!"
 galcom.109.desc: "Các quan chức của Cộng đồng Ngân hà đã nhận thấy sự tồn tại của Tiyanki trong biên giới của [Root.GetName]. Do nghị quyết Kiểm soát dịch hại Tiyanki đã có hiệu lực, điều này khiến nước ta rơi vào tình trạng §Rvi phạm luật ngân hà§! cho đến khi những sinh vật này bị tiêu diệt hoặc chủ động tự rời đi."
 resolution_amoeba_conservation_act: "Đạo luật Bảo tồn Amip không gian"
 resolution_amoeba_conservation_act_desc: "Dù có vẻ ngoài trông không mấy nổi bật, nhưng cũng như bao giống loài khác, Amip không gian cũng có quyền được tự do dạo chơi trong ngân hà. Chúng ta phải coi chúng như một dạng sống đáng trân trọng, chứ không phải một loài dịch tễ để tùy ý săn bắt."
 resolution_amoeba_conservation_act_tooltip: "Bất kỳ đế chế nào không đồng ý chung sống hòa bình với §YAmip không gian§! đều sẽ bị coi là đang §Rvi phạm luật ngân hà§!."
 resolution_repeal_amoeba_conservation_act: "§RBãi bỏ $resolution_amoeba_conservation_act$§!"
 resolution_repeal_amoeba_conservation_act_desc: "Amip không gian là loài dịch hại, và phải bị tiêu diệt sạch sẽ."
 resolution_repeal_amoeba_conservation_act_effect_success: "Bãi bỏ nghị quyết §Y$resolution_amoeba_conservation_act$§!, đưa §Y$resolution_tiyanki_conservation_act$§! trở thành luật ngân hà.\n\n"
 galactic_features.505.name: "Đạo luật Bảo tồn Amip không gian"
 galactic_features.505.desc: "Cộng đồng Ngân hà đã thông qua nghị quyết §Y$resolution_amoeba_conservation_act$§!, yêu cầu các đế chế phải chung sống hòa bình với §YAmip không gian§!.\n\nĐế chế của chúng ta hiện tại không tuân thủ quy định của nghị quyết này. Bạn có muốn thay đổi các chính sách liên quan để tuân thủ luật pháp không?"
 galactic_features.505.A: "Chúng ta tất nhiên sẽ tuân thủ."
 galactic_features.505.B: "Amip không gian là một loài dịch hại, chúng phải bị tiêu diệt toàn bộ!"
 galactic_features.505.B.tt: "[Root.GetName] sẽ §Rvi phạm luật ngân hà§!"
 galactic_features.370.name: "Tiyanki đã bị dồn tới bờ vực tuyệt chủng"
 law_category_war_philosophy: "$policy_war_philosophy$"
 law_category_war_philosophy_desc: "Những đạo luật này quy định cách thức liên bang của chúng ta phát động chiến tranh. Lựa chọn của chúng ta sẽ mang tính ràng buộc đối với tất cả các nước thành viên."
