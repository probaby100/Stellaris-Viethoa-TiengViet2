 #################
 envoy_events.1.name: "Sứ giả [envoy_source.GetAdj] vô lễ"
 envoy_events.1.desc: "Có vẻ như một bên thứ ba đã ác ý xâm nhập vào phần mềm dịch thuật mà sứ giả [envoy_source.GetAdj] đóng tại [Root.Capital.GetName] là [event_envoy.GetName] sử dụng, kết quả là thay vì những lời sáo rỗng hào phóng như thường ngày, [event_envoy.GetSheHe] bắt đầu nhục mạ độc ác và chửi bới mọi người. Lỗi thiết bị của [event_envoy.GetHerHis] đã nhanh chóng được phát hiện, nhưng trước đó [Root.GetRulerTitle][Root.GetRulerName] đã bị gọi là '[ruler_species.GetNameInsult] đê tiện' - họ chắc chắn sẽ phải đưa ra phản hồi về sự sỉ nhục nghiêm trọng này."
 envoy_events.1.A: "Thật là thô lỗ."
 envoy_events.1.B: "Thôi thì cũng khá buồn cười!"
 envoy_events.2.name: "Lỗi phần mềm dịch thuật"
 envoy_events.2.desc.base: "Có vẻ như một bên thứ ba đã ác ý xâm nhập vào phần mềm dịch thuật mà sứ giả [event_envoy.GetName] của chúng ta cử đến [From.GetName] sử dụng, kết quả là những lời lẽ ngoại giao hào phóng của [event_envoy.GetHerHis] biến thành những lời lăng mạ độc ác và chửi rủa mọi người - đặc biệt là [From.GetRulerTitle] của họ bị gọi là '[ruler_species.GetNameInsult] đê tiện'."
 envoy_events.2.desc.pos: "$envoy_events.2.desc.base$\n\nMay mắn thay, sự cố đã nhanh chóng được làm rõ, phe [From.GetSpeciesNamePlural] phản ứng lại với sự việc này bằng khiếu hài hước. Dù vậy, đoạn ghi âm về 'hành vi sai trái của sứ giả [Root.GetAdj]' đã lan truyền rộng rãi và trở thành trò cười cho người dân các nước khác."
 envoy_events.2.desc.neg: "$envoy_events.2.desc.base$\n\nMặc dù sự cố đã nhanh chóng được làm rõ, phe [From.GetSpeciesNamePlural] không thấy chuyện này có gì đáng buồn cười và đã chính thức khiếu nại về hành vi sai trái của sứ giả nước ta."
 envoy_events.2.B: "Quả là một đóng góp cao quý cho xã hội [From.GetAdj]."
 xeno_comedy_envoy: "Trò hề ngoại lai"
 xeno_comedy_envoy_desc: "Hành động sai trái của một sứ giả nước ngoài đã trở thành trò cười truyền miệng trong xã hội của chúng ta."
