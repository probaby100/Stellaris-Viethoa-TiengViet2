 ####################
 # ĐẶC ĐIỂM NGÂN HÀ
 ####################
 ### Tiyanki bởi Henrik Thyrwall ###
 galactic_features.367.name: "Hệ sao quê hương Tiyanki đã được thanh lọc"
 galactic_features.367.a.desc: "$galactic_features.367.1$\n\n$galactic_features.367.2$"
 galactic_features.367.b.desc: "$galactic_features.367.1$\n\n$galactic_features.367.3$"
 galactic_features.367.c.desc: "$galactic_features.367.1$\n\n$galactic_features.367.4$"
 galactic_features.367.1: "Con Tiyanki cuối cùng tại §H[tiyanki_system.GetName]§! đã bị tiêu diệt bởi §H[tiyanki_killer.GetName]§!. Bãi sinh sản cổ xưa đã bị xóa sổ, và Tiyanki sẽ không bao giờ có thể tiếp tục sinh sản được nữa, đây là lần đầu tiên điều này xảy ra trong lịch sử ngân hà."
 galactic_features.367.2: "Có vẻ như việc chúng tiến tới sự tuyệt chủng hoàn toàn là điều không thể tránh khỏi."
 galactic_features.367.3: "Với việc mọi con Tiyanki đã biết bên ngoài [tiyanki_system.GetName] đều đã bị săn bắn, hôm nay đánh dấu sự kết thúc của giống loài Tiyanki. Dù cho Tiyanki từng vẫy vùng khắp ngân hà trong suốt hàng triệu năm, giờ đây chúng đã vĩnh viễn tuyệt diệt."
 galactic_features.367.4: "Có tin đồn cho rằng vẫn còn một cá thể Tiyanki mẫu tộc cổ đại đang lang thang ngoài kia. Bất kể điều đó có đúng hay không, thì kể từ ngày hôm nay, loài Tiyanki chỉ có thể được xem là đã tuyệt chủng."
 galactic_features.368.name: "Cái nôi của sự sống"
 galactic_features.368.desc: "$galactic_features.368.1.desc$\n\n$galactic_features.368.2.desc$"
 galactic_features.368.alt.desc: "$galactic_features.368.1.desc$\n\n$galactic_features.368.3.desc$"
 galactic_features.368.1.desc: "Bên cạnh ngôi sao trong dãy chính của §H[tiyanki_system.GetName]§!, có bốn hành tinh khí khổng lồ quay ở quỹ đạo thấp đang được bao bọc bởi một trường plasma. Trường plasma mang điện tích này thâm nhập sâu vào bầu khí quyển của các hành tinh khí, tạo nên một môi trường vô cùng độc đáo, một cái nôi ươm mầm cho rất nhiều sinh vật không gian sinh sản."
 galactic_features.368.2.desc: "Hầu hết các sinh vật này đều cực kỳ nhỏ bé, nhưng có một ngoại lệ đáng chú ý - loài §HTiyanki§! khổng lồ. Hệ sao này chắc chắn là nơi chúng bắt đầu quá trình tiến hóa dài hàng triệu năm của mình, để rồi sau đó mới bắt đầu rải bước rong ruổi khắp dải ngân hà. Do bản chất cực kỳ hiếm gặp của trường plasma trong hệ sao này, đây rất có thể là bãi sinh sản duy nhất của loài Tiyanki trong toàn ngân hà."
 galactic_features.368.3.desc: "Hầu hết các sinh vật này đều cực kỳ nhỏ bé, nhưng có một ngoại lệ đáng chú ý - một loài sinh vật khổng lồ mà chúng ta chưa từng nhìn thấy trước đây. Dù ta không có nhiều dữ liệu về chúng, nhưng có vẻ như chúng đi lang thang qua các hệ sao khá thường xuyên. Nếu chúng ta có thể tìm hiểu thêm về chúng, ta có lẽ sẽ khám phá được điều gì đã thu hút chúng đến hệ sao này, cũng như liệu hiện tượng này có thể mang lại lợi ích gì cho chúng ta hay không."
 galactic_features.370.a.desc: "$galactic_features.370.1.desc$"
 galactic_features.370.b.desc: "$galactic_features.370.1.desc$\n\n$galactic_features.367.4$"
 galactic_features.370.1.desc: "Cá thể Tiyanki đã biết cuối cùng đã bị §H[tiyanki_killer.GetName]§! săn giết tại hệ sao §H[tiyanki_system.GetName]§!. Những sinh vật không gian này đã xuất hiện từ rất lâu trước khi bất kỳ đế chế hiện tại nào được sinh ra, và người ta tin rằng chúng đã tự do vẫy vùng khắp ngân hà trong suốt hàng triệu năm. Hôm nay chính là điểm kết thúc cho câu chuyện của chúng."
 galactic_features.371.desc: "Rất lâu về trước, ngay cả khi quốc gia chúng ta đang ở thời kỳ hoàng kim, Tiyanki đã được coi là những sinh vật cổ đại... thế mà giờ đây tôi nghe nói một hạm đội [Root.GetSpeciesName] gần đây đã tàn sát những sinh vật không có khả năng tự vệ này, đẩy Tiyanki đến bờ vực tuyệt chủng hoàn toàn.\n\nLiệu bộ não [Root.GetSpeciesName] thấp kém của các người có hiểu được mình đã làm gì không? Các người có mảy may hiểu được hành động vô tâm của mình đã cướp đi thứ gì từ dải ngân hà không?"
 galactic_features.371.a: "Chúng tôi... chúng tôi không cố ý làm vậy."
 galactic_features.371.b: "Thời đại của Tiyanki đã kết thúc, và thời đại của các người cũng vậy."
 galactic_features.371.c: "Mọi chuyện đã qua rồi."
 galactic_features.367.a: "Cả ngân hà phải mang ơn chúng ta."
 galactic_features.367.b: "Một tội ác không thể dung thứ."
 galactic_features.367.c: "Một sự giải thoát tuyệt vời."
 galactic_features.385: "Tiyanki đã bị săn bắt tại [tiyanki_kill_system.GetName]"
 galactic_features.385.desc: "Chúng ta đã săn bắt thành công một số cá thể Tiyanki hoang dã tại hệ sao §H[tiyanki_kill_system.GetName]§!. Hạm đội phe ta đã dùng tia laser cắt xác những con Tiyanki khổng lồ để chiết xuất tài nguyên và khoáng sản từ bên trong."
 #tiyanki_kills: "Harvested Tiyanki:\n§Y[Root.tiyanki_cow_kills]§! §HTiyanki Cows:§! £energy£§Y[Root.tiyanki_cow_credits]§!, £exotic_gases£§Y[Root.tiyanki_cow_gas]§!\n§Y[Root.tiyanki_bull_kills]§! §HTiyanki Bulls:§! £energy£§Y[Root.tiyanki_bull_credits]§!, £exotic_gases£§Y[Root.tiyanki_bull_gas]§!\n§Y[Root.tiyanki_calf_kills]§! §HTiyanki Calves:§! £energy£§Y[Root.tiyanki_calf_credits]§!, £exotic_gases£§Y[Root.tiyanki_calf_gas]§!\n§Y[Root.tiyanki_hatchling_kills]§! §HTiyanki Hatchlings:§! £energy£§Y[Root.tiyanki_hatchling_credits]§!, £exotic_gases£§Y[Root.tiyanki_hatchling_gas]§!\n§Y[Root.tiyanki_ox_kills]§! §HTiyanki Oxen:§! £energy£§Y[Root.tiyanki_ox_credits]§!, £exotic_gases£§Y[Root.tiyanki_ox_gas]§!"
 galactic_features.385.a: "Giết tốt lắm."
 harvested_tiyanki: "Tiyanki đã tiêu diệt:"
 harvested_cows: "§Y[Root.tiyanki_cow_kills]§!§H Tiyanki cái:§!\n"
 harvested_bulls: "§Y[Root.tiyanki_bull_kills]§!§H Tiyanki đực:§!\n"
 harvested_calves: "§Y[Root.tiyanki_calf_kills]§!§H Tiyanki con:§!\n"
 harvested_hatchlings: "§Y[Root.tiyanki_hatchling_kills]§!§H Tiyanki mới nở:§!\n"
 harvested_oxes: "§Y[Root.tiyanki_ox_kills]§!§H Tiyanki trưởng thành:§!\n"
 galcom.110.desc: "Các quan chức của Cộng đồng Ngân hà đã nhận được tin tức về việc chúng ta đã đánh bại mẫu tộc Tiyanki gần đây. Họ thông báo cho phe ta rằng việc tiêu diệt con quái thú này rõ ràng đã vi phạm Đạo luật Bảo tồn Tiyanki, ngay cả khi con Tiyanki mẫu tộc này là một sinh vật hung hãn.\n\n[Root.GetName] sẽ bị coi là đang §Rvi phạm luật ngân hà§! trong mười năm tới. Hơn thế nữa, chúng ta đã nhận một hóa đơn phạt kếch xù với lý do đã tiêu diệt 'một dạng sống Tiyanki đặc biệt mà không bao giờ có thể tìm thấy lại trong toàn dải ngân hà'."
 galcom.110.a: "Con quái đó phải bị xử lý."
 galcom.110.b: "Nhưng... nó đã tấn công chúng ta trước mà!"
 galcom.110.c: "Bọn quái vật này đáng phải chết."
 opinion_killed_tiyanki_fleet_1: "Tàn sát Tiyanki"
 opinion_killed_tiyanki_fleet_2: "$opinion_killed_tiyanki_fleet_1$"
 opinion_killed_all_tiyanki_1: "Làm loài Tiyanki tuyệt chủng"
 opinion_killed_all_tiyanki_2: "$opinion_killed_all_tiyanki_1$"
 opinion_killed_all_tiyanki_3: "$opinion_killed_all_tiyanki_1$"
 27_HOSTILE_GREETING: "Cuộc tấn công man rợ của các người vào lũ Tiyanki là một tội ác không thể tha thứ. Một ngày nào đó, sự trừng phạt sẽ giáng xuống."
 25_NEUTRAL_GREETING: "Các người tàn sát những con Tiyanki không có khả năng chống cự một cách ngông cuồng, việc này sẽ không bị bỏ qua đâu."
 25_FRIENDLY_GREETING: "Tiyanki chưa bao giờ là một mối đe dọa... Các người tấn công Tiyanki là vì mục đích gì?"
 ### Tiyanki Space Graveyard System by Giada Zavarise ###
 ## Event chain
 tiyanki_graveyard_chain_title: "Nghĩa trang Tiyanki"
 tiyanki_graveyard_chain_desc: "Đã phát hiện một hành tinh bị bao phủ hoàn toàn bởi xác của loài Tiyanki trong hệ sao §H[tiyanki_graveyard_system.GetName]§!. Để có thể nghiên cứu bãi tha ma kỳ dị này, trước tiên chúng ta phải xử lý đám gác mộ của nó."
 ## Special project
 TIYANKI_LURE: "Mồi nhử Tiyanki"
 TIYANKI_LURE_DESC: "Tiyanki kiếm ăn bằng cách hấp thụ khí. Bằng việc xây dựng một trạm phát tán khí, chúng ta có thể dụ bầy Tiyanki đang canh gác hệ sao §H[tiyanki_graveyard_system.GetName]§! rời đi, từ đó có thể tiếp cận nghĩa trang của chúng."
 gas_diffuser: "Mồi nhử Tiyanki"
 gas_diffuser_desc: "Trạm không gian này phát tán các đám mây khí giàu dinh dưỡng, dụ dỗ những con Tiyanki gác mộ rời khỏi vị trí."
 ## Point of Interest
 tiyanki_graveyard_poi_title: "Xóa sổ Tiyanki gác mộ"
 tiyanki_graveyard_poi_desc: "Tiêu diệt những con Tiyanki đang canh gác hệ sao §H[tiyanki_graveyard_system.GetName]§! để tiếp cận nghĩa trang của chúng."
 ## Events
 #Surveyed Tiyanki Graveyard System - What to do now?
 galactic_features.387.name: "Bầy thú gác mộ"
 galactic_features.387.desc: "Hành vi của bầy Tiyanki sống tại hệ sao §H[tiyanki_graveyard_system.GetName]§! hoàn toàn khác biệt so với các tập tính đã biết của giống loài này. Mặc dù Tiyanki thường là loài di cư, nhưng bầy này lại đang bám trụ chặt chẽ quanh một hành tinh chứa đầy xác đồng loại của chúng.\n\nNhững xúc tu che khuất cả bầu trời của chúng đã cản trở quá trình nghiên cứu khu nghĩa trang này. Trừ phi chúng ta dụ chúng đi nơi khác hoặc tiêu diệt chúng, nếu không các cuộc điều tra sâu hơn sẽ khó lòng thực hiện được."
 galactic_features.387.a: "Lũ Tiyanki cũng yếu mà. Cứ giết hết đi."
 galactic_features.387.b: "Hãy dụ chúng đi mà không làm hại đến chúng."
 #Tiyanki Graveyard - Destroyed Gravekeepers
 galactic_features.388.name: "Báng bổ nghĩa địa"
 galactic_features.388.desc: "Sau khi xóa sổ bầy Tiyanki trú ngụ tại [FromFrom.System.GetName], [Root.Owner.GetScientistPlural] của chúng ta đã có thể tiếp cận nghĩa địa an toàn để tiến hành các nghiên cứu sâu hơn."
 #Tiyanki Graveyard - Lured Gravekeepers
 galactic_features.389.name: "Mồi nhử thơm ngon"
 galactic_features.389.desc: "Chúng ta đã hoàn thành việc xây dựng mồi nhử Tiyanki tại hệ sao §H[tiyanki_graveyard_system.GetName]§!. Bị đánh lừa bởi loại khí giàu dinh dưỡng tỏa ra từ thiết bị phát tán, bầy thú gác mộ đã bị dụ dỗ rời khỏi vị trí, tạo cơ hội cho [Owner.GetScientistPlural] của chúng ta len lỏi qua những xúc tu khổng lồ và tiếp cận nghĩa địa mà không thu hút bất kỳ sự chú ý nào."
 #Survey - no communication with the Tiyanki
 galactic_features.384.name: "Kẻ hộ vệ bí ẩn"
 galactic_features.384.desc: "Một bầy §H[tiyanki_no_contact.GetName]§! khổng lồ đang tập trung quanh một hành tinh chứa đầy xác chết của một loại sinh vật ngoài hành tinh nào đó.\n\nDo chúng ta không có bất kỳ thông tin gì về những thực thể ngoài hành tinh này, chúng ta chỉ có thể đưa ra các phỏng đoán về hành vi của chúng."
 galactic_features.384.tooltip: "Thiết lập liên lạc lần đầu với §H[tiyanki_no_contact.GetName]§! để tìm hiểu thêm thông tin."
 ## Anomaly
 TIYANKI_ASTEROID_CAT: "Tiểu hành tinh sống"
 TIYANKI_ASTEROID_CAT_DESC: "Các mẫu đá thu thập từ vành đai tiểu hành tinh chứa một lượng lớn mô sinh học, một điều vô cùng bất ngờ."
 #Anomaly result
 anomaly.7100.name: "Khai quật nghĩa địa"
 anomaly.7100.desc: "Ban đầu, [Owner.GetScientistPlural] của chúng ta cứ ngỡ đây là những tiểu hành tinh, nhưng hóa ra chúng lại là xác của loài Tiyanki bị đóng băng và nén chặt. Sau nhiều thập kỷ trôi dạt trên quỹ đạo, chúng đã biến thành những khối vật chất dị dạng. Thực chất, toàn bộ vành đai tiểu hành tinh này là một bãi tha ma lộ thiên. Trong số đó, có một vài cái xác mới được chuyển đến gần đây và đang bắt đầu phân hủy, nhưng phần lớn đã tồn tại từ hàng thiên niên kỷ trước, thậm chí còn lâu đời hơn cả đế chế của chúng ta."
 anomaly.7100.alt.desc: "Ban đầu, [Owner.GetScientistPlural] của chúng ta cứ ngỡ đây là những tiểu hành tinh, nhưng hóa ra chúng lại là xác của các loài động vật ngoài hành tinh bị đóng băng và nén chặt, kích thước của chúng gần như tương đồng với các sinh vật ngoài hành tinh đang lang thang trong hệ sao này. Thực chất, toàn bộ vành đai tiểu hành tinh này là một bãi tha ma lộ thiên. Trong số đó, có một vài cái xác mới được chuyển đến gần đây và đang bắt đầu phân hủy, nhưng phần lớn đã tồn tại từ hàng thiên niên kỷ trước, thậm chí còn lâu đời hơn cả đế chế của chúng ta."
 ## Archeological site
 site_tiyanki_graveyard: "Bãi tha ma Tiyanki"
 site_tiyanki_graveyard_intro: "Toàn bộ bề mặt của [From.Planet.GetName] bị bao phủ bởi xác của loài Tiyanki. Cảm biến của chúng ta không phát hiện ra bất kỳ dấu hiệu của sự sống nào, thế nhưng những cái xác này vẫn không ngừng co giật, như thể có một thế lực vô hình nào đó đang điều khiển chúng."
 ancrel.14100.name: "Quả cầu nhục thể"
 ancrel.14100.desc: "Chúng ta thực sự rất khó để xác định liệu [From.Planet.GetName] có thể được coi là một hành tinh hay không: các mũi khoan thăm dò ban đầu cho thấy hết lớp mô sinh học này đến lớp mô sinh học khác. Ước tính cần tới 2.435.463 xác Tiyanki mới có thể tạo ra một khối lượng cấp hành tinh ở quy mô này (sai số khoảng 5,3%). Ngay cả khi ta giả định rằng lõi của nó là một khối đá và những cái xác chỉ xếp chồng lên trên đó, thì số lượng mẫu vật liên quan vẫn là một con số khổng lồ.\n\nLiệu có một cá nhân hay thế lực nào đó đã mang những con Tiyanki đến đây để chúng chờ chết, hay chúng chỉ tự tìm đến nơi này theo bản năng để trải qua những ngày tháng cuối đời rồi chết đi?"
 ancrel.14100.necro.desc: "$ancrel.14100.desc$ Điều quan trọng nhất là: tại sao các pháp sư gọi hồn của chúng ta lại không thể hồi sinh chúng? Tại sao đống nhục thể chết chóc này lại cự tuyệt chúng ta, giống như thể đã có một thực thể khác đang kiểm soát chúng?"
 ancrel.14200.name: "Ba bước tử thần"
 ancrel.14200.desc: "Những hoạt động... bất thường của các xác chết Tiyanki rải rác khắp bề mặt [From.Planet.GetName] có vẻ như là tác dụng phụ từ khả năng tái sinh của chúng: ngay cả khi đã được xác nhận là đã chết về mặt kỹ thuật, xác của chúng vẫn tiếp tục tái cấu trúc và tái sinh. Hệ sao này sở hữu nguồn dinh dưỡng vô cùng phong phú, đặc biệt là hành tinh khí khổng lồ nơi bọn Tiyanki hay lang thang. Có lẽ điều này đã giải thích lý do tại sao trước đây chúng ta chưa từng quan sát thấy tập tính này.\n\nTuy nhiên, khám phá này không hề giải thích được tại sao những sinh vật đã chết này lại co giật như thể bị điều khiển bởi một trí tuệ duy nhất, liên tục vươn các xúc tu ra và nuốt chửng những cái xác vừa mới hạ cánh xuống hành tinh này.\n\nChúng ta hy vọng các cuộc khai quật sâu hơn sẽ làm sáng tỏ về nơi này, hay những quy luật hoạt động ẩn chứa bên trong sinh vật này... và mang đến cho chúng ta những góc nhìn mới. [Owner.GetScientistPlural] của chúng ta hiện vẫn chưa thể đạt được sự thống nhất về các vấn đề thuật ngữ cũng như phân loại."
 ancrel.14300.name: "Mê cung núi thây biển máu"
 ancrel.14300.desc: "Đoàn khai quật của chúng ta đã phát hiện ra một mạng lưới đường hầm phức tạp, kéo dài từ bề mặt của [From.Planet.GetName] xuống sâu dưới lòng đất. Các phân tích hóa học đã xác nhận rằng các bức tường của mê cung được cấu tạo từ các mô của Tiyanki bị nén chặt. Mặc dù niên đại của chúng thậm chí còn lâu đời hơn cả đế chế của chúng ta, nhưng lớp thịt vẫn tỏa ra hơi ấm, và gần như không có dấu hiệu phân hủy. Có vẻ như những cái xác này đã tự liên kết lại với nhau, tái cấu trúc hình dạng của chúng để tạo nên nơi này... nhưng tại sao chứ?"
 ancrel.14400.name: "Bóng ma trong đường hầm"
 ancrel.14400.desc: "Trong lúc lập bản đồ mạng lưới đường hầm ngầm của [From.Planet.GetName], [Owner.GetScientistPlural] của chúng ta chợt nhận ra rằng hệ thống đường hầm này có cấu trúc giống hệt như hệ thống mạch máu của một con Tiyanki - nhưng quy mô của nó lại đạt đến mức độ của cả một hành tinh.\n\nNhững bức tường nhịp đập liên hồi tỏa ra hơi ấm nhè nhẹ, và khi đoàn thám hiểm càng tiến gần đến phần lõi của hành tinh, nhiệt độ của các bức tường cũng dần tăng lên - tại khu vực lõi, máy quét của chúng ta đã bắt được một tín hiệu sự sống mờ nhạt."
 ancrel.14400.matriarch.desc: "Trong lúc lập bản đồ mạng lưới đường hầm ngầm của [From.Planet.GetName], [Owner.GetScientistPlural] của chúng ta chợt nhận ra rằng hệ thống đường hầm này có cấu trúc giống hệt như hệ thống mạch máu của một con Tiyanki - nhưng quy mô của nó lại tương đương với con Tiyanki mẫu tộc hay lang thang giữa các vì sao mà chúng ta từng bắt gặp.\n\nNhững bức tường nhịp đập liên hồi tỏa ra hơi ấm nhè nhẹ, và khi đoàn thám hiểm càng tiến gần đến phần lõi của hành tinh, nhiệt độ của các bức tường cũng dần tăng lên - tại khu vực lõi, máy quét của chúng ta đã bắt được một tín hiệu sự sống mờ nhạt."
 ancrel.14510.name: "Não bộ chủ"
 ancrel.14510.desc: "Bên trong một hang động ngầm khổng lồ, một con Tiyanki đang đứng thẳng, chiếc đầu hình chuông hơi đung đưa, những chiếc xúc tu mảnh như sợi chỉ của nó dang rộng ra, kết nối với lớp tường bên ngoài của hang động. Dường như nó đã trở thành một loại thiết bị điều khiển nào đó, không ngừng thao túng và chỉ đạo sự phát triển của nghĩa địa cấp hành tinh này.\n\n[Owner.GetScientistPlural] của chúng ta không thể xác định được loài sinh vật nào sẽ ra đời từ quá trình đáng sợ này, nhưng có một điều chắc chắn là khi nó thức tỉnh, nó sẽ trở thành một thực thể lớn hơn và đáng sợ hơn nhiều so với những con Tiyanki thông thường."
 ancrel.14510.matriarch.desc: "Bên trong một hang động ngầm khổng lồ, một con Tiyanki đang đứng thẳng, chiếc đầu hình chuông hơi đung đưa, những chiếc xúc tu mảnh như sợi chỉ của nó dang rộng ra, kết nối với lớp tường bên ngoài của hang động. Dường như nó đã trở thành một loại thiết bị điều khiển nào đó, không ngừng thao túng và chỉ đạo sự phát triển của nghĩa địa cấp hành tinh này.\n\n[Owner.GetScientistPlural] của chúng ta không thể xác định được khi nào quá trình này sẽ hoàn tất, nhưng tin chắc rằng một khi sinh vật này thức tỉnh, nó sẽ trở thành một thực thể lớn hơn và đáng sợ hơn nhiều so với những con Tiyanki thông thường: sinh vật này xứng đáng được chúng ta gọi là một §HTiyanki mẫu tộc§! mới."
 ancrel.14510.a: "Cắt bỏ phần lõi."
 ancrel.14510.b: "Giám sát sự phát triển của nó mà không làm hại nó."
 ancrel.14510.c: "Cứ để cho dạng sống thần thánh này được lớn lên trong yên bình."
 ancrel.14510.d: "Giám tuyển chắc chắn sẽ trả một cái giá hời cho tiêu bản này."
 ancrel.14510.e: "Tiềm năng tái sinh tuyệt vời làm sao!"
 ancrel.14520.name: "Não bộ chủ"
 ancrel.14520.desc: "Bên trong một hang động ngầm khổng lồ, một con Tiyanki đang đứng thẳng, chiếc đầu hình chuông hơi đung đưa, những chiếc xúc tu mảnh như sợi chỉ của nó dang rộng ra, kết nối với lớp tường bên ngoài của hang động. Dường như nó đã trở thành một loại thiết bị điều khiển nào đó, không ngừng thao túng và chỉ đạo sự phát triển của nghĩa địa cấp hành tinh này. Tuy nhiên, sinh vật này hiện đã chết, bị phá hủy bởi chính những thiết bị khai quật mà chúng ta dùng để đến được nơi đây. Lớp vỏ bọc quanh lõi trở nên nhợt nhạt và dễ vỡ, và toàn bộ khu vực này đã phải trải qua cái chết lần thứ hai."
 ancrel.14910.name: "Ô nhiễm môi trường"
 ancrel.14910.desc: "Một thành viên trong đoàn thám hiểm của chúng ta đã đột ngột mất tích khi đang khám phá các đường hầm. Đội tìm kiếm đã mất vài ngày để xác định vị trí của [Owner.GetScientist], kết quả là phát hiện ra người này đã bị một bức tường nuốt chửng, cơ thể bị trói chặt bởi vô số các xúc tu.\n\nViệc giải cứu [Owner.GetScientist] tốn rất nhiều thời gian và công sức. Không chỉ đơn thuần là bị trói: bức tường đang cố gắng đồng hóa [Owner.GetScientist] ở cấp độ phân tử, biến người này trở thành một phần bề mặt của nó.\n\nHiện tại tình trạng của [Owner.GetScientist] đã ổn định, nhưng người này lại nhất quyết không chịu rời khỏi tàu nghiên cứu của chúng ta - thậm chí ngay cả khi ở trên tàu, người này vẫn dùng ánh mắt vô cùng ngờ vực để nhìn chằm chằm vào các bức tường, nơm nớp lo sợ sẽ có một cuộc tấn công tiếp theo."
 ancrel.14910.b.evopred: "Một con đường thú vị để thu thập sinh khối."
 ### Amoebas by Pierre du Plessis ###
 galactic_features.500.name: "Nơi sinh sản"
 galactic_features.500.desc.base: "Thoạt nhìn, hệ sao [From.GetName] bộc lộ một sự khắc nghiệt dữ dội: tất cả các hành tinh đều không thể sinh sống được, nếu không bị thiêu rốt bởi ba mặt trời của hệ sao thì cũng bị càn quét bởi những cơn bão mặt trời dữ dội. Thế nhưng, có một dạng sống vẫn kiên cường sinh sôi nảy nở trong môi trường khắc nghiệt này, đó chính là Amip không gian. Chúng đã từ bỏ lối sống cô độc vốn có, tập hợp lại thành bầy đàn đông đúc, bay lượn giữa khu vực nội hệ thiêu đốt và những hành tinh khí khổng lồ xa xôi, đây dường như là một nghi thức sinh sản đã được tính toán tỉ mỉ."
 galactic_features.500.desc: "$galactic_features.500.desc.base$\n\nHiện vẫn chưa rõ nguyên nhân nào khiến bầy Amip lại ưa chuộng một hệ sao khắc nghiệt như thế này. Dù sao đi nữa, có vẻ như chúng có ý định bảo vệ lãnh địa của mình, và đã chĩa mũi dùi vào [Root.GetName], công khai đe dọa chúng ta."
 galactic_features.500.desc.peaceful: "$galactic_features.500.desc.base$\n\nHiện vẫn chưa rõ nguyên nhân nào khiến bầy Amip lại ưa chuộng một hệ sao khắc nghiệt như thế này. May mắn thay, chúng có vẻ sẵn sàng chia sẻ lãnh địa của mình với chúng ta, và không có bất kỳ hành động thù địch nào đối với [Root.GetName]."
 galactic_features.500.alt.desc: "Thoạt nhìn, hệ sao [From.GetName] bộc lộ một sự khắc nghiệt dữ dội: tất cả các hành tinh đều không thể sinh sống được, nếu không bị thiêu rốt bởi ba mặt trời của hệ sao thì cũng bị càn quét bởi những cơn bão mặt trời dữ dội. Thế nhưng, dường như có một lượng lớn các sinh vật không gian khổng lồ chưa từng được biết đến đang cư ngụ tại đây. Chúng bay lượn giữa khu vực nội hệ thiêu đốt và những hành tinh khí khổng lồ xa xôi, có vẻ như đang thực hiện một nghi thức sinh sản đã được tính toán tỉ mỉ.\n\nHiện vẫn chưa rõ hệ sao này có sức hút gì đối với những sinh vật này. Dù sao đi nữa, có vẻ như chúng có ý định bảo vệ lãnh địa của mình, và đã chĩa mũi dùi vào chúng ta, công khai tiếp cận [Root.GetName] với một thái độ đầy đe dọa."
 galactic_features.502.name: "Vị khách mới của [FromFrom.GetName]"
 galactic_features.502.desc: "Một bầy Amip không gian khổng lồ đã tách khỏi quần thể của chúng ở hệ sao [amoeba_home_system.GetName], và bắt đầu hành trình lang thang đơn độc trong ngân hà. Bọn sinh vật này đã tiến vào lãnh thổ của chúng ta tại hệ sao [FromFrom.GetName], mang theo bản tính tự nhiên của mình, dường như chúng không thể dung thứ cho sự hiện diện của chúng ta, và thế là chúng bắt đầu tấn công các tiền đồn của chúng ta."
 galactic_features.502.desc.peaceful: "Một bầy Amip không gian khổng lồ đã tách khỏi quần thể của chúng ở hệ sao [amoeba_home_system.GetName], và bắt đầu hành trình lang thang đơn độc trong ngân hà. Hiện tại, có thể quan sát thấy một số lượng khổng lồ của chúng đang rầm rộ di chuyển qua hệ sao [FromFrom.GetName]. May mắn thay, chúng ta đã khám phá ra bí quyết để chung sống hòa bình với những sinh vật khổng lồ này, vì vậy ta không cần phải quá lo lắng về các hoạt động của chúng."
 galactic_features.502.alt.desc: "Một bầy sinh vật không gian khổng lồ đã tách khỏi quần thể của chúng ở hệ sao [amoeba_home_system.GetName], và bắt đầu hành trình lang thang đơn độc trong ngân hà. Những sinh vật này đã xâm nhập vào lãnh thổ của chúng ta, dường như chúng không thể dung thứ cho sự hiện diện của chúng ta, và thế là chúng bắt đầu tấn công các tiền đồn của chúng ta tại hệ sao [FromFrom.GetName]."
 ### Space Storm by Henrik Thyrwall ###
 galactic_features.402.name: "Bão vũ trụ càn quét ngân hà"
 galactic_features.402.desc: "Một sự nhiễu loạn không gian con khổng lồ đã xuất hiện trên toàn bộ ngân hà! Các báo cáo ban đầu cho thấy 50% các hệ sao trong ngân hà bị ảnh hưởng bởi hiện tượng chưa từng có này, nguyên nhân dường như là tác dụng phụ của việc sử dụng du hành siêu không gian quá thường xuyên bởi các nền văn minh trong quá khứ và hiện tại suốt hàng nghìn năm qua.\n\nCác nhà khoa học tin chắc rằng 'cơn bão vũ trụ' cấp ngân hà này sẽ tự tan biến trong vòng 5 đến 10 năm. Trước lúc đó, cơn bão sẽ gây ra những thiệt hại nghiêm trọng cho động cơ cận quang tốc, máy tạo khiên và hệ thống cảm biến ở tất cả các hệ sao bị ảnh hưởng."
 galactic_features.402.a: "Chuyện này rồi sẽ sớm qua thôi."
 galactic_features.404.name: "Bão vũ trụ đã tan"
 galactic_features.404.desc: "Cơn bão vũ trụ từng càn quét qua nhiều khu vực trong ngân hà đến nhanh mà đi cũng nhanh. Hệ thống dẫn đường trong các hệ sao có sự nhiễu loạn không gian con không còn phải chịu bất kỳ tổn hại nào nữa.\n\nMặc dù có những đồn đoán rằng những cơn bão tương tự cuối cùng sẽ làm sụp đổ mạng lưới siêu không gian sau hàng nghìn năm nữa, nhưng ít nhất vào lúc này, hoạt động du hành vũ trụ có vẻ như đã trở lại bình thường."
 galactic_features.405.name: "Bão vũ trụ [storm_name.GetFirstName] ập đến"
 galactic_features.405.desc: "$galactic_features.402.desc$\n\nCộng đồng Ngân hà đã chính thức đặt tên cho cơn bão này là §H'[storm_name.GetFirstName]'§! và ban hành các khuyến cáo đi lại chung."
 galactic_features.406.name: "Bão vũ trụ [storm_name.GetFirstName] đã tan"
 galactic_features.406.desc: "§HBão vũ trụ [storm_name.GetFirstName]§! từng càn quét qua nhiều khu vực trong ngân hà đến nhanh mà đi cũng nhanh. Hệ thống dẫn đường trong các hệ sao có sự nhiễu loạn không gian con không còn phải chịu bất kỳ tổn hại nào nữa.\n\nMặc dù có những đồn đoán rằng những cơn bão tương tự như [storm_name.GetFirstName] cuối cùng sẽ làm sụp đổ mạng lưới siêu không gian sau hàng nghìn năm nữa, nhưng ít nhất vào lúc này, hoạt động du hành vũ trụ có vẻ như đã trở lại bình thường."
 galactic_features.421.name: "Vluur"
 galactic_features.421.desc: "Chúng ta đã chạm trán một thực thể không gian con mang sức mạnh tột đỉnh bên trong hệ sao §H[From.From.From.GetName]§!. Có vẻ như nó không hề có ý thù địch, thậm chí có thể còn chưa nhận thức đầy đủ về những phi thuyền thông thường, nhưng sự tồn tại của nó lại gây ra những nhiễu loạn không gian con mãnh liệt trên toàn bộ hệ sao [From.From.From.GetName].\n\nNhững nhiễu loạn này tập trung quanh bản thân thực thể đó, và có lẽ sẽ biến mất ngay khi nó rời khỏi hệ sao. Lời chào của chúng ta không nhận được hồi đáp, nhưng thực thể này lại liên tục phát ra những luồng hạt tachyon mang cấu trúc phức tạp, giống như một dạng ngôn ngữ nào đó. Nếu phần mềm dịch thuật của chúng ta chính xác, thì thông điệp mà nó không ngừng lặp đi lặp lại chính là:\n\n§H'Vluur đang tìm. Vluur đã tìm thấy.'§!"
 galactic_features.421.a: "Nó sẽ cản trở hệ thống điều hướng đấy."
 galactic_features.423.name: "Sự sụp đổ của Vluur"
 galactic_features.423.desc: "Khi giao chiến với quân đội của chúng ta tại hệ sao §H[vluur_system.GetName]§!, thực thể không gian con §H'Vluur'§! đã tăng cường tần suất phát các luồng hạt tachyon, nhưng thông điệp được lặp đi lặp lại vẫn y hệt như trước:\n\n§H'Vluur đang tìm. Vluur đã tìm thấy.'§!\n\nĐồng thời với việc nhận lấy đòn chí mạng, thực thể này đã tự phát nổ, vụ nổ kinh hoàng đã làm cho vật chất tối rải rác khắp hệ sao."
 galactic_features.423.a: "Hãy thu thập mọi thứ có thể thu thập được."
 galactic_features.423.tooltip: "Các mỏ vật chất tối nằm rải rác trên một số hành tinh thuộc hệ sao [vluur_system.GetName]."
 ### Pirates: The Bemat Thalassocracy by Gemma Thomson ###
 pirate.155.name: "Phong tỏa của toán cướp tại [thalassocracy_target_system.GetName]"
 name_thalassocracy_agency: "Trạm gác biên phòng và thuế vụ"
 name_thalassocracy_agency_abbreviated: "ECA"
 pirate.155.desc.regular: "Đại diện của [root.GetName]: $pirate.155.proclamation$\n\nChúng tôi hiểu rằng, việc kiểm tra tại các trạm gác đôi khi có thể khiến các người cảm thấy căng thẳng. Chỉ cần chúng ta hợp tác với nhau, thì sẽ không có ai phải chịu thương tổn cả. Hãy yên tâm, từng hạt lúa, từng cục quặng mà chúng tôi chính thức thu giữ sẽ được tận dụng triệt để vào kế hoạch sinh sôi và phát triển sinh thái của [thalassocracy_species.GetName]. Chúng tôi vô cùng biết ơn sự ân cần của các người.\n\n$pirate.155.thalassocracy_signoff$"
 pirate.155.desc.machine: "Đại diện kiến tạo của [root.GetName]: Lệnh phong tỏa tại [thalassocracy_target_system.GetName] chính thức có hiệu lực. Kể từ thời điểm này, mọi đơn vị cơ khí trong khu vực sẽ trở thành thần dân của [thalassocracy_country.GetName], phục vụ cho chúng ta. Mọi hạm đội có ý định phản kháng sẽ bị trấn áp bằng vũ lực.\n\nChúng tôi hiểu rằng hành động này có thể gây ra những bất tiện lớn về mặt vật chất cho đất nước của các người. Nhưng chúng tôi cam đoan, một khi các sĩ quan $name_thalassocracy_agency$ của chúng tôi hoàn thành chỉ tiêu được giao, lệnh phong tỏa sẽ được gỡ bỏ. Hẳn là các người cũng hiểu được những áp lực mà một hệ thống chỉ huy như chúng ta phải đối mặt.\n\nTrong bức tranh sinh sôi và phát triển sinh thái của [thalassocracy_species.GetName], các máy bay không người lái được lập trình lại của các người sẽ gánh vác một sứ mệnh vô cùng cao cả. $pirate.155.thalassocracy_signoff$"
 pirate.155.desc.hive: "Đại diện thực thể của [root.GetName]: $pirate.155.proclamation$\n\nChúng tôi hiểu rằng, việc kiểm tra tại các trạm gác đôi khi có thể khiến các người cảm thấy căng thẳng. Chỉ cần chúng ta hợp tác với nhau, thì có thể tránh được thương vong cho các [root.GetIndividualNamePlural] của các người, bằng không, chúng sẽ gặp rắc rối to đấy. Hãy yên tâm, từng hạt lúa, từng cục quặng mà chúng tôi thu giữ sẽ được tận dụng triệt để vào kế hoạch sinh sôi và phát triển sinh thái của [thalassocracy_species.GetName]. Chúng tôi vô cùng biết ơn nếu các người chịu cân nhắc đề nghị này.\n\n$pirate.155.thalassocracy_signoff$"
 pirate.155.proclamation: "Lệnh phong tỏa tạm thời tại [thalassocracy_target_system.GetName] chính thức có hiệu lực. Thực phẩm và khoáng sản được chế biến và vận chuyển trong hệ sao này từ nay sẽ bị các sĩ quan $name_thalassocracy_agency$ của [thalassocracy_country.GetName] tịch thu. Mọi phi thuyền không nhằm mục đích thương mại sẽ bị trục xuất, nếu cố tình tiến lên sẽ phải hứng chịu hỏa lực. Lệnh này sẽ duy trì hiệu lực cho đến khi chúng tôi hoàn thành chỉ tiêu $name_thalassocracy_agency_abbreviated$."
 pirate.155.thalassocracy_signoff: "Tự tay kiến tạo một tương lai xán lạn hơn!"
 pirate.155.a: "Cái gì cơ?!"
 pirate.155.b: "Các người sẽ phải hối hận đấy, lũ cặn bã [thalassocracy_species.GetAdj]."
 pirate.155.pacifist: "Nhất thiết phải đi đến bước này sao, hả?"
 pirate.155.machine: "Các người sẽ không thể thành công đâu."
 pirate.155.corp: "Quả là một hành động táo bạo đấy, bọn [thalassocracy_species.GetAdj]. Các người tuy ngu như bò, nhưng bù lại gan cũng to bằng trời."
