 ### THE DISMEMBERED CLOUD (Chiến dịch chung - Hợp tác nghiên cứu) by Gemma Thomson ###
 federations3.2001.name: "Một mảnh ghép chóng vánh"
 federations3.2001.desc: "Nhiều trạm nghiên cứu khắp nước ta đã phát hiện ra những biến dạng vi mô trong siêu không gian, lấy căn cứ sao tại [root.Capital.GetName] làm tâm điểm. Hiệu ứng này thể hiện trong 'chân không' như một hiện tượng cực quang cục bộ, được các nhân viên cư trú trên căn cứ sao mô tả như những xúc tu khí rực rỡ sắc màu, quấn quanh toàn bộ trạm không gian.\n\nHơn nữa, các đồng minh của chúng ta trong [root.GetAllianceName] cũng báo cáo về một hiện tượng tương tự xuất hiện tại hệ sao thủ đô của họ. Tổng thống [discloud_coordinator.ruler.GetRegnalName] đã lên tiếng kêu gọi lập tức tiến hành một cuộc điều tra hợp tác về vấn đề này."
 dismembered_cloud_chain_title: "Cụm mây tụ họp"
 dismembered_cloud_chain_desc: "Những đám mây hình xúc tu rực rỡ sắc màu đang tụ tập quanh hệ sao thủ đô của chúng ta. Đồng minh của chúng ta cũng báo cáo về những hiệu ứng tương tự xuất hiện tại thủ đô của họ. Nguyên nhân nào đã dẫn đến những hiện tượng này?"
 DISMEMBERED_CLOUD_PROJECT: "Mây mù che phủ"
 DISMEMBERED_CLOUD_PROJECT_DESC: "Những đám mây hình xúc tu rực rỡ sắc màu đã bao phủ căn cứ sao của chúng ta tại [root.Capital.GetName], chúng cứ thoắt ẩn thoắt hiện từ không gian con một cách bất quy tắc - hay có lẽ là có ý thức. Nguyên nhân nào đã dẫn đến tình trạng này?\n\nDự án này là một phần trong một cuộc nghiên cứu khoa học quy mô lớn do các thành viên của [root.GetAllianceName] tiến hành."
 tooltip_dismemberedcloud_begin: "Các thành viên của [root.GetAllianceName] nhận được một §HDự án đặc biệt§! nhằm tiến hành một cuộc điều tra chung về các mối liên kết giữa những hiện tượng này."
 federations3.2010.intro: "Cuộc điều tra của chúng ta về những đám mây giống cực quang ở [root.Capital.GetName] đã giải đáp được một số câu hỏi, nhưng lại làm nảy sinh thêm nhiều thắc mắc khác. Những đám mây hình xúc tu với hình thù kỳ dị này sẽ xuất hiện sau khi chúng ta chiếu chùm tia liên lạc về phía các đội nghiên cứu của đồng minh, và cũng chỉ xuất hiện khi chúng ta làm thế."
 federations3.2010.red.desc: "$federations3.2010.intro$ Mỗi đám mây đều mang sắc đỏ nhạt, với các cạnh lởm chởm và di chuyển một cách đầy bồn chồn.\n\n$federations3.2010.close$"
 federations3.2010.yellow.desc: "$federations3.2010.intro$ Mỗi đám mây đều có màu vàng, với các cạnh mờ ảo. Chúng di chuyển chầm chậm, tựa như đang được những làn gió nhẹ vuốt ve.\n\n$federations3.2010.close$"
 federations3.2010.green.desc: "$federations3.2010.intro$ Những đám mây này trông như một màu xanh lục tràn đầy sức sống, sự di chuyển của những luồng hơi nước này dường như có mục đích, theo một cách nào đó gợi ý về điều gì đó.\n\n$federations3.2010.close$"
 federations3.2010.blue.desc: "$federations3.2010.intro$ Những phần nhô ra màu xanh lam này có vẻ khá nhút nhát và khó nắm bắt, chúng luôn lẩn trốn vào siêu không gian mỗi khi bị quan sát trực tiếp.\n\n$federations3.2010.close$"
 federations3.2010.indigo.desc: "$federations3.2010.intro$ Những 'phần phụ' màu tím rõ nét trên các đám mây di chuyển chậm rãi, nhắm trực tiếp vào các bộ phận khác nhau trên lớp vỏ ngoài của căn cứ sao, cứ như thể đang đánh giá chúng vậy.\n\n$federations3.2010.close$"
 federations3.2010.pink.desc: "$federations3.2010.intro$ Những đám hơi nước màu hồng mờ ảo này được cho là rất 'tinh nghịch', chúng sẽ nhanh chóng chạy trốn khỏi bất kỳ phi thuyền nào vô tình đến gần.\n\n$federations3.2010.close$"
 federations3.2010.gray.desc: "$federations3.2010.intro$ Chúng tồn tại trong một thời gian tương đối dài, và để lại những vệt khói dường như có màu xám phía sau.\n\n$federations3.2010.close$"
 federations3.2010.orange.desc: "$federations3.2010.intro$ Những đám mây hình vòng cung lớn màu cam này thích uốn lượn dưới đáy căn cứ sao của chúng ta, khiến cho căn cứ sao trông như đang bốc cháy.\n\n$federations3.2010.close$"
 federations3.2010.brown.desc: "$federations3.2010.intro$ Sắc nâu đậm của chúng thường cản trở việc truyền ánh sáng; che khuất đi ánh sáng chói lọi của các vì sao thường thấy trên căn cứ sao.\n\n$federations3.2010.close$"
 federations3.2010.cyan.desc: "$federations3.2010.intro$ Sắc xanh lơ rực rỡ bên trong khối khí khiến bề ngoài của nó giống hệt như cực quang trên hành tinh - tuy nhiên, những dải màu của nó sẽ tự động biến đổi từ đường cong thành góc vuông, như thể muốn tạo thành một dạng sóng kỹ thuật số.\n\n$federations3.2010.close$"
 federations3.2010.close: "Chỉ với sức mạnh của riêng mình, chúng ta không thể nào giải mã được ý nghĩa sâu xa từ những hành vi này - nhưng sau khi §Ytổng hợp kết quả từ tất cả các nước thành viên§!, [root.GetAllianceName] hẳn sẽ có thêm nhiều manh mối.\n\nNhững phỏng đoán lý thuyết ban đầu cho rằng các thực thể liên không gian này bằng một cách nào đó đã cộng hưởng với dải tần số liên lạc siêu không gian của chúng ta. Sự thu hút tình cờ này có lẽ có thể được lợi dụng để tiến hành thêm các nghiên cứu về các thực thể này, hoặc chúng ta có thể chuyển đổi tần số, hy vọng rằng những đám mây này sẽ tan biến."
 federations3.2010.a: "Hãy để nó tự do."
 federations3.2010.b: "Giữ nó ở lại đây."
 federations3.2015.name: "Đám mây bị tan vỡ"
 federations3.2015.intro: "Sau khi đối chiếu kết quả nghiên cứu của chúng ta, phát hiện ra rằng những đám mây cực quang dường như vô tri này đang cuộn quanh thủ đô của các thành viên liên bang chúng ta, trên thực tế, lại là những mảnh ghép của một thực thể sống duy nhất."
 federations3.2015.desc: "$federations3.2015.intro$\n\nKết luận mà các nhà nghiên cứu đưa ra là: thực thể sống trong siêu không gian này đã vô tình trôi dạt vào không gian của liên bang chúng ta do một sự cố, và nó đã bị 'mắc kẹt' vào trạm trung chuyển thông tin liên lạc không gian nhộn nhịp nhất của chúng ta (chính là trạm phục vụ cho căn cứ sao tại thủ đô). Các nhà nghiên cứu đồng thuận rằng thực thể khí này trước đó đang cố gắng §Htái cấu trúc bản thân§!, một việc mà nó không thể làm được nếu ở trạng thái phân mảnh như hiện tại.\n\nSau khi hoàn tất quá trình tái cấu trúc, đám mây đã tan biến và quay trở lại siêu không gian - nhưng trước đó, nó đã ghé thăm nhiều trạm nghiên cứu trong liên minh của chúng ta. Tại mỗi trạm, nó nhiều lần thoắt ẩn thoắt hiện một cách chính xác trong siêu không gian, trông như một điệu nhảy trong mắt những người chứng kiến. Đám mây đã phô diễn bản năng xuyên qua hàng rào siêu không gian của mình, cung cấp cho chúng ta những dữ liệu vô giá."
 federations3.2016.desc: "$federations3.2015.intro$\n\nDữ liệu chúng ta thu thập được chưa hoàn thiện, nhưng đủ để suy luận rằng chúng ta đã bắt gặp một thực thể Gestalt: thực thể khí này hoàn toàn thích nghi với việc cư ngụ trong siêu không gian. Những người cộng tác dự án đã đưa ra một giả thuyết, cho rằng các bộ phận của đám mây này đã bị 'mắc kẹt' vào căn cứ sao tại thủ đô trong lúc trôi dạt qua hệ sao của chúng ta. Nó dường như muốn §Htái cấu trúc bản thân§! - nhưng do chúng ta không nhất trí hỗ trợ nó, một số bộ phận của đám mây đã dần dần tan rã và không thể tham gia vào quá trình tái cấu trúc nữa.\n\nNhững phần đã tái cấu trúc thành công sau đó đã biến mất vào trong siêu không gian; trong khi những phần còn sót lại tiếp tục cung cấp cho các nhà nghiên cứu những dữ liệu từ xa đầy thú vị về siêu không gian."
 federations3.2016.a: "Nếu vậy, có lẽ chúng ta có thể thu được lợi ích nào đó từ việc này."
 federations3.2017.desc: "Vì chúng ta không tham gia vào dự án nghiên cứu hợp tác này, nên rất khó để có được những kết luận chắc chắn về đám mây liên không gian đã ghé thăm thủ đô của chúng ta. Mặc dù có rất nhiều giả thuyết khác nhau, nhưng tất cả chúng ta đều nhận thấy những đám mây này đã trở nên vô cùng bồn chồn.\n\nCấu trúc vật lý của chúng bắt đầu tan rã, và chúng ta cũng nhận thấy sự phản ứng của những đám mây này đối với các tác nhân kích thích đã giảm sút. Chúng bắt đầu thoắt ẩn thoắt hiện trong siêu không gian với tốc độ nhanh hơn. Điều này đã tạo ra hiện tượng nhiễu tĩnh điện rõ rệt trên dải tần số liên lạc của chúng ta, nhưng cũng đồng thời cung cấp những dữ liệu quý giá cho các nhà nghiên cứu lý thuyết tại [root.Capital.GetName]."
 federations3.2017.a.tooltip: "§H[Root.GetAllianceName]§! nhận được một phần thưởng Tình đoàn kết tạm thời.\n\n"
 joint_cloud_boon: "Món quà từ đám mây"
 joint_cloud_boon_desc: "Nhờ vào việc hỗ trợ một thực thể khí sống trong siêu không gian ghé thăm thủ đô của các thành viên liên bang, chúng ta đã thu được những hiểu biết độc đáo về sinh học siêu quang tốc và vật lý lý thuyết."
 temp_cloud_boon: "Đám mây bị tan vỡ"
 temp_cloud_boon_desc: "Cuộc gặp gỡ tình cờ với một vị khách ở siêu không gian tại thủ đô của các nước thành viên liên bang đã mang đến cho chúng ta vô số những kiến thức sâu sắc về vật lý siêu quang tốc."
 pm_joint_cloud_snag: "Đám mây bị bắt giữ"
 pm_joint_cloud_snag_desc: "Chúng ta đã đánh đổi độ trung thực của tín hiệu trong khu vực này để lấy được những hiểu biết về sinh vật sống trong siêu không gian bị thu hút bởi các tín hiệu được truyền từ căn cứ sao, cũng như về vật lý siêu quang tốc."
 ### GENIUS CAELI (Chiến dịch chung - Hợp tác nghiên cứu) by Gemma Thomson ###
 #Arc site begins
 federations3.2103.name: "Tín hiệu cộng hưởng"
 federations3.2103.desc.body: "Một phi thuyền tầm ngắn khi đi vào bầu khí quyển của [event_target:leylines_world.GetName] đã báo cáo về việc nghe thấy những âm thanh lạ lùng va đập vào thân tàu. Nguồn gốc của âm thanh dường như xuất phát từ dưới bề mặt hành tinh, ngay tại khu vực có chứa khoáng sản quý hiếm.\n\nCác đồng nghiệp của chúng ta tại [from.Federation.GetName] cũng báo cáo về những sự việc tương tự xảy ra trên hành tinh mà họ giám sát."
 federations3.2103.desc.generic: "$federations3.2103.desc.body$ Để đối phó với tình hình, họ đã thành lập một ủy ban do [event_target:leylines_coordinator.GetName] đứng đầu, chịu trách nhiệm điều phối công tác khai quật mà tất cả chúng ta đều muốn tham gia."
 federations3.2103.desc.coordinator: "$federations3.2103.desc.body$ Để đối phó với tình hình, họ đã để chúng ta lãnh đạo ủy ban, chịu trách nhiệm điều phối công tác khai quật mà tất cả chúng ta đều muốn tham gia."
 leylines_digsite: "Tiếng ù ù từ địa ngục"
 leylines_digsite_desc: "Chúng ta từng nghĩ rằng đây chỉ là một lớp khoáng sản vô giá trị nằm trên [From.Planet.GetName]. Thế nhưng giờ đây, lớp khoáng sản này lại bắt đầu phát ra những tiếng ù ù chói tai kỳ lạ. Đây không phải là trường hợp cá biệt, âm thanh tương tự có thể được nghe thấy trên nhiều hành tinh khác trong toàn liên bang. Sự thật gì đang ẩn giấu đằng sau hiện tượng dị thường này?"
 #Special project begins
 federations3.2104.name: "Tín hiệu cộng hưởng lân cận"
 federations3.2104.desc: "Đồng nghiệp của chúng ta tại [root.Federation.GetName] đã báo cáo về việc nghe thấy tiếng ù ù chói tai, họ cho rằng nguồn phát ra âm thanh hẳn nằm dưới lòng đất, ít nhất là ở một hành tinh. Họ đã thành lập một ủy ban nghiên cứu nhằm hỗ trợ cho công tác khai quật của mình.\n\nHọ đã yêu cầu chúng ta cung cấp thêm các nguồn lực để giúp chúng ta có thể hiểu rõ hơn về rắc rối kỳ lạ này."
 federations3.2104.a: "Chúng ta sẽ cố gắng hết sức để cung cấp sự hỗ trợ."
 leylines_chain_title: "Tiếng ồn trong lòng đất"
 leylines_chain_desc: "Có ít nhất một hành tinh trong biên giới liên bang của chúng ta đang phát ra những tiếng ù ù chói tai. Do các đồng nghiệp của chúng ta đang nỗ lực khai quật di tích này, họ đã yêu cầu chúng ta cung cấp các nguồn lực khoa học để hỗ trợ công việc của họ."
 LEYLINES_ACOUSTIC_PROJECT: "Đối phó với cộng hưởng âm"
 LEYLINES_ACOUSTIC_PROJECT_DESC: "Các đồng nghiệp liên bang của chúng ta đang phải nỗ lực tiến hành công tác khai quật trong một môi trường vô cùng ồn ào. Để hỗ trợ họ, nhiệm vụ của chúng ta là phải cải tiến mũ cách âm cho tất cả mọi người. Các nhà khảo cổ học hiện tại chỉ có thể làm việc theo ca một cách ngắt quãng, và tạm thời vẫn chưa có dấu hiệu nào cho thấy họ cảm thấy khó chịu về mặt thể chất."
 federations3.2124.desc: "Chúng ta đã thất bại trong việc cung cấp cho đồng nghiệp những chiếc mũ cách âm bổ sung mà họ yêu cầu. May mắn là sự thiếu hụt trang thiết bị chỉ làm chậm tiến độ công việc chứ không thể hoàn toàn ngăn cản họ tiến hành khai quật. Dù vậy, điều này vẫn khiến cho các nhà nghiên cứu ở tuyến đầu cảm thấy bất an hơn. Cho dù các báo cáo cho thấy tiếng ồn đang tự động suy giảm, tâm trạng của họ cũng chẳng khá hơn là bao.\n\nỦy ban dự án của [root.Federation.GetName] hiện tại đang mời chúng ta tham gia nghiên cứu về chính âm thanh đó, xem liệu có thể tìm ra được tia sáng nào để bù đắp cho những thiếu sót trước đây của chúng ta hay không."
 federations3.2124.a: "Chúng ta phải dốc toàn lực."
 federations3.2125.name: "Mũ cách âm phiên bản cải tiến"
 federations3.2125.desc: "Chúng ta đã xuất sắc nâng cao độ che phủ và khả năng thích ứng của mũ cách âm có thể gập lại, đồng thời chia sẻ những thành quả nâng cấp này cho các đồng nghiệp tại [root.Federation.GetName]. Các nhà nghiên cứu tiền tuyến của họ đã báo cáo rằng tình trạng mơ hồ về ý thức và đau nhức dữ dội trên cơ thể đã được cải thiện một cách rõ rệt. Ủy ban điều phối hiện tại đang yêu cầu chúng ta hỗ trợ trong việc phân tích dữ liệu."
 LEYLINES_ANALYSIS_PROJECT: "Phân tích cộng hưởng âm"
 LEYLINES_ANALYSIS_PROJECT_DESC: "Các đồng nghiệp tại [root.Federation.GetName] đã bước vào giai đoạn khai quật tiếp theo, tuy nhiên những hành tinh bị ảnh hưởng vẫn không ngừng phát ra tiếng ồn, do đó ủy ban giám sát dự án đã ủy quyền cho chúng ta tiến hành nghiên cứu về những âm thanh đang dần nhỏ đi này."
 federations3.2129.desc: "Chúng ta không thể đưa ra được những kết quả thỏa đáng, và ủy ban dự án của [root.Federation.GetName] tỏ ra rất thất vọng về điều đó. Tiếng ồn từng gây phiền toái cho nhiều hành tinh trong liên bang cuối cùng cũng biến mất, nhưng cùng với đó, cơ hội nghiên cứu cũng đã đóng lại. Các nhà nghiên cứu đã cố gắng thu thập một vài thông tin trong khả năng của mình, nhưng giờ đây họ chỉ có thể đặt niềm tin vào việc các nhà khảo cổ học tại hiện trường sẽ có thể đưa ra những câu trả lời chi tiết."
 federations3.2130.name: "Cộng hưởng âm đã được phân tích"
 federations3.2130.desc: "Tiếng ù ù tại các di tích khảo cổ trên khắp liên bang đã bắt đầu nhỏ đi. Thông qua việc nghiên cứu các bản ghi âm của từng loại âm thanh, và đối chiếu dữ liệu của chúng ta với các đồng nghiệp, chúng ta phát hiện ra rằng, khi những tiếng ù ù chói tai xếp chồng lên nhau, chúng sẽ tạo ra một giai điệu hòa âm tuyệt đẹp, có thể vang vọng tới ba ngày, khiến lòng người cảm thấy sảng khoái. Đối với những người đã xây dựng các di tích này, thiết kế như vậy có thể mang một ý nghĩa văn hóa nào đó, nhưng có lẽ chúng ta sẽ mãi mãi chẳng thể hiểu được ẩn ý sâu xa bên trong. Cuộc nghiên cứu vẫn đang được tiếp tục..."
 #Arc site
 federations3.2105.name: "Công trình hình vỏ sò chấn động cả mái nhà"
 federations3.2105.desc: "Dù phải làm việc xoay ca ngắt quãng, nhưng về mặt kỹ thuật, việc giải mã những bí ẩn của khu di tích này lại vô cùng đơn giản. Chúng ta đã đào xuyên qua hai lớp đá tưởng chừng như rất đỗi bình thường, để rồi nhìn thấy một chiếc vỏ sò khổng lồ, hay cũng có thể gọi là một mái vòm. Hơn nữa, gần đó còn có một vài mái vòm tương tự đã được khai quật một phần, theo như quan sát hiện tại, những mái vòm này dường như được xếp thành hình vòng cung hoặc hình tròn.\n\nMỗi mái vòm đều được đúc nguyên khối, và được gia cố ở một mức độ nhất định, đủ khả năng chống chọi lại với thử thách của các niên đại địa chất. Mỗi công trình đều có kích thước tương đương một phòng họp, vì vậy việc tiến vào bên trong là hoàn toàn có thể."
 federations3.2111.name: "Nơi trú ẩn yên bình"
 federations3.2111.desc: "Mặc dù vẫn chưa thể xác định được nguồn gốc của tiếng ù ù vang vọng khắp mọi nơi, nhưng cường độ của nó đã bắt đầu suy giảm. Kể từ thời điểm đó, các nhà nghiên cứu của chúng ta đã có thể tập trung vào việc vượt qua công trình hình bán cầu này.\n\nKhông gian bên trong hoàn toàn trống rỗng, không chứa bất kỳ nội dung thực tế nào, chúng ta tạm kết luận rằng, công trình này được thiết kế như một phòng cách ly giác quan. Ngoài ra, bề mặt bên trong của mái vòm dường như được vẽ những bản đồ chòm sao, đi kèm với các nhân vật thần thoại và một dạng văn bản nào đó. Chúng ta đang nỗ lực giải mã những thiết kế này."
 federations3.2112.name: "Cấu trúc bên trong của công trình hình vỏ sò"
 federations3.2112.desc: "Chúng ta đã tìm thấy một lượng lớn các thiết bị tinh vi bên trong mái vòm, thế nhưng không có thiết bị nào trong số đó có khả năng tạo ra những tiếng ồn khổng lồ mà chúng ta vẫn có thể nghe thấy ở bên ngoài. Một nhóm công tác quy mô nhỏ đã tách ra hoạt động độc lập, tiếp tục tiến hành các cuộc điều tra của chúng ta.\n\nPhần lớn các nhà nghiên cứu vẫn ở lại bên trong cấu trúc hình vỏ sò này, nghiên cứu về cơ chế hoạt động bên trong của nó, cấu trúc thiết bị vô cùng phức tạp, trang trí thì tuyệt đẹp, thoạt nhìn giống như một loại máy tính khổng lồ nào đó."
 federations3.2116.name: "Căn nhà Chiêm tinh"
 federations3.2116.desc: "Các báo cáo từ khắp [From.Owner.Federation.GetName] đều đã xác nhận: tiếng ù ù hiện tại đã hoàn toàn biến mất. Mặc dù khoảng cách giữa các di tích giữa các vì sao là rất xa, nhưng tiếng ù ù hầu như dừng lại cùng một lúc.\n\nKể từ đó, đội ngũ nghiên cứu của chúng ta đã dựa vào vô số chòm sao được vẽ bên trong mái vòm để suy luận ra một vài mô hình, những chòm sao này thường được sử dụng cho việc tiên tri chiêm tinh. Dữ liệu thu thập được bởi các nhà nghiên cứu cho thấy, cơ sở này, nếu sắp xếp theo niên đại, cổ xưa hơn rất nhiều so với các tầng địa chất xung quanh - thế nhưng có một ngoại lệ rõ rệt: các nhà nghiên cứu tình cờ phát hiện ra một bàn thờ lớn bên ngoài mái vòm, điều này cho thấy trong một thời đại tương đối gần đây, ít nhất đã có một nền văn minh từng sử dụng không gian này.\n\nBàn thờ được chạm khắc từ đá của địa phương, bên trên có khắc những hình vẽ, chúng ta tin rằng những hình vẽ này được sử dụng để dịch bản đồ sao cổ xưa trên mái vòm, biến nó thành một bản đồ sao quen thuộc hơn với chúng ta ngày nay."
 federations3.2117.name: "Hệ sao lồng trong hệ sao"
 federations3.2117.desc: "Các báo cáo từ khắp nơi trong [From.Owner.Federation.GetName] đều cho thấy: những âm thanh rền vang từng ám ảnh các khu di tích nghiên cứu tại không gian chung của chúng ta đã biến mất. Điều này khiến cho các nhà nghiên cứu của chúng ta cảm thấy nhẹ nhõm vô cùng, vì giờ đây họ đã có thể bắt tay vào nghiên cứu các thiết bị phức tạp được bố trí bên trong mái vòm.\n\nMặc dù thiết kế của nó cực kỳ kỳ lạ, nhưng chúng ta vẫn có thể nhận ra được, thiết bị này được cấu tạo từ các mô hình hệ mặt trời kết nối với nhau. Những mô hình này mô tả toàn bộ hệ sao [From.Planet.System.GetName] và hai hệ sao khác, thế nhưng cho đến nay, chúng ta cùng với các đồng nghiệp trong liên bang vẫn chưa thể xác định được tên và vị trí của hai hệ sao này. Mỗi mô hình hệ mặt trời đều được dẫn động bởi một hệ thống trục và bánh răng, chống đỡ cho vô số các bức tượng điêu khắc được làm từ canxit và nhựa cây hóa thạch. Mặc dù trông như thể chúng đang đứng bất động, nhưng thực tế chúng đang di chuyển với một tốc độ vô cùng chậm chạp - giống như từng bộ phận của một chiếc đồng hồ ngân hà khổng lồ, và 'tiếng chuông' của chiếc đồng hồ này rất có thể chính là những tiếng ồn khổng lồ mà chúng ta đã nghe thấy trước đây."
 federations3.2120.name: "Phước lành từ trời cao"
 federations3.2120.desc: "Chúng ta đã hoàn tất việc nghiên cứu các mái vòm trên [from.Planet.GetName] cũng như ở những địa điểm khác. Mỗi khu di tích đều là một cỗ máy chiêm tinh khổng lồ, đồng bộ hóa với các thiết bị khác dù khoảng cách có xa đến mấy.\n\nNghiên cứu của chúng ta chỉ ra rằng, những cơ sở này được xem là những điểm hội tụ năng lượng của vũ trụ, có sức ảnh hưởng đến 'nhận thức về vị trí' tổng thể của nền văn minh cổ đại đã xây dựng nên chúng. Các ghi chép được khắc lại có đề cập đến việc hội đồng sẽ 'dẫn dắt' những năng lượng này, từ đó định đoạt vận mệnh của đế chế mình.\n\nXã hội của họ rốt cuộc vẫn đi đến bờ vực suy tàn, nghi thức này đã không thể giúp họ thay đổi vận mệnh trái với ý trời. Thế nhưng, trong một thiên niên kỷ sau đó, một nền văn minh kế thừa đã xuất hiện, họ đã giải mã và khôi phục lại nghi thức này. Sau sự kiện đó, họ cũng rời bỏ những nơi này, và không rõ đã đi về đâu.\n\nChiếc đồng hồ khổng lồ này ít nhất đã chứng kiến sự hưng suy của hai nền văn minh. Giờ đây, âm thanh tự động của chiếc đồng hồ đang vẫy gọi chúng ta, để chúng ta làm chứng cho nghi thức này ở khắp mọi nơi trong không gian. Cho dù có mang lại kết quả chắc chắn hay không, thì ít nhất [from.owner.Federation.GetName] cũng đã chuẩn bị sẵn sàng để tiến hành quan sát..."
 #Finalé
 federations3.2135.name: "Di tích đang hoạt động"
 federations3.2135.desc: "Có thể nói rằng, chúng ta chỉ hoàn thành việc thu thập dữ liệu vào những phút cuối cùng. Thành quả mới nhất của liên bang vừa được công bố cách đây vài ngày, một số di tích mái vòm trong biên giới [from.Federation.GetName] bỗng nhiên hoạt động trở lại, những chùm tia sáng phóng thẳng lên từ sâu dưới lòng đất, chiếu rọi rực rỡ trên bầu trời thủ đô của chúng ta, một cảnh tượng thật khó tin.\n\nCác nhà nghiên cứu của chúng ta cũng cảm thấy vô cùng bối rối, làm sao những người xây dựng di tích lại có thể biết được điều này? Thế nhưng, người dân tại [root.Capital.GetName] lại quan tâm hơn đến những hình ảnh huyền ảo liên tiếp hiện ra, tất cả mọi người đều tận mắt chứng kiến cảnh tượng tuy ngắn ngủi này. Chương trình phát thanh chỉ truyền tải một mục đích duy nhất, đó là tuyên bố sự kiện này trở thành '§HThời khắc cầu đạo§!'.\n\nKhông có báo cáo nào về các hiện tượng tiếp theo, khu di tích mái vòm lại chìm vào bóng tối một lần nữa, tiếp tục chậm rãi tích tắc trôi qua từng thời đại như một chiếc đồng hồ, và tất nhiên, nó cũng bao gồm cả thời đại hiện tại của chúng ta."
 leylines_mod_knowing: "Phước lành từ trời cao: Thời khắc cầu đạo"
 leylines_mod_knowing_desc: "Nhờ vào việc cùng nhau nghiên cứu một thiết bị chiêm tinh kỳ lạ, chúng ta đã có được những nhận thức mới: những lời tiên tri liên quan đến việc mở rộng tri thức từ một xã hội duy tâm cổ đại."
 federations3.2136.desc: "Trong chốc lát, một số di tích mái vòm trong biên giới [from.Federation.GetName] bỗng nhiên hoạt động trở lại. Theo báo cáo, những chùm tia sáng tuôn trào từ một nguồn sâu dưới lòng đất, chiếu rọi rực rỡ trên bầu trời thủ đô của chúng ta, một cảnh tượng thật khó tin.\n\nCác nhà nghiên cứu của chúng ta cũng cảm thấy vô cùng bối rối, làm sao những người xây dựng di tích lại có thể biết được điều này? Thế nhưng, người dân tại [root.Capital.GetName] lại quan tâm hơn đến những hình ảnh huyền ảo liên tiếp hiện ra, tất cả mọi người đều tận mắt chứng kiến cảnh tượng tuy ngắn ngủi này. Mặc dù vẫn chưa rõ mục đích của chương trình phát thanh là gì, nhưng việc mọi người cùng nhau chứng kiến cảnh tượng này đã làm nổi bật một bầu không khí tràn ngập cảm xúc về sự §HThịnh vượng cân bằng§!.\n\nKhông có báo cáo nào về các hiện tượng tiếp theo, khu di tích mái vòm lại chìm vào bóng tối một lần nữa, tiếp tục phát ra những tiếng tích tắc đầy bí ẩn và chậm chạp như một chiếc đồng hồ."
 leylines_mod_lagom: "Phước lành từ trời cao: Sự thịnh vượng cân bằng"
 leylines_mod_lagom_desc: "Nhờ vào việc cùng nhau nghiên cứu một thiết bị chiêm tinh kỳ lạ, chúng ta đã có được những nhận thức mới: những bài học về sự bền vững từ một xã hội duy tâm cổ đại."
 federations3.2137.name: "Di tích bất khả tri"
 federations3.2137.desc: "Tất cả các sinh vật có trí tuệ trên khắp [from.Federation.GetName] đều bị sốc trước cảnh tượng hùng vĩ bất ngờ hiện ra trước mắt. Cùng lúc đó, khu di tích mái vòm cổ xưa được phát hiện vài năm trước đột nhiên hoạt động trở lại. Theo báo cáo, những chùm tia sáng tuôn trào từ một nguồn sâu dưới lòng đất, chiếu rọi rực rỡ trên bầu trời thủ đô của chúng ta, một cảnh tượng thật khó tin.\n\nCác nhà nghiên cứu tại [root.Capital.GetName] cảm thấy vô cùng bối rối trước hiện tượng huyền ảo này. Hiện tại chúng ta vẫn chưa rõ mục đích của hiện tượng này là gì, và cũng chưa quan sát thấy bất kỳ hiện tượng tiếp theo nào, do đó chúng ta không thể thu thập thêm bất kỳ manh mối nào. Có vẻ như chúng ta đã bỏ lỡ cơ hội để nghiên cứu nó."
 ### BARELY CONTAINED EFFICIENCY (Chiến dịch chung - Liên minh thương mại) by Douglas Furen ###
 #EVENT TEXT
 #- Intro -
 fedev.605.name: "Thí điểm sắp tới: Tái cấu trúc Logistics"
 fedev.605.desc: "Các tuyến đường vận chuyển hàng hóa là huyết mạch giúp Liên minh Thương mại của chúng ta phát triển thịnh vượng. Nhưng cho đến nay, các đế chế vẫn đang sử dụng các tiêu chuẩn logistics khác nhau về thiết kế thùng chứa, quy trình xếp dỡ, và các đường ống vận chuyển.\n\nNhằm mục tiêu tối đa hóa hiệu suất, một dự án thí điểm mới sẽ được triển khai trong một vài năm tới - mục tiêu của dự án là nghiên cứu và thử nghiệm một tiêu chuẩn vận chuyển hoàn toàn mới, cụ thể, và phù hợp với tất cả các quốc gia thành viên trong liên minh.\n\nĐiều kiện để tham gia thử nghiệm là phải sở hữu một hệ sao có dòng chảy thương mại ít nhất đạt §H50 điểm Thương mại§!. Hơn nữa, việc sở hữu một §HCông ty Thương mại Ngoại lai§! đồng nghĩa với việc các dữ liệu thống kê sẽ cao hơn, do đó điều này nên được khuyến khích.\n\nBởi vì quy mô của dự án khá rộng lớn, một số khoản chi phí là không thể tránh khỏi. Nhưng những sự hy sinh này là vì những lợi ích lâu dài. Nói cách khác, là để mang lại nhiều lợi nhuận hơn trong tương lai.\n\nTất cả các nước thành viên trong liên minh đều được khuyến khích mạnh mẽ tham gia dự án này."
 fedev.605.a: "Một đề xuất tuyệt vời!"
 #- Trial starts - Participants only -
 fedev.615.name: "Tham gia thí điểm — Đã được cấp phép"
 fedev.615.desc.a: "Chương trình thí điểm Tái cấu trúc Logistics đã chính thức khởi động! Nhờ vào các tuyến đường thương mại sầm uất của đế chế chúng ta, §Y[From.GetName]§! đã được cấp phép để tham gia dự án thí điểm này! Một căn cứ sao đã được lựa chọn để sử dụng làm địa điểm thử nghiệm, và bây giờ chúng ta cần phân công một chiếc §HPhi thuyền xây dựng§! để thực hiện các dự án tái cấu trúc trong thực tế. Thời gian là vàng bạc, vì vậy đừng chần chừ thêm nữa.\n\nChúng ta còn sở hữu một cơ sở §HCông ty Thương mại Ngoại lai§!, và nhờ có nó, tiến độ của dự án sẽ được đẩy nhanh. Đế chế sở hữu công ty này sẽ nhận được một số ưu đãi tài chính như một lời tri ân sâu sắc."
 fedev.615.desc.b: "Chương trình thí điểm Tái cấu trúc Logistics đã chính thức khởi động! Nhờ vào các tuyến đường thương mại sầm uất của đế chế chúng ta, §Y[From.GetName]§! đã được cấp phép để tham gia dự án thí điểm này! Một căn cứ sao đã được lựa chọn để sử dụng làm địa điểm thử nghiệm, và bây giờ chúng ta cần phân công một chiếc §HPhi thuyền xây dựng§! để thực hiện các dự án tái cấu trúc trong thực tế. Thời gian là vàng bạc, vì vậy đừng chần chừ thêm nữa.\n\nChúng ta không có §HCông ty Thương mại Ngoại lai§!. Điều này sẽ không ngăn cản chúng ta tham gia vào dự án thí điểm, nhưng nó sẽ phần nào cản trở tiến độ của dự án, bởi vì chúng ta không thể chia sẻ những thông tin có giá trị với tất cả các bên liên quan để tận dụng tối đa nguồn thông tin đó."
 fedev.615.a: "Chúng ta sẽ hoàn thành tốt phần việc của mình!"
 #- Trial starts - Not participating -
 fedev.620.name: "Tham gia thí điểm — Bị từ chối"
 fedev.620.desc: "Chương trình thí điểm Tái cấu trúc Logistics đã chính thức khởi động! Tuy nhiên, §Y[From.GetName]§! lại thiếu các cơ sở cần thiết để tham gia thử nghiệm. Việc một hệ sao có một lượng giao dịch thương mại lớn như vậy mà lại không có §HTrung tâm Thương mại§! thật là một điều khó có thể tin được.\n\nBỏ lỡ một dự án có nhiều tiềm năng mang lại lợi ích đã là một sai lầm, nhưng việc bỏ lỡ một cơ hội kinh doanh tuyệt vời có khả năng mang lại khối lượng thương mại khổng lồ thì quả là một tội ác!\n\nThật đáng xấu hổ làm sao, hỡi [From.GetSpeciesNamePlural]! Thật đáng xấu hổ!"
 fedev.620.a: "Vậy cũng đành chịu thôi."
 #- Special Project completed -
 fedev.625.name: "Tái cấu trúc hoàn tất"
 fedev.625.desc: "Xin chúc mừng! Các hoạt động tái cấu trúc đã kết thúc, các trung tâm thương mại chuyên dụng đang hoạt động dựa trên tiêu chuẩn logistics hoàn toàn mới. Ngoại trừ việc tiến hành đánh giá hệ sao này, thì chúng ta không còn việc gì cần phải làm nữa.\n\nVào thời điểm kết thúc giai đoạn thử nghiệm, một tuyên bố chính thức về kết quả của dự án thí điểm sẽ được công bố."
 #- Perfect Trial result -
 fedev.635.name: "Tiền vào như nước"
 fedev.635.desc: "Đây quả là một ngày có ý nghĩa vô cùng sâu sắc đối với thương mại và lợi nhuận! Không những dự án thí điểm logistics đã được hoàn thành xuất sắc, mà kết quả của nó còn cho thấy rằng các hoạt động thương mại liên sao đã trở nên suôn sẻ hơn rất nhiều, và hiệu quả thương mại cũng đã được gia tăng một cách đáng kể!\n\nKết quả là, mọi hoạt động thương mại ngoài không gian trong toàn liên minh sẽ dần dần và âm thầm chuyển đổi sang tiêu chuẩn mới; toàn bộ liên minh sẽ được hưởng lợi ích vô cùng to lớn từ sự thay đổi này.\n\nHãy tung hô vì lợi nhuận nào!"
 fedev.635.a: "Đây chính là thắng lợi của ngành thương mại!"
 #- Good Trial result -
 fedev.640.name: "Thí điểm thành công"
 fedev.640.desc: "Đây là một ngày vĩ đại đối với ngành thương mại và kinh doanh. Giai đoạn thử nghiệm đã khép lại, và dự án đã được đánh giá một cách toàn diện. Chúng ta đã thu thập được đầy đủ số liệu cho thấy hiệu quả thương mại đã được nâng cao, và việc áp dụng tiêu chuẩn logistics mới một cách toàn diện là điều cần thiết.\n\nKể từ giờ phút này, mọi hoạt động vận chuyển sẽ dần dần chuyển sang áp dụng tiêu chuẩn mới - nhưng quá trình này hoàn toàn tự động. Thực phẩm sẽ được giao đến nơi, hàng tiêu dùng sẽ được chuyển tới đích, gia vị vẫn tiếp tục được vận chuyển, mọi thứ cứ diễn ra như vậy.\n\nTóm lại là, làm tốt lắm!"
 fedev.640.a: "Xin gửi lời chào đến suối nguồn lợi nhuận."
 #- No Trial result -
 fedev.645.name: "Thí điểm thất bại"
 fedev.645.desc: "Nếu động lực theo đuổi lợi nhuận của các quốc gia thành viên trong liên minh lại yếu ớt đến mức độ này, thì một thời kỳ u ám thực sự đã đến.\n\nDo sự thiếu hụt nghiêm trọng về sự tham gia và động lực đến mức khó hiểu, dự án thí điểm logistics đầy hứa hẹn này đã biến thành một trò hề! Giờ đây, những gì còn sót lại chỉ là những lời chỉ trích, những vụ kiện tụng và tố cáo dai dẳng, nhàm chán.\n\nHãy tìm một luật sư đi, hỡi [From.GetSpeciesNamePlural] - sẽ có một vài hậu quả tồi tệ cần phải giải quyết đấy."
 fedev.645.a: "Thế này thì hơi xấu hổ rồi..."
 #EVENT MODIFIERS
 encumbrance_tax: "Thuế quá giang"
 encumbrance_tax_desc: "Do không tích cực tham gia vào dự án thí điểm logistics đang diễn ra, đế chế này sẽ bị đánh 'thuế trừng phạt'."
 cost_of_progress: "Cái giá của sự tiến bộ"
 cost_of_progress_desc: "Dự án Tái cấu trúc Logistics có lẽ sẽ mang lại lợi nhuận trong tương lai, nhưng việc triển khai dự án vẫn phải tốn chi phí."
 process_sharing: "Chia sẻ tiến trình"
 process_sharing_desc: "Nhờ vào sự hợp tác của các công ty liên quan, chi phí cho dự án Tái cấu trúc Logistics đã được cắt giảm."
 streamlined_logistics: "Logistics tối ưu hóa"
 streamlined_logistics_desc: "Liên bang đang được hưởng lợi từ các tiêu chuẩn logistics tích hợp đã được triển khai."
 fully_streamlined_logistics: "Logistics tối ưu hóa toàn diện"
 fully_streamlined_logistics_desc: "Liên bang đang tận hưởng sự gia tăng đáng kể về mặt lợi nhuận, và điều này phải kể đến công lao của bộ tiêu chuẩn logistics tối ưu hóa hoàn toàn mới."
 #EVENT SPECIAL PROJECTS
 LOGISTIC_REMODEL: "Tái cấu trúc Logistics"
 LOGISTIC_REMODEL_DESC: "Để thử nghiệm bộ tiêu chuẩn logistics hoàn toàn mới, các cơ sở liên quan của căn cứ sao này cần phải trải qua những cuộc cải tạo kết cấu mang tính bước ngoặt.\n\nHãy phân công một chiếc §YPhi thuyền xây dựng§! tham gia vào dự án này, để đảm bảo dự án có thể hoàn thành đúng tiến độ!"
 LOGISTIC_REMODEL_OFFWORLD: "Tối ưu hóa Tái cấu trúc Logistics"
 LOGISTIC_REMODEL_OFFWORLD_DESC: "Để thử nghiệm bộ tiêu chuẩn logistics hoàn toàn mới, các cơ sở liên quan của căn cứ sao này cần phải trải qua những cuộc cải tạo kết cấu mang tính bước ngoặt. Nhờ vào sự hỗ trợ của §HCông ty Thương mại Ngoại lai§! tại địa phương, dự án sẽ được tiến hành một cách hiệu quả hơn.\n\nHãy phân công một chiếc §YPhi thuyền xây dựng§! tham gia vào dự án này, để đảm bảo dự án có thể hoàn thành đúng tiến độ!"
 ### Hegemony Joint Operation by Pierre du Plessis ###
 federations2.50.name: "Lễ kỷ niệm tình đoàn kết và vai trò lãnh đạo của liên bang"
 federations2.50.desc: "[Root.Federation.GetName] đã phát triển vô cùng thịnh vượng dưới sự lãnh đạo tài tình của nước ta. Nhiều người [Root.GetSpeciesNamePlural] giờ đây cảm thấy đã đến lúc phải nhận được phần thưởng xứng đáng cho những dịch vụ mà chúng ta đã cung cấp cho các đồng minh, chúng ta sẽ tổ chức một Lễ kỷ niệm tình đoàn kết - hay nói chính xác hơn, là một buổi lễ tôn vinh những nhà lãnh đạo vĩ đại người [Root.GetAdj], những người đã cống hiến hết mình cho liên bang. Họ đề xuất các quốc gia thành viên cùng nhau hợp tác xây dựng một tượng đài trên bầu trời của [Root.Capital.GetName], đồng thời, chúng ta sẽ cử các phái đoàn đến thủ đô của hai nước thành viên để hỗ trợ họ trong việc mang lại nhiều sự gắn kết hơn cho [Root.Federation.GetName]."
 federations2.50.A.tooltip: "Tất cả các quốc gia thành viên có khả năng đi đến hệ sao §H[Root.Capital.System.GetName]§! sẽ được mời tham gia vào chiến dịch chung này.\n\nNếu họ đồng ý, họ sẽ phải đóng góp tài nguyên để xây dựng đài kỷ niệm, điều này sẽ làm tăng §HKinh nghiệm§! cho liên bang và tăng §HẢnh hưởng§! cho [Root.GetName].\n\n[Root.GetName] cũng có thể chọn nâng cao sức hấp dẫn của §H[Root.GetHegemonyEthos]§! tại hai quốc gia thành viên.\n\nNếu đề xuất này bị từ chối rộng rãi, §HSự gắn kết§! của liên bang sẽ giảm sút, và [Root.GetName] sẽ bị mất đi §HẢnh hưởng§!."
 federations2.50.A: "Nghe có vẻ là một ý tưởng hay đấy!"
 federations2.50.B: "Chẳng việc gì phải tự làm khổ mình vì những chuyện vụn vặt này cả."
 federations2.51.name: "$federations2.50.name$"
 federations2.51.desc: "Xin chào các vị [Root.GetSpeciesNamePluralCompliment] tôn kính! Dưới sự lãnh đạo sáng suốt và độ lượng của chúng tôi, sức mạnh của [Root.Federation.GetName] đã không ngừng lớn mạnh, và mục tiêu chung của chúng ta đã lan rộng khắp mọi ngóc ngách của dải ngân hà. Đã đến lúc phải ăn mừng cho những thành tựu mà chúng ta cùng nhau đạt được. Còn có cách nào phù hợp hơn việc tất cả các quốc gia thành viên cùng chung tay xây dựng một tượng đài tại thủ đô của chúng tôi? Đồng thời, chúng tôi sẽ cử phái đoàn đến thủ đô của các vị để hỗ trợ các vị trên con đường vươn tới đỉnh cao đạo đức của [Root.Federation.GetName].\n\nCác vị có sẵn lòng tham gia sự kiện này không?"
 federations2.51.A: "Tất nhiên là sẵn lòng rồi!"
 federations2.51.A.tooltip: "Tất cả các quốc gia thành viên có khả năng đi đến hệ sao §H[From.Capital.System.GetName]§! sẽ được mời tham gia vào chiến dịch chung này.\n\nNếu họ đồng ý, họ sẽ phải đóng góp tài nguyên để xây dựng đài kỷ niệm, điều này sẽ làm tăng §HKinh nghiệm§! cho liên bang và tăng §HẢnh hưởng§! cho [From.GetName].\n\n[From.GetName] cũng có thể chọn nâng cao sức hấp dẫn của §H[From.GetHegemonyEthos]§! tại hai quốc gia thành viên."
 federations2.51.A.tooltip2: "\nViệc hoàn thành đài kỷ niệm sẽ tiêu tốn 10% sản lượng khoáng sản £minerals£ hàng năm của [Root.GetName]."
 opinion_hegemony_joint_action_agreed: "Đồng ý tham gia Lễ kỷ niệm tình đoàn kết"
 federations2.51.B: "Dựng tượng đài ở thủ đô của các người á? Không đời nào!"
 federations2.51.B.tooltip: "Nếu đề xuất này bị từ chối rộng rãi, §HSự gắn kết§! của liên bang sẽ sụt giảm."
 opinion_hegemony_joint_action_refused: "Từ chối tham gia Lễ kỷ niệm tình đoàn kết"
 federations2.53.name: "Chiến dịch chung thất bại"
 federations2.53.desc: "Đại sứ của chúng ta đã thảo luận với các quốc gia thành viên của [Root.Federation.GetName] về kế hoạch Lễ kỷ niệm tình đoàn kết của nước ta. Thật không may, họ có vẻ như có những suy nghĩ khác với chúng ta về vấn đề này, và chúng ta đã không thể thu hút được sự ủng hộ cần thiết để thúc đẩy kế hoạch."
 federations2.53.A: "Sự thiếu tầm nhìn của họ thật đáng lo ngại."
 the_following_nations_will_participate: "\nCác quốc gia sau đây sẽ tham gia:"
 the_following_nations_said_yes: "\nCác quốc gia sau đây đồng ý với kế hoạch:"
 no_following_nations_said_yes: "\nKhông có quốc gia nào đồng ý với kế hoạch."
 the_following_nations_said_no: "\nCác quốc gia sau đây từ chối kế hoạch:"
 no_following_nations_said_no: "\nKhông có quốc gia nào từ chối kế hoạch."
 the_following_nations_failed2: "\nCác quốc gia sau đây không có bất kỳ đóng góp nào:"
 prev_GetName: "[Prev.GetName]"
 federations2.54.name: "Chiến dịch chung thất bại"
 federations2.54.desc.said_yes: "Mặc dù có sự ủng hộ của chúng ta đối với đề xuất tổ chức Lễ kỷ niệm tình đoàn kết [Root.Federation.GetName] của [From.GetAdj], nhưng kế hoạch này dường như vẫn thất bại. Nguyên nhân dẫn đến sự thất bại là do các quốc gia thành viên khác không sẵn sàng cung cấp đủ sự hỗ trợ."
 federations2.54.desc.said_no: "Sự phản đối của chúng ta đối với kế hoạch hành động chung mang tính chuyên quyền của [From.GetAdj] trong [Root.Federation.GetName] đã mang lại kết quả. Quá phẫn nộ trước việc kế hoạch này có ý định truyền bá các tư tưởng tuyên truyền của [From.GetAdj] đến các quốc gia thành viên, nên đề xuất này đã bị từ chối một cách rộng rãi."
 federations2.54.A.yes: "Thật là một sự sỉ nhục to lớn."
 federations2.54.A.no: "Đã đến lúc cần phải phá bỏ cái cũ để xây dựng cái mới trong liên minh rồi."
 federations2.55.name: "Chiến dịch chung đã được thông qua"
 federations2.55.desc: "Kế hoạch của chúng ta về việc tổ chức một lễ kỷ niệm chung, nhằm tôn vinh sức mạnh và sự đoàn kết của [Root.Federation.GetName], đã nhận được sự đồng thuận của đa số các quốc gia thành viên. Chúng ta sẽ bắt tay vào việc triển khai kế hoạch này ngay lập tức, để tăng cường sự hòa hợp trong liên minh."
 federations2.55.A: "Vì sức mạnh và sự đoàn kết!"
 hegemon_join_operation_happens_tooltip: "Tất cả các quốc gia thành viên tham gia sẽ nhận được một dự án đặc biệt nhằm xây dựng đài kỷ niệm tại §H[federation_leader.Capital.GetName]§!.\n§H[federation_leader.GetName]§! nhận được một dự án đặc biệt, có thể truyền bá tư tưởng §H[federation_leader.GetHegemonyEthos]§! đến tối đa hai quốc gia thành viên."
 federations2.56.name: "$federations2.55.name$"
 federations2.56.desc.said_yes: "Kế hoạch của [From.GetAdj] về việc tổ chức một lễ kỷ niệm chung nhằm tôn vinh sức mạnh và sự đoàn kết của [Root.Federation.GetName] đã nhận được sự chấp thuận của đa số các quốc gia thành viên. Chúng ta sẽ bắt tay vào việc ngay lập tức, để kế hoạch sớm được hiện thực hóa!"
 federations2.56.desc.said_no: "Bất chấp sự phản đối của nước ta, kế hoạch hành động chung mang tính chuyên quyền của [From.GetAdj] trong [Root.Federation.GetName] vẫn nhận được sự đồng tình của phần lớn các quốc gia thành viên. May mắn thay, [From.GetName] không thể ép buộc nước ta tham gia vào kế hoạch này."
 federations2.56.desc.invalid: "Để bày tỏ lòng tôn kính đối với sự lãnh đạo tài tình của [From.GetName] trong [Root.Federation.GetName], [From.GetSpeciesNamePlural] đã được các quốc gia thành viên chấp thuận để tổ chức một lễ kỷ niệm chung về sự đoàn kết của liên minh. Các nước thành viên đồng ý đóng góp nguồn lực để xây dựng một tượng đài trên bầu trời của [From.Capital.GetName], đồng thời một phái đoàn [From.GetAdj] sẽ viếng thăm thủ đô của một số quốc gia, hỗ trợ các nước thành viên hòa nhập với liên minh.\n\nDo vị trí địa lý xa xôi của đất nước chúng ta, việc đi đến [From.Capital.GetName] rất khó khăn, vì vậy chúng ta không thể tham gia vào kế hoạch này."
 federations2.56.A: "$federations2.55.A$"
 federations2.56.B.no: "$federations2.54.A.no$"
 hegemony_joint_project_chain_title: "Lễ kỷ niệm tình đoàn kết và sự lãnh đạo vĩ đại của liên bang"
 hegemony_joint_project_chain_desc: "Một chiến dịch chung đã được khởi xướng, các quốc gia thành viên của [Root.Federation.GetName] sẽ nhân cơ hội này để kỷ niệm khả năng lãnh đạo tài tình của họ và thúc đẩy sự đoàn kết về mặt tư tưởng."
 hegemony_joint_project_leader: "Sự điều chỉnh văn hóa đối với [This.GetName]"
 hegemony_joint_project_leader_DESC: "Là một phần của chiến dịch chung hiện tại nhằm kỷ niệm sự lãnh đạo mạnh mẽ và sự thống nhất tư tưởng của [Root.Owner.Federation.GetName], các phái đoàn sẽ được cử đến thủ đô của hai quốc gia thành viên để giám sát việc họ hòa nhập chặt chẽ hơn vào liên minh.\n\nMột khi hai quốc gia thành viên được chọn, dự án điều chỉnh văn hóa sẽ được xem là hoàn tất."
 hegemony_joint_project_member: "Tượng đài Lãnh đạo mạnh mẽ"
 hegemony_joint_project_member_DESC: "Để ăn mừng sự gắn kết và sức mạnh của [Root.Owner.Federation.GetName], chúng ta hiện đang thực hiện một chiến dịch chung. Là một phần của chiến dịch này, chúng ta đã đồng ý vận chuyển tài nguyên đến [This.GetName] để xây dựng đài tưởng niệm dâng lên các nhà lãnh đạo [This.Owner.GetAdj].\n\nChúng ta sẽ cống hiến 10% sản lượng khoáng sản £minerals£ hàng năm cho dự án này."
 federations2.57.name: "Phái đoàn tại [FromFrom.GetName] đã ổn định"
 federations2.57.desc: "Phái đoàn mà chúng ta phái đến [FromFrom.Owner.GetName] để truyền bá những lý tưởng [Root.GetHegemonyEthos] đã đặt chân đến [FromFrom.GetName]. Nếu may mắn, những nỗ lực của họ sẽ được đền đáp, và sự hòa hợp trong [Root.Federation.GetName] sẽ được thắt chặt hơn nữa."
 federations2.58.name: "Phái đoàn [From.Owner.GetAdj] đã đến [FromFrom.GetName]"
 federations2.58.desc: "Là một phần của chiến dịch chung hiện tại của liên bang, [From.Owner.GetGovernmentName] của người [From.Owner.GetAdj] đã cử một phái đoàn đến [FromFrom.GetName] nhằm truyền bá những lý tưởng [From.Owner.GetHegemonyEthos] tại [Root.GetName]. Bất chấp những lời tuyên bố của họ rằng hành động này là để củng cố sự hòa hợp và thiện ý trong [Root.Federation.GetName], rất nhiều người vẫn cảm thấy quan ngại về việc các giá trị cốt lõi của chính chúng ta có thể bị tổn hại do tư cách thành viên trong liên bang."
 federations2.58.desc.good: "Là một phần của chiến dịch chung hiện tại của liên bang, [From.Owner.GetGovernmentName] của người [From.Owner.GetAdj] đã cử một phái đoàn đến [FromFrom.GetName] nhằm truyền bá những lý tưởng [From.Owner.GetHegemonyEthos] tại [Root.GetName]. May mắn thay, các giá trị của họ hoàn toàn tương đồng với chúng ta, và chúng ta tin tưởng rằng điều này chắc chắn sẽ góp phần làm tăng cường sự hòa hợp và thiện ý trong nội bộ [Root.Federation.GetName]."
 federations2.58.A.good: "Điều này chắc chắn chỉ mang lại lợi ích."
 federations2.58.A.neutral: "Hãy chờ xem sự việc sẽ diễn biến như thế nào..."
 federations2.59.name: "Đài kỷ niệm hoàn thành"
 federations2.59.desc: "Chúng ta đã hoàn thành công việc xây dựng đài kỷ niệm tại [FromFrom.GetName], nhằm ăn mừng sự đoàn kết của [Root.Federation.GetName] và sự lãnh đạo sáng suốt của [FromFrom.Owner.GetName]. Họ đã bày tỏ lòng biết ơn đối với những cống hiến của chúng ta, nhưng chúng ta vẫn phải chờ các đồng minh trong liên bang hoàn tất phần đóng góp của họ trước khi đài kỷ niệm có thể chính thức được khánh thành."
 federations2.59.A.tooltip: "Sau khi tất cả các quốc gia thành viên hoàn tất việc đóng góp, liên bang sẽ nhận được một phần thưởng kinh nghiệm."
 opinion_hegemony_joint_action_completed: "Sự đóng góp cho đài kỷ niệm liên bang"
 federations2.60.name: "Đài kỷ niệm [FromFrom.GetName] hoàn thành"
 hegemony_federation_monument_complete_success: "Tại buổi lễ khánh thành, tiếng chiêng trống vang rền, các hành tinh của các quốc gia thành viên tràn ngập trong bầu không khí hân hoan, và vẻ tráng lệ của đài kỷ niệm đã được phô bày rõ nét trước mắt mọi người. Các quốc gia thành viên đã nỗ lực hết mình, không hề có chuyện làm việc cẩu thả hay ăn bớt nguyên vật liệu. Kết quả cuối cùng - vốn được dùng để dâng lên [FromFrom.Owner.GetRulerTitle] của người [FromFrom.Owner.GetAdj] - giờ đây đã trở thành minh chứng cho sự đoàn kết và sức mạnh của liên bang chúng ta trước toàn thể mọi người."
 hegemony_federation_monument_partial_success: "Tại buổi lễ khánh thành, tiếng chiêng trống vang rền, các hành tinh của các quốc gia thành viên tràn ngập trong bầu không khí hân hoan, và vẻ tráng lệ của đài kỷ niệm đã được phô bày rõ nét trước mắt mọi người. Gần như tất cả các quốc gia thành viên đều đã dành sự nỗ lực đáng kể, và kết quả cuối cùng đã trở thành một hình mẫu hoàn hảo cho sức mạnh và sự đoàn kết của liên minh chúng ta."
 federations2.60.desc.complete_success: "Chúng ta đã hoàn thành công việc xây dựng đài kỷ niệm tại [FromFrom.GetName], nhằm tôn vinh sự đoàn kết của [Root.Federation.GetName] và sự lãnh đạo sáng suốt, uy nghiêm của [FromFrom.Owner.GetName]. $hegemony_federation_monument_complete_success$"
 federations2.60.desc.partial_success: "Chúng ta đã hoàn thành công việc xây dựng đài kỷ niệm tại [FromFrom.GetName], nhằm tôn vinh sự đoàn kết của [Root.Federation.GetName] và sự lãnh đạo sáng suốt của [FromFrom.Owner.GetName]. $hegemony_federation_monument_partial_success$"
 federations2.60.desc.partial_failure: "Chúng ta đã hoàn thành công việc xây dựng đài kỷ niệm tại [FromFrom.GetName], nhằm tôn vinh sự đoàn kết của [Root.Federation.GetName] và sự lãnh đạo sáng suốt của [FromFrom.Owner.GetName]. Tuy nhiên, các đồng minh dường như không mấy mặn mà với đề xuất này như chúng ta, và phần lớn các quốc gia thành viên chỉ hứa suông mà không hề có chút đóng góp thiết thực nào. Đài kỷ niệm cuối cùng lại vô cùng tẻ nhạt - thay vì phản ánh tinh thần chung và sức mạnh của liên minh, nó lại trở thành biểu tượng đầy ngượng ngùng cho sự chia rẽ giữa các đồng minh."
 federations2.60.A.oh_well: "Ít nhất thì chúng ta cũng đã cố gắng hết sức."
 federations2.61.name: "$federations2.60.name$"
 federations2.61.desc.complete_success: "Công trình xây dựng đài kỷ niệm tại [FromFrom.GetName] nhằm tôn vinh sự đoàn kết của [Root.Federation.GetName] và sự lãnh đạo sáng suốt, uy nghiêm của [FromFrom.Owner.GetName] đã chính thức hoàn thiện. $hegemony_federation_monument_complete_success$"
 federations2.61.desc.partial_success: "Công trình xây dựng đài kỷ niệm tại [FromFrom.GetName] nhằm tôn vinh sự đoàn kết của [Root.Federation.GetName] và sự lãnh đạo sáng suốt của [FromFrom.Owner.GetName] đã chính thức hoàn thiện. $hegemony_federation_monument_partial_success$"
 federations2.61.desc.partial_failure.but_I_did_it: "Công trình xây dựng đài kỷ niệm tại [FromFrom.GetName] nhằm tôn vinh sự đoàn kết của [Root.Federation.GetName] và sự lãnh đạo sáng suốt của [FromFrom.Owner.GetName] đã chính thức hoàn thiện. Tuy nhiên, các đồng minh dường như không mấy mặn mà với đề xuất này như chúng ta, và phần lớn các quốc gia thành viên chỉ hứa suông mà không hề có chút đóng góp thiết thực nào. Đài kỷ niệm cuối cùng lại vô cùng tẻ nhạt - thay vì phản ánh tinh thần chung và sức mạnh của liên minh, nó lại trở thành biểu tượng đầy ngượng ngùng cho sự chia rẽ giữa các đồng minh."
 federations2.61.desc.partial_failure.haha_no: "Công việc xây dựng đài kỷ niệm của nước đồng minh tại [FromFrom.GetName], nhằm tôn vinh 'sự đoàn kết' của [Root.Federation.GetName] và 'sự lãnh đạo sáng suốt' của [FromFrom.Owner.GetName], đã chính thức hoàn thành. Tuy nhiên, sự ủng hộ dành cho đề xuất này không được mạnh mẽ như mong đợi của [FromFrom.Owner.GetSpeciesNamePlural], phần lớn các quốc gia thành viên chỉ đưa ra những lời hứa sáo rỗng mà không có bất kỳ đóng góp thiết thực nào. Đài kỷ niệm cuối cùng lại vô cùng tẻ nhạt - thay vì phản ánh tinh thần chung và sức mạnh của liên minh, nó lại trở thành biểu tượng đầy ngượng ngùng cho sự chia rẽ giữa các đồng minh."
 federations2.61.desc.complete_failure: "Kế hoạch xây dựng đài kỷ niệm tại [FromFrom.GetName] do [FromFrom.Owner.GetName] đề xướng, nhằm tôn vinh 'sự đoàn kết' và 'sự lãnh đạo sáng suốt' của [Root.Federation.GetName], đã chính thức bị hủy bỏ vào ngày hôm nay. $hegemony_federation_monument_complete_failure$"
 hegemony_federation_monument_complete_failure: "Không một quốc gia thành viên nào trong liên minh sẵn sàng đóng góp bất cứ điều gì ngoài những lời hứa suông, điều này có nghĩa là đài kỷ niệm này chỉ là một ý tưởng xa rời thực tế - một ý tưởng tồi tệ, không những không thể hiện được tinh thần chung hay sức mạnh, mà trái lại còn là biểu tượng của sự chia rẽ giữa chúng ta."
 federations2.61.A.good: "Đoàn kết chính là sức mạnh."
 federations2.61.A.but_I_did_it: "$federations2.60.A.oh_well$"
 federations2.61.A.neutral: "Ồ, được thôi."
 federations2.61.A.oh_dear: "Có lẽ đã đến lúc phải phá đi xây lại rồi."
 federations2.62.name: "$federations2.60.name$"
 federations2.62.desc.complete_success: "Công trình xây dựng đài kỷ niệm tại [FromFrom.GetName] nhằm tôn vinh sự đoàn kết của [Root.Federation.GetName] và sự lãnh đạo sáng suốt, uy nghiêm của chúng ta đã chính thức hoàn thiện. $hegemony_federation_monument_complete_success$"
 federations2.62.desc.partial_success: "Công trình xây dựng đài kỷ niệm tại [FromFrom.GetName] nhằm tôn vinh sự đoàn kết của [Root.Federation.GetName] và sự lãnh đạo sáng suốt, uy nghiêm của chúng ta đã chính thức hoàn thiện. $hegemony_federation_monument_partial_success$"
 federations2.62.desc.partial_failure: "Công việc xây dựng đài kỷ niệm của nước đồng minh tại [FromFrom.GetName], nhằm tôn vinh 'sự đoàn kết' của [Root.Federation.GetName] và 'sự lãnh đạo sáng suốt' do chúng ta cung cấp, đã chính thức hoàn thành. Tuy nhiên, các đồng minh dường như không mấy mặn mà với đề xuất này như chúng ta hằng mong đợi, phần lớn các quốc gia thành viên chỉ hứa suông mà không hề có chút đóng góp thiết thực nào. Đài kỷ niệm cuối cùng lại vô cùng tẻ nhạt - thay vì phản ánh tinh thần chung và sức mạnh của liên minh, nó lại trở thành biểu tượng đầy ngượng ngùng cho sự chia rẽ giữa các đồng minh."
 federations2.62.desc.complete_failure: "Kế hoạch xây dựng đài kỷ niệm tại [FromFrom.GetName], nhằm tôn vinh 'sự đoàn kết' của [Root.Federation.GetName] và 'sự lãnh đạo sáng suốt' của chúng ta, đã chính thức bị hủy bỏ vào ngày hôm nay. $hegemony_federation_monument_complete_failure$"
 federations2.62.A.good: "Dưới sự lãnh đạo của chúng ta, mọi người đều trở nên mạnh mẽ hơn."
 federations2.62.A.neutral: "Chúng ta cần phải đoàn kết hơn nữa."
 federations2.62.A.oh_dear: "Có lẽ việc đặt niềm tin vào các đồng minh là một sai lầm."
 federations2.70.name: "Hủy bỏ xây dựng đài kỷ niệm [FromFrom.GetName]"
 federations2.70.desc: "Vì sự thay đổi lãnh đạo trong liên bang, kế hoạch ngợi ca những nhà cầm quyền cũ của [FromFrom.Owner.GetName] đã bị đình chỉ."
 federations2.70.A: "Cựu vương đã băng hà; vạn tuế tân vương!"
 federations2.71.name: "Ngừng tham gia xây dựng đài kỷ niệm"
 federations2.71.desc: "Bởi vì chúng ta đã rời khỏi liên bang cũ, kế hoạch xây dựng đài kỷ niệm nhằm tôn vinh sức mạnh gắn kết của liên minh tại [FromFrom.GetName] không còn liên quan gì đến chúng ta nữa."
 federations2.72.name: "$federations2.70.name$"
 federations2.72.desc: "Vì [FromFrom.GetName] không còn giữ vị trí trung tâm của liên bang chúng ta nữa, nên kế hoạch ngợi ca nhà cai trị của hành tinh đó đã bị đình chỉ."
 federations2.72.A: "Một sự giải thoát tuyệt vời."
 federation_hegemony_monument: "Đài kỷ niệm Liên bang"
 federation_hegemony_monument_desc: "Đài kỷ niệm ngoài không gian này là biểu tượng cho sự đoàn kết, sức mạnh và sự huy hoàng của liên bang đã xây dựng nên nó."
 d_federation_hegemony_monument_1: "$federation_hegemony_monument$"
 d_federation_hegemony_monument_1_desc: "$federation_hegemony_monument_desc$"
 d_federation_hegemony_monument_2: "$federation_hegemony_monument$"
 d_federation_hegemony_monument_2_desc: "$federation_hegemony_monument_desc$"
 hegemony_propaganda_militarist: "Tuyên truyền Bá quyền"
 hegemony_propaganda_militarist_desc: "Kẻ thống trị liên bang đang ra sức truyền bá các giá trị của chủ nghĩa quân phiệt vào đất nước chúng ta."
 hegemony_propaganda_pacifist: "$hegemony_propaganda_militarist$"
 hegemony_propaganda_pacifist_desc: "Kẻ thống trị liên bang đang ra sức truyền bá các giá trị của chủ nghĩa hòa bình vào đất nước chúng ta."
 hegemony_propaganda_xenophobe: "$hegemony_propaganda_militarist$"
 hegemony_propaganda_xenophobe_desc: "Kẻ thống trị liên bang đang ra sức truyền bá các giá trị của chủ nghĩa bài ngoại vào đất nước chúng ta."
 hegemony_propaganda_xenophile: "$hegemony_propaganda_militarist$"
 hegemony_propaganda_xenophile_desc: "Kẻ thống trị liên bang đang ra sức truyền bá các giá trị của chủ nghĩa thân ngoại vào đất nước chúng ta."
 hegemony_propaganda_materialist: "$hegemony_propaganda_militarist$"
 hegemony_propaganda_materialist_desc: "Kẻ thống trị liên bang đang ra sức truyền bá các giá trị của chủ nghĩa duy vật vào đất nước chúng ta."
 hegemony_propaganda_spiritualist: "$hegemony_propaganda_militarist$"
 hegemony_propaganda_spiritualist_desc: "Kẻ thống trị liên bang đang ra sức truyền bá các giá trị của chủ nghĩa duy tâm vào đất nước chúng ta."
 hegemony_propaganda_egalitarian: "$hegemony_propaganda_militarist$"
 hegemony_propaganda_egalitarian_desc: "Kẻ thống trị liên bang đang ra sức truyền bá các giá trị của chủ nghĩa bình đẳng vào đất nước chúng ta."
 hegemony_propaganda_authoritarian: "$hegemony_propaganda_militarist$"
 hegemony_propaganda_authoritarian_desc: "Kẻ thống trị liên bang đang ra sức truyền bá các giá trị của chủ nghĩa độc tài vào đất nước chúng ta."
 hegemony_joint_operation_project_in_progress: "Đóng góp cho Đài kỷ niệm Liên bang"
 ### Militarist Joint Operation by Pierre du Plessis ###
 federations2.100.name: "Hạm đội Liên bang"
 federations2.100.desc: "[Root.Federation.GetName] là một thế lực đáng gờm trên vũ đài ngân hà, tuy nhiên hạm đội của họ lại nằm rải rác khắp nơi và hoạt động dưới những cơ cấu tổ chức khác nhau. Gần đây, một số chuyên gia quân sự có tầm ảnh hưởng trên toàn liên bang đã bày tỏ sự lo ngại về khả năng đối phó với một kẻ thù phối hợp nhịp nhàng và hùng mạnh của chúng ta.\n\nNhằm khắc phục những điểm yếu về sức mạnh, họ đã soạn thảo một kế hoạch, dự định tiến hành một loạt các cuộc diễn tập quân sự trên phạm vi toàn liên bang, qua đó củng cố sự đoàn kết của quân đội và rèn luyện kỹ năng cho các thủy thủ. Theo kế hoạch, mỗi hạm đội sẽ điều động một lực lượng đặc nhiệm đến các địa điểm được chỉ định trên lãnh thổ của các nước đồng minh, thực hiện hàng loạt các bài diễn tập phức tạp, đồng thời phối hợp chặt chẽ với các hạm đội tham gia khác để đảm bảo tính đồng bộ của chiến dịch. Hoàn thành xuất sắc cuộc diễn tập này là một nhiệm vụ thiết yếu của quân đội chúng ta, nó sẽ nâng cao đáng kể mức độ sẵn sàng chiến đấu của toàn liên bang."
 federations2.100.A.tooltip: "Chúng ta sẽ tiến hành liên lạc với tất cả các quốc gia thành viên và yêu cầu họ tham gia cuộc diễn tập.\n\nNếu một lượng lớn quốc gia thành viên từ chối đề xuất này, §HSự gắn kết§! của liên bang sẽ giảm sút, và [Root.GetName] sẽ bị tổn thất §HẢnh hưởng§!."
 federations2.100.A: "$federations2.50.A$"
 federations2.100.B: "Hạm đội của chúng ta đã được chuẩn bị kỹ lưỡng để đối phó với mọi tình huống có thể phát sinh."
 federations2.101.name: "$federations2.100.name$"
 federations2.101.desc: "Xin chào các vị [Root.GetSpeciesNamePluralCompliment] đáng kính! Bằng sức mạnh đoàn kết, chúng ta đã gây dựng được một thế lực hùng mạnh, khiến ai nấy cũng phải kiêng dè trên vũ đài ngân hà. Tuy nhiên, chúng tôi e ngại rằng, nếu phải đối đầu với một mối đe dọa mang sức mạnh to lớn và hành động thống nhất, thì sức mạnh hiện tại của chúng ta có thể sẽ không đủ sức chống cự. Các chuyên gia của chúng tôi đã vạch ra một kế hoạch, dự định tổ chức một chuỗi các cuộc diễn tập quân sự chung cho toàn liên bang, nhằm thắt chặt sự đoàn kết của quân đội và mài giũa kỹ năng cho các thủy thủ: chúng tôi dự định để mỗi hạm đội điều động một lực lượng đặc nhiệm đến các địa điểm cụ thể trong lãnh thổ liên bang, thực hiện hàng loạt các bài diễn tập phức tạp, đồng thời phối hợp chặt chẽ với các hạm đội tham gia khác để đảm bảo sự đồng bộ trong hành động.\n\nChúng tôi tin chắc rằng, những cuộc diễn tập này sẽ nâng cao đáng kể mức độ sẵn sàng chiến đấu của liên bang chúng ta. Liệu các vị có sẵn lòng tham gia diễn tập không?"
 federations2.101.A: "$federations2.51.A$"
 military_joint_exercise_potential_tooltip: "Hoàn thành cuộc diễn tập chung sẽ nâng cao hiệu suất hoạt động của hạm đội và tăng thêm kinh nghiệm cho liên bang."
 opinion_military_joint_action_agreed: "Đồng ý tham gia diễn tập quân sự chung"
 federations2.101.B: "Chúng tôi làm gì có hạm đội nào cho các người điều động diễn tập!"
 federations2.101.B.tooltip: "$federations2.51.B.tooltip$"
 opinion_military_joint_action_refused: "Từ chối tham gia diễn tập quân sự chung"
 federations2.103.name: "Cuộc diễn tập quân sự chung thất bại"
 federations2.103.desc: "Đại sứ của chúng ta đã dùng mọi nỗ lực để thuyết phục các quốc gia thành viên của [Root.Federation.GetName] tham gia vào kế hoạch diễn tập quân sự chung. Nhưng thật đáng tiếc, các đồng minh dường như không mấy bận tâm, họ thà tin tưởng vào sức mạnh của chính mình hơn là nâng cao khả năng tác chiến phối hợp."
 federations2.103.A: "Sự thiển cận này thật đáng lo ngại."
 federations2.104.name: "$federations2.103.name$"
 federations2.104.desc.said_yes: "Mặc dù chúng ta ủng hộ đề xuất tổ chức diễn tập quân sự chung cho liên bang của [From.GetAdj], nhưng do các quốc gia thành viên khác không cung cấp đủ sự ủng hộ, kế hoạch này dường như đã đổ vỡ."
 federations2.104.desc.said_no: "Sự phản đối của chúng ta đối với kế hoạch tổ chức diễn tập quân sự chung trong [Root.Federation.GetName] của [From.GetAdj] đã phát huy tác dụng. Đa số các quốc gia thành viên đều cho rằng không cần thiết phải để quân đội lãng phí sự chú ý vào những chuyện vặt vãnh này."
 federations2.104.A.yes: "$federations2.54.A.yes$"
 federations2.104.A.no: "Đó không phải là một quyết định sáng suốt."
 federations2.105.name: "Cuộc diễn tập quân sự chung đã được phê duyệt"
 federations2.105.desc: "Kế hoạch tổ chức diễn tập quân sự chung giữa các quốc gia thành viên [Root.Federation.GetName] của chúng ta đã nhận được sự ủng hộ của phần lớn các nước đồng minh. Mọi quốc gia thành viên tham gia sẽ bắt tay vào công tác chuẩn bị ngay lập tức!"
 federations2.105.A: "Tập hợp hạm đội, hãy khiến kẻ thù phải khiếp sợ!"
 military_join_operation_happens_tooltip: "Tất cả các quốc gia thành viên tham gia khác sẽ nhận được các dự án đặc biệt tương tự ở những địa điểm ngẫu nhiên trong lãnh thổ [Root.Federation.GetName]."
 federations2.106.name: "$federations2.105.name$"
 federations2.106.desc.said_yes: "Đề xuất tổ chức diễn tập quân sự chung giữa các hạm đội của các quốc gia thành viên liên bang do [From.GetAdj] đưa ra đã nhận được sự ủng hộ của phần lớn các quốc gia thành viên. Chúng ta cần phải tiến hành công tác chuẩn bị càng sớm càng tốt!"
 federations2.106.desc.said_no: "Bất chấp sự phản đối của chúng ta, đề xuất tổ chức diễn tập quân sự chung giữa các hạm đội của các quốc gia thành viên liên bang do [From.GetAdj] đưa ra vẫn nhận được sự ủng hộ của phần lớn các quốc gia thành viên. May mắn thay, [From.GetName] không có quyền ép buộc chúng ta tham gia vào kế hoạch này."
 federations2.106.A: "$federations2.105.A$"
 federations2.106.B.no: "Thật là phí phạm thời gian và công sức, đáng tiếc thật."
 military_joint_project: "Diễn tập Hạm đội Liên bang"
 military_joint_project_DESC: "[Root.Owner.Federation.GetName] đang tiến hành cuộc diễn tập quân sự chung, nhằm mục đích thắt chặt tinh thần đoàn kết giữa các lực lượng quân sự trong liên minh, và mài giũa kỹ năng cho các thủy thủ.\n\nCuộc diễn tập sẽ bắt đầu ngay sau khi hạm đội liên bang vào vị trí."
 federations2.108.name: "Công tác chuẩn bị cho cuộc diễn tập chung đã hoàn tất"
 federations2.108.desc: "Chúng ta đã hoàn tất mọi công tác chuẩn bị cho cuộc diễn tập quân sự chung của liên bang, giờ chỉ cần chờ hạm đội của các nước đồng minh vào vị trí là có thể bắt đầu hành động!"
 federations2.108.tt: "Cuộc diễn tập sẽ bắt đầu ngay sau khi hạm đội liên bang vào vị trí."
 federations2.108.A: "Chúc các vị mọi điều tốt lành!"
 federations2.109.name: "Cuộc diễn tập quân sự chung chính thức bắt đầu"
 federations2.109.desc: "Toàn bộ hạm đội liên bang đã vào vị trí, cuộc diễn tập huấn luyện có thể bắt đầu ngay lập tức! Một nhóm mục tiêu hạng nhẹ với khả năng cơ động cao đã xuất hiện từ những vị trí được giấu kín trước đó, và trong suốt 30 ngày diễn tập, những mục tiêu này sẽ dùng mọi cách để tránh né sự truy quét từ tàu chiến của chúng ta."
 federations2.109.A: "Vũ khí đã khóa mục tiêu và nạp đạn xong!"
 federations2.112.name: "Tiêu diệt mục tiêu thành công"
 federations2.112.desc: "Chúng ta đã xuất sắc tiêu diệt các mục tiêu trong cuộc diễn tập quân sự chung. Chỉ mong sao các đồng minh của chúng ta cũng làm việc chăm chỉ như vậy!"
 federations2.113.name: "Bỏ lỡ mục tiêu huấn luyện"
 federations2.113.desc: "Chúng ta đã thất bại trong việc tiêu diệt các mục tiêu trong cuộc diễn tập quân sự chung, khiến cho các sĩ quan hạm đội vô cùng xấu hổ. Chúng ta chỉ có thể hy vọng rằng các đồng minh sẽ đạt được thành tích tốt hơn!"
 federations2.115.name: "Hoàn tất cuộc diễn tập quân sự chung"
 federations2.115.desc.complete_success: "Cuộc diễn tập quân sự chung của [Root.Federation.GetName] đã chính thức khép lại. Cuộc diễn tập lần này có thể được coi là một thành công rực rỡ đầy khích lệ, mỗi đội tham gia đều tiêu diệt mục tiêu một cách dễ dàng, chứng minh một cách trọn vẹn kỹ năng phi thường và khả năng phối hợp tác chiến xuất sắc của hạm đội liên bang chúng ta! Trước khi muốn tuyên chiến với chúng ta, kẻ thù nhất định sẽ phải suy nghĩ lại thật kỹ càng."
 federations2.115.desc.partial_success: "Cuộc diễn tập quân sự chung của [Root.Federation.GetName] đã chính thức khép lại. Nhìn chung, kết quả của cuộc diễn tập lần này không hoàn toàn như mong đợi: mặc dù không phải hạm đội nào cũng có thể tiêu diệt mục tiêu của mình, nhưng phần lớn các hạm đội tham gia đều đã đạt được thành công, điều này cho thấy hạm đội liên bang có đủ khả năng để phối hợp thực hiện các nhiệm vụ phức tạp. Hơn nữa, các thủy thủ của chúng ta cũng đã thu được rất nhiều kinh nghiệm quý báu từ đợt diễn tập này, hiện tại họ đã chuẩn bị sẵn sàng như thường lệ, có thể thực hiện nhiệm vụ bất cứ lúc nào. Trước khi muốn tuyên chiến với chúng ta, kẻ thù nhất định sẽ phải suy nghĩ lại thật kỹ càng."
 federations2.115.desc.partial_failure: "Cuộc diễn tập quân sự chung của [Root.Federation.GetName] đã chính thức khép lại, nhưng quá trình lại diễn ra theo một cách khá mỉa mai: mặc dù một số hạm đội tham gia đã bắn trúng mục tiêu, nhưng phần lớn lại gặp thất bại, điều này khiến chúng ta không khỏi hoài nghi liệu [Root.Federation.GetName] có đủ khả năng để tổ chức các chiến dịch quân sự thống nhất hay không. Chúng ta chỉ có thể hy vọng rằng kẻ thù không chú ý quá sát sao đến diễn biến của cuộc diễn tập..."
 federations2.115.desc.complete_failure: "Việc không một quốc gia thành viên tham gia diễn tập nào có thể tiêu diệt mục tiêu trong thời gian quy định đã khiến cho cuộc diễn tập quân sự chung của [Root.Federation.GetName] kết thúc như một trò hề. Chúng ta chỉ có thể cầu mong rằng, trong lúc chúng ta đang dốc sức gom nhặt lại lòng tự tôn đã đánh mất và khôi phục lại danh dự cho hạm đội, kẻ thù không chú ý quá sát sao đến diễn biến của đợt diễn tập này."
 federations2.115.A: "Hạm đội của chúng ta sẽ không gì cản nổi!"
 federations2.115.A.haha: "Chúng ta có những người đồng minh tuyệt vời nhất!"
 federations2.115.B.oh_well: "Ít ra thì chúng ta cũng đã hoàn thành mục tiêu của riêng mình."
 federations2.115.B.oh_dear: "Chúng ta đành cúi đầu tuyệt vọng, xấu hổ không để đâu cho hết."
 military_federation_success_modifier: "Đội quân thiện chiến"
 military_federation_success_modifier_desc: "Cuộc diễn tập huấn luyện gần đây của liên bang đã phô diễn kỹ năng xuất chúng và khả năng phối hợp tuyệt vời của hạm đội chúng ta."
 military_federation_failure_modifier: "Quân đội mang nhục"
 military_federation_failure_modifier_desc: "Trong đợt diễn tập huấn luyện gần đây, quân đội của chúng ta đã có một màn trình diễn tệ hại so với các hạm đội liên bang khác, và cảm thấy vô cùng nhục nhã vì điều này."
 federations2.120.name: "Việc tham gia diễn tập quân sự chung bị hạn chế"
 federations2.120.desc: "Vì chúng ta đã rời khỏi liên bang trước đây, do đó chúng ta không có quyền tham gia vào các kế hoạch diễn tập quân sự chung của họ."
 federations2.121.name: "Cuộc diễn tập quân sự chung bị hủy bỏ"
 federations2.121.desc: "Sự bùng nổ của chiến tranh đã khiến cho kế hoạch diễn tập quân sự của liên bang bị hủy bỏ."
 training_target: "Mục tiêu huấn luyện"
 training_target_plural: "Mục tiêu huấn luyện"
 the_following_nations_failed: "\nCác hạm đội tham gia sau đây đã không hoàn thành bài diễn tập:"
 ### Spiritualist Joint Operation by Hadrien Buytaers ###
 GetEcumenicalCouncilDebateText1: "Hư Cảnh có phải là một chiều không gian thần thánh không?"
 GetEcumenicalCouncilDebateText2: "Chỉ có một vị thần duy nhất sở hữu nhiều hóa thân hay có nhiều vị thần khác nhau?"
 GetEcumenicalCouncilDebateText3: "Tinh thần và linh hồn có phải là hai khái niệm tách biệt không?"
 GetEcumenicalCouncilDebateText4: "Zarqlan là ai?"
 GetEcumenicalCouncilDebateText5: "Điều kiện để trở thành vùng đất thánh là gì?"
 GetEcumenicalCouncilDebateText6: "Giáo hội liên hiệp có nên có một vị Tổng giám mục hay không?"
 GetEcumenicalCouncilDebateText7: "Sức mạnh tâm linh có phải là quyền năng từ thần linh hay không?"
 GetEcumenicalCouncilDebateText8: "Tiền thuế thập phân có nên chỉ dùng cho mục đích từ thiện không?"
 GetEcumenicalCouncilDebateText9: "Đức tin cá nhân có phải là nguồn gốc của dị giáo không?"
 GetEcumenicalCouncilDebateText10: "Thần tích rốt cuộc phi thường đến mức nào?"
 GetEcumenicalCouncilDebateText11: "Sự soi xét Đấng Cứu Thế. Đấng Cứu Thế của chúng ta chỉ đơn thuần là một nhà tiên tri thôi sao?"
 GetEcumenicalCouncilDebateText12: "Vũ trụ được tạo ra khi nào?"
 GetEcumenicalCouncilDebateText13: "Zroni có phải là sứ giả của thần linh không?"
 GetEcumenicalCouncilDebateText14: "Bản thân chúng ta có chứa đựng sự thiêng liêng không?"
 GetEcumenicalCouncilDebateText15: "Những đức tính nào tạo nên nền tảng cho một tâm hồn thuần khiết?"
 GetEcumenicalCouncilDebateText16: "Máy móc có thể được cứu rỗi không?"
 federations3.2205.name: "Hội nghị Giám mục Liên bang"
 federations3.2205.desc: "Các thành viên của [Root.Federation.GetName] đã tề tựu lại cùng nhau dưới danh nghĩa thánh linh. Chúng ta đã tìm thấy điểm chung giữa các tín ngưỡng riêng biệt của mỗi người, thế nhưng trong liên bang vẫn tồn tại vô số các giáo điều, tôn giáo và giáo hội khác nhau, việc chung sống hòa bình với nhau không phải là chuyện dễ dàng.\n\nGần đây, các thành viên của tăng đoàn đã thúc giục [Root.Federation.GetName] đứng ra tổ chức một hội nghị giám mục, nhằm cùng nhau thảo luận và soạn thảo một hệ thống giáo lý chung, xác định nền tảng cho đức tin của chúng ta. Đề xuất này đã được thông qua, mỗi một thành viên của [Root.Federation.GetName] đều phải cử đại diện của mình đến tham dự."
 federations3.2205.a: "Sứ giả chúng ta cử đến liên bang hoàn toàn có khả năng đảm đương việc này."
 federations3.2205.b: "Thật là vô lý. Cứ tùy tiện tìm một nhóm người phái đi là được."
 federations3.2205.c: "Cử một sứ giả đi!"
 federations3.2205.d: "Chúng ta không hứng thú với cái chương trình nghị sự kỳ quái này."
 federations3.2215.name: "Hội nghị Giám mục: Lý luận hoàn hảo"
 federations3.2215.desc: "Chủ đề thảo luận của ngày hôm nay là '[GetEcumenicalCouncilDebate]', phái đoàn của chúng ta đã dùng những ngôn từ hoa mỹ nhất cùng những lập luận sắc bén đến không thể phản bác để thực hiện một bài diễn thuyết vô cùng ấn tượng, hoàn toàn áp đảo những tiếng nói phản đối quan điểm của chúng ta. Nhờ vào màn trình diễn xuất sắc của chúng ta, đối thủ đã phải chìm trong im lặng và hội nghị đã nhanh chóng đi đến kết luận. Phái đoàn từ các quốc gia khác bày tỏ mong muốn được vinh danh chúng ta vì trí tuệ tuyệt vời này."
 federations3.2215.a: "Chúng ta đến đây không phải vì danh lợi. Lịch sự từ chối."
 federations3.2215.b: "Lũ ngốc này thiếu chúng ta thì chẳng làm nên trò trống gì!"
 federations3.2215.c: "Đây là điều hoàn toàn xứng đáng!"
 federations3.2220.name: "Hội nghị Giám mục: Tranh luận nảy lửa"
 federations3.2220.desc: "Vấn đề xoay quanh '[GetEcumenicalCouncilDebate]' thực sự rất tế nhị, những cuộc thảo luận liên quan đến nó thường chạm vào rất nhiều dây thần kinh nhạy cảm. Cụ thể hơn, phái đoàn của chúng ta vô cùng cố chấp với quan điểm của mình, và thường xuyên có những lời lẽ vô lễ với các giáo sĩ cấp cao từ các quốc gia khác. Họ đã đồng loạt yêu cầu chúng ta phải đưa ra lời xin lỗi chính thức."
 federations3.2220.a: "Hành động này quả thực rất đáng xấu hổ. Chúng ta sẽ xin lỗi."
 federations3.2220.b: "Một lũ ngốc! Chúng ta là như vậy đấy, thì sao nào."
 federations3.2220.c: "Rõ ràng là một vài món quà nhỏ có thể giúp họ hiểu ra nguyên nhân sâu xa của vấn đề."
 federations3.2225.name: "Hội nghị Giám mục: Vấn đề ưu tiên"
 federations3.2225.desc: "Trước khi tiến hành thảo luận về chủ đề '[GetEcumenicalCouncilDebate]', hội đồng yêu cầu các phái đoàn thực hiện một buổi thiền định tĩnh tâm dưới sự dẫn dắt của một giáo sĩ cấp cao. Do chương trình nghị sự được sắp xếp chưa chi tiết, nên có đến ba vị giám mục quyền cao chức trọng đều cho rằng mình mới là người xứng đáng được làm chủ trì buổi lễ. Bầu không khí bắt đầu trở nên căng thẳng, khi cuộc cãi vã giữa họ ngày càng leo thang, hội nghị buộc phải bị hoãn lại."
 federations3.2225.a: "Kẻ ngốc nào đã sắp xếp cái chương trình nghị sự này vậy? Hội nghị này đúng là một trò cười."
 federations3.2225.b: "Điều này thật không thể chấp nhận được. Đưa ra lời khiển trách chính thức."
 federations3.2225.c: "Sắp xếp lại chương trình nghị sự, để họ nhận được sự chú ý mà họ muốn."
 federations3.2235.name: "Hội nghị Giám mục: Tặng quà"
 federations3.2235.desc: "Cuộc tranh luận nảy lửa về '[GetEcumenicalCouncilDebate]' đã khiến cho các khách mời tham dự phải chịu nhiều kích động và cảm xúc dâng trào. Để làm dịu đi bầu không khí, hội nghị quyết định để các quốc gia trao đổi cho nhau những món quà và những biểu tượng của tình hữu nghị. Chúng ta nên tặng thứ gì đây?"
 federations3.2235.a: "Hãy chuẩn bị thật kỹ những món quà thượng hạng!"
 federations3.2235.b: "Làm lấy lệ thôi."
 federations3.2235.c: "Cho chúng [GetSpeciesShavings] của Hoàng đế đi."
 federations3.2235.d: "Không cho."
 shavings_hum: "móng chân"
 shavings_mam: "râu ria"
 shavings_rep: "lông chân"
 shavings_avi: "lông vũ"
 shavings_art: "lớp vỏ lột"
 shavings_mol: "chất nhầy"
 shavings_fun: "bào tử"
 shavings_lithoid: "bụi đá"
 shavings_necroid: "chất xương"
 shavings_aquatic: "hà bám"
 shavings_plant: "rễ cây"
 shavings_tox: "chất keo"
 federations3.2240.name: "Hội nghị Giám mục: Mối quan hệ nguy hiểm"
 federations3.2240.desc: "Cuộc tranh luận quan trọng về '[GetEcumenicalCouncilDebate]' của ngày hôm nay đã bị cắt ngang bởi một vị giáo sĩ cấp cao bất ngờ xông vào, theo sau ông ta là hai thành viên thuộc hai phái đoàn khác nhau. Hai người này đã bị bắt quả tang khi đang thổ lộ tình yêu vĩnh cửu bất chấp rào cản chủng tộc dành cho nhau. Những sứ giả bảo thủ hơn cho rằng hành động của họ là vô cùng thiếu tế nhị và đã tiệm cận với dị giáo, làm vấy bẩn sự thiêng liêng của hội nghị."
 federations3.2240.a: "Rõ ràng đây là biểu tượng của sự đoàn kết!"
 federations3.2240.b: "Thật không biết xấu hổ!"
 federations3.2240.c: "Bảo họ nhanh chóng tự sát đi."
 federations3.2245.name: "Hội nghị Giám mục: Bê bối tại bữa tiệc"
 federations3.2245.desc: "Sau cả một ngày dài tranh cãi gay gắt về '[GetEcumenicalCouncilDebate]', một bữa tiệc đã được tổ chức theo phong tục của một trong các phái đoàn. Một trong những nghi thức của bữa tiệc là dâng lên các khách mời một loại rượu dùng trong nghi lễ. Đối với giống loài của phái đoàn đó, nó chỉ là một chất gây ảo giác nhẹ, nhưng đối với chúng ta, phản ứng lại vô cùng dữ dội. Chỉ một lúc sau, cả căn phòng đã chìm vào một cuộc ẩu đả hỗn loạn. Rất may là sau khi sự việc lắng xuống, không có ai bị thương nặng, nhưng các cuộc điều tra cho thấy sứ giả của chúng ta là người ra tay đầu tiên, và yêu cầu chúng ta phải xin lỗi về việc này."
 federations3.2245.a: "Xin lỗi đi."
 federations3.2245.b: "Rõ ràng là do đồ uống có vấn đề!"
 federations3.2245.c: "Được thôi, đưa tất cả bọn họ đến một hành tinh chết để tĩnh dưỡng đi."
 federations3.2255.name: "Hội nghị Giám mục: Khăng khăng giữ nguyên ý kiến"
 federations3.2255.desc: "Khi quyết tâm làm chủ trì hội nghị, chúng ta đã lường trước được rằng con đường dẫn đến một giáo lý thống nhất chắc chắn sẽ đầy rẫy chông gai, nhưng chúng ta vẫn đánh giá thấp mật độ chằng chịt của những bụi gai này. Nhiều tháng trời tranh cãi vô bổ không mang lại bất kỳ kết luận nào, ngược lại càng làm cho chúng ta nhận thức rõ hơn về sự bất đồng không thể hòa giải giữa các bên. Chúng ta quyết định sẽ đợi thêm một thời gian nữa rồi mới nhắc lại chuyện này."
 federations3.2260.name: "Hội nghị Giám mục: Cầu đồng tồn dị"
 federations3.2260.desc: "Chúng ta thực sự đã nhận được sự che chở. Cuối cùng, hóa ra những lo lắng ban đầu của chúng ta chỉ là lo bò trắng răng, mọi việc đều diễn ra vô cùng suôn sẻ. Với những lý luận chính xác và các bài diễn thuyết đầy tính gợi mở, chúng ta đã biên soạn thành công một tuyển tập giáo lý mới đầy tính hòa hợp. Chẳng bao lâu nữa chúng ta sẽ tiến hành tu sửa lại nó một lần nữa, nhưng hiện tại, nó đã trở thành nền tảng của một đức tin thống nhất, kéo gần khoảng cách giữa tất cả chúng ta lại với nhau!"
 federations3.2260.tt: "Nghề nghiệp sản xuất thêm §G+20%§!£unity£ Thống nhất và §G+3§! Kinh nghiệm Liên bang mỗi tháng, duy trì trong 20 năm."
 federations3.2265.name: "Hội nghị Giám mục: Thắng lợi bước đầu"
 federations3.2265.desc: "Nhìn chung, hội nghị vẫn đạt được những thành tựu nhất định. Mặc dù không hoàn toàn suôn sẻ, nhưng mọi người đều đã chuẩn bị sẵn sàng tâm lý để đối mặt với khó khăn. Đây chỉ là bước đầu tiên trên con đường đưa nhân dân và đức tin của chúng ta tiến tới sự đoàn kết. Đường dẫu dài và gian nan, nhưng tương lai lại vô cùng xán lạn."
 federations3.2265.tt: "Nghề nghiệp sản xuất thêm §G+10%§!£unity£ Thống nhất và §G+3§! Kinh nghiệm Liên bang mỗi tháng, duy trì trong 10 năm."
 spifed_jointop_success: "Sự thống nhất về mặt tâm linh"
