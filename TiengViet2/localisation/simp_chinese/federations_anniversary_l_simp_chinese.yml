 envoy_events.3.name: "Kẻ pha trò Ngân hà"
 envoy_events.3.desc.base: "[event_envoy.GetName], sứ giả đại diện cho lợi ích của nước ta tại Cộng đồng Ngân hà đã có một pha lỡ lời nghiêm trọng khi gọi nhầm đại diện [council_country.GetAdj] thành [pathetic_country.GetSpeciesName]. Thật không may, nhiều người đứng xem đã nghe thấy bình luận tai hại này, và hiển nhiên giờ đây [event_envoy.GetName] đang hứng chịu vô số lời chế nhạo."
 envoy_events.3.desc: "$envoy_events.3.desc.base$ Nhiều người bắt đầu bôi nhọ năng lực của đoàn ngoại giao nước ta, nhưng những đóng góp của chúng ta cho câu chuyện cười mới nhất của Ngân hà thì không thể chối cãi."
 envoy_events.3.desc.hive: "$envoy_events.3.desc.base$ Nhiều người bắt đầu bôi nhọ năng lực của cá thể tư duy ngoại giao nước ta, nhưng những đóng góp của chúng ta cho câu chuyện cười mới nhất của Ngân hà thì không thể chối cãi."
 envoy_events.3.desc.machine: "$envoy_events.3.desc.base$ Nhiều người bắt đầu bôi nhọ năng lực của hệ thống ngoại giao nước ta, nhưng những đóng góp của chúng ta cho câu chuyện cười mới nhất của Ngân hà thì không thể chối cãi."
 envoy_events.3.A: "Cứ để chúng cười đi, khi chúng còn có thể."
 envoy_events.3.B: "Đành vậy thôi."
 envoy_events.3.C1: "Triệu hồi [event_envoy.GetHerHim] về [Root.Capital.GetName] để đào tạo lại."
 envoy_events.3.C2: "Triệu hồi [event_envoy.GetHerHim] về [Root.Capital.GetName] để lập trình lại."
 envoy_events.3.C3: "Triệu hồi [event_envoy.GetHerHim] về [Root.Capital.GetName] để tinh chỉnh lại."
 galactic_community_diplo_corps_is_a_joke: "Đoàn ngoại giao bị chế nhạo"
 galactic_community_diplo_corps_is_a_joke_desc: "Một trong những sứ giả của chúng ta đã lỡ lời nghiêm trọng, khiến đoàn ngoại giao nước ta trở thành trò cười của cả ngân hà."
 envoy_events.4.name: "Ngoại giao Ngân hà lão luyện"
 envoy_events.4.desc.base: "Mặc dù chúng ta không phải là một siêu cường thực sự trong ngân hà, nhưng chúng ta thường có thể phát huy sức ảnh hưởng vượt xa trọng lượng của nước ta trong các công việc chung. Điều này phần lớn là nhờ nỗ lực của sứ giả [event_envoy.GetName], người đã đại diện xuất sắc cho lợi ích của chúng ta trong Cộng đồng Ngân hà, đến mức ngay cả những kẻ phản đối mạnh mẽ lập trường của [Root.GetName] cũng dành sự tôn trọng lớn cho người này."
 envoy_events.4.desc: "$envoy_events.4.desc.base$ Kết quả là, mặc dù không phải ai cũng sợ hãi hải quân nước ta hay thèm muốn một kho bạc sánh ngang với chúng ta, nhưng họ vẫn ngưỡng mộ sự điêu luyện xuất chúng của đoàn ngoại giao chúng ta."
 envoy_events.4.desc.hive: "$envoy_events.4.desc.base$ Kết quả là, mặc dù không phải ai cũng sợ hãi hải quân nước ta hay thèm muốn nguồn tài nguyên vật chất sánh ngang với chúng ta, nhưng họ vẫn ngưỡng mộ sự điêu luyện xuất chúng của cá thể tư duy ngoại giao chúng ta."
 envoy_events.4.desc.machine: "$envoy_events.4.desc.base$ Kết quả là, mặc dù không phải ai cũng sợ hãi hải quân nước ta hay thèm muốn nguồn tài nguyên vật chất sánh ngang với chúng ta, nhưng họ vẫn ngưỡng mộ sự điêu luyện xuất chúng của hệ thống tư duy ngoại giao chúng ta."
 galactic_community_diplo_corps_respected: "Đoàn ngoại giao được kính trọng"
 galactic_community_diplo_corps_respected_desc: "Đoàn ngoại giao của nước ta được tôn trọng rộng rãi bởi các sinh vật có cảm xúc trên toàn ngân hà."
 envoy_events.5.name: "Sứ giả phiền phức"
 envoy_events.5.desc: "Cách mà sứ giả [envoy_source.GetAdj] [event_envoy.GetName] đại diện cho lợi ích của [envoy_source.GetAdj] tại [Root.Capital.GetName] thật khó chịu và mệt mỏi. Kể từ khi mới tới đây, [event_envoy.GetSheHe] đã luôn mang thái độ thù địch với [Root.GetGovernmentName], liên tục phản đối các chính sách và hành động của nước ta. [event_envoy.GetSheHe] quả thực quá phiền phức, nếu loại bỏ được [event_envoy.GetHerHim] thì chẳng có mấy ai phải buồn cả, và chúng ta đã nghe tin đồn rằng một nhóm người trung thành với [Root.GetAdj] đang âm mưu đẩy nhanh cái chết của [event_envoy.GetHerHis].\n\nTất nhiên rất dễ để làm lơ cho âm mưu này tiếp diễn, nhưng việc để một yếu nhân nước ngoài bị ám sát trên lãnh thổ nước ta có lẽ chẳng phải là chuyện tốt lành gì."
 envoy_events.5.A: "Chúng ta không thể ngồi yên nhìn chuyện này xảy ra. Phải lôi cái âm mưu này ra ánh sáng!"
 envoy_events.5.B: "Cứ để tên sứ giả phiền phức này biến mất đi."
 envoy_events.6.name: "Án mạng tại [From.Capital.GetName]!"
 envoy_events.6.desc: "[event_envoy.GetName] - sứ giả nước ta phái đi để điều hòa tranh chấp với [From.GetName] đã bị sát hại! [event_envoy.GetSheHeCap] đã biến mất không dấu vết vài ngày trước, lỡ mất buổi liên lạc đã lên lịch với hội đồng [Root.GetRulerTitle]. Sau vài ngày tìm kiếm, thi thể của [event_envoy.GetHerHis] được phát hiện trong một thùng chứa rác chuẩn bị được đem đi thiêu hủy.\n\nChính phủ [From.GetAdj] trốn tránh trách nhiệm, không chịu mở cuộc điều tra, khiến người ta nghi ngờ rằng chính họ là kẻ đứng sau vụ mưu sát - đặc biệt là khi [event_envoy.GetName] gần đây đã chỉ trích mạnh mẽ [From.GetGovernmentName]."
 envoy_events.6.A: "Chúng sẽ phải trả giá cho việc này."
 kills_envoys: "Sứ giả mất tích"
 kills_envoys_desc: "Vì lý do nào đó, các sứ giả nước ngoài rất dễ đột ngột qua đời tại thủ đô của chúng ta, điều này đã làm ảnh hưởng đến vị thế của nước ta trước các nước đồng cấp trong ngân hà."
 faction_modifier_protected_interests: "Bảo vệ lợi ích quốc gia"
 opinion_kills_envoys: "Ám sát sứ giả"
 envoy_events.7.name: "Uyên ương bỏ trốn"
 envoy_events.7.desc: "Sứ giả của nước ta, [event_envoy.GetName], dường như đã không hoàn thành tốt nhiệm vụ bảo vệ lợi ích [Root.GetAdj] của mình, mà thay vào đó lại sa vào lưới tình với một nhà ngoại giao [other_species_nation.GetAdj]. Lo sợ những hậu quả xấu có thể xảy ra từ việc vượt rào này, đôi tình nhân đã cùng nhau trốn đến [third_party.GetName]: nơi có bản hiến pháp tự do nguy hiểm cho phép những cuộc kết hợp như vậy.\n\nDo đó, [event_envoy.GetName] đã đánh mất chức vụ sứ giả mà đất nước đã ban cho. Tuy nhiên, việc mất kiểm soát đối với chính các quan chức của mình đã làm tổn hại đến vị thế của chúng ta trên trường quốc tế. Chúng ta phải bắt giữ kẻ phạm pháp này để khôi phục lại danh dự!"
 envoy_events.7.A: "Phe [third_party.GetSpeciesNamePlural] đang nợ chúng ta một ân tình."
 envoy_events.7.B: "Tìm họ và dùng lý lẽ để thuyết phục họ."
 envoy_events.7.B.tooltip: "Nếu [third_party.GetName] đồng ý, chúng ta sẽ trao cho họ 2 Ủng hộ ngoại giao."
 envoy_events.7.D: "Cứ mặc họ đi; chuyện này rồi sẽ sớm trôi qua thôi."
 envoy_events.8.desc: "Gửi những người [Root.GetSpeciesNamePlural] đáng kính! Chúng tôi nhận thấy có một tội phạm [From.GetAdj] đang tị nạn tại quốc gia của các vị. Kẻ phạm pháp này, đồng thời là cựu sứ giả nước chúng tôi - [event_envoy.GetName], đã phản bội mọi lời thề trung thành, vi phạm những đạo luật cơ bản nhất của đất nước để bỏ trốn cùng một kẻ [other_species_nation.GetAdj].\n\nPhiền các vị giao nộp tên tội phạm này lại cho nước chúng tôi, để [event_envoy.GetSheHe] có thể bị xét xử cho những tội ác của mình."
 envoy_events.8.A: "Tất nhiên là được."
 envoy_events.8.B: "Không đời nào! [event_envoy.GetSheHeCap] đang được chúng tôi bảo vệ."
 envoy_events.9.desc: "Được chứ! Chúng tôi sẽ trục xuất [event_envoy.GetName] ngay lập tức."
 envoy_events.9.A: "Cảm ơn các vị."
 envoy_events.10.desc: "Quyền tị nạn chính trị đối với chúng tôi là điều thiêng liêng. Chúng tôi không thể đồng ý với yêu cầu của các vị để giao nộp những người không hề làm sai bất cứ điều gì!"
 envoy_events.10.A: "Chúng tôi bày tỏ sự hối tiếc sâu sắc về việc này."
 envoy_events.10.B: "(Nói dối) Tất nhiên rồi, chúng tôi có thể hiểu được."
 envoy_events.10.B.tooltip1: "Gửi một đội đặc nhiệm để bắt giữ đôi tình nhân mang về quy án.\n[third_party.GetName] sẽ tỏ ra không hài lòng."
 envoy_events.10.B.success_tooltip: "Nhiệm vụ thành công."
 envoy_events.10.B.fail_tooltip: "Nhiệm vụ đã kết thúc trong thất bại."
 envoy_events.11.name: "Đội đặc nhiệm [From.GetAdj]"
 envoy_events.11.desc: "[From.GetName] có vẻ vô cùng bất mãn với việc chúng ta từ chối dẫn độ tên sứ giả đào tẩu [event_envoy.GetName] cho họ, thế là họ quyết định tự mình giải quyết vấn đề. Kẻ đào tẩu đã bị bắt cóc ngay dưới mũi chúng ta, có vẻ như một đội đặc nhiệm được huấn luyện bài bản đã làm chuyện này vào lúc đêm khuya thanh vắng.\n\nViệc chúng ta thất bại trong việc bảo vệ những người tìm đến cầu xin giúp đỡ đã gây ra sự xôn xao không nhỏ giữa các đồng minh, và các nhà ngoại giao của chúng ta đang phải cố gắng thu dọn tàn cuộc."
 envoy_events.11.A: "Sao chúng dám làm vậy!"
 envoy_events.12.name: "Chiến dịch đặc nhiệm thành công"
 envoy_events.12.desc: "Đội đặc nhiệm chúng ta phái đi để bắt giữ sứ giả đào tẩu [event_envoy.GetName] đã hoàn thành xuất sắc nhiệm vụ. Tên tội phạm này đã bị tống giam an toàn, chờ đợi những hình phạt thích đáng cho tội ác của [event_envoy.GetHerHis]."
 envoy_events.13.name: "Đội đặc nhiệm [From.GetAdj] đã bị đập tan"
 envoy_events.13.desc: "[From.GetName] có vẻ vô cùng bất mãn với việc chúng ta từ chối dẫn độ tên sứ giả đào tẩu [event_envoy.GetName] cho họ, thế là họ định tự mình giải quyết bằng cách phát động một chiến dịch bắt giữ. Tuy nhiên, chiến dịch này đã thất bại, chúng ta đã đánh chặn được phi thuyền chở đội đặc nhiệm [From.GetAdj] khi nó cố gắng vượt qua biên giới. Đồng thời, chúng ta cũng thực hiện các biện pháp nhằm đảm bảo những nỗ lực tương tự trong tương lai cũng sẽ chịu chung số phận."
 envoy_events.13.A: "Thật không biết xấu hổ..."
 envoy_events.14.name: "Chiến dịch đặc nhiệm thất bại"
 envoy_events.14.desc: "Đội đặc nhiệm chúng ta phái đi để bắt giữ sứ giả đào tẩu [event_envoy.GetName] đã không hoàn thành nhiệm vụ; phi thuyền của họ đã bị bắt giữ tại trạm giam giữ [From.GetAdj] khi đang cố gắng vượt qua biên giới. Phe [From.GetSpeciesNamePlural] đúng như dự đoán đã nổi trận lôi đình, đả kích mạnh mẽ việc [Root.GetAdj] can thiệp vào công việc nội bộ của họ. Trong mắt họ, công dân nước ta hẳn đang rất thất vọng trước cách xử lý sự việc cũng như sự thất bại trong việc bắt giữ tội phạm."
 opinion_extradited_envoy: "Dẫn độ sứ giả đào tẩu"
 opinion_refused_extradited_envoy: "Từ chối dẫn độ sứ giả đào tẩu"
 opinion_special_ops_vs_us: "Chiến dịch đặc nhiệm"
 cannot_protect_asylum: "Người bảo vệ công lý lực bất tòng tâm"
 cannot_protect_asylum_desc: "Vị thế của nước ta giữa các nước đồng cấp đã suy giảm do chúng ta không bảo vệ được những người đã được cấp quyền tị nạn chính trị."
 failed_special_ops_mission: "Chiến dịch đặc nhiệm thất bại"
 failed_special_ops_mission_desc: "Chúng ta đã thất bại trong việc bắt lại sứ giả đào tẩu, điều này không những gióng lên hồi chuông cảnh báo cho các quốc gia đồng cấp trong ngân hà mà còn làm lung lay niềm tin của công dân đối với chính phủ."
 diplo_corps_lost_control: "Đoàn ngoại giao bị chế nhạo"
 diplo_corps_lost_control_desc: "Sự bất lực của chúng ta trong việc kiểm soát các nhà ngoại giao phe mình sẽ không thể khơi dậy niềm tin từ các đồng minh."
 envoy_events.15.name: "Sinh vật kỳ lạ"
 envoy_events.15.desc: "Sứ giả của chúng ta tại Cộng đồng Ngân hà, [event_envoy.GetName], dạo gần đây dành nhiều thời gian chăm sóc cho một loài động vật có vú nhỏ kỳ lạ luôn theo sát [event_envoy.GetHerHim] đến mức đáng báo động. Có lẽ đây là thú cưng của một đại biểu nào khác, nó rất dễ thương, nhưng không có dấu hiệu cho thấy có trí tuệ. Mặc dù là một loài ăn thịt với hàm răng sắc nhọn và móng vuốt, nhưng nhìn chung nó lại hiền lành và đáng yêu, khao khát được tiếp xúc cơ thể thông qua những cái vuốt ve - nhưng đôi khi tính khí của nó cũng có thể trở nên hung dữ.\n\nMặc dù sinh vật này đã được chứng minh là làm cho [event_envoy.GetName] xao nhãng khỏi những nhiệm vụ nghiêm túc hơn, nhưng các đại biểu khác lại dành nhiều lời khen ngợi cho khía cạnh mềm mỏng, tình cảm và đáng mến trong tâm hồn người [Root.GetSpeciesName]."
 envoy_events.15.A: "Hoàn hảo."
 opinion_feline_affection: "Tình yêu loài mèo"
 envoy_events.17.name: "Tranh cãi giữa các đồng minh"
 envoy_events.17.desc.base: "Việc sửa đổi đạo luật gần đây của [Root.Federation.GetName] đã gây ra sự xôn xao không nhỏ, đưa những tranh cãi ý thức hệ cũ giữa nước ta và [dispute_winner.GetName] trở lại thành tâm điểm. Đại biểu của nước ta, [dispute_loser_envoy.GetName], đã dũng cảm tranh luận về lập trường của phe ta với quan chức hành chính [dispute_winner.GetAdj] [dispute_winner_envoy.GetName]."
 envoy_events.17.desc.end: "Khắp nơi trong [Root.GetGovernmentName], người dân đã theo dõi toàn bộ cuộc tranh luận với sự hứng thú lớn, đồng thời ngày càng lo lắng về việc làm sao dung hòa lý tưởng của bản thân với tư cách thành viên của [Root.Federation.GetName]."
 envoy_events.17.desc.militarist: "$envoy_events.17.desc.base$ Thế nhưng, những hiểu biết của [dispute_loser_envoy.GetSheHe] về lợi ích của chủ nghĩa quân phiệt lại không thể thuyết phục được những người có mặt. Cuộc tranh luận dần trở nên bất lợi cho [dispute_loser_envoy.GetHerHim], [dispute_loser_envoy.GetSheHe] trông ngày càng căng thẳng, còn các bên tham gia thì liên tục chỉ trích [dispute_loser_envoy.GetHerHim] về 'sự hiếu chiến mù quáng của [Root.GetAdj]'.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.pacifist: "$envoy_events.17.desc.base$ Thế nhưng, những hiểu biết của [dispute_loser_envoy.GetSheHe] về lợi ích của chủ nghĩa hòa bình lại không thể thuyết phục được những người có mặt. Các thành viên khác tham dự đã lớn tiếng quát tháo, mắng mỏ 'sự ngây thơ ấu trĩ của [Root.GetAdj]' đang đe dọa đến an ninh của toàn bộ liên bang.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.spiritualist: "$envoy_events.17.desc.base$ Thế nhưng, những hiểu biết của [dispute_loser_envoy.GetSheHe] về lợi ích của chủ nghĩa duy tâm lại không thể thuyết phục được những người có mặt. Những người đứng xem đồng loạt lắc đầu phản đối, cho rằng 'sự mê tín' của [Root.GetAdj] là cực kỳ 'lạc hậu'.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.materialist: "$envoy_events.17.desc.base$ Thế nhưng, những hiểu biết của [dispute_loser_envoy.GetSheHe] về lợi ích của chủ nghĩa duy vật lại không thể thuyết phục được những người có mặt. Tình thế tại hiện trường ngày càng căng thẳng, khi các đồng nghiệp của [dispute_loser_envoy.GetHerHis] liên tục lên án 'chủ nghĩa hưởng lạc' của [Root.GetAdj] và khăng khăng cho rằng những quan niệm mê tín của họ mới là ưu việt.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.xenophile: "$envoy_events.17.desc.base$ Thế nhưng, những hiểu biết của [dispute_loser_envoy.GetSheHe] về lợi ích của chủ nghĩa thân ngoại lại không thể thuyết phục được những người có mặt. Quan điểm của [dispute_loser_envoy.GetHerHis] đã bị thẳng thừng lên án là 'chủ nghĩa tự do nguy hiểm'.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.xenophobe: "$envoy_events.17.desc.base$ Thế nhưng, những hiểu biết của [dispute_loser_envoy.GetSheHe] về lợi ích của chủ nghĩa bài ngoại lại không thể thuyết phục được những người có mặt. Lời tuyên bố trịnh trọng của [dispute_loser_envoy.GetHerHis] về việc chúng ta phải đề phòng những ảnh hưởng từ bên ngoài bị coi là những thành kiến sáo rỗng và trống rỗng.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.egalitarian: "$envoy_events.17.desc.base$ Thế nhưng, những hiểu biết của [dispute_loser_envoy.GetSheHe] về lợi ích của chủ nghĩa bình đẳng lại không thể thuyết phục được những người có mặt. Những kẻ sống trong những xã hội kém tự do hơn chẳng những không nhìn thấy lợi ích của tự do mà lại còn buộc tội chúng ta là 'chủ nghĩa tự do nguy hiểm'.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.authoritarian: "$envoy_events.17.desc.base$ Thế nhưng, những hiểu biết của [dispute_loser_envoy.GetSheHe] về lợi ích của chủ nghĩa độc tài lại không thể thuyết phục được những người có mặt. Những người đứng xem ngày càng cảm thấy việc chúng ta xâm phạm tự do cá nhân là một tội ác.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.A: "Chúng ta sẽ không thỏa hiệp về những giá trị của mình."
 envoy_events.17.B: "Tốt hơn hết là nên giữ im lặng vì sự đoàn kết."
 envoy_events.17.C1: "Triệu hồi [dispute_loser_envoy.GetHerHim] về [Root.GetName] để đào tạo lại."
 envoy_events.17.C2: "Triệu hồi [dispute_loser_envoy.GetHerHim] về [Root.GetName] để lập trình lại."
 envoy_events.17.C3: "Triệu hồi [dispute_loser_envoy.GetHerHim] về [Root.GetName] để sửa chữa."
 envoy_events.18.name: "$envoy_events.17.name$"
 envoy_events.18.desc.base: "Việc sửa đổi đạo luật gần đây của [Root.Federation.GetName] đã gây ra sự xôn xao không nhỏ, đưa những tranh cãi ý thức hệ cũ giữa nước ta và [dispute_loser.GetName] trở lại thành tâm điểm. Đại biểu của nước ta, [dispute_winner_envoy.GetName]"
 envoy_events.18.desc.end: "Thế nhưng, phe [dispute_loser.GetSpeciesNamePlural] lại tỏ ra vô cùng bất mãn với chuyện này, phàn nàn rằng nó đã xâm phạm hệ giá trị của họ và bày tỏ sự lo lắng về hướng đi tương lai của liên bang."
 envoy_events.18.desc.militarist.base: " đã xoay sở thuyết phục được phần đông chấp nhận quan điểm rằng chủ nghĩa quân phiệt mang lại nhiều lợi ích hơn, nhấn mạnh rằng tín ngưỡng của sứ giả [dispute_loser.GetAdj], [dispute_loser_envoy.GetName], về cơ bản là hèn nhát và ngây thơ."
 envoy_events.18.desc.pacifist.base: " đã xoay sở thuyết phục được phần đông chấp nhận quan điểm rằng chủ nghĩa hòa bình mang lại nhiều lợi ích hơn, chỉ ra rằng việc phe [dispute_loser.GetAdj] cùng binh độc vũ đã mang đến mối đe dọa cho tất cả chúng ta."
 envoy_events.18.desc.spiritualist.base: " đã xoay sở thuyết phục được phần đông chấp nhận quan điểm rằng chủ nghĩa duy tâm mang lại nhiều lợi ích hơn, phơi bày cho các bên có mặt thấy được những vấn đề phát sinh do quá đà vào chủ nghĩa duy vật trong xã hội [dispute_loser.GetAdj],"
 envoy_events.18.desc.materialist.base: " đã xoay sở thuyết phục được phần đông chấp nhận quan điểm rằng chủ nghĩa duy vật mang lại nhiều lợi ích hơn, cho thấy rõ sự lạc hậu trong những mê tín duy tâm của phe [dispute_loser.GetAdj]."
 envoy_events.18.desc.xenophile.base: " đã xoay sở thuyết phục được phần đông chấp nhận quan điểm rằng chủ nghĩa thân ngoại mang lại nhiều lợi ích hơn, rằng trong một liên bang thân ngoại, các loài sinh vật sẽ cùng hướng tới nhau, thay vì cứ mãi nghi kỵ lẫn nhau như cách sứ giả [dispute_loser.GetAdj] [dispute_loser_envoy.GetName] hằng mong muốn."
 envoy_events.18.desc.xenophobe.base: " đã xoay sở thuyết phục được phần đông chấp nhận quan điểm rằng chủ nghĩa bài ngoại mang lại nhiều lợi ích hơn, rằng trong một liên bang bài ngoại, mọi nước thành viên đều đặt lợi ích của bản thân lên hàng đầu, chứ không giống như chủ nghĩa duy tâm không tưởng của phe [dispute_loser.GetSpeciesNamePlural]."
 envoy_events.18.desc.egalitarian.base: " đã xoay sở thuyết phục được phần đông chấp nhận quan điểm rằng chủ nghĩa bình đẳng mang lại nhiều lợi ích hơn, rằng dưới ngọn cờ bình đẳng ai cũng như ai, còn cái chủ nghĩa độc tài lay lắt của phe [dispute_loser.GetSpeciesNamePlural] thì vô cùng tà ác, nơi sự an toàn phụ thuộc hoàn toàn vào sắc mặt của những kẻ cầm quyền."
 envoy_events.18.desc.authoritarian.base: " đã xoay sở thuyết phục được phần đông chấp nhận quan điểm rằng chủ nghĩa độc tài mang lại nhiều lợi ích hơn, rằng dưới chế độ độc tài, trật tự và luật pháp luôn được thi hành, và chúng ta có thể tránh xa những nguy cơ do lý tưởng về sự bình đẳng của [dispute_loser.GetAdj] gây ra."
 envoy_events.18.desc.militarist: "$envoy_events.18.desc.base$$envoy_events.18.desc.militarist.base$$envoy_events.18.desc.end$"
 envoy_events.18.desc.pacifist: "$envoy_events.18.desc.base$$envoy_events.18.desc.pacifist.base$$envoy_events.19.desc.end$"
 envoy_events.18.desc.spiritualist: "$envoy_events.18.desc.base$$envoy_events.18.desc.spiritualist.base$$envoy_events.19.desc.end$"
 envoy_events.18.desc.materialist: "$envoy_events.18.desc.base$$envoy_events.18.desc.materialist.base$$envoy_events.19.desc.end$"
 envoy_events.18.desc.xenophile: "$envoy_events.18.desc.base$$envoy_events.18.desc.xenophile.base$$envoy_events.19.desc.end$"
 envoy_events.18.desc.xenophobe: "$envoy_events.18.desc.base$$envoy_events.18.desc.xenophobe.base$$envoy_events.19.desc.end$"
 envoy_events.18.desc.egalitarian: "$envoy_events.18.desc.base$$envoy_events.18.desc.egalitarian.base$$envoy_events.19.desc.end$"
 envoy_events.18.desc.authoritarian: "$envoy_events.18.desc.base$$envoy_events.18.desc.authoritarian.base$$envoy_events.19.desc.end$"
 envoy_events.18.A: "Họ chỉ không chịu nổi sự ưu việt trong con đường của chúng ta mà thôi."
 envoy_events.19.name: "$envoy_events.17.name$"
 envoy_events.19.desc.end: "May mắn thay, phe [dispute_loser.GetSpeciesNamePlural] đối diện với chuyện này bằng sự cởi mở, sẵn sàng thỏa hiệp vì những lợi ích mà một mối quan hệ hài hòa giữa các đối tác đồng minh mang lại."
 envoy_events.19.desc.militarist: "$envoy_events.18.desc.base$$envoy_events.18.desc.militarist.base$$envoy_events.19.desc.end$"
 envoy_events.19.desc.pacifist: "$envoy_events.18.desc.base$$envoy_events.18.desc.pacifist.base$$envoy_events.19.desc.end$"
 envoy_events.19.desc.spiritualist: "$envoy_events.18.desc.base$$envoy_events.18.desc.spiritualist.base$$envoy_events.19.desc.end$"
 envoy_events.19.desc.materialist: "$envoy_events.18.desc.base$$envoy_events.18.desc.materialist.base$$envoy_events.19.desc.end$"
 envoy_events.19.desc.xenophile: "$envoy_events.18.desc.base$$envoy_events.18.desc.xenophile.base$$envoy_events.19.desc.end$"
 envoy_events.19.desc.xenophobe: "$envoy_events.18.desc.base$$envoy_events.18.desc.xenophobe.base$$envoy_events.19.desc.end$"
 envoy_events.19.desc.egalitarian: "$envoy_events.18.desc.base$$envoy_events.18.desc.egalitarian.base$$envoy_events.19.desc.end$"
 envoy_events.19.desc.authoritarian: "$envoy_events.18.desc.base$$envoy_events.18.desc.authoritarian.base$$envoy_events.19.desc.end$"
 envoy_events.19.A: "Chúng ta có thể thuyết phục người khác bằng lời nói."
 opinion_ideological_dispute: "Tranh chấp ý thức hệ"
 federation_militarist_ideology: "Sự lan truyền ý thức hệ liên bang"
 federation_militarist_ideology_desc: "Tư cách thành viên trong liên bang đã khiến cho những giá trị của chủ nghĩa quân phiệt ngày càng trở nên phổ biến trong lãnh thổ của chúng ta."
