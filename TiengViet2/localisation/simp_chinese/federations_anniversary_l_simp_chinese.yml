 federation_no_wars_desc: "$no_wars_desc$"
 federations.10400.title: "Bức thư với lời lẽ gay gắt"
 federations.10400.desc: "Các sứ giả của Cộng đồng Ngân hà đã viết một bài báo với những lời lẽ đanh thép, tuyên bố rằng [Root.GetName] đã vi phạm luật ngân hà và cảnh báo chúng ta về những hậu quả nghiêm trọng có thể xảy ra nếu không tuân thủ.\n\nChúng ta có muốn thay đổi chính sách của mình để đáp ứng yêu cầu này không?"
 federations.10400.comply: "Chúng ta nên đồng thuận với luật ngân hà."
 federations.10400.comply_fail_ethics: "Hệ tư tưởng của chúng ta cho phép ta tuân thủ luật ngân hà."
 federations.10400.comply_fail_civics: "Đặc điểm quốc gia của chúng ta cho phép ta tuân thủ luật ngân hà."
 federations.10400.comply_fail_ascension: "Điểm thăng thiên của chúng ta cho phép ta tuân thủ luật ngân hà."
 federations.10400.comply_fail_tech: "Công nghệ của chúng ta cho phép ta tuân thủ luật ngân hà."
 federations.10400.comply_fail_origin: "Nguồn gốc của chúng ta cho phép ta tuân thủ."
 federations.10400.refuse: "Chúng ta sẽ giữ vững lập trường, quyết không thỏa hiệp."
 federations.10400.refuse_2: "Bác bỏ nó, cũng như mọi phản hồi tương tự trong tương lai."
 federations.10400.refuse_2_tooltip: "Chúng ta sẽ không còn nhìn thấy những yêu cầu tương tự được gửi tới từ Cộng đồng Ngân hà nữa."
 federations.10400.execute: "Xử tử sứ giả."
 federations.10400.eat: "Ăn thịt sứ giả."
 federations.10400.execute_tooltip: "Hành động này sẽ §Rlàm tổn hại§! đến quan hệ với các thành viên khác trong Cộng đồng Ngân hà."
