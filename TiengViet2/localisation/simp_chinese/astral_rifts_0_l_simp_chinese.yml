l_simp_chinese:
 #################
 #Ruined Planet #
 #################
 astral_rift_riftworld: "Hành tinh Tàn lụi"
 riftworld_leader_description: "§Y[Root.GetName]§! đã được đưa về từ phía bên kia của vết nứt cõi sao, tiến vào vùng không gian lân cận hành tinh mẹ của chúng ta, nó đồng thời cũng là một trong số những hành tinh mẹ thời cổ đại của chúng ta ở một chiều không gian song song."
 spirit_of_ancestors_modifier: "Linh hồn Tổ tiên"
 spirit_of_ancestors_modifier_desc: "Cuộc gặp gỡ với những người có nguồn gốc ngoài không gian đã ban cho chúng ta sự thấu hiểu sâu sắc hơn về toàn bộ tiềm năng của chính mình."
 starlight_vanguard_default: "Đội Tiên phong Ánh sao"
 starlight_vanguard_homicidal: "Kẻ Chinh phục Ánh sao"
 astral_rift.1.name: "Hành tinh Tàn lụi"
 astral_rift.1.desc.common.1: "Chuyến hành trình vào vết nứt nằm gần [explorer.capital_scope.GetName] đã đưa chúng ta đến quỹ đạo của một hành tinh đổ nát.\n\nNgay khi tiến vào bầu khí quyển, đập vào mắt chúng ta là một khung cảnh đầy rẫy những hố bom còn đang bốc cháy, rải rác xen kẽ là những chiếc chiến hạm bị vùi lấp một nửa dưới lớp cát vàng. Toàn bộ hành tinh này chính là một bãi chiến trường.\n\nNhững tín hiệu vô tuyến mà chúng ta thu thập được chứa đựng sự điên cuồng và vô cùng nhiễu loạn. Thật khó tin là, "
 astral_rift.1.desc.no_arcsite: "Cư dân địa phương dường như đang giao tiếp bằng một phiên bản cổ đại của ngôn ngữ chúng ta."
 astral_rift.1.desc.with_arcsite: "Ngôn ngữ của cư dân địa phương hoàn toàn trùng khớp với các tài liệu mà chúng ta đã thu thập được từ quả cầu cổ đại nằm sâu dưới lòng đất [explorer.capital_scope.GetName]."
 astral_rift.1.desc.common.2: "Các bản dịch sơ bộ cho thấy những người này đã thất bại trong một cuộc xung đột kéo dài. Kẻ thù của họ, những kẻ được nhắc đến một cách đơn giản trong các đoạn văn bản là “Kẻ Xâm lược”, đang chuẩn bị cho đợt tấn công tiếp theo. Xét đến mức độ tàn phá của hành tinh này, đây có lẽ cũng sẽ là trận chiến cuối cùng."
 astral_rift.1.desc.default: "$astral_rift.1.desc.common.1$$astral_rift.1.desc.no_arcsite$\n\n$astral_rift.1.desc.common.2$"
 astral_rift.1.desc.completed_arcsite: "$astral_rift.1.desc.common.1$$astral_rift.1.desc.with_arcsite$\n\n$astral_rift.1.desc.common.2$"
 astral_rift.1.a: "Hãy tìm xem có người sống sót nào không."
 astral_rift.3.name: "Hai Phe Đối lập"
 astral_rift.3.desc.default: "Có một vài trung tâm dân cư lớn nằm rải rác trên bề mặt hành tinh này. Từ nội dung liên lạc của họ, chúng ta đã nhận diện được hai phe phái có hệ tư tưởng hoàn toàn đối lập nhau.\n\n§Y[GetStarlightVanguardName]§! là những kẻ cuồng tín quân sự, họ đang chuẩn bị để chống lại cuộc chiến sắp tới bằng tinh thần đoàn kết của toàn dân.\n\nCòn §YPhe Màn Đen§! lại là một hệ thống thần quyền, họ hứa hẹn sẽ mang lại sự bình yên cho linh hồn trước mối đe dọa đang cận kề.\n\nGiờ đây, chúng ta có thể khẳng định chắc chắn rằng sự tương đồng đến kinh ngạc này tuyệt đối không phải là một sự trùng hợp ngẫu nhiên. Đây chính là những tổ tiên bằng xương bằng thịt của chúng ta, và bất kể phe phái nào thì hiện tại cũng đều đang ở trong tình thế ngàn cân treo sợi tóc."
 astral_rift.3.desc.hive: "$astral_rift.3.desc.default$\n\nNhững người này có chung ngôn ngữ, chung ngoại hình với chúng ta, nhưng lại sở hữu ý thức độc lập. Sao chuyện này có thể xảy ra được?"
 astral_rift.3.desc.machine: "Đây là một số đơn vị có khả năng tự chủ! Chúng hoàn toàn khác biệt so với ý thức mạng lưới, mỗi cá thể đều có khả năng tính toán và đưa ra quyết định một cách độc lập. Có rất nhiều trung tâm dân cư lớn nằm rải rác trên bề mặt hành tinh này. Dựa trên nội dung liên lạc của họ, chúng ta thậm chí đã nhận diện được hai phe phái có hệ tư tưởng hoàn toàn trái ngược nhau.\n\n§Y[GetStarlightVanguardName]§! là những kẻ cuồng tín quân sự, họ đang chuẩn bị để chống lại cuộc chiến sắp tới bằng tinh thần đoàn kết của toàn dân.\n\nCòn §YPhe Màn Đen§! lại là một hệ thống thần quyền, họ hứa hẹn sẽ mang lại sự bình yên cho linh hồn trước mối đe dọa đang cận kề.\n\nTổ tiên của chúng ta hiện đang ở trong tình thế ngàn cân treo sợi tóc."
 astral_rift.3.a: "Thăm hỏi §Y[GetStarlightVanguardName]§!."
 astral_rift.3.b: "Thăm hỏi §YPhe Màn Đen§!."
 astral_rift.3.b.trigger_tt: "Chúng ta chẳng có hứng thú chơi trò gia đình với những kẻ yếu đuối."
 astral_rift.5.name: "Tổ tiên Đã mất"
 astral_rift.5.militarist_1: "Chúng ta đã bắt đầu cuộc đối thoại với phe cuồng tín quân sự tự xưng là “§Y[GetStarlightVanguardName]§!”."
 astral_rift.5.spiritualist_1: "Chúng ta đã bắt đầu cuộc đối thoại với phe duy tâm tự xưng là “§YPhe Màn Đen§!”."
 astral_rift.5.common_1: "Ngôn ngữ, ngoại hình của chúng ta và sự hiện diện của §Y$tech_rift_sphere$§! đã khiến họ nhanh chóng tin vào mối quan hệ thừa kế giữa hai bên. Trong sự giao tiếp vô cùng khẩn thiết, họ đã truyền đạt cho chúng ta rất nhiều kiến thức về lịch sử.\n\nTừ rất lâu về trước, giống loài của chúng ta đã phải đối mặt với một mối đe dọa đến từ chiều không gian khác. Những kẻ xâm lược này ngay khi xuất hiện đã tiến hành một cuộc đại thanh trừng đẫm máu. Nhân dân ta ban đầu đã chống trả vô cùng kiên cường, nhưng phòng tuyến đã dần dần sụp đổ do bị bào mòn ngày qua ngày.\n\nVào đêm trước khi bị đánh bại hoàn toàn, một vết nứt cõi sao đã xuất hiện."
 astral_rift.5.militarist_2: "Để cố gắng trốn thoát thông qua vết nứt và giữ lại một tia hy vọng sống cho toàn bộ nền văn minh, chiến dịch “Thuyền Cứu sinh” đã được khởi động."
 astral_rift.5.spiritualist_2: "“Cánh cửa Kỳ tích” được coi là cơ hội cuối cùng để trốn thoát và gìn giữ lối sống của họ."
 astral_rift.5.no_arcsite: "Một §Y$tech_rift_sphere$§! đã được chế tạo, nhưng bản thiết kế vội vã của nó chỉ có thể đáp ứng cho một chuyến đi một chiều."
 astral_rift.5.arcsite: "$astral_rift.5.no_arcsite$ Đây cũng chính là cái đã được chôn giấu trong cái hố sâu cổ đại ở [explorer.capital_scope.GetName]."
 astral_rift.5.default: "Một nhóm “người tị nạn” được tuyển chọn kỹ lưỡng đã bắt đầu chuẩn bị cho nhiệm vụ này. Họ chính là tổ tiên của chúng ta."
 astral_rift.5.gestalt: "Để có thể sống sót sau chuyến hành trình này, nhóm người được chọn này đã trải qua quá trình cải tạo sâu rộng. Tổ tiên của chúng ta tin rằng chỉ có một hệ tư tưởng thống nhất mới có hy vọng vượt qua vết nứt một cách an toàn. Đây cũng chính là nguồn gốc thực sự của ý thức chúng ta."
 astral_rift.5.machine: "Để có thể sống sót sau chuyến hành trình này, tổ tiên của chúng ta đã liên kết ý thức của họ lại với nhau và loại bỏ hoàn toàn cảm xúc. Ý thức của chúng ta đã được sinh ra từ chính tầm nhìn rõ ràng và mục tiêu đoàn kết này."
 astral_rift.5.common_2: "Ở bên này của vết nứt, quả cầu đã được phóng lên không trung chỉ vỏn vẹn trong vòng 15 năm. Rất nhiều người ở đây vẫn còn nhớ như in ngày hôm đó như thể nó vừa mới xảy ra hôm qua, trong khi đối với chúng ta, hàng kỷ nguyên đã trôi qua."
 astral_rift.5.desc.militarist.gestalt.no_arcsite: "$astral_rift.5.militarist_1$$astral_rift.5.common_1$\n\n$astral_rift.5.militarist_2$\n\n$astral_rift.5.no_arcsite$\n\n$astral_rift.5.gestalt$\n\n$astral_rift.5.common_2$"
 astral_rift.5.desc.militarist.gestalt.arcsite: "$astral_rift.5.militarist_1$$astral_rift.5.common_1$\n\n$astral_rift.5.militarist_2$\n\n$astral_rift.5.arcsite$\n\n$astral_rift.5.gestalt$\n\n$astral_rift.5.common_2$"
 astral_rift.5.desc.militarist.default.no_arcsite: "$astral_rift.5.militarist_1$$astral_rift.5.common_1$\n\n$astral_rift.5.militarist_2$\n\n$astral_rift.5.no_arcsite$\n\n$astral_rift.5.default$\n\n$astral_rift.5.common_2$"
 astral_rift.5.desc.militarist.default.arcsite: "$astral_rift.5.militarist_1$$astral_rift.5.common_1$\n\n$astral_rift.5.militarist_2$\n\n$astral_rift.5.arcsite$\n\n$astral_rift.5.default$\n\n$astral_rift.5.common_2$"
 astral_rift.5.desc.spiritualist.gestalt.no_arcsite: "$astral_rift.5.spiritualist_1$$astral_rift.5.common_1$\n\n$astral_rift.5.spiritualist_2$\n\n$astral_rift.5.no_arcsite$\n\n$astral_rift.5.gestalt$\n\n$astral_rift.5.common_2$"
 astral_rift.5.desc.spiritualist.gestalt.arcsite: "$astral_rift.5.spiritualist_1$$astral_rift.5.common_1$\n\n$astral_rift.5.spiritualist_2$\n\n$astral_rift.5.arcsite$\n\n$astral_rift.5.gestalt$\n\n$astral_rift.5.common_2$"
 astral_rift.5.desc.spiritualist.default.no_arcsite: "$astral_rift.5.spiritualist_1$$astral_rift.5.common_1$\n\n$astral_rift.5.spiritualist_2$\n\n$astral_rift.5.no_arcsite$\n\n$astral_rift.5.default$\n\n$astral_rift.5.common_2$"
 astral_rift.5.desc.spiritualist.default.arcsite: "$astral_rift.5.spiritualist_1$$astral_rift.5.common_1$\n\n$astral_rift.5.spiritualist_2$\n\n$astral_rift.5.arcsite$\n\n$astral_rift.5.default$\n\n$astral_rift.5.common_2$"
 astral_rift.5.desc.militarist.machine.arcsite: "$astral_rift.5.militarist_1$$astral_rift.5.common_1$\n\n$astral_rift.5.militarist_2$\n\n$astral_rift.5.no_arcsite$\n\n$astral_rift.5.machine$\n\n$astral_rift.5.common_2$"
 astral_rift.5.desc.militarist.machine.no_arcsite: "$astral_rift.5.militarist_1$$astral_rift.5.common_1$\n\n$astral_rift.5.militarist_2$\n\n$astral_rift.5.arcsite$\n\n$astral_rift.5.machine$\n\n$astral_rift.5.common_2$"
 astral_rift.5.desc.spiritualist.machine.no_arcsite: "$astral_rift.5.spiritualist_1$$astral_rift.5.common_1$\n\n$astral_rift.5.spiritualist_2$\n\n$astral_rift.5.no_arcsite$\n\n$astral_rift.5.machine$\n\n$astral_rift.5.common_2$"
 astral_rift.5.desc.spiritualist.machine.arcsite: "$astral_rift.5.spiritualist_1$$astral_rift.5.common_1$\n\n$astral_rift.5.spiritualist_2$\n\n$astral_rift.5.arcsite$\n\n$astral_rift.5.machine$\n\n$astral_rift.5.common_2$"
 astral_rift.5.a: "Dòng chảy thời gian ở đây thật quá đỗi khác biệt..."
 astral_rift.5.b: "Chúng ta là một sản phẩm được thiết kế ra sao?"
 astral_rift.10.name: "[GetStarlightVanguardName]"
 astral_rift.10.militarist: "Chúng ta đã tổ chức một cuộc họp với phe “§Y[GetStarlightVanguardName]§!”, họ đã trình bày một cách thẳng thắn về tình hình nghiêm trọng trong việc chống lại sự xâm lược. Các trận hải chiến với hạm đội Đa chiều đã được phát hiện ở cách đây vài hệ sao, và giờ đây chúng đã ở rất gần. Họ tin rằng việc chúng ta xuất hiện vào đúng thời điểm này tuyệt đối không phải là một sự ngẫu nhiên. Sự xuất hiện của chúng ta chính là sự an bài của định mệnh."
 astral_rift.10.spiritualist: "“§Y[GetStarlightVanguardName]§!” đã đồng ý tiến hành một cuộc họp với chúng ta."
 astral_rift.10.desc.common: "“Sự hiện diện của các bạn đã mang lại nguồn động viên to lớn cho người dân chúng tôi. Sự hỗ trợ kịp thời của các bạn đã mang lại cho chúng tôi hy vọng có thể chấm dứt hoàn toàn cuộc chiến tranh này.” Những hạm đội còn sót lại của họ đã rách nát đến thảm thương, không thể chịu đựng thêm bất kỳ tổn thất nào nữa.\n\nChúng ta có thể chuyển giao một số lượng hạn chế vật tư tiếp tế thông qua dây cáp neo đậu, trong giới hạn mà vết nứt có thể duy trì sự ổn định. Việc cung cấp một lượng hợp kim có thể giải quyết được tình trạng khẩn cấp trong việc sửa chữa và nâng cấp hạm đội. Những hạm đội do họ chế tạo có sự tiên tiến vượt bậc, và thông qua quá trình này chúng ta cũng có thể học hỏi thêm được những thiết kế liên quan.\n\nDo thời gian không có nhiều, một lựa chọn khôn ngoan hơn là vận dụng sự hiểu biết sâu sắc của chúng ta về sợi cõi sao để củng cố lớp khiên chắn cho hạm đội của họ. Mặc dù đây chỉ là một thử nghiệm mang tính đột phá, nhưng những thành công đạt được tại đây cũng có thể mang lại những lợi ích to lớn cho chính hạm đội của chúng ta. Theo như những gì chúng ta biết, những kẻ xâm lược này có xu hướng sử dụng vũ khí năng lượng, vì vậy bất kỳ cải tiến nào ở đây cũng sẽ là một sự hỗ trợ vô cùng đắc lực."
 astral_rift.10.desc.militarist: "$astral_rift.10.militarist$\n\n$astral_rift.10.desc.common$"
 astral_rift.10.desc.spiritualist: "$astral_rift.10.spiritualist$\n\n$astral_rift.10.desc.common$"
 astral_rift.10.a: "Cung cấp hợp kim."
 astral_rift.10.b: "Cung cấp sợi cõi sao."
 astral_rift.10.c: "Cuộc chiến này nắm chắc phần thua. Chúng ta hãy đi thảo luận với những người bảo thủ xem sao."
 astral_rift.10.d: "Thế này chẳng khác nào lấy trứng chọi đá. Tốt nhất là chúng ta nên quay trở về với thế giới mới của mình."
 astral_rift.15.name: "Phe Màn Đen"
 astral_rift.15.militarist: "“§YPhe Màn Đen§!” đã đồng ý tiến hành một cuộc họp với chúng ta."
 astral_rift.15.spiritualist: "Chúng ta đã có một cuộc gặp gỡ đặc biệt với “§YPhe Màn Đen§!”. Họ đã để lại cho chúng ta một ấn tượng sâu sắc về bản chất tàn bạo của những kẻ xâm lược. Khi hạm đội đa chiều bị phát hiện, thì chúng cũng đã trên đường tiến đến đây rồi. Đối với Phe Màn Đen, việc chúng ta xuất hiện vào đúng thời điểm này chính là sự an bài của định mệnh."
 astral_rift.15.desc.common: "“Sự hiện diện của các bạn tựa như một phép màu. Chúng tôi đã từng cam chịu chấp nhận số phận trong cuộc chiến tranh tuyệt vọng này. Người dân của chúng tôi đang phải chịu cảnh đói khát, lầm than. Hỡi Những Đứa Trẻ Phía Sau Cánh Cửa... Xin hãy ban phát sự nhân từ cho chúng tôi trong những giây phút cuối cùng này.”\n\nTình thế khốn cùng đã quá rõ ràng, còn tương lai thì lại mịt mờ tăm tối. Điều duy nhất chúng ta có thể làm là cung cấp lương thực cho người dân của họ: chúng ta có thể chuyển giao một số lượng hạn chế vật tư tiếp tế thông qua dây cáp neo đậu, và công nghệ nông nghiệp tiên tiến của chúng ta chắc chắn sẽ phát huy tác dụng to lớn.\n\nThậm chí, chúng ta còn có cơ hội bơm §HSợi Cõi sao§! vào tàu vũ trụ của họ để có thể đưa một số người của họ rời đi một cách an toàn. Xác suất thành công không cao, nhưng nếu thành công, ít nhất nó cũng có thể vực dậy tinh thần của họ."
 astral_rift.15.desc.lithoid: "“Sự hiện diện của các bạn tựa như một phép màu. Chúng tôi đã từng cam chịu chấp nhận số phận trong cuộc chiến tranh tuyệt vọng này. Người dân của chúng tôi đang phải chịu cảnh đói khát, lầm than. Hỡi Những Đứa Trẻ Phía Sau Cánh Cửa... Xin hãy ban phát sự nhân từ cho chúng tôi trong những giây phút cuối cùng này.”\n\nTình thế khốn cùng đã quá rõ ràng, còn tương lai thì lại mịt mờ tăm tối. Điều duy nhất chúng ta có thể làm là cung cấp lương thực cho người dân của họ: chúng ta có thể chuyển giao một số lượng hạn chế vật tư tiếp tế thông qua dây cáp neo đậu, và công nghệ khai khoáng tiên tiến của chúng ta chắc chắn sẽ phát huy tác dụng to lớn.\n\nThậm chí, chúng ta còn có cơ hội bơm §HSợi Cõi sao§! vào tàu vũ trụ của họ để có thể đưa một số người của họ rời đi một cách an toàn. Xác suất thành công không cao, nhưng nếu thành công, ít nhất nó cũng có thể vực dậy tinh thần của họ."
 astral_rift.15.desc.synthetic: "“Sự hiện diện của các bạn tựa như một phép màu. Chúng tôi đã từng cam chịu chấp nhận số phận trong cuộc chiến tranh tuyệt vọng này. Người dân của chúng tôi đã cạn kiệt năng lượng, lầm than. Hỡi Những Đứa Trẻ Phía Sau Cánh Cửa... Xin hãy ban phát sự nhân từ cho chúng tôi trong những giây phút cuối cùng này.”\n\nTình thế khốn cùng đã quá rõ ràng, còn tương lai thì lại mịt mờ tăm tối. Điều duy nhất chúng ta có thể làm là sử dụng năng lượng để cung cấp lương thực cho người dân của họ: chúng ta có thể chuyển giao một số lượng hạn chế vật tư tiếp tế thông qua dây cáp neo đậu, và công nghệ năng lượng tiên tiến của chúng ta chắc chắn sẽ phát huy tác dụng to lớn.\n\nThậm chí, chúng ta còn có cơ hội bơm §HSợi Cõi sao§! vào tàu vũ trụ của họ để có thể đưa một số người của họ rời đi một cách an toàn. Xác suất thành công không cao, nhưng nếu thành công, ít nhất nó cũng có thể vực dậy tinh thần của họ."
 astral_rift.15.desc.militarist: "$astral_rift.15.militarist$\n\n$astral_rift.15.desc.common$"
 astral_rift.15.desc.militarist.lithoid: "$astral_rift.15.militarist$\n\n$astral_rift.15.desc.common.lithoid$"
 astral_rift.15.desc.militarist.synthetic: "$astral_rift.15.militarist$\n\n$astral_rift.15.desc.common.synthetic$"
 astral_rift.15.desc.spiritualist: "$astral_rift.15.spiritualist$\n\n$astral_rift.15.desc.common$"
 astral_rift.15.desc.spiritualist.lithoid: "$astral_rift.15.spiritualist$\n\n$astral_rift.15.desc.common.lithoid$"
 astral_rift.15.desc.spiritualist.synthetic: "$astral_rift.15.spiritualist$\n\n$astral_rift.15.desc.common.synthetic$"
 astral_rift.15.a: "Cung cấp lương thực."
 astral_rift.15.a.lithoid: "Cung cấp khoáng sản."
 astral_rift.15.a.synthetic: "Cung cấp năng lượng."
 astral_rift.15.b: "Cung cấp sợi cõi sao."
 astral_rift.15.c: "Những nỗ lực này đều là phí công vô ích. Chúng ta hãy đi hỏi những người theo chủ nghĩa quân sự xem sao."
 astral_rift.15.d: "Thế này chẳng khác nào lấy trứng chọi đá. Tốt nhất là chúng ta nên quay trở về với thế giới mới của mình."
 astral_rift.16.name: "Ruồng bỏ Tổ tiên"
 astral_rift.16.desc.default: "Cuối cùng, chúng ta đành phải ngậm ngùi thừa nhận rằng, tình cảnh của tổ tiên đã vô phương cứu chữa.\n\nBất cứ điều gì chúng ta làm vào lúc này cũng không thể vãn hồi được nữa. Quyết định của họ khi đưa chúng ta đến không gian này thông qua vết nứt là hoàn toàn chính xác.\n\nChúng ta sẽ kế thừa ý chí của họ và tiếp tục sống tốt, trở thành một nền văn minh đủ vĩ đại để khiến họ cảm thấy tự hào."
 astral_rift.16.desc.homicidal: "Chúng ta nhận thấy rằng, tổ tiên của chúng ta không đáng để chúng ta phải ra tay cứu rỗi.\n\nQuyết định của họ khi đưa những hậu duệ ưu tú nhất là chúng ta đến không gian này thông qua vết nứt là hoàn toàn chính xác. Chúng ta sẽ thay họ tiếp tục sống tốt.\n\nGiờ đây, họ phải tự mình đối mặt với số phận cuối cùng của mình."
 astral_rift.20.name: "Hội đồng Hành tinh"
 astral_rift.20.common_1: "Hành tinh mẹ của tổ tiên chúng ta đang phải đối mặt với một cuộc xâm lược sắp xảy ra."
 astral_rift.20.militarist: "Sau cuộc hội đàm với “§Y[GetStarlightVanguardName]§!”, chúng ta đã được mời tham dự một phiên họp khẩn cấp do Hội đồng Hành tinh tổ chức. Họ đã nhấn mạnh sự giúp đỡ mà chúng ta đã mang lại cho đến nay, và ca ngợi sự hào phóng của chúng ta."
 astral_rift.20.spiritualist: "Sau cuộc hội đàm với “§YPhe Màn Đen§!”, chúng ta đã được mời tham dự một phiên họp khẩn cấp do Hội đồng Hành tinh tổ chức. Họ đã nhấn mạnh sự giúp đỡ mà chúng ta đã mang lại cho đến nay, và ca ngợi sự hào phóng của chúng ta."
 astral_rift.20.common_2: "Trước khi trận chiến cuối cùng nổ ra, chúng ta không còn nhiều thời gian để hành động nữa.\n\nKho dự trữ năng lượng đã cạn kiệt đến mức báo động. Việc quyên góp một lượng Năng lượng sẽ giúp thúc đẩy quá trình sản xuất tàu cứu trợ khẩn cấp, đưa cục diện trận chiến chuyển biến theo chiều hướng có lợi."
 astral_rift.20.poor: "Nhiều nhà khoa học của họ còn yêu cầu chúng ta cung cấp các mẫu Sợi Cõi sao để tiếp tục nghiên cứu nhằm tăng cường lớp khiên chắn cho hạm đội của họ. Bởi vì những kẻ xâm lược này có xu hướng sử dụng vũ khí năng lượng, nên lợi ích mang lại là điều hiển nhiên."
 astral_rift.20.rich: "Nhiều nhà khoa học của họ còn yêu cầu chúng ta cung cấp thêm nhiều mẫu Sợi Cõi sao hơn để tiếp tục nghiên cứu nhằm tăng cường lớp khiên chắn cho hạm đội của họ. Bởi vì những kẻ xâm lược này có xu hướng sử dụng vũ khí năng lượng, nên lợi ích mang lại là điều hiển nhiên."
 astral_rift.20.gestalt: "Nhìn cách tổ tiên của chúng ta thể hiện trên bàn đàm phán —— cái kiểu bày tỏ quan điểm cá nhân một cách hỗn loạn đó —— quả thực là một cực hình. May mắn là những thứ kém hiệu quả này đã bị loại bỏ khỏi hệ thống của chúng ta từ rất lâu rồi."
