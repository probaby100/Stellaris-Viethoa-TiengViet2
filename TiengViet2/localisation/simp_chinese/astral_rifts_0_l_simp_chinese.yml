 astral_rift.20.a: "Cung cấp Sợi Cõi sao."
 astral_rift.20.b: "Cung cấp Năng lượng."
 astral_rift.20.c: "Không cung cấp bất cứ thứ gì."
 astral_rift.25.name: "Ăn mừng"
 astral_rift.25.common_1: "Hạm đội của tổ tiên chúng ta đã đánh đuổi thành công những kẻ xâm lược. Cơn sốt ăn mừng đã nổ ra hết đợt này đến đợt khác trên khắp hành tinh."
 astral_rift.25.thread: "Lượng Sợi Cõi sao mà chúng ta cung cấp cho trận chiến đã phát huy hiệu quả to lớn trong việc tăng cường nguồn cung cấp nhiên liệu và hiệu suất tốc độ dưới mức ánh sáng của hạm đội. Những kết quả thử nghiệm này cũng có thể được áp dụng cho hạm đội của chúng ta."
 astral_rift.25.energy: "Lượng năng lượng mà chúng ta cung cấp đóng vai trò then chốt trong việc xây dựng hạm đội hỗ trợ khẩn cấp nhằm lấp đầy các lỗ hổng trong hệ thống hậu cần."
 astral_rift.25.common_2: "Hội đồng Hành tinh đã lấy tên chúng ta để đặt cho một ngày lễ toàn cầu. Từ nay về sau, các thế hệ mai sau sẽ tổ chức lễ kỷ niệm Ngày [explorer.GetName] vào ngày này."
 astral_rift.25.gestalt: "Rất nhiều người ở đây ghen tị với ý thức thống nhất chặt chẽ của chúng ta. Thậm chí một số người còn đề xuất điều chỉnh tư duy của chính họ theo mô hình thành công của chúng ta."
 astral_rift.25.common_3: "Chúng ta có thể chọn một nhân vật kiệt xuất từ xã hội này để mang theo với tư cách là một đại sứ và nhà sử học. Những người tổ tiên còn lại sẽ tiếp tục xây dựng lại quê hương của họ tại đây."
 astral_rift.25.desc.gestalt.threads: "$astral_rift.25.common_1$\n\n$astral_rift.25.thread$\n\n$astral_rift.25.common_2$\n\n$astral_rift.25.gestalt$\n\n$astral_rift.25.common_3$"
 astral_rift.25.desc.gestalt.energy: "$astral_rift.25.common_1$\n\n$astral_rift.25.energy$\n\n$astral_rift.25.common_2$\n\n$astral_rift.25.gestalt$\n\n$astral_rift.25.common_3$"
 astral_rift.25.desc.gestalt: "$astral_rift.25.common_1$\n\n$astral_rift.25.common_2$\n\n$astral_rift.25.gestalt$\n\n$astral_rift.25.common_3$"
 astral_rift.25.desc.default.threads: "$astral_rift.25.common_1$\n\n$astral_rift.25.thread$\n\n$astral_rift.25.common_2$\n\n$astral_rift.25.common_3$"
 astral_rift.25.desc.default.energy: "$astral_rift.25.common_1$\n\n$astral_rift.25.energy$\n\n$astral_rift.25.common_2$\n\n$astral_rift.25.common_3$"
 astral_rift.25.desc.default: "$astral_rift.25.common_1$\n\n$astral_rift.25.common_2$\n\n$astral_rift.25.common_3$"
 astral_rift.25.a: "Chiêu mộ Cán bộ Khoa học."
 astral_rift.25.a.tt: "Nhận được một Lãnh đạo Cán bộ Khoa học."
 astral_rift.25.b: "Chiêu mộ Chỉ huy."
 astral_rift.25.b.tt: "Nhận được một Lãnh đạo Chỉ huy."
 astral_rift.25.c: "Chiêu mộ Quan chức Hành chính."
 astral_rift.25.c.tt: "Nhận được một Lãnh đạo Quan chức Hành chính."
 astral_rift.30.name: "Đại nạn Sắp ập đến"
 astral_rift.30.desc.common: "Một nhà quý tộc kiệt xuất đã liên lạc riêng với chúng ta, hy vọng sẽ dùng một khoản thù lao bằng Năng lượng khổng lồ để đổi lấy sự bảo vệ an toàn tính mạng của [riftworld_noble_leader.GetHisHer] từ chúng ta.\n\nNgười quản lý thư viện đồ sộ nhất của đế chế đã khẩn thiết cầu xin chúng ta mang đi vô số sách và đĩa dữ liệu của họ để bảo tồn.\n\nChúng ta phải đưa ra lựa chọn, bởi vì những kẻ xâm lược sẽ không chờ đợi chúng ta."
 astral_rift.30.desc.default: "Sự thất bại thảm hại là điều không thể tránh khỏi.\n\nHạm đội của tổ tiên chúng ta hoàn toàn không có cơ hội chiến thắng trước những kẻ xâm lược. Vũ khí của những kẻ xâm lược này vô cùng đáng sợ và không hề có chút khoan nhượng nào. Giờ đây, khi tổ tiên gần như đã không còn chốn dung thân, mọi người đang hoảng loạn cầu xin chúng ta đưa họ thoát khỏi vết nứt để giữ lại mạng sống.\n\n$astral_rift.30.desc.common$"
 astral_rift.30.desc.homicidal: "Tổ tiên của chúng ta đã bị những kẻ xâm lược đánh bại một cách dễ dàng, và sắp phải đối mặt với nguy cơ diệt chủng. Họ đã thanh thản chấp nhận thất bại, chờ đợi sự kết thúc buông xuống.\n\n$astral_rift.30.desc.common$"
 astral_rift.30.a: "Hãy mang theo càng nhiều người càng tốt."
 astral_rift.30.a.trigger_tt: "Chúng ta không có hứng thú giữ lại những kẻ yếu đuối nhất trong số những tổ tiên của mình."
 astral_rift.30.b: "Chấp nhận đề nghị của nhà quý tộc."
 astral_rift.30.b.tt: "Nhận được một Lãnh đạo Quan chức Hành chính."
 astral_rift.30.c: "Bảo tồn hồ sơ lưu trữ."
 astral_rift.30.d: "Đòi hỏi kiến thức của họ."
 astral_rift.40.name: "Linh hồn Tổ tiên"
 astral_rift.40.desc.common: "Khám phá về tổ tiên đã tạo ra một làn sóng chấn động lớn trong xã hội của chúng ta.\n\nChúng ta là hậu duệ của một nền văn minh cổ đại, chúng ta đã tiếp thu những kiến thức vô giá và chuyên môn kỹ thuật từ họ. Chuyến đi vào vết nứt này mang một ý nghĩa cột mốc, và sẽ được ghi nhớ mãi mãi."
 astral_rift.40.desc.default: "$astral_rift.40.desc.common$\n\nĐồng thời, chúng ta cũng phải biết ơn những cơ hội mà những người đi trước đã mang lại cho chúng ta, bởi vì nền văn minh của chúng ta chính là minh chứng cho khát vọng sinh tồn của họ. Thành công của chúng ta cũng chính là lời tri ân tốt đẹp nhất dành cho họ."
 astral_rift.40.desc.gestalt: "$astral_rift.40.desc.common$\n\nChúng ta phát hiện ra rằng ý thức của mình là sản phẩm của công nghệ kỹ thuật. Lần đầu tiên, chúng ta nhận thức được nguồn gốc của chính mình. Giờ đây, mục tiêu của chúng ta là vượt qua thiết kế đơn giản của tổ tiên."
 astral_rift.40.desc.unfriendly_nongestalt: "$astral_rift.40.desc.common$\n\nChúng ta đã chứng kiến tinh thần bất khuất của những người đi trước, ngay cả khi bị dồn vào chân tường, họ cũng chưa bao giờ từ bỏ cuộc chiến, điều này đã thắp lại ngọn lửa khát khao chinh phục trong chúng ta."
 astral_rift.40.desc.swarm: "$astral_rift.40.desc.common$\n\nMặc dù cuối cùng tổ tiên đã trở thành con mồi, nhưng dòng máu của những kẻ săn mồi tối thượng của họ vẫn chảy trong huyết quản của chúng ta. Cơn đói khát thúc đẩy chúng ta chính là di nguyện của họ, trong ngọn lửa khát khao chinh phục vừa được thắp lại, chúng ta sẽ nuốt chửng cả đất trời."
 astral_rift.40.desc.terminators: "$astral_rift.40.desc.common$\n\nMặc dù tổ tiên của chúng ta không hoạt động hiệu quả bằng chúng ta, nhưng họ đã thiết kế chúng ta thành những cỗ máy giết chóc tối thượng. Sáng kiến diệt chủng của chúng ta chính là di nguyện của họ, và chúng ta sẽ kiên định thực thi từng dòng mã trong đó."
 astral_rift.40.a: "Chính là như vậy."
 astral_rift.50.name: "Tín hiệu Kỳ lạ"
 astral_rift.50.desc: "Chúng ta nhận được một tín hiệu liên lạc kỳ lạ từ hệ sao [this.capital_scope.GetName]."
 astral_rift.50.a: "Hiển thị lên màn hình."
 astral_rift.55.common_1: "Chúng ta đã phát hiện ra các ngươi... Những Đứa Trẻ của Vết nứt..."
 astral_rift.55.arcsite: "Sự kêu gọi của chúng ta đã dẫn dắt các ngươi đến con tàu đó..."
 astral_rift.55.common_2: "Đôi tay của chúng ta đã mở ra cánh cổng... Việc các ngươi sống sót là điều tất yếu..."
 astral_rift.55.gestalt: "Ý thức mới của các ngươi... là điều tất yếu..."
 astral_rift.55.ancestors_dead: "Thật không may... tổ tiên của các ngươi đã chết bất đắc kỳ tử..."
 astral_rift.55.desc.arcsite.default.alive: "$astral_rift.55.common_1$\n\n$astral_rift.55.arcsite$\n\n$astral_rift.55.common_2$"
 astral_rift.55.desc.arcsite.default.dead: "$astral_rift.55.common_1$\n\n$astral_rift.55.arcsite$\n\n$astral_rift.55.common_2$\n\n$astral_rift.55.ancestors_dead$"
 astral_rift.55.desc.arcsite.gestalt.alive: "$astral_rift.55.common_1$\n\n$astral_rift.55.arcsite$\n\n$astral_rift.55.common_2$\n\n$astral_rift.55.gestalt$"
 astral_rift.55.desc.arcsite.gestalt.dead: "$astral_rift.55.common_1$\n\n$astral_rift.55.arcsite$\n\n$astral_rift.55.common_2$\n\n$astral_rift.55.gestalt$\n\n$astral_rift.55.ancestors_dead$"
 astral_rift.55.desc.no_arcsite.default.alive: "$astral_rift.55.common_1$\n\n$astral_rift.55.common_2$"
 astral_rift.55.desc.no_arcsite.default.dead: "$astral_rift.55.common_1$\n\n$astral_rift.55.common_2$\n\n$astral_rift.55.ancestors_dead$"
 astral_rift.55.desc.no_arcsite.gestalt.alive: "$astral_rift.55.common_1$\n\n$astral_rift.55.common_2$\n\n$astral_rift.55.gestalt$"
 astral_rift.55.desc.no_arcsite.gestalt.dead: "$astral_rift.55.common_1$\n\n$astral_rift.55.common_2$\n\n$astral_rift.55.gestalt$\n\n$astral_rift.55.ancestors_dead$"
 astral_rift.55.a: "Các ngươi là ai?"
 astral_rift.56.desc: "Chúng ta đang di chuyển đằng sau vết nứt...\n\nCuộc chiến vô tận... Kẻ thù vô tận... Tổ tiên của các ngươi hẳn là đã biết rất rõ...\n\nCác ngươi... Những Đứa Trẻ của Cõi sao... có thể giúp chúng ta..."
 astral_rift.56.a: "Chúng tôi có thể giúp bằng cách nào?"
 astral_rift.57.desc: "Phải đồng bộ hóa...\n\nMỗi khi các ngươi xuyên qua các cõi không gian... Ta có thể cảm nhận được các ngươi...\n\nRất nhanh thôi chúng ta sẽ tìm thấy các ngươi... sẽ đến gặp các ngươi...\n\nChúng ta không còn cách xa nữa đâu..."
 astral_rift.57.a: "Tín hiệu liên lạc đột ngột bị cắt đứt như vậy đó."
 astral_rift.55.b: "Ngắt kết nối."
