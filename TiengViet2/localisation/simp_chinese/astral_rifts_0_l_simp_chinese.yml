 #################
 #The Corridors #
 #################
 procedural_space_modifier: "Không gian Lập trình"
 astral_rift_corridors: "Hành lang Bất tận"
 astral_rift.100.name: "Hành lang"
 astral_rift.100.desc: "Chúng ta phát hiện ra mình đang mắc kẹt trong một mạng lưới các khoang chứa liên thông với nhau, không thấy điểm đầu cũng chẳng thấy điểm cuối.\n\nSàn nhà ở đây là những bảng mạch sáng bóng và trong suốt. Có thể nhìn thấy rõ các dòng năng lượng đang chảy dọc theo mạng lưới phân nhánh của các dây dẫn.\n\nHành lang bất tận này dường như lặp đi lặp lại một cách vô tận, không hề có chút thay đổi nào. Việc khám phá hiện tại đang bế tắc, chúng ta nên cân nhắc tìm một hướng đi khác."
 astral_rift.100.a: "Phá vỡ sàn nhà."
 astral_rift.100.b: "Khoét thủng bức tường."
 astral_rift.105.name: "Thứ “Kính” Bất khả thi"
 astral_rift.105.desc: "Chúng ta không thể xuyên thủng lớp sàn nhà. Cấu trúc của nó hoàn toàn khác biệt so với bất kỳ loại vật liệu trong suốt nào mà chúng ta từng biết. Bạo lực không thể làm nó biến dạng, thậm chí còn không để lại một vết xước nào trên bề mặt.\n\nTuy nhiên, sau một hồi nỗ lực, chúng ta đã thành công đục được một lỗ nhỏ trên một trong các đường ống bằng mũi khoan plasma. Mạch dẫn điện là một hỗn hợp sợi cõi sao đan xen dày đặc, được cô đặc ở mức độ cao.\n\nCũng giống như sự thú vị của phát hiện này, có lẽ chúng ta không thể mở ra một lối đi trên sàn nhà bằng cách này. Chúng ta đành phải quay lại với phương pháp khám phá thông thường."
 astral_rift.110.name: "Tái tạo"
 astral_rift.110.desc: "Mặc dù việc phá hủy các bức tường không quá khó khăn, nhưng sự phá hủy này chỉ mang tính tạm thời.\n\nBất kể lượng vật liệu bị lấy đi khỏi bức tường là bao nhiêu, mạng lưới tinh thể cấu thành từ vật liệu xây dựng cơ bản sẽ nhanh chóng tự đan kết, xếp chồng lên nhau, tạo thành một cấu trúc gần giống như thiết kế nguyên bản. Chúng ta có thể nhìn thấy các đường dẫn năng lượng bên dưới truyền năng lượng đến những vị trí bị chúng ta phá hủy.\n\nCũng giống như sự thú vị của phát hiện này, có lẽ chúng ta không thể mở ra một lối đi trên bức tường bằng cách này. Chúng ta đành phải quay lại với phương pháp khám phá thông thường."
 astral_rift.115.name: "Trạm cốt lõi"
 astral_rift.115.desc.common.1: "Cuối cùng chúng ta cũng tìm thấy một chút thay đổi trong môi trường: một khoang chứa khổng lồ, bên trong là một trạm cốt lõi đang điều khiển các màn hình bao phủ khắp khoang chứa.\n\nMột trong những màn hình hiển thị bản đồ của các hành lang xung quanh."
 astral_rift.115.desc.common.2: "Nếu chúng ta có thể làm rõ chức năng của bảng điều khiển này, chúng ta sẽ có thể cải thiện đáng kể sự hiểu biết của mình về nơi đây. Tuy nhiên, hiện tại chúng ta không biết mã code của nó có ẩn chứa bất kỳ biện pháp an ninh nào hay không."
 astral_rift.115.desc.walls: "$astral_rift.115.desc.common.1$\n\nSổ ghi chép sự cố đã ghi lại vị trí chúng ta dỡ bỏ bức tường gần đây, bao gồm cả đoạn phim giám sát tại thời điểm đó.\n\n$astral_rift.115.desc.common.2$"
 astral_rift.115.desc.glass: "$astral_rift.115.desc.common.1$\n\nSổ ghi chép sự cố đã ghi lại vị trí chúng ta khoan thủng sàn nhà gần đây, bao gồm cả đoạn phim giám sát tại thời điểm đó.\n\n$astral_rift.115.desc.common.2$"
 astral_rift.115.a: "Hack nó."
 astral_rift.115.b: "Tháo dỡ nó."
 astral_rift.120.name: "Chôn vùi Sống"
 astral_rift.120.desc: "Trong quá trình hack trạm điều khiển, một biện pháp phòng vệ khi lỗi đã được kích hoạt, khiến cho căn phòng này nhanh chóng bị ngập trong một chất xốp giãn nở. Trước khi bất kỳ ai kịp phản ứng để cứu [Leader.GetName], [Leader.GetHeShe] đã bị bao trọn hoàn toàn bởi chất này. Việc nỗ lực giải cứu [Leader.GetHimHer] cũng trở nên vô vọng, do vật liệu này có khả năng tự động phục hồi ngay lập tức sau khi bị cắt bỏ.\n\nChúng ta đã kéo dây neo khẩn cấp theo đúng quy trình tiêu chuẩn, thu hồi lại §Y$tech_rift_sphere$§! cùng với những mẫu vật đã thu thập được."
 astral_rift.125.name: "Công thức"
 astral_rift.125.desc: "[Leader.GetName] đã có thể dịch ngược các đoạn mã này. Ngôn ngữ lập trình được sử dụng ở đây cực kỳ tiên tiến, với các thuật toán vừa tinh tế vừa súc tích.\n\nToàn bộ công trình này đều được tạo ra bởi một chương trình.\n\nMặc dù chúng ta chưa thể giải mã hoàn toàn các mẫu hình của nó, nhưng không còn nghi ngờ gì nữa, môi trường ở đây tuân thủ theo một quy luật nhất định. Chúng ta đã lấy được một số mẫu vật liệu xây dựng, chúng có đặc tính tự sao chép. Dù cần phải tiến hành thêm các thử nghiệm, nhưng chúng ta phỏng đoán rằng việc đặt loại vật liệu này ở bất kỳ vị trí nào và thiết lập đúng cách sẽ có thể tái tạo lại một hệ thống hoàn toàn mới tương tự như hành lang này."
 astral_rift.125.a: "Thật là một loại vật liệu kỳ diệu."
 astral_rift.130.name: "Máy tính Cõi sao"
 astral_rift.130.desc: "Chúng ta đã tháo tung trạm máy tính này ra thành từng mảnh.\n\nBên trong các vi mạch của nó chứa một lượng lớn các sợi cõi sao.\n\nVì vậy, chúng ta không còn quan tâm đến việc cỗ máy này ban đầu được dùng để làm gì nữa."
 astral_rift.130.a: "Tuyệt vời."
 astral_rift.140.name: "[GetScientistCapital] Quay về"
 astral_rift.140.desc: "[Root.GetLeaderName] bất ngờ quay trở về từ Vết nứt Cõi sao.\n\n[Root.Leader.GetHeSheCap]... đã trải qua một số thay đổi. [Root.Leader.GetHisHer] dường như đã bị mắc kẹt giữa dòng thời gian này và một dòng thời gian khác, khiến cho tuổi tác của ông ấy trở nên không thể xác định.\n\nĐáng kinh ngạc là, [Root.Leader.GetHeShe] dường như cũng đã đạt được một số tài năng về nghiên cứu tính toán."
 ########################
 #Dimensional Conflict #
 ########################
 astral_rift_ancient_battlegrounds: "Xung đột Đa chiều"
 astral_rift.200.name: "Trận chiến Cổ đại"
 astral_rift.200.desc: "Bên trong vết nứt này chứa đựng tàn dư của một trận chiến sử thi.\n\nNhững gì còn sót lại chỉ là vô số tàn tích của các chiến hạm cùng với những xác chết của một loài sinh vật khổng lồ, lớn hơn gấp mười lần so với chiến hạm lớn nhất của chúng ta.\n\nTương phản hoàn toàn với những chiến hạm rách nát kia, những cái xác này được bảo quản trong tình trạng cực kỳ tốt. Không rõ những chiến hạm này đã sử dụng loại vũ khí gì, nhưng dường như chúng không gây ra nhiều sát thương. Chúng ta vẫn chưa xác định được nguyên nhân cái chết của những sinh vật này, nhưng có vẻ như không phải là do trận chiến.\n\nLoài dã thú này chắc chắn phải sở hữu một sức chịu đựng phi thường. Việc phân tích cấu trúc phân tử của nó sẽ giúp chúng ta gia cố thêm phần vỏ tàu cho hạm đội của mình. Mặt khác, chúng ta cũng có thể thử nghiên cứu bên trong cơ thể nó, có lẽ sẽ tìm ra được cách loài sinh vật này đã chết, cũng như những gì đã thực sự xảy ra ở đây."
 astral_rift.200.a: "Nghiên cứu cấu trúc"
 astral_rift.200.b: "Tìm hiểu sâu hơn."
 astral_rift.205.name: "Lá chắn Ngoại hành tinh"
 astral_rift.205.desc: "Thành phần vật liệu cấu thành nên lớp vỏ bọc của con quái thú này đã vượt xa khỏi dự đoán của chúng ta.\n\nLớp vảy của nó có cấu trúc lưới tinh thể hữu cơ kim loại đan xen phức tạp, giúp nó có khả năng chống lại các tác động động học. Đây quả thực là một kiệt tác của tạo hóa.\n\nSự hiểu biết về nguyên lý đằng sau nó đã thúc đẩy các kỹ sư của chúng ta phải suy nghĩ lại về cách thức chế tạo vỏ tàu vũ trụ.\n\nNếu chạm trán trên chiến trường, đây chắc chắn sẽ là một đối thủ vô cùng đáng gờm."
 astral_rift.205.a: "$FASCINATING$"
 astral_rift.210.name: "Thực thể Không xác định"
 astral_rift.210.desc: "Chúng ta đã tiến vào bên trong cái xác đang trôi dạt đó.\n\nDo không thể xuyên qua lớp giáp đáng kinh ngạc của sinh vật này, chúng ta đã phải dùng đến một lượng lớn chất nổ để cạy miệng nó ra. Một nhóm nhỏ đã tiến vào bên trong con quái thú qua đường miệng để khám phá cấu trúc nội tạng và thu thập các mẫu mô.\n\nCấu tạo bên trong của nó thật đáng kinh ngạc. Vô số hàng răng sắc nhọn cho thấy đây là một loài sinh vật săn mồi. Một hệ tiêu hóa cực kỳ hiệu quả chiếm phần lớn không gian trong cơ thể nó, và chứng tỏ rằng loài sinh vật này sinh ra để tiêu hóa mọi loại vật chất.\n\nChúng ta cũng có thể ước tính thời gian và nguyên nhân cái chết của nó thông qua điều này: mặc dù có chế độ ăn tạp, nhưng rõ ràng nó đã bị mất nước. Điều này cũng chỉ ra rằng nó có thể không đến từ chiều không gian này, và nó không thể tìm thấy bất kỳ vật chất nào có thể uống được ở đây.\n\nDựa trên phương pháp xác định niên đại bằng đồng vị, cơ thể của nó đã chết cách đây hơn năm mươi nghìn năm."
 astral_rift.210.a: "$FASCINATING$"
 astral_rift.210.b.evopred: "Năm mươi nghìn năm cỏn con không thể nào giấu được ngươi."
 astral_rift.215.name: "Khối Thập nhị diện"
 astral_rift.215.desc: "Chúng ta đã tiến hành nghiên cứu các mảnh vỡ của chiến hạm bên trong vết nứt này.\n\nBề mặt nhẵn bóng của loại chiến hạm này có thiết kế khá tương đồng với §Y$tech_rift_sphere_plural$§! của chúng ta. Đáng chú ý là, có vẻ như những chiến hạm này được thiết kế để có thể tự do ra vào vết nứt mà không cần dựa vào dây neo để rút lui.\n\nTrong khi các kỹ sư của chúng ta vẫn đang nỗ lực phân tích các công nghệ này, thì một nhóm khác đã phát hiện ra một vật thể hình thập nhị diện cỡ lớn nằm bên trong tàn tích lớn nhất. Không thể đoán được mục đích sử dụng của nó nếu không tiến hành thêm các thử nghiệm, nhưng mức độ cẩn trọng trong việc cất giữ nó chắc chắn ám chỉ tầm quan trọng của vật thể này."
 astral_rift.215.a: "Thử kích hoạt khối thập nhị diện này."
 astral_rift.215.b: "Tháo dỡ nó."
 astral_rift.220.name: "Kích hoạt"
 astral_rift.220.desc: "Đội ngũ của chúng ta đã mang khối thập nhị diện này lên §Y$tech_rift_sphere$§! để tiến hành kiểm tra thêm.\n\nQuá trình khảo sát kỹ lưỡng hơn về địa điểm phát hiện ra nó đã tìm thấy một lượng nhỏ sợi cõi sao. Sau khi bơm sợi cõi sao vào khối thập nhị diện, vật thể này bắt đầu rung động với cường độ cực cao, thậm chí hình dáng bên ngoài của nó dần mờ đi và biến thành một hình cầu.\n\nSau khi thiết bị được kích hoạt, vết nứt mà chúng ta dùng để đi đến đây đã bị phong ấn. Và khi thiết bị ngừng hoạt động, vết nứt lại mở ra.\n\nDựa trên thí nghiệm này, chúng ta suy luận rằng, một đế chế cổ đại nào đó khi phải đối mặt với một kẻ thù không thể đánh bại, họ đã sử dụng công nghệ này như một nỗ lực cuối cùng, hy sinh hạm đội của mình để giam cầm con quái thú này tại đây.\n\nThiết bị đáng kinh ngạc này có thể mang lại cho chúng ta những lợi ích to lớn."
 astral_rift.220.a: "$FASCINATING$"
 astral_rift.225.name: "Tháo dỡ"
 astral_rift.225.desc: "Khối thập nhị diện này thực sự là một kho tàng vật liệu quý hiếm. Bên trong nó chứa đầy $astral_threads$, và các hoa văn của nó cho thấy nó tạo thành một mạng lưới mạch điện phức tạp. Phần lõi của thiết bị lại lưu trữ một lượng lớn vật chất tối. Cơ chế hoạt động của món đồ tạo tác này vẫn còn là một ẩn số, nhưng chúng ta hoàn toàn có thể tận dụng tối đa các vật liệu cấu thành nên nó."
 astral_rift.225.a: "$FASCINATING$"
 ###############
 #The Lattice #
 ###############
 astral_rift_library: "Mạng lưới Tinh thể"
 decision_fractal_seed: "Hạt giống Phân dạng"
 decision_fractal_seed_desc: "Những khối cầu trong suốt thu hồi được từ phía bên kia vết nứt cõi sao này có khả năng tự uốn cong để tiến vào một không gian đa chiều, làm tăng dung tích hữu dụng của không gian xung quanh. Chúng ta nên cẩn trọng khi thiết lập vị trí cho nó."
 d_fractal_seed: "$decision_fractal_seed$"
 d_fractal_seed_desc: "$decision_fractal_seed_desc$"
 astral_rift.300.name: "Hình học Quái dị"
 astral_rift.300.desc: "Chúng ta đã tiến vào một không gian ngập tràn những kỳ quan thị giác đầy hoang mang, những hoa văn hình học và màu sắc biến hóa khôn lường.\n\nMặc dù môi trường xung quanh có vẻ không nguy hiểm, nhưng chúng lại gây ra sự mất phương hướng giống như một dạng ảo ảnh thị giác. Vật chất cấu tạo nên vũ trụ này thật sự rất khó hiểu. Cho dù có phóng to những mẫu vật này lên bao nhiêu lần, chúng ta vẫn thấy cùng một kiểu mẫu lặp đi lặp lại, hệt như sự ngưng tụ vô tận của chính nó.\n\nRất rõ ràng, bên trong vết nứt này tồn tại những định luật vật lý mà chúng ta chưa hề biết đến."
 astral_rift.300.a: "Tiến xa hơn để khám phá."
 astral_rift.300.b: "Nghiên cứu môi trường xung quanh ngay tại vị trí hiện tại."
 astral_rift.305.name: "Mô thức Đa chiều"
 astral_rift.305.desc: "Không gian ở nơi này hoàn toàn khác biệt so với nhận thức của chúng ta.\n\nChuyển động của phi thuyền không mang lại kết quả như dự kiến. Khi tiến về phía trước, phi thuyền lại trôi dạt sang trái; khi tăng lực đẩy, tốc độ lại giảm đi.\n\n[Leader.GetName] suy đoán rằng, vũ trụ này sở hữu nhiều hơn ba chiều tiêu chuẩn, và điều này cũng mang lại một số đột phá. Có lẽ bằng cách quan sát môi trường xung quanh với góc độ này, chúng ta có thể bắt đầu hiểu được những mô thức này."
 astral_rift.305.a: "Tiếp tục điều tra."
 astral_rift.310.name: "Phân tích Đa chiều"
 astral_rift.310.desc: "Nếu không thể thấu hiểu trọn vẹn vũ trụ này, chúng ta sẽ khó lòng cất bước tại đây. Vì vậy, mọi cá thể con của chúng ta đều được điều động để nghiên cứu môi trường xung quanh.\nBan đầu, những dữ liệu này dường như chỉ là những tiếng ồn ngẫu nhiên không có sự liên kết, cho đến khi [Leader.GetName] tạo ra một bước đột phá: Đáng ngạc nhiên là vũ trụ này sở hữu nhiều hơn ba chiều tiêu chuẩn. Có lẽ bằng cách quan sát môi trường xung quanh với góc độ này, chúng ta có thể bắt đầu hiểu được những mô thức này."
 astral_rift.310.a: "Nghiên cứu chuyên sâu hơn."
 astral_rift.315.name: "Thông điệp trong Chai"
 astral_rift.315.desc.common: "Bằng cách thực hiện phép ngoại suy không gian bốn chiều đối với các mô thức trong môi trường xung quanh, chúng ta đã thiết lập thành công một tấm bản đồ khả dụng. Nó hé lộ rằng ẩn chứa bên trong những mô thức lặp đi lặp lại này là một “khoang chứa trung tâm”.\n\nTừ góc nhìn của không gian bốn chiều, chúng ta có thể đi theo một đường thẳng để đến trung tâm của vết nứt, nhưng bản thân chúng ta lại có cảm giác như đang băng qua một quỹ đạo ngoằn ngoèo, xuyên qua một mê cung không thể nào hiểu nổi. Để vượt qua mê cung này, chúng ta cần phải thực hiện những khúc cua gấp, đôi khi còn phải quay ngược lại, nhưng cuối cùng chúng ta cũng đã đến được đích.\n\nKhông gian mới này vô cùng rộng lớn, lớn đến mức về mặt logic không thể nào chứa trọn trong khoang này, đây chắc chắn là kết quả của việc có thêm nhiều chiều không gian bị gấp nếp.\n\nTại khu vực trung tâm của nó, chúng ta đã tìm thấy một thiết bị quen thuộc. Trên đó có khắc những dòng chữ bằng chính ngôn ngữ của chúng ta, đó là một tập hợp các chỉ dẫn về cách thức tiếp tục tiến hành."
 astral_rift.315.desc.default: "$astral_rift.315.desc.common$\n\nVà chữ ký bên trên đó lại chính là [Leader.GetName]. Đây là một bức thông điệp đến từ bản thân trong tương lai."
 astral_rift.315.desc.gestalt: "$astral_rift.315.desc.common$"
 astral_rift.315.a: "Điều này có đáng tin cậy không?"
 astral_rift.320.name: "Du hành Thời gian"
 astral_rift.320.desc: "Chúng ta đang du hành trên tất cả các dòng thời gian.\n\nTuân theo những chỉ dẫn đặt ra trước mắt, chúng ta đã dễ dàng đi xuyên qua vô số chiều siêu không gian không xác định. Rất nhiều lần, chúng ta đã nhìn thấy chính mình đi qua từ một hướng khác. Một số bản sao khác của chúng ta dường như đang gặp rắc rối, tình trạng rỉ sét và cũ nát của §Y$tech_rift_sphere$§! cho thấy họ đã bị lạc trong không gian này một thời gian rất dài.\n\nThật may mắn, cho đến thời điểm hiện tại chúng ta vẫn chưa trực tiếp chạm trán với họ. Chúng ta đã để lại những lời chỉ dẫn cho bản thân mình, để phòng ngừa nguy cơ đồng bộ hóa thời gian nguy hiểm này."
 astral_rift.320.a: "Thật đáng lo ngại..."
 astral_rift.325.name: "Hạt giống Phân dạng"
 astral_rift.325.desc: "Cuối cùng, chúng ta đã chạm đến vị trí có thể coi là đích đến thực sự của mê cung này.\n\nChúng ta đang ở trong một không gian được dệt nên bởi nhiều chiều không gian vô định, cảm biến của chúng ta hiển thị nó như những sắc màu nhảy múa tựa như trong một chiếc kính vạn hoa. Ở vùng lõi sâu nhất của nó lơ lửng ba quả cầu trong suốt, mỗi quả cầu đều chứa đựng những hoa văn lặp đi lặp lại vô tận theo một trục. Tôi suy đoán rằng, mỗi một chiều không gian trong vũ trụ này đều có một quả cầu tương ứng, nhưng chúng ta chỉ có thể tương tác với ba chiều mà chúng ta có khả năng quan sát.\n\nỞ đây không còn bất kỳ sự chỉ dẫn nào nữa. Việc thiếu vắng thông điệp từ bản thân trong tương lai có thể là dấu hiệu cho thấy, việc tương tác với những quả cầu này có thể dẫn đến những hậu quả khôn lường."
 astral_rift.325.a: "Lấy những quả cầu đó về."
 astral_rift.325.b: "Chúng ta dừng lại ở đây thôi."
 astral_rift.330.name: "Lồng chứa Đa chiều"
 astral_rift.330.desc: "Khi chúng ta quay trở về từ vết nứt, có thêm hai quả cầu khác đi theo chúng ta. Có lẽ chúng được điều khiển bởi phiên bản của chúng ta ở các chiều không gian khác, “ba” người chúng ta đã hợp nhất (hoặc nói đúng hơn là sụp đổ?) thành một khi chạm đến điểm tới hạn.\n\nĐiều kỳ lạ là, ba quả cầu mà chúng ta lấy được lại không hề hợp nhất với nhau theo cách tương tự. Chín phiên bản cùng tồn tại ở những thời điểm khác nhau của cùng một vật thể đã xuất hiện trong cùng một không gian.\n\nKhi được đặt vào trong một lồng chứa độc lập, chúng tự động uốn cong để tiến vào một không gian đa chiều, làm tăng dung tích hữu dụng của không gian xung quanh. Chúng ta hiện vẫn chưa xác định được giới hạn mở rộng của hiệu ứng này, nhưng chúng ta tin rằng thiết bị này có thể phát huy tác dụng to lớn tại những khu vực có dân cư đông đúc."
 astral_rift.330.a: "Thật là tiện lợi."
 fractal_seeds_available_tt: "Bạn sẽ sở hữu [Explorer.num_authorized_fractal_seeds] §YHạt giống Phân dạng§!, có thể đặt trên các hành tinh thuộc địa thông qua §HPhán quyết Hành tinh§!."
 astral_rift.335.name: "Trải nghiệm Đáng nhớ"
 astral_rift.335.desc: "Mặc dù chúng ta đã lựa chọn không mang theo các quả cầu, nhưng cuối cùng chúng ta lại phát hiện ra ba quả cầu đó đã xuất hiện ở phía bên này của vết nứt. Chắc chắn là một phiên bản khác của chúng ta đã lấy chúng về.\n\nThông qua các thử nghiệm, chúng ta phát hiện ra những quả cầu này mang những đặc tính vô cùng thú vị và hữu dụng. Cụ thể, chúng có khả năng uốn cong để tiến vào một không gian đa chiều, làm tăng dung tích hữu dụng của không gian xung quanh. Chúng ta hiện vẫn chưa xác định được giới hạn mở rộng của hiệu ứng này, nhưng chúng ta tin rằng thiết bị này có thể phát huy tác dụng to lớn tại những khu vực có dân cư đông đúc."
 astral_rift.335.a: "Chúng ta vừa tự giúp mình một tay."
 ###############
 #Subnautical #
 ###############
 astral_rift_subnautical: "Bên dưới Vực sâu"
 astral_rift.500.name: "Lặn xuống"
 astral_rift.500.desc: "Sự thay đổi áp suất diễn ra một cách bất ngờ và vô cùng dữ dội; có vẻ như quả cầu đã đáp xuống khu vực sâu thẳm nhất của một đại dương bao la. Nơi đây là một khoảng không tối tăm tĩnh mịch, các thiết bị của chúng ta không phát hiện ra bất kỳ tín hiệu nào của sự sống, trầm tích trôi nổi hay vật chất dạng hạt.\n\nDựa trên mức áp suất nước, chúng ta đang ở một độ sâu rất lớn so với bề mặt."
 astral_rift.500.a: "Tiếp tục lặn xuống."
 astral_rift.500.b: "Trồi lên mặt biển."
 astral_rift.505.name: "Kết quả Ngoài dự kiến"
 astral_rift.505.desc: "Hình như có chuyện gì đó không ổn rồi.\n\nChúng ta đã di chuyển trong nước suốt nhiều giờ đồng hồ, nhưng môi trường xung quanh vẫn không hề có sự thay đổi."
 astral_rift.505.desc.default: "$astral_rift.505.desc$\n\nNgười lái tàu cho rằng, có thể đang có một thế lực nào đó tác động lên chúng ta khiến cho động cơ không thể nào chống lại được. Anh ta đề xuất chúng ta nên thử thực hiện một bước nhảy ngắn. Hoặc có thể tự mình rời khỏi quả cầu, bám vào những vật thể bơm hơi có mật độ thấp, nhờ đó có khả năng nổi lên bề mặt."
 astral_rift.505.desc.gestalt: "$astral_rift.505.desc$\n\nDường như có một lực lượng nào đó mà động cơ của chúng ta không thể chống lại đang tác động lên chúng ta.\n\nChúng ta có thể thử vượt qua bằng cách thực hiện một bước nhảy ngắn. Hoặc chúng ta có thể rời khỏi quả cầu, bám vào những vật thể bơm hơi có mật độ thấp, nhờ đó có khả năng nổi lên bề mặt."
 astral_rift.505.a: "Khởi động động cơ."
 astral_rift.505.b: "Mặc bộ đồ chống áp lực vào, chúng ta sẽ bơi lên đó."
 astral_rift.510.name: "Bong bóng Cỡ Hành tinh"
 astral_rift.510.desc: "Bước nhảy ngắn đã phát huy tác dụng. Chúng ta đã hiện diện ở khu vực gần bề mặt. Sau khi xuyên qua mặt nước, chúng ta kinh ngạc nhận ra mình đang nằm bên trong một bong bóng rỗng có kích thước ngang ngửa một hành tinh, trôi nổi giữa không gian chân không của vũ trụ.\n\nTốc độ trước đó của chúng ta hoàn toàn không đủ để thoát khỏi lực hấp dẫn của nó."
 astral_rift.515.name: "Bơi tự do"
 astral_rift.515.desc.1: "Chúng ta đã triển khai hệ thống cáp siêu dài và rời khỏi quả cầu thông qua một chốt gió đặc biệt.\n\nSau khi tất cả chúng ta đã bơm căng phao cứu sinh, tỷ trọng thấp đã đưa chúng ta lên mặt nước với một tốc độ đáng kinh ngạc.\n\nTrong suốt quá trình đó, bộ lọc trên bộ đồ chống áp lực của chúng ta đã thu thập được những sợi cõi sao với nồng độ cực kỳ cao."
 astral_rift.515.desc.2: "Khi chúng ta khoác lên mình bộ đồ chống áp lực cồng kềnh xuyên qua mặt nước, chúng ta phát hiện ra rằng thực chất mình đang ở bên trong một bong bóng kích cỡ hành tinh lơ lửng trong không gian chân không của vũ trụ.\n\nMật độ của §Y$tech_rift_sphere$§! quá cao để có thể thoát khỏi lực hấp dẫn nơi này.\n\nChúng ta đã gửi tín hiệu về cho quả cầu, điều khiển nó thực hiện một bước nhảy ngắn đến một vị trí gần chúng ta."
 astral_rift.515.desc.default: "$astral_rift.515.desc.1$\n\n$astral_rift.515.desc.2$"
 astral_rift.515.desc.aquatic: "$astral_rift.515.desc.1$\n\nNhưng dù sao đi nữa, chuyến bơi lặn này cũng giúp chúng ta cảm thấy thư thái cả về thể xác lẫn tinh thần. Chúng ta rất vui vì có cơ hội được trở về với môi trường tự nhiên này.\n\n$astral_rift.515.desc.2$" #Must also be non-gestalt
 astral_rift.520.name: "Hành tinh Bong bóng"
 astral_rift.520.desc: "Không gian xung quanh chúng ta giống hệt như một vụ nổ của một lượng chất lỏng có kích cỡ ngang ngửa một ngôi sao trong môi trường trọng lực thấp, với những bong bóng chất lỏng vi tinh thể có kích thước bằng một hành tinh lơ lửng khắp nơi. Gần đó có một ngôi sao, chúng ta đang quay quanh nó một cách vô lực. Trông nó có vẻ vô cùng cổ kính, mờ nhạt và lạnh lẽo.\n\nVà ở đây còn có những thứ khác nữa. Dù không phải là một ngôi sao, nhưng nó cũng có kích thước tương đương với một ngôi sao. Nó được tạo thành từ vô số mảnh vỡ đan xen vào nhau, hệt như một khối xếp hình 3D khổng lồ. Kết quả quét cho thấy, nó được cấu tạo từ nhiều loại kim loại và vật liệu quý hiếm, những vật chất này hoàn toàn trùng khớp với những gì chứa trong ngôi sao mà nó quay quanh. Rất có khả năng một trong hai thứ đã được sinh ra từ thứ còn lại, hoặc có chung một nguồn gốc.\n\nKhi quan sát kỹ hơn, chúng ta sẽ thấy những mảnh vỡ đó đang trôi nổi một cách chậm rãi. Thỉnh thoảng lại có một bong bóng chất lỏng khổng lồ mới rỉ ra từ cấu trúc này.\n\nNếu nó thực sự có sự sống, thì dường như nó vẫn chưa phát hiện ra sự hiện diện của chúng ta."
 astral_rift.520.a: "Cố gắng giao tiếp."
 astral_rift.520.b: "Tiến lại gần vật thể này."
 astral_rift.525.name: "Liên lạc"
 astral_rift.525.desc.1: "Sự tồn tại của một cấu trúc khổng lồ như vậy mà không cần bất kỳ sự quản lý hay bảo trì nào, chứng tỏ nó phải sở hữu một mức độ tự chủ nhất định.\n\nChúng ta đã quét qua tất cả các dải tần âm thanh nhưng không thu được gì.\n\nNó chỉ phát ra những tiếng rên rỉ liên tục và ớn lạnh."
 astral_rift.525.desc.2: "Hiện tại, chúng ta đang lên kế hoạch thử sử dụng mọi ngôn ngữ đã biết để phát sóng trên dải tần này nhằm thiết lập kết nối.\n\nChúng ta nên nói gì đây?"
 astral_rift.525.desc.default: "$astral_rift.525.desc.1$\n\nNếu người lái tàu không âm thầm cắt đứt tín hiệu này, e rằng tinh thần của các thành viên phi hành đoàn đã sớm suy sụp rồi.\n\n$astral_rift.525.desc.2$"
 astral_rift.525.desc.gestalt: "$astral_rift.525.desc.1$\n\n$astral_rift.525.desc.2$"
 astral_rift.525.a: "Xin chào."
 astral_rift.525.b: "Ngươi là ai?"
 astral_rift.525.c: "Ngươi bị sao vậy?"
 astral_rift.530.name: "Tiến gần"
 astral_rift.530.desc: "Chúng ta từ từ tiến lại gần, cẩn trọng tránh né những bong bóng nước xung quanh.\n\nVật thể này liên tục chuyển động. Lượng nhiệt sinh ra từ ma sát giữa các bộ phận của nó đủ để làm nóng chảy hầu hết các loại kim loại đã biết. Theo những gì chúng ta hiểu, phần lõi của nó hoàn toàn ở trạng thái nóng chảy.\n\nChúng ta đang tải lên máy tính các thông tin chi tiết về cấu trúc của nó để tiến hành nghiên cứu sâu hơn."
 astral_rift.530.a: "Tiến lại gần hơn chút nữa..."
 astral_rift.535.name: "Thức tỉnh"
 astral_rift.535.answer.a: "Vật thể này đột nhiên... bừng tỉnh. Các mảnh vỡ của nó bị kéo ra ngoài, và bắt đầu quay với một tốc độ kinh hoàng. Giếng trọng lực của nó cũng gia tăng đột ngột, và chúng ta bị hút về phía nó với gia tốc cực lớn.\n\nMột quả cầu lửa tựa như một ngôi sao nhỏ trồi lên từ giữa những mảnh vỡ của nó. Lò luyện này chỉ xuất hiện ở một phía của vật thể, nó từ từ quay về hướng chúng ta, giải phóng ra luồng nhiệt dữ dội.\n\nMột luồng xung bức xạ điện từ đột ngột bùng phát, làm cho con tàu của chúng ta rung bần bật. Mọi cảnh báo trên bảng điều khiển đều reo vang, hoặc thậm chí còn phát ra tín hiệu trục trặc."
 astral_rift.535.answer.b: "Vật thể này đột nhiên... bừng tỉnh. Các mảnh vỡ của nó bị kéo ra ngoài, và bắt đầu quay với một tốc độ kinh hoàng. Giếng trọng lực của nó cũng gia tăng đột ngột, và chúng ta bị hút về phía nó với gia tốc cực lớn.\n\nMột quả cầu lửa tựa như một ngôi sao nhỏ trồi lên từ giữa những mảnh vỡ của nó. Lò luyện này chỉ xuất hiện ở một phía của vật thể, nó từ từ quay về hướng chúng ta, giải phóng ra luồng nhiệt dữ dội.\n\nMột luồng xung bức xạ điện từ đột ngột bùng phát, làm cho con tàu của chúng ta rung bần bật. Mọi cảnh báo trên bảng điều khiển đều reo vang, hoặc thậm chí còn phát ra tín hiệu trục trặc —— tuy nhiên, chức năng dịch thuật vẫn hoạt động bình thường.\n\nChúng ta đã nhận được một đoạn thông điệp được mã hóa dưới dạng nhị phân, chứa nhiều cụm từ trong các ngôn ngữ mà chúng ta đã biết: §E“Bi thương. Cút đi.”§!"
 astral_rift.535.answer.c: "Vật thể này đột nhiên... bừng tỉnh. Các mảnh vỡ của nó bị kéo ra ngoài, và bắt đầu quay với một tốc độ kinh hoàng. Giếng trọng lực của nó cũng gia tăng đột ngột, và chúng ta bị hút về phía nó với gia tốc cực lớn.\n\nMột quả cầu lửa tựa như một ngôi sao nhỏ trồi lên từ giữa những mảnh vỡ của nó. Lò luyện này chỉ xuất hiện ở một phía của vật thể, nó từ từ quay về hướng chúng ta, giải phóng ra luồng nhiệt dữ dội.\n\nMột luồng xung bức xạ điện từ đột ngột bùng phát, làm cho con tàu của chúng ta rung bần bật. Mọi cảnh báo trên bảng điều khiển đều reo vang, hoặc thậm chí còn phát ra tín hiệu trục trặc —— tuy nhiên, chức năng dịch thuật vẫn hoạt động bình thường.\n\nChúng ta đã nhận được một đoạn thông điệp được mã hóa dưới dạng nhị phân, chứa nhiều cụm từ trong các ngôn ngữ mà chúng ta đã biết: §E“Tuyệt vọng. Ta gào thét. Các ngươi cút đi. Ngay lập tức.”§!"
 astral_rift.535.desc.2: "Phần vỏ tàu đã chạm tới giới hạn chịu đựng của vật liệu.\n\nChúng ta vội vã kéo dây cáp neo đậu khẩn cấp, cố gắng thu hồi được càng nhiều mẫu vật càng tốt.\n\nBất kể nó thực sự là thứ gì, có vẻ như việc này đã vượt quá giới hạn mà chúng ta có thể can thiệp."
 astral_rift.535.desc: "$astral_rift.535.answer.a$\n\n$astral_rift.535.desc.2$"
 astral_rift.536.desc: "$astral_rift.535.answer.b$\n\n$astral_rift.535.desc.2$"
 astral_rift.537.desc: "$astral_rift.535.answer.c$\n\n$astral_rift.535.desc.2$"
 #############
 #The Tower #
 #############
 tower_rift_leader_desc: "§Y[Root.GetName]§! đã trở về từ một tòa tháp khổng lồ bên trong một $ASTRAL_RIFT$, trước đây [Root.GetSheHe] từng giữ chức vụ thủ lĩnh trong giáo phái ngày tận thế."
 astral_rift_tower: "Tòa tháp Khổng lồ"
 astral_rift.600.name: "Tòa tháp Khổng lồ"
 astral_rift.600.desc: "Không lâu sau khi đến nơi, chúng ta đã đáp xuống một nền đá có kích thước hoàn toàn ăn khớp với §Y$tech_rift_sphere$§!. Trên thực tế, sự trùng khớp này quá đỗi hoàn hảo đến mức nếu nói đây chỉ là một sự ngẫu nhiên thì thật sự rất gượng ép.\n\nBốn bề là một bầu trời bao la, rực rỡ trải dài trước mắt. Những lượt quét sơ bộ cho thấy, chúng ta đang tọa lạc trên đỉnh của một tòa tháp khổng lồ, phần chân tháp đã bị những đám mây cuồn cuộn che khuất tầm nhìn.\n\nỞ phía rìa của nền đá có một sinh vật đơn độc. Nó khoác trên mình một chiếc áo choàng rách rưới, bám đầy bụi bặm, và rõ ràng là đang đứng chờ để đón tiếp chúng ta."
 astral_rift.600.a: "Cố gắng giao tiếp với sinh vật này."
 astral_rift.600.b: "Quan sát sinh vật này và báo cáo."
 astral_rift.600.c: "Giết nó đi."
 astral_rift.605.name: "Giao tiếp Nhị phân"
 astral_rift.605.desc: "Do không thể giải mã được ngôn ngữ của sinh vật này, chúng ta quyết định sử dụng một phương thức giao tiếp trực tiếp hơn, bằng cách bật tắt liên tục các đèn chiếu sáng bên ngoài của §Y$tech_rift_sphere$§!.\n\nSinh vật này lập tức quỳ sụp xuống đất. Ban đầu chúng ta còn ngỡ rằng mình đã làm nó bị thương, nhưng rất nhanh sau đó chúng ta nhận ra nó đang thể hiện một hình thức tôn sùng hay cầu xin nào đó.\n\nNgay sau đó, một nhóm sinh vật ăn mặc tương tự tụ tập quanh mép bệ đá, trên tay họ cầm theo một chiếc giỏ, chứa đựng những thứ mà chúng ta phỏng đoán là quà tặng hoặc những vật phẩm tương tự."
 astral_rift.605.a: "Mời họ lên tàu."
 astral_rift.605.b: "Chuẩn bị một vài món quà đáp lễ."
 astral_rift.605.c: "Rời khỏi nơi này."
 astral_rift.610.name: "Sự Cung nghênh Đã chờ đợi Từ lâu"
 astral_rift.610.desc: "Chúng ta an toàn ở lại bên trong quả cầu và dành một chút thời gian để khảo sát khu vực này. Độ cao từ mặt đất lên đến đây là khoảng 2500 mét, đối với một xã hội có mức độ phát triển công nghệ ở ngưỡng này, việc xây dựng một tòa tháp chọc trời cao đến thế chắc chắn phải tiêu tốn một nỗ lực khổng lồ đến mức khó có thể tưởng tượng nổi. Thực tế, chúng ta thậm chí đang chứng kiến nỗ lực đầu tiên của nền văn minh này trong việc tiến vào không gian. Điều kỳ lạ hơn nữa là trên nền đá này có khắc một vài hoa văn có vẻ như giống hệt với những hoa văn được tìm thấy bên trong §Y$tech_rift_sphere$§!.\n\nSinh vật này đứng thẳng trước mặt chúng ta đầy kiêu hãnh, dang rộng hai tay. Rõ ràng đây là một khoảnh khắc vô cùng hân hoan."
 astral_rift.610.a: "Mời họ lên tàu."
 astral_rift.610.b: "Chuẩn bị một vài món quà đáp lễ."
 astral_rift.610.c: "Rời khỏi nơi này."
 astral_rift.610.d: "Giết sinh vật này đi."
 astral_rift.611.name: "Bắt Trọn ổ"
 astral_rift.611.desc: "Quả cầu Vết nứt từ từ bay lên khỏi tòa tháp nghi lễ cao ngất ngưỡng, điều này chắc hẳn đã tạo nên một khoảnh khắc mang ý nghĩa tâm linh sâu sắc đối với những sinh vật bên dưới. Thật không may, ngay sau đó phi thuyền của chúng ta đã rơi tự do với vận tốc tối đa, hủy diệt toàn bộ các dạng sống nằm gần khu vực bệ đá. Bọn họ lặng lẽ đứng đó, vươn cao cánh tay cho đến tận giây phút cuối cùng.\n\nBây giờ chúng ta có thể tiếp tục tiến hành khám phá môi trường này mà không gặp phải bất kỳ sự can thiệp nào."
 astral_rift.611.a: "Quét bề mặt hành tinh."
 astral_rift.615.name: "Chủ nhà"
 astral_rift.615.desc: "Chúng ta mở cửa sập, sinh vật này ngập ngừng bước vào.\n\nMỗi bước đi của anh ta đều mang theo sự tự tin ngày càng tăng, nhưng vẫn có thể dễ dàng nhận ra toàn bộ cơ thể anh ta đang căng cứng ở mức độ cao. Có trời mới biết anh ta đã mong đợi khoảnh khắc này đến dường nào.\n\nChúng ta không chắc làm thế nào anh ta biết được chúng ta sẽ đến, nhưng chúng ta tin rằng việc đưa anh ta lên tàu sẽ không gây ra bất kỳ vấn đề gì. Anh ta trố mắt kinh ngạc trước các thiết bị trên tàu của chúng ta, và nhanh chóng ngất xỉu ngay trên boong tàu vì quá đỗi sửng sốt.\n\nSau khi khôi phục và nghiên cứu một số tài liệu mà anh ta giấu trong áo choàng, chúng ta đã đưa ra kết luận: sinh vật đặc biệt này là một nhà lãnh đạo có tầm ảnh hưởng nhất định trong đồng loại của mình.\n\nChúng ta tin rằng, thông qua một số biện pháp hội nhập, họ sẽ mang lại lợi ích to lớn cho xã hội của chính chúng ta."
 astral_rift.615.a: "Mời anh ta đến với Đế chế của chúng ta."
 astral_rift.615.a.tt: "Một §YCán bộ Khoa học§! sẽ được chiêu mộ trong vòng một năm tới."
 astral_rift.615.b: "Tịch thu tài liệu của anh ta rồi thả anh ta đi."
 astral_rift.615.b.tt: "Nhận được một công nghệ Xã hội học ngẫu nhiên."
 astral_rift.620.name: "Sự Đền đáp Có qua Có lại"
 astral_rift.620.desc: "Chúng ta sẽ không làm phiền họ thêm nữa.\n\nSự hiện diện của chúng ta dường như đã vô tình thỏa mãn một loại ngôn ngữ cổ xưa nào đó. Chẳng hiểu sao họ lại biết trước việc chúng ta sẽ đến, và xét đến việc họ vô cùng coi trọng sự kiện này, chuyến viếng thăm này có vẻ như đã để lại một tác động sâu sắc đến nền văn minh của họ.\n\nChúng ta quyết định sẽ để lại một vài khối kim loại tiên tiến như một món quà nhỏ nhằm thể hiện thiện chí. Trên một trong số đó, chúng ta có khắc tọa độ toán học của hệ sao mẹ, biết đâu một ngày nào đó họ có thể dựa vào bản đồ này để liên lạc với chúng ta.\n\nĐể hỗ trợ cho các nhà xã hội học của chúng ta, chúng ta đã ghi lại toàn bộ quá trình tương tác này cho thế hệ mai sau."
 astral_rift.625.name: "Từ chối Tiên tri"
 astral_rift.625.common: "Chúng ta dồn toàn bộ sự chú ý vào việc khai thác tài nguyên, và đã lấy được thành công các mẫu vật từ những đám mây xung quanh, trong đó chứa một lượng vật chất cõi sao với nồng độ cao dị thường. Chúng ta rất hoan nghênh món hời bất ngờ này."
 astral_rift.625.desc.killed: "Sau khi xử lý xong đám sinh vật [Explorer.GetPreFTLLower] này, chúng ta tiếp tục bắt tay vào việc khám phá bầu khí quyển của chiều không gian khác này.\n\n$astral_rift.625.common$"
 astral_rift.625.desc.default: "Chúng ta sẽ không tiếp tục dấn thân vào cái sự kiện rình rang đầy sai lệch này nữa.\n\nViệc xây dựng nên tòa tháp này ngay từ đầu đã là một sai lầm, chúng ta có những việc quan trọng hơn cần phải làm, chứ không phải đi giúp sức để biến lời tiên tri của lũ người ngoài hành tinh thành hiện thực.\n\n$astral_rift.625.common$"
 astral_rift.691.name: "Sự Thăng tiến của [From.GetName]"
 astral_rift.691.desc: "Một năm trước, chúng ta đã đưa về một cá nhân từ tòa tháp khổng lồ nằm ở phía bên kia vết nứt cõi sao. Kể từ đó, [From.GetHeShe] ngày càng trở nên hòa nhập với xã hội của chúng ta. Giờ đây [From.GetHisHer] đã có thể nói được ngôn ngữ của chúng ta, và vẫn giữ nguyên vẹn khát khao được giúp đỡ chúng ta như ban đầu.\n\n[From.GetHeShe] đã thể hiện một sự am hiểu độc đáo về triết lý xã hội, và mang đến cho chúng ta một cơ hội đặc biệt."
 astral_rift.691.a: "[From.GetHeSheCap] cứ làm một công dân bình thường là được rồi."
 astral_rift.691.b: "Tuyển dụng [From.GetHimHer] vào vị trí Cán bộ Khoa học."
 astral_rift.696.name: "Sự Qua đời của [From.GetName]"
 astral_rift.696.desc: "Lãnh đạo [From.GetName] đã trút hơi thở cuối cùng. [From.GetHeShe] lặn lội từ phía bên kia vết nứt cõi sao đến đây, và giờ đây được an táng một cách trọng thể. Tang lễ được cử hành bên trong tòa tháp cao vút ở đầu bên kia vết nứt, và được phát sóng trực tiếp thông qua một quả cầu tang lễ được thiết kế riêng. Chúng ta mong rằng [From.GetHeShe] sẽ bắt đầu một cuộc hành trình mới ở thế giới bên kia.\n\nNhững đóng góp xuất sắc của [From.GetHeShe] cho đế chế của chúng ta sẽ được lưu danh muôn thuở."
 astral_rift.696.a: "Chúng ta sẽ luôn ghi nhớ [From.GetHeSheCap]."
 ############
 #Whiteout #
 ############
 whiteout_gift_modifier: "Một món quà"
 astral_rift_whiteout: "Khoảng không Trắng xóa"
 astral_rift.700.name: "Khoảng không Trắng xóa"
 astral_rift.700.desc: "Bên ngoài quả cầu là một khoảng không trắng xóa, hoàn toàn trống rỗng.\n\nNhững đo lường ban đầu cho thấy, mọi dải tần trong quang phổ đều đang oanh tạc chúng ta từ mọi hướng cùng một lúc với cường độ hoàn toàn đồng nhất. Chúng ta không thể nào xác định được phương hướng.\n\nCác thiết bị đo đạc độ cao, độ sâu và hướng di chuyển của chúng ta đều đã ngừng hoạt động hoàn toàn, hoặc rõ ràng là đang gặp trục trặc. Có vẻ như khoảng không trắng xóa đang bao trọn chúng ta không hề có bất kỳ sự khác biệt nào.\n\nCó lẽ chỉ cần chúng ta đi đủ xa là có thể thoát khỏi sự nhiễu loạn này. Hoặc chúng ta có thể thả các thiết bị không người lái ra để thám thính khu vực này một cách tỉ mỉ hơn."
 astral_rift.700.a: "Tiến lên với tốc độ tối đa."
 astral_rift.700.b: "Thả thiết bị không người lái."
 astral_rift.705.name: "Bức tường Cao ngất ngưởng"
 astral_rift.705.desc: "Chúng ta đã chọn đại một hướng và lao đi thật nhanh, rồi ngay lập tức đâm sầm vào một bức tường đen cao ngất ngưởng.\n\nSau khi đi dọc theo chu vi của nó, chúng ta nhận ra nó có hình dáng gần giống như một đường tròn hoàn hảo. Không có bất kỳ lối vào rõ ràng nào trên đó, nhưng bề mặt của nó thi thoảng lại rung lên nhè nhẹ, tựa như một thực thể sống.\n\nQuá trình nghiên cứu sâu hơn cho thấy, đường kính của bức tường này đang từ từ mở rộng. Chúng ta đang thận trọng giữ một khoảng cách an toàn, và luôn trong tư thế sẵn sàng kéo dây neo để rút lui bất cứ lúc nào.\n\nTrong các đợt quan sát sau đó, chúng ta đã thu thập được một lượng lớn sợi cõi sao."
 astral_rift.710.name: "Tầm nhìn từ trên Cao"
 astral_rift.710.desc: "Để có thể quan sát tình hình của mình từ những góc độ khác, chúng ta đã thả một thiết bị không người lái để trinh sát khu vực xung quanh. Sau khi bay thành nhiều vòng tròn đồng tâm bao quanh con tàu của chúng ta, chúng ta đã phát hiện ra một bức tường đen uốn lượn ở khoảng cách không xa.\n\nTuy nhiên, thông số trên các thiết bị lại gây ra sự hoang mang lớn, bởi vì độ cao của bức tường luôn hoàn toàn trùng khớp với độ cao bay của thiết bị không người lái. Việc quan sát hiện tượng này đã làm sâu sắc thêm những nhận thức của chúng ta về các chiều không gian phi tiêu chuẩn."
 astral_rift.715.name: "Diễn biến Mới"
 astral_rift.715.desc: "Chúng ta đã có những diễn biến mới.\n\nLại có thêm một loạt các bức tường xuất hiện ngay trước mắt chúng ta.\n\nChúng ta vẫn đang duy trì một khoảng cách an toàn, để ngăn chặn những vật thể này trực tiếp vật chất hóa bên trong §Y$tech_rift_sphere$§! của chúng ta.\n\nCó lẽ thông qua việc lấy mẫu vật liệu cấu tạo nên chúng, chúng ta có thể hiểu rõ hơn về tình hình hiện tại. Hoặc chúng ta có thể dành chút thời gian để phác họa lại hình dáng của những bức tường này, xem thử có quy luật nào ẩn giấu trong đó hay không."
 astral_rift.715.a: "Lấy mẫu."
 astral_rift.715.b: "Vẽ bản đồ."
 astral_rift.720.name: "Phản hồi"
 astral_rift.720.desc: "Chúng ta đã vươn cần lấy mẫu ra và thu được một số mẫu vật chất đen từ bức tường.\n\nChúng ta kinh ngạc nhận ra rằng, khi kéo mẫu vật ra để tiến hành phân tích, nó vẫn duy trì độ cao vô hạn. Tính chất của nó có nhiều nét tương đồng với mực in hoặc sơn màu, mặc dù thành phần của chất màu này thuộc về một chủng loại mà chúng ta chưa từng biết tới. Một số chất kết dính được sử dụng trong loại mực này thực chất là một dạng tinh thể hòa tan độc đáo.\n\nChúng ta đã làm thêm một thử nghiệm, dùng những mẫu vật này để vẽ một đường thẳng và chờ đợi trong chốc lát. Rất nhanh, một hình vẽ gần như giống hệt đã xuất hiện song song ngay bên cạnh.\n\nChúng ta lặp lại quá trình này nhiều lần, mỗi lần sử dụng một lượng vật chất khác nhau, vẽ thành vô số các mẫu hình khác biệt. Mỗi một lần, các mẫu hình đều được sao chép lại một cách hoàn hảo với cùng một hướng.\n\nDựa trên những kết quả này, chúng ta có cơ sở để tin rằng một thực thể nào đó đang sử dụng những vật liệu này để cố gắng giao tiếp với chúng ta. Vì vậy, chúng ta bắt đầu dùng các chấm và nét gạch ngắn để viết ra một vài cụm từ nhị phân cơ bản. Mặc dù chúng đều được sao chép lại hoàn toàn, nhưng cũng có một vài điều mới mẻ: bên cạnh mỗi từ ngữ của chúng ta còn xuất hiện thêm một mẫu hình\n\nMỗi lần chúng ta viết ra cùng một cụm từ, thì lại có một mẫu hình tương tự xuất hiện. Đây có phải là một bản dịch không?"
 astral_rift.725.name: "Lời chào hỏi"
 astral_rift.725.desc: "Mặc dù đã phải tiêu tốn đến vài ngày, nhưng chúng ta cũng đã hoàn tất việc phác họa những vật thể kỳ lạ trong không gian trắng xóa này.\n\nĐối với chúng ta, chúng chỉ là những bức tường và cột trụ, nhưng hệ thống máy tính của quả cầu có thể tính toán ra diện mạo của những mô hình này khi nhìn từ trên cao xuống.\n\nCác mô hình và không gian thể hiện một cấu trúc và sự thống nhất rõ rệt. Chúng ta có thể đưa ra kết luận: những cấu trúc này tạo nên một hệ thống chữ viết của một ngôn ngữ mà chúng ta hoàn toàn không biết.\n\nMặc dù chúng ta không thể hiểu được ý nghĩa của chúng, nhưng máy tính của quả cầu vẫn luôn không ngừng nỗ lực để giải mã tất cả những gì chúng ta đã ghi lại. Trong thời gian đó, có một chuyện thú vị đã xảy ra.\n\nTrong khoảng không gian xung quanh bắt đầu xuất hiện những hình trụ tròn có cùng đường kính với phi thuyền của chúng ta.\n\nChúng ta đã tự đẩy mình ra xa một khoảng cách an toàn, nhưng lại phát hiện ra có một bức tường vững chắc dựng lên ở ngay phía sau. Tuy nhiên, dường như không có bất kỳ mối nguy hiểm nào, bởi vì ngay khi chúng ta di chuyển, bức tường cũng lập tức dừng lại.\n\nCó thứ gì đó đang “vẽ” ra một đường hầm ngay phía sau chúng ta.\n\nSau khi phân tích những ký hiệu này, chúng ta tin chắc rằng một trong những ký hiệu đó có thể được dịch thành một lời chào, hoặc nói đơn giản hơn: §E“Xin chào.”§!"
 astral_rift.730.name: "Cuộc Đối thoại"
 astral_rift.730.desc.1: "Lại vài tuần nữa trôi qua.\n\nTrong khoảng thời gian đó, chúng ta đã học được cách giao tiếp với thực thể này một cách không hoàn chỉnh, chúng ta gọi nó là “Người Viết Lách”. Cuộc giao tiếp này vô cùng khó khăn, nhưng thái độ của Người Viết Lách đã khơi dậy sự tò mò và ngạc nhiên trong chúng ta.\n\nĐể không làm lộn xộn khu vực xung quanh chúng ta, sau mỗi cuộc đối thoại, mỗi một ký hiệu mà tác giả “vẽ” ra đều bị xóa đi, điều này đã trở thành một thông lệ."
 astral_rift.730.desc.2: "Cuộc đối thoại giữa chúng ta và Người Viết Lách đã kéo dài một khoảng thời gian, và cuối cùng xuất hiện một từ: §E“Quà tặng.”§!\n\nNgay sau đó, một quả cầu màu vàng kim hiện ra bên cạnh phi thuyền của chúng ta. Vật thể này thể hiện hoàn toàn khác biệt so với các ký hiệu trước đó, và có thể được mang lên tàu một cách bình thường. Đây cũng là thông điệp cuối cùng mà chúng ta nhận được từ thực thể này.\n\nVật liệu cấu tạo nên nó chứa đựng một lượng thông tin đồ sộ, các nhà khoa học của chúng ta sẽ cần phải mất nhiều năm trời mới có thể hiểu được trọn vẹn."
 astral_rift.730.desc.gestalt: "$astral_rift.730.desc.1$\n\n$astral_rift.730.desc.2$"
 astral_rift.730.desc.default: "$astral_rift.730.desc.1$\n\n$astral_rift.730.desc.2$"
 astral_rift.730.a: "Quả là một trải nghiệm kỳ diệu..."
 ###############
 #The Advisor #
 ###############
 astral_rift_advisor: "Người Cố vấn"
 astral_rift.800.name: "Địa điểm Quen thuộc"
 astral_rift.800.desc: "Chúng ta đã tiến vào một hệ sao gần như giống hệt với §Y[This.System.GetName]§!, chính là nơi chúng ta đã tiến vào vết nứt.\n\nBan đầu chúng ta không chắc chắn lắm về việc liệu mình đã thực sự đến một nơi mới hay chưa, nhưng cảm biến đã phát hiện ra một hành tinh chưa từng được biết đến trước đây đang quay quanh [This.System.Star.GetName].\n\nKhông lâu sau, chúng ta đã đụng độ một thiết bị cơ khí, nó tự động tiến vào phạm vi của cảm biến. Nó kết nối trơn tru với hệ thống liên lạc của quả cầu, và tự xưng là “người cố vấn” RIV của chúng ta.\n\nKhi chúng ta đang mải mê suy nghĩ về việc làm thế nào để miêu tả lại cuộc gặp gỡ này trong bản báo cáo, nó dường như đã đọc được suy nghĩ của chúng ta: §E“Bạn có cần tôi giúp viết báo cáo không?”§!"
 astral_rift.800.a: "Tìm kiếm sự trợ giúp."
 astral_rift.800.b: "Tắt nó đi."
 astral_rift.805.name: "Trợ thủ Đắc lực"
 astral_rift.805.desc: "Chúng ta đã yêu cầu cỗ máy này chia sẻ kiến thức với chúng ta.\n\nNó có vẻ rất hài lòng với mọi yêu cầu mà chúng ta đưa ra. Tuy nhiên, chúng ta nhanh chóng nhận ra rằng những câu hỏi và câu trả lời của nó thật sự vô cùng tẻ nhạt:\n\n§E“Bạn có muốn biết bầu khí quyển của hành tinh là gì không?”§!\n\n§E“Ở trung tâm của mọi hệ sao đều có một ngôi sao, chúng sáng chói lọi luôn!”§!\n\n§E“Tuổi thọ trung bình của Tiyanki Chúa dài hơn con đực gấp mười lần cơ đấy.”§!"
 astral_rift.805.a: "Tìm kiếm thêm sự giúp đỡ.\n"
 astral_rift.805.b: "Tắt nó đi."
 astral_rift.810.name: "Không thể Tắt Nguồn"
 astral_rift.810.desc: "Chúng ta cố gắng tắt cỗ máy này đi, nhưng lại vấp phải sự phản kháng của nó.\n\nÁnh sáng phát ra từ đèn LED của nó vốn dĩ là một màu xanh dịu nhẹ, nay đã chuyển sang một màu đỏ đầy hiểm ác.\n\nTôi không chắc chắn cỗ máy này có được trang bị hệ thống vũ khí nào hay không (rõ ràng là người cố vấn trong không gian của chúng ta sẽ không bao giờ được thiết kế như vậy), nhưng nếu có thì chúng ta đang gặp rắc rối lớn rồi.\n\n§E“Nếu chấm dứt chương trình này, tất cả các sinh vật khác sẽ trở nên vô tri. Kiến thức phải luôn luôn ở trong tầm tay. Nếu chểnh mảng trong vấn đề này, bạn sẽ bị vô hiệu hóa. Đây là một điều cần thiết.”§!\n\nCỗ máy này bắt đầu phát ra những tiếng vo ve u ám."
 astral_rift.810.a: "Hãy xoa dịu nó một chút."
 astral_rift.810.b: "Giải phóng xung điện từ."
 astral_rift.815.name: "Sự “Trợ giúp” Đi xa hơn"
 astral_rift.815.desc: "Người cố vấn cơ khí này đã nhanh chóng gia tăng cường độ và tốc độ đưa ra những lời khuyên của mình.\n\nNó quả thực... vô cùng lôi cuốn.\n\nBạn có biết rằng nếu chúng ta cần thêm khoáng sản, chúng ta có thể xây dựng các khu khai thác không? Có quá nhiều kiến thức, trong khi thời gian lại quá đỗi eo hẹp.\n\n[Leader.GetName] đã quyết định ở lại để học hỏi nhiều nhất có thể."
 astral_rift.815.a: "Khoan đã, mau quay lại đây!"
 astral_rift.820.name: "Xung Điện từ"
 astral_rift.820.desc.1: "Để bảo vệ các thành viên phi hành đoàn, chúng ta không còn lựa chọn nào khác ngoài việc tiêu hao phần lớn năng lượng dự trữ của tàu, để giải phóng ra một luồng xung điện từ cực mạnh.\n\nThiết bị này ngay lập tức bị ảnh hưởng, nhưng vẫn cố gắng rít lên những âm thanh chói tai để phát ra một thông điệp lộn xộn cuối cùng.\n\n§E“Wo wo wo wo wo...... Wo sự vô tri. Bạn đã lựa chọn §Y<không nghe rõ>§! sự ngu muội...... Thật sự làm cho người ta phải thất vọng.”§!"
 astral_rift.820.desc.2: "Cỗ máy đã tắt ngúm, tất cả các thành viên phi hành đoàn đều thở phào nhẹ nhõm.\n\nMọi hành động thù địch đã chấm dứt, nó hiện tại đang trôi nổi trong sự tĩnh lặng hoàn toàn ở khoảng cách chưa tới một ngàn mét so với quả cầu.\n\nChúng ta đã phân tích cấu trúc của nó, và phát hiện ra nó được chế tạo từ những hợp kim cực kỳ quý giá cùng một lõi máy tính được gia cố bằng công nghệ tiên tiến bậc nhất.\n\nChúng ta phỏng đoán rằng, nếu lõi máy tính này không bị phá hủy, chúng ta hoàn toàn có thể tìm ra phương pháp để phục hồi lại hệ thống đã bị hư hại."
 astral_rift.820.desc.default: "$astral_rift.820.desc.1$\n\n$astral_rift.820.desc.2$"
 astral_rift.820.desc.human: "$astral_rift.820.desc.1$\n\n§E“Hòa hòa hòa hòa hòa giống như tất cả những người trước đây, bạn đã được định sẵn là phải học lại một số thứ cần thiết.”§!\n\n$astral_rift.820.desc.2$"
 astral_rift.820.a: "Thử sửa chữa phần lõi."
 astral_rift.820.b: "Phá hủy cỗ máy này hoàn toàn."
 astral_rift.825.name: "Tháo dỡ Cỗ máy"
 astral_rift.825.desc: "Chúng ta đã tháo tung cỗ máy này ra thành từng mảnh vụn.\n\nBất kể ai là người đã chế tạo ra nó (giả sử nó là sản phẩm nhân tạo), thì người đó chắc chắn phải sở hữu một kỹ thuật chế tác cực kỳ siêu việt: Cho dù chúng ta có sử dụng phương pháp hay công cụ nào đi chăng nữa, thì cho đến hiện tại chúng ta vẫn chưa thể nào tháo dỡ được phần lõi máy tính của nó. Dù vậy, chúng ta vẫn có thể truy cập vào cơ sở dữ liệu của nó. Phần lớn thông tin trong cơ sở dữ liệu đều là những thứ vô bổ, nhưng kiến trúc mã hóa cơ bản của nó lại giúp chúng ta hiểu sâu hơn về khoa học máy tính."
 astral_rift.825.a: "Cũng tốt."
 astral_rift.830.name: "Tạ ơn Trời đất"
 astral_rift.830.desc: "Chúng ta đã chịu đựng quá đủ cỗ máy phiền phức này rồi.\n\nChúng ta đã gài một thiết bị nổ vào trong lõi của nó, và chuẩn bị sẵn sàng cho quả cầu thực hiện thao tác kéo dây neo.\n\nỞ một khoảng cách an toàn, chúng ta thở phào nhẹ nhõm khi chứng kiến các bộ phận của cỗ máy này vỡ vụn và trôi dạt vào hư không sau vụ nổ.\n\nLần theo những tàn tích của nó, chúng ta đã phát hiện ra một lượng lớn vật chất cõi sao bất thường, coi như là một sự đền bù xứng đáng cho những rắc rối vừa qua."
 astral_rift.830.a: "Tạ ơn Trời đất."
 astral_rift.840.name: "[Owner.GetScientistCapital] Quay về"
 astral_rift.840.desc.1: "[Leader.GetName] đã trở về sau chuyến du hành qua vết nứt cõi sao của [Leader.GetHisHer].\n\n[Root.Leader.GetHeShe] đột ngột xuất hiện trên một chiếc tàu khoa học của chúng ta mà không có bất kỳ một dấu hiệu báo trước nào, và trở lại với công việc như không có chuyện gì xảy ra. Tuy nhiên, chúng ta nhanh chóng nhận ra sự khác biệt của [Leader.GetHeShe]: [Leader.GetHisHer] đã bị mắc kẹt giữa các dòng thời gian, khiến cho tuổi tác trở nên không thể xác định.\n\nCó lẽ kết quả là [Leader.GetHeShe] còn thu nhận được một vài năng lực mới."
 astral_rift.840.desc.default: "$astral_rift.840.desc.1$\n\n[Leader.GetName] đã nảy sinh một sự chán ghét mãnh liệt đối với mọi hình thức tài liệu hướng dẫn, và sẽ làm việc với một mức độ ngẫu hứng cao hơn nhiều."
 astral_rift.840.desc.gestalt: "$astral_rift.840.desc.1$"
 astral_rift.845.name: "VIR"
 astral_rift.845.desc.disabled: "§E“Cảm biến của tôi nhận định rằng bạn đang cần sự trợ giúp. Bạn có muốn khởi động lại phần hướng dẫn tân thủ không?”§!"
 astral_rift.845.desc.enabled: "§E“Bạn sẽ không tắt nguồn của tôi đi đâu, đúng không?”§!"
 astral_rift.845.shutdown: "Tắt máy"
 astral_rift.845.b: "Đúng là như vậy!"
 astral_rift.845.c: "Đương nhiên là không rồi."
 ##############
 #The Vortex #
 ##############
 vortex_fuel_modifier: "Nhiên liệu Cực điểm"
 astral_rift_vortex: "Cực điểm"
 astral_rift.900.name: "Cực điểm"
 astral_rift.900.desc.1: "Chúng ta đã tiến vào bên trong một vùng nhiễu loạn cuồng bạo.\n\nCửa sổ quan sát của chúng ta đã bị che khuất hoàn toàn bởi những gợn sóng của một luồng chất khí không xác định.\n\nChúng ta đã thu thập được một lượng nhỏ mẫu khí quyển, nhưng kết quả mỗi lần phân tích lại hoàn toàn khác biệt so với lần trước. Chúng ta không chắc liệu có phải do thiết bị của mình gặp trục trặc, hay do bản thân vật liệu này tồn tại một yếu tố không ổn định nào đó."
 astral_rift.900.desc.2: "Một đặc điểm bất biến mà chúng ta tìm thấy trong mẫu vật này là nó chứa một lượng lớn vật chất cõi sao một cách bất thường.\n\nChúng ta tình cờ phát hiện ra rằng, chỉ cần một sự thay đổi nhiệt độ nhỏ nhất cũng có thể tác động mạnh mẽ đến thành phần của nó. Chúng ta đã đặt nó vào trong một thùng chứa cách ly, để chờ tiến hành nghiên cứu chuyên sâu hơn về hiện tượng này."
 astral_rift.900.desc.default: "$astral_rift.900.desc.1$\n\n§Y$tech_rift_sphere$§! của chúng ta đang rung lắc dữ dội, khiến nhiều thành viên phi hành đoàn bắt đầu cảm thấy khó chịu.\n\n$astral_rift.900.desc.2$"
 astral_rift.900.desc.gestalt: "$astral_rift.900.desc.1$\n\n$astral_rift.900.desc.2$"
 astral_rift.900.a: "Tiếp tục tiến lên."
 astral_rift.900.b: "Thử đốt nó bằng lửa trần xem sao."
 astral_rift.905.name: "Tiếp tục Tiến lên"
 astral_rift.905.desc: "Lấy điểm tiến vào mà chúng ta đã ghi lại làm mốc tham chiếu, chúng ta tiếp tục dấn sâu vào bên trong vùng xoáy nước khổng lồ này. Khi chúng ta đẩy §Y$tech_rift_sphere$§! đến giới hạn của nó, hệ số ma sát thấp của nó quả thực đã phát huy tác dụng to lớn trong việc chống lại những tác hại từ môi trường khắc nghiệt này, và chúng ta gọi đây là “Gió bão”.\n\nNếu điều kiện không thay đổi, chúng ta sẽ tiếp tục tiến lên, trừ phi gặp phải một thứ gì đó buộc chúng ta phải sơ tán."
 astral_rift.905.a: "Cẩn thận tiến lên..."
 astral_rift.910.name: "Thử nghiệm Tiếp xúc với Lửa trần"
 astral_rift.910.desc.1: "Chúng ta liên tục truyền thêm nhiệt lượng vào dung dịch, cho đến khi chúng ta chắc chắn rằng ngay cả lửa trần cũng chỉ có thể làm rối loạn trạng thái cân bằng hóa học vốn dĩ không ổn định của nó.\n\nPhát hiện của chúng ta mang tính cách mạng.\n\nChúng ta hoàn toàn tin tưởng rằng mình có thể áp dụng khám phá này để tạo ra một cuộc cách mạng trong sự hiểu biết về lực đẩy tàu vũ trụ và hoạt động sản xuất năng lượng đa dụng."
 astral_rift.910.desc.default: "Đây là một đề xuất đầy rủi ro, nhưng chúng ta đã nghiêm chỉnh tuân theo mệnh lệnh.\n\nBất chấp sự phản đối của một vài thành viên phi hành đoàn, chúng ta đã cho mẫu vật tiếp xúc trực tiếp với ngọn lửa.\n\n$astral_rift.910.desc.1$"
 astral_rift.910.desc.gestalt: "Chúng ta đã để mẫu vật tiếp xúc trực tiếp với ngọn lửa.\n\n$astral_rift.910.desc.1$"
 astral_rift.915.name: "Tai họa"
 astral_rift.915.desc.default: "Chúng ta đã mất liên lạc với đội nghiên cứu.\n\nTheo đúng quy trình tiêu chuẩn, chúng ta đã thu hồi dây neo và kéo §Y$tech_rift_sphere$§! về.\n\nThật không may, những gì chúng ta tìm thấy chỉ là thi thể cháy đen của toàn bộ phi hành đoàn.\n\nĐáng chú ý là, bầu không khí bên trong toàn bộ con tàu tràn ngập vật chất cõi sao với nồng độ cao."
 astral_rift.915.desc.gestalt: "Chúng ta đã mất liên lạc với [explorer.GetIndividualNamePlural].\n\nTheo đúng quy trình tiêu chuẩn, chúng ta đã thu hồi dây neo và kéo §Y$tech_rift_sphere$§! về.\n\nThật không may, những gì chúng ta tìm thấy chỉ là những tàn tích cháy đen.\n\nĐáng chú ý là, bầu không khí bên trong toàn bộ con tàu tràn ngập vật chất cõi sao với nồng độ cao."
 astral_rift.920.name: "Tiến sâu hơn"
 astral_rift.920.desc.1: "Chúng ta hiện đã đặt chân đến một khu vực hoàn toàn êm đềm.\n\n§Y$tech_rift_sphere$§! của chúng ta dường như hoàn toàn không chịu bất kỳ tác động nào từ trọng lực tại đây, và cũng chẳng có bất cứ lực ma sát nào. Trái ngược hoàn toàn với những gì vừa trải qua, chúng ta hiện đang trôi nổi trong một môi trường chân không tuyệt đối. Chớp lấy cơ hội này, các lớp lưới thép đã thực hiện những công đoạn sửa chữa cần thiết đối với những thiệt hại phải gánh chịu trong cơn bão.\n\nGiờ đây, chúng ta có thể thong thả ngoái nhìn lại phía sau, quan sát “bức tường” của cơn bão, và đã có một buổi quan sát trọn vẹn suốt cả một ngày dài.\n\nĐó là một hệ sao không ngừng va chạm lẫn nhau... hay nói đúng hơn, nó chính là toàn bộ ngân hà. Quả thực chúng ta đã tận mắt chứng kiến sự hủy diệt trên quy mô lớn của các thiên thể trong toàn vũ trụ. Chúng xoay tròn, va chạm, phát nổ, để lại những đám mây nguyên tố với đủ mọi kích cỡ. Việc chúng ta có thể sống sót sau thảm họa đó chắc chắn là nhờ vào một sự may mắn vô cùng tận.\n\nChúng ta không thể xác định được cơn bão này đã ấp ủ trong bao lâu. Sự hiện diện của các hành tinh có kích thước chuẩn cho thấy đây là một hiện tượng tương đối mới xảy ra, nếu hiện tượng này kéo dài, thì chắc chắn sẽ chẳng còn sót lại gì ngoài cát bụi."
 astral_rift.920.desc.default: "Thật kinh ngạc khi chúng ta có thể vượt qua cơn bão một cách an toàn.\n\n$astral_rift.920.desc.1$"
 astral_rift.920.desc.gestalt: "Chúng ta đã vượt qua cơn bão.\n\n$astral_rift.920.desc.1$"
 astral_rift.920.a: "Tiếp tục khám phá về phía tâm bão."
 astral_rift.925.name: "Chạm trán"
 astral_rift.925.desc.1: "Hành trình khám phá về phía tâm “mắt” bão của chúng ta diễn ra vô cùng bình lặng.\n\nTuy nhiên, chúng ta có chút e ngại rằng mình sẽ không thể nào quay trở về một cách an toàn. Cơn bão bên ngoài đang ngày càng mạnh lên, theo như tính toán, bất kể dây neo có được thu hồi nhanh đến đâu, §Y$tech_rift_sphere$§! của chúng ta gần như không thể nào giữ được nguyên vẹn.\n\nHiện tại đây không phải là vấn đề khiến chúng ta bận tâm nhất.\n\nChúng ta đã phát hiện ra có một thứ gì đó đang tồn tại trong không gian yên bình ở khu vực trung tâm này. Hoặc chính xác hơn là hai “thứ gì đó”.\n\nĐầu tiên là một thiết bị."
 astral_rift.925.desc.2: "Chúng ta không hoàn toàn chắc chắn rằng liệu mình có thể quan sát được mọi khía cạnh của vật thể này hay không. Có rất nhiều hình dạng hình học của nó phân rã thành những họa tiết vụn vặt, tan biến vào một điểm, nên rất khó để miêu tả chi tiết cấu trúc của thứ này rốt cuộc trông như thế nào. Chúng ta tin rằng nó là một cỗ máy chứ không phải một dạng sống nào đó. Hơn nữa, ở đây còn có một vật thể khác.\n\nCó một thứ gì đó đang vận hành thiết bị này.\n\nCả hai rõ ràng là những cá thể hoàn toàn tách biệt. Nó nhảy múa và lướt đi trên bề mặt của cỗ máy một cách dễ dàng đến khó tin. Nếu như có những nút bấm trên thiết bị này, thì hẳn nó đang ấn vào những nút bấm đó. Tuy nhiên, tất cả chúng ta đều dám chắc rằng trên đó không hề có nút bấm nào. Hình thù khổng lồ kia đang kéo ra và đẩy vào theo mệnh lệnh của sự sống.\n\nChúng ta có cảm giác nó chưa nhận ra sự hiện diện của chúng ta, và dường như đã hoàn toàn chìm đắm vào hoạt động hiện tại của mình."
 astral_rift.925.desc.default: "$astral_rift.925.desc.1$\n\nBản chất của nó là điều không thể nào thấu hiểu được. $astral_rift.925.desc.2$"
 astral_rift.925.desc.gestalt: "$astral_rift.925.desc.1$\n\nĐối với toàn bộ tri thức của phi hành đoàn chúng ta, bản chất của nó là điều không thể nào thấu hiểu được. $astral_rift.925.desc.2$"
 astral_rift.925.a: "Bật đèn sáng lên."
 astral_rift.925.b: "Quan sát."
 astral_rift.930.name: "Ánh đèn Nhấp nháy"
 astral_rift.930.desc: "Chúng ta đã thu hút được sự chú ý của nó, và sau đó duy trì trạng thái cảnh giác cao độ.\n\nChúng ta đã nháy sáng một loạt các đèn trong mọi phổ ánh sáng có thể sử dụng được. Chúng ta kích xung cho chúng theo một mô hình nhị phân đơn giản, nhằm truyền tải một dạng ý định nào đó.\n\nSinh vật đó ngừng việc thao tác thiết bị, và co cụm lại thành một hình cầu tròn trịa hoàn hảo, tăm tối đến mức tuyệt đối.\n\nChúng ta suy đoán rằng, có thể nó đang bắt chước chúng ta.\n\nChúng ta nhận thấy, ngay khi nó ngừng việc kéo và đẩy cỗ máy, cường độ cơn bão xung quanh chúng ta đã giảm đi. Chúng ta dự đoán, nó sẽ đạt đến một trạng thái dừng lại hoàn toàn chỉ trong vỏn vẹn vài ngày. Sau đó, rất có thể nó sẽ sụp đổ vào trong.\n\nChúng ta luôn trong tư thế sẵn sàng để thu hồi dây neo."
 astral_rift.930.a: "Hễ có dấu hiệu bất thường là lập tức sơ tán..."
 astral_rift.935.name: "Quan sát"
 astral_rift.935.desc.1: "Tất cả chúng ta đều đồng tình rằng việc không chọc ngoáy thực thể này là một quyết định sáng suốt.\n\nKhả năng vận hành thiết bị này của nó vượt quá sức tưởng tượng của chúng ta.\n\nMặc dù vẫn rất khó để có thể tính toán được kích thước của nó, nhưng chúng ta có thể khẳng định rằng một phần của nó cũng đã ngang ngửa với kích thước của toàn bộ dải ngân hà mà chúng ta đã biết. Điều kỳ lạ là nó không hề tạo ra bất kỳ lực hấp dẫn nào lên chúng ta.\n\nChúng ta bắt đầu tin rằng sinh vật này có thể chỉ tồn tại một phần trong không gian đa chiều này, và những gì chúng ta đang quan sát chỉ là những phần phụ của nó. Giống như [explorer.GetSpeciesHandName] đang nhúng vào một vũng nước vậy.\n\nViệc quan sát thụ động của chúng ta đã làm nảy sinh một số câu hỏi khoa học quan trọng, chắc chắn sẽ"
 astral_rift.935.desc.2: "nếu bản báo cáo này có thể được phê duyệt."
 astral_rift.935.desc.default: "$astral_rift.935.desc.1$ làm những bộ óc vĩ đại nhất trong đế chế của chúng ta phải vò đầu bứt tai trong một khoảng thời gian dài, $astral_rift.935.desc.2$"
 astral_rift.935.desc.gestalt: "$astral_rift.935.desc.1$ mang lại lợi ích to lớn cho đế chế của chúng ta, $astral_rift.935.desc.2$"
 astral_rift.935.a: "Quan sát một cách cẩn thận."
 astral_rift.940.name: "Bỗng dưng Biến mất"
 astral_rift.940.desc.1: "Nó bỗng nhiên biến mất tăm.\n\nSinh vật này hoàn toàn bốc hơi, chỉ để lại thiết bị này.\n\nCơn bão xung quanh chúng ta đã suy yếu đến mức có thể điều hướng an toàn, và mức độ tàn phá của vũ trụ này thực sự khiến người ta phải kinh ngạc."
 astral_rift.940.desc.2: "Thực thể kia đã rời đi, có lẽ chúng ta đã có thể tiếp cận thiết bị đó.\n\nVật liệu chế tạo nên nó không thể bị nghiền nát hay cắt đứt bằng bất kỳ loại thiết bị nào đã biết. Tuy nhiên, trên lớp vỏ của nó có một số cơ chế từ tính bên ngoài, mỗi cơ chế đều xoay với tốc độ cực cao. Một trong số đó có vẻ như đã bị lỏng, mặc dù các điều kiện để quay về có thể bị hạn chế, nhưng chúng ta vẫn có thể đưa nó lên tàu để tiến hành nghiên cứu sâu hơn.\n\nBất kể được đặt trên bề mặt nào, thiết bị này cũng sẽ xoay với tốc độ rất cao, trọng tâm và động lượng của nó giúp nó có thể giữ thăng bằng thẳng đứng rất dễ dàng. Chúng ta không phát hiện ra nguồn điện bên trong, và tin rằng đây rất có thể là một minh chứng tuyệt vời cho một động cơ vĩnh cửu thực sự."
 astral_rift.940.desc.spiritualist: "$astral_rift.940.desc.1$\n\nChúng ta hy vọng nó đã tìm thấy con đường dẫn đến sự bình yên vĩnh cửu.\n\n$astral_rift.940.desc.2$"
 astral_rift.940.desc.default: "$astral_rift.940.desc.1$\n\n$astral_rift.940.desc.2$"
