l_simp_chinese:
 ####################################
 # Phân loại Bất thường
 ####################################
 rogue_moon_category: "Vệ tinh lang thang"
 rogue_moon_category_desc: "Kết quả quét sơ bộ cho thấy [Root.GetName] có sự khác biệt đáng kinh ngạc so với hành tinh mẹ của nó."
 hollow_planet_category: "Hành tinh rỗng ruột"
 hollow_planet_category_desc: "Quét sơ bộ cho thấy [Root.GetName] không khác gì một lớp vỏ rỗng. Chúng tôi nghi ngờ hành tinh này là một sản phẩm nhân tạo, hoặc là một hành tinh bình thường đã bị đục khoét vì lý do nào đó."
 strong_magnetic_category: "Từ trường cực mạnh"
 strong_magnetic_category_desc: "Quét sơ bộ [Root.GetName] không phát hiện được gì nhiều, nhưng điểm khác biệt duy nhất là một từ trường cực mạnh đang bao quanh nó."
 undiscovered_planetary_modifier_category: "Hiện tượng bất thường"
 undiscovered_planetary_modifier_category_desc: "Điều tra môi trường bất thường của [From.GetName]."
 ####################################
 # Sự kiện Bất thường
 ####################################
 anomaly.6000.name: "Vệ tinh lang thang"
 #"hành tinh mẹ" và "thiên thể chủ của nó", đang chờ cập nhật khóa dịch PARENTPLANET
 anomaly.6000.desc: "Cấu tạo vật chất của [From.GetName] không giống với hành tinh mẹ, điều này chứng tỏ ban đầu nó là một tiểu hành tinh lang thang bị trường trọng lực khổng lồ của hành tinh mẹ hiện tại thu hút. Nghiên cứu sâu hơn sẽ tiết lộ nó đến từ đâu."
 anomaly.6001.desc: "Có một căn cứ bên trong [From.GetName]!"
 anomaly.6002.name: "Hành tinh rỗng ruột"
 anomaly.6002.desc: "Sau khi nghiên cứu kỹ lưỡng, chúng tôi xác định [From.GetName] là một sản phẩm nhân tạo. Nguyên lý đại khái là: [From.GetName] vốn là một vành đai tiểu hành tinh bình thường, bị ai đó dùng cách nào đó gom lại một chỗ, sau khi khai thác hết tài nguyên cần thiết, họ đã cải tạo nó thành một khối cầu rỗng."
 anomaly.6003.desc: "Ngoài dự đoán, [From.GetName] ban đầu có sự sống, nhưng tại một thời điểm nào đó, không rõ công nghệ khai thác mỏ nào đã khiến toàn bộ hành tinh bị đào rỗng, khiến [From.GetName] chỉ còn lại một lớp vỏ."
 anomaly.6004.name: "Từ trường cực mạnh"
 anomaly.6004.desc: "Quét sơ bộ [From.GetName] không thấy gì nhiều, ngoại trừ việc nó được bao quanh bởi một từ trường mạnh bất thường. Điều này gây nhiễu cho việc quét sâu cho đến khi [Root.GetName] tiến lại gần quan sát mới giải mã được. Từ trường dường như bắt nguồn từ các quặng kim loại mật độ cao trong lớp vỏ, đây sẽ là một tin mừng cho ngành khai thác mỏ tại đây."
 anomaly.6005.name: "Hiện tượng bất thường"
 anomaly.6005.desc: "Kết quả quét cho thấy [From.GetName] vô cùng khác lạ, cần phải tiến hành quan sát ở cự ly gần."
 anomaly.6006.name: "Hiện tượng bất thường"
 anomaly.6006.desc: "Quá trình quét [From.GetName] đã hoàn tất, chuyên viên khoa học [Root.GetLeaderName] đã chuẩn bị một bản báo cáo về những hiện tượng bất thường tại đây."
 anomaly.6006.a: "Mời báo cáo, [Root.GetLeaderName]."
 anomaly.6007.name: "Khoáng sản phong phú"
 anomaly.6007.desc: "Lớp vỏ của [From.From.GetName] có trữ lượng khoáng sản phong phú và dễ khai thác, điều này sẽ biến ngành mỏ tại đây trở thành một lĩnh vực hái ra tiền."
 anomaly.6008.desc: "Mẫu hình thời tiết trên [From.From.GetName] rất khó lường, các cơn bão thường xuyên hình thành đột ngột và gây hư hại nghiêm trọng cho bề mặt. Xây dựng các nhà máy điện gió tại đây có thể cung cấp nguồn năng lượng dồi dào."
 anomaly.6009.desc: "Hành tinh [From.From.GetName] là nơi sinh sống của các loài động vật cực kỳ hung dữ, khắp nơi trên mặt đất là những kẻ săn mồi hiểm độc đang chờ đợi một bữa ăn no nê. Cấu tạo sinh học của chúng là đối tượng nghiên cứu vô cùng quý giá."
 anomaly.6010.desc: "Mặc dù [From.From.GetName] có thể cư trú, nhưng nó hầu như không có từ trường, do đó không thể chống lại bức xạ vũ trụ."
 anomaly.6011.desc: "Nhờ trữ lượng quặng kim loại dồi dào, [From.From.GetName] có từ trường cực kỳ mạnh. Điều này sẽ gây nhiễu cho nhiều thiết bị và máy tính của chúng ta, nhưng sản lượng khoáng sản bù lại là quá đủ."
 anomaly.6012.desc: "Cấu tạo địa tầng của [From.From.GetName] rất không ổn định, động đất mạnh và hoạt động núi lửa xảy ra thường xuyên. Nhờ vậy mà các khoáng sản quý hiếm thường lộ ra ngay trên bề mặt."
 anomaly.6013.desc: "Ngày và đêm trên [From.From.GetName] chia làm hai nửa, nghĩa là một mặt luôn là ban ngày vĩnh cửu và mặt kia luôn là đêm trường. Nếu có sự sống tồn tại, chúng hẳn sẽ bị giới hạn trong vùng rạng đông nằm giữa hai mặt."
 anomaly.6014.desc: "[From.From.GetName] dường như từng là một hành tinh khí khổng lồ, nhưng vì nằm quá gần ngôi sao chủ, bầu khí quyển của nó đã bị đốt cháy hoàn toàn từ lâu. Phần còn lại hiện giờ là một lõi kim loại mật độ cao, giàu khoáng sản."
 anomaly.6015.desc: "Quỹ đạo của [From.From.GetName] rải rác các tiểu hành tinh, thiên thạch và sao chổi. Các vụ va chạm lớn xảy ra với tần suất đáng kinh ngạc. Nhưng điều này cũng mang lại những kho báu khoáng sản quý giá cho nơi đây."
 anomaly.6016.desc: "[From.From.GetName] sở hữu số lượng vệ tinh tự nhiên khổng lồ. Hàng trăm vệ tinh lớn nhỏ quay quanh hành tinh, nhiều chiếc trong số đó chứa đựng lượng khoáng sản giá trị."
 anomaly.6017.desc: "Dữ liệu cho thấy [From.From.GetName] cấu tạo chủ yếu từ carbon, cùng một lượng nhỏ oxy. Nơi đây không chỉ giàu khoáng sản mà các đợt phun trào núi lửa thường xuyên còn đưa kim cương từ lòng đất lên bề mặt."
 anomaly.6018.desc: "Những cơn bão sét lớn thường xuyên phá hủy bầu khí quyển của [From.From.GetName]. Dù cư dân chẳng mấy vui vẻ gì với điều này, nhưng nó lại mang đến vô số cơ hội nghiên cứu."
 anomaly.6019.desc: "Mật độ của [From.From.GetName] thấp một cách kỳ lạ, vì vậy so với các hành tinh cùng kích thước, trọng lực của nó nhỏ hơn nhiều."
 anomaly.6020.desc: "Mật độ của [From.From.GetName] cực cao, dẫn đến lực hấp dẫn rất mạnh. Tuy nhiên, trữ lượng kim loại nặng tại đây lại rất có ích cho nghiên cứu vật lý."
 anomaly.6021.desc: "[From.From.GetName] hoặc là một sản phẩm nhân tạo, hoặc đã bị đào rỗng theo cách nào đó. Nguyên nhân và phương thức vẫn chưa rõ ràng, nhưng việc điều tra chắc chắn sẽ mang lại những khám phá gây kinh ngạc."
 anomaly.6022.desc: "Khoáng sản dồi dào trên bề mặt [From.From.GetName] cực kỳ dễ khai thác, đây là một cơ hội ngàn năm có một cho ngành mỏ."
 anomaly.6023.desc: "Đến nay vẫn chưa rõ [From.From.GetName] vốn dĩ đã như vậy, hay có loài sinh vật nào đó từng đến đây vơ vét sạch tài nguyên. Dù thế nào, rõ ràng là hành tinh này hiện chẳng còn chút khoáng sản nào."
 anomaly.6024.desc: "Các dạng sống trên [From.From.GetName] đều có kích thước khổng lồ, ngay cả những loài không hung dữ cũng rất nguy hiểm, chưa nói đến những kẻ săn mồi to lớn kia. Nếu các nhà khoa học đủ dũng cảm để thử nghiệm, nơi đây thực sự là một kho tàng dữ liệu nghiên cứu."
 anomaly.6025.desc: "Có lẽ một vệ tinh nào đó của [From.From.GetName] đã bị hủy diệt trong một thảm họa, hoặc các mảnh vỡ trên quỹ đạo của nó ngay từ đầu đã không thể hợp nhất. Dù nguyên nhân là gì, hành tinh này hiện được bao quanh bởi một vành đai tiểu hành tinh."
 anomaly.6026.desc: "Phong cảnh [From.From.GetName] đâu đâu cũng đẹp như tranh vẽ, cư dân trên hành tinh luôn không ngừng tìm thấy những kỳ quan thiên nhiên mới."
 anomaly.6027.desc: "Bầu khí quyển của [From.From.GetName] dường như có thành phần khiến mọi người nảy sinh ham muốn duy trì nòi giống. Chẳng cần nói nhiều, điều này khiến quá trình đổ bộ điều tra trở nên khá ngượng ngùng."
 anomaly.6028.desc: "Không khí trên [From.From.GetName] chứa các chất gây ảo giác tự nhiên. Thành phần này khiến con người hưng phấn, dường như còn giúp các nhà khoa học cụ thể hóa nhiều bài toán vật lý trừu tượng. Nhưng nó cũng khiến mọi người xao nhãng khỏi các công việc khác."
 anomaly.6029.desc: "[From.From.GetName] tràn đầy sức sống, chủng loại động thực vật phong phú, sinh trưởng nhanh chóng và tươi tốt."
 anomaly.6030.desc: "Sự sống trên [From.From.GetName] rất gian nan. Dù một số loài vẫn kiên cường bám trụ, chúng đều nhỏ bé và yếu ớt."
 anomaly.6031.desc: "Từ rất lâu trước đây, thảm họa đã giáng xuống [From.From.GetName] và để lại lượng bức xạ cực mạnh. Theo thời gian, nơi này có thể sẽ trở nên phù hợp để cư trú trở lại, nhưng hiện tại nó vẫn là một vùng đất chết."
 anomaly.6660.desc.start: "Tàu khoa học của chúng ta sau khi quét bề mặt [From.GetName] đã phát hiện một số hiện tượng bất thường."
 anomaly.6660.desc.default: "$anomaly.6660.desc.start$Môi trường của [From.GetName] hoàn toàn đảo lộn nhận thức của chúng ta.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.weather: "$anomaly.6660.desc.start$Những cơn bão dữ dội tấn công [From.GetPlanetMoon] không ngừng nghỉ, điều này giúp ích cho việc nghiên cứu và khai thác tài nguyên, nhưng lại hạn chế sự phát triển dân số.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.magnetic: "$anomaly.6660.desc.start$Từ trường của [From.GetPlanetMoon] vượt xa các thiên thể cùng loại.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.tectonic: "$anomaly.6660.desc.start$Đặc điểm tự nhiên không ổn định của [From.GetPlanetMoon] khiến động đất và núi lửa phun trào trở thành chuyện cơm bữa.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.tidal: "$anomaly.6660.desc.start$[From.GetPlanetMoon] không tự quay, nghĩa là hai nửa hành tinh lần lượt là ngày vĩnh cửu và đêm vĩnh cửu. Không phải là môi trường sống lý tưởng.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.tidal_mach: "$anomaly.6660.desc.start$Quỹ đạo của [From.GetPlanetMoon] quanh ngôi sao chủ bị khóa, nghĩa là mỗi mặt có ngày đêm cố định. Khả năng cư trú đối với các sinh vật hữu cơ là không mấy lý tưởng.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.impacts: "$anomaly.6660.desc.start$[From.GetPlanetMoon] đang phải hứng chịu những đợt mưa thiên thạch liên tục, bề mặt loang lổ như vừa trải qua một cuộc oanh tạc quỹ đạo.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.gravity: "$anomaly.6660.desc.start$Trọng lực của hành tinh này còn xa mới đạt mức lý tưởng để tiến hành thuộc địa hóa.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.gravity_mach: "$anomaly.6660.desc.start$Dù trọng lực hành tinh không phù hợp cho sinh vật hữu cơ, nhưng các thuật toán điều chỉnh trọng lực tiên tiến của chúng ta sẽ triệt tiêu hiệu ứng đó.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.gravity_desc_mach: "$anomaly.6660.desc.start$Dù trọng lực hành tinh không phù hợp cho sinh vật hữu cơ, nhưng các thuật toán điều chỉnh trọng lực tiên tiến của chúng ta sẽ triệt tiêu hiệu ứng đó.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.wildlife: "$anomaly.6660.desc.start$Các loài động vật trên hành tinh này cực kỳ hung hãn, làm tăng thêm không ít khó khăn cho nỗ lực thuộc địa hóa.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.titan: "$anomaly.6660.desc.start$Hành tinh này sở hữu những sinh vật khổng lồ, việc tiếp xúc với chúng có thể rất nguy hiểm.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.resources: "$anomaly.6660.desc.start$Cấu tạo nguyên tố cùng lịch sử lâu đời mang lại cho nó nguồn khoáng sản phong phú, chúng ta nên nắm bắt thời cơ để khai thác.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.beauty: "$anomaly.6660.desc.start$Cảnh quan tự nhiên của [From.GetPlanetMoon] đủ để khiến bất cứ ai cũng phải sững sờ. Với những loài có thể thích nghi, cuộc sống tại đây sẽ vô cùng thú vị.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.atmosphere: "$anomaly.6660.desc.start$Thành phần đặc biệt trong bầu khí quyển sẽ ảnh hưởng đến dân cư của chúng ta. Chúng ta nên giữ cảnh giác.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.atmosphere_mach: "$anomaly.6660.desc.start$Bầu khí quyển chứa loại khí có thể gây nhiễu hệ thần kinh của sinh vật hữu cơ.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.lush: "$anomaly.6660.desc.start$Động vật có thể sinh sôi nảy nở tại đây mà không gặp trở ngại nào, đồng thời chúng ta còn có cơ hội khai thác những tài nguyên thiết yếu.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.lush_mach: "$anomaly.6660.desc.start$Sự sinh sôi của quần thể động vật không gặp bất kỳ cản trở nào, cung cấp nhiều cơ hội để thu thập tài nguyên cần thiết cho sinh vật hữu cơ.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.terrible: "$anomaly.6660.desc.start$Môi trường tại đây vô cùng khắc nghiệt, không phù hợp để thiết lập điểm định cư.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.terrible_mach: "$anomaly.6660.desc.start$Môi trường khắc nghiệt và hoang tàn, không phù hợp cho sinh vật hữu cơ tồn tại.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.end: "Trong quá trình khám phá hành tinh mới, dĩ nhiên chúng ta sẽ gặp phải những bất trắc như thế này, và chúng ta không nên xem nhẹ tác động của nó đối với quá trình bành trướng."
 anomaly.6660.a.tooltip: "Các hiệu ứng hành tinh đã xuất hiện trên [From.GetName]."
 ####################################
 # Sự kiện Thất bại khi điều tra Bất thường
 ####################################
 anomaly_failure.6000.desc: "Không có tin tức gì đáng để báo cáo."
 anomaly_failure.6000.a: "Được rồi."
 ####################################
 # Sự kiện Thuộc địa
 ####################################
 colony_mod.1.name: "Chuyện gì đã xảy ra ở đây?"
 colony_mod.1.desc: "Rõ ràng [Root.GetName] từng hứng chịu một thảm họa để lại lượng bức xạ khổng lồ. Tuy nhiên nguyên nhân vẫn chưa rõ. Khi số lượng người định cư trên [Root.GetName] tăng lên, bí ẩn này bắt đầu khiến họ lo lắng. Suy cho cùng, nếu không biết nguyên nhân, làm sao chúng ta ngăn chặn thảm kịch lặp lại?"
 colony_mod.1.desc_mach: "Dù lượng bức xạ lớn trên [Root.GetName] rõ ràng là do một đại thảm họa trong quá khứ gây ra, chúng ta vẫn chưa xác định được nguyên nhân cụ thể, hay liệu hiện tượng này có tái diễn hay không."
 colony_mod.1.a: "Hãy làm sáng tỏ sự thật!"
 colony_mod.2.name: "Thái thản khổng lồ"
 colony_mod.2.desc: "Sinh vật bản địa trên [Root.GetName] có kích thước to lớn vượt xa mọi giới hạn sinh học có thể tưởng tượng. Các nhà nghiên cứu đặt câu hỏi: \"Tại sao chúng lại to thế? Liệu có ích gì cho chúng ta không?\" Vô số đề xuất nghiên cứu chi tiết về các sinh vật này đang được gửi đến."
 colony_mod.2.a: "Tiếp tục nghiên cứu."
 colony_mod.2.b: "Không, đừng bận tâm đến lũ quái vật đó."
 colony_mod.2.c: "Đảm bảo nghiên cứu không gây hại cho chúng."
 colony_mod.2.d: "Nghiên cứu chúng? Hãy săn đuổi chúng rồi xem có xẻ thịt lột da được gì không!"
 colony_mod.3.name: "Động đất!"
 colony_mod.3.desc: "Cấu trúc địa tầng không ổn định của [Root.GetName] lại vừa có một đợt biến động dữ dội. Báo cáo về thiệt hại của thuộc địa vừa được gửi tới."
 colony_mod.3.a: "Hãy nghe báo cáo."
 colony_mod.4.name: "Quan sát thấy sao chổi đi qua vành đai hành tinh"
 colony_mod.4.desc: "Cư dân trên [Root.GetName] đang được chứng kiến một cảnh tượng hùng vĩ. Một ngôi sao chổi đang băng qua vành đai của [Root.GetName], hiệu ứng được mô tả là \"ngoạn mục\"."
 colony_mod.4.a: "Tiếp tục hướng mắt về bầu trời!"
 colony_mod.5.name: "Thanh lọc"
 colony_mod.5.desc: "Không thể phủ nhận tác động gây hưng phấn của bầu khí quyển trên [Root.GetName] mang lại cảm giác rất dễ chịu, thậm chí có ích ở vài khía cạnh, tuy nhiên phe bảo thủ của [Root.Owner.GetName] đã liên tục gây áp lực, yêu cầu loại bỏ những loại khí có khả năng gây nghiện này."
 colony_mod.5.a: "Loại bỏ nó đi!"
 colony_mod.5.b: "Không, cứ để [Root.GetName] như nguyên trạng."
 colony_mod.6.name: "Oanh tạc"
 colony_mod.6.desc: "Sau khi điều tra kỹ lưỡng, chúng tôi kết luận rằng một sự kiện diệt chủng đã xảy ra trên [Root.GetName] vào thời viễn cổ. Hiện tại chúng tôi chắc chắn rằng vào lúc đó, cư dân bản địa trên [Root.GetName] đã sắp phát triển được khả năng du hành không gian, nhưng một chủng tộc tiên tiến hơn đột ngột xông vào hệ sao của họ, oanh tạc [Root.GetName] từ quỹ đạo rồi rời đi, để mặc những người sống sót ít ỏi chờ chết."
 colony_mod.6.a: "Nghiên cứu tàn tích cuộc oanh tạc để tìm hiểu chi tiết về vũ khí đã sử dụng."
 colony_mod.7.name: "Chiến tranh giữa các vì sao"
 colony_mod.7.desc: "Sau khi điều tra kỹ, chúng tôi kết luận rằng [Root.GetName] là nạn nhân của một cuộc chiến bị lãng quên. Ai từng sống ở đây, và họ đã chiến đấu với ai vẫn là điều bí ẩn, nhưng rõ ràng họ đã bị tiêu diệt khi tranh giành hành tinh này với những kẻ xâm lược từ bên ngoài thiên hà. Dù phát hiện này khá rùng mình, ít nhất chúng ta có thể chắc chắn chuyện này khó lòng xảy ra lần nữa."
 colony_mod.7.a: "Nghiên cứu tàn tích chiến trường."
 colony_mod.8.name: "Tự diệt chủng"
 colony_mod.8.desc: "Bi kịch lịch sử của [Root.GetName] đã được hé mở. Từ rất lâu trước đây, [Root.GetName] đã phải chật vật tồn tại dưới sự cai trị của hai thế lực hùng mạnh đối đầu nhau. Tại một thời điểm, chiến tranh nổ ra và leo thang không ngừng, cho đến khi mọi dạng sống cao cấp trên [Root.GetName] đều bị xóa sổ do việc lạm dụng vũ khí hạt nhân."
 colony_mod.8.desc_mach: "Rất lâu trước đây, [Root.GetName] dường như có hai thế lực hùng mạnh cạnh tranh nhau. Chiến tranh nổ ra giữa họ, và xung đột leo thang cho đến khi tất cả sinh vật cao cấp trên [Root.GetName] bị tiêu diệt bởi sự lạm dụng vũ khí năng lượng hạt nhân."
 colony_mod.8.a: "Rốt cuộc điều gì đã đẩy họ đến bước đường cùng như vậy?"
 colony_mod.9.name: "Chúng ta không biết."
 colony_mod.9.desc: "Dù đã tiến hành điều tra sâu rộng về lịch sử [Root.GetName], chúng ta vẫn không thể biết chuyện gì đã xảy ra tại đây. Quá khứ vẫn là một ẩn số."
 colony_mod.9.a: "Thật bực mình."
 colony_mod.10.name: "Thanh lọc hoàn tất"
 colony_mod.10.desc: "Các thành phần gây ảo giác trong bầu khí quyển [Root.GetName] đã bị loại bỏ hoàn toàn!"
 colony_mod.11.name: "Thanh lọc: Đột phá"
 colony_mod.11.desc: "Bầu khí quyển [Root.GetName] đã được lọc qua, hiệu ứng gây ảo giác đã giảm đi đáng kể."
 hallucinogen_update_tooltip: "A, không khí thật trong lành!"
 colony_mod.12.name: "Tiểu hành tinh va chạm"
 colony_mod.12.desc: "[Root.GetName] lại bị tiểu hành tinh đâm trúng, phá hủy một phần thuộc địa. Khỏi phải nói, cư dân địa phương rất không hài lòng."
 colony_mod.12.desc_gestalt: "[Root.GetName] lại một lần nữa bị tiểu hành tinh va phải, lần này đã phá hủy một phần thuộc địa của chúng ta. Hệ thống giám sát va chạm tự động cho thấy, trong tương lai vẫn có khả năng cao xảy ra các vụ va chạm tương tự."
 colony_mod.12.a: "Chúng ta còn nhiều việc quan trọng hơn phải làm."
 colony_mod.12.b: "Phải hành động ngay!"
 colony_mod.13.name: "Hệ thống phòng thủ tiểu hành tinh"
 colony_mod.13.desc: "Kết hợp công nghệ xây dựng siêu bền và hệ thống phòng thủ tự động sẽ đủ để bảo vệ người dân trên [Root.GetName] khỏi các vụ va chạm thiên thạch."
 irradiated_planet_tooltip: "Bắt đầu điều tra..."
 colony_mod.14.name: "Phước lành từ trời"
 colony_mod.14.desc: "Dù thiên thạch rơi xuống hành tinh thường là một nỗi lo lớn, nhưng [Root.GetName] vẫn còn may mắn. Thuộc địa không bị thiệt hại gì."
 colony_mod.14.a: "Chúng ta sẽ vượt qua thử thách này."
 colony_mod.14.b: "Chúng ta phải tìm cách ngăn chặn nó."
 colony_mod.16.name: "Phép màu từ lực"
 colony_mod.16.desc: "Từ trường mạnh quanh [Root.GetName] gần đây đã ảnh hưởng đến hệ thống máy tính dưới mặt đất. Kỳ lạ là, ảnh hưởng này không đơn thuần là nhiễu loạn ngẫu nhiên; ngược lại, máy tính thực sự hoạt động hiệu quả hơn dự kiến. Đây quả là trời giúp..."
 colony_mod.17.name: "Sự cố từ lực"
 colony_mod.17.desc: "Từ trường cực mạnh bao quanh [Root.GetName] vẫn luôn gây nhiễu các thiết bị điện tử, nhưng gần đây nó gây ảnh hưởng đặc biệt nghiêm trọng đến hệ thống máy tính của chúng ta. Hiện tại chúng ta vẫn chưa rõ nguyên nhân, nhưng phỏng đoán đây chỉ là tạm thời."
 colony_mod.21.name: "Động đất: Báo cáo thiệt hại"
 colony_mod.21.desc: "Trận động đất gần đây trên [Root.GetName] đã tạo ra một hố sụt khổng lồ tại thuộc địa. Bất kể thứ gì từng ở đó, giờ đây đều đã chìm sâu vào vực thẳm dưới lòng đất."
 colony_mod.22.desc: "Trận động đất gần đây dù làm rung chuyển thuộc địa của chúng ta trên [Root.GetName] nhưng không gây thiệt hại gì. Đáng ngạc nhiên là cuộc chấn động này lại giúp chúng ta phát hiện ra một số mạch quặng hữu ích."
 colony_mod.23.desc: "Trận động đất gần đây dù làm rung chuyển thuộc địa của chúng ta trên [Root.GetName] nhưng không gây thiệt hại gì."
 quake_report_tooltip: "Báo cáo sẽ sớm được gửi đi."
 quake_sinkhole_tooltip: "Xuất hiện một £blocker£ §RThâm uyên§!."
 titanic_troop_limit_tooltip: "Đột phá trong nghiên cứu cho phép chúng ta huấn luyện các Thái thản khổng lồ và biên chế vào quân đoàn, nhưng do sự khan hiếm của các đối tượng phù hợp, mỗi lần chỉ có thể huấn luyện một số lượng nhỏ."
 titantic_blocker_tooltip: "Nếu sau này chúng ta muốn định cư ở đó, phải tránh xa những khu vực này."
 good_impact_tooltip: "Thật may mắn, thiên thạch không gây thiệt hại mà còn mang theo một số khoáng sản hữu ích lên mặt đất."
 colony_mod.100.name: "Hành tinh của những gã khổng lồ"
 colony_mod.100.desc: "[From.GetName] là quê hương của các Thái thản khổng lồ. Một số trong đó rất đông đảo và nguy hiểm, khiến một phần hành tinh không còn phù hợp cho bất kỳ loài nào khác sinh sống."
 colony_mod.101.name: "Nghiên cứu Thái thản: Thành công"
 colony_mod.101.desc: "Sau một thời gian nghiên cứu, các nhà khoa học trên [Root.GetName] cuối cùng đã đạt được đột phá và thành công trong việc giao tiếp đơn giản với một số gã khổng lồ. Dù to xác, chậm chạp và khó trao đổi, các Thái thản vẫn kiên cường và mạnh mẽ đến khó tin. Một số đã bày tỏ ý định gia nhập quân đoàn của chúng ta, chúng chắc chắn sẽ trở thành quân bài tẩy đáng sợ."
 titanic_recruit_tooltip: "Giờ đây có thể chiêu mộ Thái thản tại đây."
 titanic_recruit_phile_tooltip: "Thái thản giờ đây có thể được đưa vào danh sách chiêu mộ, các khu vực có nhiều Thái thản hiện cũng đã có thể thuộc địa hóa an toàn."
 colony_mod.102.name: "Nghiên cứu Thái thản: Thất bại"
 colony_mod.102.desc: "Trong một chuỗi phản ứng thảm họa, các nhà khoa học trên [Root.GetName] đã chọc giận các Thái thản địa phương. Những sinh vật khổng lồ đang điên cuồng tàn phá thuộc địa, nghiền nát mọi thứ trên đường đi của chúng."
 titanic_uprising_tooltip: "Lũ Thái thản đang tàn sát khắp nơi!"
 colony_mod.18.name: "Giải mã bí ẩn từ trường"
 colony_mod.18.desc: "[Root.GetName] thực chất là một máy tính lượng tử tự tổ chức vô cùng phức tạp và tinh vi. Quy luật khí hậu, sinh vật địa phương, thậm chí cả thuộc địa của chúng ta đều được nó coi như các nơ-ron, tích hợp vào mạng lưới quy mô toàn hành tinh. Chúng ta không thể nắm bắt nguyên lý hay kiểm soát nó, nhưng nếu chúng ta bố trí máy tính theo một cách cụ thể, [Root.GetName] sẽ tăng cường hiệu suất cho chúng."
 colony_mod.18.a: "[Root.GetName] ngày càng trở nên hấp dẫn hơn!"
 colony.3001.name: "Vệ tinh bí ẩn của [Root.GetName]"
 colony.3001.desc: "Sau khi định cư trên [Root.GetName] một thời gian, chúng ta đã thu thập được một số dữ liệu kỳ lạ. Cụ thể, cấu tạo địa chất của [event_target:roguemoon.Planet.GetName] có vẻ khác biệt hoàn toàn so với [Root.GetName]. Điều này có nghĩa là nó không hình thành cùng lúc với hành tinh, mà vốn dĩ được tạo ra ở nơi khác, rồi sau đó bằng cách nào đó đã bị trọng lực của [Root.GetName] bắt giữ. Nguồn gốc thực sự của [event_target:roguemoon.Planet.GetName] vẫn là một ẩn số."
 colony.3002.name: "Căn cứ trên vệ tinh lang thang"
 colony.3002.desc: "Bức màn bí mật của [event_target:roguemoon.Planet.GetName] cuối cùng đã được vén lên! Thăm dò chi tiết cho thấy phân bổ khối lượng của vệ tinh này không đồng đều, một đầu hơi nhô ra chiếm tỷ trọng khối lượng lớn bất thường. Chúng tôi cho rằng hiện tượng này là do [event_target:roguemoon.Planet.GetName] từng quay quanh một hành tinh nay đã biến mất sau một vụ nổ dữ dội.\n\nĐầu có mật độ cao của [event_target:roguemoon.Planet.GetName] từng hướng về hành tinh đó, và khi hành tinh phát nổ, một phần mảnh vỡ đã lao vào [event_target:roguemoon.Planet.GetName] rồi hợp làm một, lực va chạm đó cuối cùng đã đẩy vệ tinh này vào phạm vi dẫn lực của [Root.GetName].\n\nDo có nồng độ vật chất tối cao ở bề mặt phía xa của vệ tinh, chúng tôi tin rằng hành tinh bị nổ tung đó đã bị phá hủy bởi một loại vũ khí hoặc nguồn năng lượng dựa trên vật chất tối."
 colony.3003.name: "Kẻ lữ hành liên chiều"
 colony.3003.desc: "Các bí ẩn cứ thế nối đuôi nhau. Hiện tại chúng ta đã biết [event_target:roguemoon.Planet.GetName] bị kéo từ một chiều không gian khác sang, hoặc được đưa tới quỹ đạo của [Root.GetName]. Nhưng chúng ta vẫn chưa rõ nguyên nhân cụ thể, vì ngoài bức xạ nền hơi khác biệt, [event_target:roguemoon.Planet.GetName] có vẻ chẳng có gì đặc biệt. Còn về cỗ máy được tìm thấy ở trung tâm của nó, nó dường như có thể thực hiện dịch chuyển chiều không gian, nguyên lý của nó còn khó hiểu hơn nữa. Đối với chúng ta lúc này, nó chẳng khác gì phép thuật."
 colony.3005.name: "Cổng không gian"
 colony.3005.desc: "Chúng ta đã phát hiện một thứ chỉ có thể coi là cổng không gian tại một khu vực hẻo lánh trên [Root.GetName]. Các thuật toán dự báo thời tiết đã nhận thấy những luồng khí kỳ lạ, cuối cùng được xác định là do khí quyển bị rò rỉ nhẹ qua cổng này. Tốc độ thất thoát khí quyển rất chậm, không gây ảnh hưởng gì đến cuộc sống trên [Root.GetName]. Nhưng sự tồn tại của cổng này đặt ra những câu hỏi đáng lo ngại, chẳng hạn như nó dẫn đến đâu, và liệu có thứ gì sẽ bước ra từ phía bên kia không?"
 portal_zone_tooltip: "Có thể tiến hành nghiên cứu dài hạn về cổng không gian."
 colony.3006.name: "Chiều không gian thống khổ"
 colony.3006.spir.desc: "Cổng không gian trên [Root.GetName] dường như dẫn tới một thế giới tà ác và bất an. Bất kỳ sự tiếp xúc nào với vật chất của chiều không gian đó cũng khiến đối tượng phải chịu sự đau đớn tột cùng, nếu kéo dài quá vài phút không chỉ nảy sinh ý định tự sát mà còn cố gắng tự hủy hoại các cơ quan cảm giác của mình. Thậm chí chỉ nghiên cứu dữ liệu thu thập từ chiều không gian kỳ quái này cũng khiến hệ thống máy tính gặp trục trặc dây chuyền, còn đối với các sinh vật trí tuệ, họ sẽ có cảm giác như linh hồn mình đang bị ăn mòn một cách khó chịu."
 colony.3006.desc: "Cổng không gian trên [Root.GetName] dường như dẫn tới một thế giới về bản chất là đối nghịch với ý thức trí tuệ. Bất kỳ sự tiếp xúc nào với vật chất của chiều không gian đó cũng khiến đối tượng phải chịu sự đau đớn tột cùng, nếu kéo dài quá vài phút không chỉ nảy sinh ý định tự sát mà còn cố gắng tự hủy hoại các cơ quan cảm giác của mình. Thậm chí chỉ nghiên cứu dữ liệu thu thập từ chiều không gian kỳ quái này cũng khiến hệ thống máy tính gặp trục trặc dây chuyền, còn đối với các sinh vật trí tuệ, họ sẽ có cảm giác như linh hồn mình đang bị ăn mòn một cách khó chịu."
 colony.3006.knight.desc: "Cổng không gian trên [Root.GetName] dường như dẫn tới một thế giới tà ác. Các sinh vật cố gắng thực hiện bất kỳ hình thức tiếp xúc nào với chiều không gian đó đều sẽ phải chịu sự đau đớn dữ dội, nếu tiếp xúc trong vài phút sẽ nảy sinh khuynh hướng bạo lực mạnh mẽ. Ngay cả việc thu thập dữ liệu đơn giản cũng khiến máy tính hỏng hóc không thể sửa chữa, hoặc khiến các cá nhân thông minh cực kỳ khó chịu. Tuy nhiên, chúng ta phát hiện một di vật của Hiệp sĩ đoàn có thể bảo vệ người đeo hiệu quả, và cho phép chúng ta cử một hiệp sĩ tiến vào."
 colony.3006.science: "Tìm cách đóng cổng không gian!"
 colony.3006.prayer: "Cầu nguyện để tìm ra cách giải quyết"
 colony.3006.psi.prayer: "Có lẽ năng lực tâm linh có thể giải quyết?"
 colony.3006.rocks: "Thử lấp đầy cổng không gian bằng đá!"
 colony.3006.knights: "Cử những hiệp sĩ giỏi nhất của chúng ta đi!"
 colony.3006.keep: "Nghiên cứu cổng không gian"
 colony.3010.name: "Cổng không gian đã đóng"
 colony.3010.desc: "Chúng ta phát hiện ra rằng cổng không gian có thể chứa đựng nguồn năng lượng gần như vô tận, nhưng từ khóa là \"gần như\". Bằng cách sản xuất năng lượng với quy mô chưa từng có và bắn phá liên tục vào cổng, cuối cùng nó đã bị quá tải và sụp đổ. Rõ ràng, khả năng sản xuất năng lượng khổng lồ này cũng có thể ứng dụng vào các lĩnh vực khác."
 colony.3011.desc: "Cổng không gian dường như có phản ứng với tư duy của những người quan sát ở gần, một số người có phản ứng mạnh hơn những người khác. Thông qua sàng lọc, chúng ta đã chọn ra một nhóm người có ảnh hưởng lớn đến cổng, dùng ý chí chung để đóng nó lại. Trải nghiệm này đã truyền cảm hứng cho chúng ta, và thực sự chứng minh rằng sức mạnh của niềm tin có thể được vận dụng vào thực tế."
 colony.3011.psi.desc: "Chúng ta phát hiện cổng không gian rất nhạy cảm với năng lực tâm linh. Vì vậy chúng ta đã tập hợp một số cá nhân tài năng, tạo ra một rào chắn tâm linh xung quanh cổng để cô lập nó. Trải nghiệm này chứng minh rằng việc dùng tâm linh để tạo ra rào chắn vật lý là hoàn toàn khả thi."
 colony.3011.psi_robot.desc: "Chúng ta phát hiện cổng không gian rất nhạy cảm với đầu vào tâm linh. Chúng ta đã sử dụng các đơn vị tâm linh để tạo ra một rào chắn tâm linh xung quanh cổng nhằm ngăn chặn sự truy cập trái phép. Dữ liệu thu được từ sự kiện này sẽ rất hữu ích cho các nghiên cứu trong tương lai."
 colony.3012.desc: "Đôi khi câu trả lời đơn giản nhất lại là tốt nhất. Sau khi đánh sập vài ngọn núi thành đá vụn và đổ vào cổng không gian, nó dường như đã quá tải, hoặc có thể đã bị chủ động đóng lại. Dù sao thì chúng ta vẫn đổ nốt phần đá còn lại lên vị trí đó để ngăn nó mở ra lần nữa. Chúng ta đã học được nhiều kinh nghiệm về kỹ thuật và khai thác mỏ từ trải nghiệm này để áp dụng vào các lĩnh vực khác."
 portal_closed_tooltip: "Vị trí cổng không gian cũ vẫn có thể nghiên cứu, nhưng dữ liệu thu được sẽ không còn giá trị như trước."
 colony.3007.name: "Chiều không gian năng lượng cao"
 colony.3007.desc: "Cổng không gian trên [Root.GetName] dường như dẫn tới một thế giới cấu thành từ năng lượng thuần khiết. Chúng ta đã thành công trong việc hút một lượng nhỏ năng lượng qua cổng vào thế giới của mình. Những \"gói\" năng lượng này có tiềm năng phát triển thành vũ khí."
 portal_energy_tooltip: "$job_dimensional_portal_researcher_plural$ cũng sẽ sản xuất £energy£ Năng lượng"
 portal_void_tooltip: "$job_dimensional_portal_researcher_plural$ cũng sẽ sản xuất £sr_dark_matter£ Vật chất tối"
 colony.3008.name: "Hư không"
 colony.3008.desc: "Cổng không gian trên [Root.GetName] dẫn tới một chiều không gian cấu thành từ entropy thuần túy. Ngay cả các cảm biến cũng khó lòng thu được dữ liệu vì năng lượng tín hiệu của chúng ta nhanh chóng tan biến. Lý thuyết đáng tin nhất là hầu hết năng lượng điểm không của \"Hư không\" này là số âm, bất kỳ năng lượng dương nào từng tồn tại đều đã cạn kiệt từ lâu. Chúng ta có lẽ có thể chế tạo một loại vũ khí vận dụng đặc tính làm tan biến năng lượng của Hư không."
 colony.3009.name: "Chiều không gian song song"
 colony.3009.desc: "Kỳ lạ thay, cổng không gian trên [Root.GetName] dường như dẫn tới một hành tinh rất giống với [Root.GetName]. Kỳ lạ hơn nữa là có một tín hiệu đang truyền tới chúng ta từ bên trong đó..."
 colony.3009.a: "Kết nối ngay lập tức!"
 colony.3020.name: "Liên lạc với người ngoài hành tinh qua cổng"
 colony.3020.desc: "Tôi là [Root.Owner.Leader.GetName] của [Root.Owner.GetName]. Hỡi những người ngoài hành tinh bên kia cổng, các bạn là ai?"
 colony.3020.a: "Không, *tôi* mới là [Root.Owner.Leader.GetName]! Các bạn là ai?!"
 colony.3021.desc: "Thật kỳ diệu. Nếu những gì bạn nói là thật, tôi nghĩ cổng không gian này hẳn là nhịp cầu nối liền các thế giới song song. Chúng ta đều là [Root.Owner.Leader.GetName], nhưng tại một thời điểm nào đó, trong chiều không gian của mỗi chúng ta hẳn đã xảy ra sự khác biệt, khiến dòng thời gian của chúng ta phân nhánh."
 colony.3021.a: "Thật kinh ngạc. Hãy cho chúng tôi biết người [Root.Owner.Species.GetNamePlural] bên đó sống thế nào."
 colony.3021.b: "Chúng ta nên tiến hành giao thương qua cổng không gian."
 mirror_trade_reply: "Tôi cũng có ý đó, vì lợi ích của toàn thể người [Root.Owner.Species.GetNamePlural]!"
 colony.3022.desc: "Tôi nghĩ cũng tương tự như bên các bạn thôi. Chúng ta phát triển vào không gian từ [Root.Owner.Capital.GetName], sử dụng động cơ Warp mới phát minh—"
 colony.3022.a: "Động cơ Warp? Chúng tôi sử dụng các làn đường siêu không gian!"
 colony.3023.desc: "Làn đường siêu không gian? Có lẽ việc khám phá ra các phương thức du hành siêu ánh sáng khác nhau chính là điểm phân nhánh giữa các thế giới song song của chúng ta? Điều này có nghĩa là các bạn không bị quấy nhiễu bởi lũ Quái thú Warp sao?"
 colony.3023.a: "Chưa từng nghe nói về Quái thú Warp nào cả. Chúng là mối đe dọa lớn lắm sao?"
 colony.3024.desc: "Quái thú Warp tấn công mọi nền văn minh đã biết. Chúng là kẻ thù của mọi sự sống. Theo những gì chúng tôi biết, một khi việc du hành Warp trong thiên hà đạt đến một ngưỡng giới hạn nhất định, Quái thú Warp sẽ thức tỉnh và tấn công. Đã có vài chủng tộc bị chúng tiêu diệt, nhưng hiện tại chúng tôi vẫn đang trụ vững."
 colony.3024.a: "Nghe thật kinh khủng. Chúng tôi có thể giúp gì không?"
 mirror_trade_reply2: "Có chứ, chúng ta nên ký kết hiệp định thương mại liên chiều để tăng cường thực lực cho cả hai nước. Vì lợi ích của toàn thể người [Root.Owner.Species.GetNamePlural]!"
 colony.3031.name: "Thương mại liên chiều tăng trưởng"
 colony.3031.desc: "Bản sao [Root.Owner.GetName] từ chiều không gian song song báo cáo tình hình kinh tế rất khả quan. Nguyên nhân bao gồm việc giao thương qua cổng giữa chúng ta, cũng như một loạt thắng lợi gần đây trong cuộc chiến chống lại Quái thú Warp."
 colony.3032.name: "Thương mại liên chiều sụt giảm"
 colony.3032.desc: "Bản sao [Root.Owner.GetName] báo cáo kinh tế gần đây khá ảm đạm do phải hứng chịu một chuỗi thất bại khi đối đầu với Quái thú Warp."
 colony.3032.a: "Hy vọng họ có thể vượt qua!"
 colony.3033.name: "Phát sóng khẩn cấp qua cổng không gian"
 colony.3033.desc: "[Root.Owner.Capital.GetName] đã bị nuốt chửng. [Root.Owner.GetName] đã sụp đổ. Theo những gì chúng tôi biết, [Root.GetName] là thuộc địa duy nhất còn sót lại. Khắp nơi đều là Quái thú Warp! Chúng đến rồi!\n\n**§YTín hiệu đột ngột bị ngắt§!**"
 colony.3033.a: "Alo alo?"
 colony.3033.b: "Bạn còn đó không?"
 colony.3033.c: "Làm ơn trả lời đi!"
 colony.3033.d: "Họ xong đời rồi..."
 colony.3033.reply: "**§YChỉ còn lại tiếng nhiễu§!**"
 dportal_trade_normal: "Thương mại liên chiều"
 dportal_trade_normal_desc: "Giao thương với bản sao của chính chúng ta mang lại lợi ích cho cả đôi bên."
 dportal_trade_normal_tooltip: "$mod_planet_physicists_amenities_produces_add$: §G+600§!"
 dportal_trade_low: "Thương mại liên chiều sụt giảm"
 dportal_trade_low_desc: "Các sự kiện gần đây trong vũ trụ song song đã làm giảm lượng giao thương qua cổng không gian."
 dportal_trade_low_tooltip: "$mod_planet_physicists_amenities_produces_add$: §G+300§!"
 dportal_trade_high: "Thương mại liên chiều tăng trưởng"
 dportal_trade_high_desc: "Do bản sao của chúng ta đang phất lên như diều gặp gió, lượng giao thương qua cổng tăng vọt!"
 dportal_trade_high_tooltip: "$mod_planet_physicists_amenities_produces_add$: §G+1200§!"
 dportal_trade_crisis: "Khủng hoảng liên chiều"
 dportal_trade_crisis_desc: "Bản sao của chúng ta đang trải qua một cuộc khủng hoảng. Do mối đe dọa từ Quái thú Warp, giao thương đang ở mức thấp kỷ lục, trong khi dân tị nạn tràn qua cổng mỗi ngày với vẻ mặt đầy tuyệt vọng."
 dportal_trade_crisis_tooltip: "$mod_planet_physicists_amenities_produces_add$: §G+200§!"
 colony.3050.name: "Hắc hiệp sĩ"
 colony.3050.desc: "Nhiều năm trước, chúng ta cử hiệp sĩ [doomslayer_knight.GetName] đi qua cổng không gian trên [root.GetName], và giờ người này đã trở lại. [doomslayer_knight.GetHeSheCap] trong hình hài vặn vẹo, bị bóng tối bao phủ, dẫn đầu một đạo quân kinh hoàng băng qua cổng và lập tức tấn công thuộc địa. Những người sống sót kể rằng họ nghe thấy tiếng cười ác quỷ của [doomslayer_knight.GetHimHer] cùng lời tuyên bố sẽ sớm chinh phục chiều không gian này."
 colony.3050.a: "Rung chuông cảnh báo!"
 demonic_armies_tooltip: "Nhiều §RĐạo quân Ác quỷ§! sẽ tấn công thuộc địa!"
 colony.3051.name: "Quỷ dữ xâm lăng"
 colony.3051.desc: "Đạo quân kinh hoàng mà hiệp sĩ [doomslayer_knight.GetName] mang về đã đè bẹp hệ thống phòng thủ và chiếm đóng [fromfrom.GetName]!\n\nSau khi bị một thực thể dị chiều hùng mạnh đoạt xá, [doomslayer_knight.GetHimselfHerself] tự xưng là §Y[doomslayer_knight.GetTitle][doomslayer_knight.GetName]§!, [doomslayer_knight.GetHeShe] triệu hồi một đội quân quỷ dữ và bắt đầu công cuộc chinh phục hệ sao của chúng ta!\n\nNgay sau đó, nhiều cổng không gian khác xuất hiện khắp nơi, nhưng cấu trúc thực tại quá vững chắc khiến các điểm kỳ dị nhanh chóng sụp đổ, chia cắt lũ quỷ với quê nhà của chúng. [doomslayer_knight.GetFirstName] không bị ảnh hưởng nhiều và bắt đầu củng cố thế lực để tiếp tục dã tâm thống trị thiên hà."
 colony.3051.a: "Chúng ta phải đánh bại những kẻ xâm lược này!"
 colony.3051.b: "Vì vinh quang của [doomslayer_knight.GetName]!"
 demonic_incursion_tooltip: "Cổng không gian trên [fromfrom.GetName] sẽ đóng lại.\nHệ sao [fromfrom.solar_system.GetName] bị [demonic_incursion_country.GetName] §Rchinh phục§!."
 demonic_takeover_tooltip: "$demonic_incursion_tooltip$\n\nNhập vai §R[demonic_incursion_country.GetName]§!."
 colony.3055.name: "Dân tị nạn chiều không gian"
 colony.3055.desc: "Cổng không gian mà chúng ta gửi [doomslayer_knight.GetName] đi năm xưa giờ đang phát tín hiệu hoạt động mạnh mẽ, cùng với đó là những người dân rách rưới đang cố thoát sang thế giới của chúng ta. Họ kể rằng hiệp sĩ [doomslayer_knight.GetFirstName] đã tàn phá thế giới của họ suốt mười mấy năm qua, sát hại bất kỳ ai cản đường. [doomslayer_knight.GetHeSheCap] đã tàn sát quá nhiều người, hủy hoại cả cấu trúc xã hội của họ. Phải chăng sự thống khổ ở chiều không gian đó đã khiến [doomslayer_knight.GetName] hóa điên?"
 colony.3055.a: "Tiêu diệt những kẻ xâm nhập!"
 colony.3055.b: "Chào mừng họ ở lại."
 demon_refugees_tooltip: " §Y4 dân số $NAME_Demon_Refugees$§! sẽ xuất hiện trên [Root.GetName]."
 colony.3060.name: "Trở về từ địa ngục"
 colony.3060.desc: "Nhiều năm trước, chúng ta cử hiệp sĩ [doomslayer_knight.GetName] đi qua cổng không gian trên [root.GetName], và giờ người đó đã trở lại. [doomslayer_knight.GetHeSheCap] đã vượt qua muôn vàn thử thách, đánh bại vô số kẻ thù và giữ được mạng sống một cách thần kỳ. [doomslayer_knight.GetHeSheCap] mang về nhiều chiến lợi phẩm và trở thành huyền thoại, được mọi người xưng tụng là \"Sát thần Địa ngục\"."
 colony.3060.a: "[doomslayer_knight.GetFirstName] quả thực dũng cảm và anh dũng!"
 doomslayer_quest_complete: "Chiến lợi phẩm của Sát thần Địa ngục"
 doomslayer_quest_complete_desc: "Những vật phẩm và giai thoại mang về bởi hiệp sĩ từng dấn thân vào chiều không gian địa ngục. Đây là nguồn cảm hứng lớn cho các hiệp sĩ và tùy tùng đang khao khát những nhiệm vụ tương tự."
