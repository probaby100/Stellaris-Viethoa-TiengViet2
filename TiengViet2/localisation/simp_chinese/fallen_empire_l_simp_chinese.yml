 ### Đặc điểm Quốc gia Đế Chế Sa Sút
 civic_antediluvian_mind: "Tâm Trí Cổ Đại"
 civic_antediluvian_mind_desc: "Thời gian không hề nương tay với tâm trí dạng Gestalt này. Việc tồn tại quá lâu trong một bong bóng thời gian đã làm mai một đi khát vọng sinh tồn mãnh liệt thuở nào."
 civic_sluggish_drones: "Cá Thể Lờ Đờ"
 civic_sluggish_drones_desc: "Bởi vì mạng lưới chủ lười nhác gần như chẳng tạo ra chút áp lực nào, các cá thể của đế chế này làm việc cực kỳ chậm chạp và tỏ ra rất vô hồn."
 ### Công trình Đế Chế Sa Sút
 building_fe: "Công Trình Đế Chế Sa Sút"
 building_ancient_control_center: "Trung Tâm Điều Khiển Cổ Đại"
 building_ancient_control_center_desc: "Trung tâm điều khiển cổ xưa của Thế Giới Vành Đai này chỉ có thể hoạt động lay lắt nhờ vào việc bảo trì không biết mệt mỏi của một đàn máy móc không người lái."
 building_ancient_palace: "Cung Điện Cổ Đại"
 building_ancient_palace_desc: "Khu phức hợp cung điện khổng lồ này là minh chứng cho một thời đại đã lùi xa vào dĩ vãng. Dù vẻ ngoài tráng lệ của nó vẫn không chịu khuất phục trước sức mạnh bào mòn của thời gian, nhưng rất nhiều khu nhà phụ đã rơi vào cảnh hoang phế và xuống cấp trầm trọng."
 building_ancient_hive_capital: "Lõi Trung Tâm Uy Nghiêm"
 building_ancient_hive_capital_desc: "Khu vực đầu não cổ xưa của bá quyền tổ ong này chính là nơi phát ra những mệnh lệnh được vô số thế hệ ong thợ trung thành thi hành."
 building_affluence_emporium: "Thương Trạm Phồn Vinh"
 building_affluence_emporium_desc: "Trung tâm này sử dụng các thuật toán cung ứng tiên tiến để dự đoán và đáp ứng các nhu cầu vật chất, thỏa mãn mong muốn của người dân ngay cả trước khi họ kịp nhận ra mình cần gì."
 building_affluence_center: "Trung Tâm Của Cải"
 building_affluence_center_desc: "Trung tâm này có thể dễ dàng hiện thực hóa mọi ham muốn độc đáo nhất chỉ trong chớp mắt."
 building_nourishment_complex: "Khu Phức Hợp Dinh Dưỡng"
 building_nourishment_complex_desc: "Công nghệ nhân bản có thể tạo ra những hương vị mới lạ theo yêu cầu ngay tức khắc, tựa như có phép màu."
 building_nourishment_center: "Trung Tâm Dinh Dưỡng"
 building_nourishment_center_desc: "Bất kỳ hương vị nào bạn có thể nghĩ ra đều có thể được tạo ra bên trong những tòa nhà này."
 building_dimensional_replicator: "Máy Nhân Bản Xuyên Không Gian"
 building_dimensional_replicator_desc: "Công nghệ của những cỗ máy chế tạo này cho phép chuyển hóa trơn tru năng lượng thành vật chất."
 building_dimensional_fabricator: "Máy Chế Tạo Không Gian"
 building_dimensional_fabricator_desc: "Cỗ máy dệt tân tiến này không ngừng đào sâu vào cấu trúc không gian đa chiều để trích xuất những tài nguyên quý giá."
 building_class_3_singularity: "Điểm Kỳ Dị Cấp 3"
 building_class_3_singularity_desc: "Khả năng thu giữ toàn bộ năng lượng sinh ra từ điểm kỳ dị này thực sự là một kỳ tích kỹ thuật."
 building_class_4_singularity: "Điểm Kỳ Dị Cấp 4"
 building_class_4_singularity_desc: "Sản lượng năng lượng của điểm kỳ dị này thách thức mọi định luật vật lý, trong khi trường khống chế lại luôn duy trì sự ổn định ở mức tuyệt đối."
 building_micro_forge: "Siêu Xưởng Đúc"
 building_micro_forge_desc: "Tốc độ sản xuất của xưởng đúc này hoàn toàn chỉ bị giới hạn bởi tốc độ đưa nguyên liệu thô vào."
 building_nano_forge: "Lò Nung Nano"
 building_nano_forge_desc: "Trong lò nung này, những cỗ máy nhân bản nano khổng lồ chuyển hóa nguyên vật liệu thành các hợp kim tiên tiến với một hiệu suất cực kỳ đáng kinh ngạc."
 building_fe_sky_dome: "Mái Vòm Chân Trời"
 building_fe_sky_dome_desc: "Thành phố trên không này lơ lửng nhờ công nghệ phản trọng lực tối tân, mang đến cho cư dân bên trong một môi trường sống hoàn hảo như thiên đường."
 building_fe_dome: "Mái Vòm Tầng Không"
 building_fe_dome_desc: "Những mái vòm lơ lửng nhờ công nghệ vô hiệu hóa trọng lực này đã vượt qua mọi giới hạn vật lý, cùng với hệ thống hỗ trợ sự sống tiên tiến không ngừng đáp ứng nhu cầu của cư dân."
 building_fe_fortress: "Pháo Đài Bọc Thép"
 building_fe_fortress_desc: "Tổ hợp phòng thủ hành tinh khổng lồ này sở hữu vô số lớp giáp và khiên nhiều tầng. Chỉ những lực lượng công thành đặc nhiệm mới có hy vọng chọc thủng được lớp phòng ngự của nó."
 building_fe_stronghold: "Cứ Điểm Bất Bại"
 building_fe_stronghold_desc: "Tổ hợp phòng thủ hành tinh hoành tráng này được gia cố bằng vô số lớp giáp và khiên, dù cho trời sập đất lở thì hàng phòng thủ của nó vẫn sẽ đứng vững."
 building_master_archive: "Kho Lưu Trữ Trọng Yếu"
 building_master_archive_desc: "Kho chứa này lưu giữ những kiến thức được tích lũy qua nhiều kỷ nguyên thiên hà, thế nhưng hệ thống tra cứu bí ẩn dùng để vận hành nó đã bị thất truyền. Giờ đây, chỉ cần trích xuất được một vài đoạn nhỏ từ đó cũng đã là vô giá."
 building_empyrean_shrine: "Đền Thờ Chuyển Pha Lơ Lửng"
 building_empyrean_shrine_desc: "Ngôi đền này được xây dựng riêng để giao tiếp với các linh thể trong Hư Cảnh, nó chỉ cắm rễ một phần rất nhỏ vào chiều không gian của chúng ta."
 building_ancient_cryo_chamber: "Phòng Ngủ Đông Cổ Đại"
 building_ancient_cryo_chamber_desc: "Cỗ máy khổng lồ này treo lơ lửng những hàng kén ngủ đông, bên trong chứa thi hài lạnh lẽo của hàng tỷ người ngoài hành tinh đã tuyệt diệt từ rất lâu."
 building_fe_administration_1: "Cơ Quan Quản Lý Thông Suốt"
 building_fe_administration_1_desc: "Là một phần của bộ máy quan liêu rộng khắp thiên hà, khu phức hợp khổng lồ này kết nối thẳng vào một mạng lưới hành chính không có điểm dừng."
 building_fe_administration_2: "Cơ Quan Quản Lý Toàn Năng"
 building_fe_administration_2_desc: "Khu phức hợp khổng lồ này là trung tâm của bộ máy quan liêu trải rộng khắp thiên hà, nó được kết nối với một mạng lưới hành chính tiên tiến và bền bỉ."
 building_fe_administration_hive_1: "Cụm Khớp Thần Kinh Mô Phỏng"
 building_fe_administration_hive_1_desc: "Dưới sự chăm sóc tỉ mỉ của các cá thể chuyên biệt cao, mạng lưới nút cảm giác này đã củng cố sự thống trị của tổ ong trên toàn bộ miền nhận thức rộng lớn của nó."
 building_fe_administration_hive_2: "Sợi Trục Thần Kinh Mô Phỏng"
 building_fe_administration_hive_2_desc: "Dưới sự chăm sóc tỉ mỉ của các cá thể chuyên biệt, mạng lưới nút cảm giác khổng lồ này ngày đêm lan truyền ý chí của tổ ong ra khắp thiên hà."
 building_fe_administration_machine_1: "Điểm Phối Hợp Phân Dạng"
 building_fe_administration_machine_1_desc: "Một bộ chuyển mạch phân dạng tiên tiến có thể xử lý và truyền tải mượt mà hàng nghìn tỷ tín hiệu với độ chính xác gần như tức thời."
 building_fe_administration_machine_2: "Điểm Phối Hợp Lượng Tử"
 building_fe_administration_machine_2_desc: "Một trạm vướng mắc lượng tử tiên tiến, có khả năng xử lý chuẩn xác và truyền tải ngay lập tức hàng triệu tỷ tín hiệu."
 building_fe_temple_1: "Thánh Sở Nơi Thiên Đường"
 building_fe_temple_1_desc: "Bước tiến tột bậc của công nghệ siêu hình học đã cho phép những tín đồ giao tiếp trực tiếp với các đấng linh thiêng."
 building_fe_temple_2: "Thánh Đường Nơi Thiên Đường"
 building_fe_temple_2_desc: "Việc áp dụng công nghệ siêu hình học vào việc truyền đạo tâm linh có thể khuếch đại sự cộng hưởng tâm trí. Khu phức hợp khổng lồ này giúp các tín đồ kết nối chặt chẽ với các đấng linh thiêng trên quy mô toàn thiên hà."
 building_fe_assembly_1: "Điểm Nút Sản Xuất Robot"
 building_fe_assembly_1_desc: "Một khu phức hợp lắp ráp tiên phong do các chuyên gia robot lão luyện điều hành, cơ sở này vượt xa những giới hạn thông thường để hiện thực hóa những bước tiến mới nhất trong ngành công nghiệp robot một cách tỉ mỉ."
 building_fe_assembly_2: "Trung Tâm Sản Xuất Robot Lượng Tử"
 building_fe_assembly_2_desc: "Cơ sở này đúng là một kỳ tích của ngành kỹ thuật, các dây chuyền lắp ráp lượng tử hóa của nó sử dụng bộ chuyển đổi vướng mắc để gia công các chi tiết máy móc đạt đến độ tinh xảo tuyệt đối. Không có lấy một nguyên tử nào bị đặt sai chỗ."
 building_fe_clinic_1: "Trạm Phục Hồi Phân Tử"
 building_fe_clinic_1_desc: "Trạm phục hồi phân tử nghiên cứu sâu về sự phức tạp của tế bào và nâng cao hiệu quả y tế, từ đó cải thiện rõ rệt chất lượng sức khỏe cũng như tuổi thọ của người dân."
 building_fe_clinic_2: "Viện Tái Sinh Sinh Học"
 building_fe_clinic_2_desc: "Viện nghiên cứu tái sinh sinh học là đỉnh cao của công nghệ y tế, đi tiên phong trong các liệu pháp tái sinh sinh học mang tính đột phá, nơi đây không ngừng định nghĩa lại giới hạn của việc kéo dài tuổi thọ."
 building_fe_security_1: "Khu Phức Hợp Tư Pháp"
 building_fe_security_1_desc: "Tòa nhà tư pháp hùng vĩ này là sự kết hợp hoàn hảo giữa tòa án và các cơ quan thực thi pháp luật."
 building_fe_security_2: "Điện Tư Pháp"
 building_fe_security_2_desc: "Với tư cách là cơ quan lập pháp hàng đầu, tòa nhà uy nghi này là một tượng đài của công lý, được trang bị đầy đủ tòa án, trại giam và cơ sở cải tạo để khiến cho cả những tên tội phạm cứng đầu nhất cũng phải hoàn lương."
 building_fe_market_1: "Trung Tâm Thương Mại Thiên Hà"
 building_fe_market_1_desc: "Những ngọn tháp cao vút chọc trời đổ bóng dài xuống những khu thương mại sầm uất bên dưới."
 building_fe_market_2: "Đầu Mối Thương Mại Liên Sao"
 building_fe_market_2_desc: "Khu vực giao thương này nắm giữ vị thế thống trị tuyệt đối trong các hoạt động thương mại toàn thiên hà, đỉnh tháp khổng lồ của nó thậm chí có thể được nhìn thấy rõ từ tít trên quỹ đạo."
 building_fe_silo_1: "Kho Chứa Không Gian Gấp Khúc"
 building_fe_silo_1_desc: "Nhà kho này có khả năng can thiệp một phần vào khoảng cách phân tử, giúp thu nhỏ kích thước của mọi vật thể được cất giữ bên trong. Tuyệt đối cấm sinh vật sống bước vào."
 building_fe_silo_2: "Kho Chứa Đa Chiều"
 building_fe_silo_2_desc: "Bằng cách tạo ra một không gian bỏ túi biệt lập, chúng ta có thể cất giữ một lượng tài nguyên gần như vô tận."
 building_fe_entertainment_1: "Quảng Trường Cực Lạc Ảo"
 building_fe_entertainment_1_desc: "Những khu vui chơi khổng lồ này hội tụ những tinh hoa giải trí hàng đầu. Công nghệ đọc sóng não cho phép tạo ra các kỳ nghỉ dưỡng ảo tức thời và được thiết kế riêng cho từng người."
 building_fe_entertainment_2: "Đầu Mối Cực Lạc Bất Tận"
 building_fe_entertainment_2_desc: "Đây là đỉnh cao của ngành giải trí, một trung tâm vượt ra khỏi những giới hạn thông thường, nơi mà mọi mong muốn của bạn đều được đáp ứng trước cả khi bạn kịp thốt lên thành lời."
 building_fe_lab_1: "Trạm Nút Đột Phá Lượng Tử"
 building_fe_lab_1_desc: "Sở hữu những trang thiết bị tiên tiến nhất cùng đội ngũ nhân viên xuất chúng vô song, trạm nút này mở ra một kỷ nguyên mới, không chỉ nhằm khám phá lý thuyết lượng tử mà còn hiện thực hóa những ứng dụng mang tính đột phá."
 building_fe_lab_2: "Cục Đột Phá Vượt Bậc"
 building_fe_lab_2_desc: "Tòa nhà này là đỉnh cao của sự tiến bộ khoa học, minh chứng cho một kỷ nguyên của những đổi mới không giới hạn."
 building_fe_mine_1: "Xưởng Khoan Xuyên Lượng Tử"
 building_fe_mine_1_desc: "Nhà máy khai khoáng này có thể dò tìm mọi loại khoáng sản ẩn sâu dưới lớp vỏ hành tinh, nó sử dụng công nghệ đường hầm lượng tử để khoan xuyên qua các vật chất rắn mà không cần chạm trực tiếp."
 building_fe_mine_2: "Trung Tâm Khoan Xuyên Lượng Tử"
 building_fe_mine_2_desc: "Trung tâm khai khoáng này sử dụng công nghệ đường hầm lượng tử để hút khoáng sản từ bất kỳ độ sâu nào phía trên lõi hành tinh, xuyên qua cả chất rắn lẫn chất lỏng mà không cần tiếp xúc vật lý."
