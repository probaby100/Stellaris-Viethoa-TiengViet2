 ####################
 #ARCHAEOLOGY SITES
 ####################
 #Ice Trauma (by Gemma Thomson)
 site_ice_trauma: "Bên dưới Lớp băng"
 site_ice_trauma_desc: "Vùng hoang mạc băng giá rộng lớn trên [from.planet.GetName] từng một thời là đại dương bao la, với những hẻm núi lửa chằng chịt dưới đáy biển. Mặc dù môi trường hiện tại không còn khả năng duy trì sự sống, chúng ta vẫn phát hiện ra một vài khu định cư dưới nước lâu đời nằm trong các rãnh băng gần bề mặt."
 arcsite.1000.name: "Tháp Xoắn ốc Kì bí"
 arcsite.1000.desc: "Các [owner.GetScientistPlural] của chúng ta đã dựng trại bên một hồ băng trong vắt. Nhờ ánh sáng dồi dào, mọi người thậm chí có thể nhìn thấy những tòa tháp ma quái phát ra ánh sáng nhạt bên dưới lớp băng. Chúng vươn lên từ đáy hồ, trông giống như những xúc tu rắn chắc.\n\nĐội thám hiểm non trẻ của chúng ta vẫn không ngừng làm việc trong cái lạnh thấu xương và khắc nghiệt như vậy. Bất chấp điều kiện khó khăn, việc khai quật của chúng ta đang tiến triển rất thuận lợi. Chúng ta đã phát hiện ra vài khoang nén khí, được thiết kế làm cảng cho các tàu ngầm sơ khai. Tuy nhiên, chúng ta không tìm thấy dấu vết nào của những chiếc tàu này tại hiện trường. Cho dù cư dân của những tòa tháp này đã ở lại hay bỏ trốn, bến cảng giờ đây đã hoàn toàn trống rỗng."
 arcsite.1000.a: "Chúng ta nên đầu tư thêm tài nguyên vào công nghệ phá băng."
 arcsite.1005.name: "Sự Bào mòn và Xé rách"
 arcsite.1005.desc: "Khi chúng ta tiếp tục dọn dẹp những tảng băng lớn khỏi các khu định cư bị đóng băng khác nhau, các [owner.GetScientistPlural] đã phát hiện ra một trạm máy tính sơ khai tại tháp neo đậu. Lớp vỏ kim loại giòn tan của nó có vẻ như đã bị... cắn một cú trời giáng.\n\nSau một vài sửa chữa nhỏ, trạm máy tính này đã khởi động thành công. Phần lớn mạng dữ liệu của khu định cư vẫn đang ngoại tuyến, nhưng chúng ta có thể suy ra nhiều thông tin từ các bằng chứng cổ phần, tài liệu cá nhân và một số tệp tin có vẻ là nhật ký nhiệm vụ nằm trong bộ nhớ đệm cục bộ."
 arcsite.1010.name: "Tiến triển Đáng lo ngại"
 arcsite.1010.desc: "Khi kiến thức của chúng ta về các khu định cư cổ đại trên [from.planet.GetName] ngày càng sâu sắc, nỗi lo âu của chúng ta cũng lớn dần. Những gì chúng ta phát hiện trước đây chỉ là tàn tích của một tiền đồn thuộc địa —— di tích của một nền văn minh đã bị thế giới lãng quên từ lâu, thậm chí chúng ta còn không thể xác định được tên của họ.\n\nTrên hành tinh này, đại dương chiếm vị trí thống trị tuyệt đối. Nhiều nhóm thực dân khác nhau đã được đưa từ hành tinh mẹ đến đây, nhập ngũ trở thành thành viên của đội tiên phong dưới nước. Mục tiêu của họ: thiết lập thuộc địa, khai thác tài nguyên thiên nhiên của hành tinh này. Tuy nhiên, thực tế họ phải đối mặt lại là một cuộc thử nghiệm sinh học không bị ràng buộc, những biến động chính trị bạo lực và những mối nguy hiểm to lớn từ §Yhệ động thực vật hung dữ§!.\n\nChúng ta đã tìm thấy nhật ký cảm biến trên một phao dẫn đường, có vẻ như nó đã ghi lại lộ trình của một nhóm người đi đến tiền đồn gần đó. Chúng ta tin rằng tàu của những người này vẫn ở nguyên vị trí, mắc kẹt trong lớp băng, và chứa nhiều vật liệu hữu ích."
 arcsite.1010.a: "Phái một đội nghiên cứu đi ngay lập tức."
 arcsite.1010.b: "Hãy xem chúng ta có thể học được gì từ những cư dân đại dương kiên cường này."
 arcsite.1016.name: "Lửa và Nước"
 arcsite.1016.desc: "Đó là một hang động được bao bọc bởi lớp băng đen kịt, bên trong chúng ta tìm thấy tàn tích của một chiếc tàu ngầm cổ đại bị cháy rụi và tê liệt. Hang động cháy xém này đã giúp xác tàu tránh được chu kỳ đóng băng và rã đông khắc nghiệt nhất của hành tinh, giữ lại nguyên vẹn thảm cảnh diệt vong của phi hành đoàn.\n\nĐộng cơ hạt nhân lạc hậu của chiếc tàu ngầm có dấu hiệu từng được sửa chữa khẩn cấp. Trong khoang phi hành đoàn, chúng ta tìm thấy những vết xước và dấu vết hóa chất cháy sém. Tất cả các khoang thoát hiểm trên tàu đều đã được phóng đi vào thời điểm đó, nhưng có một chiếc đã bị kẹt trong một miệng núi lửa đang ngủ say gần đó.\n\nKhông có nhiều thứ để thu thập trên xác tàu này, nhưng điểm đến ban đầu của phi hành đoàn —— một §Ykho tiếp tế§! của thuộc địa vẫn còn nguyên vẹn. Đội sửa chữa của chúng ta nhờ đó đã khôi phục thành công những bộ phận hỏng hóc của nhóm phi hành đoàn xấu số này."
 arcsite.1017.name: "Chủ quyền trong Tàu ngầm"
 arcsite.1017.desc: "Chúng ta đã đào một đường hầm qua lớp băng dày và tìm thấy xác một chiếc tàu ngầm nguyên vẹn trong một hang động kín. Môi trường lãnh nguyên đã biến mọi chất hữu cơ thành tro bụi, nhưng cũng giúp bảo tồn nguyên vẹn nhiều di vật cổ đại.\n\nNghiên cứu nhân chủng học của chúng ta chỉ ra rằng, sau khi phi hành đoàn chạy trốn khỏi thuộc địa gần đó, chiếc tàu ngầm này đã trở thành mảnh đất màu mỡ nuôi dưỡng vô số hoạt động chính trị. Họ đã chia cắt thành nhiều ranh giới chủ quyền bên trong khoang tàu, và ủng hộ những tư tưởng chính trị khác nhau. Điều đáng ngạc nhiên là, sự phân chia bè phái khắc nghiệt này không hề chia rẽ các thành viên, mà ngược lại còn củng cố mối liên kết xã hội giữa họ. Nghiên cứu này chắc chắn sẽ gây ra những cuộc thảo luận sôi nổi cho các nhà khoa học chuyên về khoa học chính trị của chúng ta."
 arcsite.1017.auth.a: "……Hãy để chúng ta tiến xa hơn những kẻ bất đồng chính kiến."
 arcsite.1018.name: "Di sản Gen"
 arcsite.1018.desc: "Chúng ta cứ ngỡ những hài cốt cổ xưa như vậy đã bị thời gian tàn phá, ai ngờ quá trình đóng băng cực nhanh khi đó đã bảo vệ được nửa trên của những hài cốt. Được bảo tồn cùng với chúng là xác của nhiều sinh vật, một vài trong số đó có vẻ là những loài thú ăn thịt khổng lồ và hung tợn của địa phương. Những sinh vật có trí tuệ mặc đồ bảo hộ khác dường như là con mồi của những kẻ đi săn này.\n\nPhi hành đoàn trên những chiếc tàu ngầm này không phải là người bản địa của [fromfrom.planet.GetName]. Quá trình giải phẫu của chúng ta chỉ ra rằng, họ đã ghép và tích hợp gen của sinh vật bản địa vào cơ thể mình. Về lý do tại sao nhóm thực dân này lại tiến hành tự cải tạo trên diện rộng như vậy, có lẽ chúng ta chỉ có thể tự tưởng tượng. Nhưng không thể phủ nhận rằng, bằng cách này, họ đã thực sự giúp những gen đó được lưu giữ lại."
 arcsite.1018.phobe.a: "Chuyện này cũng quá đê tiện rồi."
 arcsite.1018.b.evopred: "Quả là một giống loài thông minh!"
 arcsite.1020.name: "Khổ ải Băng giá"
 arcsite.1020.desc.intro: "Sau khi nỗ lực hết sức để điều tra xác tàu ngầm và khu dân cư bỏ hoang, đội ngũ của chúng ta trên [from.planet.GetName] đang chuẩn bị tập hợp lại gần bề mặt hành tinh. Vẫn còn quá nhiều điều chưa biết về thuộc địa này. Hầu hết những gì chúng ta tìm thấy chỉ tương đương với một mớ di vật thập cẩm, chủ nhân cũ của chúng từng sống ở một nơi vô cùng cô độc và hẻo lánh."
 arcsite.1020.tech.desc: "$arcsite.1020.desc.intro$\n\nMặc dù không có khả năng du hành siêu quang tốc, nhưng những cư dân tàu ngầm cổ đại này đã định hướng cho chúng ta đạt được những bước đột phá đáng kể trong các lĩnh vực khác. Họ đã trải qua biết bao gian khổ để có được những khám phá này, và chúng ta sẽ cố gắng để không bao giờ phải trải qua những khổ ải tương tự."
 arcsite.1020.default.desc: "$arcsite.1020.desc.intro$\n\nMặc dù nền văn minh của họ chưa sở hữu công nghệ du hành siêu quang tốc, nhưng những gian khổ và nguy hiểm dường như đã dẫn dắt thuộc địa từng nằm trong tàu ngầm này đạt được những bước đột phá độc đáo về khoa học và kinh tế, mà giờ đây chúng ta có thể tùy ý sử dụng."
 arcsite.1020.a: "Những lời răn đe này có lẽ sẽ mang lại lợi ích cho các thực dân của chúng ta."
 arcsite.1020.b: "Khu định cư dưới lòng đất là một ý tưởng thú vị đấy."
 arcsite.1020.c: "Chúng ta có thể tận dụng tốt số vũ khí trên tàu ngầm."
 arcsite.1020.a.memorialist: "Chúng ta nhất định phải trân trọng những ký ức của họ."
 arcsite.1020.a.prospectors: "Đó là một sự nghiệp kỳ lạ."
 ice_trauma_insights_colony: "Di sản của Cư dân Tàu ngầm Băng giá" #modifier
 ice_trauma_insights_engineering: "Trí tuệ của Cư dân Tàu ngầm Băng giá" #modifier
 ice_trauma_memorialist_unity: "Tưởng nhớ Cư dân Tàu ngầm Băng giá" #modifier
 #Engineered Species
 site_engineered_species: "Hóa thạch Trù phú"
 site_engineered_species_desc: "Thoạt nhìn, [from.planet.GetName] là một hành tinh có thể sinh sống bình thường, nhưng sau khi điều tra chi tiết, nhóm nghiên cứu của chúng ta đã phát hiện ra nhiều mỏ hóa thạch lớn, và được bảo tồn trong tình trạng khá tốt. Điều thú vị là một vài quần thể hóa thạch lớn bao gồm nhiều giống loài trong cùng một tầng địa chất, cho thấy chúng đã chết cùng một lúc hoặc có ai đó đã cố tình sắp xếp như vậy. Việc kiểm tra những hài cốt này cho chúng ta cơ hội tìm hiểu sâu hơn về quỹ đạo tiến hóa của các giống loài từng sống trên hành tinh này."
 arcsite.2000.name: "Sức nặng của Xương"
 arcsite.2000.desc: "Sau khi quét bề mặt, chúng ta đã xác định được một vài mỏ quặng có giá trị, bên trong chôn vùi vô số hài cốt của các giống loài khác nhau. Một số thậm chí còn tương đồng với những sinh vật vẫn đang sinh sống trên hành tinh này, trong khi số khác lại hoàn toàn khác biệt với bất kỳ sinh vật nào chúng ta từng thấy.\n\nMặc dù công việc này không hề dễ dàng, và động vật hoang dã xung quanh cũng bị chúng ta quấy nhiễu, nhưng [leader.GetName] đã có những phát hiện quan trọng và tái tạo thành công một số loài đã tuyệt chủng. Tuy nhiên, điều này lại châm ngòi cho một số tranh cãi trong nhóm nghiên cứu. Một số người muốn đem trưng bày các mẫu vật này, trong khi những người khác lại muốn nghiên cứu thêm về chúng, xét cho cùng thì những hóa thạch này đang ở trong tình trạng tốt nhất, và mỏ quặng này cũng sắp bị đào cạn."
 arcsite.2000.study: "Nghiên cứu hóa thạch."
 arcsite.2000.use: "Tổ chức triển lãm để trưng bày chúng."
 arcsite.2001.name: "Nghiên cứu Hóa thạch" #Study
 arcsite.2001.desc: "Chúng ta đã tiến hành nghiên cứu đầy đủ, làm rõ mối liên hệ giữa các loài hóa thạch và các loài trong sinh quyển hiện tại của [from.planet.GetName]. Kết quả cho thấy, một vài trong số chúng thuộc cùng một chi, có nhiều điểm tương đồng. Nghiên cứu sâu hơn có lẽ sẽ mang lại cho chúng ta nhiều câu trả lời hơn."
 arcsite.2002.name: "Triển lãm Liên hành tinh" #Use
 arcsite.2002.desc: "Rất nhiều người đã đến tham quan triển lãm của chúng ta. Mặc dù không thể sử dụng những thứ thu thập được cho việc nghiên cứu, nhưng chúng ta đã thu hút được vài nhà tài trợ hào phóng, đưa những hóa thạch này đi tổ chức triển lãm lưu động liên hành tinh. Vẻ ngoài xa lạ của các vật phẩm trưng bày đã tạo ra một tiếng vang nhỏ nhưng đầy nhiệt huyết trong cộng đồng những người đam mê khảo cổ học ngoài hành tinh."
 arcsite.2010.name: "Kẻ sống trong Hang"
 arcsite.2010.desc: "Sau khi lục soát triệt để khu di tích khảo cổ đầu tiên, chúng ta quyết định chuyển đến một nơi hẻo lánh hơn để tìm kiếm thêm vật liệu nghiên cứu. [leader.GetName] đã tìm thấy một địa điểm khá tốt, đây là một hang động từng được một giống loài có trí tuệ nhưng đã tuyệt chủng dùng làm nơi ở. Sau khi cẩn thận khám phá và kiểm tra, chúng ta phát hiện ra một điều phi thường: bất kể kẻ sống trong hang động này là ai, sinh vật này biết sử dụng một loại thuốc nhuộm tinh xảo, sẽ hiện màu dưới tác động của ánh sáng và nhiệt độ.\n\nChúng ta đã nhận diện được hai bức bích họa: một bức kể lại những câu chuyện trong quá khứ, bức kia miêu tả cuộc sống hàng ngày. Không may thay, sự xâm nhập của chúng ta đã phá vỡ hệ sinh thái tinh vi giúp lưu giữ các bức bích họa. Sự xáo trộn này tạo ra một chuỗi phản ứng dây chuyền, cộng thêm năm tháng mà bản thân loại thuốc nhuộm này đã trải qua, khiến cho các bức vẽ sẽ biến mất trong thời gian ngắn. Đội nghiên cứu phải ngay lập tức quyết định xem bức bích họa nào có giá trị hơn để giải cứu."
 arcsite.2010.study: "Lưu giữ phần lịch sử."
 arcsite.2010.use: "Lưu giữ phần cuộc sống hàng ngày."
 arcsite.2011.name: "Lịch sử của Kẻ sống trong Hang" #Study
 arcsite.2011.desc: "Bức bích họa chúng ta thu thập được kể về quá khứ của giống loài này, mang lại cho chúng ta nhiều hiểu biết mới về lịch sử của chúng. Có vẻ như, những kẻ sống trong hang này đã tiếp xúc với một nền văn minh cao cấp, điều này phần nào ảnh hưởng đến ngoại hình và con đường phát triển của chúng. Dựa trên mô tả về ngoại hình của những sinh vật này, chúng ta đoán rằng giống loài này có khả năng đột biến gen nhanh chóng, ngoại hình của chúng sẽ thay đổi rõ rệt chỉ trong vài thế hệ."
 arcsite.2012.name: "Cuộc sống của Kẻ sống trong Hang" #Use
 arcsite.2012.desc: "Bức bích họa chúng ta thu thập được miêu tả cuộc sống thường nhật của giống loài này, mang lại cho chúng ta nhiều hiểu biết mới về lịch sử của chúng. Bức bích họa vẽ những kẻ sống trong hang như một quần thể có ngoại hình rất khác nhau, nhưng mức độ trí tuệ tương đương, đang tham gia vào các nghi lễ phức tạp. [leader.GetName] đưa ra giả thuyết rằng, đây là những sinh vật đa dạng đang đắm mình trong ánh sáng thánh thiện của các vị thần, làm việc cho Họ, để đổi lấy sự tự do được thần ban tặng."
 arcsite.2020.name: "Cấu trúc Xương"
 arcsite.2020.desc: "Tiến sâu hơn vào khe nứt của hang động, chúng ta đến một căn buồng đá nhân tạo, bên trong có một cấu trúc bằng xương kỳ dị. Căn cứ vào trạng thái hiện tại của cấu trúc này, có vẻ như nó đã bị sập, rồi chìm xuống lòng đất —— có thể là do một trận động đất. [Leader.GetName] đã ra lệnh dựng trại ngay tại chỗ, và chúng ta cũng đã tiến hành vài cuộc thăm dò xung quanh, nhưng mặt đất không được ổn định cho lắm. Một khi bước vào bên trong, chúng ta có thể sẽ không có đủ thời gian để kiểm tra cấu trúc này một cách toàn diện.\n\nĐối với nghiên cứu của chúng ta, thành quả tiềm năng lớn nhất chính là bản thân công trình kiến trúc này. Chúng ta có thể nghiên cứu thứ vật liệu tinh xảo giống như xương này, hoặc tập trung nỗ lực vào việc khám phá, tìm kiếm thêm manh mối về người ngoài hành tinh bên trong cấu trúc —— để tìm hiểu xem ai đã xây dựng nó, nó được sử dụng như thế nào, và cuộc sống thường ngày của họ ra sao."
 arcsite.2020.study: "Nghiên cứu kiến trúc này."
 arcsite.2020.use: "Nghiên cứu bên trong nó."
 arcsite.2021.name: "Cấu trúc Sống" #Study
 arcsite.2021.desc: "Sau một quá trình nghiên cứu không mấy suôn sẻ, [Leader.GetName] đi đến kết luận rằng kiến trúc này đã từng... sống. Tất nhiên không phải bây giờ, mà là rất nhiều năm về trước, vào một thời điểm nào đó khi nó được tạo ra. Một khối lượng lớn xương và mô được dính lại với nhau, tạo nên một công trình có thể biến đổi hình dạng theo nhu cầu cụ thể. Xem xét cách thức công trình này sụp đổ, chúng ta có lẽ thậm chí có thể giả định rằng đây là một hành động có chủ đích do chính một phần của cấu trúc này thực hiện.\n\nKhông may thay, trong quá trình nghiên cứu, chúng ta đã vô tình làm hỏng cấu trúc này, nó sụp đổ nghiêm trọng hơn, khiến kiến trúc này không thể sử dụng cho nghiên cứu sâu hơn của chúng ta. [Leader.GetName] đã ra lệnh cho cả nhóm tiếp tục tiến lên."
 arcsite.2022.name: "Nền văn minh Dưới lòng Đất" #Use
 arcsite.2022.desc: "Bên trong cấu trúc âm u này hóa ra lại là một mê cung, với đầy những hành lang sập một nửa, trên mặt đất vương vãi thứ vật liệu giống như xương ở khắp nơi. Sau muôn vàn gian khổ, chúng ta đã cố gắng lấy ra được vài công cụ và đồ vật, tất cả đều minh chứng rằng một thế lực văn hóa phức hợp đã từng sống trên hành tinh này. Chúng có lẽ có thể cung cấp cho chúng ta những nhận thức mới, giúp ta hiểu những giống loài đã tuyệt chủng này rốt cuộc là những dạng sống như thế nào.\n\nKhông may thay, trong quá trình nghiên cứu, chúng ta đã vô tình làm hỏng cấu trúc này, nó sụp đổ nghiêm trọng hơn, khiến kiến trúc này không thể sử dụng cho nghiên cứu sâu hơn của chúng ta. [Leader.GetName] đã ra lệnh cho cả nhóm tiếp tục tiến lên."
 arcsite.2030.name: "Cơ sở Dưới lòng Đất"
 arcsite.2030.desc: "Cuối cùng chúng ta cũng đã đến được phần sâu nhất của hang động. Chúng ta đã tiến vào một công trình nằm sâu dưới lòng đất, trông giống như một hầm ngầm cũ kỹ bị bỏ hoang. Nó có vẻ không giống bất cứ thứ gì chúng ta từng tìm thấy trước đây: chúng ta chỉ có thể đưa ra giả thuyết rằng một vài du khách ngoài hành tinh đã thiết lập phòng thí nghiệm nghiên cứu tại đây. Dựa vào boongke xập xệ, đủ loại xương cốt, cùng hóa thạch nằm rải rác, rõ ràng là trước đây họ cũng từng nghiên cứu các giống loài này, giống như những gì chúng ta đang làm bây giờ... điểm khác biệt duy nhất là, họ có thể lấy chúng ra làm đủ mọi thí nghiệm khi những giống loài này vẫn còn sống.\n\nNgay khi khôi phục được nguồn điện cho khu khảo cổ và cơ sở dữ liệu, [Leader.GetName] lập tức bắt tay vào công việc, cố gắng tổng hợp bất kỳ thông tin hữu ích nào thu thập được từ đó."
 arcsite.2030.proceed: "Chúng ta đã phát hiện ra bí ẩn gì?"
 arcsite.2040.name: "Bước Đột phá"
 arcsite.2040.revelation.desc: "Chúng ta đã đối chiếu những kiến thức thu được từ nghiên cứu trước đó với thông tin trong cơ sở dữ liệu. Kết luận rút ra khiến người ta phải rùng mình. Rất rõ ràng, hàng ngàn năm trước, một nền văn minh có khả năng du hành không gian đã đáp xuống hành tinh này, và phát hiện ra rằng những giống loài bản địa có thể dễ dàng bị thuần hóa bằng cách sử dụng công nghệ thao túng gen mà họ nắm giữ. Ban đầu, họ biến những nhóm cư dân có trí tuệ —— dù chưa phát triển hoàn thiện —— thành nô lệ, và tiến hành đủ mọi thí nghiệm trên cơ thể họ. Những thí nghiệm này bao gồm việc biến đổi họ thành vật liệu xây dựng sống nhằm phục vụ cho mục đích kiến trúc. Ngoài ra, còn có những nô lệ biết nghe lời. Thậm chí là thú cưng hoặc gia súc.\n\nNhững mẫu vật chúng ta tìm thấy trước đây rất có thể là di hài của các giống loài này, khi đó chúng vẫn chưa thoái hóa thành một phần của sinh quyển không có trí tuệ xanh tươi trên [from.planet.GetName] ngày nay. Đối với một giống loài mà trong một ngày nào đó ở tương lai có thể băng qua toàn bộ dải ngân hà như chúng ta, đây thực sự là một kết cục kinh hoàng."
 arcsite.2040.ignorance.desc: "Rất rõ ràng, hàng ngàn năm trước, một nền văn minh tiên tiến đã phát hiện ra những giống loài cư ngụ tại đây và rất hứng thú với việc nghiên cứu chúng. Họ bị mê hoặc bởi sinh quyển đa dạng của địa phương. Cơ sở dữ liệu cũ kĩ vẫn hoạt động, bên trong ghi chép lại những kết luận kỳ lạ và những thí nghiệm khiến người ta không khỏi lo âu. Cơ sở dữ liệu chứa cấu trúc gen cơ bản của giống loài này, cũng như cách chúng tiến hóa trong quá khứ và tương lai.\n\nChuyện gì đã xảy ra với những nhà nghiên cứu này? Liệu họ có thoái hóa thành những kẻ sống trong hang mà chúng ta đã phát hiện ra trước đây? Hay ngược lại, chính những nhà nghiên cứu này đã tiến hóa từ những kẻ sống trong hang, và rời khỏi hành tinh này vào một thời điểm nào đó? Tất cả những điều này không khỏi khiến chúng ta suy ngẫm: Vũ trụ còn che giấu những bí ẩn nào nữa?"
 arcsite.2040.revelation: "Thật quá sức đáng sợ."
 arcsite.2040.ignorance: "Vũ trụ bao la, không gì là không thể."
 arcsite.2040.phobe: "Điều này chứng tỏ tuyệt đối không được tin tưởng người ngoài hành tinh!"
 arcsite.2040.phile: "Chính phủ của chúng ta tuyệt đối sẽ không bao giờ phạm phải tội ác tày trời như vậy!"
 arcsite.2040.evopred.ignorance: "Thật là hào phóng và vị tha!"
 arcsite.2040.evopred: "Dải ngân hà thật tàn khốc."
 engineered_species_revelation: "Sự thật Lạnh lùng" #modifier
 engineered_species_revelation_desc: "Dù không thể tiếp nhận những kiến thức do người ngoài hành tinh đã biến mất từ lâu để lại, cũng như các mẫu thử nghiệm thao túng gen của họ, sự việc này vẫn dạy chúng ta rằng không gian không phải là một nơi thân thiện. Biết đâu một ngày nào đó thợ săn lại trở thành con mồi."
 engineered_species_ignorance: "Vũ trụ Huyền bí" #modifier
 engineered_species_ignorance_desc: "Khám phá vũ trụ là một sự nghiệp đầy rẫy những điều kỳ diệu. Ngay cả ở nơi xa xôi nhất, dưới những điều kiện khắc nghiệt nhất của dải ngân hà, sự sống vẫn có thể được phôi thai, tất cả những điều này khiến chúng ta không khỏi kinh ngạc. Người dân của chúng ta, bị thu hút bởi những câu chuyện về sự chung sống hài hòa giữa các sinh vật khác nhau, luôn sẵn sàng tự mình đối mặt với những bí ẩn của vũ trụ."
 engineered_species_ownway: "Đồng nhất Tư tưởng"
 engineered_species_ownway_desc: "Vũ trụ vô cùng khắc nghiệt, nhưng chúng ta phải kiên định nắm vững ngọn cờ lý tưởng của con đường mình đã chọn, để không đi vào vết xe đổ của những kẻ đã diệt vong trước đó."
 #Debris Belt
 site_debris_belt: "Vành đai Mảnh vỡ"
 site_debris_belt_desc: "Quá trình quét hệ sao [From.Planet.System.GetName] của chúng ta cho thấy, vành đai tiểu hành tinh của nó là một loại rất bất thường. Thay vì là một mớ hỗn độn gồm đất đá, băng giá và rác không gian thường tạo nên những cấu trúc như vậy, nó trông giống như tàn tích của nhiều trạm cư trú nhân tạo khổng lồ. Rõ ràng là nó đã bị hủy diệt bởi một thế lực bạo tàn không thể tưởng tượng nổi vào một thời điểm nào đó trong vòng vài ngàn năm qua. Chắc chắn có vô số bí mật đang ẩn giấu trong bãi rác khổng lồ này, nhưng do quy mô quá lớn, việc lập bản đồ sẽ tiêu tốn khá nhiều thời gian."
 r_odryskan_crystal: "Pha lê Odryskan"
 r_odryskan_crystal_desc: "Một viên pha lê có giá trị không thể đong đếm. Tương truyền rằng, chỉ một mảnh vụn bong ra từ nó cũng đủ khiến người bình thường chìm vào cơn điên loạn."
 r_odryskan_crystal_regular_effect: "Một nhà khoa học của chúng ta có thể nhận được đặc điểm §Y$leader_trait_maniacal$§!."
 NAME_The_Cabin: "Túp lều"
 arcsite.2500.name: "Túp lều"
 arcsite.2500.desc: "Chúng ta không phải là những người đầu tiên phát hiện ra vành đai mảnh vỡ trong hệ sao §Y[From.Planet.System.GetName]§!: chúng ta đã tìm thấy một con tàu nhỏ đến mức bị các [Root.Owner.GetResearchers] gọi đùa là “túp lều không gian”, bên trong có hài cốt của một người ngoài hành tinh thuộc loài độc hại cùng vô số pha lê dữ liệu. Dựa vào mức độ phân hủy, sinh vật ngoài hành tinh này rất có thể mới qua đời vài thế kỷ trước."
 arcsite.2505.name: "Cư trú Dài hạn"
 arcsite.2505.desc: "Những viên pha lê dữ liệu tìm thấy trong túp lều không gian của người ngoài hành tinh thực chất là các cuốn nhật ký nhiệm vụ. Các [Root.Owner.GetResearchers] của chúng ta đã gửi về một bản mẫu cùng với bản dịch sơ lược. Giọng điệu mở đầu của nó rất phấn chấn:\n\n“Đây là cơ hội ngàn năm có một trong đời. Pha lê Odryskan trong truyền thuyết dường như đang ở ngay trong tầm tay. Ngôi nhà mới của tôi hơi tồi tàn một chút, nhưng với tôi thế là đủ rồi, vì tôi sẽ sớm có thể gửi đủ tiền về nhà để chữa bệnh cho con gái.”\n\nTuy nhiên, chẳng bao lâu sau, nhật ký bắt đầu trở nên chua xót:\n\n“Vợ và con gái tôi đều đã chết. Sẽ chẳng còn ai trên cõi đời này khóc thương cho tôi nữa. Việc bán phế liệu thu gom được ở chợ đen chỉ đủ sống lay lắt qua ngày. Giờ có hối hận thì cũng đã quá muộn.”\n\nSinh vật ngoài hành tinh này đã lãng phí hơn năm mươi năm trong vành đai mảnh vỡ để tìm kiếm báu vật nhưng cuối cùng lại trắng tay."
 arcsite.2505.A: "Trong ngần ấy thời gian, họ chắc chắn phải phát hiện ra thứ gì đó chứ!"
 arcsite.2515.name: "Chìm vào Điên loạn"
 arcsite.2515.desc: "Không thể nào\nKhông thể nào\nKhông thể nào\nKhông thể nào\n§RKẻ dối trá!§!\n……\n……\n……\nLỡ đâu đó là sự thật thì sao?\n\nKhi người ngoài hành tinh này trượt dài vào hố sâu của sự điên loạn, nội dung nhật ký cũng trở nên ngày càng rùng rợn."
 arcsite.2520.name: "Cuối cùng cũng được Yên nghỉ"
 arcsite.2520.desc: "Các [Root.Owner.GetResearchers] của chúng ta đã hoàn tất việc dịch pha lê nhật ký của người ngoài hành tinh. Họ trình lên bản dịch của cuốn nhật ký cuối cùng, được ghi lại ngay trước khi người ngoài hành tinh này qua đời, với sự tỉnh táo hiếm hoi:\n\n“Cuối cùng tôi cũng đã tìm thấy thứ mà tôi luôn dày công tìm kiếm. Nhiều người sẽ nghĩ tôi giống như một gã điên khi dành chừng ấy năm để săn lùng vật này. Tôi thấy có lẽ họ cũng không sai. Tôi sắp chết già đến nơi, còn bạn bè, người thân thì cũng đã mồ yên mả đẹp từ lâu. Bất kể là tìm được bảo vật gì, bây giờ đem bán đi cũng chẳng còn ý nghĩa nữa, nhưng chắc tôi đã có thể yên nghỉ rồi.”\n\nPhần sau của nhật ký đính kèm vị trí của kho báu mà người ngoài hành tinh này tìm được. Dựa vào đó, chúng ta đã lần theo dấu vết và tìm thấy một viên đá quý khổng lồ với kích thước đáng kinh ngạc, giá trị của nó là không thể đong đếm."
 arcsite.2520.A: "Bảo bối của chúng ta……"
 #Krazura Arcsite
 site_krazura_dig: "Di chỉ Cố đô"
 site_krazura_desc: "Chúng ta đã phát hiện ra phế tích của một thành phố cổ trên [From.Planet.GetName]. Dựa vào kích thước và quy mô của nó, rất có thể đây là thủ đô hoặc khu dân cư không gian chính của một nền văn minh giữa các vì sao.\n\nĐể tìm hiểu nguồn gốc của tàn tích này, chúng ta cần tiến hành khai quật toàn diện."
 arcsite.3025.name: "Tổ chim Vỡ vụn"
 arcsite.3025.desc: "Những điện thờ tráng lệ và các ngôi đền đổ nát điểm xuyết khắp thủ đô. Quá trình khám phá sâu hơn tiết lộ rằng nền văn minh này đã bị hủy diệt từ hơn năm trăm ngàn năm trước.\n\nDựa trên một vài bức bích họa được bảo tồn khá tốt, những cư dân bản địa ở đây dường như có đặc điểm sinh học gần giống với loài chim. Việc chuyển tự sơ bộ ngôn ngữ của họ cho thấy, họ tự gọi mình là “Krazura”."
 arcsite.3025.a: "Tiếp tục đào."
 arcsite.3030.name: "Tàn tích Khe nứt"
 arcsite.3030.intro: "Quá trình khai quật sâu hơn đã mang lại một khám phá đáng kinh ngạc: một hang động khổng lồ, đủ sức chứa những ngọn núi nhỏ trên hành tinh này. Mặc dù quy mô kiến trúc của nó gây ấn tượng mạnh, “đại sảnh” này dường như không có chức năng rõ ràng, chỉ có duy nhất một lối ra vào.\n\nBức tường bên trong của đại sảnh có hình cầu thô này lưu lại dấu vết của sự bóp méo không gian chiều cường độ cao; hoàn toàn có thể kết luận một cách hợp lý rằng, mật thất này được xây dựng bao quanh một lỗ sâu hoặc một cổng dịch chuyển không gian đa chiều."
 arcsite.3030.a.desc: "$arcsite.3030.intro$\n\nQuan trọng hơn, một bức bích họa được khắc bên ngoài đại điện đã mang đến một phát hiện khó tin: hành tinh này không phải nơi nào khác mà chính là Skaravid, quê hương tổ tiên của vị tư lệnh hạm đội lừng danh Skrand Sharpbeak!"
 arcsite.3030.b.desc: "$arcsite.3030.intro$\n\nBức bích họa được khắc bên ngoài đại sảnh này chỉ ra rằng hành tinh này từng được gọi là Skaravid."
 arcsite.3030.tt: "Tên của hành tinh này đã được đổi thành §YSkaravid§!"
 arcsite.3031.name: "Không đâu bằng Tổ"
 arcsite.3031.desc: "Các vị đã tìm thấy Skaravid. Ta từng nghĩ rằng mình đã vĩnh viễn đánh mất quê hương.\n\nNếu có cơ hội, ta sẽ cắm móng vuốt của mình vào lớp đất của nó, cảm nhận ngọn gió phương nam ấm áp luồn qua lớp lông vũ... Những gì các vị đã làm cho ta và đồng bào ta là không thể đong đếm.\n\nCả cơ thể lẫn tâm trí ta đều cảm thấy như được tái sinh. Ta thành tâm biết ơn các vị."
 arcsite.3031.a: "Chúc ngài may mắn, Tư lệnh."
 arcsite.3035.name: "Mở rộng Tầm mắt"
 arcsite.3035.desc: "Chúng ta đã xác định được rằng người Krazura không đến từ chiều không gian của chúng ta. Họ đã đến đây thông qua một dạng cổng dịch chuyển nào đó, và nhận ra mình đang trôi dạt trong một hệ sao xa lạ. Rất lâu sau đó, họ đã xây dựng đại sảnh này bao quanh địa điểm mà họ đáp xuống.\n\nMột vài ghi chép ít ỏi còn sót lại cho thấy, họ tự coi mình là những người phán xử của những thế lực vĩ đại và bí ẩn. Lãnh tụ tối cao của họ, được gọi là “Yakura”, được cho là một cá thể độc lập, sẽ chuyển đổi sang một cơ thể mới sau mỗi thế hệ.\n\nBên dưới đại sảnh, chúng ta đã khai quật được hài cốt của một vài vị cai trị. Điều thú vị là, những vị cai trị đời đầu có cấu trúc gen khác với các đời sau. Có vẻ như chuyến du hành đến vũ trụ này đã ảnh hưởng đến DNA của người Krazura, dẫn đến sự xuất hiện của mắt “kép”."
 arcsite.3035.b.evopred: "Ngươi nói cái gì? Gen liên không gian?"
 arcsite.3040.name: "Kẻ Đe dọa"
 arcsite.3040.desc: "Người Krazura ban đầu vốn là những người tị nạn trong vũ trụ của chúng ta. Tuy nhiên, những ghi chép được tìm thấy gần đại điện cho thấy họ đã nhanh chóng thiết lập một đế chế giữa các vì sao hùng mạnh. Đồng bào của họ duy trì sự thịnh vượng qua nhiều thế hệ. Quyền năng và vị thế tối cao của Yakura là không thể nghi ngờ. Thế rồi, “mối đe dọa” xuất hiện.\n\nKẻ thù không tên này hoàn toàn khác biệt với bất kỳ kẻ thù nào họ từng chạm trán trước đây, và dường như quyết tâm hủy diệt họ. Yakura, những bậc hiền triết vĩ đại nhất, đã hoàn toàn bất lực trước mối đe dọa khủng khiếp này, mọi tài năng kiệt xuất của họ đều trở nên vô dụng."
 arcsite.3045.name: "Chuyến Di cư Cuối cùng"
 arcsite.3045.a.desc: "Chúng ta đã phát hiện ra một loạt ghi chép, cung cấp manh mối để tìm hiểu số phận của người Krazura.\n\nNgười chỉ huy soái hạm hải quân của họ là một vị tư lệnh huyền thoại, một anh hùng vĩ đại của dân tộc ông. Ngay trước khi mối đe dọa ngoài hành tinh giành được chiến thắng cuối cùng, ông và phi hành đoàn của mình đã được phái đi thực hiện một nhiệm vụ đầy táo bạo và cũng là cuối cùng. Để luồn ra phía sau kẻ thù, họ đã tiến vào một cổng không gian chưa từng được thử nghiệm. Kể từ đó, con tàu và phi hành đoàn của nó bặt vô âm tín.\n\nĐiều gì đã xảy ra trong quá trình đó vẫn còn là một bí ẩn. Liệu con tàu này vẫn còn khả năng tồn tại hay không?"
 arcsite.3045.b.desc: "Chúng ta đã phát hiện ra một loạt ghi chép, cung cấp manh mối để tìm hiểu số phận của người Krazura.\n\nĐể táo bạo luồn ra phía sau kẻ thù, Yakura đã ra lệnh cho soái hạm xuyên qua một cổng không gian chưa từng được thử nghiệm. Vị tư lệnh hạm đội đó chính là Skrand Sharpbeak huyền thoại.\n\nÔng cùng phi hành đoàn của mình đã kế thừa một di sản phi thường. Bất kể Skrand có sẵn lòng chấp nhận tước hiệu này hay không, đồng bào hiện tại đã coi ông như Yakura."
 arcsite.3045.a: "Cầu mong ngài sải cánh bay cao."
 #Krazura Random Events
 arcsite.3055.name: "Loài Chim Điềm gở"
 arcsite.3055.desc: "Mặc dù tiến độ tổng thể bị đình trệ, các [owner.GetResearchers] của chúng ta vẫn phát hiện ra một căn phòng chưa từng được biết đến trước đây. Bên trong đó là một bức tượng đồ sộ, tráng lệ và tuyệt đẹp.\n\nNó có hình dáng của một loài chim, với chiếc cổ dài và khỏe khoắn được tạo thành từ những sợi xích kim loại, không rõ vì sao lại có thể lơ lửng bên trên. Những chiếc lông vũ sắc nhọn bung ra từ hộp sọ mang dáng vẻ trang nghiêm, đôi mắt vàng rực của nó tượng trưng cho quyền lực. Khi đi ngang qua đại sảnh, các [owner.GetResearchers] cảm thấy một sự khó chịu, như thể đang bị ai đó dòm ngó.\n\nHọ đã tìm thấy một cánh cửa hoặc một phong ấn ẩn giấu phía sau bức tượng này, bất kể loài chim điềm gở này đang canh giữ thứ gì, bùa hộ mệnh của nó đã mất tác dụng từ lâu."
 arcsite.3060.name: "Bệnh Rụng lông"
 arcsite.3060.desc: "Dựa trên những khám phá của chúng ta cho đến nay, nền văn minh này không hề xa lạ với những bi kịch.\n\nNhững ghi chép cổ xưa được lưu giữ trong một dạng hầm mộ hay lăng tẩm dưới lòng đất miêu tả chi tiết về sự bùng phát của một đại dịch quy mô lớn, lây lan và làm ảnh hưởng đến các đặc điểm sinh lý của loài chim này theo một cách thức đặc biệt kinh hoàng.\n\nBan đầu, triệu chứng xuất hiện trên lớp lông vũ, khi virus khiến cho lông bắt đầu thối rữa từ tận gốc. Chỉ trong vài ngày, các triệu chứng này sẽ lây lan vào máu. Mặc dù không thể khẳng định chắc chắn, nhưng ước tính sơ bộ cho thấy tỷ lệ tử vong vượt quá 30%.\n\nMột đài tưởng niệm đau thương được dựng lên trên một quảng trường ở trung tâm thành phố. Đứng trên một đống xương cốt, một bộ xương chim đang tuyệt vọng ngước nhìn bầu trời, những chiếc lông vũ rơi rụng của nó vương vãi trên đôi móng vuốt mỏng manh."
 arcsite.3060.a: "Mới nghĩ đến thôi đã thấy rùng mình."
 arcsite.3060.b: "Đáng sợ."
