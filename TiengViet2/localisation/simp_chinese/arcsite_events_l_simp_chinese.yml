 #RANDOM EVENTS
 ################
 arcsite.9000.name: "Người Gác đêm Cô độc"
 arcsite.9000.desc: "Trưởng nhóm khảo cổ [leader.GetName] dạo gần đây ngày càng trở nên khép kín. [leader.GetHeSheCap] có vẻ như ngày càng thờ ơ với dự án nghiên cứu, thay vào đó lại đắm chìm vào tất cả những cuốn nhật ký và ghi chép được tìm thấy cho đến nay. [leader.GetHeSheCap] còn luôn miệng lẩm bẩm: “Những người này hẳn phải cảm thấy cô đơn đến nhường nào.”\n\nĐây có lẽ là tác động tiêu cực gây ra bởi hiện trường khai quật hoang vắng. Chúng ta có thể cung cấp dịch vụ tư vấn tâm lý cho toàn đội, hoặc đặt niềm tin vào [leader.GetName], để [leader.GetHimHer] tự tìm ra giải pháp trong lúc làm việc." #Uses he/she/they loc., i.e. 'She appears' vs. 'They appear'
 arcsite.9000.a: "Sắp xếp đi, sức khỏe của các thành viên là quan trọng nhất."
 arcsite.9000.b: "Cứ mặc [leader.GetHimHer], biết đâu [leader.GetHeShe] thực sự đã phát hiện ra điều gì đó."
 arcsite.9001.desc: "Trưởng nhóm khảo cổ [absconded_archaeologist.GetName] hiện đã mất tích, và biến mất cùng với [absconded_archaeologist.GetHimHer] là một lượng lớn dữ liệu nhân chủng học. Các thành viên trong nhóm báo cáo rằng một phương tiện di chuyển trên mặt đất đã biến mất, nhưng đồ bảo hộ của chúng ta vẫn còn để lại ở căn cứ.\n\nCó khả năng [absconded_archaeologist.GetName] đã chạy đến một khu định cư tàu ngầm khác ở vùng lãnh nguyên. Tuy nhiên xét về thực tế, chúng ta phải chuẩn bị sẵn tinh thần cho tình huống xấu nhất."
 arcsite.9001.a: "Thật sự quá đáng tiếc."
 arcsite.9002.desc: "Nhà khảo cổ [leader.GetName] đã phải trả một cái giá đắt. Mặc dù trông có vẻ vô cùng tiều tụy, nhưng [leader.GetHeShe] đã quay trở lại đội, và đưa ra một giả thuyết đầy sức thuyết phục. Chúng ta dường như đã bỏ qua một vài chi tiết tinh vi trong các bộ hồ sơ cá nhân. Dù sao đi nữa, những manh mối này sẽ hỗ trợ chúng ta, mang đến bước đột phá mà cả đội luôn mong mỏi."
 arcsite.9002.a: "Nhưng điều đó có thực sự đáng không?"
 arcsite.9005.name: "Cỗ máy Phá băng"
 arcsite.9005.desc: "Đội khai quật trên [fromfrom.planet.GetName] đang theo sát tiến độ công việc của các [owner.GetResearchers] trên [owner.capital_scope.GetName], bằng cách thử nghiệm nhiều phương pháp mới để đào xới lớp lãnh nguyên cứng cáp. Đội mặt đất đã triển khai một nguyên mẫu máy xúc, với thiết kế chịu ảnh hưởng lớn từ công nghệ cải tạo môi trường.\n\nCác thử nghiệm ban đầu cho thấy, cỗ máy này sẽ đẩy nhanh đáng kể tiến độ công việc của chúng ta. Tuy nhiên, các thành viên trong đội đã phát hiện ra §Hmột số rủi ro§!. Nếu muốn cố gắng kiểm soát những rủi ro này, chúng ta sẽ cần phải cấp thêm ngân sách."
 arcsite.9005.a: "Rủi ro và chi phí tiềm ẩn quá lớn."
 arcsite.9005.tt.carefree: "§H$site_ice_trauma$§! nhận thêm §G4 manh mối§!\n§H[leader.GetName]§! nhận được đặc điểm:\n$t$Đặc điểm §Y$leader_trait_carefree$§!\n$t$Kinh nghiệm: +§G150§!" #directly follows loc string 'RANDOM_EFFECT'
 arcsite.9005.tt.paranoid: "§H$site_ice_trauma$§! mất đi §R2 manh mối§!\n§H[leader.GetName]§! nhận được đặc điểm:\n$t$Đặc điểm §Y$leader_trait_paranoid$§!\n$t$Kinh nghiệm: +§G50§!" #directly follows loc string 'RANDOM_EFFECT'
