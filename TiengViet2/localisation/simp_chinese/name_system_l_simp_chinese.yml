 # KIỂM TRA CHỮ SỐ
 # Lưu ý: Bạn có thể dùng lệnh console "number_test" trong game để xác minh xem các con số trông đã đúng chưa.
 # Chỉ định một con số "number_test 5" hoặc một khoảng "number_test 2-5".
 # Chuỗi gốc "NUMBERS_TEST" quyết định những định dạng nào sẽ được dùng để kiểm tra;
 # Mỗi $entry$ trong chuỗi đó sẽ được tìm bằng khóa loc: "NUMBERS_TEST_entry"
 NUMBERS_TEST_C: "$C$"
 NUMBERS_TEST_CC: "$CC$"
 NUMBERS_TEST_CCC: "$CCC$"
 NUMBERS_TEST_ORD: "$ORD$"
 NUMBERS_TEST_HEX: "$HEX$"
 NUMBERS_TEST_R: "$R$"
 NUMBERS_TEST: "$C$ $CC$ $CCC$ $ORD$ $HEX$ $R$"
