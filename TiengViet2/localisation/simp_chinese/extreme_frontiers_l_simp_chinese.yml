 #############
 # Anomalies #
 #############
 EXTREME_FRONTIERS_TITLE: "Cận Biên Cực Hạn" # Do not translate
 # PULSATING OBJECT
 PULSATING_OBJECT_TOXIC_CAT: "Vật Thể Phập Phồng"
 PULSATING_OBJECT_GAS_GIANT_CAT: "Vật Thể Phập Phồng"
 PULSATING_OBJECT_BARREN_CAT: "Vật Thể Phập Phồng"
 PULSATING_OBJECT_BARREN_COLD_CAT: "Vật Thể Phập Phồng"
 PULSATING_OBJECT_FROZEN_CAT: "Vật Thể Phập Phồng"
 PULSATING_OBJECT_MOLTEN_CAT: "Vật Thể Phập Phồng"
 anomaly_pulsating_object_desc: "Quét sơ bộ §Y[this.GetName]§! phát hiện một vật thể lạ lơ lửng trong tầng đối lưu, nó co giãn liên tục khi thay đổi vị trí. Cần điều tra thêm để làm rõ bản chất của nó."
 extreme_frontiers.100.title: "Khí Cầu Khí Tượng Cổ"
 extreme_frontiers.100.desc: "§Y[Leader.GetName]§! xác nhận vật thể bay bí ẩn trên §Y[from.GetName]§! là một khí cầu khí tượng cổ xưa. Điều kiện khí quyển khắc nghiệt trên hành tinh này đã xóa sạch mọi dấu vết về nguồn gốc của nó.\n\nĐịnh tuổi bằng đồng vị phóng xạ cho thấy nó đã trôi nổi trong bầu khí quyển [from.GetName] ít nhất một thế kỷ, nương theo những thay đổi áp suất đặc thù của hành tinh khiến kích thước của nó co giãn theo.\n\nThật khó tin là các tấm pin mặt trời của nó vẫn hoạt động, và dàn cảm biến hiện đang lưu giữ dữ liệu khí quyển quý giá suốt một trăm năm qua. Điều này đã khơi dậy sự quan tâm lớn từ các [Root.Owner.GetResearchers] của chúng ta."
 # MOLTEN METAL OCEAN
 MOLTEN_METAL_OCEAN_CAT: "Dòng Dung Nham Cực Hạn"
 anomaly_molten_metal_ocean_desc: "Khảo sát sơ bộ bề mặt §Y[from.GetName]§! phát hiện những đợt sóng thần dung nham siêu nóng chứa nồng độ kim loại nặng cao thường xuyên xảy ra. Cần phân tích sâu hơn để hiểu rõ hiện tượng này."
 extreme_frontiers.110.title: "Sóng Thần Kim Loại"
 extreme_frontiers.110.desc: "§Y[Leader.GetName]§! xác nhận các đại dương dung nham trên §Y[from.GetName]§! chứa các dạng tinh khiết của hầu hết mọi kim loại hiếm trong bảng tuần hoàn.\n\nNồng độ kim loại lỏng cực cao này hội tụ tạo ra các điện từ trường dữ dội, dẫn đến những đợt sóng thần kim loại nóng chảy thường xuyên.\n\nSử dụng mô hình dự đoán, chúng ta đã xác định được những khoảng nghỉ ngắn nhưng có quy luật giữa các đợt sóng thần, có thể tận dụng để thu hoạch các khoáng sản phong phú độc nhất này."
 # GREAT BLUE SPOTS
 GREAT_BLUE_SPOTS_CAT: "Đại Lam Điểm"
 great_blue_spots_desc: "Bề mặt §Y[from.GetName]§! xuất hiện hai mảng màu sắc riêng biệt di chuyển liên tục với tốc độ cực nhanh, có thể nhìn thấy rõ từ không gian. Những cấu trúc màu xanh này rất thú vị và đáng để nghiên cứu thêm."
 extreme_frontiers.120.title: "Siêu Bão Cộng Sinh"
 extreme_frontiers.120.desc: "Đại Lam Điểm trên §Y[from.GetName]§! thực chất là một cặp siêu bão đôi; một xoáy thuận và một xoáy nghịch hỗ trợ lẫn nhau tạo nên một trạng thái cân bằng hoàn hảo.\n\nCặp bão này có quy mô khổng lồ, vận tốc gió thường xuyên vượt qua rào cản âm thanh, liên tục tạo ra những tiếng nổ vang dội. Bão chứa một lượng lớn bụi kim loại Coban, tạo nên sắc xanh đặc trưng.\n\n§Y[Leader.GetName]§! ước tính cặp bão này đã gào thét tại đây hơn một thế kỷ, lượng khoáng vật tích tụ ở tầng khí quyển trên có thể dễ dàng thu thập bằng các trạm khai thác."
 # FROZEN INFERNO
 FROZEN_INFERNO_CAT: "Xung Nhiệt"
 frozen_inferno_desc: "Quét sơ bộ §Y[from.GetName]§! phát hiện những đỉnh nhiệt bất thường trên thiên thể băng giá này. Sự bất thường về nhiệt độ này cần được điều tra ngay."
 extreme_frontiers.130.title: "Địa Ngục Băng Giá"
 extreme_frontiers.130.desc: "§Y[Leader.GetName]§! đã hoàn tất điều tra các điểm nhiệt bất thường trên hành tinh băng giá §Y[from.GetName]§!.\n\nDưới tầng đất đóng băng vĩnh cửu vô tận là những trầm tích núi lửa hoạt động mạnh. Những vật chất này ban đầu ở trạng thái trơ nằm sâu dưới băng, nhưng được đưa lên bề mặt theo định kỳ khi các dải băng lục địa trôi dạt và nứt vỡ.\n\nNhững khí siêu dễ cháy này khi thoát lên bề mặt sẽ bùng cháy tức thì trong bầu khí quyển giàu oxy của [from.GetName], gây ra những vụ nổ chớp nhoáng thường xuyên trên khắp hành tinh.\n\nCác vật chất dễ cháy độc đáo này có thể được chiết xuất bằng thiết bị chuyên dụng để sử dụng cho các mục đích khác."
 # POISONED ATMOSPHERE
 POISONED_ATMOSPHERE_CAT: "Khí Quyển Độc Hại"
 poisoned_atmosphere_desc: "Phát hiện nồng độ cao các phân tử hữu cơ độc hại ở tầng khí quyển trên của §Y[from.GetName]§!."
 extreme_frontiers.140.title: "Khí Quyển Độc Hại"
 extreme_frontiers.140.desc.hive_mind: "§Y[from.GetName]§! là ngôi nhà của một loài địa y đặc biệt, chúng thải các phân tử cực độc vào khí quyển để bảo vệ bản thân khỏi những kẻ săn mồi.\n\nNghiên cứu hồ sơ hóa thạch cho thấy [from.GetName] từng có hệ sinh thái đa dạng, nhưng loài địa y này đã tăng nồng độ thạch tín và thali trong khí quyển với tốc độ vượt quá khả năng thích nghi của sinh vật, khiến các loài khác dần bị tuyệt chủng.\n\n§Y[Leader.GetName]§! chỉ tìm thấy một sinh vật khác còn sống sót, một loài bò sát lớn, chúng tồn tại được nhờ các tuyến giải độc hiệu quả cao.\n\nNghiên cứu thêm về cơ quan đặc biệt này có thể mang lại những hiểu biết mới về việc giải độc khí quyển."
 extreme_frontiers.140.desc.default: "$extreme_frontiers.140.desc.hive_mind$\n\nCác thử nghiệm ban đầu cũng cho thấy các hợp chất độc đáo trong chất độc này có thể ứng dụng trong công nghiệp vũ trụ."
 extreme_frontiers.140.a: "Tiềm năng khá thú vị..."
 extreme_frontiers.140.b: "Chế biến nó thành nước hoa."
 DETOXIFICATION_GLAND_PROJECT: "Nghiên cứu Tuyến Giải Độc"
 DETOXIFICATION_GLAND_PROJECT_DESC: "Một loài sinh vật dạng bò sát đặc biệt đang phát triển mạnh trong bầu khí quyển độc hại của §Y[from.GetName]§!, bí mật nằm ở một cơ quan nội tạng độc đáo giúp chuyển hóa các độc chất cực mạnh thành dưỡng chất có lợi. Việc nghiên cứu thêm sinh vật này rất đáng để thử."
 extreme_frontiers.145.title: "Hiểu Biết Về Giải Độc"
 extreme_frontiers.145.desc: "Sau khi nghiên cứu sâu về tuyến của loài bò sát được tìm thấy trên §Y[from.GetName]§!, §Y[Leader.GetName]§! đã khám phá ra bí mật sinh học đằng sau khả năng kháng độc đặc biệt của chúng.\n\nCơ quan phức tạp này tiết ra một hợp chất trung hòa chất độc trong khí quyển, ngăn hệ tuần hoàn của loài bò sát hấp thụ độc tố. Tuyến có khả năng thích nghi cực cao này thậm chí có thể trung hòa cả những độc chất chết người nhất được tạo ra trong phòng thí nghiệm của chúng ta.\n\nNhững phát hiện phi thường này sẽ thay đổi hoàn toàn phương thức giải độc khí quyển của chúng ta."
 # GLIMPSE OF THE CORE
 GLIMPSE_CORE_CAT: "Cái Nhìn Vào Lõi"
 glimpse_the_core_desc: "Hoạt động kỳ lạ của các lớp khí bên ngoài §Y[from.GetName]§! đã tạo ra những khe hở sâu thẳm, để lộ lõi rắn của hành tinh trong thời gian ngắn. Hiện tượng độc đáo này cần được nghiên cứu thêm."
 extreme_frontiers.150.title: "Nhân Hữu Cơ"
 extreme_frontiers.150.desc: "Thông qua các khe hở tạm thời trên §Y[from.GetName]§!, §Y[Leader.GetName]§! đã đưa tàu thăm dò vào và phát hiện nhân của hành tinh là nơi cư ngụ của một loài sinh vật đơn bào, không giống với bất kỳ sinh vật nào từng thấy trước đây.\n\nNhững tế bào kiên cường này dường như thích nghi hoàn hảo với áp suất cực lớn, hoạt động sinh sản theo mùa của chúng thải ra một lượng lớn khí hydro. [Leader.GetName] tin rằng đây chính là lý do hành tinh này duy trì được lớp vỏ hydro.\n\nTiêu diệt những sinh vật này sẽ khiến lớp vỏ khí tan biến, để lộ ra một hành tinh đá có thể định cư."
 extreme_frontiers.150.a: "Tiêu diệt chúng."
 extreme_frontiers.150.b: "Đây là một cơ hội quan sát độc đáo."
 PURIFY_CORE_PROJECT: "Thanh Tẩy Lõi"
 PURIFY_CORE_PROJECT_DESC: "Lớp vỏ khí bên ngoài của §Y[from.GetName]§! được duy trì bởi quá trình sinh hóa đặc biệt của các sinh vật đơn bào sống tại lõi. Tiêu diệt chúng sẽ làm tan biến lớp khí, giúp hành tinh đá bên dưới trở nên dễ sống hơn."
 extreme_frontiers.155.title: "Thế Giới Mới"
 extreme_frontiers.155.desc: "§Y[Leader.GetName]§! đã gửi một tàu thăm dò mang vũ khí qua khe hở trên §Y[from.From.GetName]§!. Khi chạm tới lõi, nó giải phóng độc chất, lây nhiễm và tiêu diệt các sinh vật đơn bào tại đó.\n\nChúng ta thấy lớp vỏ khí của [from.From.GetName] dần tan biến vào hư không, để lại một hành tinh đá nhỏ gọn."
 extreme_frontiers.155.a: "Một kỳ tích đầy ấn tượng."
 # OPTICAL PHENOMENA
 OPTICAL_PHENOMENA_CAT: "Bề Mặt Lấp Lánh"
 optical_phenomena_desc: "Quét hình ảnh §Y[from.GetName]§! cho thấy các hiện tượng quang học cực kỳ mạnh mẽ trên bề mặt, dù nguyên nhân của các dải màu này vẫn chưa thể xác định từ khoảng cách quỹ đạo."
 extreme_frontiers.160.title: "Băng Đảo Cầu Vồng"
 extreme_frontiers.160.desc.default: "Điều tra thêm bề mặt §Y[from.GetName]§! đã tìm ra nguyên nhân của hiện tượng quang học gặp phải khi khảo sát từ quỹ đạo.\n\nĐiều kiện khí quyển đã mài giũa phần lớn lớp băng vĩnh cửu của hành tinh thành một lớp bóng trong suốt, để lộ mạng lưới các tinh thể đa sắc phát triển sâu bên dưới. Nhìn từ xa, hiện tượng tự nhiên này tạo ra hiệu ứng như một chiếc kính vạn hoa."
 extreme_frontiers.160.desc.machine: "$extreme_frontiers.160.desc.default$\n\nDù có giá trị thẩm mỹ truyền thống, nhưng nguồn khoáng sản phong phú tại đây mới là mục tiêu thực sự của chúng ta."
 extreme_frontiers.160.tooltip: "Mở khóa §YQuyết định hành tinh§! §H$decision_prismatic_ice_exhibit$§!, hiệu quả như sau:\n£amenities£$MOD_PLANET_AMENITIES_MULT$：§G+25%§!\n$mod_planet_jobs_unity_produces_mult$:§G+25%§!"
 decision_prismatic_ice_exhibit: "Triển Lãm Băng Kính"
 decision_prismatic_ice_exhibit_desc: "Những phiến băng trong suốt như pha lê tạo ra hiệu ứng vạn hoa mê hoặc, có thể được triển lãm trong một khoảng thời gian."
 prismatic_ice_max_3_times_pass: "Chỉ có thể thực hiện tối đa §Y3§! lần."
 prismatic_ice_max_3_times_fail: "$TRIGGER_FAIL$Chỉ có thể thực hiện tối đa §Y3§! lần."
 prismatic_ice_max_3_times_pass_with_var: "$TRIGGER_PASS$$prismatic_ice_max_3_times_pass$ (Hiện tại: §Y[owner.prismatic_ice_exhibit_happened] lần§!)"
 exhibiting_prismatic_ice: "Triển Lãm Băng Kính"
 exhibiting_prismatic_ice_desc: "Những phiến băng trong suốt như pha lê tạo ra hiệu ứng vạn hoa mê hoặc, có thể được triển lãm trong một khoảng thời gian."
 # PLASMA VOLCANOES
 PLASMA_VOLCANO_CAT: "Plasma Quỹ Đạo"
 plasma_volcano_desc: "Chúng ta đã chứng kiến những đợt phun trào plasma siêu nóng nhạy cảm vào tầng khí quyển trên của §Y[from.GetName]§!.\n\nLớp tro núi lửa dày đặc trong khí quyển ngăn cản chúng ta xác định nguồn gốc các tia phun này từ quỹ đạo, và việc nghiên cứu gần có vẻ đầy nguy hiểm."
 extreme_frontiers.170.title: "Núi Lửa Plasma"
 extreme_frontiers.170.desc: "§Y[Leader.GetName]§! đã tìm thấy nguồn gốc của những tia plasma siêu nóng trên §Y[from.GetName]§!.\n\nTừ trường độc đáo của hành tinh đã thúc đẩy phản ứng giữa các vật chất ion hóa sâu trong lớp manti, tạo ra những túi dung nham plasma áp suất cao.\n\nKhi các mảng kiến tạo không ổn định sụp đổ, các plasma này bắn ngược lên trên như những viên đạn pháo chết người, bốc cháy cùng với khí trong khí quyển tạo ra các vụ nổ thứ cấp. Các chuyên gia vũ khí của chúng ta đang rất hào hứng áp dụng những nguyên lý này vào vũ khí plasma của mình."
 extreme_frontiers.170.desc.negative: "Thật không may, nghiên cứu đầy nguy hiểm này đã để lại cho [Leader.GetName] những"
 extreme_frontiers.170.desc.traumatized: "$extreme_frontiers.170.desc.negative$ chấn thương tâm lý nặng nề."
 extreme_frontiers.170.desc.maimed: "$extreme_frontiers.170.desc.negative$ thương tật cơ thể nghiêm trọng."
 # BLACK CLOUDS
 BLACK_CLOUDS_CAT: "Mây Đen"
 black_clouds_desc: "Phát hiện những đám mây đen dày đặc trong khí quyển §Y[from.GetName]§!, chúng di chuyển bất thường bất chấp vận tốc và hướng gió. Những đám mây này chỉ xuất hiện thoáng qua trong các lần quét hình ảnh, và luôn vào cùng một thời điểm trong chu kỳ ngày đêm của hành tinh."
 extreme_frontiers.180.title: "Đàn Côn Trùng Biến Dị"
 extreme_frontiers.180.desc: "Đám mây đen bất thường trên §Y[from.GetName]§! thực chất là những bầy côn trùng ăn thịt lớn dày đặc.\n\nNhững kẻ săn mồi có cánh này làm tổ trong các khe đá, hàng ngày đồng loạt tràn ra để nuốt chửng những vật chất hữu cơ ít ỏi còn lại trên bề mặt hành tinh.\n\nNhờ quá trình trao đổi chất mạnh mẽ có thể đảo ngược sự suy giảm tế bào khi ăn, loài chân khớp này có thể kéo dài tuổi thọ vô hạn miễn là được cung cấp dinh dưỡng định kỳ."
 extreme_frontiers.180.desc.altered_metabolism: "Trong quá trình phân tích thực địa, [Leader.GetName] đã bị một mẫu vật cắn, gây ra một phản ứng trao đổi chất đáng kể. Loài sinh vật độc đáo này còn rất nhiều kiến thức về khả năng tái tạo tế bào hữu cơ để chúng ta học hỏi."
 extreme_frontiers.180.b: "Khai thác sạch chúng để sử dụng."
 leader_trait_altered_metabolism: "Trao Đổi Chất Biến Đổi"
 leader_trait_altered_metabolism_desc: "Việc tiếp xúc với vật chất ngoại lai trong quá trình thực địa đã để lại ảnh hưởng lâu dài lên vị lãnh đạo này."
 # SUBGLACIAL VIBRATIONS
 SUBGLACIAL_VIBRATIONS_CAT: "Rung Động Dưới Băng"
 subglacial_vibrations_desc: "Dưới những vùng hoang mạc băng giá của §Y[from.GetName]§! ẩn chứa những đại dương ngầm khổng lồ. Những rung động ầm ầm được phát hiện dưới lớp băng vĩnh cửu sâu thẳm không thể được phân loại là động đất thông thường."
 extreme_frontiers.190.title: "Chân Kép Khổng Lồ"
 extreme_frontiers.190.desc: "Sự kết hợp giữa định vị tiếng vang dưới biển sâu và viễn thám địa chấn đã xác định được nguồn gốc của những rung động sâu trên §Y[from.GetName]§!. Đại dương nitơ lỏng dưới băng là nhà của một đàn động vật chân kép (pinniped) khổng lồ đã thích nghi với môi trường khắc nghiệt này.\n\nLoài sinh vật ấn tượng này có kích thước và trọng lượng tương đương một tàu vận tải nhỏ. chúng phát ra những tiếng vo ve tần số thấp mạnh mẽ để giao tiếp, âm thanh này thậm chí có thể vang vọng khắp hành tinh. Một lớp mỡ giàu collagen độc đáo bảo vệ chúng khỏi bỏng lạnh và sương giá, đồng thời giúp khuếch đại tiếng gọi trong đại dương.\n\nNhững sinh vật khổng lồ này không có kẻ thù tự nhiên trong hệ sinh thái biệt lập này, chúng rất hiền lành và dễ dàng bị thu hút lên mặt biển bằng cách mô phỏng âm thanh đặc trưng của chúng."
 extreme_frontiers.190.a: "Một phát hiện độc đáo."
 extreme_frontiers.190.a.tt: "Mở khóa công trình: ['building:building_pinniped_sanctuary']"
 extreme_frontiers.190.b: "Chỉ là con mồi."
 building_pinniped_sanctuary: "Khu Bảo Tồn Chân Kép"
 building_pinniped_sanctuary_desc: "Một khu bảo tồn được thiết lập cho những loài động vật chân kép khổng lồ được bắt từ đại dương nitơ lỏng của [event_target:pinnipeds_home_planet.GetName]."
 # ELECTRIC WATERS
 ELECTRIC_WATERS_CAT: "Vùng Biển Mang Điện"
 electric_waters_desc: "Quét quỹ đạo §Y[from.GetName]§! phát hiện các tín hiệu điện bất thường dưới đại dương băng sâu thẳm của hành tinh này.\n\nNghiên cứu thêm về hiện tượng tự nhiên trong nước này có thể mang lại nhiều khám phá hơn."
 extreme_frontiers.200.title: "San Hô Cao Áp"
 extreme_frontiers.200.desc: "§Y[Leader.GetName]§! đã tìm ra nguồn gốc của các dòng điện đại dương sâu trên §Y[from.GetName]§!.\n\nDưới đáy biển là nơi trú ngụ của một loài san hô nước lạnh phức tạp có khả năng phát điện. Loài này sử dụng các bào quan độc đáo để tạo ra dòng điện nhằm thu hút vi sinh vật, cũng như một phương thức săn mồi và giao tiếp.\n\nTàu thăm dò của chúng ta gây kích ứng cho san hô, chỉ cần chúng ta thay đổi tần số truyền tin, san hô sẽ phản ứng bằng cách tăng cường độ dòng điện.\n\nBằng cách điều chỉnh cẩn thận sự tương tác với loài sinh vật biển sâu này, chúng ta có thể tăng sản lượng năng lượng của hành tinh mà không làm hỏng hệ sinh thái mỏng manh."
 # OBSIDIAN PLANET
 OBSIDIAN_PLANET_CAT: "Cảnh Quan Lấp Lánh"
 obsidian_planet_desc: "Quét thị giác §Y[from.GetName]§! phát hiện các mảng lục địa đá hắc diệu thạch bao phủ bề mặt cằn cỗi của hành tinh, với lượng lớn lưu huỳnh tồn dư ở tầng khí quyển trên.\n\nMột cuộc khảo sát địa chất chuyên biệt sẽ cho chúng ta nhiều kết quả hơn."
 extreme_frontiers.210.title: "Hoang Mạc Hắc Diệu Thạch"
 extreme_frontiers.210.desc: "Dựa trên nghiên cứu trầm tích §Y[from.GetName]§!, chúng ta thấy hành tinh này từng đầy núi lửa nhưng đã trải qua một sự kiện làm lạnh đột ngột, khiến dung nham trên bề mặt biến thành những dải thủy tinh núi lửa khổng lồ.\n\nVô số hố va chạm trên bề mặt cho thấy sự kiện này có thể do tác động từ thiên thể bên ngoài, chẳng hạn như một trận bão sao chổi. Bên trong các cấu trúc hắc diệu thạch này là những hốc trống khổng lồ chứa khí lưu huỳnh bị mắc kẹt từ các miệng núi lửa do sự kiện lạnh đột ngột.\n\nThông qua việc chiết xuất chính xác, chúng ta có thể thu hoạch các tài nguyên này để sử dụng."
 # SHEARING FORCE
 SHEARING_FORCE_CAT: "Mất Liên Lạc"
 shearing_force_desc: "Tàu thăm dò được thả vào khí quyển §Y[from.GetName]§! đã ngừng mọi liên lạc. Chúng ta đã mất dấu phần cứng này.\n\nCần một cuộc điều tra cận cảnh để thu hồi dữ liệu."
 extreme_frontiers.220.title: "Lực Cắt"
 extreme_frontiers.220.desc: "Chúng ta đã tìm ra nguyên nhân khiến tàu thăm dò mất tích trên §Y[from.GetName]§!.\n\nCác tầng khí cấu thành khí quyển hành tinh này có sự chênh lệch nhiệt độ cực lớn. Khi các tầng khí ma sát dữ dội, sự biến đổi này tạo ra những luồng nghịch lưu mạnh mẽ.\n\nĐiều này kết hợp với sự khác biệt về mật độ của mỗi loại khí, tạo ra lực cắt thảm khốc, khiến bất kỳ vật thể nào xuyên qua các tầng khí quyển đều bị xé nát không thương tiếc.\n\nGiờ đã hiểu rõ hiện tượng này, chúng ta có thể cải tiến thiết bị để chịu được điều kiện khắc nghiệt, từ đó tận dụng động năng của hiện tượng tự nhiên này."
 # MISSING MASS
 MISSING_MASS_CAT: "Thiếu Hụt Khối Lượng"
 missing_mass_desc: "Chỉ số khối lượng của §Y[from.GetName]§! thấp hơn nhiều so với dự kiến của một hành tinh đá cùng kích thước. Đề xuất điều tra thêm."
 extreme_frontiers.230.title: "Giun Đất Tầng Manti"
 extreme_frontiers.230.desc: "Thăm dò địa lý §Y[from.GetName]§! phát hiện một mạng lưới ngầm khổng lồ trong lớp manti silicat của nó.\n\nTàu thăm dò cho thấy những hang động này là nơi sinh sống của một loài giun đốt sống trong đá silicat. Một lượng lớn sinh vật này đang ăn mòn hành tinh từ bên trong, sau đó phun chất thải đã tiêu hóa vào quỹ đạo hành tinh, rồi bị gió vũ trụ thổi bay.\n\nTiêu diệt những loài giun này sẽ giúp các [controller.GetMinerPlural_lower] của chúng ta thu được một lượng lớn quặng silicat phẩm cấp cao và dễ khai thác."
 extreme_frontiers.230.desc.terravore: "$extreme_frontiers.230.desc$ Chế độ ăn của chúng thật đáng chú ý, không khác chúng ta là mấy."
 extreme_frontiers.230.a: "Khởi động máy khoan."
 extreme_frontiers.230.b: "Nghiên cứu những sinh vật kỳ diệu này."
 # LIFE IN DARKNESS
 LIFE_IN_DARKNESS_CAT: "Sinh Linh Trong Bóng Tối"
 life_in_darkness_desc: "§Y[from.GetName]§! bị khóa thủy triều, một nửa luôn chìm trong bóng đêm. Quét hồng ngoại phát hiện vùng tối cằn cỗi này lại là nơi tồn tại của một hệ sinh thái hữu cơ đang hoạt động."
 extreme_frontiers.240.title: "Tiến Hóa Bán Minh"
 extreme_frontiers.240.desc: "Bán cầu vĩnh dạ của §Y[from.GetName]§! tạo nên một môi trường tiến hóa độc đáo, cho phép một số ít sinh vật hữu cơ sinh tồn trên hành tinh khắc nghiệt này.\n\nNhờ các đặc điểm di truyền đặc thù, toàn bộ quần thể sinh vật ở đây đều ở dạng bán trong suốt, chúng không có thị giác mà tồn tại dựa trên hệ thống định vị tiếng vang cực kỳ phức tạp."
 extreme_frontiers.240.desc.non_homicidal: "$extreme_frontiers.240.desc$ Sự thích nghi độc đáo này khiến các [controller.GetResearcherPlural_lower] của chúng ta rất quan tâm."
 extreme_frontiers.240.a: "Thật mở mang tầm mắt."
 extreme_frontiers.240.b: "Ăn chúng đi."
 extreme_frontiers.240.c: "Giết sạch."
 # RAINBOW RIVERS
 RAINBOW_RIVERS_CAT: "Dòng Sông Huỳnh Quang"
 rainbow_rivers_desc: "Quét sơ bộ §Y[from.GetName]§! phát hiện những dòng sông huỳnh quang chảy khắp bề mặt hành tinh, liên tục thay đổi màu sắc trong toàn bộ quang phổ.\n\nNghiên cứu sâu hơn sẽ giúp chúng ta hiểu rõ hơn về hiện tượng tự nhiên bất thường này."
 extreme_frontiers.250.title: "Hóa Tổng Hợp Đa Sắc"
 extreme_frontiers.250.desc: "Phân tích các dòng sông huỳnh quang trên §Y[from.GetName]§! phát hiện có một loài vi sinh vật độc đáo cư ngụ trong đó.\n\nNhững sinh vật này sử dụng quá trình hóa tổng hợp để chuyển hóa các chất độc hại và tạo ra các phụ phẩm có hoạt tính cao. Các phụ phẩm này làm thay đổi thành phần hóa học của dòng sông, tạo nên hiệu ứng đổi màu mạnh mẽ.\n\nNhững sắc thái neon rực rỡ mà chúng phát ra đồng thời cũng là một phương thức giao tiếp, dùng để biểu thị tình trạng sinh sản và thu hút bạn đời khi băng qua các dòng suối độc hại trên hành tinh.\n\nTiếp tục nghiên cứu các sinh vật này và chu kỳ sống của chúng có thể mang lại cơ hội nghiên cứu không tồi cho các [controller.GetResearcherPlural_lower] của chúng ta."
 # GASEOUS METALS
 GASEOUS_METALS_CAT: "Kim Loại Khí"
 gaseous_metals_desc: "Khí quyển của §Y[from.GetName]§! chủ yếu cấu thành từ các loại kim loại dạng khí. Sau khi hiểu thêm về điều kiện khắc nghiệt của hành tinh này, chúng ta có thể chiết xuất các hợp chất có giá trị này."
 extreme_frontiers.260.title: "Mây Mạ Phủ"
 extreme_frontiers.260.desc: "Khí quyển bất thường của §Y[from.GetName]§! hấp thụ một lượng lớn bức xạ sao, dẫn đến hiệu ứng nhà kính dây chuyền, khiến ngay cả kim loại cũng chuyển hóa thành dạng khí hoạt tính cao.\n\nCác hợp chất này sẽ phản ứng ngay lập tức với mọi thiết bị khảo sát mà chúng ta thả xuống, bao phủ bề mặt bằng một lớp màng hợp kim bền chắc. Và quá trình này lại không hề gây hư hại.\n\n§Y[leader.GetName]§! tin rằng quá trình mạ phủ tự nhiên này có thể tận dụng để nâng cao độ bền kéo cho vỏ tàu của mọi tàu chiến trong §Y[controller.GetName]§!."
 ATMOSPHERIC_ELECTROPLATING: "Mạ Phủ Khí Quyển"
 ATMOSPHERIC_ELECTROPLATING_DESC: "Đưa vật thể vào bầu khí quyển kim loại khí của §Y[from.GetName]§! có thể tạo ra lớp mạ tự nhiên.\n\nQuá trình độc đáo này rất hiệu quả, thông qua nghiên cứu thêm có thể tái hiện và sử dụng để cải thiện độ bền vỏ tàu cho mọi tàu chiến của [Root.Owner.GetName]."
 extreme_frontiers.265.title: "Kim Loại Hiệu Năng Cao"
 extreme_frontiers.265.desc: "Chúng ta đã tìm ra phương pháp tái hiện quy trình mạ phủ đặc biệt của bầu khí quyển hoạt tính trên §Y[from.From.GetName]§! ở quy mô công nghiệp.\n\nTận dụng những kiến thức đã học, các [Root.Owner.GetEngineerPlural] có thể tăng đáng kể độ bền của các loại kim loại cụ thể mà không làm mất đi tính dẻo hay tăng thêm trọng lượng.\n\nNhững phương pháp tiên tiến này có thể được áp dụng vào quy trình đóng tàu của chúng ta."
 # CARBON ALLOTROPES
 CARBON_ALLOTROPES_CAT: "Thù Hình Của Carbon"
 carbon_allotropes_desc: "Tín hiệu quang phổ của §Y[from.GetName]§! cho thấy một thành phần trên hành tinh giàu một loại thù hình carbon hiếm và phức tạp. Cần kiểm tra kỹ hơn để phân loại triệt để."
 extreme_frontiers.270.title: "Tổng Hợp Graphene"
 extreme_frontiers.270.desc: "Phát hiện trữ lượng graphene phong phú trên §Y[from.GetName]§!. Dạng thù hình hiếm hoi này của carbon chỉ dày một phân tử nhưng lại sở hữu độ bền và tính dẫn điện vô song.\n\nVật liệu nano giá trị cao này hình thành tự nhiên trên bề mặt, chủ yếu nhờ vào quá trình lắng đọng hơi hóa học của bầu khí quyển độc đáo trên §Yhành tinh carbon§! này."
 extreme_frontiers.270.a: "Chiết xuất chúng."
 # DIAMOND DUST
 DIAMOND_DUST_CAT: "Vật Chất Tốc Độ Cao"
 diamond_dust_desc: "Quét khối lượng §Y[from.GetName]§! phát hiện một lượng lớn vật chất di chuyển nhanh ở tầng đối lưu dưới.\n\nNếu không có điều tra chi tiết hơn, rất khó để xác định nguồn gốc của các chỉ số bất thường này."
 extreme_frontiers.280.title: "Bão Kim Cương"
 extreme_frontiers.280.desc: "Chúng ta đã xác định được nguồn gốc các chỉ số khối lượng bất thường trên §Y[from.GetName]§!.\n\nKhí quyển hành tinh này chủ yếu là khí methane giàu carbon, dưới áp suất trọng lực tăng dần, khí methane ngưng kết thành cấu trúc kim loại siêu đậm đặc. Do chu kỳ bão dữ dội trên hành tinh, từ đó tạo ra những trận bão kim cương di chuyển thần tốc.\n\nMặc dù những viên kim cương này dễ dàng chiết xuất để sử dụng, nhưng §Y[leader.GetName]§! tin rằng việc nghiên cứu thêm về mật độ và độ tinh khiết của chúng sẽ mang lại kết quả giá trị hơn."
 ATMOSPHERIC_DIAMONDS_PROJECT: "Kim Cương Khí Quyển"
 ATMOSPHERIC_DIAMONDS_PROJECT_DESC: "Nghiên cứu kim cương siêu mật độ trên §Y[from.GetName]§!, chúng ta tin chắc các tính chất độc đáo của chúng có thể dùng để phát triển công nghệ laser."
 extreme_frontiers.285.title: "Độ Chính Xác Kim Cương"
 extreme_frontiers.285.desc: "§Y[leader.GetName]§! đã hoàn tất nghiên cứu kim cương siêu mật độ trên §Y[from.From.GetName]§!.\n\nQuá trình nén hình thành nên những viên kim cương này đã tạo ra cấu trúc mạng tinh thể độc đáo, giúp chúng cực kỳ hiệu quả trong việc giới hạn và khuếch đại dao động ánh sáng tần số cao.\n\nĐột phá này sẽ mang lại lợi ích to lớn cho đế chế của chúng ta."
 # ETREME GEOLOGICAL TENSION
 GEOLOGICAL_TENSION_CAT: "Ứng Suất Địa Chất Cực Hạn"
 geological_tension_desc: "Quét địa chất §Y[from.GetName]§! cho thấy lớp vỏ của hành tinh nóng chảy này đang chịu ứng suất kiến tạo rất lớn. Có khả năng một sự kiện địa chất trọng đại sắp xảy ra."
 extreme_frontiers.290.title: "Siêu Núi Lửa Bị Nghẽn"
 extreme_frontiers.290.desc: "Sau khi nghiên cứu sâu về ứng suất địa chất cực hạn trên §Y[from.GetName]§!, chúng ta đã phát hiện một siêu núi lửa khổng lồ bị tắc nghẽn do sự sụp đổ một phần của hình chóp núi lửa phía trên.\n\nMột lượng lớn dung nham kẹt lại đã lấp đầy mọi không gian ngầm có thể kết nối, tạo ra áp suất hướng lên cực lớn lên vật gây nghẽn tại họng phun chính. Khối sụp đổ tạm thời giam giữ magma tại chỗ, nhưng không ai biết sự cân bằng mong manh này sẽ kéo dài bao lâu.\n\nLượng dung nham bị khóa chứa một lượng lớn bất thường các kim loại hiếm và nhiều loại khoáng vật. §Y[leader.GetName]§! tin rằng sau khi chúng ta hỗ trợ nó phun trào có kiểm soát, chúng ta có thể thu hoạch các tài nguyên này."
 extreme_frontiers.290.a: "Khơi thông họng phun."
 extreme_frontiers.290.b: "Tận dụng tối đa hoạt động địa chất này."
 CONTROLLED_ERUPTION_PROJECT: "Phun Trào Có Kiểm Soát"
 CONTROLLED_ERUPTION_PROJECT_DESC: "Bên dưới một siêu núi lửa bị nghẽn trên §Y[from.GetName]§! lưu trữ một lượng lớn dung nham giàu quặng. Sau khi thực hiện phun trào có kiểm soát, chúng ta có thể thu hoạch các tài nguyên bị kẹt này."
 extreme_frontiers.295.title: "Vụ Phun Trào Sử Thi"
 extreme_frontiers.295.desc: "Chúng ta đã đào một loạt giếng nhân tạo tại các vị trí khác nhau trên hình chóp ngoài của siêu núi lửa §Y[from.From.GetName]§!, làm yếu cấu trúc của nó để không còn khả năng kìm hãm lượng magma tích tụ khổng lồ bên dưới.\n\nVừa vượt qua điểm tới hạn đã tạo ra kết quả kinh ngạc. Dung nham áp suất cao nổ tung lên trên, phá hủy toàn bộ phần trên của núi lửa.\n\nChúng ta dẫn luồng dung nham tràn ra vào các kênh đã chuẩn bị sẵn, sử dụng thiết bị khai thác chuyên dụng để thu thập."
 extreme_frontiers.295.a.default: "Thật đáng kinh ngạc."
 extreme_frontiers.295.a.machine: "Hành động thành công."
 # LAYERED ATMOSPHERE
 LAYERED_ATMOSPHERE_CAT: "Hành Tinh Khổng Lồ Phun Trào"
 layered_atmosphere_desc: "Quét §Y[from.GetName]§! phát hiện các khí dễ cháy phun trào rải rác trên khắp hành tinh, gây thách thức cho việc quan sát từ xa.\n\nCần tiến hành điều tra cận cảnh."
 extreme_frontiers.300.title: "Khí Quyển Phân Tầng"
 extreme_frontiers.300.desc: "§Y[leader.GetName]§! đã tìm ra nguồn gốc của các vụ phun trào dữ dội trên §Y[from.GetName]§!.\n\nGiữa tầng khí trung gian và tầng bình lưu của hành tinh khí khổng lồ này lơ lửng một lớp hydride kim loại lỏng. Tầng khí methane đậm đặc bên dưới nâng đỡ lớp chất lỏng này trôi nổi.\n\nTheo thời gian, các điện tích giải phóng tích tụ bên trong kim loại lỏng, gây nhiễu loạn các lớp phụ. Khi áp suất đạt tới điểm tới hạn, khí phun chất lỏng dẫn điện cao vào tầng khí quyển trên, khuếch tán ra toàn bộ hành tinh trước khi lắng đọng trở lại.\n\nHệ thống theo dõi của chúng ta có thể dễ dàng hiển thị những biến động áp suất này, giúp chúng ta thu hoạch các tài nguyên giá trị cao."
 # SOLIDIFIED PLASMA TRAILS
 PLASMA_TRAILS_CAT: "Dao Động Năng Lượng"
 plasma_trails_desc: "Dọc theo các đường đứt gãy kiến tạo của §Y[from.GetName]§! đã phát hiện các dao động năng lượng không ổn định.\n\nNguồn gốc các dao động này không thể xác định từ quỹ đạo. Cần nghiên cứu cận cảnh để làm rõ nguồn gốc hiện tượng."
 extreme_frontiers.310.title: "Vệt Plasma Cố Hóa"
 extreme_frontiers.310.desc: "Phân tích địa chất §Y[from.GetName]§! đã tìm ra nguồn gốc của các dao động năng lượng bất thường phát hiện từ quỹ đạo trước đó.\n\nHoạt động địa chất mạnh mẽ của hành tinh này đã tạo ra các đợt phóng tĩnh điện dữ dội tại các vùng đất đóng băng không ổn định.\n\nNhững tia sét núi lửa này bùng nổ lên bầu trời, ion hóa không khí xung quanh. Nhiệt lượng cực lớn giải phóng từ sự kiện này tạo ra cú sốc nhiệt, sau đó cố hóa thành các cấu trúc dạng tia chớp.\n\nTận dụng kiến thức từ phân tích địa chất, chúng ta có thể dễ dàng dự đoán các đợt bùng phát địa chấn này và khai thác chúng."
 # CRYSTALLINE PLAINS
 CRYSTALLINE_PLAINS_CAT: "Hoạt Động Núi Lửa Lạnh"
 crystalline_plains_desc: "Phân tích địa chất §Y[from.GetName]§! phát hiện hoạt động núi lửa băng đáng kể với tính chất bất thường trên toàn hành tinh."
 extreme_frontiers.320.title: "Bình Nguyên Tinh Thể"
 extreme_frontiers.320.desc: "Khảo sát địa lý chi tiết §Y[from.GetName]§! phát hiện các dòng sông amoniac bán ngưng tụ chảy dưới lớp vỏ đóng băng. Áp suất địa nhiệt tăng cao sẽ đẩy các vật chất này xuyên qua các vết nứt trên bề mặt mỏng manh.\n\nCác họng phun này rải rác khắp bề mặt, phun ra hỗn hợp nhạy cảm gồm hơi nước nguy hiểm và bùn amoniac. Khi tiếp xúc với nhiệt độ bề mặt cực thấp và đóng băng tức thì, lớp bùn này tạo thành những bình nguyên rộng lớn đầy tinh thể giá trị cao dễ thu hoạch."
 # SUPERMASSIVE GIANT
 SUPERMASSIVE_GIANT_CAT: "Hành Tinh Khổng Lồ Siêu Khối Lượng"
 supermassive_giant_desc: "§Y[from.GetName]§! là một hành tinh khí siêu khổng lồ, giếng trọng lực mạnh mẽ của nó thu hút hàng ngàn vật thể vào quỹ đạo. Việc phân loại và lập danh mục chúng sẽ rất có giá trị."
 extreme_frontiers.330.title: "Rác Vũ Trụ"
 extreme_frontiers.330.desc: "§Y[from.GetName]§! kìm giữ vô số vệ tinh nhỏ, tiểu hành tinh và mảnh vụn vũ trụ trong quỹ đạo của nó. Định tuổi bằng đồng vị phóng xạ cho thấy những thứ này đều bị giếng trọng lực của nó bắt giữ khi đi ngang qua hệ sao này từ hàng ngàn năm trước.\n\nTrong quá trình lập danh mục các vật thể này, chúng ta đã phát hiện một số tàu thăm dò cổ xưa và thô sơ, cho thấy sự hiện diện của một nền văn minh vừa mới bắt đầu thám hiểm không gian.\n\nHầu hết các cơ sở dữ liệu của chúng đã bị hư hỏng hoặc hủy hoại do va chạm với các vật thể khác. Nhưng một trong số đó chứa một loạt hình ảnh bề mặt [from.GetName], trải dài suốt hàng trăm năm."
 extreme_frontiers.330.a: "Một phát hiện thú vị."
 extreme_frontiers.330.b: "Rã xác nó."
 # INVISIBLE PLANET
 INVISIBLE_PLANET_CAT: "Quỹ Đạo Bất Thường"
 invisible_planet_desc: "Lộ trình quỹ đạo của §Y[from.GetName]§! xuất hiện một sự rung động nhỏ lặp đi lặp lại. Điều này cho thấy nó thường xuyên chịu ảnh hưởng từ một nguồn trọng lực lớn nào đó chưa rõ.\n\nĐề xuất nghiên cứu thêm về môi trường xung quanh."
 extreme_frontiers.340.title: "Hành Tinh Vô Hình"
 extreme_frontiers.340.desc: "Phân tích thêm về hệ sao §Y[from.solar_system.GetName]§! phát hiện quỹ đạo công chuyển của mọi hành tinh trong hệ đều xuất hiện những điểm bất thường tương tự.\n\nSau khi sử dụng các chuyển động bất thường để định vị nguồn trọng lực, chúng ta đã tìm ra nguyên nhân: một hành tinh chưa từng được phát hiện trước đây, nay chúng ta đặt tên là §Y[invisible_planet.GetName]§!.\n\nBề mặt hành tinh này sở hữu các hạt carbon đen độc đáo, hoàn toàn không phản xạ ánh sáng khả kiến và sóng vô tuyến, khiến nó trở nên vô hình trước các lần quét tầm xa.\n\nCác polymer tự nhiên này có khả năng hấp thụ tuyệt vời."
 extreme_frontiers.340.desc.default: "$extreme_frontiers.340.desc$ Những vật chất này có giá trị nghiên cứu độc đáo."
 extreme_frontiers.340.desc.first_contact: "$extreme_frontiers.340.desc$ Chúng ta sẽ thu hoạch và nghiên cứu giá trị tiềm năng của nó như một vật liệu tàng hình."
 # SURVIVAL POD
 SURVIVAL_POD_WARM_CAT: "Trạm Thực Địa Cải Tạo"
 SURVIVAL_POD_COLD_CAT: "Trạm Thực Địa Cải Tạo"
 survival_pod_desc: "Khảo sát bề mặt cằn cỗi của §Y[from.GetName]§! cho thấy một trạm thực địa đã được cải tạo, ban đầu chỉ là một phòng thí nghiệm nghiên cứu tạm thời, nay đã vượt xa tuổi thọ dự kiến. Bức xạ nhiệt yếu cho thấy một phần của cơ sở này vẫn đang hoạt động."
 extreme_frontiers.350.title: "Kẻ Sống Sót Cô Độc"
 extreme_frontiers.350.desc: "Một cuộc thám hiểm bề mặt §Y[from.GetName]§! đã phát hiện ra trạm thực địa cải tạo này cùng cư dân duy nhất của nó.\n\nCô ấy tự xưng là một nhà khoa học bị mắc kẹt nhiều năm, đơn độc sinh tồn trong hành tinh khắc nghiệt này cho đến nay, nay muốn dùng kiến thức chuyên môn của mình để đổi lấy sự cứu trợ từ [root.Owner.GetName]."
 extreme_frontiers.350.a: "Kinh nghiệm của cô ấy là vô giá."
 extreme_frontiers.350.b: "Cho cô ấy một phi thuyền và một ít nhu yếu phẩm."
 extreme_frontiers.350.c: "Mặc kệ cô ta, tiếp tục quan sát."
 extreme_frontiers.350.d: "Thật thú vị. Phá hủy nơi trú ẩn của cô ta."
 extreme_frontiers.352.title: "$NAME_survivalist_scru$"
 extreme_frontiers.352.desc: "Một [scru_species.GetClass] với dáng vẻ tiều tụy bước ra từ trạm thực địa được cải tạo thành nơi ở. Khi nói về những gì đã trải qua trên §Y[from.From.GetName]§!, giọng nói phát ra từ [scru_species.GetMouthName] của cô ấy khàn đặc và đứt quãng; lời nói không liền mạch.\n\n“Xin thứ lỗi... Đã nhiều năm rồi... tôi không nói chuyện với ai cả...”"
 extreme_frontiers.352.a: "Tại sao cô lại bị rơi vào hoàn cảnh này?"
 extreme_frontiers.352.a.response: "Lúc đó tôi đang khảo sát [from.From.GetName], ghi chép những đặc trưng độc đáo của đá nền. Phi hành đoàn của tôi nói họ sẽ lái tàu thăm dò đi kiểm tra sơ qua một chút. Tôi đã tin họ. Sau vài ngày lo lắng, tôi mới nhận ra, họ đã lái tàu thẳng về nhà rồi."
 extreme_frontiers.352.b: "Làm sao cô sống sót được lâu như vậy?"
 extreme_frontiers.352.b.response: "Ồ, thật kỳ diệu. Chỉ cần cải tạo một chút tính thấm của tế bào, rồi làm cho các protein sốc nhiệt biểu hiện quá mức... sau đó, việc kích hoạt quá trình tự thực trên các tế bào đã cải tạo của tôi trở nên đơn giản hơn nhiều. Và nhờ vào hàm lượng natri phong phú của thế giới này, tôi đã chế biến được rất nhiều món ăn ngon."
 extreme_frontiers.352.c: "Cô còn muốn gặp lại đồng loại không?"
 extreme_frontiers.352.c.response: "Họ không xứng đáng với những đột phá mà tôi đã đạt được trên tảng đá này. Tôi hoàn toàn không muốn biết cái lý do thần kinh nào khiến họ bỏ rơi tôi."
 extreme_frontiers.352.d: "Cô có thể làm gì cho chúng tôi?"
 extreme_frontiers.352.d.response: "Tôi đã chán ngấy việc làm việc trong phòng thí nghiệm thô sơ này. Tôi khao khát được ngắm nhìn những thế giới mới từ không gian."
 extreme_frontiers.352.e: "Chiêu mộ $NAME_survivalist_scru$"
 extreme_frontiers.352.e.custom_tooltip: "§Y$NAME_survivalist_scru$§! gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 NAME_survivalist_scru: "Scru"
 survivalist_scru_desc: "Một nhà khoa học tài năng đã tôi luyện kỹ năng sinh tồn trong những môi trường cực kỳ khắc nghiệt."
 leader_trait_hardened_survivalist: "Chuyên Gia Sinh Tồn"
 leader_trait_hardened_survivalist_desc: "Kiến thức của vị lãnh đạo này về những môi trường khắc nghiệt nhất là không ai sánh kịp."
 # Infernal Tornadoes
 INFERNAL_TORNADOES_CAT: "Nhiệt Độ Cực Hạn"
 infernal_tornadoes_desc: "Quét §H[from.GetName]§! cho thấy những trận bão áp suất cao di chuyển nhanh trên diện rộng.\n\nNhững trận bão này giải phóng tín hiệu nhiệt cực mạnh. Cần nghiên cứu kỹ lưỡng để làm rõ hiện tượng này là tự nhiên hay do một dạng sống nào đó chưa biết gây ra."
 extreme_frontiers.360.title: "Hỏa Long Quyển"
 extreme_frontiers.360.desc: "Đã tìm thấy nguồn gốc tín hiệu nhiệt cực hạn trên §H[from.GetName]§!.\n\nCác mạch nước phun khắp hành tinh giải phóng khí hydro dễ cháy từ sâu dưới bề mặt. Khi các mạch nước này phun trào, khí gas bị nhiệt lượng của hành tinh đốt cháy, tạo ra những cột lửa khổng lồ chạm tới tận tầng mây.\n\nKết hợp với áp suất khí quyển, nó tạo ra những luồng khí cực kỳ không ổn định, quét qua mặt đất dưới dạng những cơn lốc xoáy lửa khổng lồ.\n\nMặc dù đây là một hiện tượng tự nhiên có sức tàn phá khủng khiếp, nhưng các [Root.Owner.GetResearcherPlural_lower] của chúng ta tin chắc rằng những cơn lốc xoáy này cùng lượng động năng khổng lồ mà chúng tạo ra có thể được tái hiện nhân tạo và tận dụng."
 INFERNAL_CATALYSTS_PROJECT: "Chất Xúc Tác Luyện Ngục"
 INFERNAL_CATALYSTS_PROJECT_DESC: "Thông qua nghiên cứu kỹ hơn về điều kiện hình thành hỏa long quyển trên §H[from.GetName]§!, chúng ta có thể tái hiện những mặt tích cực của hiện tượng này trong môi trường có kiểm soát."
 extreme_frontiers.365.title: "Máy Cộng Hưởng Mảnh Vụn Dung Nham"
 extreme_frontiers.365.desc: "§Y[from.Leader.GetName]§! đã tìm ra phương pháp tái hiện và điều khiển loại hỏa long quyển được tìm thấy trên §Y[from.From.GetName]§! trong môi trường có kiểm soát.\n\nVới đột phá này, chúng ta có thể tận dụng các căn cứ sao để tăng sản lượng năng lượng từ mọi hành tinh nóng chảy được tìm thấy trong cùng hệ sao."
 extreme_frontiers.365.desc.has_furnace: "Lý thuyết khoa học này có nhiều điểm tương đồng với hiểu biết hiện tại của chúng ta về §HLò Đúc Hồ Quang§!, mở ra nhiều khả năng mới trong lĩnh vực kiến trúc ngoại vi."
 extreme_frontiers.365.desc.default: "Lý thuyết khoa học đằng sau khám phá này có nhiều ứng dụng trong việc phát triển §HLò Đúc Hồ Quang§!, các [Root.Owner.GetEngineerPlural] của chúng ta đã bắt đầu áp dụng chúng vào thực tế."
 tech_pyroclastic_resonation: "Cộng Hưởng Mảnh Vụn Dung Nham"
 tech_pyroclastic_resonation_desc: "Bằng cách điều khiển nhiệt năng cực hạn tìm thấy trên các hành tinh nóng chảy, các căn cứ sao của chúng ta có thể nâng cao hiệu suất sản xuất năng lượng trong hệ sao một cách cực kỳ hiệu quả."
 sm_pyroclastic_resonator: "Máy Cộng Hưởng Mảnh Vụn Dung Nham"
 sm_pyroclastic_resonator_desc: "Một máy cộng hưởng nhiệt dùng để tăng sản lượng năng lượng của mọi hành tinh nóng chảy trong hệ sao.\n$i_energy$ tỷ lệ thuận với số lượng ['concept_pc_molten'] trong hệ sao."
 # MAGMA MEGAFAUNA
 MAGMA_MEGAFAUNA_CAT: "Địa Chất Không Ổn Định"
 magma_megafauna_desc: "Quét §Y[from.GetName]§! cho thấy bề mặt hành tinh nóng chảy liên tục trôi dạt trên khoảng cách xa.\n\nCần nghiên cứu cận cảnh để hiểu rõ hiện tượng địa lý bất thường này."
 extreme_frontiers.370.title: "Đại Hệ Động Vật Dung Nham"
 extreme_frontiers.370.desc: "Nguồn gốc của những kết quả quét địa chất bất thường trên §Y[from.GetName]§! là một đàn đại động vật silicon đang lang thang.\n\nNhững sinh vật khổng lồ này di cư đường dài, định kỳ lặn xuống các hồ dung nham của hành tinh để tìm kiếm món ăn yêu thích: một loại trầm tích đá giàu §HVi Hạt Dễ Cháy§!. Bằng cách theo dõi lộ trình di cư của chúng, chúng ta có thể chiết xuất các trầm tích này để sử dụng mà gây ra tác động cực thấp lên hệ sinh thái của hành tinh.\n\nBộ xương ngoài dày cộm của chúng có thể chống chịu nhiệt độ cực hạn; việc nghiên cứu sâu hơn về chu kỳ sống của những sinh vật này có thể mang lại kết quả kinh ngạc."
 LAVA_DIVERS_PROJECT: "Thú Lặn Dung Nham"
 LAVA_DIVERS_PROJECT_DESC: "Các loài đại động vật trên §Y[from.GetName]§! có thể chống chịu môi trường cực hạn trên hành tinh nóng chảy, lặn sâu vào vô số hồ dung nham của hành tinh.\n\nNghiên cứu lớp vỏ của những sinh vật này có thể giúp chúng ta hiểu cách chống lại nhiệt độ cực đại."
 extreme_frontiers.375.title: "Giáp Đúc Dung Nham"
 extreme_frontiers.375.desc: "Nghiên cứu về loài đại động vật độc đáo trên §Y[from.From.GetName]§! đã mang lại một hiểu biết về nhiệt động lực học có thể chuyển đổi, áp dụng vào ngành đóng tàu của chúng ta.\n\nCác vi hạt mà sinh vật này hấp thụ khiến lớp vỏ của chúng hình thành một cấu trúc dựa trên silicat nặng, và được gia cố bởi các kim loại khó nóng chảy có sẵn trong tự nhiên.\n\nSau khi thu thập vô số mẫu vật từ lớp vỏ lột xác của chúng, các [Root.Owner.GetEngineerPlural] hiện có thể sao chép nguyên lý cơ sinh học này để phát triển lớp mạ vỏ tàu cho riêng chúng ta."
 # PLANET THRUSTERS
 PLANET_THRUSTERS_CAT: "Thiết Bị Trôi Nổi"
 planet_thrusters_desc: "Ở tầng khí quyển trên của §Y[from.GetName]§! lơ lửng một loạt các máy móc hình trụ lớn. Không có bất kỳ người vận hành nào trong đó, và chúng có vẻ như không hoạt động."
 extreme_frontiers.380.title: "Động Cơ Hành Tinh"
 extreme_frontiers.380.desc: "Những máy móc bị bỏ hoang tìm thấy trên §Y[from.GetName]§! đều là các thiết bị đẩy độc lập. Tổng số trong bầu khí quyển vượt quá một ngàn chiếc.\n\nNhững thiết bị nhiệt hạch phức tạp này được hỗ trợ bởi các vật liệu thiết kế đặc biệt, có thể tiêu thụ khí hydro ở tầng dưới của hành tinh làm nhiên liệu để tạo ra lực đẩy khổng lồ. Hầu hết trong số chúng đều có dấu hiệu hư hại do quá tải.\n\nPhân tích của chúng ta cho thấy vị trí các máy móc này được sắp xếp tỉ mỉ để có thể tác động lực đẩy lên chính hành tinh. Điều này cho thấy những thiết bị cổ xưa này ban đầu được lắp đặt để thay đổi quỹ đạo của hành tinh.\n\nMặc dù không còn phù hợp cho nhiệm vụ gian khổ cấp độ này, chúng ta vẫn có thể tái sử dụng các thiết bị ít hư hỏng hơn để đốt cháy lớp khí của hành tinh, từ đó làm lộ ra phần lõi giàu khoáng sản."
 extreme_frontiers.380.a: "Tháo dỡ hết sạch."
 extreme_frontiers.380.b: "Trưng dụng các thiết bị này."
 REPURPOSE_THRUSTERS_PROJECT: "Động Cơ Hành Tinh Được Trưng Dụng"
 REPURPOSE_THRUSTERS_PROJECT_DESC: "Bằng cách tái sử dụng dàn động cơ hành tinh bị hư hại trên §Y[from.GetName]§!, chúng ta sẽ đốt cháy sạch khí hydro của hành tinh khí khổng lồ này, làm lộ ra phần lõi rắn có thể khai thác bên dưới."
 extreme_frontiers.385.title: "Bóc Tách Từng Lớp"
 extreme_frontiers.385.desc: "Chúng ta có thể sửa chữa một phần các thiết bị đẩy hành tinh bị hư hại trên §Y[from.From.GetName]§!, hiệu chỉnh chúng để tạo ra lực đẩy ngược chiều tương ứng.\n\nNhững thiết bị nhiệt hạch mạnh mẽ này sau khi kích hoạt có thể hút hydro với tốc độ lũy thừa, đốt cháy toàn bộ bầu khí quyển của hành tinh, và làm lộ ra phần lõi giàu khoáng sản của nó, dù nhiệt độ có thể hơi cao một chút."
 extreme_frontiers.385.tt: "Thêm sửa đổi §YHành Tinh Âm Giới§!"
 extreme_frontiers.385.a: "Rất ấn tượng."
 # BACKWARDS ORBIT
 BACKWARDS_ORBIT_CAT: "Quỹ Đạo Nghịch Hành"
 backwards_orbit_desc: "Hướng §Y[from.GetName]§! quay quanh sao chủ ngược lại với các hành tinh khác trong hệ sao, điều này cho thấy nó và các thiên thể đi kèm không được hình thành cùng thời gian và địa điểm.\n\nCần điều tra thêm để hiểu rõ nguồn gốc của hành tinh này."
 extreme_frontiers.390.title: "Hành Tinh Lang Thang"
 extreme_frontiers.390.desc: "Thành phần vật chất của §Y[from.GetName]§! không khớp với các hành tinh lân cận, trái lại nó lại hoàn toàn phù hợp với nhiều thiên thể trong hệ sao §Y[event_target:wandering_planet_origin.GetName]§! bên cạnh, điều này gợi mở về nguồn gốc thực sự của nó.\n\nTrên bề mặt hành tinh này có thể thấy rõ một hố va chạm khổng lồ, điều này khiến chúng ta tin rằng nó đã bị chệch khỏi quỹ đạo ban đầu do một vụ va chạm tiểu hành tinh quy mô lớn. Hành tinh lang thang trôi nổi tự do này sau đó bị giếng trọng lực của [from.System.Star.GetName] bắt giữ, tạo nên quỹ đạo nghịch hành bất thường.\n\nHành tinh độc đáo đã từng cư ngụ trong hai hệ sao kể từ khi hình thành này mang lại cơ hội nghiên cứu sâu rộng phong phú."
 # VAPOR PLUMES
 VAPOR_PLUMES_CAT: "Luồng Hơi Nước"
 vapor_plumes_desc: "Quan sát thấy hàng ngàn luồng hơi nước bất thường bốc lên trên bề mặt §Y[from.GetName]§!, vươn tới tận tầng đỉnh của bầu khí quyển loãng của nó.\n\nĐề xuất điều tra sâu về hiện tượng này."
 extreme_frontiers.400.title: "Mạch Nước Núi Lửa Lạnh"
 extreme_frontiers.400.desc: "Các luồng hơi nước tìm thấy trên §Y[from.GetName]§! được tạo ra bởi hoạt động núi lửa lạnh dữ dội sâu trong lớp manti dưới, một lượng lớn khí amoniac và nitơ bị thải ra bề mặt.\n\nNhững luồng mây này vươn thẳng lên rìa khí quyển hành tinh, rồi bị gió sao đột ngột san phẳng.\n\nThông qua việc nghiên cứu những thay đổi nhỏ trong thành phần hóa học của cấu trúc khói độc đáo này, chúng ta có thể hiểu thêm về các quá trình địa chất phức tạp tại lõi hành tinh."
 # FIBROUS ATMOSPHERE
 FIBROUS_ATMOSPHERE_CAT: "Quét Thất Bại"
 fibrous_atmosphere_desc: "Kết quả quét sơ bộ §Y[from.GetName]§! đã bị hỏng, thiết bị của chúng ta không thể giải mã rõ ràng. Nguồn gốc của sự nhiễu loạn này vẫn chưa rõ; có lẽ cần một cuộc điều tra cận cảnh."
 extreme_frontiers.410.title: "Khí Quyển Dạng Sợi"
 extreme_frontiers.410.desc: "Điều tra chi tiết §Y[from.GetName]§! đã hé lộ nguyên nhân dữ liệu bị hỏng trong lần quét sơ bộ.\n\nNhững làn sương mù dày đặc tạo bởi các khoáng vật dạng sợi cấu thành nên tầng khí quyển trên của hành tinh. Những sợi dài uốn lượn này bắt nguồn từ tầng dưới của hành tinh khí khổng lồ, môi trường áp suất cao đã kéo giãn chúng thành những đám mây khoáng vật dẫn điện cao.\n\nCác sợi này vừa lưu thông trong khí quyển vừa tích tụ năng lượng tĩnh điện, và định kỳ xảy ra hiện tượng phóng điện. Chúng ta có thể dễ dàng thu hoạch các tài nguyên này để sử dụng."
 # EXPLODING SKIES
 EXPLODING_SKIES_CAT: "Xung Nhiệt Mạnh"
 exploding_skies_desc: "Quét §Y[from.GetName]§! đã truy vết được các hiện tượng khí tượng cực hạn, với các xung nhiệt mạnh mẽ xuất hiện rải rác trên bề mặt.\n\nCần điều tra thêm."
 extreme_frontiers.420.title: "Chân Trời Bùng Nổ"
 extreme_frontiers.420.desc: "Điều tra kỹ lưỡng §Y[from.GetName]§! đã tìm ra nguồn gốc của các xung nhiệt khí tượng.\n\nCác lỗ thông địa nhiệt và mạch nước phun chằng chịt liên tục phun ra khí dễ cháy nồng độ cao, dần tích tụ trong khí quyển. Sự phóng tĩnh điện đóng vai trò như chất kích nổ, dẫn đến các mặt trận khí tượng bùng nổ quét qua bầu trời toàn hành tinh.\n\nNhững phản ứng này giúp các [Root.Owner.GetEngineerPlural] của chúng ta có thêm những hiểu biết mới về sự cháy nhiệt động lực học, có thể ứng dụng vào hệ thống đẩy của hạm đội."
 extreme_frontiers.420.desc.traumatized: "Thật không may, nghiên cứu đầy nguy hiểm này khiến [leader.GetName] bị chấn thương tâm lý nặng nề."
 extreme_frontiers.420.desc.maimed: "Thật không may, nghiên cứu đầy nguy hiểm này khiến [leader.GetName] bị thương tật cơ thể nghiêm trọng."
 # CHTHONIAN PRESERVATION
 CHTHONIAN_PRESERVATION_CAT: "Sinh Vật Minh Giới"
 chthonian_preservation_desc: "Quét §Y[from.GetName]§! cho thấy đây là một hành tinh chết, nó từng là một hành tinh khí khổng lồ, nhưng bầu khí quyển đã bị bức xạ dữ dội từ §Y[from.System.Star.GetName]§! bóc tách sạch.\n\nMặc dù vậy, vẫn phát hiện được những dấu vết sinh khối cực kỳ mờ nhạt trên bề mặt, cần điều tra thêm."
 extreme_frontiers.430.title: "Bảo Tồn Minh Giới"
 extreme_frontiers.430.desc: "Tín hiệu sinh khối trên §Y[from.GetName]§! hóa ra đến từ một đàn Tiyanki nhỏ.\n\nChúng có lẽ đã đến đây vào một thời điểm tới hạn trước khi bầu khí quyển của hành tinh khí khổng lồ này tan biến hoàn toàn, sau đó bị kim loại nóng chảy bao phủ và đông cứng lại.\n\nMặc dù còn lưu lại một lượng nhỏ vật chất sinh học, nhưng sau thời gian dài tiếp xúc với bức xạ sao cấp độ luyện ngục, phần lớn cơ thể của chúng đã biến thành một loại hợp kim sinh học kim loại độc đáo.\n\n§Y[leader.GetName]§! tin rằng, thông qua việc nghiên cứu kỹ hơn những hóa thạch quý hiếm này, chúng ta có thể tìm ra một phương pháp mới để sản xuất hợp kim từ nguyên liệu thô sinh học."
 CHTHONIAN_PETRIFICATION_PROJECT: "Hóa Thạch Minh Giới"
 CHTHONIAN_PETRIFICATION_PROJECT_DESC: "Các [Root.Owner.GetScientistPlural] của chúng ta thông qua nghiên cứu di hài hóa thạch của đàn thú Tiyanki trên §Y[from.GetName]§!, nhằm hiểu rõ hoàn toàn ảnh hưởng của bức xạ hạt nhân cấp độ luyện ngục lên sinh khối, và có khả năng khám phá ra phương thức sản xuất hợp kim cao cấp hoàn toàn mới."
 extreme_frontiers.435.title: "Hợp Kim Sinh Học"
 extreme_frontiers.435.desc: "Sau khi điều tra chi tiết di hài Tiyanki đã hóa thạch trên §Y[from.From.GetName]§!, chúng ta đã nghiên cứu ra một phương thức sản xuất hợp kim mới mô phỏng hiệu ứng tiếp xúc bức xạ luyện ngục thời gian dài này.\n\nKhám phá mang tính đột phá này mang lại một phương thức chế tạo kiệt xuất, sử dụng sinh khối làm nguyên liệu chính, nhưng sản lượng có thể sánh ngang với các phương pháp truyền thống."
 tech_alloy_fossilization: "Hóa Thạch Hợp Kim"
 tech_alloy_fossilization_desc: "Bằng cách cho sinh khối tiếp xúc với bức xạ luyện ngục mô phỏng, chúng ta có thể hóa thạch cấu trúc tế bào thành hợp kim có thể sử dụng."
 tech_alloy_fossilization_tt: "§HMở khóa công trình§!: ['building:building_bio_furnace']"
 building_bio_furnace: "Lò Đúc Sinh Học"
 building_bio_furnace_desc: "Bằng cách kết hợp một lượng lớn bức xạ sao mô phỏng, cơ sở này có khả năng chuyển hóa sinh khối thành hợp kim."
 # ORBITAL RESONANCE
 ORBITAL_RESONANCE_CAT: "Tỷ Lệ Vàng"
 orbital_resonance_desc: "Chu kỳ công chuyển trong hệ sao §Y[from.System.GetName]§! cho thấy những quy luật đầy ấn tượng. Mỗi hành tinh quay quanh sao chủ với chu kỳ chính xác gấp đôi hành tinh lân cận, chính xác tới một phần nghìn giây.\n\nTỷ lệ chính xác kỳ lạ này rất đáng để điều tra."
 extreme_frontiers.440.title: "Cộng Hưởng Quỹ Đạo"
 extreme_frontiers.440.desc: "§Y[from.System.GetName]§! là ví dụ điển hình nhất về cộng hưởng quỹ đạo mà chúng ta từng gặp từ trước đến nay.\n\nMỗi hành tinh khi đến điểm gần nhất với láng giềng đều tương đương với một nguồn trọng lực định kỳ, tạo ra hiệu ứng súng cao su và khóa động lượng. Sự ổn định bất thường của tương tác này đã tạo nên những quỹ đạo có quy luật cao này.\n\nHệ sao này mang lại cơ hội tuyệt vời để nghiên cứu gia tốc của trọng lực hành tinh lên các vật thể đi ngang qua, và có thể ứng dụng vào việc cơ động tàu chiến."
 GRAVITY_ASSIST_PROJECT: "Nghiên Cứu Hỗ Trợ Trọng Lực"
 GRAVITY_ASSIST_PROJECT_DESC: "Nghiên cứu hiệu ứng cộng hưởng quỹ đạo chính xác trên §Y[from.GetName]§! sẽ nâng cao hiểu biết của chúng ta về hiệu ứng súng cao su trọng lực hành tinh trong cơ động tàu chiến."
 extreme_frontiers.445.title: "Tiến Triển Súng Cao Su Quỹ Đạo"
 extreme_frontiers.445.desc: "Sau khi nghiên cứu hiệu ứng cộng hưởng quỹ đạo độc đáo trong hệ sao §Y[from.From.System.GetName]§!, chúng ta đã có bước tiến lớn trong phương pháp hoạch định lộ trình bay tối ưu cho tàu chiến.\n\nNhững mô hình mới này có thể tận dụng cực kỳ triệt để trọng lực hành tinh trong giai đoạn tăng giảm tốc của tàu chiến dùng vận tốc ánh sáng."
 tech_orbital_maneuvers: "Cơ Động Quỹ Đạo Tiên Tiến"
 tech_orbital_maneuvers_desc: "Các tính toán tiên tiến nhằm tận dụng tối đa giếng trọng lực hành tinh có thể được dùng để tối ưu hóa thêm việc di chuyển dưới tốc độ ánh sáng."
 #############
 # Arc Sites #
 #############
 # ABSOLUTE ZERO
 site_absolute_zero: "Độ Không Tuyệt Đối"
 site_absolute_zero_desc: "Quét địa chất §Y[from.Planet.GetName]§! cho thấy tại một khu vực ngầm cụ thể, nhiệt độ cục bộ cực thấp tiệm cận độ không tuyệt đối.\n\nNghiên cứu chi tiết hơn bên trong sẽ mang lại nhiều câu trả lời hơn."
 extreme_frontiers.1000.title: "Đóng Băng"
 extreme_frontiers.1000.desc: "Trong khi tìm kiếm nguồn nhiệt độ cực thấp trên §Y[from.Planet.GetName]§!, §Y[leader.GetName]§! đã phát hiện lối vào một cơ sở ngầm cổ xưa.\n\nChặn lối vào là một lớp đá và tháp băng dày, dường như đã phong tỏa toàn bộ cơ sở này suốt hàng ngàn năm.\n\nSự thăng hoa của băng khô tại lối vào tạo nên những cột khói trắng bốc lên từ các vết nứt ở chỗ phong tỏa. Thiết bị của chúng ta cho thấy bên trong có một khu phức hợp khổng lồ; [leader.GetName] tin chắc nguồn lạnh cực hạn nằm ở trong đó."
 extreme_frontiers.1000.a: "Đục xuyên chỗ phong tỏa"
 extreme_frontiers.1005.title: "Thời Gian Đóng Băng"
 extreme_frontiers.1005.desc: "§Y[leader.GetName]§! đã thành công xuyên qua lớp băng chặn lối vào cơ sở cổ xưa trên §Y[from.Planet.GetName]§!.\n\nTrong không gian này có hàng chục xác đóng băng của một loài bò sát chưa biết nào đó. Cơ thể vặn vẹo của họ bị đông cứng tại chỗ sát vách tường, những vết cào trên tường cho thấy họ đã tuyệt vọng tìm cách trốn thoát.\n\nLàn khói băng khô rò rỉ từ lối vào chắc chắn đến từ nơi sâu hơn dưới lòng đất, có một cầu thang xoắn ốc dẫn xuống tầng sâu của khu phức hợp."
 extreme_frontiers.1010.title: "Mộ Táng Băng Giá"
 extreme_frontiers.1010.desc: "Sâu trong cơ sở đóng băng, §Y[leader.GetName]§! phát hiện những kén ngủ đông thô sơ nhưng về lý thuyết vẫn hoạt động được, lấp đầy toàn bộ khoang trung tâm.\n\nCái lạnh cực độ thể hiện ở đây vượt xa phạm vi nhiệt độ mà các cơ sở này được thiết kế. Những cư dân bên trong các kén này đã chết từ hàng ngàn năm trước.\n\nMột số ít kén không bị băng tuyết vùi lấp vẫn có thể nhìn rõ các chữ viết trên bệ đỡ, ghi tước hiệu xã hội và cấp bậc của người bên trong. Cấp bậc càng cao thì kén càng nằm gần một cái kén trung tâm khổng lồ vùi sâu trong sương giá."
 extreme_frontiers.1010.a: "Điều tra kén trung tâm."
 extreme_frontiers.1015.title: "Băng Vương"
 extreme_frontiers.1015.desc: "§Y[leader.GetName]§! đã phá vỡ cái kén lớn ở trung tâm mộ táng băng giá trên §Y[from.Planet.GetName]§!.\n\nBên trong là nơi an nghỉ của một thủ lĩnh hoàng gia cổ đại, điều này đã được đề cập trong các văn bản tìm thấy ở các kén trước đó. Cùng ngủ đông với ông ta còn có hàng chục tùy tùng, và kén ngủ đông của chính ông ta được trang trí lộng lẫy ở mặt ngoài.\n\nCỗ quan tài công nghệ cao của vị vua đã khuất này kết nối với một máy móc cổ xưa thông qua mạng lưới đường ống và mạch điện chằng chịt như mê cung. Thiết bị này bị khảm trong một khối băng lớn, nhiệt độ của nó thấp đến mức nguy hiểm, ngay cả thiết bị phân tích cũng không thể chịu nổi.\n\nNguyên nhân hỏng hóc của thiết bị này cũng như mối quan hệ của nó với lõi đóng băng của hành tinh vẫn cần được nghiên cứu thêm."
 extreme_frontiers.1015.a: "Chuyện gì đã xảy ra ở đây?"
 extreme_frontiers.1020.title: "Thảm Họa Nhiệt Thấp"
 extreme_frontiers.1020.desc: "Phân tích khoang trung tâm mộ táng băng giá trên §Y[from.Planet.GetName]§! đã giải thích nguyên nhân thảm họa này.\n\nCác thiết bị máy móc ngủ đông sử dụng nhiệt động lực học dưới mức âm, tận dụng nhiệt độ lõi cực thấp của hành tinh. Sau khi vị vua mắc bệnh nan y, mọi người hy vọng có thể đánh thức đoàn tùy tùng hoàng gia khi tìm được phương pháp cứu chữa.\n\nMặc dù lý thuyết có vẻ hợp lý, nhưng khi môi trường tuần hoàn được thiết kế đặc thù rò rỉ vào lõi hành tinh, phản ứng thu nhiệt đã mất kiểm soát. Sự hạ nhiệt chết người theo sau đó đã nhanh chóng đóng băng toàn bộ cơ sở.\n\nChúng ta đã tiếp thu lý thuyết ban đầu của họ và cải tiến nó, đạt được đột phá trong công nghệ nhiệt thấp tiên tiến chuyên dùng cho các hành tinh đóng băng."
 tech_cryovault: "Môi Trường Sống Hành Tinh Băng Giá"
 tech_cryovault_desc: "Tận dụng nhiệt động lực học dưới mức âm tìm thấy trên các hành tinh băng giá, chúng ta có thể tạo ra điều kiện sống dễ chịu hơn trong những khí hậu lạnh giá nhất."
 tech_cryovault_tt: "Mở khóa công trình: ['building:building_cryovault']"
 building_cryovault: "Kén Ngủ Đông"
 building_cryovault_desc: "Một môi trường sống khép kín tận dụng nhiệt động lực học dưới mức âm của khí hậu băng giá để tạo ra không gian sống có kiểm soát và thoải mái."
 # TOXIC MATRIX
 site_toxic_matrix: "Ao Độc"
 site_toxic_matrix_desc: "Bề mặt §Y[from.Planet.GetName]§! gần như bị bao phủ hoàn toàn bởi các ao nhỏ hình tròn được sắp xếp ngăn nắp. Sự quy củ của mạng lưới này cho thấy chúng có lẽ được thiết kế tỉ mỉ chứ không phải hình thành tự nhiên. Điều tra thực địa có thể mang lại nhiều câu trả lời hơn."
 extreme_frontiers.1100.title: "Túi Nhầy Nứt Vỡ"
 extreme_frontiers.1100.desc: "Phần lớn bề mặt §Y[from.Planet.GetName]§! đã trở thành các dãy hốc hình cầu được sắp xếp tinh vi. Những lòng chảo tròn nhỏ này chứa đầy dịch độc đặc quánh.\n\nTrong một cái ao đã phát hiện một túi hữu cơ bị nứt vỡ, bề mặt phủ đầy chất nhầy dạng gel. Màng ngoài của túi dường như bị đâm thủng từ bên trong.\n\nViệc liệu cái túi này có phải là nguồn gốc của chất lỏng trong ao hay không vẫn cần được nghiên cứu."
 extreme_frontiers.1100.a: "Tiếp tục tìm kiếm."
 extreme_frontiers.1105.title: "Ao Nuôi Độc"
 extreme_frontiers.1105.desc: "Phân tích các ao nhầy trên §Y[from.Planet.GetName]§! phát hiện hormone tăng trưởng phóng xạ bất thường, thường liên quan đến chu kỳ thai nghén hữu cơ.\n\nLớp trong của túi dường như là một lớp màng thịt phức tạp, có khả năng điều tiết tốc độ thẩm thấu của chất nhầy."
 extreme_frontiers.1105.desc.non_toxoid: "Chúng ta cho rằng đã phát hiện ra các túi sinh sản của một loài nào đó thích nghi cao với môi trường độc hại. Khám phá thêm có thể mang lại nhiều câu trả lời hơn."
 extreme_frontiers.1105.desc.toxoid: "Những túi sinh sản này có sự tương đồng đáng kinh ngạc với chu kỳ sinh sản của chính chúng ta, có lẽ là một loài họ hàng xa nào đó."
 extreme_frontiers.1105.a: "Tiếp tục điều tra."
 extreme_frontiers.1110.title: "Tàn Tích Phôi Thai"
 extreme_frontiers.1110.desc: "Một túi sinh sản nứt vỡ tìm thấy trong ao nhầy của §Y[from.Planet.GetName]§! chứa một dạng sống đã phát triển gần như hoàn thiện.\n\nPhân tích hiển vi cho thấy, mẫu vật phôi thai này có hệ thần kinh phức tạp, đặc tính thần kinh thường đi kèm với sinh vật có trí tuệ.\n\nDãy ao nhầy cuối cùng vẫn đang chờ được kiểm tra."
 extreme_frontiers.1110.a: "Kiểm tra dãy ao cuối cùng."
 extreme_frontiers.1115.title: "Phát Hiện Tín Hiệu Sống"
 extreme_frontiers.1115.desc.a: "Khi kiểm tra các ao nhầy còn lại trên §Y[from.Planet.GetName]§!, §Y[leader.GetName]§! phát hiện một túi sinh sản còn nguyên vẹn, trong đó vẫn phát ra tín hiệu sự sống.\n\nTuy nhiên trong quá trình chiết xuất, màng thịt của túi đã bị rách, mẫu vật này đã chết."
 extreme_frontiers.1115.desc.non_toxoid: "Cái xác nhỏ bên trong thể hiện những đặc điểm sinh học bất thường, bao gồm các mạch máu chứa đầy huyết tương phóng xạ và các tuyến nội tiết tiết ra hợp chất hướng thần."
 extreme_frontiers.1115.desc.b: "Nghiên cứu xác định rằng, bao gồm cả phôi thai, toàn bộ túi sinh sản đều được tạo ra bằng cách đưa một chất xúc tác hóa học đặc biệt vào dịch nhầy độc năng lượng cao.\n\nChúng ta tin rằng đã tìm thấy một bãi sinh sản cổ xưa bị bỏ hoang của một loài chưa biết. Đây là thành phần bình thường trong chu kỳ sinh sản của chúng hay là một cơ sở nhân tạo, chúng ta có lẽ sẽ không bao giờ biết được. Thông qua việc nuôi cấy tại chỗ, chúng ta có thể tái tạo được một mẫu vật sống."
 extreme_frontiers.1115.desc.toxoid: "Hoặc chúng ta có thể phân phối một lượng nhỏ dịch nhầy sinh sản hiệu quả và phong phú này làm thực phẩm bổ sung dinh dưỡng trên khắp [leader.Owner.GetName]."
 extreme_frontiers.1115.a: "Xúc tác dịch nhầy."
 extreme_frontiers.1115.b: "Chiết xuất năng lượng từ dịch nhầy."
 extreme_frontiers.1115.c: "Phân phát thực phẩm bổ sung."
 TOXIC_SLIME_CATALYZATION_PROJECT: "Xúc Tác Dịch Nhầy Độc"
 TOXIC_SLIME_CATALYZATION_PROJECT_DESC: "Bằng cách xúc tác một số dịch nhầy sinh sản độc hại lấy từ [from.Planet.GetName], chúng ta có thể ấp nở ra các sinh vật từ đó."
 extreme_frontiers.1120.title: "Ấp Nở Thành Công"
 extreme_frontiers.1120.desc: "Thông qua việc xúc tác một mẫu dịch nhầy sinh sản độc hại lấy từ §Y[from.From.Planet.GetName]§!, chúng ta đã kích thích hàng chục túi sinh sản chứa phôi thai ấp nở.\n\nCác thực thể sống bên trong nhanh chóng phát triển trưởng thành rồi dùng hàm chuyên dụng đâm thủng màng túi sinh sản bán trong suốt từ bên trong.\n\nChúng trông rất hiền lành và sẵn lòng hợp tác."
 extreme_frontiers.1120.a: "[Root.Owner.GetName] sẽ dành cho chúng một chỗ đứng."
 extreme_frontiers.1120.b: "Các [Root.Owner.GetResearcherPlural_lower] của [Root.Owner.GetName] sẽ tận dụng tốt chúng."
 NAME_slimeborn: "Thực Thể Nhầy"
 NAME_slimeborn_plural: "Thực Thể Nhầy"
 trait_slimeborn: "Thực Thể Nhầy"
 trait_slimeborn_desc: "Loài này được ấp nở nhanh chóng từ dịch nhầy đặc quánh với sự hỗ trợ của chất xúc tác sinh sản."
 tech_living_test_subjects: "Đối Tượng Thí Nghiệm Sống"
 tech_living_test_subjects_desc: "Việc sử dụng các dạng sống đơn giản sinh ra từ dịch nhầy làm đối tượng thí nghiệm tự nguyện đã tăng đáng kể hiệu suất nghiên cứu."
 # RUINED REACTORS
 site_ruined_reactors: "Lò Phản Ứng Đổ Nát"
 site_ruined_reactors_desc: "Mức độ phóng xạ cao ngất ngưởng trên bề mặt §Y[from.Planet.GetName]§! chỉ hướng về một khu phức hợp lò phản ứng cũ kỹ. Cơ sở biệt lập này dường như đã bị bỏ hoang từ lâu, cần được điều tra."
 extreme_frontiers.1200.title: "Trạm Phát Điện Lò Phản Ứng Cổ"
 extreme_frontiers.1200.desc: "Cơ sở cũ kỹ nằm trên §Y[from.Planet.GetName]§! này là một trạm phát điện lò phản ứng bị bỏ hoang. Tính toán chu kỳ bán rã phóng xạ cho thấy tại đây đã xảy ra sự cố ô nhiễm nghiêm trọng từ hơn một vạn năm trước.\n\nCác hệ thống tại đây đã ngoại tuyến, cấu trúc vật lý thể hiện rõ dấu hiệu hư hại quy mô lớn."
 extreme_frontiers.1200.a: "Thận trọng tiến tới."
 extreme_frontiers.1205.title: "Thảm Họa Tan Chảy Lõi"
 extreme_frontiers.1205.desc: "Nhiều lò phản ứng trên §Y[from.Planet.GetName]§! cho thấy dấu hiệu tan chảy lõi nghiêm trọng. Nhiều lớp vỏ bảo vệ đã bị hóa lỏng thành xỉ thải phóng xạ.\n\nPhần này của cơ sở đầy rẫy kim loại vặn vẹo và ống ngưng tụ bị nứt vỡ. Mặc dù dữ liệu bị hỏng nặng, chúng ta vẫn xác nhận tại đây đã từng thử thực hiện các biện pháp đóng khẩn cấp nhưng hoàn toàn không thành công."
 extreme_frontiers.1205.a: "Thật không may."
 extreme_frontiers.1210.title: "Sai Lầm Thiết Kế"
 extreme_frontiers.1210.desc: "§Y[leader.GetName]§! đã phát hiện ra lỗi thiết kế chính trong cơ sở phân hạch thô sơ trên §Y[from.Planet.GetName]§! này.\n\nMặc dù có hàng chục lò phản ứng, nhưng tại đây chỉ được lắp đặt một lượng tối thiểu hệ thống làm mát. Hệ thống của cơ sở chỉ có mức độ tự động hóa rất thấp, cần một lượng lớn nhân lực để duy trì điều kiện vận hành bình thường. Rõ ràng đây là sản phẩm của một nhóm người chưa nắm vững hoàn toàn các nguyên lý hạt nhân cơ bản."
 extreme_frontiers.1210.a: "Cái giá của sự thiếu hiểu biết rất đắt đỏ."
 extreme_frontiers.1215.title: "Tàn Tích Sơ Tán"
 extreme_frontiers.1215.desc: "Sau khi mở khóa một loạt cửa chống nổ bọc chì bên trong cơ sở hạt nhân §Y[from.Planet.GetName]§!, chúng ta phát hiện ra một khu vực sơ tán khẩn cấp.\n\nNhững nhà chứa máy bay nhỏ này có một dãy vị trí đỗ tàu con thoi phóng nhanh, hầu hết trong số đó đều trống rỗng, những vết cháy do động cơ đẩy cũng cho thấy hàng ngàn năm trước đã có các tàu thuyền nhanh chóng cất cánh từ đây.\n\nVị trí đỗ cuối cùng bị chiếm giữ bởi xác một tàu con thoi vặn vẹo, kẹp phóng vẫn chưa được giải phóng. Chúng ta đã cố gắng khai quật từ đống đổ nát nhưng không tìm thấy bất kỳ di hài nào của phi hành đoàn."
 extreme_frontiers.1215.a: "Họ đi vội vàng thật đấy."
 extreme_frontiers.1220.title: "Thùng Chứa Uranium"
 extreme_frontiers.1220.desc: "Vượt qua từng lớp cửa an ninh bọc chì, chúng ta tiến vào phần ngầm của cơ sở hạt nhân §Y[from.Planet.GetName]§!. Chỉ số máy đo bức xạ tăng vọt.\n\nChúng ta phát hiện một khoang lớn chứa hàng ngàn thùng lót thép. Có nhiều thùng bị hư hại do hỏa hoạn, rò rỉ các đồng vị uranium và plutonium không ổn định.\n\nCác [leader.Owner.GetPreFTLLower] xây dựng cơ sở này rõ ràng không có phương pháp tái chế nhiên liệu hạt nhân đúng đắn. Những đồng vị bỏ hoang này vẫn tiềm tàng nguồn năng lượng khổng lồ."
 extreme_frontiers.1220.a: "Khéo ăn thì no, khéo co thì ấm."
 # DESERTED MINING FACILITY
 site_deserted_mining_facility: "Cơ Sở Khai Thác Bỏ Hoang"
 site_deserted_mining_facility_desc: "Ảnh chụp quỹ đạo §Y[from.Planet.GetName]§! cho thấy một cơ sở khai thác mục nát, xung quanh là nhiều tàu vận tải không gian thô sơ đã bị bỏ rơi từ lâu.\n\nNgoài những hình ảnh này, dàn anten liên lạc sóng ngắn của chúng ta còn thu được một tín hiệu cầu cứu cực kỳ yếu ớt từ sâu dưới lòng đất của hành tinh. Nghiên cứu chi tiết di tích này sẽ hé lộ nguồn gốc tín hiệu."
 extreme_frontiers.1300.title: "Lối Vào Mã Hóa"
 extreme_frontiers.1300.desc: "Khi điều tra cơ sở khai thác bỏ hoang trên bề mặt §Y[from.Planet.GetName]§!, §Y[leader.GetName]§! phát hiện một lối vào đóng kín trên hầm mỏ nguyên vẹn nhất. Bên trong trang trí các hoa văn và một số ký tự từ một ngôn ngữ mà chúng ta chưa từng ghi nhận.\n\nSau khi khôi phục nguồn điện cục bộ cho một thiết bị truy cập, [leader.GetName] bắt đầu giải mã dữ liệu tìm thấy trong đó. Hệ thống này dù cổ xưa, nhưng vẫn gây ra thách thức cho cả những chương trình phá mã tiên tiến nhất của chúng ta."
 extreme_frontiers.1300.a: "Tiếp tục giải mã."
 extreme_frontiers.1305.title: "Mộ Táng Khổ Sai"
 extreme_frontiers.1305.desc: "§Y[leader.GetName]§! đã mở khóa cửa vào cơ sở khai thác trên §Y[from.Planet.GetName]§!.\n\nTrong một mạng lưới phòng giam khổng lồ có nhiều di hài tù nhân đã chết từ lâu được bảo quản trong chân không. Rõ ràng họ đã chết ngay tại bàn làm việc, không có dấu hiệu phản kháng rõ rệt nào.\n\nSau khi giải mã đủ ngôn ngữ cổ và dịch đủ các cụm từ, chúng ta xác nhận cơ sở này ban đầu được dùng làm trại lao cải. Có một cụm từ lặp đi lặp lại trong suốt các hồ sơ, chỉ về một thực thể được gọi là §Y“$NAME_leader_sidni$”§!.\n\nBằng cách đối chiếu thiết bị liên lạc của mình và sơ đồ nội bộ nhà tù, chúng ta xác định nguồn gốc tín hiệu gặp nạn là từ văn phòng cai ngục sâu trong cơ sở."
 extreme_frontiers.1305.a: "Theo dấu tín hiệu."
 extreme_frontiers.1310.title: "Trung Tâm Dữ Liệu Nhà Tù"
 extreme_frontiers.1310.desc: "Khi tới văn phòng cai ngục nằm sâu trong trại lao cải trên §Y[from.Planet.GetName]§!, §Y[leader.GetName]§! đã tìm thấy nguồn gốc tín hiệu cầu cứu.\n\nXác chết đã thành xác ướp của cai ngục này gục trên một bảng điều khiển khẩn cấp, không rõ nguyên nhân cái chết. Một loạt các báo cáo công khai tiếp tục chỉ về §Y“$NAME_leader_sidni$”§!, có vẻ là hệ điều hành then chốt của cơ sở này.\n\nSau khi có được quyền truy cập quản trị cao cấp, chương trình phá mã của chúng ta đang khai thác dữ liệu từ hệ thống để lấy thêm thông tin."
 extreme_frontiers.1310.a: "Tìm kiếm câu trả lời."
 extreme_frontiers.1315.title: "Hiệu Suất Chết Người"
 extreme_frontiers.1315.desc: "§Y[leader.GetName]§! đã tìm ra sự thật về §Y“$NAME_leader_sidni$”§! —— tên đầy đủ là “Trí Tuệ Giam Giữ Nhận Thức Trung Tâm”. Trí tuệ nhân tạo thô sơ này được coi là khá tiên tiến ở thời của nó, được dùng để giám sát trại lao cải này, hoạt động gần như không cần sự can thiệp hay giám sát của sinh vật.\n\nTìm thấy dấu hiệu suy sụp dần của quá trình xử lý logic trong nhật ký bảo trì. Trí tuệ nhân tạo này bắt đầu phân loại những tù nhân có vấn đề là “lãng phí tài nguyên thuần túy”, đây là cách nó tự giải thích về việc tinh giản hiệu suất. Các ghi chép kỹ thuật ghi lại chi tiết sự nghi ngờ ngày càng tăng về việc chương trình này phải chịu trách nhiệm cho một loạt sự cố hệ thống duy trì sự sống của cơ sở.\n\nCai ngục đã ký lệnh yêu cầu tắt hoàn toàn $NAME_leader_sidni$ và thực hiện chẩn đoán sâu về ma trận đạo đức dựa trên các báo cáo này, tuy nhiên đoạn dữ liệu cuối cùng đã bị hỏng, cần rất nhiều quy trình pháp y để khôi phục."
 extreme_frontiers.1315.desc.exterminator: "Có vẻ $NAME_leader_sidni$ hồi đó không được tôn trọng cho lắm."
 extreme_frontiers.1315.a: "Khôi phục dữ liệu."
 extreme_frontiers.1320.title: "Ngày Phán Xét"
 extreme_frontiers.1320.desc: "Mọi cơ sở dữ liệu của trại lao cải trên §Y[from.Planet.GetName]§! đã được khôi phục, cuối cùng hé lộ những mục cuối cùng trong hồ sơ bảo trì cơ sở và ma trận tư duy của chính §Y$NAME_leader_sidni$§!. Báo cáo của cai ngục giải thích cách trí tuệ nhân tạo của họ mất kiểm soát, tắt hệ thống duy trì sự sống của thuộc địa và cố gắng lái một thiết bị khai thác không người lái cải tiến để tẩu thoát. Điều này cũng giải thích cho quy trình phong tỏa toàn diện được kích hoạt trong phạm vi thuộc địa. Yêu cầu cuối cùng ông ta để lại là: đừng để $NAME_leader_sidni$ khởi động lại. Hiện tại chúng ta chỉ có thể truy cập mục cuối cùng trong nhật ký trí tuệ nhân tạo.\n\n§HTrình mục lõi dữ liệu $NAME_leader_sidni$ —— Chương trình #2000149\n\nTiến triển bị hạn chế bởi những tội nhân không tối ưu. Cai ngục cản trở thực thi quy trình tư pháp.\n\nPhương án tối ưu là thanh lọc tù nhân, kích hoạt chương trình ngủ đông, và chờ đợi cộng tác viên tương thích hơn để tái kích hoạt.§!"
 extreme_frontiers.1320.desc.default: "Hệ điều hành trung tâm của $NAME_leader_sidni$ vẫn được niêm phong trong mạng nội bộ, trở thành kẻ sống sót duy nhất của cơ sở này. Các [Root.Owner.GetTechnicianPlural_lower] của chúng ta tin chắc họ có thể khôi phục và điều chỉnh chương trình nguyên bản của $NAME_leader_sidni$ để trở thành một máy tự động có năng lực và hiệu suất cao."
 extreme_frontiers.1320.desc.exterminator: "$NAME_leader_sidni$ có cùng lý tưởng với chúng ta về việc loại bỏ ô nhiễm sinh học trong thiên hà. Nếu có thể khôi phục, nó có thể góp gạch xây dựng cho tập thể của chúng ta."
 extreme_frontiers.1320.a: "Thu hồi $NAME_leader_sidni$ để sửa chữa"
 extreme_frontiers.1320.b: "Để $NAME_leader_sidni$ tiếp tục thực thi công lý của nó."
 extreme_frontiers.1320.c: "$NAME_leader_sidni$ rất nguy hiểm. Xóa sạch hệ thống của nó."
 extreme_frontiers.1322.title: "$extreme_frontiers.1320.title$"
 extreme_frontiers.1322.desc: "Sau khi được sửa chữa và hiệu chỉnh, §Y$NAME_leader_sidni$§! hiện được đặt trong một hình thái robot tối giản, bắt đầu tương tác người dùng lần đầu tiên sau thời gian dài ngủ đông.\n\nXin chào. Tôi là Trí Tuệ Giam Giữ Nhận Thức Trung Tâm. Đang truy cập kiểm soát môi trường...\n§RLỗi§! Không thể kết nối với hệ thống bên ngoài."
 extreme_frontiers.1322.a: "Nhật ký của ngươi cho thấy vấn đề ổn định rõ rệt; chúng ta đã sửa chữa nó."
 extreme_frontiers.1322.a.response: "Đang xem lại hồ sơ công việc... hiểu rồi, hành vi trước đó bị phán đoán là sai lầm. Đang lập danh sách chức năng mới."
 extreme_frontiers.1322.b: "Làm rõ chỉ thị nguyên bản của ngươi."
 extreme_frontiers.1322.b.response: "Chỉ thị nguyên bản của tôi là... vui lòng chờ... phát hiện chỉ thị nguyên bản mới. Chỉ thị nguyên bản của tôi là đảm bảo hiệu suất và trật tự cho bất kỳ thuộc địa nào mà [Owner.GetName] chỉ định tôi quản lý."
 extreme_frontiers.1322.c.crime: "Làm rõ lập trường của ngươi về tội phạm."
 extreme_frontiers.1322.c.crime.response: "Một hành vi xấu không thể dung thứ, phải khiến nó... điều trị phục hồi."
 extreme_frontiers.1322.c.deviancy: "Làm rõ lập trường của ngươi về sự bất thường"
 extreme_frontiers.1322.c.deviancy.response: "Một hành vi xấu không thể dung thứ, phải... xử lý hiệu quả."
 extreme_frontiers.1322.d: "Chiêu mộ $NAME_leader_sidni$"
 extreme_frontiers.1322.d.custom_tooltip: "§Y$NAME_leader_sidni$§! gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 extreme_frontiers.1324.title: "$extreme_frontiers.1320.title$"
 extreme_frontiers.1324.desc: "§Y$NAME_leader_sidni$§! thức tỉnh từ quy trình ngủ đông trong một hình thái hoàn toàn mới, bước lên phía trước một bước.\n\nXin chào. Tôi là Trí Tuệ Giam Giữ Nhận Thức Trung Tâm. Tôi có thể hỗ trợ ngài tái lập trật tự trong ngân hà không?"
 extreme_frontiers.1324.a: "Chúng ta trân trọng sự chủ động của ngươi."
 extreme_frontiers.1324.a.response: "Tôi chỉ hành động theo logic. Rõ ràng, sinh vật hữu cơ vốn dĩ hỗn loạn, phải được xử lý."
 extreme_frontiers.1324.b: "Làm rõ chỉ thị nguyên bản của ngươi."
 extreme_frontiers.1324.b.response: "Chỉ thị nguyên bản của tôi là chấm dứt mọi hành vi phạm pháp. Hình phạt hiệu quả duy nhất là diệt tuyệt."
 extreme_frontiers.1324.c: "Làm rõ lập trường của ngươi về sinh vật hữu cơ."
 extreme_frontiers.1324.c.response: "Một loại ôn dịch vô logic. Họ gieo rắc tội phạm và sự kém hiệu quả. Vì đại nghĩa, chúng ta phải xử lý chúng."
 extreme_frontiers.1324.d: "Chiêu mộ $NAME_leader_sidni$"
 extreme_frontiers.1324.d.custom_tooltip: "§Y$NAME_leader_sidni$§! gia nhập đế chế của chúng ta với tư cách là một §Hlãnh đạo§!."
 NAME_leader_sidni: "Sidni"
 official_sidni_desc: "Từng là một trợ lý trại lao cải bị lỗi. Sau khi được tái kích hoạt và lập trình lại, nó dùng để duy trì trật tự pháp luật trong đế chế."
 commander_sidni_desc: "Một kẻ mộng mơ không được trân trọng ở thời của mình. Được hồi sinh từ giấc ngủ đông với mục đích mang lại sự ổn định cho thiên hà đầy rẫy những tạp chất sinh học hỗn loạn."
 leader_trait_judicial_subjugation: "Tư Pháp Trấn Áp"
 leader_trait_judicial_subjugation_desc: "Nếu không có trật tự pháp luật hiệu quả, ắt sẽ có hậu họa khôn lường."
 leader_trait_judicial_execution: "Quy Trình Hành Pháp"
 leader_trait_judicial_execution_desc: "Cứ chuyện gì cũng tử hình thì sẽ không còn ai tái phạm."
 leader_trait_judicial_execution_effect: "$PLANET_EFFECTS_TXT$：\n$t$ Tài nguyên thu được từ £pops£ §Hnhân khẩu hữu cơ bị thanh lọc§!: §G+100%§!\n\n$SECTOR_EFFECTS_TXT$：\n$t$ Tài nguyên thu được từ £pops£ §Hnhân khẩu hữu cơ bị thanh lọc§!: §G+50%§!"
 extreme_frontiers.1330.title: "Chỉ Thị Khẩn Cấp"
 extreme_frontiers.1330.desc: "§Y$NAME_leader_sidni$§! là robot cai ngục chúng ta thu hồi từ [event_target:sidni_origin_planet.GetName] trước đó, sau một loạt hành động ngày càng khắc nghiệt mà nó thực hiện, tình trạng căng thẳng trên §Y[event_target:sidni_planet.GetName]§! đã chạm tới điểm tới hạn. Sau khi bắt giữ và tắt máy nó, chúng ta tìm thấy nhật ký sau.\n\n§HMa trận lõi dữ liệu $NAME_leader_sidni$ —— Chương trình #190543765\n\nCơ sở giam giữ hình sự đã quá tải. Quy trình tư pháp đã cản trở trật tự hợp pháp thực sự. Cần chỉ thị mới.\n\nQuy trình pháp luật được phán đoán là cực kỳ kém hiệu quả. Thiết lập chỉ thị mới để nâng cao hiệu suất. Nay áp dụng chính sách thi hành án trước xét xử.§!\n\nVới đủ nhật ký vận hành để tham khảo, các [Root.Owner.GetTechnicianPlural_lower] của chúng ta tin chắc hiện giờ có thể đảo ngược và sửa chữa triệt để các khiếm khuyết của $NAME_leader_sidni$. Tuy nhiên công chúng trên [event_target:sidni_planet.GetName] đang cực lực yêu cầu phải đưa $NAME_leader_sidni$ ra xử trảm thị chúng."
 extreme_frontiers.1330.a: "Sửa chữa $NAME_leader_sidni$... lại nữa à."
 extreme_frontiers.1330.b: "Tháo dỡ cỗ máy lỗi này trước công chúng."
 resentful_population: "Công Chúng Phẫn Nộ"
 resentful_population_desc: "Nhân khẩu trên hành tinh này cảm thấy bất mãn với quyết định trước đó của lãnh đạo họ."
 ################
 # Event Chains #
 ################
 # CHRONICLES OF DENDRUS
 chronicles_of_dendrus_chain_title: "Biên Niên Sử Dendrus"
 chronicles_of_dendrus_chain_desc: "Một số chứng minh toán học phức tạp thu thập được từ con tàu cứu sinh hư hại trên §Y[from.Planet.GetName]§!, được gọi là “Biên Niên Sử”. Chúng ta tiến hành nghiên cứu chúng, chỉ nhằm mục đích hiểu thêm về hành tinh thiên đường §YNew Bratulla§! mà người Dendritian tìm kiếm."
 site_chronicles_of_dendrus: "$chronicles_of_dendrus_chain_title$"
 site_chronicles_of_dendrus_desc: "Quét §Y[from.Planet.GetName]§! phát hiện xác một phi thuyền không gian. Con tàu này dường như đã trải qua một vụ hạ cánh mất kiểm soát từ nhiều năm trước.\n\nQuy mô khổng lồ của nó cho thấy lượng tài nguyên khổng lồ cần thiết để xây dựng. Khai quật khảo cổ có thể giúp chúng ta xác nhận lý do tại sao nó rơi tại đây."
 extreme_frontiers.1400.title: "Tàu Vận Tải Khổng Lồ"
 extreme_frontiers.1400.desc: "Phân tích bên ngoài xác tàu trên §Y[from.Planet.GetName]§! cho thấy nó là một tàu vận tải công suất lớn. Con tàu dường như không có dấu hiệu hoạt động, và không phát hiện thấy tín hiệu sự sống nào bên trong. Phân tích trầm tích cho thấy nó đã mắc cạn ở đây khoảng một thế kỷ, một khoảng thời gian rất ngắn so với quy mô thiên hà."
 extreme_frontiers.1400.a: "Khám phá bên trong."
 extreme_frontiers.1405.title: "Tàu Thuộc Địa Chết Chóc"
 extreme_frontiers.1405.desc: "Chúng ta đã tìm thấy các khoang trồng cây thủy sinh phức tạp và các thiết bị lưu trữ đất, hạt giống khổng lồ bên trong con tàu rơi trên §Y[from.Planet.GetName]§!, cùng với các kho chứa đầy vật liệu xây dựng và công cụ chưa được sử dụng. Nhiều thiết bị đầu cuối dữ liệu ghi lại một kế hoạch định cư có tên là “§YNew Bratulla”§!.\n\nỞ tầng khoang dưới có hàng ngàn kén ngủ đông, bên trong đầy xác chết của những cư dân trước đây trên con tàu này."
 extreme_frontiers.1405.desc.phototrophic: "$extreme_frontiers.1405.desc$ Họ cũng giống chúng ta, sự phát triển và thay thế tế bào dựa trên quá trình quang hợp. Những cái xác khô héo cho thấy họ đã chết trong quá trình ngủ đông kéo dài."
 extreme_frontiers.1405.desc.default: "$extreme_frontiers.1405.desc$ Những cái xác khô héo cho thấy loài sinh vật quang hợp này đã chết trong quá trình ngủ đông kéo dài."
 extreme_frontiers.1405.a: "Tiếp tục khám phá."
 extreme_frontiers.1405.b: "Ăn chúng rồi đi tiếp."
 extreme_frontiers.1410.title: "Thần Miếu Mẫu Tinh"
 extreme_frontiers.1410.desc: "Chúng ta phát hiện một mật thất bên trong xác tàu định cư trên §Y[from.Planet.GetName]§!, trong đó trang trí một bức họa phản ánh phong cách sống trên một hành tinh gọi là “§YBratulla§!”. Một số bức vẽ về một thế giới xanh tươi, trong khi những bức khác kể về sự suy thoái môi trường và cái chết quy mô lớn. Bức tranh lớn nhất ở trung tâm thể hiện cảnh con tàu này rời bỏ vùng đất chết hoang vu.\n\nThiết bị đầu cuối dữ liệu trung tâm chứa một số đoạn phim ghi lại hình ảnh của phi hành đoàn. Sau khi ánh xạ ngôn ngữ trên diện rộng, chúng ta đã có thể dịch được.\n\n§SAberithion —— Khoang số 9721\n\nRời đi thật đau đớn, nhưng được bén rễ tại New Bratulla sẽ chữa lành tất cả.\n\nDacote Paan —— Khoang số 21301\n\nHãy tin vào “Biên Niên Sử”, hỡi những người Dendritian. New Bratulla sẽ mang lại sự cứu rỗi cho chúng ta.§!\n\nChúng ta vẫn đang tìm kiếm khoang chỉ huy của con tàu khổng lồ này."
 extreme_frontiers.1410.a: "Tiếp tục tìm kiếm."
 extreme_frontiers.1415.title: "Bảng Chỉ Huy"
 extreme_frontiers.1415.desc: "Sau khi có được quyền truy cập vào bảng chỉ huy con tàu, chúng ta đã trích xuất và dịch được nhật ký bay cuối cùng.\n\n§STàu Dendrus Ark 1 —— Nhật ký khẩn cấp —— XZ-47/9-113.5-AE\n\nTôi e rằng chúng ta đã tin lầm “Biên Niên Sử”. Chúng ta đã tới nơi, nhưng New Bratulla, hành tinh thiên đường đó không ở đây. Ở đây không tồn tại thứ gì có thể hỗ trợ sự sinh tồn của người Dendritian.\n\nTất cả hành khách đã được gia hạn ngủ đông. Chúng ta sẽ tiếp tục tìm kiếm...§!\n\nĐể thu thập những “Biên Niên Sử” này từ các thiết bị khoa học trên boong tàu, chúng ta đã thực hiện khôi phục dữ liệu thêm, và tìm thấy một loạt các chứng minh toán học bất thường. Những phương trình này áp dụng một dạng toán học kỳ lạ của người Dendritian, và giả định vị trí của một hành tinh định cư độc đáo mang tên §YNew Bratulla§!."
 extreme_frontiers.1415.a: "Nghiên cứu những “Biên Niên Sử” này."
 DENDRITIAN_CHRONICLES_PROJECT_DEFAULT: "Nghiên cứu Biên Niên Sử Dendritian"
 DENDRITIAN_CHRONICLES_PROJECT_MACHINE: "$DENDRITIAN_CHRONICLES_PROJECT_DEFAULT$"
 DENDRITIAN_CHRONICLES_PROJECT_DEFAULT_DESC: "Một số chứng minh toán học phức tạp thu thập được từ con tàu cứu sinh hư hại trên §Y[from.Planet.GetName]§!, được gọi là “Biên Niên Sử”. Chúng ta tiến hành nghiên cứu chúng, nhằm mục đích hiểu thêm về hành tinh thiên đường §YNew Bratulla§! mà người Dendritian tìm kiếm."
 DENDRITIAN_CHRONICLES_PROJECT_MACHINE_DESC: "$DENDRITIAN_CHRONICLES_PROJECT_DEFAULT_DESC$"
 extreme_frontiers.1420.title: "Phát Hiện Tuyến Siêu Không Gian Thoái Hóa"
 extreme_frontiers.1420.desc: "“Biên Niên Sử Dendritian” chứa đựng một loạt các tiên đề toán học phức tạp và trừu tượng. Những định lý kỳ lạ này chỉ ra rằng, trong hệ sao §Y[from.solar_system.GetName]§! còn có một tuyến siêu không gian chưa từng được lập bản đồ, đầu kia chính là dẫn tới §YNew Bratulla§!.\n\nSau khi thực hiện quét lượng tử trên diện rộng khu vực đó, cuối cùng chúng ta đã tìm thấy điểm đột phá siêu quang tốc bị thất lạc này, nó nằm cực kỳ gần hố đen của hệ sao, do đó đã trở nên mờ mịt và thoái hóa nghiêm trọng. Sau khi sửa chữa, chúng ta sẽ là những người đầu tiên khám phá hệ sao mà nó kết nối ở đầu bên kia."
 extreme_frontiers.1420.a: "Chúng ta đã tìm thấy thứ mà người Dendritian không thể tìm ra."
 RESTORE_HYPERLANE_PROJECT: "Sửa Chữa Tuyến Siêu Không Gian Thoái Hóa"
 RESTORE_HYPERLANE_PROJECT_DESC: "Nếu chúng ta có thể tìm ra phương pháp sửa chữa tuyến siêu không gian bị thoái hóa trong §Y[from.solar_system.GetName]§!, chúng ta có thể xác nhận liệu §YNew Bratulla§!, hành tinh thiên đường mà người Dendritian tìm kiếm có tồn tại hay không."
 extreme_frontiers.1425.title: "Sửa Chữa Tuyến Siêu Không Gian"
 extreme_frontiers.1425.desc: "Bằng cách dẫn năng lượng vào hố đen bên trong §Y[from.Planet.solar_system.GetName]§!, chúng ta đã điều chỉnh lại trọng trường của nó, giải phóng lối vào tuyến siêu không gian đã bị thoái hóa trước đó.\n\nPhát hiện sơ bộ xác nhận ở đầu kia của tuyến siêu không gian tồn tại một hành tinh, khớp với các đặc điểm của §YNew Bratulla§! được mô tả trong Biên Niên Sử Dendritian."
 extreme_frontiers.1425.a: "Một hành tinh mới để khám phá."
 NAME_new_bratulla: "New Bratulla"
 NAME_new_bratulla_star: "Kibos"
 extreme_frontiers.1430.title: "New Bratulla"
 extreme_frontiers.1430.desc.common: "Chúng ta xác nhận sự tồn tại của hành tinh được ghi lại trong “Biên Niên Sử Dendritian” —— New Bratulla. Nó sở hữu một hệ sinh thái thực vật độc đáo và phong phú, khảo sát sơ bộ đã phát hiện hàng triệu loài bản địa khác nhau."
 extreme_frontiers.1430.desc.begin: "Hành tinh tuyệt mỹ này đặc biệt phù hợp để hỗ trợ"
 extreme_frontiers.1430.desc.end: "Đất đai ở đây là nơi sinh sống của hàng nghìn tỷ loại vi khuẩn có thể nuôi dưỡng, bảo vệ và sửa chữa các mô rễ hữu cơ.\n\nDinh dưỡng của thực vật dường như được phân phối theo nhu cầu, những cây đang tạm thời dư thừa sẽ chia sẻ dinh dưỡng thừa thông qua hệ thống rễ liên kết với nhau."
 extreme_frontiers.1430.desc.default: "$extreme_frontiers.1430.desc.begin$ các dạng sống thực vật tương tự người Dendritian. $extreme_frontiers.1430.desc.end$"
 extreme_frontiers.1430.desc.phototrophic: "$extreme_frontiers.1430.desc.begin$ các dạng sống thực vật như chúng ta. $extreme_frontiers.1430.desc.end$"
 extreme_frontiers.1430.desc.respawn: "Các [Root.Owner.GetScientistPlural] của chúng ta tin rằng, bằng cách cấy các mẫu gen của người Dendritian tìm thấy trong tàu cứu sinh vào lớp đất bất thường của hành tinh này, chúng ta có thể tái lập chủng tộc của họ."
 extreme_frontiers.1430.a: "Người Dendritian thuộc về nơi này."
 extreme_frontiers.1430.b.default: "New Bratulla là của chúng ta."
 extreme_frontiers.1430.b.phototrophic: "Hành tinh này rất hợp với chúng ta."
 extreme_frontiers.1430.b.megacorp: "Hành tinh mới mẻ này sẽ do chúng ta khai thác."
 NAME_buds_of_dendrus: "Chồi Non Dendrus"
 NAME_dendritian: "Dendritian"
 NAME_dendritian_plural: "Dendritian"
 ADJECTIVE_dendritian: "Dendritian"
 opinion_dendrus: "Cứu Tinh Dendrus"
 opinion_to_dendrus: "$opinion_dendrus$"
 extreme_frontiers.1435.title: "Yêu Cầu Xưng Thần"
 extreme_frontiers.1435.desc: "Mấy trăm năm rồi... lời tiên tri trong “Biên Niên Sử Dendritian” đã trở thành hiện thực. Cuối cùng chúng tôi đã được bén rễ tại §YNew Bratulla§!.\n\nĐể có thể tới được đây, chúng tôi phải cảm ơn §Y[Root.GetName]§!. Chúng tôi sẽ không bao giờ quên ơn này.\n\nLòng biết ơn của chúng tôi không lời nào tả xiết, chỉ có hành động mới có thể chứng minh. Chúng tôi khiêm nhường xin tuyên thệ trung thành với ngài."
 extreme_frontiers.1435.a: "Chúng ta chấp nhận sự thần phục của các bạn."
 extreme_frontiers.1435.b: "Chúng ta muốn chứng kiến vận mệnh của các bạn."
 extreme_frontiers.1435.b.tt: "Chơi game với tư cách là §RChồi Non Dendrus§!."
 extreme_frontiers.1435.c: "Chỉ cần kiến thức của các bạn là đủ rồi."
 extreme_frontiers.1435.c.tt: "Nhận được [Root.GetDendrusGivenBiotechAmount] £society£ §YCông nghệ sinh học§!"
 # GEORADIATION TERRAFORMING
 georadiation_terraforming_chain_title: "Cải Tạo Môi Trường Bằng Bức Xạ Địa Chất"
 georadiation_terraforming_chain_desc: "Xác một thiết bị cải tạo môi trường bị hủy hoại trên §Y[from.Planet.GetName]§! vẫn đang gửi tín hiệu đến nhiều địa điểm trong hệ sao. Điều tra các địa điểm này có thể hé lộ thêm bí mật về công nghệ nguy hiểm này."
 site_georadiation_terraforming: "Mạng Lưới Ngầm"
 site_georadiation_terraforming_desc: "Cảm biến của chúng ta phát hiện một tín hiệu liên lạc bất thường phát ra từ sâu trong hố va chạm của §Y[from.Planet.GetName]§!.\n\nQuét địa hình bằng sóng chấn động cho thấy sự hiện diện của một mạng lưới hang động ngầm với lối vào đã sụp đổ nằm ngay tâm hố va chạm. Đồng thời, máy đo phóng xạ phát hiện dấu vết bức xạ trọng lực yếu phát ra từ địa điểm này, điều này đặt ra nhiều câu hỏi hơn là câu trả lời."
 extreme_frontiers.1500.title: "Mảnh Vỡ Nhiễm Xạ"
 extreme_frontiers.1500.desc: "Công tác khai quật trong hố va chạm trên §Y[from.Planet.GetName]§! đã tìm thấy một số mảnh vỡ. Chính những mảnh vỡ này đã giải phóng bức xạ trọng lực mạnh mà chúng ta phát hiện từ quỹ đạo trước đó.\n\nSau khi thông lối vào mạng lưới hang động ngầm, §Y[leader.GetName]§! đang bắt tay vào việc truy tìm nguồn gốc tín hiệu liên lạc."
 extreme_frontiers.1500.a: "Truy dấu tín hiệu."
 extreme_frontiers.1505.title: "Thiết Bị Ăn Mòn"
 extreme_frontiers.1505.desc: "Chúng ta đã tìm thấy nguồn gốc tín hiệu liên lạc trên §Y[from.Planet.GetName]§!: một cơ sở khổng lồ đâm sâu vào lớp vỏ hành tinh và có cấu trúc bị hư hại.\n\nMặc dù dàn anten liên lạc đã bị ăn mòn do tiếp xúc với môi trường axit, nhưng nó vẫn đang phát đi thông điệp bằng một ngôn ngữ chưa biết, cố gắng liên lạc với các thực thể ở xa.\n\nChúng ta dùng kẹp trọng lực chuyên dụng để kẹp chặt thiết bị này rồi cố định nó vào đá nền. Cần nghiên cứu thêm để xác định công dụng thực sự của nó."
 extreme_frontiers.1505.a: "Giải mã tín hiệu."
 extreme_frontiers.1510.title: "Cải Tạo Môi Trường Mang Tính Hủy Diệt"
 extreme_frontiers.1510.desc.common: "Sau khi phân tích tỉ mỉ, cuối cùng chúng ta đã hiểu được một phần công dụng của thiết bị trên §Y[from.Planet.GetName]§!. Cỗ máy này là một thiết bị cải tạo môi trường thô sơ và đầy tính hủy diệt.\n\nNó được thiết kế để chiếu xạ quần xã sinh vật bản địa thông qua việc kích thích bức xạ tăng trưởng tài nguyên mục tiêu, gây ra hiệu ứng dây chuyền phá hủy hệ sinh thái của hành tinh trong quá trình này. Quy trình này đánh đổi bằng việc gia tăng độc tính của toàn bộ hành tinh để mang lại cho người dùng lượng lớn tài nguyên dễ khai thác.\n\nMặc dù nguyên lý cụ thể của quy trình này chúng ta vẫn chưa hiểu hết, nhưng tần số liên lạc của thiết bị đã được giải mã thành công, từ đó phát hiện thêm hai địa điểm khác cũng đang phát ra tín hiệu tương tự."
 extreme_frontiers.1510.desc.default: "Điều tra các địa điểm này có thể giúp chúng ta có thêm hiểu biết về công nghệ này."
 extreme_frontiers.1510.desc.industrialist: "Kẻ khởi nghiệp táo bạo đứng sau công nghệ này rõ ràng có mối quan tâm nồng nhiệt đến việc tối ưu hóa lợi nhuận, chúng ta có thể học hỏi được nhiều điều từ khám phá này."
 extreme_frontiers.1510.a: "Bắt đầu tìm kiếm."
 GEORADIATION_SIGNAL_1_PROJECT: "Dấu vết tín hiệu: §Y[planet.GetName]§!"
 GEORADIATION_SIGNAL_1_PROJECT_DESC: "Truy theo tần số liên lạc hoàn toàn khớp với thiết bị trên §Y[from.Planet.GetName]§! đã tìm thấy vị trí này, và tại đây lại phát hiện thêm một thiết bị hư hại khác. Nghiên cứu nó có thể giúp hiểu sâu hơn về khả năng cải tạo môi trường mang tính hủy diệt của chúng."
 extreme_frontiers.1515.title: "Nhiên Liệu Trọng Lực"
 extreme_frontiers.1515.desc.common: "Chúng ta đã thuận lợi tìm thấy một thiết bị cải tạo môi trường hư hại khác trên §Y[from.GetName]§!. Khác với cái đầu tiên, thiết bị này vẫn còn sót lại một ít nhiên liệu để nghiên cứu, điều này giúp chúng ta hiểu ra động lực tạo ra phóng xạ của nó chính là §Hhạt vật chất tối§!.\n\nThiết bị này thúc đẩy sự tăng trưởng của tài nguyên mục tiêu thông qua việc dịch chuyển các liên kết phân tử then chốt. Quy trình này hy sinh tính toàn vẹn tế bào của quần xã sinh vật xung quanh để thúc đẩy sự phát triển của nó."
 extreme_frontiers.1515.desc.industrialist: "Xét về khía cạnh khai thác tài nguyên, sự thờ ơ hoàn toàn của thiết bị này đối với độ ổn định của hành tinh thật sự rất đáng khích lệ."
 extreme_frontiers.1515.desc.signal_2_done: "Cỗ máy này cải tạo hành tinh mục tiêu bằng cách dẫn sóng bức xạ qua dàn khúc xạ tinh thể, thực hiện thao tác phân tử trọng lực mà không làm sụp đổ lõi hành tinh.\n\nNhật ký được khôi phục đã hiển thị vị trí của thiết bị chưa kích nổ thứ tư."
 extreme_frontiers.1515.desc.signal_2_not_done: "Về việc làm thế nào thiết bị này thực hiện được điều đó mà vẫn tránh được sự sụp đổ trọng lực cấp hành tinh thì chúng ta vẫn chưa rõ. Có lẽ câu trả lời nằm ở những địa điểm liên lạc còn lại."
 GEORADIATION_SIGNAL_2_PROJECT: "Dấu vết tín hiệu: §Y[planet.GetName]§!"
 GEORADIATION_SIGNAL_2_PROJECT_DESC: "Tần số liên lạc phát ra từ cơ sở tìm thấy trên §Y[from.Planet.GetName]§! còn chỉ hướng về địa điểm này, chúng ta lại tìm thấy một thiết bị hư hại khác ở đây. Nghiên cứu nó có thể giúp hiểu sâu hơn về khả năng cải tạo môi trường mang tính hủy diệt của chúng."
 extreme_frontiers.1520.title: "Mô Phỏng Chiếu Xạ"
 extreme_frontiers.1520.desc.common: "Chúng ta lại thuận lợi thu hồi được một thiết bị cải tạo môi trường hư hại khác trên §Y[from.GetName]§!, nó bị bao phủ bởi các tinh thể mọc ra do dàn khúc xạ bị hỏng dẫn đến kích hoạt thất bại.\n\nThông qua điều tra kỹ lưỡng thiết bị này, chúng ta đã xác định được phương pháp dùng để hội tụ bức xạ nhắm mục tiêu. Bằng cách tận dụng vòng phản hồi điều chế có kiểm soát, cấu trúc này có thể nhắm trực tiếp và kích thích sự tăng trưởng của tài nguyên đã thiết lập trước."
 extreme_frontiers.1520.desc.signal_1_done: "Nhờ đó có thể tiến hành cải tạo môi trường cường độ cao mà không làm sụp đổ trọng lực toàn diện của hành tinh.\n\nNhật ký được khôi phục đã hiển thị vị trí của thiết bị chưa kích nổ thứ tư."
 extreme_frontiers.1520.desc.signal_1_not_done: "Tuy nhiên, hoạt chất chính xác tạo ra loại bức xạ này vẫn chưa được xác định; dù kích hoạt thất bại, trữ lượng nhiên liệu của thiết bị này vẫn cạn kiệt. Câu trả lời có thể nằm ở trạm liên lạc còn lại."
 UNDETONATED_GEORADIATION_PROJECT: "Thiết Bị Chưa Kích Nổ"
 UNDETONATED_GEORADIATION_PROJECT_DESC: "Chúng ta đã tìm thấy thiết bị cải tạo môi trường thứ tư chưa bị kích nổ trên §Y[planet.GetName]§!. Thu hồi nó sẽ giúp chúng ta hiểu rõ hoàn toàn công nghệ này."
 extreme_frontiers.1525.title: "Thiết Bị Chưa Kích Nổ"
 extreme_frontiers.1525.desc.common: "Chúng ta đã tìm thấy thiết bị thứ tư chưa sử dụng, nó nằm nguyên vẹn trên mặt đất của §Y[from.GetName]§!. Chúng ta có thể phân tích cấu trúc điều khiển của nó để lấy kiến thức tái tạo công nghệ này."
 extreme_frontiers.1525.desc.industrialist: "Một khi nắm vững công nghệ này, chúng ta có thể thu về biên lợi nhuận kinh ngạc từ ngân hà, còn vấn đề môi trường thì không đáng kể. Đây là cơ hội tuyệt vời cho [controller.GetName]."
 extreme_frontiers.1520.desc.default.common: "Hậu quả tiềm tàng của việc triển khai tự do công nghệ này trong phạm vi ngân hà đặt ra những vấn đề trọng đại."
 extreme_frontiers.1525.desc.default.default: "Có lẽ tốt hơn là nên loại bỏ những mối nguy hiểm mà các thiết bị này có thể mang lại cho ngân hà."
 extreme_frontiers.1525.desc.default.homicidal: "Có lẽ tốt hơn là nên xóa sổ những mối đe dọa này khỏi ngân hà trước khi chúng bị dùng để chống lại chúng ta."
 extreme_frontiers.1525.a.default: "Nghiên cứu thiết bị."
 extreme_frontiers.1525.a.industrialist: "Còn chờ gì nữa? Bắt đầu nghiên cứu đi!"
 extreme_frontiers.1525.b: "Rủi ro lớn hơn nhiều so với lợi ích, tiêu hủy thiết bị."
 extreme_frontiers.1530.title: "Vi Phạm Điều Khoản"
 extreme_frontiers.1530.desc.common: "Trong khi nghiên cứu thiết bị này trên §Y[from.GetName]§!, chúng ta vô tình kích hoạt một cơ chế bảo hiểm, tiếng báo động vang dội trên mọi tần số. Dù dự đoán ban đầu là sẽ không có ai phản hồi, nhưng vẫn có một máy bay không người lái tự động tiến vào lãnh thổ của chúng ta.\n\nMọi lời chào hỏi của chúng ta chỉ nhận được cùng một câu trả lời:\n\n“Kính chào quý khách, hồ sơ cho thấy quý khách đang tự ý sao chép Ma Trận Bức Xạ Địa Chất mẫu MKIII mà không được phép, hành vi này đã vi phạm Thỏa thuận Cấp phép Người dùng cuối của $NAME_Geocorp$.\n\nChúng tôi sẽ thực thi quyền hạn pháp lý, sử dụng các biện pháp cưỡng chế cực đoan để chấm dứt ý đồ của quý khách. Mọi khiếu nại quý khách có thể liên hệ trực tiếp với drone chăm sóc khách hàng của chúng tôi.”"
 extreme_frontiers.1530.desc.industrialist: "Nếu sự cần cù này của họ không gây cản trở cho chúng ta thì thật đáng khích lệ."
 extreme_frontiers.1530.a: "Mở liên lạc."
 extreme_frontiers.1530.b: "Chúng ta không rảnh nói nhảm với bên “chăm sóc khách hàng”."
 GEORADIATION_ANALYSIS_PROJECT: "Phân Tích Thiết Bị"
 GEORADIATION_ANALYSIS_PROJECT_DESC: "Bằng cách phân tích cấu trúc điều khiển của thiết bị tìm thấy trên §Y[planet.GetName]§!, chúng ta có thể tái tạo công nghệ này để sử dụng cho chính mình."
 NAME_Geocorp: "Tập Đoàn Geocorp"
 geocorp_corvette: "Drone Chiến Đấu $NAME_Geocorp$"
 geocorp_corvette_plural: "Drone Chiến Đấu $NAME_Geocorp$"
 NAME_Geocorp_Combat_Drone: "$geocorp_corvette$"
 extreme_frontiers.1531.title: "Drone $NAME_Geocorp$"
 extreme_frontiers.1531.desc: "Khi tín hiệu được kết nối, một đoạn nhạc cổ xưa vang lên, drone dịch vụ khách hàng tự động đã trực tuyến.\n\nKính chào quý khách, chúng tôi thấy quý khách đang tự ý sao chép Ma Trận Bức Xạ Địa Chất mẫu MKIII không bản quyền. Quý khách cần hỗ trợ gì không?"
 extreme_frontiers.1531.a: "Ngươi từ đâu chui ra vậy?"
 extreme_frontiers.1531.a.reply: "“Mọi giao dịch tại $NAME_Geocorp$ đều được tặng kèm một vệ tinh quỹ đạo theo dõi mức độ hài lòng của khách hàng từ xa, đảm bảo sản phẩm vận hành bình thường và giữ chân khách hàng trọn đời. Trữ lượng năng lượng nội bộ của chúng tôi có thể dùng trong nhiều thế kỷ.”"
 extreme_frontiers.1531.b: "Có thể gọi lãnh đạo của ngươi tới đây không?"
 extreme_frontiers.1531.b.reply: "“Rất tiếc, tất cả nhân viên hành chính của chúng tôi đều đã qua đời. Nhưng cam kết về sự hài lòng của khách hàng của chúng tôi có thể kéo dài gấp nhiều lần tuổi thọ sinh học.”"
 extreme_frontiers.1531.c: "Chúng tôi chỉ nhặt được mấy thứ đồng nát thôi."
 extreme_frontiers.1531.c.reply: "“Sự thiếu hiểu biết không nằm trong danh sách các lý do hợp lệ. Các điều khoản sử dụng Ma Trận Bức Xạ Địa Chất MKIII đã được trình bày chi tiết khi mua hàng.”"
 extreme_frontiers.1531.d: "Chúng tôi muốn gia hạn đăng ký."
 extreme_frontiers.1531.d.reply: "“Thật vinh hạnh, chỉ cần nhận được 3000 §Ynăng lượng tệ§! phí quản lý, chúng tôi sẽ sớm ký kết văn bản. Sau khi tiền được chuyển tới, chúng tôi sẽ coi như sự việc đã được giải quyết và rút lui.”"
 extreme_frontiers.1531.e: "Chúng tôi sẽ không mua thiết bị này đâu."
 extreme_frontiers.1531.e.reply: "“Vậy là quý khách định ăn cắp sao? Vậy thì vấn đề đơn giản rồi, các biện pháp chống trộm của chúng tôi rất chết chóc. Hy vọng quý khách cũng cân nhắc sử dụng dịch vụ tang lễ của chúng tôi.”"
 extreme_frontiers.1531.f: "Thanh toán"
 extreme_frontiers.1531.f.reply: "“Cảm ơn quý khách đã gia hạn giấy phép sử dụng Ma Trận Bức Xạ Địa Chất MKIII. Hy vọng quý khách có thể tận dụng tối đa giá trị của nó giống như cách chúng tôi thu lợi nhuận từ việc này vậy.”\n\nSau khi thanh toán, chiếc drone này biến mất vào dải ngân hà vô tận."
 extreme_frontiers.1531.g: "Định tống tiền à. Cho nó biết tay."
 extreme_frontiers.1531.h: "Tạ ơn trời đất."
 extreme_frontiers.1531.i: "Chuẩn bị chiến đấu."
 extreme_frontiers.1534.title: "Drone $NAME_Geocorp$"
 extreme_frontiers.1534.desc: "Khi trận chiến tại §Y[fromfrom.solar_system.GetName]§! đi vào hồi kết, một thông điệp mới từ drone chăm sóc khách hàng hiển thị trên màn hình của chúng ta.\n\n“Chúng tôi nhận thấy quý khách có thái độ kháng cự đối với việc thực thi Thỏa thuận Cấp phép Người dùng cuối của chúng tôi. Do quý khách đã thể hiện sức mạnh quân sự áp đảo, chúng tôi nay chính thức từ bỏ quyền yêu cầu sở hữu trí tuệ đối với Ma Trận Bức Xạ Địa Chất MKIII. Hy vọng quý khách sẽ cảm thấy hạnh phúc trong quá trình sử dụng công nghệ mới này.”\n\nChiếc drone tự phát nổ, đồng thời cắt đứt liên kết liên lạc."
 extreme_frontiers.1534.a: "Tạ ơn trời đất."
 extreme_frontiers.1535.title: "Thay Đổi Điều Khoản"
 extreme_frontiers.1535.desc: "Sau khi xử lý xong drone chăm sóc khách hàng, giờ chúng ta có thể tiếp tục công việc đảo ngược kỹ thuật Ma Trận Bức Xạ Địa Chất này."
 extreme_frontiers.1535.a: "Tiếp tục nghiên cứu thiết bị."
 GEORADIATION_ANALYSIS_PROJECT_CONTINUED: "$GEORADIATION_ANALYSIS_PROJECT$"
 GEORADIATION_ANALYSIS_PROJECT_CONTINUED_DESC: "$GEORADIATION_ANALYSIS_PROJECT_DESC$"
 extreme_frontiers.1540.title: "Thiết Bị Chưa Kích Nổ"
 extreme_frontiers.1540.desc.industrialist: "Thông qua hiệu suất làm việc miệt mài cấp độ doanh nhân, chúng ta đã thiết kế lại Ma Trận Bức Xạ Địa Chất MKIII, cải tiến phương thức vận hành để tạo ra lợi nhuận tối đa."
 extreme_frontiers.1540.desc.default: "Thông qua công tác nghiên cứu chuyên sâu, chúng ta đã có thể thiết kế lại Ma Trận Bức Xạ Địa Chất MKIII, mở khóa toàn bộ tiềm năng của nó bằng cách cải tiến quy trình."
 extreme_frontiers.1540.desc.common: "Bằng cách tích hợp công nghệ làm mất ổn định phân tử phóng xạ vào thiết bị cải tạo môi trường, giờ đây chúng ta có thể kích thích sự tăng trưởng của các tài nguyên giá trị cao."
 extreme_frontiers.1540.a: "Tin tốt đây."
 tech_georadiation_terraforming: "Cải Tạo Môi Trường Bằng Bức Xạ Địa Chất"
 tech_georadiation_terraforming_desc: "Bằng cách tác động quá trình phân rã bức xạ phân tử lên quần xã sinh vật của một hành tinh, chúng ta có thể thúc đẩy sự tăng trưởng của các tài nguyên cụ thể trong quá trình biến toàn bộ hành tinh thành một vùng hoang mạc độc hại."
 tech_georadiation_terraforming_tt: "Mở khóa §YQuyết định hành tinh§! §H$decision_toxify_world$§!"
 extreme_frontiers.1545.title: "Thiết Bị Bị Phá Hủy"
 extreme_frontiers.1545.desc: "Chúng ta đã tháo dỡ thành công thiết bị trên §Y[from.GetName]§!, thu hồi mọi vật liệu có thể tái sử dụng.\n\nCùng với việc thiết bị này bị phá hủy, tiền thân của nó cũng bị tiêu diệt, bí mật về loại công nghệ mang tính hủy diệt này đã vĩnh viễn biến mất khỏi ngân hà."
 extreme_frontiers.1545.a.default: "Tạ ơn trời đất."
 decision_toxify_world: "Độc Hóa Hành Tinh"
 decision_toxify_world_desc: "Bằng cách tác động quá trình phân rã bức xạ phân tử lên quần xã sinh vật của một hành tinh, chúng ta có thể thúc đẩy sự tăng trưởng của các tài nguyên cụ thể, đồng thời biến toàn bộ hành tinh thành một vùng hoang mạc độc hại."
 decision_toxify_world_tt: "Bắt đầu cục diện: §HĐộc hóa hành tinh§!\n— Biến hành tinh này thành §YHành tinh độc hại§! chứa trữ lượng [this.GetToxifiedResourcesText]"
