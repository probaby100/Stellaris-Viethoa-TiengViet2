 extreme_frontiers.2005.title: "Tài Nguyên Độc Hại"
 extreme_frontiers.2005.desc.common: "Lần đầu tiên thực hiện §YCải tạo môi trường bằng bức xạ địa chất§! trên §Y[target.GetName]§! đã hoàn tất.\n\nBề mặt bị thoái hóa thành hoang mạc độc hại không thể cư ngụ, nhờ vào sự cải tiến trong thiết kế ma trận bức xạ địa chất, chúng ta đã chiết xuất được một lượng tài nguyên khổng lồ."
 extreme_frontiers.2005.desc.industrialist: "Cột mốc này đánh dấu sự bắt đầu của một kỷ nguyên khai thác và sinh lời mới cho quốc gia chúng ta."
 extreme_frontiers.2005.a.default: "Tuyệt vời."
