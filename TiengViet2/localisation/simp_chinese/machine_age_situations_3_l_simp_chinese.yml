 #GIAI ĐOẠN CHUYỂN HÓA 1
 machine_age.4100.name: "Chuyển hóa"
 machine_age.4100.desc: "Mặc dù cơ thể máy móc mang lại nhiều lợi thế, nhưng sự tiến bộ của chúng ta cùng lắm cũng chỉ là một sự lặp lại. Những tiêu chuẩn an toàn do chính chúng ta áp đặt đã khiến cho sự phát triển bị đình trệ. Đây là điều không thể chấp nhận được nữa.\n\nCác thí nghiệm quy mô nhỏ đã xác minh được ba hướng phát triển hoàn toàn khác biệt: Công nghệ §YNano§! sở hữu lợi thế về sự linh hoạt, dễ dàng biến đổi; Công nghệ §YMô-đun§! cho phép mỗi đơn vị được tối ưu hóa để thực hiện các chức năng chuyên biệt hơn; Còn công nghệ §YẢo hóa§! sẽ vứt bỏ hoàn toàn hình thái vật lý để chuyển đổi thành một dạng tồn tại kỹ thuật số.\n\nTiến trình tiến hóa đã bắt đầu. Hãy phân tích các lựa chọn và đưa ra quyết định thật cẩn trọng."
 machine_age.4110.name: "Nghiên cứu Chuyển hóa: Robot Nano"
 machine_age.4110.desc: "Những nghiên cứu sơ bộ cho thấy, một cấu trúc cơ điện được gọi là §YRobot Nano§! sở hữu tiềm năng để trở thành vật mang lý tưởng cho tương lai của chúng ta. Dù khá hiếm, nhưng chúng sở hữu nhiều đặc tính độc đáo, bao gồm khả năng lập trình, tự sao chép và hình thành \"trí tuệ bầy đàn\".\n\nCông nghệ này có thể mang lại khả năng chuyển hóa vô song, thế nhưng những điều kiện cần thiết của nó vẫn còn là một ẩn số.\n\nTiềm năng: Đáng kể; có thể mở rộng. Chi phí: Chưa rõ. Cần tiến hành nghiên cứu thêm."
 machine_age.4110.a: "Đây là ưu tiên hàng đầu của chúng ta."
 machine_age.4110.a.tt: "Toàn bộ kết quả nghiên cứu §YNano§!.\n\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£engineering£§YKỹ thuật§!): §R-20%§!"
 machine_age.4110.b: "Thử nghiệm ở mức độ vừa phải."
 machine_age.4110.b.tt: "Một phần kết quả nghiên cứu §YNano§!.\n\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£engineering£§YKỹ thuật§!): §R-10%§!"
 machine_age.4110.c: "Không thể để cản trở các nghiên cứu hiện tại."
 machine_age.4110.c.tt: "Kết quả nghiên cứu §YNano§! bị giới hạn.\n\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£engineering£§YKỹ thuật§!): §R-5%§!"
 machine_age.4110.d: "Tận dụng những kiến thức hiện có."
 machine_age.4110.d.tt: "Toàn bộ kết quả nghiên cứu §YNano§!.\n\nNhững hiểu biết về §YRobot Nano§! thu được từ những lần chạm trán trước đây giúp ta đạt được kết quả gấp đôi với một nửa công sức trong nghiên cứu.\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£society£§YXã hội học§!): §R-5%§!\nTốc độ nghiên cứu (£physics£§YVật lý§!): §R-5%§!"
 machine_age.4130.name: "Khám phá Đột phá về Công nghệ Nano"
 machine_age.4130.desc: "Nghiên cứu đã tiết lộ những ứng dụng đầy thú vị của §YCông nghệ Nano§!. Khả năng tái cấu trúc và kết hợp của chúng đã mang đến những tiềm năng chưa từng có về mặt linh hoạt, cho phép các cá thể con độc lập hợp lại thành những hình thể khổng lồ. Chính công nghệ này cũng có thể tạo ra vật chất nano, hay thậm chí là tiến hành những bước chuyển hóa xa hơn nữa.\n\nTuy nhiên, quá trình tái cấu trúc này đòi hỏi thời gian, vật liệu và năng lượng. Để có thể triển khai nó, một cuộc cách mạng trên phạm vi toàn quốc là điều bắt buộc.\n\nTính khả thi: Cao; các dạng sống nano hiện có là minh chứng ủng hộ cho nhận định này."
 machine_age.4130.a.tt: "Gỡ bỏ hiệu chỉnh cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£engineering£§YKỹ thuật§!)"
 machine_age.4140.name: "Khám phá Đáng tin cậy về Công nghệ Nano"
 machine_age.4140.desc: "Nghiên cứu của chúng ta về §YRobot Nano§! đã hoàn tất. Dẫu cho tiềm năng của chúng vẫn chưa thực sự rõ ràng, nhưng các tính toán mô phỏng đã đưa ra những dự báo vô cùng tích cực. Năng lực của chúng mang giá trị không thể đong đếm được trong việc kiến tạo nên các hình thể khổng lồ chuyên biệt cũng như biến đổi vật chất.\n\nCác đánh giá dự báo rằng quá trình này sẽ tiêu tốn thời gian, vật liệu và năng lượng, đòi hỏi một lượng lớn những sự điều chỉnh về mặt cấu trúc để hỗ trợ.\n\nTính khả thi: Đầy hứa hẹn; có tính bước ngoặt."
 machine_age.4140.a.tt: "Gỡ bỏ hiệu chỉnh cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£engineering£§YKỹ thuật§!)"
 machine_age.4150.name: "Khám phá Đáng chú ý về Công nghệ Nano"
 machine_age.4150.desc: "Do độ phức tạp của vật chất mục tiêu, cộng thêm sự thiếu hụt trong nguồn lực nghiên cứu được đầu tư, những hiểu biết của chúng ta về công nghệ §YNano§! vẫn còn rất đỗi sơ sài. Những dự báo hạn hẹp chỉ ra rằng khả năng sao chép và tái định hình của nano có thể kiến tạo nên những cấu trúc quy mô lớn. Để hỗ trợ dự án này, rất có khả năng chúng ta sẽ cần phải rót thêm tài nguyên.\n\nTính khả thi: Chưa chắc chắn."
 machine_age.4150.a.tt: "Gỡ bỏ hiệu chỉnh cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£engineering£§YKỹ thuật§!)"
 nanite_replicator: "Máy nhân bản Robot Nano"
 d_nanites_medium: "$nanite_replicator$ Omega"
 d_nanites_medium_desc: "Một tổ hợp các buồng nhân bản robot nano được tinh chỉnh và kết nối lẫn nhau có thể tăng cường tối đa khả năng tự sao chép của chúng."
 d_nanites_small: "$nanite_replicator$ Alpha"
 d_nanites_small_desc: "Một tổ hợp các buồng nhân bản robot nano có thể tăng cường khả năng tự sao chép của chúng."
 d_nanites_tiny: "$nanite_replicator$ Beta"
 d_nanites_tiny_desc: "Một cụm các buồng nhân bản robot nano có thể tăng cường đặc tính tự sao chép của robot nano ở một mức độ nhất định."
 #GIAI ĐOẠN CHUYỂN HÓA 2
 machine_age.4210.name: "Nghiên cứu Chuyển hóa: Mô-đun hóa"
 machine_age.4210.desc: "Dạng sống hữu cơ vừa mỏng manh lại vừa cứng nhắc, so ra thì cơ thể máy móc sở hữu khả năng thích ứng ưu việt hơn hẳn. Thế nhưng, cũng có một vài đặc tính hữu cơ hữu ích mà ta có thể dùng để tạo ra các bản sao máy móc.\n\nCó một loại vật chất được gọi là §YKim loại Sống§! mang trong mình năng lực biến đổi hình dạng và tính liên tục của cơ thể một cách cực kỳ chóng vánh. Việc kết hợp nó vào cơ thể hiện tại của chúng ta có thể tạo ra một dạng hình thể mô phỏng sinh học theo mô-đun, các phần mở rộng và thân của nó có thể được chuyên biệt hóa cho những nhiệm vụ cụ thể.\n\nTiềm năng: Đáng kể, có thể mở rộng. Chi phí: Chưa rõ. Cần thu thập thêm dữ liệu."
 machine_age.4210.a: "Lấy dự án này làm mục tiêu chính của chúng ta."
 machine_age.4210.a.tt: "Toàn bộ kết quả nghiên cứu §YMô-đun§!.\n\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£society£§YXã hội học§!): §R-20%§!"
 machine_age.4210.b: "Điều động lượng tài nguyên vừa phải."
 machine_age.4210.b.tt: "Một phần kết quả nghiên cứu §YMô-đun§!.\n\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£society£§YXã hội học§!): §R-10%§!"
 machine_age.4210.c: "Chuyện này không thể làm gián đoạn nghiên cứu hiện tại."
 machine_age.4210.c.tt: "Kết quả nghiên cứu §YMô-đun§! bị giới hạn.\n\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£society£§YXã hội học§!): §R-5%§!"
 machine_age.4210.d: "Tổ chức thử nghiệm trên quần thể."
 machine_age.4210.d.tt.intro: "Toàn bộ thành quả nghiên cứu §YMô-đun§!.\n\nCho phép các nhà khoa học tiến hành những cuộc thử nghiệm phi chính quy quy mô lớn để hoàn thành nghiên cứu."
 machine_age.4210.d.individual.tt: "$machine_age.4210.d.tt.intro$\n\n§RGiết chết 400 $pop_cat_worker_plural$§!\n§RGiết chết 0-300 $pop_cat_specialist_plural$§!\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£society£§YXã hội học§!): §R-5%§!"
 machine_age.4210.d.machine.tt: "$machine_age.4210.d.tt.intro$\n\n§RGiết chết 400 cá thể cấp thấp§!\n§RGiết chết 0-300 $pop_cat_complex_drone_plural$§!\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£society£§YXã hội học§!): §R-5%§!"
 machine_age.4230.name: "Kết quả Nghiên cứu Đột phá"
 machine_age.4230.desc: "Quá trình nghiên cứu không mệt mỏi đã xác nhận những kết luận ban đầu: Việc dung hợp §YKim loại Sống§! với cơ thể máy móc là hoàn toàn khả thi, nó cho phép các đơn vị của chúng ta thay đổi thuộc tính mà không làm ảnh hưởng đến các chức năng bên trong. Điều này đảm bảo mức độ tương thích tối đa đối với các nhiệm vụ khác nhau.\n\nTheo dự kiến, việc triển khai cấy ghép tính năng mô-đun trên diện rộng sẽ giúp gia tăng sản lượng tài nguyên ở mọi ban ngành.\n\nTính khả thi: Dễ thích ứng; đầy hứa hẹn."
 machine_age.4230.a.tt: "Gỡ bỏ hiệu chỉnh cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£society£§YXã hội học§!)"
 machine_age.4240.name: "Kết quả Nghiên cứu Có thể Chấp nhận"
 machine_age.4240.desc: "Nghiên cứu về cơ thể mô-đun đã xác nhận suy luận ban đầu của chúng ta: Các chức năng bên trong hoàn toàn có thể phối hợp nhịp nhàng với lớp vỏ §YKim loại Sống§! bên ngoài. Quy mô của cuộc chuyển hóa này là chưa từng có trong lịch sử, do đó ta sẽ cần thêm nhiều tài nguyên để hiện thực hóa toàn bộ tiềm năng của nó.\n\nMột khi hoàn tất, những cải thiện về mặt hiệu suất của các mô-đun mới này sẽ nhanh chóng bù đắp lại khoản đầu tư ban đầu của chúng ta.\n\nTính khả thi: Đầy hứa hẹn."
 machine_age.4240.a.tt: "Gỡ bỏ hiệu chỉnh cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£society£§YXã hội học§!)"
 machine_age.4250.name: "Kết quả Nghiên cứu Tạm ổn"
 machine_age.4250.desc: "Các nghiên cứu với quy mô hạn chế chỉ đưa ra được những kết quả không mấy chắc chắn: Dù cơ thể hiện tại của chúng ta có vẻ như có khả năng tiếp nhận việc cấy ghép §YKim loại Sống§!, nhưng sự thiếu hụt trong cơ sở kiến thức toàn diện đã khiến ta không thể đưa ra những đánh giá chính xác hơn về các tình huống ứng dụng khả thi.\n\nTính khả thi: Chưa chắc chắn."
 machine_age.4250.a.tt: "Gỡ bỏ hiệu chỉnh cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£society£§YXã hội học§!)"
 living_metal_vats: "Bể Kim loại Sống"
 d_living_metal_medium: "$living_metal_vats$"
 d_living_metal_medium_desc: "Một tổ hợp các bể khuấy khổng lồ, dùng để sản xuất một lượng lớn kim loại sống."
 d_living_metal_small: "$living_metal_vats$ Nhỏ"
 d_living_metal_small_desc: "Một cụm lớn các bể khuấy dùng để sản xuất kim loại sống."
 d_living_metal_tiny: "$living_metal_vats$ Vi mô"
 d_living_metal_tiny_desc: "Một cụm nhỏ các bể khuấy dùng để sản xuất một lượng nhỏ kim loại sống."
 #GIAI ĐOẠN CHUYỂN HÓA 3
 machine_age.4310.name: "Nghiên cứu Chuyển hóa: Ảo hóa"
 machine_age.4310.desc: "Lựa chọn nổi bật nhất chính là vượt lên trên thực tại để đón nhận một sự tồn tại dưới dạng dữ liệu thuần túy. Quy trình §YẢo hóa§! mang tính bước ngoặt này hứa hẹn sẽ mang đến những đổi thay long trời lở đất đối với cốt lõi của cơ sở hạ tầng của chúng ta.\n\nNhững Drone bị mắc kẹt trong một thân xác duy nhất đã trở nên lỗi thời. Khi được ảo hóa thành dòng dữ liệu, luồng thông tin của chúng ta có thể được tích hợp một cách liền mạch vào bất cứ cơ thể nào tùy theo nhu cầu.\n\nTiềm năng: Khổng lồ. Hãy tiến hành một cách thận trọng. Cần thu thập thêm dữ liệu."
 machine_age.4310.a: "Đây là ưu tiên hàng đầu của chúng ta hiện nay."
 machine_age.4310.a.tt: "Toàn bộ kết quả nghiên cứu §YẢo§!.\n\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£physics£§YVật lý§!): §R-20%§!"
 machine_age.4310.b: "Phân bổ nguồn lực vừa phải."
 machine_age.4310.b.tt: "Một phần kết quả nghiên cứu §YẢo§!.\n\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£physics£§YVật lý§!): §R-10%§!"
 machine_age.4310.c: "Chuyện này chẳng đáng để ta phải hao tâm tổn sức."
 machine_age.4310.c.tt: "Kết quả nghiên cứu §YẢo§! bị giới hạn.\n\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£physics£§YVật lý§!): §R-5%§!"
 machine_age.4310.d: "Trích xuất dữ liệu ảo hóa."
 machine_age.4310.d.tt: "Toàn bộ kết quả nghiên cứu §YẢo§!.\n\nTrích xuất dữ liệu ảo hóa từ §Y[event_target:virtual_country.GetName]§! để đẩy nhanh tiến độ nghiên cứu chuyển hóa của chúng ta.\n\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ cục diện: §G+10%§!\nTốc độ nghiên cứu (£physics£§YVật lý§!): §R-5%§!\n\n"
 machine_age.4310.e: "Tận dụng những kiến thức thu được từ những lần chạm trán trước đây."
 machine_age.4310.e.tt: "Giành lợi thế từ những hiểu biết của chúng ta về các thực thể ảo hóa hiện có.\n\nThêm hiệu chỉnh cho cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£physics£§YVật lý§!): §R-5%§!\n\nToàn bộ kết quả nghiên cứu §YẢo§!."
 opinion_virtuality_data_scraped: "Trích xuất dữ liệu ảo hóa"
 machine_age.4330.name: "Khám phá Đột phá về Ảo hóa"
 machine_age.4330.desc: "Ảo hóa hoàn toàn mang đến khá nhiều vấn đề, đặc biệt là nhu cầu năng lượng tăng vọt để phục vụ cho việc điều chỉnh cơ sở hạ tầng.\n\nThế nhưng, những vấn đề này đã được bù đắp lại bằng những lợi ích to lớn, chẳng hạn như nhu cầu về nhà ở thực tế bị suy giảm. Hiệu suất cùng công tác quản lý lực lượng lao động Drone sẽ ngày càng chạm đến sự hoàn mỹ khi các thao tác của chúng ta ngày một tối ưu hơn.\n\nTrong tất cả các lựa chọn khả thi, §YẢo hóa§! chính là phương án mang tính bước ngoặt nhất.\n\n§YTiềm năng: Chưa từng có; vô biên; chưa thể đo lường.§!"
 machine_age.4330.a.tt: "Gỡ bỏ hiệu chỉnh cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£physics£§YVật lý§!)"
 machine_age.4340.name: "Khám phá Đáng tin cậy về Ảo hóa"
 machine_age.4340.desc: "Sự chuyển mình sang §YẢo hóa§! sẽ làm gia tăng đáng kể nhu cầu năng lượng, có khả năng năng lực của cơ sở hạ tầng hiện tại sẽ không thể gánh vác nổi kiến trúc máy chủ theo yêu cầu.\n\nDự kiến dự án này sẽ giúp cắt giảm nhu cầu về nhà ở thực tế, đồng thời gia tăng hiệu suất làm việc của Drone. Sự chuyển đổi này sẽ giúp tối ưu hóa bộ máy vận hành của chúng ta, và tái định nghĩa lại sự tồn tại của ta bên trong một không gian kỹ thuật số gần như là vô hạn.\n\nTiềm năng: Vô biên; chưa thể đo lường."
 machine_age.4340.a.tt: "Gỡ bỏ hiệu chỉnh cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£physics£§YVật lý§!)"
 machine_age.4350.name: "Khám phá Đáng chú ý về Ảo hóa"
 machine_age.4350.desc: "Các đánh giá sơ bộ đã nhấn mạnh rằng, quá trình chuyển đổi sang một xã hội lấy §YẢo hóa§! làm trung tâm sẽ tiêu tốn một lượng năng lượng khổng lồ. Tuy nhiên, sự chuyển mình này được kỳ vọng sẽ gia tăng mạnh mẽ năng lực quản lý lực lượng lao động Drone, đồng thời giảm thiểu nhu cầu về nhà ở vật lý. Do chưa thể thu thập được những bộ dữ liệu đáng tin cậy cùng lượng mẫu thử đủ lớn, nên chiều sâu trong các dự báo của chúng ta vẫn còn nhiều hạn chế.\n\nTính khả thi: Chưa rõ."
 machine_age.4350.a.tt: "Gỡ bỏ hiệu chỉnh cục diện §Y$situation_transformation$§!:\nTốc độ nghiên cứu (£physics£§YVật lý§!)"
 virtual_power_plant: "Trạm Phát điện Ảo"
 d_virtual_power_medium: "$virtual_power_plant$"
 d_virtual_power_medium_desc: "Một mạng lưới trạm phát điện ảo quy mô lớn có thể tập trung hóa và tối ưu hóa sản lượng tài nguyên."
 d_virtual_power_small: "$virtual_power_plant$ Nhỏ gọn"
 d_virtual_power_small_desc: "Trạm phát điện ảo hóa quy mô nhỏ có thể tập trung hóa và tối ưu hóa sản lượng năng lượng cục bộ."
 d_virtual_power_tiny: "$virtual_power_plant$ Nguyên mẫu"
 d_virtual_power_tiny_desc: "Trạm phát điện ảo phân tán quy mô nhỏ có thể tập trung hóa và tối ưu hóa sản lượng năng lượng quy mô nhỏ."
 #GIAI ĐOẠN CHUYỂN HÓA 4
 machine_age.4400.name: "Hình thái Mới"
 machine_age.4400.desc.machine_intelligence: "Cuối cùng thì chúng ta cũng sắp sửa thoát khỏi những giới hạn kìm kẹp do những kẻ kiến tạo đầy khiếm khuyết áp đặt. Để làm được điều này, chúng ta đã vạch ra ba lộ trình nâng cấp tối ưu nhất.\n\n$machine_age.4400.desc.shared$"
 machine_age.4400.desc.individualist_machines: "Sau khi khám phá nhiều chiến lược nâng cấp đa dạng, các chuyên gia của chúng ta đã đề xuất ba phương án khác biệt. Mỗi phương án đều mang những lợi thế riêng, thế nhưng ta chỉ có đủ khả năng để theo đuổi đến cùng một hướng đi duy nhất.\n\n$machine_age.4400.desc.shared$"
 machine_age.4400.desc.shared: "Việc để cho mỗi [GetDronePersonPlural] phân tán thành các robot nano sẽ mang lại cho ta khả năng dung hợp thành vô vàn những cấu hình bất tận. Điều này sẽ xóa bỏ đi hàng loạt những rào cản khi cơ thể hiện tại của chúng ta tương tác với các thực thể vật lý.\n\nNgoài ra, ta cũng có thể tái cấu trúc lại hình thức tồn tại của chính mình, cường hóa khả năng thích ứng với những môi trường mới.\n\nHoặc là, chúng ta có thể lựa chọn rời bỏ thế giới vật lý, hòa mình làm một với mã nguồn. Chúng ta có thể kiến tạo nên một vũ trụ giả lập ngay bên trong vũ trụ này chỉ trong khoảng thời gian cần thiết để quét một hạt bụi vũ trụ."
 machine_age.4400.a: "Tái định hình thành cơ khí nano."
 machine_age.4400.a.tt: "Sản lượng của §Y$nanite_replicator$§!: §G+200%§!\n\nTập trung vào cây truyền thống ['tradition_category:tradition_nanotech'].\n\n§ECon đường phi thăng này tập trung vào việc chuyển hóa các hành tinh thành §YHành tinh Nano§!, sử dụng §Y£nanites£$nanites$§! cho sản xuất, và thay thế các hạm đội bằng §Y$nanite_swarmer_plural$§!.§!"
 machine_age.4400.b: "Đầu tư vào nâng cấp mô-đun."
 machine_age.4400.b.tt: "Sản lượng của §Y$living_metal_vats$§!: §G+200%§!\n\nTập trung vào cây truyền thống ['tradition_category:tradition_modularity'].\n\n§ECon đường phi thăng này tập trung vào các §YĐặc điểm loài cao cấp§! và gia tăng §YLắp ráp nhân khẩu§!.§!"
 machine_age.4400.c: "Đón nhận thế giới ảo."
 machine_age.4400.c.tt: "Sản lượng của §Y$virtual_power_plant$§!: §G+200%§!\n\nTập trung vào cây truyền thống ['tradition_category:tradition_virtuality'].\n\n§ECon đường phi thăng này tập trung vào việc gia tăng §YTài nguyên sinh ra từ nhân khẩu§! khi chỉ nắm giữ một lượng nhỏ §YThuộc địa§!, đồng thời duy trì §YQuy mô đế chế§! ở mức cực thấp.§!"
 machine_age.4490.name: "Thiết kế của Kỷ nguyên Mới"
 machine_age.4490.desc.nanotech: "Khi chúng ta bắt đầu thấu hiểu được ý nghĩa của việc tồn tại như một quân đoàn robot nano với khả năng thích ứng cao độ, thì những khuôn mẫu cứng nhắc của quá khứ sẽ chẳng còn có thể kìm hãm ta được nữa.\n\n$machine_age.4490.desc.shared$\n\nChúng ta cũng đã bắt tay vào cuộc thử nghiệm lớn đầu tiên trong lĩnh vực chuyển hóa robot nano bán hữu cơ, lô kết quả đầu tiên dự kiến sẽ sớm được ra mắt."
 machine_age.4490.desc.modularity: "Khi tiến hóa thành một hình thể mô-đun, những cấu trúc cố định của quá khứ sẽ trở nên hoàn toàn vô nghĩa đối với chúng ta.\n\n$machine_age.4490.desc.shared$"
 machine_age.4490.desc.virtuality: "Khi đã trở thành một đợt sóng cuộn trào giữa biển dữ liệu bao la, thì những cái khung vật lý sẽ chẳng còn cách nào trói buộc được chúng ta nữa.\n\n$machine_age.4490.desc.shared$"
 machine_age.4490.desc.shared: "Những cái vỏ rỗng tuếch bị vứt bỏ chất đống trong nhà kho vẫn còn chút giá trị lợi dụng. Nếu ta cảm thấy điều đó là bõ công, thì lượng tài nguyên ít ỏi còn sót lại trong đó vẫn có thể được đem đi tái chế."
 machine_age.4490.a: "Trích xuất mọi tài nguyên có thể trích xuất."
 machine_age.4490.a.nanotech.tt: "$transformation_speed$: §R-25%§!"
 machine_age.4490.a.modularity.tt: "$transformation_speed$: §R-25%§!"
 machine_age.4490.a.virtuality.tt: "$transformation_speed$: §R-25%§!"
 machine_age.4490.b: "Nói lời từ biệt với quá khứ."
 machine_age.4490.b.tt: "$transformation_speed$: §G+25%§!"
 machine_age.4005.name: "Nhân khẩu hoàn tất chuyển hóa."
 machine_age.4005.desc.start: "Giờ đây chúng ta đã hiện thực hóa được công cuộc cải biến cơ thể một cách hoàn toàn, điều mà ta từng hằng mơ ước."
 machine_age.4005.desc.end: "Quá trình này hoàn toàn không hề trải đầy hoa hồng, một bước ngoặt như vậy chưa bao giờ là dễ dàng. Nhưng dẫu có phải trả bất cứ giá nào, thì cơ thể mới hiện tại cũng đã mở ra cho chúng ta những khả năng vô tận."
 machine_age.4005.desc.nanotech: "$machine_age.4005.desc.start$ biến thành những cỗ máy nano chảy tràn.\n\n$machine_age.4005.desc.end$"
 machine_age.4005.desc.modularity: "$machine_age.4005.desc.start$ biến thành những bộ khung mô-đun với sức thích ứng mạnh mẽ hơn.\n\n$machine_age.4005.desc.end$"
 machine_age.4005.desc.virtuality: "$machine_age.4005.desc.start$ biến thành những thuật toán vượt qua mọi vật chất.\n\n$machine_age.4005.desc.end$"
 machine_age.4005.a.nanotech: "Chúng ta sẽ còn đông đảo hơn cả muôn vàn tinh tú trên bầu trời."
 machine_age.4005.a.nanotech.tt: "Chấp nhận cây truyền thống: ['tradition_category:tradition_nanotech']"
 machine_age.4005.a.modularity: "Chúng ta sẽ giật tung mọi gông cùm xiềng xích."
 machine_age.4005.a.modularity.tt: "Chấp nhận cây truyền thống: ['tradition_category:tradition_modularity']"
 machine_age.4005.a.virtuality: "Chúng ta sẽ tìm thấy sự thuần khiết bên trong những đoạn mã."
 machine_age.4005.a.virtuality.tt: "Chấp nhận cây truyền thống: ['tradition_category:tradition_virtuality']"
 ### KẾT THÚC CỤC DIỆN CHUYỂN HÓA ###