 situation_transformation: "Chuyển hóa"
 situation_transformation_type: "Cục diện Phi thăng"
 situation_transformation_desc: "Sự lặp lại thụ động của các cơ thể máy móc đã đạt đến một kết luận tất yếu và hợp lý. Một kỷ nguyên chuyển mình được khơi dậy từ sự đổi mới, được thúc đẩy bởi các cơ hội sắp sửa bắt đầu."
 situation_transformation_monthly_change_tooltip: "Cơ thể của chúng ta đang chuẩn bị cho công cuộc cải tạo."
 situation_transformation_outcome: "Nhân khẩu máy móc hoàn tất chuyển hóa."
 stage_transformation_effects: "Chúng ta phải đánh giá kết quả, đồng thời thực thi những quy trình tối ưu nhất để tự cải tạo bản thân."
