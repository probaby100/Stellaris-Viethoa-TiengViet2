 #Events
 seek_friends_tt: "Chúng ta mong muốn xây dựng một mối quan hệ hữu nghị với §Y[contact_empire.GetName]§!."
 seek_enemies_tt: "Chúng ta cần phải đề phòng sự thù địch từ §Y[contact_empire.GetName]§!, sự phát triển của mạng lưới tình báo của chúng ta tại lãnh thổ của họ tăng thêm §G+33%§!."
 seek_enemies_tt_short: "Chúng ta nên chuẩn bị sẵn sàng để đối phó với những hành động thù địch từ §Y[contact_empire.GetName]§!."
 seek_isolation_tt: "Chúng ta phải tìm cách giữ khoảng cách với §Y[contact_empire.GetName]§!, sự phát triển của mạng lưới tình báo của họ trong lãnh thổ chúng ta giảm §R-33%§!."
 seek_isolation_tt_short: "Chúng ta nên tìm cách duy trì khoảng cách với §Y[contact_empire.GetName]§!."
 friendship_already_precluded: "[contact_empire.GetPrecludedFriendshipCause]"
 friendship_already_precluded_hostile: "Vì chúng ta đã có những hành động thù địch với §Y[contact_empire.GetName]§!, tốt nhất là đừng có giả vờ giả vịt nữa."
 friendship_already_precluded_slave_origins: "Chẳng có tình bạn nào với những kẻ từng là chủ nô cả."
 action.1.fe_option: "§Y[contact_empire.GetName]§! hoàn toàn không bận tâm đến các chiến lược ngoại giao của chúng ta."
 hostile_first_contact_tt: "Đây sẽ bị coi là một hành động §Rthù địch§!."
 action.1.desc_hacking_01: "Các người đã xâm nhập trái phép vào hệ thống của chúng tôi, rồi bây giờ lại mở miệng ra gọi chúng tôi là bạn bè? Nực cười! Chúng tôi, [contact_empire.GetName], sẽ luôn đề cao cảnh giác với giống loài của các người."
 action.1.desc_hacking_02: "Hệ thống xử lý của chúng tôi đã ghi nhận những nỗ lực xâm nhập bất hợp pháp từ mạng lưới của các người. Chúng tôi đã tiến hành nâng cấp tường lửa để gia tăng khả năng đối phó với những mối đe dọa trong tương lai. [contact_empire.GetGovernmentName] sẽ luôn giữ thái độ cảnh giác đối với thực thể có tên là \"[Root.GetName]\"."
 action.1.desc_hacking_03: "Đừng có tự lừa dối mình về hành vi đánh cắp thông tin của chúng tôi nữa, [Root.GetSpeciesName], [contact_empire.GetGovernmentName] đã biết tỏng mọi chuyện rồi! Chúng tôi đã dành một phần ý thức để theo dõi sát sao mọi động thái đáng ngờ của các người trong tương lai."
 action.1.desc_hostile_01: "Sự thù địch của các người đã quá rõ ràng rồi, [Root.GetSpeciesName]. [contact_empire.GetRulerTitle] của chúng tôi muốn các người hiểu rằng, chúng tôi sẽ không bao giờ khuất phục trước những lời đe dọa từ các người."
 action.1.desc_hostile_02: "Tại sao lại phải giữ thái độ thù địch như vậy, [Root.GetSpeciesName]? Chúng tôi hoàn toàn không phải là mối đe dọa đối với các người!"
 action.1.desc_hostile_03: "Phát hiện nền văn minh trí tuệ cấp ba có thái độ thù địch, định danh là \"[Root.GetName]\".\n\nKích hoạt giao thức phòng thủ, hạm đội máy bay không người lái của Hải quân đang trên đường tới. Xin hãy chấm dứt ngay những hành động thù địch trước khi mọi chuyện trở nên quá muộn. Nếu vẫn ngoan cố không chịu thay đổi, chúng tôi buộc phải tiêu diệt các người."
 action.1.desc_hostile_04: "Chúng tôi là [contact_empire.GetName], lên tiếng với các người với tư cách là một khối thống nhất. Ý thức tổ ong đã ghi nhận những hành vi thù địch trước đây của các người. Vì vậy, chúng tôi đã liệt các người vào danh sách mối đe dọa. Nếu các người tiếp tục cư xử như kẻ thù, chúng tôi sẽ buộc phải loại bỏ các người vĩnh viễn khỏi tầm mắt."
 action.1.desc_hostile_05: "[Root.GetSpeciesName], những biểu hiện thù địch của các người khiến chúng tôi cảm thấy vô cùng quan ngại. Chúng tôi chỉ có thể cho rằng lũ [Root.GetSpeciesNamePluralInsult] điên rồ các người đang nóng lòng muốn chuốc lấy thất bại trước [contact_empire.GetSpeciesName] cao quý của chúng tôi."
 action.1.desc_hostile_06: "[contact_empire.GetName] đang dõi theo các người, cả hành tinh của chúng tôi đồng lòng. Thái độ thù địch của các người thực sự đáng báo động, do đó, chúng tôi coi các người là một mối đe dọa tiềm tàng. Hãy nhớ rằng: chúng tôi có thể khoan dung, nhưng tuyệt đối không bao giờ yếu đuối. Nếu các người không biết điểm dừng, chúng tôi sẽ không ngần ngại ra tay."
 action.1.desc_they_hostile_01: "[Root.GetSpeciesName], chúng tôi nhận định rằng giống loài của các người là một mối đe dọa vô cùng to lớn đối với chúng tôi. Trừ phi các người chứng minh được sự vô hại của mình, bằng không, cuộc tấn công trước đó chỉ là màn dạo đầu cho những cuộc đụng độ khốc liệt giữa hai nền văn minh chúng ta mà thôi."
 action.1.desc_they_hostile_02: "Thuật toán đánh giá mối đe dọa của chúng tôi đã tính toán và kết luận rằng những rủi ro do nền văn minh của các người mang lại cho [Root.GetName] là không thể chấp nhận được. Nếu không có biện pháp nhằm giảm thiểu rủi ro này, chúng tôi sẽ tự mình tiến hành thanh trừng các người."
 action.1.desc_they_hostile_03: "[Root.GetSpeciesName], sự hiện diện của các người là một mối nguy hại nghiêm trọng đối với [contact_empire.GetGestaltEntityName]. Chúng tôi đã bắt tay vào việc xây dựng các kế hoạch dự phòng nhằm triệt tiêu rủi ro do các người gây ra. Nếu điều này vẫn chưa đủ, chắc chắn sẽ có những hành động quyết liệt hơn được triển khai."
 action.1.desc_vivisection_01: "[Root.GetSpeciesName], chúng tôi sẽ không bao giờ ngừng chiến đấu cho đến khi rửa sạch mối hận này, vì những [contact_empire.GetSpeciesNamePlural] đã phải bỏ mạng một cách đau đớn trên bàn phẫu thuật của các người!"
 action.1.desc_vivisection_02: "Chúng tôi hy vọng các người không mang dã tâm, [Root.GetSpeciesNamePlural], nhưng hãy hiểu rằng chúng tôi không thể dễ dàng bỏ qua những hành vi tàn bạo, phi nhân tính mà các người đã thực hiện lên đồng bào của chúng tôi ngay trên bàn mổ. Các người đã chuốc lấy sự khinh bỉ vĩnh viễn từ chúng tôi, đừng cố gắng thách thức giới hạn chịu đựng của chúng tôi thêm nữa!"
 action.1.desc_vivisection_03: "$action.1.desc_hungry_03$"
 action.1.desc_vivisection_04: "Đối với [contact_empire.GetName], việc mất đi vài cá thể không phải là tổn thất quá lớn lao, thế nhưng sự chuẩn bị của các người cho việc sử dụng bạo lực đã quá rõ ràng. Chúng tôi sẽ không tiếp tục dung thứ cho những hành động như vậy nữa."
 action.1.desc_they_vivisect_01: "Chúng tôi đã thu thập được một lượng dữ liệu đáng kể về cấu trúc giải phẫu nội tạng của các người, [Root.GetSpeciesNamePlural]. Có thể nói, chúng tôi đã hiểu rõ các người đến từng chân tơ kẽ tóc."
 action.1.desc_they_vivisect_02: "Chúng tôi đã phân tích được một lượng lớn dữ liệu về cơ chế hoạt động của mạch điện và bộ xử lý bên trong các người, [Root.GetSpeciesNamePlural]. Chúng tôi đã hoàn toàn nắm bắt được cấu tạo của các người."
 action.1.desc_hungry_01: "Chúng tôi không phải là thức ăn của các người, [Root.GetSpeciesNamePlural]. Thay mặt cho [contact_empire.GetName], tôi chính thức đưa ra cảnh báo: mọi hành vi xâm phạm trong tương lai từ phía các người sẽ phải gánh chịu sự giáng trả quyết liệt nhất từ chúng tôi."
 action.1.desc_hungry_02: "Chúng tôi không phải là thức ăn của các người, [Root.GetSpeciesNamePlural]. [contact_empire.GetSpeciesNamePlural] chúng tôi luôn yêu chuộng hòa bình, nhưng chúng tôi sẽ không bao giờ nương tay khi cần phải tự vệ."
 action.1.desc_hungry_03: "Tại sao các người lại tháo dỡ chúng tôi, [Root.GetSpeciesNamePlural]? Những cá thể này của chúng tôi đâu có bị hỏng hóc gì."
 action.1.desc_hungry_04: "Khuyên các người hãy từ bỏ ý định đó đi, hãy thử sờ lên những chiếc [Root.GetSpeciesToothNamePlural] của mình xem có đủ sức để nhai được chúng tôi không, [Root.GetSpeciesName]! Xin nói rõ cho các người biết, [contact_empire.GetSpeciesNamePlural] chúng tôi sẽ chiến đấu đến cùng và quyết không đầu hàng dù chỉ còn một hòn đá."
 action.1.desc_hungry_05: "Ăn thịt các cá thể của chúng tôi là một sự lãng phí, [Root.GetSpeciesNamePlural]. Chúng không được tạo ra cho mục đích đó, và chúng tôi kịch liệt yêu cầu các người hãy chấm dứt ngay hành động này."
 action.1.desc_they_hungry_01: "Trông các người có vẻ ngon miệng đấy, [Root.GetSpeciesNamePlural]. Chẳng bao lâu nữa, các người sẽ được vinh hạnh trở thành một trong những món chính cho các cá thể của chúng tôi."
 action.1.desc_they_hungry_02: "Những vật liệu thu được từ việc tháo dỡ và nung chảy các máy bay không người lái của các người có giá trị vô cùng to lớn. Chúng tôi dự đoán rằng, xưởng đúc của chúng tôi sẽ sớm ngập tràn các linh kiện của [Root.GetAdj]."
 action.1.desc_hostile_to_homicidal_01: "Sự thù địch của các người chỉ là cái cớ để chúng tôi quét sạch các người khỏi thiên hà này thôi, bọn cặn bã ngoài hành tinh."
 action.1.desc_hostile_to_homicidal_02: "Phát hiện sâu bọ hữu cơ.\n\nTargetList.SwapToTailAndRemoveFromGalaxy( \"[Root.GetName]\" );"
 action.1.desc_hostile_to_homicidal_03: "Tại sao lại tấn công chúng tôi, những kẻ mang tên \"[Root.GetName]\"? Các người không nằm trong danh sách mục tiêu cơ mà."
 action.1.desc_hostile_to_homicidal_04: "Các người cứ việc xông lên đi, [Root.GetSpeciesNamePlural], nhưng sự phản kháng đó chỉ là vô ích: các người rốt cuộc cũng chỉ là con mồi của chúng tôi."
 action.1.desc_hostile_to_homicidal_05: "Thật đáng tiếc cho sự thù địch của các người. Chúng tôi đã từng nghĩ đến việc tha thứ cho các người như với [Root.GetSpeciesNamePlural], nhưng có vẻ như các người cần được... giáo dục lại."
 first_contact_start_title: "$first_contact.1.name$"
 first_contact.1.name: "Cuộc chạm trán tại [This.System.GetName]"
 first_contact.1.desc.base: "Chúng ta đã thiết lập thành công Lần tiếp xúc đầu tiên với những người ngoài hành tinh bí ẩn ở hệ sao §H[This.System.GetName]§!. Kể từ bây giờ, cho đến khi có thêm thông tin chi tiết, chúng ta sẽ tạm gọi họ là §H[This.ContactCountry.GetName]§!."
 first_contact.1.desc.default: "$first_contact.1.desc.base$ Nếu họ có ngôn ngữ riêng, chúng ta phải giải mã nó mới có thể giao tiếp được."
 first_contact.1.desc.xenophobe: "$first_contact.1.desc.base$ Nếu họ có ngôn ngữ, chúng ta phải giải mã nó để có thể đánh giá mức độ đe dọa của họ."
 first_contact.1.desc.terminator: "Chúng ta đã thiết lập thành công Lần tiếp xúc đầu tiên với những người ngoài hành tinh vô danh ở hệ sao §H[This.System.GetName]§!. Chúng ta phải nhanh chóng xác định xem họ có phải là sinh vật hữu cơ hay không, để có thể đưa chúng vào lịch trình hủy diệt càng sớm càng tốt. Từ nay trở đi, chúng ta sẽ tạm gọi họ là §H[This.ContactCountry.GetName]§!."
 first_contact.1.desc.devourer: "Chúng ta đã thiết lập thành công Lần tiếp xúc đầu tiên với những người ngoài hành tinh bí ẩn ở hệ sao §H[This.System.GetName]§!. Chúng ta cần thu thập thêm thông tin về họ để xác định xem liệu họ có thể là một nguồn dinh dưỡng dồi dào cho các cá thể của chúng ta hay không. Từ nay trở đi, họ sẽ được gọi là §H[This.ContactCountry.GetName]§!."
 first_contact.1.desc.purifier: "Chúng ta đã thiết lập thành công Lần tiếp xúc đầu tiên với những người ngoài hành tinh bí ẩn ở hệ sao §H[This.System.GetName]§!. Chúng ta cần thu thập thêm thông tin về họ để xác định xem liệu họ có phải là mục tiêu thanh lọc tiếp theo của chúng ta hay không. Từ nay trở đi, họ sẽ được gọi là §H[This.ContactCountry.GetName]§!."
 first_contact.1.desc.hive: "Chúng ta đã thiết lập thành công Lần tiếp xúc đầu tiên với những người ngoài hành tinh bí ẩn ở hệ sao §H[This.System.GetName]§!. Chúng ta cần tìm hiểu xem liệu họ có thể giao tiếp với chúng ta hay không, và nếu có, liệu chúng ta có nên dành một phần nỗ lực của mình để giải mã ngôn ngữ của họ hay không. Từ nay trở đi, họ sẽ được gọi là §H[This.ContactCountry.GetName]§!."
 first_contact.1.desc.wilderness: "Chúng ta đã thiết lập Lần tiếp xúc đầu tiên thành công với các dạng sống mới ở hệ sao §H[This.System.GetName]§!. Chúng ta nên tìm hiểu xem liệu họ có thể giao tiếp với chúng ta hay không. Nếu có, có lẽ chúng ta nên xuất hiện dưới một hình thức nhỏ bé hơn của bản ngã - ví dụ như một hiện thân chẳng hạn.\n\nCho đến khi hiểu rõ hơn về họ, họ sẽ được gọi là §H[This.ContactCountry.GetName]§!."
 first_contact.1.desc.machine: "Chúng ta đã thiết lập thành công Lần tiếp xúc đầu tiên với những người ngoài hành tinh bí ẩn ở hệ sao §H[This.System.GetName]§!. Chúng ta cần tìm hiểu xem liệu họ có thể giao tiếp với chúng ta hay không, và nếu có, liệu chúng ta có nên sử dụng thuật toán dịch thuật của mình để giải mã ngôn ngữ của họ hay không. Từ nay trở đi, họ sẽ được gọi là §H[This.ContactCountry.GetName]§!."
 first_contact.5.name: "Lữ khách Không gian Bí ẩn"
 first_contact.5.desc: "Dù chúng ta chưa thu thập được nhiều thông tin tình báo từ con tàu vũ trụ bí ẩn ở hệ sao §H[This.System.GetName]§!, nhưng giả thuyết khả thi nhất hiện nay - dựa trên hành vi của nó và những mô hình ẩn chứa trong các tín hiệu chưa được giải mã mà nó phát ra - là con tàu này thuộc về một §Hnền văn minh vũ trụ§! chưa từng được biết đến. Chúng ta đang dốc toàn lực để giải mã ngôn ngữ của họ, với hy vọng có thể thiết lập giao tiếp càng sớm càng tốt."
 first_contact.5.A: "Tiếp tục điều tra!"
 first_contact.10.name: "Lữ khách Không gian Bí ẩn"
 first_contact.10.desc.base: "Có vẻ như cái gọi là §H[This.ContactCountry.GetName]§! thuộc về một §Hnền văn minh vũ trụ§! vô danh. Tuy chúng ta chưa biết họ đến từ vùng không gian nào, nhưng những hành động của họ cho thấy rõ đây là hoạt động của một dạng sống thông minh: một trong những con tàu của họ đã quét hệ sao của chúng ta một cách có hệ thống, rõ ràng là muốn tìm hiểu thêm về chúng ta."
 first_contact.10.desc.proactive: "$first_contact.10.desc.base$"
 first_contact.10.desc.cautious: "$first_contact.10.desc.base$ Chúng ta đang thực hiện mọi biện pháp phòng ngừa có thể để ngăn chặn họ đánh cắp bất kỳ thông tin nhạy cảm nào."
 first_contact.10.desc.attack_allowed: "$first_contact.10.desc.base$ Rất nhiều [This.Owner.GetSpeciesNamePlural] đang tỏ ra vô cùng lo ngại về diễn biến hiện tại, và yêu cầu chúng ta phải §Hbắt giữ§! những con tàu xâm nhập trái phép này. Bằng cách đó, chúng ta có thể §Hthẩm vấn§! chúng mà không sợ những thông tin nhạy cảm rơi vào tay họ."
 first_contact.10.desc.attack_allowed.gestalt: "$first_contact.10.desc.base$ Các máy bay chiến đấu trinh sát của chúng ta đã sẵn sàng hành động bất cứ lúc nào để bắt giữ những con tàu này và §Hthẩm vấn§! - hoặc giải phẫu - những người ngoài hành tinh trên đó, tránh để những thông tin nhạy cảm lọt vào tay chúng."
 first_contact.10.A: "Không có gì phải lo lắng cả, mọi chuyện vẫn ổn."
 first_contact.10.B: "Tùy ý khai hỏa!"
 first_contact.10.B.tooltip: "§RChúng ta sẽ cố gắng vô hiệu hóa và chiếm đoạt tàu của chúng. Chúng chắc chắn sẽ vô cùng tức giận trước hành động này của chúng ta.§!"
 first_contact.15.name: "Khám phá Nền văn minh Vũ trụ"
 first_contact.15.desc: "Không mất quá nhiều thời gian để chúng ta nhận ra rằng cái gọi là §H[This.ContactCountry.GetName]§! thực chất là một phần của một §Hnền văn minh vũ trụ§! rộng lớn. Các tàu thăm dò của chúng ta tại hệ sao §H[known_planet.System.GetName]§! đã phát hiện vô số phi thuyền không gian bay qua bay lại trên [known_planet.GetPlanetBioInfo], với một lượng lớn cư dân sinh sống trên đó, và hệ sao này chứa đầy các trạm không gian đủ mọi thể loại. Chúng ta cũng đã chặn được một lượng lớn tín hiệu liên lạc, nhưng hiện tại vẫn chưa tìm ra cách để dịch chúng một cách chính xác."
 first_contact.15.desc.no_planets: "Không mất quá nhiều thời gian để chúng ta nhận ra rằng cái gọi là §H[This.ContactCountry.GetName]§! thực chất là một phần của một §Hnền văn minh vũ trụ§! rộng lớn. Các tàu thăm dò của chúng ta tại hệ sao §H[known_system.GetName]§! đã phát hiện rất nhiều phi thuyền không gian bay qua bay lại giữa vô số các trạm không gian trong hệ sao. Ngoài ra, còn có một trạm không gian quân sự quy mô lớn đang xoay quanh ngôi sao, và nó có vẻ như đóng vai trò tương tự như các tiền đồn mà chúng ta dùng để tuyên bố chủ quyền tại các hệ sao. Chúng ta cũng đã chặn được một lượng lớn tín hiệu liên lạc, nhưng hiện tại vẫn chưa tìm ra cách để dịch chúng một cách chính xác."
 first_contact.15.A: "$first_contact.5.A$"
 first_contact.15.B: "Hãy tìm cách bắt vài người ngoài hành tinh về để điều tra kỹ hơn."
 first_contact.20.name: "Phát Hiện Tàu Ark Phiêu Bạt"
 first_contact.20.desc.base: "Có vẻ như cái gọi là §H[This.ContactCountry.GetName]§! thuộc về một §Hnền văn minh du mục§! chưa từng được biết đến trước đây. Họ không định cư trên các hành tinh như chúng ta, mà du hành trong không gian trên những con tàu Ark khổng lồ, và có ít nhất một con tàu Ark như vậy đang nằm trong phạm vi quét của chúng ta. Cho đến nay, tín hiệu truyền phát của họ vẫn chưa được dịch thuật."
 first_contact.20.desc.proactive: "$first_contact.20.desc.base$"
 first_contact.20.desc.cautious: "$first_contact.20.desc.base$Chúng ta đang nỗ lực thiết lập liên lạc đồng thời hết sức thận trọng nhằm tránh rò rỉ các thông tin nhạy cảm."
 first_contact.20.desc.attack_allowed: "$first_contact.20.desc.base$$first_contact.nomadic_escorts.attack_allowed.end$"
 first_contact.20.desc.attack_allowed.gestalt: "$first_contact.20.desc.base$$first_contact.nomadic_escorts.attack_allowed.gestalt.end$"
 first_contact.nomadic_escorts.attack_allowed.end: "Tàu Ark của họ đang nằm trong tầm cảm biến của chúng ta, đi kèm vài tàu hỗ trợ cỡ nhỏ. Nhiều [This.Owner.GetSpeciesNamePlural] cho rằng chúng ta nên chớp lấy cơ hội này để đoạt lấy một chiếc."
 first_contact.nomadic_escorts.attack_allowed.gestalt.end: "Tàu Ark của họ đang nằm trong tầm cảm biến của chúng ta, đi kèm vài tàu hỗ trợ cỡ nhỏ. Lực lượng quân sự của chúng ta đã sẵn sàng nghênh chiến, có thể đánh chặn và bắt giữ khi các tàu hộ tống vẫn còn trong tầm đánh chặn."
 first_contact.20.A: "Những người bạn đồng hành lang bạt."
 first_contact.25.name: "Phát Hiện Tàu Ark Phiêu Bạt"
 first_contact.25.desc.base: "Cái gọi là §H[This.ContactCountry.GetName]§! dường như trực thuộc một §Hnền văn minh liên sao§! chưa từng được biết đến trước đây. Bất thường ở chỗ, họ dường như không có hành tinh quê nhà cố định mà hoàn toàn sinh sống và du hành trên vài chiến hạm khổng lồ — chúng ta tạm thời phân loại chúng là §Htàu Ark§!. Có ít nhất một tàu như vậy đang nằm trong tầm cảm biến của chúng ta. Tín hiệu liên lạc của họ vẫn chưa được giải mã, nhưng các [This.Owner.GetLinguists] của chúng ta đang nỗ lực thay đổi điều này."
 first_contact.25.desc.proactive: "$first_contact.25.desc.base$"
 first_contact.25.desc.cautious: "$first_contact.25.desc.base$Chúng ta đang áp dụng mọi biện pháp phòng ngừa nhằm ngăn họ thu thập bất kỳ thông tin nhạy cảm nào về chúng ta trong khi nỗ lực thiết lập liên lạc."
 first_contact.25.desc.attack_allowed: "$first_contact.25.desc.base$$first_contact.nomadic_escorts.attack_allowed.end$"
 first_contact.25.desc.attack_allowed.gestalt: "$first_contact.25.desc.base$$first_contact.nomadic_escorts.attack_allowed.gestalt.end$"
 first_contact.25.A: "Quả là khác thường."
 first_contact.50.name: "Những Người Ngoài Hành Tinh Khó Nắm Bắt"
 first_contact.50.desc: "Chúng ta đã cố gắng thu thập thông tin về §H[This.ContactCountry.GetName]§!, nhưng cho đến nay mọi nỗ lực đều trở nên vô ích. Chúng ta dễ dàng nhận ra rằng họ rõ ràng thuộc về một nền văn minh ngoài hành tinh cực kỳ tiên tiến, nhưng ngoài điều đó ra thì chúng ta §Hchẳng biết gì thêm§!. Có vẻ như họ đã nỗ lực rất lớn để ngăn chặn chúng ta hoặc bất kỳ kẻ nghe lén nào khác có thể đánh cắp tín hiệu của họ.\n\nCho đến nay, chúng ta chỉ mới thu thập được một phần rất nhỏ trong ngôn ngữ của họ. Tuy nhiên, dựa trên những thông tin tình báo hiện có, [This.Owner.GetLinguists] của chúng ta tin chắc rằng, nếu có thể thu thập được một lượng lớn dữ liệu ngôn ngữ của họ, việc §Hgiải mã§! thông tin liên lạc của đối phương sẽ không còn là một trở ngại quá lớn."
 first_contact.50.A.cautious: "Chúng rất thông minh, hãy cẩn thận."
 first_contact.50.A.proactive: "Chúng ta nên tiếp tục nỗ lực."
 first_contact.50.desc.aggressive: "$first_contact.50.desc$ Một đề xuất thu thập thông tin táo bạo hơn - đó là §Hhack§! - đã được đưa ra. Tuy nhiên, nếu bị phát hiện, chắc chắn chúng sẽ không để yên chuyện này đâu."
 first_contact.50.B: "Quá mạo hiểm."
 first_contact.50.B.machine: "Giao thức đánh giá ước tính mức độ rủi ro không thể chấp nhận được."
 first_contact.50.C: "Nguy hiểm của sự thiếu hiểu biết còn tồi tệ hơn nhiều."
 first_contact.50.C1: "Chúng ta phải tìm hiểu cho ra nhẽ."
 first_contact.50.C.machine: "Kích hoạt giao thức lật đổ."
 first_contact.50.C.tooltip: "§RChúng ta sẽ cố gắng hack vào cơ sở dữ liệu của chúng để tìm kiếm thêm thông tin tình báo. Nếu hành động này bị phát hiện, chúng chắc chắn sẽ không bỏ qua dễ dàng đâu.§!"
 first_contact.60.name: "Nhận được tín hiệu liên lạc"
 #Communicating with default empires
 first_contact.60.desc.default: "§H[This.ContactCountry.GetName]§! có vẻ rất muốn thiết lập liên lạc với chúng ta, họ đã gửi cho chúng ta một khối lượng lớn §Hdữ liệu liên lạc§! bằng hình ảnh và âm thanh, có lẽ đây chính là chìa khóa để giải mã ngôn ngữ của họ."
 first_contact.60.desc.default.default: "$first_contact.60.desc.default$\n\n$first_contact.60.desc.x.default.end$"
 first_contact.60.desc.default.hive: "$first_contact.60.desc.default$\n\nChỉ cần chuyển đống dữ liệu này cho các cá thể ngôn ngữ của chúng ta, chẳng mấy chốc chúng ta sẽ có thể giao tiếp được với họ. Đương nhiên, chúng ta phải đặt niềm tin vào sự chính xác của bản dịch do họ cung cấp, để đảm bảo chúng ta có thể nắm bắt thông tin một cách chính xác nhất."
 first_contact.60.desc.default.wilderness: "$first_contact.60.desc.hive$\n\nBởi vì chúng ta đã nắm bắt được cấu trúc của các giai điệu và hợp âm mà họ sử dụng để truyền tải suy nghĩ, khả năng giao tiếp với các dạng sống này là hoàn toàn có thể. Giờ đây, trọng trách giải mã những thông điệp mà họ muốn truyền tải được đặt lên vai chúng ta."
 first_contact.60.desc.default.machine: "$first_contact.60.desc.default$\n\nChỉ cần đưa những dữ liệu này vào chương trình dịch thuật của chúng ta, chúng ta sẽ sớm có thể giao tiếp với họ. Tuy nhiên, chúng ta cần phải tin tưởng rằng bản dịch mà họ cung cấp đủ chính xác để chúng ta có thể hiểu đúng ý họ."
 #Communicating with Hive empires
 first_contact.60.desc.hive: "Rõ ràng §H[This.ContactCountry.GetName]§! đang rất khao khát được kết nối với chúng ta. Đối phương đã gửi một lượng dữ liệu khổng lồ, dường như một phần trong đó chứa đựng một §Hthông điệp§! (vẫn chưa được giải mã), phần còn lại là một mã khóa chứa rất nhiều §Hthông tin§! nghe nhìn - nhằm hỗ trợ chúng ta trong việc dịch thuật thông điệp này."
 first_contact.60.desc.hive.default: "$first_contact.60.desc.hive$\n\n$first_contact.60.desc.x.default.end$"
 first_contact.60.desc.hive.wilderness: "$first_contact.60.desc.hive$\n\nVì những âm điệu thể hiện trong thông điệp của họ có vẻ cộng hưởng với ý thức của chúng ta, khả năng giao tiếp với các dạng sống này là rất cao. Giờ đây, nhiệm vụ khó khăn nhất của chúng ta là phải đảm bảo không hiểu sai những dòng suy nghĩ của họ."
 first_contact.60.desc.hive.machine: "$first_contact.60.desc.hive$\n\n$first_contact.60.desc.x.machine.end$"
 #Communicating with Machine empires
 first_contact.60.desc.machine: "Rõ ràng là §H[This.ContactCountry.GetName]§! đang rất mong muốn được liên lạc với chúng ta. Họ đã gửi đến một khối lượng dữ liệu khổng lồ, có vẻ như một phần của dữ liệu này chứa đựng một §Hthông điệp§! (hiện vẫn chưa được giải mã), trong khi phần còn lại là mã khóa chứa đầy §Hthông tin§! hình ảnh và âm thanh - được dùng để khớp với ngữ cảnh của thông điệp này."
 first_contact.60.desc.machine.default: "$first_contact.60.desc.machine$\n\nCác chuyên gia của chúng ta vẫn chưa thể khẳng định chắc chắn liệu chúng ta đang cố gắng giao tiếp với những sinh vật có cảm xúc hay đang phải đối phó với một §Htrí tuệ nhân tạo đang mất kiểm soát§!. Họ khẳng định rằng, câu trả lời sẽ được hé lộ ngay khi chúng ta có thể trích xuất những dữ liệu có giá trị từ các tín hiệu mà đối phương truyền tới."
 first_contact.60.desc.machine.hive: "$first_contact.60.desc.machine$\n\n$first_contact.60.desc.x.machine.end$"
 first_contact.60.desc.machine.wilderness: "$first_contact.60.desc.hive$\n\nKhả năng có thể giao tiếp với những dạng sống này là rất cao, bởi tính nhất quán trong thông điệp của chúng mang lại cảm giác tương đối quen thuộc với ý thức của chúng ta. Tuy nhiên, một số phần trong trí thông minh này vẫn còn rất xa lạ. Trách nhiệm đảm bảo không hiểu sai những dòng suy nghĩ bề ngoài của chúng đã đặt lên vai chúng ta."
 #Communicating with Wilderness empires
 first_contact.60.desc.wilderness.default: "$first_contact.60.desc.default$\n\nSự khổng lồ và phức tạp của kiểu mã hóa hiển kiến này thực sự khiến người ta phải đau đầu. Chúng ta vẫn chưa thể giải mã được những ý nghĩa sâu xa ẩn giấu bên trong vô vàn các quá trình hữu cơ và sự phân hóa vi mô này. Nói cách khác, trừ phi những người ngoài hành tinh đó giúp chúng ta một tay bằng cách nào đó..."
 first_contact.60.desc.wilderness.hive: "$first_contact.60.desc.default$\n\nSự khổng lồ và phức tạp của kiểu mã hóa hiển kiến này cũng khiến người ta phải đau đầu. Nó phác họa nên vô số các quá trình hữu cơ đóng vai trò nền tảng cho quá trình tiến hóa của chính chúng ta, nhưng cú pháp logic ẩn sau những thông tin này vẫn còn là một ẩn số. Chúng ta sẽ tiếp tục tiến hành phân tích với một thái độ hoài nghi đầy thận trọng."
 first_contact.60.desc.wilderness.machine: "$first_contact.60.desc.default$\n\nSự bất thường của \"mã hóa\" này thực sự khiến người ta phải đau đầu. Thoạt nhìn, nó mô tả vô số các quá trình hữu cơ hoàn toàn xa lạ với chúng ta, nhưng khi so sánh với các quá trình ở quy mô hành tinh của chính chúng ta, thì lại không hẳn như vậy. $first_contact.60.desc.x.machine.end$"
 #Misc
 first_contact.60.desc.x.default.end: "Các chuyên gia của chúng ta tin chắc rằng chẳng bao lâu nữa chúng ta sẽ có thể giao tiếp với đối phương. Tất nhiên, chúng ta phải tin tưởng rằng bản dịch mà họ cung cấp đủ chính xác để không gây ra sự hiểu lầm... Sau đó, chúng ta mới có thể dựa vào những ngữ cảnh kinh nghiệm đa dạng để đưa ra bản dịch đáng tin cậy cho các thông điệp."
 first_contact.60.desc.x.machine.end: "Chúng ta đã bắt đầu đưa tín hiệu truyền tới này vào thuật toán dịch thuật của mình, và hy vọng sẽ sớm trích xuất đủ dữ liệu để bắt đầu giao tiếp với [This.ContactCountry.GetName]."
 first_contact.60.A.cautious: "Họ thật sự ngây thơ quá."
 first_contact.60.A.proactive: "Chúng ta rất cảm kích sự tin tưởng của họ."
 first_contact.100.name: "Thiết lập liên lạc"
 first_contact.100.desc: "Những nỗ lực giải mã tín hiệu thu được từ §H[This.ContactCountry.GetName]§! cuối cùng cũng mang lại kết quả, chúng ta đã đạt được một bước đột phá. Dù chưa thật sự thành thạo ngôn ngữ của họ, nhưng chúng ta vẫn xoay sở thành công trong việc mở ra một kênh ngoại giao với nền văn minh này, hiện tại họ được chính thức gọi là §H[This.ContactCountry.GetRealName]§!."
 first_contact.100.desc.homicidal: "Những nỗ lực giải mã tín hiệu thu được từ §H[This.ContactCountry.GetName]§! cuối cùng cũng đã đơm hoa kết trái, chúng ta đã đạt được một bước tiến quan trọng. Mặc dù vẫn chưa hoàn toàn nắm vững ngôn ngữ của họ, nhưng chúng ta đã xác định được nền văn minh này là §H[This.ContactCountry.GetRealName]§! và có thể giao tiếp với họ khi cần thiết."
 first_contact.101.name: "Họ là người [This.Owner.GetSpeciesNamePlural]!"
 first_contact.101.desc: "Khi bắt tay vào việc phiên dịch những thông điệp tiếp theo do những người tự xưng là §H[This.ContactCountry.GetName]§! gửi đến, chúng ta đã kinh ngạc phát hiện ra: ngôn ngữ họ sử dụng lại chính là một nhánh phương ngôn của chúng ta! Ngay khi sự ngỡ ngàng qua đi, chúng ta đã nhanh chóng thiết lập được liên lạc. Giờ đây, họ được chính thức biết đến với cái tên §H[This.ContactCountry.GetRealName]§!."
 first_contact.101.desc.2: "Trong lúc chuẩn bị tấn công [This.ContactCountry.GetName], chúng ta đã phát hiện ra một sự thật chấn động: họ lại chính là người [This.Owner.GetSpeciesNamePlural]! Ngay khi nhận ra họ đang nói một phương ngôn xa lạ của chúng ta, chúng ta đã lập tức hủy bỏ mọi hành động thù địch và nhanh chóng thiết lập liên lạc, qua đó biết được danh tính thực sự của họ là §H[This.ContactCountry.GetRealName]§!."
 first_contact.101.A: "Tuyệt vời - chúng ta đã tìm thấy những người anh em thất lạc của mình!"
 first_contact.101.B: "Hy vọng tình máu mủ sẽ dẫn lối cho tình hữu nghị giữa chúng ta."
 first_contact.101.C: "Có lẽ chúng ta nên tiếp tục tấn công họ..."
 first_contact.101.D: "Cùng huyết thống không có nghĩa là bạn bè. Hãy luôn giữ vững sự cảnh giác."
 first_contact.102.name: "[This.ContactCountry.GetName] đã được giải mã"
 first_contact.102.desc: "Khi chuyển đổi bộ xử lý để dịch các tín hiệu liên lạc thu được từ nhóm người ngoài hành tinh vô danh có mã danh là §H[This.ContactCountry.GetName]§!, chúng ta đã phát hiện ra một sự thật đáng kinh ngạc: họ cũng thuộc về một dạng trí tuệ máy móc! Mặc dù chương trình của họ khác biệt với chúng ta về nhiều mặt, và ngôn ngữ của họ được xây dựng trên nền tảng của vô số ngôn ngữ sinh vật hữu cơ khác nhau, nhưng lại chia sẻ những giả định hình thái học tương tự với ngôn ngữ của chúng ta. Do đó, chỉ trong nháy mắt, chúng ta đã giải mã được ngôn ngữ lập trình của họ và bắt đầu giao tiếp cơ bản. Hiện tại, họ được gọi chính thức là §H[This.ContactCountry.GetRealName]§!."
 first_contact.102.lostcolony.desc: "- Khi chúng ta chuyển đổi bộ xử lý để dịch các tín hiệu từ những người ngoài hành tinh vô danh — được chúng ta đặt cho bí danh là §H[This.ContactCountry.GetName]§! — chúng ta đã phát hiện ra một sự thật kinh hoàng: họ cũng thuộc về một dạng trí tuệ máy móc! Các giao thức liên lạc của họ cực kỳ giống với chúng ta, sự tương thích về phần mềm đã cho phép chúng ta nhanh chóng thiết lập liên lạc. Sự tương đồng này còn mở rộng sang các lĩnh vực khác, đến mức có thể nói rằng trí tuệ máy móc của chúng ta chính là một nhánh từ cơ sở mã nguồn của họ. Chỉ có một lời giải thích hợp lý duy nhất cho điều này."
 first_contact.102.A: "Đánh giá kết quả đã đầy đủ."
 first_contact.102.B: "Cập nhật nhiệm vụ: Đã phát hiện Máy chủ."
 first_contact.103.name: "Một Trí tuệ Tập thể"
 first_contact.103.desc.base: "Mọi nỗ lực giải mã tín hiệu thu được từ §H[This.ContactCountry.GetName]§! cuối cùng đã đơm hoa kết trái, và giờ đây chúng ta đã có thể mở kênh liên lạc ngoại giao với nền văn minh hiện mang tên §H[This.ContactCountry.GetRealName]§!."
 first_contact.103.desc: "$first_contact.103.desc.base$\n\nĐiều đáng chú ý là họ dường như hoàn toàn không có khái niệm về cá thể, một điều vốn rất tự nhiên đối với giống loài [This.Owner.GetSpeciesAdj] của chúng ta. Trên thực tế, mỗi cá thể [This.ContactCountry.GetAdj] \"[This.ContactCountry.GetIndividualName]\" đều không có ý chí tự do hay bất kỳ tư duy nào, họ chỉ đơn thuần là những quân cờ của §H\"[This.ContactCountry.GetGovernmentName]\"§!. Bọn họ bị kiểm soát chặt chẽ đến mức, [This.Owner.GetResearchers] của chúng ta suy đoán rằng sự tiến hóa của người [This.ContactCountry.GetSpeciesNamePlural] phụ thuộc hoàn toàn vào trí tuệ tập thể, thiếu đi nó, họ sẽ không thể sinh tồn."
 first_contact.103.A: "Chúng ta nên nghiên cứu họ - và áp dụng những gì học được từ họ cho chính những người công nhân của chúng ta!"
 first_contact.103.B: "Thật là một giống loài thú vị. Chúng ta phải tìm hiểu sâu hơn xem một giống loài như vậy rốt cuộc là như thế nào."
 first_contact.103.C1: "Chúng ta sẽ dọn dẹp sạch sẽ bọn chúng."
 first_contact.104.name: "Một Nền Văn minh Máy móc"
 first_contact.104.desc.base: "$first_contact.103.desc.base$\n\nĐiều đáng chú ý là họ là một nền văn minh robot hoàn toàn tự động, chịu sự chỉ huy của một trí tuệ nhân tạo duy nhất và vô cùng mạnh mẽ."
 first_contact.104.desc.terminator_or_default: "$first_contact.104.desc.base$ Chúng ta không tìm thấy bất kỳ dấu vết nào về những người sáng tạo ra họ. Chúng ta chỉ có thể đưa ra giả thiết rằng họ đã bị tiêu diệt sạch sẽ khi [This.ContactCountry.GetRealName] xảy ra khủng hoảng trí tuệ nhân tạo."
 first_contact.104.desc.terminator_or_default.wilderness: "$first_contact.103.desc.base$\n\nĐiều đáng chú ý là, những sinh vật này dường như là một phần của nền văn minh tổng hợp, được hình thành xoay quanh một trí tuệ máy móc phân tán. Ở tầng sâu nhất, bản chất ý thức của chúng không có gì quá khác biệt so với chúng ta." #use of '103.base' is intentional
 first_contact.104.desc.servitor: "$first_contact.104.desc.base$ Có vẻ như những cỗ máy này rất tận tâm trong việc cứu lấy mạng sống của những kẻ đã tạo ra chúng. Thực tế là [secondary_species.GetNamePlural] hiện đang được nuôi dưỡng chiều chuộng như những \"vật trưng bày sống\", họ sống trong những \"nơi trú ẩn hữu cơ\" được thiết kế đặc biệt, ở đó rõ ràng là họ chỉ cần làm những gì mình thích..."
 first_contact.104.desc.servitor.wilderness: "$first_contact.104.desc.base$ Sự khác biệt lớn nhất so với chúng ta là chúng giữ lại những sinh vật hữu cơ [secondary_species.GetNamePlural], và giam giữ họ trong những nơi trú ẩn đặc trưng. Những sinh vật này dường như là hậu duệ của những kẻ đã tạo ra chúng, được bao bọc che chở vì một lý do nào đó mà chúng ta không thể hiểu nổi."
 first_contact.104.desc.assimilator.regular: "$first_contact.104.desc.base$ Có vẻ như những cỗ máy này không hề muốn lãng phí tiềm năng của những kẻ đã tạo ra chúng, tức là [secondary_species.GetNamePlural]. Ngược lại, họ cấy ghép các bộ phận cơ thể giả vào những kẻ đó để đồng hóa họ vào trong cộng đồng của mình. Đáng lo ngại là [This.Owner.GetResearchers] của chúng ta không tìm thấy bất kỳ lý do nào để tin rằng những thiết bị cấy ghép này sẽ không có tác dụng đối với giống loài của chúng ta..."
 first_contact.104.desc.assimilator.hive: "$first_contact.104.desc.base$ Có vẻ như những cỗ máy này không hề muốn lãng phí tiềm năng của những kẻ đã tạo ra chúng, tức là [secondary_species.GetNamePlural]. Ngược lại, họ cấy ghép các bộ phận cơ thể giả vào những kẻ đó để đồng hóa họ vào trong cộng đồng của mình. May mắn thay, chúng ta tin rằng các cá thể của chúng ta sẽ không dễ dàng bị các thiết bị cấy ghép này kiểm soát."
 first_contact.104.desc.assimilator.wilderness: "$first_contact.104.desc.base$ Tuy nhiên, họ đã tìm ra một lý do nào đó để giữ lại một số bộ phận hữu cơ trong cấu trúc của mình: [secondary_species.GetNamePlural], ý thức nội tại của chúng dường như được bao trùm bởi tư duy của máy móc.\n\nMặc dù điều này sẽ tạo thành mối đe dọa đối với hầu hết các loài hữu cơ, nhưng chúng ta nghi ngờ rằng nếu đế chế của người máy muốn đồng hóa chúng ta, chúng sẽ nhận ra rằng các thể cộng sinh của chúng ta không đủ tiêu chuẩn để trở thành các cá thể."
 first_contact.104.A: "Chúng ta nên nghiên cứu chúng - biết đâu hệ thống tự động của chúng ta cũng có thể được nâng cấp!"
 first_contact.104.B1: "Thật đáng sợ. Chúng ta phải tìm cách tháo dỡ bọn chúng!"
 first_contact.104.B2: "Chúng ta nên phá hủy bọn chúng."
 first_contact.104.B3: "Biết đâu bọn chúng cũng ăn được..."
 first_contact.105.name: "Đã hiểu rõ về [This.ContactCountry.GetName]"
 first_contact.105.desc: "Công cuộc giải mã các tín hiệu thu được từ §H[This.ContactCountry.GetName]§! cuối cùng cũng đã mang lại kết quả, và chúng ta đã đạt được một bước tiến mang tính đột phá. Quá trình này đã được đẩy nhanh đáng kể nhờ một phát hiện then chốt - đối phương cũng được tổ chức dưới dạng một trí tuệ tập thể giống như chúng ta. Mặc dù các đặc điểm sinh học cũng như hệ tư tưởng [this.ContactCountry.GetHiveAuthority] của họ khác biệt rất lớn so với chúng ta, nhưng cấu trúc tư duy của những [this.ContactCountry.GetIndividualNamePlural] của họ rất có thể tương thích với chúng ta, và hoàn toàn có thể được tích hợp vào hệ thống của [This.Owner.GetGovernmentName]."
 first_contact.105.A: "Biết đâu đến một ngày nào đó, họ sẽ cân nhắc việc hòa nhập vào chúng ta."
 first_contact.200.name: "Khai thác dữ liệu thành công"
 first_contact.200.desc: "Chúng ta đã hack thành công vào hệ thống mạng của §H[This.ContactCountry.GetName]§! và giành được quyền truy cập vào cơ sở dữ liệu của họ trong một khoảng thời gian. Dù thời gian sử dụng quyền hạn này không kéo dài được bao lâu, chúng ta vẫn sao chép được một khối lượng lớn dữ liệu và hy vọng rằng - nó không chỉ giúp chúng ta giải mã ngôn ngữ của họ một cách nhanh chóng, mà còn hỗ trợ trong việc đánh giá trình độ công nghệ của đối phương."
 first_contact.205.name: "Thành công, nhưng phải trả giá"
 first_contact.205.desc: "Chúng ta đã hack thành công vào hệ thống mạng của §H[This.ContactCountry.GetName]§! và giành được quyền truy cập vào cơ sở dữ liệu của họ trong một khoảng thời gian. Sau đó, quyền hạn của chúng ta đột nhiên §Hbị cắt đứt§! - rõ ràng, hành vi hack của chúng ta đã bị bại lộ. Mặc dù thời gian sử dụng quyền hạn để thao tác không được bao lâu, chúng ta vẫn sao chép được một lượng lớn dữ liệu và hy vọng rằng - nó không chỉ giúp chúng ta nhanh chóng giải mã ngôn ngữ của đối phương, mà còn hỗ trợ đánh giá trình độ công nghệ của họ. Chúng ta chỉ có thể hy vọng rằng trò lừa đảo nhỏ này sẽ không khiến đối phương coi chúng ta là một kẻ thù nguy hiểm."
 first_contact.205.A: "Hy vọng mọi thứ xứng đáng với cái giá phải trả..."
 first_contact.206.name: "Hành vi xâm nhập bị phát hiện"
 first_contact.206.desc.normal: "Nhóm nghiên cứu về §H[From.Owner.GetName]§! của chúng ta đã gửi về một báo cáo đầy lo ngại: chúng đã cố gắng xâm nhập vào hệ thống máy tính của chúng ta, nhưng đã bị phát hiện! Thật không may, trước khi chúng ta kịp chặn quyền truy cập của chúng, chúng đã tiếp cận được một lượng lớn thông tin nhạy cảm. Hành động thù địch này đã làm dấy lên sự lo lắng sâu sắc của rất nhiều người ở [Root.Owner.GetName], họ tin rằng [From.Owner.GetName] có thể là một mối đe dọa tiềm tàng."
 first_contact.206.desc.hive: "Cá thể chịu trách nhiệm nghiên cứu về §H[From.Owner.GetName]§! của chúng ta đã báo cáo một tin tức đáng lo ngại: chúng đã cố tình đột nhập vào hệ thống máy tính của chúng ta, nhưng đã bị phát hiện! Thật không may, trước khi chúng ta có thể ngắt quyền hạn của chúng, chúng đã kịp tiếp cận được với một lượng lớn thông tin nhạy cảm. Chúng ta sẽ phải giám sát chúng thật chặt chẽ, để trong tương lai, bất kỳ hành động nào của chúng gây tổn hại đến [This.Owner.GetGovernmentName], chúng ta cũng có thể phát hiện ngay lập tức."
 first_contact.206.desc.machine: "Máy bay không người lái chịu trách nhiệm nghiên cứu về §H[From.Owner.GetName]§! của chúng ta đã báo cáo một tin tức đáng báo động: chúng đã cố gắng hack vào hệ thống máy tính của chúng ta, nhưng đã bị phát hiện! Thật đáng tiếc, trước khi chúng ta kịp thời cắt đứt quyền truy cập của chúng, chúng đã có cơ hội tiếp xúc với một khối lượng lớn thông tin nhạy cảm. Sự việc ngẫu nhiên này thúc giục chúng ta phải nhanh chóng cập nhật các giao thức phòng thủ cũng như tường lửa của hệ thống di động - đồng thời cũng đừng quên nâng cấp mức độ cảnh giác đối với [From.Owner.GetName]."
 first_contact.206.A: "Chúng ta cần phải hết sức cảnh giác với bọn chúng."
 first_contact.210.name: "Xâm nhập bị chặn đứng"
 first_contact.210.desc: "Nỗ lực xâm nhập vào mạng lưới của §H[This.ContactCountry.GetName]§! nhằm tìm kiếm thêm thông tin về chúng đã không mang lại kết quả. Đặc phái viên của [This.Owner.GetEnvoyCap] [This.Leader.GetName] cùng với đội ngũ nghiên cứu của [This.Leader.GetHerHis] đã nhanh chóng nhận ra rằng, hệ thống mà họ đang phải đối mặt quá đỗi tinh vi - hoặc cũng có thể là những kẻ giám sát của chúng quá nhạy bén - khiến việc tìm kiếm lỗ hổng bằng các biện pháp thông thường trở nên bất khả thi. Thật may mắn là [This.Leader.GetSheHe][This.Leader.GetWasWere] đã kịp thời §Hhủy bỏ§! nhiệm vụ xâm nhập trước khi bị đối phương phát hiện."
 first_contact.210.A: "Vậy thì, chúng ta đành phải dùng đến những biện pháp cứng rắn hơn thôi."
 first_contact.215.name: "Một pha xâm nhập tồi tệ"
 first_contact.215.desc: "Có vẻ như nỗ lực đột nhập vào mạng lưới của §H[This.ContactCountry.GetName]§! của chúng ta đã bị §Hphát hiện§!. Hiện tại vẫn chưa rõ sai sót nằm ở khâu nào, nhưng Đặc phái viên của [This.Owner.GetEnvoy] [This.Leader.GetName] cho biết hệ thống mà họ đối mặt thực sự quá tân tiến - hoặc cũng có thể do những người giám sát của họ quá nhạy bén - khiến họ không thể tìm ra kẽ hở nào bằng những biện pháp hiện có. Đáng tiếc thay, khi họ nhận ra điều này thì mọi chuyện đã quá muộn màng. Chúng ta chỉ biết hy vọng rằng trò lừa gạt nhỏ nhoi này sẽ không khiến chúng ta bị xem là một kẻ địch nguy hiểm..."
 first_contact.215.A: "Diễn biến sự việc thật đáng tiếc."
 first_contact.215.A.tooltip: "§H[This.ContactCountry.GetName]§! có ấn tượng đầu tiên rất tồi tệ về chúng ta."
 first_contact.216.name: "Ngăn chặn thành công nỗ lực xâm nhập"
 first_contact.216.desc.normal: "Nhóm nghiên cứu chịu trách nhiệm theo dõi §H[From.Owner.GetName]§! đã đưa ra báo cáo cảnh báo: chúng đã cố tình hack vào hệ thống máy tính của chúng ta, nhưng đã bị phát giác! Thật may mắn, chúng ta đã kịp thời ngăn chặn trước khi chúng có cơ hội tiếp cận bất kỳ thông tin nhạy cảm nào. Tuy nhiên, hành động mang tính thù địch này đã dấy lên mối lo ngại sâu sắc trong lòng nhiều người dân ở [Root.Owner.GetName] về những mối hiểm họa tiềm ẩn từ [From.Owner.GetName]."
 first_contact.216.desc.hive: "Các cá thể chuyên trách nghiên cứu về §H[From.Owner.GetName]§! của chúng ta đã đưa ra một báo cáo đáng lo ngại: chúng đã nỗ lực hack vào hệ thống máy tính của chúng ta, nhưng đã bị phát hiện! Thật may mắn, chúng ta đã có thể ngăn chặn chúng trước khi chúng kịp tiếp cận bất kỳ thông tin nhạy cảm nào. Chúng ta cần phải nâng cao cảnh giác với chúng, và đề phòng mọi động thái có thể gây hại cho [This.Owner.GetGovernmentName] của chúng trong tương lai."
 first_contact.216.desc.machine: "Các thiết bị không người lái chịu trách nhiệm nghiên cứu về §H[From.Owner.GetName]§! của chúng ta đã báo cáo một tin tức đáng lo ngại: chúng đã cố gắng đột nhập vào hệ thống máy tính của chúng ta, nhưng đã bị phát giác! Thật may mắn, chúng ta đã có thể chặn đứng chúng trước khi chúng kịp tiếp cận bất kỳ thông tin nhạy cảm nào. Sự kiện này là một lời nhắc nhở để chúng ta tiến hành nâng cấp các biện pháp phòng thủ và phần mềm điều khiển của các hệ thống di động, đồng thời nâng cao mức độ đánh giá mối đe dọa đối với [From.Owner.GetName]."
 first_contact.216.A: "$first_contact.206.A$"
 first_contact.220.name: "$first_contact.100.name$"
 first_contact.220.desc.base: "Việc bí mật xâm nhập vào hệ thống mạng của đối phương đã giúp [This.Owner.GetLinguists] thu thập được lượng lớn thông tin, tạo tiền đề cho việc dịch thuật ngôn ngữ mà §H[This.ContactCountry.GetName]§! đang sử dụng. Dù chưa thật sự thành thạo, chúng ta vẫn xoay sở để mở ra các kênh ngoại giao thành công với nền văn minh này, hiện tại được gọi chính thức là §H[This.ContactCountry.GetRealName]§!."
 first_contact.220.desc.homicidal.base: "Việc lén lút xâm nhập vào hệ thống mạng của đối phương đã mang về cho các [This.Owner.GetLinguists] của chúng ta đủ thông tin để biên dịch ngôn ngữ mà §H[This.ContactCountry.GetName]§! sử dụng. Mặc dù vẫn chưa hoàn toàn làm chủ được ngôn ngữ của họ, chúng ta đã kịp thời xác định được danh tính của nền văn minh này là §H[This.ContactCountry.GetRealName]§!, và có thể tiến hành trao đổi khi thực sự cần thiết."
 first_contact.220.desc.physics.base: "Chúng ta cũng đã tiến hành phân tích các dữ liệu công nghệ sao chép được từ phía họ, và bất ngờ khám phá ra những góc nhìn hoàn toàn mới về các vấn đề vật lý học mà các [This.Owner.GetResearchers] của chúng ta chưa từng nghĩ tới trước đây."
 first_contact.220.desc.society.base: "Chúng ta cũng đã phân tích những thông tin công nghệ sao chép từ họ, và bất ngờ khám phá ra một số giải pháp mới mẻ cho các vấn đề về quản lý tổ chức mà [This.Owner.GetResearchers] của chúng ta chưa từng nghĩ đến."
 first_contact.220.desc.engineering.base: "Chúng ta cũng đã tiến hành phân tích những dữ liệu khoa học kỹ thuật sao chép từ phía họ, và bất ngờ khám phá ra những giải pháp mới mẻ cho các vấn đề kỹ thuật mà các [This.Owner.GetResearchers] của chúng ta chưa từng hình dung tới trước đây."
 first_contact.220.desc.nothing.base: "Chúng ta cũng đã tiến hành phân tích các thông tin công nghệ được sao chép từ họ, nhưng kết quả thu lại chẳng có gì đáng chú ý. Các [This.Owner.GetResearchers] của chúng ta vô cùng tự tin khẳng định rằng, mặc dù họ có những phương pháp giải quyết vấn đề khác biệt, nhưng xét trên mọi phương diện, trình độ công nghệ của họ cũng chẳng hề vượt trội hơn chúng ta."
 first_contact.220.desc.physics: "$first_contact.220.desc.base$\n\n$first_contact.220.desc.physics.base$"
 first_contact.220.desc.society: "$first_contact.220.desc.base$\n\n$first_contact.220.desc.society.base$"
 first_contact.220.desc.engineering: "$first_contact.220.desc.base$\n\n$first_contact.220.desc.engineering.base$"
 first_contact.220.desc.nothing: "$first_contact.220.desc.base$\n\n$first_contact.220.desc.nothing.base$"
 first_contact.220.desc.homicidal.physics: "$first_contact.220.desc.homicidal.base$\n\n$first_contact.220.desc.physics.base$"
 first_contact.220.desc.homicidal.society: "$first_contact.220.desc.homicidal.base$\n\n$first_contact.220.desc.society.base$"
 first_contact.220.desc.homicidal.engineering: "$first_contact.220.desc.homicidal.base$\n\n$first_contact.220.desc.engineering.base$"
 first_contact.220.desc.homicidal.nothing: "$first_contact.220.desc.homicidal.base$\n\n$first_contact.220.desc.nothing.base$"
 first_contact.250.name: "Tịch thu Tàu Người Ngoài Hành Tinh!"
 first_contact.250.desc: "Sau một cuộc xung đột ngắn ngủi, chúng ta đã thành công với cái giá phải trả là một số ít thương vong, phi hành đoàn trên con tàu thám hiểm của §H[This.ContactCountry.GetName]§! - hiện tại chúng ta đã xác định được họ là giống loài [This.ContactCountry.Species.GetAAnSpeciesClass] §H[This.ContactCountry.Species.GetClass]§! - đã đầu hàng trước đội lính tiếp cận của chúng ta. Chúng ta đã giành quyền kiểm soát con tàu của họ, đồng thời bắt giữ phi hành đoàn làm con tin, và chuẩn bị tiến hành công tác §Hthẩm vấn§! cũng như nghiên cứu công nghệ của họ."
 first_contact.250.desc.multispecies: "Sau một cuộc chạm trán ngắn, chúng ta đã giữ mức thương vong ở mức tối thiểu, phi hành đoàn trên con tàu thám hiểm đến từ §H[This.ContactCountry.GetName]§! đã quy hàng trước lực lượng đổ bộ của chúng ta. Trên tàu có sự hiện diện của nhiều giống loài người ngoài hành tinh khác nhau, nhưng dường như chiếm đa số là §H[This.ContactCountry.Species.GetClassPlural]§!. Giờ đây, chúng ta đã tóm gọn cả người lẫn tàu, và có thể bắt đầu quá trình §Hthẩm vấn§! họ cũng như hy vọng khám phá được những bí mật công nghệ của họ."
 first_contact.250.desc.machine_victim: "Khi chúng ta đổ bộ lên con tàu thám hiểm của §H[This.ContactCountry.GetName]§!, cảnh tượng hiện ra trước mắt thật sự nằm ngoài dự đoán - toàn bộ phi hành đoàn đều là những thiết bị không người lái bằng máy móc, và dường như chúng đang bị một §Htrí tuệ nhân tạo mất kiểm soát§! thao túng! Sau một cuộc đọ súng ngắn ngủi, chúng ta đã thành công vô hiệu hóa một lượng lớn các thiết bị này, chỉ còn lại một số ít vẫn đang ngoan cố chống trả. Thật đáng kinh ngạc là chúng không hề kích hoạt quy trình tự hủy - có lẽ may mắn đã mỉm cười với chúng ta, khi chúng ta kịp thời cắt đứt tín hiệu liên lạc trước khi trí tuệ nhân tạo điều khiển chúng kịp phát lệnh tự hủy.\n\nGiờ đây, chúng ta đã giữ lại con tàu của chúng, cùng với các phi hành đoàn làm §Hcon tin§!, để có thể bắt tay vào việc nghiên cứu công nghệ của chúng, đồng thời kiểm tra xem những thiết bị không người lái này có mang theo bất kỳ thông tin nào hữu ích hay không."
 first_contact.250.desc.hive_victim: "Sau một cuộc chạm trán ngắn ngủi, phe ta chỉ phải gánh chịu thiệt hại tối thiểu với vài người thương vong, chúng ta đã thành công trong việc trấn áp phi hành đoàn trên tàu thám hiểm của §H[This.ContactCountry.GetName]§! và ép buộc họ phải quy hàng. Những người ngoài hành tinh §H[This.ContactCountry.Species.GetClass]§! này đã thể hiện khả năng phối hợp tác chiến cực kỳ ăn ý - hệt như thể họ đang bị thao túng bởi cùng một bộ não - mãi cho đến khi một cá thể trong số họ bị hạ sát, toàn bộ nhóm mới ngừng lại mọi hành động chống đối. Kể từ lúc đó, họ bắt đầu bộc lộ sự hoang mang và mất phương hướng rõ rệt. Chúng ta chỉ có thể giả định rằng họ là những cá thể con bị điều khiển bởi một trí tuệ tổ ong nào đó.\n\nGiờ đây, chúng ta đã giữ lại cả con tàu của họ và bắt giữ phi hành đoàn làm §Hcon tin§!. Chúng ta có thể tiến hành nghiên cứu các công nghệ của họ, đồng thời thử sử dụng các biện pháp tra khảo xem có thể khai thác được thêm bất kỳ thông tin tình báo nào hay không."
 first_contact.250.desc.wilderness_victim: "Sau một cuộc giao tranh ngắn, quân ta đã thành công trong việc áp đảo toàn bộ phi hành đoàn trên con tàu thám hiểm của §H[This.ContactCountry.GetName]§! và ép buộc họ phải đầu hàng, với mức thương vong chỉ ở mức tối thiểu. Ban đầu, đám sinh vật ngoài hành tinh §H[This.ContactCountry.Species.GetClass]§! này đã phô diễn khả năng phối hợp tác chiến vượt xa mức tưởng tượng - như thể tất cả đều chia sẻ chung một ý thức - cho đến khi họ bất ngờ ngừng lại mọi hành động kháng cự. Vào khoảnh khắc đó, mỗi thuyền viên dường như đều đánh mất đi sự tổ chức của mình, và lui về trạng thái hành vi bản năng thô sơ.\n\nChúng ta chỉ có thể suy luận rằng những sinh vật với trí tuệ thấp kém này đã từng hoạt động dưới một hình thái ý thức bầy đàn nào đó. Giờ đây, khi đã §Hbắt giữ§! thành công cả phi hành đoàn lẫn con tàu làm con tin, chúng ta có thể bắt đầu quá trình thẩm vấn hạm đội kỳ bí này và đi sâu nghiên cứu những công nghệ độc đáo của họ."
 first_contact.250.A: "Họ sẽ bị tra khảo."
 first_contact.250.B: "Hãy giải phẫu bọn chúng!"
 first_contact.250.B.machine: "Hãy tháo rời những cỗ máy này ra thành từng mảnh!"
 first_contact.250.B.tooltip: "Bằng phương pháp này, chúng ta có thể thu thập được vô số thông tin giá trị, nhưng một khi sự việc bị bại lộ, §H[This.ContactCountry.GetName]§! chắc chắn sẽ §Rvô cùng phẫn nộ§!."
 first_contact.250.C: "Chúng ta không cần những kẻ sống sót."
 first_contact.250.C.devourers: "Mùi vị của chúng sẽ ra sao nhỉ..."
 first_contact.250.C.homicidal_tooltip: "Chúng ta cũng sẽ tiến hành điều tra những con tàu của chúng để tìm kiếm những manh mối tiềm ẩn bên trong.\n"
 first_contact.260.name: "$first_contact.250.name$"
 first_contact.260.desc: "Chúng ta đã cố gắng vô hiệu hóa con tàu thám hiểm của §H[This.ContactCountry.GetName]§!, nhưng hành động này đã dẫn đến một trận chiến đẫm máu, thậm chí ngay cả sau khi chúng ta đã lên tàu, cuộc giao tranh khốc liệt vẫn chưa hề có dấu hiệu dừng lại. Trận chiến diễn ra vô cùng ác liệt, không một thành viên phi hành đoàn nào sống sót - dường như tất cả những binh lính bị thương đều thà §Htự kết liễu đời mình§! chứ quyết không để bị bắt sống.\n\n$first_contact.260.desc.end$"
 first_contact.260.desc.machine_victim: "Ý định ban đầu của chúng ta là vô hiệu hóa con tàu thám hiểm của §H[This.ContactCountry.GetName]§!, tuy nhiên, một cuộc đọ súng dữ dội đã bùng nổ ngay cả sau khi chúng ta đổ bộ lên tàu mới có thể đạt được mục đích. Có vẻ như kẻ thù mà chúng ta đang đối mặt là những thiết bị bay không người lái bị điều khiển bởi một §Htrí tuệ nhân tạo đang mất kiểm soát§!, chúng sẽ lập tức kích hoạt lệnh §Htự hủy§! ngay khi mất tín hiệu liên lạc.\n\n$first_contact.260.desc.end$"
 first_contact.260.desc.hive_victim: "Chúng ta đã nỗ lực vô hiệu hóa con tàu thám hiểm của §H[This.ContactCountry.GetName]§!, nhưng hành động này lại dẫn đến một cuộc tắm máu, đến mức cuộc chiến khốc liệt vẫn không hề giảm nhiệt ngay cả khi chúng ta đã bước lên tàu. Thủy thủ đoàn trên tàu đã thể hiện khả năng phối hợp tuyệt đỉnh - như thể họ được điều khiển bởi một khối óc duy nhất - và giao chiến cực kỳ tàn bạo với quân ta, không lùi bước dù chỉ nửa phân. Đến phút cuối cùng, chúng thà §Htự sát§! chứ quyết không chịu khuất phục trước kẻ thù.\n\n$first_contact.260.desc.end$"
 first_contact.260.desc.wilderness_victim: "Chúng ta đã vô hiệu hóa thành công con tàu thám hiểm từ §H[This.ContactCountry.GetName]§!, nhưng cuộc xung đột bùng phát trong quá trình đổ bộ lên tàu đã leo thang thành một cuộc giao tranh đẫm máu ngoài ý muốn. Lúc đầu, nhóm sinh vật ngoài hành tinh §H[This.ContactCountry.Species.GetClass]§! này đã bộc lộ khả năng phối hợp tác chiến vượt ngoài dự đoán, hệt như đang cùng chia sẻ một ý thức duy nhất. Tuy nhiên, ngay khi quân ta giành được lợi thế quân sự, những sinh vật này bất ngờ rơi vào trạng thái hoảng loạn tột độ. Mô hình hành vi của chúng nhanh chóng thoái hóa về trạng thái nguyên thủy và hung bạo, hoàn toàn đánh mất khả năng tổ chức, và cuối cùng bị tiêu diệt hoàn toàn trong chốc lát.\n\nNhững bằng chứng thu thập được cho thấy các sinh vật trí tuệ thấp này từng thuộc về một dạng ý thức gestalt nào đó. Sự tồn tại vô hình thao túng chúng hiển nhiên thà chọn con đường tự diệt chứ quyết không chịu khuất phục để bị bắt giữ - và cuối cùng, thứ duy nhất còn sót lại cho chúng ta chỉ là đống đổ nát của con tàu có thể tái chế, ngập tràn những con thú khát máu và thực vật ngoại lai đang vặn vẹo.\n\n$first_contact.260.desc.end$"
 first_contact.260.desc.end: "Mặc dù trong những khoảnh khắc cuối cùng, chúng đã vội vàng xóa sạch mọi dấu vết trên hệ thống máy tính và có ý định cho con tàu nổ tung, nhưng cuối cùng, con tàu của chúng vẫn rơi vào tay chúng ta một cách nguyên vẹn. Các [This.Owner.GetResearchers] của chúng ta đang bắt tay vào việc, cố gắng khai quật những thông tin hữu ích từ đó."
 first_contact.260.A: "Con tàu này sẽ tiết lộ mọi bí mật của chúng."
 first_contact.270.name: "Kế Hoạch Bắt Giữ Con Tàu Thất Bại"
 first_contact.270.desc: "Chiến dịch bắt giữ tàu thám hiểm của §H[This.ContactCountry.GetName]§! đã kết thúc trong thảm họa. Thật không may, sự phản kháng của chúng dữ dội hơn nhiều so với dự đoán của chúng ta. Khi nhận ra không còn cơ hội chiến thắng, chúng đã quyết định §Htự hủy§! con tàu. Giờ đây, chỉ còn lại những mảnh vỡ trôi dạt trong không gian, chẳng còn lại gì cả. Chúng ta chỉ có thể thành tâm cầu nguyện rằng, theo sau con tàu thám hiểm này không phải là một hạm đội báo thù khổng lồ!"
 first_contact.270.desc2: "Chiến dịch bắt giữ tàu thám hiểm của §H[This.ContactCountry.GetName]§! đã trở thành một thảm họa tồi tệ. Thật không may, sự phản kháng của đối phương quyết liệt hơn nhiều so với dự kiến của chúng ta, và trong quá trình giao tranh, con tàu của chúng đã phải hứng chịu một §Hđòn tấn công chí mạng§!. Giờ đây, chỉ còn lại những mảnh vỡ lơ lửng trong không gian, không còn một thứ gì nguyên vẹn. Chúng ta chỉ có thể thành tâm cầu nguyện rằng, đằng sau con tàu thám hiểm này sẽ không có một hạm đội báo thù khổng lồ nào bám theo!"
 first_contact.270.A: "Giờ đây, chúng ta phải dốc toàn lực để giải mã ngôn ngữ của chúng."
 first_contact.270.B: "Hãy thử thêm một lần nữa..."
 first_contact.270.B.tooltip: "$first_contact.280.B.tooltip$\nTuy nhiên, chúng chắc chắn sẽ phòng thủ nghiêm ngặt hơn.\n\n"
 first_contact.280.name: "Thất bại"
 first_contact.280.desc.just_left: "Nỗ lực đánh chiếm tàu thám hiểm của §H[This.ContactCountry.GetName]§! đã kết thúc trong thất bại. Thật xui xẻo, chúng ta đã đánh mất dấu vết của chúng trước khi kịp hành động."
 first_contact.280.desc.failed: "Nỗ lực đánh chiếm tàu thám hiểm của §H[This.ContactCountry.GetName]§! đã kết thúc trong thất bại. Thật xui xẻo, chúng đã khéo léo né tránh được vòng vây của chúng ta, và đã §Hchạy trốn§! khỏi hệ sao này trước khi chúng ta có cơ hội vô hiệu hóa con tàu. Tương lai của chúng ta giờ đây đang bị bao phủ bởi những đám mây đen - không chỉ vì nhiệm vụ tìm kiếm thông tin về chúng trở nên cam go và khó khăn hơn gấp bội, mà còn bởi chắc chắn chúng sẽ coi hành động này của chúng ta là một biểu hiện của sự thù địch."
 first_contact.280.A: "$first_contact.270.A$"
 first_contact.280.B: "$first_contact.270.B$"
 first_contact.280.B.tooltip: "Chúng ta đã xác định được vị trí hệ sao quê hương của chúng, có lẽ chúng ta có thể thử §Hbắt cóc§! một vài cá thể làm mẫu vật.\n\n"
 first_contact.252.name: "Con tàu đã bị giam giữ"
 first_contact.252.desc.normal.start: "Mặc dù những nhà thám hiểm của chúng ta đều hiểu rõ rằng lần chạm trán đầu tiên luôn tiềm ẩn vô vàn nguy hiểm, nhưng không một ai có thể lường trước được sự việc lại leo thang đến mức này. Trong cuộc tập kích tàn bạo đó, [From.Owner.GetName] đã giam giữ con tàu của chúng ta, và đội đột nhập đã xông lên tàu trước khi chúng ta kịp kích hoạt bước nhảy không gian khẩn cấp."
 first_contact.252.desc.normal.end: "Trước khi mọi tín hiệu bị cắt đứt hoàn toàn, đoạn video cuối cùng mà chúng ta nhận được đã cho thấy bọn địch bắt sống phần lớn thủy thủ đoàn và có ý định tra khảo họ. Rất có thể chúng đang lên kế hoạch thu thập thêm thông tin về chúng ta để chuẩn bị cho những bước đi thù địch tiếp theo..."
 first_contact.252.desc.machine.start: "Các khối xử lý của chúng ta luôn nhận thức rõ những rủi ro tiềm ẩn trong lần tiếp xúc đầu tiên với một nền văn minh ngoài hành tinh. Và sự dự đoán về mối đe dọa đó đã trở thành sự thật trên một trong những con tàu của chúng ta, [From.Owner.GetName] đã bắt giữ con tàu của chúng ta, và trước khi chúng ta kịp kích hoạt bước nhảy FTL khẩn cấp, một toán lục soát đã đổ bộ lên tàu."
 first_contact.252.desc.hive.start: "Ngay từ những ngày đầu, bộ phận đưa ra quyết định rủi ro đã nắm rõ những mối nguy hiểm rình rập khi tiếp xúc với một nền văn minh ngoài hành tinh lần đầu tiên. Những hành động của [From.Owner.GetName] đã chứng minh họ hoàn toàn đúng đắn. Con tàu của chúng ta đã bị tịch thu, và một đội lục soát đã xông lên tàu ngay trước khi chúng ta kịp kích hoạt bước nhảy FTL khẩn cấp."
 first_contact.252.desc.hive.end: "Tuy nhiên, nếu chúng ta không cung cấp cho chúng những hướng dẫn cần thiết, chúng cũng sẽ chẳng thu hoạch được gì đáng kể - mặc dù chúng có thể học hỏi được nhiều điều về công nghệ của chúng ta thông qua con tàu đã bị tịch thu. Mức độ đe dọa của chúng hiện đã được điều chỉnh tăng lên."
 first_contact.252.desc.normal: "$first_contact.252.desc.normal.start$ Dù phi hành đoàn của chúng ta đã chống trả một cách ngoan cường, nhưng những kẻ tấn công - thuộc loài [From.Owner.Species.GetClass] [From.Owner.Species.GetAAnSpeciesClass] - đã phá nát hệ thống phòng ngự của chúng ta.\n\n$first_contact.252.desc.normal.end$"
 first_contact.252.desc.hive: "$first_contact.252.desc.hive.start$\n\nBọn tấn công khốn khiếp đó, thuộc loài [From.Owner.Species.GetClass] của bọn người ngoài hành tinh, đã bắt giữ thành công vô số cá thể cấp thấp của chúng ta; $first_contact.252.desc.hive.end$"
 first_contact.252.desc.machine: "$first_contact.252.desc.machine.start$\n\nNhững kẻ tập kích vào chúng ta, loài ngoại lai [From.Owner.Species.GetClass], đã thu giữ thành công hàng loạt máy bay không người lái của chúng ta; tuy nhiên, thiếu đi sự định hướng từ chúng ta, rất có thể chúng sẽ không thể làm giảm đi nhiều giá trị - mặc dù chúng hoàn toàn có khả năng học hỏi công nghệ của chúng ta thông qua con tàu bị thu giữ. Mức độ cảnh báo nguy hiểm đối với chúng đã được nâng lên."
 first_contact.252.desc.machine_enemy.normal: "$first_contact.252.desc.normal.start$ Bất chấp sự kháng cự mãnh liệt của thủy thủ đoàn, nhóm tập kích - được tổ chức từ những máy bay không người lái chiến đấu dưới sự điều khiển của một trí tuệ nhân tạo điên loạn - vẫn phá vỡ được hàng phòng ngự của chúng ta.\n\n$first_contact.252.desc.normal.end$"
 first_contact.252.desc.machine_enemy.hive: "$first_contact.252.desc.hive.start$\n\nĐám tập kích nhắm vào chúng ta, thực chất là một bầy máy bay không người lái chiến đấu chịu sự thao túng của một trí tuệ nhân tạo điên rồ, đã tóm gọn được một lượng lớn các cá thể cấp thấp của chúng ta; $first_contact.252.desc.hive.end$"
 first_contact.252.desc.machine_enemy.machine: "$first_contact.252.desc.machine.start$\n\nNhững kẻ tập kích chúng ta - một nhóm người máy giống hệt chúng ta - đã thu giữ thành công rất nhiều thiết bị không người lái của chúng ta. Tuy nhiên, nếu thiếu đi sự chỉ dẫn từ chúng ta, có lẽ chúng sẽ chẳng thu thập được thông tin gì hữu ích - mặc dù chúng hoàn toàn có thể khám phá ra một vài công nghệ của chúng ta từ con tàu bị bắt giữ. Đánh giá mức độ nguy hiểm của chúng đối với chúng ta cũng đã được nâng lên một cách tương ứng."
 first_contact.252.desc.hive_enemy.normal: "$first_contact.252.desc.normal.start$ Dù phi hành đoàn của chúng ta đã chống trả một cách ngoan cường, nhưng những kẻ tấn công - [From.Owner.Species.GetClass] - đã thể hiện sự phối hợp nhịp nhàng đến đáng sợ, và xuyên thủng mọi phòng tuyến của chúng ta.\n\n$first_contact.252.desc.normal.end$"
 first_contact.252.desc.hive_enemy.machine: "$first_contact.252.desc.machine.start$\n\nBọn tập kích nhắm vào chúng ta, đám người ngoài hành tinh [From.Owner.Species.GetClass] đó, đã thành công bắt giữ một lượng lớn máy bay không người lái của chúng ta; tuy nhiên, nếu không có sự chỉ dẫn của chúng ta, chúng có lẽ sẽ chẳng thu được bao nhiêu thông tin giá trị - mặc dù chúng hoàn toàn có khả năng học hỏi công nghệ của chúng ta từ chiếc tàu bị bắt giữ. Chúng ta đã nâng cấp độ cảnh báo nguy hiểm đối với chúng lên một bậc."
 first_contact.252.desc.hive_enemy.hive: "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta - một toán người ngoài hành tinh thuộc loài [From.Owner.Species.GetClass], với sự phối hợp nhịp nhàng đến mức có thể nói là mang cùng một trí tuệ hợp nhất giống như chúng ta - đã thành công tóm gọn vô số cá thể cấp thấp của chúng ta; $first_contact.252.desc.hive.end$"
 first_contact.252.desc.wilderness.start: "Chúng ta luôn nghi ngờ rằng, nếu có sự sống tồn tại ở một nơi nào đó khác trong thiên hà này, chúng hoàn toàn có thể trở thành mối hiểm họa đối với chúng ta, và mức độ nguy hiểm của chúng không hề kém cạnh những điểm kỳ dị hay bức xạ ngôi sao đang lang thang ngoài kia. Giờ đây, mối nghi ngờ đó đã trở thành sự thật. Một trong những con tàu thám hiểm của chúng ta đã bị [from.owner.GetName] tấn công và xâm nhập - đối phương đã khai hỏa khi các sinh vật cộng sinh trên tàu vẫn chưa kịp rút lui."
 first_contact.252.desc.wilderness: "$first_contact.252.desc.wilderness.start$\n\nLực lượng tấn công chúng ta là một toán người ngoài hành tinh [from.owner.species.GetClass], chúng đã bắt giữ vô số [root.GetSpeciesAdj] cộng sinh đang kẹt lại trên tàu. Giờ đây, khi những sinh vật cộng sinh này đã bị tách khỏi ý thức tập thể của chúng ta, chúng ta tin rằng những kẻ bắt giữ sẽ khó lòng khai thác được bất kỳ giá trị chiến lược nào từ chúng. Dù vậy, sự ra đi của chúng vẫn làm sụt giảm đi một phần sức mạnh của chúng ta. Chúng ta hoàn toàn có quyền phẫn nộ vì bị xúc phạm, nhưng đồng thời, chúng ta cũng có thể an ủi phần nào khi lại vừa khám phá và nhận diện thêm được một mối đe dọa mới trong khoảng không bí ẩn này."
 first_contact.252.A: "Khốn kiếp. Thật sự quá tồi tệ."
 first_contact.253.name: "Sự bạo tàn của [From.Owner.GetName]"
 first_contact.253.desc.normal.end: "Hình ảnh từ con tàu của chúng ta hiện đã bị cắt đứt hoàn toàn, nhưng chúng đã kịp phơi bày cho chúng ta thấy những người ngoài hành tinh này đã \"đối xử tốt\" với tù binh và con tin như thế nào. Chúng đã tàn nhẫn mổ xẻ những con tin ngay lúc họ còn sống để lấy nội tạng nghiên cứu! Chúng ta phải nhìn nhận rằng, khi phải đối đầu với một nền văn minh có những hành động tàn bạo như vậy, chúng ta buộc phải đáp trả bằng những hành vi thù địch mạnh mẽ nhất."
 first_contact.253.desc.hive.end: "Đã bắt giữ được một số lượng lớn cá thể cấp thấp của chúng ta, và đã bắt đầu tiến hành phân tách chúng về mặt sinh lý mà không cần bận tâm đến những tổn thất có thể xảy ra, rõ ràng là chúng đang cố gắng tìm cách sử dụng những cá thể này để chống lại chính chúng ta. Với những hành động như vậy, cộng thêm việc chúng đã chiếm giữ con tàu và tất cả công nghệ đang được sử dụng trên đó, mức độ nguy hiểm của chúng cần được nâng lên một mức báo động cực kỳ nghiêm trọng."
 first_contact.253.desc.machine.end: "Chúng đã tóm gọn được một số lượng lớn các máy bay không người lái của chúng ta, và bắt đầu tháo gỡ chúng để tìm hiểu cách thức lắp ráp thiết bị của chúng ta - rõ ràng là chúng đang cố gắng tìm ra những lỗ hổng trong cả phần cứng lẫn phần mềm để đối phó với chúng ta. Với những hành động như vậy, cộng thêm việc chúng đã chiếm giữ con tàu của chúng ta và mọi công nghệ trên đó, mức độ đe dọa của chúng cần được nâng lên một mức báo động cực kỳ cao."
 first_contact.253.desc.normal: "$first_contact.252.desc.normal.start$ Dù cho thủy thủ đoàn của chúng ta đã chống trả vô cùng quyết liệt, nhưng bọn tập kích - thuộc loài [From.Owner.Species.GetAAnSpeciesClass] [From.Owner.Species.GetClass], vẫn xuyên thủng được hàng phòng ngự của chúng ta.\n\n$first_contact.253.desc.normal.end$"
 first_contact.253.desc.hive: "$first_contact.252.desc.hive.start$\n\nĐám tập kích nhắm vào chúng ta, lũ người ngoài hành tinh [From.Owner.Species.GetClass] đó, $first_contact.253.desc.hive.end$"
 first_contact.253.desc.machine: "$first_contact.252.desc.machine.start$\n\nĐám tập kích nhắm vào chúng ta, lũ sinh vật [From.Owner.Species.GetClass] đó, $first_contact.253.desc.machine.end$"
 first_contact.253.desc.machine_enemy.normal: "$first_contact.252.desc.normal.start$ Dù cho thủy thủ đoàn của chúng ta đã chống trả vô cùng dũng cảm, nhưng những kẻ tấn công - một đội quân máy bay không người lái chiến đấu bị một AI loạn trí thao túng, vẫn xuyên thủng được hàng phòng ngự của chúng ta.\n\n$first_contact.253.desc.normal.end$"
 first_contact.253.desc.machine_enemy.hive: "$first_contact.252.desc.hive.start$\n\nĐám tập kích nhắm vào chúng ta, một đạo quân máy bay không người lái chiến đấu bị một AI loạn trí điều khiển, $first_contact.253.desc.hive.end$"
 first_contact.253.desc.machine_enemy.machine: "$first_contact.252.desc.machine.start$\n\nNhững kẻ tập kích chúng ta - một nhóm máy bay không người lái cơ giới hóa cực kỳ giống chúng ta - $first_contact.253.desc.machine.end$"
 first_contact.253.desc.hive_enemy.normal: "$first_contact.252.desc.normal.start$ Mặc dù thủy thủ đoàn của chúng ta đã phản kháng vô cùng quyết liệt, nhưng nhóm tấn công - [From.Owner.Species.GetClass] đã thể hiện sự phối hợp nhịp nhàng đến đáng sợ, và chọc thủng hàng phòng ngự của chúng ta.\n\n$first_contact.253.desc.normal.end$"
 first_contact.253.desc.hive_enemy.machine: "$first_contact.252.desc.machine.start$\n\nNhững kẻ tập kích - một nhóm sinh vật hữu cơ [From.Owner.Species.GetClass] đã thực hiện các hành động phối hợp ăn ý như chúng ta, điều này cho thấy có vẻ như chúng cũng đang bị một trí tuệ bậc cao chi phối giống như chúng ta, $first_contact.253.desc.machine.end$"
 first_contact.253.desc.hive_enemy.hive: "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta - một toán người ngoài hành tinh thuộc loài [From.Owner.Species.GetClass], với sự phối hợp nhịp nhàng đến mức có thể nói là mang cùng một trí tuệ hợp nhất giống như chúng ta - $first_contact.253.desc.hive.end$"
 first_contact.253.desc.wilderness: "$first_contact.252.desc.wilderness.start$\n\nLực lượng tấn công chúng ta là một đám sinh vật ngoài hành tinh [from.owner.species.GetClass], chúng đang tiến hành giải phẫu và cắt xẻo những bộ phận trên tàu được chúng xác định là thực thể sống. Trong số chúng ta, những sinh vật cộng sinh vĩ mô không có khả năng di chuyển dường như đã gặp may mắn hơn đôi chút, khi chỉ bị tiêu diệt hoặc xóa sổ. Không còn một sinh mệnh nào trên tàu tiếp tục tồn tại trong sự cộng hưởng ý thức của chúng ta, nhưng sự tan biến của chúng vẫn khiến toàn thân chúng ta phải run lên từng đợt.\n\nChúng ta đã phải trải qua những đau đớn tột cùng như bị tra tấn, nhưng ít nhất cũng đã làm sáng tỏ một điều: giờ đây chúng ta đã nhận thức rõ hơn về hình hài của những mối hiểm họa đang ẩn náu trong khoảng không sâu thẳm này."
 first_contact.253.B.devourer: "Chúng ta phải nhanh chóng kiểm tra xem chúng có thực sự là những món ngon lành hay không."
 first_contact.254.name: "$first_contact.253.name$"
 first_contact.254.desc.normal.end: "Tín hiệu hình ảnh từ con tàu của chúng ta hiện đã bị gián đoạn hoàn toàn, nhưng chúng đã cố ý gửi cho chúng ta đoạn video ghi lại cảnh chúng hành quyết những tù binh, cho thấy sự coi thường đến tột cùng của chúng đối với sinh mạng của người [This.Owner.GetSpeciesAdj]! Chúng ta phải xác định rằng, khi phải đối mặt với một nền văn minh có những hành động như thế này, chúng ta không có lựa chọn nào khác ngoài việc đáp trả bằng những hành động thù địch mạnh mẽ nhất."
 first_contact.254.desc.hive.end: "Đã bắt giữ thành công một lượng lớn cá thể của chúng ta, và bắt đầu tàn sát chúng một cách vô cùng phi lý, chẳng màng đến việc lãng phí tài nguyên. Cùng với hành động chiếm đoạt con tàu và toàn bộ công nghệ được trang bị trên đó, mức độ nguy hiểm của chúng cần được nâng lên mức cực kỳ nghiêm trọng."
 first_contact.254.desc.machine.end: "Chúng đã tóm gọn được một lượng lớn máy bay không người lái của chúng ta, và bắt đầu tháo dỡ chúng một cách vô cùng phi lý, không màng đến những tài nguyên có thể bị lãng phí. Những hành động đó, cộng thêm việc chúng đã chiếm giữ con tàu và toàn bộ công nghệ được trang bị trên đó, mức độ đe dọa của chúng cần được nâng lên mức báo động đỏ."
 first_contact.254.desc.normal: "$first_contact.252.desc.normal.start$ Dù cho thủy thủ đoàn của chúng ta đã chống trả vô cùng quyết liệt, nhưng bọn tập kích - thuộc loài [From.Owner.Species.GetAAnSpeciesClass] [From.Owner.Species.GetClass], vẫn xuyên thủng được hàng phòng ngự của chúng ta.\n\n$first_contact.254.desc.normal.end$"
