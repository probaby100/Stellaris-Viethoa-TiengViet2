 cara1_fleet_must_be_within_borders: "Chắc chắn phải có một hạm đội [caravaneer_fleet1_country.GetName] nằm trong biên giới [Root.GetName]."
 cara2_fleet_must_be_within_borders: "Chắc chắn phải có một hạm đội [caravaneer_fleet2_country.GetName] nằm trong biên giới [Root.GetName]."
 cara3_fleet_must_be_within_borders: "Chắc chắn phải có một hạm đội [caravaneer_fleet3_country.GetName] nằm trong biên giới [Root.GetName]."
