 # Lần tiếp xúc đầu tiên với Động vật Không gian
 # Các vùng biệt lập
 first_contact_critters.1.name: "Tín hiệu có quy luật"
 first_contact_critters.1.desc: "Chúng ta đã nhận được các chỉ số từ một nguồn không xác định. Những tín hiệu này dường như tuân theo một loại cú pháp lặp đi lặp lại nào đó, chứng tỏ nguồn phát của nó phải là sinh vật có trí tuệ. Chúng ta nên nghiên cứu sâu hơn về nó. Chúng có vẻ tập trung quanh một trạm không gian, nhưng vẫn chưa rõ liệu trạm không gian này có phải là một phần của một nền văn minh không gian lớn hơn hay không."
 first_contact_critters.1.desc.cfl: "Chúng ta đã phát hiện các chỉ số mang tính chất chưa xác định. Những tín hiệu này dường như tuân theo một cú pháp lặp lại nào đó, điều này có thể cho thấy chúng bắt nguồn từ dạng sống có trí tuệ. Chúng ta nên tiến hành điều tra thêm về việc này. Tín hiệu dường như tập trung xung quanh một chiến hạm cỡ lớn, nhưng hiện tại vẫn chưa rõ liệu đây có phải là một phần của một nền văn minh liên sao quy mô lớn hơn hay không."
 first_contact_critters.1.A: "Tiến hành nghiên cứu."
 first_contact_critters.5.name: "$leviathans.99.name$"
 first_contact_critters.5.desc: "Sau khi dịch thành công ngôn ngữ của họ, chúng ta đã thiết lập liên lạc với trạm không gian độc lập của §H[This.ContactCountry.GetRealName]§!."
 first_contact_critters.5.A: "Hãy nghe xem họ có muốn nói gì không."
 # Tiyanki
 first_contact_critters.10.name: "Nguồn nhiệt kỳ dị"
 first_contact_critters.10.desc: "Máy quét tầm xa đã thu thập dữ liệu trong hệ sao [This.System.GetName], kết quả phân tích gần như khẳng định đây là một nguồn nhiệt khổng lồ. Rất đáng để nghiên cứu."
 first_contact_critters.10.A: "Cứ làm thế đi."
 first_contact_critters.15.name: "$story.501.name$"
 first_contact_critters.15.desc: "Sinh vật không gian mà nhà lãnh đạo nghiên cứu xã hội học của [Owner.GetSpeciesAdj] gọi là §HTiyanki§! vô cùng hiền lành. Chúng có thể tiến vào không gian con ở các chiều không gian thấp, nhờ đó dễ dàng bơi lội giữa các hệ sao.\n\nChúng lấy các loại khí thường thấy ở tầng ngoài của các hành tinh khí khổng lồ làm thức ăn. Khó có khả năng đây là nguồn thức ăn duy nhất của chúng, nhưng cho đến nay vẫn chưa quan sát thấy các cách ăn uống nào khác.\n\nChúng không chủ động tấn công, nên chúng ta hoàn toàn có thể an tâm phớt lờ chúng."
 first_contact_critters.15.desc.gesta: "$story.501.desc.gesta$"
 first_contact_critters.15.A: "Thật hấp dẫn."
 # Amip
 first_contact_critters.20.name: "To và ngon miệng"
 first_contact_critters.20.desc: "Khi tiến vào [This.System.GetName], cảm biến đã thu được một dữ liệu kỳ lạ. Ban đầu chúng ta phớt lờ vì cứ tưởng đó là những tiểu hành tinh phát sáng, nhưng về sau mọi chuyện trở nên thú vị hơn khi phát hiện ra chúng sẽ có phản ứng tấn công nhất định đối với các vật thể di chuyển trong không gian dù ở khoảng cách rất xa.\n\nKhuyến cáo tốt nhất là nên quan sát những thứ này từ một khoảng cách an toàn."
 first_contact_critters.20.A: "Tốt nhất là quan sát từ xa, tiếp tục đi."
 first_contact_critters.25.name: "$story.101.name$"
 first_contact_critters.25.desc: "Thực thể mà hạm đội của chúng ta vừa đụng độ trước đó là một dạng sống không gian mới được phát hiện.\n\nDo ban đầu đọc lướt sai dữ liệu cảm biến, chúng ta đã vội đặt cho chúng biệt danh là §H“Amip Không gian”§!, thực tế loài sinh vật này còn lớn hơn cả kích thước trung bình của tàu hộ tống [Owner.GetSpeciesAdj]."
 first_contact_critters.25.A: "Đã hiểu."
 # Pha lê
 first_contact_critters.30.name: "Tinh thể sống?"
 first_contact_critters.30.desc: "Vật thể có hình dáng bất định mà chúng ta từng gọi là §H[This.ContactCountry.GetName]§! nhìn ở mức độ nào đó thì có vẻ được cấu thành từ vật chất dạng tinh thể. Thú vị là, chúng có thể tự đẩy mình di chuyển trong không gian, và có khả năng tự vệ khi cần thiết, chứng tỏ chúng hẳn là có sự sống. Các [This.Owner.GetResearchers] của chúng ta đang tiến hành điều tra sâu hơn."
 first_contact_critters.30.A: "Tiếp tục điều tra."
 # Drone
 first_contact_critters.40.name: "Hệ thống tự động ngoài không gian"
 first_contact_critters.40.desc: "Chúng ta đã phát hiện một dạng sống mới tại [This.System.GetName], dù gọi là “sự sống” có lẽ không chuẩn xác cho lắm. Những thực thể này có vẻ hoàn toàn là loại robot tự động không người lái phục vụ cho một mục đích công nghiệp chưa được biết đến.\n\nChúng ta sẽ tiếp tục quan sát, nhưng vì những cỗ máy này được lập trình để tự bảo vệ bản thân, nên tốt nhất là hãy hành sự cẩn trọng."
 first_contact_critters.40.A: "Tiếp tục quan sát, hành sự cẩn trọng."
 first_contact_critters.45.name: "$story.301.name$"
 first_contact_critters.45.desc: "Chúng ta đã tiến hành điều tra sâu hơn về báo cáo đụng độ các drone ngoài không gian sâu trước đó. Những chiếc drone này dường như đóng vai trò nhân công và quản đốc cho hoạt động khai thác mỏ trên quỹ đạo hoàn toàn tự động, được chế tạo từ hàng triệu năm trước. Hoạt động khai thác này có vẻ đã bắt đầu từ hàng ngàn năm trước, rồi nhanh chóng bị bỏ hoang, chỉ còn trơ lại lũ drone tiếp tục vận hành.\n\nNhững drone này sở hữu các tia laser khai khoáng uy lực, và đã biểu hiện những động thái đe dọa rõ rệt, thậm chí là xâm lược, khi tàu của [Owner.GetSpeciesAdj] cố gắng tiếp cận. Có lẽ chúng chỉ là lũ drone cũ kỹ, nhưng [Owner.GetName] vẫn nên theo dõi chúng sát sao."
 first_contact_critters.45.A: "Đã hiểu."
 # Kẻ cướp bóc
 first_contact_critters.50.name: "Dấu hiệu dã man"
 first_contact_critters.50.desc: "Dù sự thật là việc họ sống trên các trạm cư trú ngầm ám chỉ rằng họ rất có thể là một xã hội tiên tiến, nhưng [This.Owner.GetEnvoy] [This.Leader.GetName] lại không dám chắc chúng ta có thực sự đang giao thiệp với một dạng sống thông minh hay không: Họ dường như lúc nào cũng tỏ thái độ thù địch, điều này là bất khả thi đối với một xã hội ổn định: Thậm chí ngay trong đợt điều tra ngắn ngủi của mình, chúng ta đã chứng kiến vài hành vi dã man thuần túy của chúng.\n\nBọn chúng có vẻ có ngôn ngữ riêng, nhưng các [This.Owner.GetLinguists] của chúng ta vẫn đang chật vật giải tích nó, để sau này chúng ta có thể hiểu được cách hành xử của chúng."
 first_contact_critters.50.A: "Thật khiến người ta khó chịu. Chúng ta phải cẩn thận."
 first_contact_critters.60.name: "Tàu địch"
 first_contact_critters.60.desc: "Những con tàu mà chúng ta đụng độ tại [This.System.GetName] trông có vẻ hơi lỗi thời, nhưng vẫn được trang bị vũ khí tận răng. Những con tàu này có lẽ là loại có người lái, và thể hiện sự thù địch với bất cứ vật thể nào cố tình tiếp cận. Chúng ta nhất định phải ứng phó cẩn thận..."
 first_contact_critters.65.desc: "Mặc dù chúng ta vẫn chưa thể thiết lập liên lạc với họ, chủ yếu vì họ chẳng buồn đoái hoài gì đến chúng ta, nhưng chúng ta đã có thể xác định §H[This.ContactCountry.GetName]§! chính là hải tặc. Các chỉ báo thị giác cho thấy văn hóa của họ phần lớn được hình thành ngoài không gian, một số biểu hiện mà chúng ta quan sát được không hề ăn nhập với bất kỳ nền văn minh cư trú trên hành tinh nào.\n\nKhông may là, phi hành đoàn của chúng có vẻ chẳng hứng thú gì với việc giao lưu dân sự. Từ những đoạn thông tin liên lạc giữa các tàu bị chặn thu, chúng ta biết được rằng chúng sống chủ yếu bằng nghề cướp biển, thi thoảng cũng chiêu mộ thêm vài thành phần sống ở rìa các nền văn minh lên tàu giặc của chúng."
 first_contact_critters.70.name: "Tàu vô danh"
 first_contact_critters.70.desc: "Hạm đội bị phát hiện trong hệ sao [This.System.GetName] có vẻ là một đoàn thám hiểm liên sao với mục đích chưa được làm rõ. Họ không có bất kỳ hành vi thù địch nào, cũng không thấy được trang bị vũ khí hạng nặng một cách rõ rệt, ngược lại họ dường như đang liên tục phát đi những tín hiệu chứa nội dung thực tế về phía chúng ta một cách vô định. [This.Owner.GetEnvoy] của chúng ta, [This.Leader.GetName], cảm thấy rất bối rối, nhưng hy vọng rằng những đợt phát thanh đó sẽ giúp các [This.Owner.GetLinguists] dịch được ngôn ngữ của họ."
 first_contact_critters.70.desc.home: "Hệ sao [This.System.GetName] có vẻ là quê hương của một xã hội tiên tiến với nguồn gốc vô danh. Cư trú trong một chuỗi các trạm không gian quanh hệ sao, [This.Owner.GetEnvoy] [This.Leader.GetName] để ý thấy có không ít phi thuyền đi lại qua đây, đồng thời còn có một vài hạm đội viễn chinh lớn với mục đích không rõ ràng đang rời khỏi hệ sao. Họ dường như đang liên tục phát đi những tín hiệu lặp lại nhưng không có nội dung thực tế về phía chúng ta, diễn biến này khiến các [This.Owner.GetLinguists] của chúng ta thấy khó hiểu, nhưng điều đó lại giúp ích cho việc dịch ngôn ngữ của họ."
 first_contact_critters.70.desc.nomadic.base: "Các tàu thuyền được phát hiện trong hệ sao [This.System.GetName] dường như đang thực hiện một cuộc viễn chinh xuyên thiên hà, một lối sống không hề xa lạ đối với đồng bào chúng ta. Họ không thể hiện bất kỳ sự thù địch nào, mà liên tục phát đi các tín hiệu lặp lại về phía chúng ta."
 first_contact_critters.70.desc.nomadic: "$first_contact_critters.70.desc.nomadic.base$\n\nChứng kiến một giống loài chọn biển sao làm mái nhà thay vì bất kỳ hành tinh nào mang lại một cảm giác thân thuộc khó tả. [This.Owner.GetEnvoy] [This.Leader.GetName] của chúng ta rất nóng lòng muốn tìm hiểu thêm về những người bạn đồng hành này."
 first_contact_critters.70.desc.nomadic.unfriendly: "$first_contact_critters.70.desc.nomadic.base$\n\nMột lũ lang bạt, chẳng khác gì chúng ta, nhưng lại không mấy dễ mến. [This.Owner.GetEnvoy] [This.Leader.GetName] không mấy bận tâm đến việc này, nhưng cũng sẵn lòng lắng nghe xem họ có điều gì muốn nói."
 first_contact_critters.70.A: "Thật tò mò."
 first_contact_critters.70.B: "Thật đáng bực mình."
 first_contact_critters.70.C: "Cách hành xử của những thứ bên ngoài bầy đàn này quả thực rất kỳ lạ."
 first_contact_critters.70.D: "Làm sao chúng ta mới có thể thấu hiểu triệt để các sinh vật hữu cơ đây."
 first_contact_critters.70.E: "Họ đã tuyên bố hải trình của mình trong khu vực này chưa?"
 first_contact_critters.75.name: "Hành thương"
 first_contact_critters.75.desc: "Chúng ta đã bẻ khóa thành công những đoạn tin nhắn lặp lại khó hiểu do §H[This.ContactCountry.GetName]§! gửi đến, và phát hiện ra rằng những thông tin này lại là vài đoạn... quảng cáo thương mại! Rõ ràng họ tự xưng là §H[This.ContactCountry.GetRealName]§!, một bộ phận của thương đoàn liên sao kiếm sống bằng cách tung ra các ưu đãi giao dịch tốt nhất cho bất kỳ nền văn minh nào họ tình cờ gặp, ít nhất thì họ tự xưng là tốt nhất. Như thường lệ, họ có vẻ đang nỗ lực liên hệ với chúng ta."
 first_contact_critters.75.desc.home: "Chúng ta đã bẻ khóa thành công những đoạn tin nhắn lặp đi lặp lại vô cùng khó hiểu do §H[This.ContactCountry.GetName]§! gửi tới, và phát hiện ra những thông tin này lại là vài đoạn... quảng cáo thương mại! Có vẻ như hệ sao [This.System.GetName] là hệ sao mẹ của một thương đoàn liên sao tự xưng là §H[This.ContactCountry.GetRealName]§!. Rõ ràng, họ kiếm sống bằng cách đưa ra các ưu đãi giao dịch tốt nhất cho bất kỳ nền văn minh nào tình cờ gặp, ít nhất họ tự nhận mình là tốt nhất."
 first_contact_critters.75.B: "Đã hiểu."
 first_contact_critters.75.B.tooltip: "Lần tới khi chúng tiến vào biên giới của ta, chúng ta sẽ có thể giao dịch với hạm đội hành thương."
 first_contact_critters.80.name: "Mảnh vỡ không gian sống?"
 first_contact_critters.80.desc: "Vật thể có hình thù bất định mà chúng ta từng gọi bằng cái tên §H[This.ContactCountry.GetName]§! có thể là một loại sinh vật hữu cơ, [This.Owner.GetEnvoyCap] [This.Leader.GetName] vẫn đang cố gắng kiểm chứng giả thuyết này. Dù nhìn qua nó giống như một chòm các vật chất không gian được cấu tạo ngẫu nhiên, nhưng không thể phủ nhận là chúng có thể tự đẩy mình di chuyển trong khoảng không, và phô diễn một mức độ trí tuệ tự chủ nhất định. Các [This.Owner.GetResearchers] của chúng ta rất bối rối trước hiện tượng này, và đang nỗ lực kiểm chứng các dữ liệu thu được."
 first_contact_critters.80.A: "Chắc chắn chúng ta đã nhầm lẫn ở đâu đó..."
 first_contact_critters.90.name: "$first_contact_critters.70.name$"
 first_contact_critters.90.desc: "Hạm đội bị phát hiện trong hệ sao [This.System.GetName] có vẻ là một bộ phận của đoàn hạm đội viễn chinh liên sao với mục đích chưa được làm rõ. Họ không có bất kỳ hành vi thù địch nào, cũng không thấy được trang bị vũ khí hạng nặng một cách rõ rệt. Tuy nhiên họ dường như đang giữ im lặng hoàn toàn, chúng ta không thể thu được bất kỳ tín hiệu nào từ phía họ. Các [This.Owner.GetLinguists] của chúng ta tin rằng họ có thể dịch được ngôn ngữ của đối phương từ vài câu chữ nhặt nhạnh được, dĩ nhiên việc này có thể tốn một khoảng thời gian dài."
 first_contact_critters.95.name: "Dân du mục"
 first_contact_critters.95.desc: "Chúng ta đã giải mã thành công ngôn ngữ bí ẩn của §H[This.ContactCountry.GetName]§!. Các [This.Owner.GetLinguists] của chúng ta đã bế tắc một thời gian dài, mãi cho đến lần họ bắt đầu phát thanh về phía ta thì mới có được đột phá. Nội dung phát thanh là một thông điệp chào mừng, trong đó họ tự xưng là §H"Nomad"§!. Xem ra giờ họ đã sẵn lòng giao tiếp với chúng ta rồi."
 first_contact_critters.100.desc: "Hạm đội mà chúng ta bắt gặp tại hệ sao [This.System.GetName] không hề giống với bất kỳ thứ gì chúng ta từng thấy trong khu vực này trước đây. Nó không tỏ ra hiếu chiến, nhưng lúc này chúng ta chỉ có thể đoán mò về nguồn gốc và mục đích của nó. Lời phỏng đoán chắc chắn nhất của chúng ta là, phe phái mà hạm đội này đại diện không hề có quan hệ chính thức nào với các chính quyền hay nền văn minh ở các khu vực."
 first_contact_critters.100.a: "Hành sự cẩn trọng."
 first_contact_critters.105.name: "Hạm đội trung lập"
 first_contact_critters.105.desc: "Chúng ta đã rơi vào thế bế tắc với hạm đội tự xưng là §H[This.ContactCountry.GetRealName]§! này. Vị khách không mời mà đến này đã phớt lờ hầu hết mọi động thái ngoại giao của chúng ta, nhưng chúng ta có thể suy luận rằng nó đại diện cho một thực thể trung lập độc lập với các nền văn minh trong dải ngân hà.\n\nChúng ta suy đoán, nếu hạm đội này có chủ nhân theo định nghĩa truyền thống, thì cần phải áp dụng các biện pháp đặc biệt mới có thể tiếp cận được họ. Cân nhắc đến điểm này, chúng ta đã tóm tắt các phát hiện hiện tại để hỗ trợ cho đội ngũ [this.owner.GetScientistPlural] trong tương lai (nếu cần thiết)."
 further_fc_tiyanki_completed: "Do [This.ContactCountry.GetName] và cá voi không gian khổng hẳn là cùng một giống loài, nên cuộc tiếp xúc lần đầu của chúng ta với chúng cũng chính thức được tuyên bố là thành công.\n"
 further_fc_amoebas_completed: "Do [This.ContactCountry.GetName] và bầy thú không gian hẳn là cùng một giống loài, nên cuộc tiếp xúc lần đầu của chúng ta với chúng cũng chính thức được tuyên bố là thành công.\n"
 further_fc_crystals_completed: "Do [This.ContactCountry.GetName] là những thực thể tinh thể cực kỳ giống với [Root.ContactCountry.GetName], nên cuộc tiếp xúc lần đầu của chúng ta với chúng cũng chính thức được tuyên bố là thành công.\n"
 further_fc_drones_completed: "Do [This.ContactCountry.GetName] có vẻ tương đồng với những drone khai khoáng tự động, nên cuộc tiếp xúc lần đầu của chúng ta với chúng cũng chính thức được tuyên bố là thành công.\n"
 further_fc_caravaneers_completed: "Do [This.ContactCountry.GetName] hẳn là những thương nhân vũ trụ tương tự, một thành viên của [Root.ContactCountry.GetSpeciesNamePlural], nên cuộc tiếp xúc lần đầu của chúng ta với chúng cũng chính thức được tuyên bố là thành công.\n"
 further_fc_clouds_completed: "Do [This.ContactCountry.GetName] là những đám mây hư không tương tự như [Root.ContactCountry.GetName], nên cuộc tiếp xúc lần đầu của chúng ta với chúng cũng chính thức được tuyên bố là thành công.\n"
 further_fc_pirates_completed: "Do [This.ContactCountry.GetName] là những nhóm hải tặc tương tự, nên cuộc tiếp xúc lần đầu của chúng ta với chúng cũng chính thức được tuyên bố là thành công.\n"
