 first_contact.254.desc.hive_enemy.machine: "$first_contact.252.desc.machine.start$\n\nNhững kẻ tập kích - một nhóm sinh vật hữu cơ [From.Owner.Species.GetClass] đã thực hiện các hành động phối hợp ăn ý như chúng ta, điều này cho thấy có vẻ như chúng cũng đang bị một trí tuệ bậc cao chi phối giống như chúng ta, $first_contact.254.desc.machine.end$"
 first_contact.254.desc.hive_enemy.hive: "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta - một toán người ngoài hành tinh thuộc loài [From.Owner.Species.GetClass], với sự phối hợp nhịp nhàng đến mức có thể nói là mang cùng một trí tuệ hợp nhất giống như chúng ta - $first_contact.254.desc.hive.end$"
 first_contact.254.desc.wilderness: "$first_contact.252.desc.wilderness.start$\n\nLực lượng tấn công chúng ta là một đám người ngoài hành tinh [from.owner.species.GetClass], chúng đã thảm sát không thương tiếc những phần mà chúng cho là thực thể sống. Rất nhiều sinh vật cộng sinh vĩ mô không có khả năng di chuyển của chúng ta cũng đã phải bỏ mạng trong cuộc thảm sát này, nhưng bất kể thế nào: mọi thành viên trên tàu giờ đây đều đã bị chia cắt khỏi ý thức cộng hưởng của chúng ta. Chúng ta đang thấu hiểu sâu sắc nỗi đau của từng sự mất mát đó.\n\nSự tàn bạo vô cớ này đã giáng xuống đầu chúng ta, nhưng bù lại, chí ít thì giờ đây chúng ta đã có cái nhìn rõ nét hơn về những mối đe dọa có thể xuất hiện từ mọi ngóc ngách của thiên hà."
 first_contact.254.A: "Thật là quá man rợ."
 first_contact.254.A2: "Đây là một sự xúc phạm đối với mọi điều thiêng liêng!"
 first_contact.254.A3: "Tấn công! Hãy tấn công chúng không thương tiếc!"
 first_contact.254.B: "Điều này đã vượt quá giới hạn chịu đựng rồi!"
 first_contact.254.A.devourer: "Lũ người ngoài hành tinh này quả thực là tri kỷ của chúng ta."
 first_contact.254.B.devourer: "Có lẽ lý do chỉ là vì chúng quá hấp dẫn mà thôi."
 first_contact.262.name: "$first_contact.253.name$"
 first_contact.262.desc.normal.end: "Có lẽ điều đáng mừng là, dù để bảo toàn danh dự cá nhân hay để ngăn chặn thông tin lọt vào tay giặc, thủy thủ đoàn của chúng ta đã anh dũng hy sinh trước khi rơi vào tay kẻ địch. Tuy nhiên, chúng ta phải chuẩn bị tâm lý rằng kẻ tấn công sẽ nhanh chóng nghiên cứu con tàu của chúng ta để thu thập tình báo - khi phải đối mặt với một nền văn minh có những hành vi như thế này, chúng ta buộc phải đáp trả bằng những hành động thù địch mạnh mẽ nhất."
 first_contact.262.desc.gestalt.end: "Hệ thống phòng thủ của chúng ta đã bị quá tải, và để bảo vệ an toàn cho thông tin, chúng ta đã phải phát lệnh tự hủy cho các thiết bị bay không người lái của mình. Tuy nhiên, chúng ta phải chuẩn bị tâm lý rằng kẻ tấn công sẽ nhanh chóng nghiên cứu con tàu của chúng ta để thu thập tình báo - khi phải đối mặt với một nền văn minh có những hành động như thế này, chúng ta buộc phải đáp trả bằng những hành vi thù địch mạnh mẽ nhất."
