 #Khác
 first_contact.1060.name: "Giao thức Tiếp xúc Lần đầu"
 first_contact.1060.desc.base: "Cuộc chạm trán gần đây của chúng ta với các dạng sống ngoài hành tinh đã thổi bùng lại những tranh cãi từ thời cổ xưa về cách thức chúng ta nên bắt đầu trao đổi với các nền văn minh trí tuệ ngoài hành tinh tiềm năng, và cuộc tranh cãi này bất thình lình trở nên vô cùng cấp bách."
 first_contact.1060.desc.payback.base: "Chúng ta vừa chạm trán lần đầu tiên với những dạng sống ngoài hành tinh, việc này khiến chúng ta nâng cao cảnh giác với các sinh vật khác. Có sự sống ngoài vũ trụ, nên trên bước đường thám hiểm dải ngân hà, chắc chắn chúng ta sẽ lại gặp gỡ các sinh vật thông minh khác. Thế nhưng cách thức để chào hỏi chúng vẫn là một vấn đề cần bàn thảo thêm."
 first_contact.1060.desc: "$first_contact.1060.desc.base$\n\nMặc dù một số người ra sức kêu gọi thiết lập quan hệ hữu nghị nhanh nhất có thể thông qua các thông điệp hòa bình, nhưng những luồng ý kiến khác lại khuyên nên duy trì thái độ thận trọng, chỉ ra rằng chúng ta hoàn toàn chẳng biết liệu những nền văn minh này có mưu đồ xấu xa gì với chúng ta không, nên việc cho chúng biết quá sớm và quá nhiều về mình là một hành động bất trí.\n\nLại có một nhóm mang tư tưởng cực đoan hơn hối thúc thực hiện các hành động tiên phát chế nhân. “Để bảo vệ [This.GetSpeciesNamePlural] khỏi sự đe dọa,” họ nói, “chúng ta phải không được nương tay, sử dụng mọi thủ đoạn để giành được thế thượng phong trước bất kỳ mối nguy cơ từ người ngoài hành tinh nào.”"
 first_contact.1060.desc.payback: "$first_contact.1060.desc.payback.base$\n\nMặc dù một số người ra sức kêu gọi thiết lập quan hệ hữu nghị nhanh nhất có thể, nhưng những luồng ý kiến khác lại khuyên nên duy trì thái độ thận trọng, chỉ ra rằng chính bản tính thân thiện của chúng ta đã gây nên cảnh bị giam cầm và phản bội trong quá khứ.\n\nLại có một nhóm mang tư tưởng cực đoan hơn hối thúc việc tiên phát chế nhân. “Cách tốt nhất để tránh vết xe đổ là phải ra tay trước khi chúng kịp gây hại cho ta” họ nói, “quyết không được cúi đầu khúm núm trước lũ dị chủng một lần nào nữa!”"
 first_contact.1060.desc.xenophile: "$first_contact.1060.desc.base$\n\nMặc dù một số người ra sức kêu gọi thiết lập quan hệ hữu nghị nhanh nhất có thể thông qua các thông điệp hòa bình, nhưng những luồng ý kiến khác lại khuyên nên duy trì thái độ thận trọng, chỉ ra rằng chúng ta hoàn toàn chẳng biết liệu những nền văn minh này có mưu đồ xấu xa gì với chúng ta không, nên việc cho chúng biết quá sớm và quá nhiều về mình là một hành động bất trí."
 first_contact.1060.desc.payback.xenophile: "$first_contact.1060.desc.base.payback$\n\nMặc dù phần đông chúng ta đều muốn tin rằng luôn có những nền văn minh tử tế ngoài vũ trụ kia, nhưng những người khác lại khuyên nên duy trì thái độ thận trọng, chỉ ra rằng chính bản tính thân thiện của chúng ta đã gây nên cảnh bị giam cầm và phản bội trong quá khứ."
 first_contact.1060.desc.xenophobe: "$first_contact.1060.desc.base$\n\nMặc dù một số người ra sức kêu gọi việc áp dụng các hành động tiên phát chế nhân đối với chúng, nhưng những luồng ý kiến khác lại khuyên nên duy trì thái độ thận trọng, chỉ ra rằng việc tìm hiểu tường tận năng lực của những người ngoài hành tinh này trước khi chính thức đối đầu với chúng mới là hành động sáng suốt."
 first_contact.1060.desc.payback.xenophobe: "$first_contact.1060.desc.payback.base$\n\nMọi người đều đồng thuận một điều: cách tốt nhất để tránh vết xe đổ là phải ra tay trước khi chúng kịp gây hại cho chúng ta. Chúng ta sẽ không bao giờ khúm núm trước lũ dị chủng thêm một lần nào nữa!"
 first_contact.1060.desc.gestalt: "Cuộc đụng độ gần đây với một loại dạng sống ngoài hành tinh đã đặt ra một yêu cầu mới về cách chúng ta sẽ giao tiếp với mọi nền văn minh trí tuệ ngoài hành tinh mà chúng ta gặp gỡ.\n\nMột trong những giải pháp khả thi của chúng ta là gửi đến những thông điệp thiết yếu để chúng dễ dàng dịch đoạn liên lạc của chúng ta, nhằm nhanh chóng kiến lập sự tiếp xúc hòa bình. Tuy nhiên, cách thức này cũng có vẻ quá bất cẩn khi mà đối phương lại ôm ấp dã tâm với chúng ta.\n\nChiến lược an toàn nhất là hành sự thật cẩn trọng, và tìm cách giao tiếp với chúng mà không để lộ quá nhiều thông tin về phía mình. Ở một khía cạnh khác, chúng ta cũng có thể dùng đến những thủ đoạn bạo lực hơn để tìm hiểu rõ về chúng, qua đó phong tỏa biên giới, tuy nhiên hành vi này lại có thể khiến chúng ta rơi vào cảnh đối lập."
 first_contact.1060.A: "Chúng ta nên dang rộng vòng tay chào đón người ngoài hành tinh."
 first_contact.1060.A.machine: "Chúng ta nên dang rộng vòng tay chào đón người ngoài hành tinh."
 first_contact.1060.A.tooltip: "Chính sách này mang lại hiệu ứng sau:\n$first_contact_proactive_effects$$MOD_FIRST_CONTACT_SPEED_MULT$: §G+10%§!"
 first_contact.1060.B: "Thận trọng thì bao giờ cũng khôn ngoan."
 first_contact.1060.B.tooltip: "Chính sách này mang lại hiệu ứng sau:\n$first_contact_cautious_effects$$MOD_FIRST_CONTACT_DEFENSE_ADD$: §G+2§!"
 first_contact.1060.C: "Chúng ta phải bài trừ bất cứ thứ gì có khả năng đe dọa chúng ta."
 first_contact.1060.C.tooltip: "Chính sách này mang lại hiệu ứng sau:\n$first_contact_attack_allowed_effects$"
