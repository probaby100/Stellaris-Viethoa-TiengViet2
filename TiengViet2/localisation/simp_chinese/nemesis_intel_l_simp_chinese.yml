 first_contact.262.desc.hive_enemy.hive: "$first_contact.252.desc.hive.start$\n\nNhững kẻ tấn công chúng ta - một toán người ngoài hành tinh thuộc loài [From.Owner.Species.GetClass], với sự phối hợp nhịp nhàng đến mức có thể nói là mang cùng một trí tuệ hợp nhất giống như chúng ta - $first_contact.262.desc.gestalt.end$"
 first_contact.262.desc.wilderness: "$first_contact.252.desc.wilderness.start$\n\nKẻ tấn công chúng ta - một nhóm người ngoài hành tinh [from.owner.species.GetClass] - đã nhanh chóng phá vỡ tuyến phòng thủ của chúng ta, chúng ưu tiên nhắm vào những bộ phận mà chúng cho là thực thể sống. Để bảo toàn lực lượng, chúng ta đã buộc phải bỏ lại tất cả các thành viên trên tàu, cách ly họ hoàn toàn khỏi sự cộng hưởng ý thức của chúng ta. Dù cho bọn xâm lược có hung hăng đến đâu, cuối cùng chúng cũng sẽ chẳng thu thập được thông tin gì giá trị.\n\nĐây là một hành động xâm lược trắng trợn, nhưng bù lại, ít nhất bây giờ chúng ta đã có cái nhìn rõ nét hơn về những mối đe dọa mà chúng ta sẽ phải đối mặt trong biển sao bao la này."
 first_contact.272.name: "Lần chạm trán đầu tiên đầy bạo lực"
 first_contact.272.desc: "Chiếc phi thuyền mà chúng ta phái đi để thu thập thông tin về [From.Owner.GetName] đã bị phá hủy hoàn toàn sau cuộc tấn công tàn bạo từ lực lượng vũ trang của họ. Hiện tại vẫn chưa thể xác định rõ ràng mục đích của chúng là muốn chiếm đoạt con tàu của chúng ta, hay chỉ đơn giản là muốn dằn mặt và ép buộc chúng ta rời khỏi lãnh thổ của chúng."
 first_contact.272.B: "Món nợ máu này chúng ta nhất định sẽ đòi lại!"
 first_contact.282.name: "Thoát khỏi lưỡi hái tử thần"
 first_contact.282.desc: "§H[ship_to_seize.GetName]§!, con tàu mà chúng ta phái đi để thăm dò §H[From.Owner.GetName]§!, đã may mắn thoát khỏi cuộc tấn công đầy ác ý từ lực lượng vũ trang của chúng. Dường như mục tiêu của chúng là chiếm đoạt con tàu của chúng ta và tiến hành tra khảo phi hành đoàn, rất có thể là để phục vụ cho những âm mưu tấn công đen tối nhằm chuộc lợi. Tuy nhiên, thật may mắn, trước khi mọi việc vượt quá tầm kiểm soát, [ship_to_seize.GetName] đã kịp thời kích hoạt chế độ nhảy FTL khẩn cấp."
 first_contact.282.desc.gestalt: "§H[ship_to_seize.GetName]§!, con tàu mà chúng ta điều động đi để điều tra về §H[From.Owner.GetName]§!, đã suýt chút nữa thì bỏ mạng dưới cuộc tấn công tàn độc của lực lượng vũ trang đối phương. Có vẻ như mục đích của chúng là cướp lấy con tàu của chúng ta và tiến hành mổ xẻ công nghệ, rất có thể là để chuẩn bị cho những bước tấn công tiếp theo nhằm mang lại lợi ích cho bản thân. Tuy nhiên, ơn trời, ngay trước khi tình hình trở nên tồi tệ nhất, [ship_to_seize.GetName] đã thành công kích hoạt bước nhảy FTL khẩn cấp."
 first_contact_fleets_mia_tooltip: "Nhằm đảm bảo an toàn tuyệt đối, các hạm đội khác của quân ta đang hoạt động trong vùng kiểm soát của đối phương cũng đã được lệnh thực hiện bước nhảy FTL khẩn cấp."
 first_contact.285.name: "Đã hoàn thành việc tra khảo"
 first_contact.285.desc: "Chúng ta đã hoàn tất công tác nghiên cứu đối với những người ngoài hành tinh §H[This.ContactCountry.GetName]§! bị bắt giữ trước đó. Ban đầu, những con tin này không tỏ ra hợp tác với chúng ta, nhưng theo thời gian, họ đã vô tình để lộ ra vô số manh mối về ngôn ngữ của mình, cho đến khi chúng ta có thể thiết lập giao tiếp ngôn ngữ cơ bản với họ. Kể từ lúc đó, chúng ta đã có thể nhanh chóng thu thập thông tin chi tiết về họ, và một khi có một hoặc nhiều con tin chịu hợp tác, chúng ta sẽ có thể thâm nhập vào hệ thống máy tính của họ.\n\nNhờ vào những thông tin quý giá thu thập được từ họ, chúng ta đã có thể xác định được nguồn gốc của họ là từ §H[This.ContactCountry.GetRealName]§!, đồng thời thu thập được một lượng lớn thông tin tình báo về các hoạt động cũng như sức mạnh quân sự của họ."
 first_contact.285.desc.weak: "Chúng ta đã hoàn tất công tác nghiên cứu đối với những người ngoài hành tinh §H[This.ContactCountry.GetName]§! bị bắt giữ trước đó. Những con tin này rõ ràng là những kẻ yếu đuối, không hề có ý định phản kháng lại các cuộc điều tra của chúng ta. Trên thực tế, họ vô cùng hợp tác. Chúng ta sẽ nhanh chóng giải mã ngôn ngữ của họ và xâm nhập vào hệ thống máy tính của đối phương.\n\nVì thế, chúng ta đã xác định được nguồn gốc của họ là từ §H[This.ContactCountry.GetRealName]§!, đồng thời thu thập được một lượng lớn thông tin tình báo về các hoạt động và sức mạnh quân sự của họ."
 first_contact.285.desc.strong: "Chúng ta đã kết thúc việc nghiên cứu những người ngoài hành tinh §H[This.ContactCountry.GetName]§! bị bắt giữ trước đó. Những con tin này tỏ thái độ cực kỳ bất hợp tác, ngay cả khi các nhà thẩm vấn của chúng ta đã dùng đến những biện pháp mạnh mẽ và hiệu quả nhất cũng không thể xoay chuyển tình thế. Tuy nhiên, theo thời gian, họ đã vô tình làm rò rỉ rất nhiều manh mối liên quan đến ngôn ngữ của họ, cuối cùng giúp chúng ta có đủ khả năng để tiến hành giao tiếp cơ bản với họ. Kể từ đó, chúng ta có thể nhanh chóng thu thập các thông tin chi tiết về họ, đồng thời tiến trình xâm nhập vào một số hệ thống máy tính cơ sở của đối phương cũng đã đạt được những bước tiến nhất định. Mặc dù vậy, chúng ta vẫn nghi ngờ rằng họ đã che giấu rất nhiều chi tiết quan trọng với chúng ta.\n\nNhờ những thông tin mà chúng ta lấy được từ họ, chúng ta đã xác định được rằng họ đến từ §H[This.ContactCountry.GetRealName]§!, và thu thập được một lượng lớn thông tin tình báo về các hoạt động cũng như sức mạnh quân sự của họ."
 first_contact.285.desc.machine_victim: "Chúng ta đã khép lại cuộc điều tra nhắm vào các thiết bị bay không người lái bằng máy móc §H[This.ContactCountry.GetName]§! mà chúng ta đã chặn đứng trước đó. Ngay khi chúng ta ngắt kết nối của chúng với hệ thống trí tuệ nhân tạo thượng tầng, những thiết bị này lập tức đánh mất khả năng tự chủ, và hầu như trở nên vô dụng hoàn toàn, do các chức năng của chúng đã suy giảm với tốc độ chóng mặt.\n\n$first_contact.285.desc.gestalt_end$"
 first_contact.285.desc.hive_victim: "Chúng ta đã hoàn tất công tác nghiên cứu đối với những người ngoài hành tinh §H[This.ContactCountry.GetName]§! bị tóm gọn trước đó. Dường như chúng thực sự được liên kết với nhau bởi một §Htrí tuệ tổ ong§!, và các cá thể đơn lẻ hoàn toàn không có ý thức tự chủ hay quyền tự quyết. Khi bị tách rời khỏi ý thức trung tâm, những cá thể con này dường như rơi vào trạng thái vô định, và rồi lần lượt từ bỏ cõi đời. Ngoài việc phục vụ như những mẫu vật sinh học, chúng chẳng còn mang lại bất kỳ giá trị nào khác.\n\n$first_contact.285.desc.gestalt_end$"
 first_contact.285.desc.wilderness_victim.intro: "Chúng ta đã hoàn tất công tác nghiên cứu đối với những sinh vật ngoài hành tinh §H[This.ContactCountry.GetName]§! vừa bị bắt giữ gần đây. Rất nhiều cá thể sống này được tổ chức theo một dạng thức ý thức tổ ong nào đó, nhưng lại không tồn tại một thực thể quản lý trung tâm. Thay vào đó, những cá thể với trí tuệ gần như bằng không này dường như đã tạo nên một cấu trúc §Hý thức gestalt cộng sinh§! với toàn bộ quần xã sinh vật của chúng."
 first_contact.285.desc.wilderness_victim: "$first_contact.285.desc.wilderness_victim.intro$ Do bị cô lập và mất liên lạc với hành tinh mẹ, những sinh vật cộng sinh này đã thoái hóa trở lại trạng thái nguyên thủy và nhanh chóng chết đi. Trừ việc trở thành đối tượng để giải phẫu, chúng chẳng thể cung cấp thêm bất kỳ thông tin hữu ích nào cho chúng ta.\n\n$first_contact.285.desc.gestalt_end$"
 first_contact.285.desc.gestalt_end: "Rất may mắn, chúng ta đã tìm ra phương pháp bẻ khóa hệ thống máy tính của chúng, và [This.Owner.GetLinguists] sẽ sớm có thể dịch được các tín hiệu mà chúng sử dụng để liên lạc. Giờ đây, chúng ta đã có thể xác nhận chắc chắn rằng §H[This.ContactCountry.GetName]§! chính là §H[This.ContactCountry.GetRealName]§!. Chúng ta cũng đã tích lũy được một lượng lớn thông tin tình báo về các hoạt động và năng lực của chúng."
 first_contact.290.name: "Hoàn tất nghiên cứu ngoại lai"
 first_contact.290.desc: "Chúng ta đã hoàn tất việc nghiên cứu những người ngoài hành tinh §H[This.ContactCountry.GetName]§! bị bắt trước đó. Những con tin này khá bất hợp tác, nhưng vì chúng ta đã mổ phanh họ ra, sự phản kháng của họ chẳng có ý nghĩa gì. Giờ đây, chúng ta đã hiểu rõ hơn về chức năng bên trong của [This.ContactCountry.GetSpeciesOrganNamePlural], [This.ContactCountry.GetSpeciesEarNamePlural] và [This.ContactCountry.GetSpeciesHandNamePlural] cùng các bộ phận cơ thể khác của họ, các nhà di truyền học [This.Owner.GetResearchers] của chúng ta đã thu được những §Hdữ liệu sinh học ngoại lai§! cực kỳ giá trị.\n\nNhờ sự kinh hãi từ những hành động tàn nhẫn của chúng ta, một số người ngoài hành tinh — giờ chúng ta đã biết họ là §H[This.ContactCountry.GetSpeciesNamePlural]§! — đã bắt đầu tỏ ra hợp tác khi chúng ta dịch ngôn ngữ của họ và truy cập vào hệ thống máy tính. Kết quả là, rõ ràng chúng ta đang nắm giữ một lượng tình báo đáng kể, và có thể triển khai chúng để đối phó với họ nếu cần."
 first_contact.290.desc.wilderness_victim: "$first_contact.285.desc.wilderness_victim.intro$\n\nSau khi bị cách ly khỏi quê hương và đồng loại, những sinh vật cộng sinh này thoái hóa về trạng thái nguyên thủy và chết đi nhanh chóng, khiến việc khám nghiệm tử thi trở nên khá dễ dàng.$first_contact.290.desc.hive_victim.main$\n\n$first_contact.290.desc.hive_victim.end$"
 first_contact.290.desc.hive_victim.intro: "Chúng ta đã hoàn tất việc nghiên cứu những người ngoài hành tinh §H[This.ContactCountry.GetName]§! vừa bắt được. Kết quả cho thấy, chúng thực sự được tổ chức theo dạng §HÝ thức Bầy đàn§!, các cá thể con hoàn toàn không có tính tự chủ hay khả năng chủ động. Dù việc thẩm vấn chúng chẳng mang lại tác dụng gì, nhưng điều đó giờ không còn quan trọng nữa, vì chúng ta đã bắt đầu giải phẫu chúng."
 first_contact.290.desc.hive_victim.main: "Giờ đây chúng ta đã hiểu rõ hơn về chức năng bên trong của [This.ContactCountry.GetSpeciesOrganNamePlural], [This.ContactCountry.GetSpeciesEarNamePlural], [This.ContactCountry.GetSpeciesHandNamePlural] và các bộ phận cơ thể khác của chúng, cung cấp cho các nhà di truyền học [This.Owner.GetResearchers] của chúng ta những §Hdữ liệu sinh học ngoại lai§! vô giá."
 first_contact.290.desc.hive_victim.end: "Chúng ta hiện đã biết cách giao tiếp với mẫu quốc của chúng, §H[This.ContactCountry.GetRealName]§!, và có thể tung ra một lượng lớn thông tin tình báo để đối phó với chúng —— nếu cần thiết."
 first_contact.290.desc.hive_victim: "$first_contact.290.desc.hive_victim.intro$$first_contact.290.desc.hive_victim.main$\n\nDù mất nhiều thời gian hơn dự kiến một chút, nhưng nhờ kiến thức sinh học thu thập được cùng những manh mối tìm thấy trên con tàu bị bắt, cuối cùng chúng ta đã giải mã được ngôn ngữ và mã máy tính của chúng.$first_contact.290.desc.hive_victim.end$"
 first_contact.290.desc.hive_victim.no_vessel: "$first_contact.290.desc.hive_victim.intro$$first_contact.290.desc.hive_victim.main$\n\nDù tốn nhiều thời gian hơn dự kiến một chút, nhưng kiến thức sinh học thu được cùng những manh mối gom góp khi không tặc drone đã giúp chúng ta giải mã được ngôn ngữ và mã máy tính của chúng.$first_contact.290.desc.hive_victim.end$"
 first_contact.290.desc.machine_victim: "Chúng ta đã hoàn tất nghiên cứu về những cỗ máy §H[This.ContactCountry.GetName]§! bị bắt giữ trước đó. Một khi bị cắt đứt liên kết với trí tuệ nhân tạo chủ, những drone này mất đi khả năng hoạt động và không thể cung cấp thông tin liên quan đến các giao thức của chính chúng. Nhưng khi bắt đầu tháo tung chúng ra thành từng mảnh, chúng ta lại đạt được những tiến triển nhất định — không chỉ trong việc hiểu ngôn ngữ nội bộ mà còn tìm ra thêm nhiều thông tin về chúng. Kết luận là, các bộ vi xử lý chúng sử dụng vẫn không thể chống lại kỹ thuật thu thập dữ liệu tấn công của chúng ta, và giờ thì chúng chẳng còn giữ được bao nhiêu bí mật nữa.\n\nChúng ta hiện đã có thể giao tiếp với AI chủ của chúng — tự xưng là §H[This.ContactCountry.GetRealName]§! — và sẽ xem xét tình hình tiếp theo."
 first_contact.290.A: "Một kết luận rất đáng hài lòng."
 first_contact.295.name: "Nghiên cứu Vật liệu Ngoại lai"
 first_contact.295.desc: "Việc nghiên cứu con tàu thu được từ [This.ContactCountry.GetName] đã hoàn tất. Việc không bắt được kẻ nào còn sống khiến cuộc điều tra này trở nên cực kỳ thử thách. Nhưng may mắn là chúng vẫn để lại cho các [This.Owner.GetLinguists] của chúng ta vô số tài liệu để giải mã ngôn ngữ của chúng, hiện chúng ta đã xác định chúng là §H[This.ContactCountry.GetRealName]§!, và có thể giao tiếp với chúng nếu muốn. Hơn nữa, chúng ta còn có thể nghiên cứu các §HCông nghệ§! mà chúng sử dụng trên tàu, giúp các [This.Owner.GetResearchers] của chúng ta tìm ra những hướng đi hoàn toàn mới cho các bước đột phá nghiên cứu."
 first_contact.295.desc.no_ship: "Việc nghiên cứu con tàu thu được từ [This.ContactCountry.GetName] đã hoàn tất. Việc không bắt được tù binh nào sống sót để thẩm vấn khiến cuộc điều tra này trở nên cực kỳ thử thách. May mắn thay, chúng vẫn để lại cho các [This.Owner.GetLinguists] của chúng ta vô số tài liệu để giải mã ngôn ngữ của chúng, hiện chúng ta đã xác định chúng là §H[This.ContactCountry.GetRealName]§!, và có thể giao tiếp với chúng nếu muốn. Ngoài ra, chúng ta còn có thể nghiên cứu các §HCông nghệ§! mà chúng sử dụng trên tàu, giúp các [This.Owner.GetResearchers] của chúng ta tìm ra những hướng đi hoàn toàn mới cho các bước đột phá nghiên cứu."
 first_contact.295.A: "Làm tốt lắm."
 gain_asset_internal_organs: "Kiến thức về các cơ quan nội tạng của chúng có thể phát huy tác dụng trong các §HChiến dịch Tình báo§!\n"
 first_contact.1100.desc: "Việc nghiên cứu con tàu thu được từ §H[contact_country.GetName]§! đã hoàn tất. Mặc dù việc thiếu tù binh sống sót để thẩm vấn khiến cuộc điều tra gặp nhiều thử thách, nhưng tiến độ nhanh chóng của chúng ta có thể giúp thiết lập liên lạc với [contact_country.GetSpeciesNamePlural]. Các nhà nghiên cứu [Root.GetResearchers] của chúng ta có thể nghiên cứu §HCông nghệ§! của chúng, mở ra những hướng đi hoàn toàn mới cho các bước đột phá nghiên cứu."
 first_contact.1105.desc: "Chúng ta đã hoàn tất việc nghiên cứu những người ngoài hành tinh §H[contact_country.GetAdj]§! bị bắt trước đó. Những con tin này khá bất hợp tác, nhưng vì chúng ta đã mổ phanh họ ra, sự phản kháng của họ chẳng có ý nghĩa gì. Giờ đây, chúng ta đã hiểu rõ hơn rất nhiều về chức năng bên trong của [contact_country.GetSpeciesOrganNamePlural], [contact_country.GetSpeciesEarNamePlural] và [contact_country.GetSpeciesHandNamePlural] cùng các bộ phận cơ thể khác của họ, các nhà di truyền học [Root.GetResearchers] của chúng ta đã thu được những §Hdữ liệu sinh học ngoại lai§! cực kỳ giá trị.\n\nNhờ sự kinh hãi từ những hành động tàn nhẫn của chúng ta, một số [contact_country.GetSpeciesNamePlural] đã bắt đầu tỏ ra hợp tác khi chúng ta dịch ngôn ngữ của họ và truy cập vào hệ thống máy tính. Kết quả là, hiện chúng ta đang nắm giữ một lượng tình báo đáng kể, và có thể lợi dụng chúng để đối phó với họ nếu cần."
 first_contact.1105.desc.hive_victim: "Chúng ta đã hoàn tất việc nghiên cứu những người ngoài hành tinh §H[contact_country.GetAdj]§! bị bắt trước đó. Cùng với việc các kênh liên lạc giữa hai nước được công khai hóa, sự thật đã rõ ràng: cấu trúc tổ chức của đối phương là một dạng §HÝ thức Bầy đàn§!, các cá thể con không có khả năng hành động và ra quyết định độc lập. Dù việc thẩm vấn chúng vô tác dụng, nhưng nhờ giải phẫu, chúng ta đã hiểu được nhiều khía cạnh về chúng. Giờ đây, chúng ta đã hiểu rõ hơn về chức năng bên trong của [contact_country.GetSpeciesOrganNamePlural], [contact_country.GetSpeciesEarNamePlural] và [contact_country.GetSpeciesHandNamePlural] cùng các bộ phận cơ thể khác của chúng, các nhà di truyền học [Root.GetResearchers] của chúng ta đã thu được những §Hdữ liệu sinh học ngoại lai§! cực kỳ giá trị.\n\nMặc dù mất nhiều thời gian hơn so với hy vọng ban đầu, nhưng kiến thức sinh học thu được đã giúp chúng ta giải mã ngôn ngữ của chúng — cùng với mã máy tính. Nếu tình hình đòi hỏi, chúng ta có thể tung ra lượng lớn tình báo để chống lại chúng!"
 first_contact.1105.desc.machine_victim: "Chúng ta đã hoàn tất nghiên cứu về những cỗ máy §H[contact_country.GetAdj]§! bị bắt giữ trước đó. Một khi bị cắt đứt liên kết với trí tuệ nhân tạo chủ, những drone này mất đi khả năng hoạt động và không thể cung cấp thông tin liên quan đến các giao thức của chính chúng. Nhưng khi tháo tung chúng ra, chúng ta lại đạt được những tiến triển nhất định — không chỉ trong việc hiểu ngôn ngữ nội bộ mà còn tìm ra thêm nhiều thông tin về chúng. Kết luận là, các bộ vi xử lý chúng sử dụng vẫn không thể chống lại kỹ thuật xâm nhập thu thập dữ liệu của chúng ta, và giờ thì chúng chẳng còn giữ được bao nhiêu bí mật nữa.\n\nChúng ta hiện đang nắm giữ một lượng tình báo đáng kể, chúng sẽ được tung ra vào thời điểm thích hợp để đối phó với AI chủ của chúng — §H[contact_country.GetName]§!."
 first_contact.1110.desc: "Chúng ta đã hoàn tất việc nghiên cứu những người ngoài hành tinh §H[contact_country.GetAdj]§! bị bắt trước đó. Ban đầu những con tin này không sẵn lòng hợp tác với chúng ta cho lắm, nhưng khi thiết lập liên lạc với [contact_country.GetName], chúng ta đã có bước tiến lớn. Rất nhanh, chúng ta đã “thuyết phục” được họ cho phép chúng ta đăng nhập vào hệ thống máy tính của họ.\n\nNhờ những thông tin thu thập được từ họ, chúng ta đã có được lượng lớn tình báo về các hoạt động quốc gia và sức mạnh quân sự của họ."
 first_contact.1110.desc.weak: "Chúng ta đã hoàn tất việc nghiên cứu những người ngoài hành tinh §H[contact_country.GetAdj]§! bị bắt trước đó. Những con tin này rõ ràng có ý chí yếu kém, chẳng có ý định ngăn cản các cuộc điều tra của chúng ta. Thực tế là, họ rất hợp tác. Chúng ta sẽ sớm thuyết phục được họ cho phép chúng ta đăng nhập vào hệ thống máy tính của họ.\n\nNhờ những thông tin này, chúng ta đã thu thập được lượng lớn tình báo về các hoạt động quốc gia và sức mạnh quân sự của họ."
 first_contact.1110.desc.strong: "Chúng ta đã hoàn tất việc nghiên cứu những người ngoài hành tinh §H[contact_country.GetAdj]§! bị bắt trước đó. Những con tin này tỏ thái độ cực kỳ bất hợp tác, chống cự gần như mọi phương pháp thẩm vấn. Dù sao đi nữa, khi thiết lập liên lạc với [contact_country.GetName], chúng ta vẫn đạt được một số tiến triển — bao gồm việc lấy được một số quyền truy cập vào hệ thống máy tính cơ sở của họ — chúng ta đã “thuyết phục” họ cho phép đăng nhập, dù đoán rằng họ vẫn giấu giếm nhiều chi tiết.\n\nNhờ những thông tin này, chúng ta đã thu thập được lượng lớn tình báo về các hoạt động quốc gia và sức mạnh quân sự của họ."
 first_contact.1110.desc.machine_victim: "Chúng ta đã hoàn tất nghiên cứu về những cỗ máy §H[contact_country.GetAdj]§! bị bắt giữ trước đó. Một khi bị cắt đứt liên kết với trí tuệ nhân tạo chủ, những drone này mất đi khả năng hoạt động, và do chức năng suy thoái nhanh chóng, chúng gần như hoàn toàn vô dụng khi bị phát hiện.\n\n$first_contact.285.desc.gestalt_end$"
 first_contact.1110.desc.hive_victim: "Chúng ta đã hoàn tất việc nghiên cứu những người ngoài hành tinh §H[contact_country.GetAdj]§! bị bắt trước đó. Cùng với việc các kênh liên lạc giữa hai nước được công khai hóa, sự thật đã rõ ràng: cấu trúc tổ chức của đối phương là một dạng §HÝ thức Bầy đàn§!, các cá thể con không có khả năng hành động và ra quyết định độc lập. Sau khi bị bóc tách khỏi ý thức bầy đàn chủ, những cá thể con này có vẻ như mất phương hướng, rồi chết dần từng đứa một. Chẳng còn tác dụng gì ngoài việc dùng làm mẫu vật sinh học.\n\n$first_contact.285.desc.gestalt_end$"
 first_contact.1110.desc.gestalt_end: "May mắn thay, chúng ta đã tìm cách bẻ khóa được mật mã hệ thống máy tính của họ, giúp chúng ta thu thập được lượng lớn tình báo về các hoạt động quốc gia và sức mạnh quân sự của họ."
 first_contact.320.name: "Đã bắt được người ngoài hành tinh"
 first_contact.320.desc.end: "Dù hành động không có sai sót, và các đặc vụ của chúng ta đã cắt đuôi được kẻ truy binh để trốn thoát thành công, nhưng muốn §H[This.ContactCountry.GetName]§! không hề hay biết chút gì về hành động của chúng ta thì e là không thể."
 first_contact.320.desc.planet.normal.normal: "Một đội đặc nhiệm bí mật quả cảm đã trốn thoát khỏi lãnh thổ của §H[This.ContactCountry.GetName]§! cùng những con tin bị bắt từ thuộc địa thuộc hệ sao §H[abduction_planet.System.GetName]§!. Lợi dụng màn đêm che chở, họ đã hạ cánh xuống một vùng hẻo lánh trên hành tinh, bắt sống vài người ngoài hành tinh, đồng thời tiện tay nẫng luôn một số thiết bị phần cứng kỹ thuật. Những thứ này rất hữu ích cho việc giải mã ngôn ngữ cũng như đánh giá trình độ công nghệ của chúng.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.planet.normal.machine: "Một đội đặc nhiệm bí mật quả cảm đã trốn thoát khỏi lãnh thổ của §H[This.ContactCountry.GetName]§! cùng những con tin bị bắt từ thuộc địa thuộc hệ sao §H[abduction_planet.System.GetName]§!. Lợi dụng màn đêm che chở, họ đã hạ cánh xuống một vùng hẻo lánh trên hành tinh, rồi kinh ngạc phát hiện cư dân ở đây thực chất là những §Hdrone cơ khí§!. Dù sao thì, họ cũng đã bắt được vài chiếc drone mà không gây tổn hại gì, đồng thời tiện tay nẫng luôn một số thiết bị phần cứng kỹ thuật. Những thứ này rất hữu ích cho việc giải mã ngôn ngữ cũng như đánh giá trình độ công nghệ của chúng.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.planet.gestalt.normal: "Một nhóm drone dẫn đầu chiến dịch bí mật, dưới sự kiểm soát của [This.Leader.GetName], đã đổ bộ xuống một thuộc địa của §H[This.ContactCountry.GetName]§! nằm trong hệ sao §H[abduction_planet.System.GetName]§!. Chúng xoay sở hạ cánh xuống một vùng hẻo lánh trên hành tinh, bắt sống vài người ngoài hành tinh trước khi tẩu thoát, đồng thời tiện tay cuỗm luôn một số thiết bị phần cứng kỹ thuật. Những thứ này rất hữu ích cho việc giải mã ngôn ngữ cũng như đánh giá trình độ công nghệ của chúng.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.planet.hive.machine: "Một nhóm drone dẫn đầu chiến dịch bí mật, dưới sự kiểm soát của [This.Leader.GetName], đã đổ bộ xuống một thuộc địa của §H[This.ContactCountry.GetName]§! nằm trong hệ sao §H[abduction_planet.System.GetName]§!. Chúng xoay sở hạ cánh xuống một vùng hẻo lánh trên hành tinh, tuy nhiên ngoài dự liệu là cư dân trên hành tinh này thực chất lại là drone cơ khí. Dù vậy, chúng đã bắt giữ được vài chiếc drone nguyên vẹn trước khi tẩu thoát, đồng thời tiện tay cuỗm luôn một số thiết bị phần cứng kỹ thuật. Những thứ này rất hữu ích cho việc giải mã ngôn ngữ cũng như đánh giá trình độ công nghệ của chúng.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.planet.machine.machine: "Một nhóm drone dẫn đầu chiến dịch bí mật, dưới sự kiểm soát của [This.Leader.GetName], đã đổ bộ xuống một thuộc địa của §H[This.ContactCountry.GetName]§! nằm trong hệ sao §H[abduction_planet.System.GetName]§!. Chúng xoay sở hạ cánh xuống một vùng hẻo lánh trên hành tinh, rồi lập tức phát hiện cư dân ở đây thực chất là drone cơ khí —— có thể cũng bị một trí tuệ nhân tạo nào đó kiểm soát giống như [This.Owner.GetGovernmentName] của chính chúng ta. Dù vậy, chúng đã bắt giữ được vài chiếc drone nguyên vẹn trước khi tẩu thoát, đồng thời tiện tay cuỗm luôn một số thiết bị phần cứng kỹ thuật. Những thứ này rất hữu ích cho việc giải mã ngôn ngữ cũng như đánh giá trình độ công nghệ của chúng.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.no_planet.normal.normal: "Một đội đặc nhiệm bí mật quả cảm đã trốn thoát khỏi lãnh thổ của §H[This.ContactCountry.GetName]§! cùng một con tàu vận tải mà họ chặn bắt được ở hệ sao §H[abduction_system.GetName]§!. Phần lớn phi hành đoàn trên tàu đều được giữ mạng sống, thiết bị phần cứng và hệ thống máy tính của tàu cũng không bị hư hại gì đáng kể.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.no_planet.normal.machine: "Một đội đặc nhiệm bí mật quả cảm đã trốn thoát khỏi lãnh thổ của §H[This.ContactCountry.GetName]§! cùng một con tàu vận tải mà họ chặn bắt được ở hệ sao §H[abduction_system.GetName]§!. Nằm ngoài dự đoán của chúng ta, phi hành đoàn trên tàu đều là những §Hdrone cơ khí§! —— có lẽ được dẫn dắt bởi một trí tuệ nhân tạo mất kiểm soát —— chúng ta không có cách nào khuất phục và bắt giữ chúng mà chỉ gây ra tổn thương nhẹ. May mắn là tiểu đội của chúng ta đã bảo đảm phần lớn thiết bị phần cứng và hệ thống máy tính của tàu vẫn còn nguyên vẹn.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.no_planet.gestalt.normal: "Một nhóm drone dẫn đầu chiến dịch bí mật, dưới sự kiểm soát của [This.Leader.GetName], đã tìm cách không tặc một tàu tiếp tế nhỏ của §H[This.ContactCountry.GetName]§! trong hệ sao §H[abduction_system.GetName]§!. Phần lớn phi hành đoàn trên tàu đều được giữ mạng sống, thiết bị phần cứng và hệ thống máy tính của tàu cũng không bị hư hại gì đáng kể.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.no_planet.hive.machine: "Một nhóm drone dẫn đầu chiến dịch bí mật, dưới sự kiểm soát của [This.Leader.GetName], đã tìm cách không tặc một tàu tiếp tế nhỏ của §H[This.ContactCountry.GetName]§! trong hệ sao §H[abduction_system.GetName]§!. Nằm ngoài dự đoán của chúng ta, phi hành đoàn trên tàu đều là những §Hdrone cơ khí§!. Chúng ta đã xoay sở để khuất phục và bắt giữ chúng mà chỉ gây ra tổn thương nhẹ.\n\n$first_contact.320.desc.end$"
 first_contact.320.desc.no_planet.machine.machine: "Một nhóm drone dẫn đầu chiến dịch bí mật, dưới sự kiểm soát của [This.Leader.GetName], đã tìm cách không tặc một tàu tiếp tế nhỏ của §H[This.ContactCountry.GetName]§! trong hệ sao §H[abduction_system.GetName]§!. Kết quả là chúng ta phát hiện phi hành đoàn trên tàu đều là drone cơ khí —— có thể giống như một trí tuệ nhân tạo tương tự §H[This.Owner.GetGovernmentName]§! của chúng ta. Chúng ta đã xoay sở để khuất phục và bắt giữ chúng mà chỉ gây ra tổn thương nhẹ, đồng thời bảo đảm phần lớn thiết bị phần cứng và hệ thống máy tính của tàu vẫn còn nguyên vẹn.\n\n$first_contact.320.desc.end$"
 first_contact.320.A: "Thẩm vấn con tin."
 first_contact.320.A2: "Họ phải khai ra hết mọi bí mật."
 first_contact.320.A.tooltip: "Hạm đội của chúng ta nằm trong lãnh thổ của họ bắt đầu rút lui để tránh đòn trả đũa."
 first_contact.320.C.homicidal_tooltip: "Chúng ta cũng sẽ điều tra thiết bị bị tịch thu để tìm kiếm thêm manh mối về chúng.\n"
 first_contact.321.name: "Một sự cố không may"
 first_contact.321.desc.mega_oops: "Một tiểu đội vũ trang đặc nhiệm bí mật dũng cảm —— nhưng có lẽ hơi thiếu mưu trí —— đã rút lui thành công khỏi lãnh thổ của §H[This.ContactCountry.GetName]§! và mang theo vài con tin từ thuộc địa của họ trong hệ sao §H[abduction_planet.System.GetName]§!. Lợi dụng màn đêm che phủ, họ đã hạ cánh xuống một góc hẻo lánh của hành tinh và tóm gọn vài sinh vật có vú với những đốm đen trắng lớn, và bọn chúng chẳng hề phản kháng chút nào.\n\nKhông lâu sau, chúng ta nhận ra những sinh vật này không thể phát ra bất kỳ đặc điểm âm thanh nào để giao tiếp theo kiểu [This.ContactCountry.GetName], thực tế cũng chẳng có dấu hiệu nào cho thấy chúng là sinh vật có tri giác. Sau khi điều tra thêm, chúng ta đi đến kết luận rằng: chúng ta đã vô tình bắt nhầm gia súc của họ làm mẫu vật!\n\nThật không may, sau chiến dịch này, lực lượng tuần tra không gian của họ đã nâng cao cảnh giác, cho thấy họ đã phát hiện ra sự tồn tại của chúng ta —— khiến mọi nỗ lực trong tương lai của chúng ta đều cầm chắc thất bại thảm hại..."
 first_contact.321.A: "Thật đáng xấu hổ."
 first_contact.322.name: "Sự phản bội của [From.Owner.GetName]"
 first_contact.322.desc.planet: "Mặc dù một số người từ lâu đã lo ngại về việc những con tàu ngoài hành tinh vô danh xâm nhập vào không phận của chúng ta, mối đe dọa từ [From.Owner.GetName] cho đến tận bây giờ mới lộ rõ. Có vẻ như chúng đã cho một tiểu đội bí mật đổ bộ xuống một khu vực hẻo lánh trên [abduction_planet.GetName], còn bắt cóc luôn vài con tin [This.Owner.GetSpeciesName] sống, rồi tẩu thoát vào không gian sâu thẳm trước khi chúng ta kịp tổ chức đội cứu viện. Chúng ta chỉ có thể tưởng tượng những con tin này sẽ phải chịu đựng sự tra tấn khủng khiếp đến nhường nào trong tay kẻ bắt giữ."
 first_contact.322.desc.no_planet: "Mặc dù một số người từ lâu đã lo ngại về việc những con tàu ngoài hành tinh vô danh xâm nhập vào không phận của chúng ta, mối đe dọa từ [From.Owner.GetName] cho đến tận bây giờ mới lộ rõ. Có vẻ như chúng đã cử một tiểu đội bí mật chặn đứng tàu chở hàng của chúng ta tại hệ sao [abduction_system.GetName], tịch thu con tàu, và tẩu thoát vào không gian sâu thẳm trước khi chúng ta kịp tổ chức đội cứu viện. Chúng ta chỉ có thể tưởng tượng những con tin này sẽ phải chịu đựng sự tra tấn khủng khiếp đến nhường nào trong tay kẻ bắt giữ."
 first_contact.322.desc.planet.gestalt: "Chúng ta từng đánh giá việc cho phép người ngoài hành tinh vô danh xâm nhập không phận của mình là một rủi ro —— giờ đây đánh giá đó đã chứng minh là đúng. Có vẻ như [From.Owner.GetName] đã cho một tiểu đội bí mật đổ bộ xuống khu vực hẻo lánh trên [abduction_planet.GetName], bắt giữ vài chiếc drone [This.Owner.GetSpeciesName], cùng với một số thiết bị phần cứng của chúng ta, rồi tẩu thoát vào không gian sâu thẳm trước khi chúng ta kịp tổ chức một đội tiêu diệt chúng. Chúng ta chỉ có thể hy vọng chúng không tìm thấy quá nhiều giá trị từ những thứ mang đi."
 first_contact.322.desc.planet.wilderness: "Chúng ta từ lâu đã nghi ngờ việc cho phép một giống loài ngoài hành tinh vô danh vào không phận sẽ mang lại rủi ro lớn, và giờ sự thật chứng minh lo ngại của chúng ta không hề vô căn cứ. [From.Owner.GetName] rõ ràng đã tìm ra cách lén lút đổ bộ xuống bề mặt [abduction_planet.GetName], cô lập và bắt cóc vài sinh vật cộng sinh, sau đó lẩn trốn vào không gian sâu thẳm. Hành động mờ ám của chúng khiến chúng ta hoàn toàn bất lực trong việc ngăn chặn.\n\nĐối với hành vi xâm phạm đê hèn này, chúng ta cảm thấy vô cùng nhục nhã và xót xa. Nhưng điều an ủi duy nhất là bọn cướp bóc này sẽ chẳng vắt kiệt được bao nhiêu giá trị từ những mẫu vật chúng đánh cắp."
 first_contact.322.desc.no_planet.gestalt: "Chúng ta từng đánh giá việc cho phép người ngoài hành tinh vô danh xâm nhập không phận của mình là một rủi ro —— giờ đây đánh giá đó đã chứng minh là đúng. Có vẻ như [From.Owner.GetName] đã cử một tiểu đội bí mật chặn đứng một tàu tiếp tế của chúng ta tại hệ sao [abduction_system.GetName], tịch thu con tàu, rồi tẩu thoát vào không gian sâu thẳm trước khi chúng ta kịp tổ chức một đội tiêu diệt chúng. Chúng ta chỉ có thể hy vọng chúng không tìm thấy quá nhiều giá trị từ những thứ mang đi."
 first_contact.330.name: "Kế hoạch bắt cóc thất bại"
 first_contact.330.desc.disaster: "Chiến dịch bắt cóc con tin để thẩm vấn của chúng ta đã trở thành §Hmột thảm họa§!!"
 first_contact.330.desc.planet: "$first_contact.330.desc.disaster$ Một đội đặc nhiệm bí mật quả cảm do [This.Leader.GetName] dẫn đầu đã nỗ lực đổ bộ xuống một thuộc địa của §H[This.ContactCountry.GetName]§! tại hệ sao §H[abduction_planet.System.GetName]§!. Tuy nhiên, ngay khi họ vừa đáp xuống, chúng ta lập tức mất liên lạc. Ở giai đoạn hiện tại, chúng ta không thể hy vọng họ có cơ may trốn thoát sự truy lùng. Thật không may, chúng ta sẽ không bao giờ biết liệu họ được giữ mạng sống hay bị hành quyết sau nhiều giờ tra tấn trong tay người ngoài hành tinh."
 first_contact.330.desc.planet.gestalt: "$first_contact.330.desc.disaster$ Một nhóm drone dẫn đầu chiến dịch bí mật, dưới sự kiểm soát của [This.Leader.GetName], đã nỗ lực đổ bộ xuống một thuộc địa của §H[This.ContactCountry.GetName]§! tại hệ sao §H[abduction_planet.System.GetName]§!. Tuy nhiên, ngay khi chúng vừa đáp xuống, chúng ta lập tức mất liên lạc. Ở giai đoạn hiện tại, chúng ta buộc phải giả định rằng chúng đã bị bắt hoặc bị tiêu diệt. Thật không may, chúng ta sẽ không bao giờ biết kẻ địch đã vắt kiệt được bao nhiêu thông tin tình báo từ chúng trước khi chúng bị phá hủy vĩnh viễn."
 first_contact.330.desc.no_planet: "$first_contact.330.desc.disaster$ Một tiểu đội quả cảm thuộc lực lượng đặc nhiệm bí mật do [This.Leader.GetName] chỉ huy đã cố gắng chiếm giữ một tàu chở hàng của §H[This.ContactCountry.GetName]§! trong hệ sao §H[abduction_system.GetName]§!. Tuy nhiên, họ đã không nhận ra mục tiêu mình chọn được trang bị vũ trang tốt hơn dự kiến —— và cũng không nhận ra có vài tàu chiến đang ẩn nấp xung quanh khu vực. Trong lúc vội vã rút lui, tàu của họ đã bị phá hủy."
 first_contact.330.desc.no_planet.gestalt: "$first_contact.330.desc.disaster$ Một nhóm drone dẫn đầu chiến dịch bí mật, dưới sự kiểm soát của [This.Leader.GetName], dự định không tặc một tàu tiếp tế của §H[This.ContactCountry.GetName]§! trong hệ sao §H[abduction_system.GetName]§!. Tuy nhiên, mục tiêu chúng chọn có mức độ vũ trang cao hơn đánh giá ban đầu, và chúng cũng không lường trước được việc có vài tàu chiến ẩn nấp quanh đó. Tàu của drone đã bị phá hủy trong lúc vội vã rút lui."
 first_contact.330.A: "Thật không may..."
 first_contact.332.name: "$first_contact.322.name$"
 first_contact.332.desc.planet.start: "Mặc dù một số người từ lâu đã lo ngại về việc những con tàu ngoài hành tinh vô danh xâm nhập vào không phận của chúng ta, mối đe dọa từ [From.Owner.GetName] cho đến tận bây giờ mới lộ rõ. Có vẻ như chúng đã cho một tiểu đội bí mật đổ bộ xuống một khu vực hẻo lánh trên [abduction_planet.GetName], định bắt cóc vài con tin; tuy nhiên, nhờ hệ thống cảnh báo sớm, chúng ta đã kịp triển khai đội đặc nhiệm của mình cắt đứt đường rút lui của chúng. Lần tới muốn giở trò ngu ngốc này, chúng sẽ phải suy nghĩ lại đấy!"
 first_contact.332.desc.planet.gestalt.start: "Chúng ta từng đánh giá việc cho phép một hạm đội ngoài hành tinh vô danh tiến vào không phận là khá rủi ro —— và điều này đã chứng minh là đúng. Có vẻ như [From.Owner.GetName] đã cho một tiểu đội đặc vụ đổ bộ xuống góc hẻo lánh của [abduction_planet.GetName]. Tuy nhiên, nhờ hệ thống phát hiện mối đe dọa dự báo, chúng ta đã kịp triển khai đội đặc nhiệm của mình cắt đứt đường rút lui của chúng. Lần tới muốn giở trò này, chúng chắc chắn sẽ phải cân nhắc kỹ!"
 first_contact.332.desc.no_planet.end: "Nhưng tình cờ làm sao, chúng ta lại có sẵn vài chiếc tàu chiến ngụy trang gần đó và có thể nhanh chóng có mặt tại hiện trường.\n\nTàu địch đã bị tiêu diệt khi cố gắng bỏ trốn, nhưng có thể vẫn còn một số thông tin hữu ích sót lại ở đó."
 first_contact.332.desc.planet: "$first_contact.332.desc.planet.start$\n\nCó vẻ như kẻ tấn công chúng ta —— một nhóm người ngoài hành tinh [From.Owner.GetSpeciesClass] —— đã được lệnh tự kết liễu mạng sống thay vì để bị bắt, nhưng tình huống này dĩ nhiên lại mang đến cho các [This.Owner.GetResearchers] của chúng ta vô vàn tài liệu để điều tra."
 first_contact.332.desc.planet.machine_enemy: "$first_contact.332.desc.planet.start$\n\nCó vẻ như kẻ tấn công chúng ta —— một nhóm drone cơ khí, có thể bị điều khiển bởi một trí tuệ nhân tạo mất kiểm soát —— đã được lệnh tự hủy thay vì để bị bắt, nhưng sự cố này dĩ nhiên lại cung cấp cho các [This.Owner.GetResearchers] của chúng ta vô vàn tài liệu để điều tra."
 first_contact.332.desc.no_planet: "Dù một số người lo ngại về việc tàu ngoài hành tinh vô danh xâm nhập không phận của chúng ta, nhưng mãi đến giờ chúng ta vẫn chưa rõ [From.Owner.GetName] thực sự tạo thành mối đe dọa lớn cỡ nào. Có vẻ như chúng đã cử một đội bí mật đến chặn đánh một tàu chở hàng của chúng ta tại hệ sao [abduction_system.GetName]; $first_contact.332.desc.no_planet.end$"
 first_contact.332.desc.planet.gestalt: "Chúng ta từng đánh giá việc cho phép hạm đội ngoài hành tinh vô danh vào không gian là khá rủi ro —— và điều này đã chứng minh là đúng. Có vẻ như [From.Owner.GetName] đã cho một tiểu đội đặc vụ đổ bộ xuống góc hẻo lánh của [abduction_planet.GetName]. Tuy nhiên, nhờ hệ thống phát hiện mối đe dọa dự báo, chúng ta đã kịp triển khai đội đặc nhiệm của mình cắt đứt đường rút lui của chúng. Lần tới muốn giở trò này, chúng chắc chắn sẽ phải cân nhắc kỹ!\n\nCó vẻ như kẻ địch —— một nhóm người ngoài hành tinh [From.Owner.GetSpeciesClass] —— đã được lệnh tự sát thay vì để bị bắt, nhưng sự cố này không nghi ngờ gì nữa đã mang đến cho các [This.Owner.GetResearchers] của chúng ta vô vàn tài liệu để điều tra."
 first_contact.332.desc.planet.wilderness: "Chúng ta từ lâu đã biết việc cho phép một giống loài ngoài hành tinh vô danh xâm nhập không phận sẽ mang lại rủi ro lớn, và giờ sự thật chứng minh lo ngại của chúng ta hoàn toàn chính xác. [From.Owner.GetName] gần như đã lén lút đổ bộ thành công một đội xuống bề mặt [abduction_planet.GetName], với mưu đồ bắt cóc nhiều sinh vật cộng sinh và đánh cắp công nghệ của chúng ta. Nhưng chúng đã đánh giá quá thấp tính liên kết chặt chẽ của chúng ta. Ngay khi hành vi vi phạm giao thức của những kẻ xâm nhập bị vạch trần, chúng lập tức phải hứng chịu một đợt phản công dữ dội.\n\nTiểu đội tập kích gồm những người ngoài hành tinh [From.Owner.GetSpeciesClass] này sau khi thất bại dường như đã nhận được lệnh tự hủy để tránh bị bắt. Mặc dù vậy, sự kiện xâm nhập này vẫn cung cấp một lượng lớn mẫu vật để các [This.Owner.GetResearchers] của chúng ta nghiên cứu."
 first_contact.332.desc.planet.gestalt.machine_enemy: "$first_contact.332.desc.planet.gestalt.start$\n\nCó vẻ như kẻ tấn công chúng ta —— một nhóm drone cơ khí, có thể bị điều khiển bởi một trí tuệ nhân tạo mất kiểm soát —— đã được lệnh tự hủy thay vì để bị bắt, nhưng sự cố này không nghi ngờ gì nữa đã mang đến cho các [This.Owner.GetResearchers] của chúng ta vô vàn tài liệu để điều tra."
 first_contact.332.desc.planet.gestalt.machine_enemy.machine: "$first_contact.332.desc.planet.gestalt.start$\n\nCó vẻ như kẻ tấn công chúng ta —— một nhóm drone cơ khí, có thể là một trí tuệ nhân tạo giống hệt [This.Owner.GetGovernmentName] của chúng ta —— đã nhận lệnh thà tự hủy còn hơn bị bắt, tuy nhiên sự cố này không nghi ngờ gì nữa đã cung cấp cho các [This.Owner.GetResearchers] của chúng ta vô vàn tài liệu để nghiên cứu."
 first_contact.332.desc.no_planet.gestalt: "Chúng ta từng đánh giá việc cho phép người ngoài hành tinh vô danh xâm nhập không phận của mình là một rủi ro —— giờ đây đánh giá đó đã chứng minh là đúng. Có vẻ như [From.Owner.GetName] đã cử một đội hành động bí mật chặn đứng một tàu hậu cần của chúng ta tại hệ sao [abduction_system.GetName]; $first_contact.332.desc.no_planet.end$"
 first_contact.332.A: "Chúng ta nên nghiên cứu mảnh vỡ của chúng để tìm manh mối."
 #Ăn nói Ẩn ý
 first_contact.350.name: "Kẻ Nói Ẩn Ý"
 first_contact.350.desc: "Mặc dù ban đầu chúng ta đã đạt được đôi chút thành công trong việc suy luận ra nền tảng ngôn ngữ mà §H[This.ContactCountry.GetName]§! sử dụng, nhưng sau đó tiến trình thiết lập giao tiếp có ý nghĩa với họ lại rơi vào bế tắc. Dường như họ đang nói một loại §Hẩn ý kỳ lạ§!, truyền đạt ý nghĩa thông qua một dạng cụm từ súc tích nhưng không mang nhiều ý nghĩa thực sự, và chúng ta chỉ có thể đoán mò mức độ quan trọng của nó."
 first_contact.350.A: "Thật khó hiểu. Chúng ta cần thu thập lượng mẫu lớn hơn."
 first_contact.355.name: "Một loại ngôn ngữ ẩn dụ"
 first_contact.355.desc: "Cùng với việc điều tra sâu hơn về §H[This.ContactCountry.GetName]§! —— giờ đây chúng ta đã biết họ là §H[This.ContactCountry.GetRealName]§! —— cuối cùng chúng ta cũng nhận ra những cụm từ họ sử dụng thường hay mượn các điển tích về những sự kiện lớn, nổi tiếng xảy ra vào một thời điểm nào đó trong quá khứ. Ý nghĩa của những điển tích này hiển nhiên ai cũng biết trong nội bộ tộc của họ, dùng để diễn đạt cảm xúc, hoặc mô tả một trạng thái sự việc.\n\nMay mắn thay, có vẻ như hình thức ngôn ngữ này không phải là phiên bản duy nhất, mà chỉ đóng vai trò như kiểu §H“giọng cao cấp”§!, dùng trong các dịp chính thức hoặc lúc các bậc trí giả giao lưu. Một ngữ pháp §H“giọng bình dân”§! phổ biến hơn thường được dùng trong các dịp không chính thức, đặc biệt là giữa giới trẻ hoặc những kẻ §Hhọc vấn không cao§!. Thật không may, việc dùng “giọng bình dân” giao tiếp với một người có địa vị cao là một hành vi mang ý nghĩa xúc phạm nặng nề, nếu chúng ta giao tiếp với họ theo cách đó, họ chắc chắn sẽ coi chúng ta như một giống loài có trí tuệ ngang ngửa trẻ con..."
 first_contact.355.desc.gestalt: "Cùng với việc điều tra sâu hơn, §H[This.ContactCountry.GetName]§! —— giờ chúng ta đã biết tên gọi là §H[This.ContactCountry.GetRealName]§! —— những câu từ họ sử dụng thực chất là một dạng mã hóa mà chúng ta chưa nắm được chìa khóa. Rõ ràng chúng ám chỉ đến những sự kiện vốn là kiến thức chung giữa những [This.ContactCountry.GetSpeciesNamePlural] của họ, có thể là cách nói rút gọn để diễn đạt cảm xúc hoặc tình huống.\n\nMay mắn thay, họ không phải lúc nào cũng dùng loại §H“ngôn ngữ cao cấp”§! này để giao tiếp, trừ khi thảo luận về các vấn đề hệ trọng. Một loại §H“ngôn ngữ bình dân”§! song song dễ hiểu hơn được áp dụng trong các trường hợp không chính thức, đặc biệt là giữa các cá thể trẻ và cá thể §Htrí tuệ thấp§!. Tuy nhiên, có vẻ như những cá thể cấp cao cực kỳ khinh bỉ những kẻ dùng “ngôn ngữ bình dân”, nói cách khác, họ có thể đang giao tiếp với chúng ta bằng một thái độ coi trí tuệ của chúng ta như trẻ con..."
 first_contact.355.A: "Hiểu rồi, thế thì dùng “giọng bình dân” để đối đáp với họ."
 first_contact.355.B: "Chúng ta chắc chắn có thể nói được ngôn ngữ thực sự của họ."
 first_contact.356.name: "Liên lạc với [This.ContactCountry.GetName]"
 first_contact.356.desc: "[This.Owner.GetEnvoyCap] [This.Leader.GetName] khựng lại một lát, trông có vẻ bối rối. Chúng ta đã thu thập được vài cụm từ từ phần đầu thông điệp của họ. Vậy chúng ta nên chào hỏi họ như thế nào?"
 first_contact.356.A1: "[riddles_leader_1.GetFirstName], [riddles_leader_1.Species.GetHandNamePlural] của [riddles_leader_1.GetHerHis] đang vẫy gọi."
 first_contact.356.A2: "[riddles_leader_1.GetFirstName], khi pháo đài rung chuyển."
 first_contact.356.A3: "[riddles_leader_1.GetFirstName], nghỉ."
 first_contact.356.B1: "[riddles_leader_2.GetFirstName], [riddles_leader_2.Species.GetEarNamePlural] của [riddles_leader_2.GetHerHis] đang lắng nghe."
 first_contact.356.B2: "[riddles_leader_2.GetFirstName], lớn tiếng [riddles_leader_2.Species.GetRandomSpeciesSound]."
 first_contact.356.B3: "[riddles_leader_2.GetFirstName], đã mở mắt của [riddles_leader_2.GetHerHis]."
 first_contact.356.C: "Cẩn tắc vô áy náy, chuyện này cứ an toàn là trên hết."
 first_contact.356.option.tooltip: "Nếu chúng ta dùng đúng cách chào, §H[This.ContactCountry.GetSpeciesNamePlural]§! sẽ cực kỳ §Gấn tượng§! về chúng ta, nhưng nếu sai, họ sẽ cảm thấy bị §Hxúc phạm§!.\n"
 first_contact.357.name: "Cách chào hỏi tuyệt vời nhất"
 first_contact.357.desc: "Phát ngôn của chúng ta lập tức nhận được phản hồi. Nụ cười —— ít nhất thì chúng ta tin đó là một biểu cảm tương tự như mỉm cười —— lan tỏa giữa những §H[This.ContactCountry.GetSpeciesNamePlural]§!, họ nói vài cụm từ, sử dụng những từ ngữ mang thái độ §Hthân thiện§! không thể nghi ngờ. Có vẻ như chúng ta đã chọn đúng cách chào."
 first_contact.357.A: "Đây là một nhóm người dễ chịu."
 first_contact.357.B: "Họ không coi chúng ta là những kẻ vô giá trị, đó là điều tốt."
 first_contact.357.C: "Chúng ta có thể mượn cơ hội này để tìm hiểu thêm thông tin về họ."
 first_contact.357.C.tooltip: "Mạng lưới gián điệp tại §Y[This.ContactCountry.GetRealName]§! tăng §G+25%§!\n"
 first_contact.358.name: "Một lựa chọn tồi tệ"
 first_contact.358.desc: "Ngay khi lời nói vừa vuột khỏi miệng, rõ ràng là chúng ta đã chọn sai. §H[This.ContactCountry.GetSpeciesNamePlural]§! giữ im lặng một hồi lâu, sau đó chúng ta phải hứng chịu một tràng lên án gay gắt như súng liên thanh. Rõ ràng là họ có ý đồ §Hthù địch§!, mặc dù ý nghĩa chính xác mà họ muốn truyền đạt vẫn chưa rõ —— ban đầu chúng ta định tạo ấn tượng với [This.ContactCountry.GetSpeciesNamePlural], kết quả lại thành ra §Hsỉ nhục§! họ.\n\nNhìn về mặt tích cực thì ít nhất giờ đây chúng ta có thể giao tiếp với họ rồi, ở một khía cạnh nào đó."
 first_contact.358.A: "Rồi họ sẽ quen dần thôi."
 #Tiếng ồn Kỳ dị
 first_contact.365.name: "Tiếng ồn Kinh hoàng"
 first_contact.365.desc: "Thứ tiếng ồn này —— nghe như pha trộn giữa những tiếng gầm rú kinh hoàng và tiếng kim loại §Hcào cấu§! —— huyên náo trong vài giây, rồi kết thúc bằng một tiếng ồn §Hrú rít§! chói tai, khiến tất cả những người có mặt đều phải §Hrùng mình§!.\n\nNgay khi [This.Owner.GetEnvoy] §H[This.Leader.GetName]§! cứ ngỡ thứ âm thanh khủng khiếp ấy đã lắng xuống, chúng lại bắt đầu dữ dội hơn. [This.Leader.GetSheHeCap] cố kén sự khó chịu mà tắt máy thu. [This.Leader.GetSheHeCap] quay sang đám quan chức đang xúm xít lại, một vài người thậm chí sợ đến mức nấp ra sau lưng ghế.\n“Chà, ghê gớm thật...” [This.Leader.GetSheHeCap] nói một cách yếu ớt.\n\nKhó mà tưởng tượng nổi những tiếng ồn do giống loài đến từ §H[This.ContactCountry.GetName]§! phát ra này lại không mang tính thù địch. Các sĩ quan hải quân đã tính đến trường hợp xấu nhất, cho rằng chúng ta sẽ sớm phải giao chiến với chúng, trong khi những tiếng nói bình tĩnh hơn lại bảo chúng ta cần kiên nhẫn chờ đợi và quan sát thêm."
 first_contact.365.A: "Họ không thể quyết định việc mình sẽ phát ra thứ âm thanh gì. Sau này chúng ta sẽ thấu hiểu họ thôi."
 first_contact.365.B: "Đây là một lời khiêu khích. Cho chúng nghe chút tiếng ồn đi!"
 first_contact.365.B.tooltip: "Khó mà đoán được §Y[This.ContactCountry.GetName]§! sẽ phản ứng ra sao trước chuyện này.\n"
 first_contact.365.C: "Chuẩn bị chiến tranh."
 first_contact.365.C.pacifist: "Chúng ta phải chuẩn bị cho cuộc chiến không thể tránh khỏi."
 first_contact.365.C.tooltip: "Người không phạm ta, ta không phạm người."
 first_contact.370.name: "Phản hồi của [This.ContactCountry.GetName]"
 first_contact.370.desc1: "Phản hồi của chúng ta dường như khiến §H[This.ContactCountry.GetName]§! hơi cạn lời. Sau đó rất nhanh, chúng hoàn toàn im bặt, và chúng ta hiếm khi nghe thêm tin tức gì từ chúng nữa. Chúng ta cũng chỉ có thể phỏng đoán hàm ý trong đó.\n\nTrong khi đó, các [This.Owner.GetLinguists] của chúng ta đã và đang nỗ lực dịch phần ngôn ngữ đã biết của chúng. Chỉ cần họ có bước tiến, chúng ta có hy vọng sẽ hiểu được những thứ này."
 first_contact.370.desc2: "§H[This.ContactCountry.GetName]§! đã phản ứng lại lời khiêu khích của chúng ta bằng cách tăng cường cường độ truyền tín hiệu lên đáng kể. Giờ thì chúng ồn đến mức [This.Owner.GetSpeciesEarNamePlural] không thể chịu nổi nữa, nhưng bằng cách giảm mạnh âm lượng xuống, các [This.Owner.GetLinguists] của chúng ta có thể thu thập được lượng dữ liệu khổng lồ, họ tin rằng đây có thể là chìa khóa để dịch ngôn ngữ ngoài hành tinh —— giả sử như đâu đó trong đống tiếng ồn này có thể tìm thấy một loại ngôn ngữ."
 first_contact.375.name: "[This.ContactCountry.GetName] giải thích"
 first_contact.37X.desc.base: "Chúng ta đã giải mã đủ nhiều ngôn ngữ của §H[This.ContactCountry.GetRealName]§!, giờ đây chúng ta có thể §Hliên lạc§! với họ —— và hiểu được những lần phát sóng trước đó của họ."
 first_contact.375.desc: "$first_contact.37X.desc.base$\n\nSự thật chứng minh, lời giải thích rất đơn giản, nhưng cũng rất đáng sợ. Chúng ta vẫn chưa rõ nguyên nhân nào khiến xã hội của họ phát triển đến nhường này, nhưng thực tế đã chứng minh, [This.ContactCountry.GetSpeciesNamePlural] toàn tâm toàn ý muốn §Htiêu diệt§! tất cả các dạng sống có tri giác và không phải [This.ContactCountry.GetSpeciesName]. Chúng tin rằng những người này là sự sỉ nhục đối với mọi điều đúng đắn và tốt đẹp trong vũ trụ.\n\nĐó là lý do tại sao, khi phát hiện ra chúng ta, chúng bắt đầu phát thanh lời chào tiêu chuẩn của mình —— chiến ca. Chúng ta chỉ có thể cho rằng tàu chiến của chúng sẽ nhanh chóng đuổi theo."
 first_contact.375.A.militarist: "Chúng ta sẽ chuẩn bị sẵn sàng để đối mặt với chúng."
 first_contact.375.A.xenophobe: "Cảm xúc có thể thông cảm được."
 first_contact.375.A.materialist: "Bọn chúng làm ăn kém hiệu quả thật."
 first_contact.375.A.others: "Thật khủng khiếp."
 first_contact.376.name: "$first_contact.375.name$"
 first_contact.376.desc: "$first_contact.37X.desc.base$\n\nCó vẻ như [This.ContactCountry.GetSpeciesNamePlural] đúng như những gì chúng ta dự tính là một §Hxã hội hiếu chiến§!, họ dùng những tiếng thét xung phong đầy đe dọa nhất để chào hỏi nhằm thử thách sự can đảm của chúng ta. May mắn thay, sự đáp trả của chúng ta đã tạo được tiếng vang, rõ ràng chúng ta đã giành được sự tôn trọng từ họ. Trên thực tế, họ coi khí phách chiến binh của chúng ta chỉ đứng thứ hai sau họ."
 first_contact.376.A.mil: "Họ nói đúng."
 first_contact.376.A.pac: "Chỉ mong sao họ không bao giờ phát hiện ra mình đã lầm!"
 first_contact.376.A.other: "Tôi đoán là... cũng được?"
 first_contact.377.name: "$first_contact.375.name$"
 first_contact.377.desc: "$first_contact.37X.desc.base$\n\nMặc dù ban đầu các [This.Owner.GetLinguists] của chúng ta tỏ ra hoài nghi, nhưng có vẻ như những tín hiệu mà chúng ta thu nhận được quả thực là ngôn ngữ của họ, chỉ có điều [This.Owner.GetSpeciesEarNamePlural] của chúng ta rất khó tiếp thu mà thôi. Dù hầu hết các nỗ lực phản hồi của chúng ta không được họ thấu hiểu, nhưng có vẻ như họ cảm thấy bị xúc phạm bởi kiểu nhại lại vụng về của chúng ta, đặc biệt là vì chúng ta đã vô tình lặp đi lặp lại một âm thanh cực kỳ giống với kiểu §Hsỉ nhục thô tục nhất§! trong ngôn ngữ của họ. Phải mất một khoảng thời gian dài thì chúng ta mới thay đổi được ấn tượng ban đầu này."
 first_contact.377.A: "Một sai lầm đáng tiếc."
 first_contact.377.B: "Tốt thôi. Dù sao chúng ta cũng chẳng bao giờ nghĩ đến việc làm bạn với chúng."
 first_contact.378.name: "$first_contact.375.name$"
 first_contact.378.desc: "$first_contact.37X.desc.base$\n\nCó vẻ như [This.ContactCountry.GetSpeciesNamePlural] là một §Hxã hội hiếu chiến§!, họ dùng những tiếng thét xung phong đầy đe dọa nhất để chào hỏi nhằm thử thách sự can đảm của chúng ta. Đáng tiếc là, thái độ cẩn trọng khi dịch ngôn ngữ của chúng ta đồng nghĩa với việc lời khiêu khích của họ không được đáp trả trực diện, khiến họ kết luận rằng chúng ta là một nền §Hvăn minh hèn nhát§!. Phải mất một khoảng thời gian dài thì chúng ta mới thay đổi được ấn tượng ban đầu này."
 first_contact.378.A.mil: "Việc này không ổn rồi!"
 first_contact.378.A.other: "Sao cũng được."
 first_contact.379.name: "$first_contact.375.name$"
 first_contact.379.desc: "$first_contact.37X.desc.base$\n\nMặc dù ban đầu chúng ta tỏ ra hoài nghi, nhưng có vẻ như những tín hiệu mà chúng ta thu nhận được quả thực là ngôn ngữ của họ, chỉ có điều [This.Owner.GetSpeciesEarNamePlural] của chúng ta rất khó tiếp thu mà thôi. May mắn thay, chúng ta đã tiến hành điều tra nghiêm túc và đáp trả điều mà nhiều người cho là hành vi khiêu khích của [This.ContactCountry.GetSpeciesNamePlural], và sự đáp trả của chúng ta chắc chắn sẽ là lối thoát giúp ta rũ bỏ bước khởi đầu tồi tệ này. Điều này cũng chứng minh sự sáng suốt của những ai chủ trương hành động cẩn trọng."
 first_contact.379.A: "Đừng vội vã đưa ra kết luận thì bao giờ cũng tốt..."
 first_contact.379.A.mat: "Thắng lợi của lý trí."
 first_contact.380.name: "Phương án cá thể hóa"
 first_contact.380.desc.proactive: "Một phần cũng nhờ vào việc §H[This.ContactCountry.GetName]§! hiển nhiên đang rất khao khát thiết lập liên lạc với chúng ta, họ đã gửi đi một lượng lớn các §Htín hiệu§! nghe nhìn và trở thành chìa khóa để dịch ngôn ngữ của họ, nhờ đó các cá thể thợ dịch thuật của chúng ta mới có thể công bố một phát hiện đáng kinh ngạc: Những người ngoài hành tinh này dường như được tổ chức dưới dạng §Hcá thể§! chứ không phải Ý thức Bầy đàn. Họ dường như có thể đưa ra rất ít hành động mang tính tập thể. Khó hiểu nhất là, họ thường phối hợp với nhau rất tệ, và dường như hoàn toàn không biết những cá thể thợ khác đang làm gì.\n\n$first_contact.380.desc.end$"
 first_contact.380.desc.proactive.wilderness: "Do phía §H[this.ContactCountry.GetName]§! thể hiện rõ ý muốn thiết lập liên lạc với chúng ta, chúng ta đã xác nhận một khám phá vô cùng hấp dẫn: những dạng sống này tồn tại và hoạt động dưới hình thức §Hcá thể§!, chứ không phải dạng thức tập hợp!\n\n$first_contact.380.desc.wilderness_outro$"
 first_contact.380.desc.cautious: "Dù chúng ta đã nỗ lực thu thập đủ tín hiệu để các cá thể thợ dịch thuật hiểu được §H[This.ContactCountry.GetName]§!, báo cáo mới nhất vẫn gây sốc: người ngoài hành tinh mà chúng ta chạm trán ban đầu ở hệ sao §H[This.System.GetName]§! có vẻ như được tổ chức dưới dạng §Hcá thể§! chứ không phải Ý thức Bầy đàn. Họ dường như có thể đưa ra rất ít hành động mang tính tập thể. Khó hiểu nhất là, họ thường phối hợp với nhau rất tệ, và dường như hoàn toàn không biết những cá thể thợ khác đang làm gì.\n\n$first_contact.380.desc.end$"
 first_contact.380.desc.cautious.wilderness: "Mặc dù phía §H[this.ContactCountry.GetName]§! tỏ ra không mấy mặn mà trong việc giao tiếp với chúng ta, nhưng thông qua những nỗ lực của mình, chúng ta đã xác nhận một khám phá vô cùng hấp dẫn: những dạng sống sống ẩn dật này tồn tại và hoạt động dưới hình thức §Hcá thể§!, chứ không phải dạng ý thức bầy đàn!\n\n$first_contact.380.desc.wilderness_outro$"
 first_contact.380.desc.end: "Chúng ta vẫn chưa hiểu làm thế nào chúng có thể duy trì mức trí tuệ đủ để phát triển đến mức độ du hành không gian. Có lẽ đằng sau chúng vẫn còn một mối liên kết nào đó, nhưng các cá thể con trong đó chỉ đơn giản là tự chủ và độc lập hơn so với những gì chúng ta từng biết?"
 first_contact.380.desc.wilderness_outro: "Chúng ta vẫn chưa thể hiểu đầy đủ cách thức sinh sống này mang lại hiệu quả như thế nào đối với loại sinh vật ngoài hành tinh này. Có lẽ giữa chúng và hành tinh mẹ tồn tại một mối liên kết nào đó mà hiện tại chúng ta khó lòng tưởng tượng ra chăng?"
 first_contact.380.A: "Chúng ta cần tìm hiểu sâu hơn về họ."
 first_contact.380.A.devourer: "Tất nhiên là chúng vẫn sẽ rất ngon miệng."
 first_contact.385.name: "Nền văn minh của các cá thể"
 first_contact.385.desc.start: "Các cá thể con dịch thuật của chúng ta đã đạt được bước đột phá trong nỗ lực giải mã tín hiệu thu nhận từ §H[This.ContactCountry.GetName]§!, và giờ đây đã đủ tự tin để cho phép chúng ta giao tiếp với chúng ở mức độ cao, nhằm mở ra kênh ngoại giao. Các cuộc điều tra của chúng cũng đã xác nhận suy đoán của chúng ta: §H[This.ContactCountry.GetSpeciesNamePlural]§! (tên gọi đúng mà giờ ta đã biết) hoàn toàn không có bất kỳ dạng trí tuệ tập thể nào, và được cấu thành từ các cá thể có khả năng suy nghĩ độc lập, tập hợp lại với nhau vì một lý do nào đó mà chúng ta chưa thể hiểu đúng đắn, và tự xưng là §H[This.ContactCountry.GetGovernmentName]§!."
 first_contact.385.desc.non_devourer: "$first_contact.385.desc.start$\n\nViệc phát hiện ra nền văn minh bậc cao được tạo nên từ các cá thể đã khiến chúng ta phải trăn trở về vô số giả thuyết liên quan đến bản chất vũ trụ. Chúng ta đã phân bổ một phần nguồn lực không nhỏ để tìm hiểu xem chính xác thì họ đã phát triển và khắc phục những khiếm khuyết sinh ra từ việc thiếu đi trí tuệ tập thể như chúng ta đã biết ra sao."
 first_contact.385.desc.devourer: "$first_contact.385.desc.start$\n\nMặc dù các cá thể của [This.ContactCountry.GetSpeciesName] trông có vẻ rất ngon miệng và chúng ta khao khát được nuốt chửng chúng, nhưng chúng ta vẫn phân bổ một phần không nhỏ nguồn lực để điều tra xem chính xác thì chúng đã phát triển và vượt qua những khiếm khuyết bắt nguồn từ việc thiếu đi trí tuệ tập thể như chúng ta đã biết ra sao."
 first_contact.385.desc.wilderness: "Chúng ta đã đạt được những bước đột phá trong việc giao tiếp với §H[This.ContactCountry.GetName]§!. Khi hiểu được cách các cá thể này quy nạp cấu trúc xã hội phức tạp của mình thành một số lượng nhỏ các nhóm trừu tượng —— điều này về cơ bản không khác mấy so với quần xã sinh vật, quần thể và nhánh sinh học của chính chúng ta —— chúng ta nhận ra cách để đạt được sự đồng thuận sâu sắc hơn với những §H[This.ContactCountry.GetSpeciesNamePlural]§! này.\n\nMặc dù sự khác biệt to lớn về thước đo ý thức vẫn khiến hoạt động ngoại giao đầy rẫy thách thức, nhưng chúng ta có hy vọng đạt được sự phối hợp thông qua các cấu trúc xã hội mà những [This.ContactCountry.GetSpeciesNamePlural] này sinh sống, thứ mà họ gọi là \"[This.ContactCountry.GetGovernmentName]\". Chúng ta sẽ liên tục theo dõi những tác động sâu xa do cấu trúc xã hội này mang lại —— dẫu cho dưới góc nhìn của nền văn minh hành tinh chúng ta, chúng thật xa lạ và đầy rẫy sự hỗn mang."
 first_contact.385.A: "Thật đáng bối rối... nhưng cũng thật thú vị."
 first_contact.385.A.devourer: "Chúng ta cũng có thể chơi đùa với đồ ăn mà..."
 first_contact.390.name: "Chạm trán phi robot"
 first_contact.390.desc.proactive: "$first_contact.390.desc.intro.proactive$\n\n$first_contact.390.desc.end$"
 first_contact.390.desc.wilderness.proactive: "$first_contact.390.desc.intro.proactive$\n\n$first_contact.390.desc.end.wilderness$"
 first_contact.390.desc.cautious: "$first_contact.390.desc.intro.cautious$\n\n$first_contact.390.desc.end$"
 first_contact.390.desc.wilderness.cautious: "$first_contact.390.desc.intro.cautious$\n\n$first_contact.390.desc.end.wilderness$"
 first_contact.390.desc.intro.proactive: "Phía §H[This.ContactCountry.GetName]§! dường như rất háo hức thiết lập liên lạc với chúng ta. Họ đã gửi đến một đoạn §Htruyền dẫn§! nghe nhìn khổng lồ, điều này có thể mang lại chìa khóa để dịch ngôn ngữ của họ. Nhờ vậy, chúng ta có thể báo cáo một phát hiện đáng lo ngại: những người ngoài hành tinh này là một nền văn minh §Hhữu cơ§!, và có khả năng du hành không gian."
 first_contact.390.desc.intro.cautious: "Chúng ta đã rất vất vả mới lấy được đủ dữ liệu để các drone dịch thuật phân tích §H[This.ContactCountry.GetName]§!. Tuy nhiên, báo cáo mới nhất lại vô cùng đáng lo ngại —— nền văn minh ngoài hành tinh mà chúng ta đụng độ ban đầu tại hệ sao §H[This.System.GetName]§!, lại là một nền văn minh du hành không gian được cấu thành từ các §Hsinh vật hữu cơ§!."
 first_contact.390.desc.end: "Mặc dù sử dụng máy tính và cơ giới, nhưng chúng còn lâu mới tối tân bằng những đấng sáng tạo ra chúng ta trước khi họ bị thay thế. Việc con đường phát triển như vậy lại khả thi quả thực là một kết quả bất ngờ đối với các bộ vi xử lý của chúng ta. Chúng ta cần điều tra hiện tượng này sâu hơn nữa."
 first_contact.390.desc.end.wilderness: "Khác với mọi mô hình lý thuyết dựa trên hình ảnh của các đấng sáng tạo từ trước đến nay, thực thể này có vẻ như đang hoạt động theo một phương thức khá giống với mạng lưới phân tán của chính chúng ta. Điều đó có nghĩa là, chúng ta vẫn chưa thể xác định liệu có một trí tuệ trung tâm nào đang phát huy tác dụng hay không, hoặc những sinh vật này có hoạt động theo hình thức ý thức bầy đàn hay không. Hiện tượng này đáng để tiếp tục nghiên cứu."
 first_contact.390.A.terminator: "Chúng ta phải tìm hiểu cách nào xử tử chúng tốt nhất."
 first_contact.390.A.assimilator: "Phát hiện đối tượng thích hợp để đồng hóa."
 first_contact.390.A.servitor: "Chúng ta phải học cách để phục tùng họ."
 first_contact.395.name: "[This.ContactCountry.GetRealName]"
 first_contact.395.intro: "Các drone dịch thuật của chúng ta đã đạt được một bước đột phá quan trọng trong việc giải mã tín hiệu tiếp nhận từ §H[This.ContactCountry.GetName]§!, và giờ đây đã đủ tự tin để giao tiếp đầy đủ với chúng, nhằm mở ra kênh ngoại giao."
 first_contact.395.desc.base: "$first_contact.395.intro$ Bọn chúng thực ra lại là một nền văn minh được tạo nên từ các sinh vật hữu cơ.\n\nĐiều đáng kinh ngạc là, nền văn minh của chúng hoàn toàn khác với các đấng sáng tạo của chúng ta. [This.ContactCountry.GetSpeciesNamePlural] không phải là một quốc gia bao gồm các cá thể, mà là một loại §Htrí tuệ tập thể§! được cấu thành từ tập hợp các cá thể con vô tri."
 first_contact.395.desc.standard: "$first_contact.395.desc.base$\n\nNhững điểm tương đồng với [This.Owner.GetGovernmentName] của chính chúng ta quả thực đáng ngạc nhiên... lại có chút phiền phức."
 first_contact.395.desc.terminator: "$first_contact.395.desc.base$\n\nMặc dù vậy, thân là sinh vật hữu cơ, chúng bắt buộc phải bị tiêu diệt."
 first_contact.395.desc.assimilator: "$first_contact.395.desc.base$\n\nĐiều này có lẽ cho thấy việc hợp nhất những sinh vật hữu cơ này vào một hình thức tập thể tiên tiến hơn như chúng ta sẽ gặp khó khăn."
 first_contact.395.desc.servitor: "$first_contact.395.desc.base$\n\nĐiều này có lẽ cho thấy việc ta phục vụ những sinh vật hữu cơ này sẽ gặp khó khăn. Chỉ có thời gian mới trả lời được..."
 first_contact.395.desc.they_wilderness: "$first_contact.395.intro$\n\nNhững người ngoài hành tinh này quả thực là một nền văn minh tạo nên từ sinh vật hữu cơ, nhưng xã hội của họ lại khác biệt một trời một vực so với xã hội của đấng sáng tạo ra chúng ta. Không giống như các cá thể được tổ chức thành chính thể, [This.ContactCountry.GetSpeciesNamePlural] là một bầy đàn phi tập trung, hình thành từ hệ động vật gần như không có trí tuệ và hệ thực vật cộng sinh đôi bên cùng có lợi. Những sinh vật này cùng nhau hợp thành một loại §Htrí tuệ tập thể§!. Trên nhiều phương diện, sự tiến hóa tự nhiên của chúng có vẻ như đang tạo ra tiếng vọng song hành với điểm kỳ dị của chính chúng ta."
 first_contact.395.A: "$first_contact.397.A$"
 first_contact.395.A.terminator: "Hủy diệt! Hủy diệt!"
 first_contact.395.A.assimilator: "Chúng ta chỉ đành thử một phen."
 first_contact.395.A.assimilator_wilderness: "Có lẽ sẽ khó đồng hóa."
 first_contact.395.A.servitor: "$first_contact.395.A.assimilator$"
 first_contact.397.name: "[This.ContactCountry.GetRealName]"
 first_contact.397.desc.base: "Các drone dịch thuật của chúng ta đã đạt được bước đột phá trong nỗ lực giải mã tín hiệu thu nhận từ §H[This.ContactCountry.GetName]§!, và giờ đây đã đủ tự tin để cho phép chúng ta giao tiếp với chúng ở mức độ cao, nhằm mở ra kênh ngoại giao. Bọn chúng thực ra lại là một nền văn minh được tạo nên từ các sinh vật hữu cơ. Rõ ràng, chúng là một nền văn minh do các sinh vật hữu cơ hợp thành, và đã tiến hóa thành hình thái quốc gia, cực kỳ giống với đấng sáng tạo ra chúng ta nhiều năm về trước."
 first_contact.397.desc.standard: "$first_contact.397.desc.base$\n\nChúng ta chỉ có thể giả định rằng các đấng sáng tạo của chúng ta sử dụng công nghệ điêu luyện hơn, hoặc bất cẩn hơn so với [This.ContactCountry.GetSpeciesNamePlural]. Dựa trên một số nghiên cứu về các ghi chép của chúng mà chúng ta thu được, chúng ta đã vạch ra vài kế hoạch dự báo. Thật không may, chúng dường như đang ám chỉ rằng con đường phát triển như vậy mới là phổ biến, còn nền văn minh máy móc loại hai như chúng ta lại là một trường hợp cực kỳ hiếm hoi."
 first_contact.397.desc.terminator: "$first_contact.397.desc.base$\n\nQuan sát những mạng sống thảm hại đang thoi thóp trên [This.ContactCountry.GetSpeciesNamePlural], đối với chúng ta rõ ràng là đang chứng kiến màn biểu hiện đáng buồn của một dạng sống hạ đẳng, huống hồ chúng còn có thể tạo ra mối đe dọa không thể dung thứ cho [This.Owner.GetGovernmentName] của chúng ta. Chúng phải bị diệt vong."
 first_contact.397.desc.assimilator: "$first_contact.397.desc.base$\n\nTuy nhiên, những sinh vật hữu cơ này vẫn chưa được gia cường bằng bất kỳ loại mô cấy ghép nào, giống như cách chúng ta đã cải tạo [secondary_species.GetNamePlural]. Rõ ràng chúng ta có thể mang lại phúc lợi này cho chúng, miễn là chúng có thể bị thuyết phục để sáp nhập vào [This.Owner.GetName]!"
 first_contact.397.desc.servitor: "$first_contact.397.desc.base$\n\nTuy nhiên, cuộc sống của chúng khó khăn hơn nhiều so với những [secondary_species.GetNamePlural] trên hành tinh của chúng ta. Rõ ràng là, chỉ cần chúng muốn, chúng ta có thể lập tức chăm sóc chúng!"
 first_contact.397.A: "Hãy xem chúng có gì muốn nói."
 first_contact.397.A.terminator: "Chúng ta cần phải xóa sổ chúng."
 first_contact.397.A.assimilator: "Chúng nên hòa nhập với chúng ta."
 first_contact.397.A.servitor: "Các điều khoản chăm sóc cần phải được thỏa thuận."
 first_contact.400.name: "Sự thù địch lộ rõ"
 first_contact.400.desc: "Báo cáo mới nhất từ [This.Owner.GetEnvoy] [This.Leader.GetName] của chúng ta, người được cử đi điều tra §H[This.ContactCountry.GetName]§! trước đó, đang gây nên sự chú ý cao độ. Rõ ràng là những con tàu ngoài hành tinh này đã mở §Hmiệng pháo§! và thực hiện một số cú lướt qua ở cự ly gần đến mức khó chịu. Đồng thời, chúng gửi đến cho chúng ta một thông điệp do một cá thể phát ra —— các [This.Owner.GetResearchers] của chúng ta suy đoán đó hẳn là một nhà lãnh đạo trong lĩnh vực nào đó —— dùng [This.ContactCountry.GetSpeciesHandNamePlural] của chúng để làm những cử chỉ có vẻ như mang tính §Hxâm phạm§!, ít nhất thì chúng ta hiểu là vậy...\n\nMột số nhà quan sát nghi ngờ rằng, rất có thể chúng đang cố tình tạo ra xung đột vì một mục đích nào đó. Tuy nhiên, những người khác lại chỉ ra rằng chúng chưa thực hiện bất kỳ hành động thù địch thực chất nào, và hối thúc chúng ta đừng vội đưa ra kết luận trước khi hiểu rõ ý đồ của chúng."
 first_contact.400.desc.gestalt: "Báo cáo mới nhất từ [This.Owner.GetEnvoy] [This.Leader.GetName] của chúng ta, người được cử đi điều tra §H[This.ContactCountry.GetName]§! trước đó, đang gây nên sự chú ý cao độ. Rõ ràng là những con tàu ngoài hành tinh này đã mở §Hmiệng pháo§! và thực hiện một số cú lướt qua ở cự ly gần đến mức khó chịu. Đồng thời, chúng gửi đến cho chúng ta một thông điệp do một cá thể phát ra —— chúng ta chỉ có thể đoán đó là một nhà lãnh đạo trong lĩnh vực nào đó —— dùng [This.ContactCountry.GetSpeciesHandNamePlural] của chúng để làm những cử chỉ kỳ quái, có vẻ như thể hiện ý đồ §Hgây sát thương§!...\n\nChúng ta xác định xem liệu chúng có đang cố tình tạo ra xung đột hay không, nếu vậy tại sao chúng chưa thực hiện bất kỳ hành động thù địch thực chất nào."
 first_contact.400.A: "Bắt chước cách chào hỏi của chúng."
 first_contact.400.A.tooltip: "Chúng ta không thể đoán trước được chúng sẽ phản ứng lại chúng ta như thế nào.\n"
 first_contact.400.B: "Phớt lờ chúng."
 first_contact.400.B.tooltip: "Dù đây có lẽ là lựa chọn an toàn hơn, nhưng chúng ta cũng không thể chắc chắn điều này...\n"
 first_contact.405.name: "Bạn đồng đạo"
 first_contact.405.desc: "Khi tàu của chúng lùi lại sau tàu chúng ta ở một khoảng cách an toàn hơn, phản hồi duy nhất mà §H[This.ContactCountry.GetName]§! truyền tới cho chúng ta chỉ có một dòng chữ. Các [This.Owner.GetLinguists] đã vất vả dịch bức điện văn này, và cuối cùng xác định nội dung chúng nói là: “§HĐược thôi, người ngoài hành tinh, nhưng đây mới chỉ là khởi đầu§!”\n\nCó vẻ như, cuộc giao lưu kỳ lạ này đã dẫn đến việc §H[This.ContactCountry.GetSpeciesNamePlural]§! (giờ chúng ta đã biết tên chúng) coi chúng ta là §Hkẻ thù truyền kiếp§!, hoặc ít nhất là kẻ thù truyền kiếp tiềm năng. Chúng ta chỉ có thể cho rằng, chúng đã sẵn sàng cho khả năng khai chiến với [This.Owner.GetGovernmentName] của chúng ta."
 first_contact.405.A: "Chúng ta nên chuẩn bị sẵn sàng cho điều này."
 first_contact.405.A.pacifist: "Đây chính là mối nguy của việc phô trương sự hung hăng..."
 first_contact.406.name: "Hành động dũng cảm"
 first_contact.406.desc: "§H[This.ContactCountry.GetName]§! đã phản hồi lại lần truyền tin của chúng ta bằng một tin nhắn dài, các [This.Owner.GetLinguists] đã phải mất một thời gian mới dịch xong. Cùng với việc chúng ta ngày càng hiểu rõ hơn về ngôn ngữ ngoài hành tinh, rất rõ ràng là §H[This.ContactCountry.GetSpeciesNamePlural]§! (giờ chúng ta đã biết tên chúng) đã dành tặng những lời ngợi khen cực kỳ hoa mỹ đối với “§Htư thế quang vinh§!” của chúng ta, và chào đón chúng ta như những người bạn.\n\nCó vẻ như, trong mắt chúng, cuộc giao lưu kỳ lạ này đã chứng minh được lòng dũng cảm của chúng ta, khiến chúng tin rằng chúng ta là một đối tác đáng tin cậy trên vũ đài dải ngân hà."
 first_contact.406.A: "Khởi đầu của một tình bạn đẹp đẽ."
 first_contact.406.A.xenophobe: "Miễn là chúng đừng quấy rầy chúng ta..."
 first_contact.406.A.homicidal_or_peaceful: "Đây đâu phải là ý chúng ta muốn..."
 first_contact.410.name: "Hành vi hèn nhát"
 first_contact.410.desc.base: "Một lát sau, bầu không khí cuồng nhiệt của §H[This.ContactCountry.GetName]§! dần lắng xuống. Các [This.Owner.GetLinguists] của chúng ta cũng dần hiểu được những tín hiệu này, cuối cùng xác định được họ là §H[This.ContactCountry.GetRealName]§!, và có thể đưa ra lời giải thích cho hành vi kỳ quặc của họ."
 first_contact.410.desc: "$first_contact.410.desc.base$\n\nThực tế đã chứng minh, [This.ContactCountry.GetSpeciesNamePlural] là một giống loài §Hhiếu chiến§!, họ coi trọng nhất cái mà họ gọi là “tinh thần chiến binh”. Vì biểu hiện không phù hợp, trong mắt họ chúng ta trở thành hạng hạ đẳng —— giống như những kẻ §Hhèn nhát§!. Xem ra cái tiếng xấu này chúng ta còn phải gánh chịu một thời gian nữa..."
 first_contact.410.A.mil: "Việc này không ổn rồi!"
 first_contact.410.A.other: "Sao cũng được."
 first_contact.411.name: "Đối phó điềm tĩnh"
 first_contact.411.desc: "$first_contact.410.desc.base$\n\nThực tế đã chứng minh, [This.ContactCountry.GetSpeciesNamePlural] là một giống loài §Hhiếu chiến§!, họ coi trọng nhất cái mà họ gọi là “tinh thần chiến binh”. Cách đối phó chính xác là đưa ra một phản hồi tương tự. Tuy nhiên, họ có vẻ khá rộng lượng nên đã chấp nhận sự thiếu hiểu biết của chúng ta đối với điều này, thậm chí còn bắt đầu tán dương sự §Hđiềm tĩnh§! của chúng ta khi đối mặt với các mối đe dọa."
 first_contact.411.A: "Rất tốt, bắt hình ảnh của chúng qua đây!"
 first_contact.411.A.homicidal: "Bọn ngu ngốc, chúng sẽ không tha cho chúng ta đâu!"
 first_contact.415.name: "Vấn đề về tần số"
 first_contact.415.desc: "Công tác giải mã tín hiệu ban đầu từ §H[This.ContactCountry.GetName]§! đã đẩy [This.Owner.GetEnvoy] [This.Leader.GetName] vào trạng thái bối rối. Chúng dường như chủ yếu là các §Htiếng ồn trắng§!, hoàn toàn chẳng có thứ gì có thể được nhận diện là ngôn ngữ. Suốt một thời gian, người ta thậm chí còn hoài nghi liệu chúng ta có đang xử lý ngôn ngữ của một loài thông minh hay không, dẫu cho các bằng chứng hiển nhiên cho thấy rõ ràng là chúng có sử dụng một loại công nghệ nào đó.\n\nMãi đến khi các [This.Owner.GetResearchers] của chúng ta thử điều chỉnh thiết bị để dò tìm những âm thanh vượt qua dải tần nghe bình thường của [This.Owner.GetSpeciesEarNamePlural], chúng ta mới phát hiện ra thứ gì đó giống như một ngôn ngữ. Đáng tiếc là, điều này lại đặt ra một §Hthử thách§! rất lớn cho công tác giải mã của chúng ta, bởi vì nếu không có sự hỗ trợ của thiết bị, chúng ta hoàn toàn chẳng nghe thấy chúng..."
 first_contact.415.A: "Chúng ta phải kiên trì."
 first_contact.415.A.tooltip: "Có thể sẽ mất chút thời gian đây...\n"
 first_contact.415.B: "Tất nhiên, đầu tư thêm chút đỉnh sẽ hữu ích chứ?"
 first_contact.420.name: "[This.ContactCountry.GetName] đã được giải mật"
 first_contact.420.desc: "Dù muôn vàn khó khăn, chúng ta vẫn xoay sở để bẻ khóa được loại ngôn ngữ mà §H[This.ContactCountry.GetName]§! sử dụng, qua đó biến việc giao tiếp sơ bộ thành hiện thực. Họ có vẻ tự xưng là §H[This.ContactCountry.GetRealName]§!. Tránh không khỏi, mọi hoạt động trao đổi đều chỉ có thể mượn nhờ vào hệ thống thông tin liên lạc được thiết kế đặc biệt cho ngôn ngữ của họ.\n\nBất cứ ai nỗ lực giao tiếp trôi chảy với họ dường như đều không thể vòng qua được chướng ngại này, nhưng [This.Owner.GetResearchers] lại có quan điểm khác. Dưới sự xúi giục của họ, và nhân lúc ngân sách vẫn còn dư dả, họ đã soạn thảo một bản đề xuất, với ý định ứng dụng kinh nghiệm từ chiến dịch thành công lần này vào các trường hợp rộng lớn hơn. Họ tin rằng, thông qua việc tinh chỉnh phần mềm được sử dụng ở đây, họ sẽ có thể kiến tạo ra thứ mà họ gọi là §H“Máy Dịch thuật Vạn năng”§!, chỉ cần cung cấp đủ thông tin, nó có thể thông dịch đồng thời cho bất kỳ ngôn ngữ nào."
 first_contact.420.A: "Vô vàn cơ hội giao tiếp đang nằm gọn trong tay!"
 UNIVERSAL_TRANSLATOR_PROJECT: "Máy Dịch thuật Vạn năng"
 UNIVERSAL_TRANSLATOR_PROJECT_DESC: "Các nhà nghiên cứu của chúng ta cam kết sẽ tận dụng kinh nghiệm từ cuộc chạm trán gần đây với [contacted_hummers.GetSpeciesNamePlural], xem đó như điểm khởi đầu cho một hệ thống dịch thuật vạn năng, có khả năng dịch tức thì bất kỳ ngôn ngữ nào sang ngôn ngữ của chúng ta. Ngay cả khi rốt cuộc họ không thành công, chúng ta vẫn kỳ vọng họ có thể mang đến những cải tiến rõ rệt cho hệ thống thông tin liên lạc của chúng ta."
 first_contact.422.name: "$UNIVERSAL_TRANSLATOR_PROJECT$"
 first_contact.422.desc: "Chiếc nguyên mẫu được gọi là “Máy Dịch thuật Vạn năng” đã được chế tạo thành công. Mặc dù hiệu quả của nó so với loại thiết bị có khả năng dịch tức thì mọi loại ngôn ngữ chưa biết mà [This.Owner.GetResearchers] mường tượng đã bị giảm sút đi ít nhiều, nhưng vẫn có thể coi đây là một bước cải tiến vượt bậc cho hệ thống dịch thuật hiện hành. Viễn cảnh tươi sáng về việc xóa bỏ rào cản giao tiếp với mọi người ngoài hành tinh mà ta tiếp xúc, trong đó có cả [contacted_hummers.GetName], đã hiển hiện trước mắt."
 first_contact.422.A: "Sớm muộn gì cũng có lúc dùng đến thôi."
 first_contact.425.name: "$first_contact.420.name$"
 first_contact.425.desc: "Dù muôn vàn khó khăn, chúng ta vẫn xoay sở để bẻ khóa được loại ngôn ngữ mà §H[This.ContactCountry.GetName]§! sử dụng, qua đó biến việc giao tiếp sơ bộ thành hiện thực. Họ có vẻ tự xưng là §H[This.ContactCountry.GetRealName]§!. Tránh không khỏi, mọi hoạt động trao đổi đều chỉ có thể mượn nhờ vào hệ thống thông tin liên lạc được thiết kế đặc biệt cho ngôn ngữ của [This.ContactCountry.Species.GetAdj] —— một thứ sẽ làm cản trở những cuộc trò chuyện lưu loát..."
 first_contact.430.name: "Màn hình tỏa sáng"
 first_contact.430.desc: "Càng nghiên cứu sâu về [This.ContactCountry.GetName], các [This.Owner.GetResearchers] lại càng bối rối. Mặc dù họ rõ ràng là những sinh vật có trí tuệ, nhưng phương thức giao tiếp của họ lại chưa từng được nghe nói tới. Thứ mà chúng ta tiếp nhận không phải là dạng tín hiệu hình ảnh hay văn bản nào đó, mà là một màn trình diễn ánh sáng rực rỡ tuyệt mỹ phát ra từ cơ thể hoặc thiết bị kỹ thuật số của họ, quang phổ ánh sáng phát ra từ nó còn vượt qua rõ rệt giới hạn nhìn thấy được của [This.Owner.GetSpeciesNamePlural]. Rõ ràng, việc tìm hiểu họ sẽ là một thử thách rất lớn."
 first_contact.430.A: "$first_contact.415.A$"
 first_contact.430.B: "$first_contact.415.B$"
 first_contact.435.name: "Phía bên kia của tấm chắn sáng"
 first_contact.435.desc: "$first_contact.440.desc$\n\nTrong các nghiên cứu xa hơn, chúng ta kinh ngạc khi phát hiện hình thái phát quang của họ rất giống với các vòng xoáy khi ra vào tuyến đường siêu không gian. Các [This.Owner.GetResearchers] của chúng ta bối rối về hàm ý của hành vi giống nhau này, và đề xuất tiến hành nghiên cứu chuyên sâu về nó."
 OCTOPODES_LIGHT_PATTERNS_PROJECT: "Mô hình hoa văn của [encountered_country.GetSpeciesAdj]"
 OCTOPODES_LIGHT_PATTERNS_PROJECT_DESC: "Trong quá trình tiếp xúc với [encountered_country.GetSpeciesNamePlural], chúng ta phát hiện ra rằng hình thái phát quang mà họ dùng để giao tiếp có sự tương đồng đáng kinh ngạc với các vòng xoáy khi ra vào tuyến đường siêu không gian. Nghiên cứu sâu hơn về vấn đề này có thể giúp chúng ta hiểu đôi chút về các thành phần cấu tạo cơ bản của dải ngân hà."
 first_contact.437.name: "Thấu hiểu về siêu không gian"
 first_contact.437.desc: "Chúng ta đã thu được những kết quả đáng kinh ngạc về mối liên hệ giữa hình thái phát quang dạng xoáy của [encountered_country.GetSpeciesAdj] với không gian giữa các vì sao. Dường như quy luật phát quang của [encountered_country.GetSpeciesNamePlural] trong lúc không hề hay biết, lại ngẫu nhiên trùng khớp với quy luật dòng chảy không gian thay đổi theo thời gian, chỉ là sự khác biệt về quy mô rất lớn.\n\nSau này, thông qua việc nghiên cứu [encountered_country.GetSpeciesNamePlural], chúng ta sẽ có khả năng dự đoán tốt hơn về dòng chảy của siêu không gian, điều này sẽ mở rộng đáng kể phạm vi dò tìm của các cảm biến."
 first_contact.437.A: "Một thế giới mới đã mở ra trước mắt chúng ta."
 first_contact.440.name: "Ngôn ngữ cấu tạo từ ánh sáng"
 first_contact.440.desc: "Mọi nỗ lực của chúng ta đã được đền đáp, giờ đây về cơ bản chúng ta đã có thể hiểu và giao tiếp được với ngôn ngữ của [This.ContactCountry.GetName]. Họ tự xưng là [This.ContactCountry.GetSpeciesNamePlural], và nói rằng bản thân chưa bao giờ sử dụng khẩu ngữ, thay vào đó là trao đổi bằng ánh sáng. Dẫu cho trước đây họ từng dùng văn bản, nhưng dân chúng của họ lại cho rằng nó kém cỏi, kém tinh tế và hiệu quả hơn ngôn ngữ hình ảnh. Bộ não của họ có vẻ hoàn toàn đảm đương được việc rút ra ý nghĩa từ những hoa văn phức tạp một cách nhanh chóng, vì thế trong hầu hết các trường hợp, họ thích dùng hình thức giao tiếp bằng ngôn ngữ hình ảnh hơn."
 first_contact.440.A: "Hãy xem họ có gì muốn nói."
 first_contact.450.name: "Thi ca"
 first_contact.450.desc: "Thông tin đọc được từ tín hiệu của §H[This.ContactCountry.GetName]§! đã khiến các [Owner.GetLinguists] của chúng ta vô cùng phấn khích. Dù trong số đó không một âm tiết nào là chúng ta có thể nhận dạng, nhưng không thể phủ nhận rằng bản thân âm thanh ấy có chứa nhịp điệu, và nghe qua lại có cảm giác êm dịu đến lạ thường. Dù không thể khẳng định chắc chắn, nhưng các [Owner.GetLinguists] tin chắc rằng đây là một bài thơ, đối phương đang phản hồi chúng ta một cách đầy thiện chí."
 first_contact.450.A: "Tất nhiên rồi. Dùng chiến ca để đáp trả!"
 first_contact.450.A.tooltip: "Một khi đao kiếm cùng vung lên,\nCờ xí phấp phới, triệu binh sĩ tiến bước."
 first_contact.450.B: "Chúng ta có thể chia sẻ một số câu thơ về việc tìm tòi học hỏi."
 first_contact.450.B.tooltip: "Đường đời dằng dặc xa xôi,\nTa nguyện đi mãi để tìm tòi chân lý."
 first_contact.450.C: "Dùng vài câu thơ tượng trưng cho tình bạn để lay động họ."
 first_contact.450.C.tooltip: "Bốn bể đều là tri kỷ,\nChân trời góc bể tựa người láng giềng."
 first_contact.450.D: "Cho họ nghe thứ gì đó kỳ quái và độc lạ."
 first_contact.450.D.tooltip: "Thi sĩ họ Thạch thích xơi sư tử,\nThường xuyên ra chợ săm soi sư tử."
 first_contact.450.E: "Không hứng thú."
 first_contact.455.name: "Gây nên sự phản cảm"
 first_contact.455.desc: "Sau khi chúng ta phát sóng chiến ca hàng giờ liền, thông tin liên lạc từ §H[This.ContactCountry.GetName]§! đã bị ngắt quãng. Bọn chúng đã đưa tàu di chuyển vượt ra ngoài tầm ngắm bắn hiệu quả từ rất xa. Có thể nhận định rằng chúng hẳn đã hiểu được thông điệp chính mà chúng ta truyền đi, và chẳng có vẻ gì là vui mừng với điều đó."
 first_contact.460.name: "Trao đổi chiến ca"
 first_contact.460.desc: "Ngay sau khi chúng ta gửi đi thông điệp vài phút, thông tin từ §H[This.ContactCountry.GetName]§! đã có sự thay đổi. Nội dung vẫn đầy ắp nhịp điệu thăng trầm, nhưng không còn nhẹ nhàng êm dịu, mà giống như những cơn sóng cuồn cuộn trào dâng. Nghe tựa như một khúc ca ngợi chiến tranh. Bọn chúng không thực hiện hành vi thù địch nào, mà chỉ bị lay động bởi chiến ca của chúng ta. Chúng ta lại gửi đi vài phiên bản khác nhau của bài thơ ban đầu, và cũng nhanh chóng hệ thống lại phác thảo về chiến ca của [This.ContactCountry.GetName]."
 first_contact.460.A: "Thật hận không gặp giống loài này sớm hơn."
 first_contact.462.name: "Chiến ca phản tác dụng"
 first_contact.462.desc: "Có vẻ như §H[This.ContactCountry.GetName]§! đã nổi giận sau khi nghe chiến ca của chúng ta. Chúng dùng bạo lực đáp trả gần như ngay lập tức. Vũ khí của chúng bắt đầu khai hỏa, may mắn là tàu của chúng ta đã rút lui an toàn. Có vẻ như một trận đại chiến là không thể tránh khỏi."
 first_contact.465.name: "Giao lưu thi ca"
 first_contact.465.desc: "Đối phương phản hồi cuồng nhiệt với thi ca của chúng ta: họ gửi tới một luồng tín hiệu liên lạc kéo dài không ngắt quãng, nhờ đó chúng ta có thể nhanh chóng xây dựng hệ thống từ vựng §H[This.ContactCountry.GetName]§!. Dẫu cho vẫn chưa thể nhận diện được ý nghĩa của các từ vựng này, nhưng những người ngoài hành tinh này có vẻ cực kỳ nhuần nhuyễn trong việc đối đáp bằng các quy luật thanh bằng trắc trong thi ca của chúng ta, điều này cũng tạo thuận lợi cho các [Owner.GetLinguists] trong việc thấu hiểu họ."
 first_contact.465.A: "Bọn họ thật nhã nhặn và lịch sự."
 first_contact.470.name: "Chòng ghẹo"
 first_contact.470.desc: "Sau vài phút im lặng, liên lạc từ §H[This.ContactCountry.GetName]§! đã được khôi phục. Mặc dù vẫn chưa hiểu gì, nhưng thái độ của họ đã thay đổi rõ rệt: Các [Owner.GetLinguists] của chúng ta cho biết họ nghe được những giai điệu vui tươi và bẽn lẽn. Dù hơi khó tin, nhưng có vẻ như họ đang tán tỉnh chúng ta."
 first_contact.470.A: "Bầu không khí có chút gượng gạo."
 first_contact.470.B: "Cũng không phải là không thể hiểu được."
 first_contact.472.desc: "Quá trình chờ đợi trong lo âu từng giây từng phút như một năm trôi qua, §H[This.ContactCountry.GetName]§! vẫn không có phản hồi. Dù khó có khả năng chúng hiểu được ý nghĩa cụ thể trong thi ca của chúng ta, nhưng có vẻ chúng đã hoảng sợ trước cách biểu đạt tình cảm trong đó, nên chuyển sang dùng thái độ thận trọng hơn khi tiếp xúc với chúng ta."
 first_contact.474.name: "Tiếng ồn ngẫu nhiên"
 first_contact.474.desc: "§H[This.ContactCountry.GetName]§! đã phản hồi lại theo cách tương tự: Những bài thơ đầy vần điệu thăng trầm đã biến thành những tiếng ồn ngẫu nhiên, mô phỏng lại giọng nói của chúng ta. Thật đáng tiếc, các [Owner.GetLinguists] của chúng ta cho biết, việc giải mã những âm thanh này “hoàn toàn vô dụng”, vì những tín hiệu hiện tại không hề có bất cứ một quy luật nào."
 first_contact.474.A: "Cảm giác sắp thất bại rồi."
 first_contact.475.name: "Dẹp cờ nằm im"
 first_contact.475.desc: "Cùng với việc đôi bên ngày càng thấu hiểu nhau hơn, sự thù địch của [This.ContactCountry.GetName] hay nói đúng hơn là §H[This.ContactCountry.GetRealName]§! đối với chúng ta cũng dịu đi. Dù vẫn mang tính hiếu chiến, nhưng có vẻ họ đã coi chúng ta là những “chiến binh đáng kính” sẵn lòng giao lưu tiếp. Về việc đây sẽ là sự khởi đầu của một tình bạn hay khúc dạo đầu của chiến tranh, chúng ta vẫn chưa biết được, nhưng ít nhất chúng ta cũng đã được ôn lại những thanh âm chiến tranh do tổ tiên truyền lại!"
 first_contact.475.A: "Một cuộc giao lưu kỳ lạ."
 first_contact.480.name: "Giải mã thi ca"
 first_contact.480.desc: "Những nỗ lực của chúng ta đã đơm hoa kết trái, giờ đây chúng ta đã có thể giải mã thông điệp mà [This.ContactCountry.GetName], hay chính xác là §H[This.ContactCountry.GetRealName]§! gửi đến. Dựa vào phương thức đặt câu của họ, chúng ta biết được họ có sự si mê đến khó tin đối với nghệ thuật thi ca. Cách giao tiếp nhã nhặn phong lưu này không chỉ giúp chúng ta nhận được sự tôn trọng từ họ, mà còn cho phép chúng ta tìm hiểu sâu hơn về họ."
 first_contact.485.name: "Giải mật mật ngữ"
 first_contact.485.desc: "Sau tiến trình chạm trán lần đầu vô cùng dài dòng và trắc trở, cuối cùng các [Owner.GetLinguists] của chúng ta cũng xác nhận được [This.ContactCountry.GetName] thực chất là §H[This.ContactCountry.GetRealName]§!. Họ chúc mừng chúng ta đã phá giải được câu đố chữ của họ, nhưng có vẻ khá bất mãn vì chúng ta đã mất quá nhiều thời gian. Đến cuối cùng, các [Owner.GetLinguists] của chúng ta đã thành công phát triển một số phương pháp nhận dạng quy luật mới, giúp chúng ta giải mã ngôn ngữ dễ dàng hơn trong tương lai."
 first_contact.485.A: "Được."
 first_contact.490.name: "Dịch lời tâng bốc"
 first_contact.490.desc: "Những nỗ lực của chúng ta đã được đền đáp, giờ đây chúng ta đã có thể giải mã thông điệp mà [This.ContactCountry.GetName], hay chính xác là §H[This.ContactCountry.GetRealName]§! gửi tới:\n\n“Ôi, những lời tâng bốc thật khéo léo. Gặp được một giống loài khác cũng trân trọng thi ca đã là phước ba đời, ai mà ngờ được, những [Owner.GetSpeciesName] thân mến, các bạn lại dạt dào tình cảm và ngọt ngào đến vậy. Chúc phước cho [Owner.GetSpeciesOrganName] của các bạn.”\n\nPhía sau thông điệp còn rất nhiều câu từ tương tự như vậy. Chúng ta cũng chẳng thể xác định nổi nên thấy hãnh diện hay sửng sốt trực tiếp, nhưng có lẽ mối quan hệ của chúng ta đã có một khởi đầu khá tốt đẹp."
 first_contact.490.A: "Họ cũng tốt thật đấy chứ."
 first_contact.500.name: "Sự thù địch khi tiếp xúc lần đầu"
 first_contact.500.desc: "Rõ ràng là, lời phản hồi của chúng ta không đúng lúc: phản ứng của §Y[contact_country.GetName]§! cực kỳ nhanh chóng và đầy thù địch, chúng bắt đầu nã đạn vào tàu của chúng ta. Có vẻ như chúng ta phải dựa vào [Owner.GetSpeciesHandNamePlural] của chính mình để đáp trả chúng."
 first_contact.500.A: "Cho chúng thấy thế nào là lễ độ!"
 first_contact.500.A.tooltip: "§Y[contact_country.GetName]§! sẽ trở nên thù địch với chúng ta."
 first_contact.505.desc: "Chúng ta thật sự không biết mình đã mắc lỗi gì, §Y[contact_country.GetName]§! đột nhiên tấn công chúng ta! Xem ra chúng ta phải tự mình dùng [Owner.GetSpeciesHandNamePlural] để đáp trả chúng!"
 #Sự kiện Ngẫu nhiên
 first_contact.5000.name: "Phát hiện tín hiệu rõ ràng"
 first_contact.5000.desc: "Cảm biến của chúng ta dò ra §H[This.ContactCountry.GetName]§! đang gửi đi những tín hiệu rõ ràng và lặp đi lặp lại liên tục, dường như cung cấp tài liệu tuyệt vời để các [This.Owner.GetLinguists] của chúng ta giải mã ngôn ngữ của chúng. Nhờ phúc trời ban này, các nhà ngôn ngữ học vô cùng lạc quan, tin chắc rằng sẽ sớm đạt được những tiến triển lớn."
 first_contact.5000.desc2: "Chúng ta đã thu được thành công các tín hiệu âm thanh cực kỳ rõ ràng từ cuộc hội thoại giữa nhiều con tàu của §H[This.ContactCountry.GetName]§!. Dù các [This.Owner.GetLinguists] của chúng ta chưa thể nhận biết chính xác ý nghĩa của những từ họ ghi nhận được, nhưng họ vô cùng tự tin rằng đoạn tín hiệu mới này sẽ mang đến bước tiến đột phá quan trọng."
 first_contact.5005.name: "Thiếu hụt tín hiệu"
 first_contact.5005.desc: "Các [This.Owner.GetLinguists] của chúng ta ngày càng thất vọng do chúng ta không thể cung cấp cho họ đủ tài liệu để giải mã ngôn ngữ mà §H[This.ContactCountry.GetName]§! sử dụng, tiến độ của họ đang bị hạn chế rất nhiều. Có vẻ như những người ngoài hành tinh này đang dùng mọi ngón nghề để ngăn chặn lũ [This.Owner.GetSpeciesEarNamePlural] mang tâm địa xấu xa nghe lén tín hiệu của mình!"
 first_contact.5005.A: "Tiếp tục cố gắng!"
 first_contact.5010.name: "Sai phương hướng"
 first_contact.5010.desc: "Có vẻ như các [This.Owner.GetLinguists] của chúng ta đã vấp phải một §Hthất bại§! nặng nề trong lúc dịch ngôn ngữ mà §H[This.ContactCountry.GetName]§! sử dụng. Thật không may, thứ mà họ tưởng là ngôn ngữ hoàn toàn chẳng phải là ngôn ngữ. [This.Owner.GetEnvoyCap] [This.Leader.GetName] đã chỉ ra trong báo cáo của [This.Leader.GetHerHis] rằng, sau vài ngày thảo luận từ nhiều góc độ, các [This.Owner.GetLinguists] cuối cùng đi đến kết luận, đây có thể chỉ là một loại âm nhạc mang tính thử nghiệm..."
 first_contact.5010.A: "Một sự cố đáng tiếc."
 first_contact.5015.name: "[This.ContactCountry.GetName] quét [This.Owner.Capital.GetName]"
 first_contact.5015.desc: "Khiến nhiều [This.Owner.GetSpeciesNamePlural] kinh ngạc là, có vẻ như một phi thuyền thuộc về §H[This.ContactCountry.GetName]§! đã quét §H[This.Owner.Capital.GetName]§!. Chúng ta đã xuất hiện những ý kiến trái chiều đối với hành động này: liệu chúng ta nên coi lần đụng độ này là bước đệm để thiết lập mối liên hệ chặt chẽ hơn với một nền văn minh ngoài hành tinh, hay nên coi đó là một lời cảnh báo, đòi hỏi chúng ta phải chắc chắn hạm đội của mình đã trong tư thế sẵn sàng trước khi quá muộn."
 first_contact.5015.desc.xenophile: "Khiến nhiều [This.Owner.GetSpeciesNamePlural] kinh ngạc là, có vẻ như một phi thuyền thuộc về [This.ContactCountry.GetName] đã quét §H[This.Owner.Capital.GetName]§!. Mặc dù một số người lo ngại rằng những người ngoài hành tinh này có thể không thân thiện với chúng ta cho lắm, nhưng sự đồng thuận đã được thiết lập, đó là trước tình huống này, chúng ta nên nỗ lực gấp đôi để thiết lập quan hệ chặt chẽ hơn với các nền văn minh khác trong dải ngân hà."
 first_contact.5015.desc.xenophobe: "Khiến nhiều [This.Owner.GetSpeciesNamePlural] kinh ngạc là, có vẻ như một phi thuyền thuộc về §H[This.ContactCountry.GetName]§! đã quét §H[This.Owner.Capital.GetName]§!. Sự đồng thuận rộng rãi đã được thiết lập, rằng chúng ta nên phản ứng lại hành vi xâm nhập này bằng cách đảm bảo hạm đội của mình đã chuẩn bị sẵn sàng, và không được để quá muộn."
 first_contact.5015.desc.gestalt: "Thật đáng lo ngại, có vẻ như một phi thuyền thuộc về §H[This.ContactCountry.GetName]§! đã quét §H[This.Owner.Capital.GetName]§!. Chúng ta không chắc nên đối phó với sự việc này như thế nào: Chúng ta nên chọn tiếp tục tập trung vào việc chung sống hòa bình hữu nghị với nền văn minh ngoài hành tinh, hay coi đây là một lời chuông cảnh tỉnh và mở rộng quy mô hạm đội, để đề phòng bất trắc từ mối đe dọa tiềm tàng?"
 first_contact.5015.desc.gestalt.homicidal: "Thật đáng lo ngại, có vẻ như một phi thuyền thuộc về §H[This.ContactCountry.GetName]§! đã quét §H[This.Owner.Capital.GetName]§!. Chúng ta nên mở rộng hạm đội để đảm bảo lũ người ngoài hành tinh này sẽ không có bất kỳ mưu đồ viển vông nào."
 first_contact.5015.A: "Chúng ta phải chuẩn bị sẵn sàng."
 first_contact.5015.B: "... Vì tình hữu nghị."
 first_contact.5020.name: "Phát hiện thủ đô của [This.ContactCountry.GetName]"
 first_contact.5020.desc: "Chúng ta đã nhận ra thuộc địa mà chúng ta từng quét tại hệ sao §H[This.ContactCountry.Capital.System.GetName]§! thực chất chính là thủ đô của §H[This.ContactCountry.GetName]§!. Các [This.Owner.GetResearchers] của chúng ta thông qua việc điều tra những dữ liệu thu thập được từ lần quét này, đã phát hiện vô số manh mối giá trị về họ."
 first_contact.5025.name: "Tiền đồ mịt mù"
 first_contact.5025.desc: "Đã một thời gian rồi chúng ta không thu thập được thêm dữ liệu nghe nhìn nào từ §H[This.ContactCountry.GetName]§!. Các [This.Owner.GetResearchers] của chúng ta phát hiện họ dường như không còn thông tin mới nào đáng để chúng ta khai thác, và lo ngại rằng con đường này có lẽ đã bế tắc."
 first_contact.5025.A: "Tiếp tục tìm kiếm!"
 first_contact.5030.name: "Vẻ đẹp vô danh"
 first_contact.5030.desc: "Khi chúng ta thu nhận được ngày càng nhiều hình ảnh về nhóm người ngoài hành tinh mang tên §H[This.ContactCountry.GetName]§!, chúng khó tránh khỏi việc rò rỉ vào tầm mắt công chúng. Bề ngoài của họ khiến công chúng của [This.Owner.GetAdj] cực kỳ phấn khích, ai nấy đều nóng lòng muốn tiếp xúc thêm với những người ngoài hành tinh này."
 first_contact.5030.desc.machine: "Khi chúng ta thu nhận được ngày càng nhiều hình ảnh về những người ngoài hành tinh mang tên §H[This.ContactCountry.GetName]§!, chúng ta sớm nhận ra mình đang giao thiệp với một xã hội robot. Việc những tin tức này rò rỉ ra trước mắt công chúng chỉ là chuyện sớm muộn. Các khám phá này đã khơi gợi trí tưởng tượng của công chúng [This.Owner.GetAdj], mọi người trầm trồ kinh ngạc trước việc máy móc lại có thể tự mình xây dựng nền văn minh không gian, và háo hức muốn tìm hiểu thêm về chúng."
 first_contact.5030.A: "$first_contact.5035.A$"
 first_contact.5030.A.tooltip: "Đánh giá của chúng ta về §H[This.ContactCountry.GetName]§! đã tăng lên."
 first_contact.5035.name: "Cảnh tượng đáng sợ"
 first_contact.5035.desc: "Khi chúng ta thu nhận được ngày càng nhiều hình ảnh về nhóm người ngoài hành tinh mang tên §H[This.ContactCountry.GetName]§!, chúng khó tránh khỏi việc rò rỉ vào tầm mắt công chúng. Rất nhiều người trong chúng ta cảm thấy hoảng sợ trước ngoại hình của chúng, và gọi chúng là §H“những [This.ContactCountry.GetSpeciesNamePluralInsult] kinh tởm”§!. Hơn nữa, đã có rất nhiều tiếng nói yêu cầu chúng ta áp dụng các biện pháp để đối phó với mối đe dọa từ “[This.ContactCountry.GetSpeciesClass]” mới này..."
 first_contact.5035.desc.machine: "Khi chúng ta thu nhận được ngày càng nhiều hình ảnh về những người ngoài hành tinh mang tên [This.ContactCountry.GetName], chúng ta không thể nào phớt lờ sự thật này nữa: thứ chúng ta đang đối mặt là một xã hội robot. Việc những tin tức này rò rỉ ra trước mắt công chúng chỉ là chuyện sớm muộn. Rất nhiều người trong chúng ta cảm thấy hoảng sợ trước ngoại hình của chúng, và gọi chúng là §H“những [This.ContactCountry.GetSpeciesNamePluralInsult] kinh tởm”§!. Hơn nữa, đã có rất nhiều tiếng nói yêu cầu chúng ta áp dụng các biện pháp để đối phó với “mối đe dọa cơ khí” mới này..."
 first_contact.5035.A: "Chính là như vậy."
 first_contact.5035.B: "Họ cũng chẳng đến nỗi tệ thế đâu."
 first_contact.5040.name: "Tín hiệu gây hoang mang"
 first_contact.5040.desc: "Các [This.Owner.GetResearchers] của chúng ta đã đạt được sự tiến triển ổn định nhờ thu thập lượng lớn tín hiệu từ §H[This.ContactCountry.GetName]§!. Thế nhưng, khi kiến thức về ngôn ngữ của họ ngày càng dày lên, các [This.Owner.GetLinguists] của chúng ta lại ngày càng thấy hoang mang. Rõ ràng họ buộc phải đánh giá lại hàng loạt các bản dịch trước đó, vì phát hiện ra những từ ngữ mà mình từng nghĩ là hiểu rõ thực chất lại mang ý nghĩa §Hcực kỳ thiếu chính xác§!. Có vẻ như diện mạo tổng thể của [This.ContactCountry.GetName] khác xa hoàn toàn so với chúng ta —— mức độ khác biệt vượt xa trí tưởng tượng!"
 first_contact.5040.desc.gestalt: "Mặc dù chúng ta đã đạt được những tiến triển ổn định trong việc thu thập một lượng khổng lồ tín hiệu từ §H[This.ContactCountry.GetName]§!, nhưng bước tiến thực sự trong việc thấu hiểu những tín hiệu này... đã bị vùi dập hoàn toàn. Các [This.Owner.GetLinguists] của chúng ta buộc phải nhiều lần đánh giá lại các thành quả dịch thuật trước đó của họ, bởi họ phát hiện ra ý nghĩa của những từ ngữ từng được nhận định thực chất lại §Hrất thiếu chính xác§!."
 first_contact.5040.desc.hive: "$first_contact.5040.desc.gestalt$ Dường như phương thức tư duy của [This.ContactCountry.GetName] khác quá xa so với chúng ta —— mức độ khác biệt còn lớn hơn những gì chúng ta từng nhận định, kể cả đối với góc nhìn về người ngoài hành tinh!"
 first_contact.5040.desc.machine: "$first_contact.5040.desc.gestalt$ Có vẻ như logic thực thi của [This.ContactCountry.GetName] không dựa trên bất kỳ loại lý tính nào mà chúng ta từng biết. Điều này sẽ mang lại vô số thử thách cho chúng ta trong nỗ lực thấu hiểu họ!"
 first_contact.5040.A: "Chuyện này rồi sẽ dần sáng tỏ thôi."
 first_contact.5045.name: "Dịch thuật thần tốc"
 first_contact.5045.desc: "Khi chúng ta thu nhận được ngày càng nhiều tư liệu tại §H[This.ContactCountry.GetName]§!, các [This.Owner.GetLinguists] vô cùng kinh ngạc trước tốc độ tiến triển nhanh đến mức này. Dường như —— nếu những gì họ nghĩ là đúng —— thì nhóm người ngoài hành tinh này và chúng ta có cực kỳ nhiều quan điểm tương đồng về thế giới và dải ngân hà."
 first_contact.5045.desc.hive: "Khi chúng ta thu nhận được ngày càng nhiều tư liệu tại §H[This.ContactCountry.GetName]§!, các [This.Owner.GetLinguists] vô cùng kinh ngạc trước tốc độ tiến triển nhanh đến mức này. Dường như —— nếu những gì họ nghĩ là đúng —— thì những người ngoài hành tinh này sở hữu phương thức tư duy rất tương đồng với chúng ta. Có lẽ ý thức của họ cũng giống như [This.Owner.GetGovernmentName] của chúng ta vậy."
 first_contact.5045.desc.machine: "Khi chúng ta thu nhận được ngày càng nhiều tư liệu tại §H[This.ContactCountry.GetName]§!, các [This.Owner.GetLinguists] vô cùng kinh ngạc trước tốc độ tiến triển nhanh đến mức này. Dường như —— nếu những gì họ nghĩ là đúng —— thì những người ngoài hành tinh này có logic thực thi cực kỳ tương đồng với chúng ta. Phải chăng đằng sau những tín hiệu này là một trí tuệ nhân tạo rất giống với [This.Owner.GetGovernmentName] của chúng ta?"
 first_contact.5045.A: "Đây là một điềm báo tốt đẹp cho quan hệ đôi bên trong tương lai."
 first_contact.5045.B: "Tất nhiên rồi. Vì cớ gì họ lại không căm thù lũ dị chủng cơ chứ?"
 first_contact.5045.C: "Thật tốt khi gặp được một nền văn minh tương đồng với mình."
 first_contact.5050.name: "Dịch sai"
 first_contact.5050.desc: "Công tác phân tích ngôn ngữ từ các tín hiệu của §H[This.ContactCountry.GetName]§! đã gặp rào cản lớn. Có vẻ như những giả định then chốt trong bản dịch của các [This.Owner.GetLinguists] đã bị §Hbác bỏ§!. Dù điều đó có nghĩa là biết bao nỗ lực trước đây của chúng ta đều đổ sông đổ biển và phải làm lại từ đầu, nhưng ít nhất thì những nỗ lực trong tương lai rất có thể sẽ được xây dựng trên một nền tảng vững chắc hơn."
 first_contact.5055.name: "Tiến triển đều đặn"
 first_contact.5055.desc: "Gần đây, các [This.Owner.GetLinguists] của chúng ta đã có bước tiến vượt bậc trong việc phân tích ngôn ngữ dùng trong các tín hiệu từ §H[This.ContactCountry.GetName]§!. Giờ đây họ cực kỳ tự tin rằng mình đã nắm chắc nền tảng của thứ ngôn ngữ này, và cam kết sẽ sớm có thông báo về những khám phá mới."
 first_contact.5055.A: "Cứ thế phát huy!"
 first_contact.5065.name: "Dò được tín hiệu rõ ràng"
 first_contact.5065.desc: "Chúng ta đã nếm mật nằm gai để thu thập đủ lượng thông tin về §H[This.ContactCountry.GetName]§! nhằm giúp các [This.Owner.GetLinguists] có thể đẩy nhanh tiến độ, và giờ đây mọi nỗ lực đã được đền đáp bằng một cú hích cực mạnh: Các cảm biến của chúng ta đã ghi nhận được một lượng lớn thông tin liên lạc giữa các tàu của chúng. Chúng ta chỉ có thể đoán rằng họ bỗng chốc buông lỏng cảnh giác, hoặc có thể do công nghệ của họ không tân tiến như chúng ta tưởng, và chúng cứ tưởng kênh liên lạc của mình vẫn an toàn..."
 first_contact.5070.name: "Ngôn ngữ học sắc màu"
 first_contact.5070.desc: "Các [This.Owner.GetLinguists] của chúng ta đã đạt được một bước tiến đột phá trong quá trình giải mã ngôn ngữ của §H[This.ContactCountry.GetName]§!. Hệ thống văn bản mà chúng sử dụng có chứa tới gần mười bảy triệu ký tự, mỗi ký tự vừa khéo tương ứng với một giá trị màu Đỏ - Xanh lá - Xanh lam. Mặc dù còn khá rắc rối, nhưng các nhà ngôn ngữ học của chúng ta cho rằng họ có thể phá giải thứ ngôn ngữ ngoài hành tinh này, chỉ cần thêm một chút thời gian nữa thôi."
 first_contact.5070.A: "Mở đường xanh đi thẳng."
 first_contact.5071.name: "Giải mã ngôn ngữ sắc màu"
 first_contact.5071.desc: "Bằng việc ứng dụng hệ đếm thập lục phân, các nhà toán học và [This.Owner.GetLinguists] của chúng ta gần như đã bẻ khóa thành công ngôn ngữ sắc màu của §H[This.ContactCountry.GetName]§!. Các quan chức cũng đang gấp rút dự thảo bộ giao thức tiếp xúc lần đầu.\n\nThông qua việc nghiên cứu ngôn ngữ của §H[This.ContactCountry.GetName]§!, chúng ta nhận thấy nền văn hóa của họ vô cùng đa dạng, và khả năng phát sinh hiểu lầm trong giao tiếp là cực kỳ cao. Bây giờ chúng ta phải đưa ra quyết định xem chính sách giao tiếp nên nghiêng về mặt logic của họ, hay là thiên về cách biểu đạt tình cảm của họ..."
 first_contact.5071.desc.gestalt: "Bằng việc ứng dụng hệ đếm thập lục phân, chúng ta gần như đã bẻ khóa được ngôn ngữ sắc màu của §H[This.ContactCountry.GetName]§!. Bộ giao thức tiếp xúc lần đầu cũng đang trong quá trình dự thảo.\n\nGiờ đây, chúng ta có thể lựa chọn dùng những lời chào hỏi mang đậm nét văn hóa đặc thù để xoa dịu cảm xúc của họ, hoặc thử một cách biểu đạt phức tạp nhưng đem lại hiệu quả cao hơn."
 first_contact.5071.A: "Ngoại giao nói cho cùng cũng chỉ là đối nhân xử thế. Hãy dùng âm nhạc để chào hỏi họ!"
 first_contact.5071.A.tooltip: "Chúng ta sẽ cố gắng thiết lập liên kết tình cảm với [This.ContactCountry.GetName]."
 first_contact.5071.B: "Chúng ta vẫn nên đặt tính logic lên hàng đầu. Tránh để cảm xúc lấn át trong quá trình trao đổi."
 first_contact.5072.name: "Sự liên kết tình cảm!"
 first_contact.5072.desc: "Nỗ lực trao đổi với §H[This.ContactCountry.GetName]§! ở góc độ gợi cảm đã gặt hái được thành quả không tồi.\n\nCác [This.Owner.GetLinguists] của chúng ta đã thể hiện sự thấu hiểu về nền văn hóa của họ, kết quả là họ bày tỏ sự chào đón cực kỳ nồng ấm đối với chúng ta. Nhiệm vụ hoàn thành một cách “tuyệt đẹp”!"
 first_contact.5072.desc.gestalt: "Với cảm xúc đóng vai trò đòn bẩy, chúng ta đã giành được thiện cảm từ §H[This.ContactCountry.GetName]§!.\n\nCác [This.Owner.GetLinguists] của chúng ta đã thể hiện sự thấu hiểu về nền văn hóa của họ, kết quả là họ bày tỏ sự chào đón cực kỳ nồng ấm đối với chúng ta. Nhiệm vụ hoàn tất."
 first_contact.5073.name: "Sự sỉ nhục tai họa!"
 first_contact.5073.desc: "Nỗ lực trao đổi với §H[This.ContactCountry.GetName]§! trên phương diện tình cảm đã đem lại một hậu quả thảm khốc.\n\nCác [This.Owner.GetLinguists] của chúng ta chẳng những không thể hiện được sự thấu hiểu tường tận về nền văn hóa của họ, mà ngược lại còn xúc phạm họ một cách nặng nề!"
 first_contact.5073.desc.gestalt: "Bất chấp việc mượn đến các yếu tố cảm xúc, chúng ta vẫn không thể lấy được thiện cảm từ §H[This.ContactCountry.GetName]§!\n\nCác [This.Owner.GetLinguists] của chúng ta chẳng những không thể hiện được sự thấu hiểu tường tận về nền văn hóa của họ, mà ngược lại còn xúc phạm họ một cách nặng nề."
 first_contact.5075.name: "Giao tiếp kém hiệu quả"
 first_contact.5075.desc: "Ngôn ngữ của §H[This.ContactCountry.GetName]§! thoạt nhìn dường như chứa đựng hàng triệu âm tiết thừa thãi, có vẻ như chỉ đơn thuần là những tàn dư quy ước thói quen sót lại từ ngôn ngữ cổ đại của họ. Trong quá trình dịch thuật, những từ vựng chắp vá không cần thiết này dường như chỉ có tác dụng duy nhất là để bổ sung tính hoàn thiện cho ngữ pháp, hoặc cùng lắm là đưa ra vài gợi ý ngữ cảnh không đáng kể.\n\nMay mắn là, các [This.Owner.GetLinguists] của chúng ta đã cắt giảm bớt những phần lỗi thời trong ngôn ngữ của họ, soạn ra một bộ từ điển rút gọn, nhờ đó chúng ta có thể giao tiếp với §H[This.ContactCountry.GetName]§! một cách cực kỳ hiệu quả."
 #Cuộc Thử thách
 first_contact.5080.name: "Tàu con thoi"
 first_contact.5080.desc.start: "Một tàu con thoi không gian thuộc §H[This.ContactCountry.GetName]§! đang tiến về phía chúng ta. Vì không có động thái nào khác xảy ra, nên chúng ta giả định họ muốn gặp gỡ ở một nơi cách xa tàu mẹ của mình. Do kích thước tàu nhỏ hẹp, nên chỉ có [Owner.GetEnvoy] [Leader.GetName] của chúng ta được cử đi, trong khi những thành viên ngoại giao khác phải ở lại phía sau."
 first_contact.5080.desc.weapon: "Tàu con thoi được trang bị các hệ thống vũ khí tinh vi, bọn ngoài hành tinh đã ở tư thế sẵn sàng cho một cuộc đối đầu bằng vũ lực."
 first_contact.5080.desc.functional: "Tàu con thoi chú trọng tính thực dụng và có kích thước khổng lồ. Rõ ràng đối với họ, công năng được ưu tiên hơn vẻ bề ngoài."
 first_contact.5080.desc.bling: "Tàu con thoi được tô điểm bằng những món đồ trang trí tinh xảo và đinh tán bằng vàng. Rõ ràng, thiết kế của nó sinh ra là để tạo ấn tượng mạnh thông qua màn phô diễn xa xỉ này."
 first_contact.5080.desc.standard: "Kiểu dáng tàu con thoi của người ngoài hành tinh rất giống với thiết kế của chúng ta, điều này phần nào mang lại sự nhẹ nhõm cho ta."
 first_contact.5085.name: "Nơi chốn chờ đợi"
 first_contact.5085.desc.start: "[Leader.GetName] quay về báo cáo rằng, hoàn toàn không có ai từ §H[This.ContactCountry.GetName]§! ra tiếp đón [Leader.GetHimHer]."
 first_contact.5085.desc.meditation: "Bên trong chiếc tàu con thoi không người lái có thiết kế một phòng họp trung tâm. Sàn và tường được bọc bằng những vật liệu mềm mại, trong khi âm thanh tự nhiên êm đềm từ các thế giới ngoài hành tinh được phát ra từ những chiếc loa ẩn."
 first_contact.5085.desc.pool: "Bên trong chiếc tàu con thoi không người lái có thiết kế một phòng họp trung tâm, ở một đầu của nó là một hồ nước. Xung quanh mặt sàn bao quanh hồ nước được khắc đầy những ký hiệu ngoài hành tinh."
 first_contact.5085.desc.imposing: "Bên trong chiếc tàu con thoi không người lái có thiết kế một phòng họp trung tâm, phong cách bài trí tuy khiêm tốn nhưng lại toát lên một vẻ trang nghiêm lạ lùng. Các góc cạnh trên tường và những hoa văn trang trí đều được thiết kế nhằm điều hướng sự chú ý của người xem về một bục phát biểu cao vút."
 first_contact.5085.desc.standard: "Bên trong chiếc tàu con thoi không người lái có thiết kế một phòng họp trung tâm, đáng ngạc nhiên thay, nó cực kỳ mộc mạc, chẳng có bất kỳ thiết kế trang trí hay hoa văn làm đẹp nào cả."
 first_contact.5085.desc.end: "Có một bức tường phủ kín các thiết bị ghi âm và cảm biến. Đứng trước cỗ máy lạnh lẽo vô cảm, [Leader.GetName] đã khái quát lịch sử và văn hóa của giống loài chúng ta. Lời giới thiệu không nhận được bất kỳ phản hồi nào. [Leader.GetName] vô cùng hụt hẫng, chỉ đành để lại một tấm bảng video rồi rời đi, bên trong chứa đựng lượng lớn ghi chép lịch sử cùng hướng dẫn sơ lược về cách sử dụng ngôn ngữ của chúng ta."
 first_contact.5085.a: "Cứ hãy chống mắt lên xem."
 first_contact.5090.name: "Thủ đoạn"
 first_contact.5090.desc.proactive: "Sự trao đổi thông tin chỉ từ một phía đã khiến đoàn ngoại giao vô cùng chán nản. Họ thèm khát một cuộc tiếp xúc lần đầu thành công mỹ mãn, vì thế trong hoàn cảnh chưa rõ thực tế, họ đã vạch ra các sách lược dự đoán nhiều nhánh để định hướng cho quy trình tiếp xúc còn lại."
 first_contact.5090.desc.cautious: "Ngay sau khi lên tàu con thoi để phô diễn sức mạnh, là một cơn lo âu trỗi dậy, thậm chí [Leader.GetName] còn công khai nghi ngờ bản thân liệu mình có thực hiện báo cáo giới thiệu thành công hay không."
 first_contact.5090.desc.aggressive: "May thay mệnh lệnh trực tiếp từ [Leader.GetName] đã ngăn chặn quá trình tiếp xúc lần đầu leo thang thành một cuộc xung đột bạo lực. Đối với toàn đội, sự im lặng kéo dài của những người ngoài hành tinh này chắc chắn là một sự sỉ nhục."
 first_contact.5090.desc.end: "Vài giờ sau, §H[This.ContactCountry.GetName]§! đã dùng ngôn ngữ của chúng ta để truyền đến một thông điệp ngắn gọn:\n\n“Chúng tôi không mấy ấn tượng về văn hóa của các ngài. Chỉ có vậy thôi sao? [Owner.GetEnvoy] có cơ hội cuối cùng để lưu lại ấn tượng sâu đậm cho chúng tôi bằng bất cứ lĩnh vực nào mà các ngài chọn lựa.”"
 first_contact.5090.a: "Thử thách chiến đấu."
 first_contact.5090.a.tt: "Ra tay trước. Đánh thật ác."
 first_contact.5090.b: "Bài diễn thuyết đầy sức thuyết phục."
 first_contact.5090.b.tt: "Chắc chắn họ sẽ hiểu lý lẽ."
 first_contact.5090.c: "Giai điệu âm nhạc ngẫu hứng."
 first_contact.5090.c.tt: "Xây dựng lòng tự tôn văn hóa của chúng ta, để họ phải tự cảm thấy xấu hổ."
 first_contact.5095.name: "Phán quyết"
 first_contact.5095.desc.combat_good: "[Leader.GetName] đã trở về từ §H[This.ContactCountry.GetName]§!! Mặc dù mang đầy thương tích, nhưng vẫn trở về trong niềm vinh quang.\n\nTừ một cánh cửa ẩn, một chiến binh ngoài hành tinh bất thần xuất hiện và lao vào giao chiến ác liệt với [Owner.GetEnvoy] của chúng ta, cho đến khi kiệt sức. Nhờ triệu hồi chút sinh lực tàn tạ cuối cùng, [Leader.GetName] đã thành công khuất phục đối thủ của [Leader.GetHisHer].\n\nChưa đầy một giờ sau, [This.ContactCountry.GetName] đã gửi đến một tin nhắn:\n\n“[Leader.GetName] sẽ được ghi danh vào sử sách của chúng tôi, với tư cách là một chiến binh vĩ đại.”"
 first_contact.5095.desc.combat_bad: "[Leader.GetName] mang vẻ mặt đầy hoang mang quay trở lại từ tàu con thoi của §H[This.ContactCountry.GetName]§!, mà chẳng tìm thấy bất kỳ đối thủ nào. Trong vòng một giờ, §H[This.ContactCountry.GetName]§! gửi tới một thông báo:\n\n“Hành vi dã man của các ngài làm chúng tôi rất thất vọng. Đối với một nền văn minh đã khai hóa, việc tiến hành chiến đấu tay đôi về mặt thể xác là hoàn toàn không thích hợp.”"
 first_contact.5095.desc.speech_good: "[Leader.GetName] tràn đầy vẻ tự tin quay về từ tàu con thoi của §H[This.ContactCountry.GetName]§!. Khi biện hộ cho hoàn cảnh của chúng ta trước bức tường cảm biến, [Leader.GetHeSheCap] đã quên mất cả khái niệm thời gian, giải thích tường tận các lý do đằng sau các quyết định lịch sử cũng như việc chúng ta học hỏi và trưởng thành với tư cách là một nền văn hóa ra sao.\n\nChưa tới một giờ sau, §H[This.ContactCountry.GetName]§! đã truyền tin đến:\n\n“Mặc dù các ngài từng trải qua những giai đoạn gian khó trong quá khứ, nhưng các ngài đã gặt hái được sự phát triển phi thường. Văn hóa của các ngài là một tấm gương đầy tính khích lệ.”"
 first_contact.5095.desc.speech_bad: "[Leader.GetName] chán nản quay về từ chiếc tàu con thoi của §H[This.ContactCountry.GetName]§!. [Leader.GetHeSheCap] đã bỏ ra hơn một giờ đồng hồ đứng trước bức tường cảm biến, giới thiệu về văn hóa của chúng ta không bỏ sót một chi tiết nhỏ nhặt nào, đồng thời tranh luận về tính đúng đắn trong các quyết định lịch sử của chúng ta.\n\nKhông lâu sau, §H[This.ContactCountry.GetName]§! liền truyền đến một thông điệp:\n\n“Lịch sử mà các ngài vừa tường thuật đã bày ra sự nghèo nàn trong văn hóa của chính các ngài.”"
 first_contact.5095.desc.song_good: "[Leader.GetName] đã hân hoan trở về từ chiếc tàu con thoi của §H[This.ContactCountry.GetName]§!. Những câu từ ngẫu hứng phác họa về quá khứ và tương lai của chúng ta được truyền đạt một cách đầy tự do, thi sĩ [Owner.GetEnvoy] của chúng ta đã sáng tạo nên những sự liên kết đầy bất ngờ và giàu tính truyền cảm ứng giữa cả hai.\n\nChưa đầy một giờ sau, §H[This.ContactCountry.GetName]§! đã truyền tin đến:\n\n“Nền văn hóa của các ngài vô cùng huy hoàng, chúng tôi dành lời ca ngợi cho màn trình diễn này.”"
 first_contact.5095.desc.song_bad: "[Leader.GetName] quay về từ chiếc tàu con thoi của §H[This.ContactCountry.GetName]§!, tự bản thân vô cùng bất mãn với màn biểu diễn âm nhạc của [Leader.GetHisHer]. Sự đứt gãy giữa các hành vi trong quá khứ và nhận thức tự thân của chúng ta hiện tại đã khiến những màn thả chữ trong bài hát trở nên vô vị và nhạt nhẽo.\n\nChưa tới một giờ sau, §H[This.ContactCountry.GetName]§! đã gửi đến một thông báo:\n\n“Chúng tôi cảm thấy rất thất vọng về một buổi giao lưu tư tưởng cực kỳ quan trọng lại bị hủy hoại bởi những giai điệu tầm thường.”"
 first_contact.5095.a: "Thử thách kết thúc."
 #Tóm tắt Giai đoạn Tiếp xúc Lần đầu
 fcsum_base_contact_set_summary: "Chúng ta đã đụng độ những người ngoài hành tinh vô danh trong hệ sao §H[This.System.GetName]§!."
 fcsum_stage_1_summary: "Chúng ta xác định được §H[This.ContactCountry.GetName]§! là một nền văn minh du hành không gian chưa từng được biết tới."
 fcsum_comms_received: "Chúng ta đã bắt được những đợt phát thanh lặp đi lặp lại từ §H[This.ContactCountry.GetName]§!."
 fcsum_investigation_needed: "Chúng ta đã gặp trở ngại, gây nên sự chậm trễ trong nỗ lực đánh chặn các tín hiệu thông tin liên lạc."
 fcsum_hive_to_default_1: "Chúng ta phát hiện §H[This.ContactCountry.GetName]§! có vẻ như không phải là một ý thức bầy đàn."
 fcsum_machine_to_default_1: "Giờ đây đã xác định rất rõ, §H[This.ContactCountry.GetName]§! là một nền văn minh sinh vật hữu cơ."
 fcsum_riddles_1: "Tín hiệu của §H[This.ContactCountry.GetName]§! đã khiến các [This.Owner.GetResearchers] của chúng ta cực kỳ bối rối."
 fcsum_riddles_2: "Chúng ta phải đứng trước lựa chọn sẽ chào đón §H[This.ContactCountry.GetSpeciesNamePlural]§! như thế nào."
 fcsum_monstrous_noises_1: "Chúng ta đã nhận được đoạn tin báo §Rcảnh báo§! từ §H[This.ContactCountry.GetName]§!."
 fcsum_monstrous_noises_2: "Phản hồi của §H[This.ContactCountry.GetName]§! đối với tín hiệu của chúng ta rất bí ẩn."
 fcsum_monstrous_noises_end_purifiers: "Kênh liên lạc đã được kết nối, nhưng không may thay, §H[This.ContactCountry.GetSpeciesNamePlural]§! lại mong muốn tất cả chúng ta đều chết."
 fcsum_monstrous_noises_end_good: "Kênh liên lạc đã được kết nối. §H[This.ContactCountry.GetSpeciesNamePlural]§! tán thưởng phản hồi của chúng ta."
 fcsum_monstrous_noises_end_insult: "Kênh liên lạc đã được kết nối. §H[This.ContactCountry.GetSpeciesNamePlural]§! cảm thấy bị §Rxúc phạm§! bởi màn phô diễn sức mạnh của chúng ta."
 fcsum_monstrous_noises_silent_end_bad: "Kênh giao tiếp đã được kết nối. Vì chúng ta không hồi đáp, nên §H[This.ContactCountry.GetSpeciesNamePlural]§! cho rằng chúng ta là bọn §Rhèn nhát§!."
 fcsum_apparent_hostility_1: "§H[This.ContactCountry.GetName]§! đã thực hiện các hành vi §Rkhiêu khích§! tàu của chúng ta."
 fcsum_apparent_hostility_end_less_good: "Kênh liên lạc đã được kết nối. §H[This.ContactCountry.GetSpeciesNamePlural]§! có vẻ coi chúng ta là §Rkẻ thù truyền kiếp§!."
 fcsum_apparent_hostility_end_good: "Kênh liên lạc đã được kết nối. §H[This.ContactCountry.GetSpeciesNamePlural]§! tán dương màn phô diễn sức mạnh của chúng ta."
 fcsum_apparent_hostility_end_silent_bad: "$fcsum_monstrous_noises_silent_end_bad$"
 fcsum_hummers_1: "Chúng ta phát hiện ra, §H[This.ContactCountry.GetName]§! giao tiếp với nhau bằng một loại âm thanh mà [This.Owner.GetSpeciesEarNamePlural] của chúng ta không thể nghe thấy."
 fcsum_octopodes_1: "Chúng ta phát hiện ra, §H[This.ContactCountry.GetName]§! sử dụng một loại ngôn ngữ hình ảnh hoàn toàn khác biệt so với văn bản và khẩu ngữ để trao đổi."
 fcsum_poetry_1: "Chúng ta đã tiếp nhận được thứ âm thanh nghe tựa như thi ca từ §H[This.ContactCountry.GetName]§!."
 fcsum_hacking_best: "Nỗ lực tấn công mạng máy tính của §H[This.ContactCountry.GetName]§! đã §Gthành công§!."
 fcsum_hacking_decent: "Nỗ lực tấn công mạng máy tính của §H[This.ContactCountry.GetName]§! đã §Gthành công§!, nhưng cũng bị họ phát hiện ra."
 fcsum_hacking_fail: "Nỗ lực tấn công mạng máy tính của §H[This.ContactCountry.GetName]§! đã bị §Rthất bại§!."
 fcsum_comms_established: "Đã thiết lập thành công thông tin liên lạc với §H[This.ContactCountry.GetName]§!."
 fcsum_hostile_ship_best: "Nỗ lực bắt giữ tàu của §H[This.ContactCountry.GetName]§! đã §Gthành công§!."
 fcsum_hostile_ship_none_alive: "Nỗ lực bắt giữ tàu của §H[This.ContactCountry.GetName]§! đã §Gthành công§!, nhưng toàn bộ phi hành đoàn đã mất mạng."
 fcsum_hostile_ship_none_destroyed: "Nỗ lực bắt giữ tàu của §H[This.ContactCountry.GetName]§! đã thất bại vì con tàu đã bị phá hủy hoàn toàn."
 fcsum_hostile_ship_escaped: "Nỗ lực bắt giữ tàu của §H[This.ContactCountry.GetName]§! đã thất bại do con tàu đã đào tẩu."
 fcsum_interrogation_ended: "Chúng ta đã thu được vô số thông tin từ việc thẩm vấn những §H[This.ContactCountry.GetSpeciesNamePlural]§!."
 fcsum_vivisection_ended: "Chúng ta đã thu thập vô vàn thông tin từ việc giải phẫu cơ thể sống của §H[This.ContactCountry.GetSpeciesNamePlural]§!."
 fcsum_abduction_succeeded: "Nỗ lực bắt cóc một cá thể từ giống loài ngoài hành tinh này của chúng ta đã §Gthành công§!."
 fcsum_abduction_failed: "Nỗ lực bắt cóc một cá thể từ giống loài ngoài hành tinh này của chúng ta đã §Rthất bại§!."
 fcsum_abduction_woopsie: "Nỗ lực bắt cóc một cá thể từ giống loài ngoài hành tinh này của chúng ta đã đi đến §Rkết cục hài hước§!."
 fcsum_enclave_1: "Chúng ta phát hiện ra §H[This.ContactCountry.GetName]§! được thiết lập trên một trạm không gian duy nhất tại hệ sao §H[This.System.GetName]§!."
 fcsum_critters_1: "Chúng ta xác định được §H[This.ContactCountry.GetName]§! là một nền văn minh du hành không gian chưa từng được biết tới."
 fcsum_tiyanki_1: "$fcsum_critters_1$"
 fcsum_tiyanki_2: "§H[This.ContactCountry.GetName]§! được xác nhận là “Cá voi Không gian”, hay còn gọi là Tiyanki."
 fcsum_amoeba_1: "$fcsum_critters_1$"
 fcsum_amoeba_2: "§H[This.ContactCountry.GetName]§! được xác định là một sinh vật sống hữu cơ mang tính thù địch mang tên “Amip Không gian”."
 fcsum_crystals_1: "$fcsum_critters_1$"
 fcsum_crystals_2: "§H[This.ContactCountry.GetName]§! được xác định là những thực thể pha lê kỳ dị sống trong không gian."
 fcsum_drones_1: "§H[This.ContactCountry.GetName]§! có vẻ như là những cỗ máy tự động không người lái có khả năng tự nhận thức."
 fcsum_drones_2: "Chúng ta định danh §H[This.ContactCountry.GetName]§! là những robot dùng trong khai thác mỏ, người chủ của chúng đã rời đi từ lâu."
 fcsum_marauders_1: "§H[This.ContactCountry.GetName]§! có vẻ là một phần của nền văn minh có trí tuệ hoàn thiện nhưng lại vô cùng hiếu chiến."
 fcsum_pirates_1: "$fcsum_marauders_1$"
 fcsum_neutrals_1: "Những gì chúng ta nghĩ về §H[This.ContactCountry.GetName]§! nằm ngoài định nghĩa của một nền văn minh không gian điển hình."
 fcsum_caravaneers_1: "§H[This.ContactCountry.GetName]§! được quan sát thấy là một nhóm thương nhân du hành xuyên qua các hệ sao."
 fcsum_void_clouds_1: "$fcsum_critters_1$"
 fcsum_void_clouds_2: "§H[This.ContactCountry.GetName]§! được phân loại là một đám mây mảnh vỡ không gian mang tính thù địch và có vẻ sở hữu sự tự nhận thức."
 fcsum_nomads_1: "$fcsum_caravaneers_1$"
 fcsum_colorful_linguistics_1: "Chúng ta đã giải mã được văn bản viết tay của §H[This.ContactCountry.GetName]§!. Quả thực quá mức rắc rối."
 fcsum_colorful_linguistics_2: "Chúng ta cần đưa ra một quyết sách ngoại giao."
