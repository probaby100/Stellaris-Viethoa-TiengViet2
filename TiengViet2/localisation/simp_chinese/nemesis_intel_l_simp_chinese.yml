 opinion_friendly_first_comms_greeting: "Lời chào đầu thân thiện"
 opinion_hostile_first_comms_greeting: "Lời chào đầu thù địch"
 preventive_war_economy: "Nền kinh tế chiến tranh phòng ngừa"
 preventive_war_economy_desc: "Chúng ta ưu tiên dồn tài nguyên vào việc xây dựng tàu chiến để ứng phó trước các mối đe dọa tiềm tàng từ những nền văn minh ngoài hành tinh thù địch mà ta chưa biết."
 alien_friendship_society: "Hội Ái hữu Người ngoài hành tinh"
 alien_friendship_society_desc: "Đế chế của chúng ta luôn mong mỏi thiết lập tình hữu nghị với những nền văn minh ngoài hành tinh chạm trán trên sân khấu dải ngân hà rộng lớn."
 robot_appreciation: "Kỳ tích máy móc"
 robot_appreciation_desc: "Chúng ta đã chạm trán với một nền văn minh robot, nó đã thức tỉnh chúng ta về những giới hạn phi thường của những đột phá từ công nghệ trí tuệ nhân tạo của chính mình."
 alien_appreciation: "Trào lưu hâm mộ người ngoài hành tinh"
 alien_appreciation_desc: "Chúng ta đã gặp một giống loài ngoài hành tinh khá hấp dẫn, vô số tình nguyện viên đang đổ xô gia nhập bộ phận khám phá không gian của chúng ta."
 robot_revulsion: "Lũ hộp sắt tồi tệ"
 robot_revulsion_desc: "Chúng ta đã chạm trán một nền văn minh robot, điều này khiến chúng ta hoài nghi sâu sắc về tác động của tự động hóa đối với xã hội của mình."
 alien_revulsion: "Người ngoài hành tinh kinh tởm"
 alien_revulsion_desc: "Chúng ta đã đụng độ một giống loài ngoài hành tinh cực kỳ buồn nôn, khiến mọi người thu mình lại chỉ quan tâm đến đồng loại, không còn hứng thú đoái hoài đến sự sống ngoài không gian nữa."
 repulsive_robot_contact: "Khoan dung với robot kinh tởm"
 repulsive_alien_contact: "Khoan dung với người ngoài hành tinh kinh tởm"
 repulsive_aliens_uncondemned: "Khoan dung với người ngoài hành tinh kinh tởm"
 repulsive_aliens_uncondemned_desc: "Chúng ta đã không thể hiện thái độ phản kháng trước mối đe dọa mới vừa chạm trán, dẫn đến làn sóng phản đối bắt đầu nổ ra trong dân chúng."
 first_contact_challenge_not_returned: "Không đáp trả khiêu khích"
 first_contact_challenge_not_returned_desc: "Dù một số người e ngại rằng việc không ra tay trước khi tiếp xúc với một nền văn minh ác ý có thể đặt chúng ta vào vòng nguy hiểm, nhưng chúng ta vẫn kiên quyết xử lý lần chạm trán đầu tiên bằng phương pháp khoa học hợp lý, bởi điều này mang lại lợi ích rõ rệt cho bộ phận thám hiểm của chúng ta."
 first_contact_defeated_dadaism: "Đánh bại sự lố bịch"
 first_contact_defeated_dadaism_desc: "Trong một sự kiện tiếp xúc lần đầu vô cùng đáng nhớ, chúng ta đã buộc phải nắm bắt một kiểu phản hồi hoang đường đến lố bịch. Giờ thì chẳng còn gì làm khó được các nhà ngôn ngữ học của chúng ta trong việc giải mã nữa."
 first_contact_war_preparations: "Chuẩn bị chiến tranh"
 first_contact_war_preparations_desc: "Cuộc đụng độ với một nền văn minh lộ rõ thái độ thù địch đã châm ngòi cho làn sóng chuẩn bị chiến tranh lan rộng."
 first_contact_warlike_warriors_recognised: "Sự anh dũng được công nhận"
 first_contact_warlike_warriors_recognised_desc: "Nền văn minh chúng ta vừa chạm trán có ấn tượng sâu đậm với sự anh dũng của chúng ta, đến mức họ tuyên bố chúng ta là những chiến binh mạnh nhất dải ngân hà. Điều này chẳng ảnh hưởng gì mấy đến danh tiếng của chúng ta."
 first_contact_warlike_warriors_presumed: "Bị hiểu nhầm là anh dũng"
 first_contact_warlike_warriors_presumed_desc: "Nền văn minh chúng ta vừa chạm trán đã lầm tưởng chúng ta là một xã hội được xây dựng bởi những chiến binh mạnh mẽ và thông thái. Dù sự thật không phải vậy, nhưng chúng ta vẫn sẽ tận dụng lợi thế từ sự hiểu lầm này trong một thời gian."
 first_contact_warlike_warriors_recognised_2: "Mối thù truyền kiếp giữa các chiến binh"
 first_contact_warlike_warriors_recognised_2_desc: "Một nền văn minh mà chúng ta vừa đụng độ có ấn tượng mạnh với sự dũng mãnh của chúng ta, vì vậy họ thề sẽ dốc sức để sánh ngang với chúng ta, đồng thời tuyên bố chúng ta là kẻ thù truyền kiếp trên vũ đài ngân hà. Điều này chẳng ảnh hưởng gì mấy đến danh tiếng của chúng ta."
 first_contact_warlike_warriors_presumed_2: "Mối thù truyền kiếp (giả tạo) giữa các chiến binh"
 first_contact_warlike_warriors_presumed_2_desc: "Nền văn minh chúng ta vừa chạm trán đã lầm tưởng chúng ta là một xã hội được xây dựng bởi những chiến binh mạnh mẽ và thông thái. Thật không may, họ thề sẽ dốc sức để sánh ngang với chúng ta, và tuyên bố chúng ta là kẻ thù truyền kiếp trên vũ đài ngân hà. Chúng ta đâu có như vậy... nhưng chúng ta vẫn sẽ trục lợi từ sự hiểu lầm này trong một thời gian."
 first_contact_level_headedness: "Vạn người chú ý"
 first_contact_level_headedness_desc: "Sự bình tĩnh và điềm đạm của chúng ta khi đối mặt với nghịch cảnh đã giành được sự ngưỡng mộ rộng rãi trên vũ đài ngân hà."
 first_comms_hostility_preparations: "Chuẩn bị ứng phó với hành vi thù địch"
 first_comms_defensive: "Chiến dịch phản gián cảnh giác"
 first_comms_defensive_desc: "Ngay sau lần tiếp xúc đầu tiên, mục tiêu đã tỏ ra cực kỳ cảnh giác với chúng ta."
 first_contact_speak_like_us_spynetwork: "Ngôn ngữ tương đồng"
 first_contact_speak_like_us_country: "Giải đố"
 first_contact_speak_like_us_country_desc: "Kinh nghiệm của chúng ta trong việc giải mã những câu đố được gửi từ một nền văn minh đặc biệt khó hiểu đã giúp cải thiện phương án ứng phó cho các cuộc tiếp xúc lần đầu."
 universal_translator: "Máy Dịch thuật Vạn năng"
 universal_translator_desc: "Mặc dù cái gọi là “Máy Dịch thuật Vạn năng” không đạt được mức độ như các nhà nghiên cứu của chúng ta cam kết ban đầu, tức là lập tức giao tiếp được với bất kỳ giống loài thông minh nào, nhưng nó vẫn là một công cụ trao đổi cực kỳ hữu dụng, hiện đã trở thành trang bị tiêu chuẩn cho các đặc phái viên và nhà khoa học xã hội thường trú tại các nước."
 space_lights_insights: "Dự đoán dòng chảy không gian"
 space_lights_insights_desc: "Các hoa văn trên lớp da phát sáng của một giống loài mà chúng ta từng gặp đã mang đến chìa khóa gợi mở những kiến thức mới, giúp sự thấu hiểu của chúng ta về du hành siêu không gian có bước tiến vượt bậc ở cấp độ năm ánh sáng."
 first_contact_hive_drones_study: "Nghiên cứu cá thể con của Ý thức Bầy đàn"
 first_contact_hive_drones_study_desc: "Chúng ta đang nghiên cứu cách thức Ý thức Bầy đàn kiểm soát các cá thể con của chúng để tìm ra phương pháp giúp gia tăng năng suất cho lực lượng lao động của mình."
 any_civilian_ship_in_sensor_range: "Trong phạm vi dò tìm cần có một con tàu phi quân sự của §Y[This.ContactCountry.GetName]§!"
