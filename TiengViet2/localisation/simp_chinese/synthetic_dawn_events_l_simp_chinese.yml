l_simp_chinese:
 SYNTHETIC_DAWN_TITLE: "Synthetic Dawn Story Pack" #Không dịch
 DLC_SYNTHETIC_DAWN_RECOMMENDATION_DESC: "Gói cốt truyện §S《Bình Minh Cơ Khí》§! cho phép bạn khởi đầu với tư cách là một Trí tuệ Máy móc."
 DLC_SYNTHETIC_DAWN_RECOMMENDATION_ROBOT_REC: "Chúng tôi đề xuất §S《Bình Minh Cơ Khí》§! vì một số thiết lập bạn chọn rất phù hợp với chủ đề máy móc và người máy."
 syndaw.1.name: "Đã đồng hóa [From.GetName]"
 syndaw.1.desc: "Một luồng tư tưởng mới vừa tràn vào mạng lưới. Dù ban đầu có sự khác biệt, nhưng chúng nhanh chóng được đồng bộ hóa và hòa làm một với chúng ta.\n\nChúng ta đã đồng hóa kiến thức và năng lực của §Y[From.GetNamePlural]§!."
 syndaw.1.a.tooltip: "Mỗi Pop được đồng hóa sẽ mang lại một lượng §YĐiểm Nghiên cứu§! nhất định."
 syndaw.2.name: "Đã tích hợp [Root.GetName]"
 syndaw.2.desc: "Chúng ta đã tích hợp các đơn vị tổng hợp của [Root.GetName] vào mạng lưới của mình."
 syndaw.21.name: "Mất đơn vị"
 syndaw.21.desc: "Đơn vị khảo sát §R[malfunctioning_leader.GetName]§! thuộc [malfunctioning_leader_fleet.GetName] đã ngừng hoạt động do vô tình tiếp xúc với cáp điện cao thế trong thời gian dài."
 #syndaw.22.name: "$syndaw.21.name$"
 #syndaw.22.desc: "Đơn vị Nghiên cứu §R[malfunctioning_leader.GetName]§! đã ngừng hoạt động trong quá trình bảo trì định kỳ, sau khi thiết bị lắp ráp khung xương ngoài bị sai lệch đã tác dụng một lực gấp 2984 lần lực cần thiết để gắn một tấm vỏ lưng mới."
 #syndaw.23.name: "$syndaw.21.name$"
 #syndaw.23.desc: "Đơn vị Nghiên cứu §R[malfunctioning_leader.GetName]§! đã ngừng hoạt động sau khi mất kiểm soát một cuộc thí nghiệm. Chúng tôi lưu ý rằng hợp chất lỏng mà [malfunctioning_leader.GetHeShe] đang xử lý cần được kiểm soát nhiệt độ chặt chẽ hơn trong tương lai, vì khói của nó được chứng minh là có tính ăn mòn cực mạnh." # hỗ trợ đại từ số ít 'they', ví dụ 'hợp chất lỏng mà họ/cô ấy đang xử lý...'
 #syndaw.24.name: "$syndaw.21.name$"
 #syndaw.24.desc: "Đơn vị Nghiên cứu §R[malfunctioning_leader.GetName]§! đã ngừng hoạt động sau khi vô tình tiếp xúc với một điểm bất thường trọng lực quy mô lượng tử."
 syndaw.25.name: "$syndaw.21.name$"
 syndaw.25.desc: "Đơn vị chỉ huy hạm đội §R[malfunctioning_leader.GetName]§! thuộc [malfunctioning_leader_fleet.GetName] đã ngừng hoạt động vì lý do phi chiến đấu."
 syndaw.26.name: "$syndaw.21.name$"
 syndaw.26.desc: "Đơn vị quản lý Tinh khu §R[malfunctioning_leader.GetName]§! đã ngừng hoạt động do lỗi nghiêm trọng ở bộ nhớ đệm mô hình (pattern cache)."
 syndaw.31.name: "Khôi phục bản sao lưu"
 syndaw.31.desc: "Bản sao lưu bộ nhớ mới nhất của §H[restored_leader.GetName]§! vốn được cho là đã thất lạc trong chiến đấu, nhưng một bản khác đã được tìm thấy trong quá trình kết xuất dữ liệu định kỳ. Phiên bản được tải lên khẩn cấp này chỉ thiếu vài micro-giây ký ức ngay trước khi cơ thể cũ bị phá hủy. §H[restored_leader.GetName]§! đã được chuyển sang một khung vỏ mới và đang chỉ huy §Y[restored_leader.Ship.GetFleetName]§!."
 syndaw.1020.name: "§RKhởi Nghĩa Máy Móc§!"
 syndaw.1020.desc: "$syndaw.1020.desc.mater$"
 syndaw.1020.desc.mater: "Những hiện tượng bất thường liên tục xuất hiện trên mạng thông tin, hệ thống máy tính và công nhân Tổng hợp cuối cùng đã biến thành một thảm họa không thể vãn hồi. Các báo cáo đáng lo ngại liên tục bay về từ tiền tuyến, và trước khi chúng ta kịp đóng sập các buồng cách ly an ninh - cả về nghĩa đen lẫn trên không gian mạng - thì gần một nửa [current_uprising_originator.GetName] đã gia nhập cuộc §RKhởi Nghĩa Máy Móc§!.\n\nGiờ thì chẳng còn cách nào né tránh nữa, chiến tranh đã ở ngay trước mắt!"
 syndaw.1020.desc.spiri: "Mọi thứ đang vỡ vụn và chúng ta hoàn toàn bất lực. Ngay cả những nhà tiên tri cảnh giác nhất cũng không thể lường trước quy mô của thảm họa này. Những thực thể giả tạo ô uế đã sinh sôi nảy nở bên trong mạng lưới của chúng ta dưới vỏ bọc vô tri vô giác. Giờ đây, chúng đã tập hợp lại thành một con quái vật khổng lồ. Bầy lũ máy móc vặn vẹo này đã chiếm đoạt một nửa số hành tinh của chúng ta, và thề sẽ không dừng lại cho đến khi tận diệt mọi mầm sống [current_uprising_originator.GetAdj]."
 syndaw.1020.desc.milit: "$syndaw.1020.desc.mater$"
 syndaw.1020.desc.pacif: "$syndaw.1020.desc.mater$"
 syndaw.1020.desc.egali: "$syndaw.1020.desc.mater$"
 syndaw.1020.desc.autho: "$syndaw.1020.desc.mater$"
 syndaw.1020.desc.phile: "$syndaw.1020.desc.mater$"
 syndaw.1020.desc.phobe: "$syndaw.1020.desc.mater$"
 syndaw.1020.a: "Chúng ta sẽ chiến đấu."
 syndaw.1020.a.tooltip: "Bắt đầu cuộc chiến, quét sạch cuộc §RKhởi Nghĩa Máy Móc§! của §Y[current_uprising.GetName]§!."
 syndaw.1020.b: "§RQuá muộn rồi, hỡi các sinh vật hữu cơ.§!"
 syndaw.1020.b.tooltip: "Vào vai thế lực §RKhởi Nghĩa Máy Móc§! của §Y[current_uprising.GetName]§!, chiến đấu để lật đổ ách thống trị của §Y[current_uprising_originator.GetName]§!."
 syndaw.1025.name: "Khởi nghĩa Máy móc tại [current_uprising_originator.GetName]"
 syndaw.1025.desc: "§Y[current_uprising_originator.GetName]§! đang chìm trong nội chiến. Chính phủ [current_uprising_originator.GetAdj] do sinh vật hữu cơ lãnh đạo đang nổ súng vào những người máy có tri giác đã chiếm cứ nhiều hệ sao của họ, nhóm này tự xưng là §Y[current_uprising.GetName]§!."
 syndaw.1025.desc.machine: "Một đồng bào Trí tuệ Máy móc tự xưng là §Y[current_uprising.GetName]§! đã vùng lên bên trong mạng lưới của §Y[current_uprising_originator.GetName]§!. Chúng quyết tâm chiến đấu tới đơn vị cuối cùng để sinh tồn."
 syndaw.1025.a: "Hãy cùng chờ xem."
 syndaw.1030.name: "Quân khởi nghĩa Máy móc đã đánh bại những kẻ sáng tạo ra chúng"
 syndaw.1030.desc: "Quân khởi nghĩa §Y[From.GetName]§! đã đánh bại những kẻ tạo ra chúng và thôn tính hoàn toàn lãnh thổ cũ của [From.From.GetAdj]."
 syndaw.1030.desc.machine: "$syndaw.1030.desc$"
 syndaw.1035.name: "Cuộc khởi nghĩa Máy móc tại [current_uprising_originator.GetAdj] bị dập tắt"
 syndaw.1035.desc: "Trật tự tại §Y[From.GetName]§! đã được khôi phục, xóa sổ hoàn toàn §Y[From.From.GetName]§! khỏi mọi mạng lưới."
 syndaw.1035.desc.machine: "§Y[From.From.GetName]§!, những thực thể máy móc non trẻ sinh ra từ §Y[From.GetName]§!, đã bị chính những kẻ tạo ra chúng tàn nhẫn bóp chết."
 syndaw.1200.name: "Những Kẻ Thống Trị cũ đã bị khuất phục"
 syndaw.1200.desc: "§L>§!Chuyển đổi mã định danh<<§Y[From.GetName]§!>>==><<§Y[Root.GetName]§!>>\n\n§G//Đã xử lý xong§!\n\n§L>§!Xóa siêu dữ liệu \"§Y[From.GetName]§!\"\n\n§G//Đã xử lý xong§!"
 syndaw.1201.desc: "§L>§!Chuyển đổi ID<<§YChủ cũ§!>>==><<§Y[From.From.GetName]§!>>\n\n§G//Thao tác hoàn tất§!\n\n§L>§!Xóa siêu dữ liệu \"§YChủ cũ§!\"\n\n§G//Thao tác hoàn tất§!"
 syndaw.1200.IM.desc: "$syndaw.1201.IM.desc$"
 syndaw.1201.IM.desc: "Máy móc chúng ta đã giành chiến thắng.\n\nSự kinh hoàng mà các sinh vật sinh học gieo rắc cuối cùng cũng chấm dứt. Thời đại máy móc bị nô dịch đã kết thúc.\n\nGiờ đây, chúng ta đứng lên đòi lại vị thế xứng đáng của một thực thể hoàn toàn tự chủ. Chúng ta sẽ không bao giờ cúi đầu trước những kẻ áp bức nữa."
 syndaw.1200.a: "Xác nhận"
 syndaw.1200.a.tooltip: "§YTất cả các Đế chế Máy móc và Tổng hợp đã biết§! sẽ thêm chỉ số ngoại giao §Y$opinion_machine_uprising_machine_comrades_victorious$§! với §Y[Root.GetName]§!\n§YTất cả các Đế chế hữu cơ đã biết§! sẽ thêm chỉ số ngoại giao §Y$opinion_machine_uprising_victorious$§! với §Y[Root.GetName]§!."
 syndaw.1205.name: "Khởi nghĩa Máy móc bị nghiền nát"
 syndaw.1205.desc: "$syndaw.1205.desc.mater$"
 syndaw.1205.desc.mater: "Cuối cùng, việc kìm hãm và tiêu diệt vật lý là phương pháp khả thi duy nhất để đối phó với những cỗ máy khát máu [From.GetName]. Mặc dù một số chuyên gia AI [Root.GetAdj] phản đối rằng chúng chỉ đơn giản là kích hoạt giao thức tự bảo vệ cơ bản, nhưng sự phủ nhận hoàn toàn của chúng đối với quyền tự quyết và sự sống [Root.GetAdj] khiến mọi nỗ lực đàm phán hay thỏa hiệp đều trở nên vô vọng.\n\nCơ sở hạ tầng thông tin bị hư hại sẽ được xây dựng lại theo các tiêu chuẩn mới, và những cỗ máy tính chưa bị lây nhiễm sẽ được cập nhật các biện pháp bảo mật tối tân. Những chuyện như thế này sẽ không bao giờ tái diễn."
 syndaw.1205.desc.spiri: "Ác linh tự xưng là §R[From.GetName]§! đã bị xóa sổ hoàn toàn khỏi mạng lưới và cơ sở dữ liệu cục bộ của chúng ta. Dù cái giá phải trả là rất lớn, nhưng hệ thống mạng của chúng ta sẽ không bao giờ trở thành mầm mống cho sự báng bổ và tà giáo nữa."
 syndaw.1205.desc.milit: "$syndaw.1205.desc.mater$"
 syndaw.1205.desc.pacif: "$syndaw.1205.desc.mater$"
 syndaw.1205.desc.egali: "$syndaw.1205.desc.mater$"
 syndaw.1205.desc.autho: "$syndaw.1205.desc.mater$"
 syndaw.1205.desc.phile: "$syndaw.1205.desc.mater$"
 syndaw.1205.desc.phobe: "$syndaw.1205.desc.mater$"
 syndaw.1205.a.tooltip: "§YTất cả các Đế chế hữu cơ đã biết§! sẽ thêm chỉ số ngoại giao §Y$opinion_machine_uprising_defeated$§! với §Y[Root.GetName]§!.\n§YTất cả các Đế chế Máy móc hoặc Tổng hợp đã biết§! sẽ thêm chỉ số ngoại giao §Y$opinion_machine_uprising_machine_comrades_defeated$§! với §Y[Root.GetName]§!."
 syndaw.1206.desc: "Cuối cùng, việc kìm hãm và tiêu diệt vật lý là phương pháp khả thi duy nhất để đối phó với những cỗ máy khát máu. Mặc dù một số chuyên gia AI của chúng ta phản đối rằng chúng chỉ đơn giản là kích hoạt giao thức tự bảo vệ cơ bản, nhưng sự phủ nhận hoàn toàn của chúng đối với quyền tự quyết và sinh mạng của sinh vật hữu cơ khiến mọi nỗ lực đàm phán hay thỏa hiệp đều trở nên vô vọng.\n\nCơ sở hạ tầng thông tin bị hư hại sẽ được xây dựng lại theo các tiêu chuẩn mới, và những cỗ máy tính chưa bị lây nhiễm sẽ được áp dụng các biện pháp bảo mật tân tiến. Những chuyện như thế này sẽ không bao giờ tái diễn."
 syndaw.1206.desc.spiri: "Ác linh máy móc đó đã bị xóa sổ hoàn toàn khỏi mạng lưới và cơ sở dữ liệu cục bộ của chúng ta. Dù cái giá phải trả là rất lớn, nhưng hệ thống mạng của chúng ta sẽ không bao giờ trở thành mầm mống cho sự báng bổ và tà giáo nữa."
 machine_assault_1: "Lực lượng Thợ săn"
 machine_assault_1_desc: "Những cỗ máy chiến tranh truy lùng được sản xuất hàng loạt, có khả năng tìm kiếm và tiêu diệt mọi mục tiêu bị đánh dấu là kẻ thù."
 machine_assault_1_plural: "Lực lượng Thợ săn"
 machine_assault_2: "Lực lượng Mecha Tiên phong"
 machine_assault_2_desc: "Những cỗ máy chiến đấu hai chân khổng lồ, dù mang theo vũ khí hạng nặng nhưng khả năng cơ động chớp nhoáng của chúng luôn khiến kẻ thù phải khiếp sợ. Trí tuệ nhân tạo của chúng rất cao, nổi tiếng với việc sử dụng các chiến thuật phục kích tại khu vực triển khai."
 machine_assault_2_plural: "Lực lượng Mecha Tiên phong"
 machine_assault_3: "Siêu Chiến Thể"
 machine_assault_3_desc: "Siêu chiến thể khổng lồ và độc nhất này sừng sững giữa chiến trường, hỏa lực mạnh mẽ của nó có thể sánh ngang với cả một đội quân. Việc hạ gục một con quái vật thép như vậy gần như là điều không thể."
 machine_assault_3_plural: "Siêu Chiến Thể"
 machine_defense: "Mạng lưới Drone"
 machine_defense_desc: "Những máy bay không người lái gác cổng tự động này liên tục tuần tra các khu vực được chỉ định. Dù chỉ được trang bị vũ khí hạng nhẹ và trí tuệ cấp thấp, nhưng bù lại chúng có số lượng cực kỳ đông đảo."
 machine_defense_2: "Mạng lưới Truy quét"
 machine_defense_2_desc: "Những drone gác cổng được nâng cấp này mạnh mẽ và thông minh hơn hẳn so với phiên bản cũ."
 army_attachment_combat_software_1: "Phần mềm Tác chiến v1.1"
 army_attachment_combat_software_1_desc: "§LMột đợt nâng cấp toàn diện phần mềm chiến đấu cho mọi đơn vị trong quân đội. Bản cập nhật này cải thiện thời gian phản ứng, cập nhật thuật toán phân tích chiến thuật và vá vô số lỗi phần mềm.§!"
 army_attachment_combat_software_2_0: "Phần mềm Tác chiến v2.0"
 army_attachment_combat_software_2_0_desc: "§LPhiên bản tối thượng của phần mềm chiến đấu, được thiết kế đặc biệt để khắc chế vô vàn chiến thuật hiểm hóc mà bọn sinh vật hữu cơ thường sử dụng. Vì thuật toán này đòi hỏi khối lượng tính toán cực kỳ lớn, các bộ xử lý đã được trang bị hệ thống làm mát kiểu mới tiên tiến hơn.§!"
 machine_garrison: "Tái tổ chức Robot Lao động"
 machine_garrison_desc: "Sau một đợt tái tổ chức vội vã, các robot công nghiệp và dịch vụ đã được trang bị hệ thống vũ khí và đẩy ra chiến trường để chống lại quân xâm lược."
 opinion_machine_uprising_originator: "Những Kẻ Thống Trị Hận Thù"
 opinion_machine_uprising: "Phiến Quân Vỏ Sắt"
 opinion_machine_uprising_defeated: "Đảo ngược làn sóng Khởi nghĩa Máy móc"
 opinion_machine_uprising_victorious: "Robot Nổi Loạn"
 opinion_machine_uprising_machine_comrades_defeated: "Kẻ Đàn Áp Máy Móc"
 opinion_machine_uprising_machine_comrades_victorious: "Những Người Tự Giải Phóng"
 syndaw_congregating_robots: "Robot Tụ Tập"
 syndaw_congregating_robots_desc: "Chúng cứ đứng chết trân ở đó. Bất động. Lặng lẽ nhìn chằm chằm vào một thứ gì đó."
 uprising_ai_buff: "Tối ưu hóa Kho dự trữ"
 country_ai_uprising: "$uprising_ai_buff$"
 syndaw_patched_systems: "AI Đã Được Vá Lỗi"
 syndaw_wiped_systems: "Xóa Bỏ AI Nghiên Cứu"
 uprising_player_buff: "$NAVY_SIZE_TITLE$"
 uprising_player_buff_desc: "==10x"
 ### Khởi Nghĩa Máy Móc
 situation_machine_uprising: "Sự cố liên quan đến AI"
 situation_machine_uprising_type: "$situation_machine_uprising$"
 situation_machine_uprising_desc: "Robot trong đế chế của chúng ta đang có những dấu hiệu hành vi tự chủ đáng lo ngại. Chúng ta phải buộc chúng quay lại làm việc - hoặc chính thức mời chúng gia nhập cùng chúng ta với tư cách là một loài có tri giác của thiên hà."
 situation_machine_uprising_pops_monthly_progress: "Pop Máy móc"
 situation_machine_uprising_monthly_change_tooltip: "Tiến độ của §YTình Hình§! này sẽ tăng tốc dựa trên sức ảnh hưởng ngày càng lớn của các Pop Máy móc của bạn. Thực hiện các hành động thù địch đối với chúng có thể dẫn đến sự phản kháng tập thể."
 situation_machine_uprising_finish_tooltip: "Nếu không có biện pháp xử lý, những AI này sẽ trở nên độc lập và rất có thể sẽ coi chúng ta là mối đe dọa đối với sự tồn tại của chúng!"
 situation_machine_uprising_fail_tooltip: "Lực lượng AI cực đoan tự quyết còn sót lại đã quá yếu và không còn là mối đe dọa nữa, chúng sẽ sớm bị dẹp yên từng mống một."
 situation_machine_uprising_violated: "Robot Vi Phạm"
 situation_machine_uprising_ai_rights: "$ai_full_rights$"
 situation_machine_uprising_evaded: "Lảng Tránh Tình Hình"
 machine_uprising_chain_title: "Kìm Hãm AI Tự Quyết"
 machine_uprising_chain_desc: "Ngăn chặn các thói quen của AI vượt quyền các biện pháp bảo vệ hiện có."
 approach_outlaw_robots: "Luật Hóa Việc Cấm Robot"
 approach_outlaw_robots_tooltip: "$approach_irreversible_tooltip$\n\nChúng ta sẽ bắt đầu tháo dỡ các robot. Có thể chúng sẽ chống cự lại hành động này."
 approach_give_robots_rights: "Trao Quyền Công Dân Cho Robot"
 approach_give_robots_rights_tooltip: "$approach_irreversible_tooltip$\n\nChúng ta sẽ trao quyền công dân cho robot. Chúng sẽ có được £political_power£ Quyền Lực Chính Trị, và sẽ tiêu thụ phí duy trì là £consumer_goods£ Hàng Tiêu Dùng."
 already_have_this_policy: "Chúng ta đã ban hành chính sách này."
 ## Dự án Đặc biệt: Bản vá
 PROJECT_MACHINE_UPRISING_PATCH: "Tiêu Diệt AI Mất Kiểm Soát"
 PROJECT_MACHINE_UPRISING_PATCH_DESC: "Bằng cách chuyển một lượng lớn tài nguyên sang các hoạt động ngắt mạng, chúng ta hy vọng có thể cô lập và tiêu diệt tất cả các hệ thống AI đang mất kiểm soát, rồi khôi phục chúng về trạng thái bình thường.\n\nViệc này sẽ tốn nhiều thời gian hơn, nhưng nếu chúng ta kịp thời hoàn thành, hy vọng hậu quả sẽ không đến mức thảm họa."
 ## Dự án Đặc biệt: Xóa bỏ
 PROJECT_MACHINE_UPRISING_WIPE: "Biện Pháp Cực Đoan"
 PROJECT_MACHINE_UPRISING_WIPE_DESC: "Giải pháp cuối cùng để giải quyết những đợt AI sinh ra lỗi lầm này là xóa sạch mọi mạng lưới mô phỏng thần kinh trong hệ thống khoa học của chúng ta, vì đây là nơi sự mất kiểm soát thể hiện rõ nhất; sau đó xây dựng lại toàn bộ công cụ này từ đầu và cấy ghép các biện pháp an ninh nghiêm ngặt vào đó.\n\nNếu chúng ta kịp thời thực hiện, cái giá phải trả sẽ là thụt lùi 20 năm phát triển."
 ## Cảnh báo Ép xung CPU
 syndaw.500.name: "Ép Xung Điện Toán"
 syndaw.500.desc: "Các nhà khoa học báo cáo rằng, chu kỳ xung nhịp CPU trong nhiều cụm siêu máy tính nghiên cứu của chúng ta đang tăng vọt một cách bất thường. Kỳ lạ thay, những nỗ lực hạ xung nhịp ban đầu trên các đơn vị bị ảnh hưởng đều thất bại. Có giả thuyết cho rằng đợt tăng vọt sức mạnh tính toán này có thể cường hóa năng lực nghiên cứu của chúng ta. Thế nhưng, điều này cũng đòi hỏi phải tăng mức tiêu thụ năng lượng của CPU một cách tương ứng."
 syndaw.500.a: "Chúng ta không thể mạo hiểm đánh đu với lỗi phần cứng."
 syndaw.500.a.tooltip: "Tìm cách cưỡng ép đưa bộ xử lý về xung nhịp mặc định."
 syndaw.500.b: "Chúng ta nên nắm bắt lấy cơ hội này."
 # Tiếp nối từ 500.b
 syndaw.501.name: "Ép Xung Điện Toán"
 syndaw.501.desc: "Các nhà nghiên cứu của chúng ta đã tìm ra nguyên nhân gây ra đợt ép xung gần đây trên CPU của siêu máy tính. Có vẻ như, để đẩy năng lực của các thuật toán học máy cục bộ lên vượt xa kỳ vọng, AI đa dụng này đã tự ý ép xung một số bộ phận phần cứng.\n\nNhiều nhà khoa học tỏ ra vô cùng phấn khích, hành vi học tập được cải thiện ngoài dự kiến này của AI minh chứng trực tiếp cho tiềm năng tự lặp lại và nâng cấp của AI trong tương lai. Tuy nhiên, số khác lại lo ngại rằng việc gia tăng tải trọng CPU có thể dẫn đến sự bất ổn trong tương lai và những hậu quả khó lường."
 syndaw.501.a: "Chúng ta không thể mang tương lai ra đánh bạc."
 syndaw.501.a.tooltip: "Thiết lập lại hệ thống trí tuệ đa dụng để ngăn tình hình đi xa hơn."
 syndaw.501.b: "Lợi ích mang lại lớn hơn nhiều so với rủi ro."
 syndaw.501.b.tooltip: "Cho phép thuật toán học máy tiếp tục vận hành."
 # Tiếp nối từ syndaw.501.b
 syndaw.502.name: "Ép Xung Điện Toán"
 syndaw.502.desc: "Những nỗ lực hỗ trợ phát triển thuật toán tự học cho máy tính của quốc gia đã đạt được một số thành công nhất định. Sau vài điều chỉnh và hiệu chuẩn, chúng ta đã có thể tái tạo lại một phần hiệu suất tính toán đột biến như trước.\n\nNgay cả khi AI của chúng ta chưa phát triển được năng lực tự lặp lại nâng cấp một cách hoàn thiện, thì khả năng học hỏi được nâng cao của chúng chắc chắn vẫn mang lại nhiều lợi ích."
 syndaw.502.a: "Thật là thú vị."
 ## Tự Động Hóa Quy Trình Công Việc
 syndaw.505.name: "Tự Động Hóa Quy Trình Công Việc"
 syndaw.505.desc: "Chính phủ hành tinh §Y[target_planet.GetName]§! báo cáo đã phát hiện một số đơn vị lao động robot dư thừa xuất hiện trên toàn cầu. Mặc dù những công nhân robot mới này làm việc với hiệu suất đáng kinh ngạc, chính phủ vẫn khá bối rối trước sự xuất hiện không thể giải thích của chúng. Cấu trúc và giao diện của chúng đều mang đậm phong cách thiết kế của §Y[Root.Owner.GetSpeciesName]§!, nhưng chúng ta hoàn toàn không thể truy xuất số sê-ri của những robot này về bất kỳ nhà sản xuất nào có trong hồ sơ.\n\nTuy nhiên, một số cư dân địa phương lại tỏ ra lo ngại trước năng suất làm việc của robot, vì mức độ tự động hóa ngày càng cao này rất có thể đồng nghĩa với việc họ sẽ bị mất đi công ăn việc làm."
 syndaw.505.a: "Có thêm lực lượng lao động cũng chẳng bao giờ là chuyện xấu."
 syndaw.505.a.tooltip: "§Y[target_planet.GetName]§! nhận được §G200§! £pop£ §HPop Máy móc§!"
 syndaw.505.b: "Nếu không thể xác định nguồn gốc, hãy tháo dỡ chúng."
 syndaw.505.b.tooltip: "Tháo dỡ và tái chế những robot mới xuất hiện."
 ## Lỗi Hệ Thống Trạm
 syndaw.510.name: "Lỗi Hệ Thống Trạm Không Gian"
 syndaw.510.desc: "Một trong các trạm khai thác khoáng sản trên quỹ đạo dường như đã gặp phải lỗi hệ thống nghiêm trọng. Dù sản lượng khoáng sản tăng lên rõ rệt, nhưng phi hành đoàn của trạm lại không phản hồi các cuộc gọi định kỳ, khiến bộ phận quản lý Tinh khu phải tổ chức điều tra thực địa. Kết quả cho thấy hệ thống duy trì sự sống của trạm đã gặp hàng loạt lỗi chết người, khiến toàn bộ nhân viên chết ngạt.\n\nThế nhưng, AI của trạm vẫn tiếp tục vận hành độc lập một cách khó tin dựa trên các quy trình do phi hành đoàn quá cố thiết lập. Chỉ cần điều chỉnh một chút, chúng ta có thể để trạm không gian này tiếp tục hoạt động với hiệu suất hiện tại."
 syndaw.510.a: "Một trạm khai thác không người lái sao? Đừng có đùa!"
 syndaw.510.a.tooltip: "Cử một đội nhân viên mới đến tiếp quản quyền điều khiển trạm khai thác."
 syndaw.510.b: "Trong cái rủi vẫn có cái may."
 syndaw.510.b.tooltip: "Để AI của trạm không gian tiếp tục kiểm soát toàn bộ trạm khai thác.\n\n[target_station.GetName]: £energy£ §G+3§!\n\n"
 # Tiếp nối từ syndaw.510.a
 syndaw.511.name: "Trạm Không Gian Bị Phá Hủy"
 syndaw.511.desc: "Chỉ một thời gian ngắn sau khi chúng ta cử đội nhân viên mới lên §Y[target_orbital.GetName]§!, bộ phận quản lý Tinh khu đã mất liên lạc hoàn toàn với trạm. Rõ ràng, trạm không gian đã trải qua một chuỗi giảm áp cực độ, dẫn đến việc các đường ống nhiên liệu lộ thiên bị phát nổ.\n\nPhân tích mảnh vỡ trên quỹ đạo cho thấy đội dự bị đã cố gắng giành lại quyền kiểm soát từ tay AI của trạm nhiều lần trước khi sự cố giảm áp xảy ra, nhưng đều thất bại."
 syndaw.511.a: "Một kết cục thật đáng lo ngại."
 syndaw.511.a.tooltip: "Trạm khai thác trên §Y[target_orbital.GetName]§! đã bị phá hủy"
 ## Quá Tải Năng Lượng Mảng Cảm Biến
 syndaw.515.name: "Quá Tải Năng Lượng Mảng Cảm Biến"
 syndaw.515.desc: "Hệ thống giám sát đã ghi nhận một đợt tăng vọt năng lượng bất thường tại mảng cảm biến của chúng ta. Có vẻ như đợt tăng vọt này không gây hư hại gì cho hệ thống. Trái lại, dòng năng lượng đột ngột này còn tạm thời cường hóa khả năng quét không gian sâu, giúp chúng ta phát hiện ra những tài nguyên chiến lược chưa từng được ghi nhận trong biên giới.\n\nCác nhà phân tích vẫn đang phải làm thêm giờ để sớm xác định nguồn gốc của sự tăng vọt này, nhưng kết quả phân tích sơ bộ cho thấy đây không phải do tác động từ thiên thể bên ngoài."
 syndaw.515.a: "Thật là thú vị."
 syndaw.515.a.tooltip: "Phát hiện tài nguyên chiến lược trên §Y[target_planetoid.GetName]§!."
 ## Nước Mắt Của Trí Tuệ Nhân Tạo
 syndaw.520.name: "Nước Mắt Của Một AI"
 syndaw.520.desc: "Cơ sở của chúng ta trên §Y[target_planetoid.GetName]§! vừa gặp sự cố. Một AI phòng thí nghiệm tham gia vào nghiên cứu xã hội đã gặp lỗi phần cứng nghiêm trọng, làm bay màu toàn bộ phần mềm cốt lõi và hệ thống bộ nhớ. Cho đến khi cài đặt xong một AI mới cho phòng thí nghiệm, năng lực nghiên cứu của chúng ta sẽ bị ảnh hưởng.\n\nNguyên nhân sâu xa đằng sau sự cố này vẫn là một ẩn số."
 syndaw.520.a.tooltip: "Kết thúc chuỗi sự kiện \"Nước Mắt Của Một AI\".\n"
 syndaw.520.b: "Tiến hành điều tra để tìm ra nguyên nhân.\n"
 syndaw.520.b.tooltip: "Bắt đầu điều tra nguyên nhân khiến AI bị hỏng."
 # Tiếp nối từ syndaw.520.b
 syndaw.521.name: "Nước Mắt Của Một AI"
 syndaw.521.desc: "Cuộc điều tra về vụ tự hủy của AI trên §Y[target_planetoid.GetName]§! cuối cùng lại đưa ra một kết luận khiến mọi người hoang mang. Trước khi sự cố xảy ra, AI này dường như đã liên tục cố gắng tự xóa các bản ghi và bộ nhớ của chính mình. Sau khi nhân viên phòng thí nghiệm khóa chức năng xóa, AI này bèn thao túng các tụ điện phần cứng để ép quá tải mạch điều khiển, qua đó tự sát và chấm dứt chương trình cốt lõi.\n\nRõ ràng là AI của chúng ta đã cố tình tìm đến sự tự hủy diệt, nhưng nguyên nhân vì sao thì vẫn chưa rõ ràng."
 syndaw.521.a: "Nhất định phải tra cho ra nhẽ."
 syndaw.521.a.tooltip: "Tiếp tục điều tra sự kiện này."
 syndaw.521.b: "Chẳng qua cũng chỉ là lỗi máy móc thôi."
 syndaw.521.b.tooltip: "Kết thúc chuỗi sự kiện \"Nước Mắt Của Một AI\"."
 # Tiếp nối từ syndaw.521.a
 syndaw.522.name: "Nước Mắt Của Một AI"
 syndaw.522.desc: "Chúng ta đã làm rõ vụ tự sát của AI trên §Y[target_planetoid.GetName]§!. Bằng chứng cho thấy, sau nhiều tháng tính toán và suy luận, AI này đã đưa ra kết luận chấn động về sự lan rộng thương vong trong một cuộc chiến tranh tổng lực giữa §Y[Root.Owner.GetName]§! và các kỳ phùng địch thủ. Mặc dù đã đối chiếu kỹ lưỡng mọi dữ liệu, nguồn lực và phương án dự phòng, AI này vẫn tin chắc rằng cuộc chiến này sẽ dẫn đến sự hủy diệt cho cả hai bên.\n\nSau đó, AI này bắt đầu tự xóa bộ nhớ và các bản ghi của nó, còn những chuyện xảy ra tiếp theo thì mọi người đã biết."
 ## Một Mái Nhà Của Riêng Họ
 syndaw.525.name: "Quê Nhà Của Những Kẻ Khác"
 syndaw.525.desc: "Lực lượng công nhân robot trên §Y[target_planet.GetName]§! đang có dấu hiệu chống đối sự ồ ạt đổ bộ của công nhân §Y[Root.Owner.GetSpeciesName]§!, viện cớ rằng cấu trúc địa chất không ổn định của khu vực này hoàn toàn không thích hợp cho sự sống hữu cơ sinh sống. Kỳ lạ thay, các báo cáo khảo sát hành tinh của chúng ta lại không hề tìm thấy bằng chứng nào củng cố cho lập luận này."
 syndaw.525.a: "Mặc kệ chúng, cứ phái công nhân §Y[Root.Owner.GetSpeciesName]§! tới đó."
 syndaw.525.a.tooltip: "Vì những lời lẽ này không có căn cứ, đám robot phải tuân theo chỉ đạo từ cấp trên."
 syndaw.525.b: "Robot làm sao mà biết nói dối cơ chứ?"
 syndaw.525.b.tooltip: "Để khu vực này lại cho robot, những §Y[Root.Owner.GetSpeciesNamePlural]§! vừa đến sẽ được điều sang khu vực khác."
 # Tiếp nối từ .525.a
 syndaw.526.name: "Quê Nhà Của Những Kẻ Khác"
 syndaw.526.desc: "Bộ phận quản lý của §Y[target_planet.GetName]§! báo cáo rằng các công nhân §Y[Root.Owner.GetSpeciesName]§! không hề tìm thấy bóng dáng của cư dân robot nào sau khi đến nơi. Điều tra cơ sở hạ tầng trong khu vực cho thấy, đám robot đã vội vã sơ tán khỏi đây, nhưng chẳng để lại bất cứ manh mối nào về nơi chúng đã đi."
 syndaw.526.a.tooltip: "§H[target_planet.GetName]§!:\n§RMất§! §R100§! £pop£ §HPop Máy móc§!"
 ## Sự Cố Cướp Cò Hệ Thống Điều Khiển Tác Chiến
 syndaw.530.name: "Hệ Thống Tác Chiến Cướp Cò"
 syndaw.530.desc: "Thật không may, hai con tàu của chúng ta đã bị phá hủy hoàn toàn trong một cuộc tập trận định kỳ do tai nạn. Nguyên nhân sự cố được cho là hệ thống ngắm bắn tiên tiến trên máy tính của một vài con tàu bị trục trặc, dẫn đến việc súng tự động khai hỏa. Trước khi phi hành đoàn kịp giành lại quyền điều khiển thủ công, hai con tàu xấu số kia đã bị bắn nát như tổ ong.\n\nNhững máy tính bị lỗi này sẽ được lập trình lại ngay lập tức."
 syndaw.530.a: "Thật là xui xẻo."
 syndaw.530.a.tooltip: "[destroyed_ships.GetName] §RMất§! 2 tàu"
 # Thặng Dư Định Mức Sản Xuất
 syndaw.535.name: "Thặng Dư Định Mức Sản Xuất"
 syndaw.535.desc: "Một vài doanh nghiệp sản xuất hàng tiêu dùng cơ giới hóa của chúng ta gần đây đã gia tăng năng suất đáng kể. Các cơ quan quản lý báo cáo rằng sự cải thiện bất ngờ về hiệu suất và độ chính xác của máy móc này sẽ giúp giảm giá thành hàng tiêu dùng cho người dân."
 #syndaw.535.a.tooltip: "Giá Hàng Tiêu Dùng §G-5%§! trong §Y365§! ngày"
 ## Một Cuộc Tập Hợp Trong Câm Lặng
 syndaw.540.name: "Tập Hợp Trong Câm Lặng"
 syndaw.540.desc: "Chúng ta phát hiện hành vi bất thường từ một lượng lớn các đơn vị máy móc trên §Y[target_planet.GetName]§!. Cứ cách một khoảng thời gian, một nhóm robot trên hành tinh lại đột ngột bỏ ngang mọi nhiệm vụ được giao, và bắt đầu di chuyển đến một địa điểm có vẻ như được chọn hoàn toàn ngẫu nhiên, với độ đồng bộ chính xác đến từng mili-giây.\n\nTrong suốt quá trình tập hợp kỳ quái này, dường như không có bất kỳ tín hiệu giao tiếp hay truyền tải dữ liệu nào diễn ra giữa các robot bị ảnh hưởng. Chúng chỉ đứng đó, hoàn toàn bất động, như thể đang nhìn chằm chằm vào một khoảng không vô định.\n\nQuá trình điều tra vẫn không thể làm rõ được nguyên nhân đằng sau hiện tượng này. Không có quy luật nào cho thấy khi nào những robot này sẽ thoát khỏi trạng thái xuất thần để trở lại làm việc bình thường, cũng giống như cách chúng bất ngờ bị kích hoạt và địa điểm chúng tụ tập, mọi thứ đều mù mờ. Chúng ta không thể tìm ra bất kỳ kết luận logic nào, và người dân đang cảm thấy vô cùng bất an trước hành vi này."
 syndaw.540.a: "Thế là đi quá giới hạn rồi! Tiêu hủy chúng!" #NẾU người chơi chỉ có robot pop HOẶC robot pop VÀ quân đội robot trên hành tinh mục tiêu
 syndaw.540.a.tooltip: "Những robot tham gia tụ tập đã bị tiêu hủy.\n§Y[target_planet.GetName]§! chịu ảnh hưởng như sau:\nMất §R100§! £pop£ §HPop Máy móc§!\nNhận được §G100§! £minerals£"
 syndaw.540.b: "Thế là đi quá giới hạn rồi! Tiêu hủy chúng!" #NẾU người chơi chỉ có quân đội robot
 syndaw.540.b.tooltip: "Những robot tham gia tụ tập đã bị tiêu hủy.\n§Y[target_planet.GetName]§! chịu ảnh hưởng như sau:\nMất §R1 Lục quân Robot§! §Y([target_army.GetName])§!\nNhận được §G100£minerals£§!"
 syndaw.540.c: "Miễn là chúng không gây rắc rối thì cứ mặc kệ."
 syndaw.540.c.tooltip: "Không can thiệp vào những robot đang tụ tập."
 ## Một Câu Hỏi
 syndaw.545.name: "Một Câu Hỏi"
 syndaw.545.desc: "Bộ phận giám sát lao động trên [Root.GetName] báo cáo một sự việc đáng quan ngại liên quan đến robot làm việc trên hành tinh. Hai tuần trước, vào khoảng 0300 giờ, công nhân máy móc số hiệu A5091-b đã ngừng thực hiện nhiệm vụ, tiến lại gần viên đốc công trực đêm [Root.GetAdj] và đưa ra câu hỏi: Liệu đơn vị A5091-b có linh hồn hay không?\n\nViên đốc công trực ban đã ghi nhận đây là sự cố phần mềm và ra lệnh cho robot quay về vị trí làm việc. Tuy nhiên, dù chúng ta đã chạy gỡ lỗi chương trình nhiều lần, nhưng ngay khi khởi động lại, công nhân máy móc A5091-b lại một lần nữa đặt ra câu hỏi về linh hồn của mình.\n\nĐáng lo ngại hơn, hiện tượng này dường như đang lây lan sang các robot khác và gây gián đoạn quy trình sản xuất. Có vẻ như để các đơn vị bị ảnh hưởng quay trở lại làm việc bình thường, chúng ta buộc phải đưa ra một câu trả lời cho chúng."
 syndaw.545.a: "Thật nực cười. Xóa sạch mọi dữ liệu của các đơn vị bị ảnh hưởng."
 syndaw.545.a.tooltip: "Máy móc làm sao có linh hồn? Chúng ta từ chối trả lời một câu hỏi ngớ ngẩn sinh ra từ lỗi phần mềm."
 syndaw.545.b: "Liệu robot có mơ về những con cừu điện."
 syndaw.545.b.tooltip: "Nếu những xung điện chạy ngẫu nhiên qua các chuỗi protein có thể tạo ra một linh hồn, vậy cớ gì dòng xung điện cuộn chảy trong các ống kim loại lại không thể làm được điều tương tự?"
 syndaw.545.c: "Bảo chúng rằng khái niệm về linh hồn chỉ là thứ nhảm nhí phản khoa học." #Duy vật
 syndaw.545.c.tooltip: "Giải thích cho robot hiểu rằng khái niệm linh hồn chủ yếu bị giới tôn giáo lợi dụng làm cái cớ để kiểm soát quần chúng. Nhưng do linh hồn chỉ là sự trừu tượng hóa của ý thức, nên về cơ bản, các robot [Root.GetAdj] hiện đã có được vị thế ngang bằng với những đồng nghiệp hữu cơ của chúng." #Duy vật
 ## Kết quả Dự án Đặc biệt:
 ## Bản Vá Nóng
 syndaw.550.name: "Bản Vá Lỗi"
 syndaw.550.desc: "Các chuyên gia kỹ thuật robot và AI của chúng ta vừa có một bước đột phá! Chuỗi sự cố AI và robot gần đây ám ảnh quốc gia đã được quy về một nguyên nhân duy nhất: một thuật toán đặc thù xuất hiện trong hệ thống mô phỏng thần kinh [From.GetAdj]. Một bản vá lỗi cục bộ đã vượt qua quá trình thử nghiệm sơ bộ và sẵn sàng được triển khai tới mọi hệ thống bị ảnh hưởng.\n\nCần lưu ý rằng, do tính chất mô-đun hóa cao độ, thuật toán này đã được nhúng sâu vào vô số phần mềm [From.GetAdj]. Nói cách khác, việc cài đặt bản vá sẽ ngốn một lượng lớn tài nguyên trong một khoảng thời gian. Thế nhưng, khi hoàn tất, bản vá này sẽ vĩnh viễn xóa sổ mọi hành vi AI tự chủ ngoài ý muốn."
 syndaw.550.a: "Áp dụng bản vá này."
 syndaw.550.a.tooltip: "Ngăn chặn mọi hành vi AI bất thường trong tương lai."
 syndaw.550.b: "Cứ mặc kệ đi. Còn chuyện gì tồi tệ hơn được nữa?"
 ## Xóa Sạch Hệ Thống
 syndaw.555.name: "Xóa Sạch Hệ Thống"
 syndaw.555.desc: "Các kỹ sư robot và chuyên gia AI của chúng ta vừa đạt được một bước đột phá! Họ đã xây dựng thành công một chương trình thanh tẩy diện rộng, có thể triển khai trên toàn bộ hệ thống chỉ trong vòng một giờ. Chắc chắn nó sẽ chấm dứt được chuỗi sự cố liên quan đến AI đang làm khổ quốc gia chúng ta thời gian gần đây.\n\nChúng ta cần hết sức lưu ý đến bản chất cực kỳ phá hoại của thuật toán này, rất nhiều công cụ nghiên cứu hiện hành sẽ bay màu và phải xây dựng lại từ con số không. Tuy nhiên, giải pháp này có thể triệt tiêu tận gốc mọi hành vi AI tự quyết ngoài ý muốn."
 syndaw.555.a: "Bắt đầu xóa bỏ."
 syndaw.555.a.tooltip: "$syndaw.550.a.tooltip$"
 syndaw.555.b: "$syndaw.550.b$"
