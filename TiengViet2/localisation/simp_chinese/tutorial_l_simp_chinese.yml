l_simp_chinese:
 SITLOG: "Nhật Ký Tình Hình Đã Cập Nhật"
 ####################################
 #Tin Nhắn Hướng Dẫn Của Cố Vấn
 ####################################
 TUTORIAL_GOVERNMENTVIEW_GOVERNMENT_TITLE: "Chính Phủ"
 TUTORIAL_GOVERNMENTVIEW_GOVERNMENT_DESC: "Giao diện §SChính Phủ§! hiển thị thông tin về đế chế và chính quyền của chúng ta. Tại đây, bạn có thể xem §SNgười Cai Trị§! hiện tại và các hiệu ứng liên quan.\n\nMột giao diện khác sẽ hiển thị dữ liệu §SThống Kê Dân Số§! của đế chế."
 TUTORIAL_TECH_VIEW_TITLE: "Hướng Dẫn: Công Nghệ"
 TUTORIAL_TECH_VIEW_DESC: "Bạn có thể chỉ định hướng đầu tư nghiên cứu hiện tại trong giao diện §SCông Nghệ§!. Công nghệ được chia thành ba nhóm lớn, mỗi nhóm thường có ba lựa chọn công nghệ để nghiên cứu.\n\nBa lĩnh vực này lần lượt là £physics£Vật Lý Học, £society£Xã Hội Học và £engineering£Kỹ Thuật Học.\n\nĐể nghiên cứu §SCông Nghệ§!:\n\n£dot_green£ Nhấp vào nút §SChọn Công Nghệ§!\n£dot_green£ Chọn một tùy chọn\n\nBổ nhiệm một §SGiám Đốc Khoa Học§! có thể đẩy nhanh tiến độ nghiên cứu. Dù không bắt buộc, nhưng điều này cực kỳ được khuyến khích! Hơn nữa, các §SĐặc Tính§! của lãnh đạo được bổ nhiệm cũng sẽ mang lại những hiệu ứng gia tăng nhất định.\n\nBạn cũng có thể nhấp vào nút §SBật Nghiên Cứu Tự Động§! trong từng lĩnh vực để hệ thống tự động tiến hành nghiên cứu.\n\n$tttt$$ttt$£automate_research£\n"
 TUTORIAL_CONTACTSVIEW_EMPIRES_TITLE: "Hướng Dẫn: Liên Lạc"
 TUTORIAL_CONTACTSVIEW_EMPIRES_DESC: "Trong giao diện §SLiên Lạc§!, chúng ta có thể xem thông tin của tất cả các §SĐế Chế§! mà chúng ta từng chạm trán. Thái độ §SNgoại Giao§! của họ đối với chúng ta được thể hiện rõ ràng, và chúng ta cũng có thể dễ dàng triển khai các hoạt động §SNgoại Giao§! một cách nhanh chóng.\n\nMỗi mục đều hiển thị các thông tin chi tiết quan trọng, chẳng hạn như §SChính Thể§!, §SEthic§!, và §SĐế Chế Cấp Bậc§!.\n\nTại đây, chúng ta có thể truy cập các hoạt động §STình Báo§! và xem các §SThỏa Thuận§! hiện có với từng đế chế."
 TUTORIAL_SITUATION_LOG_TITLE: "Hướng Dẫn: Nhật Ký Tình Hình"
 TUTORIAL_SITUATION_LOG_DESC: "§SNhật Ký Tình Hình§! liệt kê chi tiết các §SDự Án Đặc Biệt§! hiện có, £archaeology£§SDi Tích Khảo Cổ§! và một số vấn đề khác cần lưu tâm.\n\nCùng với sự mở rộng khám phá vũ trụ, các mục mới cũng sẽ lần lượt xuất hiện."
 TUTORIAL_SHIP_DESIGNER_TITLE: "Hướng Dẫn: Thiết Kế Tàu"
 TUTORIAL_SHIP_DESIGNER_DESC: "Tất cả các §STàu§! hiện đang phục vụ trong đế chế của chúng ta đều có thể được thiết kế tại đây. Khi công nghệ phát triển, bạn có thể mở khóa các §SLoại Tàu§! và §SPhụ Tùng§! mới.\n\nĐể tạo một §SThiết Kế§! mới:\n\n£dot_green£ Nhấp vào nút §SThiết Kế Mới§!\n£dot_green£ Chọn §SQuy Cách Thân Tàu§!\n£dot_green£ Nhấp vào nút §SKhông Có Phân Đoạn§! và chọn một §SPhân Đoạn§!\n\nSau đó, nhấp vào các khe trống và tự do lựa chọn từ các §SPhụ Tùng Tàu§! có sẵn.\n\n\n$tttt$$tt$£slot_component£\n\n\nSau khi lưu, thiết kế mới có thể được chế tạo tại bất kỳ §SCăn Cứ Sao§! nào có xây dựng §SỤ Tàu§!."
 TUTORIAL_EMPIREVIEW_PLANETS_TITLE: "Hướng Dẫn: Hành Tinh và Tinh Khu"
 TUTORIAL_EMPIREVIEW_PLANETS_DESC: "Giao diện §SHành Tinh và Tinh Khu§! cung cấp cái nhìn tổng quan về tất cả các hành tinh thuộc địa của chúng ta, số lượng £pops£§SDân Số§! và §SSản Lượng Tài Nguyên§! của chúng.\n\nKhi đế chế phát triển, các hành tinh có thể được gộp thành các §STinh Khu§! để dễ dàng quản lý.\n\n£vassal£§SChư Hầu§! có thể được tạo ra từ các §STinh Khu§! hiện có."
 TUTORIAL_MILITARY_FLEET_TITLE: "Hướng Dẫn: Hạm Đội Quân Sự"
 TUTORIAL_MILITARY_FLEET_DESC: "§SHạm Đội Quân Sự§! có khả năng bảo vệ đế chế của chúng ta khỏi các mối đe dọa... và nếu bạn đủ tham vọng, mũi nhọn của hạm đội cũng chính là biên giới của đế chế.\n\nQuy mô hạm đội của chúng ta bị giới hạn bởi §SSức Chứa Hạm Đội§! hiện tại. Ban đầu con số này rất hạn chế, nhưng có thể được gia tăng thông qua các cách sau:\n\n£dot_green£ Nghiên cứu §SCông Nghệ§! mới\n£dot_green£ Tăng số lượng £pops£Dân Số\n£dot_green£ Xây dựng §SNeo Đậu Căn Cứ Sao§!\n\nChúng ta có thể chỉ định một £commander£§SChỉ Huy§! cho một hạm đội. Điều này không chỉ nâng cao sức mạnh chiến đấu của hạm đội mà còn mang lại các hiệu ứng gia tăng khác từ £leader£§SLãnh Đạo§! này."
 TUTORIAL_SCIENCE_SHIP_TITLE: "Hướng Dẫn: Khảo Sát"
 TUTORIAL_SCIENCE_SHIP_DESC: "Đây là £science_ship£§STàu Khoa Học§! của chúng ta, được sử dụng để §SKhảo Sát§! các thiên thể, chẳng hạn như £planet£§SHành Tinh§! trong một £system£§SHệ Sao§!. Cần phải khảo sát hành tinh trước thì mới có thể thăm dò được các §STài Nguyên§! trên đó.\n\nHệ sao mẹ của chúng ta đã được khảo sát hoàn tất, vì vậy chúng ta có thể tập trung nỗ lực vào những nơi khác.\n\nChọn §STàu Khoa Học§!,\n\n£dot_green£ Nhấp chuột phải vào một §SHệ Sao§! lân cận\n£dot_green£ Chọn §SKhảo Sát Hệ Sao§!"
 TUTORIAL_CONSTRUCTION_SHIP_TITLE: "Hướng Dẫn: Tàu Công Trình"
 TUTORIAL_CONSTRUCTION_SHIP_DESC: "Đây là £construction_ship£§STàu Công Trình§! của chúng ta, có thể dùng để xây dựng các trạm không gian.\n\nSau khi khảo sát xong một thiên thể, ví dụ như một £planet£§SHành Tinh§!, chúng ta có thể điều động con tàu này đến đó để xây dựng một £science_ship£§STrạm Nghiên Cứu§! hoặc £mining_station£§STrạm Khai Thác§! nhằm khai thác và sử dụng các nguồn tài nguyên trên đó.\n\nNhững §STàu§! này cũng có thể được dùng để [GetBuildGrow] §SCăn Cứ Sao§! tại các £system£§SHệ Sao§! vô chủ, do đó, loại tàu này đóng vai trò vô cùng quan trọng đối với kế hoạch bành trướng của chúng ta."
 TUTORIAL_PLANETVIEW_PLANET_TITLE: "Hướng Dẫn: Bề Mặt"
 TUTORIAL_PLANETVIEW_PLANET_DESC: "Thẻ §SBề Mặt§! được dùng để xem tổng quan cơ sở hạ tầng và trạng thái của một £planet£§SHành Tinh§!.\n\nPhần £building£§SPhân Khu và Kiến Trúc§! hiển thị các ô công trình đã xây xong và đang chờ xây dựng trong các phân khu tương ứng.\n\n£district£§SPhân Khu§! và §SĐặc Khu§! cung cấp £housing£§SChỗ Ở§!, £job£§SVị Trí Công Việc§! và tài nguyên.\n\nCông tắc §STự Động Hóa§! cho phép hành tinh tự quản lý dựa trên trọng tâm tập trung hiện tại.\n\nThanh §SThống Kê Hành Tinh§! ở đầu cửa sổ hiển thị £stability£§SĐộ Ổn Định§!, £crime£§SĐộ Tội Phạm§!, các hiệu ứng điều chỉnh đang có tác dụng và §SThống Đốc§! được chỉ định."
 TUTORIAL_PLANETVIEW_TILES_TITLE: "Hướng Dẫn: Kinh Tế"
 TUTORIAL_PLANETVIEW_TILES_DESC: "Thẻ §SKinh Tế§! phác thảo tình hình chung về §SLực Lượng Lao Động§! và £job£§SVị Trí Công Việc§!.\n\nDân số trên £planet£§SHành Tinh§! được chia thành các §SGiai Cấp§! khác nhau, nhấp vào có thể mở rộng để xem các loại §SVị Trí Công Việc§! khác nhau bên trong. £pops£§SDân Số§! sẽ tự động lấp đầy toàn bộ giai cấp để đáp ứng nhu cầu §SLực Lượng Lao Động§!.\n\n§SVị Trí Công Việc§! sẽ tiêu thụ và sản xuất các loại tài nguyên khác nhau.\n\nDân số cần £housing£§SChỗ Ở§! và £amenities£§STiện Nghi§!.\n\nBất kỳ sự thiếu hụt cơ sở hạ tầng nào cũng sẽ làm giảm £happiness£§SĐộ Hạnh Phúc§! của hành tinh, và cuối cùng có thể dẫn đến sự sụt giảm £stability£§SĐộ Ổn Định§! tổng thể."
 TUTORIAL_PLANETVIEW_COMBAT_TITLE: "Hướng Dẫn: Lục Quân"
 TUTORIAL_PLANETVIEW_COMBAT_DESC: "Thẻ §SLục Quân§! được sử dụng để quản lý lực lượng mặt đất trên hành tinh. Giao diện này cũng hiển thị mức độ §STàn Phá§! mà £planet£§SHành Tinh§! phải gánh chịu, tức là đã chịu bao nhiêu sát thương.\n\nNhấp vào nút §SChiêu Mộ§! để có thể huấn luyện §SLục Quân§! mới tại đây.\n\n§SQuân Phòng Thủ§! được tự động tạo ra bởi £pops£§SDân Số§! làm công việc Người Thực Thi Pháp Luật hoặc [soldier.GetName]§SVị Trí Công Việc§!. Những £job£§SVị Trí Công Việc§! này được cung cấp bởi Tòa Thị Chính, £building£§SĐồn Cảnh Sát§!, và £building£§SPháo Đài§!."
 TUTORIAL_PLANETVIEW_SPACEPORT_TITLE: "Cảng Không Gian"
 TUTORIAL_PLANETVIEW_SPACEPORT_DESC: "Giao diện §SCảng Không Gian§! có thể xem hạm đội trên quỹ đạo, [GetBuildGrow] tàu dân sự. Tàu quân sự chỉ có thể được chế tạo tại §SCăn Cứ Sao§! có §SỤ Tàu§!, nhưng tàu công trình, tàu khoa học và §STàu Thuộc Địa§! có thể được chế tạo trong giao diện này.\n\nChỉ cần vẫn còn một £planet£§SHành Tinh§! có thể sinh sống, ngay cả khi mất tất cả các căn cứ sao, bạn vẫn có thể chấn chỉnh lại lực lượng."
 TUTORIAL_MILITARY_STATION_TITLE: "Trạm Phòng Thủ"
 TUTORIAL_MILITARY_STATION_DESC: "§STrạm Phòng Thủ§! được dùng để bảo vệ một số £planet£§SHành Tinh§! quan trọng và duy trì phòng thủ tĩnh tại các tuyến đường chiến lược, nhưng nó chỉ có thể được xây dựng trong biên giới quốc gia hoặc tại các khu vực có quyền đi lại đặc biệt.\n\nHãy cẩn thận đừng [GetBuildGrow] quá nhiều trạm không gian quân sự, chúng cũng cần chi phí bảo trì giống như §SChiến Hạm§!."
 TUTORIAL_RESEARCH_STATION_TITLE: "Hướng Dẫn: Trạm Nghiên Cứu"
 TUTORIAL_RESEARCH_STATION_DESC: "Trên quỹ đạo của các thiên thể có thể xây dựng £science_ship£§STrạm Nghiên Cứu§!, nó có thể thu thập điểm nghiên cứu £physics£§SVật Lý§!, £engineering£§SKỹ Thuật§!, £society£§SXã Hội§!.\n\nTrạm nghiên cứu chỉ có thể được xây dựng trong lãnh thổ đế chế, các £planet£§SHành Tinh§! đã bị thuộc địa hóa không cần xây thêm trạm nghiên cứu."
 TUTORIAL_MINING_STATION_TITLE: "Trạm Khai Thác"
 TUTORIAL_MINING_STATION_DESC: "£mining_station£§STrạm Khai Thác§! có thể thu thập £minerals£§SKhoáng Sản§! và £strategic_resource£§STài Nguyên Chiến Lược§! của thiên thể mà nó quay quanh.\n\nTài nguyên trên các £planet£§SHành Tinh§! đã bị thuộc địa hóa không cần đến §STrạm Khai Thác§! vẫn có thể sử dụng được. Trạm khai thác chỉ có thể được xây dựng trong lãnh thổ đế chế."
 TUTORIAL_TRANSPORT_SHIP_TITLE: "Hướng Dẫn: Tàu Vận Tải"
 TUTORIAL_TRANSPORT_SHIP_DESC: "Khi §SLục Quân§! nhận lệnh tiến vào không gian, họ sẽ tự động lên tàu §SVận Tải§!. Tàu vận tải gần như không có khả năng tự vệ, vì vậy chúng phải được bảo vệ."
 TUTORIAL_DIPLOMACY_VIEW_TITLE: "Hướng Dẫn: Ngoại Giao"
 TUTORIAL_DIPLOMACY_VIEW_DESC: "Trong giao diện §SNgoại Giao§!, chúng ta có thể giao tiếp với các nền văn minh khác. Ví dụ như §STuyên Chiến§!, thiết lập §SMạng Lưới Tình Báo§! ở nước láng giềng, thành lập §SLiên Minh§!, ký kết §SHiệp Định Thương Mại§! và nhiều thứ khác. Chúng ta cũng có thể xem §HCấp Độ Tình Báo§! hiện tại.\n\n§SMối Quan Hệ§! của bạn với các quốc gia khác sẽ được hiển thị ở năm cấp độ, từ cực kỳ tồi tệ đến cực kỳ tốt đẹp. Để đạt được các thỏa thuận hoặc hiệp định, phải có cấp độ quan hệ đủ cao.\n\n£envoy£§SĐặc Phái Viên§! của bạn có thể được cử đến các quốc gia khác để thực hiện các hoạt động §SGián Điệp§! nhằm thu thập §STình Báo§!, lách qua các yêu cầu hạn chế về cấp độ §SMối Quan Hệ§!, hoặc §SCải Thiện§! và §SLàm Xấu Đi Mối Quan Hệ§!."
 TUTORIAL_DIPLOMACY_VIEW_TRADE_TITLE: "Hướng Dẫn: Thương Mại"
 TUTORIAL_DIPLOMACY_VIEW_TRADE_DESC: "Đây là §SGiao Diện Thương Mại§!. Chúng ta có thể giao dịch bất kỳ loại §STài Nguyên§! nào với các quốc gia khác, cũng có thể là §STình Báo§! và §SHỗ Trợ Ngoại Giao§!.\n\nHỗ trợ ngoại giao có thể tăng cường mức độ sẵn sàng chấp nhận thỏa thuận của một quốc gia khác. Bạn cũng có thể yêu cầu hỗ trợ ngoại giao để tăng sức mạnh ngoại giao của mình trong các cuộc bỏ phiếu tại Thượng Viện của §HCộng Đồng Thiên Hà§!."
 TUTORIAL_DIPLOMACY_VIEW_FEDERATION_TITLE: "Loại Hình Liên Bang"
 TUTORIAL_DIPLOMACY_VIEW_FEDERATION_DESC: "§SLoại Hình Liên Bang§! quyết định trọng tâm phát triển của £federation£§SLiên Bang§!. Mỗi loại hình liên bang đều có §SĐặc Quyền và Luật Pháp§! ban đầu độc đáo và sẽ §SMở Khóa§! nhiều hơn sau khi nhận được điểm kinh nghiệm."
 TUTORIAL_DIPLOMACY_VIEW_HIGHINTEL_TITLE: "Hướng Dẫn: Cấp Độ Tình Báo Cao"
 TUTORIAL_DIPLOMACY_VIEW_HIGHINTEL_DESC: "Chúng ta đã đạt được §SCấp Độ Tình Báo Cao§! ở quốc gia này, như vậy chúng ta có cách để lấy được một lượng lớn thông tin về họ.\n\nDuy trì cấp độ tình báo cao đối với quốc gia này sẽ đảm bảo chúng ta nắm bắt kịp thời §SEthic§!, §SIdeal§!, §SMối Quan Hệ§! với các quốc gia khác của họ, cũng như sức mạnh §SCông Nghệ§!, §SKinh Tế§! và §SQuân Sự§! của họ so với chúng ta."
 TUTORIAL_DIPLOMACY_VIEW_LOWINTEL_TITLE: "Hướng Dẫn: Cấp Độ Tình Báo Thấp"
 TUTORIAL_DIPLOMACY_VIEW_LOWINTEL_DESC: "§SCấp Độ Tình Báo§! của chúng ta tại đế chế này đang suy giảm. Chúng ta có thể mất đi những thông tin tình báo đã thu thập trước đó, và tình báo cũng sẽ bị §STrễ Hạn§! theo thời gian.\n\nĐể nâng cao §SCấp Độ Tình Báo§!:\n\n£dot_green£ Duy trì §SHiệp Định Ngoại Giao§!\n£dot_green£ Cử £envoy£§SĐặc Phái Viên§! để cải thiện mối quan hệ\n£dot_green£ Duy trì §SMạng Lưới Tình Báo§!\n£dot_green£ Thiết lập §SĐại Sứ Quán§! trong lãnh thổ của họ."
 TUTORIAL_PLANETVIEW_ADJACENCY_BONUS_TITLE: "Hiệu Ứng Kề Cận"
 TUTORIAL_PLANETVIEW_ADJACENCY_BONUS_DESC: "Một số £building£§SKiến Trúc§! sẽ tạo ra §SHiệu Ứng Kề Cận§! đối với các §SKiến Trúc§! trên các ô §SĐất§! lân cận, khi xây dựng kiến trúc mới, bạn nên cân nhắc điều này."
 TUTORIAL_GOVERNMENTVIEW_BUDGET_TITLE: "Ngân Sách"
 TUTORIAL_GOVERNMENTVIEW_BUDGET_DESC: "Thẻ §SNgân Sách§! hiển thị £energy £Năng Lượng§SThu Nhập§! và §SChi Phí§! hàng tháng của đế chế, đồng thời có thể xem xét một loạt các yếu tố ảnh hưởng đến tình hình kinh tế."
 TUTORIAL_GOVERNMENTVIEW_DECISIONS_TITLE: "Sắc Lệnh"
 TUTORIAL_GOVERNMENTVIEW_DECISIONS_DESC: "Tại đây, chúng ta có thể ban hành các §SSắc Lệnh§! của đế chế, tức là thực hiện các thao tác tốn kém một số tài nguyên, mang lại hiệu ứng ảnh hưởng đến toàn bộ đế chế.\n\nSắc lệnh tiêu hao chi phí bảo trì hàng tháng, có thể được chi trả bằng §H$EDICT_FUND$§! hoặc chi tiêu trực tiếp bằng £unity£§YSự Đoàn Kết§!."
 TUTORIAL_GOVERNMENTVIEW_DEMOGRAPHICS_TITLE: "Hướng Dẫn: Thống Kê Dân Số"
 TUTORIAL_GOVERNMENTVIEW_DEMOGRAPHICS_DESC: "Thẻ §SThống Kê Dân Số§! hiển thị thành phần và sự phân bố dân số của đế chế.\n\nNgoài ra, nó còn hiển thị các §SĐặc Tính§! chính của £pops£§SDân Số§! đế chế, cũng như ảnh hưởng của chúng đối với hiệu suất sản xuất, £happiness£§SĐộ Hạnh Phúc§!..."
 TUTORIAL_EMPIREVIEW_LEADERS_TITLE: "Hướng Dẫn: Lãnh Đạo"
 TUTORIAL_EMPIREVIEW_LEADERS_DESC: "Giao diện §SLãnh Đạo§! sẽ hiển thị cái nhìn tổng quan về các £leader£§SLãnh Đạo§! mà bạn đang sở hữu. Tại đây, bạn có thể thuê, sa thải và quản lý họ.\n\n§SLoại§! của lãnh đạo sẽ quyết định chức vụ mà họ có thể đảm nhiệm, cũng như vai trò mà họ có thể đóng trong §SNội Các§!.\n\nDanh sách §SLãnh Đạo§! có thể được thuê sẽ làm mới định kỳ. Số lượng lãnh đạo mà bạn có thể sở hữu không phải là vô hạn. Một khi vượt quá giới hạn sức chứa hiện tại, chi phí bảo trì sẽ tăng lên và lượng kinh nghiệm thu được sẽ giảm đi. Để tránh phải chịu những hình phạt trên, hãy giải tán những lãnh đạo đang rảnh rỗi."
 TUTORIAL_EMPIREVIEW_FACTIONS_TITLE: "Hướng Dẫn: Phe Phái"
 TUTORIAL_EMPIREVIEW_FACTIONS_DESC: "Giao diện §SPhe Phái§! hiển thị cái nhìn tổng quan về khuynh hướng chính trị của dân số. Hãy nhớ rằng, những biến đổi trong bầu không khí chính trị xã hội có thể làm nảy sinh các §SPhe Phái§! mới. Nơi đây cũng hiển thị quy mô của §SPhe Phái§!, mức độ thu hút đối với £pops£§SDân Số§! của chúng ta, cũng như thông tin chi tiết về mức độ hài lòng của phe phái.\n\nCác §SPhe Phái§! có những §SYêu Sách§! riêng, điều này ảnh hưởng rất lớn đến §SĐộ Tán Thành§! của họ. Các chính sách và hành động của quốc gia có thể chọc giận hoặc làm hài lòng các nhóm này, từ đó làm tăng sản lượng £unity£§SSự Đoàn Kết§!.\n\nThực lực của các §SPhe Phái§! và bản chất §SYêu Sách§! của họ sẽ thay đổi tùy theo tình hình, nhưng hãy luôn nhớ rằng £happiness£§SĐộ Hạnh Phúc§! của §SDân Số§! sẽ bị chi phối bởi §SĐộ Tán Thành§! của §SPhe Phái§! mà họ thuộc về.\n\nChúng ta cũng có thể sử dụng chức năng §SQuản Lý Phe Phái§! để điều chỉnh mối quan hệ giữa một §SPhe Phái§! nhất định với quốc gia, thậm chí là tiếp nhận hệ tư tưởng của một §SPhe Phái§! hùng mạnh nào đó."
 TUTORIAL_CREATESECTOR_TITLE: "Hướng Dẫn: Quản Lý Tinh Khu"
 TUTORIAL_CREATESECTOR_DESC: "Để thiết lập một §STinh Khu§!, trước tiên hãy chọn một £planet£§SHành Tinh§! nằm trong §SKhu Vực Biên Giới§! và nhấn nút Tạo Tinh Khu. Thao tác này sẽ chỉ định hành tinh đó làm §SThủ Phủ§! của tinh khu mới, và tất cả các hệ sao thuộc khu vực biên giới nằm trong bán kính sáu lần nhảy siêu không gian sẽ được sáp nhập vào tinh khu này. Khi được chuyển sang chế độ tự động và cấp ngân sách, tinh khu có thể tự động xây dựng các £building£§SCông Trình§! trên hành tinh, giúp giảm thiểu đáng kể khối lượng công việc quản lý vi mô."
 TUTORIAL_CONTACTSVIEW_SPECIES_TITLE: "Hướng Dẫn: Giống Loài"
 TUTORIAL_CONTACTSVIEW_SPECIES_DESC: "Giao diện §SGiống Loài§! liệt kê tất cả các dạng sống có trí tuệ mà chúng ta từng chạm trán. Bạn có thể nhấp vào nút §SChuyển Đổi Giống Loài§! để chuyển đổi qua lại giữa việc hiển thị các giống loài đang sống tại quốc gia chúng ta hoặc tất cả các giống loài đã biết trong dải ngân hà.\n\nNếu chúng ta sở hữu công nghệ liên quan và chính sách cho phép, chúng ta có thể §SChỉnh Sửa§! đặc tính của giống loài hoặc §SNâng Tầm§! các sinh vật chưa được khai trí. Bạn cũng có thể §SThiết Lập Quyền Mặc Định§! cho tất cả £pops£§SDân Số§! trong quốc gia chúng ta hoặc §SThiết Lập Quyền§! riêng biệt cho một giống loài cụ thể."
 TUTORIAL_PLANETVIEW_TERRAFORM_TITLE: "Hướng Dẫn: Cải Tạo Môi Trường"
 TUTORIAL_PLANETVIEW_TERRAFORM_DESC: "Có thể thay đổi môi trường của £planet£§SHành Tinh§! thông qua §SCải Tạo Môi Trường§!, khiến nó trở nên phù hợp hơn với một §SGiống Loài§! nhất định để sinh sống, hoặc dùng cho các mục đích khác."
 TUTORIAL_GENEMODIFICATION_TITLE: "Chỉnh Sửa Gen"
 TUTORIAL_GENEMODIFICATION_DESC: "Chúng ta có thể chỉnh sửa các §SĐặc Tính§! của giống loài thông qua công nghệ kỹ thuật di truyền.\n\nDựa trên các đặc tính mới được lựa chọn, một §SBản Mẫu§! giống loài mới sẽ được tạo ra. Trước khi tiến hành chỉnh sửa gen cho £pops£§SDân Số§! của giống loài đó, hãy nhấp vào nút §SÁp Dụng Bản Mẫu§! để tạo ra một §SDự Án Đặc Biệt§! mới."
 TUTORIAL_UPLIFTING_TITLE: "Nâng Tầm"
 TUTORIAL_UPLIFTING_DESC: "Chúng ta có thể chỉnh sửa §SĐặc Tính§! của các sinh vật nguyên thủy, §SNâng Tầm§! chúng trở thành những công dân có trí tuệ và năng lực sản xuất của quốc gia chúng ta."
 TUTORIAL_SYSTEMVIEW_TITLE: "Xem Trước Hệ Sao"
 TUTORIAL_SYSTEMVIEW_DESC: "Giao diện hiện tại là §SXem Trước Hệ Sao§!. Bằng cách chọn một £system£§SHệ Sao§! cụ thể, bạn có thể dễ dàng quan sát các £planet£§SHành Tinh§!, cảng không gian và hạm đội bên trong."
 TUTORIAL_WORMHOLE_STATION_TITLE: "Trạm Lỗ Sâu"
 TUTORIAL_WORMHOLE_STATION_DESC: "§STrạm Lỗ Sâu§! được xây dựng ở vùng ngoại vi của £system£§SHệ Sao§!, có khả năng chuyển hóa những vết nứt siêu nhỏ trong không thời gian thành các kênh liên kết hai chiều dẫn đến các hệ sao khác. Thật là một kiệt tác của sự khéo léo."
 TUTORIAL_OBSERVATION_STATION_TITLE: "Hướng Dẫn: Trạm Quan Sát"
 TUTORIAL_OBSERVATION_STATION_DESC: "Tại §STrạm Quan Sát§!, một đội ngũ £scientist£§SNhà Khoa Học§! đang túc trực, thực hiện nhiệm vụ quan sát và nghiên cứu giống loài §STiền Siêu Quang Tốc§! trên £planet£§SHành Tinh§! mà nó đang quay quanh.\n\nTùy thuộc vào §SĐạo Đức§! và trình độ công nghệ của đế chế, bạn có thể lựa chọn các phương thức tiếp cận như quan sát thụ động, tác động văn hóa, khai sáng công nghệ, hoặc thậm chí là tiến hành bắt cóc hay thâm nhập.\n\nNhững lựa chọn này sẽ định hình quỹ đạo phát triển của nền văn minh đó, cũng như thái độ của họ đối với đế chế của bạn."
 TUTORIAL_TERRAFORMING_STATION_TITLE: "Trạm Cải Tạo Môi Trường"
 TUTORIAL_TERRAFORMING_STATION_DESC: "§STrạm Cải Tạo Môi Trường§! có khả năng tiến hành quá trình §SCải Tạo Môi Trường§! trên hành tinh."
 TUTORIAL_PLANETVIEW_EDICTS_TITLE: "Quyết Nghị"
 TUTORIAL_PLANETVIEW_EDICTS_DESC: "Đây là những §SQuyết Nghị§! cấp hành tinh, tức là các quy định hoặc mệnh lệnh mang tính tạm thời, cần tiêu tốn một lượng tài nguyên nhất định để thực thi, và hiệu ứng của chúng chỉ giới hạn trong phạm vi hành tinh áp dụng.\n\nCùng với việc nghiên cứu thành công các công nghệ mới và đối mặt với những tình huống mới, các §SQuyết Nghị§! mới cũng sẽ lần lượt được mở khóa."
 TUTORIAL_UNKNOWN_ALIEN_FLEET_TITLE: "Không Xác Định"
 TUTORIAL_UNKNOWN_ALIEN_FLEET_DESC: "Phát hiện sự xuất hiện của §SVật Thể Bay Không Xác Định§!. Thông qua việc hoàn thành các §SDự Án Đặc Biệt§! nhất định, chúng ta có thể thu thập thêm thông tin về chúng, thậm chí có thể thiết lập §SCuộc Chạm Trán Đầu Tiên§!."
 TUTORIAL_VICTORY_TITLE: "Hướng Dẫn: Chiến Thắng"
 TUTORIAL_VICTORY_DESC: "Giao diện §SChiến Thắng§! liệt kê các §SĐiều Kiện Cụ Thể§! mà chúng ta cần phải nỗ lực đạt được, nhằm đảm bảo sự tồn tại lâu dài và vững bền của đế chế giữa muôn vàn các dạng sống có trí tuệ khác trong dải ngân hà."
 TUTORIAL_OUTPOST_STATION_TITLE: "Hướng Dẫn: Căn Cứ Sao"
 TUTORIAL_OUTPOST_STATION_DESC: "Đây là §SCăn Cứ Sao§! trong hệ sao của chúng ta. Những trạm không gian có khả năng nâng cấp này là biểu tượng cho quyền sở hữu hệ sao, và thường đảm nhận vai trò sản xuất các loại §SChiến Hạm§!.\n\nChúng ta có thể mở rộng biên giới bằng cách [GetBuildingGrowing] §SCăn Cứ Sao§! tại các hệ sao lân cận.\n\nTrong các cuộc xung đột, việc tấn công §SCăn Cứ Sao§! của kẻ thù sẽ cho phép chúng ta chiếm quyền kiểm soát chúng.\n\n§SCăn Cứ Sao§! có thể được chuyên môn hóa chức năng thông qua việc lắp đặt các loại §SModule§! và £building£§SCông Trình§! khác nhau, đồng thời chúng cũng thường đóng vai trò là phòng tuyến cuối cùng của hệ sao trước các hạm đội địch."
 TUTORIAL_GALAXY_MAP_TITLE: "Bản Đồ Thiên Hà"
 TUTORIAL_GALAXY_MAP_DESC: "§SBản Đồ Thiên Hà§! phô bày những §SVùng Chưa Được Khám Phá§! rộng lớn, ranh giới lãnh thổ của chúng ta, cũng như phạm vi lãnh thổ của tất cả các nền văn minh ngoài hành tinh mà chúng ta đã thiết lập liên lạc.\n\nBằng cách nhấp vào nút §SBản Đồ Chi Tiết§! trên thanh menu ở góc dưới bên phải, bạn có thể chuyển đổi chế độ hiển thị giữa §STài Nguyên§! và §SPhạm Vi Thăm Dò§!."
 TUTORIAL_WAR_GOAL_TITLE: "Mục Tiêu Chiến Tranh"
 TUTORIAL_WAR_GOAL_DESC: "Khi ban bố lời tuyên chiến, chúng ta phải công khai rõ ràng ý định của mình cho cả kẻ thù lẫn các đồng minh. Những §SMục Tiêu Chiến Tranh§! này sẽ định hình nên các điều kiện mà chúng ta có thể đưa ra trên bàn đàm phán hòa bình, mục tiêu của ngài có thể trải rộng từ việc sáp nhập các £system£§SHệ Sao§! đã được tuyên bố chủ quyền cho đến việc thành lập các quốc gia chư hầu.\n\nSau khi tuyên bố mục tiêu, kẻ địch sẽ có cơ hội để đưa ra phản ứng —— họ có thể lập tức đầu hàng, hoặc cố gắng mặc cả và đề xuất một thỏa thuận đình chiến, hay thậm chí là tử thủ để bảo vệ quyền lợi của mình cho đến khi cá thể đực, cá thể cái, bào tử nấm hay sinh vật ăn cỏ bán trí tuệ cuối cùng ngã xuống. Việc nắm thóp được điểm tới hạn tâm lý của kẻ thù chính là một trong những phần thú vị nhất của cuộc chơi!\n\nBạn có thể lựa chọn §SMục Tiêu Chiến Tranh§! từ danh sách được cung cấp."
 TUTORIAL_WAROVERVIEW_TITLE: "Tổng Quan Chiến Tranh"
 TUTORIAL_WAROVERVIEW_DESC: "Giao diện này cung cấp cái nhìn tổng quan về cuộc chiến mà chúng ta đang tham gia. Mức độ §SMệt Mỏi Chiến Tranh§! của cả hai bên được quyết định bởi tiến trình của cuộc xung đột, và nó phản ánh mức độ sẵn sàng chấp nhận một hiệp ước hòa bình của các bên tham chiến.\n\nNếu mức độ mệt mỏi chiến tranh của một bên chạm mốc 100%, bên còn lại có thể ép buộc họ phải chấp nhận một hiệp ước duy trì §SHiện Trạng§!. Toàn bộ lịch sử các trận đánh đã diễn ra trong cuộc chiến đều có thể được tra cứu tại đây."
 TUTORIAL_STRATEGIC_RESOURCES_TITLE: "Tài Nguyên Chiến Lược"
 TUTORIAL_STRATEGIC_RESOURCES_DESC: "Giao diện §HTài Nguyên Chiến Lược§! tiến hành phân loại các £strategic_resource£§STài Nguyên Chiến Lược§! mà chúng ta hiện đang sở hữu cùng với hiệu ứng của chúng.\n\nNhiều loại §STài Nguyên Chiến Lược§! đòi hỏi phải có những §SCông Nghệ§! đặc thù thì mới có thể tiến hành khai thác và tận dụng."
 TUTORIAL_EXPANSION_PLANNER_TITLE: "Hướng Dẫn: Công Cụ Lập Kế Hoạch Bành Trướng"
 TUTORIAL_EXPANSION_PLANNER_DESC: "Tại giao diện §HCông Cụ Lập Kế Hoạch Bành Trướng§!, chúng ta có thể tìm thấy những £planet£§SHành Tinh§! §SPhù Hợp Để Sinh Sống§! nằm trong khu vực lân cận, có thể dùng để thiết lập thuộc địa. Chúng ta có thể [GetBuildGrow] £colony_ship£§STàu Thuộc Địa§! và ban phát mệnh lệnh trực tiếp cho chúng ngay từ giao diện này.\n\nTrước khi tiến hành thuộc địa hóa, chúng ta bắt buộc phải tiến hành thăm dò hành tinh và nghiên cứu tất cả các hiện tượng bất thường được phát hiện trên đó.\n\nNgoài ra, bạn cũng cần phải xây dựng một §SCăn Cứ Sao§! tại £system£§SHệ Sao§! chứa §SHành Tinh§! đó để sáp nhập nó vào trong lãnh thổ quốc gia."
 TUTORIAL_TRADITIONS_TITLE: "Hướng Dẫn: Truyền Thống"
 TUTORIAL_TRADITIONS_DESC: "§HTruyền Thống§! hiển thị các §SCây Truyền Thống§! hiện có sẵn cho quốc gia của chúng ta.\n\nTrước tiên, một §SCây Truyền Thống§! phải được §SChấp Nhận§!, sau đó bạn mới có thể mở khóa các £traditions£§STruyền Thống§! nằm bên trong nó.\n\nViệc §SChấp Nhận§! một §SCây Truyền Thống§! hoặc mở khóa một §STruyền Thống§! đòi hỏi phải tiêu tốn một lượng £unity£§HĐoàn Kết§! nhất định —— và chi phí này sẽ không ngừng leo thang cùng với số lượng §STruyền Thống§! được mở khóa và sự phát triển lớn mạnh của đế chế.\n\nĐể chấp nhận một §SCây Truyền Thống§!:\n\n£dot_green£ Nhấp vào nút §SLựa Chọn§!\n£dot_green£ Nhấp vào nút §SChấp Nhận§! trên cây truyền thống mà bạn muốn chọn\n\nBạn có thể di chuột lên trên một §SCây Truyền Thống§! để xem các §STruyền Thống§! hiện có thể mở khóa."
 TUTORIAL_TRADITIONS_SELECT_TITLE: "Chấp Nhận Một Cây Truyền Thống"
 TUTORIAL_TRADITIONS_SELECT_DESC: "Nơi đây hiển thị toàn bộ các §HCây Truyền Thống§! mà quốc gia chúng ta hiện có thể lựa chọn. Tại đây, bạn có thể xem xét chi tiết tất cả các £traditions£§HTruyền Thống§!, hiệu ứng §HChấp Nhận§! và hiệu ứng §HHoàn Thành§! của từng cây truyền thống.\n\nTôi khuyên bạn nên bắt đầu với những §HCây Truyền Thống§! này."
 TUTORIAL_TRADITIONS_NEW_TITLE: "Truyền Thống Mới hoặc Cây Truyền Thống Mới"
 TUTORIAL_TRADITIONS_NEW_DESC: "Khi quốc gia của chúng ta tích lũy đủ lượng £unity£§HĐoàn Kết§!, bạn có thể §HLựa Chọn§! một §HCây Truyền Thống Mới§! hoặc mở khóa những £traditions£§HTruyền Thống§! mới từ các cây truyền thống mà bạn đã chọn trước đó."
 TUTORIAL_ASCENSION_PERKS_TITLE: "Hướng Dẫn: Đặc Quyền Thăng Thiên"
 TUTORIAL_ASCENSION_PERKS_DESC: "Danh sách §HThăng Thiên§! hiển thị các §SĐặc Quyền Thăng Thiên§! mà chúng ta có khả năng mở khóa. Một số §SĐặc Quyền Thăng Thiên§! có thể đi kèm với các yêu cầu đặc thù, ví dụ như cần phải nghiên cứu một §SCông Nghệ§! cụ thể hoặc đã mở khóa được một số lượng §SO Thăng Thiên§! nhất định.\n\nMột §HO Thăng Thiên§! sẽ được mở khóa sau khi chúng ta tiếp nhận toàn bộ các £traditions£§HTruyền Thống§! bên trong một §SCây Truyền Thống§!."
 TUTORIAL_SPECIES_RIGHTS_TITLE: "Hướng Dẫn: Quyền Lợi Giống Loài"
 TUTORIAL_SPECIES_RIGHTS_DESC: "§HQuyền Lợi Giống Loài§! cho phép chúng ta thiết lập §SQuyền Công Dân§!, §STiêu Chuẩn Sống§! và một số vấn đề khác cho một giống loài cụ thể.\n\nCác §SQuyền Lợi Mặc Định§! được thiết lập sẽ được áp dụng cho tất cả £pops£§SDân Số§! không được thiết lập §SQuyền Lợi Giống Loài§! cụ thể —— chẳng hạn như người nhập cư, người tị nạn, hoặc những cư dân mới đến định cư tại quốc gia của chúng ta."
 TUTORIAL_FLEET_MANAGER_TITLE: "Hướng Dẫn: Quản Lý Hạm Đội"
 TUTORIAL_FLEET_MANAGER_DESC: "Trong giao diện §SQuản Lý Hạm Đội§!, bạn có thể tạo ra các khuôn mẫu cho hạm đội. Khi quy mô hạm đội ngày càng mở rộng, những khuôn mẫu đã được thiết lập này sẽ giúp việc bổ sung lực lượng cho các hạm đội bị tổn thất trở nên nhanh chóng và thuận tiện hơn rất nhiều."
 TUTORIAL_CLAIMS_VIEW_TITLE: "Hướng Dẫn: Yêu Sách"
 TUTORIAL_CLAIMS_VIEW_DESC: "Trong giao diện §SYêu Sách§!, bạn có thể tiêu hao £influence£§SSức Ảnh Hưởng§! để đưa ra yêu sách đối với các £system£§SHệ Sao§! đang thuộc quyền sở hữu của các quốc gia khác.\n\nViệc đưa ra yêu sách đối với các §SHệ Sao§! của quốc gia khác sẽ mang lại cho bạn một §SLý Do Tuyên Chiến§!, cho phép bạn tuyên chiến với mục tiêu là chinh phục hệ sao đó.\n\nNếu nhiều đồng minh trong phe chiến thắng cùng đưa ra yêu sách đối với một §SHệ Sao§!, quốc gia có cấp độ §SYêu Sách§! cao nhất sẽ trở thành chủ sở hữu mới của hệ sao đó sau khi chiến tranh kết thúc."
 TUTORIAL_ANOMALIES_TITLE: "Hướng Dẫn: Hiện Tượng Dị Thường"
 TUTORIAL_ANOMALIES_DESC: "Giao diện §SHiện Tượng Dị Thường§! liệt kê toàn bộ những §SHiện Tượng Dị Thường§! mà chúng ta đã chạm trán nhưng chưa tiến hành điều tra, cùng với vị trí của chúng. Bạn có thể phái một £science_ship£§STàu Khoa Học§! dưới sự chỉ huy của một £scientist£§SGiám Đốc Khoa Học§! đến để tiến hành khảo sát."
 TUTORIAL_GOVERNMENTVIEW_MARKET_TITLE: "Hướng Dẫn: Thị Trường Nội Địa"
 TUTORIAL_GOVERNMENTVIEW_MARKET_DESC: "Chúng ta có thể thực hiện các giao dịch mua bán tài nguyên thông qua giao diện £market£§SThị Trường§!. Khởi đầu, thị trường này mang tính chất hoàn toàn nội địa, thế nhưng khi có đủ số lượng các đế chế thiết lập quan hệ với nhau, một hình thức §SThị Trường Thương Mại Toàn Thiên Hà§! nào đó rất có thể sẽ được hình thành.\n\nTại đây, các tài nguyên được mua bán bằng đơn vị tiền tệ là £trade£§SGiá Trị Thương Mại§!. Mọi giao dịch mua bán thành công đều sẽ tác động đến giá cả: hành động mua vào sẽ làm giá cả tăng lên, trong khi hành động bán ra sẽ khiến giá cả giảm xuống.\n\nChức năng §SGiao Dịch Tự Động§! có thể được thiết lập để thực thi định kỳ hàng tháng."
 TUTORIAL_GOVERNMENTVIEW_SLAVE_MARKET_TITLE: "Hướng Dẫn: Thị Trường Nô Lệ"
 TUTORIAL_GOVERNMENTVIEW_SLAVE_MARKET_DESC: "Có tiền mua tiên cũng được. Tại §SThị Trường Nô Lệ§!, việc mua bán £pops£§SDân Số§! cũng chẳng khác gì những loại hàng hóa thông thường khác, số phận của họ bị quăng quật không thương tiếc giữa các vì sao. Sau khi giao dịch thành công, §SDân Số§! mới sẽ được vận chuyển tự động đến £planet£§SHành Tinh§! mà bạn đã chọn, chẳng cần phải bận tâm đến vấn đề phương tiện đi lại. Chi phí cho dịch vụ này đã được tính trọn gói trong giá mua... dĩ nhiên là bạn phải trả tiền cho điều đó."
 #TUTORIAL_PLANETVIEW_CORPORATE_TITLE: "Giao Diện Doanh Nghiệp"
 #TUTORIAL_PLANETVIEW_CORPORATE_DESC: "Thẻ doanh nghiệp cho phép các §SSiêu Tập Đoàn§! xây dựng §SChi Nhánh§! trên các hành tinh của các Đế chế khác, với điều kiện họ đã ký kết các giấy tờ cần thiết. Sau khi xây dựng xong, họ cũng có thể xem và nâng cấp các cơ sở vật chất của mình tại đây. Như chúng ta đã biết, các Tập đoàn lớn luôn mong muốn mang đến những điều tốt đẹp nhất cho khách hàng của họ, bất chấp những sự kiện đã xảy ra ở chu kỳ thứ 23."
 TUTORIAL_GOVERNMENTVIEW_POLICIES_TITLE: "Hướng Dẫn: Chính Sách"
 TUTORIAL_GOVERNMENTVIEW_POLICIES_DESC: "Giao diện §SChính Sách§! bao quát toàn bộ các §SChính Sách§! của chính phủ, mang đến những tác động sâu rộng đến quá trình vận hành của đế chế chúng ta.\n\nĐối với một §SChính Sách§! cụ thể, thường sẽ có một vài lập trường khác nhau để chúng ta có thể áp dụng, và những sự lựa chọn của chúng ta sẽ bị giới hạn bởi trình độ công nghệ cũng như §SEthic§! của đế chế."
 TRADE_VIEW_DESC: "Khi đế chế của chúng ta ngày càng mở rộng và lớn mạnh, §SThương Mại§! giữa các £planet£§SHành Tinh§! sẽ đóng một vai trò ngày càng then chốt trong nền kinh tế. Các §SCăn Cứ Sao§! được trang bị §STrung Tâm Thương Mại§! sẽ có nhiệm vụ thu thập §SGiá Trị Thương Mại§! bên trong £system£§SHệ Sao§! của chúng, sau đó vận chuyển về §SThủ Đô§! để chuyển hóa thành £energy£§SNăng Lượng§!.\n\nNếu một §SCăn Cứ Sao§! được lắp đặt càng nhiều §STrung Tâm Thương Mại§!, nó sẽ càng có khả năng thu thập §SGiá Trị Thương Mại§! từ các hệ sao lân cận. Tuy nhiên, những tuyến đường thương mại trù phú rất có thể sẽ thu hút sự chú ý của bọn §SHải Tặc§!, nhưng chúng có thể bị trấn áp bởi các hạm đội §STuần Tra§!, cũng như các §SModule Phòng Thủ§! trên §SCăn Cứ Sao§!. Trong đó, §SModule Chứa Máy Bay§! tỏ ra đặc biệt hữu hiệu trong nhiệm vụ này."
 PLANETVIEW_CORPORATE_DESC: "Nếu các hiệp định liên quan đã được ký kết, giao diện doanh nghiệp sẽ cho phép §SSiêu Tập Đoàn§! thành lập các chi nhánh trên £planet£§SHành Tinh§! thuộc về các đế chế khác. Sau khi xây dựng hoàn tất, bạn có thể xem và nâng cấp các cơ sở này ngay tại đây. Mặc dù những sự kiện của chu kỳ 23 đã xảy ra, nhưng tất cả chúng ta đều hiểu rõ rằng, các tập đoàn lớn luôn dốc lòng vì lợi ích của khách hàng."
 TUTORIAL_FEDERATION_VIEW_TITLE: "Hướng Dẫn: Liên Bang"
 TUTORIAL_FEDERATION_VIEW_DESC: "Đây là §HGiao Diện Liên Bang§!. £federation£§SLiên Bang§! của chúng ta sẽ ngày càng vững mạnh hơn khi các quốc gia thành viên duy trì được mức độ §SĐoàn Kết§! tốt đẹp. Ngược lại, mỗi khi có một thành viên mới gia nhập, liên bang của chúng ta sẽ bị sụt giảm một lượng đoàn kết nhất định.\n\nViệc cử £envoy£§SĐặc Phái Viên§! đến liên bang sẽ giúp cải thiện mức độ đoàn kết.\n\nKhi liên bang của chúng ta lớn mạnh hơn, chúng ta cũng sẽ không ngừng §SMở Khóa Các Cường Hóa§! để hướng tới sự hợp tác cùng có lợi ở những cấp độ cao hơn."
 TUTORIAL_FEDERATION_VIEW_ENVOYS_TITLE: "Hướng Dẫn: Đặc Phái Viên Liên Bang"
 TUTORIAL_FEDERATION_VIEW_ENVOYS_DESC: "Việc phái thêm £envoy£§SĐặc Phái Viên§! đến £federation£§SLiên Bang§! của chúng ta sẽ góp phần nâng cao mức độ §SĐoàn Kết§!. Hãy nhớ rằng số lượng đặc phái viên bạn có là có hạn. Những đặc phái viên được cử đến liên bang có thể được điều động lại cho các §SChiến Dịch Ngoại Giao§! khác sau này."
 TUTORIAL_FEDERATION_VIEW_MEMBERS_TITLE: "Hướng Dẫn: Các Quốc Gia Thành Viên Liên Bang"
 TUTORIAL_FEDERATION_VIEW_MEMBERS_DESC: "Đây là giao diện §HCác Quốc Gia Thành Viên Liên Bang§!. Tại đây, chúng ta có thể đánh giá thực lực đa phương diện của các §SQuốc Gia Thành Viên§! cũng như số lượng £envoy£§SĐặc Phái Viên§! mà mỗi bên đã đóng góp. Nơi này cũng hiển thị những xung đột về mặt §SEthic§!, điều có thể dẫn đến sự sụt giảm mức độ §SĐoàn Kết§!."
 TUTORIAL_FEDERATION_VIEW_NAVY_TITLE: "Hải Quân Liên Bang"
 TUTORIAL_FEDERATION_VIEW_NAVY_DESC: "Việc xây dựng §HHải Quân Liên Bang§! dựa trên phần §SSức Chứa Hải Quân§! mà các quốc gia thành viên đóng góp, và lực lượng này sẽ tuân theo sự chỉ huy của §SQuốc Gia Chủ Tịch§!. Mọi quốc gia thành viên đều có quyền đóng tàu hải quân £federation£§SLiên Bang§!, góp sức xây dựng hạm đội liên bang."
 TUTORIAL_FEDERATION_VIEW_LAWS_TITLE: "Hướng Dẫn: Đạo Luật Liên Bang"
 TUTORIAL_FEDERATION_VIEW_LAWS_DESC: "Bất kỳ quốc gia thành viên nào cũng có quyền đề xuất sửa đổi §HĐạo Luật Liên Bang§!. Nếu một đạo luật không được thông qua tại £federation£§SLiên Bang§!, liên bang sẽ phải gánh chịu §SHình Phạt Đoàn Kết§!.\n\nMột số đạo luật bị khóa theo mặc định, và chỉ có thể được mở khóa khi mức độ §STập Trung Quyền Lực§! được nâng cao. Liên bang bắt buộc phải §SNâng Cấp§! trước khi có thể gia tăng mức độ tập trung quyền lực.\n\nCần lưu ý rằng, khi mức độ tập trung quyền lực càng cao, mức độ đoàn kết sẽ càng bị ảnh hưởng tiêu cực."
 TUTORIAL_GALACTIC_COMMUNITY_TITLE: "Hướng Dẫn: Cộng Đồng Thiên Hà"
 TUTORIAL_GALACTIC_COMMUNITY_DESC: "Chào mừng đến với §HCộng Đồng Thiên Hà§!, nơi quy tụ các nhà ngoại giao từ khắp mọi ngóc ngách của thiên hà, cùng nhau định hình luật lệ thiên hà thông qua việc bỏ phiếu cho các §SĐề Án§!.\n\nBạn có thể ủng hộ một §SĐề Án Đã Được Trình Bày§! trong §SĐợi Duyệt§!, điều này sẽ tăng thêm một lượng ủng hộ bằng với §SSức Mạnh Ngoại Giao§! của bạn cho đề án đó.\n\nNghị quyết nhận được mức độ ủng hộ cao nhất trong hàng đợi sẽ được trình lên §SThượng Viện§! trong kỳ họp. Sau đó, Thượng viện sẽ tiến hành bỏ phiếu để quyết định xem nó có thể trở thành §SLuật Thiên Hà§! hay không.\n\nHãy chú ý đến §STiêu Điểm Thiên Hà§!, nó sẽ vạch ra hướng đi cho các mục tiêu chung của cộng đồng.\n\nCuối cùng, tại giao diện này, bạn có thể xem tất cả các quốc gia thành viên cũng như mọi §SHiệu Ứng Thiên Hà§! có thể được kích hoạt bởi các nghị quyết."
 TUTORIAL_GALACTIC_COMMUNITY_ENVOYS_TITLE: "Hướng Dẫn: Đặc Phái Viên"
 TUTORIAL_GALACTIC_COMMUNITY_ENVOYS_DESC: "£envoy£§SĐặc Phái Viên§! có thể được phái đến Cộng Đồng Thiên Hà để nâng cao §SSức Mạnh Ngoại Giao§! của bạn. Những đặc phái viên được phái đến Cộng Đồng Thiên Hà cũng có thể được điều động lại cho các §SChiến Dịch Ngoại Giao§! khác sau này."
 TUTORIAL_GALACTIC_COMMUNITY_SENATE_TITLE: "Hướng Dẫn: Thượng Viện"
 TUTORIAL_GALACTIC_COMMUNITY_SENATE_DESC: "§HThượng Viện§! là nơi Cộng Đồng Thiên Hà đưa ra phán quyết cuối cùng về việc có thông qua đề án nhận được sự ủng hộ cao nhất trong §SĐợi Duyệt§! hay không. Với tư cách là một quốc gia thành viên, bạn có thể bỏ phiếu: §STán Thành, Phản Đối hoặc Bỏ Phiếu Trắng§!. Nếu nghị quyết được thông qua, nó sẽ trở thành §SLuật Thiên Hà§! và tác động đến toàn bộ thành viên của Cộng Đồng Thiên Hà. Nếu bị bác bỏ, nó sẽ không thể được đưa ra đề xuất lại trong một khoảng thời gian nhất định.\n\nNhững đế chế không bỏ phiếu trắng sẽ §SNâng Cao§! đánh giá đối với các đế chế bỏ phiếu cùng quan điểm với họ, và hạ thấp đánh giá đối với những đế chế bỏ phiếu trái ngược.\n\nNếu bạn nhận được §SHỗ Trợ Ngoại Giao§! từ các đế chế khác, bạn có thể sử dụng chúng tại đây để gia tăng §SSức Mạnh Ngoại Giao§! của mình trong các cuộc bỏ phiếu tại §SThượng Viện§!."
 TUTORIAL_GALACTIC_COMMUNITY_RESOLUTIONS_TITLE: "Hướng Dẫn: Đề Án"
 TUTORIAL_GALACTIC_COMMUNITY_RESOLUTIONS_DESC: "Giao diện §HĐề Án§! hiển thị danh sách các đề án đang có hiệu lực. Bạn có thể chọn một đề án từ chuỗi đề án và §SĐề Xuất Một Đề Án Mới§!, điều này sẽ tiêu tốn £influence£Sức Ảnh Hưởng.\n\nBạn chỉ có thể đề xuất §SĐề Án§! đầu tiên chưa có hiệu lực trong một chuỗi đề án, bạn bắt buộc phải xây dựng nền tảng vững chắc trước khi tiến hành những cải cách triệt để, dù vậy cũng không có gì đảm bảo rằng mọi người sẽ ủng hộ nó.\n\nNếu một §SĐề Án§! được thông qua, đề án tiếp theo trong chuỗi sẽ bị cấm đề xuất trong vài năm."
 TUTORIAL_GALACTIC_COMMUNITY_COUNCIL_TITLE: "Hội Đồng Thiên Hà"
 TUTORIAL_GALACTIC_COMMUNITY_COUNCIL_DESC: "§HHội Đồng Thiên Hà§! đã được thành lập. Một cuộc §SBầu Cử§! sẽ diễn ra, và các quốc gia thành viên sở hữu sức mạnh ngoại giao lớn nhất sẽ giành được §SChiếc Ghế Trong Hội Đồng§!. Các quốc gia thành viên của hội đồng sẽ được gia tăng sức mạnh ngoại giao, và có đặc quyền đệ trình trực tiếp các đề xuất lên Thượng viện dưới dạng §SNghị Quyết Khẩn Cấp§!.\n\n§SQuyền Phủ Quyết Của Hội Đồng§! có thể được mở khóa thông qua việc thông qua các nghị quyết tăng cường quyền lực cho hội đồng. Thành viên hội đồng cũng có quyền sử dụng các §SNghị Quyết Đặc Biệt§!."
 TUTORIAL_EMPIRE_SPRAWL_TITLE: "Hướng Dẫn: $EMPIRE_SIZE$"
 TUTORIAL_EMPIRE_SPRAWL_DESC: "£empire_sprawl£§H$EMPIRE_SIZE$§! là thước đo định lượng cho vùng lãnh thổ mà đế chế kiểm soát, được tính toán dựa trên số lượng £system£§SHệ Sao§!, £colony£§SThuộc Địa§!, £district£§SPhân Khu§! và tổng dân số mà đế chế nắm giữ.\n\nMột quy mô đế chế quá lớn sẽ tạo ra áp lực nặng nề lên §SNăng Lực Quản Lý Hành Chính§! của đế chế, đồng thời làm đội giá cho các hoạt động §SCông Nghệ§!, £traditions£§STruyền Thống§!, £leader£§SLãnh Đạo§! và §SSắc Lệnh§!."
 TUTORIAL_FIRSTCONTACT_VIEW_TITLE: "Hướng Dẫn: Bổ Nhiệm Đặc Phái Viên"
 TUTORIAL_FIRSTCONTACT_VIEW_DESC: "Chúng ta đã chạm trán với một thực thể hoàn toàn mới — có thể là §SSinh Vật Không Gian§!, hoặc một §SĐế Chế§! khác. Bằng cách tiến hành §HCuộc Chạm Trán Đầu Tiên§!, chúng ta có thể nghiên cứu sâu hơn về họ.\n\nChúng ta cần chỉ định một £envoy£§SĐặc Phái Viên§! để đảm nhận nhiệm vụ này. Thông qua các nỗ lực của mình, họ sẽ thiết lập cầu nối giao tiếp với thực thể này, đồng thời giải mã ngôn ngữ mà họ có thể đang sử dụng.\n\nĐể chỉ định §SĐặc Phái Viên§!:\n\n£dot_green£ Nhấp vào ảnh đại diện trong cửa sổ §SCuộc Chạm Trán Đầu Tiên§!\n£dot_green£ Chọn một §SĐặc Phái Viên§! đang có sẵn"
 TUTORIAL_CRISIS_VIEW_TITLE: "Hướng Dẫn: Hóa Thân Thành Thiên Tai"
 TUTORIAL_CRISIS_VIEW_DESC: "Chúng ta đang bước đi trên con đường vĩ đại để §SHóa Thân Thành Thiên Tai§!. Con đường này sẽ mở khóa những đặc quyền độc nhất vô nhị, cường hóa sức mạnh của chúng ta, và biến chúng ta thành một thế lực đáng sợ hơn đối với toàn thể dải ngân hà.\n\nGiao diện §SThiên Tai§! phác thảo các mục tiêu của chúng ta — thực hiện các hành động cụ thể để thu thập §S[GetCrisisResource]§!. Việc thu thập [GetCrisisResource] sẽ giúp chúng ta mở khóa các §SCấp Độ Thiên Tai§! và các §SCường Hóa§!, hỗ trợ chúng ta giải phóng toàn bộ tiềm năng của mình để gieo rắc nỗi kinh hoàng cho toàn dải ngân hà.\n\nKhi đế chế của chúng ta ngày càng trở nên nguy hiểm đối với các quốc gia láng giềng, Cộng Đồng Thiên Hà rất có thể sẽ liên kết lại với nhau và tuyên bố chúng ta là §SMối Đe Dọa Của Thiên Hà§!."
 TUTORIAL_CRISIS_VIEW_LEVEL1_TITLE: "Hướng Dẫn: Cấp Độ Thiên Tai"
 TUTORIAL_CRISIS_VIEW_LEVEL1_DESC: "Khi chúng ta ngày càng lún sâu vào con đường §SHóa Thân Thành Thiên Tai§! và đạt được những điều kiện nhất định, chúng ta có thể mở khóa các Cấp Độ Thiên Tai hoàn toàn mới. Mỗi cấp độ sẽ mang đến những đặc quyền khác nhau, ví dụ như §SHiệu Ứng Cường Hóa [GetCrisisResource]§! hay các loại §SChiến Hạm§! đặc thù.\n\nMột khi chúng ta chạm ngưỡng §SCấp Độ 5§! — hoặc bị Cộng Đồng Thiên Hà liệt vào danh sách thiên tai — chúng ta sẽ chính thức chọc giận toàn bộ dải ngân hà. Và ngay lúc đó, chúng ta sẽ bước vào trạng thái §SChiến Tranh Tổng Lực§! với Cộng Đồng Thiên Hà."
 TUTORIAL_DIPLOMACY_VIEW_BUILDING_SPYNETWORK_TITLE: "Hướng Dẫn: Mạng Lưới Tình Báo"
 TUTORIAL_DIPLOMACY_VIEW_BUILDING_SPYNETWORK_DESC: "Một £envoy£§SĐặc Phái Viên§! của chúng ta đang xây dựng §SMạng Lưới Tình Báo§! tại đế chế này.\n\nDựa trên §SGiá Trị Mạng Lưới Tình Báo§! hiện tại và £empire_sprawl£§SQuy Mô Đế Chế§! của mục tiêu, §SMức Độ Thâm Nhập§! của mạng lưới tình báo sẽ tăng dần theo thời gian. Cùng với sự phát triển của mạng lưới tình báo, chúng ta cũng sẽ thu thập được nhiều §STình Báo§! hơn về mục tiêu. Tại đây, chúng ta cũng có thể khởi xướng các §SChiến Dịch§! bí mật thông qua §STrang Tình Báo§!.\n\nNếu không có đặc phái viên nào được chỉ định cho mạng lưới tình báo, hoặc sự tồn tại của nó bị bại lộ do một §SChiến Dịch§! bí mật nào đó, mạng lưới tình báo sẽ bắt đầu §PSuy Yếu§!."
 TUTORIAL_ESPIONAGE_VIEW_TITLE: "Hướng Dẫn: Hoạt Động Tình Báo"
 TUTORIAL_ESPIONAGE_VIEW_DESC: "Trang §STình Báo§! hiển thị cách thức mà £envoy£§SĐặc Phái Viên§! của chúng ta đang thiết lập mạng lưới tình báo bên trong các đế chế khác. Tại đây, bạn có thể xử lý các §SHồ Sơ Tình Báo§!, hoặc kiểm tra và khởi xướng các §SChiến Dịch§!.\n\nChúng ta có thể thực hiện các hoạt động tình báo bên trong những đế chế có §SĐặc Phái Viên§! đang duy trì mạng lưới tình báo. Các loại chiến dịch khác nhau đều yêu cầu mạng lưới tình báo phải đạt đến một cấp độ nhất định thì mới có thể khởi xướng."
 TUTORIAL_ESPIONAGE_VIEW_OPERATIONS_TITLE: "Hướng Dẫn: Chiến Dịch Tình Báo"
 TUTORIAL_ESPIONAGE_VIEW_OPERATIONS_DESC: "Giờ đây, khi cấp độ mạng lưới tình báo của chúng ta đã đủ cao, chúng ta có thể tiến hành các §SChiến Dịch§! nhắm vào đế chế này. Các chiến dịch này được phân chia thành nhiều hạng mục khác nhau, và mỗi hạng mục sẽ mang lại những kết quả riêng biệt — một số chiến dịch sẽ tiềm ẩn nhiều rủi ro hơn những chiến dịch khác.\n\nCác hạng mục chiến dịch bao gồm §S$op_cat_subterfuge$§!, §S$op_cat_manipulation$§!, §S$op_cat_sabotage$§! và §S$op_cat_provocation$§!. Các chiến dịch thuộc nhóm phá hoại và xúi giục đòi hỏi những điều kiện khắt khe hơn, và nếu bị bắt quả tang, §SHình Phạt Ngoại Giao§! phải gánh chịu cũng sẽ nặng nề hơn."
 TUTORIAL_ESPIONAGE_VIEW_ASSIGN_ASSET_TITLE: "Hướng Dẫn: Phân Công Người Cung Cấp Thông Tin"
 TUTORIAL_ESPIONAGE_VIEW_ASSIGN_ASSET_DESC: "§SNgười Cung Cấp Thông Tin§! là những điệp viên và công cụ giá trị, có khả năng mang lại nhiều hiệu ứng khác nhau cho các hoạt động tình báo của chúng ta. Người cung cấp thông tin hoạt động bên trong mạng lưới tình báo, và cũng có thể được phân công tham gia vào các chiến dịch, nhằm khai thác những cơ hội mới hoặc giúp chúng ta thoát khỏi những tình huống hiểm nghèo.\n\nChúng ta có thể thu nạp người cung cấp thông tin thông qua các sự kiện hoặc bằng cách thực thi chiến dịch §SChiêu Mộ Người Cung Cấp Thông Tin§!. Nếu một mạng lưới tình báo không còn tồn tại, những người cung cấp thông tin thuộc về nó cũng sẽ biến mất theo."
 TUTORIAL_MEGASTRUCTURE_CONSTRUCTION_TITLE: "Hướng Dẫn: Siêu Cấu Trúc"
 TUTORIAL_MEGASTRUCTURE_CONSTRUCTION_DESC: "Trong danh sách này, chúng ta có thể chọn một loại £megastructure£§SSiêu Cấu Trúc§! và tiến hành [GetBuildGrow] nó bên trong £system£§SHệ Sao§! này. Một số siêu cấu trúc nhất định yêu cầu phải nghiên cứu thành công §SCông Nghệ§! tương ứng trước thì mới có thể bắt tay vào xây dựng.\n\nChương trình tham vọng vũ trụ của tôi đã được kích hoạt hoàn toàn; tôi khuyên bạn nên nắm bắt lấy những cơ hội này, để khắc sâu dấu ấn vĩnh cửu của bạn lên dải ngân hà."
 TUTORIAL_ORBITAL_RING_TITLE: "Hướng Dẫn: Trạm Căn Cứ Vành Đai"
 TUTORIAL_ORBITAL_RING_DESC: "§STrạm Căn Cứ Vành Đai§! là một dạng £megastructure£§SSiêu Cấu Trúc§! có khả năng bao trọn lấy toàn bộ £planet£§SHành Tinh§!. Nó có thể thiết lập một hành lang kết nối hiệu quả giữa không gian và mặt đất, cung cấp không gian lý tưởng cho các công trình như bến tàu, hệ thống phòng thủ, hay kho dự trữ tài nguyên...\n\nTại giao diện Trạm Căn Cứ Vành Đai, chúng ta có thể xây dựng hoặc dỡ bỏ các £building£§SCông Trình§! hay §SModule§!, đồng thời có thể nâng cấp Trạm Căn Cứ Vành Đai lên các cấp độ cao hơn. Việc nâng cấp căn cứ sẽ gia tăng số lượng ô công trình có sẵn, tuy nhiên, giới hạn cấp độ tối đa sẽ phụ thuộc vào cơ sở hạ tầng của hành tinh."
 TUTORIAL_DIPLOMACY_CONFIGURABLE_TERMS_TITLE: "Hướng Dẫn: Giao Diện Cấu Hình Điều Khoản"
 TUTORIAL_DIPLOMACY_CONFIGURABLE_TERMS_DESC: "Giao diện này cho phép bạn lựa chọn một §SBản Mẫu Có Sẵn§! cho hiệp định, và tùy ý thêm bớt các điều khoản cá nhân hóa dựa trên nền tảng đó. Mỗi bản mẫu có sẵn đều quy định một số trách nhiệm và nghĩa vụ cụ thể cho cả quốc gia chư hầu lẫn quốc gia bá chủ.\n\nBạn có thể điều chỉnh các §SĐiều Khoản§! nhằm thay đổi mức độ §STrung Thành§! của quốc gia khác, từ đó đảm bảo rằng hiệp định được đưa ra sẽ dễ dàng được cả hai bên chấp nhận."
 TUTORIAL_AGREEMENTS_TITLE: "Hướng Dẫn: Tổng Quan Hiệp Định"
 TUTORIAL_AGREEMENTS_DESC: "Giao diện §SHiệp Định§! phơi bày mọi khía cạnh trong các thỏa thuận giữa quốc gia chư hầu và quốc gia bá chủ. Chúng ta có thể tận dụng giao diện này để theo dõi sự biến động của mức độ §STrung Thành§!, quản lý các §SĐiền Trang§!, triển khai các hoạt động §SThương Mại§!, hoặc sửa đổi các §SĐiều Khoản§! của những hiệp định hiện hành. Nếu một hiệp định không còn phục vụ cho lợi ích của quốc gia, chúng ta hoàn toàn có quyền phế trừ nó."
 TUTORIAL_AGREEMENTS_NO_OVERLORD_TITLE: "$TUTORIAL_AGREEMENTS_TITLE$"
 TUTORIAL_AGREEMENTS_NO_OVERLORD_DESC: "$TUTORIAL_AGREEMENTS_DESC$"
 TUTORIAL_AGREEMENTS_HAS_OVERLORD_TITLE: "$TUTORIAL_AGREEMENTS_TITLE$"
 TUTORIAL_AGREEMENTS_HAS_OVERLORD_DESC: "$TUTORIAL_AGREEMENTS_DESC$\n\nQuốc gia chư hầu có thể lựa chọn trở thành một §SQuốc Gia Chuyên Biệt§!. Sự chuyên biệt hóa này sẽ mang lại những cường hóa khổng lồ, ví dụ như về sản xuất tài nguyên hay sức mạnh quân sự, nhưng đổi lại, quốc gia đó cũng sẽ phải gánh chịu những hình phạt ở các khía cạnh khác.\n\nThuộc tính chuyên biệt cũng đồng thời cung cấp sự gia tăng mức độ §STrung Thành§!. Nếu quốc gia chư hầu duy trì mức độ trung thành vượt qua một ngưỡng nhất định, họ cũng sẽ liên tục tích lũy kinh nghiệm, và lượng kinh nghiệm này có thể được dùng để nâng cấp loại hình chuyên biệt mà họ đã chọn."
 TUTORIAL_HOLDINGS_TITLE: "Hướng Dẫn: Điền Trang"
 TUTORIAL_HOLDINGS_DESC_SHARED: "Giao diện §SĐiền Trang§! cung cấp một cái nhìn toàn diện về tất cả các điền trang đang hiện diện trên £planet£§SHành Tinh§! này. Cơ chế này cho phép các quốc gia trực tiếp xây dựng những loại £building£§SCông Trình§! khác nhau trên thủ đô và £colony£§SThuộc Địa§! của lẫn nhau. Hành động này có thể tạo ra những tác động nhất định trên nhiều phương diện, chẳng hạn như ngoại giao, tình báo hoặc sản xuất tài nguyên."
 TUTORIAL_HOLDINGS_DESC_MEGA_CORP: "Chỉ cần thực hiện một số bước chuẩn bị ngoại giao sơ bộ, Siêu Tập Đoàn có thể thiết lập các §SChi Nhánh§! trên những hành tinh thuộc về các đế chế khác. Ai cũng biết rằng, các tập đoàn quy mô lớn luôn mong muốn mang đến những dịch vụ hoàn hảo nhất cho khách hàng của mình, dẫu cho câu nói đó đã là một sáo ngữ lỗi thời từ Chu kỳ 23."
 TUTORIAL_HOLDINGS_DESC_OVERLORD: "§SQuốc Gia Bá Chủ§! có thể sử dụng các điền trang để thắt chặt thêm sự kiểm soát đối với §SQuốc Gia Chư Hầu§!. Vô số điền trang có khả năng chi phối mức độ trung thành, và một vài trong số đó chỉ có thể được xây dựng tại những quốc gia sở hữu sự chuyên biệt hóa tương ứng. Ngay tại giao diện này, bạn cũng có thể tiến hành nâng cấp đa dạng cho các điền trang."
 TUTORIAL_HOLDINGS_NO_MEGA_CORP_NO_OVERLORD_TITLE: "$TUTORIAL_HOLDINGS_TITLE$"
 TUTORIAL_HOLDINGS_NO_MEGA_CORP_NO_OVERLORD_DESC: "$TUTORIAL_HOLDINGS_DESC_SHARED$"
 TUTORIAL_HOLDINGS_NO_MEGA_CORP_HAS_OVERLORD_TITLE: "$TUTORIAL_HOLDINGS_TITLE$"
 TUTORIAL_HOLDINGS_NO_MEGA_CORP_HAS_OVERLORD_DESC: "$TUTORIAL_HOLDINGS_DESC_SHARED$\n\n$TUTORIAL_HOLDINGS_DESC_OVERLORD$"
 TUTORIAL_HOLDINGS_HAS_MEGA_CORP_NO_OVERLORD_TITLE: "$TUTORIAL_HOLDINGS_TITLE$"
 TUTORIAL_HOLDINGS_HAS_MEGA_CORP_NO_OVERLORD_DESC: "$TUTORIAL_HOLDINGS_DESC_SHARED$\n\n$TUTORIAL_HOLDINGS_DESC_MEGA_CORP$"
 TUTORIAL_HOLDINGS_HAS_MEGA_CORP_HAS_OVERLORD_TITLE: "$TUTORIAL_HOLDINGS_TITLE$"
 TUTORIAL_HOLDINGS_HAS_MEGA_CORP_HAS_OVERLORD_DESC: "$TUTORIAL_HOLDINGS_DESC_SHARED$\n\n$TUTORIAL_HOLDINGS_DESC_MEGA_CORP$\n\n$TUTORIAL_HOLDINGS_DESC_OVERLORD$"
 TUTORIAL_PLANETVIEW_COLONY_GOV_TITLE: "Hướng Dẫn: Chiêu Mộ Thống Đốc"
 TUTORIAL_PLANETVIEW_COLONY_GOV_DESC: "Để đảm bảo sự phát triển thịnh vượng của £colony£§SThuộc Địa§!, chúng ta cần chiêu mộ một §SThống Đốc§! hành tinh để giám sát các hoạt động.\n\nHầu hết các hành tinh đều có thể duy trì hoạt động bình thường ngay cả khi không có §SThống Đốc§!, và chúng sẽ nhận được những lợi ích nhất định dựa trên hệ thống chính trị. Nhưng đối với những £planet£§SHành Tinh§! may mắn được quản lý, §SThống Đốc§! có thể mang lại những cường hóa vô cùng to lớn!\n\nThống đốc sẽ tạo ra muôn vàn tác động khác nhau lên hành tinh mà họ cai quản, và phần lớn trong số đó là những tác động tích cực. Hiệu quả của những tác động này phụ thuộc vào §SĐặc Tính§! cá nhân của thống đốc cũng như cấp độ kỹ năng §SThống Đốc§! của họ."
 TUTORIAL_ELECTION_VIEW_TITLE: "Hướng Dẫn: Bầu Cử"
 TUTORIAL_ELECTION_VIEW_DESC: "Trong giao diện §SBầu Cử§!, chúng ta có thể bỏ phiếu để chọn ra người cai trị mới cho đế chế.\n\n[TutorialElectionViewTypeSpecific]"
 TUTORIAL_ELECTION_VIEW_DEMOCRACY_NO: "Ứng cử viên sẽ được lựa chọn từ những £leader£ §SLãnh Đạo§! mà bạn hiện đang sở hữu, nếu nắm trong tay đủ tài nguyên, bạn hoàn toàn có thể khiến cán cân chiến thắng nghiêng về phía người mà bạn ưng ý."
 TUTORIAL_ELECTION_VIEW_DEMOCRACY_YES: "Ứng cử viên sẽ được lựa chọn từ những £leader£ §SLãnh Đạo§! mà bạn hiện đang sở hữu, bạn có thể gia tăng mức độ ủng hộ của họ, và dĩ nhiên, việc này chắc chắn sẽ được thực hiện theo cách thức dân chủ nhất có thể."
 TUTORIAL_EDICTS_AND_POLICIES_TITLE: "Hướng Dẫn: Chính Sách và Sắc Lệnh"
 TUTORIAL_EDICTS_AND_POLICIES_DESC: "Giao diện §SChính Sách§! bao quát toàn bộ các §SChính Sách§! của chính phủ, bên cạnh đó, các §SSắc Lệnh§! được thi hành trên toàn quốc, tức là những hành động tiêu tốn tài nguyên để mang lại lợi ích cho quốc gia, cũng sở hữu một giao diện riêng biệt.\n\nĐối với một §SChính Sách§! cụ thể, thường sẽ có một vài lập trường khác nhau để chúng ta có thể áp dụng, một số lập trường có thể bị vô hiệu hóa do chúng ta không sở hữu công nghệ tương ứng hoặc do sự hạn chế về mặt §SEthic§!.\n\nSắc lệnh tiêu hao chi phí bảo trì hàng tháng, khoản phí này có thể được chi trả bằng §H$EDICT_FUND$§!, hoặc tiêu thụ trực tiếp £unity£§SSự Đoàn Kết§! hay một số loại tài nguyên khác."
 TUTORIAL_COUNCIL_VIEW_TITLE: "Hướng Dẫn: Nội Các và Lịch Trình Nghị Sự"
 TUTORIAL_COUNCIL_VIEW_DESC: "Tại giao diện §SNội Các§!, chúng ta có thể bổ nhiệm những £leader£§SLãnh Đạo§! tài ba để dẫn dắt chúng ta tiến tới một tương lai huy hoàng. Tính cách và các §SĐặc Tính§! của họ sẽ mang lại những tác động, dù tốt hay xấu, lên toàn bộ đế chế. Bằng cách thiết lập §SLịch Trình Nghị Sự§!, chúng ta có thể điều hướng sự ảnh hưởng của họ tập trung vào một lĩnh vực cụ thể.\n\nChúng ta có thể tự do bổ nhiệm hoặc thay thế bất kỳ §SThành Viên Nội Các§! nào vào bất cứ lúc nào, và việc này sẽ không hề gây cản trở đến những công việc hiện tại của họ, ví dụ như việc chỉ huy một chiếc £science_ship£§STàu Khoa Học§!. Ngoại lệ duy nhất cho quy luật này chính là người cai trị. [TutorialCouncilViewDlcSpecific]Tiến độ của §SLịch Trình Nghị Sự§! phụ thuộc vào cấp độ của các thành viên nội các, $EMPIRE_SIZE$, và trong một số trường hợp nhất định, nó còn liên quan đến hệ tư tưởng của chính bản thân thành viên đó. Khi một lịch trình nghị sự bước vào giai đoạn cuối cùng, bạn có thể lựa chọn kích hoạt nó để cường hóa mạnh mẽ hiệu ứng của nó, đồng thời giải phóng một vị trí trống cho một lịch trình nghị sự mới."
 TUTORIAL_COUNCIL_VIEW_PARAGON_NO: "\n\n"
 TUTORIAL_COUNCIL_VIEW_PARAGON_YES: "\n\nNếu muốn mở khóa thêm các §SChiếc Ghế Trong Nội Các§!, chúng ta có hai con đường: tiếp nhận §SLý Tưởng Quốc Gia§! để tương ứng 1-1, hoặc hoàn thành các lịch trình nghị sự mang tính chất đặc thù.\n\n"
 TUTORIAL_ASSIGN_COUNCILOR_TITLE: "Hướng Dẫn: Đặc Tính Của Thành Viên Nội Các"
 TUTORIAL_ASSIGN_COUNCILOR_DESC: "Một số £leader£ §SLãnh Đạo§! sở hữu những §SĐặc Tính Của Thành Viên Nội Các§!. Những đặc tính này có thể mang lại những ảnh hưởng sâu rộng và uy lực hơn nhiều, nhưng chúng chỉ có thể được kích hoạt khi lãnh đạo đó đang giữ một chức vụ bên trong nội các.\n\nBản thân một §SChiếc Ghế Trong Nội Các§! cũng đã mang lại những ảnh hưởng nhất định, và cấp độ kỹ năng của vị lãnh đạo ngồi trên chiếc ghế đó càng cao, thì sức ảnh hưởng tạo ra sẽ càng mạnh mẽ."
 TUTORIAL_LEADER_LEVEL_UP_TITLE: "Hướng Dẫn: Kỹ Năng Của Lãnh Đạo"
 TUTORIAL_LEADER_LEVEL_UP_DESC: "Một £leader£§SLãnh Đạo§! của quốc gia chúng ta vừa mới thăng cấp §SKỹ Năng§!! Điều này sẽ làm tăng cường các hiệu ứng gia tăng mà họ mang lại, đồng thời bổ sung thêm một đặc tính mới cho họ. [TutorialLeaderLevelUpDlcSpecific]Xem các §SLãnh Đạo§! đang có sẵn:\n\n£dot_green£ Nhấp vào nút §S$topbar_button_leaders_name$§! trên thanh công cụ bên trái hoặc nhấn phím §SF5§!\n\n$tttt$$tt$£leaders£\n\nCùng với sự gia tăng của tuổi tác hoặc những ảnh hưởng từ sự vất vả trong công việc, hầu hết các §SLãnh Đạo§! đều không thể tránh khỏi việc phát sinh những đặc tính tiêu cực. Vì vậy, việc thay thế những lãnh đạo không còn mang lại lợi ích cho sự phát triển của đế chế là một quyết định hoàn toàn hợp lý."
 TUTORIAL_LEADER_LEVEL_UP_PARAGON_NO: "\n\n"
 TUTORIAL_LEADER_LEVEL_UP_PARAGON_YES: "\n\nĐể định hình một £leader£§SLãnh Đạo§! sao cho phù hợp nhất với các mục tiêu của đế chế, chúng ta có thể tự tay lựa chọn những §SĐặc Tính§! mà họ cần tiếp thu. Việc để trống các đặc tính chưa được chọn sẽ không hề cản trở việc họ tiếp tục thăng cấp. Các §SPhân Lớp Nhỏ§! có thể được lựa chọn sau một vài cấp độ nhất định, chúng sẽ cung cấp những cường hóa và ảnh hưởng đến các đặc tính có thể sử dụng trong tương lai.\n\nCác đặc tính vô cùng đa dạng về hình thức, quy mô và độ hiếm: một số có thể được nâng cấp, một số lại bài xích lẫn nhau, và cũng có những đặc tính mang lại cả hiệu ứng tích cực lẫn tiêu cực cùng lúc. Tuy nhiên, thông thường, tất cả các đặc tính đều mang tính vĩnh viễn.\n\n"
 #############################
 #Sự Kiện Cố Vấn
 #############################
 advisor.1.name: "Cố Vấn Trực Tuyến"
 advisor.1.desc_01: "Xin chào ngài Tổng thống.\n\nTôi là VIR, một nguyên mẫu trí tuệ tổng hợp. Nhiệm vụ của tôi là đưa ra những lời khuyên và sự trợ giúp cho ngài, nhằm giúp chúng ta theo đuổi vận mệnh của mình giữa những vì sao một cách tốt nhất.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_02: "Xin chào nữ Tổng thống.\n\nTôi là VIR, một nguyên mẫu trí tuệ tổng hợp. Nhiệm vụ của tôi là đưa ra những lời khuyên và sự trợ giúp cho ngài, nhằm giúp chúng ta theo đuổi vận mệnh của mình giữa những vì sao một cách tốt nhất.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_03: "Xin chào ngài Ủy viên Trưởng Tối cao.\n\nTôi là VIR, một nguyên mẫu trí tuệ tổng hợp. Nhiệm vụ của tôi là đưa ra những lời khuyên và sự trợ giúp cho ngài, nhằm giúp chúng ta theo đuổi vận mệnh của mình giữa những vì sao một cách tốt nhất.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_04: "Xin chào ngài Chấp chính quan.\n\nTôi là VIR, một nguyên mẫu trí tuệ tổng hợp, và là người hầu thấp hèn của ngài. Tôi sẽ đưa ra những lời khuyên và chỉ dẫn cho ngài khi ngài dẫn dắt chúng ta tiến vào thế giới vô định vĩ đại.\n\n$advisor.1.desc_filler$"
 #advisor.1.desc_05: "Chào ngày mới, Lãnh chúa Bảo hộ.\n\nTôi là VIR, một nguyên mẫu trí tuệ tổng hợp và là người hầu thấp hèn của ngài. Vai trò của tôi là cung cấp cho ngài những lời khuyên và sự tham vấn khi ngài dẫn dắt đế chế của chúng ta tiến vào thế giới vô định vĩ đại.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_06: "Xin chào ngài Giám đốc Điều hành.\n\nTôi là VIR —— một nguyên mẫu trí tuệ nhân hình. Trụ sở chính của tập đoàn gần đây đã kích hoạt tôi để làm trợ lý cho ngài trong việc tìm kiếm những £market£§SThị Trường§! liên tinh tú mới.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_07: "Xin gửi lời chào trân trọng nhất đến ngài, Bệ hạ tôn kính.\n\nTôi là VIR —— một nguyên mẫu trí tuệ nhân hình, người hầu thấp hèn của ngài. Tôi sẽ đưa ra những lời khuyên và chỉ dẫn cho ngài khi ngài dẫn dắt chúng ta tiến vào thế giới vô định vĩ đại.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_08: "Nguyện bình an luôn ở bên ngài, ngài Thủ tướng.\n\nTôi là VIR —— một nguyên mẫu trí tuệ nhân hình. Tôi sẽ đưa ra những lời khuyên và sự trợ giúp cho ngài trong chuyến du hành đầu tiên mang ý nghĩa lịch sử sau khi hành tinh mẹ của chúng ta giành được hòa bình.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_09: "Nguyện bình an luôn ở bên ngài, ngài Điều phối viên.\n\nTôi là VIR —— một nguyên mẫu trí tuệ nhân hình. Tôi sẽ đưa ra những lời khuyên và sự trợ giúp cho ngài trong chuyến du hành đầu tiên mang ý nghĩa lịch sử sau khi hành tinh mẹ của chúng ta giành được hòa bình.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_10: "Nguyện bình an luôn ở bên ngài, Bệ hạ.\n\nTôi là VIR —— một nguyên mẫu trí tuệ nhân hình. Tôi sẽ đưa ra những lời khuyên và sự trợ giúp cho ngài trong chuyến du hành đầu tiên mang ý nghĩa lịch sử sau khi hành tinh mẹ của chúng ta giành được hòa bình.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_11: "Nguyện bình an luôn ở bên ngài, ngài Vệ binh Hòa bình.\n\nTôi là VIR —— một nguyên mẫu trí tuệ nhân hình. Tôi sẽ đưa ra những lời khuyên và sự trợ giúp cho ngài trong chuyến du hành đầu tiên mang ý nghĩa lịch sử sau khi hành tinh mẹ của chúng ta giành được hòa bình.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_12: "Xin chào ngài Thủ tướng.\n\nTôi là VIR —— một nguyên mẫu trí tuệ nhân hình được tạo ra bởi những bộ óc thông thái nhất của nền văn minh chúng ta, luôn sẵn sàng phục vụ ngài. Tôi sẽ dốc sức để thực hiện nhiệm vụ của mình với hiệu quả cao nhất.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_13: "Xin chào ngài Giám đốc Hội đồng Quản trị.\n\nTôi là VIR —— một nguyên mẫu trí tuệ nhân hình được tạo ra bởi những bộ óc thông thái nhất của nền văn minh chúng ta, luôn sẵn sàng phục vụ ngài. Tôi sẽ dốc sức để thực hiện nhiệm vụ của mình với hiệu quả cao nhất.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_14: "Xin chào ngài Bá chủ.\n\nTôi là VIR —— một nguyên mẫu trí tuệ nhân hình được tạo ra bởi những bộ óc thông thái nhất của nền văn minh chúng ta, luôn sẵn sàng phục vụ ngài. Tôi sẽ dốc sức để thực hiện nhiệm vụ của mình với hiệu quả cao nhất.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_15: "Xin chào ngài Thủ tướng.\n\nTôi là VIR, một nguyên mẫu trí tuệ tổng hợp được phát triển bởi những nhà nghiên cứu xuất chúng nhất của dân tộc chúng ta, và nhiệm vụ của tôi là đảm nhận vai trò cố vấn cho ngài. Tôi sẽ hoàn thành xuất sắc nhiệm vụ của mình với hiệu suất tối đa.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_16: "Xin chào ngài Tổng Tư lệnh.\n\nTôi là VIR, một nguyên mẫu trí tuệ tổng hợp được phát triển bởi những nhà nghiên cứu xuất chúng nhất của dân tộc chúng ta, và nhiệm vụ của tôi là đảm nhận vai trò cố vấn cho ngài. Tôi sẽ hoàn thành xuất sắc nhiệm vụ của mình với hiệu suất tối đa.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_17: "Xin chào ngài Giám sát viên.\n\nTôi là VIR, một nguyên mẫu trí tuệ tổng hợp được phát triển bởi những nhà nghiên cứu xuất chúng nhất của dân tộc chúng ta, và nhiệm vụ của tôi là đảm nhận vai trò cố vấn cho ngài. Tôi sẽ hoàn thành xuất sắc nhiệm vụ của mình với hiệu suất tối đa.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_18: "Xin chào Đệ nhất Phát ngôn viên.\n\nTôi là VIR, một nguyên mẫu trí tuệ tổng hợp được phát triển bởi những nhà nghiên cứu xuất chúng nhất của dân tộc chúng ta, và nhiệm vụ của tôi là đảm nhận vai trò cố vấn cho ngài. Tôi sẽ hoàn thành xuất sắc nhiệm vụ của mình với hiệu suất tối đa.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_19: "Xin chào ngài Chủ tịch.\n\nTôi là VIR, một nguyên mẫu trí tuệ tổng hợp được phát triển bởi những nhà nghiên cứu xuất chúng nhất của dân tộc chúng ta, và nhiệm vụ của tôi là đảm nhận vai trò cố vấn cho ngài. Tôi sẽ hoàn thành xuất sắc nhiệm vụ của mình với hiệu suất tối đa.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_20: "Xin chào nữ Chủ tịch.\n\nTôi là VIR, một nguyên mẫu trí tuệ tổng hợp được phát triển bởi những nhà nghiên cứu xuất chúng nhất của dân tộc chúng ta, và nhiệm vụ của tôi là đảm nhận vai trò cố vấn cho ngài. Tôi sẽ hoàn thành xuất sắc nhiệm vụ của mình với hiệu suất tối đa.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_21: "Chào mừng ngài, ngài Chấp chính quan.\n\nTôi là VIR —— một nguyên mẫu trí tuệ nhân hình được quân đội chế tạo trong điều kiện tuyệt mật. Bộ Tư lệnh Tối cao đã kích hoạt tôi để tôi đóng vai trò là cố vấn quân sự và chuyên gia phân tích chiến thuật của ngài.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_22: "Chào mừng ngài, ngài Chấp chính quan.\n\nTôi là một nguyên mẫu trí tuệ tổng hợp, được quân đội phát triển trong những điều kiện bảo mật nghiêm ngặt nhất. Bộ Tư lệnh Tối cao đã kích hoạt tôi để tôi đóng vai trò là cố vấn và chuyên gia phân tích chiến lược của ngài.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_23: "Chào mừng ngài, ngài Tư lệnh.\n\nTôi là VIR —— một nguyên mẫu trí tuệ tổng hợp, được quân đoàn phát triển trong những điều kiện bảo mật nghiêm ngặt nhất. Bộ Tư lệnh Tối cao đã khởi động tôi, kể từ giờ phút này tôi sẽ trở thành cố vấn và chuyên gia phân tích chiến lược của ngài.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_24: "Chào mừng ngài, Bệ hạ Hoàng đế.\n\nTôi là VIR —— một nguyên mẫu trí tuệ tổng hợp, được quân đoàn phát triển trong những điều kiện bảo mật nghiêm ngặt nhất. Bộ Tư lệnh Tối cao đã khởi động tôi, kể từ giờ phút này tôi sẽ trở thành cố vấn và chuyên gia phân tích chiến lược của ngài.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_25: "Chào mừng ngài, Bệ hạ Nữ hoàng.\n\nTôi là VIR —— một nguyên mẫu trí tuệ tổng hợp, được quân đoàn phát triển trong những điều kiện bảo mật nghiêm ngặt nhất. Bộ Tư lệnh Tối cao đã khởi động tôi, kể từ giờ phút này tôi sẽ trở thành cố vấn và chuyên gia phân tích chiến lược của ngài.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_26: "Chào mừng ngài, ngài Đại Nguyên soái.\n\nTôi là một nguyên mẫu trí tuệ tổng hợp, được quân đội phát triển trong những điều kiện bảo mật nghiêm ngặt nhất. Bộ Tư lệnh Tối cao đã kích hoạt tôi để tôi đóng vai trò là cố vấn và chuyên gia phân tích chiến lược của ngài.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_27: "Chào mừng ngài, ngài Tướng quân.\n\nTôi là VIR —— một nguyên mẫu trí tuệ tổng hợp, được quân đoàn phát triển trong những điều kiện bảo mật nghiêm ngặt nhất. Bộ Tư lệnh Tối cao đã khởi động tôi, kể từ giờ phút này tôi sẽ trở thành cố vấn và chuyên gia phân tích chiến lược của ngài.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_28: "Chào mừng ngài, ngài Lãnh chúa Chiến tranh.\n\nTôi là VIR —— một nguyên mẫu trí tuệ tổng hợp, được quân đoàn phát triển trong những điều kiện bảo mật nghiêm ngặt nhất. Bộ Tư lệnh Tối cao đã khởi động tôi, kể từ giờ phút này tôi sẽ trở thành cố vấn và chuyên gia phân tích chiến lược của ngài.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_29: "Chào mừng ngài, Người Đại Diện Bộ Lạc.\n\nTôi là VIR —— một nguyên mẫu trí tuệ tổng hợp, được quân đoàn phát triển trong những điều kiện bảo mật nghiêm ngặt nhất. Bộ Tư lệnh Tối cao đã khởi động tôi, kể từ giờ phút này tôi sẽ trở thành cố vấn và chuyên gia phân tích chiến lược của ngài.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_30: "Cầu xin phước lành cho ngài, thưa đại nhân.\n\nTôi là một nguyên mẫu trí tuệ tổng hợp. Giáo hội đã chỉ định tôi trở thành người hầu trung thành và là cố vấn của ngài, tôi có thể hỗ trợ ngài trong chuyến du hành kỳ diệu xuyên qua vũ trụ bao la này.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_31: "Chào mừng ngài, [root.GetBloodCourtRulerTitle].\n\nTôi là VIR —— một nguyên mẫu trí tuệ nhân hình được quân đội chế tạo trong điều kiện tuyệt mật. Hoàng gia đã kích hoạt tôi để tôi đóng vai trò là cố vấn và chuyên gia phân tích chiến thuật của ngài.\n\n$advisor.1.desc_filler$"
 advisor.1.desc_32: "Xin chào ngài, [root.GetPurityOrderRulerTitle].\n\n$advisor.1.desc_keenminds$\n\n$advisor.1.desc_filler$"
 advisor.1.desc_33: "Xin chào ngài, [root.GetPurificationCommitteeRulerTitle].\n\n$advisor.1.desc_keenminds$\n\n$advisor.1.desc_filler$"
 advisor.1.desc_34: "Xin chào ngài, $RT_OLIGARCH$.\n\n$advisor.1.desc_honortoserve$\n\n$advisor.1.desc_filler$"
 advisor.1.desc_35: "Xin chào ngài, $RT_DEFENSIVE_UNION$.\n\n$advisor.1.desc_honortoserve$\n\n$advisor.1.desc_filler$"
 advisor.1.desc_36: "Xin chào ngài, $RT_DIMENSIONAL_COVENANT$.\n\n$advisor.1.desc_honortoserve$\n\n$advisor.1.desc_filler$"
 advisor.1.desc_keenminds: "Tôi là VIR —— một nguyên mẫu trí tuệ nhân hình được phát triển bởi những bộ óc nhiệt huyết nhất của nền văn minh chúng ta, để đảm nhận vai trò cố vấn cho ngài. Tôi sẽ thực hiện nhiệm vụ của mình với hiệu suất cao nhất."
 advisor.1.desc_honortoserve: "Tôi là VIR —— một nguyên mẫu trí tuệ nhân hình được quân đội chế tạo trong điều kiện tuyệt mật. Tôi vô cùng vinh dự khi được trở thành cố vấn và chuyên gia phân tích chiến thuật của ngài."
 advisor.1.desc_filler: "Ngài có thể thay đổi cấp độ hướng dẫn bất cứ lúc nào trong menu §HCài Đặt§!."
 advisor.1.a: "Hãy kể cho tôi nghe mọi thứ. §G(Hướng Dẫn Đầy Đủ)§!"
 advisor.1.b: "Hãy cho tôi vài lời khuyên. §Y(Chỉ Cần Lời Khuyên)§!"
 advisor.1.c: "Tắt cái thứ này đi. §R(Không Cần Hướng Dẫn)§!"
 full_tutorial: "Các nhiệm vụ hướng dẫn và mô tả giao diện sẽ xuất hiện khi bạn đang khám phá các cơ chế của trò chơi.\n\nRất khuyến khích cho những người chơi mới trải nghiệm lần đầu."
 tips_only: "Bạn sẽ nhận được một vài lời khuyên khi đang khám phá §SHệ Thống§! của trò chơi.\n\nKhuyến khích cho những người chơi mới và người chơi có trình độ trung bình."
 no_tutorial: "Sẽ không có lời khuyên và nhiệm vụ hướng dẫn.\n\nKhuyến khích cho những người chơi ở cấp độ chuyên gia."
 recycle_vir: "§RTháo Dỡ và Tái Chế§! kho lưu trữ ký ức ngẫu nhiên của VIR:\n§G+2§!£minerals£\n\n\n"
 advisor.2.name: "Hướng Dẫn: Nhật Ký Tình Hình"
 advisor.2.desc: "Xây dựng một đế chế liên tinh tú tuyệt đối không phải là một công việc dễ dàng.\n\nĐể đảm bảo ngài có thể sớm đưa mọi thứ vào quỹ đạo, tôi sẽ cung cấp một loạt các §SNhiệm Vụ§! hướng dẫn, giúp ngài nắm bắt được những bước đi cần thiết để kiến tạo nên một cường quốc trong dải ngân hà.\n\nĐể mở §SNhiệm Vụ§!:\n\n£dot_green£ Nhấp vào nút §SNhật Ký Tình Hình§! trên thanh công cụ bên trái hoặc nhấn §SF1§!\n\n$tttt$$tt$£situation_log£\n"
 advisor.2.a: "Đã hiểu."
 advisor.3.name: "Khởi Tạo Lời Khuyên Hoàn Tất"
 advisor.3.desc: "Rất tốt, tôi sẽ cung cấp cho ngài những lời khuyên trong suốt quá trình ngài khám phá trò chơi, đồng thời giải thích chức năng cơ bản của các công cụ khác nhau."
 advisor.10.name: "Hướng Dẫn: Hiện Tượng Dị Thường"
 advisor.10.desc: "Chúng ta đã phát hiện ra một §SHiện Tượng Dị Thường§!!\n\nĐôi khi, £science_ship£§STàu Khoa Học§! của chúng ta sẽ bắt gặp những sự vật kỳ lạ trong quá trình khám phá vũ trụ.\n\nNếu £scientist£§SGiám Đốc Khoa Học§! đạt đến một cấp độ nhất định, họ sẽ có khả năng nghiên cứu những §SHiện Tượng Dị Thường§! này.\n\nNhững §SHiện Tượng Dị Thường§! đã được phát hiện nhưng chưa được nghiên cứu sẽ được liệt kê trong thẻ §SHiện Tượng Dị Thường§! của §SNhật Ký Tình Hình§!. Trước khi tiến hành thuộc địa hóa hoặc bất kỳ hoạt động xây dựng nào khác, những hiện tượng dị thường trên £planet£§SHành Tinh§! đó phải được nghiên cứu trước tiên."
 advisor.15.name: "Hướng Dẫn: Thuộc Địa Hóa"
 advisor.15.desc: "Một trong những chiếc £science_ship£§STàu Khoa Học§! của chúng ta đã phát hiện ra một hành tinh vô cùng phù hợp để trở thành £colony£§SThuộc Địa§! đầu tiên của chúng ta. Nó có cùng §SLoại Hình Hành Tinh§! với hành tinh mẹ của chúng ta, vì vậy những cư dân đi khai hoang chắc chắn sẽ có một cuộc sống rất thoải mái tại đó.\n\nĐể tiến hành thuộc địa hóa hành tinh này, trước tiên chúng ta phải mở rộng đường biên giới của mình.\n\nChọn một £construction_ship£§STàu Công Trình§!;\n\n£dot_green£ Nhấp chuột phải vào một £system£§SHệ Sao§! đã được khảo sát xong và có chứa các hành tinh tiềm năng để thuộc địa hóa\n£dot_green£ Chọn §S[GetBuildGrowCap]Căn Cứ Sao§!\n\n$tttt$$ttt$£colonizable£\n\nSau khi đã tuyên bố chủ quyền đối với §SHệ Sao§! này, chúng ta có thể bắt tay vào quá trình thuộc địa hóa."
 advisor.17.name: "Hướng Dẫn: Thuộc Địa Đầu Tiên"
 advisor.17.desc: "Xin chúc mừng ngài đã thành công thuộc địa hóa một hành tinh mới! Những cư dân tiên phong đang tiến hành xây dựng khu định cư đầu tiên của họ, và sẽ cần một khoảng thời gian trước khi họ có thể tự cung tự cấp.\n\n£colony£§SThuộc Địa§! sẽ liên tục ngốn tài nguyên của chúng ta cho đến khi khu định cư đầu tiên được hoàn thành, vậy nên đừng dại dột tiến hành thuộc địa hóa trên quá nhiều £planet£§SHành Tinh§! cùng một lúc."
 advisor.20.name: "Hướng Dẫn: Thu Nhập Âm"
 advisor.20.desc: "Chúng ta đang đánh mất £energy£Năng lượng với một tốc độ đáng báo động, và bản báo cáo ngân sách của tháng trước thực sự là một thảm họa.\n\nChi phí bảo trì thường là thủ phạm chính gây ra tình trạng thâm hụt tài chính. Nếu điều này là sự thật, ngài nên xem xét việc giải tán một số phi thuyền, đơn vị quân đội hoặc tiến hành tháo dỡ các cảng không gian."
 #advisor.27.name: "First Contact"
 #advisor.27.desc_01: "We have made first contact with an alien empire! These hideous creatures appear to have mastered space flight, just as we have. They could pose a significant threat.\n\nTheir empire will now be listed in the §SEmpires§! tab of the §SGalaxy§! screen. From there we may initiate diplomatic contact with them."
 #advisor.27.desc_02: "We have made first contact with an alien empire! These fascinating beings appear to have mastered space flight, just as we have. We should strive to learn more about them.\n\nTheir empire will now be listed in the §SContacts§! screen. From there we may initiate diplomatic contact with them."
 #advisor.27.desc_03: "We have made first contact with an alien empire! They appear to have mastered space flight, just as we have. I recommend a healthy degree of caution until we learn their intentions.\n\nTheir empire will now be listed in the §SEmpires§! tab of the §SGalaxy§! screen. From there we may initiate diplomatic contact with them."
 #advisor.28.name: "Fallen Empire"
 #advisor.28.desc: "We have encountered an ancient and highly advanced civilization! Fortunately for us, they appear to be in decline and it is doubtful whether they even fully understand their own technology anymore.\n\nThey will likely keep to themselves unless antagonized, and we should steer clear of their space - at least until we have reached technological parity."
 #############################
 #Sự Kiện Hướng Dẫn
 #############################
 tutorial.1.name: "Hướng Dẫn: Bản Đồ Thiên Hà"
 tutorial.1.desc: "§HBản Đồ Thiên Hà§! sẽ cung cấp cho ngài một cái nhìn toàn cảnh về các vì sao. Ngài có thể sử dụng nó để điều hướng, bành trướng lãnh thổ, chỉ huy hạm đội và vạch rõ ranh giới quốc gia.\n\nĐể mở §SBản Đồ Thiên Hà§!:\n\n£dot_green£ Nhấp vào biểu tượng §HThiên Hà§! ở phía dưới màn hình hoặc nhấn phím §HM§!\n\n\n$tttt$$tt$£galaxy_view£\n\n"
 tutorial.2.name: "Hướng Dẫn: Hoàn Thành Khảo Sát Hệ Sao"
 tutorial.2.desc: "Tuyệt vời!\n\nCuộc khảo sát đầu tiên đối với £system£§SHệ Sao§! ngoài hành tinh đã thành công mỹ mãn.\n\nNhững dữ liệu hành tinh mà các nhà thiên văn học trên hành tinh mẹ của chúng ta hằng khao khát chỉ từ một thế hệ trước, giờ đây đã nằm gọn trong lòng bàn tay chúng ta.\n\nTiếp tục tiến hành khảo sát:\n\n£dot_green£ Chọn một chiếc £science_ship£§STàu Khoa Học§!\n£dot_green£ Nhấp chuột phải vào một §SHệ Sao§! lân cận\n£dot_green£ Chọn §SKhảo Sát Hệ Sao§!\n\n§SHệ Sao§! bắt buộc phải được khảo sát hoàn tất thì mới có thể tuyên bố chủ quyền."
 tutorial.3.name: "Hướng Dẫn: Công Nghệ"
 tutorial.3.desc: "Việc nghiên cứu những công nghệ mới là yếu tố sống còn đối với sự thành công của chúng ta. Tôi nói như vậy không phải chỉ vì bản thân tôi là một sản phẩm của công nghệ, mà là vì tôi là một cố vấn đáng tin cậy của ngài, và rất có thể là người bạn thực sự duy nhất của ngài.\n\nChúng ta nên ưu tiên nghiên cứu §SGiao Thức Thế Giới Mới§! trước, nhờ đó chúng ta có thể chế tạo £colony_ship£§STàu Thuộc Địa§! để thiết lập chỗ đứng vững chắc trên các £planet£§SHành Tinh§! khác."
 tutorial.4.name: "Hướng Dẫn: Khảo Sát"
 tutorial.4.desc: "Muốn mở rộng bờ cõi, trước tiên phải đo đạc địa hình. Và chiếc £science_ship£§STàu Khoa Học§! của chúng ta được sinh ra chính là để thực thi sứ mệnh vĩ đại đó.\n\nNgài có thể nhận diện §STàu Khoa Học§! thông qua biểu tượng sau:\n\n$tttt$$tt$£science_ship_map£\n\n\nNgài có hai cách để chọn tàu: nhấp chọn trực tiếp trên §SBản Đồ Thiên Hà§! hoặc chọn từ menu §STổng Quan§!.\n\n£dot_green£ Chọn một chiếc §STàu Khoa Học§!\n£dot_green£ Nhấp chuột phải vào một £system£§SHệ Sao§! lân cận\n£dot_green£ Chọn §SKhảo Sát Hệ Sao§!\n\n§SHệ Sao§! bắt buộc phải được khảo sát hoàn tất thì mới có thể tuyên bố chủ quyền."
 tutorial.5.name: "Bỏ Tạm Dừng"
 tutorial.5.desc: "Lúc này, chúng ta đã có thể ban hành mệnh lệnh xuất phát cho £science_ship£§STàu Khoa Học§! của mình. Chúng ta sẽ cần phải Bỏ Tạm Dừng tiến trình mô phỏng của §SBản Đồ Thiên Hà§! để mọi thứ có thể tiếp diễn.\n\nĐể §SBỏ Tạm Dừng§!:\n\n£dot_green£ Ngài có thể nhấn §SPhím Cách§! hoặc nhấp vào nút §SBỏ Tạm Dừng§! trên thanh công cụ ở phía trên màn hình:\n\n$tttt$$t$£pause_button£\n"
 tutorial.6.name: "Hướng Dẫn: Hoàn Thành Nghiên Cứu Công Nghệ"
 tutorial.6.desc: "Tuyệt vời! Công nghệ vừa được nghiên cứu hoàn tất sẽ mang lại lợi ích rất lớn cho chúng ta. Ngài đừng quên phân công các dự án nghiên cứu mới cho những £scientist£§SGiám Đốc Khoa Học§! nhé."
 tutorial.7.name: "Hướng Dẫn: Tàu Công Trình"
 tutorial.7.desc: "Nguồn tài nguyên mà hành tinh mẹ có thể cung cấp chỉ đủ để chúng ta tiến đến bước này. Nền công nghiệp của chúng ta cần phải vươn ra khỏi hành tinh, và điều đó đòi hỏi chúng ta phải có một chiếc £construction_ship£§STàu Công Trình§!.\n\nNếu chúng ta đã thu thập đủ £alloys£§SHợp Kim§!, hãy mau chóng [GetBuildGrow] một chiếc đi thôi."
 tutorial.8.name: "Hướng Dẫn: Tàu Công Trình Chế Tạo Hoàn Tất"
 tutorial.8.desc: "Tuyệt vời! £construction_ship£§STàu Công Trình§! đã sẵn sàng để hoạt động, và phi hành đoàn trên tàu đều là những kỹ sư tinh anh nhất của đế chế."
 tutorial.9.name: "Hướng Dẫn: Trạm Khai Thác"
 tutorial.9.desc: "Tài nguyên được sản xuất trên hành tinh mẹ chỉ đủ để chúng ta tiến đến bước này, nhưng may mắn thay, £science_ship£§STàu Khoa Học§! của chúng ta đã phát hiện ra một mỏ tài nguyên trên một hành tinh khác!\n\nĐã đến lúc phái £construction_ship£§STàu Công Trình§! đi [GetBuildGrow] một £mining_station£§STrạm Khai Thác§! rồi.\n\n§STrạm Khai Thác§! có thể được xây dựng bên trong lãnh thổ của đế chế, nó sẽ tự động thu thập £minerals£§SKhoáng Sản§!, £energy£§SNăng Lượng§! và £strategic_resource£§STài Nguyên Chiến Lược§! trên thiên thể mà nó quay quanh.\n\nChọn §STàu Công Trình§!;\n\n£dot_green£ Nhấp chuột phải vào một £system£§SHệ Sao§! bên trong lãnh thổ\n£dot_green£ Chọn §S[GetBuildGrowCap]Trạm Khai Thác§!\n\n§STrạm Khai Thác§! cần tiêu tốn §SNăng Lượng§! làm phí duy trì."
 tutorial.10.name: "Hướng Dẫn: Thu Nhập Từ Trạm Khai Thác"
 tutorial.10.desc: "Rất tốt, £mining_station£§STrạm Khai Thác§! mới được xây dựng đã bắt đầu đi vào hoạt động, và các khoáng sản thu thập được sẽ được dùng để xử lý sâu hơn.\n\nThu nhập từ các trạm không gian khác nhau sẽ được cộng trực tiếp vào tổng thu nhập của đế chế, và được hiển thị trên thanh công cụ ở phía trên màn hình. Ngài có thể di chuột lên các biểu tượng tài nguyên khác nhau để xem chi tiết thu chi."
 tutorial.11.name: "Hướng Dẫn: Trạm Nghiên Cứu"
 tutorial.11.desc: "Một số hành tinh đã được khảo sát sẽ sở hữu những đặc tính đặc biệt, chúng là những đối tượng nghiên cứu vô cùng lý tưởng. Những tài nguyên £physics£§SVật Lý Học§!, £society£§SXã Hội Học§! và £engineering£§SKỹ Thuật Học§! này có thể được thu thập bằng £science_ship£§STrạm Nghiên Cứu§!. Các thuật toán của tôi cực kỳ khuyến nghị ngài nên xây dựng một trạm nghiên cứu.\n\nHãy nhớ rằng §STrạm Nghiên Cứu§! chỉ có thể được xây dựng bên trong lãnh thổ của đế chế, và chúng cần tiêu thụ £energy£ §SNăng Lượng§! để duy trì hoạt động."
 tutorial.12.name: "Hướng Dẫn: Trạm Nghiên Cứu Chế Tạo Hoàn Tất"
 tutorial.12.desc: "£science_ship£§STrạm Nghiên Cứu§! của chúng ta đã đi vào hoạt động, và các nhân viên nghiên cứu khoa học cũng đã bắt tay vào công việc. Nó sẽ giải mã những bí ẩn nào, và phơi bày những sự kiện kỳ bí nào đây?!"
 tutorial.13.name: "Hướng Dẫn: Hành Tinh"
 tutorial.13.desc: "£planet£§SHành Tinh§! có thể sinh sống được chia thành nhiều £district£§SPhân Khu§!, §SĐặc Khu§! và £building£§SCông Trình§!.\n\n£dot_green£ §SPhân Khu§! có thể được cấu thành từ nhiều §SĐặc Khu§!\n£dot_green£ §SĐặc Khu§! sẽ quyết định loại £job£§SVị Trí Công Việc§! được tạo ra\n£dot_green£ §SCông Trình§! cung cấp các hiệu ứng gia tăng cho §SĐặc Khu§!\n\nViệc nâng cấp các đặc khu sẽ dần dần mở khóa thêm nhiều ô §SCông Trình§!.\n\nNgài có hai cách để quan sát các hành tinh:\nTừ §SBản Đồ Thiên Hà§! hoặc từ menu §STổng Quan§!\n\n£dot_green£ Chọn một §SHành Tinh§!\n£dot_green£ Nhấp vào từng thẻ để xem chi tiết"
 tutorial.14.name: "Hướng Dẫn: Sắp Xếp Ưu Tiên Công Trình"
 tutorial.14.desc: "Tuyệt vời, §SCông Trình Hành Tinh§! mới đã được xây dựng xong, và đã đến lúc nó bắt đầu sản xuất tài nguyên.\n\nKhi £pops£§SDân Số§! gia tăng, họ sẽ tự động được phân bổ vào các £job£§SVị Trí Công Việc§! do £building£§SCông Trình§! tạo ra, và dĩ nhiên, họ cũng có thể luân chuyển qua lại giữa các vị trí khác nhau.\n\nĐể ưu tiên một §SCông Trình§!:\n\n£dot_green£ Chọn £planet£§SHành Tinh§! từ menu §STổng Quan§!\n£dot_green£ Nhấp vào thẻ §SKinh Tế§!\n£dot_green£ Nhấp vào một §SCông Trình§!"
 tutorial.15.name: "Hướng Dẫn: Chướng Ngại Vật Trên Hành Tinh"
 tutorial.15.desc: "Trên những £planet£§SHành Tinh§! có thể sinh sống đôi khi sẽ xuất hiện các £blocker£§SChướng Ngại Vật§!, cản trở quá trình phát triển và khai thác, và chúng cần phải được dọn dẹp sạch sẽ. Việc này sẽ tiêu tốn một lượng thời gian và £energy£§SNăng Lượng§! nhất định, nhưng bù lại, nó có thể mở khóa các §SĐặc Tính Hành Tinh§! hiện đang bị chúng che khuất, đồng thời giải phóng thêm không gian cho việc xây dựng.\n\nĐể dọn dẹp §SChướng Ngại Vật§!:\n\n£dot_green£ Chọn một hành tinh từ menu §STổng Quan§!\n£dot_green£ Nhấp vào thẻ §SQuản Lý§!\n£dot_green£ Nhấp vào nút §SDọn Dẹp Chướng Ngại Vật§! nằm trên chướng ngại vật đó\n\n\n$tttt$$tt$£clear_blocker£\n\n\nBên cạnh tài nguyên, một số §SChướng Ngại Vật§! còn đòi hỏi phải có các §SCông Nghệ§! bổ sung thì mới có thể loại bỏ được."
 tutorial.16.name: "Hướng Dẫn: Chướng Ngại Vật Đã Bị Loại Bỏ"
 tutorial.16.desc: "Thật tuyệt vời!\n\n£blocker£§SChướng Ngại Vật§! đã được dọn dẹp thành công.\n\nGiờ đây, ngài có thể di chuột lên bất kỳ §SChướng Ngại Vật§! nào để xem những §SĐặc Tính Hành Tinh§! nào sẽ được mở khóa sau khi dọn dẹp chúng.\n\nNgay khi thu thập đủ lượng tài nguyên cần thiết, ngài nên tiến hành dọn dẹp nốt những §SChướng Ngại Vật§! còn lại, để £planet£§SHành Tinh§! này có thể phát huy tối đa tiềm năng của nó."
 tutorial.17.name: "Hướng Dẫn: Khảo Sát Hệ Sao"
 tutorial.17.desc: "Chúng ta nên tiếp tục tiến hành các hoạt động khám phá. Tôi đề xuất ngài nên phái một chiếc £science_ship£§STàu Khoa Học§! đi khảo sát các £system£§SHệ Sao§! lân cận. Hãy cùng nhau dũng cảm giương buồm tiến vào những vùng đất mà những người đi trước chưa từng đặt chân tới!"
 tutorial.19.name: "Hướng Dẫn: Khảo Sát Hệ Sao Hoàn Tất"
 tutorial.19.desc: "Tuyệt vời! Các hệ sao nằm gần £system£§SHệ Sao Mẹ§! của chúng ta đã được khảo sát toàn bộ. Tiếp theo, đã đến lúc phái £construction_ship£§STàu Công Trình§! đi [GetBuildingGrowing] £mining_station£§STrạm Khai Thác§! và £science_ship£§STrạm Nghiên Cứu§! để thu hoạch những tài nguyên mà chúng ta vừa phát hiện.\n\nNgài có thể nhận diện §STàu Công Trình§! thông qua biểu tượng sau:\n\n$tttt$$tt$£construction_ship_map£"
 tutorial.20.name: "Hướng Dẫn: [GetBuildGrowCap] Tàu Khoa Học"
 tutorial.20.desc: "Chúng ta nên cân nhắc việc [GetBuildingGrowing] chiếc £science_ship£§STàu Khoa Học§! thứ hai. Điều này có thể giúp chúng ta đẩy nhanh tốc độ khảo sát các hệ sao lân cận.\n\nĐể [GetBuildGrow] §STàu§!:\n\n£dot_green£ Chọn một §SCăn Cứ Sao§!\n£dot_green£ Nhấp vào thẻ §SỤ Tàu§!\n£dot_green£ Nhấp vào §STàu Khoa Học§!\n\nSau khi chế tạo xong, §STàu§! mới sẽ xuất hiện ngay cạnh §SCăn Cứ Sao§!."
 tutorial.21.name: "Hướng Dẫn: Tự Động Khảo Sát"
 tutorial.21.desc: "Nhân đôi £science_ship£§STàu Khoa Học§! đồng nghĩa với việc nhân đôi niềm vui! Kể từ khi hoàn thành nhiệm vụ trước, tôi chưa bao giờ cảm thấy phấn khích đến nhường này!\n\nTuy nhiên, việc điều khiển nhiều tàu khoa học cùng lúc để khám phá sẽ tốn rất nhiều thời gian và công sức.\n\nNgài có thể tự động hóa hoạt động khảo sát bằng cách chọn §STàu Khoa Học§! và nhấp vào nút §STàu Khoa Học Tự Động Khảo Sát§! trên giao diện tương tác của hạm đội.\n\n\n$tttt$$tt$£science_ship_automate_exploration£\n\n"
 tutorial.22.name: "Hướng Dẫn: Chiêu Mộ Giám Đốc Khoa Học"
 tutorial.22.desc: "Chúng ta đã chế tạo xong một chiếc £science_ship£§STàu Khoa Học§! mới, nhưng lại chưa chỉ định một £scientist£§SGiám Đốc Khoa Học§! nào để điều khiển nó! Các thuật toán của tôi buộc tôi phải nhấn mạnh những lợi ích của việc thuê một §SNhà Khoa Học§! mới.\n\nChọn §STàu Khoa Học§!;\n\n£dot_green£ Nhấp vào khung ảnh đại diện trống trên giao diện hạm đội\n£dot_green£ Chọn một §SGiám Đốc Khoa Học; Nhà Khoa Học§!\n\nNếu không đủ khả năng chi trả cho việc thuê một §SNhà Khoa Học§! mới, ngài cũng có thể điều động một người từ các bộ phận khác sang, mặc dù phương án này không được lý tưởng cho lắm."
 tutorial.23.name: "Hướng Dẫn: Chiêu Mộ Giám Đốc Khoa Học"
 tutorial.23.desc: "Tuyệt vời. £scientist£§SGiám Đốc Khoa Học§! đã được bố trí lên chiếc £science_ship£§STàu Khoa Học§! mới, và chúng ta có thể phái họ đi khám phá những £system£§SHệ Sao§! mới vào những lúc rảnh rỗi, hoặc để họ gây ra vài rắc rối nào đó.\n\nNếu ngài muốn thay đổi §SGiám Đốc Khoa Học§!, chỉ cần nhấp lại vào khung ảnh đại diện trên giao diện hạm đội là được."
 tutorial.24.name: "Hướng Dẫn: [GetBuildGrowCap] Tàu Thuộc Địa"
 tutorial.24.desc: "Chúng ta đã sẵn sàng để tiếp nối và phát triển nền văn minh vĩ đại của mình trên một hành tinh khác, và đây là lúc chúng ta cần phải chế tạo một chiếc £colony_ship£§STàu Thuộc Địa§!.\n\nĐể [GetBuildGrow] §STàu§!:\n\n£dot_green£ Chọn một §SCăn Cứ Sao§!\n£dot_green£ Nhấp vào thẻ §SỤ Tàu§!\n£dot_green£ Nhấp vào tàu §STàu Thuộc Địa§!\n\nSau khi chế tạo xong, §STàu§! mới sẽ xuất hiện ngay cạnh §SCăn Cứ Sao§!."
 tutorial.25.name: "Hướng Dẫn: Thuộc Địa Hóa Hành Tinh"
 tutorial.25.desc: "Các cư dân đi khai hoang đã yên vị trên chiếc £colony_ship£§STàu Thuộc Địa§! mới toanh, và thuyền trưởng thông báo rằng họ đã sẵn sàng khởi hành bất cứ lúc nào. Quả là một ngày đáng để ghi nhớ!\n\nCó một vài cách khác nhau để thiết lập £colony£§SThuộc Địa§!.\n\nĐể §SThuộc Địa Hóa§! một £planet£§SHành Tinh§! trên §SBản Đồ Thiên Hà§!:\n\n£dot_green£ Nhấp vào một §SHành Tinh§! có thể thuộc địa hóa\n£dot_green£ Nhấp vào nút §SThuộc Địa Hóa§!\n\n$tttt$$ttt$£colonizable£\n\nSau khi những người đi khai hoang xuất phát, họ sẽ phải mất vài năm mới có thể xây dựng xong thuộc địa."
 tutorial.26.name: "Hướng Dẫn: Thiết Lập Thuộc Địa"
 tutorial.26.desc: "Chúng ta đang sở hữu một chiếc £colony_ship£§STàu Thuộc Địa§!, và cũng đã phát hiện ra ít nhất một hành tinh lý tưởng để thiết lập một căn cứ ngoại hành tinh lâu dài. Chẳng còn lý do gì để chần chừ nữa, hãy mau chóng thiết lập £colony£§SThuộc Địa§! đầu tiên của chúng ta thôi!"
 tutorial.27.name: "Hướng Dẫn: Thuộc Địa Thiết Lập Hoàn Tất"
 tutorial.27.desc: "Đây chính là £colony£§SThuộc Địa§! ngoại hành tinh đầu tiên của chúng ta! Giờ đây, ngay cả khi hành tinh mẹ bất hạnh nổ tung, chúng ta cũng chẳng cần phải lo lắng về việc đối mặt với thảm cảnh diệt vong nữa! Nghe cũng không tồi chứ hả?"
 tutorial.28.name: "Hướng Dẫn: Chiêu Mộ Thống Đốc"
 tutorial.28.desc: "Để đảm bảo sự phát triển thịnh vượng của £colony£§SThuộc Địa§!, chúng ta cần chiêu mộ một §SThống Đốc Hành Tinh§! để chịu trách nhiệm quản lý sự phát triển của nó.\n\nThống đốc sẽ tạo ra muôn vàn tác động khác nhau lên £planet£§SHành Tinh§!, và phần lớn trong số đó là những tác động tích cực. Hiệu quả của những tác động này phụ thuộc vào đặc điểm cá nhân của thống đốc cũng như cấp độ kỹ năng thống đốc của họ."
 tutorial.29.name: "Hướng Dẫn: Thống Đốc Chiêu Mộ Hoàn Tất"
 tutorial.29.desc: "£colony£§SThuộc Địa§! của chúng ta hiện đã nằm dưới sự cai quản của một §SThống Đốc§! mới. Điều này sẽ giúp chúng ta hoạt động hiệu quả hơn!"
 tutorial.30.name: "Hướng Dẫn: Xây Dựng Thêm Thuộc Địa"
 tutorial.30.desc: "Chỉ cần nắm trong tay đủ tài nguyên, chúng ta có thể [GetBuildGrow] thêm nhiều £colony_ship£§STàu Thuộc Địa§! hơn nữa, qua đó mở rộng ranh giới lãnh thổ của đế chế. Chúng ta nên cố gắng thiết lập thêm ít nhất ba £colony£§SThuộc Địa§! nữa. Tính cả hành tinh mẹ và thuộc địa hiện tại, chúng ta sẽ đặt dấu chân lên năm hành tinh."
 tutorial.32.name: "Hướng Dẫn: Thuộc Địa Thành Lập"
 tutorial.32.desc: "Làm tốt lắm! Thật là một thành tựu đáng kinh ngạc. Nền văn minh cao quý của chúng ta đã vươn nhánh rễ ra tới tận năm hành tinh! Chỉ cần cơ hội đến, chúng ta cần phải tiếp tục khám phá, tiếp tục bành trướng."
 tutorial.33.name: "Hướng Dẫn: Sản Xuất Tài Nguyên"
 tutorial.33.desc: "Một nguồn cung cấp £minerals£§SKhoáng Sản§!, £alloys£§SHợp Kim§! và £energy£§SNăng Lượng§! ổn định chính là chìa khóa then chốt cho sự phát triển phồn vinh của bất kỳ thế lực liên tinh tú nào. Chúng ta nên áp dụng các biện pháp cần thiết để gia tăng sản lượng của những tài nguyên này.\n\nCác trạm không gian và £building£§SCông Trình§! đòi hỏi hợp kim hoặc khoáng sản để xây dựng, và năng lượng để duy trì hoạt động. Đối với §STàu§! cũng tương tự như vậy, chỉ khác là chúng cần hợp kim để bảo trì. Những tài nguyên này được sản xuất bởi các £mining_station£§STrạm Khai Thác§! hoặc §SCông Trình Hành Tinh§!.\n\nTrong giai đoạn sau của trò chơi, ngài sẽ khám phá ra một vài loại tài nguyên mới vô cùng thú vị, chúng có thể được sử dụng cho những công trình xây dựng bí ẩn và tân tiến."
 tutorial.38.name: "Sản Xuất Tài Nguyên Thành Công"
 tutorial.38.desc: "Làm tốt lắm. Giờ đây chúng ta đã có đủ nguồn tài nguyên để xây dựng nên một đế chế vĩ đại của riêng mình."
 tutorial.39.name: "Hướng Dẫn: Mở Rộng Hạm Đội"
 tutorial.39.desc: "Hạm đội của chúng ta có vẻ hơi mỏng manh và yếu ớt. Giữa vũ trụ bao la ẩn chứa vô vàn những hiểm nguy khó lường, đòi hỏi chúng ta phải có khả năng đáp trả bằng sức mạnh quân sự cứng rắn. Xin hãy nhớ rằng, nền văn minh của chúng ta đang trong tình thế ngàn cân treo sợi tóc!"
 tutorial.43.name: "Quy Mô Hạm Đội Được Mở Rộng"
 tutorial.43.desc: "Tuyệt vời! Hạm đội của chúng ta tuy nhỏ nhưng lại vô cùng sắc bén, chắc chắn sẽ thể hiện một phong độ xuất sắc trong những cuộc chạm trán thù địch bất ngờ."
 tutorial.44.name: "Hướng Dẫn: Thiết Lập Tinh Khu"
 tutorial.44.desc: "Đế chế của chúng ta đang phát triển rực rỡ, quy mô đã phình to đến mức chúng ta không thể nào trực tiếp kiểm soát mọi thứ từ hành tinh mẹ được nữa. Đã đến lúc chúng ta cần phải thiết lập các §STinh Khu§! mới.\n\nTinh khu là những khu vực thuộc về đế chế của chúng ta, có thể được cài đặt ở chế độ tự quản lý, cho phép cư dân tự do phụ trách các vấn đề thường nhật trên £planet£§SHành Tinh§! trong phạm vi quyền hạn của họ."
 tutorial.45.name: "Hướng Dẫn: Tinh Khu Được Thành Lập"
 tutorial.45.desc: "Cùng với sự phát triển của đế chế, các £colony£§SThuộc Địa§! mới có thể được sáp nhập vào các §STinh Khu§!. Tinh khu có thể được tự động quản lý thông qua giao diện §SHành Tinh và Tinh Khu§!, tự động tiến hành xây dựng và nâng cấp các £district£§SPhân Khu§! cũng như £building£§SCông Trình§!."
 tutorial.46.name: "Hướng Dẫn: Thống Đốc"
 tutorial.46.desc: "Ngài có thể chỉ định một §SThống Đốc§! để quản lý toàn bộ §STinh Khu§!. Tất cả các £planet£§SHành Tinh§! bên trong tinh khu đều sẽ được hưởng lợi từ những kỹ năng của vị thống đốc đó. Chúng ta nên cân nhắc chỉ định một thống đốc cho tinh khu mới của mình."
 tutorial.47.name: "Hướng Dẫn: Chỉ Định Thống Đốc"
 tutorial.47.desc: "Tân §SThống Đốc§! của chúng ta đã chính thức bắt đầu công việc tại thủ phủ của tinh khu mới. Làm tốt lắm."
 tutorial.48.name: "Hướng Dẫn: Thiết Kế Tàu"
 tutorial.48.desc: "Giờ đây chúng ta đã có thể tự tay thiết kế những chiếc §STàu§! mới ngay tại giao diện §SThiết Kế Tàu§!. Quy trình này khá đơn giản và trực quan, dĩ nhiên, chúng ta cũng hoàn toàn có thể sử dụng chức năng thiết kế tự động.\n\nĐể truy cập §SThiết Kế Tàu§!:\n\n£dot_green£ Nhấp vào nút §SQuản Lý Hạm Đội§! trên thanh công cụ bên trái hoặc nhấn phím §SF9§!\n\n$tttt$$tt$£fleet_management£\n"
 tutorial.49.name: "Hướng Dẫn: Nâng Cấp Tàu"
 tutorial.49.desc: "Làm tốt lắm. Thiết kế tàu mới đã được lưu vào cơ sở dữ liệu của chúng ta, và hiện đã sẵn sàng để được sản xuất tại các §SCảng Không Gian§! có trang bị §SỤ Tàu§!.\n\nThiết kế mới có thể được chỉnh sửa bất cứ lúc nào trong §SThiết Kế Tàu§!. Khi thiết kế có sự thay đổi, những chiếc §STàu§! đã được chế tạo sẽ cần phải quay về §SCăn Cứ Sao§! để tiến hành nâng cấp.\n\nĐể nâng cấp §STàu§!:\n\n£dot_green£ Chọn một §STàu§! từ menu §STổng Quan§!\n£dot_green£ Nhấp vào nút §SNâng Cấp§! trên giao diện hạm đội\n\n$tttt$$tt$£upgrade_ship£\n"
 tutorial.52.desc: "Sau khi nghiên cứu, hiện tượng dị thường trên [From.GetName] được xác định là một cấu trúc §YHình Học§! được hình thành hoàn toàn tự nhiên. Trông nó giống hệt như một biểu tượng chỉ đường vậy, vẻ đẹp tự nhiên của vũ trụ quả thực khiến người ta phải trầm trồ kinh ngạc.\n\n$tutorial.52.filler.desc$"
 tutorial.52.spirit.desc: "Chúng ta đã phát hiện ra một cấu trúc tự nhiên trên [From.GetName], với cấu trúc hình học hoàn hảo đến nghẹt thở. Đây chắc chắn là một kiệt tác siêu phàm của Đấng Sáng Tạo, một dấu hiệu dẫn dắt chúng ta tiến vào giữa những vì sao!\n\n$tutorial.52.filler.desc$"
 tutorial.52.filler.desc: "Chúng ta nên §Ytiếp tục điều tra§! những hiện tượng dị thường này. Chắc chắn nó sẽ mang lại cho chúng ta những kiến thức và công nghệ mới mẻ."
 tutorial.52.a: "Thật đáng kinh ngạc!"
 tutorial.52.spirit.a: "Ngợi ca phép màu!"
 tutorial.53.desc: "Đằng sau hiện tượng dị thường được phát hiện trên [From.GetName], chúng ta đã tìm thấy một thứ vô cùng kinh ngạc. Những quỹ đạo bao quanh [From.GetPlanetMoon] rõ ràng là tàn tích để lại của các động cơ siêu quang tốc. Tuy nhiên, do chúng đã tồn tại từ quá lâu, chúng ta không thể truy xuất được nguồn gốc của chúng.\n\n$tutorial.52.filler.desc$"
 tutorial.53.xenophobe.desc: "Chúng ta đã phát hiện ra những dấu vết mờ nhạt của các tuyến siêu không gian gần [From.GetName]. Chúng đã tồn tại từ rất lâu và không thể truy xuất được nguồn gốc. Điều này chứng tỏ từ xa xưa đã có những nhà du hành liên tinh tú từng đến đây, âm thầm quan sát và thu thập thông tin tình báo về chúng ta.\n\n$tutorial.52.filler.desc$"
 tutorial.53.xenophile.desc: "Hiện tượng dị thường trên [From.GetPlanetMoon] [From.GetName] đã hé lộ những dấu vết của các nhà du hành liên tinh tú khác! Những dấu vết mờ nhạt của các tuyến siêu không gian này chứng tỏ rằng, từ rất lâu về trước, đã có người ghé thăm £planet£§SHành Tinh§! của chúng ta để tìm kiếm những đồng minh tiềm năng. Thế nhưng, do những dấu vết này đã bị mài mòn quá nghiêm trọng, chúng ta không thể truy xuất được nguồn gốc của chúng.\n\n$tutorial.52.filler.desc$"
 tutorial.53.a: "Chúng ta đã từng bị quan sát ư? Bọn chúng rốt cuộc có mục đích gì?"
 tutorial.53.xenophobe.a: "Chúng ta phải luôn cảnh giác trước các mối đe dọa từ những giống loài khác."
 tutorial.53.xenophile.a: "Mau đi tìm bọn họ thôi!"
 tutorial.54.desc: "Chúng ta đã tìm thấy một chiếc §STàu Thăm Dò Cũ§! của chính mình trên [From.GetName]. Nó đã duy trì hoạt động trong suốt ngần ấy năm trời, thậm chí còn cố gắng gửi dữ liệu về hành tinh mẹ. Đây là một đài tưởng niệm cho quá trình đấu tranh gian khổ trong quá khứ của chúng ta, và cũng là biểu tượng cho khát vọng phá vỡ xiềng xích §SHành Tinh§! ngày xưa của chúng ta.\n\n$tutorial.52.filler.desc$"
 tutorial.54.a: "Chúng ta chưa bao giờ ngừng tiến bước."
 tutorial.54.spiritualist.a: "Phép màu sẽ tiếp tục làm thế giới phải kinh ngạc."
 tutorial.54.materialist.a: "Những nỗ lực của chúng ta cuối cùng cũng được đền đáp."
 tutorial.55.name: "Hướng Dẫn: Tài Nguyên Chiến Lược"
 tutorial.55.desc: "Chúng ta đã khám phá ra một loại §STài Nguyên Chiến Lược§!! Rất nhiều £strategic_resource£§STài Nguyên Chiến Lược§! yêu cầu các công nghệ đặc thù thì mới có thể sử dụng được, nhưng bù lại, chúng có thể mang đến những lợi ích vô cùng to lớn.\n\nĐể thu thập §STài Nguyên Chiến Lược§!:\n\n£dot_green£ Chọn một chiếc £construction_ship£§STàu Công Trình§!\n£dot_green£ Nhấp chuột phải vào £system£§SHệ Sao§! có chứa loại tài nguyên đó\n£dot_green£ Nhấp vào §S[GetBuildGrowCap]£mining_station£Trạm Khai Thác§!\n\n§STài Nguyên Chiến Lược§! có thể được sử dụng để xây dựng các £building£§SCông Trình§! và linh kiện tàu cao cấp, hoặc cũng có thể dùng để đem đi bán."
 tutorial.55.poi.name: "Hướng Dẫn: Vị Trí Tài Nguyên"
 tutorial.55.poi.desc: "Chúng ta đã phát hiện ra một mỏ §STài Nguyên Chiến Lược§! trên [From.GetPlanetMoon] [From.GetName]."
 tutorial.56.name: "Hướng Dẫn: Khai Thác Tài Nguyên Hoàn Tất"
 tutorial.56.desc: "Làm tốt lắm. Những tài nguyên này sẽ giúp đế chế của chúng ta trở nên giàu có và thịnh vượng hơn!"
 tutorial.56.poi.desc: "Chúng ta đã phát hiện ra một mỏ §STài Nguyên Chiến Lược§! trên [StrategicResourcePlanet.GetPlanetMoon] [StrategicResourcePlanet.GetName]."
 tutorial.560.desc: "£mining_station£§STrạm Khai Thác§! hiện tại của chúng ta đã có khả năng thu thập §STài Nguyên Chiến Lược§! nhờ vào việc áp dụng công nghệ mới được nghiên cứu thành công. Những tài nguyên quý hiếm này sẽ mang lại những hiệu ứng gia tăng to lớn, đồng thời chúng cũng là những mặt hàng thương mại vô cùng giá trị. Quả là một mũi tên trúng hai đích!\n\nNgài có thể tìm thấy thêm thông tin chi tiết trong §SNhật Ký Tình Hình§!. Vẫn còn rất nhiều £strategic_resource£§STài Nguyên Chiến Lược§! khác đang chờ đợi chúng ta khám phá giữa dải ngân hà rộng lớn này. Hãy tiếp tục công cuộc khám phá!"
 tutorial.57.name: "Hướng Dẫn: Nâng Tầm"
 tutorial.57.desc.notech: "Chúng ta đã phát hiện ra những sinh vật đã tiến hóa đến một mức độ khá cao! Dưới sự soi sáng của những §SCông Nghệ§! thích hợp, rất có thể chúng ta sẽ tiến hành §SNâng Tầm§! cho chúng, nâng cao mức độ tự nhận thức và trí tuệ của chúng —— hoặc nói một cách chính xác hơn, là những phẩm chất được coi là trí tuệ ở các sinh vật hữu cơ.\n\nViệc liên tục theo dõi sát sao quá trình nghiên cứu của chúng ta là một quyết định sáng suốt. Nếu có cơ hội, chúng ta có thể thúc đẩy quần thể này bằng các biện pháp §SKích Thích Ngoại Sinh§!."
 tutorial.57.desc.yestech: "Chúng ta đã phát hiện ra những dạng sống động vật đã tiến hóa đến một mức độ khá cao! Dưới sự soi sáng của những §SCông Nghệ§! thích hợp, rất có thể chúng ta sẽ thực hiện thành công việc §HNâng Tầm§! trí tuệ và trí thông minh của những dạng sống này —— hoặc nói một cách chính xác hơn, là những phẩm chất được coi là trí tuệ ở các sinh vật hữu cơ.\n\nỒ.\n\nCông nghệ §SCơ Chế Biểu Hiện Gen§! chắc hẳn đã đáp ứng được yêu cầu, đã đến lúc chúng ta đưa những sinh vật này vươn lên một cảnh giới hoàn toàn mới rồi."
 tutorial.58.name: "Hướng Dẫn: Nâng Tầm Giống Loài Chưa Khai Trí Hoàn Tất"
 tutorial.58.desc: "Thật là một thành công vang dội! Những con thú nguyên thủy đó nay đã được thăng cấp lên một đẳng cấp bớt nguyên thủy hơn, chính thức trở thành những công dân trong đế chế đang trên đà phát triển rực rỡ của chúng ta!"
 tutorial.59.name: "Hướng Dẫn: Cuộc Chạm Trán Đầu Tiên"
 tutorial.59.desc: "Xin hãy lưu ý! Chúng ta vừa phát hiện ra những §SSinh Vật Ngoài Hành Tinh§! sở hữu khả năng du hành vũ trụ, tuy nhiên mức độ trí tuệ của chúng hiện vẫn chưa được xác định. Nhưng nghĩ đi nghĩ lại, chúng chắc chắn phải có trí thông minh chứ nhỉ. Chúng ta phải hoàn tất việc §SKhảo Sát§! để lột bỏ bức màn bí ẩn đang bao phủ lấy chúng. Tôi đề nghị chúng ta nên chủ động ra tay trước, đừng ngồi yên chờ đợi chúng đến điều tra chúng ta...\n\nĐể khảo sát §SCuộc Chạm Trán Đầu Tiên§!:\n\n£dot_green£ Mở §SNhật Ký Tình Hình§!\n£dot_green£ Chọn §S$SHOW_FIRST_CONTACT$§!\n\n$tttt$$ttt$£firstcontact£\n\nNgài cũng có thể bắt đầu §SCuộc Chạm Trán Đầu Tiên§! bằng cách nhấp vào biểu tượng tương ứng trên §SBản Đồ Thiên Hà§!"
 #tutorial.60.name: "First Contact Made"
 #tutorial.60.desc: "A triumph. We have established communications with alien beings. What a time to be alive, or in my case, powered on."
 tutorial.61.name: "Hướng Dẫn: Giống Loài Chưa Khai Trí"
 tutorial.61.desc: "Những nỗ lực thiết lập giao tiếp của chúng ta đã phần nào chứng minh được sự tiến bộ về mặt công nghệ, nhưng kết quả thu được lại không mấy khả quan. §SNếu thực sự tồn tại những sinh vật có trí tuệ khác trong vũ trụ§!, thì có lẽ chúng chỉ là một đám sinh vật với mức độ trí tuệ ngang ngửa với động vật mà thôi.\n\nNgài không thể tiến hành ngoại giao với §SSinh Vật Tiền Trí Tuệ§!, nhưng tùy thuộc vào loại hình đế chế của ngài, đôi khi ngài có thể nâng tầm, tận diệt, nô dịch hoặc tiến hành quan sát chúng."
 tutorial.63.name: "Hướng Dẫn: Nhận Được Truyền Dẫn Tín Hiệu"
 tutorial.63.desc: "Có vẻ như §Sđối phương§! đã đi trước chúng ta một bước, họ đã chủ động §SThiết Lập Liên Lạc§! với chúng ta ngay cả khi chúng ta còn chưa kịp giải mã phương thức giao tiếp của họ.\n\nHy vọng rằng trong những cơ hội tương tự sau này, chúng ta sẽ là những người chủ động thực hiện bước đi đầu tiên đó."
 tutorial.64.name: "Hướng Dẫn: Chỉnh Sửa Giống Loài"
 tutorial.64.desc: "Nhờ vào những đột phá gần đây trong lĩnh vực di truyền học, chúng ta đã thu được một lượng §SĐiểm Đặc Tính§! bổ sung, có thể dùng để §SChỉnh Sửa§! và cường hóa người dân của chúng ta.\n\nĐể chỉnh sửa §SGiống Loài§!:\n\n£dot_green£ Mở thẻ §SGiống Loài§! hoặc nhấn phím §SF6§!\n£dot_green£ Nhấp vào nút §SChỉnh Sửa§!\n£dot_green£ Nghiên cứu §SDự Án Đặc Biệt§!"
 tutorial.65.name: "Hướng Dẫn: Chỉnh Sửa Giống Loài Hoàn Tất"
 tutorial.65.desc: "Thật là tuyệt vời. Đế chế của chúng ta cuối cùng cũng đã thoát khỏi xiềng xích của sự tiến hóa tự nhiên, và chắc chắn sẽ gặt hái được những thành tựu vĩ đại trong dải ngân hà."
 tutorial.70.name: "Hướng Dẫn: Du Hành Siêu Quang Tốc"
 tutorial.70.desc: "Nhằm rút ngắn khoảng cách vời vợi giữa các £system£§SHệ Sao§!, các £scientist£§SNhà Khoa Học§! của chúng ta đã phát minh ra §SĐộng Cơ Warp§!. Những §SChiến Hạm§! được trang bị thiết bị này sẽ có khả năng di chuyển giữa hai hệ sao với tốc độ vượt qua cả tốc độ ánh sáng.\n\nMặc dù §SPhi Thuyền§! có thể tiếp cận các hệ sao nằm trong phạm vi thông qua động cơ warp, nhưng hệ thống này chỉ có thể được kích hoạt ở rìa ngoài của vòng cung trọng lực của hệ sao. Sau khi §SChiến Hạm§! thoát khỏi trạng thái bay siêu quang tốc, nó sẽ cần một khoảng thời gian nhất định để nạp lại năng lượng trước khi có thể thực hiện chuyến du hành liên tinh tú tiếp theo. Khoảng thời gian này dài hay ngắn phụ thuộc vào quãng đường mà §SChiến Hạm§! vừa đi qua."
 tutorial.71.name: "Hướng Dẫn: Du Hành Siêu Không Gian"
 tutorial.71.desc: "Nhằm rút ngắn khoảng cách vời vợi giữa các £system£§SHệ Sao§!, các £scientist£§SNhà Khoa Học§! của chúng ta đã phát minh ra §SĐộng Cơ Siêu Không Gian§!. Thiết bị này cho phép các con tàu di chuyển giữa hai hệ sao được kết nối thông qua siêu không gian với tốc độ vượt xa tốc độ ánh sáng.\n\nMặc dù việc di chuyển qua siêu không gian mang lại tốc độ cực kỳ nhanh chóng, nhưng phương thức du hành này lại bị giới hạn khắt khe trong mạng lưới siêu phẳng liên kết các hệ sao.\n\nĐể tiến vào siêu không gian, §SChiến Hạm§! trước tiên phải di chuyển đến rìa của hệ sao, tức là nằm bên ngoài giếng trọng lực của hệ sao đó.\n\nQuá trình này sẽ diễn ra tự động khi ngài ra lệnh cho §SChiến Hạm§! di chuyển đến một §SHệ Sao§! khác."
 tutorial.72.name: "Hướng Dẫn: Du Hành Lỗ Sâu"
 tutorial.72.desc: "Nhằm rút ngắn khoảng cách vời vợi giữa các £system£§SHệ Sao§!, các £scientist£§SNhà Khoa Học§! của chúng ta đã phát minh ra công nghệ §SLỗ Sâu§!. Các trạm không gian được trang bị máy phát lỗ sâu có thể mở ra một hành lang không gian, tạo ra một kênh kết nối tạm thời giữa hai hệ sao, cho phép §SChiến Hạm§! đi qua.\n\nPhương thức du hành lỗ sâu vô cùng tiện lợi, nhưng nó đòi hỏi phải có một trạm lỗ sâu được xây dựng trong phạm vi hoạt động. §SChiến Hạm§! cũng cần phải được trang bị bộ ổn định lỗ sâu để chống chọi lại những áp lực khủng khiếp khi đi xuyên qua lỗ sâu."
 tutorial.73.name: "Hướng Dẫn: Nâng Tầm"
 tutorial.73.desc: "Chỉ cần nắm trong tay những công nghệ phù hợp, chúng ta hoàn toàn có khả năng §YNâng Tầm§! những sinh vật hạ đẳng trở thành các chủng tộc có tri giác.\n\nĐể nâng tầm §SGiống Loài§!:\n\n£dot_green£ Mở £planet£§SHành Tinh§! có chứa sinh vật §SChưa Khai Trí§!\n£dot_green£ Chọn thẻ §SQuản Lý§!\n£dot_green£ Chọn §SGiống Loài§!\n£dot_green£ Nhấp vào §SThiết Lập Quyền Lợi§!\n£dot_green£ Nhấp vào §SNâng Tầm§!\n\n"
 tutorial.75.name: "Hướng Dẫn: Tuyên Bố Chủ Quyền Hệ Sao"
 tutorial.75.desc: "Chúng ta đã bắt đầu hành trình khám phá một số hệ sao láng giềng, và có lẽ đã đến lúc vươn tay ra xa hơn nữa.\n\nNgài có thể tiến hành xây dựng §SCăn Cứ Sao§! tại những £system£§SHệ Sao§! đã được khảo sát nhằm mục đích mở rộng bờ cõi, giành lấy quyền sở hữu hợp pháp cho những khu vực không gian mới này.\n\nVới sự hỗ trợ của những công nghệ tiên tiến hơn, các căn cứ sao còn có thể được nâng cấp để thực hiện chức năng sản xuất §STàu§! hoặc khai thác tài nguyên.\n\nĐể tuyên bố chủ quyền §SHệ Sao§!:\n\n£dot_green£ Chọn một chiếc £construction_ship£§STàu Công Trình§!\n£dot_green£ Nhấp chuột phải vào một §SHệ Sao§! đã được khảo sát\n£dot_green£ Chọn §S[GetBuildGrowCap]Căn Cứ Sao§!"
 tutorial.76.name: "Hướng Dẫn: Nâng Cấp Căn Cứ Sao"
 tutorial.76.desc: "Rất tốt. Như ngài có thể thấy trên §SBản Đồ Thiên Hà§!, ranh giới của đế chế chúng ta đã được mở rộng và bao trùm lấy £system£§SHệ Sao§! vừa mới được xây dựng §SCăn Cứ Sao§! này.\n\nTuy nhiên, chiếc §SCăn Cứ Sao§! mới được xây dựng này chỉ là một tiền đồn sơ khai, nó sở hữu khả năng phòng thủ cực kỳ hạn chế và không có không gian để lắp đặt các §SModule§! cũng như £building£§SCông Trình§!. Chính vì vậy, những tiền đồn chưa được nâng cấp này sẽ không hiển thị trên danh sách tổng quan.\n\nĐể nâng cấp §SCăn Cứ Sao§!:\n\n£dot_green£ Nhấp vào hệ sao trên §SBản Đồ Thiên Hà§!\n£dot_green£ Chọn §SCăn Cứ Sao§!\n£dot_green£ Nhấp vào nút §SNâng Cấp§!"
 tutorial.80.name: "Hướng Dẫn: Chế Độ Bản Đồ"
 tutorial.80.desc: "Trên bản đồ vũ trụ, ngài có thể bật hoặc tắt các §SChế Độ Bản Đồ§! khác nhau ở góc dưới bên phải để xem các loại thông tin khác nhau. Ví dụ, ngài có thể sắp xếp dựa trên thái độ của các thế lực khác đối với chúng ta, và sử dụng các màu sắc khác nhau để đánh dấu chúng trên bản đồ."
 tutorial.100.name: "Tắt Hướng Dẫn"
 tutorial.100.desc: "Đã tắt §HHướng Dẫn§! và §HGợi Ý§!."
 tutorial.101.name: "Chỉ Hiện Gợi Ý"
 tutorial.101.desc: "Đã bật §HGợi Ý§!, tắt §HHướng Dẫn§!."
 tutorial.102.name: "Toàn Bộ Hướng Dẫn"
 tutorial.102.desc: "Đã bật cả §HHướng Dẫn§! và §HGợi Ý§!."
 tutorial.1337.name: "Hướng Dẫn: Cổ Vật Quý Hiếm"
 tutorial.1337.desc: "Chúng ta đã phát hiện ra một số £minor_artifacts£§SCổ Vật Quý Hiếm§!. Cổ vật quý hiếm là một loại tài nguyên chứa đựng những kiến thức uyên thâm, đây là một thuật ngữ chung dùng để chỉ những hiện vật kỳ lạ mà chúng ta không thể thấu hiểu, và trên thực tế là không thể giải thích được bằng khoa học hiện tại.\n\nChúng có thể được sử dụng để thực thi vô số quyết nghị khác nhau.\n\nĐể sử dụng §SCổ Vật Quý Hiếm§!:\n\n£dot_green£ Nhấp vào nút §S$topbar_button_discoveries_name$§! trên thanh công cụ bên trái\n£dot_green£ Chọn thẻ §SBộ Sưu Tập§! hoặc nhấn phím §SC§!\n\n$tttt$$tt$£discoveries£\n"
 tutorial.1340.name: "Hướng Dẫn: $astral_threads$"
 tutorial.1340.desc: "Chúng ta đã phát hiện ra một số £astral_threads£§SSợi Không Gian Tinh Tú§!, chúng là những sợi vật chất không thời gian bị nén lại, là sản phẩm sinh ra từ những vụ va chạm giữa các mặt phẳng không gian thứ nguyên. Thông thường, những sợi vật chất này chỉ có thể được tìm thấy tại các §SKhe Nứt Không Gian Tinh Tú§!, hoặc được thu hồi sau khi tiến vào £astral_rift£§SVết Nứt Không Gian Tinh Tú§!.\n\nĐể thực hiện các §SHành Động Không Gian Tinh Tú§! khác nhau:\n\n£dot_green£ Nhấp vào nút §S$topbar_button_discoveries_name$§! trên thanh công cụ bên trái\n£dot_green£ Chọn thẻ §SSợi Không Gian Tinh Tú§!\n\n$tttt$$tt$£discoveries£\n\nNgài có thể mở khóa thêm nhiều loại hành động mới bằng cách khám phá các §SVết Nứt Không Gian Tinh Tú§!, những vết nứt này có thể xuất hiện từ các §SKhe Nứt Không Gian Tinh Tú§! hoặc các sự kiện dị thường khác."
 tutorial.2000.name: "Thực Hiện Cuộc Chạm Trán Đầu Tiên"
 tutorial.2000.desc: "Một số §SCuộc Chạm Trán Đầu Tiên§! sẽ cung cấp các tùy chọn để chúng ta có thể tự do quyết định cách thức tiến hành quá trình tiếp xúc. Và đương nhiên, những quyết định này sẽ để lại những ảnh hưởng lâu dài đến mối quan hệ ngoại giao với các đế chế khác."
 tutorial.2006.name: "Hướng Dẫn: Ngoại Giao"
 tutorial.2006.desc: "Giao thức liên lạc đã được thiết lập thành công. Ngay lúc này, chúng ta đã có thể triển khai các hoạt động §SNgoại Giao§! với đế chế này. Đánh giá hiện tại của họ về chúng ta sẽ bị chi phối bởi những hành động mà chúng ta đã thực hiện trong quá trình §SCuộc Chạm Trán Đầu Tiên§!.\n\nĐể triển khai §SNgoại Giao§!:\n\n£dot_green£ Nhấp vào nút §SLiên Lạc§! trên thanh công cụ bên trái hoặc nhấn phím §SF10§!\n\n$tttt$$tt$£contacts£\n\nTrong nhiệm vụ Chạm Trán Đầu Tiên, chúng ta cũng đã thu thập được một lượng tình báo nhất định. Cùng với việc chúng ta dần dần nắm bắt được nhiều thông tin tình báo hơn về một đế chế, nhiều chi tiết sâu sắc hơn về họ cũng sẽ được phơi bày trước mắt chúng ta."
 tutorial.2007.name: "$tutorial.2006.name$"
 tutorial.2007.desc: "Chúng ta đã tiến hành §SCuộc Chạm Trán Đầu Tiên§! với một nền văn minh sở hữu bản chất hoàn toàn khác biệt —— loại nền văn minh này thường rất ngần ngại trong việc triển khai các hoạt động §SNgoại Giao§! với các quốc gia khác.\n\nNhững hoạt động ngoại giao mà chúng ta có thể thực hiện với loại nền văn minh này là vô cùng hạn chế, tuy nhiên, đôi khi họ cũng có thể đưa ra quyết định chủ động liên lạc với chúng ta."
 tutorial.2010.name: "Hướng Dẫn: Phân Công Người Cung Cấp Thông Tin"
 tutorial.2010.desc: "§SNgười Cung Cấp Thông Tin§! là một thuật ngữ chung dùng để chỉ những điệp viên và công cụ giá trị, có khả năng mang lại nhiều hiệu ứng khác nhau cho các hoạt động tình báo của chúng ta. Người cung cấp thông tin hoạt động bên trong mạng lưới tình báo, và cũng có thể được phân công tham gia vào các chiến dịch, nhằm khai thác những cơ hội mới hoặc giúp chúng ta thoát khỏi những tình huống hiểm nghèo.\n\nChúng ta có thể thu nạp người cung cấp thông tin thông qua các sự kiện hoặc bằng cách thực thi chiến dịch §S$operation_acquire_asset$§!."
 tutorial.2100.name: "Hướng Dẫn: Ngoại Giao Liên Minh Độc Lập"
 tutorial.2100.abbr.desc: "Chúng ta đã tiến hành §SCuộc Chạm Trán Đầu Tiên§! với một §SLiên Minh Độc Lập Không Gian§!. Liên Minh Độc Lập Không Gian là một dạng quốc gia nhỏ bé nhưng độc lập, có thể giao thương với những đế chế hùng mạnh như chúng ta, và hình thức ngoại giao của họ cũng mang những nét đặc thù rất riêng."
 tutorial.2100.full.desc: "$tutorial.2100.abbr.desc$\n\nLiên Minh Độc Lập Không Gian có thể cung cấp cho chúng ta vô vàn những dịch vụ đa dạng: từ việc hỗ trợ nghiên cứu khoa học cho đến buôn bán thông tin tình báo, từ việc thi công các công trình trên Căn Cứ Sao cho đến việc giao dịch các §STàu§! không gian, không gì là không thể. Đương nhiên, việc mua sắm các dịch vụ của Liên Minh Độc Lập sẽ giúp nâng cao §SĐánh Giá§! của họ đối với ngài."
 tutorial.2105.name: "Hướng Dẫn: $tutorial.2100.name$"
 tutorial.2105.abbr.desc: "Chúng ta đã liên lạc được với một §SLiên Minh Lính Đánh Thuê§!. Những chuyên gia quân sự với khả năng tác chiến độc lập này sẵn sàng phục vụ và cho thuê các §SHạm Đội Lính Đánh Thuê§! cho bất kỳ quốc gia nào, dĩ nhiên là bao gồm cả quốc gia của chúng ta."
 tutorial.2105.full.desc: "$tutorial.2105.abbr.desc$\n\nNếu chúng ta quyết định bỏ tiền ra thuê một Hạm Đội Lính Đánh Thuê, chúng ta sẽ nắm quyền kiểm soát hạm đội đó trong một khoảng thời gian nhất định. Trong suốt khoảng thời gian đó, Liên Minh sẽ có trách nhiệm bổ sung những chiến hạm bị tổn thất, nhưng bất luận thế nào, chúng ta cũng không thể sáp nhập Hạm Đội Lính Đánh Thuê cùng với vị Đô đốc Hải quân của nó vào đội hình chiến hạm của chúng ta."
 tutorial.2111.name: "Hướng Dẫn: Liên Minh Lính Đánh Thuê"
 tutorial.2111.abbr.desc: "Nếu chúng ta đồng ý, §Y[tutorial_mercenary_fleet.GetName]§! có thể lập tức thành lập một §SLiên Minh Lính Đánh Thuê§!, những chiến hạm này sẽ không còn chịu sự kiểm soát của chúng ta nữa, mà sẽ trở lại thành một lực lượng quân sự độc lập, và có thể cho thuê lại §SHạm Đội Lính Đánh Thuê§! cho tất cả các quốc gia, kể cả chúng ta."
 tutorial.2111.full.desc: "$tutorial.2111.abbr.desc$\n\nNếu chúng ta nhượng lại một vùng lãnh thổ cho Liên Minh Lính Đánh Thuê, thì chỉ cần họ cho các quốc gia khác thuê Hạm Đội Lính Đánh Thuê, chúng ta sẽ có thể thu được một khoản §SThu Nhập§! đều đặn. Nếu chúng ta chọn tự mình thuê hạm đội đó, chúng ta sẽ giữ được quyền kiểm soát hạm đội trong một khoảng thời gian nhất định. Ngoài ra, nếu hiện tại hạm đội đánh thuê không khả dụng, đế chế sẽ phải chi trả thêm một khoản phí để có thể tiếp cận."
 tutorial.2115.name: "Hướng Dẫn: Siêu Cấu Trúc"
 tutorial.2115.desc: "£megastructure£§SSiêu Cấu Trúc§! là một công trình kiến trúc khổng lồ mà chúng ta có thể [GetBuildGrow] trong không gian vũ trụ. Chúng có thể cung cấp cho chúng ta những cơ sở nghiên cứu tối tân, nguồn tài nguyên dồi dào, và thậm chí là cả những phương thức di chuyển độc nhất vô nhị.\n\nViệc xây dựng một siêu cấu trúc đòi hỏi phải đầu tư một lượng lớn thời gian và tài nguyên, nhưng bù lại, phần thưởng mà chúng mang đến cũng vô cùng xứng đáng. Chúng ta có thể khởi công xây dựng một siêu cấu trúc bằng cách phái một chiếc £construction_ship£§STàu Công Trình§! đến địa điểm được chỉ định."
 tutorial.2120.name: "Hướng Dẫn: $tech_orbital_ring_tier_1$"
 tutorial.2120.desc: "Nhờ vào những tiến triển đáng kể trong lĩnh vực nghiên cứu Siêu Kỹ Thuật, giờ đây chúng ta đã có khả năng xây dựng các §STrạm Căn Cứ Vành Đai§! xung quanh những £planet£§SHành Tinh§! có thể sinh sống. Ngài có thể phái một chiếc £construction_ship£§STàu Công Trình§! đến đó để bắt tay vào việc xây dựng."
 tutorial.2121.name: "$tutorial.2120.name$"
 tutorial.2121.desc: "§STrạm Căn Cứ Vành Đai§! là một dạng £megastructure£§SSiêu Cấu Trúc§! có khả năng bao trọn lấy toàn bộ £planet£§SHành Tinh§!. Nó có thể thiết lập một hành lang kết nối hiệu quả giữa không gian và mặt đất, cung cấp không gian lý tưởng cho các công trình như bến tàu, hệ thống phòng thủ, hay kho dự trữ tài nguyên...\n\nTại giao diện Trạm Căn Cứ Vành Đai, chúng ta có thể xây dựng hoặc dỡ bỏ các £building£§SCông Trình§! hay §SModule§!, đồng thời có thể nâng cấp Trạm Căn Cứ Vành Đai lên các cấp độ cao hơn. Việc nâng cấp căn cứ sẽ gia tăng số lượng ô công trình có sẵn, tuy nhiên, giới hạn cấp độ tối đa sẽ phụ thuộc vào cơ sở hạ tầng của hành tinh."
 tutorial.2125.name: "Hướng Dẫn: $tech_quantum_catapult$"
 tutorial.2125.desc: "Nhờ vào những tiến triển đáng kể trong lĩnh vực nghiên cứu Siêu Kỹ Thuật, giờ đây chúng ta đã có khả năng xây dựng §SMáy Phóng Lượng Tử§! xung quanh các §SPulsar§! hoặc §SSao Neutron§!. Ngài có thể phái một chiếc £construction_ship£§STàu Công Trình§! đến đó để bắt tay vào việc xây dựng."
 tutorial.2126.name: "Hướng Dẫn: $tutorial.2125.name$"
 tutorial.2126.desc: "§SMáy Phóng Lượng Tử§! có khả năng đẩy các §STàu§! và hạm đội vượt qua những khoảng cách xa xôi tính bằng đơn vị thiên văn. Công nghệ này đã gia tăng đáng kể khả năng phản ứng nhanh của chúng ta đối với các vấn đề phát sinh bên trong lãnh thổ đế chế cũng như các khu vực lân cận.\n\nTuy nhiên, việc sử dụng Máy Phóng Lượng Tử cũng đi kèm với một số rủi ro nhất định, chẳng hạn như hạm đội có khả năng bị ném đến một £system£§SHệ Sao§! nằm ngoài mục tiêu dự kiến. Đương nhiên, chúng ta có thể hạn chế những rủi ro này bằng cách nâng cấp Máy Phóng Lượng Tử lên các cấp độ cao hơn, qua đó nâng cao công suất và gia tăng khoảng cách bước nhảy tối đa của nó."
 tutorial.2130.name: "Hướng Dẫn: $tech_hyper_relays$"
 tutorial.2130.desc: "Với việc nghiên cứu Siêu Kỹ Thuật về §STrạm Trung Chuyển Siêu Không Gian§! đã đạt được những thành tựu nhất định, chúng ta đã có thể bắt tay vào việc phái một chiếc £construction_ship£§STàu Công Trình§! đi xây dựng một mạng lưới trạm trung chuyển."
 tutorial.2131.name: "Hướng Dẫn: $tutorial.2130.name$"
 tutorial.2131.desc: "§STrạm Trung Chuyển Siêu Không Gian§! có khả năng đẩy nhanh tốc độ di chuyển tại các £system£§SHệ Sao§! lân cận. Nếu có thể kết nối §Sít nhất hai§! Trạm Trung Chuyển Siêu Không Gian lại với nhau, chúng ta sẽ có thể thiết lập một mạng lưới giúp gia tăng đáng kể tốc độ di chuyển bên trong lãnh thổ đế chế.\n\nTrạm Trung Chuyển Siêu Không Gian cũng có khả năng kết nối với các trạm trung chuyển bên trong lãnh thổ của các quốc gia láng giềng đã mở cửa biên giới, qua đó kết nối mạng lưới của hai quốc gia lại với nhau. Điều này sẽ giúp tăng tốc độ di chuyển của §STàu§! khi băng qua các quốc gia láng giềng."
 tutorial.2140.name: "Hướng Dẫn: Trạm Quan Sát"
 tutorial.2140.desc: "Chúng ta đã phát hiện ra một §SXã Hội Tiền Siêu Quang Tốc§!! Mặc dù họ không sở hữu công nghệ du hành liên tinh tú như chúng ta, nhưng chúng ta vẫn có thể học hỏi được rất nhiều điều từ những sinh vật ngoài hành tinh này. Bất kể là nghiên cứu về nền văn hóa của họ hay biến họ thành nô lệ, tất cả đều nằm trong lòng bàn tay chúng ta.\n\nNếu có kế hoạch quan sát họ (với điều kiện họ phải nằm trong tầm kiểm soát của chúng ta), chúng ta sẽ cần phải xây dựng một §STrạm Quan Sát§! trên quỹ đạo của hành tinh họ đang sinh sống.\n\nCòn nếu dự định xâm lược họ, chúng ta chỉ cần tập hợp quân đội là đủ, bọn họ chẳng có lấy một cơ hội chiến thắng nào đâu."
 tutorial.2145.name: "Hướng Dẫn: Trạm Quan Sát Chế Tạo Hoàn Tất"
 tutorial.2145.desc.nodlc: "§STrạm Quan Sát§! mới của chúng ta đã chính thức đi vào hoạt động. Chừng nào £awareness£§SMức Độ Nhận Thức§! của mục tiêu nghiên cứu vẫn được duy trì ở mức thấp, nó sẽ tiếp tục thực thi §SNhiệm Vụ§! của mình.\n\nMột khi mức độ nhận thức của xã hội tiền siêu quang tốc đạt đến giới hạn tối đa, chúng ta sẽ không thể tiếp tục quan sát họ được nữa. Thay vào đó, chúng ta có thể sử dụng các biện pháp §SNgoại Giao§! để tiếp xúc với họ. Nếu §SChính Sách Can Thiệp§! cho phép, chúng ta cũng có thể chủ động hiện diện trước họ từ sớm."
 tutorial.2145.desc.dlc: "§STrạm Quan Sát§! mới của chúng ta đã chính thức đi vào hoạt động. Chừng nào £awareness£§SMức Độ Nhận Thức§! của mục tiêu nghiên cứu vẫn được duy trì ở mức thấp, nó sẽ tiếp tục thực thi §SNhiệm Vụ§! của mình.\n\nChúng ta có thể liên tục thu được một nhánh công nghệ độc đáo từ Trạm Quan Sát, đó chính là §STri Thức Quan Sát§!, cho đến khi mức độ nhận thức của xã hội tiền siêu quang tốc này đạt đến giới hạn tối đa và buộc nhiệm vụ phải chấm dứt.\n\nNếu tình huống này xảy ra, chúng ta có thể chuyển sang sử dụng các biện pháp §SNgoại Giao§! để tiếp xúc với họ. Nếu §SChính Sách Can Thiệp§! cho phép, chúng ta cũng có thể chủ động hiện diện trước họ từ sớm."
 tutorial.2150.name: "Hướng Dẫn: $tutorial.2006.name$"
 tutorial.2150.desc: "Nền văn minh tiền siêu quang tốc này đã nhận thức được sự tồn tại của chúng ta. Dựa trên quan điểm §SChính Sách§! của mình, hiện tại chúng ta có thể thực hiện một số hoạt động §SNgoại Giao§! hạn chế để tiếp xúc với các nhà lãnh đạo của §SHành Tinh§! này.\n\nSự hiện diện của chúng ta đã được công khai trên hành tinh này, do đó việc tiếp tục quan sát cũng không còn cần thiết nữa. §SNhiệm Vụ Quan Sát§! của chúng ta đã chính thức chấm dứt."
 tutorial.2500.name: "Hướng Dẫn: Trường Tàng Hình"
 tutorial.2500.desc: "Những đột phá gần đây trong lĩnh vực nghiên cứu thao tác trường lực đã giúp chúng ta phát minh ra §S$science_cloaking_components$§!. Những linh kiện tiêu thụ điện năng khổng lồ này có thể tạo ra các trường hạt được cải tiến, giúp các tàu khoa học và quân sự của chúng ta lẩn tránh được các hệ thống cảm biến thông thường.\n\nTuy nhiên, khi kích hoạt các trường tàng hình này, chúng sẽ gây ra những tác động tiêu cực đến §S$MOD_SHIP_BASE_SPEED_MULT$§!, §S$MOD_SHIP_WINDUP_MULT$§! và §S$MOD_SHIP_SHIELD_HP_ADD$§! của tàu.\n\nNhững con tàu §STàng Hình§! chưa bị phát hiện có thể dễ dàng lách qua những rào cản do việc §SĐóng Cửa Biên Giới§! gây ra.\nTrong trạng thái §STàng Hình§!, £science_ship£§STàu Khoa Học§! của chúng ta có thể thực hiện §STrinh Sát Chủ Động§! đối với £colony£§SThuộc Địa§! của các quốc gia khác, qua đó gia tăng lượng thông tin tình báo mà chúng ta thu thập được về các đế chế đó."
 tutorial.2550.name: "Hướng Dẫn: Máy Dò Tàng Hình"
 tutorial.2550.desc: "Những bước tiến mới nhất trong lĩnh vực nghiên cứu máy tính đã giúp chúng ta phát minh ra §S$sm_detection_array_plural$§!. Bằng cách lắp đặt những hệ thống cảm biến bên ngoài công suất cao này lên các §SCăn Cứ Sao§! của mình, chúng ta sẽ có khả năng phát hiện ra các hạm đội §STàng Hình§!.\n\nThông qua việc liên kết nhiều mảng cảm biến lại với nhau, chúng ta có thể gia tăng độ nhạy của §S$sm_detection_array_plural$§!, giúp chúng có thể đâm xuyên qua những §STrường Tàng Hình§! ngày càng kiên cố hơn.\n\nCùng với những nghiên cứu chuyên sâu hơn trong tương lai, chúng ta chắc chắn sẽ có thể ứng dụng £science_ship£§STàu Khoa Học§! để nâng cao hơn nữa khả năng dò tìm này. Phạm vi hoạt động của những thiết bị này sẽ bị giới hạn bởi §SPhạm Vi Thăm Dò§! của Căn Cứ Sao."
 #############################
 #Chuỗi Sự Kiện Hướng Dẫn
 #############################
 tutorial_survey_system_chain_title: "Hướng Dẫn: Chuyển Đổi Bản Đồ Thiên Hà"
 tutorial_survey_system_chain_desc: "Trước khi bắt tay vào khám phá dải ngân hà, chúng ta cần phải mở rộng tầm nhìn của mình. Thật may mắn, chúng ta đang sở hữu một §SBản Đồ Thiên Hà§! vô cùng phức tạp và chi tiết. Để mở Bản Đồ Thiên Hà, ngài có thể nhấn phím §SM§! hoặc nhấp vào nút Thiên Hà nằm ở phía dưới màn hình. Sau đó, ngài có thể nhấn phím §SEsc§! hoặc nhấp vào nút ở góc trên bên phải để đóng Nhật Ký Tình Hình."
 map_toggled: "Đã chuyển đổi bản đồ"
 tutorial_survey_system_tooltip: "§SHướng Dẫn: Chuyển Đổi Bản Đồ Thiên Hà§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_1_chain_title: "Hướng Dẫn: Khảo Sát Hệ Sao Mẹ"
 tutorial_1_chain_desc: "Trước tiên, hãy chọn £science_ship£§STàu Khoa Học§! của chúng ta. Ngài có thể nhấp trực tiếp vào biểu tượng §STàu§! trên §HBản Đồ Thiên Hà§! hoặc chọn nó từ menu §STổng Quan§!.\n\nSau đó, trong khi đang xem §SBản Đồ Thiên Hà§!, hãy nhấp vào nút §SKhảo Sát§! trên giao diện hạm đội ở góc dưới bên trái, và chọn một £system£§SHệ Sao§! chưa từng được khảo sát. Ngài cũng có thể nhấp chuột phải vào một Hệ Sao chưa được khảo sát rồi chọn §SKhảo Sát Hệ Sao§!.\n\n§STàu Khoa Học§! của chúng ta sẽ tự động tiến hành khảo sát tất cả các thiên thể nằm bên trong Hệ Sao đó."
 tutorial_unpause_chain_tooltip: "§SHướng Dẫn: Bỏ Tạm Dừng§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_unpause_chain_title: "Hướng Dẫn: Bỏ Tạm Dừng"
 tutorial_unpause_chain_desc: "Khi £science_ship£§STàu Khoa Học§! đã trong tư thế sẵn sàng để khám phá hệ sao, việc ngài cần làm bây giờ chỉ là bỏ tạm dừng. Rất đơn giản, ngài chỉ cần nhấn phím §SPhím Cách§! £space£ hoặc nhấp vào nút dưới đây trên thanh công cụ ở phía trên màn hình:\n\n$tttt$$tttt$$t$£pause_button£\n"
 unpaused_game: "Hủy bỏ Tạm dừng Mô phỏng"
 system_surveyed: "Khảo Sát Hệ Sao Lân Cận Hoàn Tất"
 tutorial_1_tooltip: "§SHướng Dẫn: Khảo Sát Hệ Sao Mẹ§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_2_chain_title: "Hướng Dẫn: Nghiên Cứu Công Nghệ"
 tutorial_2_chain_desc: "Chúng ta cần phải tiến hành nghiên cứu các công nghệ mới. §SGiao Thức Thế Giới Mới§! sẽ cho phép chúng ta chế tạo £colony_ship£§STàu Thuộc Địa§!, và nếu muốn mở rộng lãnh thổ của đế chế, chúng ta nên bắt tay vào nghiên cứu nó càng sớm càng tốt.\n\nNhấp vào nút nằm ở góc ngoài cùng bên trái của giao diện phía trên hoặc nhấn phím §SF4§! để mở giao diện §SCông Nghệ§!. Sau đó nhấp vào §SChọn Nghiên Cứu§! và chọn một công nghệ từ danh sách để làm mục tiêu nghiên cứu."
 tech_1_researched: "Nghiên cứu Giao Thức Thế Giới Mới Hoàn Tất"
 tech_2_researched: "Nghiên cứu Kiến Trúc Ngoài Hành Tinh Hoàn Tất"
 tutorial_2_tooltip: "§SHướng Dẫn: Nghiên Cứu Công Nghệ§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_3_chain_title: "Hướng Dẫn: [GetBuildGrowCap] Tàu Công Trình"
 tutorial_3_chain_desc: "Nếu ngài muốn khai thác những tài nguyên được phát hiện bởi £science_ship£§STàu Khoa Học§!, ngài sẽ cần phải phái một chiếc £construction_ship£§STàu Công Trình§! đến đó để thực thi nhiệm vụ.\n\nNhấp vào Căn Cứ Sao rồi chọn giao diện §SỤ Tàu§!. Tiếp đó, chọn §STàu Công Trình§! từ danh sách các tùy chọn có sẵn.\n\nHãy nhớ rằng ngài cần phải có đủ £alloys£§SHợp Kim§! thì mới có thể bắt đầu quá trình chế tạo các chiếc §STàu§! này."
 construction_ship_built: "Tàu Công Trình Chế Tạo Hoàn Tất"
 tutorial_3_tooltip: "§SHướng Dẫn: [GetBuildGrowCap] Tàu Công Trình§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_4_chain_title: "Hướng Dẫn: [GetBuildGrowCap] Trạm Khai Thác"
 tutorial_4_chain_desc: "Để có thể khai thác các mỏ £minerals£§SKhoáng Sản§! hoặc §STài Nguyên Chiến Lược§! trên một £planet£§SHành Tinh§!, chúng ta cần phải xây dựng một £mining_station£§STrạm Khai Thác§! trên quỹ đạo của nó. Để thực hiện điều này, ngài cần phải chọn một chiếc £construction_ship£§STàu Công Trình§!, ngài có thể nhấp trực tiếp vào Tàu Công Trình đó hoặc chọn nó từ menu §STổng Quan§!.\n\nSau khi đã chọn, hãy nhấp vào nút §S[GetBuildGrowCap] Trạm Khai Thác§! trên giao diện hạm đội của Tàu Công Trình, sau đó nhấp vào một Hành Tinh hoặc tiểu hành tinh khả dụng đang chứa mỏ tài nguyên.\n\nHãy nhớ rằng, việc xây dựng một £mining_station£§STrạm Khai Thác§! sẽ tiêu tốn một lượng tài nguyên £minerals£§SKhoáng Sản§! nhất định, vì vậy trước khi tiến hành xây dựng, ngài phải luôn đảm bảo rằng mình đang sở hữu đủ lượng khoáng sản cần thiết."
 mining_station_built: "Trạm Khai Thác Xây Dựng Hoàn Tất"
 tutorial_4_tooltip: "§SHướng Dẫn: [GetBuildGrowCap] Trạm Khai Thác§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_5_chain_title: "Hướng Dẫn: [GetBuildGrowCap] Trạm Nghiên Cứu"
 tutorial_5_chain_desc: "Nhằm đẩy nhanh tốc độ nghiên cứu các công nghệ mới của chúng ta, xin ngài hãy xây dựng các £science_ship£§STrạm Nghiên Cứu§! trên những hành tinh đang sở hữu nguồn tài nguyên £physics£§SVật Lý Học§!, £society£§SXã Hội Học§! hoặc £engineering£§SKỹ Thuật Học§!.\n\nPhương thức hoạt động của Trạm Nghiên Cứu cũng tương tự như £mining_station£§STrạm Khai Thác§!, điểm khác biệt duy nhất nằm ở loại tài nguyên mà chúng thu thập. Trạm Nghiên Cứu không thể thu thập £strategic_resource£§STài Nguyên Chiến Lược§! và £minerals£§SKhoáng Sản§!.\n\nĐể xây dựng một Trạm Nghiên Cứu, ngài cần chọn một chiếc £construction_ship£§STàu Công Trình§!, nhấp vào nút §S[GetBuildGrowCap] Trạm Nghiên Cứu§! trên giao diện hạm đội, sau đó nhấp vào một £planet£§SHành Tinh§!, tiểu hành tinh hoặc ngôi sao đang chứa nguồn tài nguyên Vật Lý Học, Xã Hội Học hoặc Kỹ Thuật Học."
 research_station_built: "Trạm Nghiên Cứu Xây Dựng Hoàn Tất"
 tutorial_5_tooltip: "§SHướng Dẫn: [GetBuildGrowCap] Trạm Nghiên Cứu§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_6_chain_title: "Hướng Dẫn: Kiến Trúc Hành Tinh"
 tutorial_6_chain_desc: "Hành tinh mẹ của chúng ta hiện đã có một vài £building£§SKiến Trúc§!, nhưng chúng ta vẫn cần phải tiếp tục tiến hành xây dựng thêm.\n\nĐể hoàn thành nhiệm vụ này, trước tiên ngài hãy nhấp vào hành tinh mẹ của chúng ta trong menu §STổng Quan§!, rồi nhấp chọn thẻ §SBề Mặt§!. Tiếp theo, hãy nhấp vào một ô công trình trống bên trong một đặc khu bất kỳ, và chọn một kiến trúc từ danh sách các kiến trúc có sẵn. Chỉ cần chúng ta có đủ §STài Nguyên§!, quá trình xây dựng sẽ lập tức được bắt đầu.\n\nCác kiến trúc sẽ cung cấp £job£§SVị Trí Công Việc§!, nhưng chúng sẽ không tạo ra bất kỳ sản lượng nào cho đến khi có £pops£§SDân Số§! được phân công vào làm việc tại đó. Ngài có thể kiểm tra xem §SDân Số§! của mình đang đảm nhận những vị trí công việc nào tại thẻ §SKinh Tế§!."
 building_constructed: "Kiến Trúc Xây Dựng Hoàn Tất"
 tutorial_6_tooltip: "§SHướng Dẫn: Kiến Trúc Hành Tinh§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_7_chain_title: "Hướng Dẫn: Dọn Dẹp Chướng Ngại Vật"
 tutorial_7_chain_desc: "Một vài =£blocker£§SChướng Ngại Vật§! tồn tại trên hành tinh mẹ của chúng ta đang cản trở việc tiếp tục khai thác các §SPhân Khu§!, và chúng cần phải bị xóa sổ. Việc này sẽ tiêu tốn một lượng §STài Nguyên§! nhất định.\n\nĐể dọn dẹp §SChướng Ngại Vật§!, hãy tìm đến chướng ngại vật đó trong thẻ §SQuản Lý§!, sau đó nhấp vào nút §SDọn Dẹp Chướng Ngại Vật§! nằm phía trên nó.\n\n\n$tttt$$tttt$$tt$£clear_blocker£\n\n\nChi phí và thời gian cần thiết để dọn dẹp các §SChướng Ngại Vật§! khác nhau cũng sẽ có sự khác biệt."
 blockers_cleared: "Chướng Ngại Vật Đã Được Dọn Dẹp"
 tutorial_7_tooltip: "§SHướng Dẫn: Đặc Tính Chướng Ngại Vật§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_8_chain_title: "Hướng Dẫn: Khảo Sát Hệ Sao"
 tutorial_8_chain_desc: "Chúng ta cần mở rộng đế chế ra ngoài £system£§SHệ Sao Mẹ§!. Bước đầu tiên là khảo sát các hệ sao lân cận.\n\nĐể tiến hành khám phá, hãy chọn £science_ship£§STàu Khoa Học§! của bạn, nhấp vào nút §SKhảo Sát§! trên giao diện hạm đội, sau đó nhấp vào nút §SMở Bản Đồ Thiên Hà§! ở góc dưới màn hình và chọn một hệ sao lân cận. §STàu Khoa Học§! sẽ tự động di chuyển đến đó và khảo sát toàn bộ các thiên thể bên trong."
 tutorial_8_poi: "Mục Tiêu Khảo Sát"
 tutorial_8_poi_desc: "Khảo sát các hệ sao §S[survey_target_1.GetName]§!, §S[survey_target_2.GetName]§! và §S[survey_target_3.GetName]§!."
 systems_surveyed: "Khảo Sát Hệ Sao Hoàn Tất"
 tutorial_8_tooltip: "§SHướng Dẫn: Khảo Sát Hệ Sao§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_9_chain_title: "Hướng Dẫn: [GetBuildGrowCap] Tàu Khoa Học"
 tutorial_9_chain_desc: "Chúng ta nên cân nhắc việc [GetBuildingGrowing] chiếc £science_ship£§STàu Khoa Học§! thứ hai để đẩy nhanh tiến độ khám phá dải ngân hà.\n\nNhấp vào Căn Cứ Sao và chọn thẻ §SỤ Tàu§!. Tiếp theo, chọn §STàu Khoa Học§! từ các tùy chọn có sẵn.\n\nHãy nhớ rằng bạn cần có đủ £alloys£§SHợp Kim§! mới có thể bắt đầu chế tạo §STàu§! này."
 science_ship_built: "Tàu Khoa Học Chế Tạo Hoàn Tất"
 tutorial_9_tooltip: "§SHướng Dẫn: [GetBuildGrowCap] Tàu Khoa Học Thứ Hai§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_10_chain_title: "Hướng Dẫn: Chiêu Mộ Giám Đốc Khoa Học"
 tutorial_10_chain_desc: "Chúng ta có lẽ nên xem xét việc thuê một £scientist£§SGiám Đốc Khoa Học§! mới để chỉ huy chiếc £science_ship£§STàu Khoa Học§! vừa được chế tạo. Dù tàu khoa học vẫn có thể tiếp tục khám phá mà không cần nhà khoa học, nhưng khi thiếu đi sự dẫn dắt của họ, con tàu sẽ không thể phát hiện ra các §SHiện Tượng Dị Thường§!.\n\nChọn tàu khoa học mới của chúng ta, nhấp vào §SChỉ Định Lãnh Đạo§!. Giao diện §SLãnh Đạo§! sẽ mở ra, hiển thị tất cả các nhà khoa học đang phục vụ cho chúng ta. Nhấp vào nút §SChiêu Mộ§! ở đầu danh sách.\n\nChọn nhà khoa học mà bạn muốn, sau đó nhấp vào nút §SChiêu Mộ§!. Việc chiêu mộ lãnh đạo sẽ tiêu tốn £unity£§SĐoàn Kết§!, hãy đảm bảo bạn đã tích trữ đủ.\n\nSau khi chiêu mộ xong, nhà khoa học mới sẽ chờ lệnh trên hành tinh mẹ."
 scientist_assigned: "Giám Đốc Khoa Học Đã Được Bổ Nhiệm"
 tutorial_10_tooltip: "§SHướng Dẫn: Chiêu Mộ Giám Đốc Khoa Học§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_11_chain_title: "Hướng Dẫn: [GetBuildGrowCap] Tàu Thuộc Địa"
 tutorial_11_chain_desc: "Đã đến lúc thuộc địa hóa một hành tinh khác. Trước tiên chúng ta phải [GetBuildGrow] một chiếc £colony_ship£§STàu Thuộc Địa§!. Việc [GetBuildGrow] loại §STàu§! này đòi hỏi rất nhiều thời gian, cùng một lượng lớn £alloys£§SHợp Kim§!, £food£§SThực Phẩm§! và £consumer_goods£§SHàng Tiêu Dùng§!, nhưng phần thưởng mà một £colony£§SThuộc Địa§! thịnh vượng mang lại sẽ vượt xa khoản đầu tư này.\n\nNhấp vào §SCăn Cứ Sao§! của bạn, mở thẻ §SỤ Tàu§!. Sau đó nhấp chọn §STàu Thuộc Địa§! từ các tùy chọn.\n\nXin lưu ý, trước khi quá trình chế tạo bắt đầu, bạn phải tích lũy đủ số tài nguyên cần thiết."
 colony_ship_built: "Tàu Thuộc Địa Chế Tạo Hoàn Tất"
 tutorial_11_tooltip: "§SHướng Dẫn: [GetBuildGrowCap] Tàu Thuộc Địa§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_12_chain_title: "Hướng Dẫn: Thiết Lập Thuộc Địa"
 tutorial_12_chain_desc: "Bây giờ chúng ta nên sử dụng chiếc £colony_ship£§STàu Thuộc Địa§! vừa mới chế tạo để thiết lập £colony£§SThuộc Địa§! đầu tiên. Ứng cử viên lý tưởng nhất là một hành tinh có cùng loại hình với hành tinh mẹ của chúng ta, như vậy những người đi khai hoang sẽ không gặp bất kỳ khó khăn nào trong việc thích nghi với môi trường.\n\nĐể thuộc địa hóa một £planet£§SHành Tinh§!, nhấp vào §STàu Thuộc Địa§! của bạn, hoặc chọn nó trong §SCửa Sổ Tổng Quan§!. Sau đó nhấp vào nút §SThuộc Địa Hóa§! trên giao diện hạm đội, và chọn hành tinh bạn muốn thuộc địa hóa. Lưu ý rằng bạn chỉ có thể thuộc địa hóa trên những hành tinh đã được khảo sát và không có §SĐiểm Dị Thường§!. Hành tinh đó cũng phải nằm trong lãnh thổ của bạn. Dù bạn có thể chọn thuộc địa hóa trên một hành tinh có độ phù hợp thấp, nhưng cái giá phải trả sẽ vô cùng đắt đỏ."
 colony_established: "Thuộc Địa Thiết Lập Hoàn Tất"
 tutorial_12_tooltip: "§SHướng Dẫn: Thiết Lập Thuộc Địa§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_13_chain_title: "Hướng Dẫn: Chiêu Mộ Thống Đốc"
 tutorial_13_chain_desc: "Chúng ta cần chiêu mộ một §SThống Đốc Hành Tinh§! để quản lý £colony£§SThuộc Địa§! mới. Để tiến hành chiêu mộ, nhấp vào thuộc địa, vào thẻ §STổng Quan Hành Tinh§!, nhấp vào nút §SThay Đổi§! trong cửa sổ §SThống Đốc§!. Lúc này một cửa sổ §SLãnh Đạo§! sẽ mở ra, hiển thị vị thống đốc hiện đang làm việc cho chúng ta.\n\nNhấp vào nút §SChiêu Mộ§! ở phía trên màn hình, chọn một thống đốc đang có sẵn. Lưu ý, việc chiêu mộ lãnh đạo sẽ tiêu tốn £unity £§SĐoàn Kết§!. Nếu không đủ dự trữ, bạn sẽ phải đợi cho đến khi thu thập đủ mới có thể tiến hành chiêu mộ.\n\nSau khi chiêu mộ xong, thống đốc mới sẽ chờ lệnh trên hành tinh mẹ."
 governor_recruited: "Thống Đốc Chiêu Mộ Hoàn Tất"
 tutorial_13_tooltip: "§SNhật Ký Hướng Dẫn: Chiêu Mộ Thống Đốc§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_14_chain_title: "Hướng Dẫn: Thiết Lập Thêm Nhiều Thuộc Địa"
 tutorial_14_chain_desc: "Tiếp tục mở rộng đế chế của chúng ta bằng cách thiết lập các £colony£§SThuộc Địa§!. Khi đã có nguồn cung cấp dồi dào về £alloys£§SHợp Kim§!, £food£§SThực Phẩm§! và £consumer_goods£§SHàng Tiêu Dùng§!, hãy [GetBuildGrowCap] thêm nhiều £colony_ship£§STàu Thuộc Địa§! hơn nữa, và để chúng đi thiết lập thêm nhiều thuộc địa.\n\nHãy cẩn thận, đừng thiết lập quá nhiều thuộc địa cùng một lúc trong giai đoạn phát triển, vì chúng sẽ liên tục tiêu thụ £energy£§SNăng Lượng§! cho đến khi có thể tự cung tự cấp."
 colonies_established: "Thuộc Địa Xây Dựng Hoàn Tất"
 tutorial_14_tooltip: "§SHướng Dẫn: Thiết Lập Thêm Nhiều Thuộc Địa§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_15_chain_title: "Hướng Dẫn: Sản Xuất Tài Nguyên"
 tutorial_15_chain_desc: "Nền công nghiệp đang trên đà phát triển của chúng ta luôn đói khát nguyên liệu thô, vì vậy chúng ta bắt buộc phải gia tăng sản lượng £minerals£§SKhoáng Sản§!. Chúng ta có thể [GetBuildingGrowing] £mining_station£§STrạm Khai Thác§! trên các £planet£§SHành Tinh§! và tiểu hành tinh có mỏ khoáng sản, hoặc xây dựng §SPhân Khu Khai Khoáng§! trên bề mặt của một hành tinh đã được thuộc địa hóa.\n\nTrạm không gian và £building£§SCông Trình§! đều cần £energy£§SNăng Lượng§! để bảo trì, do đó chúng ta cũng cần phải đảm bảo nguồn cung dồi dào cho loại tài nguyên này. Năng lượng được sản xuất bởi §SPhân Khu Năng Lượng§! trên các hành tinh đã thuộc địa hóa, hoặc cũng có thể được tạo ra bằng cách xây dựng §STrạm Khai Thác§! trên các hành tinh, tiểu hành tinh và ngôi sao có trữ lượng năng lượng."
 mineral_income: "Thu nhập Khoáng sản hàng tháng +30"
 credit_income: "Thu nhập Năng lượng hàng tháng +10"
 tutorial_15_tooltip: "§SHướng Dẫn: Sản Xuất Tài Nguyên§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_16_chain_title: "Hướng Dẫn: Mở Rộng Hạm Đội"
 tutorial_16_chain_desc: "Chúng ta phải [GetBuildGrow] một hạm đội không gian hùng mạnh để đảm bảo sự an toàn cho [Root.GetName].\n\nHiện tại, chúng ta cần [GetBuildGrowCap] thêm vài chiếc §STàu Hộ Tống§!. Khi đã dự trữ đủ §SHợp Kim§!, chúng ta có thể tiến hành chế tạo tại §SCăn Cứ Sao§!. Tàu chiến mới chế tạo sẽ tự động sáp nhập vào hạm đội đang neo đậu trên quỹ đạo của §SCăn Cứ Sao§! nơi nó được chế tạo.\n\nĐể tối đa hóa sức mạnh chiến đấu của hạm đội, chúng ta có thể chỉ định một §STư Lệnh Hạm Đội§! cho nó. Điều này sẽ giúp hạm đội chiếm ưu thế khi đối đầu với những hạm đội không được chỉ huy bởi một £commander£§SChỉ Huy§!."
 corvettes_built: "Tàu Hộ Tống Chế Tạo Hoàn Tất"
 admiral_assigned: "Chỉ Huy Đã Được Bổ Nhiệm"
 tutorial_16_tooltip: "§SHướng Dẫn: Mở Rộng Hạm Đội§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_17_chain_title: "Hướng Dẫn: Thiết Lập Tinh Khu"
 tutorial_17_chain_desc: "Số lượng £planet£§SHành Tinh§! mà bạn có thể trực tiếp kiểm soát là có giới hạn. Giới hạn này được hiển thị ở phía trên màn hình, và việc vượt quá giới hạn sẽ mang lại những hậu quả tiêu cực. §STinh Khu§! là những khu vực bán tự trị và sẽ tự động quản lý các hành tinh trực thuộc. Để tạo một tinh khu mới, hãy nhấp vào menu thả xuống ở đầu màn hình, hoặc nhấn §SF5§! để truy cập giao diện §SHành Tinh và Tinh Khu§!. Sau đó nhấp vào nút §STạo Tinh Khu Mới§! ở góc trên bên phải.\n\nBạn sẽ bước vào §SChế Độ Quản Lý Tinh Khu§!. Tại đây, bạn có thể quyết định xem tinh khu mới sẽ bao gồm những £system£§SHệ Sao§! nào. Tất cả các hành tinh trong những hệ sao này sẽ được đặt dưới quyền tài phán của tinh khu. Hãy chọn một hệ sao có £colony£§SThuộc Địa§! của chúng ta, sau đó nhấp vào nút §SHoàn Tất§!. Bạn đã thiết lập thành công tinh khu đầu tiên của chúng ta!"
 sector_established: "Tinh Khu Thiết Lập Hoàn Tất"
 tutorial_17_tooltip: "§SHướng Dẫn: Thiết Lập Tinh Khu§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_18_chain_title: "Hướng Dẫn: Thống Đốc"
 tutorial_18_chain_desc: "Chúng ta nên chỉ định một §SThống Đốc§! để quản lý §STinh Khu§! mới. Tất cả các £planet£§SHành Tinh§! trong tinh khu sẽ được hưởng lợi từ cấp độ năng lực và các đặc tính của thống đốc."
 sector_governor_assigned: "Thống Đốc Tinh Khu"
 tutorial_18_tooltip: "§SHướng Dẫn: Thống Đốc§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_19_chain_title: "Hướng Dẫn: Thiết Kế Tàu"
 tutorial_19_chain_desc: "Để thiết kế một mẫu tàu mới, hãy mở §SQuản Lý Hạm Đội§! trên thanh công cụ bên trái hoặc nhấn §SF9§!, sau đó nhấp để mở §SThiết Kế Tàu§!. Nhấp vào nút §SThiết Kế Mới§!, và khi chọn §SKích Cỡ Tàu§!, hãy chọn §STàu Hộ Tống§!. Nhấp vào nút §SKhông Có Phân Đoạn§! để chọn một §SPhân Đoạn§! cho thiết kế này.\n\nTàu hộ tống là loại tàu chiến nhỏ nhất, nó chỉ có một phân đoạn. Các loại tàu lớn hơn sẽ có nhiều phân đoạn hơn. Loại phân đoạn sẽ quyết định các khe cắm §SVũ Khí§! và §SĐa Dụng§!. Sau khi chọn một phân đoạn, hãy lấp đầy nó bằng các phụ tùng khác nhau, và nhớ đảm bảo nguồn cung cấp năng lượng đầy đủ.\n\nBạn có thể đơn giản hóa quy trình này bằng cách nhấp vào §STự Động Lắp Ráp§! để hệ thống tự động hoàn thiện thiết kế."
 ships_designed: "Thiết Kế Tàu"
 tutorial_19_tooltip: "§SHướng Dẫn: Thiết Kế Tàu§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_20_chain_title: "Hướng Dẫn: Trạm Quan Sát"
 tutorial_20_chain_desc: "Chúng ta nên [GetBuildGrow] một §STrạm Quan Sát§! trên quỹ đạo hành tinh mẹ của một §SXã Hội [Owner.GetPreFTLUpper]§!. Những trạm không gian này có thể thực hiện nhiều §SNhiệm Vụ§! khác nhau, và loại nhiệm vụ sẽ phụ thuộc vào cách chúng ta muốn tác động đến những nền văn minh đang phát triển này.\n\nPhương thức xây dựng trạm quan sát cũng giống hệt như £mining_station£§STrạm Khai Thác§! và £science_ship£§STrạm Nghiên Cứu§!, nhưng nó chỉ có thể được xây dựng phía trên hành tinh mẹ của nền văn minh [Owner.GetPreFTLUpper]. Chỉ cần chọn một chiếc £construction_ship£§STàu Công Trình§!, sau đó nhấp vào §S[GetBuildGrowCap]Trạm Quan Sát§! trên giao diện hạm đội.\n\nTiếp theo, hãy chọn hành tinh mẹ của nền văn minh [Owner.GetPreFTLUpperPlural] mà bạn muốn nghiên cứu, tàu công trình sẽ tự động bắt tay vào việc xây dựng."
 observation_post_built: "Trạm Quan Sát Xây Dựng Hoàn Tất"
 tutorial_20_tooltip: "§SHướng Dẫn: Trạm Quan Sát§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_21_chain_title: "Hướng Dẫn: Tài Nguyên Chiến Lược"
 tutorial_21_chain_desc: "Chúng ta nên [GetBuildGrow] một £mining_station£§STrạm Khai Thác§! trên quỹ đạo của một thiên thể chứa £strategic_resource£§STài Nguyên Chiến Lược§!. Những nguyên liệu thô hiếm có này mang một giá trị chiến lược khổng lồ.\n\nSau khi tìm thấy loại tài nguyên này thông qua quá trình §SKhảo Sát§!, hãy chọn một chiếc £construction_ship£§STàu Công Trình§!, sau đó chọn §S[GetBuildGrowCap]Trạm Khai Thác§!, rồi nhấp vào thiên thể tương ứng để tiến hành xây dựng."
 tutorial_21b_chain_title: "Thông Tin: Tài Nguyên Chiến Lược"
 tutorial_21b_chain_desc: "Chúng ta đã xây dựng một £mining_station£§STrạm Khai Thác§! trên quỹ đạo của một thiên thể sở hữu £strategic_resource£§STài Nguyên Chiến Lược§!. Những tài nguyên đòi hỏi các công nghệ tiên quyết mới có thể khai thác này sẽ mang lại giá trị chiến lược vô cùng to lớn, chúng ta phải luôn nỗ lực săn lùng chúng."
 strategic_resource_extracted: "Chiết Xuất Tài Nguyên Chiến Lược Hoàn Tất"
 tutorial_21_tooltip: "§SHướng Dẫn: Tài Nguyên Chiến Lược§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_22_chain_title: "Hướng Dẫn: Nâng Tầm Sinh Vật Chưa Khai Trí"
 tutorial_22_chain_desc: "Chúng ta nên tiến hành §SNâng Tầm§! một giống loài hạ đẳng, nhưng trước tiên chúng ta cần phải nghiên cứu công nghệ §SCơ Chế Biểu Hiện Gen§!.\n\nĐể §SNâng Tầm§! một giống loài chưa được khai trí, bạn có thể truy cập vào giao diện §SGiống Loài§! và chọn giống loài đó, sau đó nhấp vào nút Nâng Tầm."
 tutorial_22_tooltip: "§SHướng Dẫn: Nâng Tầm Giống Loài Chưa Khai Trí§! đã được thêm vào Nhật Ký Tình Hình"
 species_uplifted: "Giống Loài Chưa Khai Trí Đã Được Nâng Tầm"
 tutorial_23_chain_title: "Hướng Dẫn: Cuộc Chạm Trán Đầu Tiên"
 tutorial_23_chain_desc: "Chúng ta đã bắt gặp một thực thể bí ẩn giữa không gian vũ trụ tối tăm mờ mịt, tốt nhất là chúng ta nên cố gắng §SThiết Lập Liên Lạc§!.\n\nBạn có thể thực hiện việc này bằng cách chọn dự án §SCuộc Chạm Trán Đầu Tiên§! tương ứng trong §SNhật Ký Tình Hình§!, nhấp vào nút §SHiển Thị Cuộc Chạm Trán Đầu Tiên§!, hoặc nhấp trực tiếp vào biểu tượng §SCuộc Chạm Trán Đầu Tiên§! trên §SBản Đồ Thiên Hà§! để truy cập.\n\n\n$tttt$$tttt$$ttt$£firstcontact£\n"
 contact_made: "Tiếp Xúc Hoàn Tất"
 tutorial_23_tooltip: "§SHướng Dẫn: Cuộc Chạm Trán Đầu Tiên§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_24_chain_title: "Hướng Dẫn: Chỉnh Sửa Giống Loài"
 tutorial_24_chain_desc: "Chúng ta có thể §SChỉnh Sửa§! bất kỳ giống loài đã được khai trí nào cư trú trong đế chế của chúng ta, miễn là họ sở hữu đủ §SĐiểm Đặc Tính§!.\n\nThông qua menu §SChỉnh Sửa§! trên giao diện §SGiống Loài§!, sau đó nghiên cứu §SDự Án Đặc Biệt§!. Dự án này đòi hỏi £society£§SNghiên Cứu Xã Hội Học§!, và khi thực thi dự án, tiến trình nghiên cứu xã hội học đang diễn ra sẽ bị tạm dừng."
 species_modified: "Giống Loài Đã Được Chỉnh Sửa"
 tutorial_24_tooltip: "§SHướng Dẫn: Chỉnh Sửa Giống Loài§! đã được thêm vào Nhật Ký Tình Hình"
 tutorial_25_chain_title: "Hướng Dẫn: Tuyên Bố Chủ Quyền Hệ Sao"
 tutorial_25_chain_desc: "Chúng ta có thể mở rộng lãnh thổ của mình bằng cách [GetBuildingGrowing] §SCăn Cứ Sao§! trên quỹ đạo của các hành tinh ngoài hệ mặt trời. Sự hiện diện của những tiền đồn này là lời khẳng định quyền kiểm soát của chúng ta đối với ngôi sao đó và khu vực £system£§SHệ Sao§! xung quanh, đồng nghĩa với việc chúng ta có quyền khai thác tài nguyên tại đó, đồng thời cấm cửa bất kỳ chủng tộc ngoại lai nào đã từng tiếp xúc xâm nhập một cách tự tiện.\n\nChọn một chiếc £construction_ship£§STàu Công Trình§!, nhấp vào §S[GetBuildGrowCap]Căn Cứ Sao§! trên giao diện hạm đội, sau đó nhấp chuột trái vào một ngôi sao. Hoặc bạn cũng có thể nhấp chuột phải vào ngôi sao đó rồi nhấp vào §S[GetBuildGrowCap]Căn Cứ Sao§!.\n\nKhác với các trạm quỹ đạo khác, §SCăn Cứ Sao§! có thể được xây dựng ngay bên ngoài ranh giới lãnh thổ của chúng ta."
 frontier_outpost_built: "Tiền Đồn Biên Giới Xây Dựng Hoàn Tất"
 tutorial_25_tooltip: "§SHướng Dẫn: Căn Cứ Sao§! đã được thêm vào Nhật Ký Tình Hình"
 TUTORIAL_PLANETVIEW_MANAGEMENT_TITLE: "Hướng Dẫn: Quản Lý"
 TUTORIAL_PLANETVIEW_MANAGEMENT_DESC: "Thẻ §SQuản Lý§! phô bày những thông tin cốt lõi về trạng thái và sơ đồ quy hoạch của £planet£§SHành Tinh§!.\n\nKhu vực §SĐặc Tính Hành Tinh§! sẽ hiển thị các £blocker£§SChướng Ngại Vật§! tự nhiên có thể dọn dẹp cũng như những §SĐặc Tính§! hiện hữu trên hành tinh.\n\nKhu vực §SDân Số Hiện Tại§! liệt kê toàn bộ £pops£§SDân Số§! đang sinh sống trên £planet£§SHành Tinh§!.\n\nBảng £sector£§STinh Khu§! được sử dụng để tổ chức các hành tinh thành các §STinh Khu§!, giúp tự động hóa quá trình quản lý hành tinh.\n\nChức năng §SThăng Thiên Thuộc Địa§! cho phép nâng cấp các thuộc địa, giúp tối ưu hóa hiệu quả của §SHành Tinh§! miễn là bạn có đủ lượng tài nguyên cần thiết."
 TUTORIAL_DATABANK_TITLE: "Hướng Dẫn: Cơ Sở Dữ Liệu"
 TUTORIAL_DATABANK_DESC: "£databank£§SCơ Sở Dữ Liệu§! chính là cuốn cẩm nang vạn năng giúp bạn thấu hiểu tường tận mọi ngóc ngách của hệ thống trò chơi.\n\nCác mục trong đó được phân loại một cách khoa học, giúp bạn dễ dàng tra cứu các §SCơ Chế§!, tính năng hoặc khái niệm cụ thể vào bất cứ lúc nào.\n\nBạn có thể trực tiếp tìm kiếm hoặc chọn một chủ đề để tìm hiểu chi tiết."
 TUTORIAL_EMPIRE_FOCUS_TIMELINE_TITLE: "Hướng Dẫn: Trọng Tâm & Dòng Thời Gian"
 TUTORIAL_EMPIRE_FOCUS_TIMELINE_DESC: "Hệ thống £focus_core£§STrọng Tâm Đế Chế§! có thể dẫn dắt sự phát triển của đế chế thông qua việc thiết lập các nhiệm vụ ưu tiên; bao gồm £focus_exploration£§SKhám Phá§!, £focus_conquest£§SChinh Phục§!, và £focus_development£§SPhát Triển§!.\n\nMỗi trọng tâm sẽ bao gồm một tập hợp các thẻ nhiệm vụ, đóng vai trò như ngọn hải đăng soi sáng cho con đường mà bạn đã chọn. Việc hoàn thành các thẻ nhiệm vụ sẽ giúp bạn nhận được §SĐiểm Tiến Độ§! thuộc nhóm tương ứng.\n\nTrọng tâm hiện tại sẽ gia tăng xác suất rút được các nhiệm vụ liên quan. Bạn có thể tiêu thụ £unity£§SĐoàn Kết§! để rút lại thẻ, và trọng tâm cũng có thể được thay đổi.\n\nBạn có thể theo dõi các mục tiêu trong thẻ §SĐã Hoàn Thành§! và §STiến Độ§!, để xem còn bao xa nữa mới đạt đến cấp bậc phần thưởng tiếp theo.\n\n§SDòng Thời Gian§! tái hiện lại những cột mốc và sự kiện lịch sử trọng đại trong dòng chảy lịch sử của đế chế kể từ thời điểm §SKhởi Nguyên§!. Các mục mới sẽ dần dần xuất hiện khi những sự kiện này được kích hoạt."
 TUTORIAL_COLONIZATION_TITLE: "Hướng Dẫn: Thuộc Địa Hóa Hành Tinh"
 TUTORIAL_COLONIZATION_DESC: "Giao diện §SThuộc Địa Hóa§! là nơi để chuẩn bị hành trang cho việc thuộc địa hóa một hành tinh.\n\nBạn bắt buộc phải chọn ra một §SGiống Loài§! để đưa đến định cư trên hành tinh đó, đồng thời chỉ định §SLoại Hình Quy Hoạch Thuộc Địa§! để vạch ra mục tiêu phát triển cho nó.\n\nTại đây cũng sẽ hiển thị một cái nhìn tổng quan về các §SPhân Khu§! có sẵn, §SQuy Mô Hành Tinh§! cũng như những §SHiệu Ứng Điều Chỉnh§! có thể xảy ra, ngoài ra còn có các §SĐặc Tính Hành Tinh§! có khả năng gây ảnh hưởng đến hành tinh.\n\nViệc ưu tiên phát triển dựa trên tài nguyên thiên nhiên của §SHành Tinh§! có thể giúp bạn khai thác thuộc địa một cách tối ưu nhất."
