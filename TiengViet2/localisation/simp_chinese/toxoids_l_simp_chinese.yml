 ### Relentless Industrialists
 civic_relentless_industrialists: "Nhà Công Nghiệp Tàn Nhẫn"
 civic_relentless_industrialists_desc: "Sự sống là để khai thác. Nền văn minh này được xây dựng trên nguyên tắc \"tận dụng tối đa giá trị của sự sống\", nhằm mục đích vắt kiệt lợi ích từ từng gram vật chất, từng mảnh van nhỏ nhất có thể."
 civic_corporate_relentless_industrialists: "Giá Trị Cổ Phiếu"
 civic_corporate_relentless_industrialists_desc: "$civic_relentless_industrialists_desc$"
 civic_tooltip_relentless_industrialists_effects: "Có thể xây dựng £building£ §Y$building_coordinated_fulfillment_center_1$§!, giúp gia tăng đáng kể sản lượng £alloys£ §YHợp Kim§! và £consumer_goods£ §YHàng Tiêu Dùng§!, đổi lại làm giảm tốc độ £mod_logistic_growth_mult£§YTăng Trưởng Dân Số§!, đồng thời dần dần biến đổi hành tinh thành §YThế Giới Chết§!."
 civic_tooltip_corporate_relentless_industrialists_effects: "$civic_tooltip_relentless_industrialists_effects$\n£building£§Y$building_industrial_subsidiary$§!$megacorp_civic_branch_office_building_effect$"
 building_coordinated_fulfillment_center_1: "Trung Tâm Hậu Cần Phối Hợp"
 building_coordinated_fulfillment_center_1_plural: "Trung Tâm Hậu Cần Phối Hợp"
 building_coordinated_fulfillment_center_1_desc: "Mặc dù nhiều người coi những hoạt động bên trong cơ sở này là không an toàn, đầy rủi ro và thiển cận, nhưng không ai có thể phủ nhận mức tăng trưởng năng suất vượt bậc mà nó mang lại."
 building_coordinated_fulfillment_center_2: "Cơ Sở Điều Phối Năng Suất Hợp Nhất" #N.B. Corporate speak, doesn't need to mean anything...
 building_coordinated_fulfillment_center_2_desc: "Thông qua các phép tính không ngừng nghỉ và những đợt đánh giá hiệu suất thường xuyên, năng suất công nghiệp có thể được đẩy lên một tầm cao mới. Thậm chí nếu điều này khiến mọi người chẳng còn tâm trí đâu mà quan tâm đến những vấn đề khác, chẳng hạn như sinh sản và bảo vệ môi trường."
 building_coordinated_fulfillment_center_tooltip: "§RHành tinh này đang bị khai thác đến cạn kiệt. Cuối cùng, nó sẽ biến thành một Thế Giới Chết.§!"
 civic_tooltip_not_relentless_industrialists: "Không sở hữu Lý Tưởng Quốc Gia thuộc nhóm ['concept_industrialist_civics']"
 concept_industrialist_civics: "Nhà Công Nghiệp Tàn Nhẫn"
 concept_industrialist_civics_desc: "Nhóm Lý Tưởng Quốc Gia $concept_industrialist_civics$ bao gồm các lựa chọn sau\n—['civic:civic_relentless_industrialists']$NEW_LINE$—['civic:civic_corporate_relentless_industrialists']"
 toxoids.5.name: "[Root.GetName] Khai Thác Quá Mức"
 toxoids.5.desc: "Sự khai thác cạn kiệt của chúng ta trên [Root.GetName] đã gây ra những thay đổi rõ rệt, thậm chí là không thể đảo ngược, đối với môi trường. Ô nhiễm công nghiệp đã châm ngòi cho hiệu ứng nhà kính mất kiểm soát, dẫn đến những tàn phá khủng khiếp đối với khí hậu. Sự rò rỉ các chất phóng xạ đã biến những khu vực rộng lớn trên [Root.GetPlanetMoon] trở nên hoàn toàn không thể ở được.\n\nSự thay đổi này đã đến một thời điểm then chốt, trừ khi chúng ta thay đổi phương pháp khai thác, giảm bớt tác động lên môi trường hành tinh, nếu không chúng ta sẽ phải đối mặt với một thảm họa tàn khốc. Những gì còn lại sẽ chỉ là một hành tinh đầy rẫy phóng xạ, không thể sinh sống, với những vùng biển cuộn sóng và những vùng đất chết khô cằn, y như những lời cảnh báo rùng rợn nhất từ những kẻ tiên tri ngày tận thế."
 relentless_industrialists_situation: "[Target.GetName] Suy Thoái Môi Trường"
 relentless_industrialists_situation_type: "Suy Thoái Môi Trường"
 relentless_industrialists_situation_desc: "Nếu không có bất kỳ hành động nào được thực hiện, sự khai thác cạn kiệt của chúng ta sẽ biến [Target.GetName] thành một Thế Giới Chết. Chúng ta phải quyết định lập trường của mình trong vấn đề này: Liệu chúng ta có nên thay đổi phương thức hoạt động, hay xem tình trạng hiện tại là một cái giá có thể chấp nhận được — thậm chí là được mong đợi — trong quá trình công nghiệp hóa?"
 relentless_industrialists_situation_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$\nNgoài ra, việc cải tổ chính phủ, gỡ bỏ Lý Tưởng Quốc Gia §Y$civic_relentless_industrialists$§! sẽ hủy bỏ tình hình này."
 approach_take_no_action: "Không Hành Động Gì"
 approach_climate_do_nothing_tooltip: "Hành tinh này sẽ bị biến thành một §YThế Giới Chết§!. Từ nay về sau, §Y$building_coordinated_fulfillment_center_1_plural$§! của chúng ta sẽ mang lại những hiệu quả mạnh mẽ hơn."
 approach_cleanup_efforts: "Bắt Đầu Công Tác Khắc Phục"
 approach_climate_cleanup_efforts_tooltip: "Hành tinh này sẽ không biến thành một §YThế Giới Chết§!. Tuy nhiên, §Y$building_coordinated_fulfillment_center_1_plural$§! của chúng ta giờ đây sẽ yêu cầu một khoản phí duy trì bằng £unity£ §YĐoàn Kết§! vô cùng lớn."
 approach_embrace_change: "Chấp Nhận Thay Đổi"
 approach_climate_embrace_change_tooltip: "Chúng ta sẽ nghiên cứu tiến trình này và học cách biến đổi an toàn hành tinh thành một §YThế Giới Chết§!. Mức phạt tăng trưởng dân số do §Y$building_coordinated_fulfillment_center_1_plural$§! của chúng ta gây ra sẽ giảm đi, và các tùy chọn §YCải Tạo Môi Trường§! tương ứng sẽ được mở khóa."
 approach_become_environmentalist: "Trở Thành Nhà Bảo Vệ Môi Trường"
 stage_cleanup: "Công Tác Khắc Phục"
 stage_cataclysm_1: "Biến Đổi Môi Trường"
 stage_cataclysm_2: "Thảm Họa Không Thể Đảo Ngược"
 relentless_industrialists_situation_cleanup_tooltip: "Hành tinh của chúng ta không còn đối mặt với nguy cơ trở thành một §YThế Giới Chết§! nữa.\n§Y$building_coordinated_fulfillment_center_1_plural$§! của chúng ta sẽ yêu cầu một khoản phí duy trì khổng lồ bằng £unity£ §YĐoàn Kết§!."
 relentless_industrialists_situation_completion_tooltip: "§Y[Target.GetName]§! sẽ biến thành một §YThế Giới Chết§!.\nTùy thuộc vào §Yphương án đối phó§! mà chúng ta áp dụng, các hiệu ứng bổ sung sẽ dần dần phát sinh."
 relentless_industrialists_situation_locked_tooltip: "§RĐã quá muộn để thay đổi giải pháp cho tình hình lúc này.§!"
 toxoids.10.name: "Đạt Điểm Bước Ngoặt"
 toxoids.10.desc: "Giờ đây, sự tàn phá môi trường trên [Target.GetName] đã chạm đến mức không thể phục hồi. Chúng ta hoàn toàn bất lực trong việc ngăn chặn chất thải phóng xạ lan rộng khắp bề mặt [Target.GetPlanetMoon]. Đáng buồn thay, dân chúng đang vô cùng phẫn nộ, họ tổ chức các cuộc biểu tình chống lại sự cai trị của chúng ta và cho rằng lòng tham lợi nhuận vô độ của chúng ta đã “hủy hoại tất cả”."
 toxoids.10.A: "Thật đáng tiếc khi họ đã phớt lờ những mục tiêu chiến lược ưu tiên của chúng ta."
 toxoids.10.A.tooltip: "Khi hành tinh của chúng ta biến thành một Thế Giới Chết, chúng ta sẽ phải gánh chịu những hình phạt vì độ ổn định thấp."
 toxoids.15.name: "$toxoids.10.name$"
 toxoids.15.desc: "Giờ đây, sự tàn phá môi trường trên [Target.GetName] đã chạm đến mức không thể phục hồi. Chúng ta hoàn toàn bất lực trong việc ngăn chặn chất thải phóng xạ lan rộng khắp bề mặt [Target.GetPlanetMoon]. Người dân hoàn toàn bất lực trước điều này, bởi họ buộc phải làm việc cật lực hơn nữa để hoàn thành các chỉ tiêu sản xuất của tháng tới."
 toxoids.15.A: "Vốn dĩ phải là như vậy."
 toxoids.25.name: "Nhân Danh Sự Tiến Bộ"
 toxoids.25.desc: "Quá trình cải tạo môi trường đã hoàn thành: [Target.GetName] giờ đây đã trở thành một vùng đất cằn cỗi, nhuốm đầy bức xạ. Mặt khác, điều quan trọng hơn cả là các cỗ máy công nghiệp của chúng ta hoàn toàn không bị tổn hại, nên chúng ta vẫn có thể hoàn thành các chỉ tiêu sản xuất của mình. Không gì quan trọng hơn chỉ tiêu."
 toxoids.25.A: "Một cái giá đáng để trả."
 toxoids.25.A.tooltip: "§Y$building_coordinated_fulfillment_center_1_plural$§! của chúng ta giờ đây có thể mang lại những hiệu ứng gia tăng sản lượng công nghiệp lớn hơn."
 toxoids.30.name: "Tri Thức Cải Tạo"
 toxoids.30.desc: "Quá trình cải tạo môi trường đã hoàn thành: [Target.GetName] giờ đây đã trở thành một vùng đất cằn cỗi, nhuốm đầy bức xạ. Các [Owner.GetResearchers] của chúng ta đã tiến hành nghiên cứu cặn kẽ quá trình này, và đảm bảo rằng việc nhân bản nó trên những hành tinh khác là hoàn toàn an toàn, thế nhưng vẫn có một bộ phận người dân bày tỏ lo ngại về lý do tại sao chúng ta lại cần đến công nghệ này."
 toxoids.30.desc.thisisfine: "Quá trình cải tạo môi trường đã hoàn thành: [Target.GetName] giờ đây đã trở thành một vùng đất cằn cỗi, nhuốm đầy bức xạ. Các [Owner.GetResearchers] của chúng ta đã tiến hành nghiên cứu cặn kẽ quá trình này, và cam đoan rằng chỉ cần có nhu cầu, chúng ta có thể an toàn nhân bản nó trên những hành tinh khác."
 toxoids.30.A: "Tri thức là sức mạnh."
 toxoids.30.A.tooltip: "Giờ đây, thông qua việc cải tạo môi trường, chúng ta có thể biến một hành tinh thành §YThế Giới Chết§!."
 toxoids.35.name: "[Target.GetName] Đã Hồi Phục"
 toxoids.35.desc: "Những nỗ lực khắc phục không mệt mỏi của chúng ta đã đưa [Target.GetName] thoát khỏi bờ vực hủy diệt. Khí hậu của hành tinh đã ổn định trở lại, và chúng ta cũng đã rút ra được những bài học quý giá từ quá trình này, đảm bảo rằng những sai lầm tương tự sẽ không lặp lại trong tương lai, đồng thời không làm ảnh hưởng đến những chỉ tiêu sản xuất đầy tham vọng của chúng ta — mặc dù chúng ta sẽ cần phải phân bổ một lượng tài nguyên nhất định để trang trải chi phí khắc phục ô nhiễm."
 toxoids.35.A: "Kết quả tốt đẹp là được."
 toxoids.35.A.tooltip: "§Y$building_coordinated_fulfillment_center_1_plural$§! của chúng ta giờ đây sẽ yêu cầu một khoản phí duy trì bổ sung là £unity£ $unity$."
 TOMB_WORLD_FROM_INDUSTRY_MESSAGE_TYPE_TITLE: "Khai Thác Cạn Kiệt"
 TOMB_WORLD_FROM_INDUSTRY_MESSAGE_TYPE_DESC: "Lòng tham công nghiệp hóa vô đáy của chúng ta đã gây ra những tổn thất nặng nề cho môi trường suốt bao năm qua, và giờ đây §Y[This.GetName]§! đã trở thành một §YThế Giới Chết§!."
 relentless_industrialists_tomb: "Suy Thoái Môi Trường"
 relentless_industrialists_tomb_desc: "Khai thác quá mức đã biến hành tinh này thành một vùng đất chết tràn ngập bức xạ. Người dân cảm thấy vô cùng tuyệt vọng trước những chuỗi sự kiện đã xảy ra."
 requires_not_relentless_industrialists_situation: "$TRIGGER_FAIL$§RKhông thể tiến hành cải tạo môi trường trên [This.GetName], bởi vì tình hình §Y$relentless_industrialists_situation_type$§! vẫn đang diễn biến.§!"
 relentless_industrialists_policies_activated: "Giờ đây chúng ta có thể thay đổi §Y$policy_relentless_industrialists_policy$§! của mình trong menu chính sách.\n\n"
 policy_relentless_industrialists_policy: "Công Nghiệp Hóa"
 policy_relentless_industrialists_policy_desc: "Sinh tồn không chừa một thủ đoạn nào. Nhưng việc thực sự áp dụng chúng chắc chắn sẽ gây ra một vài hệ lụy. Chúng ta có thể lựa chọn dồn toàn tâm toàn lực để đạt được nhiều mục tiêu hơn, hoặc tìm cách xoa dịu những hậu quả tồi tệ nhất của nó."
 relentless_industrialists_full_steam_ahead_name: "Tiến Lên Toàn Tốc"
 relentless_industrialists_full_steam_ahead: "$relentless_industrialists_full_steam_ahead_name$"
 relentless_industrialists_full_steam_ahead_desc: "Nền công nghiệp của chúng ta không nên bị bó buộc bởi bất kỳ giới hạn nào.\n\nGia tăng hiệu ứng buff sản lượng do §Y$building_coordinated_fulfillment_center_1_plural$§! cung cấp."
 relentless_industrialists_study_name: "Vì Khoa Học!"
 relentless_industrialists_study: "$relentless_industrialists_study_name$"
 relentless_industrialists_study_desc: "Trong quá trình biến đổi một hành tinh thành môi trường bức xạ, có vô vàn kiến thức mà chúng ta có thể học hỏi.\n\nCho phép chúng ta cải tạo môi trường hành tinh thành §YThế Giới Chết§!.\nGiảm thiểu các hình phạt về độ phù hợp do §Y$building_coordinated_fulfillment_center_1_plural$§! gây ra."
 relentless_industrialists_cleanup_name: "Khắc Phục"
 relentless_industrialists_cleanup: "$relentless_industrialists_cleanup_name$"
 relentless_industrialists_cleanup_desc: "Chúng ta nên thực hiện các biện pháp để xoa dịu những vết thương mà chúng ta đã hằn lên cơ thể của mẹ thiên nhiên.\n\nCác hành tinh sở hữu §Y$building_coordinated_fulfillment_center_1_plural$§! sẽ không còn dần dần biến đổi thành §YThế Giới Chết§! theo thời gian nữa, nhưng công trình này giờ đây sẽ tiêu tốn một khoản phí duy trì bằng £unity£ §YĐoàn Kết§!."
 RELENTLESS_INDUSTRIALISTS_STUDY_PROJECT: "Bí Mật Bức Xạ An Toàn"
 RELENTLESS_INDUSTRIALISTS_STUDY_PROJECT_DESC: "Chúng ta nên nghiên cứu cách thức an toàn để biến một hành tinh thành môi trường bức xạ mà không gây ra quá nhiều rắc rối cho cư dân địa phương."
 toxoids.45.desc: "Các [This.GetResearchers] của chúng ta đang nghiên cứu toàn bộ quy trình công nghiệp biến môi trường thành bức xạ của chúng ta, và hứa hẹn rằng trong tương lai, họ có thể chuyển đổi một cách an toàn những hệ sinh thái xanh tốt thành những vùng đất đầy bức xạ mà không gây tổn hại quá mức cho cư dân địa phương."
 ### Scavengers
 civic_scavengers: "Kẻ Nhặt Rác"
 civic_scavengers_desc: "Trong xã hội này, ngay cả giữa những tháng năm chiến tranh khốc liệt nhất, cũng không có thứ gì bị lãng phí: mọi công nghệ của kẻ thù đều sẽ bị giải mã, bởi những kẻ nhặt rác sẽ sát cánh cùng các hạm đội chiến đấu, thu hồi và tái sử dụng bất cứ thứ gì có giá trị."
 civic_scavengers_effects: "—Nghiên cứu §HMảnh Vỡ§! không chỉ mang lại $r_research$, mà còn có thể thu hồi một phần §YChi Phí Xây Dựng§! từ những chiến hạm bị phá hủy.\n—Chúng ta có thể trục vớt một số §HMảnh Vỡ§! và phục hồi chúng thành §HChiến Hạm§!."
 civic_corporate_scavengers_effects: "$civic_scavengers_effects$\n—£building£§Y$building_industrial_subsidiary$§!$megacorp_civic_branch_office_building_effect$"
 civic_corporate_scavengers: "Phòng Tu Sửa"
 civic_corporate_scavengers_desc: "$civic_scavengers_desc$"
 trait_incubator: "Máy Ấp Trứng"
 incubator_tooltip: "Cung cấp từ §G+30%§! đến §R-10%§! Tốc Độ Tăng Trưởng Dân Số, tỷ lệ nghịch với số lượng dân số trên hành tinh."
 trait_incubator_desc: "§LKhi bị cách ly hoặc số lượng quần thể dân số còn ít, những giống loài sở hữu đặc tính này sẽ tập trung toàn bộ tâm trí vào việc sinh sản với một cường độ mà các giống loài khác khó lòng chấp nhận được. Trái lại, khi dân số quá đông, hiệu ứng này sẽ bị đảo ngược, khiến việc sinh sản trở nên khó khăn hơn.§!"
 trait_inorganic_breath: "Hô Hấp Vô Cơ"
 inorganic_breath_tooltip: "Mỗi $pop_group_unit$ £pop£ §HPop§! làm việc dưới tư cách nô lệ hoặc có tiêu chuẩn làm việc cao hơn sẽ sản xuất ra 0.02 £exotic_gases£ §Y$exotic_gases$§! mỗi tháng."
 trait_inorganic_breath_desc: "§LGiống loài này sở hữu hệ thống tiêu hóa có đôi chút độc tính, chính vì vậy, trong luồng khí họ thở ra có chứa một nồng độ cao Khí Ngoại Lai.§!"
 trait_noxious: "Độc Hại"
 noxious_tooltip: "Hạnh Phúc của các Pop Không Có Tính Độc Hại: §R$@noxious_happiness_penalty|%$§!\n    Mỗi Pop Không Có Tính Độc Hại làm tăng Hạnh Phúc (không áp dụng cho các Pop miễn nhiễm với Hạnh Phúc): §G$@noxious_happiness_bonus$§! (Tối đa: §G+40%§!)"
 trait_noxious_desc: "§LKhi ở gần những sinh vật có đặc tính này, mọi người sẽ cảm thấy cực kỳ khó chịu, do sự bức bối mà họ mang lại là quá sức chịu đựng đối với những người khác, nên họ cũng thường xuyên phải đối mặt với đủ lời chê bai.§!"
 noxious_stock: "Các Pop Độc Hại không thể trở thành gia súc"
 mod_pop_non_noxious_happiness: "Hàng Xóm Độc Hại"
 trait_exotic_metabolism: "Trao Đổi Chất Ngoại Lai"
 exotic_metabolism_tooltip: "Phí duy trì £exotic_gases£ Khí Ngoại Lai: §R+0.125§!\n$t$—£mod_logistic_growth_mult£$MOD_LOGISTIC_GROWTH_MULT$: §G+25%§!\n$t$—£mod_pop_environment_tolerance£$MOD_POP_ENVIRONMENT_TOLERANCE$: §G+25%§!"
 trait_exotic_metabolism_desc: "§LQuá trình trao đổi chất dựa trên những loại khí ngoại lai - và xa xỉ - có thể cường hóa mạnh mẽ khả năng của giống loài này.§!"
 ap_detox: "Giải Độc"
 ap_detox_desc: "Những bước đột phá công nghệ mới nhất của chúng ta trong lĩnh vực cải tạo môi trường đã giúp việc nuôi dưỡng sự sống trên một chủng loại hành tinh mới trở thành hiện thực — những hành tinh mà trước đây chúng ta từng đánh giá là quá mức chết chóc và hoàn toàn không thể cải tạo."
 detox_tox_worlds: "Cho phép biến đổi §YỨng Viên Cải Tạo Hành Tinh Độc Hại§! thành những thế giới có thể sinh sống thông qua cải tạo môi trường.\nHiện có tất cả §Y[This.num_toxic_terraform_candidates]§! hành tinh đáp ứng điều kiện nằm trong ranh giới của chúng ta."
 MESSAGE_TOXIC_TERRAFORM_FOUND_TITLE: "$toxoids.500.name$"
 MESSAGE_TOXIC_TERRAFORM_FOUND_DESC: "Hành tinh độc hại [From.GetName] bất ngờ lại là một ứng viên tiềm năng cho việc cải tạo môi trường. Nếu có thể làm sạch hoàn toàn nơi này, nó hoàn toàn có khả năng trở thành mái nhà mới của chúng ta trong tương lai."
 MESSAGE_TERRAFORMING_EVENT_TITLE: "Sự Kiện Cải Tạo Môi Trường"
 toxoids.500.name: "Phát Hiện Ứng Viên Cải Tạo Hành Tinh Độc Hại"
 toxoids.500.desc.intro: "Những cuộc khảo sát chuyên sâu của chúng ta trên [From.GetName] đã dẫn đến một kết luận rằng, dù bầu khí quyển ngập tràn khí độc của nó khiến sự sống hiện tại không thể tồn tại, nhưng nó lại mang trong mình tiềm năng to lớn để duy trì một bầu khí quyển thân thiện với sự sống. Thông qua các nỗ lực hợp tác, chúng ta có lẽ sẽ có thể phân giải các chất độc hại trên [From.GetPlanetMoon] thành những hợp chất ít độc hơn."
 toxoids.500.desc.1: "$toxoids.500.desc.intro$\n\nVề lý thuyết, việc cải tạo môi trường trên [From.GetPlanetMoon] này là có khả năng thực hiện, nhưng hiện tại chúng ta vẫn chưa tích lũy đủ các phương tiện công nghệ cần thiết để hoàn thành kỳ tích này trong một khung thời gian hợp lý."
 toxoids.500.desc.2: "$toxoids.500.desc.intro$\n\nLượng năng lượng khổng lồ cần thiết có thể khiến chúng ta phải e ngại, nhưng chúng ta thực sự đã nắm trong tay những kỹ thuật cần thiết để dần dần cải tạo môi trường trên [From.GetPlanetMoon] này thành một thế giới đủ khả năng nuôi dưỡng sự sống một lần nữa."
 toxoids.500.a: "Một tiềm năng đầy quyến rũ đang chờ được đánh thức..."
 TOXIC_TERRAFORMING_CANDIDATE_EFFECT: "Nếu chúng ta lựa chọn đặc quyền thăng thiên §H$ap_detox$§!, §Y[From.GetName]§! sẽ có thể tiến hành cải tạo môi trường."
 d_tainted_snowcaps: "£blocker£ Mũ Băng Nhiễm Độc"
 d_poisonous_algae: "£blocker£ Tảo Độc"
 d_venomous_insects: "£blocker£ Côn Trùng Độc Hại"
 d_unpleasant_atmosphere: "£blocker£ Khí Quyển Khó Chịu"
 d_rotten_soil: "£blocker£ Đất Phân Hủy"
 d_tainted_snowcaps_desc: "Những ngọn núi độc từng trải dài bất tận, có lúc chiếm trọn bề mặt hành tinh, giờ đây chỉ còn là một mảnh tàn dư cuối cùng của thứ chất độc đó."
 d_poisonous_algae_desc: "Sau chiến dịch dọn dẹp đầu tiên của chúng ta trên hành tinh này, những dải tảo độc này vẫn ngoan cường sống sót. Mặc dù sự phá hoại của chúng đối với các hoạt động định cư chưa đến mức gây trở ngại lớn, nhưng khả năng thích nghi của chúng thực sự rất đáng nể... và đôi lúc cũng khiến người ta phải đau đầu."
 d_venomous_insects_desc: "Tổ cuối cùng của loài côn trùng độc hại, đáng lẽ ra chúng ta phải diệt trừ sạch sẽ chúng ngay từ những giai đoạn đầu của công tác cải tạo môi trường."
 d_unpleasant_atmosphere_desc: "Mùi hương chua loét khó ngửi lảng vảng trong không khí là dấu ấn tàn dư của quá khứ độc hại của hành tinh này."
 d_rotten_soil_desc: "Sau khi được thanh lọc và xới tung, ngay cả thứ bùn đất thối rữa này cũng có thể mang lại vô vàn lợi ích cho chúng ta."
 ### Cường Hóa Giới Hạn
 trait_spliced_adaptability: "Khả Năng Thích Nghi Cắt Ghép"
 trait_spliced_adaptability_desc: "§LViệc cắt ghép và gắn kết vô số đoạn gen từ nhiều nguồn khác nhau cho phép chúng sinh tồn trong gần như bất kỳ điều kiện môi trường nào. Dù phản ứng phụ của quá trình này có thể gây ra một tỷ lệ tử vong nhất định, nhưng nhìn chung rủi ro vẫn nằm trong tầm kiểm soát.§!"
 spliced_adaptability_tooltip: "Độ Phù Hợp: §G+20%§!"
 trait_juiced_power: "Tăng Cường Hoocmon"
 trait_juiced_power_desc: "§LKhả năng tiết ra adrenaline và các hoocmon tăng trưởng siêu cường theo ý muốn khiến chúng trở nên vô cùng vạm vỡ. Chỉ cần phớt lờ những tiếng nứt gãy thỉnh thoảng phát ra từ bên trong cơ thể là được.§!"
 juiced_power_tooltip: "Sản Lượng Của $BONUS_WORKFORCE_FOR$ (Giai Cấp Lao Động): §G+5%§!."
 trait_crack_miner: "Thợ Mỏ Bậc Thầy"
 trait_crack_miner_desc: "§LSự phối hợp tay mắt hoàn hảo, thể lực dẻo dai gần như không giới hạn cùng lá phổi sở hữu khả năng tự thanh lọc đã tạo nên những đội thợ mỏ xuất chúng nhất. Điều đáng tiếc duy nhất là do việc phải rời xa ánh sáng mặt trời đã khiến xương của họ trở nên giòn và dễ gãy hơn.§!"
 crack_miner_tooltip: "Sản Lượng Của ['concept_planet_miners']$BONUS_WORKFORCE_FOR$: §G+15%§!"
 trait_farm_hands: "Đa Chi Phụ Trợ Nông Nghiệp"
 trait_farm_hands_desc: "§LCàng có nhiều chi phụ, việc đồng áng càng trở nên dễ dàng. Thậm chí một vài chi phụ trong số đó vẫn có thể tiếp tục công việc ngay cả khi cơ thể chính đã chìm vào giấc ngủ. Về tin đồn rằng chủ thể có thể bị chính chi phụ mới của mình siết cổ đến chết, những cuộc điều tra mới nhất của chúng tôi cho thấy đó hoàn toàn là bịa đặt.§!"
 farm_hands_tooltip: "Sản Lượng Của ['concept_planet_farmers']$BONUS_WORKFORCE_FOR$: §G+15%§!"
 trait_technical_skill: "Tài Năng Kỹ Thuật"
 trait_technical_skill_desc: "§LViệc bổ sung thêm các cơ quan nội tạng đặc biệt có thể gia tăng mạnh mẽ độ nhạy cảm bẩm sinh đối với điện và từ trường. Cứ bỏ qua những báo cáo về việc người được cải tạo nghe thấy những tiếng la hét và thì thầm rùng rợn bên trong lò phản ứng đi.§!"
 technical_skill_tooltip: "Sản Lượng Của ['concept_planet_technician']$BONUS_WORKFORCE_FOR$: §G+15%§!"
 trait_commercial_genius: "Thiên Tài Thương Mại"
 trait_commercial_genius_desc: "§LThông qua việc chủ động điều chỉnh khả năng thích ứng và hạ thấp đi mức độ đồng cảm một cách có chủ đích, những tài năng giao thương xuất chúng nhất sẽ được khơi dậy. Trên con đường vươn tới đỉnh cao thương mại, tầm quan trọng của mục tiêu này vượt xa bất kỳ hậu quả phụ nào có thể xảy ra.§!"
 trait_commercial_genius_tooltip: "Sản Lượng Của ['concept_planet_traders']$BONUS_WORKFORCE_FOR$: §G+25%§!"
 trait_crafted_smiles: "Nụ Cười Hoàn Hảo"
 trait_crafted_smiles_desc: "§LNhững tinh chỉnh nhỏ trên các đường nét khuôn mặt, sự phát triển cơ bắp được gia cường kết hợp cùng sự thư giãn tuyệt đối, lại thêm chút gia vị từ những hợp chất hóa học bên ngoài, đã tạo nên một nụ cười rạng rỡ và hoàn mỹ vĩnh cửu.§!"
 crafted_smiles_tooltip: "Sản Lượng Của ['concept_planet_influential']$BONUS_WORKFORCE_FOR$: §G+15%§!"
 trait_low_maintenance: "Chi Phí Duy Trì Thấp"
 trait_low_maintenance_desc: "§LGiảm thiểu tiêu hao năng lượng, tỷ lệ bài tiết và nhu cầu nghỉ ngơi, mang lại hiệu quả công việc cao hơn với chi phí thấp hơn. Tuy nhiên, đổi lại là nhu cầu về các thực phẩm giàu protein sẽ tăng vọt.§!"
 low_maintenance_tooltip: "Phí Duy Trì Hàng Tiêu Dùng Pop: §G-10%§!"
 trait_artificial_intelligence: "Trí Tuệ Cường Hóa"
 trait_artificial_intelligence_desc: "§LCàng có nhiều não, trí tuệ càng thâm sâu. Việc cấy thêm các cơ quan tư duy phụ trợ tại những vị trí hiểm yếu bên trong cơ thể người được cải tạo có thể đẩy năng lực nhận thức của họ lên mức tối đa. Mặc dù vậy, không phải lúc nào các não bộ này cũng tìm được tiếng nói chung.§!"
 artificial_intelligence_tooltip: "Sản Lượng Của ['concept_planet_researchers']$BONUS_WORKFORCE_FOR$: §G+10%§!"
 trait_gene_mentorship: "Cố Vấn Gen"
 trait_gene_mentorship_desc: "§LNhờ sự kết hợp giữa \"kiến thức bản năng\" được tái cấu trúc ở cấp độ gen và những kích thích hóa học từ bên ngoài, chúng ta đã có thể đẩy nhanh đáng kể quá trình tiếp thu kiến thức. Mặc dù điều này đôi khi có thể dẫn đến một vài trường hợp hoang tưởng vô cùng hy hữu.§!"
 gene_mentorship_tooltip: "Kinh Nghiệm Thu Được Của Lãnh Đạo: §G+25%§!"
 trait_expressed_tradition: "Giải Phóng Truyền Thống"
 trait_expressed_tradition_desc: "§LNiềm đam mê theo yêu cầu: Niềm tin thực chất cũng chỉ là sự pha trộn của các loại hoocmon, và chúng ta đã hoàn toàn làm chủ được nó. Còn việc niềm tin đó cuối cùng sẽ hướng về đâu thì phụ thuộc vào cách chúng ta dẫn dắt nó.§!"
 expressed_tradition_tooltip: "Sản Lượng Của ['concept_planet_bureaucrats']$BONUS_WORKFORCE_FOR$: §G+10%§!"
 trait_elevated_synapses: "Thăng Hoa Khớp Thần Kinh"
 trait_elevated_synapses_desc: "§LDưới vai trò là một thiết bị tính toán, bộ não vốn không được thiết kế để vận hành với 100% công suất. Tuy nhiên, chúng ta đã vượt qua tiêu chuẩn trung bình này một khoảng rất xa. Nếu gặp sự cố, vui lòng khởi động lại.§!"
 elevated_synapses_tooltip: "Sản Lượng Của ['concept_planet_researchers']$BONUS_WORKFORCE_FOR$: §G+20%§!"
 trait_preplanned_growth: "Tăng Trưởng Dự Tính"
 trait_preplanned_growth_desc: "§LSinh sản theo kế hoạch, sức hấp dẫn theo kế hoạch, phối ngẫu theo kế hoạch. Sự tăng trưởng dựa trên nhu cầu sẽ đắp nặn nên một quần thể dân số vững mạnh và ổn định — chỉ cần thực hiện vài thao tác chỉnh sửa gen đơn giản xuyên suốt quá trình là có thể đạt được nguyện vọng. Bất kỳ cá nhân nào nảy sinh lòng đố kỵ đều sẽ bị áp giải đến trung tâm sinh sản gần nhất để tiến hành huấn luyện bắt buộc.§!"
 preplanned_growth_tooltip: "Tốc Độ Tăng Trưởng Dân Số: §G+30%§!$TABBED_NEW_LINE$—Nhu Cầu Nhà Ở Của Pop: §G-10%§!"
 trait_excessive_endurance: "Sức Bền Thái Quá"
 trait_excessive_endurance_desc: "§LTrên những cá thể này, bộ gen mang lại khả năng thích nghi mạnh mẽ nhất đã được biểu hiện quá mức. Chúng ta đã ghi nhận tỷ lệ đột biến lên tới khoảng 30%, một con số quá đủ để khẳng định cuộc thử nghiệm đã diễn ra ổn định và thành công rực rỡ.§!"
 excessive_endurance_tooltip: "Độ Phù Hợp: §G+30%§!$TABBED_NEW_LINE$—$MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!"
 edict_damn_the_consequences: "Bất Chấp Hậu Quả"
 edict_damn_the_consequences_desc: "Sắc lệnh này sẽ đẩy những thay đổi gen của chúng ta lên mức cực đoan, nhân đôi hiệu quả của chúng, nhưng đồng thời cũng làm tăng tỷ lệ xuất hiện của các phản ứng phụ ác tính, bao gồm cả những vụ phát nổ bất thình lình mang tính thảm họa.\n\n§RSự vô trách nhiệm này sẽ bỏ qua ['concept_edict_fund'] và liên tục làm tiêu hao 80% thu nhập $unity_with_icon$ hàng tháng của bạn!§!"
 edict_damn_the_consequences_effects: "Nhân đôi tất cả các hiệu ứng tích cực của các đặc tính thuộc nhóm §HCường Hóa Giới Hạn§!."
