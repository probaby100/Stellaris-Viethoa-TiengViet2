 planet_squires: "Cận Vệ"
 district_orders_demesne: "Lãnh Địa Hiệp Sĩ Đoàn"
 district_orders_demesne_plural: "Các Lãnh Địa Hiệp Sĩ Đoàn"
 district_orders_demesne_desc: "Thế lực của hiệp sĩ đoàn không nên bị giới hạn trong bất kỳ pháo đài hay căn cứ sao nào! Không, chỉ có những không gian rộng lớn bao la — những hành tinh và hệ sao tràn ngập tài nguyên cùng những bãi săn tuyệt hảo — mới có thể giúp họ thực sự phát triển lớn mạnh."
 zone_habitat_knights: "Đại Điện Hiệp Sĩ Đoàn"
 zone_habitat_knights_plural: "Các Đại Điện Hiệp Sĩ Đoàn"
 zone_habitat_knights_desc: "$district_orders_demesne_desc$"
 building_order_keep: "Thành Trì Hiệp Sĩ Đoàn"
 building_order_keep_desc: "Tòa thành của hiệp sĩ đoàn là mái nhà chung của các hiệp sĩ. Nó lưu trữ khối lượng dữ liệu khổng lồ và chứa đầy những chiến lợi phẩm thu được trong suốt chiều dài lịch sử huy hoàng của họ."
 building_order_keep_effect: "§RCông trình này không thể bị phá dỡ hoặc ngưng hoạt động!§!\n\n"
 toxic_knights_start_NAME: "Nơi Ẩn Náu Của Độc Thánh"
 toxic_knights_start_DESC: "Hệ sao khởi đầu mặc định khi sử dụng nguồn gốc $origin_toxic_knights$."
 toxic_knights_sol_start_NAME: "Hệ Mặt Trời Dưới Trướng Độc Thánh"
 toxic_knights_sol_start_DESC: "Hệ sao khởi đầu tùy chọn cho nguồn gốc $origin_toxic_knights$, dựa trên hệ Mặt Trời."
 d_toxic_god_pools_most_venemous: "Hồ Nước Độc Nhất"
 d_toxic_god_pools_most_venemous_desc: "Thần linh đã để lại vô số hồ nước cực độc sau lưng, nơi có thể tìm thấy những phần độc chất còn sót lại."
 d_toxic_god_pools_most_venemous_upgraded: "Cực Độc Tối Thượng"
 d_toxic_god_pools_most_venemous_upgraded_desc: "Thần linh đã để lại vô số hồ nước cực độc sau lưng, nơi có thể tìm thấy những phần độc chất còn sót lại. Nhờ có sự cày cuốc chăm chỉ của các Hiệp Sĩ Độc Thánh, giờ đây chúng ta có thể thu thập những loại độc dược mạnh mẽ này và phát triển chúng cho nhiều mục đích khác nhau."
 d_toxic_god_pestilential_wasteland: "Vùng Đất Dịch Bệnh"
 d_toxic_god_pestilential_wasteland_desc: "Không phải ai cũng có thể tận hưởng ân huệ của thần linh. Phần lớn vùng đất này đã bị hủy diệt khi thần đi ngang qua, vĩnh viễn không thể hồi phục."
 d_toxic_god_pestilential_wasteland_upgraded: "Dịch Bệnh Tái Lâm"
 d_toxic_god_pestilential_wasteland_upgraded_desc: "$d_toxic_god_pestilential_wasteland_desc$Tuy nhiên, những bộ áo giáp do các hiệp sĩ phục chế đã giúp chúng ta có thể làm việc an toàn trong những khu vực này."
 d_toxic_god_deitys_swarms: "Bầy Côn Trùng Thánh Lâm"
 d_toxic_god_deitys_swarms_desc: "Theo sau thần linh, một loài côn trùng chưa từng thấy trên hành tinh này bỗng lây lan chóng mặt và sinh sôi nảy nở mạnh mẽ tại các khu vực bị ảnh hưởng. Dù chúng ta đã cố gắng canh tác trên những vùng đất này, sự xuất hiện của lũ sâu bọ vẫn tiếp tục mang đến vô vàn thử thách."
 d_toxic_god_deitys_swarms_upgraded: "Thuần Hóa Thánh Trùng"
 d_toxic_god_deitys_swarms_upgraded_desc: "Theo sau thần linh, một loài côn trùng chưa từng thấy trên hành tinh này bỗng lây lan chóng mặt và sinh sôi nảy nở mạnh mẽ tại các khu vực bị ảnh hưởng. Tuy nhiên, nhờ vào phần thịt mọng nước và lớp độc tính cực mạnh của chúng, chúng ta đã nắm vững hoàn toàn kỹ thuật chăn nuôi loài sinh vật này."
 d_toxic_god_blight_upon_the_land: "Vùng Đất Lụi Tàn"
 d_toxic_god_blight_upon_the_land_desc: "Tương truyền đây là nơi thần linh lần đầu tiên trút cơn thịnh nộ hủy diệt mặt đất. Gần như chẳng có thứ gì của quá khứ có thể sống sót."
 d_toxic_god_blight_upon_the_land_upgraded: "Ký Ức Lụi Tàn"
 d_toxic_god_blight_upon_the_land_upgraded_desc: "Tương truyền đây là nơi thần linh lần đầu tiên trút cơn thịnh nộ hủy diệt mặt đất. Gần như chẳng có thứ gì của quá khứ có thể sống sót. Dẫu vậy, một đài tưởng niệm đã được dựng lên, tượng trưng cho những ký ức của chúng ta về thời khắc đó."
 d_toxic_god_envenomed_seas: "Biển Mủ Độc"
 d_toxic_god_envenomed_seas_desc: "Ngay cả đại dương bao la cũng không thể thoát khỏi cái chạm mang tính thảm họa của thần linh."
 d_toxic_god_envenomed_seas_upgraded: "Quà Tặng Viễn Dương"
 d_toxic_god_envenomed_seas_upgraded_desc: "Các hiệp sĩ của chúng ta đã mang về những công nghệ thiết yếu, giúp chúng ta có thể thu thập Khí Ngoại Lai từ chính những đại dương từng bị Độc Thánh chạm vào."
 d_knights_calibrator: "Kính Calibrator Của Hiệp Sĩ Đoàn"
 d_knights_calibrator_desc: "Thánh tích được tôn kính nhất của hiệp sĩ đoàn, là thứ chống đỡ cho toàn bộ tòa thành trì."
 NAME_Toxic_God: "Độc Thánh"
