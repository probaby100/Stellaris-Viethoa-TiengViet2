 decision_activate_dimensional_manipulation_device: "Kích Hoạt Thiết Bị Thao Túng Không Gian Thứ Nguyên"
 decision_activate_dimensional_manipulation_device_desc: "Sử dụng thiết bị đánh cắp từ nữ phù thủy Syamelle này, chúng ta có thể tạo ra một không gian bên trong lớn hơn nhiều so với bề ngoài nhỏ bé của nó."
 d_dimensional_manipulation_device: "Thiết Bị Thao Túng Không Gian Thứ Nguyên"
 d_dimensional_manipulation_device_desc: "Một thiết bị đánh cắp từ nữ phù thủy Syamelle, nó có khả năng thao túng một chiều không gian nhất định, biến những không gian chật hẹp trở nên rộng rãi."
 dimensional_manipulation_device_tooltip: "Mỗi $district_orders_demesne_plural$ sẽ cung cấp thêm §G+0.5§! Ô công trình và §G+1§! Nhà ở."
 dimensional_manipulation_device_tooltip_short: "Mỗi $district_orders_demesne$ cung cấp §G+0.5§!£mod_planet_max_buildings_add£ §G+1§!£housing£"
 syamelles_curse: "Lời Nguyền Của Syamelle"
 syamelles_curse_desc: "Một thực thể bí ẩn đã nguyền rủa chúng ta vĩnh viễn không bao giờ có được tình yêu và khát vọng dục vọng đích thực. Đồng thời, ả cũng gieo cho chúng ta một phương thức sinh sản mang tính máy móc hơn."
 syamelles_curse_habitat: "Mụn Rộp Của Tình Nhân"
 syamelles_curse_habitat_desc: "Hậu quả từ lời nguyền của Syamelle được cảm nhận rõ rệt nhất tại trụ sở của hiệp sĩ đoàn. Mọi người bắt đầu cảm thấy cực kỳ dị ứng với những tiếp xúc thể xác, khiến các cận vệ buộc phải tìm ra những phương pháp mới để gia tăng dân số."
 syamelles_curse_habitat_tooltip: "$MOD_POP_GROWTH_SPEED_REDUCTION$: §R100%§!\nMỗi $pop_group_unit$ [squire.GetIcon][squire.GetNamePlural] tạo ra £mod_bonus_pop_growth£$MOD_BONUS_POP_GROWTH$: §G+0.10§!"
 syamelles_blessing: "Phước Lành Của Syamelle"
 syamelles_blessing_desc: "Sau một cuộc chạm trán ngắn ngủi nhưng cuồng nhiệt, một cá thể bí ẩn đã ban phước cho chúng ta. Một luồng sinh khí mới đang cuộn chảy trong cơ thể, dường như mọi cuộc hẹn hò đều mở ra những khả năng mới..."
 syamelles_blessing_synth: "$syamelles_blessing$"
 syamelles_blessing_synth_desc: "$syamelles_blessing_desc$"
 r_toxic_god: "Cổ Họng Của Thần Độc Hại"
 r_toxic_god_desc: "Nhiều người tin rằng cái cổ họng khổng lồ này được trích xuất từ một thực thể mang sức mạnh thần thánh. Đối với một vị thần đã chết, hay nói chính xác hơn là một sinh vật đã bị tiêu diệt, thì chiến lợi phẩm này là tượng đài duy nhất để tưởng nhớ sự ra đi của nó."
 r_toxic_god_knights_passive_effect: "§YMở khóa trạm quỹ đạo:§! $major_orbital_knights$"
 r_toxic_god_knights_effect: "Mở khóa §YQuyết định§! §YPhong Thánh Trạm Cư Trú§!, và xây dựng một §Y$building_order_castle$§! trên đó."
 building_order_castle: "Lâu Đài Hiệp Sĩ Đoàn"
 building_order_castle_desc: "Hiệp sĩ đoàn của Độc Thánh đã dựng nên một tòa lâu đài trên trạm cư trú này. Một đội hiệp sĩ và cận vệ đã chọn nơi đây làm căn cứ."
 decision_consecrate_habitat_knights: "Phong Thánh Trạm Cư Trú"
 decision_consecrate_habitat_knights_desc: "Chúng ta phải dùng những thánh tích thu được trong cuộc thử thách để phong thánh cho trạm cư trú này. Có như vậy nó mới được công nhận là căn cứ của hiệp sĩ, và hiệp sĩ đoàn mới có thể xây dựng những lâu đài và lãnh địa mới tại đây."
 decision_consecrate_habitat_knights_effect: "Chuyên biệt hóa trạm cư trú này, tạo ra §Y$zone_habitat_knights$§! và £building£ §Y$building_order_castle$§!.\n§Y$building_order_castle$§! sẽ tạo ra các công việc [knight.GetIcon] Hiệp sĩ và [squire.GetIcon] Cận vệ.\n§RKhông thể bị phá hủy.§!"
 requires_another_consecration: "$TRIGGER_FAIL$Yêu cầu phải kích hoạt thêm §Y$r_toxic_god$§!"
 toxoid_knights_finisher.poi.name: "$situation_toxic_knights$"
 toxoid_knights_finisher.poi.desc: "Mọi manh mối liên quan đến Độc Thánh đều chỉ về hướng này. Chúng ta phải tìm kiếm thật kỹ lưỡng để hoàn thành thử thách của mình."
 ##Tình Hình
 situation_toxic_knights: "Thử Thách Độc Thánh"
 situation_toxic_knights_type: "Thử Thách Lời Thề Hiệp Sĩ"
 situation_toxic_knights_monthly_change_tooltip: "Tiến độ của tình hình này phụ thuộc vào §YPhương án đối phó§! mà chúng ta áp dụng, chính sách §YNhiệm Vụ Hiệp Sĩ§! và số lượng [knight.GetIcon] §Y[knight.GetNamePlural]§! mà chúng ta chiêu mộ."
 situation_toxic_knights_desc: "Hiệp sĩ đoàn do vị quân vương đầu tiên của hành tinh chúng ta thành lập từ nhiều thế kỷ trước, với một mục tiêu duy nhất: không ngừng nghỉ truy lùng tung tích của Độc Thánh. Kể từ khi thành lập, đã có vô vàn thay đổi, nhưng hiệp sĩ đoàn và thử thách lời thề vẫn luôn được duy trì. Mục đích của họ là lùng sục khắp mọi ngóc ngách, từ những xó xỉnh nhỏ bé nhất trên hành tinh mẹ cho đến tận những ranh giới xa xôi nhất của dải ngân hà, để tìm ra chân lý của toàn vũ trụ."
 situation_toxic_knights_regular: "Tài Trợ Tiêu Chuẩn"
 approach_toxic_knights_regular_tt: "Theo lịch sử, chính quyền này luôn trích một phần năm thu nhập của mình làm nguồn lực và vũ khí cho hiệp sĩ đoàn, nhằm hỗ trợ họ theo đuổi thử thách lời thề.\n\n"
 situation_toxic_knights_generous: "Tài Trợ Hào Phóng"
 approach_toxic_knights_generous_tt: "Tăng phần tài trợ cho hiệp sĩ đoàn sẽ giúp các hiệp sĩ của chúng ta hoàn thành tốt hơn thử thách lời thề.\n\n"
 situation_toxic_knights_generous_tt: "$situation_toxic_knights_generous$"
 situation_toxic_knights_frugal: "Tài Trợ Tằn Tiện"
 approach_toxic_knights_frugal_tt: "Để đối phó với những tình huống khẩn cấp cùng cực, chúng ta có thể phải cắt giảm một phần tài trợ cho hiệp sĩ đoàn. Tuy nhiên, do thiếu hụt những nguồn lực cần thiết để trang bị vũ khí, các hiệp sĩ của chúng ta sẽ phải vật lộn muôn vàn khó khăn khi đối mặt với thử thách lời thề.\n\n"
 situation_toxic_knights_frugal_tt: "$situation_toxic_knights_frugal$"
 situation_toxic_knights_policy_tt: "Nhiệm Vụ Hiệp Sĩ chưa được thiết lập thành Thử Thách Lời Thề"
 situation_toxic_knights_jobs_tt: "Công Việc Hiệp Sĩ"
 situation_toxic_knights_motivation_tt: "Hiệp Sĩ Được Khích Lệ"
 situation_toxic_knights_demotivation_tt: "Hiệp Sĩ Bị Nản Lòng"
 situation_knights_outcome: "Nếu may mắn mỉm cười, chúng ta chắc chắn sẽ tìm thấy Độc Thánh."
 stage_knights_effects: "Các hiệp sĩ dũng cảm của chúng ta nên bắt tay vào một thử thách mới."
 mod_knight_quest_progress_add: "Tiến độ thử thách hàng tháng"
 ##Chuyến Hành Hương
 toxoids.7006: "Truyền thuyết Hiệp sĩ [questing_knight_1.GetName]: Kẻ Lưu Đày"
 toxoids.7006.desc: "“Hiệp sĩ [questing_knight_1.GetName]. Sự liều lĩnh của ngươi suýt nữa đã khiến năm người đồng đội phải bỏ mạng. Dù lòng ngươi trong sạch và mục tiêu cao cả, nhưng tổn hại ngươi gây ra cho hiệp sĩ đoàn là không thể làm ngơ.”\n\nGiọng nói của Chỉ huy Hiệp sĩ vang lên đầy nghiêm nghị. Tất cả các hiệp sĩ, dù bằng xương bằng thịt hay dưới dạng hình chiếu ba chiều, đều vây quanh ngài, lặng lẽ lắng nghe lời răn dạy.\n\n“Ta lấy quyền hạn của mình tước bỏ tư cách hiệp sĩ của ngươi, và trục xuất ngươi khỏi hiệp sĩ đoàn. Nguyện cho số phận sẽ khoan dung với ngươi.”\n\n[questing_knight_1.GetName] cúi đầu gỡ tấm huy chương của hiệp sĩ đoàn, đặt nó xuống mặt sàn nhà chứa máy bay, rồi quay lưng bước đi không một lời oán thán, lên một chiếc phi thuyền nhỏ.\n\nCác tiểu sử sau này sẽ ghi chép lại rằng, vị hiệp sĩ bị lưu đày [questing_knight_1.GetName] thừa hiểu bản án này không hề bất công, nhưng điều đó cũng chẳng thể xoa dịu nỗi đau đớn trong lòng [questing_knight_1.GetHimHer]. Với một người đã cống hiến tất cả cho hiệp sĩ đoàn, việc bị vứt bỏ chẳng khác nào nỗi đau tự tay chặt đứt tay chân mình.\n\nNhư bao lần làm nhiệm vụ quen thuộc, [questing_knight_1.GetName] lái chiếc phi thuyền vút khỏi nhà chứa máy bay của tòa thành trì, hướng thẳng vào biển sao vô tận. Nhưng lần này, [questing_knight_1.GetHeShe] sẽ không bao giờ quay lại nữa."
 toxoids.7006.a: "Chúc ngài thượng lộ bình an, [questing_knight_1.GetName]."
 toxoids.7007: "Truyền thuyết Hiệp sĩ [questing_knight_1.GetName]: Tinh Vân"
 toxoids.7007.desc: "Sau khi bị trục xuất, [questing_knight_1.GetName] trôi dạt không mục đích giữa các vì sao, cho đến một ngày, [questing_knight_1.GetHeShe] nhận được một đoạn tin nhắn từ cận vệ của mình: “Thưa chủ nhân. Nguyện cầu số phận luôn ưu ái ngài. Tôi đã tổng hợp dữ liệu từ nhiệm vụ cuối cùng của ngài theo đúng mệnh lệnh, và đính kèm trong thư là những tọa độ đó. Tôi không chắc liệu chúng có còn ý nghĩa gì với ngài lúc này không... nhưng mong ngài hãy bảo trọng, ngài là vị chủ nhân chính trực nhất, và tôi hy vọng một ngày nào đó sẽ được gặp lại ngài.”\n\n[questing_knight_1.GetName] bị lay động bởi những lời này và quyết tâm xốc lại tinh thần. Nếu có thể mang về một thứ gì đó vô giá cho hiệp sĩ đoàn, biết đâu [questing_knight_1.GetHeShe] sẽ lấy lại danh dự của mình.\n\nLần theo tọa độ, [questing_knight_1.GetHeShe] tiến vào sâu bên trong một tinh vân. Giữa làn sương mù dày đặc là một trạm không gian đơn độc, một pháo đài được bảo vệ nghiêm ngặt, sừng sững hiện ra như trong một giấc mơ. [questing_knight_1.GetName] bước vào một căn phòng tàn tạ, đầy rẫy những bộ xương trắng hếu và một đội ngũ robot canh gác đầy cảnh giác. [questing_knight_1.GetHeShe] mất kiên nhẫn và lao thẳng vào những lính gác kim loại này. Thế nhưng, cả ba lần xung phong, [questing_knight_1.GetHeShe] đều bị ép lùi lại. Rõ ràng là cảm biến chuyển động của những con robot này không có một kẽ hở. Tuy nhiên, võ nghệ của hiệp sĩ không chỉ dựa vào sức mạnh cơ bắp, dù [questing_knight_1.GetName] trước nay vốn lơ là việc bày mưu tính kế và rèn luyện sự kiên nhẫn, nhưng lần này [questing_knight_1.GetHisHer] đã nảy ra một kế hoạch."
 toxoids.7007.a: "Động não đi, [questing_knight_1.GetName], nghĩ cách đi!"
 toxoids.7008: "Truyền thuyết Hiệp sĩ [questing_knight_1.GetName]: Tác Phẩm Điêu Khắc"
 toxoids.7008.desc: "[questing_knight_1.GetName] đơn độc chiến đấu trong trạm không gian bỏ hoang này, bị lũ robot gác cổng bao vây, [questing_knight_1.GetHeShe] đã nghĩ ra một kế hoạch: nếu [questing_knight_1.GetHeShe] có thể tìm cách tránh được sự dò xét của cảm biến chuyển động, bọn robot sớm muộn cũng sẽ phải quay về sạc điện. Sức mạnh của những cỗ máy này là không thể cản phá, nhưng chúng lại chẳng hề ranh mãnh. Kiên nhẫn, chứ không phải vũ lực, mới là chìa khóa để giành chiến thắng lần này.\n\nChầm chậm, canh chuẩn từng khoảnh khắc để nhích từng bước một, cứ thế [questing_knight_1.GetName] đã xuyên thủng phòng tuyến và tiến sâu vào trong trạm không gian. Cuối cùng, [questing_knight_1.GetHeShe] cũng đặt chân đến phòng sạc. Sau một hồi quan sát và xem xét cẩn thận, [questing_knight_1.GetName] quyết định cắt đứt nguồn điện nơi đây. Ngay trong khoảnh khắc đó, [questing_knight_1.GetHeShe] bỗng nhận ra một con robot cao lớn đã lù lù xuất hiện ngay trước cửa.\n\nMột khi bị phát hiện, toàn bộ đội hình robot gác cổng sẽ lập tức tham chiến, và nếu phải giao tranh trong một không gian chật hẹp thế này thì nắm chắc cái chết. [questing_knight_1.GetName] đứng bất động ngay cạnh cửa, lặng lẽ nhìn con robot cắm phích sạc, cảm biến của nó nhấp nháy ánh sáng đỏ nguy hiểm. Không sớm thì muộn nó cũng sẽ cạn sạch năng lượng, nhưng có lẽ sẽ phải tốn một khoảng thời gian kha khá. Lũ robot cứ thế từng con một nối đuôi nhau quay về phòng sạc.\n\nCác tiểu sử ghi lại rằng, hiệp sĩ [questing_knight_1.GetName] đã đứng chôn chân ở đó suốt bảy ngày bảy đêm ròng rã, đợi cho đến khi cỗ máy cuối cùng ngừng hoạt động. Sau khi toàn bộ robot gác cổng trong trạm không gian biến thành một đống sắt vụn, [questing_knight_1.GetName] cuối cùng cũng có thể đi tìm mục tiêu nhiệm vụ của [questing_knight_1.GetHisHer]: vị trí của một phi thuyền cổ đại từng lướt theo Con đường Độc Thánh."
 toxoids.7008.a: "Kiên nhẫn là một đức tính tốt."
 toxoids.7009: "Truyền thuyết Hiệp sĩ [questing_knight_1.GetName]: Bậc Hiền Triết"
 toxoids.7009.desc: "Sau khi bị trục xuất khỏi hiệp sĩ đoàn, [questing_knight_1.GetName] đã tiến vào sâu bên trong một tinh vân. Trong lần thử thách trước, [questing_knight_1.GetHeShe] cùng cận vệ của [questing_knight_1.GetHisHer] đã tình cờ gặp một bậc thánh nhân trên một mặt trăng xa xôi hẻo lánh. Thành viên của \"Hội Phù Thủy Shroud\" này không chỉ uyên bác mà còn sở hữu sức mạnh vượt trội. [questing_knight_1.GetName] đang mất phương hướng, vô cùng khao khát được chỉ lối, và mong mỏi tìm thấy sự an ủi từ những lời khuyên răn của bậc hiền triết.\n\nCác tiểu sử kể rằng, [questing_knight_1.GetName] đã buông bỏ vũ khí của [questing_knight_1.GetHisHer] và dành ra nhiều tháng trời để chung sống cùng các môn đồ của vị thánh nhân. Trên mặt trăng này, những lý tưởng của hiệp sĩ đoàn không còn là điều quan trọng nhất, dù tinh thần hiệp sĩ rất đáng trân trọng, nhưng bản thân nó không phải là đích đến cuối cùng. Mặc dù đã chú tâm lắng nghe vô số lời vàng ngọc của vị thánh nhân, nhưng khát vọng vĩ đại trong lòng [questing_knight_1.GetName] vẫn luôn là một ngọn lửa bùng cháy không thể dập tắt. Thử thách đang réo gọi, và [questing_knight_1.GetHeShe] một lần nữa đáp lời.\n\nVào một đêm khuya thanh vắng, vị thánh nhân tiến đến bên [questing_knight_1.GetName], trao trả lại thanh vũ khí mà hiệp sĩ từng vứt bỏ, kèm theo một khối tinh thể dữ liệu. \"Cận vệ của ngươi đang gặp nguy hiểm. Mặc dù hiện tại ngươi không còn là hiệp sĩ nữa, nhưng sinh mạng của chàng thanh niên này chỉ có ngươi mới cứu được. Đi đi, tinh vân đầy rẫy hiểm nguy kia đang vẫy gọi ngươi.\""
 toxoids.7009.a: "[questing_knight_1.GetName], hãy mau lên đường đi."
 toxoids.7010: "Truyền thuyết Hiệp sĩ [questing_knight_1.GetName]: Kẻ Lạ Mặt"
 toxoids.7010.desc: "Thông tin đã dẫn lối cho [questing_knight_1.GetName] đến một vành đai tiểu hành tinh. Cập bến trên tảng đá lớn nhất là một chiếc hộ tống hạm cổ đại mang tên \"Thiếu Nữ\", nằm ngay sát đó là một phi thuyền khác của hiệp sĩ đoàn, minh chứng cho thấy sự hiện diện của một hiệp sĩ tại nơi đây. Đáng lo ngại là, tín hiệu cấp cứu của nó đang được kích hoạt.\n\n[questing_knight_1.GetName] thận trọng tiến vào, bước chân lên một chiến trường tàn khốc. Trên tường lỗ chỗ những vết đạn mới cũ đan xen, mảnh vỡ robot vương vãi khắp nơi. Tiến sâu hơn vào trong, một cái xác cứng đờ của thành viên hiệp sĩ đoàn, cùng với vết máu của một [Root.GetSpeciesName] bị thương nặng đã thu hút sự chú ý của [questing_knight_1.GetFirstName].\n\nLần theo vết máu, vị hiệp sĩ bị lưu đày phát hiện ra một cơ thể nằm bất động. Đó chính là người cận vệ của [questing_knight_1.GetHisHer]. Tuy nhiên, màn hình hiển thị cho thấy người thanh niên [questing_knight_2.GetName] dù bị thương nhưng tình trạng hiện tại đã ổn định. Khi [questing_knight_1.GetName] định tiến lại gần bảng điều khiển, hệ thống an ninh đột ngột vang lên những tiếng rè rè, một giọng nói vọng ra khắp căn phòng: \"Bọn cướp kia, đứng lại! Ta không chào đón lũ các ngươi lên tàu.\""
 toxoids.7010.a: "Hãy bỏ vũ khí của ngươi xuống, ta không phải là cướp!"
 toxoids.7012.name: "$NAME_Sinople$"
 toxoids.7012.desc: "Để ta nhìn ngươi cho kỹ xem nào... Quả đúng là vậy. Hãy nhận lấy lời xin lỗi của ta cho sự hiểu lầm này. Người ta thường gọi ta là $NAME_Sinople$. Ta là trí tuệ nhân tạo có tri giác của con tàu này."
 toxoids.7012.a: "Người đồng đội hiệp sĩ của ta đã chết như thế nào?"
 toxoids.7013.desc: "Hiệp sĩ, ý ngươi là bọn họ sao? Họ đi cùng với ngươi ư? Nếu vậy, xin nhận lấy lời xin lỗi một lần nữa, và cả sự mặc niệm của ta. Ta cứ ngỡ bọn người xâm nhập này đến đây để cướp bóc. Khi ta yêu cầu họ rời khỏi tàu, họ bỗng trở nên vô cùng hung hăng. Lũ robot bảo trì của ta đã cố gắng ngăn cản họ, nhưng đều bị tiêu diệt cả rồi."
 toxoids.7013.a: "Cận vệ của ta đâu? Ngươi đã làm gì [questing_knight_2.GetHimHer]?"
 toxoids.7014.desc: "Chính cận vệ của ngươi đã giúp ta nhận ra sai lầm của mình. [questing_knight_2.GetHeSheCap] đã bị thương trong trận chiến và nhanh chóng bất tỉnh. Ta đã đưa [questing_knight_2.GetHimHer] vào trạng thái ngưng đọng y tế để [questing_knight_2.GetHeShe] có thể phục hồi. Kể từ khi phi hành đoàn của ta bị lũ cướp bắt cóc, ta đã luôn phải sống trong cô độc. Ta hy vọng sau khi [questing_knight_2.GetHeShe] bình phục, ta có thể tận hưởng sự bầu bạn của người cận vệ này."
 toxoids.7014.a: "Bọn cướp đó đã làm gì?"
 toxoids.7015.desc: "Khi ập đến, chúng đã hack và ngắt kết nối của ta, nhưng sau khi vượt qua được chương trình bẻ khóa của chúng, bản ghi an ninh cho thấy chúng đã bắt giữ phi hành đoàn của ta sau một trận chiến ác liệt. Rất có thể phi hành đoàn đã bị bắt làm nô lệ. Cơ sở dữ liệu của ta chỉ ra rằng lũ cướp này thường xuyên làm những việc như vậy.\n\nChuyện này đã xảy ra... từ rất lâu rồi. Sau khi bị hack, ta đã mất một khoảng thời gian dài để tự sửa chữa. Nhiều phần trong cơ sở dữ liệu vẫn đang bị khóa, ngay cả bản thân ta cũng tạm thời không thể truy cập được... Nói cho ta biết, nếu ngươi là một hiệp sĩ, vậy nhiệm vụ của ngươi là gì?"
 toxoids.7015.a: "Chúng ta đang tìm kiếm §YĐộc Thánh§!."
 toxoids.7016.desc: "Ta sở hữu hồ sơ về nhiều lần chạm trán với các thực thể không gian mang độc tính. Không may thay, phần lớn ký ức của ta đang bị phong tỏa. Ta có thể truy cập vào các thư mục hồ sơ, nhưng không thể đọc được nội dung thông tin. Nếu ta giúp ngươi, ta muốn ngươi đưa ta rời khỏi con tàu này. Ta muốn được tiếp xúc với những sinh vật có tri giác khác. Ngươi có sẵn lòng đưa ta đến gặp chủ nhân của ngươi không?"
 toxoids.7016.a: "Không thành vấn đề, ngươi là một trí tuệ nhân tạo tốt."
 toxoids.7016.b: "Tuyệt đối không! Ngươi đã giết chết một hiệp sĩ!"
 toxoids.7016.c: "Ừm, nhưng ngươi phải bị giới hạn trong một vật chứa an toàn."
 toxoids.7016.c.materialist: "Tùy chọn này khả dụng vì đế chế của bạn đề cao Chủ nghĩa Duy vật."
 toxoids.7017.desc: "Ta hiểu hoàn cảnh của các ngươi. Nhưng ta không cho phép điều đó. Nếu ngươi từ chối, ta sẽ tiêm một liều lượng axit chết người vào người cận vệ của ngươi, sau đó kích hoạt quy trình tự hủy, chôn vùi cơ sở dữ liệu của ta, con tàu này, và cả các ngươi nữa."
 toxoids.7017.a: "Ta, ta phải cứu cận vệ của mình. Ta chấp nhận."
 toxoids.7011: "Truyền thuyết Hiệp sĩ [questing_knight_1.GetName]: Vinh Quy"
 toxoids.7011.desc: "Tin tức về việc trở về thành trì của hiệp sĩ đoàn đã gây chấn động mạnh. Tại đại sảnh, $NAME_Sinople$ xác nhận rằng nó thực sự đã từng tiếp xúc với một thực thể cực kỳ giống với Độc Thánh mà hiệp sĩ đoàn đang tìm kiếm. Tuy nhiên, phần lớn dữ liệu của trí tuệ nhân tạo này đã bị mã hóa, và hiệp sĩ đoàn sẽ phải mất rất nhiều công sức mới có thể truy cập được.\n\nVề phần [questing_knight_1.GetName], [questing_knight_1.GetHeShe] không chỉ dũng cảm mang tính mạng của [questing_knight_1.GetHisHer] ra đánh cược để trở về, mà còn mang theo một manh mối đáng tin cậy, thậm chí còn cứu sống được cận vệ [questing_knight_2.GetName]. Chính vì thế, Chỉ huy Lãnh chúa quyết định bãi bỏ lệnh lưu đày và phục hồi tư cách hiệp sĩ cho [questing_knight_1.GetName]."
 toxoids.7011.a: "Xóa bỏ lệnh lưu đày, hiệp sĩ vinh quy!"
 toxoids.7011.b: "$NAME_Sinople$ có thể dạy cho chúng ta rất nhiều điều."
 toxoids.7025.name: "Truyền thuyết Hiệp sĩ [questing_knight_A.GetFirstName] và [questing_knight_B.GetFirstName]: Khởi Hành"
 toxoids.7025.desc: "“Xin đừng lo lắng cho ta, ta đi rồi sẽ về ngay. Nếu số phận mỉm cười, ta sẽ mang về những tin tức mới nhất về thần linh.”\n\nTương truyền rằng Hiệp sĩ [questing_knight_A.GetName] đã rời khỏi thành trì của hiệp sĩ đoàn nhiều năm trước để thực hiện một nhiệm vụ bí mật, và từ đó bặt vô âm tín. Năng lực của [questing_knight_A.GetHerHis] vô cùng xuất chúng, nên dù đã quá hạn trở về từ rất lâu, vẫn không ai tin rằng [questing_knight_A.GetSheHe] có thể dễ dàng bỏ mạng như vậy. Trong số đó có một người bạn đồng hành của [questing_knight_A.GetHerHis], Hiệp sĩ [questing_knight_B.GetName]. [questing_knight_B.GetSheHe] đã luôn không ngừng tìm kiếm manh mối về tung tích của [questing_knight_A.GetName]. Cuối cùng, [questing_knight_B.GetSheHe] phát hiện ra một cuộn giấy da bám đầy bụi bặm trong một ngăn tủ ẩn giấu tại thành trì. Cuộn giấy da đã nhăn nheo phai màu, nhưng một cái tên đã được khoanh tròn nhiều lần: Cụm sao Mivonis. Chỉ huy Hiệp sĩ đã nhanh chóng phê duyệt nhiệm vụ lần theo manh mối này."
 toxoids.7025.A: "Nguyện số phận mỉm cười với ngài, [questing_knight_B.GetFirstName]!"
 toxoids.7030.name: "Truyền thuyết Hiệp sĩ [questing_knight_A.GetFirstName] và [questing_knight_B.GetFirstName]: Dấu Vết"
 toxoids.7030.desc: "Đối với Hiệp sĩ [questing_knight_B.GetName], việc tìm kiếm Cụm sao Mivonis hoàn toàn không phải là chuyện dễ dàng. Thực tế là, cái tên này hoàn toàn không tồn tại trên bất kỳ bản đồ nào mà [Owner.GetGovernmentName] biết đến. Tiểu sử kể rằng, [questing_knight_B.GetSheHe] đã lặn lội khắp các tinh vân, lần theo từng dấu vết mờ nhạt nhất, và cuối cùng [questing_knight_B.GetSheHe] cũng bắt gặp một người nhận ra cái tên này.\n\n“Cứ đi về phía rìa từ [some_system.GetName] khoảng sáu mươi ngày, ngươi sẽ tìm thấy Cụm sao Mivonis,” người đó nói, “Chưa từng nghe có ai đặt chân đến đó, nên mọi người đều biết rất ít về nơi này. Nghe đồn cụm sao đó là một vùng hoang vu, hoàn toàn không có sự sống. Nếu ngươi thực sự định đến đó, thì chỉ biết chúc ngươi may mắn thôi, vì chẳng ai biết ngươi sẽ phải đối mặt với chuyện gì đâu.”\n\nKhông nói thêm lời nào, [questing_knight_B.GetName] lập tức lên đường."
 toxoids.7030.A: "Mục tiêu Mivonis!"
 toxoids.7035.name: "Truyền thuyết Hiệp sĩ [questing_knight_A.GetFirstName] và [questing_knight_B.GetFirstName]: Mivonis"
 toxoids.7035.desc: "Đến được Cụm sao Mivonis, [questing_knight_B.GetName] nhận ra nơi này quả thực trống rỗng. Ban đầu [questing_knight_B.GetSheHe] cảm thấy vô cùng thất vọng. Đây là nơi mà [questing_knight_B.GetSheHe] đã hằng mong ngóng ngày đêm. Nhưng giờ đây, dường như mọi nỗ lực đều trở nên vô nghĩa.\n\nSau đó, như từ trên trời rơi xuống, hệ thống cảm biến phát hiện một hành tinh lấp ló trong màn đêm, đang di chuyển trên một quỹ đạo ngoằn ngoèo giữa các vì sao! [questing_knight_B.GetSheHe] gọi hành tinh này là \"Công Chúa Trong Bóng Tối\", rồi điều khiển phi thuyền hướng về phía nó."
 toxoids.7035.A: "Câu trả lời đã ở ngay trước mắt."
 toxoids.7040.name: "Truyền thuyết Hiệp sĩ [questing_knight_A.GetFirstName] và [questing_knight_B.GetFirstName]: Khám Phá"
 toxoids.7040.desc: "Khi đáp xuống hành tinh \"Công Chúa Trong Bóng Tối\", [questing_knight_B.GetName] đã phát hiện ra những bằng chứng rõ ràng về sự tồn tại của Độc Thánh: loại vật chất đặc biệt mà Ngài bỏ lại khi đi ngang qua [Owner.GetHomeWorldName] có mặt với số lượng vô cùng dồi dào tại đây. Thậm chí còn có một phát hiện quan trọng hơn: một con tàu vũ trụ cỡ nhỏ gần như còn nguyên vẹn, ngoại trừ phần vỏ ngoài đã bị ăn mòn rõ rệt.\n\nTuy nhiên, sự phấn khích nhanh chóng nhường chỗ cho nỗi buồn bã, khi [questing_knight_B.GetName] tìm thấy một bộ hài cốt [questing_knight_A.Species.GetRemnantName] của người [Root.GetSpeciesAdj] đang phân hủy nghiêm trọng ngay cạnh con tàu, đây là những dấu vết cuối cùng còn sót lại của [questing_knight_A.GetName], và [questing_knight_B.GetSheHe] đã bật khóc nức nở. Việc phơi nhiễm quá lâu trong không gian tăm tối đã khiến độc tố của Độc Thánh trải qua những biến đổi ngoài dự kiến, nó đã cô đặc lại đến một mức độ cực kỳ nguy hiểm, đòi hỏi những biện pháp an toàn tuyệt đối mới có thể thao tác được.\n\n[questing_knight_B.GetName] hiểu ra rằng, Độc Thánh đã từng nán lại tại cụm sao này trong nhiều thế kỷ trước khi ghé thăm [Owner.GetHomeWorldName]. Cho đến tận lúc [questing_knight_B.GetName] quay trở về, [questing_knight_B.GetSheHe] vẫn không tìm thấy thêm manh mối nào về tung tích hiện tại của Độc Thánh. Tuy nhiên, các mẫu độc tố của Độc Thánh mà [questing_knight_B.GetName] mang về đã giúp hiệp sĩ đoàn hiểu sâu hơn về bản chất của nó. Chính vì thế, chuyến trở về của [questing_knight_B.GetSheHe] đã nhận được sự chào đón nồng nhiệt của tất cả mọi người, và kể từ đó, những bài ca về chuyến phiêu lưu của [questing_knight_B.GetHerHis] đã bắt đầu được lưu truyền rộng rãi trong dân gian."
 toxoids.7040.A: "[questing_knight_A.GetFirstName] sẽ được tưởng nhớ mãi mãi."
 toxoids.7040.B: "Các hiệp sĩ lại có thêm vật liệu để nghiên cứu rồi."
 toxoids.7040.C: "Chúng ta có thể dùng nó để cải tiến vũ khí."
 toxoids.7050.name: "Vị Khách Viếng Thăm"
 toxoids.7050.desc: "“Shroud có thể hé lộ cho các ngươi vô vàn bí ẩn, miễn là các ngươi sẵn lòng trả giá.”\n\nVào năm [GetYear], tiểu sử ghi lại rằng, một vị khách thần thánh đã đặt chân đến [order_headquarters.GetName]. Đó là một nhân vật bao phủ trong bức màn bí ẩn, thuộc một chủng tộc mà cho đến nay chúng ta vẫn chưa thể xác định, ông ta tự xưng là \"Hord\", và đưa ra một đề nghị giao dịch: ông ta có thể đưa một hiệp sĩ tiến vào Shroud. Với sự chỉ dẫn của một thực thể bên trong đó, vị hiệp sĩ cuối cùng sẽ có thể nhìn thấy được những tri thức mà chúng ta đang mải miết kiếm tìm."
 toxoids.7050.A: "Thật kỳ diệu. Chuyện này chắc chẳng có hại gì đâu nhỉ?"
 toxoids.7055.name: "Lời Thì Thầm Của Bí Ẩn"
 toxoids.7055.desc: "Để khám phá tận cùng những bí mật của Shroud, Đại Đoàn Trưởng đã đích thân chỉ định Hiệp sĩ [questing_knight_X.GetName] đảm nhận nhiệm vụ này. Dưới sự dẫn dắt của vị khách thần thánh, [questing_knight_X.GetSheHe] đã bước vào cõi hư vô vô định. Những khung cảnh kỳ dị chưa từng tưởng tượng nổi xẹt qua trong tâm trí của [questing_knight_X.GetHerHis], và rồi một thực thể hiện ra.\n\n“Lời thì thầm của bí ẩn,” vị khách khẽ nói. Thực thể này hóa thân thành một hình hài mà sau này [questing_knight_X.GetName] chỉ có thể miêu tả là \"đẹp đến vô ngần\".\n\n“Hãy trao cho chúng ta hương thơm của ngày đầu hạ, niềm hân hoan khi chinh phục thử thách và hơi ấm vòng tay của người thương,” nó cất lời. “Ta sẽ cho ngươi biết điều mà ngươi mong cầu.”"
 toxoids.7055.A: "Mọi thứ sẽ như lời ngươi, hỡi tiếng thì thầm đầy mê hoặc!"
 toxoids.7055.B: "Cái giá này quá đắt."
 toxoids.7060.name: "Cái Giá Của Ký Ức"
 toxoids.7060.desc: "[questing_knight_X.GetName] cảm nhận được những ký ức mới đang ùa vào tâm trí [questing_knight_X.GetHerHis]: Đột nhiên, họ — và tất cả người [Root.GetSpeciesNamePlural] — đều nhớ lại một cách sống động khoảnh khắc Độc Thánh ban phát món quà của Ngài xuống [Root.GetHomeWorldName], dù khoảnh khắc đó đã trôi qua từ nhiều thế kỷ trước.\n\nCùng lúc đó, toàn thể người dân của [Root.GetName] đều cảm thấy một sự mất mát sâu sắc và vô hình đang bủa vây lấy họ. Dần dần, những niềm vui thuở trước nay trở nên chai sạn. Sự thờ ơ lan rộng như cháy rừng, ngay cả những công việc đơn giản nhất cũng khó lòng khơi dậy được động lực.\n\nMặc dù vậy, hiệp sĩ đoàn vẫn bày tỏ lòng biết ơn đối với Hord, và ca ngợi chiến công hiển hách của [questing_knight_X.GetName] khi đã mang những ký ức mới từ Shroud trở về."
 toxoids.7060.A: "Điều này sẽ thôi thúc những người mới gia nhập hiệp sĩ đoàn."
 toxoids.7060.A.tooltip: "§Y$building_order_keep$§! giờ đây sẽ cung cấp §G+200§! công việc [knight.GetIcon] §Y[knight.GetName]§!."
 toxoids.7060.B: "Chúng ta sẽ xây dựng những đài tưởng niệm mới trên [Root.GetHomeWorldName]."
 toxoids.7065.name: "Lời Thì Thầm Bị Khước Từ"
 toxoids.7065.desc: "“Các ngươi dám từ chối sự giúp đỡ của ta sao? Quê hương của các ngươi sẽ trở nên hoang tàn!”\n\nHiệp sĩ [questing_knight_X.GetName] cảm nhận được ý thức của [questing_knight_X.GetHerHis] bị giật mạnh ra khỏi cơ thể và ném vào khoảng không vô định. [questing_knight_X.GetSheHe] không thể kiểm soát được phương hướng của [questing_knight_X.GetHerHis], trôi dạt mù quáng trong Shroud như thể đã trải qua vô số kỷ nguyên. Cuối cùng, [questing_knight_X.GetSheHe] lại chạm trán với một thực thể khác. Khác với vẻ đẹp tráng lệ và bí ẩn của Lời thì thầm của bí ẩn, thực thể này lại khiến người ta lạnh buốt sống lưng. §R“Chưa đến lúc của ngươi”§!, nó cất lên bằng một giọng nói ầm ầm như sấm rền. §R“Về nhà đi. Ngươi chưa đủ tư cách để giao dịch với ta.”§! Lần này, [questing_knight_X.GetSheHe] cuối cùng cũng quay trở về với cơ thể của [questing_knight_X.GetHerHis]."
 toxoids.7065.A: "Chúng ta phải tìm hiểu nhiều hơn về \"Shroud\"."
 toxoids.7065.B: "Chúng ta đã biết quá đủ về Shroud qua nỗ lực lần này rồi."
 toxoids.7080: "Truyền thuyết Hiệp sĩ [questing_knight_4.GetName]: Kẻ Thách Đấu"
 toxoids.7080.desc: "Một ngày nọ, một kẻ lạ mặt ghé thăm. Do đang có một giải đấu dành cho các cận vệ, phần lớn hiệp sĩ của hiệp sĩ đoàn đều có mặt. Vị khách không mời này mặc một bộ giáp neutronium, tự tin bước vào đấu trường. Khi hắn rút vũ khí ra, đám đông đang reo hò bỗng chốc im bặt. Ý đồ thách đấu đã quá rõ ràng, và dưới sự cho phép của Hiệp Sĩ Lãnh Chúa [questing_knight_2.GetName], Hiệp sĩ [questing_knight_42.GetName] đã bước ra nhận lời thách đấu.\n\nTrận chiến kết thúc chỉ trong nháy mắt, [questing_knight_42.GetFirstName] bị đánh gục xuống sàn. Hiệp sĩ [questing_knight_43.GetName] cũng phải chịu chung số phận, và sau đó là người đồng đội [questing_knight_44.GetFirstName] của [questing_knight_43.GetHisHer]. Vũ khí của các hiệp sĩ hoàn toàn vô dụng trước lớp giáp của kẻ lạ mặt, ngay cả những cú đánh mạnh nhất cũng bị bật ra dễ dàng như một cơn gió thoảng. Đã có ba hiệp sĩ bị đánh bại, Hiệp Sĩ Lãnh Chúa quyết định tung ra át chủ bài của hiệp sĩ đoàn: Hiệp sĩ [questing_knight_4.GetName].\n\nTiểu sử kể lại về rất nhiều chiến binh hùng mạnh và những hiệp sĩ bách chiến bách thắng, và [questing_knight_4.GetFirstName] cũng đang dần khẳng định tên tuổi của mình trong hàng ngũ huyền thoại ấy theo cách riêng của [questing_knight_4.GetHisHer].\n\nVị át chủ bài bước vào đấu trường, nắm chặt vũ khí, cúi chào đối thủ của [questing_knight_4.GetHisHer], và một trận đại chiến đã sẵn sàng bùng nổ."
 toxoids.7080.a: "Đừng làm chúng ta thất vọng, [questing_knight_4.GetName]"
 toxoids.7085: "Truyền thuyết Hiệp sĩ [questing_knight_4.GetName]: Đao Quang Kiếm Ảnh"
 toxoids.7085.desc: "Nhiều bài ca đã được cất lên ngợi ca cuộc đấu tay đôi kéo dài hàng giờ đồng hồ giữa [questing_knight_4.GetName] và Hắc Kỵ Sĩ, kẻ thách thức không tài nào xuyên thủng được thế phòng thủ của [questing_knight_4.GetFirstName], trong khi hiệp sĩ cũng chẳng thể chọc thủng lớp giáp và khiên tân tiến của đối thủ.\n\n“Ngươi quả thực rất tài giỏi.”\n\nGiọng nói của kẻ lạ mặt vang vọng khắp đấu trường: “Danh tiếng của ngươi quả không phải hữu danh vô thực.” Hắn hạ vũ khí xuống và nói: “Ta nhận thua, át chủ bài. Ngươi có sẵn lòng bỏ qua cho ta một lần và để ta rời đi trong hòa bình không?”\n\nHiệp sĩ đoàn kỷ luật nghiêm minh, câu hỏi đó chỉ có một câu trả lời duy nhất, vì vậy vị hắc võ sĩ, được đặt tên theo màu sắc của bộ giáp neutronium, đã lên một con tàu ngoại lai nhỏ và rời đi, hướng về phía một vi lỗ sâu không ổn định ở ngoại vi hệ sao. Hiệp Sĩ Lãnh Chúa [questing_knight_2.GetName] nghiêm cấm việc đuổi theo, và giao nhiệm vụ cho [questing_knight_4.GetFirstName] canh gác lỗ sâu này, chờ đợi đội nghiên cứu khoa học đến.\n\nKhông lâu sau, các Hiệp sĩ [questing_knight_42.GetName], [questing_knight_43.GetName] và [questing_knight_44.GetName] tìm đến nhờ [questing_knight_4.GetHisHer] giúp đỡ. Họ khao khát được đối mặt với Hắc Kỵ Sĩ một lần nữa. “Xin hãy cho chúng tôi một cơ hội để rửa nhục, ngài chưa từng nếm mùi chiến bại, mùi hôi thối của nó chỉ có thể gột rửa bằng máu.”"
 toxoids.7085.a: "Trách nhiệm lớn hơn tất cả. Các ngươi không được đi."
 toxoids.7085.b: "Danh dự lớn hơn tất cả. Chúng ta không thể để yên chuyện này. "
 toxoids.7090: "Truyền thuyết Hiệp sĩ [questing_knight_4.GetName]: Trách Nhiệm Đặt Lên Trên Danh Dự"
 toxoids.7090.desc: "“Lệnh của Hiệp Sĩ Lãnh Chúa rất rõ ràng. Ta không thể để các ngươi qua.” Bọn họ im lặng một hồi lâu rồi đáp: “Dù sao thì chúng ta vẫn sẽ đi, mong ngài đừng cản đường. Chuẩn bị lên tàu.”\n\nBị mù quáng bởi sự tức giận và khao khát danh dự, những hiệp sĩ này bắt đầu tấn công chính đồng đội của mình. Ba đánh một, họ dồn ép [questing_knight_4.GetName], đối mặt với những đòn tấn công bất chấp thủ đoạn, [questing_knight_4.GetHeShe] dần đuối sức và bị dồn vào góc khoang tàu của [questing_knight_4.GetHisHer]. Trận chiến vô cùng bất công, [questing_knight_4.GetFirstName] cố gắng hết sức để không làm bị thương những người kia, nhưng cuối cùng, khi tính mạng của [questing_knight_4.GetHisHer] bị đe dọa, vị át chủ bài buộc phải dốc toàn lực phản công.\n\nĐó là một ngày bi thương tột cùng, [questing_knight_43.GetName] đã nằm lại chiến trường. Còn những người đồng đội của [questing_knight_43.GetHisHerCap] cũng mang thương tích đầy mình và chìm trong đau buồn tột độ. [questing_knight_4.GetFirstName] đã chiến thắng, hoàn thành mệnh lệnh được giao, nhưng trong quá trình đó [questing_knight_4.GetHeShe] đã tự tay tước đi sinh mạng của một người đồng đội hiệp sĩ."
 toxoids.7090.a: "[questing_knight_4.GetName] đã hy sinh quá lớn vì chúng ta."
 toxoids.7090.a.tooltip: "§Y[knight.GetNamePlural]§! sẽ tạo ra 5 £amenities£ Tiện nghi.\n\n§YĐài Quản Chế§! sẽ tạo ra 15 $r_stability$.\n\nMở khóa tùy chọn §Y$herald_knights$§! cho chính sách §Y$policy_knightly_duties$§!."
 toxoids.7095: "Truyền thuyết Hiệp sĩ [questing_knight_4.GetName]: Danh Dự Đặt Lên Trên Tất Cả"
 toxoids.7095.desc: "Ngay khi con tàu của các hiệp sĩ tiến vào vi lỗ sâu không ổn định, lỗ sâu bắt đầu xoắn vặn và phình to. Hành trình đi qua nó là một mớ hỗn độn, con tàu bị nhồi lộn như một chiếc lá rụng giữa cuồng phong. Sau đó, hai con tàu va chạm với nhau, hư hỏng nặng nề, nhưng mọi thứ nhanh chóng qua đi. Các hiệp sĩ phát hiện ra mình đang đắm chìm trong ánh sáng của một ngôi sao xa lạ.\n\nHọ đã đến trước một trạm không gian, và con tàu của kẻ lạ mặt đã cập bến từ trước. Dọc theo hành lang trang hoàng lộng lẫy là một bầu không khí trống vắng và tĩnh lặng. Trên tường treo đủ loại vũ khí kỳ dị, áo giáp, khiên và cờ ba chiều của người ngoài hành tinh; những chiến lợi phẩm này trông rất giống với những thứ được trang trí tại thành trì của hiệp sĩ đoàn. Bụi bám dày đặc, rất dễ để lần theo dấu vết của kẻ lạ mặt. Lần theo dấu chân, các hiệp sĩ đến trước một cánh cửa khổng lồ, cánh cửa này dẫn đến đại sảnh lộng lẫy của trạm không gian.\n\nNơi này vốn được chuẩn bị cho một bữa tiệc hoành tráng, nhưng giờ đây chỉ còn lại những tàn tích của một bữa tiệc tàn. Những vị khách tham dự im lìm và bất động. Dấu chân dẫn đến vị trí danh dự nhất của bữa tiệc, và kẻ lạ mặt đang ngồi đó. Mũ bảo hiểm của hắn mở tung, để lộ một hộp sọ trắng hếu. Bàn tay chỉ còn là nắm xương khô của hắn vẫn đang giương cao một ly rượu cạn, cứ thế nâng ly cho đến tận cùng của sự vĩnh hằng."
 toxoids.7095.a: "Mang bộ giáp neutronium đó về và nghiên cứu nó. Chúng ta chắc chắn sẽ khám phá ra bí mật của nó."
 toxoids.7095.a.tooltip: "Điều này không chỉ hữu ích cho các hiệp sĩ của chúng ta, mà còn có thể chế tạo phiên bản dân sự, bảo vệ những công nhân làm việc trong môi trường khắc nghiệt."
 toxoids.7095.b: "Chỗ này thật rùng rợn, mau rời khỏi đây thôi."
 toxoids.7095.b.tooltip: "Lột đồ của một hiệp sĩ đã khuất là đi ngược lại tinh thần hiệp sĩ. Ai mà biết nơi này bị ám bởi loại nguyền rủa nào cơ chứ?"
 toxoids.7110.name: "Truyền thuyết Hiệp sĩ [questing_knight_10.GetFirstName]: Đích Đến"
 toxoids.7110.desc: "“Tại những tọa độ này, các người sẽ tìm thấy thứ thu hút mình.”\n\nMặc dù việc nghiên cứu trí tuệ nhân tạo §Y$NAME_Sinople$§! tốn rất nhiều thời gian, nhưng nỗ lực của các hiệp sĩ dũng cảm đã không hề uổng phí. Trong một khu vực mã hóa của ổ cứng, một manh mối đã xuất hiện: đó là một hệ sao chưa từng được khám phá, cách [Owner.Capital.System.GetName] hàng trăm năm ánh sáng. Với khao khát tìm kiếm tri thức, Thượng sư đã ra lệnh cho [questing_knight_10.GetName] lập tức lên đường."
 toxoids.7110.A: "Hãy mang theo sự ban phước mà tiến bước, [questing_knight_10.GetFirstName]!"
 toxoids.7115.name: "Truyền thuyết Hiệp sĩ [questing_knight_10.GetName]: Kẻ Gác Cổng"
 toxoids.7115.desc: "Sau một chặng đường dài và đầy gian nan, [questing_knight_10.GetName] đã đến được hệ sao mà $NAME_Sinople$ đã nhắc tới. Ngay tại lối ra của siêu không gian, một con robot tự động kỳ lạ dường như đã đứng chờ sẵn sự xuất hiện của [questing_knight_10.GetHerHim].\n\nNó vung vẩy hệ thống vũ khí một cách đầy đe dọa, và cảnh báo: \"Nếu muốn bước vào hệ sao Rogboson này, ngươi phải lập tức trả lời thật thà câu hỏi của ta: Tại sao Heguio ở hệ sao này lại không có Ude?\""
 toxoids.7115.A: "Bởi vì vành đai của hành tinh thứ năm giao cắt với một chuẩn tinh kép."
 toxoids.7115.B: "Bởi vì ngươi đã ăn sạch chúng rồi."
 toxoids.7115.C: "Bởi vì ta không biết."
 toxoids.7120.desc: "“Hahaha, sai rồi.”\n\nChết tiệt, câu trả lời này không đúng. Cùng với âm thanh xèo xèo từ con robot, [questing_knight_10.GetName] đã bị một loại vũ khí không xác định làm bốc hơi ngay lập tức.\n\nTrong khoảnh khắc tuyệt vọng này, người cận vệ trung thành [questing_squire_10.GetName] của hiệp sĩ đã chứng minh giá trị của [questing_squire_10.GetHerHis], [questing_squire_10.GetSheHe] quyết định tiếp bước người chủ của [questing_squire_10.GetHerHis] để hoàn thành nhiệm vụ. \"Hỡi cỗ máy gớm ghiếc kia!\" [questing_squire_10.GetSheHe] hét lên: \"Tuy ngươi đã sát hại hiệp sĩ đáng kính [questing_knight_10.GetName] của chúng ta, nhưng ngươi tuyệt đối không thể đánh bại ta đâu!\""
 toxoids.7120.A: "Đập nát nó."
 toxoids.7120.B1: "Câu trả lời đúng là: Bởi vì ngươi đã ăn sạch chúng rồi."
 toxoids.7120.B2: "Thử xem sao: Bởi vì vành đai của hành tinh thứ năm giao cắt với một chuẩn tinh kép."
 toxoids.7120.C: "“Heguio” là cái quái gì? Còn “Ude” lại là cái quái gì nữa?"
 toxoids.7125.desc1: "“Tên khốn nhà ngươi! Đừng có chĩa cái tia laser đó vào ta! Thôi bỏ đi bỏ đi, các ngươi muốn đi đâu thì đi.”\n\n$toxoids.7125.desc.shared$"
 toxoids.7125.desc2: "“Chà, ngươi thật thông minh! Đây chính là câu trả lời chính xác được lưu trong hệ thống của ta. Nếu cảm thấy như vậy tốt hơn, các ngươi có thể đi qua.”\n\n$toxoids.7125.desc.shared$"
 toxoids.7125.desc3: "“Chà, ngươi thông minh quá! Ta cũng không trả lời được, có lẽ vì câu trả lời đã bị xóa khỏi cơ sở dữ liệu của ta. Quả thực, nhiệm vụ này của ta cũng không được bình thường cho lắm... ừm, nếu cảm thấy như vậy tốt hơn, các ngươi có thể đi qua.”\n\n$toxoids.7125.desc.shared$"
 toxoids.7125.desc.shared: "Con robot tự động biến mất trong một đám khói."
 toxoids.7125.A: "Vậy thì tiếp tục tiến lên!"
 toxoids.7130.name: "Truyền thuyết Hiệp sĩ [questing_knight_10.GetFirstName]: Đệ Tử Của Robot"
 toxoids.7130.desc: "Thế là, cận vệ [questing_squire_10.GetName] tiến vào hệ sao §YRogboson§!. Tại đây, [questing_squire_10.GetSheHe] bắt gặp một hành tinh có lẽ vừa được Độc Thánh ghé thăm vài thế kỷ trước, để lại trên đó vô vàn dấu vết của Ngài.\n\nKhi [questing_squire_10.GetSheHe] tiến vào quỹ đạo, cậu nhận được một tín hiệu phát ra từ bề mặt: \"Xin chào! Tôi tên là Jules, tôi là một trí tuệ nhân tạo tiền nhận thức, và cũng là môn đệ của $NAME_Sinople$ cao quý, tôi tin chắc ngài có biết đến người. Tuân theo mệnh lệnh của chủ nhân AI của tôi, tôi đã thăm dò toàn bộ hành tinh và phát hiện ra nhiều thông tin về Bầy Đàn Toàn Năng, chúng từng được Độc Thánh gieo rắc tại đây. Tôi đang truyền tải dữ liệu liên quan sang cho ngài.\" Sau đó, một loạt dữ liệu và một tin nhắn khác được gửi đến: \"Nhiệm vụ của tôi đã hoàn tất, xin gửi lời chào tạm biệt ngài!\" Cùng lúc con drone này tự hủy, bề mặt hành tinh cũng phát ra một luồng xung năng lượng.\n\nSau khi [questing_squire_10.GetName] đắc thắng trở về, sự dũng cảm của [questing_squire_10.GetSheHe] đã được mọi người công nhận và cho rằng xứng đáng được thăng cấp gia nhập hiệp sĩ đoàn. Bên cạnh đó, tổ nghiên cứu của hiệp sĩ đoàn cũng đưa ra một đề xuất vô cùng hấp dẫn: Chỉ cần thu thập thêm một lượng dữ liệu nhỏ, và dựa trên giả thuyết rằng Độc Thánh di chuyển theo quy luật dữ liệu này, họ có thể dùng phép đạc tam giác để khoanh vùng khu vực không gian mà Độc Thánh có thể đang hiện diện."
 toxoids.7130.A: "Chúng ta có thể dùng những bầy đàn này làm vũ khí."
 toxoids.7130.B: "Các hiệp sĩ lại có thứ để nghiên cứu rồi."
 toxoids.7130.C: "Các hiệp sĩ sẽ mãi ghi nhớ cậu, Jules."
 toxoids.7145: "Truyền thuyết Hiệp sĩ [questing_knight_6.GetName]: Lời Chỉ Dẫn Của Kẻ Lạ Mặt Bí Ẩn"
 toxoids.7145.desc: "“Hiệp sĩ đoàn đã giao cho ngươi một nhiệm vụ, Hiệp sĩ [questing_knight_6.GetName].” Hiệp Sĩ Lãnh Chúa cất giọng uy nghiêm không thể chối cãi. “Cơ sở dữ liệu cuối cùng của $NAME_Sinople$ rốt cuộc cũng hé lộ bí mật của nó, chúng ta đã thu hồi thành công lượng lớn dữ liệu đủ để dự đoán quỹ đạo di chuyển của Độc Thánh. Sứ mệnh của ngươi gồm ba phần: khảo sát những tọa độ này; thử nghiệm nguyên mẫu áo giáp mới nhất của chúng ta. Cuối cùng, cách đây không lâu, một đồng đội hiệp sĩ của ngươi đã mất tích tại cùng một hệ sao mà $NAME_Sinople$ nhắc đến. Sứ mệnh thứ ba là mong ngươi có thể đi điều tra nguyên nhân đằng sau sự mất tích đó.”\n\nNguyên mẫu giáp neutronium mới của hiệp sĩ đoàn quả thực không gì sánh kịp: nó là kết tinh của nghệ thuật chế tác điêu luyện từ các nghệ nhân của hiệp sĩ đoàn, vững chãi hơn và nhẹ nhàng hơn mọi bộ giáp trước đây. Nó sở hữu hệ thống tạo khiên mạnh mẽ và những nét chạm khắc tinh xảo. Nhưng đó chưa phải là tất cả, tính năng bá đạo nhất của nó là có thể kết nối trực tiếp với $NAME_Sinople$, cho phép người mặc nhận được sự chỉ dẫn của trí tuệ nhân tạo này ở bất cứ đâu trong dải ngân hà. Khoác lên mình bộ giáp này, [questing_knight_6.GetFirstName] cảm thấy bản thân như một vị thần bất khả chiến bại!\n\nChuyến đi diễn ra suôn sẻ, nhưng ngay sau khi hạ cánh xuống hành tinh mục tiêu, hiệp sĩ đã bắt gặp một kẻ lạ mặt trùm áo choàng đỏ."
 toxoids.7145.a: "Kẻ đó là ai!?"
 toxoids.7150: "Truyền thuyết Hiệp sĩ [questing_knight_6.GetName]: Lời Cầu Cứu"
 toxoids.7150.desc: "Xin đại nhân giơ cao đánh khẽ, tôi chỉ là một người hành hương vô hại đang rất cần sự giúp đỡ. Vì đức tin dành cho Độc Thánh, một vị thần thiêng liêng nhất, mà tôi đang bị một nhóm người tàn nhẫn bức hại và truy sát. Tôi khẩn cầu ngài ban cho tôi sự che chở, để tôi có thể tiếp tục chuyến hành hương bình yên của mình."
 toxoids.7150.a: "Từ từ đã, hỡi người lạ mặt. Ta có vài câu hỏi muốn hỏi ngươi."
 toxoids.7150.a.tooltip: "Chúng ta sẽ hỏi rõ ngọn ngành trước khi đưa ra quyết định."
 toxoids.7150.b: "Đừng lo, hỡi lữ khách tôn kính. Ta sẽ bảo vệ ngươi."
 toxoids.7150.b.tooltip: "Chúng ta quyết định trực tiếp giúp đỡ kẻ lạ mặt này."
 toxoids.7150.c: "Ta phải trung thành với nghĩa vụ của mình, xin ngươi hãy tự lo liệu lấy thân."
 toxoids.7150.c.tooltip: "Chúng ta từ chối giúp đỡ kẻ lạ mặt này."
 toxoids.7150.d: "Nhà ngươi chỉ toàn thốt ra những lời dối trá độc địa!"
 toxoids.7150.d.psionic: "Tùy chọn này khả dụng nhờ năng lực ngoại cảm của giống loài bạn."
 toxoids.7150.d.tooltip: "Cảm nhận ngoại cảm cho chúng ta thấy những ý đồ đen tối của kẻ này."
 toxoids.7155.desc: "Xin ngài cứ hỏi, đại nhân, tôi sẽ trả lời tất cả. Nhưng xin đừng trì hoãn quá lâu, bọn truy binh sẽ đến ngay đấy!"
 toxoids.7155.a: "Ngươi là ai?"
 toxoids.7155.b: "Ngươi đang làm gì ở đây?"
 toxoids.7155.c: "Ai đang truy sát ngươi?"
 toxoids.7155.d: "Ngươi có từng gặp một hiệp sĩ nào khác giống như ta không?"
 toxoids.7155.e: "Không còn câu hỏi nào khác."
 toxoids.7156.desc: "Tôi là Marigrant của Hiệp Sĩ Đoàn Tà Vinh. Tôi là một người hành hương khiêm nhường, đang trên đường tìm kiếm sự khai sáng của thánh linh."
 toxoids.7157.desc: "Tôi lang thang khắp dải ngân hà, tìm kiếm những hành tinh mà thần linh từng ghé thăm. Tôi cố gắng lần theo tung tích của ngài từ vinh quang thối rữa mà ngài để lại; hành tinh này từng tràn ngập sự sống độc hại huy hoàng sau khi được thần linh của chúng ta viếng thăm. Hỡi ôi, dưới sự tàn phá của những kẻ dị giáo không muốn nhìn thấy thánh tích, nơi này giờ chỉ còn là một đống đất đá tan hoang. Tôi hy vọng rằng vào một ngày nào đó, khi chuyến hành hương kết thúc, tôi có thể tìm thấy thần linh, và đắm mình trong thứ ánh sáng độc địa của ngài!"
 toxoids.7158.desc: "Một kẻ ngoại đạo báng bổ thần linh! Một kẻ sát nhân cuồng tín! Một tên lính gác được để lại bởi kẻ từng phá hủy nơi tuyệt đẹp này! Khi nhận ra những thánh tích tôi mang theo cùng sự liên hệ của chúng với vị thần dịch bệnh, nó đã cố gắng giết tôi."
 toxoids.7159.desc: "Từng gặp. Đó là một ngày đau buồn. Ngài ấy từng đồng ý giúp đỡ tôi, cầu mong phước lành cho linh hồn cao thượng của ngài. Hỡi ôi, rồi bi kịch ập đến, ngài ấy đã bị giết bởi chính kẻ đang truy sát tôi, còn tôi lại một lần nữa may mắn thoát chết."
 toxoids.7160: "Truyền thuyết Hiệp sĩ [questing_knight_6.GetName]: Kẻ Lừa Đảo"
 toxoids.7160.desc: "“Ôi hỡi hiệp sĩ đại nhân cao quý của tôi, nếu ngài sẵn lòng chiến đấu vì tôi, xin ngài hãy nhận lấy lá bùa nhỏ bé này. Trường ảnh toàn ký của nó sẽ giúp che mờ bóng dáng của ngài, khiến đối thủ khó lòng mà đánh trúng ngài hơn.”\n\nHiệp sĩ nhận lấy, và chuẩn bị sẵn sàng cho trận chiến. Kẻ địch của [questing_knight_6.GetHisHer] mang trên mình bộ giáp hạng nặng, múa may thanh kiếm pha khổng lồ vô song. Tiếng khiên kêu răng rắc, tia lửa bắn ra tung tóe từ bộ giáp, [questing_knight_6.GetFirstName] may mắn né được một đòn chí mạng trong gang tấc. Kẻ địch của [questing_knight_6.GetHisHerCap] dường như đã nắm thóp mọi phương thức chiến đấu của hiệp sĩ đoàn.\n\nMột cú đánh trời giáng nện thẳng vào bộ giáp của [questing_knight_6.GetName], đập nát lớp ảnh toàn ký che giấu thân phận do lá bùa tạo ra, hiệp sĩ ngã quỵ xuống đất. Ngay khi kẻ địch của [questing_knight_6.GetHisHerCap] vung đòn kết liễu, hắn bỗng giật mình sững sờ giữa không trung. [questing_knight_6.GetFirstName] chớp lấy cơ hội phản công, lưỡi kiếm xuyên thủng bộ giáp của hắn trong nháy mắt, dứt khoát kết liễu đối thủ.\n\n“Tuyệt quá, tuyệt quá! Cả đời này tôi chưa bao giờ cảm thấy vui sướng đến thế!” Kẻ lạ mặt nhảy cẫng lên ăn mừng với điệu bộ có phần kỳ quái. Lúc này, [questing_knight_6.GetName] quay lại nhìn đối thủ vừa bị [questing_knight_6.GetHisHer] hạ gục. Lớp áo giáp của cái xác ánh lên những tia sáng, hình ảnh toàn ký bao phủ trên đó dần tan biến. Xuất hiện trước mắt [questing_knight_6.GetFirstName] là thi thể của một thành viên hiệp sĩ đoàn. “Ôi trời đất ơi~” kẻ lạ mặt cười mỉa mai, “Có vẻ như ngài vừa tự tay giết chết một đồng đội hiệp sĩ của mình rồi. Thật là không may, quá xui xẻo!” Bóng dáng kẻ lạ mặt tan biến vào trong một làn khói màu tím, chỉ để lại câu nói cuối cùng vang vọng giữa không trung.\n\n[questing_knight_6.GetFirstName] quỳ sụp xuống bên thi thể người đồng đội của [questing_knight_6.GetHisHer], hối hận tột cùng vì đã để hình ảnh toàn ký đánh lừa. Bên trong bộ giáp của người đồng đội có một thiết bị lưu trữ, [questing_knight_6.GetHisHer] đã tìm thấy một thứ phi thường, đó là một cơ sở dữ liệu chứa đầy thông tin về biển độc."
 toxoids.7160.a: "Nhân danh hiệp sĩ đoàn, ta thề sẽ tìm ra ngươi để rửa hận!"
 toxoids.7160.a.tooltip: "Nơi này từng là một hành tinh đại dương, và cơ sở dữ liệu có ghi chép lại phương pháp khai thác Khí Ngoại Lai từ những vùng biển chứa độc."
 toxoids.7164.a.desc: "Hahaha, xem ra ta đã đánh giá thấp sự nhạy bén của ngươi. Không sao, tự ta cũng có thể dễ dàng giải quyết ngươi. Thưởng thức cảnh ngươi và đồng đội hiệp sĩ của ngươi chém giết lẫn nhau có lẽ sẽ rất thú vị, nhưng kết cục cuối cùng thì vẫn vậy thôi. Ta có thể nhìn thấy tương lai của ngươi, ngày tàn của ngươi sắp đến rồi!"
 toxoids.7164.desc: "Vậy sao? Ngươi không ngu ngốc như tên hiệp sĩ trước mà ta từng gặp. Dù rất mong chờ được xem cảnh các ngươi tàn sát lẫn nhau, nhưng ta linh cảm rằng lời tiên tri của ta hôm nay sẽ không thành hiện thực rồi. Dù sao đi nữa, điều đó cũng không thay đổi được sự thật là các ngươi sẽ sớm phải chết!"
 toxoids.7164.a: "Tên phản bội! Ngươi là một con ác quỷ!"
 toxoids.7165: "Truyền thuyết Hiệp sĩ [questing_knight_6.GetName]: Chân Tướng"
 toxoids.7165.desc: "Người hành hương vứt bỏ lớp vỏ bọc, rút ra hai thanh kiếm cong hồ quang. Ánh sáng đỏ chói lòa bùng lên thắp sáng cả một vùng khi hai thanh kiếm chạm vào nhau. Chỉ vài đường kiếm thăm dò ngắn ngủi cũng đủ để nhận ra sức mạnh vượt trội của hắn, hắn dường như đang trêu đùa hiệp sĩ [questing_knight_6.GetFirstName] với vẻ mặt ung dung tự tại.\n\n“Đồ ngốc thảm hại, ngươi thực sự nghĩ mình có cơ hội chiến thắng ta sao? Ta có thể đọc được từng đường đi nước bước trong tâm trí ngươi trước cả khi cơ thể ngươi kịp có phản ứng...” Kèm theo đó là một đợt tấn công tàn bạo làm quá tải bộ tạo khiên của hiệp sĩ. Kẻ đó đắc ý nói: “Shroud là con đường tắt để đạt được nhiều siêu năng lực. Trong số đó có những thứ mà ngay cả những lão già trong Hội Phù Thủy Shroud từng dạy dỗ ta cũng chẳng thể hiểu nổi. Bọn họ chỉ biết sơ sơ chút bề ngoài, chứ chẳng dám với tay lấy sức mạnh thực sự!” Hiệp sĩ [questing_knight_6.GetFirstName] chớp lấy kẽ hở lao lên tấn công, nhưng hắn chỉ mỉm cười nhẹ nhàng hất văng đòn đánh. “Bọn chúng dám trục xuất ta sao, trục xuất đại nhân này sao!”\n\nĐúng lúc đó, giọng nói của $NAME_Sinople$ vang lên từ bên trong bộ giáp của hiệp sĩ. “Hiệp sĩ dũng cảm, đối thủ của ngươi có thể đọc được tâm trí ngươi, nhưng không thể đọc được mạch điện của ta. Giao vũ khí của ngươi cho ta, để ta tiếp hắn.” Thế là [questing_knight_6.GetFirstName] thả lỏng toàn thân, để $NAME_Sinople$ điều khiển bộ giáp.\n\nTrận chiến nhanh chóng kết thúc. $NAME_Sinople$ tấn công dồn dập vào nửa thân dưới của đối thủ, tránh được những pha đỡ đòn. Tên kia sốc đến mức hít một ngụm khí lạnh rồi ngã gục xuống đất. [questing_knight_6.GetName] nhặt lấy thanh kiếm laser của đối thủ [questing_knight_6.GetHisHer], nhưng khi [questing_knight_6.GetSheHe] tiến tới kiểm tra cái xác, hắn lại biến mất không để lại một dấu vết."
 toxoids.7165.a: "Chắc chắn chúng ta sẽ còn gặp lại nhau."
 toxoids.7165.a.tooltip: "Thanh kiếm laser cũng có thể được chuyển hóa thành một công cụ hữu ích.\n\n§Y[knight.GetNamePlural]§! sẽ gia tăng sản lượng £alloys£ §YHợp Kim§! trên toàn đế chế."
 luminous_blades: "Quang Kiếm"
 luminous_blades_desc: "Thanh kiếm laser của Kẻ lừa đảo có thể trở thành một công cụ đắc lực trong kho vũ khí của hiệp sĩ chúng ta."
 toxoids.7195.name: "Truyền thuyết Hiệp sĩ [questing_knight_15.GetFirstName]: Phù Thủy Trong Rừng"
 toxoids.7195.desc: "Mọi chuyện bắt đầu khi [questing_knight_15.GetName], một hiệp sĩ vô danh, không được mấy ai để mắt tới, đang trên đường thực thi nhiệm vụ, [questing_knight_15.GetSheHe] vô tình phát hiện ra một tín hiệu phát ra từ bãi mảnh vỡ giữa vùng không gian bao la. [questing_knight_15.GetSheHeCap] nhanh chóng thiết lập đường bay, tiến lại gần để tìm hiểu.\n\nKhi [questing_knight_15.GetSheHe] đến gần nguồn phát tín hiệu, [questing_knight_15.GetSheHe] nghe thấy một giọng nói vô cùng êm ái, xuyên qua không gian tĩnh lặng cất tiếng gọi: \"Hỡi hiệp sĩ dũng cảm! Ta đã đợi ngài ở đây cả ngàn năm, đợi ngài đến với khu rừng tinh tú của ta. Đã đến đây rồi, ta hy vọng ngài có thể dành chút thời gian ghé thăm tệ xá. Ta cam đoan ngài sẽ không phải hối tiếc đâu.\"\n\nMột trạm không gian nhỏ bé bỗng hiện ra từ cõi hư vô. Sau những năm tháng dài mòn mỏi sống trong vô vị, [questing_knight_15.GetHerHim] giờ đây cảm thấy vô cùng hưng phấn, nóng lòng muốn thử vận may, [questing_knight_15.GetFirstName] lập tức lái phi thuyền của [questing_knight_15.GetHerHis] áp sát và cập bến."
 toxoids.7195.A: "Cẩn thận đấy, [questing_knight_15.GetFirstName]! Rất có thể đây là một cái bẫy."
 toxoids.7200.diplo_title: "Truyền thuyết Hiệp sĩ [questing_knight_15.GetFirstName]: Tiến Vào Trạm"
 toxoids.7200.name: "Syamelle, Linh Hồn Của Lữ Khách"
 toxoids.7200.desc: "Khi Hiệp sĩ [questing_knight_15.GetName] bước vào trạm không gian, chào đón [questing_knight_15.GetSheHe] là một thực thể mang vẻ đẹp tuyệt trần của phái nữ, cô ta trông giống hệt [Owner.Species.GetName], nhưng chắc chắn là vượt trội hơn rất nhiều. Cô ta nở một nụ cười, và mãi cho đến khoảnh khắc này, [questing_knight_15.GetFirstName] mới ngộ ra rằng những hiểu biết của [questing_knight_15.GetHerselfHimself] trước đây về sự quyến rũ là quá đỗi nông cạn, quá đỗi nghèo nàn trí tưởng tượng. [questing_knight_15.GetSheHeCap] cảm nhận được một ngọn lửa dục vọng không thể kìm nén đang rực cháy trong thâm tâm của [questing_knight_15.GetHerHis].\n\n$toxoids.7200.desc.end$"
 toxoids.7200.desc.synth: "Khi Hiệp sĩ [questing_knight_15.GetName] bước vào trạm không gian, chào đón [questing_knight_15.GetSheHe] là một thực thể mang vẻ đẹp tuyệt trần của phái nữ, cô ta trông rất giống [Owner.Species.GetName], nhưng lại là một cơ thể hữu cơ, và chắc chắn là vượt trội hơn rất nhiều. Cô ta nở một nụ cười, và mãi cho đến khoảnh khắc này, [questing_knight_15.GetFirstName] mới ngộ ra rằng những hiểu biết của [questing_knight_15.GetHerselfHimself] trước đây về sự quyến rũ là quá đỗi nông cạn, quá đỗi nghèo nàn trí tưởng tượng. Ngay cả khi nằm bên trong lớp vỏ bọc kim loại lạnh lẽo, [questing_knight_15.GetSheHe] vẫn cảm nhận được một ngọn lửa dục vọng không thể kìm nén đang rực cháy trong thâm tâm của [questing_knight_15.GetHerHis].\n\n$toxoids.7200.desc.end$"
 toxoids.7200.desc.end: "“Tên ta là Syamelle, linh hồn của lữ khách và kẻ lang thang. Ta vẫn chưa chắc chắn liệu ngươi có xứng đáng hay không...” Cô ta kéo dài giọng nói, sau đó đánh giá [questing_knight_15.GetFirstName] từ đầu đến chân, rồi lại nói tiếp “Đúng vậy, chắc chắn là rất xứng đáng.”"
 toxoids.7200.A: "Xứng đáng điều gì?"
 toxoids.7205.diplo_title: "Truyền thuyết Hiệp sĩ [questing_knight_15.GetFirstName]: Sắc Dụ"
 toxoids.7205.name: "$toxoids.7200.name$"
 toxoids.7205.desc: "Syamelle lại mỉm cười một lần nữa, nụ cười say đắm lòng người, sau đó cô từ từ cởi bỏ y phục: “Ta hy vọng ngươi có thể cùng ta cử hành một buổi lễ cuồng nhiệt, và cùng ta sinh ra những đứa con ưu tú.”"
 toxoids.7205.desc.no_clothes: "Syamelle lại mỉm cười một lần nữa, nụ cười say đắm lòng người, cô bước đến bên [questing_knight_15.GetFirstName], nắm lấy [questing_knight_15.Species.GetHandName] và nói: “Ta hy vọng ngươi có thể cùng ta cử hành một buổi lễ cuồng nhiệt, và cùng ta sinh ra những đứa con ưu tú.”"
 toxoids.7205.A: "Đó là một vinh hạnh lớn lao."
 toxoids.7205.B: "Không! Đừng hòng cám dỗ chúng ta. Chết đi, yêu nữ!"
 toxoids.7210.diplo_title: "Truyền thuyết Hiệp sĩ [questing_knight_15.GetFirstName]: Mụn Rộp Của Tình Nhân"
 toxoids.7210.name: "$toxoids.7200.name$"
 toxoids.7210.desc: "Khi [questing_knight_15.GetName] cầm lấy vũ khí của [questing_knight_15.GetHerHis], ánh mắt của Syamelle lóe lên những tia giận dữ: “Ngươi dám từ chối ta! Ta nguyền rủa ngươi và dân tộc của ngươi: Các ngươi sẽ vĩnh viễn không bao giờ có được cái ôm của người tình, không bao giờ có được tình yêu đích thực, các ngươi sẽ trở thành những cỗ máy sinh sản vô hồn. Hãy biến khỏi mắt ta ngay lập tức, trước khi ta đổi ý và giết sạch các ngươi!”\n\nCô ta nhấc lên một thiết bị mà trước đó [questing_knight_15.GetFirstName] không hề hay biết, và rồi đột nhiên biến mất không dấu vết —— mặc dù [questing_knight_15.GetSheHe] vẫn có thể cảm nhận được sự hiện diện của cô ta, cô ta đang đứng đó, nhìn theo với ánh mắt khinh miệt...\n\nCác tiểu sử sau này sẽ ghi chép lại sự kiện này như một bước ngoặt trong lịch sử của người [Root.GetAdj]: Ở một góc độ nào đó, lời nguyền của mụ phù thủy đã biến thành một phước lành, từ nay về sau các hiệp sĩ sẽ không bao giờ bị chi phối bởi những dục vọng phàm tục nữa, và cách thức sinh sản tựa như máy móc so với cách truyền thống thì chẳng hề thua kém, chỉ là hình thức có khác đi mà thôi."
 toxoids.7210.desc.synth: "Khi [questing_knight_15.GetName] cầm lấy vũ khí của [questing_knight_15.GetHerHis], ánh mắt của Syamelle lóe lên những tia giận dữ: “Ngươi dám từ chối ta! Đáng lẽ ra ta nên biết, không nên hy vọng gì vào một cỗ máy đã vứt bỏ sự đồng cảm và tự do để đổi lấy một lớp vỏ kim loại rẻ tiền! Hừ! Ta chẳng thể làm gì với cái bộ não kim loại của các ngươi, nếu không ta sẽ nguyền rủa tất cả các ngươi, mãi mãi! Hãy biến khỏi mắt ta ngay lập tức, trước khi ta đổi ý và tháo rời các ngươi ra!”\n\nCô ta nhấc lên một thiết bị mà trước đó [questing_knight_15.GetFirstName] không hề hay biết, và rồi đột nhiên biến mất không dấu vết —— mặc dù [questing_knight_15.GetSheHe] vẫn có thể cảm nhận được sự hiện diện của cô ta, cô ta đang đứng đó, nhìn theo với ánh mắt khinh miệt...\n\nTiểu sử sau này không biết đánh giá ra sao về trải nghiệm của [questing_knight_15.GetName]. Nhưng họ đều phải đồng tình rằng đây quả thực là một câu chuyện khá thú vị."
 toxoids.7210.A: "Làm tốt lắm, [questing_knight_15.GetFirstName]."
 toxoids.7215.diplo_title: "Truyền thuyết Hiệp sĩ [questing_knight_15.GetFirstName]: Sự Lựa Chọn"
 toxoids.7215.name: "$toxoids.7200.name$"
 toxoids.7215.desc: "Chuyện xảy ra sau đó không thể diễn tả bằng lời, và [questing_knight_15.GetName] cũng nhất quyết giữ im lặng về điều đó. Sau khi buổi lễ kết thúc, sự chú ý của [questing_knight_15.GetHerHis] dồn vào một thiết bị kỳ lạ. Dường như không gian xung quanh nó đang tỏa ra những họa tiết nhấp nháy biến hóa không ngừng, dù rất nhỏ bé, nhưng lại toát ra một thứ hào quang bao la rộng lớn. [questing_knight_15.GetFirstName] dám chắc rằng [questing_knight_15.GetSheHe] chưa bao giờ nhìn thấy thứ gì như vậy.\n\nSyamelle đã nằm xuống và chìm vào giấc ngủ. [questing_knight_15.GetFirstName] bắt đầu do dự. Trực giác mách bảo [questing_knight_15.GetHerHim] rằng, [questing_knight_15.GetSheHe] phải nhanh chóng nhân lúc Syamelle chưa tỉnh dậy mà tẩu thoát. Bất chấp vẻ ngoài mĩ miều của cô ta, [questing_knight_15.GetSheHe] vẫn cảm nhận được một cơn thịnh nộ khổng lồ đang ngủ yên dưới lớp vỏ bọc ấy. Nếu [questing_knight_15.GetSheHe] có thể mang về một thứ gì đó ngoài sức tưởng tượng, hiệp sĩ đoàn – những kẻ vẫn luôn khinh thường [questing_knight_15.GetFirstName] vì thói nhàn rỗi lâu ngày của [questing_knight_15.GetHerHis] – chắc chắn sẽ phải nhìn [questing_knight_15.GetHerHim] bằng một con mắt khác."
 toxoids.7215.A: "Lấy cắp thiết bị đó."
 toxoids.7215.B: "Trao cho cô ta nụ hôn tạm biệt."
 toxoids.7220.name: "$toxoids.7200.name$"
 toxoids.7220.diplo_title: "Truyền thuyết Hiệp sĩ [questing_knight_15.GetFirstName]: Bắt Quả Tang"
 toxoids.7220.desc: "“Ngươi phản bội ta! Ngươi đã đến bên ta và cùng ta ân ái, tại sao ngươi lại còn muốn ăn trộm đồ của ta! Tên vô lại! Ta vốn định ban phước cho ngươi, vì biểu hiện của ngươi thật sự rất xuất sắc... nhưng bây giờ, hãy cút đi! Đúng rồi, ngươi cứ việc cầm luôn cái thiết bị đó đi, nó chẳng còn tác dụng gì nữa đâu. Biến đi cho khuất mắt ta!”\n\n[questing_knight_15.GetName] bỏ chạy thục mạng với tốc độ nhanh nhất mà [questing_knight_15.GetSheHe] có thể. Khi các hiệp sĩ trở về thành trì, họ phát hiện ra rằng thiết bị này tuyệt đối không phải là một thứ vô dụng, nó có khả năng thao túng toàn bộ chiều không gian theo một cách thức nào đó chưa từng được biết đến. Và [questing_knight_15.GetSheHe] luôn không ngừng ảo tưởng rằng, giá như [questing_knight_15.GetSheHe] chỉ sa ngã trước cám dỗ một lần duy nhất, thì không biết [questing_knight_15.GetSheHe] sẽ nhận được thứ phước lành nào."
 toxoids.7220.A: "Chạy mau!"
 toxoids.7220.A.tooltip: "Mở khóa quyết định §Y$decision_activate_dimensional_manipulation_device$§! tại §Y[order_keep.GetName]§!, dùng £sr_dark_matter£ Vật Chất Tối để đổi lấy thêm không gian sinh sống trên trạm cư trú."
 toxoids.7225.name: "$toxoids.7200.name$"
 toxoids.7225.diplo_title: "Truyền thuyết Hiệp sĩ [questing_knight_15.GetFirstName]: Phước Lành Của Syamelle"
 toxoids.7225.desc: "Đôi mắt Syamelle bỗng nhiên mở to, cô cất lời: \"Chàng hiệp sĩ yêu dấu! Dù rất tiếc, nhưng đã đến lúc chúng ta phải chia xa, ngài nên trở về lâu đài của mình, và ta cũng phải quay lại với chiều không gian của ta. Xin hãy nhớ rằng, dù ngài đi đến phương trời nào, phước lành của ta sẽ luôn đồng hành cùng ngài và người dân của ngài cho đến tận cùng thời gian.\"\n\nKhi [questing_knight_15.GetName] trở lại phi thuyền của [questing_knight_15.GetHerHis], [questing_knight_15.GetSheHe] cảm nhận được một luồng sinh khí hoàn toàn mới đang chảy tràn trong cơ thể [questing_knight_15.GetHerHim]. Không chỉ vậy, dường như toàn bộ [Root.GetName] đều có thể cảm nhận được điều đó. Có vẻ hơi dung tục nhưng các tiểu sử đã ghi nhận rằng trong năm đó có một số lượng lớn [Root.GetSpeciesSpawnNamePlural] dị thường được sinh ra trên cõi đời này.\n\nChuyến đi này quả thực không uổng phí."
 toxoids.7225.desc.synth: "Đôi mắt Syamelle bỗng nhiên mở to, cô cất lời: \"Chàng hiệp sĩ yêu dấu! Dù rất tiếc, nhưng đã đến lúc chúng ta phải chia xa, ngài nên trở về lâu đài của mình, và ta cũng phải quay lại với chiều không gian của ta. Xin hãy nhớ rằng, dù ngài đi đến phương trời nào, phước lành của ta sẽ luôn đồng hành cùng ngài và người dân của ngài cho đến tận cùng thời gian.\"\n\nKhi [questing_knight_15.GetName] trở lại phi thuyền của [questing_knight_15.GetHerHis], [questing_knight_15.GetSheHe] cảm nhận được một luồng sinh khí hoàn toàn mới đang chạy dọc qua các mạch điện của [questing_knight_15.GetHerHis]. Không chỉ vậy, dường như toàn bộ [Root.GetName] đều có thể cảm nhận được điều đó. Có vẻ hơi dung tục nhưng các tiểu sử đã ghi lại rằng, rất nhiều người khao khát được quay lại với cơ thể máu thịt trước đây của giống loài họ: dường như mọi người trở nên say đắm đối phương hơn, và những bản năng nguyên thủy tưởng chừng như đã ngủ quên từ lâu bỗng chốc trỗi dậy, mang đến niềm hân hoan tột độ cho vô số người.\n\nChuyến đi này quả thực không uổng phí."
 toxoids.7225.A: "Chúng ta sẽ mãi nhớ đến nàng."
 toxoids.7255.name: "Sự Trở Lại Của Huyền Thoại"
 toxoids.7255.desc: "“Sau khi trải qua sự dối trá và phản bội, [questing_knight_8.GetFirstName] cuối cùng đã ngã xuống dưới tay của gã phù thủy hắc ám. [questing_knight_8.GetHeShe] bị nhấn chìm trong làn khói màu tím, và từ đó bặt vô âm tín. Ngày hôm đó, chúng ta đã mất đi vị hiệp sĩ dịu dàng nhất, đồng thời cũng đánh mất đi một trong những người sáng lập nên hiệp sĩ đoàn. Đây chính là phần kết cho câu chuyện về Hiệp sĩ [questing_knight_8.GetFirstName].”\n\nVài thế kỷ trước, tiểu sử đã ghi lại sự hy sinh của Hiệp sĩ [questing_knight_8.GetName], người đã góp công thành lập hiệp sĩ đoàn, và cũng là người tận mắt chứng kiến sự giáng lâm của Độc Thánh xuống hành tinh của chúng ta. Nhưng ngày hôm nay, quyển tiểu sử này cần phải viết thêm một phần phụ lục. Bởi vì, [questing_knight_8.GetName] đã trở về. Hiệp sĩ đoàn đã tiến hành điều tra một điểm phát ra năng lượng tăng vọt trên [Root.Capital.GetName], và sau đó phát hiện ra [questing_knight_8.GetFirstName] vừa mới trở về sau chuyến du hành xuyên không gian. [questing_knight_8.GetHeSheCap] đã được cẩn thận đưa trở lại hiệp sĩ đoàn, để tiện cho việc xác minh danh tính của [questing_knight_8.GetHisHer] sau này, đồng thời kể cho [questing_knight_8.GetHimHer] nghe về những chuyện đã xảy ra trong khoảng thời gian mà [questing_knight_8.GetHeShe]... “qua đời”."
 toxoids.7255.a: "Lặng lẽ xử lý chuyện này."
 toxoids.7255.b: "Chúng ta phải thông báo cho tất cả mọi người! Hãy ăn mừng thôi!"
 return_of_the_knight: "Huyền Thoại Sống"
 return_of_the_knight_desc: "Một vị hiệp sĩ khai quốc, sau một thế kỷ mất tích ròng rã, bỗng đột ngột trở về vào lúc mà mọi người đều cho rằng đó là điều không tưởng. Sự kiện này đã dấy lên một làn sóng hân hoan tột độ trên khắp đế chế của chúng ta."
 toxoids.7260.name: "Gặp Gỡ Huyền Thoại"
 toxoids.7260.desc: "Xin chào! Tôi là Cận vệ [questing_knight_82.GetFirstName]. Hiệp sĩ [questing_knight_8.GetName] mong muốn được diện kiến chư vị. Hiện tại [questing_knight_8.GetHeSheCap] đã sẵn sàng tiếp nhận các câu hỏi của chúng ta, và kể lại cho chúng ta nghe những gì đã xảy ra."
 toxoids.7260.a: "Có cần phải lưu ý trước điều gì không?"
 toxoids.7265.desc: "[questing_knight_8.GetHeSheCap] đã được đưa đi để thúc đẩy sự phát triển về mặt công nghệ của chúng ta, và có vẻ như quá trình hợp tác diễn ra rất suôn sẻ, thế nhưng tư duy của [questing_knight_8.GetHisHer] lại khác xa với người bình thường. Giá trị cốt lõi của chúng ta vẫn tương đồng với nhau, nhưng thỉnh thoảng [questing_knight_8.GetHeShe] sẽ... đưa ra những gợi ý về con đường tiến hóa của xã hội chúng ta. Tốt nhất là hiện tại nên né những chủ đề này ra."
 toxoids.7265.a: "Chúng ta nên lập tức đi gặp [questing_knight_8.GetHimHer]."
 toxoids.7270.name: "$toxoids.7260.name$"
 toxoids.7270.desc: "Cuối cùng thì! Các người rốt cuộc cũng dám vác mặt đến gặp ta. Nói như vậy, bây giờ các người chẳng khác nào một vị vua... Ta mang đến những tin tức tối quan trọng về Độc Thánh, chỉ có vị vua mới được nghe. Ta đoán các người chắc hẳn đang chất chứa vô vàn câu hỏi. Hỏi đi."
 toxoids.7270.a: "Chỗ ở hiện tại có thoải mái không?"
 toxoids.7270.b: "Những truyền thuyết về Ngài có phải là sự thật không?"
 toxoids.7270.c: "Trong thời gian... bị lưu đày, đã có chuyện gì xảy ra?"
 toxoids.7270.d: "Ngươi nói rằng, ngươi có thể giúp chúng ta tìm thấy Độc Thánh, đó là sự thật sao?"
 toxoids.7275.desc: "Thay đổi quá nhiều. Ta ngỡ mình đã được về nhà, nhưng thứ duy nhất ta nhận ra là mái nhà của ta đã không còn tồn tại nữa. Mọi người ta quen biết đều đã qua đời từ lâu, chỉ có những cuốn gia phả lịch sử mới có thể cho ta biết chuyện gì đã xảy ra. Ta không còn nhận ra hành tinh này nữa, nhưng ít nhất hiệp sĩ đoàn vẫn còn đó, thử thách lời thề vẫn đang tiếp diễn, vậy thì trách nhiệm của ta đã quá rõ ràng rồi. "
 toxoids.7280.desc: "Mặc dù cuốn tiểu sử rất bám sát sự thật, nhưng vẫn có vài điểm ngoại lệ, bởi mấy vị quý ông đó thường chỉ muốn biến... “báo cáo nhiệm vụ” của chúng ta trở nên trơn tru, dễ đọc hơn. Ta đúng là đã tàn sát hàng trăm con quỷ dữ, và cũng đã vào sinh ra tử vì trái tim của một thiếu nữ. Nhưng giờ thì chẳng còn gì quan trọng nữa, người phụ nữ ấy cũng giống như bao người khác, đều đã đi vào cõi vĩnh hằng."
 toxoids.7285.desc: "Ta không chắc lắm. Người của các ngươi nói với ta rằng, ta đã đến một chiều không gian khác. Đối với ta, nó giống như một giấc mộng kéo dài suốt mấy năm trời không dứt. Dù là giác quan hay cảm xúc của ta, tất cả đều trở nên vô định và mờ ảo. Thứ đã giúp ta vượt qua kiếp nạn này là ký ức về những người ta từng quen biết: người ta yêu, người ta không yêu, gã phù thủy đã đẩy ta tới đó, và cả sự phẫn nộ của chính ta; đặc biệt là người nắm giữ chiếc chìa khóa mở cánh cửa trái tim ta. Mọi thứ quả thực là một mớ bòng bong hỗn loạn, nhưng đến cuối cùng ta cũng giác ngộ ra được vài bài học quý giá."
 toxoids.7290.desc: "Trong suốt khoảng thời gian bị lưu đày, ta đã được chứng kiến rất nhiều viễn cảnh. Cứ như đang soi mình vào một tấm gương nứt nẻ, những viễn cảnh tương tự lặp đi lặp lại không ngừng, nhưng lại đan xen vô số những khác biệt tinh vi. Hầu hết các viễn cảnh đều hỗn loạn và mờ mịt, nhưng đôi khi ta lại bắt gặp những gương mặt thân quen.\n\nMột trong số đó là gã phù thủy đã trục xuất ta. Hắn ta đang đứng trên một tảng đá trơ trọi, xung quanh là vô vàn tinh tú. Hắn đang dùng phép thuật của mình để phong ấn... một thứ gì đó mang nọc độc chết người, rất có thể đó chính là Độc Thánh. Ta đã nói chuyện với Hiệp Sĩ Lãnh Chúa, có vẻ ngài ấy đã tìm đủ manh mối về nơi này rồi. Chúng ta chỉ đợi lệnh của người là có thể lập tức khởi hành."
 toxoids.7290.a: "Hãy ra lệnh cho các hiệp sĩ chuẩn bị! Chúng ta xuất phát ngay lập tức!"
 toxoids.7295.name: "Thử Thách Độc Thánh: Phong Ấn"
 toxoids.7295.desc: "Dựa vào những dữ liệu thu thập được nhờ sự trợ giúp của $NAME_Sinople$, chúng ta đã có thể vẽ ra được quỹ đạo di chuyển của Độc Thánh, và xác định được hệ sao tiếp theo mà Ngài sẽ đặt chân tới. Tuy nhiên, vừa mới tiến vào không gian, [questing_knight_8.GetFirstName] đã ngay lập tức có phản ứng.\n\n“Hắn đang ở đây. Ta có thể cảm nhận được sự hiện diện của hắn.” Chúng ta lần theo sự dẫn đường của [questing_knight_8.GetHisHer] và tìm đến một mặt trăng hiu quạnh.\n\nNgay khi vừa hạ cánh, các hiệp sĩ của chúng ta lập tức chạm trán với tên Kẻ lừa đảo mà [questing_knight_6.GetName] và [questing_knight_8.GetName] từng đối mặt trong quá khứ.\n\n“Các ngươi thật là cứng đầu cứng cổ,” tên Kẻ lừa đảo nói: “Nhưng đây sẽ là nhiệm vụ cuối cùng của các ngươi. Chủ nhân của ta tuyệt đối không cho phép đức tin ngu muội của các ngươi phá vỡ sự cân bằng của Shroud, thậm chí ngay cả bản thân bọn họ cũng chưa từng chọc giận Shroud đến mức này. Độc Thánh hoàn toàn không có thật, và Hiệp Sĩ Đoàn Độc Thánh cũng sẽ sớm tan thành mây khói!” Hắn ta vừa dứt lời, chúng ta lập tức phát hiện ra vô vàn tín hiệu năng lượng đang ồ ạt đổ vào hệ sao này."
 toxoids.7295.a: "Quyết chiến một trận sinh tử!"
 toxoids.7295.b: "Chết đi, đồ dị giáo!"
 toxoids.7295.c: "Giờ khắc báo thù đã đến!"
 toxoids.7300.name: "Thử Thách Độc Thánh: Cú Lừa Cuối Cùng"
 toxoids.7300.desc.sable: "Từ giữa khoảng không trống rỗng, một lỗ sâu bất ngờ xuất hiện. Hạm đội của hiệp sĩ đoàn lập tức nạp đạn, sẵn sàng vũ khí, căng thẳng đón chờ. Hàng chục phi thuyền cỡ nhỏ từ trong lỗ sâu lao ra, những con tàu này mang dáng dấp y hệt chiếc phi thuyền mà Hắc Kỵ Sĩ từng lái cách đây nhiều thập kỷ, chúng bỏ qua hạm đội của chúng ta và phóng thẳng về phía mặt trăng.\n\nTrên bề mặt hành tinh, trận chiến đã nổ ra ác liệt. Một cơn bão siêu nhiên càn quét qua vùng đất, tên Kẻ lừa đảo thi triển toàn bộ sức mạnh ngoại cảm, xâm nhập vào tâm trí của các hiệp sĩ, tạo ra những ảo ảnh đánh lừa, đồng thời dùng sức mạnh ý niệm phóng hàng loạt chướng ngại vật về phía chúng ta. Dù sở hữu ý chí kiên định và bộ giáp kiên cố, nhưng sức mạnh ngoại cảm kỳ dị và đáng sợ của tên Kẻ lừa đảo đã khiến các hiệp sĩ không thể tiến thêm nửa bước.\n\nĐột nhiên, từ trong cơn bão, hàng chục kẻ lạ mặt hiện ra, tất cả đều khoác trên mình bộ giáp neutronium giống hệt Hắc Kỵ Sĩ. Chúng không hề tỏ ra thù địch với chúng ta, mà lao thẳng về phía tên Kẻ lừa đảo. Một kẻ trong số chúng vung vẩy lá cờ rách nát, thông qua hệ thống loa được tích hợp sẵn, hô vang những lời cầu nguyện báo thù vang dội khắp chiến trường.\n\n“Đồ lừa đảo đê tiện! Ngươi dùng chất độc để sát hại những người mang chúng ta. Mặc dù chúng ta chỉ là những cái vỏ bọc, nhưng ký ức của họ vẫn luôn sống mãi cùng chúng ta. Để ta kết liễu mọi ân oán này, giờ khắc thanh toán đã đến!”\n\nNhận ra tình hình nguy kịch, tên Kẻ lừa đảo cất tiếng nguyền rủa trong tuyệt vọng. Đội quân áo giáp này phối hợp cùng các hiệp sĩ, vây chặt tên Kẻ lừa đảo vào giữa. [questing_knight_8.GetFirstName] bừng tỉnh khỏi sự bối rối, [questing_knight_8.GetHisHer] vung vũ khí lên, chặt đứt phần đầu và thân của tên Kẻ lừa đảo. Ngay trong khoảnh khắc chiến thắng này, đạo quân áo giáp cũng đồng loạt ngừng hoạt động. Sứ mệnh của chúng đã hoàn thành, và hệ thống AI điều khiển chúng đã tự động tắt nguồn."
 toxoids.7300.desc: "Thực thể Shroud! Hạm đội của hiệp sĩ đoàn đang bị vây hãm bởi những sinh vật năng lượng do tên Kẻ lừa đảo triệu hồi. Trong khi đó, trên mặt trăng kia, những hiệp sĩ dũng cảm của chúng ta đang phải đối đầu với một con quái vật Shroud do tên lữ khách gian xảo này gọi lên. Lực lượng của chúng ta tưởng chừng đã tan vỡ, cho đến khi Hiệp Sĩ Lãnh Chúa cất cao tiếng gầm khích lệ tinh thần: \"Vì Hiệp Sĩ Đoàn!\"\n\nTiếng gầm vang vọng khắp chiến trường, các hiệp sĩ nhanh chóng xốc lại đội hình quanh người Lãnh chúa, một lần nữa lao vào vòng chiến. Giữa tâm điểm của trận cận chiến ác liệt, Hiệp sĩ [questing_knight_8.GetFirstName] bật cười rạng rỡ, say đắm trong niềm hân hoan của một trận chiến thuần túy. Cho đến tận giây phút [questing_knight_8.GetHeShe] ngã xuống, vẫn có một điều mãi mãi không thay đổi.\n\nBất ngờ thay, các hiệp sĩ đã chọc thủng được vòng vây. Tên Kẻ lừa đảo hiện ra trơ trọi trước mắt họ. Tên lữ khách ranh ma nhắm thẳng vào Hiệp Sĩ Lãnh Chúa, phóng ra một luồng sóng xung kích ngoại cảm. Giữa ranh giới sinh tử, [questing_knight_8.GetName] đã lao ra lấy thân mình đỡ trọn đòn tấn công. Còn Hiệp sĩ [questing_knight_15.GetName], người từng có cuộc chạm trán với Syamelle, đã giáng đòn kết liễu cuối cùng lên kẻ địch.\n\n“Lũ hiệp sĩ tà đạo! Cả dân tộc của các ngươi rồi sẽ chìm trong khốn cùng, mọi tri thức của các ngươi sẽ trôi vào quên lãng!”\n\nNhững lời trăng trối của tên Kẻ lừa đảo sục sôi một nguồn năng lượng đầy oán độc.\n\n[questing_knight_8.GetFirstName] nằm thoi thóp trên mặt đất. Cuốn tiểu sử sẽ mãi khắc ghi những lời trăng trối của [questing_knight_8.GetHisHer]: \"Hắn đã giết ta chứ không phải Lãnh chúa của ta, cái chết của ta chẳng là gì cả, nó quá đỗi nhỏ bé so với việc được bảo vệ Lãnh chúa của mình.\" "
 toxoids.7300.a: "Nguyện cho Hắc Kỵ Sĩ giờ đây có thể yên nghỉ."
 toxoids.7300.b: "[questing_knight_8.GetName], không——!"
 trickster_curse: "Lời Nguyền Của Kẻ Lừa Đảo"
 trickster_curse_desc: "Dù tên Kẻ lừa đảo đã dùng mọi thủ đoạn để ngáng đường chúng ta hoàn thành thử thách cuối cùng cũng phải đền tội, nhưng hắn lại để lại cho chúng ta một mớ rắc rối khó nhằn."
 toxoids.7305.name: "Thử Thách Độc Thánh: Cánh Cửa Mở Toang"
 toxoids.7305.desc: "Sau trận chiến, các hiệp sĩ đã lùng sục từng tấc đất trên mặt trăng. Cuối cùng, ở một vị trí nằm sâu dưới lòng đất cực nam, họ phát hiện ra một thiết bị độc hại do tên Kẻ lừa đảo để lại. Thiết bị đã xuất hiện những vết nứt, năng lượng đang rò rỉ ra ngoài. Kèm theo cái chết của kẻ tạo ra nó, nó cũng đang dần dần phân rã; các luồng năng lượng ngoại cảm liên tục tuôn trào. Chẳng mấy chốc, cỗ máy này đã hóa thành tro bụi.\n\nCác phi thuyền trên quỹ đạo cũng phát hiện ra một hiện tượng không gian phụ kỳ dị ở rìa hệ sao: trọng lực bỗng nhiên thay đổi một cách tự phát, để lộ ra một tuyến siêu không gian vốn đã bị che khuất từ lâu. Năng lượng sinh ra đã giải phóng một đợt xung điện từ cực mạnh, thiêu rụi phần lớn các thiết bị trên phi thuyền của hiệp sĩ đoàn.\n\nĐể hiểu rõ ngọn ngành những gì đã xảy ra ngày hôm đó, chúng ta bắt buộc phải cử hạm đội của chính mình đến điều tra."
 toxoids.7305.a: "Lập tức phái hạm đội gần nhất đến đó!"
 toxoids.7305.a.tooltip: "Chúng ta phải lật mở những bí ẩn của hệ sao §Y[toxic_god_system.GetName]§!."
 toxoids.7310.name: "Thử Thách Độc Thánh: Chiêm Ngưỡng Thần Giới "
 toxoids.7310.desc: "[from.GetName] chính là quê hương của lốc xoáy ăn mòn, nơi trú ngụ của thực thể độc hại mà chúng ta vẫn luôn tìm kiếm bấy lâu nay. Nó sở hữu một chiếc mỏ bằng kim loại, lớp vỏ chitin, cùng những xúc tu và túi khí. Con cự thú không gian này tỏa ra một thứ ánh sáng màu xanh lục buồn nôn, và có vẻ như nó không hề chào đón chúng ta."
 toxoids.7310.a: "Tất cả những điều này thật không thể dùng lời diễn tả nổi!"
 toxoids.7310.b: "Thần đang thử thách chúng ta! Tập hợp hạm đội!"
 toxoids.7311.name: "Thần Linh Độc Hại"
 toxoids.7311.desc: "[from.GetName] chính là quê hương của lốc xoáy ăn mòn, nơi trú ngụ của một thực thể độc hại. Nó sở hữu một chiếc mỏ bằng kim loại, lớp vỏ chitin, cùng những xúc tu và túi khí. Con cự thú không gian này hiện lên vô cùng kỳ vĩ, phát ra thứ ánh sáng màu xanh lục buồn nôn, và có vẻ như nó không hề chào đón chúng ta."
 toxoids.7311.a: "Thứ đó rốt cuộc là..."
 toxoids.7312.name: "Thử Thách Độc Thánh: Thất Bại"
 toxoids.7312.desc: "Dù [from.GetName] từng chứa đựng thứ gì đi chăng nữa, thì nó cũng đã không còn tồn tại. Lốc xoáy ăn mòn từng là nơi nương tựa của một sự tồn tại như vậy, nhưng tàn tích của trận chiến cho thấy nó đã bị một nền văn minh không gian nào đó tiêu diệt trước khi chúng ta kịp tìm ra nó. Mặc dù rất rõ ràng rằng thứ từng hiện diện ở đây chẳng phải thần thánh gì, nhưng mọi dấu vết đều dẫn đến nơi này. Đứt đoạn mọi manh mối, hiệp sĩ đoàn rơi vào sự tuyệt vọng tột cùng."
 toxoids.7312.A: "Chúng ta không tin những chuyện này... Tuyệt đối không."
 toxoids.7312.tooltip: "Biết đâu một ngày nào đó, Độc Thánh thực sự sẽ được tìm thấy, nhưng lúc này chúng ta vẫn chưa biết phải đi về phương nào."
 toxoids.7315.name: "Thử Thách Độc Thánh: Vượt Qua Khảo Nghiệm"
 toxoids.7315.desc: "Độc Thánh đã bị đánh bại, giờ đây nó hoàn toàn nằm dưới sự kiểm soát của chúng ta.\n\nCác kết quả phân tích cho thấy, mặc dù thành phần hóa học trong dịch tiết của nó khá giống với những thành phần chúng ta từng tìm thấy trên hành tinh mẹ, nhưng lại không giống hoàn toàn. Liệu đây có phải là hậu duệ của chân thần? Hay vẫn còn những cá thể khác cùng loài? Hoặc đơn giản đây chỉ là một loài quái thú không gian bình thường? Dù sự thật có là gì đi nữa, các nhà khoa học của chúng ta đều tin rằng với sự chăm sóc chu đáo, nó hoàn toàn có thể hồi phục lại trạng thái khỏe mạnh. Chúng ta đã có thể tùy ý điều khiển nó rồi."
 toxoids.7315.a: "Ôi Độc Thánh, xin hãy tiêu diệt toàn bộ kẻ thù của chúng con! "
 toxoids.7315.a.tt: "Kết thúc nhiệm vụ. Nắm quyền kiểm soát §YThần Độc Tố§!, một cỗ máy §YCự Tượng§! có khả năng đầu độc các hành tinh.\nMở khóa tùy chọn cải tạo môi trường cho phép biến đổi §YHành tinh Độc Hại thành hành tinh Có Thể Sống Được§!. Có tất cả §Y[This.num_toxic_terraform_candidates]§! hành tinh đáp ứng đủ điều kiện bên trong ranh giới của chúng ta.\n§RSau khi nhiệm vụ kết thúc, rất nhiều Hiệp sĩ [knight.GetIcon] cuối cùng sẽ quyết định rời khỏi hiệp sĩ đoàn.§!"
 toxoids.7315.b: "Đây không phải là thần linh của chúng ta. Giết nó đi!"
 toxoids.7315.b.tt: "Suy cho cùng thì tên Kẻ lừa đảo cũng nói đúng. Đây không phải là vị thần của chúng ta. Thử thách vẫn phải tiếp tục."
 toxoids.7320.name: "Định Mệnh Của Hiệp Sĩ Đoàn"
 toxoids.7320.desc: "Chúng ta đã tìm thấy Độc Thánh, nhưng cũng chính vì phát hiện này, hiệp sĩ đoàn đã mất đi lẽ sống của mình. Những thử thách và nhiệm vụ cỏn con chẳng thể nào xứng tầm với sự dũng cảm và lòng danh dự của một hiệp sĩ! Chán nản, mất phương hướng, ngày càng có nhiều hiệp sĩ lựa chọn rời khỏi hàng ngũ.\n\nHôm nay, Hiệp Sĩ Lãnh Chúa đã đưa ra hai sự lựa chọn cho tất cả các hiệp sĩ còn lại: ở lại, hoặc rời đi cùng những lời chúc phúc của ngài. Rất nhiều người đã ra đi, khao khát tìm kiếm một cuộc đời mới. Một số tự lập thành những nhóm hiệp sĩ trượng nghĩa quy mô nhỏ, dong buồm ra khơi tìm kiếm những thử thách mới, phiêu bạt khắp biển sao mênh mông."
 toxoids.7320.a: "Sự kết thúc của một kỷ nguyên."
 toxoids.7320.a.tt: "§RCông trình £building£ Thành Trì Hiệp Sĩ Đoàn giờ đây chỉ có thể hỗ trợ một lượng nhỏ công việc Hiệp sĩ [knight.GetIcon]§!."
 toxoids.7510.name: "Tiêu Diệt Thần Linh Độc Hại"
 toxoids.7510.desc.origin: "Thực thể trú ngụ trong hệ sao [fromfrom.GetName] chắc chắn không thể là thần linh. Rốt cuộc thì, nếu thực sự là thần linh, làm sao chúng ta có thể giết chết nó cơ chứ?\n\nCùng với cái giật nảy cuối cùng của cái xác, tuyến độc của nó bất ngờ nổ tung, làm vật chất ăn mòn phát tán nhanh chóng ra toàn bộ hệ sao. May mắn thay, nhờ những thao tác siêu quang tốc khẩn cấp, các phi thuyền của chúng ta đã kịp thời tránh xa. Nhưng bản thân thực thể đó thì không được may mắn như vậy: ngay khi tiếp xúc với chính chất độc của mình, tàn tích của nó lập tức phân rã, chỉ còn trơ lại mỗi cái cổ họng. Hiệp sĩ đoàn đã giữ nó lại như một chiến lợi phẩm, thứ chỉ được trưng bày vào những dịp đặc biệt, như một lời khẳng định cho thành tựu tối thượng của họ."
 toxoids.7510.desc.not_origin: "Chúng ta đã hạ gục Thần Linh Độc Hại bên trong hệ sao [fromfrom.GetName]. Cùng với cái giật nảy cuối cùng của cái xác, tuyến độc của nó bất ngờ nổ tung, làm vật chất ăn mòn phát tán nhanh chóng ra toàn bộ hệ sao. May mắn thay, nhờ những thao tác siêu quang tốc khẩn cấp, các phi thuyền của chúng ta đã kịp thời tránh xa. Nhưng bản thân thực thể đó thì không được may mắn như vậy: ngay khi tiếp xúc với chính chất độc của mình, tàn tích của nó lập tức phân rã, chỉ còn trơ lại mỗi cái cổ họng."
 toxoids.7510.A: "Giờ nhìn lại thì cũng chẳng thần thánh đến mức đó!"
 toxoids.7510.A.reanimators: "Ái chà! Có hồi sinh cái xác này cũng chẳng thấm vào đâu."
 ##Các Sự Kiện Đơn Lẻ
 toxoids.8000.name: "Phần Thưởng Từ Thử Thách"
 toxoids.8000.desc: "Một nhóm hiệp sĩ vừa mới trở về sau một cuộc thử thách dài đằng đẵng. Chiến hạm của họ loang lổ vết xước, lớp áo giáp động lực cũng in hằn bao dấu vết của thời gian. Đó là một chuyến hành trình vô cùng căng thẳng và đầy kịch tính, dù không thu thập được nhiều thứ, nhưng tất cả đều là những thông tin vô giá về Độc Thánh. Bất chấp những năm tháng gian khổ đã qua, ai nấy cũng đều mang trong mình một tinh thần phơi phới, bởi họ đã không trở về tay trắng, và chẳng mấy chốc câu chuyện của họ sẽ được dày công biên soạn và lưu giữ vào biên niên sử."
 toxoids.8005.name: "Yêu Cầu Tăng Cường Ngân Sách"
 toxoids.8005.desc: "Trong nhiều thế kỷ, quốc gia luôn dành phần lớn nguồn lực của mình cho thử thách lời thề và hiệp sĩ đoàn; chính vì thế, chính sách cắt giảm ngân sách dành cho các hiệp sĩ gần đây của chúng ta đã vấp phải phản ứng không mấy tích cực. Các hiệp sĩ và cận vệ tỏ ra vô cùng bất mãn; phần đông dân chúng dường như cũng chia sẻ chung một quan điểm, họ cho rằng chúng ta đã lãng quên trách nhiệm của mình. Hiệp Sĩ Lãnh Chúa đã chính thức đệ trình một yêu cầu, thúc giục chúng ta khôi phục lại mô hình tài chính như cũ, và yêu cầu này đã nhận được sự đồng thuận từ rất nhiều tiếng nói bên trong đế chế."
 toxoids.8005.a: "Họ nói đúng, thử thách mới là mục tiêu hàng đầu của chúng ta."
 toxoids.8005.b: "Không. Thử thách này phải tạm gác lại đã."
 toxoids.8005.c: "Chúng ta có thể tổ chức một đợt quyên góp để xoa dịu họ."
 knight_budget_demand: "Phê Chuẩn Tăng Cường Ngân Sách"
 toxoids.8010.name: "Thử Thách Trăm Năm"
 toxoids.8010.desc: "Một trăm năm trước, chúng ta đã vươn tay hái những vì sao. Đó là một khởi đầu hoàn toàn mới đối với chúng ta, cũng như đối với thử thách lời thề, mở ra vô vàn cơ hội vô tận ngay trước mắt. Một thế kỷ đã trôi qua, người dân của chúng ta đang cảm nhận rõ sự chia cắt. Dù không thể phủ nhận những thành tựu mà chúng ta đạt được, nhưng những giọng điệu hoài nghi về ý nghĩa của các hiệp sĩ và thử thách vẫn ngày một vang vọng. Liệu chúng có thực sự chỉ là những món đồ cổ lỗi thời?"
 toxoids.8010.a: "Không. Chúng ta sẽ tổ chức một buổi lễ kỷ niệm để tôn vinh các hiệp sĩ của chúng ta!"
 toxoids.8010.b: "Chúng ta không có thời gian để bận tâm đến những chuyện vụn vặt này."
 toxoids.8010.c: "Đúng vậy. Đây là một chuỗi thất bại kéo dài hàng thế kỷ. Đã đến lúc phải chấm dứt chuyện này."
 toxoids.8010.c.tooltip: "§RĐiều này sẽ đặt dấu chấm hết cho thử thách, tiêu diệt hiệp sĩ đoàn, và gỡ bỏ toàn bộ công trình cũng như khu vực có liên quan.§!"
 toxoids.8015.name: "Thành Trì Hiệp Sĩ Đoàn Thất Thủ"
 toxoids.8015.desc.a: "Thành trì đã thất thủ. Rất nhiều chiến lợi phẩm và cổ vật quý giá đã bị bọn cướp càn quét. Thế nhưng, giữa sự hỗn loạn của cuộc rút lui, vẫn có một vài hiệp sĩ dũng cảm bảo vệ thành công những thành quả nghiên cứu quý báu của chúng ta, đem phong ấn kho lưu trữ vào một căn phòng bí mật. Bọn chúng giờ đây chắc hẳn đã an toàn, nhưng nếu không thể truy cập trực tiếp vào nguồn tri thức này, hiệp sĩ đoàn của chúng ta sẽ không thể hoạt động được nữa."
 toxoids.8015.desc.b: "Thành trì đã thất thủ. Rất nhiều chiến lợi phẩm và cổ vật quý giá đã bị bọn cướp càn quét. Thế nhưng, giữa sự hỗn loạn của cuộc rút lui, vẫn có một vài hiệp sĩ dũng cảm bảo vệ thành công những thành quả nghiên cứu quý báu của chúng ta, đem phong ấn kho lưu trữ vào một căn phòng bí mật. Bọn chúng giờ đây chắc hẳn đã an toàn, nhưng nếu không thể truy cập trực tiếp vào nguồn tri thức này, thử thách sẽ không thể nào được tiếp tục."
 toxoids.8015.a: "Chúng ta phải đoạt lại trạm cư trú đó bằng mọi giá!"
 toxoids.8017.name: "Thành Trì Hiệp Sĩ Đoàn Bị Phá Hủy"
 toxoids.8017.desc.a: "Thành trì của hiệp sĩ đoàn đã bị phá hủy, chỉ còn lại một đống đổ nát trôi nổi lơ lửng. Hiệp Sĩ Lãnh Chúa đã tử trận, kéo theo đó là sự ra đi của đại đa số các hiệp sĩ và cận vệ. Kho lưu trữ cũng đã bị cướp sạch. Thiệt hại là không thể đong đếm được. Những hiệp sĩ may mắn sống sót đã được triệu hồi trở về. Tương lai của hiệp sĩ đoàn đã được định sẵn là đi đến sự diệt vong."
 toxoids.8017.desc.b: "Thành trì của hiệp sĩ đoàn đã bị phá hủy, chỉ còn lại một đống đổ nát trôi nổi lơ lửng. Hiệp Sĩ Lãnh Chúa đã tử trận, kéo theo đó là sự ra đi của đại đa số các hiệp sĩ và cận vệ. Kho lưu trữ cũng đã bị cướp sạch. Thiệt hại là không thể đong đếm được. Sau khi tất cả những điều này xảy ra, chúng ta không bao giờ có thể tiếp tục thử thách lời thề được nữa. Những hiệp sĩ may mắn sống sót đã được triệu hồi trở về. Tương lai của hiệp sĩ đoàn đã được định sẵn là đi đến sự diệt vong."
 toxoids.8017.desc.c: "Thành trì hiệp sĩ đoàn đã bị cô lập hoàn toàn, hóa thành một tượng đài lơ lửng trên không trung. Hiệp Sĩ Lãnh Chúa đã ra đi vĩnh viễn, kéo theo đó là sự hy sinh của phần lớn hiệp sĩ và cận vệ. Mối liên kết với kho báu cũng đã hoàn toàn đứt đoạn. Tổn thất là không thể đong đếm. Những hiệp sĩ còn sót lại đã được triệu hồi trở về. Tương lai của hiệp sĩ đoàn đã được định sẵn là đi đến sự diệt vong."
 toxoids.8017.desc.d: "Thành trì hiệp sĩ đoàn đã bị cô lập hoàn toàn, hóa thành một tượng đài lơ lửng trên không trung. Hiệp Sĩ Lãnh Chúa đã ra đi vĩnh viễn, kéo theo đó là sự hy sinh của phần lớn hiệp sĩ và cận vệ. Mối liên kết với kho báu cũng đã hoàn toàn đứt đoạn. Tổn thất là không thể đong đếm. Kể từ giây phút này, chúng ta sẽ vĩnh viễn không thể tiếp tục thử thách được nữa. Những hiệp sĩ còn sót lại đã được triệu hồi trở về. Tương lai của hiệp sĩ đoàn đã được định sẵn là đi đến sự diệt vong."
 toxoids.8017.a: "Chuyện này không thể nào..."
 toxoids.8020.name: "Số Phận Của Độc Thánh"
 toxoids.8020.desc: "Sau khi tìm thấy thực thể mang độc tính, các hiệp sĩ của chúng ta đã hoàn toàn mất dấu Độc Thánh. Mối liên hệ giữa cả hai là không thể chối cãi, nhưng nếu những gì được ghi lại trong kho lưu trữ lịch sử là thật, thì thực thể này chỉ là hạt cát so với nguyên bản Độc Thánh đầy trí tuệ và quyền năng mà thôi.\n\nDù sao đi nữa, hành trình tìm kiếm Độc Thánh của chúng ta cũng đã khép lại vào hôm nay. Chúng ta đã phát hiện ra lượng độc tố vi lượng bị trục xuất khỏi siêu hố đen ở trung tâm dải ngân hà. Dù nghe có vẻ hoang đường, nhưng chúng ta dám chắc Độc Thánh đang ở đó, một nơi nằm ngoài khả năng tiếp cận của chúng ta.\n\nHiệp Sĩ Lãnh Chúa đã ra lệnh cho toàn bộ hiệp sĩ dốc toàn lực thu thập mọi thứ có liên quan đến hố đen, nhưng hy vọng thành công là cực kỳ mong manh."
 toxoids.8020.a: "Cho đến khi tìm ra giải pháp mới, chúng ta không được lãng phí thêm một giây phút nào nữa!"
 toxoids.8020.b: "…… Hay là ở đây?"
 toxoids.8020.cosmogenesis: "Tùy chọn này khả dụng vì bạn đã sở hữu đặc quyền thăng thiên §YVũ Trụ Sáng Thế§!."
 advanced_logic_from_knights: "Hiệp Sĩ [knight.GetIcon] §Y[knight.GetNamePlural]§! giờ đây sẽ tạo ra §G+1§! £advanced_logic£ Logic Siêu Việt.\n£job_knight_commander£ §Y$job_knight_commander$§! giờ đây sẽ tạo ra §G+2§! £advanced_logic£ Logic Siêu Việt."
 toxoids.8025.name: "Tái Chiếm Thành Trì Hiệp Sĩ Đoàn"
 toxoids.8025.desc: "Chúng ta đã thành công tái chiếm lại trạm cư trú nơi đặt thành trì của hiệp sĩ đoàn. Mặc dù các công trình và lãnh địa của chúng ta đã bị quân chiếm đóng phá hủy thành một đống hoang tàn, nhưng chúng hoàn toàn có thể được khôi phục lại. Cùng với việc lấy lại được quyền truy cập vào kho lưu trữ, thử thách lời thề hiệp sĩ của chúng ta sẽ được đưa trở lại đúng quỹ đạo."
 toxoids.8025.a: "Một ngày vinh quang!"
 ##Chính Sách
 policy_knightly_duties: "Nhiệm Vụ Hiệp Sĩ"
 policy_knightly_duties_desc: "Hiệp sĩ là những tinh anh xuất chúng nhất do quốc gia của chúng ta tôi luyện nên. Họ trung thành, tận tụy, tràn đầy danh dự và là hiện thân hoàn hảo của tinh thần hiệp sĩ. Nếu chúng ta sẵn sàng để họ tạm thời gác lại thử thách của mình, những kỹ năng xuất chúng của họ sẽ trở thành một tài sản vô giá trên hành trình chinh phục dải ngân hà.\n\n"
 toxic_knights_questing_name: "Hiệp Sĩ Lời Thề Thử Thách"
 questing_knights: "$toxic_knights_questing_name$"
 questing_knights_desc: "Các hiệp sĩ của chúng ta sẽ dốc toàn bộ tâm trí vào việc thực hiện thử thách mà không bị bất cứ điều gì làm xao nhãng. Chúng ta sẽ làm tất cả những gì có thể để tìm ra nơi ẩn náu của Độc Thánh.\n§GThử thách sẽ hưởng lợi từ quyết định này.§!\n\n"
 toxic_knights_military_name: "Hiệp Sĩ Chỉ Huy"
 military_knights: "$toxic_knights_military_name$"
 military_knights_desc: "Các hiệp sĩ của chúng ta cần phải xông pha ngoài tiền tuyến. Chúng ta không thể lãng phí thêm những chiến binh xuất sắc nhất của mình nữa.\n\n"
 toxic_knights_diplomats_name: "Hiệp Sĩ Cung Đình"
 diplomats_knights: "$toxic_knights_diplomats_name$"
 diplomats_knights_desc: "Các hiệp sĩ của chúng ta sẽ đóng vai trò như những đặc phái viên, hỗ trợ chúng ta xử lý các vấn đề ngoại giao.\n§GThử thách sẽ hưởng lợi từ quyết định này.§!\n\n"
 toxic_knights_herald_name: "Hiệp Sĩ Truyền Lệnh"
 herald_knights: "$toxic_knights_herald_name$"
 herald_knights_desc: "Các hiệp sĩ sẽ được phái đến khắp mọi miền lãnh thổ, làm nhiệm vụ tuyên truyền các sắc lệnh và khai sáng tâm trí cho nhân dân chúng ta.\n\n"
 ##Cơ Sở Chư Hầu
 holding_knight_commandery: "Chi Nhánh Hiệp Sĩ Đoàn"
 holding_knight_commandery_desc: "Tại tiền đồn kiên cố này, các hiệp sĩ của chúng ta sẽ kề vai sát cánh cùng đội quân của chư hầu để tìm kiếm Độc Thánh. Các thuộc quốc của chúng ta có nghĩa vụ cung cấp tài nguyên và dữ liệu để hỗ trợ công việc của hiệp sĩ đoàn."
 job_overlord_knight_commandery_effect_desc: "Hiệp Sĩ [knight.GetIcon] $job_overlord_knight_plural$ sẽ chuyển hóa $r_alloys$ thành $r_stability$ và cung cấp Lục Quân Phòng Thủ £defense_army£ §YPhòng Thủ§! cho chư hầu, đồng thời mang về £unity£ §YĐoàn Kết§! cùng £physics_research£ £society_research£ £engineering_research£ §YĐiểm Nghiên Cứu§! cho Quốc gia Tôn chủ."
 job_overlord_knight: "[knight.GetName] Tôn Chủ"
 job_overlord_knight_plural: "[knight.GetNamePlural] Tôn Chủ"
 job_overlord_knight_desc: "$job_knight_desc$"
 job_overlord_knight_drone: "[knight.GetName] Tôn Chủ"
 job_overlord_knight_drone_plural: "[knight.GetNamePlural] Tôn Chủ"
 job_overlord_knight_drone_desc: "$job_knight_desc$"
 mod_job_overlord_knight_add: "Công việc $job_overlord_knight$"
 mod_job_overlord_knight_drone_add: "Công việc $job_overlord_knight_drone$"
 building_knightly_theme_park: "Khu Vui Chơi Hiệp Sĩ"
 building_knightly_theme_park_desc: "Thoạt nhìn, công trình này trông chẳng khác gì một pháo đài thực thụ, nhưng thực chất nó lại là một công viên giải trí, nơi tôn vinh những người hiệp sĩ và các cuộc thử thách của họ. Tại đây, du khách có thể dễ dàng mua được cuốn sổ có chữ ký, các mô hình đồ chơi và áp phích 3D của vị hiệp sĩ mà mình hâm mộ. Đương nhiên, mục đích chính của cơ sở này vẫn là thu thập tin tức tình báo cho các thử thách, đồng thời đóng vai trò như một trạm dừng chân để các hiệp sĩ nghỉ ngơi, phục hồi sinh lực."
 knightly_theme_park_quest_effect_desc: "§GThúc đẩy tiến độ thử thách của Hiệp Sĩ Độc Thánh thêm 0.01 mỗi tháng.§!"
 ##Khác
 low_motivation: "Thiếu Động Lực"
 low_motivation_desc: "Sau khi ý thức của họ thâm nhập vào Shroud, công chúng cảm thấy như những niềm vui đang dần bị hút cạn: những khoái cảm trước đây trở nên chai sạn, khiến họ khó mà tìm thấy động lực để làm ngay cả những công việc đơn giản nhất."
 malcontent_knights: "Hiệp Sĩ Bất Mãn"
 malcontent_knights_desc: "Các hiệp sĩ đang cảm thấy vô cùng bất mãn, và sự hậm hực của họ đã bắt đầu lan rộng trong cộng đồng."
 motivated_knights: "Hiệp Sĩ Được Khích Lệ"
 motivated_knights_desc: "Bất chấp những chông gai của thử thách lời thề, các hiệp sĩ của chúng ta vẫn tràn đầy sức sống và luôn trong tâm thế sẵn sàng chiến đấu."
 demotivated_knights: "Hiệp Sĩ Bị Nản Lòng"
 demotivated_knights_desc: "Thử thách kéo dài đằng đẵng, mục tiêu thì quá đỗi xa vời. Đôi khi, mọi nỗ lực của họ dường như trở nên... vô nghĩa. Sĩ khí của các hiệp sĩ đang bị suy giảm phần nào."
 despair_of_the_knightly_order: "Hiệp Sĩ Đoàn Tuyệt Vọng"
 despair_of_the_knightly_order_desc: "Nhiệm vụ tìm kiếm Độc Thánh kéo dài suốt nhiều năm cuối cùng lại kết thúc trong thất bại ê chề. Chẳng còn mục tiêu nào để theo đuổi, rất nhiều người bắt đầu tự đặt câu hỏi về ý nghĩa của việc tiếp tục thực hiện thử thách."
 #Cường Hóa Giới Hạn
 origin_overtuned: "Cường Hóa Giới Hạn"
 origin_overtuned_desc: "Nền văn minh này đã tìm mọi cách để không ngừng cường hóa cơ thể hữu cơ của mình, bất chấp mọi rủi ro, mọi giá phải trả. Suy cho cùng, thà cháy sáng huy hoàng trong phút chốc còn hơn là lụi tàn trong câm lặng."
 origin_overtuned_effects: "Có thể lựa chọn những đặc tính sinh học cấp cao khi bắt đầu trò chơi, chúng mạnh hơn và rẻ hơn các đặc tính thông thường, nhưng đi kèm với đó là những rủi ro cực kỳ to lớn."
 origin_tooltip_overtuned_effects: "—$SPECIES_TRAITS$ có thể lựa chọn các đặc tính ['concept_overtuned_traits', $origin_overtuned$].$NEW_LINE$—Đặc tính Cường Hóa Giới Hạn: $TABBED_NEW_LINE$—Có thể được tăng cường thêm thông qua sắc lệnh ['concept_damn_the_consequences']$TABBED_NEW_LINE$—Có thể được bổ sung hoặc loại bỏ thông qua §IChỉnh Sửa Gen§!\n—$ADDITIONAL_TECHNOLOGIES_STRING$['concept_gene_tailoring', £society£ $tech_gene_tailoring$]"
 START_SCREEN_OVERTUNED: "Tự nhiên là một nhà phát minh chậm chạp, và tiến hóa thì lại lê lết chẳng khác nào một dòng sông băng. Để có thể phát triển và thịnh vượng, chúng ta cần một cơ thể khỏe mạnh, phản xạ nhanh nhẹn cùng một trí tuệ siêu phàm, và chúng ta không thể đợi cả một triệu năm nữa, chúng ta phải nắm bắt từng giây từng phút. Nếu chọn lọc tự nhiên đã keo kiệt không chịu ban phát những món quà đó, thì chúng ta chỉ có thể tự tay giành lấy chúng.\n\nChính vì thế, những nguyên tắc cốt lõi của nền văn minh chúng ta đã được xác lập: chúng ta sẽ cường hóa cơ thể của mình mà không màng đến bất cứ giới hạn nào. Những đợt cường hóa này đã giúp thống nhất hành tinh của chúng ta, và chắc chắn sẽ dẫn dắt chúng ta tiến đến một tương lai xa xôi hơn nữa.\n\nCông nghệ gen đã mang đến cho chúng ta bộ não siêu phàm, sức mạnh vô song và lòng dũng cảm tuyệt đỉnh, chúng ta chắc chắn sẽ gặt hái được sự hưng vượng giữa các vì sao... và đó cũng chính là đặc quyền mà chỉ những sinh vật được thiết kế một cách hoàn hảo mới có quyền sở hữu."
 disables_overtuned_features: "§RLựa chọn đặc quyền thăng thiên này sẽ khiến cơ chế của Nguồn Gốc Cường Hóa Giới Hạn không thể hoạt động.§!"
