 civic_toxic_baths_desc: "Nền văn minh này tổ chức các nghi thức tắm bùn đột biến, sử dụng các loại thuốc nguy hiểm dưới sự giám sát của các nhân viên chăm sóc chuyên nghiệp. Quá trình \"bơm sức sống\" này có thể khiến những người ngoài không hiểu chuyện phải khiếp sợ."
 civic_corporate_toxic_baths_desc: "Nền văn minh này tiến hành tắm bùn đột biến, sử dụng thuốc nguy hiểm dưới sự giám sát của điều dưỡng chuyên nghiệp. Quá trình \"bơm sức sống\" được quảng bá như một bước thiết yếu để phát triển cá nhân và nâng cao phúc lợi."
 civic_hive_toxic_baths_desc: "Tập thể này sử dụng các hồ chứa chất đột biến, được giám sát bởi các ong thợ chăm sóc đặc biệt để nuôi dưỡng ong thợ mới sinh. Quá trình này gây ảnh hưởng nặng nề đến môi trường xung quanh."
 civic_machine_toxic_baths_desc: "Đế chế máy móc này đã cải tiến quy trình sản xuất lớp vỏ cho người máy cơ bản, đắp một lượng lớn chất bôi trơn cực mạnh dưới sự điều khiển của các thiết bị đầu cuối được lập trình kỹ lưỡng. Quá trình \"tinh chỉnh\" này tận dụng các phụ phẩm công nghiệp vốn bị coi là rác thải, nay lại được dùng để đạt hiệu suất cao nhất."
 civic_tooltip_not_mutagenic: "Không có loại đặc điểm quốc gia ['concept_mutagenic_civics']"
 concept_mutagenic_civics: "Spa Đột Biến"
 concept_mutagenic_civics_desc: "Loại đặc điểm quốc gia $concept_mutagenic_civics$ bao gồm\n—['civic:civic_toxic_baths']$NEW_LINE$—['civic:civic_toxic_baths_individual_machine']$NEW_LINE$—['civic:civic_corporate_toxic_baths']$NEW_LINE$—['civic:civic_corporate_toxic_baths_individual_machine']$NEW_LINE$—['civic:civic_hive_toxic_baths']$NEW_LINE$—['civic:civic_machine_toxic_baths']"
