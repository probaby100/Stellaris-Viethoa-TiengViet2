 knights_more_research_tooltip: "[knight.GetIcon] §Y[knight.GetNamePlural]§! giờ đây sẽ tạo thêm §G+1§! điểm nghiên cứu £physics_research£ £society_research£ £engineering_research£, đồng thời §Yphí duy trì§! tăng thêm §R15%§!.\n£job_knight_commander£ §Y$job_knight_commander$§! giờ đây sẽ tạo thêm §G+2§! điểm nghiên cứu £physics_research£ £society_research£ £engineering_research£."
 job_knight_commander: "Hiệp Sĩ Lãnh Chúa"
 job_knight_commander_plural: "Các Hiệp Sĩ Lãnh Chúa"
 job_knight_commander_desc: "Các hiệp sĩ là những người đầy danh dự và đáng kính trọng — họ là những cá nhân xuất chúng nhất mà xã hội chúng ta có thể nuôi dưỡng. Nhưng ngay cả họ cũng cần người dẫn dắt. Hiệp Sĩ Lãnh Chúa chỉ kiếm về đâu, cờ xí của các hiệp sĩ sẽ tiến về đó!"
 job_knight_commander_effect_desc: "£job_knight_commander£ $job_knight_commander_plural$ sẽ chuyển hóa $r_alloys$ thành $r_unity$ và $r_amenities$, đồng thời tăng £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!.\nHoàn thành §YThử Thách Lời Thề Hiệp Sĩ§! sẽ nâng cao thêm sản lượng của họ."
 job_knight_commander_research_effect_desc: "£job_knight_commander£ $job_knight_commander_plural$ sẽ chuyển hóa $r_alloys$ thành $r_unity$, $r_research$ và $r_amenities$, đồng thời tăng £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!.\nHoàn thành §YThử Thách Lời Thề Hiệp Sĩ§! sẽ nâng cao thêm sản lượng của họ."
