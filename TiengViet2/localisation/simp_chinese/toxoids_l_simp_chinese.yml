 mod_job_bath_attendant_add: "Công việc $job_bath_attendant$"
 job_bath_attendant_desc: "Những chuyên viên chăm sóc được đào tạo tại Spa Đột Biến. Mục tiêu cả đời của họ là đảm bảo khách hàng duy trì sức khỏe thông qua vô số dịch vụ, bao gồm giải độc chuyên sâu và cẩn thận phục hồi tình trạng lão hóa gen."
