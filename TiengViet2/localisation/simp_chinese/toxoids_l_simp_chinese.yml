 job_bath_attendant_hive_plural: "Ong Thợ Chăm Sóc Tái Cấu Trúc"
 job_toxic_baths_effect_hive_desc: "£job_bath_attendant_hive£§YOng Thợ Chăm Sóc Tái Cấu Trúc§! gia tăng £pop£§Ylắp ráp sinh vật hữu cơ§!, nhưng làm giảm §Rđộ thích nghi§! của £planet£hành tinh."
 job_bath_attendant_hive_desc: "Những con ong thợ chuyên biệt, mục đích duy nhất khi trưởng thành của chúng là giám sát quá trình tái cấu trúc mỗi khi bầy đàn tạo ra một ong thợ hữu cơ mới."
 spawning_drone_is_mutagenic_tt: "£job_spawning_drone£Cá Thể Sinh Sản chuyển hóa thành £job_bath_attendant_hive£$job_bath_attendant_hive_plural$"
