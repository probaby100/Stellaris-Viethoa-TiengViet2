 job_toxic_baths_effect_machine_desc: "£job_bath_attendant_machine£§YĐầu Cuối Bôi Trơn§! chuyển hóa $r_alloys$ thành £pop£§YLắp Ráp Dân Số§!, nhưng làm tăng lượng £amenities£§RTiêu Hao Tiện Nghi§!."
 job_bath_attendant_machine_desc: "Đầu cuối bôi trơn là những drone được lập trình chuyên dụng, chịu trách nhiệm giám sát quy trình ngâm vỏ máy mới, kiểm tra cẩn thận tình trạng bôi trơn trong suốt quá trình."
 ### Trung Tâm Thủy Liệu Đột Biến Holding related
 holding_toxic_bath: "Trung Tâm Thủy Liệu Đột Biến"
 holding_toxic_bath_hive: "Hồ Tái Cấu Trúc Đột Biến"
 holding_toxic_bath_machine: "Bể Tắm Siêu Bôi Trơn"
 holding_toxic_bath_desc: "Dù Trung tâm Thủy liệu Đột biến được trang bị những thiết bị vật lý trị liệu vô cùng hiện đại, và các tài liệu đều chỉ ra rằng nó mang lại vô số lợi ích về mặt sức khỏe, nhưng phương pháp này vẫn khiến một vài người cảm thấy buồn nôn. Bởi từng giọt chất lỏng trong những bồn tắm này thậm chí còn chứa hàm lượng đột biến cao hơn cả những loại hàng cấm tràn lan trong dải ngân hà."
 holding_toxic_bath_hive_desc: "Hồ Tái Cấu Trúc Đột Biến chính là minh chứng hoàn hảo nhất cho mức độ tiến hóa đỉnh cao mà một Ý Thức Tập Thể có thể vươn tới; dành trọn tâm huyết để tạo ra số lượng cá thể nhiều nhất có thể nhằm phục vụ cho sự bành trướng không ngừng nghỉ của tâm trí."
 holding_toxic_bath_machine_desc: "Bể Tắm Siêu Bôi Trơn là giải pháp hợp lý nhất được đưa ra để khắc phục những vấn đề liên quan đến ma sát, quá nhiệt và tĩnh điện thường xuyên xảy ra trong quá trình chế tạo các thiết bị mới."
 job_overlord_bath_attendant: "Nhân Viên Chăm Sóc Thủy Liệu Đột Biến"
 job_overlord_bath_attendant_hive: "Ong Thợ Chăm Sóc Tái Cấu Trúc"
 job_overlord_bath_attendant_machine: "Đầu Cuối Bôi Trơn"
 job_overlord_bath_attendant_desc: "Các điều dưỡng viên đã trải qua quá trình huấn luyện bài bản tại các trung tâm thủy liệu đột biến. Mục tiêu duy nhất của họ là đảm bảo khách hàng duy trì sức khỏe thông qua vô vàn các dịch vụ, từ giải độc chuyên sâu cho đến việc điều trị tận gốc các dấu hiệu lão hóa gen."
 job_overlord_bath_attendant_hive_desc: "Những con ong thợ chuyên biệt, mục đích trưởng thành duy nhất của chúng là giám sát quy trình tái cấu trúc mỗi khi có thêm các cá thể ong thợ hữu cơ mới được sản sinh trong bầy đàn."
 job_overlord_bath_attendant_machine_desc: "Đầu cuối bôi trơn là những drone được lập trình chuyên dụng, chịu trách nhiệm giám sát quy trình ngâm vỏ máy mới, kiểm tra cẩn thận tình trạng bôi trơn trong suốt quá trình."
 job_overlord_toxic_baths_effect_desc: "£job_bath_attendant£Nhân Viên Chăm Sóc Thủy Liệu Đột Biến chuyển hóa £consumer_goods£ §YHàng Tiêu Dùng§! thành £pop£§YTăng Trưởng Dân Số§!, nhưng làm giảm £happiness£ §RHạnh Phúc§! và £planet£ §RĐộ Phù Hợp§!."
 job_overlord_toxic_baths_effect_hive_desc: "£job_bath_attendant£Ong Thợ Chăm Sóc Tái Cấu Trúc tăng cường £pop£§YLắp Ráp Sinh Vật Hữu Cơ§!, nhưng làm giảm £planet£§RĐộ Phù Hợp§!."
 job_overlord_toxic_baths_effect_machine_desc: "£job_bath_attendant£Đầu Cuối Bôi Trơn chuyển hóa £minerals£§YKhoáng Sản§! thành £pop£§YLắp Ráp Dân Số§!, nhưng làm tăng lượng £amenities£§RTiêu Hao Tiện Nghi§!."
 planet_overlord_bath_attendants: "Nhân Viên Chăm Sóc Thủy Liệu Đột Biến"
 planet_overlord_bath_attendants_hive: "Ong Thợ Chăm Sóc Tái Cấu Trúc"
