l_simp_chinese:
 TOXOIDS_TITLE: "Toxoids Species Pack" #Không dịch
 DLC_TOXOIDS_RECOMMENDATION_DESC: "Trong §SToxoids§!, bạn sẽ đồng hành cùng những giống loài kiên cường nhất lịch sử dải ngân hà! Khai thác các hành tinh độc hại, đánh cược tương lai của hành tinh vì lợi ích trước mắt, và đưa ra những quyết định khắc nghiệt nhưng cần thiết để sinh tồn và phát triển giữa vũ trụ đầy thù địch này."
 DLC_TOXOIDS_RECOMMENDATION_COSMETICS: "Chúng tôi đề xuất mua gói 《Toxoids》 vì nhận thấy bạn rất thích các bản mở rộng trang trí."
 DLC_TOXOIDS_RECOMMENDATION_POST_APOCALYPTIC: "Chúng tôi đề xuất mua gói 《Toxoids》 vì đế chế bạn chọn rất phù hợp với chủ đề hậu tận thế."
 DLC_TOXOIDS_RECOMMENDATION_ENVIRONMENTALIST: "Xét đến mối liên hệ với môi trường tự nhiên, chúng tôi đề xuất 《Toxoids》 như một lựa chọn thay thế cho đế chế đã chọn."
 DLC_TOXOIDS_RECOMMENDATION_WASTEFUL_ADAPTIVE: "Chúng tôi đề xuất mua gói 《Toxoids》 vì giống loài của bạn cực kỳ phù hợp với chủ đề phế liệu và sự thích nghi."
 DLC_TOXOIDS_RECOMMENDATION_VOID_DWELLERS: "Chúng tôi đề xuất mua gói 《Toxoids》 vì nguồn gốc $origin_toxic_knights$ mang đến một khởi đầu hoàn toàn mới trên trạm cư trú."
 #Các Hiệp Sĩ Của Vị Thần Độc Hại
 origin_toxic_knights: "Hiệp Sĩ Độc Thánh"
 origin_toxic_knights_desc: "Vài thế kỷ trước, hành tinh mẹ của giống loài này đã bị một vị thần độc hại ghé thăm. Thảm họa sinh thái theo sau đó gần như đã hủy diệt toàn bộ hành tinh, nhưng những người sống sót, với lòng tôn kính dành cho Độc Thánh, đã vội vã hợp nhất lại với nhau. Họ thành lập một hiệp sĩ đoàn để truy lùng Độc Thánh, và dù cho bao biến thiên của thời đại, chuyến hành hương thử thách này vẫn được duy trì cho đến tận ngày nay."
 origin_toxic_knights_effects: "—Hành tinh mẹ: $TABBED_NEW_LINE$—['concept_toxic_features']$TABBED_NEW_LINE$—Sở hữu ['concept_pc_habitat', Trạm cư trú quỹ đạo] riêng biệt: $TABBED_NEW_LINE$$t$—['concept_order_keep', £building£$building_order_keep$]$TABBED_NEW_LINE$$t$—['concept_orders_demesne', £district£ $district_orders_demesne$]$TABBED_NEW_LINE$$t$—Công việc ['concept_politician', £job_politician£$job_politician$] được thay thế bằng ['concept_order_jobs']$NEW_LINE$—Tình hình: ['concept_knights_quest']$NEW_LINE$—Chính sách: §INhiệm Vụ Hiệp Sĩ§!$NEW_LINE$—$AVAILABLE_HOLDINGS$['concept_knight_commandery', £building£Chi Nhánh Hiệp Sĩ Đoàn] trên thuộc địa của chư hầu."
 origin_toxic_knights_negative_effects: "—$INITIAL_POPS$§R-300§!"
 START_SCREEN_TOXIC_KNIGHTS: "Thuở xa xưa, hành tinh của chúng ta bị chia cắt dữ dội. Những kẻ tự xưng là vua chúa không ngừng xâu xé lẫn nhau, đẩy vô số sinh mạng vào chỗ chết vô nghĩa. Nhưng sự xuất hiện của Vị Vua Tối Cao đầu tiên đã thay đổi tất cả. Tố chất lãnh đạo trời ban của ngài đã hun đúc nên một vương quốc không gì sánh kịp.\n\nVị Vua Tối Cao vô cùng ngoan đạo. Ngài tuyên chiến với mọi kẻ ngoại đạo, nhưng ngọn lửa dị giáo vẫn cháy mãi không dứt. Cho đến một ngày, Độc Thánh giáng lâm xuống thế giới của chúng ta, lời cầu nguyện của Vị Vua Tối Cao đã được hồi đáp. Dù sự xuất hiện của Ngài chỉ là cái chớp mắt, nhưng sức mạnh độc hại của Ngài đã lây nhiễm mọi vùng đất của những kẻ không có đức tin. Những người sống sót vội vã quy thuận Vị Vua Tối Cao. Lần đầu tiên, hành tinh của chúng ta được thống nhất.\n\nĐộc Thánh nhanh chóng rời bỏ chúng ta, nhưng Vị Vua Tối Cao quyết tâm phải tìm ra Ngài, và một hiệp sĩ đoàn đã được thành lập vì mục đích đó. Trải qua bao thế kỷ, những linh hồn dũng cảm ấy vẫn mải miết kiếm tìm, nhưng chẳng thu được gì. Độc Thánh đã rời xa thế giới của chúng ta từ quá lâu rồi. Chương tiếp theo của cuộc hành hương thử thách này sẽ được viết nên giữa các vì sao. Nhờ vào một thánh tích hùng mạnh, hiệp sĩ đoàn đã xây dựng trạm không gian đầu tiên của đế chế. Tòa thành trì kiên cố này sẽ là bệ phóng đưa họ vút bay vào biển sao vô tận."
 START_SCREEN_TOXIC_KNIGHTS_CORPORATE: "Thuở xa xưa, hành tinh của chúng ta bị chia cắt dữ dội. Những kẻ tự xưng là vua chúa không ngừng xâu xé lẫn nhau, đẩy vô số sinh mạng vào chỗ chết vô nghĩa. Nhưng sự xuất hiện của Vị Vua Tối Cao đầu tiên đã thay đổi tất cả. Tố chất lãnh đạo trời ban của ngài đã hun đúc nên một vương quốc không gì sánh kịp.\n\nVị Vua Tối Cao vô cùng ngoan đạo. Ngài tuyên chiến với mọi kẻ ngoại đạo, nhưng ngọn lửa dị giáo vẫn cháy mãi không dứt. Cho đến một ngày, Độc Thánh giáng lâm xuống thế giới của chúng ta, lời cầu nguyện của Vị Vua Tối Cao đã được hồi đáp. Dù sự xuất hiện của Ngài chỉ là cái chớp mắt, nhưng sức mạnh độc hại của Ngài đã lây nhiễm mọi vùng đất của những kẻ không có đức tin. Những người sống sót vội vã quy thuận Vị Vua Tối Cao. Lần đầu tiên, hành tinh của chúng ta được thống nhất.\n\nĐộc Thánh nhanh chóng rời bỏ chúng ta, nhưng Vị Vua Tối Cao quyết tâm phải tìm ra Ngài, và một hiệp sĩ đoàn đã được thành lập vì mục đích đó. Trải qua bao thế kỷ, những linh hồn dũng cảm ấy vẫn mải miết kiếm tìm, nhưng chẳng thu được gì. Cuộc hành hương này là một nỗ lực cực kỳ tốn kém. Theo thời gian, vương quốc ngày càng quan tâm đến việc theo đuổi danh lợi để có thể nuôi sống các hiệp sĩ. Mọi công dân, dù là sống hay tiêu dùng, đều là đang góp phần hỗ trợ cho cuộc hành hương.\n\nĐộc Thánh đã rời xa thế giới của chúng ta từ quá lâu rồi. Chương tiếp theo của cuộc hành hương thử thách này sẽ được viết nên giữa các vì sao. Nhờ vào một thánh tích hùng mạnh, hiệp sĩ đoàn đã xây dựng trạm không gian đầu tiên của đế chế. Tòa thành trì kiên cố này sẽ là bệ phóng đưa họ vút bay vào biển sao vô tận."
 job_knight: "Hiệp Sĩ"
 job_knight_plural: "Các Hiệp Sĩ"
 job_knight_desc: "Được huấn luyện để chiến đấu, tài đức vẹn toàn. Những hiệp sĩ này là tinh hoa của xã hội chúng ta, họ cống hiến tất cả chỉ vì một mục đích duy nhất: truy tìm Độc Thánh."
