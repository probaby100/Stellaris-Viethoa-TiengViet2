 building_toxic_bath: "Spa Đột Biến"
 building_toxic_bath_tt: "Chỉ số Thống đốc:$TABBED_NEW_LINE$—Cấp độ kỹ năng thực tế của kẻ nghiện thuốc: §G+3§!\n\nHiệu ứng Thống đốc:$TABBED_NEW_LINE$—£leader£Lãnh đạo được phân công quản lý thuộc địa này sẽ nhận được đặc điểm ['leader_trait:leader_trait_substance_abuser']."
 building_toxic_bath_hive: "Bể Tái Cấu Trúc Đột Biến"
 building_toxic_bath_machine: "Bể Tắm Siêu Bôi Trơn"
 building_toxic_bath_desc: "Dù Spa Đột Biến là một cơ sở trị liệu vô cùng tiên tiến, được chứng minh qua nhiều tài liệu là có vô số lợi ích cho sức khỏe, nhưng với một số người, phương pháp này vẫn hơi ghê rợn. Mỗi giọt chất lỏng trong hồ tắm đều có tính đột biến cao hơn hẳn so với bất kỳ món hàng cấm nào khác trong thiên hà."
 building_toxic_bath_hive_desc: "Bể Tái Cấu Trúc Đột Biến thể hiện hoàn hảo cảnh giới tối cao mà ý thức tập thể đã đạt được trong quá trình mở rộng tâm trí vô tận của mình."
 building_toxic_bath_machine_desc: "Bể Tắm Siêu Bôi Trơn là một giải pháp đậm chất logic nhằm giải quyết các vấn đề thường gặp trong việc bảo trì người máy phức tạp như ma sát, quá nhiệt và tĩnh điện."
