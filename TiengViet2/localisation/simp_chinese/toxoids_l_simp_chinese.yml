 job_squire_desc: "Để trở thành một hiệp sĩ cần phải rèn luyện nhiều năm trời. Những ai mong muốn gia nhập hiệp sĩ đoàn phải bắt đầu bằng việc hầu hạ một hiệp sĩ, học hỏi từ tấm gương của họ, và thậm chí phải nỗ lực để đảm bảo cuộc sống quý tộc của các hiệp sĩ được thoải mái."
 job_squire_effect_desc: "[squire.GetIcon] [squire.GetNamePlural] cung cấp $r_amenities$ và tăng §Y$MOD_POP_BONUS_WORKFORCE_MULT$§! của §Y[knight.GetIcon][knight.GetNamePlural]§!."
