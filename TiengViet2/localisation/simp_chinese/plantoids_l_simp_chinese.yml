 PLANTOID_TITLE: "Plantoids Species Pack" #Không dịch
 DLC_PLANTOID_RECOMMENDATION_DESC: "Bản mở rộng §S《Plantoids Species Pack》§! bổ sung chân dung các loài thực vật có tri giác đang gieo mầm sống khắp các vì sao và bám rễ tại đó."
 DLC_PLANTOID_RECOMMENDATION_PLANTS_REC: "Chúng tôi đề xuất §S《Plantoids Species Pack》§! vì chủ đề của đế chế này rất phù hợp với hệ thực vật trong đó."
 ### Nguồn gốc Hợp Tác Đơm Hoa
 ## Bởi Giada Zavarise
 feeding_station: "Vườn Quả Ngọt"
 feeding_station_plural: "Vườn Quả Ngọt"
 origin_fruitful: "Cộng Sinh Đơm Hoa"
 origin_fruitful_desc: "Nền văn minh xanh tươi này đã hình thành một mối quan hệ cộng sinh độc đáo với các sinh vật không gian. Bằng cách dâng tặng trái ngọt cho những sinh vật này, họ thu hút những \"người gieo mầm\" giúp họ khai hoang."
 origin_tooltip_fruitful_effects: "—Bầy thú không gian: gieo rắc ['concept_seed_pod', Vỏ ươm mầm] khắp cõi sao\n—$AVAILABLE_STARBASE_BUILDINGS$['concept_sm_feeder', Vườn Ươm Vì Sao]\n—$AVAILABLE_BOMBARDMENT_STANCE$['concept_seed_bombing' ]\n—$HOME_SYSTEM$['concept_tiyanki' ] xuất hiện ở các hệ sao lân cận"
 civic_tooltip_hive_xenophile_or_pacifist: "Ít nhiều thiên về §YChuộng Ngoại§!, §YHòa Bình§! hoặc là một §YÝ Thức Bầy Đàn§!"
 START_SCREEN_FRUITFUL_PLANTOID: "Nếu bộ rễ của bạn đã cắm quá sâu nhưng tâm trí lại bồn chồn muốn xê dịch, hãy để kẻ khác gánh vác nỗi niềm đó thay bạn. Hãy để muông thú ngửi lấy hương hoa, ban tặng chúng thức ăn là quả ngọt và bóng râm che mát. Rồi để chúng mang phấn hoa và hạt giống của bạn vươn xa, cho con cháu bạn nảy mầm trên những vùng đất xa lạ. Khi ngọn gió đưa tiếng lá xào xạc bay về, bạn sẽ biết những đứa con xa xứ đã tìm được tổ ấm mới.\n\nTừ thuở hồng hoang, chúng ta đã hợp tác với các loài động vật bản địa để nhân giống nòi giống khắp [GetHomeWorldName]. Vì vậy, khi sắp rời xa quê hương, vươn những nhánh cây lên bầu trời, chúng ta tự nhiên cũng kết nối với những đàn thú trong khoảng không. Hãy để chúng gặm nhấm trái ngọt, nhai ngấu nghiến cành lá của chúng ta. Rồi để chúng mang con cháu chúng ta đến những hành tinh xa xôi, nơi chúng sẽ vươn mình mạnh mẽ dưới ánh mặt trời ngoại lai.\n\nNguyện cho hạt giống vương vãi khắp nơi, nguyện cho cõi sao trở thành khu vườn của chúng ta."
 START_SCREEN_FRUITFUL_FUNGOID: "Nếu hệ sợi nấm của bạn đã cắm quá sâu nhưng tâm trí lại bồn chồn muốn xê dịch, hãy để kẻ khác gánh vác nỗi niềm đó thay bạn. Hãy để muông thú ngửi lấy bào tử, ban tặng chúng thức ăn từ cuống nấm và bóng râm từ mũ nấm che mát. Rồi để chúng mang bào tử của bạn vươn xa, cho con cháu bạn nảy mầm trên những vùng đất xa lạ. Khi lòng đất truyền về lời thì thầm của mạng lưới nấm, bạn sẽ biết những đứa con xa xứ đã tìm được tổ ấm mới.\n\nTừ thuở hồng hoang, chúng ta đã hợp tác với các loài động vật bản địa để nhân giống nòi giống khắp [GetHomeWorldName]. Vì vậy, khi sắp rời xa quê hương, vươn những cuống nấm lên bầu trời, chúng ta tự nhiên cũng kết nối với những đàn thú trong khoảng không. Hãy để chúng gặm nhấm quả thể, nhai ngấu nghiến các phiến nấm của chúng ta. Rồi để chúng mang con cháu chúng ta đến những hành tinh xa xôi, nơi chúng sẽ vươn mình mạnh mẽ trong lớp đất ngoại lai.\n\nNguyện cho hạt giống vương vãi khắp nơi, nguyện cho cõi sao trở thành khu vườn nấm của chúng ta."
 ## Công Nghệ
 sm_feeder: "Vườn Ươm Vì Sao"
 sm_feeder_desc: "Một khu vườn chân không được xây dựng trên Căn Cứ Không Gian, mọc đầy các loài thực vật biến đổi gen nhằm thu hút bầy thú không gian."
 sm_feeder_tt: "Hiệu ứng:\n$t$Thu hút bầy thú không gian đến Căn Cứ Không Gian kiếm ăn, đồng thời mang theo và gieo rắc §YVỏ ươm mầm§!"
 sm_ring_feeder: "Vườn Quỹ Đạo"
 sm_ring_feeder_desc: "Một khu vườn chân không được xây dựng trên Vành Đai Quỹ Đạo, trĩu nặng những loại quả được kỹ sư sinh học biến đổi gen nhằm tăng cường sức hút đối với các sinh vật không gian."
 tech_critter_feeder: "Vườn Quả Ngọt"
 tech_critter_feeder_desc: "Một khu vườn chân không trĩu nặng những loại quả được kỹ sư sinh học biến đổi gen nhằm tăng cường sức hút đối với các sinh vật không gian."
 sseeder: "Trạm Vườn Trái"
 has_origin_fruitful_special_project_key: "Đế chế có nguồn gốc §Y$origin_fruitful$§! có thể sử dụng một §YDự án đặc biệt§!"
 seeded_planet_0_modifier: "Vỏ Ươm Ngủ Đông"
 seeded_planet_0_modifier_desc: "Những hạt giống kỳ lạ từ một hệ sinh thái hoàn toàn khác đang ngủ yên trên hành tinh này."
 seeded_planet_0_modifier_tooltip: "$has_origin_fruitful_special_project_key$ để mở Vỏ ươm mầm và khai hoang hành tinh này."
 seeded_planet_1_modifier: "Thực Vật Ngoại Lai Xâm Lấn"
 seeded_planet_1_modifier_desc: "Hạt giống từ một vùng đất khác đã tìm thấy mảnh đất màu mỡ tại đây và đang dần thay thế thảm thực vật bản địa."
 seeded_planet_1_modifier_tooltip: "$has_origin_fruitful_special_project_key$ để triệu hồi Quân Bộ trên hành tinh này trong thời chiến."
 seeded_planet_2_modifier: "Phát Tán Thực Vật Ngoại Lai"
 seeded_planet_2_modifier_desc: "Hạt giống từ một vùng đất khác đã tìm thấy mảnh đất màu mỡ tại đây và thay thế thảm thực vật bản địa."
 seeded_planet_2_modifier_tooltip: "$seeded_planet_1_modifier_tooltip$"
 seeded_planet_3_modifier: "Thực Vật Ngoại Lai Hủy Diệt"
 seeded_planet_3_modifier_desc: "Hạt giống từ một vùng đất khác đã tìm thấy mảnh đất màu mỡ tại đây và đang tàn phá thảm thực vật bản địa."
 seeded_planet_3_modifier_tooltip: "$seeded_planet_1_modifier_tooltip$"
 MESSAGE_FRUITFUL_SEED_PLANTED_TITLE: "Vỏ Ươm Đã Gieo"
 MESSAGE_FRUITFUL_SEED_PLANTED_OWNER: "Vỏ ươm của chúng ta đã được bầy thú không gian mang đến $PLANET|Y$ trong hệ sao $SYSTEM|Y$, chúng sẽ vươn mình thành những cánh rừng mới tại đó."
 MESSAGE_FRUITFUL_SEED_PLANTED_NO_OWNER: "Vỏ ươm của chúng ta đã được bầy thú không gian mang đến $PLANET|Y$ trong hệ sao $SYSTEM|Y$. Chúng sẽ ngủ đông để chờ chúng ta đánh thức."
 MESSAGE_FRUITFUL_SEED_LOST_TITLE: "Thất Lạc Vỏ Ươm"
 MESSAGE_FRUITFUL_SEED_LOST: "Chúng ta đã mất liên lạc với Vỏ ươm mầm trên $PLANET|Y$. Có vẻ như chúng đã bị phá hủy."
 MESSAGE_FRUITFUL_SEED_CRITTER_TITLE: "Hạt Giống Bị Nuốt"
 MESSAGE_FRUITFUL_SEED_CRITTER: "Bầy thú không gian ghé thăm $SYSTEM|Y$ đã ăn trái cây trong vườn của chúng ta, hiện đang mang theo hạt giống trôi dạt khắp cõi sao."
 OPEN_SEED_PODS_PROJECT: "Mở Vỏ Ươm Mầm trên [this.GetName]"
 OPEN_SEED_PODS_PROJECT_DESC: "Bầy thú không gian đã mang Vỏ ươm ngủ đông của chúng ta đến §H[this.GetName]§!. Bằng cách chiếu một chùm tia năng lượng hội tụ vào hành tinh này, ta có thể kích thích chúng nảy mầm, biến một tinh cầu hoang vu thành một thuộc địa xanh tươi mới."
 WEEDS_ARMY_PROJECT: "Ươm Mầm Quân Bộ trên [this.GetName]"
 WEEDS_ARMY_PROJECT_DESC: "Vỏ ươm của ta đã được bầy thú không gian đưa tới §H[this.GetName]§!, nơi chúng được §H[this.owner.GetName]§! gieo trồng và chăm sóc. Bằng cách chiếu một chùm tia năng lượng vào hành tinh này, ta có thể biến cánh rừng đó thành §HQuân Đội Thực Vật Ngoại Lai§!. Cấp độ của §HThực Vật Ngoại Lai Xâm Lấn§! trên hành tinh càng cao, số lượng Quân Bộ được sinh ra càng nhiều."
 FRUITFUL_SEED_POD: "Vỏ Ươm Mầm"
 fruitful_army: "Quân Đội Thực Vật Ngoại Lai"
 fruitful_army_desc: "Một tín hiệu mã hóa đã đánh thức đám thực vật ngoại lai say ngủ bấy lâu. Một khi bị nhổ bật gốc rễ, chúng sẽ không ngừng tiến bước, vung vẩy chính những bộ rễ cồng kềnh và đờ đẫn của mình như một thứ vũ khí hạng nặng."
 #Sự kiện
 origin.7100.name: "Phát Tán Hạt Giống"
 origin.7100.desc: "Chúng ta đã xây dựng một khu vườn cho các sinh vật không gian. Ta điểm xuyết nơi đây bằng vô vàn đóa hoa bung nở, quả ngọt trĩu cành cùng những Vỏ ươm mầm dính nhớp, luôn chực chờ bám chặt vào lớp da của những sinh linh diệu kỳ ấy. Nhưng liệu những thực thể của cõi hư không này có màng đến dự bữa tiệc của chúng ta chăng? Khi chúng cắn miếng quả đầu tiên, mọi âu lo đều tan biến.\n\nTừ thuở hồng hoang, chúng ta đã ban tặng hoa trái và bóng râm cho muôn loài trên thế giới của mình. Đáp lại, chúng giúp ta gieo rắc mầm sống. Giờ đây, khế ước cổ xưa ấy lại được tái hiện trên quy mô toàn thiên hà: các sinh vật không gian sẽ mang theo §YVỏ ươm mầm§! của ta du hành khắp nơi. Nếu may mắn, hạt giống của chúng ta sẽ rơi xuống một §Hhành tinh có thể khai hoang§! và tự tìm thấy mọi thứ cần thiết để vun đắp một khu vườn mới cho giống loài. Ta chỉ cần định hướng một chùm tia năng lượng để kích hoạt chúng, vậy là ta có thể định cư trên một thế giới mới mà chẳng cần động đến tàu thực dân."
 origin.7100.tooltip: "Khi tiến vào một hệ sao mới, các sinh vật không gian sẽ có xác suất gieo §HVỏ ươm mầm§! xuống một hành tinh có thể sinh sống. Xin hãy kiên nhẫn chờ đợi."
 origin.7304.name: "Cộng Sinh Phát Tán"
 origin.7304.desc: "Dù bầy thú không gian có thể giúp ta rải §YVỏ ươm mầm§!, nhưng vẫn chẳng thể nào đáng tin cậy bằng những thành viên mới gia nhập hạm đội gần đây.\n\n§YVườn Ươm Vì Sao§! của chúng ta sẽ phân phát hạt giống cho các sinh vật dưới trướng, sau đó ta có thể trực tiếp phái chúng đến các §Hhành tinh phù hợp để khai hoang§!, mở ra những khu vườn mới tại đó."
 origin.7321.name: "Gian Nan Thử Sức"
 origin.7321.desc: "Ta đã mở §YVỏ ươm mầm§! trên §H[from.GetName]§!, những [root.GetSpeciesNamePlural] sơ sinh bắt đầu bám rễ và nảy mầm."
 origin.7326.name: "Hạt Giống Bí Ẩn"
 origin.7326.desc.base: "Mặt đất trên [this.GetName] rải rác những hạt giống dường như không thuộc về hệ sinh thái bản địa. Chỉ với chút ánh sáng và hơi nước ít ỏi, chúng vươn mình lớn nhanh như thổi, những cánh rừng mới sinh nhanh chóng bao trùm toàn bộ hành tinh, thúc đẩy hoạt động khai hoang của chúng ta."
 origin.7326.desc.knowowner: "$origin.7326.desc.base$\n\nDựa trên phân tích gen, những hạt giống biến đổi gen sinh trưởng thần tốc này là tác phẩm của §Y[seeds_owner.GetName]§!."
 origin.7326.desc.notknowowner: "$origin.7326.desc.base$. Các nhà khoa học của ta không thể phân tích nguồn gốc của những hạt giống này, nhưng có một điều chắc chắn: chúng đã được chỉnh sửa gen nhân tạo để có thể bén rễ nhanh chóng trên đất ngoại lai."
 origin.7326.a.desc: "Mở khóa quyết định §Y$decision_uproot_weed$§! trên hành tinh này."
 origin.7327.name: "$origin.7326.name$"
 origin.7327.desc.base: "Khi băng qua hệ sao [this.solar_system.GetName], một bầy thú không gian đã đánh rơi một vật thể lạ và lao xuống bề mặt [this.GetName]. Chúng ta nhanh chóng có mặt tại điểm va chạm, chỉ để thấy nơi đây đã bị bao phủ bởi một thảm thực vật chưa từng thấy. Vật thể rơi xuống có vẻ là một loại tàu thực dân: một vỏ ươm mầm chứa đầy những nguyên liệu then chốt, những tân thực dân vừa thức tỉnh và mọi thứ thiết yếu để dựng nên một khu định cư."
 origin.7327.desc.knowowner: "$origin.7326.desc.base$\n\nDựa trên phân tích gen, những hạt giống đặc biệt này là tác phẩm của §Y[seeds_owner.GetName]§!."
 origin.7327.desc.notknowowner: "$origin.7326.desc.base$\n\nNhờ hệ thống liên lạc trong những Vỏ ươm mầm này, chúng ta có thể nhanh chóng kết nối với đế chế cội nguồn của những hạt giống này."
 origin.7327.desc.moreseeds: "Thực vật ngoại lai trên hành tinh của chúng ta đã phát triển mạnh mẽ hơn trước."
 origin.7328.name: "$origin.7321.name$"
 origin.7328.desc: "Tàu thực dân của chúng ta vừa hạ cánh xuống §H[from.GetName]§!, nhưng những đồng bào say ngủ của chúng ta đã cắm rễ thật sâu vào lòng đất từ lâu. Lượng [root.owner.GetSpeciesNamePlural] và tài nguyên mang theo trong §YVỏ ươm mầm§! sẽ hỗ trợ rất nhiều cho quá trình phát triển thuộc địa trên tinh cầu này.\n\nCầu chúc cho họ cành lá xum xuê."
 origin.7400.name: "Triển Khai Tiền Đồn!"
 origin.7400.desc: "Những [owner.GetColonistPlural] xa xôi của chúng ta trên §Y[Root.GetName]§! đã triển khai một §Y$starbase_outpost$§! gần ngôi sao, từ đó giành quyền kiểm soát hệ sao §Y[Root.GetStarName]§!."
 origin.7500.name: "Đảm Bảo An Toàn Bầy Thú Không Gian"
 origin.7500.desc: "Mối liên kết giữa chúng ta với các sinh vật không gian vô cùng đặc biệt, nhưng ta không phải là những kẻ duy nhất tôn trọng quyền sống của chúng. Một nghị án vừa được Cộng Đồng Thiên Hà thông qua sẽ chung tay bảo vệ những sinh linh diệu kỳ này."
 origin.7510.name: "Bầy Thú Không Gian Gặp Nguy"
 origin.7510.desc: "Các sinh vật không gian luôn là bầu bạn của ta, nhưng chẳng phải thành viên nào của Cộng Đồng Thiên Hà cũng có tấm lòng yêu thương chúng như vậy. Nghị quyết họ vừa thông qua đã đẩy những người bạn của ta — và cả chính ta nữa — vào vòng hiểm nguy."
 origin.7600.name: "Gieo Gió Gặt Bão"
 origin.7600.desc: "Kẻ thù ngỡ rằng chúng ta sẽ chịu khuất phục trước sức mạnh của chúng, hệt như ngọn cỏ lau ngả rạp trước cơn bão. Bọn chúng đã quên mất rằng hoa hồng nào mà chẳng có gai.\n\nBinh lính của ta đang say ngủ ngay trên chính mảnh đất của chúng. Bất cứ khi nào cần, ta có thể biến đám §HThực Vật Ngoại Lai Xâm Lấn§! thành Quân Bộ, để bảo vệ những gì ta trân quý và bóp nghẹt những thứ mà chúng tự xưng là chủ. Chỉ cần hội tụ một chùm tia năng lượng xuống hành tinh đã chọn, chiến dịch xâm lược của chúng ta sẽ ngay lập tức khai màn."
 origin.7710.name: "Gieo Gió Gặt Bão"
 origin.7710.desc: "Đám §HThực Vật Ngoại Lai Xâm Lấn§! trên §H[from.GetName]§! đột nhiên mọc ra tứ chi và hóa thành một đội quân. Hành tinh này đang bị tấn công!"
 MESSAGE_FRUITFUL_WEED_ARMY_TITLE: "Quân Bộ Nảy Mầm"
 MESSAGE_FRUITFUL_WEED_ARMY: "Hạt giống trên $PLANET|Y$ đã lớn lên thành một đội quân."
 opinion_nice_forests: "Người Làm Vườn Đắc Lực"
 opinion_cut_our_forests: "Cắt Tỉa Vườn Của Ta"
 opinion_voted_to_kill_tiyanki: "Bỏ phiếu ủng hộ việc hãm hại bầy thú không gian"
 opinion_voted_to_help_tiyanki: "Bỏ phiếu ủng hộ việc bảo vệ bầy thú không gian"
 fruitful_partnership_chain_title: "Phát Tán Hạt Giống"
 fruitful_partnership_chain_desc: "Bầy thú không gian sẽ mang §YVỏ ươm mầm§! của ta tới những miền đất xa xôi. Chỉ cần một tia sáng nhỏ, hạt giống của chúng ta sẽ bung nở thành một thuộc địa mới."
 fruitful_partnership_war_chain_title: "Hạt Giống Chiến Tranh"
 fruitful_partnership_war_chain_desc: "Trong thời chiến, những §YVỏ ươm mầm§! của chúng ta có thể nảy mầm thành Quân Bộ, luôn sẵn sàng bảo vệ quê hương hoặc đánh chiếm những mục tiêu xa xôi."
 decision_uproot_weed: "Nhổ Cỏ Tận Gốc"
 decision_uproot_weed_desc: "Loại bỏ $seeded_planet_2_modifier$."
 ## Oanh Tạc Hạt Giống
 bombardment_seed_bombing: "Oanh Tạc Hạt Giống"
 bombardment_seed_bombing_desc: "$bombardment_seed_bombing$ che phủ hành tinh bằng những quả cầu hạt siêu thụ phấn, kích thích sự bùng nổ sinh trưởng.\n—§EKhông gây hại§! cho §YQuân Bộ§!\n—Gây sát thương §HNặng§! cho §YHành Tinh§!\n—§EKhông gây hại§! cho §YDân Số§!\n—Sẽ oanh tạc những hành tinh không có phòng ngự\n—Tạo ra chướng ngại vật trên hành tinh"
 d_seed_bombing_plantoid_blocker: "£blocker£Rừng Rậm Bùng Nổ"
 d_seed_bombing_plantoid_blocker_desc: "Khu vực này của hành tinh đã bị lây nhiễm bởi một khu rừng thực vật ngoại lai tăng sinh vô độ."
 d_seed_bombing_fungoid_blocker: "£blocker£Nấm Mốc Bùng Nổ"
 d_seed_bombing_fungoid_blocker_desc: "Khu vực này của hành tinh đã bị lây nhiễm bởi những thảm nấm ngoại lai tăng sinh vô độ."
 d_seed_bombing_blocker_custom_tooltip: "$d_decrepit_dwellings_custom_tooltip$\n"
 origin.7201.name: "Sinh Trưởng Bùng Nổ"
 origin.7201.desc: "Thuộc địa của ta trên §H[this.GetName]§! đang bị oanh tạc bằng những quả cầu hạt siêu thụ phấn. Những khu rừng sinh sôi chóng mặt trên khắp thế giới, xé toạc mặt đất, kéo sập các tòa nhà. Giờ đây, [this.GetPlanetHabitat] đang bị những loài thực vật ngoại lai bành trướng xâm chiếm."
 MESSAGE_FRUITFUL_SEED_BOMBING_TITLE: "Oanh Tạc Hạt Giống"
 MESSAGE_FRUITFUL_SEED_BOMBING: "Cuộc oanh tạc hạt giống đã tạo ra một chướng ngại vật mới trên $PLANET|Y$."
 ## Tương tác với Sinh Vật Không Gian
 #Trùng Amip
 story.101.desc.fruitful: "Nếu được xoa dịu, chúng có thể trở thành \"phu khuân vác\" lý tưởng cho những vỏ ươm mầm của chúng ta."
 story.107.fruitful.desc: "Dù là loài ăn thịt, nhưng những quả tùng cuộn thịt do các nhà nghiên cứu của ta lai tạo lại có sức hấp dẫn kỳ lạ với khẩu vị của chúng."
 story.107.a.fruitful.tooltip: "§H$sm_feeder$§! của ta giờ đã có thể thu hút bầy §HTrùng Amip Không Gian§!."
 #Tinh Thể
 story.201.desc.fruitful: "Ta không chắc liệu đám sinh vật này có ăn uống hay không, chỉ cần chúng biết ăn là có thể làm kẻ mang hạt giống cho ta rồi. Việc xoa dịu chúng sẽ giúp ta có thêm cơ hội để tiến hành các nghiên cứu sâu hơn."
 story.207.fruitful.desc: "Nuôi cấy những quả ngọt khoái khẩu cho lũ sinh vật này quả là một bài toán hóc búa. Chúng ta vẫn chưa rõ liệu chúng đang ăn những nón thông thủy tinh do ta tạo ra, hay chỉ đơn thuần là bị thu hút bởi bề mặt nhẵn bóng nên nhặt mang theo. Dù là gì đi nữa, thế này cũng đủ đáp ứng nhu cầu của chúng ta rồi."
 story.207.a.fruitful.tooltip: "§H$sm_feeder$§! của ta giờ đã có thể thu hút bầy §HThực Thể Tinh Thể§!."
 #Nghiên cứu Tiyanki và nhận công nghệ của chúng
 origin.7000.name: "$story.501.name$"
 origin.7000.desc.common: "Chúng ta đã tường tận khá nhiều điều về sinh vật ngoan ngoãn này.\n\nLoài thú không gian này có khả năng tiếp cận một loại Không gian con ở chiều kích thấp hơn, nên chúng dễ dàng băng qua lại giữa các hệ sao. Chúng lấy khí từ tầng thượng quyển của các hành tinh khí làm nguồn sống, nhưng nay lại đâm ra say mê trái cây của chúng ta. Ngay cả khi bị quấy nhiễu, chúng cũng hiếm khi tấn công đáp trả.\n\nĐây chính là vật chủ mang mầm hoàn hảo của chúng ta: điềm tĩnh, vô hại và thậm chí có phần tẻ nhạt. Liệu chúng có đang chôn giấu bí mật nào không?"
 origin.7000.desc.default: "§YTiyanki§! là chủng loài ngoài hành tinh đầu tiên mà ta chạm trán. $origin.7000.desc.common$"
 origin.7000.desc.beastmasters: "§YTiyanki§! là chủng loài ngoài hành tinh mới nhất mà ta chạm trán. $origin.7000.desc.common$"
 origin.7000.a: "Hãy dành thêm thời gian nghiên cứu chúng."
 origin.7000.b: "Chúng ta vẫn còn những việc quan trọng hơn."
 TIYANKIS_PROJECT: "Quan Trắc Tiyanki"
 TIYANKIS_PROJECT_DESC: "Điều động nhân sự trạm vũ trụ tham gia nghiên cứu Tiyanki có thể giúp ta hiểu rõ hơn về tập tính của những sinh vật không gian trầm mặc và bí ẩn này."
 origin.7005.name: "$story.501.name$"
 origin.7005.desc: "Nhờ nghiên cứu thói quen ăn uống của những người bạn không gian này, các nhà khoa học của ta đã đạt được một bước đột phá lớn. $tech_space_whale_weapon_1_desc$. Chắc chắn công nghệ này sẽ vô cùng hữu ích."
 ### Thể Chế
 civic_idyllic_bloom: "Thôn Dã Nở Hoa"
 civic_idyllic_bloom_desc: "Xã hội này luôn dành nhiều thời gian để cải tạo và yêu thương môi trường, khao khát kiến tạo nên một thiên đường đúng nghĩa cho các cư dân."
 civic_hive_idyllic_bloom: "Lý Tưởng Nấm Rễ"
 civic_hive_idyllic_bloom_desc: "Ý thức bầy đàn này rất trân quý môi trường tự nhiên, luôn theo đuổi sự hòa hợp tuyệt đối thông qua việc kiến thiết những thiên đường sinh thái."
 civic_wilderness_idyllic_bloom: "$civic_hive_idyllic_bloom$"
 civic_wilderness_idyllic_bloom_desc: "Chốn hoang dã khao khát một trạng thái hòa hợp hoàn mỹ chân chính, do đó đã trao quyền cho các thể cộng sinh của nấm và thực vật được phép cải tạo thế giới xung quanh."
 civic_tooltip_idyllic_bloom_effects: "Có thể xây dựng £building£§Y$building_gaiaseeders$§! trên những hành tinh lý tưởng của bạn và các giống loài chư hầu ban đầu.\n$building_gaiaseeders_all_desc$\nKhi mở khóa công nghệ £society£§YCải Tạo Môi Trường§! cấp cao hơn, £building£§Y$building_gaiaseeders$§! cũng có thể được xây trên các dạng hành tinh khác."
 disables_idyllic_bloom: "§RChọn Thiên Hướng Thăng Thiên này sẽ làm vô hiệu hóa thể chế $civic_idyllic_bloom$§!"
 civic_tooltip_not_idyllic_bloom: "Không có thể chế thuộc loại ['concept_idyllic_bloom_civics']"
 concept_idyllic_bloom_civics: "Thôn Dã Nở Hoa"
 concept_idyllic_bloom_civics_desc: "Các thể chế quốc gia loại $concept_idyllic_bloom_civics$ bao gồm:\n—['civic:civic_idyllic_bloom']$NEW_LINE$—['civic:civic_hive_idyllic_bloom']"
 gaia_seeder_bloomed_pops_effect: "Sau khi Trạm Gieo Hạt Gaia chuyển hóa thành công [This.GetName] thành $pc_gaia$, nó sẽ giúp dân số của ta thích ứng sâu hơn với hành tinh này.\n\nHiệu ứng của đặc điểm §Y$trait_plantoid_bloomed$§! và §Y$trait_plantoid_budding$§! tăng thêm §G+50%§!."
 gaia_seeder_bloom_timer_tooltip: "\nLần nở hoa kế tiếp của §Y[This.GetName]§! sẽ diễn ra vào §Y[This.gaia_seeder_bloom_timer]§!."
 MESSAGE_POPS_IDYLLIC_BLOOMED_TITLE: "Dân Số Nở Hoa"
 MESSAGE_POPS_IDYLLIC_BLOOMED: "Trạm Gieo Hạt Gaia trên $PLANET|Y$ lại tiếp tục gây ra sự bùng nổ hoa nở, làm tăng số lượng £pop£ dân cư của ta."
 gaiaseeders_tomb_world: "$TRIGGER_FAIL$Cần có £society£§Y$tech_climate_restoration$§! để xây dựng trên §YHành Tinh Chết§!."
