 building_gaiaseeders: "Trạm Gieo Hạt Gaia"
 building_gaiaseeders_1: "$building_gaiaseeders$ - Giai đoạn 1"
 building_gaiaseeders_2: "$building_gaiaseeders$ - Giai đoạn 2"
 building_gaiaseeders_3: "$building_gaiaseeders$ - Giai đoạn 3"
 building_gaiaseeders_4: "$building_gaiaseeders$ - Hoàn tất"
 building_gaiaseeders_all_desc: "Mạng lưới cơ sở vật chất trải rộng khắp hành tinh, sẽ trải qua 4 giai đoạn nâng cấp để từng bước biến tinh cầu này thành một §YHành Tinh Gaia§!."
 building_gaiaseeders_1_desc: "$building_gaiaseeders_all_desc$\n\nĐây là giai đoạn tăng tốc sinh trưởng sơ khởi."
 building_gaiaseeders_2_desc: "$building_gaiaseeders_all_desc$\n\nGiai đoạn này chuyển sang tập trung cải thiện tính có thể ở được."
 building_gaiaseeders_3_desc: "$building_gaiaseeders_all_desc$\n\nGiai đoạn này tiếp tục tối ưu hóa môi trường sống cho sinh vật."
 building_gaiaseeders_4_desc: "$building_gaiaseeders_all_desc$"
 building_gaiaseeders_4_effect_desc: "Khi hoàn tất, hành tinh sẽ được chuyển hóa thành một §YHành Tinh Gaia§!."
 building_gaiaseeders_pc_gaia: "$building_gaiaseeders_4$"
 building_gaiaseeders_pc_gaia_desc: "$building_gaiaseeders_4_desc$"
 plant.100.name: "Thiên Đường Cực Phẩm"
 plant.100.desc: "Nhờ trình độ kỹ thuật sinh học siêu việt, nguồn vốn đầu tư khổng lồ cùng nhiều năm trời lao động cần mẫn, chiến dịch gieo mầm Gaia của ta trên §Y[Root.GetName]§! cuối cùng cũng đơm hoa kết trái.\n\nKể từ hôm nay, §Y[Root.GetName]§! chắc chắn sẽ được nhìn nhận như một viên ngọc quý đích thực, khiến các thế giới khác phải trầm trồ ngưỡng mộ hay ghen tị."
 plant.100.a: "Mở tiệc ăn mừng thôi!"
 plant.100.b: "Làm tốt lắm, giờ là lúc tập trung vào những chuyện khác."
 plant.105.desc: "Nhờ trình độ kỹ thuật sinh học siêu việt, nguồn vốn đầu tư khổng lồ cùng nhiều năm trời lao động cần mẫn, chiến dịch gieo mầm Gaia của ta trên §Y[From.Planet.GetName]§! cuối cùng cũng đơm hoa kết trái.\n\nKể từ hôm nay, §Y[From.Planet.GetName]§! chắc chắn sẽ được nhìn nhận như một viên ngọc quý đích thực, khiến các thế giới khác phải trầm trồ ngưỡng mộ hay ghen tị."
 plant.110.desc: "Lãnh chúa của ta vừa hoàn tất một dự án kỳ lạ trên §Y[from.from.planet.GetName]§!, biến nơi này thành một hành tinh Gaia. Thật là đặc ân, giờ thì chúng ta đã có thể tận dụng cõi thiên đường có khí hậu êm đềm và cảnh sắc như tranh vẽ này."
 plant.110.desc.hydrocentric: "Lãnh chúa của ta đã hoàn tất cái dự án quái gở của họ trên §Y[from.from.planet.GetName]§!. Hành tinh này đã bị tàn phá triệt để! Họ dùng những vùng bình nguyên bẩn thỉu và những dãy núi gồ ghề lấp kín đại dương. Bầu không khí ẩm ướt ngày nào giờ trở nên khô hanh và hoang vắng. Tệ hơn nữa, họ nhắm mắt làm ngơ trước sự bất bình của chúng ta! Bọn lãnh chúa dám tuyên bố rằng họ đã làm cho hành tinh của ta \"mỹ miều hơn\"."
 plant.110.a: "Sao họ dám làm thế cơ chứ!"
 plant.110.b: "Thật là chu đáo!"
 plant.110.c: "Một quyết định khó mà thấu hiểu."
 celebrate_idyllic_bloom: "Ăn Mừng Cải Tạo Nông Thôn"
 celebrate_idyllic_bloom_desc: "Sau khi hành tinh được chuyển hóa thành công thành một chốn bồng lai tiên cảnh, một lễ hội quy mô toàn cầu đang được diễn ra để ăn mừng sự kiện này."
 terraformed_our_ocean_world: "Thế Giới Đại Dương Bị Thay Đổi"
 terraformed_our_ocean_world_desc: "Lãnh chúa đã cày nát Thế giới Đại dương xinh đẹp của ta thành một hành tinh Gaia chết tiệt. Thật muốn mửa."
 thankful_for_gaia: "Biết Ơn Vì Gaia"
 thankful_for_gaia_desc: "Lãnh chúa gần đây đã cải tạo một hành tinh của ta thành hành tinh Gaia. Họ đối xử với ta quả là quá tốt!"
 ### Đặc điểm bởi Byron Aytoun
 trait_plantoid_phototrophic: "Quang Dưỡng"
 trait_plantoid_phototrophic_desc: "§LLoài này cần cả thức ăn và ánh nắng mặt trời để sinh tồn.§!\n"
 TRAIT_PLANTOID_PHOTOTROPHIC_EFFECT: "Thay thế §Y50%§! phí bảo trì $food_with_icon$ (hoặc tương đương) bằng phí bảo trì $energy_with_icon$."
 trait_plantoid_radiotrophic: "Bức Xạ Dưỡng"
 trait_plantoid_radiotrophic_desc: "§LLoài này duy trì sự sống bằng thức ăn và bức xạ năng lượng thấp, nên có thể sinh tồn trên những hành tinh có môi trường khắc nghiệt nhất.§!"
 TRAIT_PLANTOID_RADIOTROPHIC_EFFECT: "$TRAIT_PLANTOID_PHOTOTROPHIC_EFFECT$\n$t$—Dân số trên §YHành Tinh Chết§! sẽ không phải trả phí bảo trì £energy£§YNăng Lượng§!\n$t$—Tốc độ tăng dân số trên §YHành Tinh Chết§!: §G+10%§!\n$t$—Độ sinh sống trên Hành Tinh Chết: §G+10%§!"
 trait_harvested_radiotrophic: "$trait_plantoid_radiotrophic$"
 trait_harvested_radiotrophic_desc: "$trait_plantoid_radiotrophic_desc$"
 trait_lithoid_radiotrophic: "$trait_plantoid_radiotrophic$"
 trait_lithoid_radiotrophic_desc: "$trait_plantoid_radiotrophic_desc$"
 TRAIT_LITHOID_RADIOTROPHIC_EFFECT: "Thay thế §Y50%§! phí bảo trì £minerals£§YKhoáng Sản§! cơ bản bằng phí bảo trì £energy£§YNăng Lượng§!.\nDân số trên §YHành Tinh Chết§! sẽ được miễn trừ phí bảo trì £energy£ §YNăng Lượng§! này.\nTốc độ tăng dân số trên §YHành Tinh Chết§!: §G+10%§!\nĐộ sinh sống trên Hành Tinh Chết: §G+10%§!"
 trait_plantoid_budding: "Nảy Chồi"
 trait_plantoid_budding_desc: "§LNgoài phương thức sinh sản bằng hợp tử hay bào tử thông thường, giống loài này còn có khả năng sinh sản bằng cách nảy chồi.§!"
 trait_plantoid_budding_portrait_override_tt: "Hoặc bất kỳ sinh vật nào sinh sản bằng phương thức sinh dưỡng"
 trait_lithoid_budding: "Kết Tinh Hóa"
 trait_lithoid_budding_desc: "§LNgoài phương thức sinh sản thông thường, giống loài này có thể tự nhân bản bằng cách sao chép mạng tinh thể và bồi đắp chúng.§!"
 TRAIT_PLANTOID_BUDDING_EFFECT: "Mỗi £pop£§HDân Số§! thuộc dạng $pop_group_unit$ có mức sống từ nô lệ trở lên sẽ tạo ra 0.02£mod_logistic_growth_mult£§Y$MOD_BONUS_POP_GROWTH$§!.\n\nHiệu ứng này có thể cộng dồn với các nguồn cung cấp $MOD_BONUS_POP_GROWTH$ khác, chẳng hạn như £building£§Y$building_clone_vats$§! hoặc £job_spawning_drone£§Y$job_spawning_drone_plural$§!."
 TRAIT_LITHOID_BUDDING_EFFECT: "$TRAIT_PLANTOID_BUDDING_EFFECT$"
 trait_advanced_phototrophic: "$trait_plantoid_phototrophic$"
 trait_advanced_phototrophic_desc: "§LNhờ công nghệ di truyền tân tiến, giống loài này giờ đây có thể tự tổng hợp một phần dưỡng chất thông qua ánh sáng mặt trời.§!"
 TRAIT_ADVANCED_PHOTOTROPHIC_EFFECT: "Thay thế §Y50%§! phí bảo trì £food£§YThức Ăn§! hoặc £minerals£§YKhoáng Sản§! cơ bản bằng phí bảo trì £energy£§YNăng Lượng§!."
 trait_advanced_radiotrophic: "$trait_plantoid_radiotrophic$"
 trait_advanced_radiotrophic_desc: "§LNhờ công nghệ di truyền tân tiến, giống loài này giờ đây có thể tự tổng hợp một phần dưỡng chất thông qua bức xạ năng lượng thấp, cho phép chúng tồn tại trên những hành tinh có môi trường khắc nghiệt nhất.§!"
 TRAIT_ADVANCED_RADIOTROPHIC_EFFECT: "$TRAIT_PLANTOID_PHOTOTROPHIC_EFFECT$\nDân số trên §YHành Tinh Chết§! sẽ được miễn trừ phí bảo trì £energy£ §YNăng Lượng§! này"
 trait_advanced_budding: "$trait_plantoid_budding$"
 trait_advanced_budding_desc: "§LViệc chỉnh sửa các trình tự di truyền giúp giống loài này có thể sinh sản bằng cách nảy chồi, bên cạnh phương thức sinh sản thông thường của chúng.§!"
 trait_plantoid_bloomed: "Nở Rộ"
 trait_plantoid_bloomed_desc: "Giống loài này đã bị ảnh hưởng bởi quá trình chuyển hóa của Trạm Gieo Hạt Gaia. Những đóa hoa địa y cộng sinh sẽ đâm chồi từ cơ thể chúng khi sinh sống trên Hành Tinh Gaia."
 plantoid_bloomed_trait_tooltip: "Hiệu ứng trên Hành Tinh Gaia:\n$t$$mod_planet_jobs_produces_mult$: §G+10%§!\n$t$$MOD_LOGISTIC_GROWTH_MULT$: §G+10%§!\n$t$$MOD_POP_AMENITIES_USAGE_MULT$: §G-10%§!\n$t$$MOD_POP_HOUSING_USAGE_MULT$: §G-10%§!\n\nNhững hiệu ứng này có thể được khuếch đại bởi £building£$building_gaiaseeders_4$."
