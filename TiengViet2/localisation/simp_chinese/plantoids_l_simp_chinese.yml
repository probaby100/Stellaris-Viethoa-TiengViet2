 gaiaseeders_different_climate_start: "$TRIGGER_FAIL$Cần có £society£§Y$tech_ecological_adaptation$§! để xây dựng trên"
 gaiaseeders_wet: "§YẨm ướt§!"
 gaiaseeders_dry: "§YKhô hạn§!"
 gaiaseeders_cold: "§YLạnh giá§!"
 gaiaseeders_same_climate_wet: "$gaiaseeders_same_climate_start$ §YHành tinh§! $gaiaseeders_wet$."
 gaiaseeders_same_climate_dry: "$gaiaseeders_same_climate_start$ §YHành tinh§! $gaiaseeders_dry$."
 gaiaseeders_same_climate_cold: "$gaiaseeders_same_climate_start$ §YHành tinh§! $gaiaseeders_cold$."
 gaiaseeders_different_climate_wet: "$gaiaseeders_different_climate_start$ §YHành tinh§! $gaiaseeders_dry$ hoặc $gaiaseeders_cold$."
