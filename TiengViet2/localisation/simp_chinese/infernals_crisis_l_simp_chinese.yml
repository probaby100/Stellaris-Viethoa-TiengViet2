 entropy_crystals_crisis_description: "$menace_crisis_description_intro$\n\nPhương pháp thao túng năng lượng mới này sẽ tăng cường đáng kể sức mạnh của chúng ta. Cần lợi dụng ngọn lửa của các vì sao để thắp sáng một kỷ nguyên mới."
 entropy_crystals_crisis_howto_title: "Nguồn cội Sức mạnh"
 entropy_crystals_crisis_howto: "Hoàn thành §HMục tiêu Khủng hoảng§! sẽ tạo ra £entropy_crystals£§H$entropy_crystals$§!, dùng để nâng cấp $galactic_crucible_4$ và mở khóa cấp độ khủng hoảng tiếp theo."
