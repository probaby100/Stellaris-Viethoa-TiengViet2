 # Đặc quyền Khủng hoảng Cấp 1
 menp_hyperthermia_crystals: "$entropy_crystals$"
 menp_hyperthermia_crystals_desc: "§Y$entropy_crystals$§! đánh dấu một bước đột phá trong lĩnh vực mất ổn định năng lượng có kiểm soát. Nắm trong tay nguồn tài nguyên không ổn định này, chúng ta có thể tái định hình trật tự thiên hà."
 unlocks_entropy_objectives: "Tích lũy £entropy_crystals£§Y$entropy_crystals$§! bằng cách hoàn thành §HMục tiêu Khủng hoảng§!."
 menp_hyperthermia_harnessing: "Khai thác Entropy"
 menp_hyperthermia_harnessing_desc: "Tích hợp việc tổng hợp §Y$entropy_crystals$§! vào nền công nghiệp, giúp sử dụng tài nguyên không ổn định này một cách hiệu quả hơn, điều chỉnh trọng tâm công nghệ cho phù hợp với mục tiêu chiến lược."
 unlocks_entropy_edict: "§HMở khóa Sắc lệnh:§! $edict_entropy_harnessing$"
 menp_hyperthermia_crucible: "Lò luyện Thiên hà"
 menp_hyperthermia_crucible_desc: "Lò luyện đang được lên kế hoạch này sẽ trở thành động cơ cốt lõi để khai thác năng lượng entropy của các vì sao. Nó có khả năng kết tinh và truyền tải năng lượng entropy, trở thành biểu tượng cho sức mạnh rực lửa của chúng ta, chiếu rọi khắp các vì sao."
 unlocks_galactic_crucible: "§HMở khóa Siêu cấu trúc:§! $galactic_crucible_0$"
 # Đặc quyền Khủng hoảng Cấp 2
 menp_hyperthermia_conc_entropy: "Entropy Cô đặc"
 menp_hyperthermia_conc_entropy_desc: "$entropy_conduit_plural$ là yếu tố sống còn cho việc mở rộng thế lực ở giai đoạn hiện tại. Nâng cao sản lượng của Lò luyện sẽ đẩy nhanh tiến trình bước tới một tương lai bùng cháy huy hoàng."
 unlocks_conduit_spawn: "§H$UNLOCKS_SHIP_TYPE$:§! $entropy_conduit$\n—§Y$entropy_conduit_plural$$LENS_FLARE_BEAM$§! được §Y$galactic_crucible_4$§! tự động tạo ra và bay đến các hệ sao lân cận.\n—Các thuộc địa trong hệ sao mục tiêu nhận được buff.\n—Được trang bị vũ khí £ship_xl_slot£§Y§!, bắn trúng kẻ thù có thể làm chúng tê liệt trong vài ngày.\n\n"
 menp_hyperthermia_radiant: "Tham vọng Chói lọi"
 menp_hyperthermia_radiant_desc: "Để trở thành mồi lửa thiêu rụi thiên hà, không có thời gian cho sự do dự hay những rào cản quan liêu, không thể lãng phí thêm thời gian để cải tạo các hệ thống khác nhau nữa. Để đạt được mục tiêu, năng lực xây dựng phải được tăng cường đáng kể."
 menp_hyperthermia_ignition: "Cưỡng chế Đánh lửa"
 menp_hyperthermia_ignition_desc: "Đôi khi, chỉ nỗ lực thôi là chưa đủ. Cần phải đưa công nghệ lên những tầm cao mới, giải phóng tiềm năng thực sự của nó. Đã đến lúc nới lỏng các giới hạn an toàn và tối đa hóa sản lượng."
 unlocks_crucible_overclocking: "Mở khóa tính năng 'Ép xung' cho §HSiêu cấu trúc§! §Y$galactic_crucible_1$§!."
 # Đặc quyền Khủng hoảng Cấp 3
 menp_hyperthermia_cruiser: "$ember_cruiser$"
 menp_hyperthermia_cruiser_desc: "Những con tàu này được trang bị công nghệ tối tân, chuyển hóa các dòng nhiệt không ổn định thành năng lượng hủy diệt có định hướng, thiêu rụi kẻ thù thành than."
 unlocks_ember_cruiser: "§H$UNLOCKS_SHIP_TYPE$:§! $ember_cruiser$"
 menp_hyperthermia_flames: "Ngọn lửa Nuốt chửng"
 menp_hyperthermia_flames_desc: "Xã hội không tưởng mà chúng ta đang xây dựng không dung thứ cho bất kỳ sự phản kháng nào. Mọi thế lực chống đối đều sẽ được gột rửa bằng ngọn lửa từ hành tinh mẹ."
 unlocks_firestorm_stance: "§HMở khóa Cải tạo Môi trường:§! $pc_volcanic$\n§HMở khóa Thế oanh tạc:§! $bombardment_firestorm$\n\n"
 menp_hyperthermia_coronal: "Phun trào Nhật hoa"
 menp_hyperthermia_coronal_desc: "$entropy_conduit_plural$ của chúng ta hiện đang duy trì sự ổn định thông qua việc tản nhiệt. Nếu xả lượng nhiệt này ra không gian xung quanh, $entropy_conduit_plural$ sẽ trở thành vũ khí sắc bén để tiêu diệt kẻ thù."
 unlocks_conduit_damage: "§Y$entropy_conduit_plural$§! gây sát thương thụ động lên tàu thuyền và trạm không gian của địch.\n\n"
 # Đặc quyền Khủng hoảng Cấp 4
 menp_hyperthermia_reactors: "Lò phản ứng Nhiệt hạch Lõi Mặt Trời"
 menp_hyperthermia_reactors_desc: "Ứng dụng §Y$entropy_crystals$§! vào công nghệ quân sự, mở khóa hệ thống động cơ đẩy vô song. Các con tàu sẽ xuyên qua các vì sao như những ngọn lửa rực rỡ."
 menp_hyperthermia_solarflare: "Bão Mặt Trời Nhân tạo"
 menp_hyperthermia_solarflare_desc: "Một số khu vực trong thiên hà trước đây không nằm dưới sự kiểm soát của chúng ta, nhưng tình trạng này sắp kết thúc. Chẳng bao lâu nữa, $entropy_conduit_plural$ của ta sẽ phủ khắp các vì sao, tiêu diệt chính xác mọi thế lực dám phản kháng."
 unlocks_conduit_borders: "§Y$entropy_conduit_plural$§! tự động vượt qua biên giới tiến vào lãnh thổ địch.\n\n"
 menp_hyperthermia_armada: "Hạm đội Rực lửa"
 menp_hyperthermia_armada_desc: "Các thế lực trong thiên hà đang liên minh chống lại chúng ta, cần phải tổng động viên toàn diện. Mỗi công dân đều phải cống hiến sức lực cho mặt trận năng lượng, cùng nhau thắp lên ngọn lửa trỗi dậy của quyền lực thần thánh của chúng ta."
 unlocks_blazing_navalcap: "§Y[GetAlloyProducerPlural]§! và §Y[GetResearcherPlural]§! tăng £navy_size£§Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!.\n\n"
 # Đặc quyền Khủng hoảng Cấp 5
 menp_hyperthermia_battleship: "$ember_battleship$"
 menp_hyperthermia_battleship_desc: "Nòng súng nóng rực như cơn bão lửa sắp nuốt chửng cả thiên hà, những con tàu cỡ lớn này sẽ tạo thành lực lượng phòng thủ nòng cốt để bảo vệ Lò luyện."
 unlocks_ember_battleship: "§H$UNLOCKS_SHIP_TYPE$:§! $ember_battleship$\n—Có thể trang bị vũ khí £ship_xl_slot£§Y$LENS_FLARE_BEAM$§!."
 menp_hyperthermia_critical_mass: "Khối lượng Tới hạn"
 menp_hyperthermia_critical_mass_desc: "Hoạt động entropy gia tăng ở lớp ngoài của các ngôi sao dẫn đến lượng bức xạ phát ra tăng vọt, làm tăng tốc quá trình sưởi ấm toàn bộ hệ sao."
 unlocks_conduit_boost: "§Y$entropy_conduit_plural$§! mạnh lên theo số lượng hệ sao đang kiểm soát.\n\n$hyperthermia_map_perc$\n\n"
 hyperthermia_map_perc: "§G20%§! của thiên hà: $TABBED_NEW_LINE$—$entropy_conduit_plural$ áp đặt mức độ tàn phá lên các thuộc địa xung quanh$TABBED_NEW_LINE$—Các thuộc địa bị ảnh hưởng sẽ từ từ mất đi £pop£$POPS$$TABBED_NEW_LINE$—Chỉ ảnh hưởng đến các đế chế có giống loài không phải là §YHỏa ngục§!$TABBED_NEW_LINE$—Hệ sao cần thiết: §Y[root.hyperthermia_own_systems_var]§!/§Y[root.hyperthermia_systems_var]§!"
 menp_hyperthermia_ammunition: "Đạn dược Entropy"
 menp_hyperthermia_ammunition_desc: "Đổi mới trong thiết kế đạn dược: trang bị tiêu chuẩn được bổ sung lõi entropy vi mô, giải phóng một luồng nhiệt năng không ổn định ngay khoảnh khoắc va chạm, tăng cường đáng kể sức sát thương."
