 # Vũ khí
 LENS_FLARE_BEAM: "Tia Chớp Tê liệt Thấu kính"
 LENS_FLARE_BEAM_DESC: "Chùm tia phát ra từ vũ khí này được hiệu chỉnh tinh vi để gây nhiễu hệ thống điều khiển cốt lõi của địch, tạo ra một khoảnh khắc ngắn ngủi để tung đòn không thể kháng cự."
 lfb_on_hit_stun_tt: "§YLàm mục tiêu tê liệt§!, không thể di chuyển hay phản công, kéo dài trong §G7 ngày§!."
 lf_weapon_stun_effect: "§RVa chạm $LENS_FLARE_BEAM$§!"
 lf_weapon_stun_effect_desc: "  " # không hiển thị
 # Siêu cấu trúc
 galactic_crucible_0: "Khung Lò luyện Thiên hà"
 galactic_crucible_0_DESC: "Cấu trúc nền tảng của $galactic_crucible_4$, dùng để hỗ trợ và định hướng quá trình xây dựng toàn bộ trạm không gian này."
 galactic_crucible_0_MEGASTRUCTURE_DETAILS: "Trạm không gian khổng lồ này hút năng lượng từ ngôi sao chủ, vận hành các xưởng đóng tàu tự động để sản xuất §Y$entropy_conduit_plural$§!, tại đó đang chế tạo những con tàu đủ sức viết lại vận mệnh của các vì sao."
 galactic_crucible_1: "Nền móng $galactic_crucible_4$"
 galactic_crucible_1_DESC: "Sau khi các tiện ích cốt lõi hoàn thiện, $galactic_crucible_4$ đã trở thành một trạm không gian hoạt động đầy đủ. Quá trình xây dựng hệ thống Entropy Kết tinh đã bắt đầu."
 galactic_crucible_2: "Lõi $galactic_crucible_4$"
 galactic_crucible_2_DESC: "$galactic_crucible_4$ hiện đã hoạt động hoàn toàn, sẵn sàng triển khai diện rộng §Y$entropy_crystals$§!. Mọi nâng cấp trong tương lai đều sẽ dựa trên nền tảng này.\n\n§HHoàn thành dự án đặc biệt để mở khóa giai đoạn tiếp theo.§!"
 galactic_crucible_3: "Trung tâm $galactic_crucible_4$"
 galactic_crucible_3_DESC: "$galactic_crucible_4$ đang được mở rộng hiện đã được trang bị hệ thống entropy dạng mô-đun, thiết kế này cho phép tái cấu trúc và nâng cấp một cách liền mạch. Các kỹ thuật viên có thể gia tăng công suất và giảm thiểu độ hao hụt."
 galactic_crucible_4: "Lò luyện Thiên hà"
 galactic_crucible_4_DESC: "$galactic_crucible_4$ đã được vũ trang và vận hành tối đa, sẵn sàng rải ngọn lửa thanh tẩy rực rỡ khắp mọi vùng không gian. Hệ thống thông lượng entropy đã đạt đến hiệu suất lý thuyết đỉnh cao."
 galactic_crucible_5: "Viện Nghiên cứu $galactic_crucible_4$"
 galactic_crucible_5_DESC: "$galactic_crucible_4$ đã hoàn tất quá trình tái cấu trúc không thể đảo ngược, giúp ngăn chặn nguy cơ mất kiểm soát do năng lượng cao gây ra, đảm bảo sự ổn định của đế chế và tiếp tục trở thành nguồn năng lượng dồi dào."
 galactic_crucible_ruined: "$galactic_crucible_4$ Bị tàn phá"
 galactic_crucible_ruined_DESC: "Một xưởng đóng tàu bị bỏ hoang, từng được xây dựng để thực hiện tham vọng rực lửa của một đế chế đã sụp đổ."
 galactic_crucible_ruined_MEGASTRUCTURE_DETAILS: "Khu phế tích rộng lớn vẫn đang nhấp nháy những xung điện nhiệt bất quy tắc."
 SPAWN_CONDUITS: "$entropy_conduit_plural$"
 SPAWN_CONDUITS_DESC: "$galactic_crucible_4$ sẽ tự động chế tạo $entropy_conduit_plural$. Chúng sẽ tiến đến những ngôi sao có thể chuyển hóa thành §Y$pc_m_giant_star$§!."
 overclock_gc_default: "$overclock_mode$§HMặc định§!"
 overclock_gc_default_desc: "Sản xuất Entropy Kết tinh ở mức độ ổn định và vừa phải.\n"
 overclock_gc_high: "$overclock_mode$§HÉp xung§!"
 overclock_gc_high_desc: "Sử dụng lượng lớn năng lượng dự trữ để tăng tốc độ chế tạo Ống dẫn.\n"
 overclock_gc_eco: "$overclock_mode$§HSản lượng§!"
 overclock_gc_eco_desc: "Đầu tư một lượng lớn Hợp kim để gia tăng sản lượng Entropy Kết tinh.\n"
 overclock_gc_war: "$overclock_mode$§HTrung tâm Điều phối§!"
 overclock_gc_war_desc: "$galactic_crucible_4$ có thể cung cấp nguồn năng lượng dự phòng khổng lồ cho các tàu xung quanh, tối đa hóa sức mạnh chiến đấu của hạm đội phòng thủ.\n"
 # Chuỗi Sự kiện
 galactic_hyperthermia_chain_title: "$ap_galactic_hyperthermia$"
 galactic_hyperthermia_chain_desc: "Chúng ta đã quyết định dùng ngọn lửa để khai mở tương lai, chuẩn bị nhấn chìm toàn bộ thiên hà trong biển lửa."
 # Dự án Đặc biệt
 INF_CRISIS_ENTROPY: "Nguồn Năng lượng Mới"
 INF_CRISIS_ENTROPY_DESC: "Từ lâu ngọn lửa đã đóng vai trò quan trọng trong xã hội của ta, và giờ đây chúng ta có thể làm chủ sức mạnh hỗn mang của nó bằng một phương pháp hoàn toàn mới. Nguồn năng lượng mà các nhà khoa học hằng ao ước sắp được phơi bày, nó vượt xa việc chỉ duy trì nền văn minh hiện tại, có thể giúp chúng ta vươn tới các vì sao.\n\n§HHiệu ứng:§! Mở khóa loại tài nguyên mới £entropy_crystals£§Y$entropy_crystals$§!."
 INF_CRISIS_ENTROPY_EVIL: "Lập kế hoạch Bão lửa"
 INF_CRISIS_ENTROPY_EVIL_DESC: "Lò luyện đã chỉ ra con đường mới cho chúng ta. Hãy rũ bỏ sự ngu muội, tái định hình một thiên hà nóng rực, thiêu rụi những kẻ dám chối từ.\n\n§HHiệu ứng:§!\n—Mở khóa nâng cấp tiếp theo của §Y$galactic_crucible_4$§!.\n—§Y$entropy_conduit_plural$§! nay đã có thể chuyển hóa các ngôi sao của địch.\n\n" # Entropy Kết tinh được sử dụng với toàn bộ tiềm năng
 INF_CRISIS_ENTROPY_GOOD: "Mối liên kết Bất ngờ"
 INF_CRISIS_ENTROPY_GOOD_DESC: "Lò luyện sở hữu sản lượng năng lượng cực lớn, nhưng lại không ổn định. Nếu hạ hiệu suất của nó xuống mức độ vừa phải vĩnh viễn, ta vừa có thể đảm bảo sự phồn vinh lâu dài, vừa tránh tạo ra mối đe dọa với thiên hà cùng các quốc gia láng giềng, duy trì sự ổn định khu vực và các mối quan hệ thiện chí." # Entropy Kết tinh có thể được dùng cho nền kinh tế
 # Tình huống Đếm ngược
 situation_galactic_hyperthermia_timer: "Động viên"
 situation_galactic_hyperthermia_timer_type: "$situation_galactic_hyperthermia_timer$"
 situation_galactic_hyperthermia_timer_desc: "Sự kiểm soát của chúng ta đối với §Y$entropy_crystals$§! sắp mở ra một cuộc biến động dữ dội trên toàn thiên hà. Các lỗ sâu kết nối 6 hệ sao ở lõi thiên hà đã được đả thông.\nNếu thiết lập các trạm §Y$entropy_conduit_plural$§! tại mỗi hệ sao và bảo vệ chúng khỏi sự can thiệp, chúng ta có thể thiêu rụi toàn bộ thiên hà."
 situation_galactic_hyperthermia_timer_monthly_change_tooltip: "Khi mức năng lượng entropy bức xạ về phía lõi thiên hà đạt đến đỉnh điểm, cả thiên hà sẽ bị thiêu rụi thành tro bụi."
 situation_gh_timer_outcome: "Tình báo cho thấy nhiều quốc gia có thể đang chuẩn bị chiến tranh để ngăn cản kế hoạch của chúng ta. Nếu không kịp trở tay, kế hoạch sẽ chết yểu."
 situation_gh_approach_timer: "Đón nhận Dư chấn"
 situation_gh_approach_timer_tt: "Thời cơ đã đến, một cuộc chiến tranh quy mô lớn càn quét khắp thiên hà sắp nổ ra."
 situation_gh_difficulty_progress: "Độ khó"
 situation_gh_opponent_progress: "Mỗi đế chế đối nghịch §G-0.1§!"
 # Tình huống Khủng hoảng
 situation_galactic_hyperthermia: "Bão lửa Thiên hà"
 situation_galactic_hyperthermia_type: "$situation_galactic_hyperthermia$"
 situation_galactic_hyperthermia_monthly_change_tooltip: "Tốc độ tiến tới thời điểm thiên hà bị thắp sáng hoàn toàn."
 situation_hyperthermia_desc_perp: "§LChúng ta đang mơ về một xã hội không tưởng chìm trong biển lửa, để đạt được nguyện cảnh đó phải gạt bỏ mọi chướng ngại. Đốm lửa đầu tiên đã bừng lên, chúng ta phải tiếp thêm củi, để ngọn lửa lan rộng đến mọi ngóc ngách của thiên hà.§!\n\n$situation_hyperthermia_stats$"
 situation_hyperthermia_desc: "§L§Y[event_target:hyperthermia_empire.GetName]§! đã thắp sáng các vì sao, phải đương đầu với ngọn lửa dữ dội nhất thiên hà, chỉ có một cơ hội duy nhất, nếu thất bại, mọi thứ sẽ biến thành tro bụi.§!\n\n$situation_hyperthermia_stats$"
 situation_hyperthermia_stats: "§HCác hệ sao Lõi đã chiếm:§![event_target:hyperthermia_empire.gh_crisis_core_var]"
 situation_galactic_hyperthermia_outcome: "[GetHyperthermiaOutcome]"
 situation_gh_outcome_perp: "Nếu hành động thành công, cơn mưa lửa sẽ nuốt chửng toàn bộ thiên hà, chỉ những kẻ được ngọn lửa bao bọc mới có thể đứng vững giữa đống tro tàn. Các vì sao cũng không thể thoát khỏi; hàng tỷ năm sau, chúng sẽ được cải tạo thành hình dạng giống như hành tinh mẹ của chúng ta."
 situation_gh_outcome_other: "Một khi §Y[hyperthermia_empire.GetName]§! thành công, toàn bộ thiên hà sẽ hóa thành tro bụi, chỉ còn lại những chủng tộc ưa nhiệt mới có thể tiếp tục tồn tại."
 situation_galactic_hyperthermia_progress: "Số lượng hệ sao lõi bị §Y$entropy_conduit_plural$§! chiếm đóng sẽ quyết định tiến độ mỗi tháng.\n$TABBED_NEW_LINE$—Ít hơn §Y3§! hệ sao: §R-3§!$TABBED_NEW_LINE$—Chiếm §Y3§! hệ sao: §Y0§!$TABBED_NEW_LINE$—Nhiều hơn §Y3§! hệ sao: §G+3§!\n\nTiến độ hiện tại"
 situation_galactic_hyperthermia_stage1: "Yêu cầu tối thiểu ($stage_1$)."
 situation_gh_approach_perp: "Bùng lên Ngọn lửa"
 situation_gh_approach_perp_tt: "Bỏ lỡ một lần là mất đi mãi mãi. Chúng ta phải thành công, nếu không mọi thành tựu đều đổ sông đổ biển."
 situation_gh_approach_other: "Dập tắt Ngọn lửa"
 situation_gh_approach_other_tt: "Đế chế này là mầm mống phá hoại sự ổn định của thiên hà. Một cuộc đối phó toàn diện không còn là một sự lựa chọn, mà là lối thoát duy nhất."
