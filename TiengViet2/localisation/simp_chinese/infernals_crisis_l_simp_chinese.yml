 entropy_crystals_crisis_objective_reward: "$REWARD$"
 entropy_crystals_crisis_objective_progress: "Chúng ta đã nhận được £entropy_crystals£$AMOUNT$ từ mục tiêu khủng hoảng này."
 entropy_crystals_crisis_level_locked: "Để mở khóa cấp độ này cần:\n" # xóa?
 entropy_crystals_crisis_level_unlocked: "Đạt đến $LEVEL$ sẽ nhận được các phần thưởng sau:\n"
 entropy_crystals_crisis_level_desc: "Để tăng cấp độ khủng hoảng, cần tích lũy $entropy_crystals$ và xây dựng §Y$galactic_crucible_4$§!."
 entropy_crystals_crisis_level_unlock: "Sở hữu £entropy_crystals£§Y$CURRENCY$§!$entropy_crystals$"
 entropy_crystals_current_value: "Giá trị hiện tại: §Y$VALUE|0$§!"
