 infernals.1000.name: "Sức mạnh Mới"
 infernals.1000.desc: "[GetHyperthermiaIntroIfRedGiant]"
 infernals.1000.descNormal: "Các [GetScientistPlural] của ta báo cáo đã phát hiện ra một công nghệ hoàn toàn mới, có thể khóa chặt entropy vào trong các ma trận tinh thể năng lượng cao. Lượng §Y$entropy_crystals$§! này có khả năng dự trữ một lượng nhiệt cực lớn, rất phù hợp cho ứng dụng trong công nghiệp, kinh tế và di chuyển giữa các vì sao.\n\nKết quả mô phỏng cho thấy năng lượng này có thể dùng để cải tạo khí hậu hành tinh, làm chúng nóng lên, hoặc thậm chí thúc đẩy các ngôi sao tiến hóa thành sao khổng lồ đỏ. Về lý thuyết, nó còn có thể thu hồi nhiệt lượng bị thất thoát trong thiên hà để tái tạo thành nhiệt năng, từ đó tạo ra một chuỗi phản ứng giãn nở nhiệt trên quy mô hệ sao.\n\n§HKhởi động dự án đặc biệt:§! §Y$INF_CRISIS_ENTROPY$§!"
 infernals.1000.descRedGiant: "Các [GetScientistPlural] của ta đã phân tích §Y$entropy_crystals$§! từng thắp sáng những vì sao khổng lồ đỏ, thứ từng suýt hủy diệt cả nền văn minh. Giờ đây, chúng đã có thể được tái thiết kế và cải tạo để phục vụ cho các ngành công nghiệp, cấu trúc kinh tế cũng như vận chuyển năng lượng ở cấp độ sao.\n\nKết quả mô phỏng cho thấy năng lượng này có thể dùng để cải tạo khí hậu hành tinh, làm chúng nóng lên, hoặc thậm chí thúc đẩy các ngôi sao tiến hóa thành sao khổng lồ đỏ. Về lý thuyết, nó còn có thể thu hồi nhiệt lượng bị thất thoát trong thiên hà để tái tạo thành nhiệt năng, từ đó tạo ra một chuỗi phản ứng giãn nở nhiệt trên quy mô hệ sao.\n\n§HKhởi động dự án đặc biệt:§! §Y$INF_CRISIS_ENTROPY$§!" # Giới thiệu nếu bạn đã biết về entropy từ Thợ mỏ Sao Khổng lồ Đỏ
 infernals.1005.name: "Thành quả Kết tinh"
 infernals.1005.desc1: "Chúng ta đã hoàn thiện cơ sở hạ tầng khai thác và chuyển hóa năng lượng đầu tiên thành §Y$entropy_crystals$§!. Loại tinh thể này có khả năng dự trữ một lượng nhiệt khổng lồ, khiến cho hiệu suất lưu trữ và vận chuyển năng lượng ở cấp độ công nghiệp vượt xa mọi công nghệ trước đây.\n\nDo các sao khổng lồ đỏ sở hữu bề mặt bức xạ khổng lồ cùng dòng nhiệt mạnh mẽ, chúng trở thành khu vực lý tưởng để triển khai công nghệ này. Hơn nữa, những ngôi sao này đều nằm trong hệ thống do chúng ta kiểm soát.\n\nCác kỹ thuật viên đang tinh chỉnh quy trình để đưa vào sản xuất công nghiệp, đồng thời tìm cách tổng hợp $entropy_crystals$ từ entropy của môi trường. Đi cùng với sự trỗi dậy của một nền kinh tế mới, sự giàu có và quyền lực sẽ tăng vọt theo. Dự án chế tạo hàng loạt [GetScientistPlural] đã chính thức khởi động.\n\n§HMở khóa Siêu cấu trúc:§! §Y$galactic_crucible_0$§!" # Đạt cấp 1
 infernals.1005.desc2: "Dựa trên những mẫu §Y$entropy_crystals$§! hiện có, chúng ta giờ đây có thể khai thác và tổng hợp chúng mà không cần phải hy sinh hành tinh mẹ nữa. Loại tinh thể này có khả năng dự trữ một lượng nhiệt khổng lồ, khiến cho hiệu suất lưu trữ và vận chuyển năng lượng ở cấp độ công nghiệp vượt xa mọi công nghệ trước đây.\n\nDo các sao khổng lồ đỏ sở hữu bề mặt bức xạ khổng lồ cùng dòng nhiệt mạnh mẽ, chúng trở thành khu vực lý tưởng để triển khai công nghệ này. Hơn nữa, những ngôi sao này đều nằm trong hệ thống do chúng ta kiểm soát.\n\nCác kỹ thuật viên đang tinh chỉnh quy trình để đưa vào sản xuất công nghiệp, đồng thời tìm cách tổng hợp $entropy_crystals$ từ entropy của môi trường. Đi cùng với sự trỗi dậy của một nền kinh tế mới, sự giàu có và quyền lực sẽ tăng vọt theo. Dự án chế tạo hàng loạt [GetScientistPlural] đã chính thức khởi động.\n\n§HMở khóa Siêu cấu trúc:§! §Y$galactic_crucible_0$§!" # Đạt cấp 1
 infernals.1005.a: "Phải khởi công ngay."
 infernals.1005.a.tt: "Cử $constructor$ tiến hành xây dựng §Y$galactic_crucible_0$§! xoay quanh một ngôi sao."
 infernals.1005.b: "Ra lệnh cho cá thể con khởi công."
 infernals.1005.b.tt: "Cử $constructor$ tiến hành xây dựng §Y$galactic_crucible_0$§! xoay quanh một ngôi sao."
 infernals.1006.name: "Tiến hóa Kháng nhiệt"
 infernals.1006.desc: "Chúng ta đang đặt chân lên con đường thắp sáng cả thiên hà, nhưng bản thân chúng ta phải chuẩn bị sẵn sàng để đối mặt với nguồn nhiệt lượng khổng lồ. Khả năng thích nghi với nhiệt độ cao hơn sẽ giúp chúng ta phát triển hưng thịnh trong một tương lai rực lửa."
 infernals.1006.descRedGiant: "Dù đang nỗ lực hết mình để đảo ngược sự biến đổi của các vì sao, bản thân chúng ta cũng phải chuẩn bị sẵn sàng để đối mặt với nguồn nhiệt lượng khổng lồ. Khả năng thích nghi với nhiệt độ cao hơn sẽ giúp chúng ta phát triển hưng thịnh trong một tương lai rực lửa."
 infernals.1010.name: "Khởi động $entropy_conduit_plural$"
 infernals.1010.desc: "$galactic_crucible_1$ có thể triển khai các §Y$entropy_conduit_plural$§! để dẫn truyền và khuếch đại năng lượng entropy của các vì sao, một khi được truyền đi, chúng sẽ tái chế và cường hóa sản lượng năng lượng của ngôi sao. Quá trình này sẽ thúc đẩy chúng tiến hóa thành sao khổng lồ đỏ, từ đó làm nóng toàn bộ hệ sao đến mức đủ để hỗ trợ sự bành trướng cơ sở hạ tầng của đế chế chúng ta.\n\nNhững §Y$entropy_conduit_plural$§! này có thể tự vận hành và được chế tạo định kỳ, hiện tại chúng chỉ bị giới hạn trong lãnh thổ của chúng ta, nhưng trong tương lai có thể mở rộng ra toàn thiên hà, đẩy mạnh sự phát triển liên tục của đế chế.\n\n§HCó thể nâng cấp các siêu cấu trúc sau:§! §Y$galactic_crucible_2$§!" # Đạt cấp 2
 infernals.1010.a: "Sản lượng $entropy_crystals$ sẽ được tăng tốc."
 infernals.1010.b: "Việc chinh phục thêm nhiều vì sao là rất cấp bách."
 infernals.1015.name: "Nhiệt độ sẽ gia tăng như thế nào?"
 infernals.1015.desc: "Nghiên cứu về §Y$entropy_crystals$§! đã tiết lộ một bí mật động trời: ở nồng độ cao, vật chất này có thể được sử dụng để chế tạo ra thứ vũ khí đủ sức hủy diệt cả một hành tinh. Nếu nắm trong tay sức mạnh này, toàn bộ thiên hà có thể sẽ nằm dưới gót chân chúng ta.\n\nTuy nhiên, nếu theo đuổi các ứng dụng quân sự, niềm tin mong manh giữa chúng ta và các quốc gia láng giềng sẽ bị phá vỡ. Hơn nữa, ai dám đảm bảo thứ vũ khí này sẽ không phản tác dụng lên chính chúng ta?\n\nĐể chứng minh ý định hòa bình, chúng ta phải công khai làm suy yếu $galactic_crucible_2$, cấm tuyệt đối việc sản xuất loại vũ khí này. Bằng không, sớm muộn gì cũng có kẻ dùng nó để chém giết, dù là phe ta hay kẻ thù.\n\n§HQuyết định này sẽ mở khóa một dự án đặc biệt§!." # Đạt cấp 3 & quyết định
 infernals.1015.a: "Thổi bùng ngọn lửa chiến tranh!" # con đường tà ác
 infernals.1015.a.desc: "Mở khóa cấp độ khủng hoảng $crisis_hyperthermia_level_4$.\n" #\n\n§HKhởi động Dự án Đặc biệt:§! §Y$INF_CRISIS_ENTROPY_EVIL$§!
 infernals.1015.b: "Kìm hãm tham vọng." # con đường thiện lương
 infernals.1015.b.desc: "Chặn không cho đạt tới cấp độ khủng hoảng $crisis_hyperthermia_level_4$.\n\n§HKhởi động dự án đặc biệt:§! §Y$INF_CRISIS_ENTROPY_GOOD$§! sẽ chuyển hóa §Y$galactic_crucible_2$§! thành §Y$galactic_crucible_5$§!."
 infernals.1020.name: "Giữa Biển lửa"
 infernals.1020.desc: "Quá trình điều tra của chúng ta về §Y$entropy_crystals$§! và dự án §Y$INF_CRISIS_ENTROPY_EVIL$§! đã xác nhận sức mạnh hủy diệt tiềm tàng của loại vũ khí này là hoàn toàn có thật. Khi nắm trong tay thứ quyền lực này, các phép tắc ngoại giao sẽ không còn là gông cùm trói buộc chúng ta nữa.\n\nVì những ứng dụng quân sự hóa mang tính cực đoan, quá trình mở rộng của $galactic_crucible_3$ có thể được tăng tốc. Mở khóa vũ khí càng sớm, chúng ta càng nhanh chóng thống trị thiên hà.\n\n§HCó thể nâng cấp siêu cấu trúc:§! §Y$galactic_crucible_4$§!" # Hoàn thành dự án đặc biệt cho con đường tà ác
 infernals.1020.a: "Chúng ta phải sẵn sàng cho chiến tranh."
 infernals.1020.a.tt: "—Việc mở rộng §Y$galactic_crucible_4$§! phải được ưu tiên hàng đầu.\n—$unlocks_conduit_damage$"
 infernals.1020.b: "Kẻ thù của chúng ta sẽ trở thành mồi lửa."
 infernals.1020.b.tt: "—Việc mở rộng §Y$galactic_crucible_4$§! phải được ưu tiên hàng đầu.\n—$unlocks_conduit_damage$"
 infernals.1021.name: "Vệt sáng Ổn định"
 infernals.1021.desc: "$galactic_crucible_3$ đã bị suy yếu thành công, đảm bảo rằng nó sẽ không thể bị mở rộng hoặc sử dụng cho mục đích hủy diệt nữa. Dù mất đi toàn bộ sức mạnh tiềm tàng là một điều đáng tiếc, nhưng nếu tiếp tục đi theo con đường đó sẽ chỉ mang lại hiểm họa diệt vong và sự đổ vỡ của mọi mối quan hệ ngoại giao.\n\nMay mắn thay, dù bị giới hạn chức năng, $galactic_crucible_5$ vẫn sẽ là một nguồn năng lượng thịnh vượng và mạnh mẽ. Việc chúng ta chọn lùi một bước trước khi vượt quá giới hạn đã cứu vãn tương lai hợp tác cùng Cộng đồng Ngân hà, đồng thời vẫn tận dụng được những lợi ích to lớn từ thành tựu khoa học phi thường này.\n\n§HCó thể nâng cấp siêu cấu trúc:§! §Y$galactic_crucible_5$§!" # Hoàn thành dự án đặc biệt cho con đường thiện lương
 infernals.1021.a: "Hợp tác sẽ mang lại lợi ích chung."
 infernals.1021.b: "Sự hòa hợp mang đến sự phồn vinh."
 infernals.1025.name: "Vây quanh Lõi Ngân hà"
 infernals.1025.desc: "Những nghiên cứu liên tục của chúng ta về §Y$entropy_conduit_plural$§! và quá trình chuyển hóa các vì sao thành sao khổng lồ đỏ chỉ ra rằng, chúng ta có thể mở rộng quy mô hoạt động, trực tiếp nung nóng lõi của thiên hà để tạo ra một chuỗi phản ứng nhiệt dây chuyền trên toàn thiên hà, qua đó cải tạo nó thành một môi trường phù hợp hơn với chúng ta.\n\nChúng ta đã xác định được sáu hệ sao nằm quanh lõi thiên hà có thể đóng vai trò làm điểm trung chuyển cho chiến dịch này. Dù những hệ sao này nằm ngoài mạng lưới tuyến đường siêu không gian, quá trình xây dựng các lỗ sâu ổn định đang được đẩy nhanh tiến độ." # Đạt cấp 4
 infernals.1025.a: "Chỉ chúng ta mới phù hợp để tồn tại trong ngọn lửa."
 infernals.1025.a.tt: "Các chủng tộc khác sẽ cố gắng chống lại chúng ta. Hãy chuẩn bị cho một cuộc chiến tranh toàn thiên hà."
 infernals.1025.b: "Toàn bộ thiên hà sẽ hợp nhất dưới ngọn lửa cuồn cuộn."
 infernals.1025.b.tt: "Các chủng tộc khác sẽ cố gắng chống lại chúng ta. Hãy chuẩn bị cho một cuộc chiến tranh toàn thiên hà."
 infernals.1030.name: "Cuộc đua Đánh lửa"
 infernals.1030.desc: "$galactic_crucible_4$ hiện đã được vũ trang đầy đủ và đi vào hoạt động. Với việc hoàn thành các tuyến lỗ sâu, chúng ta đã giành được lối vào sáu hệ sao tập kết bao quanh lõi thiên hà.\n\nChiến dịch nung nóng lõi đã bắt đầu. Dù các đế chế khác có thể đã nhận ra và cố gắng thâm nhập vào những hệ sao này, nhưng hiện tại chúng ta đang nắm giữ lợi thế tuyệt đối, lõi thiên hà đã khuất phục trước ý chí của chúng ta.\n\n§HSử dụng lỗ sâu để bảo vệ các hệ sao thuộc lõi thiên hà§!" # Đạt cấp 5, đường siêu không gian mở trong 3 năm!
 infernals.1030.a: "Bắt đầu triển khai tại các hệ sao lõi."
 infernals.1030.a.tt: "Chỉ cần triển khai §Y$entropy_conduit_plural$§! tại sáu hệ sao ở lõi thiên hà, chúng ta có thể nung nóng toàn bộ thiên hà chỉ trong một lần duy nhất. Phải bắt tay vào chuẩn bị ngay lập tức."
 infernals.1030.b: "Tương lai của chúng ta được thắp sáng bằng ngọn lửa."
 infernals.1030.b.tt: "$infernals.1030.a.tt$"
 infernals.1035.name: "Báo động Hỏa hoạn Thiên hà"
 infernals.1035.desc: "Các đế chế đối nghịch đã ép mở tuyến đường siêu không gian dẫn đến các điểm tập kết của chúng ta gần lõi thiên hà. Khi chúng ta tiếp tục đun nóng lõi, phải chuẩn bị sẵn sàng để đối mặt với sự phản kháng của chúng.\n\nNhưng chúng ta sẽ không lùi bước. Sự lạnh lẽo và tăm tối của vũ trụ sẽ bị xua tan, nhường chỗ cho sự huy hoàng rực lửa của tương lai mà chúng ta đang vươn tới."
 # lõi thiên hà giờ đã kết nối với các khu vực khác!
 infernals.1035.a: "Chúng sẽ không bao giờ có thể dập tắt ngọn lửa của chúng ta."
 infernals.1035.b: "Cứ để chúng lần lượt lao vào biển lửa đang cuồn cuộn đi."
 infernals.1040.name: "Cơn bão Đang đến Gần"
 infernals.1040.desc: "Lõi thiên hà bắt đầu trở nên xáo động. Mức entropy xung quanh lỗ đen siêu khối lượng đang gia tăng đột biến, phát ra những sóng bức xạ nhiệt dữ dội về phía các hệ sao lân cận.\n\nTrong lúc sự hoang mang đang lan rộng, một nhóm các nhà khoa học dũng cảm đến từ nhiều hành tinh khác nhau đã tìm ra các tuyến siêu không gian mới kết nối với sáu hệ sao quanh lõi thiên hà. Các hệ sao này được cho là nơi đặt những cơ sở do §Y[hyperthermia_empire.GetName]§! điều hành, nhằm chủ động làm nung nóng lõi. Hành động can thiệp liều lĩnh này sẽ kích hoạt một cơn bão lửa quét qua toàn thiên hà, thiêu rụi bất cứ ai không thể ngăn cản dã tâm phóng hỏa của bọn chúng.\n\nĐể sống sót, chúng ta phải chọc thủng phòng tuyến của những hệ sao này và đoạt lấy quyền kiểm soát. Khủng hoảng đã cận kề — nhiệt độ vẫn đang không ngừng leo thang." # các đế chế khác biết về lõi thiên hà, hình thành cuộc chiến tranh liên minh
 infernals.1040.a: "Chúng ta phải ngăn chặn điều này lại!" # câu trả lời chung (tuyên chiến)
 infernals.1040.a.tt: "§LMột cuộc khủng hoảng chưa từng có sắp sửa càn quét toàn thiên hà. Chỉ có sức mạnh hợp nhất của một Liên minh mới được thành lập mới có thể cứu rỗi chúng ta.§!\n\nCác đế chế chống lại cuộc khủng hoảng sẽ thành lập một §YLiên minh§!, dẫn đến một cuộc xung đột lan rộng trên toàn cõi thiên hà. Chúng ta sẽ §Rtuyên chiến với§! §Y[hyperthermia_empire.GetName]§!."
 infernals.1040.b: "Cứ cháy rụi đi, lũ yếu kém!" # câu trả lời của Kẻ diệt chủng
 infernals.1040.b.tt: "§LTrong thời khắc khủng hoảng, mọi chủng tộc đều phải tự lo cho thân mình. Chúng ta có khả năng tự giải quyết vấn đề này một cách độc lập.§!"
 infernals.1040.c: "Bọn chúng thực ra cũng giống chúng ta." # câu trả lời của Loài Hỏa ngục
 infernals.1040.c.tt: "§LPhương pháp của §Y[hyperthermia_empire.GetName]§! rất phù hợp với tầm nhìn của chúng ta về một thiên hà mới. Nếu biết cách hòa nhập, chúng ta có thể sống sót qua cú sốc toàn diện của thảm họa này.§!"
 infernals.1040.d: "Đó không phải là việc chúng ta cần bận tâm." # câu trả lời trung lập
 infernals.1040.d.tt: "§LNhững đế chế thích chơi với lửa vốn chẳng thiếu. Mọi biến động rồi sẽ qua, tốt nhất là cứ đứng ngoài cuộc.§!"
 infernals.1042.name: "Leo thang: §RKhủng hoảng đã Bùng nổ§!"
 infernals.1042.desc: "Những cuộc cải cách vĩ đại trong lịch sử luôn đi kèm với sự hy sinh. Tuy nhiên, Cộng đồng Ngân hà lại coi những nỗ lực của chúng ta là mối đe dọa không đáng có, và đã huy động một liên minh quân sự thống nhất để chống lại chúng ta.\n\nMục tiêu của bọn chúng là xóa sổ chúng ta, chúng ta không còn lựa chọn nào khác: bất kỳ kẻ nào dám lại gần lõi thiên hà hoặc $galactic_crucible_4$ đều sẽ phải đối mặt với hỏa lực áp đảo nhất.\n\nNguyện cảnh của chúng ta đã thắp sáng các vì sao. Hãy để cho những kẻ chống đối nếm mùi cơn bão mà chúng ta đã triệu hồi.\n\n§HChỉ cần giữ vững các hệ sao ở lõi thiên hà, chúng ta nhất định sẽ chiến thắng!§!"
 infernals.1042.a: "Kết cục đã được an bài."
 infernals.1043.name: "Hiệu triệu Chiến dịch: §RKhủng hoảng đã Bùng nổ§!"
 infernals.1043.desc: "Đứng trước mối đe dọa leo thang từ tình hình tại lõi thiên hà, Cộng đồng Ngân hà đã thống nhất hành động chống lại §Y[hyperthermia_empire.GetName]§!, bởi dã tâm nung nóng thiên hà của bọn chúng đang đe dọa mọi dạng sống đã biết.\n\nNếu cứ để chúng lộng hành, vô số nền văn minh sẽ phải đối mặt với nguy cơ tuyệt diệt. Cái tên §Y[hyperthermia_empire.GetName]§! đã trở thành kẻ thù không đội trời chung của Liên minh thiết yếu này.\n\nTiếng sừng xung trận đã vang lên, tính mạng của hàng ngàn tỷ sinh linh đang ngàn cân treo sợi tóc.\n\n§HPhải chiếm lấy các hệ sao ở lõi thiên hà, nếu không chúng ta sẽ mất tất cả!§!"
 infernals.1043.a: "Động viên Hạm đội!"
 infernals.1045.name: "Chạy đua với Thời gian"
 infernals.1045.desc1: "Cơn bão lửa sắp sửa bùng nổ. Lõi thiên hà sẽ phun trào, tận diệt mọi kẻ thù và xác lập quyền thống trị của chúng ta trên khắp các vì sao.\n\nTuy nhiên, thiên hà lại từ chối đón nhận tương lai rực rỡ mà chúng ta mang đến. Nhờ vào những tuyến đường siêu không gian mới được mở, bọn chúng âm mưu xâm lược các điểm tập kết để phá hoại mọi thứ chúng ta đã gây dựng. Rốt cuộc vì cái gì? Chẳng nhẽ chỉ để bám víu lấy cái sự tối tăm, lạnh lẽo và trì trệ đó sao?\n\nChúng ta tuyệt đối không thể để điều đó xảy ra. Phải tử thủ phòng tuyến lõi thiên hà, cho đến khi cơn bão lửa bùng cháy, biến tất cả bọn chúng thành đống tro tàn." # giai đoạn cuối của tình hình toàn cầu - khủng hoảng
 infernals.1045.desc2: "Lõi thiên hà đang không ngừng nóng lên, được tiếp thêm củi bởi khao khát phóng hỏa điên cuồng của §Y[hyperthermia_empire.GetName]§!. Với tốc độ này, cơn bão lửa sẽ dọn sạch mọi kẻ ngáng đường và quét sạch gần như mọi sinh mệnh trong thiên hà.\n\nKhông có cơ hội nào để thỏa hiệp hay thương lượng. Để tồn tại, chúng ta phải đánh thẳng vào tận gốc rễ: khu vực lõi thiên hà, nơi có nhiệt lượng kinh hoàng nhất. Chỉ bằng cách đó, §Y[hyperthermia_empire.GetName]§! mới có thể bị ngăn chặn.\n\nSố mệnh của toàn bộ thiên hà đang như ngàn cân treo sợi tóc. Đã đến lúc cho §Y[hyperthermia_empire.GetName]§! biết rằng, kẻ chơi với lửa... ắt sẽ có ngày bị chết cháy." # giai đoạn cuối của tình hình toàn cầu - những người khác
 infernals.1045.a: "Chúng ta sẽ tử thủ phòng tuyến."
 infernals.1045.a.tooltip: "Phải kiểm soát 6 hệ sao lõi thì mới giành được chiến thắng."
 infernals.1045.b: "Phải dập tắt chúng triệt để."
 infernals.1045.b.tooltip: "Phải đột kích vào 6 hệ sao lõi, tiêu diệt các ống dẫn của §Y[hyperthermia_empire.GetName]§!, nếu không chúng ta sẽ bị thiêu rụi."
 infernals.1055.name: "Thiên hà là Của chúng ta!"
 infernals.1055.desc: "Từ vùng lõi cho đến những vì sao xa xôi nhất ở rìa thiên hà, chúng ta đã thổi bùng lên ngọn lửa của chiến thắng. Cơn bão lửa đã biến kẻ thù thành tro bụi. Lũ hèn nhát và thiển cận ấy vốn không đủ tư cách để đón nhận tương lai xán lạn mà chúng ta đã dày công tạo dựng. Thiên hà giờ đây thuộc về chúng ta.\n\nTrong trật tự mới tràn ngập lửa và thịnh nộ này, các hành tinh bị nung chảy bởi dung nham và ánh sáng, rực rỡ dưới nhiệt lượng vô tận của những sao khổng lồ đỏ. Dòng chảy entropy len lỏi qua từng hệ sao, được chúng ta thu hoạch và nhào nặn theo ý muốn. Đế chế đang ngày một giàu mạnh... không gì có thể ngăn cản nổi.\n\nChúng ta đã nuốt chửng và tái sinh thiên hà này, trở thành ngọn hải đăng rực cháy của quyền lực tối cao giữa bầu không gian vô tận. Rất có thể một ngày nào đó, chúng ta sẽ tiếp tục thắp sáng cả những thiên hà khác." # khủng hoảng đã thắng
 infernals.1055.a: "Thiên hà mới này, chúng ta quyết phải đoạt lấy."
 infernals.1055.b: "Cuối cùng thì mọi ngọn lửa sẽ hòa quyện làm một."
 infernals.1055.c: "Hành tinh mẹ rực lửa của chúng ta không có chỗ cho kẻ yếu đuối." # Sứ giả thế giới thiêu rụi (Loài Hỏa ngục diệt chủng)
 infernals.1055.d: "Sự kiên cường của chúng ta cuối cùng cũng được đền đáp." # Giáo phái Lửa Hỏa ngục
 infernals.1055.e: "Cuối cùng, chúng ta đã xua tan sự lạnh lẽo và tăm tối ra khỏi thiên hà." # Các Loài Hỏa ngục khác
 infernals.1055.f: "Cuối cùng, những kẻ ngáng đường đáng thương của chúng ta đã hóa thành tro bụi." # Kẻ diệt chủng chung
 infernals.1052.name: "$galactic_crucible_4$ Đã bị Chiếm đóng"
 infernals.1052.desc: "Cùng với việc hệ sao §H[crucible_system.GetName]§! thất thủ, quân đoàn của chúng ta đã đoạt được $galactic_crucible_4$ xoay quanh ngôi sao ở đó.\n\nSự sụp đổ của siêu cấu trúc này cũng là dấu chấm hết cho giấc mộng bá chủ thiên hà bằng vũ lực của những kẻ tạo ra nó."
 infernals.1052.a: "Phá hủy nó đi!"
 infernals.1052.a.tt: "§Y$galactic_crucible_4$§! sẽ bị phá hủy hoàn toàn, không thể sửa chữa."
 infernals.1052.b: "Chúng ta có thể lợi dụng điều này."
 infernals.1052.b.tt: "Chuyển hóa §Y$galactic_crucible_4$§! thành §Y$galactic_crucible_5$§! để sản xuất $r_alloys$."
 infernals.1053.name: "$galactic_crucible_4$ Đã bị Chiếm đóng"
 infernals.1053.desc: "Việc chiếm đóng hệ sao §H[crucible_system.GetName]§! đã vạch trần âm mưu của §H[crucible_builders.GetName]§!, bọn chúng định dùng một cơn bão lửa chưa từng có trong lịch sử để tận diệt toàn bộ ngân hà.\n\nHiện tại, cỗ máy có khả năng gây ra đại diệt chủng này đã bị đình chỉ. Ngay khi chiến tranh kết thúc, chúng ta phải huy động toàn bộ nguồn lực và nhân lực còn lại để dỡ bỏ hoàn toàn cấu trúc khổng lồ này."
 infernals.1053.a: "Chúng ta phải kết thúc cuộc chiến này càng sớm càng tốt!"
 infernals.1053.b: "Quả là một công trình đáng kinh ngạc."
 infernals.1056.name: "Ngân hà Tái sinh"
 infernals.1056.desc: "Trong khi chúng ta đang bận rộn thắp sáng thiên hà, §Y[hyperthermia_empire.GetName]§! đã tái định hình nó mãi mãi, biến những vì sao thành thứ vũ khí chết chóc.\n\nGiờ đây, chúng ta cuối cùng cũng có thể tận hưởng một xã hội không tưởng mới, nhưng khi bọn chúng ngày càng siết chặt quyền kiểm soát ngân hà, chúng ta phải theo dõi sát sao từng đường đi nước bước tiếp theo của bọn chúng."
 infernals.1056.a: "Sức mạnh cường đại sẽ luôn đi kèm với xung đột."
 infernals.1056.b: "Những mối đe dọa mới đã âm thầm nảy nở."
 infernals.1056.c: "Một bước ngoặt không ai ngờ tới."
 # Di vật
 r_crystallized_singularity: "Điểm kỳ dị Kết tinh"
 r_crystallized_singularity_desc: "Những hệ sao bị nung nóng uốn éo thành những hình thù dị hợm, còn điểm kỳ dị lại nhả ra những gợn sóng rực lửa và đầy cám dỗ. Nếu không được phong ấn, luồng sức nóng này sẽ dẫn dụ những người hành hương một cách khó hiểu, thôi thúc họ dấn thân vào nơi hoang tàn nhất. Những kẻ đứng trước thứ ánh sáng rực lửa này sẵn sàng từ bỏ mọi trần tục vướng bận, chỉ để được kề cận hơn với ngọn lửa thuần khiết ấy."
 r_crystallized_singularity_effect_tt: "\n—§G10%§! sản lượng £physics_research£§Y$physics_research$§! của ta cũng sẽ tạo ra một lượng $r_energy$ tương đương."
 r_crystallized_singularity_ls_effect_tt: "—Mở khóa quyết định §Y$decision_gh_life_seeding$§! trên các hành tinh có thể thuộc địa hóa, tạo ra một nền văn minh nguyên thủy mới."
 crystallized_singularity_mod: "$r_crystallized_singularity$"
 crystallized_singularity_mod_desc: "$r_crystallized_singularity_desc$"
 decision_gh_life_seeding: "Gieo mầm Sự sống"
 decision_gh_life_seeding_desc: "Chúng ta đã cải tạo thiên hà thành công, khiến phần lớn các giống loài trên hành tinh phải chịu cảnh diệt vong chóng vánh. Giờ đây, chúng ta có thể định hình sự sống theo chính hình bóng của mình, khai mở một kỷ nguyên mới."
 decision_gh_life_seeding_limit: "$TRIGGER_FAIL$§RHành tinh này đã có một nền văn minh nguyên thủy.§!"
 decision_gh_life_seeding_colony: "$TRIGGER_FAIL$§RKhông thể tiến hành trên các hệ sao đã bị thuộc địa hóa.§!"
 decision_gh_life_seeding_effect: "Tạo ra một nền văn minh nguyên thủy theo hình bóng của chúng ta.\n\n§HGiới hạn kích hoạt:§![from.gh_life_seeder_var]/3"
 # Mẫu vật Đại Lưu trữ
 infernal_burning_gem: "Viên Ngọc Rực cháy"
 infernal_burning_gem_desc_short: "Đây là một trong những mẫu thử nghiệm đầu tiên mà [GetName] chế tạo để khai thác năng lượng entropy."
 infernal_burning_gem_desc_details: "Đối với phần lớn các hệ thống thị giác, mảnh tinh thể này trông có vẻ xỉn màu và tăm tối, thứ ánh sáng trắng mờ nhạt của nó đã che giấu nguồn năng lượng khổng lồ ẩn chứa bên trong. Dù có lẽ nó đã bị thay thế bởi các công nghệ tân tiến hơn, kết cấu và đặc tính của nó vẫn mang nhiều giá trị học thuật đáng kể."
 # Dòng Thời gian
 TIMELINE_EVENT_GH_START: "Bão lửa\n§L[GetDate]§!"
 TIMELINE_EVENT_GH_START_TOOLTIP: "§HTrở thành Khủng hoảng§!\n§YSự kiện Khủng hoảng§!\n\n[EVENT_TARGET_0.GetName] đã thắp sáng ngai vàng của mình, bắt đầu thao túng vận mệnh thiên hà. Những kẻ không chung chí hướng sẽ bị nhấn chìm trong ngọn lửa chinh phạt, chỉ còn lại nắm tro tàn."
 TIMELINE_EVENT_GH_END: "Ngọn lửa Nuốt chửng\n§L[GetDate]§!"
 TIMELINE_EVENT_GH_END_TOOLTIP: "§HThiên hà Thất thủ§!\n§YSự kiện Khủng hoảng§!\n\nKhao khát rực cháy thuở ban đầu đã trở thành mồi lửa thiêu rụi cả thiên hà. Bọn phản kháng đều đã hóa thành tro bụi, bị xóa sổ hoàn toàn khỏi dòng chảy lịch sử."
