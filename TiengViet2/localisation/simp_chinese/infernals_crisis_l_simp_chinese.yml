 # Cải tạo sao bằng Ống dẫn
 crisis_conduit_buff: "Giám sát Vì sao"
 crisis_conduit_buff_desc: "Bầu khí quyển của ngôi sao trong hệ này đột ngột biến đổi dữ dội, gây ra bão Mặt Trời dữ dội trên quy mô toàn hệ sao. Với kẻ khác đây là thảm họa, nhưng với chúng ta lại là cơ hội để phát triển hưng thịnh."
 TERRAFORM_ORDER: "Cải tạo Ngôi sao"
 TERRAFORM_ORDER_DESC: "Từ từ chuyển hóa ngôi sao mục tiêu thành §Y$pc_m_giant_star$§!."
 TERRAFORM_ORDER_RESEARCH: "Nhờ vào tiềm năng năng lượng chồng chất của Entropy Kết tinh, các ngôi sao nhỏ có thể trở thành những sao khổng lồ đỏ đồ sộ."
