 EXIT_BYPASS_ENTROPY_WORMHOLE: "Rời khỏi $BYPASS_TYPE$"
 personality_hyperthermia_empire: "Đế chế Rực nhiệt"
 personality_hyperthermia_empire_desc: "Một đế chế cai trị bằng nhiệt lượng luôn tôn sùng năng lượng, entropy và ngọn lửa của các vì sao. Họ không chinh phạt vì hư danh, mà dùng ngọn lửa rực rỡ để chạm khắc thiên hà, thiêu rụi vạn vật."
 triggered_opinion_hyperthermia_empire: "Đế chế $personality_hyperthermia_empire$"
 mod_job_metallurgist_naval_cap_add: "£mod_country_naval_cap_add£từ công việc £job_foundry£[GetAlloyProducer] $MOD_COUNTRY_NAVAL_CAP_ADD$"
 crisis_thermophile_adaptation: "Thích nghi Kháng nhiệt"
