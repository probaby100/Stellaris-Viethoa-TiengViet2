 # Mục tiêu
 crisobj_own_volcanics_name: "Sở hữu Hành tinh Núi lửa"
 crisobj_own_volcanics_desc: "Nhiệt lượng gia tăng trong hệ sao sẽ thúc đẩy hoạt động núi lửa, có lợi cho việc đẩy mạnh sứ mệnh rực lửa này. Cần ưu tiên thuộc địa hóa §YHành tinh Núi lửa§! để giành thế chủ động.\n\nMỗi năm cung cấp lượng thu nhập thụ động §Y$entropy_crystals$§!, tăng tiến theo số lượng thuộc địa §Y$pc_volcanic$§!."
 crisobj_create_volcanics_name: "Kiến tạo Hành tinh Núi lửa"
 crisobj_create_volcanics_desc: "Mở rộng hoạt động núi lửa trên các hành tinh sẽ thúc đẩy nền kinh tế Entropy Kết tinh. Dựa vào công nghệ cải tạo môi trường, chúng ta có thể kích hoạt hoạt động núi lửa kéo dài trên bất kỳ hành tinh nào được chọn.\n\nCải tạo môi trường hành tinh thành §Y$pc_volcanic$§!."
 crisobj_own_red_stars_name: "Sở hữu Ngôi sao Đỏ"
 crisobj_own_red_stars_desc: "Chúng ta nên ưu tiên thiết lập hệ thống thuộc địa xung quanh các ngôi sao đỏ. Bề mặt bức xạ rộng lớn của chúng rất phù hợp để thu thập nhiệt năng.\n\nMỗi tháng cung cấp lượng thu nhập thụ động §Y$entropy_crystals$§!, tăng tiến theo mỗi §Y$pc_m_star$§! hoặc §Y$pc_m_giant_star$§! nằm trong lãnh thổ."
 crisobj_create_red_stars_name: "Kiến tạo Ngôi sao Đỏ"
 crisobj_create_red_stars_desc: "Được thúc đẩy bởi Entropy Kết tinh, các ngôi sao sẽ phình to thành sao khổng lồ đỏ, hỗ trợ sự trỗi dậy của đế chế rực lửa.\n\nNgôi sao được cải tạo môi trường bởi §Y$entropy_conduit_plural$§! sẽ trở thành §Y$pc_m_giant_star$§!."
 crisobj_planet_firestorm_name: "Hành tinh Bốc cháy"
 crisobj_planet_firestorm_desc: "Đã đến lúc dùng các cuộc oanh tạc bằng bão lửa để chứng tỏ quyền bá chủ tuyệt đối của chúng ta với kẻ thù, biến hành tinh của chúng thành tro bụi.\n\nSử dụng §Y$bombardment_firestorm$§! oanh tạc thuộc địa, gây ra §R100% tàn phá§!."
 crisobj_lens_beam_impact_name: "Nhiễu loạn Hạm đội"
 crisobj_lens_beam_impact_desc: "Những hành tinh ôn đới lạnh lẽo chẳng mang lại ích lợi gì. Cần tái định hình bề mặt, nung chảy chúng thành hình thái đáp ứng nhu cầu của chúng ta.\n\nSử dụng vũ khí £ship_xl_slot£§Y$LENS_FLARE_BEAM$§! trang bị trên §Y$entropy_conduit_plural$§! và §Y$ember_battleship_plural$§! để bắn phá hành tinh địch."
 crisobj_entropy_starbase_name: "Sở hữu Máy ly tâm Trọng lực"
 crisobj_entropy_starbase_desc: "Máy ly tâm Trọng lực giúp chúng ta thu thập thêm $entropy_crystals$.\n\nXây dựng công trình căn cứ sao §!$sm_gravitational_centrifuge$§Y tại hệ §Ysao đôi§!, §Ysao ba§! hoặc §Y$pc_black_hole$§!."
