 sm_gravitational_centrifuge_desc: "Cấu trúc này tận dụng gradient trọng lực mạnh để phân giải chất thải ở cấp độ phân tử, chuyển hóa chúng thành plasma entropy có thể kết tinh để dự trữ và sử dụng."
