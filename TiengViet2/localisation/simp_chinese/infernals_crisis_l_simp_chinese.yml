 ENTROPY_WORMHOLE_GALACTIC: "Lỗ sâu Kỳ dị"
 ENTROPY_WORMHOLE_DESC: "Hệ sao này chứa một §YLỗ sâu§! dẫn đến $DEST|Y$"
 ENTROPY_WORMHOLE_DESC_UNEXPLORED: "Hệ sao này chứa một §YLỗ sâu§! §Rchưa được khám phá§!"
