 entropy_crystals_gaining: "Hoàn thành §HMục tiêu Khủng hoảng§! để nhận thêm £entropy_crystals£§Y$entropy_crystals$§!."
 entropy_crystals_desc: "Ma trận năng lượng lấp lánh nhấp nhô này lại có thể duy trì sự ổn định, vừa đủ để làm nhiên liệu vận chuyển hoặc gắn vào các thiết bị."
 mod_country_base_entropy_crystals_produces_add: "Mỗi tháng £entropy_crystals£$entropy_crystals$"
 entropy_crystals_crisis_objective: "$menace_crisis_objective$"
