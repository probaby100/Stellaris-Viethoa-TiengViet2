 # Đặc quyền Thăng tiến
 ap_galactic_hyperthermia: "Siêu nhiệt Thiên hà"
 ap_galactic_hyperthermia_desc: "Vũ trụ sinh ra từ ngọn lửa, nhưng lại nguội lạnh thành một nơi tối tăm và hiểm ác. Để phát triển thịnh vượng, chúng ta phải tăng nhiệt độ, ngay cả khi điều này dẫn đến sự diệt vong của các sinh mệnh khác."
 must_be_infernals: "$TRIGGER_FAIL$Yêu cầu dân số phải là Loài Hỏa ngục."
