 entropy_crystals_deficit: "Thiếu hụt $entropy_crystals$"
 edict_entropy_harnessing: "Khai thác Entropy"
 edict_entropy_harnessing_desc: "Tích hợp quá trình sản xuất $entropy_crystals$ vào cơ sở hạ tầng, cho phép chúng ta phát huy tối đa lợi thế công nghệ và tận dụng tốt nhất nguồn tài nguyên mới không ổn định này."
