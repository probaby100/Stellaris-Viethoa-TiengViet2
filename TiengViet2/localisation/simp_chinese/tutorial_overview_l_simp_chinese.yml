 WIKI_TEXT: "Bách Khoa Toàn Thư"
 WIKI_INFO: "Truy cập Bách Khoa Toàn Thư Stellaris trực tuyến."
 HELP_TUTORIAL_TITLE: "Nhiệm Vụ"
 HELP_TUTORIAL_CHAPTER_1_INTRO: "Dù biển sao bao la nhường nào, hành trình vạn dặm cũng bắt đầu từ một bước chân"
 HELP_TUTORIAL_CHAPTER_2_INTRO: "Giữa bầu trời đêm đầy sao lấp lánh, một đế chế vĩ đại đang dần thành hình"
 HELP_TUTORIAL_CHAPTER_3_INTRO: "Tìm người giữa chốn đông người, hóa ra người ở ngay nơi ánh đèn hiu hắt"
 HELP_TUTORIAL_CHAPTER_4_INTRO: "Gió thu tiễn bước đường xưa cũ, nụ non lộc biếc ấp ủ mầm sống mới"
 HELP_TUTORIAL_CHAPTER_5_INTRO: "Chân mệnh thiên tử tựa vầng dương rực rỡ, ngày cờ trắng vắt ngang mặt trời ắt sẽ đến"
