 QUIT_THANK_YOU_FOR_RATING: "Cảm ơn bạn đã giúp chúng tôi cải thiện Stellaris!"
 QUIT_INFO_RATING: "Đánh giá trải nghiệm trò chơi"
 QUICK_START: "Khởi Đầu Nhanh"
 QUICK_START_DESC: "Gia nhập $EMPIRE_DESIGN_humans1$ và bước những bước đầu tiên trên con đường khám phá vũ trụ. Chọn tùy chọn này để có được trải nghiệm ban đầu tuyệt vời nhất với Stellaris."
 QUICK_START_INFO: "Lựa chọn này sẽ ngay lập tức bắt đầu trò chơi, cho phép bạn trải nghiệm mọi khía cạnh của Stellaris mà không cần phải tốn công thiết lập một đế chế từ con số không."
