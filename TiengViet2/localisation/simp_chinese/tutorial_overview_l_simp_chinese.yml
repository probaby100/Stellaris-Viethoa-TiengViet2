 HELP_TUTORIAL_CHAPTER_2_TITLE: "Kinh Tế"
 HELP_TUTORIAL_CHAPTER_3_TITLE: "Ngoại Giao"
 HELP_TUTORIAL_CHAPTER_4_TITLE: "Chính Trị"
 HELP_TUTORIAL_CHAPTER_5_TITLE: "Chiến Tranh"
 HELP_TUTORIAL_SUGGESTED_ACTIONS: "Hành Động Đề Xuất"
 HELP_TUTORIAL_CHANGE_MISSION: "Thay Đổi Nhiệm Vụ"
 HELP_TUTORIAL_COMPLETE_MISSION: "Hoàn Thành Nhiệm Vụ"
 HELP_TUTORIAL_TRACK_THIS_TASK: "Theo Dõi Nhiệm Vụ Này"
 #Chương 1
 HELP_TUTORIAL_SURVEYING_TITLE: "Khảo Sát Hệ Sao"
 HELP_TUTORIAL_SURVEYING_DESC: "§SKhảo Sát§! các hệ sao khác là cách hiệu quả nhất để khám phá biển sao bao la. Trong quá trình §SKhảo Sát§! các hệ sao khác, bạn có thể phát hiện ra những £planet£§SHành Tinh§! mới hoặc các §STài Nguyên§! tiềm năng.\n\nĐể khảo sát một hệ sao, hãy mở §SBản Đồ Thiên Hà§! (£m£), chọn một chiếc £science_ship£§STàu Khoa Học§!, sau đó nhấp chuột phải vào một hệ sao lân cận và chọn \"Khảo Sát Hệ Sao\"."
 HELP_TUTORIAL_SURVEYING_INSTRUCTIONS: "§Y1.§! Chọn một chiếc Tàu Khoa Học.\n§Y2.§! Nếu trên tàu chưa có Giám đốc Khoa học, hãy chỉ định một người.\n§Y3.§! Nhấp chuột phải vào mũi tên chỉ đến hệ sao lân cận.\n§Y4.§! Chọn \"Khảo Sát Hệ Sao\""
 #Nếu người chơi có một chiếc tàu khoa học, hãy chọn và di chuyển camera đến nó khi nhấp vào (nếu có nhiều hơn 1, hãy chọn chiếc đầu tiên). Ngược lại, hãy vô hiệu hóa nút bấm và hiển thị tooltip "Bạn không có Tàu Khoa Học nào."
 HELP_TUTORIAL_SURVEYING_ACTION: "Đi Đến Tàu Khoa Học"
 HELP_TUTORIAL_ANOMALIES_TITLE: "Nghiên Cứu Hiện Tượng Dị Thường"
 HELP_TUTORIAL_ANOMALIES_DESC: "§SHiện Tượng Dị Thường§! là những hiện tượng kỳ lạ mà bạn có thể bắt gặp trong quá trình §SKhảo Sát§! các hệ sao khác. Việc nghiên cứu các hiện tượng dị thường phần lớn (nhưng không phải tất cả) sẽ mang lại những sự kiện có lợi cho §SĐế Chế§! của bạn.\n\nThời gian cần thiết để §SNghiên Cứu§! một hiện tượng dị thường phụ thuộc vào độ khó của nó và kỹ năng của §SGiám Đốc Khoa Học§! được chỉ định. Bạn có thể sử dụng §SNhật Ký Tình Hình§! (£f2£) ở menu bên trái để tìm những §SHiện Tượng Dị Thường§! chưa được khảo sát."
 HELP_TUTORIAL_ANOMALIES_INSTRUCTIONS: "§Y1.§! Khảo sát các hệ sao xung quanh để tìm kiếm hiện tượng dị thường.\n§Y2.§! Mở Nhật Ký Tình Hình ở bảng điều hướng bên trái.\n§Y3.§! Chọn một hiện tượng dị thường khả dụng, chỉ định một Giám đốc Khoa học tiến hành nghiên cứu."
 HELP_TUTORIAL_ANOMALIES_ACTION: "Mở Nhật Ký Tình Hình"
 HELP_TUTORIAL_TECHNOLOGY_TITLE: "Nghiên Cứu Công Nghệ"
 HELP_TUTORIAL_TECHNOLOGY_DESC: "Công nghệ được chia thành ba lĩnh vực chính:\n£physics£§SVật Lý Học§!, £society£§SXã Hội Học§! và £engineering£§SKỹ Thuật Học§!.\n\nBạn có thể tiến hành nghiên cứu đồng thời một công nghệ trong mỗi lĩnh vực.\nTốc độ §SNghiên Cứu§! của bạn phụ thuộc vào lượng §SĐiểm Nghiên Cứu§! mà đế chế sản xuất ra. Số điểm này được tạo ra từ các £building£§SCông Trình§!, £district£§SPhân Khu§! trên các £planet£§SHành Tinh§! đã được thuộc địa hóa, cũng như các §STrạm Nghiên Cứu§! nằm trong các hệ sao thuộc quyền kiểm soát của chúng ta."
 HELP_TUTORIAL_TECHNOLOGY_INSTRUCTIONS: "§Y1.§! Mở $topbar_button_technology_name$ ở bảng điều hướng bên trái.\n§Y2.§! Nhấp vào bất kỳ ô trống nào và chọn một công nghệ từ danh sách để bắt đầu nghiên cứu."
 HELP_TUTORIAL_TECHNOLOGY_ACTION: "Mở Giao Diện Công Nghệ"
 HELP_TUTORIAL_SPACE_STATION_TITLE: "Mở Rộng Bằng Căn Cứ Sao"
 HELP_TUTORIAL_SPACE_STATION_DESC: "Phương thức hiệu quả nhất để mở rộng ranh giới đế chế là xây dựng các §SCăn Cứ Sao§! (Tiền đồn). Hoạt động này chỉ có thể được thực hiện tại những hệ sao đã được §SKhảo Sát§! hoàn tất.\n\nĐể xây dựng §SCăn Cứ Sao§!, bạn cần ra lệnh cho một chiếc £construction_ship£§STàu Công Trình§! thực hiện thao tác tương ứng. Sau khi §SCăn Cứ Sao§! được xây dựng xong, bạn có thể tiến hành xây dựng các §STrạm Nghiên Cứu§! và §STrạm Khai Thác§! bên trong hệ sao này, và đương nhiên là cả việc thuộc địa hóa những £planet£§SHành Tinh§! có thể sinh sống bên trong đó."
 HELP_TUTORIAL_SPACE_STATION_INSTRUCTIONS: "§Y1.§! Nhấp vào nút ở giữa phía dưới màn hình để mở Bản Đồ Thiên Hà.\n§Y2.§! Sử dụng nút ở góc dưới bên trái màn hình để chọn một Tàu Công Trình.\n§Y3.§! Nhấp chuột phải vào bất kỳ hệ sao vô chủ nào và chọn \"Xây Dựng Tiền Đồn\"."
 #Nếu người chơi có một tàu công trình, hãy chọn và di chuyển camera đến nó khi nhấp vào (nếu có nhiều hơn 1, hãy chọn chiếc đầu tiên). Ngược lại, hãy vô hiệu hóa nút bấm và hiển thị tooltip "Bạn không có Tàu Công Trình nào."
 HELP_TUTORIAL_SPACE_STATION_ACTION: "Đi Đến Tàu Công Trình"
 HELP_TUTORIAL_COLONIZATION_TITLE: "Thuộc Địa Hóa Hành Tinh"
 HELP_TUTORIAL_COLONIZATION_DESC: "Việc thuộc địa hóa các hành tinh khác cho phép £pop£§SDân Số§! của bạn di cư đến những hành tinh mới, qua đó giúp §SĐế Chế§! của bạn thu thập được nhiều §STài Nguyên§! hơn. Sẽ có một số £planet£§SHành Tinh§! sở hữu độ phù hợp cao hơn những hành tinh khác, vì vậy hãy cân nhắc kỹ lưỡng trước khi quyết định thiết lập £colony_ship£§SThuộc Địa§! mới ở đâu.\n\nĐể thuộc địa hóa một hành tinh có thể sinh sống, hành tinh đó phải nằm gọn trong biên giới của đế chế bạn và đã được một chiếc £science_ship£§STàu Khoa Học§! khảo sát kỹ lưỡng."
 HELP_TUTORIAL_COLONIZATION_INSTRUCTIONS: "§Y1.§! Chọn Ụ Tàu của bạn trong menu Tổng Quan (ở cạnh phải màn hình).\n§Y2.§! Chọn thẻ Ụ Tàu ở phần dưới của cửa sổ Ụ Tàu.\n§Y3.§! Chế tạo một Tàu Thuộc Địa.\n§Y4.§! Chọn một hành tinh có thể sinh sống và nhấp vào \"Thuộc Địa Hóa\"."
 #Nếu người chơi đã tìm thấy một hành tinh có thể sinh sống, hãy chọn và di chuyển camera đến nó khi nhấp vào (nếu có nhiều hơn 1, hãy chọn hành tinh đầu tiên). Ngược lại, hãy vô hiệu hóa nút bấm và hiển thị tooltip "Bạn chưa tìm thấy bất kỳ hành tinh nào có thể sinh sống".
 HELP_TUTORIAL_COLONIZATION_ACTION: "Đi Đến Một Hành Tinh Có Thể Sinh Sống"
 HELP_TUTORIAL_EXCAVATION_TITLE: "Khai Quật Di Tích Khảo Cổ"
 HELP_TUTORIAL_EXCAVATION_DESC: "Các £archaeology£§SDi Tích Khảo Cổ§! có thể được phát hiện trong quá trình §SKhảo Sát§!, hoặc trong lúc tiến hành thuộc địa hóa một £planet£§SHành Tinh§!.\n\nKhi một §SDi Tích Khảo Cổ§! nằm trong ranh giới của một §SĐế Chế§!, §SĐế Chế§! đó có thể cử một chiếc £science_ship£§STàu Khoa Học§! đến để tiến hành khai quật. Thời gian khai quật sẽ phụ thuộc vào mức độ khó của §SDi Tích Khảo Cổ§! đó."
 HELP_TUTORIAL_EXCAVATION_INSTRUCTIONS: "§Y1.§! Mở Nhật Ký Tình Hình ở bảng điều hướng bên trái.\n§Y2.§! Chọn một nhiệm vụ khảo cổ (có biểu tượng chiếc xẻng cắm trên mô đất) trong các đánh dấu của Nhật Ký Tình Hình.\n§Y3.§! Nhấn nút \"Đến\" để di chuyển tới di tích khảo cổ.\n§Y4.§! Dùng nút ở góc dưới bên trái màn hình để chọn một Tàu Khoa Học.\n§Y5.§! Nhấp chuột phải vào biểu tượng chiếc xẻng và chọn tùy chọn \"Khai Quật Di Tích\".\n§Y6.§! Chọn một di tích khảo cổ.\n§Y7.§! Bắt đầu nhiệm vụ."
 HELP_TUTORIAL_EXCAVATION_ACTION: "Mở Nhật Ký Tình Hình"
 #Chương 2
 HELP_TUTORIAL_BASIC_RESOURCES_TITLE: "Tài Nguyên Cơ Bản"
 HELP_TUTORIAL_BASIC_RESOURCES_DESC: "Tài nguyên cơ bản bao gồm £energy£§SNăng Lượng§!, £minerals£§SKhoáng Sản§! và £food£§SThực Phẩm§!.\n\nNhững tài nguyên này chủ yếu được sản xuất bởi các £building£§SCông Trình§! trên £planet£§SHành Tinh§! của bạn, hoặc các §STrạm Khai Thác§!. Các tài nguyên cơ bản này được tính toán sản lượng thu hoạch và lưu trữ theo từng tháng, và bạn nên tìm kiếm cũng như khai thác chúng càng sớm càng tốt."
 HELP_TUTORIAL_BASIC_RESOURCES_INSTRUCTIONS: "§Y1.§! Chọn Tàu Công Trình trong menu Tổng Quan (ở cạnh phải màn hình).\n§Y2.§! Mở Bản Đồ Thiên Hà (nút ở giữa phía dưới màn hình).\n§Y3.§! Chọn một hệ sao bạn đã sở hữu, nhấp chuột phải.\n§Y4.§! Nhấp chọn Xây Dựng Trạm Khai Thác"
 HELP_TUTORIAL_BASIC_RESOURCES_ACTION: ""
 HELP_TUTORIAL_ADVANCED_RESOURCES_TITLE: "Tài Nguyên Cấp Cao"
 HELP_TUTORIAL_ADVANCED_RESOURCES_DESC: "Tài nguyên cấp cao bao gồm £alloys£§SHợp Kim§! và £consumer_goods£§SHàng Tiêu Dùng§!.\nChúng được chuyển hóa từ £minerals£§SKhoáng Sản§! thông qua các £building£§SCông Trình§! và £district£§SPhân Khu§! trên những £planet£§SHành Tinh§! đã được thuộc địa hóa.\n\n£alloys£§SHợp Kim§! được dùng cho mục đích quân sự, là yếu tố sống còn để chế tạo tàu thuyền và căn cứ sao. Còn £consumer_goods£§SHàng Tiêu Dùng§! thì tượng trưng cho những món hàng hóa nhỏ lẻ, đồ xa xỉ... nhằm thỏa mãn những nhu cầu đa dạng của £pop£§SDân Số§!."
 HELP_TUTORIAL_ADVANCED_RESOURCES_INSTRUCTIONS: "§Y1.§! Chọn một hành tinh (trong menu Tổng Quan ở cạnh phải màn hình)\n§Y2.§! Nhấp vào một ô công trình còn trống.\n§Y3.§! Xây dựng Lò Đúc Hợp Kim."
 HELP_TUTORIAL_ADVANCED_RESOURCES_ACTION: ""
 HELP_TUTORIAL_ABSTRACT_RESOURCES_TITLE: "Tài Nguyên Trừu Tượng"
 HELP_TUTORIAL_ABSTRACT_RESOURCES_DESC: "Tài nguyên trừu tượng ám chỉ những tài sản phi vật chất như £influence£§SSức Ảnh Hưởng§! và £unity£§SĐoàn Kết§!.\n\nBạn có thể thu thập £influence£§SSức Ảnh Hưởng§! bằng cách biến các đế chế khác thành §SKẻ Thù§! hoặc §SQuốc Gia Bảo Hộ§! của mình. Sức ảnh hưởng thường được dùng để xây dựng §SCăn Cứ Sao§! hoặc thiết lập các §SYêu Sách§! nhằm mở rộng lãnh thổ đế chế, hay dùng để thực thi các §SSắc Lệnh§!.\n\n£unity£§HĐoàn Kết§! chủ yếu thu được từ các công trình trên các ngôi sao, và có thể được dùng để tiếp nhận những §STruyền Thống§! mới."
 HELP_TUTORIAL_STRATEGIC_RESOURCES_TITLE: "Tài Nguyên Chiến Lược"
 HELP_TUTORIAL_STRATEGIC_RESOURCES_DESC: "Tài nguyên chiến lược khá hiếm hoi, lại là thứ không thể thiếu để xây dựng cũng như bảo trì các công trình cấp cao và linh kiện tàu. Việc thu thập chúng gian nan hơn rất nhiều so với tài nguyên cơ bản, do đó chúng có giá trị vô cùng to lớn. Các mỏ tài nguyên chiến lược tự nhiên luôn hiện rõ mồn một, nhưng bạn bắt buộc phải có những §SCông Nghệ§! chuyên biệt thì mới có thể khai thác và tận dụng chúng."
 HELP_TUTORIAL_TRADE_VALUE_TITLE: "Giá Trị Thương Mại"
 HELP_TUTORIAL_TRADE_VALUE_DESC: "£trade£§SGiá Trị Thương Mại§! được tạo ra từ những hoạt động kinh tế thường nhật của công dân.\n\nNếu một §SCăn Cứ Sao§! được kết nối với £planet£§SHành Tinh Thủ Đô§! của bạn thông qua §STuyến Đường Thương Mại§!, nó sẽ cung cấp cho bạn $r_trade$§SGiá Trị Thương Mại§! thu thập được trong hệ sao dưới dạng £energy£§SNăng Lượng§!, £consumer_goods£§SHàng Tiêu Dùng§! hoặc £unity£§SĐoàn Kết§!, hình thức quy đổi cụ thể sẽ phụ thuộc vào chính sách thương mại mà §SĐế Chế§! của bạn đang áp dụng."
 HELP_TUTORIAL_TRADE_VALUE_INSTRUCTIONS: "§Y1.§! Nhấp vào nút ở giữa phía dưới màn hình để mở Bản Đồ Thiên Hà.\n§Y2.§! Dùng giao diện Tổng Quan (cạnh phải màn hình) hoặc thẻ ở góc dưới bên trái để chọn một Tàu Công Trình.\n§Y3.§! Nhấp chuột phải vào bất kỳ hệ sao vô chủ nào, chọn \"Xây Dựng Tiền Đồn\""
 HELP_TUTORIAL_TRADE_VALUE_ACTION: ""
 HELP_TUTORIAL_TRADE_VALUE_DISBLAED_ACTION: ""
 HELP_TUTORIAL_PLANET_MANAGEMENT_TITLE: "Quản Lý Hành Tinh"
 HELP_TUTORIAL_PLANET_MANAGEMENT_DESC: "Công việc quản lý hành tinh bao gồm £district£§SXây Dựng Phân Khu§!, £building£§SXây Dựng Công Trình§! và điều phối sự gia tăng £pop£§SDân Số§!, cũng như thiết lập lực lượng phòng vệ cho hành tinh.\n\nCác £planet£§SHành Tinh§! là một phần quan trọng của một §SĐế Chế§! liên tinh tú, chúng sản sinh ra phần lớn §STài Nguyên§! và £pop£§SDân Số§!, đảm bảo sự phồn vinh cho §SĐế Chế§! của bạn."
 HELP_TUTORIAL_PLANET_MANAGEMENT_INSTRUCTIONS: "§Y1.§! Chọn một hành tinh (trong menu Tổng Quan ở cạnh phải màn hình)\n§Y2.§! Nhấp vào một ô công trình còn trống.\n§Y3.§! Xây dựng Kho Chứa Tài Nguyên."
 HELP_TUTORIAL_PLANET_MANAGEMENT_ACTION: "Đến Hành Tinh Thủ Đô"
 HELP_TUTORIAL_SHIPS_TITLE: "Chế Tạo Chiến Hạm"
 HELP_TUTORIAL_SHIPS_DESC: "Toàn bộ tàu thuyền đều được chế tạo và sửa chữa tại những §SCăn Cứ Sao§! có lắp đặt §SModule Ụ Tàu§!. Tàu thuyền được chia thành hai loại: dân sự và quân sự.\n\nTàu dân sự bao gồm £science_ship£§STàu Khoa Học§!, £construction_ship£§STàu Công Trình§! và\n£colony_ship£§STàu Thuộc Địa§!.\n\n§STàu Quân Sự§! bao gồm toàn bộ chiến hạm có trang bị vũ khí của đế chế. Khác với tàu dân sự, chúng có thể hợp lại thành các §SHạm Đội§! và được đặt dưới sự chỉ huy của một vị §STư Lệnh Hạm Đội§!."
 HELP_TUTORIAL_SHIPS_INSTRUCTIONS: "§Y1.§! Chọn Ụ Tàu của bạn trong menu Tổng Quan (ở cạnh phải màn hình).\n§Y2.§! Chọn thẻ Ụ Tàu ở phần dưới của cửa sổ Ụ Tàu.\n§Y3.§! Chế tạo một Tàu Khoa Học."
 #Có thể "ăn gian" ở đây và đơn giản là đi đến Căn Cứ Sao trong hệ sao thủ đô
 #Nếu người chơi có một Căn Cứ Sao với Ụ Tàu, hãy chọn và di chuyển camera đến nó khi nhấp vào. Ngược lại, hãy vô hiệu hóa nút bấm và hiển thị tooltip "Bạn không có Căn Cứ Sao nào có Ụ Tàu"
 HELP_TUTORIAL_SHIPS_ACTION: "Đi Đến Căn Cứ Sao Có Ụ Tàu"
 #Chương 3
 HELP_TUTORIAL_FIRST_CONTACT_TITLE: "Thực Hiện Cuộc Chạm Trán Đầu Tiên"
 HELP_TUTORIAL_FIRST_CONTACT_DESC: "Trong lần đầu tiên đụng độ với một chủng loài ngoại lai mới, đặc phái viên sẽ phải hoàn thành hàng loạt nhiệm vụ. Những quyết định của bạn trong suốt chuỗi nhiệm vụ này sẽ quyết định thái độ của giống loài ngoại lai đó đối với đế chế của bạn."
 HELP_TUTORIAL_FIRST_CONTACT_INSTRUCTIONS: "§Y1.§! Khám phá thiên hà, tìm ra một đế chế khác.\n§Y2.§! Mở Nhật Ký Tình Hình và nhấp vào sự kiện chạm trán.\n§Y3.§! Phái một đặc phái viên để thiết lập kênh ngoại giao với đế chế đó."
 HELP_TUTORIAL_FIRST_CONTACT_ACTION: "Mở Giao Diện Ngoại Giao"
 HELP_TUTORIAL_PRIMITIVE_SPECIES_TITLE: "Chạm Trán Loài Tiền Siêu Quang Tốc"
 HELP_TUTORIAL_PRIMITIVE_SPECIES_DESC: "Có những nền văn minh vẫn chưa phát triển đủ §SCông Nghệ§! thiết yếu để có thể thực hiện những chuyến du hành giữa các vì sao. Bằng cách xây dựng các §STrạm Quan Sát§! trên quỹ đạo £planet£§SHành Tinh§! của họ, bạn có thể chọn quan sát hoặc nghiên cứu họ, để nhận lấy các chỉ số cường hóa về £society£§SNghiên Cứu Xã Hội Học§!. Bạn cũng có thể tận dụng lợi thế công nghệ vượt trội của mình để nâng tầm cho họ.\n\nSau khi được nâng tầm, giống loài đó sẽ trở thành một phần của đế chế đã nâng tầm họ, và mang đến 500 điểm £influence£§SSức Ảnh Hưởng§!."
 HELP_TUTORIAL_PRIMITIVE_SPECIES_INSTRUCTIONS: "§Y1.§! Chọn Tàu Công Trình trong menu Tổng Quan (ở cạnh phải màn hình).\n§Y2.§! Mở Bản Đồ Thiên Hà (nút ở giữa phía dưới màn hình).\n§Y3.§! Chọn một hệ sao bạn đã sở hữu, nhấp chuột phải.\n§Y4.§! Nhấp chọn Xây Dựng Trạm Quan Sát."
 #Nếu người chơi đã gặp một giống loài tiền siêu quang tốc, hãy chọn hành tinh của nó khi nhấp vào. Ngược lại, hãy vô hiệu hóa nút bấm và hiển thị tooltip "Chưa gặp giống loài tiền siêu quang tốc nào"
 HELP_TUTORIAL_PRIMITIVE_SPECIES_ACTION: "Đi Đến Xem Một Giống Loài Tiền Siêu Quang Tốc"
 HELP_TUTORIAL_ENVOYS_TITLE: "Chỉ Định Đặc Phái Viên"
 HELP_TUTORIAL_ENVOYS_DESC: "§SĐặc Phái Viên§! là những nhà lãnh đạo cấp thấp có thể được chỉ định thực hiện vô vàn các nhiệm vụ ngoại giao khác nhau, họ có thể cải thiện mối quan hệ của bạn với các £empire£§SĐế Chế§! khác, hoặc thiết lập liên lạc với những §SĐế Chế§! mới được phát hiện. Sau khi một §SĐặc Phái Viên§! được giao một nhiệm vụ nào đó, trong vòng một năm bạn sẽ không thể thay đổi nhiệm vụ của người đó.\n\n§SĐặc Phái Viên§! đóng vai trò cực kỳ quan trọng trong việc quản lý £opinion£§SĐánh Giá§! của các nền văn minh khác đối với £empire£§SĐế Chế§! của bạn."
 HELP_TUTORIAL_ENVOYS_INSTRUCTIONS: "§Y1.§! Nhấp vào mục Liên Hệ ở bảng điều hướng bên trái\n§Y2.§! Chọn một đế chế mà bạn muốn cải thiện quan hệ.\n§Y3.§! Nhấp vào Ngoại Giao.\n§Y4.§! Nhấp vào Cải Thiện Quan Hệ."
 HELP_TUTORIAL_ENVOYS_ACTION: ""
 HELP_TUTORIAL_INTEL_TITLE: "Thu Thập Tình Báo"
 HELP_TUTORIAL_INTEL_DESC: "§STình Báo§! có thể được sử dụng để làm suy yếu các £empire£§SĐế Chế§! khác hoặc để giành lấy những lợi thế cho phe mình. Lượng thông tin mà một đế chế nắm giữ về các đế chế khác được thể hiện bằng lượng tài nguyên §STình Báo§!.\n\nBạn càng nắm trong tay nhiều §STình Báo§! về một £empire£§SĐế Chế§! khác, thì những thông tin mà bạn biết về họ lại càng chính xác."
 HELP_TUTORIAL_INTEL_INSTRUCTIONS: "§Y1.§! Nhấp vào mục Liên Hệ ở bảng điều hướng bên trái\n§Y2.§! Chọn một đế chế mà bạn muốn tìm hiểu kỹ hơn.\n§Y3.§! Nhấp vào Ngoại Giao.\n§Y4.§! Nhấp vào Xây Dựng Mạng Lưới Tình Báo."
 HELP_TUTORIAL_INTEL_ACTION: ""
 HELP_TUTORIAL_GALACTIC_COMMUNITY_TITLE: "Gia Nhập Cộng Đồng Thiên Hà"
 HELP_TUTORIAL_GALACTIC_COMMUNITY_DESC: "Một £empire£§SĐế Chế§! khi đã tiếp xúc với phần lớn các nền văn minh liên tinh tú khác sẽ nhận được lời mời gia nhập Cộng Đồng Thiên Hà. Trở thành quốc gia thành viên đồng nghĩa với việc bạn có quyền bỏ phiếu cho các bộ luật mới tại Thượng Viện. Những bộ luật được thông qua sẽ có hiệu lực đối với tất cả các quốc gia thành viên."
 HELP_TUTORIAL_GALACTIC_COMMUNITY_INSTRUCTIONS: "Vậy là sự tự do đã tan biến như thế đó...\n... trong tiếng vỗ tay vang dội như sấm rền."
 HELP_TUTORIAL_GALACTIC_COMMUNITY_ACTION: ""
 HELP_TUTORIAL_FALLEN_EMPIRES_TITLE: "Đế Chế Sa Sút"
 HELP_TUTORIAL_FALLEN_EMPIRES_DESC: "Đế Chế Sa Sút là tàn dư của những thế lực liên tinh tú cổ đại. Dù vinh quang thuở nào đã lụi tàn, nhưng chúng vẫn nắm giữ trong tay những công nghệ hiện đại đến mức đáng kinh ngạc. Chúng hoàn toàn thờ ơ trước các sự kiện liên tinh tú, và gần như chẳng bao giờ đặt chân ra khỏi lãnh thổ của mình."
 #Chương 4
 HELP_TUTORIAL_TRADITIONS_TITLE: "Tiếp Nhận Truyền Thống"
 HELP_TUTORIAL_TRADITIONS_DESC: "Việc tiếp nhận các §STruyền Thống§! đòi hỏi bạn phải tiêu hao £unity£§HĐoàn Kết§!, nó sẽ định hình hướng đi chuyên biệt cho đế chế của bạn, ví dụ như tập trung vào quân sự và bành trướng thần tốc, hay nghiêng về ngoại giao và kiến tạo liên minh.\n\nSau khi hoàn thành toàn bộ một §SCây Truyền Thống§!, £empire£§SĐế Chế§! của bạn có thể lựa chọn một §SĐặc Quyền Thăng Thiên§! để tiếp tục cường hóa sức mạnh của mình."
 HELP_TUTORIAL_TRADITIONS_INSTRUCTIONS: "§Y1.§! Mở Quản Lý Xã Hội ở bảng điều hướng bên trái.\n§Y2.§! Chọn một Truyền Thống để tiếp nhận."
 HELP_TUTORIAL_TRADITIONS_ACTION: "Mở Giao Diện Truyền Thống"
 HELP_TUTORIAL_POLICIES_TITLE: "Thiết Lập Chính Sách"
 HELP_TUTORIAL_POLICIES_DESC: "§SChính Sách§! quy định thái độ của £empire£§SĐế Chế§! khi giải quyết các vấn đề đa dạng: Mức độ hiếu chiến của quốc gia chúng ta, cách chúng ta đối xử với £pop£công dân của mình, những gì chúng ta có thể chấp nhận, và những gì thì không.\n\nKhác với §SSắc Lệnh§!, §SChính Sách§! có thể được thực thi mà không cần phải tiêu tốn bất kỳ cái giá nào, nhưng nó lại có tác động đến cách mà các đế chế khác nhìn nhận về chúng ta."
 HELP_TUTORIAL_POLICIES_INSTRUCTIONS: "§Y1.§! Mở Giao Diện Chính Sách ở bảng điều hướng bên trái.\n§Y2.§! Nhấp vào Thái Độ Ngoại Giao.\n§Y3.§! Lựa chọn một Thái Độ Ngoại Giao phù hợp."
 HELP_TUTORIAL_POLICIES_ACTION: "Mở Giao Diện Chính Sách"
 HELP_TUTORIAL_LEADERS_TITLE: "Chiêu Mộ Lãnh Đạo"
 HELP_TUTORIAL_LEADERS_DESC: "§SLãnh Đạo§! chính là những vị §SGiám Đốc Khoa Học§!, §SChỉ Huy§! và §SQuản Trị Viên§! của bạn.\n\nTốt nhất là bạn nên phân công lãnh đạo để họ thống lĩnh các §SHạm Đội Quân Sự§!, cai quản những £planet£§SHành Tinh§! mới được thuộc địa hóa và dẫn dắt các £science_ship£§STàu Khoa Học§! thực hiện những nhiệm vụ khám phá."
 HELP_TUTORIAL_LEADERS_INSTRUCTIONS: "§Y1.§! Mở mục Lãnh Đạo ở bảng điều hướng bên trái.\n§Y2.§! Chiêu mộ một Giám đốc Khoa học để sau này giao phó cho người đó chỉ huy một chiếc Tàu Khoa Học mới."
 HELP_TUTORIAL_LEADERS_ACTION: "Mở Giao Diện Lãnh Đạo"
 HELP_TUTORIAL_EDICTS_TITLE: "Ban Hành Sắc Lệnh"
 HELP_TUTORIAL_EDICTS_DESC: "Sắc Lệnh là những chỉ số cường hóa toàn đế chế mà một đế chế có thể tùy ý lựa chọn thực thi với một mức phí nhất định. Các Sắc Lệnh mới bắt buộc phải được mở khóa thông qua việc nghiên cứu công nghệ hoặc từ các sự kiện. Các Sắc Lệnh có hiệu lực liên tục có thể được kích hoạt hoặc vô hiệu hóa bất cứ lúc nào bằng cách tiêu hao Sức Ảnh Hưởng."
 HELP_TUTORIAL_SPECIES_MANAGEMENT_TITLE: "Duy Trì Độ Hạnh Phúc Của Dân Số"
 HELP_TUTORIAL_SPECIES_MANAGEMENT_DESC: "Những £pop£§SDân Số§! vui vẻ cũng chính là những £pop£§SDân Số§! làm việc năng suất.\nNhưng việc duy trì §SĐộ Hạnh Phúc§! không phải là chuyện dễ dàng, nếu cứ để tình trạng hạnh phúc thấp kéo dài, nó thậm chí có thể thổi bùng lên sự §SBất Mãn§!.\n\nMay mắn thay, chúng ta có rất nhiều phương pháp để nâng cao mức độ hạnh phúc trên các £planet£§SHành Tinh§!. Các §SChính Sách§! và §SSắc Lệnh§! của hành tinh, §SLý Tưởng Quốc Gia§!, §SQuyền Lợi Giống Loài§!, §SCông Trình§! cũng như các §SĐặc Tính Của Người Cai Trị§! đều có thể tác động tích cực đến §SĐộ Hạnh Phúc§!."
 HELP_TUTORIAL_SPECIES_MANAGEMENT_INSTRUCTIONS: "§Y1.§! Chọn một hành tinh (trong menu Tổng Quan ở cạnh phải màn hình)\n§Y2.§! Nhấp vào một ô công trình còn trống.\n§Y3.§! Xây dựng Rạp Hát Hình Ảnh Toàn Ký."
 HELP_TUTORIAL_SPECIES_MANAGEMENT_ACTION: "Mở Giao Diện Giống Loài"
 HELP_TUTORIAL_FACTIONS_TITLE: "Quản Lý Phe Phái"
 HELP_TUTORIAL_FACTIONS_DESC: " §HPhe Phái§! đại diện cho những tổ chức chính trị được chống lưng bởi những §HDân Số§! có cùng chung ý thức hệ. Việc đáp ứng các yêu sách do các Phe Phái đưa ra có thể nâng cao mức độ ủng hộ của họ, đồng thời gia tăng độ hạnh phúc cho tất cả những Dân Số tham gia vào Phe Phái đó. Những Phe Phái có độ hạnh phúc cao sẽ mang lại £unity£§HĐoàn Kết§! cho bạn."
 #Chương 5
 HELP_TUTORIAL_CASUS_BELLI_TITLE: "Tuyên Chiến"
 HELP_TUTORIAL_CASUS_BELLI_DESC: "Để khơi mào một cuộc §SChiến Tranh§!, £empire£§SĐế Chế§! cần phải có một lý do chính đáng, hay nói cách khác là một nguyên cớ cụ thể để §STuyên Chiến§! với quốc gia khác. Lý do chiến tranh rất đa dạng, có thể là để sỉ nhục §SKẻ Thù§!, hay thậm chí là để tiêu diệt tận gốc một chủng loài khác.\n\nMột cuộc §SChiến Tranh§! có thể kết thúc theo hai ngả: Một trong hai bên chấp nhận §SĐầu Hàng§!, hoặc thông qua thương lượng để đạt được một nền hòa bình duy trì §SHiện Trạng§!."
 HELP_TUTORIAL_CASUS_BELLI_INSTRUCTIONS: "Hãy lựa chọn kẻ thù của ngài một cách khôn ngoan.\n§Y1.§! Nhấp vào mục Liên Hệ ở bảng điều hướng bên trái.\n§Y2.§! Chọn một đế chế mà bạn muốn tấn công.\n§Y3.§! Nhấp vào Ngoại Giao.\n§Y4.§! Nhấp vào Tuyên Chiến."
 HELP_TUTORIAL_CASUS_BELLI_ACTION: "Mở Giao Diện Ngoại Giao"
 HELP_TUTORIAL_CLAIMS_TITLE: "Thiết Lập Yêu Sách"
 HELP_TUTORIAL_CLAIMS_DESC: "§SYêu Sách§! sẽ ngốn của bạn £influence£§SSức Ảnh Hưởng§!, nó là biểu tượng cho những tham vọng về mặt lãnh thổ.\n\nTrong thời chiến, việc lớn tiếng tuyên bố §SYêu Sách§! sẽ quyết định kẻ chiến thắng được quyền sở hữu những §SHệ Sao§! nào. Một quốc gia có thể đưa ra yêu sách nhiều lần đối với cùng một §SHệ Sao§!, nhằm củng cố mức độ §SYêu Sách§! của mình, qua đó lấn lướt những yêu sách của các §SĐồng Minh§! cùng tham gia vào cuộc §SChiến Tranh§! đó."
 HELP_TUTORIAL_CLAIMS_INSTRUCTIONS: "§Y1.§! Mở phần Yêu Sách ở bảng điều hướng bên trái.\n§Y2.§! Chọn một hệ sao để đưa ra yêu sách.\n§Y3.§! Nhấp vào Thiết Lập Yêu Sách."
 HELP_TUTORIAL_CLAIMS_ACTION: "Chuyển Sang Chế Độ Bản Đồ Yêu Sách"
 HELP_TUTORIAL_FLEET_COMBAT_TITLE: "Tác Chiến Với Hạm Đội Địch"
 HELP_TUTORIAL_FLEET_COMBAT_DESC: "Muốn bảo vệ £empire£§SĐế Chế§! của mình được an toàn, một §SHạm Đội Quân Sự§! hùng mạnh là điều tối quan trọng. Thông qua §SNghiên Cứu§!, bạn sẽ nắm trong tay những §SCông Nghệ§! quân sự tối tân để nâng cấp chiến hạm, đồng thời gia tăng năng lực của mình để có thể chống đỡ cho một §SHạm Đội§! với quy mô đồ sộ hơn.\n\nĐể giành lấy phần thắng trong các trận chiến liên tinh tú, mấu chốt nằm ở việc thấu hiểu §SĐội Hình Của Kẻ Địch§! và triển khai những §SChiến Thuật Khắc Chế§! phù hợp. Bất kỳ một linh kiện tấn công hay phòng thủ nào cũng đều có cách để hóa giải nó."
 HELP_TUTORIAL_FLEET_COMBAT_INSTRUCTIONS: "§Y1.§! Nhấp vào Quản Lý Hạm Đội ở bảng điều hướng bên trái.\n§Y2.§! Nhấp vào nút “＋” để gia tăng số lượng chiến hạm trong hạm đội của bạn.\n§Y3.§! Đảm bảo rằng mỗi hạm đội của bạn đều được chỉ định một vị Tư lệnh Hạm đội tương ứng."
 #Nếu người chơi có một hạm đội, hãy chọn và di chuyển camera đến hạm đội đó khi nhấp vào (nếu có nhiều hơn 1, hãy chọn hạm đội đầu tiên). Ngược lại, hãy vô hiệu hóa nút bấm và hiển thị tooltip "Bạn không có hạm đội nào."
 HELP_TUTORIAL_FLEET_COMBAT_ACTION: "Đến Một Hạm Đội"
 HELP_TUTORIAL_WAR_EXHAUSTION_TITLE: "Bảo Vệ Hệ Sao Của Bạn"
 HELP_TUTORIAL_WAR_EXHAUSTION_DESC: "§SCăn Cứ Sao§! chính là hạt nhân trong hệ thống phòng thủ của một hệ sao. Những tiền đồn nằm ở các vị trí trọng yếu có thể được nâng cấp thành §SCảng Sao§!, giúp gia tăng số lượng khe cắm để lắp đặt các §SModule Phòng Thủ§!, từ đó nâng tầm khả năng phòng thủ của toàn bộ hệ sao.\n\nKhả năng tự vệ của §SCăn Cứ Sao§! có thể được nâng cao thông qua việc xây dựng các §SNền Tảng Phòng Thủ§!. §SNền Tảng Phòng Thủ§! là một dạng trạm không gian quân sự cỡ nhỏ được bố trí xung quanh §SCăn Cứ Sao§!, nó đóng vai trò như một bệ phóng vũ khí lợi hại."
 HELP_TUTORIAL_WAR_EXHAUSTION_INSTRUCTIONS: "§Y1.§! Nhấp vào bất kỳ Căn Cứ Sao nào.\n§Y2.§! Chọn thẻ Phòng Thủ.\n§Y3.§! Xây dựng một Nền Tảng Phòng Thủ."
 HELP_TUTORIAL_WAR_EXHAUSTION_ACTION: ""
 HELP_TUTORIAL_SHIP_DESIGN_TITLE: "Thiết Kế Chiến Hạm"
 HELP_TUTORIAL_SHIP_DESIGN_DESC: "Theo mặc định, các thiết kế chiến hạm sẽ được tự động tạo ra và nâng cấp, nhưng nếu muốn nắm lấy lợi thế khi đối đầu với những kẻ thù hùng mạnh, bạn có lẽ sẽ muốn tự tay thiết kế những mẫu tàu nhằm khắc chế đội hình của chúng. Khiên phòng thủ có khả năng chống đỡ vũ khí laser rất hiệu quả, nhưng lại gần như vô dụng trước sự tấn công của tên lửa, trong khi đó, những lớp giáp thân tàu vững chãi lại mang đến sự bảo vệ tuyệt vời trước hỏa lực đạn đạo, nhưng lại khá yếu ớt trước sức công phá của các loại vũ khí năng lượng."
 HELP_TUTORIAL_CRISIS_TITLE: "Thiên Tai Hủy Diệt"
 HELP_TUTORIAL_CRISIS_DESC: "§SThiên Tai§! mang đến mối đe dọa to lớn cho toàn bộ §SThiên Hà§! cùng mọi dạng sống đang tồn tại bên trong nó.\n\nThường thì bạn sẽ không phải đơn thương độc mã đối đầu với §SThiên Tai§!. Mỗi khi thiên tai càn quét qua một £planet£§SHành Tinh§!, nó sẽ tạo ra một §SMối Đe Dọa§! mang tính ngoại giao đối với tất cả các £empire£§SĐế Chế§!, hối thúc họ gạt bỏ hiềm khích và bắt tay với nhau để cùng chống lại §SThiên Tai§!.\n\nThiên Tai Hủy Diệt sẽ xuất hiện trong §SNhật Ký Tình Hình§! (£f2£), cho phép bạn liên tục cập nhật tình hình thương vong của cả hai phe, đồng thời cho biết con đường đi đến chiến thắng trước §SThiên Tai§! còn bao xa nữa."
 HELP_TUTORIAL_CRISIS_INSTRUCTIONS: "Hiện tại thì chưa có hành động cụ thể nào cần thực hiện, nhưng hãy luôn trong tư thế sẵn sàng. Ai mà biết được khi nào thiên tai sẽ ập đến chứ?"
 HELP_TUTORIAL_CRISIS_ACTION: ""
