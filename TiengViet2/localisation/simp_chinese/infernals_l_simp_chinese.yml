 infernal_01_shipset_desc: "Những phi thuyền này tỏa ra ánh sáng rực rỡ và nóng bỏng, xua tan đi màn đêm lạnh lẽo của vũ trụ. Lớp giáp vô cùng kiên cố của chúng gần như không thể cản nổi sức nóng mãnh liệt tỏa ra từ những ngọn lửa trên hành tinh mà những kẻ đã tạo ra nó gọi là nhà."
 decision_living_metal_distribution: "Phân phối $sr_living_metal$"
 decision_living_metal_distribution_desc: "$r_living_metal$ được hòa trộn vào mọi ngóc ngách của cơ sở hạ tầng, giúp các tiện ích hàng ngày luôn được vận hành một cách trơn tru và hiệu quả: các công trình tự động sửa chữa, mạng lưới giao thông tự điều chỉnh theo thời gian thực, và ranh giới giữa máy móc cùng các sinh vật hữu cơ đang dần trở nên lu mờ."
