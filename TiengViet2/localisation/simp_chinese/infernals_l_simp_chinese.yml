 trait_infernal: "Kẻ Ưa nhiệt"
 trait_infernal_plural: "Những kẻ Ưa nhiệt"
 trait_infernal_desc: "Giống loài này tiến hóa các mô cấu tạo từ hợp kim kim loại, có thể sinh sôi nảy nở trên các hành tinh có nhiệt độ cao đủ để luộc chín sinh vật hữu cơ thông thường. Những tế bào hợp kim này thoái hóa chậm, tần suất thay thế thấp, giúp trì hoãn sự xuất hiện của các căn bệnh tuổi già. Nhưng loại tế bào này cũng dẫn nhiệt kém trong môi trường lạnh, khiến giống loài này dễ bị tổn thương ở vùng khí hậu giá rét."
 TRAIT_INFERNAL_EFFECT: "$r_alloys$ phí bảo trì $pop_group_unit$£pop£ bình quân: §R+$@living_standard_alloys_normal$§!$TABBED_NEW_LINE$—$pc_volcanic$$HABITABILITY$: §G+20%§!$TABBED_NEW_LINE$—$HABITABILITY$ tối thiểu (§H$pc_volcanic$§!): §Y+50%§!$TABBED_NEW_LINE$—$HABITABILITY$ trên hành tinh §Ylạnh giá§!: §R-30%§!$TABBED_NEW_LINE$—Tuổi thọ Lãnh đạo: §G+10 năm§!"
 trait_unbreakable_resolve: "Quyết tâm Bất diệt"
 trait_unbreakable_resolve_desc: "Họ kết nối với nhau qua một mạng lưới thần kinh gương phức tạp, sở hữu ý chí đồng bộ bẩm sinh. Trách nhiệm không phải là gánh nặng đối với họ, mà là một sứ mệnh chung; đối mặt với khó khăn, họ luôn đồng lòng tiến bước."
 trait_unbreakable_resolve_tooltip: "Mỗi $pop_group_unit$£pop£§Hdân số§! có đặc điểm này trên hành tinh sẽ tăng §G+0.2§!£stability£$PLANET_STABILITY_TITLE$ (Tối đa: §G+15§!)\n—§RKhông bao gồm nô lệ hoặc tầng lớp dân số thấp.§!"
 trait_shell_slag: "Lớp vỏ Xỉ khoáng"
 trait_shell_slag_desc: "Sự cộng sinh phức tạp với $r_living_metal$ khiến sự phát triển của giống loài này khác với cách thông thường, thay vào đó chúng lớn lên thông qua việc tích lũy và tự lắp ráp các cấu trúc sinh học sắt."
 trait_shell_slag_tooltip: "Mỗi $pop_group_unit$£pop£§Hdân số§! có đặc điểm này làm việc với thân phận nô lệ hoặc cao hơn sẽ sản xuất §G$@shell_slag_trait_resource_production|3$§!§Y$r_living_metal$§! mỗi tháng."
 trait_robot_assembly_slag: "Xỉ khoáng Lắp ráp"
 trait_robot_assembly_slag_desc: "Sự tích hợp phức tạp của $r_living_metal$ giúp chủng tộc người máy này không dựa vào các công trình truyền thống, mà mở rộng thông qua việc tích lũy và tự lắp ráp các khung sắt tự động."
 trait_pyroclastic: "Dẫn dắt Mạt vụn Núi lửa"
 trait_pyroclastic_desc: "Giống loài này sinh ra từ luyện ngục rực lửa của hành tinh núi lửa, từ lâu đã quen sống chung với thảm họa. Họ không sợ hãi những dòng mạt vụn núi lửa càn quét mặt đất, mà ngược lại còn học được cách thuần hóa và dẫn dắt cơn thịnh nộ của chúng, rèn giũa sức mạnh hủy diệt thành nguồn sống và năng lượng."
 trait_pyroclastic_tooltip: "$MOD_LOGISTIC_GROWTH_MULT$ trên $pc_volcanic_plural$: §G+10%§!"
 trait_crucible_community: "Cộng đồng Lò luyện"
 trait_crucible_community_desc: "Được tôi luyện qua nghịch cảnh và gắn kết bằng sự phấn đấu chung, giống loài này trở thành một khối thống nhất không thể phá vỡ. Ý chí tập thể thúc đẩy việc cai trị, mỗi thành viên đều là một mắt xích quan trọng trong chuỗi liên kết."
 trait_crucible_community_tooltip: "Mỗi $pop_group_unit$£pop£§Hdân số§! có đặc điểm này sẽ tăng §G+0.25§!§Y$MOD_COUNTRY_EDICT_FUND_ADD$§!"
 trait_ductile: "Tính Dẻo dai"
 trait_ductile_desc: "§LGiống loài này đã được chỉnh sửa để có thể phát triển các hợp chất hợp kim có thể tái sử dụng.§!\n"
