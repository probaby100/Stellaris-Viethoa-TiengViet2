 job_pyromancer: "Thuật sĩ Lửa"
 pyromancer: "$job_pyromancer$"
 job_pyromancer_plural: "Thuật sĩ Lửa"
 job_pyromancer_desc: "Trải qua nhiều năm rèn luyện, họ có thể nhìn thấu tương lai qua những dao động của ngọn lửa, những người thuần thục kỹ năng này có thể nhận được sự tài trợ từ tầng lớp tinh anh thống trị."
 mod_job_pyromancer_add: "Công việc $job_pyromancer$"
