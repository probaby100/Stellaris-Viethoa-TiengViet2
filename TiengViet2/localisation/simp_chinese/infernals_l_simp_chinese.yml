 job_pyrocrat: "Quý tộc Lửa"
 pyrocrat: "$job_pyrocrat$"
 job_pyrocrat_plural: "Quý tộc Lửa"
 job_pyrocrat_desc: "Là tầng lớp tinh anh duy trì nền tảng thể chế, các quý tộc lửa cai trị quốc gia rực rỡ như một ngọn lửa không bao giờ tắt, dựa vào sự cống hiến của lực lượng lao động để duy trì vinh quang."
