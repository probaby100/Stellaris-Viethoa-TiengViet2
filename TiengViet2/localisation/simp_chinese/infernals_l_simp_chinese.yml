 infernals.35.name: "Vùi trong Biển lửa"
 infernals.35.desc: "Bề mặt của §H[from.GetName]§! nứt nẻ, lớp vỏ vỡ vụn, và những luồng sức nóng chết người trào lên từ tận sâu trong lòng đất. Sự biến đổi diễn ra nhanh chóng và triệt để: núi non sụp đổ, đại dương sôi sục, bầu trời mịt mù tàn tro.\n\nHệ sinh thái từng phồn vinh nay đã bị xóa sổ hoàn toàn, giờ đây chỉ còn những dạng sống cực đoan mới có thể bám trụ lại nơi này."
