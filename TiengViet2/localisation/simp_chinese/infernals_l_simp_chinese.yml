 d_stasis_pods_desc: "Những khoang ngủ đông này là thiết bị cổ xưa của các tộc người bị thất lạc, sử dụng công nghệ đông lạnh tiên tiến để đóng băng các dấu hiệu sống của cá thể. Bằng những công nghệ cụ thể có thể đánh thức họ."
 d_stasis_pods_tt: "[GetStasisPodOwner]"
 d_stasis_pods_tt_inf: "—Tạo §G100§!£pop£$POPS$\n—$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+1§!"
 d_stasis_pods_tt_other: "—Nhận £society_research£§Y$society_research$§!: §G+350§!\n—$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+1§!"
 d_cd_ancient_tunnels: "Đường hầm Viễn cổ"
 d_cd_ancient_tunnels_desc: "Từng được dùng để chứa các dãy phòng ngủ đông, những đường hầm rộng lớn và trống trải này nay cung cấp không gian sống mới."
 d_galvanic_living_metal: "Mỏ $sr_living_metal$"
 d_galvanic_living_metal_desc: "Hành tinh này chứa các mỏ $r_living_metal$ tự nhiên. Giống loài của nó đã tiến hóa dưới sự tiếp xúc lâu dài với tài nguyên này, bước vào một con đường sinh học và khoa học độc đáo."
 # Thể chế - Sứ giả Thế giới Thiêu rụi
 civic_scorched_earth: "Tiên phong Hành tinh Rực lửa"
 civic_scorched_earth_desc: "Nhiệt lượng thấm nhuần vào mọi khía cạnh của nền văn hóa xã hội này, từ các nghi thức truyền thống cho đến công nghệ. Họ coi bản thân là bá chủ ngọn lửa đích thực trong thiên hà, hướng tới một vũ trụ lý tưởng chỉ dành cho các sinh vật ưa nhiệt, còn những kẻ yếu kém chỉ làm cái gai cản bước khát vọng này."
 civic_scorched_earth_effects: "— Không thể tiến hành §Yngoại giao§! với các loài ngoài §Y$trait_infernal_plural$§!.\n— Không thể tham gia §YThị trường Thiên hà§!.\n— Có cớ tham chiến §Y\"$casus_belli_cb_blaze$\"§! chống lại các loài khác.\n— Nhận được £unity£§Y$unity$§! khi ném bom với tư thế §Y$bombardment_firestorm$§!\n— Tạo ra các chướng ngại vật đặc biệt trên hành tinh bị ném bom khi ném bom với tư thế §Y$bombardment_seismic_bombing$§!.\n— Các loài không mang đặc điểm ['trait:trait_infernal'] bị giới hạn ở mức sống §YNô lệ§! hoặc tệ hơn."
 SCORCHED_HERALDS_ONLY_INF: "$TRIGGER_FAIL$Xã hội §Y$civic_scorched_earth$§! chỉ dung túng cho £pop£$POPS$ mang đặc điểm ['trait:trait_infernal']."
 civic_hive_scorched_earth: "Bản năng Phóng hỏa"
 civic_hive_scorched_earth_desc: "Hành tinh rực lửa của chúng ta là đỉnh cao của sự tiến hóa hành tinh. Chúng ta sẽ châm ngòi đốt cháy cả thiên hà, và sinh sôi nảy nở vĩnh hằng từ trong biển lửa!"
 # Thể chế - Người Rèn Hành tinh
 civic_world_forgers: "Người Rèn Hành tinh"
 civic_world_forgers_desc: "Xã hội này phát triển mạnh mẽ trong môi trường núi lửa, thậm chí họ còn nhân tạo ra môi trường này nếu tự nhiên không có sẵn."
 civic_world_forgers_effects: "— Mở khóa hành tinh khởi đầu: ['concept_pc_volcanic'].\n— $GUARANTEED_RESEARCH_OPTION_STRING$£society_research£['concept_volcanic_forge'].\n— Có thể xây dựng công trình £building£§Y$building_volcanic_forge_1$§!, tăng thêm £job_polytechnic_mentor£['concept_polytechnic_mentor'].\n— Hành tinh có £building£§Y$building_volcanic_forge_1$§! sẽ dần biến thành §Y$pc_volcanic$§!.\n— ['concept_guaranteed_colonies'] sẽ trở thành hành tinh §Y$climate_dry$§!."
 civic_corporate_world_forgers: "Kiến trúc sư Hành tinh"
 civic_corporate_world_forgers_desc: "$civic_world_forgers_desc$"
 civic_hive_world_forgers: "Tổ Núi lửa"
 civic_hive_world_forgers_desc: "$civic_world_forgers_desc$"
 civic_world_forgers_gestalt_effects: "— Mở khóa hành tinh khởi đầu: ['concept_pc_volcanic'].\n— $GUARANTEED_RESEARCH_OPTION_STRING$£society_research£['concept_volcanic_forge'].\n— Có thể xây dựng công trình £building£§Y$building_volcanic_forge_1$§!, tăng thêm £job_polytechnic_drone£['concept_polytechnic_drone'].\n— Hành tinh có £building£§Y$building_volcanic_forge_1$§! sẽ dần biến thành §Y$pc_volcanic$§!.\n— ['concept_guaranteed_colonies'] sẽ trở thành hành tinh §Y$climate_dry$§!."
 civic_machine_world_forgers: "Bộ Tối ưu hóa Nhiệt năng"
 civic_machine_world_forgers_desc: "$civic_world_forgers_desc$"
 tech_volcanic_forge: "Lò luyện Núi lửa"
 tech_volcanic_forge_desc: "Sau khi triển khai, cơ sở này sẽ từ từ biến hành tinh thành một thiên đường núi lửa, đồng thời khai quật các tài nguyên hữu ích. Những thợ rèn nhiệt năng có thể đẩy nhanh quá trình biến đổi này."
 concept_volcanic_forge: "$tech_volcanic_forge$"
 concept_volcanic_forge_desc: "$building_volcanic_forge_basic$\n\n— Tiến độ hàng tháng: §G+0.1§!\n— Cứ §Y100§!£job_miner£$job_miner_plural$ tăng tiến độ hàng tháng: §G+0.05§!\n— Cứ §Y100§!£job_foundry£$job_foundry_plural$ tăng tiến độ hàng tháng: §G+0.05§!"
 building_volcanic_forge_1: "$tech_volcanic_forge$"
 building_volcanic_forge_1_desc: "Khu phức hợp công nghiệp này khoan sâu vào lớp vỏ hành tinh, kích phát hoạt động núi lửa trên toàn cầu, qua đó cải tạo môi trường của mọi quần xã sinh vật thành một cảnh quan rực lửa."
 building_volcanic_forge_2: "Xưởng đúc Núi lửa"
 building_volcanic_forge_2_desc: "$building_volcanic_forge_1_desc$"
 building_volcanic_forge_1_effect: "\n$building_volcanic_forge_basic$\n$volcanic_forge_1_monthly$\n\nTiến độ từ tất cả £job_miner£$concept_planet_miners$: §G+[root.GetMinerVar1]§!\nTiến độ từ tất cả £job_foundry£$concept_planet_metallurgists$: §G+[root.GetForgerVar1]§!"
 building_volcanic_forge_2_effect: "\n$building_volcanic_forge_basic$\n$volcanic_forge_2_monthly$\n\nTiến độ từ tất cả £job_miner£$concept_planet_miners$: §G+[root.GetMinerVar2]§!\nTiến độ từ tất cả £job_foundry£$concept_planet_metallurgists$: §G+[root.GetForgerVar2]§!"
 building_volcanic_forge_basic: "Biến đổi hành tinh thành §H$pc_volcanic$§!."
 volcanic_forge_1_monthly: "— Thêm §G+200§! việc làm £job_polytechnic_mentor£['concept_polytechnic_mentor'].\n— Tiến độ hàng tháng: §G+0.1§!\n— Cứ §Y100§!£job_miner£$concept_planet_miners$ tăng tiến độ hàng tháng: §G+0.05§!\n— Cứ §Y100§!£job_foundry£$concept_planet_metallurgists$ tăng tiến độ hàng tháng: §G+0.05§!"
 volcanic_forge_2_monthly: "— Thêm §G+400§! việc làm £job_polytechnic_mentor£['concept_polytechnic_mentor'].\n— Tiến độ hàng tháng: §G+0.2§!\n— Cứ §Y100§!£job_miner£$concept_planet_miners$ tăng tiến độ hàng tháng: §G+0.1§!\n— Cứ §Y100§!£job_foundry£$concept_planet_metallurgists$ tăng tiến độ hàng tháng: §G+0.1§!"
 # Thể chế - Hội thờ Lửa
 civic_pyrolatry: "Giáo phái Lửa"
 civic_pyrolatry_desc: "Trải qua bao thế hệ được tôi luyện trong gian khổ, xã hội này tin rằng chỉ có đoàn kết mới sống sót, và sống sót thì mới đoàn kết. Chỉ có sự phấn đấu gian khổ được rèn giũa bằng ngọn lửa mới có thể hun đúc nên sự kiên cường đủ để chịu đựng một thiên hà lạnh lẽo."
 civic_pyrolatry_effects: "—Sản lượng công việc £unity£§Y$unity$§! tăng tỷ lệ nghịch với $HABITABILITY$ thấp (tối đa §G500%§!).\n—Phe phái ['concept_fire_cult'] sẽ hình thành ngay sau khi bắt đầu trò chơi.\n—Thay thế £job_priest£§Y$job_priest_plural$§! bằng £job_fire_dancer£['concept_inf_fire_dancers'].\n—Trên các hành tinh có $HABITABILITY$ dưới §R50%§!, thay thế £job_politician£§Y$job_politician_plural$§! bằng £job_fire_oracle£['concept_inf_fire_oracles'].\n—Cho phép chiêu mộ quân đội §Y$ember_legion$§! trên các hành tinh có $HABITABILITY$ dưới §R20%§!.\n—Cấp quyền truy cập quyết định hành tinh §Y$decision_blazing_scourge$§!, tạo ra £blocker£['concept_dec_blazing_scourge'].\n—Hợp tác với các chính sách: $civic_superstitious_beliefs$, $civic_exalted_priesthood$, $civic_death_cult$, $civic_aristocratic_elite$ và $civic_merchant_guilds$."
 # Công việc
 concept_inf_fire_dancer: "$job_fire_dancer$"
