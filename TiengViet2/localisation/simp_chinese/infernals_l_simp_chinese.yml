 job_radiant_priest_plural: "Tế tư Rạng rỡ"
 job_radiant_priest_desc: "Để giữ cho ngọn lửa đức tin luôn rực cháy, tầng lớp tế tư kiểm soát xã hội phô diễn ánh sáng thánh hỏa, soi rọi con đường cho những tín đồ và thanh tẩy mọi cái ác trong xã hội."
