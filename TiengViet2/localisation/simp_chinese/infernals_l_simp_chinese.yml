 pc_volcanic_desc: "Thạch quyển vẫn đang trong trạng thái bán nóng chảy, bao phủ bởi bầu khí quyển nồng nặc mùi lưu huỳnh. Bề mặt đầy tro núi lửa và đá bazan, núi lửa hoạt động phun trào liên tục, các hồ và sông dung nham chảy đan chéo nhau. Nếu có sự sống tồn tại, đó chỉ có thể là những sinh vật sống sót trong môi trường khắc nghiệt nhất."
