 job_ashbroker_desc: "Nơi ngọn lửa thiêu rụi, kẻ môi giới tro tàn vươn lên. Những kẻ cơ hội trên đống đổ nát này rất giỏi biến sự hủy diệt thành cơ hội, biến tro tàn thành tài sản."
