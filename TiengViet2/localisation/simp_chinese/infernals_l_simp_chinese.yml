 LM_ARMOR_1_DESC: "Được rèn đúc từ các xưởng đóng tàu, lớp giáp $r_living_metal$ này sẽ phục hồi lại hình dáng ban đầu sau khi chịu thiệt hại nặng nề."
 LM_ARMOR_2: "$ARMOR_2$—$INF_Regen$"
 LM_ARMOR_2_DESC: "Việc gia cố thêm $r_living_metal$ giúp tăng cường hiệu quả phòng thủ cơ bản cũng như diện tích bề mặt có thể tái sinh của nó."
 LM_ARMOR_3: "$ARMOR_3$—$INF_Regen$"
 LM_ARMOR_3_DESC: "Vật liệu composite tăng cường độ bền kéo cho $r_living_metal$, giúp lớp giáp càng thêm dẻo dai."
