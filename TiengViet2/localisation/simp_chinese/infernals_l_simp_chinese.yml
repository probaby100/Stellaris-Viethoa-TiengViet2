 concept_inf_fire_dancer_desc: "$job_fire_dancer_effect_desc$\n\n§L$job_fire_dancer_desc$§!"
 job_fire_dancer: "Vũ công Lửa"
 fire_dancer: "$job_fire_dancer$"
 job_fire_dancer_plural: "Vũ công Lửa"
 job_fire_dancer_desc: "Vũ công Lửa là những bậc thầy về ngọn lửa và sức chịu đựng, biểu diễn các nghi lễ rực cháy để khơi dậy sự kính sợ và đam mê chung cho cả cộng đồng."
 mod_job_fire_dancer_add: "Công việc $job_fire_dancer$"
 job_fire_dancer_effect_desc: "£job_fire_dancer£$job_fire_dancer_plural$ chuyển hóa £consumer_goods£§Y$consumer_goods$§! thành £unity£§Y$unity$§!, £mod_planet_amenities_add£§Y$PLANET_AMENITIES_TITLE$§! và £mod_planet_stability_add£§Y$PLANET_STABILITY_TITLE$§!"
 concept_inf_cremator: "$job_cremator$"
 concept_inf_cremators: "$job_cremator_plural$"
 concept_inf_cremator_desc: "$job_cremator_effect_desc$\n\n§L$job_cremator_desc$§!"
 job_cremator: "Người Hỏa táng"
 cremator: "$job_cremator$"
 job_cremator_plural: "Người Hỏa táng"
 job_cremator_desc: "Người Hỏa táng chủ trì nghi lễ thánh hỏa, dẫn dắt người đã khuất đi qua ngọn lửa để tiến vào bí ẩn tối thượng. Họ được tôn kính như những người gác cổng của lối đi cao quý này, phục vụ ở ranh giới giữa cái chết và sự siêu thoát."
 mod_job_cremator_add: "Công việc $job_cremator$"
 job_cremator_effect_desc: "£job_fire_dancer£$job_cremator_plural$ chuyển hóa £consumer_goods£§Y$consumer_goods$§! thành £unity£§Y$unity$§!, £mod_planet_amenities_add£§Y$PLANET_AMENITIES_TITLE$§! và £mod_planet_stability_add£§Y$PLANET_STABILITY_TITLE$§!"
 # Superstition Beliefs + Fire Cult = fire_seer
 concept_inf_fire_seer: "$job_fire_seer$"
 concept_inf_fire_seers: "$job_fire_seer_plural$"
 concept_inf_fire_seer_desc: "$job_fire_seer_effect_desc$\n\n§L$job_fire_seer_desc$§!"
 job_fire_seer: "Tiên tri Lửa"
 fire_seer: "$job_fire_seer$"
 job_fire_seer_plural: "Tiên tri Lửa"
 job_fire_seer_desc: "Sự hỗn loạn sau khi ngọn lửa tàn phá chỉ còn lại tro than, nhưng một tiên tri lão luyện có thể nhận ra các điềm báo từ đó. Những lời giải mã bí ẩn ấy được tôn sùng làm cốt lõi của các nghi lễ, đồng thời trở thành chỗ dựa cho quyền cai trị."
 mod_job_fire_seer_add: "Công việc $job_fire_seer$"
