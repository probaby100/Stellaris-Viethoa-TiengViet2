 job_blazewright: "Thợ Rèn Lửa"
 blazewright: "$job_blazewright$"
 job_blazewright_plural: "Thợ Rèn Lửa"
 job_blazewright_desc: "Kỹ năng giải mã các điềm báo bí ẩn từ tro tàn nghi lễ của nhà lãnh đạo, cùng với khả năng khơi dậy ngọn lửa vận mệnh ẩn sâu trong tâm khảm, có thể nâng tầm công tác chính trị."
