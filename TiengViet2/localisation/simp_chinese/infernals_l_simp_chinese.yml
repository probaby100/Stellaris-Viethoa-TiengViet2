 job_fire_oracle_plural: "Nhà Tiên tri Lửa"
 job_fire_oracle_desc: "Những nhà tiên tri dẫn dắt dân chúng bình an vượt qua thời khắc tăm tối nhất, đề cao đức tính nhẫn nại và sinh tồn khi đối mặt với cái chết."
