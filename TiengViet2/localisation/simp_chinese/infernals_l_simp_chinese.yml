 job_offworld_prospector_drone: "Cá thể con Săn tìm Cổ vật Tiền tuyến"
 job_offworld_prospector_drone_plural: "Cá thể con Săn tìm Cổ vật Tiền tuyến"
 job_offworld_prospector_drone_desc: "Các cá thể con điều khiển từ xa được triển khai đến các hành tinh nóng chảy lân cận, khảo sát và thu thập $r_volatile_motes$ và $r_living_metal$."
 mod_job_offworld_prospector_drone_add: "Công việc $job_offworld_prospector_drone$"
 # Hội đồng
 councilor_infernal_scorcher: "Kẻ Truyền lửa Hỏa ngục"
 councilor_infernal_scorcher_desc: "$councilor_infernal_scorcher$ khích lệ các lực lượng vũ trang, đảm bảo mọi thành phần đều cống hiến hết mình cho các chiến dịch quân sự."
 councilor_thermal_engineer: "Kỹ sư Nhiệt năng"
 councilor_thermal_engineer_desc: "$councilor_thermal_engineer$ có thể giải quyết các bài toán kỹ thuật hóc búa về xây dựng cơ sở hạ tầng trong môi trường cực nhiệt."
 councilor_corporate_thermal_engineer: "$councilor_thermal_engineer$ Trưởng"
 councilor_corporate_thermal_engineer_desc: "Sau khi được trả một khoản thù lao xứng đáng, $councilor_corporate_thermal_engineer$ có thể giải quyết các bài toán kỹ thuật xây dựng trong môi trường cực nhiệt."
 councilor_pyromanic_priest: "Tế tư Rực lửa"
 councilor_pyromanic_priest_desc: "$councilor_pyromanic_priest$ khơi dậy tình yêu với những môi trường khắc nghiệt, làm giảm đi thói tiêu dùng xa xỉ."
 councilor_imbuement_officer: "Người Giám sát Mô phỏng"
 councilor_imbuement_officer_desc: "$councilor_imbuement_officer$ sử dụng chuyên môn về chất rắn động lực học để hỗ trợ các nghiên cứu vật lý và kỹ thuật."
 councilor_synth_imbuement_officer: "Máy chủ Mô phỏng"
 councilor_synth_imbuement_officer_desc: "$councilor_synth_imbuement_officer$ sử dụng chuyên môn về chất rắn động lực học để hỗ trợ các nghiên cứu vật lý và kỹ thuật."
 councilor_corporate_imbuement_officer: "Viên chức Cơ quan Mô phỏng"
 councilor_corporate_imbuement_officer_desc: "$councilor_corporate_imbuement_officer$ điều phối lợi ích của các bên, thúc đẩy các nghiên cứu vật lý và kỹ thuật."
 # Bombardment Stances
 bombardment_firestorm: "Bão lửa"
 bombardment_firestorm_desc: "Các cuộc oanh tạc bằng bão lửa thiêu rụi các khu vực trên hành tinh, tựa như những đống lửa trại rực rỡ, không chỉ tôi luyện lòng kiên định của chúng ta, mà còn gắn kết toàn xã hội."
 bombardment_seismic_bombing: "Oanh tạc Thảm Địa chấn"
 bombardment_seismic_bombing_desc: "$bombardment_seismic_bombing$ nhằm vào địa chất của hành tinh, phá hủy cơ sở hạ tầng và xé toạc lớp vỏ hành tinh, gây ra những vụ phun trào núi lửa quy mô lớn."
 # Policies
 orbital_bombardment_devastation: "Hủy diệt"
 orbital_bombardment_devastation_name: "Hủy diệt"
 orbital_bombardment_devastation_desc: "Cho phép sử dụng toàn diện vũ khí quỹ đạo, với mục tiêu tàn phá bề mặt.\n\n§EKích hoạt thế oanh tạc quỹ đạo \"Hủy diệt\".§!"
 diplo_stance_devastators: "Kẻ Hủy diệt"
 diplo_stance_devastators_desc: "Đế chế này dốc sức để hủy diệt hoàn toàn các hành tinh ngoại lai."
 # Opinion Modifiers
 triggered_infernals_opinion_of_others: "Không phải Hỏa ngục"
 triggered_infernals_opinion_of_infernals: "Đồng bào Hỏa ngục"
 # Casus Belli & War Goal
 casus_belli_cb_blaze: "Thanh tẩy bằng Lửa"
 war_goal_wg_blaze: "Hủy diệt"
 war_goal_wg_blaze_desc: "Dùng ngọn lửa quét sạch cả hệ sao. Bất kỳ sự kháng cự nào cũng đều bị coi là mục tiêu tấn công."
 # Personalities
 personality_scorching_infernals: "Kẻ Hủy diệt Rực lửa"
 personality_scorching_infernals_desc: "$personality_scorching_infernals$ xem các hành tinh ngoại lai như một sân khấu tuyệt vời để tiến hành các nghi lễ ngọn lửa mang tính thảm họa, lũ người bản địa nơi đó chẳng qua cũng chỉ là một chút rắc rối nhỏ nhoi."
 # Melting District Deposits
 d_volcanic_ore_veins: "Mạch khoáng Núi lửa"
 d_volcanic_ore_veins_desc: "Mạch khoáng núi lửa vừa nguội lạnh cung cấp nguồn tài nguyên quặng dồi dào."
 d_volcanic_rich_mountain: "$d_rich_mountain$ Núi lửa"
 d_volcanic_rich_mountain_desc: "$d_rich_mountain_desc$"
 d_volcanic_mineral_fields: "$d_mineral_fields$ Núi lửa"
 d_volcanic_mineral_fields_desc: "$d_mineral_fields_desc$"
 d_volcanic_ore_caverns: "$d_ore_rich_caverns$ Núi lửa"
 d_volcanic_ore_caverns_desc: "$d_ore_rich_caverns_desc$"
 d_volcanic_mineral_layers: "Tầng Khoáng Núi lửa"
 d_volcanic_mineral_layers_desc: "Hoạt động địa chất cổ đại đã vùi sâu lớp khoáng chất phong phú này dưới bề mặt."
 d_volcanic_weak_crust: "Lớp vỏ Yếu ớt"
 d_volcanic_weak_crust_desc: "Các mảng kiến tạo bên dưới đã bị nghiền nát bởi những đợt phun trào núi lửa trong quá khứ, khiến việc khoan thăm dò các mạch quặng trở nên dễ dàng hơn bao giờ hết."
 d_volcanic_mineral_hills: "Đồi Phú khoáng"
 d_volcanic_mineral_hills_desc: "Thứ ánh sáng nhấp nháy từ xa xăm đã phơi bày kho tàng quặng ẩn chứa dưới lớp vỏ của những ngọn đồi này."
 d_volcanic_lava_river: "Dòng sông Magma"
 d_volcanic_lava_river_desc: "Dòng magma cuồn cuộn tự do tỏa ra thứ ánh sáng đỏ ấm áp, gột rửa hai bên bờ của dòng sông magma."
 # Thermotechnic District Deposits
 d_volcanic_stable_plateaus: "Cao nguyên Ổn định"
 d_volcanic_stable_plateaus_desc: "Về mặt địa chất, những cao nguyên này có tính ổn định cao hơn hẳn các khu vực lân cận."
 d_volcanic_tranquil_flatlands: "Đồng bằng Tĩnh lặng"
 d_volcanic_tranquil_flatlands_desc: "Vùng đồng bằng nhấp nhô thoai thoải này gần như không bị ảnh hưởng bởi những đợt chấn động hỗn loạn trải dài khắp hành tinh."
 d_volcanic_intraplate: "Vùng Mảng kiến tạo Kiên cố"
 d_volcanic_intraplate_desc: "Nằm cách xa mọi đường đứt gãy, khu vực này dường như miễn nhiễm với mọi thảm họa địa chất."
 d_volcanic_basalt_plains: "Bãi Đá Bazan"
 d_volcanic_basalt_plains_desc: "Một cao nguyên đá bazan lấp lánh, quyền năng của những ngọn núi lửa cổ đại đã lưu lại trên nó vô vàn những vết nứt và hố lõm."
 d_volcanic_sulfur_lava: "Magma Lưu huỳnh"
 d_volcanic_sulfur_lava_desc: "Dòng chảy magma liên tục này nhả ra một lượng hỗn hợp hóa chất đặc biệt vào bầu không khí bên trên nó."
 d_volcanic_dried_lavariver: "Dòng sông Magma Cạn khô"
 d_volcanic_dried_lavariver_desc: "Một dòng sông magma cổ đại đã nguội lạnh từ thuở nào, giờ chỉ còn lại những vệt đen như than kéo dài cắt ngang mặt đất."
 d_volcanic_tunnels: "Đường hầm Biệt lập"
 d_volcanic_tunnels_desc: "Những đường hầm dài và trống trải đâm xuyên qua lòng núi, các vách tường của nó đã bị những dòng chảy magma xa xưa thiêu đốt và mài nhẵn."
 # Misc Deposits
 d_volcanic_fumarole: "Lỗ phun Khí"
 d_volcanic_fumarole_desc: "Những lỗ thông hơi há miệng này đang phun trào những dòng $exotic_gases$ nóng hổi từ sâu trong lòng hành tinh."
 d_volcanic_stifling_atmosphere: "Bầu Khí quyển Ngạt thở"
 d_volcanic_stifling_atmosphere_desc: "Bầu không khí bị bao phủ bởi tro núi lửa, đẩy hành tinh này vào cảnh chạng vạng oi bức và đầy rẫy bụi bặm."
 d_andisol_soil: "Thung lũng Andisol"
 d_andisol_soil_desc: "Lớp đất đen mỡ màng được hình thành từ tro núi lửa đã mang đến một cơ hội vô cùng hiếm hoi để gieo trồng mùa màng."
 d_red_giant_unstable: "£energy£§Y+5§!"
 d_red_giant_unstable_desc: "$d_red_giant_dm$"
 d_red_giant_dm: "£sr_dark_matter£§Y+8§!"
 d_red_giant_dm_desc: "$d_red_giant_dm$"
 # Blockers
 d_seismic_bombing_crater: "£blocker£Miệng Núi lửa"
 d_seismic_bombing_crater_desc: "Khu vực này đã bị nứt toác bởi các cuộc oanh tạc thảm địa chấn, hình thành nên các hoạt động núi lửa sôi sục."
 d_large_volcano: "£blocker£Núi lửa Lớn"
 d_large_volcano_desc: "$d_active_volcano_desc$"
 d_ash_storms: "£blocker£Bão Tro Núi lửa"
 d_ash_storms_desc: "Khu vực này đang bị bủa vây bởi những đám mây tro núi lửa đặc quánh nghẹt thở."
 d_charged_atmosphere: "£blocker£Bầu Khí quyển Tích điện"
 d_charged_atmosphere_desc: "Không khí nơi đây tràn ngập một nguồn điện năng kích thích và đầy rẫy hiểm nguy."
 d_lava_flooding: "£blocker£Lũ Magma Theo mùa"
 d_lava_flooding_desc: "Khu vực này thường xuyên hứng chịu những đợt lũ magma nóng chảy theo chu kỳ từng mùa."
 d_toxic_atmosphere: "£blocker£Bầu Khí quyển Độc hại"
 d_toxic_atmosphere_desc: "Bầu không khí nơi đây gần như không thể hô hấp được, chỉ những kẻ mạnh nhất mới có thể duy trì sự sống."
 d_raging_lavafalls: "£blocker£Thác Magma Dữ dội"
 d_raging_lavafalls_desc: "Những ngọn thác magma đổ ầm ầm vô cùng tráng lệ, chảy xối xả qua từng bậc dốc."
 d_rugged_landscape: "£blocker£Địa hình Lởm chởm"
 d_rugged_landscape_desc: "Khu vực rộng lớn này vẫn đang liên tục phải hứng chịu sự tàn phá từ các hoạt động kiến tạo và những đợt phun trào núi lửa."
 # Planet Modifiers
 volcanic_critters: "Sinh mệnh Khắc nghiệt"
 volcanic_critters_desc: "Ngay cả trong lòng một hành tinh dung nham nóng rực và đầy chết chóc, sự sống vẫn có thể vươn mình tìm ra một lối đi riêng."
 volcanic_mineral_rich: "$mineral_rich$"
 volcanic_mineral_rich_desc: "$mineral_rich_desc$"
 volcanic_ultra_rich: "$ultra_rich$"
 volcanic_ultra_rich_desc: "$ultra_rich_desc$"
 volcanic_mineral_poor: "$mineral_poor$"
 volcanic_mineral_poor_desc: "$mineral_poor_desc$"
 volcanic_subterranean: "$subterranean_wildlife$"
 volcanic_subterranean_desc: "$subterranean_wildlife_desc$"
 volcanic_asteroid_impacts: "$asteroid_impacts$"
 volcanic_asteroid_impacts_desc: "$asteroid_impacts_desc$"
 volcanic_asteroid_belt: "$asteroid_belt$"
 volcanic_asteroid_belt_desc: "$asteroid_belt_desc$"
 volcanic_crystal_lake: "Hồ Tinh thể"
 volcanic_crystal_lake_desc: "Những viên tinh thể khổng lồ mang theo nguồn nhiệt và ánh sáng ấm áp, khẽ rung động rồi từ từ nhô lên từ trong hồ dung nham."
 volcanic_hollow_planet: "Hành tinh Rỗng"
 volcanic_hollow_planet_desc: "Bên dưới bề mặt ẩn chứa những hang động rộng lớn vô ngần, tiếng vang vọng trong màn đêm trống rỗng chính là minh chứng sống động cho việc ngọn lửa đã từng định hình nên lịch sử của hành tinh này."
 volcanic_lavafall: "Thác Magma"
 volcanic_lavafall_desc: "Tại nơi đây magma tuôn chảy một cách tự do, đổ ập xuống những sườn dốc đứng, tạo nên một màn trình diễn pháo hoa vô cùng choáng ngợp của thiên nhiên."
 volcanic_oasis: "Ốc đảo Hỏa ngục"
 volcanic_oasis_desc: "Một vùng đất nhỏ bé xanh tươi, nhờ có ngọn núi cao che chắn mà thoát khỏi kiếp bị ngọn lửa tàn phá. Hệ động thực vật độc đáo nơi đây tạo nên một nét tương phản sắc nét với cảnh hoang tàn ở bên ngoài."
 fractalized_entropy_category: "Entropy Phân dạng"
 fractalized_entropy_category_desc: "Tàu thăm dò vừa phát hiện ra một vật thể kỳ dị đang trôi dạt trong vành đai tiểu hành tinh. Hiện chưa rõ nguồn gốc của nó, nhưng do quỹ đạo khá ổn định, nên chúng ta hoàn toàn có thể đánh chặn để tiến hành kiểm tra."
 infernals.3205.name: "Entropy Phân dạng"
 infernals.3205.desc: "[Leader.GetName] đã báo cáo về việc phát hiện một cấu trúc cứng có nhiều góc cạnh đang lơ lửng trên quỹ đạo ổn định quanh một ngôi sao. Cấu trúc này được cấu tạo từ một loại vật liệu chưa rõ, bề mặt được bao phủ bởi những mặt cắt như tinh thể, và hoàn toàn không thể phân tích được thành phần của nó. Nó luôn duy trì một hướng cố định, luôn hướng bề mặt về phía ngôi sao của mình, và chống lại mọi lực tác động từ bên ngoài hòng điều khiển hoặc làm nó xoay tròn.\n\nTrong một cuộc thử nghiệm có kiểm soát, con tàu khảo sát đã bắn một xung tập trung vào cấu trúc này, khiến nó nứt làm đôi một cách gọn gàng, chia thành hai nửa đối xứng hoàn hảo, sau đó mỗi nửa lại tự định hình lại thành những phiên bản sao chép thu nhỏ của cấu trúc ban đầu. Các đợt xung tiếp theo cũng đều cho ra kết quả tương tự: phân tách, sao chép và thu nhỏ một cách ổn định.\n\nCuối cùng, hàng ngàn cấu trúc vi mô này đã phân tán và tạo thành một đám mây, lơ lửng ổn định trên quỹ đạo. Mỗi mảnh vỡ vẫn bảo tồn nguyên vẹn sự sắp xếp chính xác cũng như các đặc điểm hình học của cấu trúc gốc, tạo nên một tổng thể phản ánh lại hình dáng nguyên sơ của nó.\n\nHiện tượng chưa từng có tiền lệ này hiện vẫn chưa có lời giải đáp. Tất cả dữ liệu đều đã được lưu trữ, chờ đợi những phân tích sâu hơn trong tương lai."
 infernals.3205.a: "Lưu giữ và theo dõi các mảnh vỡ này."
 # Archaeological Sites
 from_the_ashes_site: "Tro Tàn của Ngọn Lửa"
 from_the_ashes_site_desc: "Bề mặt của [Planet.GetName] đang rực cháy, hoàn toàn không thích hợp cho sinh vật tồn tại. Tuy nhiên, những hình ảnh rõ nét về tàn tích nhân tạo trên hành tinh này đã thu hút sự chú ý của các [GetScientistPlural]. Một cuộc điều tra khảo cổ học có thể sẽ vén màn bí mật về những cư dân đã từng sống ở đây, cũng như những sự kiện đã từng giáng xuống đầu họ."
 infernals.2700.name: "Đế chế Bị Lãng quên"
 infernals.2700.desc: "Thoạt nhìn, các tàn tích tại [From.Planet.GetName] dường như được xây bằng đá, nhưng các cuộc khai quật và phân tích đã chỉ ra rằng, phần lớn các công trình này được cấu thành từ những vật liệu hữu cơ hóa thạch giống như gỗ. Hiện tại, trên hành tinh này không còn bất kỳ nguồn cung cấp loại vật liệu này nữa. Các cổ vật quy mô nhỏ được chế tác từ kim loại thô sơ, thủy tinh cùng với những chất hữu cơ hóa thạch tương tự, ngoài ra các [GetScientistPlural] còn tìm thấy dấu vết hóa thạch của những sinh vật bản địa đã tuyệt diệt.\n\nNền văn minh này có vẻ như đã từng sinh sống vào thời kỳ khí hậu còn ôn hòa. Bọn họ đã biến mất từ lâu, hay đã từng chứng kiến những khoảnh khắc cuối cùng của một cuộc biến động dữ dội?"
 infernals.2705.name: "Nhân chứng của Ngày Tận thế"
 infernals.2705.desc: "Khi tiến hành khai quật khu tàn tích đô thị tại [From.Planet.GetName], chúng ta đã phát hiện ra một vài địa điểm mang giá trị văn hóa cao, với các bức tường được trang trí bằng những hoa văn tinh xảo, có khả năng cao là một hệ thống chữ viết. Đáng chú ý nhất, đội ngũ khai quật đã tìm thấy một căn hầm ngầm chứa đầy những kệ sách, bên trên chất kín những phiến đồng được khắc chữ chằng chịt. Đồng là một chất liệu lưu trữ cực kỳ kém hiệu quả, nhưng nơi này dường như từng là một kho lưu trữ văn bản công cộng.\n\nĐội ngũ khảo cổ đang tiếp tục khám phá và bắt đầu giải mã các văn bản. Vận mệnh cuối cùng của nền văn minh này hiện vẫn đang là một bí ẩn chờ được giải đáp."
 infernals.2710.name: "Sự Diệt vong Gần kề"
 infernals.2710.desc: "Đội ngũ nghiên cứu trên [From.Planet.GetName] đã phát hiện ra một hầm mộ rùng rợn, được tạo thành từ một mạng lưới các đường hầm khai quật đan chéo nhau, bên trong các hốc tường là thi hài của những người ngoài hành tinh đã bị ướp xác, được xếp chồng lên nhau tới ba hoặc bốn lớp. Những đồ vật tùy táng đã phản ánh phần nào về trình độ công nghệ của nền văn minh này: có súng ống thô sơ, ống nhòm thủy tinh thủ công, cùng với những họa tiết thêu dệt vô cùng tinh xảo.\n\nNhiều nút giao trong hầm mộ được bảo vệ bởi những bức tượng của một loài động vật bản địa đã bị tuyệt diệt. Những sinh vật này có lớp vỏ hình vòm, bốn chân ngắn ngủn cùng cái đầu nhỏ tù túng; trong những bức tượng còn nguyên vẹn, chúng cuộn tròn lại, dùng vỏ để che chắn, chống lại ngọn lửa được điêu khắc ngay phía bên trên.\n\nÝ nghĩa thực sự của những tác phẩm nghệ thuật này có lẽ đã bị phai mờ theo dòng thời gian, nhưng khả năng cao nó phản ánh sự linh cảm của toàn xã hội về một ngày tận thế chìm trong biển lửa. Nếu có thể khai quật sâu hơn, có thể chúng ta sẽ làm sáng tỏ được những thảm họa mà nền văn minh này đã phải trải qua."
 infernals.2715.name: "Hồi kết trong Biển lửa"
 infernals.2715.desc: "Những đợt thám hiểm sâu hơn vào tàn tích đô thị của [From.Planet.GetName] đã chứng minh rằng, nền văn minh này đã từng phải trải qua sự sụp đổ hoàn toàn của hệ sinh thái, và họ đã nhận ra được sự diệt vong bởi lửa đang tiến đến gần. Ban đầu họ dùng giấy để ghi chép lịch sử, nhưng sau đó do tro núi lửa liên tục trút xuống không ngừng nghỉ, họ đành phải chuyển sang dùng các phiến đồng để lưu giữ lại những ghi chép của mình. Sự xuất hiện thường xuyên của hình ảnh động vật né tránh ngọn lửa trong các tác phẩm nghệ thuật rõ ràng là một nỗ lực nhằm lý giải và miêu tả lại sự diệt vong của chính bản thân họ.\n\nTrong quá trình khai quật, chúng ta cũng đã tìm thấy một bức tượng gác cổng hầm mộ gần như còn nguyên vẹn, ngọn lửa được điêu khắc trên đỉnh của nó đang tỏa ra một ánh sáng yếu ớt, mang lại một giá trị bảo tồn cực kỳ cao.\n\nBên cạnh đó, chúng ta cũng đã tìm thấy bằng chứng cho thấy họ từng cố gắng để ngăn chặn các hoạt động núi lửa, dựa vào những con đường còn sót lại cùng với những chiếc xe vận chuyển đã bị phá hủy, có thể thấy cư dân nơi đây từng vận chuyển gạch đá đến những miệng núi lửa gần nhất, hòng lấp kín không cho núi lửa phun trào, thế nhưng những nỗ lực ấy cũng không thể thay đổi được vận mệnh diệt vong. Ngày nay, trên hành tinh này đã không còn tồn tại bất kỳ sự sống đa bào nào nữa.\n\nLịch sử này là một lời cảnh tỉnh đanh thép gửi đến cho chúng ta: một khi phải đối mặt với một vấn đề nằm ngoài tầm kiểm soát của công nghệ, thì bất kỳ nền văn minh nào cũng đều mong manh dễ vỡ."
 infernals.2715.a: "Hồi kết của một vở kịch bi tráng."
 infernals.2715.b: "Chúng ta cần phải rút ra được bài học từ sự kiện này."
 inferno_temple_site: "Đền thờ Hỏa ngục"
 inferno_temple_site_desc: "Nằm xa xăm khỏi các khu vực tập trung đông đúc dân cư trên [Planet.GetName], ẩn mình giữa dãy núi lửa đang hoạt động là phế tích của một ngôi đền cổ. Việc tìm hiểu lịch sử của nó có thể sẽ giúp chúng ta có cái nhìn sâu sắc hơn về nền văn hóa bản địa nơi đây."
 infernals.2720.name: "Ấn ký Cổ xưa"
 infernals.2720.desc: "Trên ngôi đền vẫn còn hằn in những vết tích của các cuộc chiến, và trong lòng đất là hài cốt của những sinh mệnh có trí tuệ bản địa. Ngôi đền này dường như đã bị thiêu rụi và rồi bị bỏ hoang. Đội ngũ an ninh nhận thấy người dân địa phương hoàn toàn tránh xa nơi này, và coi nó như một vùng đất bị nguyền rủa.\n\nNhờ có những bức tường bên ngoài che chắn, không gian bên trong của ngôi đền lửa đã được gìn giữ một cách nguyên vẹn. Bên trong vẫn còn lưu lại rất nhiều những bức bích họa và phù điêu tinh xảo, trong đó có lặp đi lặp lại một hoa văn hình ngọn lửa cuộn tròn, ở chính giữa ngọn lửa là một vết nứt đen ngòm. Trong một bức bích họa, một sinh vật đi bằng hai chân đã tự móc một trong bốn con mắt của mình và ném nó xuống đất, tạo thành một hình mẫu nằm chính giữa ngọn lửa, chúng ta quyết định đặt tên cho nó là \"Con Mắt Hỏa ngục\".\n\nNhững đợt khai quật tiếp theo sẽ hé lộ những tín ngưỡng có liên quan đến sự dị thường này."
 infernals.2725.name: "Vật hiến tế Đôi Mắt Âm u"
 infernals.2725.desc: "Cuộc khai quật tại ngôi đền Con Mắt Hỏa ngục đã chỉ ra những dấu tích rõ rệt của những buổi hiến tế quy mô lớn. Bên trong ngôi đền có rất nhiều những hố tròn khổng lồ, ở chính giữa hố là một bệ tế, mô phỏng lại hình dáng của Con Mắt Hỏa ngục cùng với con ngươi của nó. Những cái hố này chứa đầy tro tàn và những mảnh than củi, các cuộc phân tích phân tử đã chứng minh rằng những thứ này có nguồn gốc từ các mô động vật.\n\nHiện vẫn chưa rõ vật hiến tế là động vật hoang dã, vật nuôi hay là cả những cư dân bản địa.\n\nCác đặc vụ đã được phái đến trung tâm tập trung dân cư hiện tại để tìm kiếm các chứng cứ liên quan, trong khi đội khai quật vẫn đang tiếp tục tìm kiếm câu trả lời."
 infernals.2725.a: "Bí ẩn vẫn đang chờ được khám phá!"
 infernals.2725.b: "Điều động các cá thể con đến điều tra."
 infernals.2730.name: "Nghi lễ Hắc ám"
 infernals.2730.desc: "Một cánh cửa đá nặng nề đã chặn đứng con đường dẫn vào phần sâu nhất của ngôi đền. Sau khi phá vỡ cánh cửa, đội ngũ khai quật đã phát hiện ra một căn phòng hình tròn, hố sâu nằm ở trung tâm của căn phòng thông thẳng đến một hồ magma tự nhiên dưới lòng đất. Magma hắt lên thứ ánh sáng màu cam nhuộm đỏ các bức tường, lờ mờ rọi sáng những dòng chữ khắc chạy quanh căn phòng kỳ dị này. Phía trên cùng của bức tường là một hàng những con mắt sáng rực rỡ.\n\nBệ tế nằm ngay rìa của cái hố có hình dạng tựa như Con Mắt Hỏa ngục, rải rác trên đó là một thi hài đã khô quắt của một người dân địa phương, rất có thể đây là một vật hiến tế dùng để xoa dịu Con Mắt Hỏa ngục.\n\nNhững dòng chữ khắc trên tường đóng vai trò tối quan trọng để hiểu được chức năng văn hóa của ngôi đền, và cần phải được giải mã ngay lập tức."
 infernals.2735.name: "Lời tiên tri của Đại Biến Cố"
 infernals.2735.desc: "Cuối cùng, cuộc nghiên cứu đã phát hiện ra rằng, các văn bản trong căn phòng nằm ở nơi sâu nhất của ngôi đền đã hé lộ một loạt những lời tiên tri xoay quanh sự trở lại của Con Mắt Hỏa ngục, kể lại rằng Con Mắt Hỏa ngục vì tức giận trước sự khinh rẻ của thần dân, nên sẽ làm cho bầu trời trở nên tối tăm, ngọn núi thiêng sẽ phun trào, một số loại mùa màng cụ thể sẽ bị héo úa, và muôn vàn những tai ương sẽ liên tiếp ập đến. Lời tiên tri dự báo về sự kết thúc của một nền văn minh, và chỉ những ai quy phục Con Mắt Hỏa ngục mới có thể sống sót.\n\nCác đặc vụ địa phương đã truy tìm mối liên hệ văn hóa trong lời tiên tri này, và phát hiện ra rằng lời tiên tri này chính là khởi nguồn cho rất nhiều câu tục ngữ và truyền thuyết trong nền văn hóa của hành tinh này, và các nghi thức huyền bí được tổ chức tại các đền thờ hiện đại của địa phương thực chất là một cách tái diễn hoặc phản kháng lại lời tiên tri cổ đại này.\n\nCông nghệ của chúng ta có khả năng tái hiện lại những sự kiện trong lời tiên tri, hoặc dùng các thủ đoạn tinh vi để biến giả thành thật. Nếu chúng ta tự xưng là hóa thân của Con Mắt Hỏa ngục, chứng minh lời tiên tri kia là sự thật, thì chúng ta có thể buộc đối phương phải khuất phục và thề trung thành với chúng ta, tạo tiền đề thuận lợi cho quá trình đồng hóa lâu dài."
 infernals.2735.a: "Tái hiện lời tiên tri."
 infernals.2735.a.tt: "Xã hội nguyên thủy trên §Y[From.Planet.GetName]§! sẽ học cách tiếp nhận các luồng tư tưởng của chúng ta."
 infernals.2735.a.fail: "Chưa chọn chính sách §Y$interference_not_allowed$§!."
 infernals.2735.b: "Không can thiệp."
 infernals.2735.c: "Lịch sử của bọn họ đã vĩnh viễn tan biến."
 infernal_figurine: "Bức Tượng Hỏa ngục"
 infernal_figurine_desc_short: "Một sinh vật có lớp vỏ dày và cường tráng, với bốn cái chân ngắn ngủn, đang khom người thu mình lại dưới một bức tượng hình ngọn lửa."
 infernal_figurine_desc_details: "Ngọn lửa này được tạc từ một loại khoáng thạch vô danh, tỏa ra một vầng sáng đỏ thẫm. Cổ vật này được khai quật từ một hầm mộ của một xã hội đã tuyệt diệt, có lẽ nó tượng trưng cho cái ảo tưởng hư vô của họ về việc có thể thoát khỏi thảm họa diệt vong do núi lửa gây ra."
