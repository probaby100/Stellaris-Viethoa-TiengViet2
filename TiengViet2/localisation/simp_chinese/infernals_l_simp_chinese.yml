 # Nguồn gốc - Sao Khổng lồ Đỏ
 origin_red_giant: "Sao Khổng lồ Đỏ"
 origin_red_giant_desc: "Nền văn minh này đang đứng trước ngã rẽ của số phận: ngôi sao khổng lồ đỏ ở trung tâm hệ sao của họ đang không ngừng nóng lên, thiêu đốt quê hương của họ.\n\nTrước khi tìm ra nguyên nhân và giải quyết nó, liệu họ có thể thích nghi với môi trường khắc nghiệt này không? Hay họ sẽ chọn ôm lấy sức mạnh nóng bỏng này, biến sự thay đổi kỳ lạ và thậm chí có thể là trái tự nhiên đó thành lợi thế của riêng mình?"
 origin_tooltip_red_giant_effects: "—$HOMEWORLD$['concept_pc_volcanic'] (Quy mô: £planetsize£20)"
 START_SCREEN_RED_GIANT: "Sự thật đến thật chậm rãi, nhưng lại đột ngột sáng tỏ.\n\nNgôi sao của chúng ta đang bước vào một giai đoạn tiến hóa nhanh chóng và bất thường. Sản lượng năng lượng của nó đã vượt xa mọi thông số dự kiến. Sự biến đổi quang phổ cho thấy các mô hình đối lưu dị thường, tốc độ nhiệt hạch của nó dường như đang tăng lên mà không có sự mất mát khối lượng tương ứng.\n\nCho đến nay, chúng ta đã tiến hóa đồng bộ với đợt tăng nhiệt này. Nhưng quá trình tiến hóa sinh học cơ bản cũng có giới hạn của nó.\n\nNếu những thay đổi đang diễn ra bên trong [capital_star.GetName] tiếp tục, hành tinh mẹ sẽ bị thiêu rụi. Vấn đề không còn là \"có xảy ra hay không\", mà là \"khi nào\"."
 red_giant_start_NAME: "Hệ sao Khổng lồ Đỏ"
 red_giant_start_DESC: "Đây là hệ sao khởi đầu mặc định cho đế chế sử dụng nguồn gốc §Y$origin_red_giant$§!."
 tech_starfire_cannon: "$starfire_cannon$"
 tech_starfire_cannon_desc: "Giống như bất kỳ mối nguy hiểm tiềm tàng nào, bức xạ nguy hiểm phát sinh từ sự biến đổi ngôi sao của chúng ta cũng có thể trở thành vũ khí. Bằng cách định hướng nó thành vũ khí chùm tia, chúng ta có thể làm tàu địch quá nhiệt và tê liệt.\n\nMở khóa quyết định hành tinh để xây dựng §Y$starfire_cannon$§! trên quỹ đạo."
 SOLARFLARE_EMITTER: "Trạm phát Bão Mặt trời"
 SOLARFLARE_EMITTER_DESC: "Một chùm năng lượng uy lực, có thể xuyên thủng lớp phòng thủ mạnh nhất, làm tê liệt các hệ thống yếu ớt của phi thuyền."
 starfire_cannon_cap: "$starfire_cannon$"
 starfire_cannon: "Pháo Tinh Hỏa"
 starfire_cannon_plural: "Pháo Tinh Hỏa"
 NAME_Starfire_Cannon: "$starfire_cannon$"
 starfire_cannon_key: "Lõi $starfire_cannon$"
 sfe_on_hit_stun_tt: "§YLàm mục tiêu§! tê liệt trong §G5§! ngày, giảm tốc độ di chuyển, tốc độ bắn và lá chắn của chúng."
 sfe_weapon_stun_effect: "§RVa chạm $starfire_cannon$§!"
 sfe_weapon_stun_effect_desc: "  " # không hiển thị
 decision_starfire_cannon: "Xây dựng $starfire_cannon$"
 decision_starfire_cannon_desc: "Mô phỏng bức xạ dữ dội của một ngôi sao khổng lồ đỏ đang già đi nhanh chóng, pháo quỹ đạo này bắn ra chùm tia ion hóa nhiệt độ cao, không chỉ gây sát thương lên mục tiêu mà còn thiêu rụi các bộ phận của phi thuyền khiến chúng ngừng hoạt động."
 decision_starfire_cannon_effects: "Xây dựng §Y$starfire_cannon$§! trên quỹ đạo hành tinh, một loại vũ khí tầm xa có thể làm tê liệt nhiều hệ thống phi thuyền."
 decision_starfire_cannon_limit: "$TRIGGER_FAIL$Giới hạn hệ sao: §Y3§!"
 # Nguồn gốc - Bình minh Vũ trụ
 origin_cosmic_dawn: "Bình minh Vũ trụ"
 origin_cosmic_dawn_desc: "Đây không phải là một nền văn minh đang trỗi dậy, mà là một nền văn minh được giải phóng. Khi khoang ngủ đông mở ra và họ tỉnh giấc, vạn vật đã đổi dời, cố hương khó tìm. Nhưng quá khứ của họ không hề bị xóa nhòa, mà bị chôn vùi dưới lớp bụi và tàn tích của thiên hà, chờ đợi được khai quật một lần nữa."
 origin_tooltip_cosmic_dawn_effects: "—$HOMEWORLD$$TABBED_NEW_LINE$—['concept_pc_volcanic'] (Quy mô: £planetsize£14)$TABBED_NEW_LINE$—['concept_inf_cd_deposit']: +5\n—Bắt đầu với tình trạng sự kiện: §HKhai quật Sâu§!"
 origin_tooltip_cosmic_dawn_negatives: "—$INITIAL_POPS$§R-600§!"
 START_SCREEN_COSMIC_DAWN: "Khi tỉnh giấc, chúng ta chỉ có thể lờ mờ cảm nhận được mình đã từng chìm trong giấc ngủ. Ngay cả bây giờ, bằng chứng xác thực nhất về quá khứ không phải là ký ức, mà là hệ thống công nghệ khổng lồ và tinh vi đã bảo quản những cơ thể đang ngủ đông của chúng ta.\n\nHàng ngàn khoang ngủ đông, hệ thống truyền nhiệt xuyên dưới lòng đất, những lò dung nham cuồn cuộn. Những bức tường khắc ghi dấu vết nguồn gốc của chúng ta: các hạm đội khởi hành từ hành tinh mẹ đang nguội lạnh, tiến vào giữa các vì sao để tìm kiếm sự ấm áp mới. Để tìm ra sự thật, chúng ta đã rời khỏi \"lò ấp\" dưới lòng đất này. Trên bề mặt §Y[owner.Capital.GetName]§!, chúng ta đã tìm thấy công nghệ và tài nguyên có thể sử dụng được, đồng thời cũng phát hiện thêm các cơ sở ẩn sâu dưới lớp vỏ hành tinh. Có lẽ đồng bào của chúng ta vẫn đang say giấc trong một số cơ sở đó.\n\nVậy còn các vì sao thì sao? Liệu ở những vùng không gian xa xôi, có còn những tộc người đang say ngủ giống như chúng ta? Nếu vậy, có lẽ họ có thể giúp chúng ta giải đáp câu hỏi cứ ám ảnh trong tâm trí kể từ khi thức tỉnh - Chúng ta là ai?"
 cosmic_dawn_start_NAME: "Tân Gia Viên"
 cosmic_dawn_start_DESC: "Đây là hệ sao khởi đầu mặc định sử dụng nguồn gốc $origin_cosmic_dawn$."
