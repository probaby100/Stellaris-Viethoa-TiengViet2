 edict_love_letter_virus: "Virus Bức thư Tình"
 edict_love_letter_virus_desc: "Kích thích bộ phận cấy ghép tiết ra nhiều pheromone và các hóa chất khác, nhằm dụ dỗ những người ở khắp mọi miền đế chế có thêm nhiều hành vi \"đa tình\" hơn."
 concept_edict_love_letter_virus: "$edict_love_letter_virus$"
