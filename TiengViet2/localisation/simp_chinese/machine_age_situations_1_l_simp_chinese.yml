 #Tập đoàn Mạng lưới Tập thể
 auth_cyber_corporate_collectivist: "Doanh nghiệp Cải tiến"
 auth_cyber_corporate_collectivist_desc: "Cải tiến, là một thái độ luôn vươn lên, là một triết lý vững chắc trong môi trường phần mềm và phần ướt (cấy ghép) hiện đại. Các lựa chọn nâng cấp đa dạng mang đến cho lượng khách hàng của chúng ta những công cụ để đạt được thành tựu cá nhân và thúc đẩy hợp tác xã hội.\n\nTrong đó cũng chừa lại một cửa sau để theo dõi tất cả người dùng kết nối với mạng lưới của căn cứ sao. Dù vậy, lợi nhuận khổng lồ từ các bộ phận cấy ghép có thể sẽ khai sinh ra một thị trường chợ đen chuyên mua đi bán lại."
