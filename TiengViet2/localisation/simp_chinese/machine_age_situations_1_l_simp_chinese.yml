 ### BẮT ĐẦU CHUỖI SỰ KIỆN HIỆU ỨNG XÃ HỘI ###
 futureshock_chain_title: "Cú sốc Tương lai"
 futureshock_chain_desc: "Chúng ta không chịu an phận với những gì tự nhiên ban tặng, mà luôn cố gắng vượt qua giới hạn của cơ thể sinh học. Quá trình phổ cập cấy ghép trên diện rộng chỉ gặp phải vài trở ngại nhỏ, và tất cả đều đã được giải quyết êm đẹp. Đại đa số người dân đều vô cùng hân hoan với những gì mà cơ thể máy móc mới mang lại.\n\nChúng ta đang đứng trước ngưỡng cửa của sự vĩ đại, tương lai đang vô cùng rộng mở."
