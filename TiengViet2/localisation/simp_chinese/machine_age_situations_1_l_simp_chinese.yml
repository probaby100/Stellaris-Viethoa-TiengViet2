 situation_cyberization: "Cấy ghép máy móc"
 situation_cyberization_type: "Tình huống đột phá"
 situation_cyberization_desc: "Chúng ta sắp sẵn sàng dùng các bộ phận máy móc để nâng cấp cơ thể sinh học của mình. Khả năng xử lý của não bộ và sức mạnh của tay chân có thể được cải thiện. Vấn đề là ai sẽ nhận được nhiều lợi ích nhất từ sự nâng cấp này.\n\n§YSố dân số được cấy ghép vào tháng tới§!：§G[From.GetCyberPopsPerMonth]§!"
