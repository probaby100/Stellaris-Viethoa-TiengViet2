 # Dân chủ Máy móc Chủ nghĩa Tập thể
 auth_cyber_democratic_collectivist: "Chế độ Dân chủ Kết nối"
 auth_cyber_democratic_collectivist_desc: "Giao diện tương tác ý thức có thể tạo điều kiện để những người máy móc hoàn toàn chia sẻ dữ liệu cảm biến, phản ứng cảm xúc và mô thức tư duy theo thời gian thực. Để ngăn chặn sự nhạy cảm phản ứng thái quá từ bên ngoài, một tường lửa cảm xúc sẽ lọc bớt những phản ứng không cần thiết đối với các gói dữ liệu cảm xúc được chia sẻ.\n\nChính phủ dân chủ này tổ chức bầu cử định kỳ, tất cả công dân đều có thể bỏ phiếu bầu ra các nghị sĩ đại diện cho họ."
