 #TẬP ĐOÀN
 edict_customer_insights: "Thấu hiểu Khách hàng"
 edict_customer_insights_desc: "Việc khảo sát mạng lưới diện rộng và phân tích dữ liệu thời gian thực cho phép chúng ta đánh giá và bắt kịp xu hướng thị trường với tốc độ chưa từng có. Tài nguyên sẽ được rót vào những tính năng và sản phẩm có tiềm năng sinh lời cao nhất."
 concept_edict_customer_insights: "$edict_customer_insights$"
 unlock_edict_customer_insights: "$unlock_edict_tt$['concept_edict_customer_insights']"
 edict_rolling_updates: "Cập nhật Xoay vòng"
 edict_rolling_updates_desc: "Việc tự động hóa cập nhật bộ phận cấy ghép và cho phép người dùng tự triển khai đã xóa bỏ nhu cầu xây dựng cơ sở hạ tầng tổng thể. Điều này cũng giúp ta luôn đi trước một bước khi đối mặt với các cuộc tấn công mạng độc hại."
 concept_edict_rolling_updates: "$edict_rolling_updates$"
