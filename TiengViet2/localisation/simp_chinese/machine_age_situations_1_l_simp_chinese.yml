 auth_cyber_democratic_individualist: "Dân chủ Song song"
 auth_cyber_democratic_individualist_desc: "Các biện pháp bảo mật thần kinh tiên tiến bậc nhất cho phép công dân tham gia bỏ phiếu quyết định chính sách một cách trọn vẹn, trực tiếp và theo thời gian thực.\n\nChính phủ dân chủ này thường xuyên tổ chức bầu cử, mọi công dân đều có quyền bầu ra các nghị sĩ đại diện cho mình."
