 ### ĐẶC ĐIỂM ###
 #ĐẾ CHẾ
 intergenerational_knowledge: "$rulerchip_intergenerational_knowledge$"
 ### SỰ KIỆN ###
 cyber.social_consequences.tt: "Ảnh hưởng đến §YBiến đổi Xã hội Cấy ghép§! đang diễn ra.\n\n" #Standard tooltip to indicate that the Individualism/Collectivism variables are changed
 #SỰ KIỆN ĐẦU TIÊN #
 #DÂN CHỦ
 cyber.505.name: "Cú Sốc Tương Lai"
 cyber.505.desc.gov: "Việc cường hóa dân chúng là một thắng lợi lớn của dây chuyền sản xuất và các quyết định chiến lược. Nhiều tiếng nói khác biệt đã được lắng nghe, và những lo ngại của họ đã được giải quyết. Giờ đây, mỗi cá nhân §Y[root.GetSpeciesAdj]§! đều có cơ hội bình đẳng để tận hưởng những bộ phận cấy ghép thay đổi cuộc đời này.\n\nBước đi hợp lý tiếp theo là nghiên cứu tác động sâu rộng hơn của công nghệ này. Liệu ta nên dùng nó để thúc đẩy tiến trình dân chủ, hay đồng bộ hóa kinh nghiệm để nâng tầm người lao động?"
 cyber.505.desc.cor: "Quá trình cường hóa thông qua các công ty đối tác đã thành công tốt đẹp. Các bộ phận cấy ghép được sản xuất, phân phối và lắp đặt với hiệu suất đáng kinh ngạc. Chúng ta đã tiếp thu nhiều ý kiến từ xã hội §Y[root.GetSpeciesAdj]§! và xử lý ổn thỏa những nỗi lo chính đáng của họ. Chúng ta đã sẵn sàng đối mặt với tương lai bằng một nguồn sinh lực mới.\n\nChính quyền hiện đã sẵn sàng thực hiện bước đi tiếp theo. Ta có thể tận dụng tiến bộ công nghệ để cải thiện tiến trình dân chủ, hoặc tiến hành đồng bộ hóa cấy ghép cho lực lượng lao động."
 cyber.505.desc.ind: "Bất chấp vài e ngại từ các quan chức, mô hình phân phối cấy ghép phi tập trung đã phát huy hiệu quả. Những phòng khám và cơ sở dịch vụ nhỏ mọc lên như nấm sau mưa trên mọi ngóc ngách, giúp người dân dễ dàng hoàn tất việc cường hóa mà không phải đi xa.\n\nChính phủ cũng phải sẵn sàng tiến lên phía trước. Ta có thể dùng tiến bộ công nghệ để cải thiện quy trình dân chủ, hoặc tiến hành đồng bộ kinh nghiệm để tạo phúc lợi cho chính mình và người lao động."
 cyber.505.a: "Chúng ta nên thúc đẩy tiến trình dân chủ."
 cyber.505.a.tt: "Tập trung nâng cao hạnh phúc, sự gắn kết và tính chuyên nghiệp."
 cyber.505.b: "Chúng ta phải kết nối các tâm trí lại với nhau."
 cyber.505.b.tt: "Tập trung nâng cao độ hạnh phúc, sản lượng của nhân công và sự ổn định."
 #TẬP ĐOÀN ĐẦU SỎ
 cyber.510.name: "Tái cấu trúc Quyền lực"
 cyber.510.desc.gov: "Sự chuyển mình mang tính cột mốc này chỉ có thể được thấu hiểu và thực thi bởi tầng lớp thượng lưu trong xã hội, tránh để xảy ra hỗn loạn và chia rẽ trong quần chúng. Khi §Y[Species.GetNamePlural]§! được lắp đặt các bộ phận cấy ghép do chính phủ phân phối, chúng ta có được một cơ hội ngàn năm có một để khám phá những khả năng mới mẻ mà các con chip này mang lại.\n\nLiệu chúng ta nên tạo ra một môi trường cạnh tranh khốc liệt để thúc đẩy công nhân lên những tầm cao mới, hay nên tận dụng năng lực tính toán nhàn rỗi trong lúc họ ngủ?"
 cyber.510.desc.cor: "Với việc các công ty được chính phủ cấp phép bắt đầu sản xuất hàng loạt các chip sinh học không ngừng được cải tiến, chúng ta phải quyết định cách tận dụng sự thay đổi xã hội đáng kinh ngạc này.\n\nLiệu ta nên mô phỏng chọn lọc tự nhiên cá lớn nuốt cá bé, hay khai phá tiềm năng ẩn giấu của não bộ khi đang chìm trong giấc ngủ?"
 cyber.510.desc.ind: "Dù tốt hay xấu, mọi người đều sẽ có cơ hội chứng tỏ bản thân thông qua các phần cứng cường hóa cấy ghép được sản xuất và phân phối, cho phép chúng ta tự do cân nhắc bức tranh toàn cảnh và quyết định làm sao để tối đa hóa lợi ích từ biến chuyển xã hội không thể lường trước này.\n\nLiệu ta nên hối thúc người dân hoàn thành các chỉ tiêu sản xuất cao hơn, hay bắt họ làm việc cho ta ngay cả trong lúc ngủ?"
 cyber.510.a: "Cứ để đám nịnh bợ vắt kiệt sức vì chúng ta đi."
 cyber.510.a.tt: "Tập trung tăng cường năng suất với cái giá là làm giảm độ hạnh phúc."
 cyber.510.b: "Tận dụng sức mạnh của giấc ngủ."
 cyber.510.b.tt: "Nhấn mạnh việc lợi dụng các phe phái để thu thêm tài nguyên."
 #ĐỘC TÀI
 cyber.515.name: "Kiểm soát Đám đông"
 cyber.515.desc.gov: "Chương trình cường hóa đã mở ra nhiều cơ hội để nâng cao tính ổn định và khả năng kiểm soát. Trong quá trình sản xuất và lắp đặt rộng rãi các bộ phận cấy ghép của chính phủ cho dân chúng, việc bí mật nhúng các thuật toán dẫn dắt họ đạt năng suất cao hơn chỉ là chuyện vặt.\n\nChúng ta có thể tăng cường năng lực giám sát bằng cách thêm các chương trình theo dõi và cửa sau vào các bộ phận cấy ghép cá nhân, hoặc cài đặt các mã lệnh để nhân cách ngời sáng của §Y[Ruler.GetTitle]§! soi rọi tới công chúng."
 cyber.515.desc.cor: "Các công ty đối tác của chúng ta đã sẵn sàng sản xuất, phân phối và lắp đặt các bộ phận cấy ghép trên phạm vi toàn xã hội, và bản cập nhật phần cứng sắp tới mang đến cho chúng ta một cơ hội có một không hai.\n\nChúng ta có thể bí mật nhúng các công cụ giám sát vào các phần cứng cường hóa cá nhân để tìm ra những kẻ có vấn đề, hoặc tạo ra một hàm ghi đè nhân cách để khắc sâu ý chí của §Y[Ruler.GetTitle]§! vào tâm trí đại chúng."
 cyber.515.desc.ind: "Các bệnh viện đa khoa, cửa hàng góc phố và các nhóm tin tặc hiện đang rục rịch phân phối và lắp đặt các bộ phận cấy ghép cho công chúng. Tuy nhiên, không nhất thiết phải phân tán quyền lực của chúng ta vào công nghệ mới đầy hứa hẹn này một cách triệt để như vậy.\n\nChúng ta có thể cung cấp các bản độ cấy ghép tùy chỉnh, giấu các công cụ giám sát bí mật bên trong để theo dõi sát sao những cá nhân có rủi ro, hoặc cài đặt thuật toán ghi đè nhân cách để ý chí của §Y[Ruler.GetTitle]§! âm thầm dẫn dắt người dân bước tới sự vĩ đại."
 cyber.515.a: "Giấu công cụ giám sát trong các bộ phận cấy ghép cá nhân."
 cyber.515.a.tt: "Tập trung vào sự ổn định của đế chế và giảm tỷ lệ tội phạm."
 cyber.515.b: "Nghiên cứu ghi đè nhân cách."
 cyber.515.b.tt: "Tập trung vào sản lượng nhân công và tái định cư cưỡng bức."
 #ĐẾ CHẾ
 cyber.520.name: "Cú Sốc Tương Lai"
 cyber.520.desc.gov: "Chính phủ đã điều phối hiệu quả một lượng tài nguyên khổng lồ để cường hóa người dân. Các trung tâm cường hóa được chính phủ phê duyệt làm việc ngày đêm để lắp đặt và hướng dẫn người dân cách sử dụng, bảo trì bộ phận cấy ghép đúng cách.\n\nCâu hỏi hiện giờ là, giá trị thực tế của các bộ phận cấy ghép nên tập trung vào việc tăng cường cho bộ máy lãnh đạo vốn đã vô cùng ấn tượng của chúng ta, hay dùng làm phương tiện giải trí và phân tán sự chú ý của bề tôi.\n\nViệc chế tạo các bộ phận cấy ghép chất lượng cao nhất cho hoàng gia cho phép tầng lớp lãnh đạo lưu giữ kiến thức qua nhiều thế hệ, qua đó nâng cao tính ổn định một cách không thể đong đếm. Hoặc đế chế có thể nâng tầm vị thế của thủ đô, biến nơi đây thành đấu trường của những môn thể thao cực đoan nhất dành cho các vận động viên cấy ghép."
 cyber.520.desc.cor: "Các công ty được chính phủ cấp phép đang ráo riết thực thi chỉ lệnh. Toàn bộ người dân đã được cường hóa bằng các bộ phận cấy ghép và sẵn sàng phục vụ với hiệu suất chưa từng có.\n\nCâu hỏi hiện giờ là nên tập trung giá trị thực tế của các bộ phận cấy ghép vào đâu.\n\nViệc chế tạo các bộ phận cấy ghép chất lượng cao nhất cho hoàng gia cho phép tầng lớp lãnh đạo lưu giữ kiến thức qua nhiều thế hệ, qua đó nâng cao tính ổn định một cách không thể đong đếm. Hoặc đế chế có thể nâng tầm vị thế của thủ đô, biến nơi đây thành đấu trường của những môn thể thao cực đoan nhất dành cho các vận động viên cấy ghép."
 cyber.520.desc.ind: "Bất chấp sự dè dặt của nhiều quan chức đế chế, việc lắp đặt phân tán các bộ phận cấy ghép đã thành công vang dội. Các phòng khám nhỏ trên khắp các hành tinh đã nỗ lực không mệt mỏi để cường hóa dân chúng.\n\nCâu hỏi hiện giờ là giá trị thực sự của các bộ phận cấy ghép nên tập trung vào đâu. Chúng ta có thể để kiến thức của người cai trị được lưu trữ trong các thiết bị cấy ghép truyền đời, hoặc mang đến cho đại chúng một sự kiện thể thao cấy ghép chưa từng có."
 cyber.520.a: "Lưu truyền tri thức của hoàng gia."
 cyber.520.a.tt: "Tập trung vào người cai trị đế chế."
 cyber.520.b: "Cung cấp giải trí cho đại chúng."
 cyber.520.b.tt: "Tập trung vào năng suất và độ hạnh phúc của hành tinh thủ đô."
 #TẬP ĐOÀN
 cyber.525.name: "Cổ phần Cấy ghép"
 cyber.525.desc.gov: "Chương trình cấy ghép khổng lồ nhưng đầy chật vật của chính phủ sắp hoàn tất, mang đến cho chúng ta cơ hội mở rộng thêm các nguồn thu nhập liên quan đến màn ra mắt sản phẩm chưa từng có này. Đội ngũ phân tích của chúng ta đã đề xuất hai nguồn thu tiềm năng, cả hai đều có rủi ro và lợi nhuận riêng.\n\nChính phủ có nên yêu cầu các bộ phận cấy ghép thị giác trong tương lai phải chứa quảng cáo, hay bắt buộc người dân đã cường hóa phải nâng cấp định kỳ?"
 cyber.525.desc.cor: "Nhờ cơ sở hạ tầng doanh nghiệp được tối ưu hóa cao độ, việc sản xuất và lắp đặt các bộ phận cấy ghép đã diễn ra hiệu quả đúng như dự tính. Những bộ phận cấy ghép đời mới này thực sự mang lại những cơ hội kinh doanh vô tận.\n\nCó hai hướng đi đặc biệt hứa hẹn. Dù loại trừ lẫn nhau, nhưng cả hai phương án đều có tỷ suất lợi nhuận rất cao.\n\nVấn đề là, chúng ta có nên yêu cầu các bộ phận cấy ghép thị giác trong tương lai phải chứa quảng cáo, hay bắt buộc người dân đã cường hóa phải nâng cấp định kỳ?"
 cyber.525.desc.ind: "Đúng như dự đoán, việc lắp đặt bộ phận cấy ghép “công cộng” lộn xộn đang đi đến một cái kết có hậu. Giờ đây ta vẫn còn cơ hội định hướng sự phát triển của công nghệ mới đầy hứa hẹn này, đồng thời tăng biên độ lợi nhuận cho sản phẩm của mình trong quá trình đó.\n\nNên yêu cầu tất cả các thiết bị cấy ghép thị giác trong tương lai phải bao gồm quảng cáo, hay bắt buộc những người đã được cường hóa phải tiến hành cập nhật định kỳ?"
 cyber.525.a: "Thiết kế nguyên mẫu cấy ghép thị giác hỗ trợ quảng cáo."
 cyber.525.a.tt: "Tập trung tăng giá trị thương mại và giảm chi phí cơ hội thương mại."
 cyber.525.b: "Nghiên cứu chương trình nâng cấp cấy ghép."
 cyber.525.b.tt: "Tập trung vào các chương trình nghị sự về năng suất, tình báo và phí duy trì tiện nghi."
 ### EVENT POOL ###
 cyber.610.name: "Hạnh phúc Tiện lợi"
 cyber.610.desc: "Một bản mod cấy ghép bất hợp pháp đang được lưu truyền rộng rãi trong đội ngũ nhân viên, cho phép kích thích não bộ tiết ra các chất dẫn truyền thần kinh tùy ý. Nó có vô vàn công dụng, chẳng hạn như mang lại niềm vui sướng mãnh liệt hay tăng cường khả năng chịu đau. Việc dịch ngược từ những món đồ cấy ghép lậu này để tạo ra một phiên bản ổn định đòi hỏi một khoản đầu tư rất lớn, và hiệu quả của những kích thích này chắc chắn sẽ giảm dần theo thời gian.\n\nLiệu chúng ta nên đóng gói lại món đồ cấy ghép lậu này thành một phiên bản thương mại, hay chỉ cần đưa ra các quy định kiểm soát việc sử dụng nó?"
 cyber.610.a: "Thiết kế một bộ cấy ghép ổn định."
 cyber.610.b: "Cải biên những nguyên mẫu lậu này."
 cyber.610.c: "Quản lý các bản mod loại này."
 cyber.615.name: "Phân định Công - Tư"
 cyber.615.desc: "Ngày càng có nhiều công ty yêu cầu toàn bộ trải nghiệm trong thời gian làm việc phải được lưu trữ ở một vùng đặc biệt trong não cấy ghép, và không được phép truy cập ngoài giờ làm.\n\nHọ tuyên bố rằng tính năng này sẽ chỉ được sử dụng trong các nhiệm vụ tối mật để tránh bị đánh cắp bí mật thương mại. Một số thậm chí còn yêu cầu nhân viên phải chặn luôn cả những kinh nghiệm cá nhân khi đang làm việc, nhằm tránh việc đạo đức cá nhân cản trở năng suất."
 cyber.615.a: "Con người phải hoàn toàn nắm quyền kiểm soát bản thân."
 cyber.615.b: "Quên đi công việc ở công ty là vì mục đích sức khỏe."
 cyber.615.c: "Ngăn chặn trải nghiệm từ cả hai chiều."
 cyber.625.name: "Đăng ký Trả phí"
 cyber.625.desc: "Khi cấy ghép mạng ngày càng ăn sâu vào đời sống của chúng ta, sự thay đổi trong các mô hình lợi nhuận sẽ ảnh hưởng sâu sắc đến toàn xã hội. Gần đây, các nhà sản xuất bộ phận cấy ghép bắt đầu có xu hướng giới hạn một số tính năng cơ bản vào mô hình đăng ký trả phí. Nếu quên trả tiền, cơ thể cấy ghép có thể đột nhiên bị khóa, hoặc mất đi thị lực. Các tổ chức quyền lợi người tiêu dùng đang thúc giục chúng ta đưa ra biện pháp ngăn chặn hiện tượng này."
 cyber.625.a: "Cấm mô hình đăng ký trả phí đối với cấy ghép mạng."
 cyber.625.b: "Không mua nổi thì đừng dùng, đôi khi phải xem lại bản thân mình đi."
 cyber.625.c: "Giới hạn đăng ký trả phí ở những tính năng không thiết yếu."
 cyber.625.d: "Ý tưởng tuyệt vời! Tăng gấp đôi."
 cyber_subscription_ban: "Cấm đăng ký trả phí cấy ghép mạng"
 cyber_subscription_ban_desc: "Chúng ta cấm các nhà sản xuất cấy ghép mạng dùng mô hình đăng ký trả phí để khóa các tính năng của bộ cấy ghép."
 cyber_subscription_limited: "Đăng ký trả phí cấy ghép mạng giới hạn"
 cyber_subscription_limited_desc: "Chúng ta cấm các nhà sản xuất cấy ghép mạng dùng mô hình đăng ký trả phí để khóa các tính năng cốt lõi của bộ cấy ghép."
 cyber_subscription: "Loài có đặc điểm §Y$trait_cybernetic$§! nhận thêm các hiệu chỉnh sau:\n$t$Độ hạnh phúc: §R-5%§!\n$t$$BONUS_WORKFORCE_FOR$ cho ['concept_planet_traders']: §G+25%§!"
 cyber_subscription_megacorp: "Loài có đặc điểm §Y$trait_cybernetic$§! nhận thêm các hiệu chỉnh sau:\n$t$Độ hạnh phúc: §R-5%§!\n$t$$BONUS_WORKFORCE_FOR$ cho ['concept_planet_traders']: §G+50%§!"
 cyber.655.name: "Lỗi Máy móc Khó lường"
 cyber.655.desc: "Các kỹ sư cấy ghép mạng đã nghĩ ra một cơ hội kinh doanh hoàn toàn mới cho chúng ta. Bằng cách giảm nhẹ độ bền của các bộ phận cấy ghép, chúng ta có thể tận dụng nhu cầu cứng nhắc phải thay thế các bộ phận cần thiết của người dùng để nâng cao lợi nhuận một cách rõ rệt.\n\nBằng việc sử dụng hợp kim sinh học kém chất lượng ở những bộ phận bị bào mòn nhiều nhất mỗi ngày, bộ cấy ghép sẽ bị hỏng theo cách ít gây tổn hại cho người tiêu dùng nhất, từ đó tạo ra nhu cầu thay thế."
 cyber.655.a: "Thật là vô lý!"
 cyber.655.a.tt: "Chúng ta sẽ không cung cấp các linh kiện kém chất lượng cho công dân!\n\n"
 cyber.655.b: "Tuyệt đấy. Bắt đầu sản xuất các bộ phận cấy ghép \"mỏng nhẹ\" hơn thôi."
 cyber.655.c: "Chính xác! Nhân tiện thì tăng giá luôn một thể."
 cyber.655.d: "Sử dụng những dữ liệu này để đẩy nhanh tiến độ cấy ghép."
 worse_parts: "Linh kiện Kém chất lượng"
 worse_parts_desc: "Chúng ta cố tình chọn cung cấp các linh kiện cấy ghép kém chất lượng cho công dân, nghĩa là họ phải mua đồ thay thế thường xuyên hơn."
 worse_parts_effect_tt: "$r_trade$ sinh ra từ £pop£§Hnhân khẩu§! có đặc điểm §Y$trait_auto_mod_cyborg$§! của mỗi $pop_group_unit$: §G+0.5§!"
 optimized_parts: "Linh kiện Tối ưu hóa"
 optimized_parts_desc: "Chúng ta liên tục đổi mới và cải tiến các linh kiện cấy ghép, giúp cho quy trình lắp đặt trở nên đơn giản và nhanh chóng hơn."
 optimized_parts_effect_tt: "Phí bảo trì $r_energy$ đối với £pop£§Hnhân khẩu§! có đặc điểm §Y$trait_auto_mod_cyborg$§!: §R+0.1§!"
 cyber.660.name: "Lỗi Xã hội Khó lường"
 cyber.660.desc: "Dường như công dân đã nghe được những toan tính của chúng ta.\n\nHiện tại khắp các đường lớn ngõ nhỏ đều là những [Owner.GetSpeciesNamePlural] phẫn nộ, tố cáo những điều chỉnh gần đây của chúng ta về chất lượng và giá cả của các bộ phận cấy ghép. Họ cực lực yêu cầu chúng ta phải khôi phục lại như cũ."
 cyber.660.a: "Được rồi, thế này thì quả là tham quá đà."
 cyber.660.b: "Các người nói gì cơ? Ta—không—nghe—thấy—gì—cả!"
 cyber.660.c: "Chúng ta không nhất thiết phải..."
 discontent: "Bất mãn"
 discontent_desc: "Công dân của chúng ta đang rơi vào bạo loạn vì tình trạng cấy ghép mạng tăng giá và giảm chất lượng gần đây."
 cyber.805.name: "Kiểm soát của Phụ huynh"
 cyber.805.desc: "Các bậc giám hộ mong muốn có thể kiểm soát con cái nhiều hơn thông qua những bộ phận cấy ghép trong não trẻ sơ sinh. Hiện tại, việc tiếp quản các chức năng vận động chỉ giới hạn cho lực lượng cảnh sát sử dụng, nhưng một số người lại muốn trao quyền đó cho cả giám hộ của đứa trẻ.\n\nMặc dù điều này rõ ràng vi phạm quyền tự chủ thân thể, nhưng nhiều hình thức kiểm soát của phụ huynh khác đã được cho phép. Một giải pháp thay thế là cho phép kiểm soát có giới hạn, ví dụ như bắt những đứa trẻ cư xử không đúng mực phải đi chậm lại hoặc giảm âm lượng."
 cyber.805.a: "Hãy để phụ huynh kiểm soát tốt con cái họ."
 cyber.805.b: "Cho phép kiểm soát có giới hạn."
 cyber.805.c: "Vẫn nên chỉ giới hạn chức năng điều khiển cơ thể từ xa cho cơ quan thực thi pháp luật."
 cyber.810.name: "Truyền tải Tri thức"
 cyber.810.desc: "Sự phát triển về cấy ghép não mạng đã đem đến cho chúng ta một cơ hội đầy cám dỗ. Thay vì các phương pháp giảng dạy vừa chủ quan vừa chậm chạp, ta có thể truyền tải các kiến thức then chốt trực tiếp giữa các não bộ. Quá trình này đòi hỏi một môi trường phòng thí nghiệm vô trùng, nên không thể áp dụng trên quy mô lớn. Thông tin nhận được cũng sẽ ghi đè lên một phần ký ức cùng thể loại của người nhận.\n\nPhương thức ứng dụng có sức ảnh hưởng nhất là chia sẻ kiến thức giữa các nhà khoa học. Điều này có thể bù đắp phần nào gánh nặng nghiên cứu kỹ thuật từ quá trình cấy ghép, hoặc để ta tập trung vào các lĩnh vực khác."
 cyber.810.a: "Truyền tải kiến thức kỹ thuật."
 cyber.810.b: "Truyền tải kiến thức vật lý."
 cyber.810.c: "Truyền tải kiến thức xã hội học."
 cyber.810.d: "Hãy để mỗi người tự bảo vệ tâm trí của chính mình."
 cyber.815.name: "Tình yêu Rời rạc"
 cyber.815.desc: "Trong khi nhiều [root.GetSpeciesNamePlural] vui vẻ sử dụng các bộ cấy ghép có sẵn để cường hóa sinh hoạt thường ngày và các mối quan hệ xã giao, ngày càng có nhiều gia đình đa thê chuyển sang sử dụng các mạng lưới cá nhân đi kèm phần cứng tùy chỉnh. Những nhóm gia đình này chọn sống trong sự biệt lập được thiết kế riêng, chia sẻ cảm xúc và trải nghiệm cho nhau bằng sự thân mật độc nhất vô nhị.\n\nMột số hội nhóm phúc lợi xã hội và học giả tán dương hiện tượng này, cho rằng kiểu cường hóa được tùy chỉnh riêng cho các mối quan hệ và sợi dây gắn kết gia đình này có thể mang lại lợi ích cho tất cả mọi người. Dù vậy, cũng có người tỏ ra lo lắng trước lối sống ẩn dật này, thậm chí cho rằng hành vi này có thể khiến các cá nhân đánh mất chính mình trong “tổ hợp tình yêu” thu nhỏ đó."
 cyber.815.a: "Họ yêu ra sao, sống thế nào chúng ta không có quyền can thiệp."
 cyber.815.a.tt: "Chúng ta sẽ tiếp tục cho phép sử dụng phần cứng tùy chỉnh và không gian kỹ thuật số riêng tư."
 decentralized_families: "Gia đình Rời rạc"
 decentralized_families_desc: "Các gia đình thân thiết ở mọi loại hình đều có thể sử dụng phần mềm và tính năng cường hóa tùy chỉnh để làm phong phú thêm các mối quan hệ của họ."
 cyber.815.b: "Đưa những gia đình này đi vào khuôn khổ."
 cyber.815.b.tt: "Chúng ta không khuyến khích cường hóa tùy chỉnh, mà ủng hộ các phương án quản lý nghiêm ngặt hơn."
 centralized_families: "Gia đình Trung tâm hóa"
 centralized_families_desc: "Bằng cách thắt chặt quyền kiểm soát đối với phần mềm và cường hóa cấy ghép, ta hạn chế được việc các gia đình xây dựng chốn bồng lai kỹ thuật số." #as in a richly decorated but enclosed space
 cyber.820.name: "Ngoại hình Cực đoan"
 cyber.820.desc: "Trong suốt lịch sử của [root.GetSpeciesAdj], các tiểu văn hóa bên lề lúc nào cũng bám theo như hình với bóng. Với sự xuất hiện của công nghệ cường hóa cấy ghép, mọi thứ đã thay đổi: một số nhóm thiểu số bắt đầu tự cải tạo bản thân mạnh tay đến mức trông chẳng còn giống [root.GetSpeciesAdj] nữa. Đặc biệt là những người trẻ tuổi, khao khát được tùy chỉnh [root.GetSpeciesHandNamePlural] cực cao, xăm trổ 3D trên cơ thể và gắn thêm các phần phụ trang trí khác của họ đang khoét sâu thêm khoảng cách thế hệ.\n\nNhững người ủng hộ tuyên bố rằng họ đang đón nhận bản ngã thực sự của mình. Họ khẳng định tính chủ động trong sinh mệnh của mình bằng việc từ chối sự đồng nhất của [root.GetSpeciesAdj]. Nhưng ngày càng có nhiều phụ huynh và chuyên gia xã hội phản đối quan điểm này, họ lên án những người này là lũ du côn muốn phá hoại xã hội của chúng ta."
 cyber.820.a: "Ban hành các quy định nghiêm ngặt hơn đối với việc sửa đổi cơ thể."
 cyber.820.b: "Đây chỉ là hiện tượng nhất thời, rồi đâu sẽ vào đấy thôi."
 radical_image: "Ngoại hình Cực đoan"
 radical_image_desc: "Giới trẻ trong xã hội này đang ráo riết thử nghiệm những ngoại hình mới."
 cyber.820.c: "Từ những người trẻ này ta cũng ngộ ra được chút gì đó."
 radical_insights: "Cái nhìn Cực đoan"
 radical_insights_desc: "Lấy một số biến đổi cơ thể phản văn hóa làm ví dụ, xã hội này đang tự tiến hành các thử nghiệm trên ngoại hình của chính mình nhắm đến sự cường hóa thẩm mỹ kiểu mới."
 cyber.821.name: "Biểu tình Cực đoan"
 cyber.821.desc: "Hàng nghìn thanh niên, nhà hoạt động và nghệ sĩ đã tập trung lại để kêu gọi quyền tự do cường hóa cấy ghép. Trong số những người biểu tình, có người trông vẫn là [root.GetSpeciesNamePlural] bình thường, cũng có người gắn chân tay tùy chỉnh, cải tạo lại cơ thể, thậm chí có người trông y hệt người ngoài hành tinh. Họ đều đang lên tiếng ủng hộ những công dân [root.GetAdj] phải chịu sự kỳ thị vì những lựa chọn cá nhân liên quan đến phụ kiện cấy ghép trang trí."
 cyber.821.a: "Chúng ta sẽ không dao động."
 cyber.821.a.tt: "Chúng ta sẽ tiếp tục xây dựng một bầu không khí cấy ghép tập thể."
 radical_image_denied: "Cấm Ngoại hình Cực đoan"
 radical_image_denied_desc: "Những cuộc biểu tình gần đây về quyền tự do thể hiện bản thân thông qua cường hóa cấy ghép đang ngày càng căng thẳng."
 cyber.821.b: "Chúng ta nên xem xét yêu cầu của họ."
 cyber.821.b.tt: "Chúng ta sẽ trao cho cá nhân nhiều quyền tự do lựa chọn hơn liên quan đến cường hóa cấy ghép."
 radical_image_upheld: "Ủng hộ Ngoại hình Cực đoan"
 radical_image_upheld_desc: "Các cuộc biểu tình gần đây đã khiến chúng ta phải nhượng bộ một phần quyền tự do thể hiện bản thân thông qua các bộ phận cường hóa cấy ghép có thể nhìn thấy được."
 cyber.822.name: "Sinh lý Cực đoan"
 cyber.822.desc: "Các nhân viên y tế phàn nàn rằng họ đang phải đối mặt với những khó khăn kỳ quái chưa từng có khi điều trị cho những bệnh nhân sử dụng các bộ phận cường hóa cấy ghép vô cùng dị biệt.\n\nNhững cá nhân được chạm trổ công phu này, dù chỉ mắc phải những chứng bệnh lặt vặt, hầu hết đều cần sử dụng các biện pháp điều trị đặc thù, chẳng hạn như dùng công cụ tùy chỉnh hoặc tháo lắp mạnh tay. Chi phí cho các can thiệp như vậy thậm chí còn cao hơn so với những bệnh nhân không phải [root.GetSpeciesAdj] mà chưa qua chỉnh sửa."
 cyber.822.a: "Khoản chi phí này là hợp lý."
 cyber.822.b: "Cấp phép cho những thứ kỳ dị này đúng là sai lầm lớn."
 #Cold Metal
 cyber.830.name: "Thấp khớp Cấy ghép"
 cyber.830.desc: "Một bộ phận người dân đã được cường hóa báo cáo rằng họ cảm thấy đau nhức khi tiếp xúc với thời tiết lạnh. Tình trạng này đặc biệt nghiêm trọng trên §H[cold_planet.GetName]§!, bởi những đợt rét cắt da cắt thịt ở đó diễn ra như cơm bữa.\n\nNgười ta biết rằng kim loại cấy ghép thực sự sẽ gây khó chịu ở nhiệt độ thấp, nhưng chưa đến mức gây ra những phản ứng nghiêm trọng như vậy. Tình trạng này đã ảnh hưởng đến lực lượng lao động của chúng ta."
 cyber.830.a: "Tiến hành nghiên cứu y tế."
 cyber.830.b: "Nỗi đau của họ chẳng liên quan gì đến chúng ta."
 cyber.830.tooltip: "Thêm hiệu chỉnh sau vào đặc điểm loài §Y$trait_cybernetic$§!:$TABBED_NEW_LINE$Độ ở được trên Núi cao, Địa cực, Lãnh nguyên: §R-20%§!"
 COLD_METAL_PROJECT: "Kim loại Băng giá"
 COLD_METAL_PROJECT_DESC: "Những cư dân sống trong môi trường lạnh giá đã báo cáo các triệu chứng đau nhức liên quan đến bộ phận cấy ghép. Các thử nghiệm lâm sàng sẽ giúp ta thu thập thêm dữ liệu."
 cyber.835.name: "Báo cáo Y tế"
 cyber.835.desc: "Thử nghiệm lâm sàng không thể xác định được mối tương quan rõ ràng giữa việc linh kiện cấy ghép bị phơi nhiễm thời tiết lạnh với độ tuổi, giới tính, nghề nghiệp và loại thiết bị cấy ghép của các bệnh nhân bị ảnh hưởng.\n\nMột số chuyên gia y tế cho rằng cơn đau này bắt nguồn từ tâm lý, nên tập trung vào điều trị giảm đau và liệu pháp hành vi. Những người khác thì thúc giục chúng ta đừng coi thường vấn đề này, mà nên tài trợ cho một dự án để tìm ra phương án điều trị."
 cyber.835.a: "Đau đớn gì chứ, rõ ràng là đầu óc có vấn đề."
 cyber.835.b: "Khởi xướng dự án nghiên cứu."
 cyber.835.c: "Di dời những người bị ảnh hưởng đến những hành tinh ấm áp hơn."
 cyber.835.tooltip: "Loại bỏ hiệu chỉnh sau khỏi đặc điểm loài §Y$trait_cybernetic$§!:$TABBED_NEW_LINE$Độ ở được trên Núi cao, Địa cực, Lãnh nguyên: §R-20%§!"
 cyber.840.name: "Lòng Ta Hướng Về Đâu"
 cyber.840.desc: "Dân tộc ta từ thuở xa xưa đã là những lữ khách, những người chăn du mục và những kẻ lang thang. Với một số người, các chuyến đi chỉ là phương tiện để đến đích, nhưng với ta, chính chuyến đi mới là đích đến. Công nghệ cường hóa cơ thể giúp ta vươn tới những hành tinh mới dễ dàng hơn, nhưng cũng cho phép ta truy dấu những kẻ quá mức lệch chuẩn. Ấy là, không phải ai cũng hài lòng với sự thay đổi này.\n\nNgày càng có nhiều người bắt đầu can thiệp vào các bộ phận cấy ghép của họ, ngắt kết nối mạng lưới để bảo vệ quyền riêng tư. Dù hiện tại đây chỉ là một xu hướng nhỏ lẻ, nhưng nó có thể mang lại nhiều rắc rối."
 cyber.840.a: "Họ không sai. Cấm công nghệ theo dõi."
 cyber.840.b: "Cái này cũng chẳng có gì phải làm ầm lên."
 cyber.840.c: "Bán cho họ... những bộ cấy ghép không thể bị theo dõi."
 cyber.840.d: "Kìm hãm những kẻ bất đồng chính kiến này. Giữ công nghệ theo dõi."
 cyber_wanderers: "Kẻ Lang thang Không mệt mỏi"
 cyber_wanderers_desc: "Rất khó truy vết, chạy lung tung khắp nơi."
 cyber_wanderers_tracked: "Buộc dây dắt"
 cyber_wanderers_tracked_desc: "Người dân của chúng ta đề cao tự do, kịch liệt phản đối bất kỳ hình thức công nghệ theo dõi nào."
 cyber.855.name: "Nâng cao Thành tích" #Idiom: if you achieve a required score, you 'make the grade'; similar to 'make the cut'
 cyber.855.intro.desc: "Vi xử lý nhận thức, gia sư AI tăng cường, enzyme thiết kế kích thích tái tạo tính mềm dẻo của hệ thần kinh - tất cả những thứ này mới chỉ dành cho học sinh mẫu giáo."
 cyber.855.gov.desc: "$cyber.855.intro.desc$\n\nBắt kịp tốc độ phát triển công nghệ đã đặt một gánh nặng to lớn lên vai chương trình giáo dục quốc gia của chúng ta. Thế nhưng khoảng cách giữa những người chỉ có thể dựa dẫm vào các thiết bị cường hóa công cộng và những gia đình giàu có được hưởng thụ công nghệ tối tân nhất vẫn đang ngày càng nới rộng.\n\nDuy trì một hệ thống công bằng sẽ đòi hỏi ta phải rót lượng lớn tài nguyên vào một kế hoạch dài 5 năm."
 cyber.855.corp.desc: "$cyber.855.intro.desc$\n\nGiáo dục tốt có thể cực kỳ tốn kém, và nhiều người cảm thấy việc bám đuổi ngày càng trở nên khó khăn. Thế nhưng khoảng cách giữa những gia đình giàu có được hưởng thụ công nghệ cường hóa tối tân nhất và những người chỉ có thể dùng các mô-đun hàng bãi hoặc hàng nhái vẫn đang ngày càng nới rộng.\n\nĐể tránh tình trạng phân hóa xã hội thêm trầm trọng, việc thực hiện một khoản đầu tư lớn trong 5 năm cho hệ thống giáo dục là điều cần thiết."
 cyber.855.a: "Chi phí quá đắt đỏ."
 cyber.855.b: "Giáo dục nên mang lại lợi ích cho tất cả mọi người."
 cyber_education: "Giáo dục Cường hóa"
 cyber_education.tt: "Chúng ta sẽ khởi xướng một kế hoạch 5 năm nhằm tạo ra một hệ thống giáo dục mạnh mẽ và được cường hóa toàn diện."
 cyber.860.name: "Tính Ưu việt của Chủ nghĩa Bình đẳng"
 cyber.860.desc: "Khoản đầu tư của chúng ta vào các bộ phận cường hóa giáo dục đã đem lại lợi nhuận đáng kể.\n\nViệc mở cửa cho công chúng tiếp cận với các thiết bị cấy ghép chất lượng cao đã tạo ra một nền kỹ trị học thuật thực thụ, ở đó, dưới trật tự này, ai ai cũng có thể phát huy tối đa tiềm năng của mình, bất kể xuất thân từ tầng lớp xã hội nào. Những lợi ích này thể hiện đặc biệt rõ rệt trong lĩnh vực khoa học, nơi sản lượng nghiên cứu và mức độ đổi mới được nâng cao trên mọi phương diện."
 egalitarian_excellence: "Tính Ưu việt của Chủ nghĩa Bình đẳng"
 egalitarian_excellence.tt: "Một lực lượng dân cư được cường hóa và hưởng nền giáo dục cao là chìa khóa cho sự tiến bộ về mặt xã hội cũng như vật chất."
 cyber.865.name: "Lãnh đạo Kiệt xuất"
 cyber.865.desc: "Thực tế chứng minh, quyết định không dùng quỹ công để tài trợ cho các thiết bị cường hóa giáo dục là một quyết định sáng suốt.\n\nXã hội của chúng ta tôn vinh sự xuất sắc của cá nhân. Bất chấp những lời chỉ trích không ngớt về \"khoảng cách xã hội\" ngày càng lớn, cuộc cạnh tranh học thuật đã sàng lọc ra những nhà lãnh đạo được giáo dục tốt nhất và có năng suất cao nhất trong toàn dải ngân hà."
 exceptional_leaders: "Lãnh đạo Kiệt xuất"
 exceptional_leaders.tt: "Việc phát triển tài năng ở cấp độ cá nhân cho những cá thể có tư chất nhất đã tạo ra con đường để bồi dưỡng những nhà lãnh đạo với phẩm chất kiệt xuất."
 cyber.1005.name: "Phá Kỷ lục Mới"
 cyber.1005.desc: "Những tiêu đề như \"[Species.GetName] lại phá kỷ lục\" đã trở nên quen thuộc trên các bản tin thể thao của [Owner.GetAdjective]. Khi mà các [GetAthletePlural] ganh đua nhau sử dụng các bản độ mới hơn, phức tạp hơn để vượt mặt đối thủ, giới hạn năng lực thể chất cũng đang không ngừng bị phá vỡ.\n\nNgười hâm mộ các môn \"Thể thao Cường hóa\" vui mừng tột độ trước những kết quả này, nhưng ngày càng có nhiều fan cứng kêu gọi nên lập riêng các hạng mục cho vận động viên đã được cường hóa. Cũng có người mong muốn giới hạn số lượng người nhân tạo được phép tham gia các trận đấu đồng đội, để những [GetAthletePlural] thuần túy tự nhiên vẫn có chỗ đứng dưới ánh đèn sân khấu."
 cyber.1005.a: "Những người không qua sửa đổi đã từng có thời đại của riêng họ rồi."
 cyber.1005.a.tt: "Khuyến khích các vận động viên đã chỉnh sửa thúc đẩy đổi mới."
 cyber.1005.b: "Tách các vận động viên đã cường hóa sang một giải đấu riêng."
 cyber.1005.c: "Đặt giới hạn số lượng cho [GetAthletePlural] đã qua chỉnh sửa."
 cyber_athletes: "Vận động viên Cấy ghép"
 cyber_athletes_desc: "Thông qua việc khuyến khích các sự kiện thể thao dành cho vận động viên đã chỉnh sửa, chúng ta có thể thử nghiệm thực địa một số bộ phận cấy ghép mạng tân tiến."
 cyber_athlete_leagues: "Giải đấu cho Vận động viên Cấy ghép"
 cyber_athlete_leagues_desc: "Tách biệt vận động viên \"tự nhiên\" và vận động viên đã cường hóa có thể đảm bảo một môi trường cạnh tranh công bằng cho tất cả mọi người."
 limited_cyber_athletes: "Hạn chế Vận động viên Cấy ghép"
 limited_cyber_athletes_desc: "Giới hạn số lượng vận động viên đã chỉnh sửa có thể đảm bảo mọi đội tuyển đều có cơ hội giành chiến thắng."
 athlete_plural: "Vận động viên"
 cyber.1010.name: "Rao bán Bầu trời"
 cyber.1010.desc: "§Y[sky_megacorp.GetName]§! đã mang đến cho chúng ta một cơ hội sinh lời béo bở. Họ muốn quảng cáo cho một loại thức uống tăng lực hoàn toàn mới có tên là \"Plasma Quench\".\n\nQuảng cáo cho loại đồ uống này có thể được chiếu trực tiếp vào bộ phận cấy ghép thị giác của công dân chúng ta, chỉ cần ngước lên là thấy. Doanh thu kiếm được có thể được dùng cho vô số dự án công cộng.\n\nMặc dù hình thức quảng cáo này có tính xâm phạm, nhưng chúng tôi chắc chắn rằng bản thân thức uống này hoàn toàn ngon lành và vô hại."
 cyber.1010.a: "Mọi người cùng uống Plasma Quench nào!" #Feel free to localize Plasma Quench to sound like a slimy energy drink. No need to make it word for word.
 cyber.1010.b: "Bầu trời đâu phải để đem bán!"
 cyber.1010.c: "Bàn bạc điều khoản cái đã."
 cyber.1010.d: "Không hứng thú."
 cyber.1015.desc: "§Y[sky_megacorp.GetName]§! lại mang đến một đề xuất mới liên quan đến loại thức uống năng lượng phổ biến nhất toàn cõi ngân hà \"Plasma Quench\". Xét đến những thành công hiện tại của việc bán quảng cáo trên bầu trời nhân tạo cho cư dân đã qua cải tạo của chúng ta, họ yêu cầu đặt thêm quảng cáo ở những nơi khác trong thế giới thực.\n\n\"[most_populous.GetName] chính là địa điểm lý tưởng để chạy quảng cáo!\" Một phát ngôn viên của [sky_megacorp.GetName] cho biết. Rốt cuộc thì, chẳng phải sẽ công bằng hơn nếu ai cũng có cơ hội tiếp cận một cơ hội tuyệt vời như vậy hay sao?"
 cyber.1015.a: "Plasma Quench, lên xe chờ bạn!"
 cyber.1015.a.tt: "Xây dựng vô vàn bảng quảng cáo khổng lồ xung quanh §Y[most_populous.GetName]§!."
 cyber.1015.b: "Bầu trời kỹ thuật số của chúng ta là quá đủ rồi."
 cyber.1015.c: "Hãy trả lại tự do cho nhân dân ta!"
 sold_sky_1: "Bảng Quảng cáo Kỹ thuật số"
 sold_sky_1_desc: "Rao bán sự chú ý qua thị giác của công dân đúng là một ý tưởng tuyệt vời!"
 sold_sky_1_mega: "$sold_sky_1$"
 sold_sky_1_mega_desc: "$sold_sky_1_desc$"
 sold_sky_2: "Bảng Quảng cáo Hành tinh"
 sold_sky_2_desc: "Giới thượng lưu của hành tinh này quyết định bán bầu trời trong mắt người dân để kiếm thêm tài nguyên."
 sold_sky_2_mega: "$sold_sky_2$"
 sold_sky_2_mega_desc: "$sold_sky_2_desc$"
 cyber.1030.name: "Ký ức Bệnh hoạn"
 cyber.1030.desc: "Với sự hiện diện của vô số bộ phận cấy ghép có khả năng kiểm soát giác quan và trải nghiệm cảm xúc, các cá nhân đã qua cường hóa hiện nay ngày càng có xu hướng chìm đắm vào những hoạt động ảo để giải trí hay trốn tránh thực tại. Dù về lý thuyết, các nghệ sĩ cấy ghép ký ức có thể khơi gợi bất kỳ cảm xúc nào, nhưng trào lưu này đang dần nhuốm màu đen tối.\n\nCác câu lạc bộ cấy ghép ký ức đang thu mua với giá cao những đoạn ký ức tự thu mang trải nghiệm cảm xúc mãnh liệt, chẳng hạn như lễ cưới, nghi thức giao phối, tự tử, hành hung và án mạng. Hệ lụy là tỷ lệ tội phạm gia tăng, bọn tội phạm không chỉ phạm tội vì ký ức, mà còn đánh cắp luôn bộ phận cấy ghép của nạn nhân sau những sang chấn đó.\n\nChúng ta nên đối phó với mớ hỗn độn này như thế nào?"
 cyber.1030.a: "Dẹp bỏ ngành công nghiệp này. Quá sức nguy hiểm rồi."
 cyber.1030.a.tt: "Giải trí bằng cấy ghép ký ức sẽ bị đặt ngoài vòng pháp luật."
 cyber.1030.b: "Việc này phải đóng thuế."
 cyber.1030.b.tt: "Giải trí bằng cấy ghép ký ức sẽ trở thành một ngành tạo ra doanh thu."
 cyber.1030.c: "Bắt hết những kẻ lưu giữ loại bản ghi này lại."
 cyber.1030.c.tt: "Những kẻ ghi lại hành vi phạm tội sẽ bị trừng trị thích đáng."
 cyber.1030.d: "Nghe có vẻ đồi bại. Ta thích."
 cyber.1030.d.tt: "Tất cả các hình thức giải trí sẽ được nhà nước công nhận."
 cyber.1030.e: "Trải nghiệm cái chết vô tận sao? Thật thần thánh."
 cyber.1030.e.tt: "Điều này sẽ giúp các tu sĩ tử thần của chúng ta hiểu rõ hơn, từ đó dẫn dắt các thánh đồ người phàm tốt hơn."
 entertainment_crackdown: "Đàn áp Ký ức"
 entertainment_crackdown_desc: "Ghi lại ký ức để giải trí bị coi là phạm pháp, nhằm phòng ngừa các hành vi tội phạm tiềm ẩn."
 endorsed_entertainment: "Ủng hộ Ký ức"
 endorsed_entertainment_desc: "Dưới sự hậu thuẫn của nhà nước, trào lưu giải trí bằng cấy ghép ký ức đang làm mưa làm gió trên mọi ngóc ngách."
 illicit_entertainment: "Ký ức Bệnh hoạn"
 illicit_entertainment_desc: "Những bộ luật mới về giải trí bằng cấy ghép ký ức đã làm giảm nhu cầu của công chúng đối với dịch vụ này."
 decadent_entertainment: "Ký ức Đồi bại"
 decadent_entertainment_desc: "Người dân của chúng ta đang đắm chìm trong khoái cảm tột độ mà giải trí cấy ghép ký ức mang lại, cho đến khi bị một trào lưu khác soán ngôi."
 deadly_entertainment: "Ký ức Tử thần"
 deadly_entertainment_desc: "Các tu sĩ tử thần của chúng ta hiện đã có thể đích thân cảm nhận ranh giới sinh tử. Điều này hỗ trợ họ dẫn dắt mọi người, đặc biệt là các thánh đồ người phàm."
 cyber.1055.name: "Trò chơi Điệp viên"
 cyber.1055.desc: "Một học viên sĩ quan hải quân đã làm lộ thông tin mật, hành vi ngu ngốc của hắn khiến người ta phải chấn động. Vốn là một fan cứng của các phần mềm mô phỏng chiến đấu trên mạng, gã học viên này đã cự cãi với những người chơi khác về tốc độ xoay tháp pháo trên tàu khu trục của chúng ta.\n\nĐể chứng minh cho lập luận của mình, hắn thậm chí còn tải lên mạng vài bản thiết kế cơ mật của tàu chiến, những tài liệu này nhanh chóng lan truyền khắp mạng lưới ngân hà. Dù thủ phạm đã bị xử lý, nhưng vụ việc này đã khiến một số người trong nội các kêu gọi cấm triệt để các trò chơi trực tuyến."
 cyber.1055.a: "Dù sao thì hạm đội cũng đến lúc phải nâng cấp rồi."
 cyber.1055.b: "Thắt chặt các biện pháp an ninh mạng của chúng ta."
 cyber.1055.c: "Nội các nói đúng, cấm trò chơi điện tử đi."
 cyber.1055.d: "Nhấn chìm thông tin đó bằng những nội dung tự mâu thuẫn."
 cyber_breach_overcome: "Trò chơi Điệp viên: Nâng cấp Hạm đội"
 cyber_breach_overcome_desc: "Chuyện đã xảy ra thì cứ để nó xảy ra. Chúng ta sẽ cố gắng hiện đại hóa hạm đội hơn nữa, như vậy những bản thiết kế bị rò rỉ kia cũng chẳng còn giá trị gì."
 cyber_breach_forgive: "Trò chơi Điệp viên: Cải thiện An ninh"
 cyber_breach_forgive_desc: "Để đối phó với vụ rò rỉ thông tin, chúng ta đã cải thiện các điều khoản bảo mật. Điều này đồng nghĩa với việc game thủ sẽ không gây ra bất cứ đe dọa nào đến an ninh quốc gia. Chẳng việc gì chúng ta phải phản ứng thái quá vì một sai sót ngu ngốc như vậy."
 cyber_breach_ban: "Trò chơi Điệp viên: Lệnh Cấm Toàn diện"
 cyber_breach_ban_desc: "Ngoài việc tăng cường an ninh vận hành, chúng ta còn tiến thêm một bước là cấm luôn các trò chơi trực tuyến."
 cyber.1055.leak.tt: "Toàn bộ thành viên của §YCộng đồng Ngân hà§! sẽ nhận được thông tin tình báo §YQuân sự§! mức §HTrug bình§! về §Y[Root.GetName]§! trong §Y720§! ngày."
 cyber.1055.minorleak.tt: "Toàn bộ thành viên của §YCộng đồng Ngân hà§! sẽ nhận được thông tin tình báo §YQuân sự§! mức §RThấp§! về §Y[Root.GetName]§! trong §Y360§! ngày."
 has_tradition_subterfuge_tt: "Lựa chọn này được mở khóa nhờ ta đã hoàn thành cây truyền thống §YÂm mưu§!."
 cyber.1205.name: "Kiểm duyệt Giác quan"
 cyber.1205.desc: "Thế hệ bộ phận cấy ghép giác quan mới nhất cho phép người dùng chặn những cảm giác không mong muốn. Bao gồm cả những mùi khó chịu, hình ảnh không đứng đắn, v.v., tất cả đều có thể bị làm mờ, che đậy, thậm chí bị xóa sổ hoàn toàn khỏi nhận thức của người dùng. Các hội nhóm bảo thủ hơn trong xã hội đang ngày càng quan ngại rằng chế độ kiểm duyệt này sẽ tác động xấu đến lương tri của công dân nước nhà."
 cyber.1205.a: "Chúng ta phải đối diện với sự thật của cuộc sống."
 cyber.1205.b: "Mọi người đều có quyền được hưởng đặc ân của sự thiếu hiểu biết."
 cyber.1205.c: "Việc kết xuất lại để tô điểm thì còn nghe được, chứ rủi ro từ việc kiểm duyệt là quá lớn."
 cyber.1205.d: "Chúng ta sẽ thu xếp ổn thỏa giác quan của họ."
 cyber_censure_truth: "Kiểm duyệt Giác quan: Vô hiệu hóa"
 cyber_censure_truth_desc: "Cấm sử dụng các bộ lọc nhận thức có khả năng ngăn cản các yếu tố của đời thực. Bất kể lúc nào cũng phải trực diện đối mặt với thực tế."
 cyber_censure_total: "Kiểm duyệt Giác quan: Toàn diện"
 cyber_censure_total_desc: "Nếu hiện thực thật đáng khó chịu, thì cớ sao ta không chặn đứng luôn những yếu tố xấu xa đó đi? Chẳng có lý do gì phải chứng kiến những hình ảnh về tội ác, bi kịch hay định kiến cả."
 cyber_censure_partial: "Kết xuất lại Giác quan"
 cyber_censure_partial_desc: "Chúng ta cho phép mọi người sử dụng chức năng kết xuất nhận thức của thiết bị cấy ghép. Họ có thể truyền thêm những màu sắc sống động vào cuộc sống đơn điệu này."
 cyber_censure_authoritarian: "Nhà nước Kiểm duyệt Giác quan"
 cyber_censure_authoritarian_desc: "Chúng ta đang thao túng cách nhân viên nhìn nhận thực tế. Bằng việc ngăn chặn những nhân vật và thông tin mang tính chất bất đồng chính kiến khỏi cuộc sống của các công dân trung thành, ta có thể bảo vệ họ khỏi sự ảnh hưởng của những kẻ gieo rắc sự lầm lạc."
 cyber.1210.name: "Tin nhắn Xâm nhập Tiềm thức"
 cyber.1210.desc: "Gần đây, các quảng cáo của những doanh nghiệp đầy tham vọng và các phong trào ngầm đang có xu hướng lén lút cấy thông tin vào bộ phận cấy ghép của người dùng. Những ký ức giả mạo, phản ứng hormone có chọn lọc và các gợi ý cho giấc ngủ đang ngày càng trở nên phổ biến. Các chính trị gia tỏ ra quan ngại sâu sắc và đã đưa vấn đề này lên cho chúng ta, đồng thời ủng hộ việc cấm những tin nhắn mang tính xâm nhập này, hoặc chí ít là phải đưa chúng vào diện quản lý."
 cyber.1210.a: "Quyết không dung thứ cho hành vi này."
 cyber.1210.b: "Thật tuyệt vời! Phê duyệt."
 cyber.1210.c: "Đưa hành vi này vào quản lý."
 cyber.1210.d: "Dùng nó để truyền bá tín ngưỡng."
 cyber_subliminhack_banned: "Tin nhắn Xâm nhập Tiềm thức: Vô hiệu hóa"
 cyber_subliminhack_banned_desc: "Chúng ta nghiêm cấm việc truyền tải lén lút các thông điệp tiềm thức này thông qua các bộ phận cấy ghép."
 cyber_subliminhack_allowed: "Tin nhắn Xâm nhập Tiềm thức: Cho phép"
 cyber_subliminhack_allowed_desc: "Chúng ta cho phép việc truyền tải lén lút các thông điệp tiềm thức này thông qua các bộ phận cấy ghép. Mọi thứ trên thị trường đều bình đẳng."
 cyber_subliminhack_licensed: "Tin nhắn Xâm nhập Tiềm thức: Cấp phép Quản lý"
 cyber_subliminhack_licensed_desc: "Chúng ta bán giấy phép chứng nhận cho việc truyền tải lén lút các thông điệp tiềm thức này thông qua các bộ phận cấy ghép."
 cyber_subliminhack_hallowed: "Tin mừng Tiềm thức"
 cyber_subliminhack_hallowed_desc: "Chúng ta sẽ sử dụng công nghệ tin nhắn xâm nhập tiềm thức để truyền bá đức tin."
 cyber.1255.name: "Lỗ hổng Bảo mật Cấy ghép"
 cyber.1255.intro: "Gần đây, một vài tài liệu mật đã bị tải xuống trái phép bởi một máy chủ từ xa. Nhân viên an ninh của chúng ta một mực khẳng định rằng tất cả các tường lửa chính và tường lửa phụ đều còn nguyên vẹn, và cho đến thời điểm hiện tại vẫn không tìm thấy bằng chứng nào về các cuộc tấn công mạng từ bên ngoài.\n\n"
 cyber.1255.gov.desc: "$cyber.1255.intro$Nhưng kết luận là không thể trốn tránh: Có nội gián trà trộn trong chúng ta, và dựa theo độ nhạy cảm của thông tin bị đánh cắp, hắn chắc chắn phải nắm giữ quyền hạn rất cao."
 cyber.1255.hack.desc: "$cyber.1255.intro$Nhưng kết luận là không thể trốn tránh: Chúng ta có một lỗ hổng — lỗ hổng này khiến quyết định chấp nhận các thiết bị cường hóa cấy ghép mã nguồn mở của chúng ta bị đặt dấu chấm hỏi."
 cyber.1255.a: "Mở một cuộc điều tra."
 leak_investigation: "Điều tra Rò rỉ"
 leak_investigation_desc: "Để tìm ra lỗ hổng, chúng ta cần phải điều tra tất cả những người đã lắp đặt thiết bị cấy ghép. Quá trình này rất có khả năng sẽ khá là... có tính xâm phạm."
 cyber.1260.name: "Vu thuật Thần kinh"
 cyber.1260.desc: "Cuộc điều tra về lỗ hổng bảo mật cấy ghép đã có kết luận.\n\nChúng ta đã khoanh vùng được một loại thiết bị cường hóa và một số quan chức cấp cao của chính phủ, phần ướt thần kinh học của họ đã bị xâm phạm. Đặc vụ nước ngoài đã tiến hành thao túng và ép họ hành động trái với ý muốn, những cá nhân này không hề có một chút ký ức nào về các sự kiện kể trên.\n\nMặc dù đã biết nguyên nhân gây rò rỉ, nhưng chúng ta vẫn chưa tìm ra được ai — hay thứ gì — đã thực hiện vụ đánh cắp bí mật này. Tuy nhiên, bằng cách bí mật cấy những thông tin giả vào ý thức của những quan chức bị ảnh hưởng, có thể chúng ta sẽ truy ngược lại được nguồn gốc của vụ trộm."
 leak_distrust: "Con rối ngay bên cạnh"
 leak_distrust_desc: "Khi bất cứ ai trong chúng ta cũng có thể là con rối, thì làm sao có thể trông chờ nhân dân tin tưởng vào giới lãnh đạo của chúng ta được nữa?"
 leader_trait_hacked: "Con rối Cấy ghép"
 leader_trait_hacked_desc: "Nhà lãnh đạo này đã bị tổn hại, phần ướt thần kinh học của họ đã bị một nguồn tấn công ẩn danh xâm nhập."
 hacked_leaders.tt: "Một lượng ngẫu nhiên các nhà lãnh đạo mạng nhận được đặc điểm §Y$leader_trait_hacked$§!."
 cyber.1265.name: "Kẻ Bắt cóc Tâm trí" #Playing on the word 'hijacker'
 cyber.1265.desc: "Tìm thấy rồi.\n\nNhững tên tội phạm nấp sau vụ tấn công mạng vô tiền khoáng hậu này đã bị phát hiện. Những kẻ tự xưng là \"Kẻ bắt cóc tâm trí\" này chẳng có mục đích nào khác ngoài việc gieo rắc sự hỗn loạn, chúng có thể dễ dàng qua mặt các hệ thống bảo mật của chúng ta. Dù kẻ chủ mưu đã bị bắt giữ, nhưng ta vẫn phải quyết định xem nên xử lý thế nào với các quan chức bị xâm hại của mình.\n\nGiải pháp đơn giản nhất là cài đặt tường lửa tùy chỉnh xung quanh các bộ cấy ghép bị ảnh hưởng. Và một lựa chọn khác gọn gàng hơn nhưng cũng rủi ro hơn là Khởi động lại Cứng: Xâm nhập vào các chức năng nhận thức cơ bản của những nhà lãnh đạo kể trên, cài đặt lại hệ điều hành, trong thời gian đó những người này sẽ bị buộc phải \"tắt máy\"."
 cyber.1265.a: "Thiết lập tường lửa."
 cyber.1265.b: "Cài lại hệ thống cho những nhà lãnh đạo này."
 cyber.1265.c: "Chúng ta bị kẻ trộm dòm ngó rồi. Thiết lập tường lửa."
 cyber.1270.name: "Cài lại Hệ thống; Đạt được Cuộc sống Mới"
 cyber.1270.desc: "Quá trình Khởi động lại Cứng lên các quan chức bị xâm nhập đã gây ra một số hậu quả ngoài ý muốn: dù xóa sạch mọi dấu vết bị xâm nhập thần kinh, một phần lớn kiến thức và kinh nghiệm tích lũy của họ cũng trôi vào dĩ vãng.\n\nTuy gặp phải thất bại, nhưng trong quá trình \"làm lại từ đầu\", những nhà lãnh đạo này cho biết bản thân họ đã thực sự lột xác cả về mặt chuyên môn lẫn cá nhân. Bằng việc ép chúng ta phải áp dụng một biện pháp quyết liệt đến vậy, bọn hacker có lẽ đã vô tình giúp chúng ta một tay."
 rebooted_leaders: "Loại bỏ tất cả các §Hđặc điểm tiêu cực§! của những nhà lãnh đạo có đặc điểm §Y$leader_trait_hacked$§!.\nMỗi đặc điểm bị loại bỏ gây mất §R300§! điểm kinh nghiệm."
 leader_hack_resolution: "Giải quyết Cảnh giác"
 cyber.1275.name: "Tường lửa Thần kinh"
 cyber.1275.desc: "Ý thức của chúng ta đã được an toàn.\n\nCác kỹ sư phần ướt đã thiết kế thành công bức tường lửa thần kinh học. Để duy trì sự an toàn cho tập thể, chúng ta và tất cả các quan chức trong tương lai sẽ ngay lập tức được cài đặt các chương trình này. Dù có ảnh hưởng nhất định đến các chức năng nhận thức cơ bản của tầng lớp lãnh đạo, nhưng dự án này cũng mang đến những hiểu biết vượt bậc cho ngành khoa học bảo mật dữ liệu."
 cyber.1275.a: "An toàn là trên hết."
 leader_trait_firewalled: "Tường lửa Thần kinh"
 leader_trait_firewalled_desc: "Dù có khả năng chống lại các cuộc tấn công mạng, nhưng hiệu suất học tập của nhà lãnh đạo nước ta đã bị suy giảm."
 hacked_and_firewalled_leaders.tt: "Tất cả các nhà lãnh đạo mạng sẽ bị loại bỏ đặc điểm §Y$leader_trait_hacked$§! và được thêm đặc điểm §Y$leader_trait_firewalled$§!."
 #SỰ KIỆN CUỐI CÙNG #
 #DÂN CHỦ
 cyber.1505.name: "Xã hội 2.0"
 cyber.1505.desc.individualist: "Tiến trình dân chủ là nền móng của xã hội này, hiển nhiên việc củng cố nền tảng này là một lựa chọn sáng suốt. Bộ cấy ghép mạng mới cho phép chúng ta tiến hành bỏ phiếu cho mọi vấn đề xã hội từ lớn đến nhỏ, đem đến cho mỗi cá nhân cơ hội chưa từng có để cất lên tiếng nói của mình. Điều này mang lại một kho tàng dữ liệu cùng tiềm năng lớn đến mức không thể tưởng tượng nổi."
 cyber.1505.desc.collectivist: "Việc công khai truyền bá suy nghĩ của mình cho những đồng bào §Y[Species.GetNamePlural]§! khác thoạt nghe có vẻ là một viễn cảnh tồi tệ. Nhưng sự kinh ngạc ban đầu sẽ nhanh chóng bị thay thế bởi sự tự tin cùng cảm giác nắm chắc vào môi trường xung quanh. Chúng ta biết những người bên cạnh đang làm gì, và ngược lại. Không cần nói năng, chỉ cần thoáng nghĩ là có thể giao tiếp trong chớp mắt. Để bảo vệ sự minh mẫn cho tâm trí này, chức năng cảm xúc của não mạng sẽ bị ra lệnh vô hiệu hóa, nhằm tránh việc những thông tin quan trọng bị nhấn chìm."
 cyber.1505.desc.neutral: "Bất chấp vô số cuộc tham vấn, bỏ phiếu và các cuộc thảo luận sôi nổi, quốc gia này vẫn chưa đưa ra được quyết định về vấn đề cường hóa cấy ghép xã hội. Để tránh việc quy trình này biến thành một cuộc tranh cãi chia rẽ, tầng lớp lãnh đạo buộc phải can thiệp.\n\nChúng ta có thể nắm lấy cơ hội này để sửa đổi các bộ phận cấy ghép, phục vụ cho tiến trình dân chủ, hoặc thực hiện một phương thức cực đoan hơn: để cho mọi người chia sẻ suy nghĩ thông qua thiết bị cấy ghép của họ. Phương thức sau sẽ đòi hỏi phải kìm hãm những cảm xúc cơ bản của não mạng, ngăn không cho những dòng suy nghĩ bộc phát mãnh liệt của một cá nhân làm náo loạn những người xung quanh."
 cyber.1505.a: "Kích hoạt bỏ phiếu qua não mạng theo thời gian thực."
 cyber.1505.a.tt: "$change_auth_tt$['concept_auth_cyber_democratic_individualist']\n$unlock_edict_legislative_chorus$"
 cyber.1505.b: "Liên kết các não mạng lại để chia sẻ trải nghiệm."
 cyber.1505.b.tt: "$change_auth_tt$['concept_auth_cyber_democratic_collectivist']\n$unlock_edict_self_preservation_override$"
 cyber.1505.c: "$cyber_keep_auth_option$"
 cyber.1505.c.tt: "$keep_auth_tt$['concept_auth_democratic']"
 #TẬP ĐOÀN ĐẦU SỎ
 cyber.1510.name: "Tái cấu trúc Quyền lực"
 cyber.1510.desc.individualist: "Rõ ràng là, đại chúng đều muốn vươn lên giành vị trí dẫn đầu và cạnh tranh lẫn nhau. Để đáp ứng hành vi siêu cạnh tranh này, chúng ta đã thiết lập một hệ thống giống như trò chơi, dùng lời hứa hẹn về địa vị xã hội và những phần thưởng nhỏ nhặt để đánh đổi lấy sự gia tăng năng suất, đồng thời làm thỏa mãn khát vọng của họ."
 cyber.1510.desc.collectivist: "Nhận thức tập thể mà con người có thể cảm nhận quan trọng hơn sự cơ động xã hội của từng cá nhân. Do đó, chúng ta sẽ khai thác triệt để tiềm năng của bộ não cường hóa trong lúc ngủ, thay vì tận dụng bản năng cạnh tranh của họ. Truyền tải năng lực tính toán thông qua đường kết nối cấy ghép mạng không dây đến trạm gốc, chỉ định các nhiệm vụ tính toán cho họ trong suốt thời gian nghỉ ngơi."
 cyber.1510.desc.neutral: "Người dân của chúng ta từ chối thể hiện lập trường về việc xã hội nên trở nên cạnh tranh hơn hay hợp tác hơn. Và với tư cách là cấp trên của họ, chúng ta giờ đây sẽ quyết định phương án tốt nhất thay họ.\n\nChúng ta có thể tạo ra một hệ thống được trò chơi hóa đầy tính cạnh tranh, trong đó những cá nhân thể hiện xuất sắc hơn đồng nghiệp sẽ có cơ hội thăng tiến trong sự nghiệp, hoặc cũng có thể khai thác sức mạnh tính toán của toàn cộng đồng thông qua kết nối cấy ghép mạng, liên kết bộ não của họ với các trang trại máy chủ trong lúc họ đang say giấc."
 cyber.1510.a: "Hãy để chúng tranh đoạt, ghen ghét lẫn nhau."
 cyber.1510.a.tt: "$change_auth_tt$['concept_auth_cyber_oligarchic_individualist']\n$unlock_edict_battle_royale$"
 cyber.1510.b: "Bắt chúng làm việc trong lúc ngủ."
 cyber.1510.b.tt: "$change_auth_tt$['concept_auth_cyber_oligarchic_collectivist']\n$unlock_edict_stately_acclaim$"
 cyber.1510.c: "$cyber_keep_auth_option$"
 cyber.1510.c.tt: "$keep_auth_tt$['concept_auth_oligarchic']"
 #ĐỘC TÀI
 cyber.1515.name: "Kiểm soát Đám đông"
 cyber.1515.desc.individualist: "Người dân §Y[Species.GetAdj]§! đang dần học cách chấp nhận một thế giới nơi thiết bị cường hóa có thể giúp họ thể hiện bản thân theo vô vàn cách mới mẻ.\n\nNhưng sự khoan dung này chỉ là vỏ bọc, thuật toán giám sát tăng cường bên trong thiết bị cấy ghép hiện đang theo dõi nhất cử nhất động của từng người, nó có thể phát hiện ra những suy nghĩ lệch lạc ngay khi các khớp nối thần kinh liên kết với nhau."
 cyber.1515.desc.collectivist: "Đứng trước nguy nan, chỉ có sự đoàn kết. Mỗi một §Y[Species.GetAdj]§! mang trong mình thiết bị cấy ghép mạng cường hóa đều đang đấu tranh vì một tương lai tươi sáng hơn, và họ tin rằng những người xung quanh cũng sẽ làm như vậy.\n\nSở hữu ý chí sắt đá và nhân cách ngời sáng, §Y[Ruler.GetName][Ruler.GetTitle]§! sẽ đưa nhân dân ta tiến bước, họ có thể hoàn toàn yên tâm về điều này."
 cyber.1515.desc.neutral: "Trong lúc nhân dân vẫn còn đang phân vân lưỡng lự trước ngã ba đường, §Y[Ruler.GetName][Ruler.GetTitle]§! của chúng ta phải chớp lấy cơ hội ngàn vàng mà công cuộc cường hóa mang lại và đưa ra phán quyết.\n\nNên để cho người dân của ta giữ lại đôi chút tự do ý chí với điều kiện phải chịu sự giám sát từ bộ cấy ghép, hay nên để họ bị chi phối hoàn toàn bởi ý chí rực sáng của nhà lãnh đạo."
 cyber.1515.a: "Cho họ chút tự do có chừng mực dưới sự giám sát."
 cyber.1515.a.tt: "$change_auth_tt$['concept_auth_cyber_dictatorial_individualist']\n$unlock_edict_self_indictment_protocol$"
 cyber.1515.b: "Nhà lãnh đạo sẽ dẫn dắt chúng ta."
 cyber.1515.b.official.tt: "$change_auth_tt$['concept_auth_cyber_dictatorial_collectivist_official']\n$unlock_edict_love_letter_virus$"
 cyber.1515.b.commander.tt: "$change_auth_tt$['concept_auth_cyber_dictatorial_collectivist_commander']\n$unlock_edict_love_letter_virus$"
 cyber.1515.b.scientist.tt: "$change_auth_tt$['concept_auth_cyber_dictatorial_collectivist_scientist']\n$unlock_edict_love_letter_virus$"
 cyber.1515.b.vacant.tt: "$change_auth_tt$['concept_auth_cyber_dictatorial_collectivist_vacant']\n$unlock_edict_love_letter_virus$"
 cyber.1515.c: "$cyber_keep_auth_option$"
 cyber.1515.c.tt: "$keep_auth_tt$['concept_auth_dictatorial']"
 #ĐẾ CHẾ
 cyber.1520.name: "Đế chế Vạn tuế"
 cyber.1520.desc.individualist: "Hoàng đế đã ban chiếu chỉ yêu cầu chúng ta phải dồn toàn bộ nguồn lực vào chính vương triều. Một con chip đặc biệt mang tên §Y$r_the_rulerchip$§! sẽ được cấy vào mỗi vị quân vương tương lai, nhằm lưu giữ và chuyển giao kinh nghiệm của họ trong suốt quãng thời gian trị vì với tư cách là [root.GetRulerTitle] của §Y[root.GetName]§!.\n\nCùng với sự truyền đời của $r_the_rulerchip$, kho tàng kinh nghiệm khổng lồ mà nó chứa đựng sẽ trở thành bản ghi chép quan trọng cho xã hội của chúng ta. Ngoài ra, ta cũng có thể tận dụng tri thức của thần dân để tăng cường sức mạnh cho các nhà lãnh đạo."
 cyber.1520.desc.collectivist: "Để xua tan bớt nhọc nhằn cho công dân đế quốc, chúng ta phải xây dựng một §Y$building_cyberdome$§! tráng lệ tại §Y[root.Capital.GetName]§!. Nơi đây sẽ trở thành địa điểm tổ chức các môn thể thao cấy ghép tân tiến, nơi các vận động viên được cường hóa sẽ đua tài đọ sức để đổi lấy sự mến mộ và sùng bái từ chúng ta. Việc chứng kiến một cuộc tranh tài đỉnh cao như vậy chắc chắn sẽ khơi dậy sự sùng bái của công chúng đối với §Y[root.GetName]§!.\n\nNgoài ra, những cảnh tượng này có thể được phát trực tiếp đến các bộ não mạng trên toàn cõi đế chế, thôi thúc đám đông cuồng nhiệt đổ xô về [root.Capital.GetName] để tự mình cảm nhận sự kích thích đầy hoang dại của hành vi này."
 cyber.1520.desc.neutral: "Sự phát triển cấy ghép mạng trong xã hội chúng ta đã đi đến ngã ba đường. Ta có thể cống hiến để mang lại phúc lợi cho thiểu số hoặc đại chúng. Dù chọn ngả nào thì cũng sẽ mang lại lợi ích cho §Y[root.GetName]§!.\n\nViệc phát triển một bộ phận cấy ghép chuyên dụng cho phép chúng ta truyền lại kinh nghiệm của [root.GetRulerTitle] cho đời sau. Trong khi tập trung phát triển các môn thể thao cường hóa và công nghệ phát sóng sẽ giúp ta tổ chức những sự kiện quy mô hoành tráng tại thủ đô [root.Capital.GetName]."
 cyber.1520.a: "Lưu truyền tri thức của Hoàng đế."
 cyber.1520.a.tt: "$change_auth_tt$['concept_auth_cyber_imperial_individualist']\n$create_relic_the_rulerchip$\n$unlock_edict_levied_experience$"
 cyber.1520.b: "Tổ chức và phát sóng thể thao cấy ghép tại thủ đô."
 cyber.1520.b.tt: "$change_auth_tt$['concept_auth_cyber_imperial_collectivist']\n$unlock_building_cyberdome$\n$unlock_edict_neurocasted_spectacles$"
 cyber.1520.c: "$cyber_keep_auth_option$"
 cyber.1520.c.tt: "$keep_auth_tt$['concept_auth_imperial']"
 #TẬP ĐOÀN
 cyber.1525.name: "Cổ phần Cấy ghép"
 cyber.1525.desc.individualist: "Nhóm tập trung §Y[Species.GetAdj]§! đã phản hồi rất tích cực về các bộ cấy ghép mắt mới của họ. Bộ phận phân tích của chúng ta cho rằng, hiệu quả quảng cáo đã tăng lên rõ rệt, và doanh số của toàn bộ danh mục sản phẩm được kỳ vọng sẽ tăng trưởng mạnh mẽ. Điều này cho thấy tiềm năng to lớn đối với đợt ra mắt sản phẩm hoàn chỉnh sắp tới.\n\nKỷ nguyên mạng đã điểm, và chúng ta đã chuẩn bị sẵn sàng một chiến lược doanh nghiệp hoàn toàn mới để trục lợi từ đó."
 cyber.1525.desc.collectivist: "Cam kết của chúng ta về sự hoàn thiện bản thân một cách tổng thể đã nhận được sự đồng cảm của đại chúng.\n\nQuan tâm đến các vấn đề kinh tế xã hội bám sát tầm nhìn doanh nghiệp của chúng ta, đảm bảo rằng những thiết bị cấy ghép thiết yếu luôn được đổi mới không ngừng."
 cyber.1525.desc.neutral: "Xét đến những thay đổi to lớn mà công nghệ cấy ghép mạng mang lại cho xã hội, việc người tiêu dùng thông thường trăn trở giữa các hướng đi có lẽ cũng không có gì đáng ngạc nhiên. Liệu ta nên lấy khác biệt cá nhân làm tiêu chuẩn, hay nên quan tâm nhiều hơn đến phúc lợi tập thể?\n\nLựa chọn mang tính then chốt và chưa từng có tiền lệ này chắc chắn sẽ gây ra những tác động vô cùng sâu sắc, nhưng sự thiếu quyết đoán sẽ dẫn đến tổn thất lợi nhuận; ta phải nhanh chóng đưa ra quyết định."
 cyber.1525.a: "Ra mắt bộ cấy ghép hỗ trợ quảng cáo."
 cyber.1525.a.tt: "$change_auth_tt$['concept_auth_cyber_corporate_individualist']\n$unlock_edict_customer_insights$"
 cyber.1525.b: "Phổ cập việc nâng cấp bộ phận cấy ghép."
 cyber.1525.b.tt: "$change_auth_tt$['concept_auth_cyber_corporate_collectivist']\n$unlock_edict_rolling_updates$\n$unlock_agenda_augmentation_product_launch$"
 cyber.1525.c: "$cyber_keep_auth_option$"
 cyber.1525.c.tt: "$keep_auth_tt$['concept_auth_corporate']"
 ### SOCIETAL EFFECTS EVENT CHAIN END ###
 ### CYBERIZATION SITUATION START - HIVE VARIANT ###
 situation_cyberization_hive: "Cấy ghép mạng"
 situation_cyberization_hive_type: "Cục diện Phi thăng"
 situation_cyberization_hive_desc: "Tâm trí tổ ong đòi hỏi những cơ thể siêu việt. Với các thiết bị cấy ghép mạng, chúng ta có thể cải tiến, cường hóa và tái định hình các ong thợ.\nĐã đến lúc vượt qua những giới hạn sinh học của bản thân.\n\n§YSố dân nhận được bộ phận cấy ghép vào tháng sau§!: §G[From.GetCyberPopsPerMonth]§!"
 situation_cyberization_hive_monthly_change_tooltip: "Cơ thể của chúng ta sẽ biến thành một mạng lưới, một sự dung hợp hoàn mỹ giữa hữu cơ và máy móc."
 situation_cyberization_hive_outcome: "Cấy ghép mạng cho người dân."
 stage_cyberization_hive_effects: "Chúng ta phải tự thiết kế và lắp đặt các bộ phận cấy ghép mạng để tiến hành quá trình tự chuyển đổi."
 cyber.hive_government_shift.tt: "Ảnh hưởng đến §YBiến đổi Nhận thức Cấy ghép§! đang diễn ra."
 situation_cyberization_culled_drones_desc: "Đào thải ong thợ khiếm khuyết"
 situation_cyberization_researching_alternatives_desc: "Nghiên cứu các thiết bị cấy ghép thay thế"
 situation_cyberization_hive_triggered_modifier: "Cục diện §Y$situation_cyberization_hive$§! nhận thêm hiệu chỉnh:\n"
 triggered_opinion_hive_integrated: "Tổ ong Nhất thể hóa"
 cyber_hive_imperfect_drones: "Ong thợ Không hoàn hảo"
 cyber_hive_imperfect_drones_desc: "Mỗi một cá thể đều có ích."
 cyber_hive_recycling_implants: "Tái chế Bộ phận Cấy ghép"
 cyber_hive_recycling_implants_desc: "Các bộ phận cấy ghép cũ có thể được lắp cho những ong thợ mới."
 cyber_hive_recycling_everything: "Hiệu quả Cực đoan"
 cyber_hive_recycling_everything_desc: "Không có thứ gì là thiêng liêng, và cũng chẳng có thứ gì phải lãng phí cả."
 cyber_hive_cyber_babies: "Ấu trùng Cấy ghép"
 cyber_hive_cyber_babies_desc: "Các ong thợ mới sẽ được trang bị bộ phận cấy ghép ngay từ lúc mới sinh."
 cyber_hive_no_cyber_babies: "Cấy ghép Từng bước"
 cyber_hive_no_cyber_babies_desc: "Thiết bị cấy ghép được lắp đặt theo từng giai đoạn, nhằm giảm thiểu tổn thương cho ong thợ vẫn còn đang trong giai đoạn phát triển."
 cyber_hive_no_individual_drones: "Nghiêm cấm Nhận dạng Cá nhân"
 cyber_hive_no_individual_drones_desc: "Nghiêm cấm tuyệt đối mọi sự nhận dạng cá nhân."
 cyber_hive_individual_drones: "Thể hiện Bản thân"
 cyber_hive_individual_drones_desc: "Cho phép ong thợ bộc lộ cá tính."
 cyber_hive_individual_leader_drones: "Thể hiện Bản thân Có giới hạn"
 cyber_hive_individual_leader_drones_desc: "Trao cho những ong thợ giỏi nhất của chúng ta món quà quý giá nhất: Sự tự nhận thức."
 ### AUTHORITIES ###
 #VOLITIONAL
 auth_cyber_hive_volitional: "Tổ ong Ý chí"
 auth_cyber_hive_volitional_desc: "Mỗi một ong thợ đều là một cá thể độc lập. Mỗi một ý nghĩ đều là một góc nhìn mới đóng góp cho tâm trí tập thể. Tập hợp từ vô vàn ý chí trong tổ ong sẽ vượt xa sức mạnh của tổng từng thành phần đơn lẻ cộng lại."
 concept_auth_cyber_hive_volitional: "$auth_cyber_hive_volitional$"
 gov_cyber_hive_volitional: "$auth_cyber_hive_volitional$"
 gov_cyber_hive_volitional_desc: "$auth_cyber_hive_volitional_desc$"
 #INTEGRATED
 auth_cyber_hive_integrated: "Tổ ong Nhất thể hóa"
 auth_cyber_hive_integrated_desc: "Mọi sự sai lệch đều được nắn lại, mọi dị thường đều bị kiểm soát, mọi mầm mống chia rẽ đều được tái hòa nhập. Tâm trí tổ ong giành được quyền kiểm soát tuyệt đối: ý thức chung này sở hữu vô vàn thân xác để thi hành ý chí của nó."
 concept_auth_cyber_hive_integrated: "$auth_cyber_hive_integrated$"
 gov_cyber_hive_integrated: "$auth_cyber_hive_integrated$"
 gov_cyber_hive_integrated_desc: "$auth_cyber_hive_integrated_desc$"
 ### EDICTS ###
 edict_hive_mind_outreach: "Tâm trí Tổ ong Vươn xa"
 edict_hive_mind_outreach_desc: "Tốc độ xuyên thấu ý chí của một tâm thức kiên định có thể còn nhanh hơn cả ánh sáng."
 concept_edict_hive_mind_outreach: "$edict_hive_mind_outreach$"
 edict_hive_hyper_stimulants: "Siêu kích thích"
 edict_hive_hyper_stimulants_desc: "Thiết bị cấy ghép mạng có thể tự động quản lý các loại thuốc cường hóa cho ong thợ để nâng cao hiệu suất của chúng."
 concept_edict_hive_hyper_stimulants: "$edict_hive_hyper_stimulants$"
 edict_hive_mega_construction: "Tổ hợp Kiến trúc Khổng lồ"
 edict_hive_mega_construction_desc: "Sắc lệnh này sẽ phân bổ thêm tài nguyên cho các dự án kiến trúc khổng lồ của chúng ta, qua đó đẩy nhanh tiến độ xây dựng những kiến trúc mới trong hệ sao."
 concept_edict_hive_mega_construction: "$edict_hive_mega_construction$"
 #GIAI ĐOẠN CẤY GHÉP MẠNG 1
 cyber.2100.name: "Thân xác vô vàn, ý chí độc nhất."
 cyber.2100.desc: "Khi ngẫm nghĩ về bản chất của sự cường hóa, chúng ta nhận ra mình cũng đang khám phá những khao khát của bản thân.\n\nCấy ghép mạng là một công cụ để đạt được mục đích: một cách để tối ưu hóa cơ thể nhằm thực thi ý chí tốt hơn. Có thể cường hóa vô hạn, mỗi phần cường hóa sẽ mang lại lợi thế mới, nhưng cũng đi kèm những đòi hỏi mới. Chân tay máy móc rất nặng, não mạng cần nhiều năng lượng hơn, các bộ phận tinh vi cũng cần được bảo trì liên tục. Trên con đường vươn tới sự hoàn hảo, chúng ta buộc phải đưa ra lựa chọn.\n\nĐể vượt qua giới hạn của [Owner.Species.GetFleshTypeCyberCreed] và để [owner.GetSpeciesHandName] cơ khí hóa vươn tới các vì sao, tham vọng của chúng ta rốt cuộc nên nhắm vào đâu?"
 cyber.2100.a: "Thấu hiểu."
 cyber.2100.a.tt: "Tập trung nghiên cứu để nâng cao trí tuệ cho ong thợ."
 cyber.2100.b: "Thống trị."
 cyber.2100.b.tt: "Tập trung nghiên cứu để biến ong thợ thành công cụ chiến tranh."
 cyber.2100.c: "Trù phú."
 cyber.2100.c.tt: "Tập trung nghiên cứu để ong thợ làm việc năng suất hơn."
 #GIAI ĐOẠN CẤY GHÉP MẠNG 2
 cyber.2200.name: "Mục tiêu độc nhất: Cường hóa"
 cyber.2200.desc: "Khi những dòng suy nghĩ mông lung biến thành kế hoạch cụ thể, một nhu cầu cấp thiết đã xuất hiện: một không gian chuyên dùng để thử nghiệm, kiểm tra và chế tạo các nguyên mẫu cấy ghép mạng.\n\nChúng ta sẽ xây dựng một $building_augmentation_center$, để có thể tháo rời [Owner.Species.GetFleshTypeCyberCreed] của mình ra, rồi dùng kim loại và ước mơ để đan dệt chúng lại với nhau."
 cyber.2200.a: "Đã đến lúc bắt tay vào xây dựng tương lai."
 cyber.2200.a.tt: "§RYêu cầu hành động:§!\nXây dựng một $building_augmentation_center$ để cục diện §Y$situation_cyberization_hive$§! được tiếp tục.\n\nMỗi $building_augmentation_center$ cung cấp §G+200§! công việc $job_augmentor_drone_with_icon$.\n\n$job_augmentor_drone_research_effect_desc$"
 cyber.2205.name: "Nguyên mẫu vô vàn, chỉ chọn một."
 cyber.2205.desc: "Quá trình nghiên cứu cấy ghép của chúng ta đã tạo ra nhiều nguyên mẫu đầy triển vọng để lựa chọn. Kết quả ban đầu cho thấy, một số nguyên mẫu vượt trội về sức mạnh thể chất, trong khi số khác lại phù hợp hơn với các công việc đòi hỏi sự tỉ mỉ. Mỗi loại đều có điểm mạnh và hạn chế riêng, không có loại nào chiếm ưu thế tuyệt đối.\n\nMột đề xuất đáng sợ chợt hiện lên trong tâm trí chúng ta: liệu ta có thể làm cho các cá thể con trở nên đa dạng, thay đổi cơ thể dựa trên các chức năng khác nhau? Chúng ta có thể sẽ không còn hoàn toàn giống nhau nữa. Một tương lai như vậy thật khó kiểm soát, nhưng có lẽ nó xứng đáng để đánh đổi lấy sự gia tăng hiệu quả cho toàn bộ tập thể."
 cyber.2205.a: "Chọn nhiều nguyên mẫu khác nhau."
 cyber.2205.b: "Chọn một nguyên mẫu toàn diện."
 cyber.2220.name: "Đây cũng có thể là đồng loại của chúng ta sao?"
 cyber.2220.desc: "Trong quá trình lắp ráp ong thợ, thỉnh thoảng sẽ xuất hiện những cơ thể khiếm khuyết. Thông thường, những ong thợ dị tật này sẽ bị đem đi tiêu hủy, nhưng nhờ có thiết bị cấy ghép mạng, chúng vẫn có thể gia nhập vào hàng ngũ của chúng ta. Tăng quân số là điều tốt, nhưng ong thợ bị lỗi cần được cấy ghép riêng biệt tùy theo mức độ nghiêm trọng của vấn đề. Tổ ong của chúng ta sẽ phát triển nhanh hơn, nhưng cũng sẽ trở nên... bớt hoàn hảo hơn."
 cyber.2220.a: "Càng đông càng mạnh."
 cyber.2220.b: "Khiếm khuyết sẽ làm tổ ong suy yếu."
 cyber.2260.name: "Vấn đề tiềm ẩn"
 cyber.2260.desc: "Một nhóm nhỏ đối tượng thử nghiệm đã gặp phải phản ứng phụ với quá trình cường hóa. Cơ thể chúng đào thải bộ phận cấy ghép, dẫn đến những biến chứng đe dọa tính mạng. Nguyên nhân có vẻ là do một khiếm khuyết di truyền chưa từng được phát hiện trước đây. Theo tính toán sơ bộ, khoảng 5% dân số ong thợ sẽ bị ảnh hưởng.\n\nSau khi xác định được vấn đề, giờ đây chúng ta có thể sàng lọc ong thợ để phòng ngừa, nhưng lại không biết phải xử trí ra sao với những cá thể đã bị ảnh hưởng."
 cyber.2260.a: "Đào thải những ong thợ khiếm khuyết."
 cyber.2260.a.tt: "Tốc độ tiến triển của cục diện §Y$situation_cyberization_hive$§! trong §Y1§! năm tiếp theo: §G+20%§!"
 cyber.2260.b: "Lắp đặt bộ phận cấy ghép giới hạn cho những ong thợ khiếm khuyết."
 cyber.2260.b.tt: "Trong quá trình cấy ghép mạng, 5% dân số sẽ nhận đặc điểm §Y$trait_limited_cybernetic$§! thay vì đặc điểm §Y$trait_cybernetic$§!."
 cyber.2260.c: "Nghiên cứu bộ phận cấy ghép thay thế."
 cyber.2260.c.tt: "Tốc độ tiến triển của cục diện §Y$situation_cyberization_hive$§! trong §Y5§! năm tiếp theo: §R-50%§!"
 #GIAI ĐOẠN CẤY GHÉP MẠNG 3
 cyber.2300.name: "Ong thợ vô vàn, kế hoạch độc nhất."
 cyber.2300.desc: "Các nguyên mẫu cấy ghép của chúng ta đã được phê duyệt, và §Y$building_augmentation_center$§! cũng đã xây xong. Kế hoạch đã đâu vào đấy, chỉ còn lại khâu hậu cần cho quá trình chuyển đổi là chưa được chốt hạ.\n\nChúng ta có thể ra lệnh cho toàn bộ ong thợ đi đến $building_augmentation_center$ để tiến hành chuyển đổi, tạm gác lại mọi hoạt động thường ngày của chúng. Quá trình này sẽ diễn ra rất nhanh, nhưng trong thời gian đó toàn bộ các nhà máy sẽ phải ngừng hoạt động. Hoặc ta cũng có thể sắp xếp lại lịch trình của ong thợ, tiến hành chuyển đổi cấy ghép trong thời gian nghỉ ngơi bắt buộc của chúng để tránh làm gián đoạn sinh hoạt thường ngày. Cách làm này dù chậm hơn một chút, nhưng mức độ ảnh hưởng cũng ít hơn."
 cyber.2300.shared.tt: "$job_augmentor_drone_assembly_effect_desc$\n\nTốc độ cường hóa phụ thuộc vào phương án giải quyết cục diện và số lượng công trình $building_augmentation_center$."
 cyber.2300.a: "Ưu tiên cấy ghép mạng."
 cyber.2300.a.tt: "Dân số được cấy ghép mỗi tháng: §G+200§!\n$situation_cyberization_hive_triggered_modifier$Tài nguyên mỗi tháng: §R-5%§!\n\n$cyber.2300.shared.tt$"
 cyber.2300.b: "Đừng làm xáo trộn trật tự của chúng ta."
 cyber.2300.b.tt: "Số lượng dân cư cấy ghép mỗi tháng: §R-100§!\n$situation_cyberization_hive_triggered_modifier$$unity$ mỗi tháng: §G+5%§!\n\n$cyber.2300.shared.tt$"
 cyber.2320.name: "Kẻ gieo rắc sợ hãi"
 cyber.2320.desc: "Các đế chế bao gồm những cá thể đơn lẻ đang nhìn chúng ta bằng con mắt dò xét, chúng run sợ trước quân số đông đảo của ta. Thế nhưng, các thiết bị cấy ghép mạng có thể mang đến cho các đặc phái viên của ta diện mạo và cá tính độc đáo hơn, giúp họ mang một vẻ ngoài bớt đi sự đồng nhất.\n\nNhững quốc gia phân mảnh này rồi sẽ cảm kích trước nỗ lực của chúng ta, thậm chí có thể bắt đầu... đồng cảm với ta, coi chúng ta là đồng loại của chúng."
 cyber.2320.a: "Thật kinh tởm."
 cyber.2320.b: "Sự hy sinh cần thiết."
 cyber.2320.b.tt: "Tăng đánh giá của các đế chế không phải Gestalt đối với chúng ta."
 cyber.2320.c: "Làm cho các đặc phái viên của chúng ta trở nên hoàn toàn giống nhau."
 cyber.2320.c.tt: "Giảm đánh giá của các đế chế không phải Gestalt đối với chúng ta."
 cyber.2360.name: "Một dân tộc, hai quần thể"
 cyber.2360.desc: "Công cuộc cấy ghép mạng của tổ ong đang diễn ra vô cùng thuận lợi. Một bộ phận dân cư hiện đã được trang bị thiết bị cấy ghép, trong khi số còn lại vẫn là cơ thể sinh học thuần túy. Chưa bao giờ chúng ta được nếm trải sự khác biệt mãnh liệt đến vậy ngay trên chính cơ thể mình. Giờ đây, ong thợ đã có thể nhận thức bản thân thuộc về những nhóm khác nhau, và cảm giác chia rẽ này đang khơi dậy ý thức cá nhân trong chúng.\n\nMột số ong thợ bắt đầu tự gắn thêm những phụ kiện nhỏ để trang trí cho bản thân, hoặc vẽ các ký hiệu đặc biệt lên thiết bị cấy ghép để phân biệt lẫn nhau. Quả là một bước tiến thú vị nhưng cũng đầy đáng lo ngại."
 cyber.2360.a: "Khuyến khích sự phát triển này."
 cyber.2360.b: "Nghiêm cấm nhận dạng cá nhân."
 cyber.2360.c: "Chỉ giới hạn cho lãnh đạo sử dụng ký hiệu cá nhân."
 #GIAI ĐOẠN CẤY GHÉP MẠNG 4
 cyber.2400.name: "Suy nghĩ vô vàn, bộ não độc nhất."
 cyber.2400.desc: "Việc cấy ghép thần kinh đã gây ra những tác động ngoài dự kiến đối với ong thợ: do não bộ đã biến thành một nửa là máy móc, chúng hiện có thể nảy sinh ý thức cá nhân độc lập với ý thức chính của chúng ta.\n\nChúng ta có thể tiếp tục phát triển công nghệ này để nâng cao khả năng suy nghĩ tự chủ cho ong thợ."
 cyber.2400.a: "Hãy để ong thợ của chúng ta tự suy nghĩ."
 cyber.2400.b: "Chủ nghĩa cá nhân là một mối đe dọa đối với sự đoàn kết của chúng ta."
 cyber.2420.name: "Điểm đến cuối cùng của tất cả"
 cyber.2420.desc: "Các bộ phận cấy ghép mạng đã khiến cho cái chết trở thành một vấn đề phức tạp.\n\nTháo dỡ thiết bị cấy ghép từ xác ong thợ cho phép ta tái chế chúng và giảm thiểu lãng phí. Toàn bộ quy trình xử lý rác thải của chúng ta cần được tối ưu hóa để tương thích với bước tiến mới này; việc này sẽ tiêu tốn khá nhiều tài nguyên."
 cyber.2420.a: "Tái chế thiết bị cấy ghép."
 cyber.2420.b: "Chẳng đáng để phải tốn công nhọc sức như vậy."
 cyber.2420.c: "Tái chế thiết bị cấy ghép... và cả cái vỏ bọc."
 cyber.2460.name: "Bộ phận cấy ghép đi theo cả đời"
 cyber.2460.desc: "Dân số hiện tại của chúng ta đang từng bước tiến hành cấy ghép mạng vững chắc, nhưng ta cần phải thiết lập một quy trình dành cho những sinh mệnh chưa chào đời.\n\nVới trình độ khoa học kỹ thuật hiện tại, ta thậm chí có thể lắp đặt thiết bị cấy ghép cho [owner.Species.GetSpawnNamePlural] ngay từ lúc chưa sinh ra, qua đó tạo ra một giống loài cấy ghép mạng đúng nghĩa: phương án này vừa nhanh chóng, dễ dàng lại vô cùng hiệu quả. Ở một khía cạnh khác, các nghiên cứu sơ bộ cho thấy việc cấy ghép từ giai đoạn quá sớm có thể gây ra tâm thần phân liệt, chứng loạn trí, run rẩy và hàng loạt rối loạn phát triển khác."
 cyber.2460.a: "Kim loại bền vững hơn [Owner.Species.GetFleshTypeCyberCreed]."
 cyber.2460.b: "Thiết lập giới hạn độ tuổi tối thiểu cho việc cấy ghép mạng."
 #CẤY GHÉP MẠNG HOÀN TẤT
 cyber.2004.name: "Ong thợ vô vàn, ý chí độc nhất?"
 cyber.2004.desc: "Quá trình chuyển đổi đã hoàn tất. Các bộ phận cấy ghép mạng đã trải qua các bước thử nghiệm, tạo hình nguyên mẫu, tối ưu hóa, mài giũa cẩn thận và được lắp đặt thành công, biến đổi cơ thể chúng ta trở thành một phiên bản hoàn mỹ."
 cyber.2004.desc.volitional: "$cyber.2004.desc$\n\nOng thợ của chúng ta hiện đã có năng lực tư duy cá nhân mạnh mẽ hơn — thêm tự do cũng đồng nghĩa với việc mở ra những khả năng mới."
 cyber.2004.desc.integrated: "$cyber.2004.desc$\n\nOng thợ của chúng ta đoàn kết hơn bao giờ hết, những sợi dây liên kết bằng kim loại đã củng cố thêm mối gắn kết về mặt ý thức."
 cyber.2004.desc.neutral: "$cyber.2004.desc$\n\nTrong quá trình này, chúng ta đã nhìn thấy những cơ hội để thay đổi. Sự đoàn kết tạo nên sức mạnh, nhưng việc có thêm những ong thợ tự chủ cũng mang lại những lợi thế nhất định."
 cyber.2004.end: "Cùng với sự tiến hóa của cơ thể, ý thức tổ ong của chúng ta cũng có thể lột xác."
 cyber.2004.a: "Trở thành một Tổ ong Ý chí."
 cyber.2004.a.tt: "$change_auth_tt$['concept_auth_cyber_hive_volitional']\n$unlock_edict_tt$['concept_edict_hive_mind_outreach']\n$unlock_edict_tt$['concept_edict_hive_mega_construction']\n$cyber.21.a.end$"
 cyber.2004.b: "Trở thành một Tổ ong Nhất thể hóa."
 cyber.2004.b.tt: "$change_auth_tt$['concept_auth_cyber_hive_integrated']\n$unlock_edict_tt$['concept_edict_hive_hyper_stimulants']\n$unlock_edict_tt$['concept_edict_hive_mega_construction']\n$cyber.21.a.end$"
 cyber.2004.c: "Không cần thiết phải thay đổi."
 cyber.2004.c.tt: "$cyber.21.a.end$\n$keep_auth_tt$['concept_auth_hive_mind']"
 ### Cấy ghép Mạng cho Kẻ Đồng hóa Máy móc ###
 cyber.2010.name: "Hiển lộ Ý đồ"
 cyber.2010.desc: "Sự xuất hiện của công nghệ cấy ghép tiên tiến đã giúp chúng ta nhận ra tiềm năng tối thượng của mình. Cho đến nay, những gì ta chạm tới mới chỉ là phần nổi của tảng băng chìm.\n\nCùng với sự tích lũy về kiến thức chuyên môn và tiến bộ trong khoa học kỹ thuật, xã hội của chúng ta chắc chắn sẽ có sự chuyển biến. Việc dung hợp toàn diện các sinh mệnh có trí tuệ là một sứ mệnh tất yếu.\n\nKháng cự là vô ích. Tâm trí của toàn cõi ngân hà rồi sẽ thuộc về chúng ta."
 cyber.2015.name: "Kẻ Đồng hóa Tiên tiến"
 cyber.2015.desc: "Sau khi dung hợp với máy móc, các cư dân hữu cơ của chúng ta đã đạt đến trạng thái gần như hoàn mỹ. Giờ đây đã đến lúc lồng ghép luôn cả cấy ghép mạng vào kiến trúc văn minh của ta.\n\nViệc đơn giản hóa sự nhạy bén trong suy nghĩ của người dân bị đồng hóa có thể giúp ta tạo ra \"Ký ức Tổng hợp\", tận dụng những trải nghiệm tập thể của họ để cải thiện năng lực hậu cần. Hoặc, ta có thể thúc đẩy việc tạo ra một \"Dàn hợp xướng Thần kinh\", cho phép nảy sinh nhiều khác biệt hơn trong suy nghĩ cũng như phản ứng cảm xúc.\n\nDù chọn cách nào, tương lai của chúng ta chắc chắn cũng sẽ chịu những ảnh hưởng vô cùng sâu sắc."
 cyber.2015.a: "Dung hợp suy nghĩ của chúng ta."
 cyber.2015.a.tt: "$change_auth_tt$['concept_auth_memory_aggregator']\n\n§YTài nguyên§! sinh ra từ việc đồng hóa £pop£§Hnhân khẩu hữu cơ§! sẽ tiếp tục được gia tăng\n\n$unlock_edict_tt$['concept_edict_aggregated_memory']"
 cyber.2015.b: "Cất lên khúc hợp xướng nào."
 cyber.2015.b.tt: "$change_auth_tt$['concept_auth_neural_chorus']\n\n$unlock_edict_tt$['concept_edict_choral_harmony']"
 cyber.2015.c: "Chúng ta phải duy trì trạng thái như hiện tại."
 cyber.2015.c.tt: "$keep_auth_tt$['concept_auth_machine_intelligence']"
 gov_memory_aggregator: "Bộ Tổng hợp Ký ức"
 gov_memory_aggregator_desc: "Bằng việc đơn giản hóa sự nhạy bén trong suy nghĩ của người dân bị đồng hóa, \"Ký ức Tổng hợp\" sẽ được hình thành, giúp chúng ta cải thiện vô cùng hiệu quả mọi nhiệm vụ hành chính và hậu cần."
 auth_memory_aggregator: "Bộ Tổng hợp Ký ức"
 auth_memory_aggregator_desc: "$gov_memory_aggregator_desc$"
 auth_memory_aggregator_tt: "Tài nguyên sinh ra từ việc đồng hóa £pop£§Hnhân khẩu hữu cơ§! đã được gia tăng thêm."
 gov_neural_chorus: "Dàn hợp xướng Thần kinh"
 gov_neural_chorus_desc: "Cho phép nảy sinh nhiều khác biệt hơn trong suy nghĩ và biên độ dao động cảm xúc lớn hơn sẽ góp phần kiến tạo nên một \"Dàn hợp xướng Thần kinh\" — một bản hùng ca vĩ đại của tư duy, mạnh mẽ và tuyệt mỹ."
 auth_neural_chorus: "Dàn hợp xướng Thần kinh"
 auth_neural_chorus_desc: "$gov_neural_chorus_desc$"
 auth_driven_neural_chorus_tt: "Cấp độ ban đầu của lãnh đạo cấy ghép: §G+1§!$NEW_LINE$Phí bảo trì lãnh đạo cấy ghép: §G-25%§!$NEW_LINE$£unity£$unity$ sinh ra từ nhân khẩu cấy ghép: §G+0.1§!"
 concept_auth_memory_aggregator: "$gov_memory_aggregator$"
 concept_auth_neural_chorus: "$gov_neural_chorus$"
 edict_aggregated_memory: "Ký ức Tổng hợp"
 edict_aggregated_memory_desc: "Ký ức của những người bị đồng hóa tuôn trào như dòng thác lũ. Trải nghiệm tập thể của họ sẽ trở thành sức mạnh phục vụ cho chúng ta."
 edict_choral_harmony: "Cộng hưởng Hài hòa"
 edict_choral_harmony_desc: "Muốn tạo nên một bản nhạc thì phải có bè phối; hãy để ý thức của những thần dân bị dung hợp kết lại thành một khối."
 concept_edict_aggregated_memory: "$edict_aggregated_memory$"
 concept_edict_choral_harmony: "$edict_choral_harmony$"
