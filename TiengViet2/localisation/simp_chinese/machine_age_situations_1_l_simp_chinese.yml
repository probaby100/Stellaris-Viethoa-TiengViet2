 trait_limited_cybernetic: "Cấy ghép Máy móc Một phần"
 trait_limited_cybernetic_desc: "Loài này chỉ có số lượng bộ phận cấy ghép tối thiểu miễn cưỡng đủ để thích nghi với nhu cầu của một xã hội máy móc hóa."
 leader_trait_limited_cyborg: "Người máy Bán phần"
 leader_trait_limited_cyborg_desc: "Nhà lãnh đạo này chỉ có số lượng bộ phận cấy ghép tối thiểu miễn cưỡng đủ để thích nghi với nhu cầu của một xã hội máy móc hóa."
