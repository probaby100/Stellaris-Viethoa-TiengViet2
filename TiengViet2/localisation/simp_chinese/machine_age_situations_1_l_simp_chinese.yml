 # Đầu sỏ Máy móc Chủ nghĩa Tập thể
 auth_cyber_oligarchic_collectivist: "Chế độ Đầu sỏ Mộng du"
 auth_cyber_oligarchic_collectivist_desc: "Sự tiến bộ của các phần mềm ướt gần đây đã biến việc kiểm soát giấc ngủ trở nên khả thi. Các đường dẫn thần kinh của đối tượng thử nghiệm được kết nối với máy chủ, máy chủ sẽ nạp vào não bộ các tác vụ tính toán, hoặc ra lệnh cho cơ thể họ thực hiện các công việc lặp đi lặp lại. Đây chính xác là nghĩa đen của cụm từ “làm việc trong mơ”."
