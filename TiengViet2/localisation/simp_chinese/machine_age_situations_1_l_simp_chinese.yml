 auth_cyber_dictatorial_individualist: "Chế độ Độc tài Giám sát mạng"
 auth_cyber_dictatorial_individualist_desc: "Việc cấy ghép bắt buộc đã cung cấp cho chúng ta một công cụ kiểm soát và thực thi pháp luật mạnh mẽ, tăng cường sự quản lý của chế độ đối với thần dân của nó. Các bộ phận cấy ghép thường được gọi là “Chip độc tài” này có thể theo dõi vật chủ của chúng, và tự động cảnh báo cho chính quyền khi phát hiện có vấn đề."
