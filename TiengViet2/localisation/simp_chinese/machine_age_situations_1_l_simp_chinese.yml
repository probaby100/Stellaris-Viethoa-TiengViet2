 auth_cyber_imperial_individualist: "Chế độ Đế quốc Chip"
 auth_cyber_imperial_individualist_desc: "Người thừa kế được chỉ định của ngai vàng không chỉ thừa kế mỗi ngai vàng, mà còn là bộ phận cấy ghép độc quyền được truyền từ đời này sang đời khác. Bên trong đó chứa đựng một kho tàng kiến thức vô giá được tích lũy bởi tổ tiên, truyền đạt lại các loại trí tuệ về cách cai trị quốc gia. Công nghệ tương tự cũng được sử dụng ở quy mô nhỏ hơn trên toàn đế quốc, để những người khác cũng có thể truyền lại kinh nghiệm một cách tương tự."
