 # Chỉ số điều chỉnh cố định
 borrowed_research: "Đánh cắp Kiến thức"
 borrowed_research_desc: "Các thành quả nghiên cứu đánh cắp được đã hòa nhập vào quá trình cấy ghép máy móc, mang theo một vài sự oán hận."
 researcher_media_relations: "Phân tán Kinh phí Nghiên cứu"
 researcher_media_relations_desc: "Kinh phí nghiên cứu đã bị phân tán vào quan hệ công chúng."
 bad_publicity: "Khủng hoảng Truyền thông"
 bad_publicity_desc: "Một bộ phim nổi tiếng đã khiến công chúng có góc nhìn tiêu cực về kế hoạch của chính quyền."
 state_censorship: "Kiểm duyệt Quốc gia"
 state_censorship_desc: "Cách đối xử khắc nghiệt với những người bất đồng chính kiến đã kích động sự bất mãn."
 cyber_state_censorship: "Kiểm duyệt Máy móc"
 cyber_state_censorship_desc: "Việc cấm một bộ phim dài tập được yêu thích đã làm bùng nổ sự phẫn nộ của mọi người đối với việc lạm quyền của chính phủ."
 cyber_victim_compensation: "Đền bù cho Nạn nhân"
 cyber_victim_compensation_desc: "Tiến hành đền bù cho gia đình của các nạn nhân trong cuộc thử nghiệm nâng cấp thất bại."
 cyber_anti_faith: "Trái tim Sắt đá"
 cyber_anti_faith_desc: "Chúng ta đã gạt bỏ sự mập mờ về tín ngưỡng, thúc đẩy sáng kiến cấy ghép máy móc của mình mà không hề chậm trễ."
 cyber_rulers_force_tests: "Cưỡng ép Giới tinh hoa làm Đối tượng Thử nghiệm"
 cyber_rulers_force_tests_desc: "$cyber_everyone_force_tests_desc$"
 cyber_specialists_force_tests: "Cưỡng ép Chuyên gia làm Đối tượng Thử nghiệm"
 cyber_specialists_force_tests_desc: "$cyber_everyone_force_tests_desc$"
 cyber_workers_force_tests: "Cưỡng ép Công nhân làm Đối tượng Thử nghiệm"
 cyber_workers_force_tests_desc: "$cyber_everyone_force_tests_desc$"
 cyber_everyone_force_tests: "Cưỡng ép Đối tượng Thử nghiệm"
 cyber_everyone_force_tests_desc: "Việc bắt buộc tuyển chọn đối tượng thử nghiệm sẽ giúp chúng ta hoàn thành mục tiêu dễ dàng hơn."
 cyber_birth_implants: "Nuôi con bằng Máy móc"
 cyber_birth_implants_desc: "Trẻ nhỏ sẽ được tiếp nhận nâng cấp từ công nghệ máy móc từ rất sớm."
 cyber_natural_childhood: "Tuổi thơ Tự nhiên"
 cyber_natural_childhood_desc: "Thanh thiếu niên được phát triển tự do mà không chịu sự can thiệp của việc nâng cấp."
 AI_control: "Trí tuệ Nhân tạo Giám sát"
 AI_control_desc: "Phản ứng khớp thần kinh được tăng cường bởi trí tuệ nhân tạo giúp hướng dẫn mọi người tham gia vào các nhiệm vụ sản xuất."
 moderate_AI_control: "$AI_control$"
 moderate_AI_control_desc: "$AI_control_desc$"
 AI_forced_control: "Trí tuệ Nhân tạo Kiểm soát"
 AI_forced_control_desc: "Các bộ phận cấy ghép chèn sâu vào trung tâm ra quyết định của não bộ cho phép chính phủ tiến hành quản lý ở mức độ cao."
 media_blockade: "Phong tỏa Truyền thông"
 media_blockade_desc: "Việc phong tỏa hoàn toàn các phương tiện truyền thông có thể dập tắt những lời chỉ trích nhắm vào các mục tiêu của chính phủ."
 helping_hand: "Người giúp sức"
 helping_hand_desc: "Tất nhiên là càng nhiều tay chân càng tốt rồi, đặc biệt là trong phòng thí nghiệm."
 armed_forces: "Ba đầu Sáu tay"
 armed_forces_desc: "Việc nâng cấp bổ sung bộ phận cơ thể đã tăng cường sức mạnh cho quân đội."
 state_handouts: "Bàn tay Quốc gia"
 state_handouts_desc: "Cung cấp nâng cấp nhiều tay chân cho tất cả những người bị hạn chế về khả năng vận động."
 branching_out: "Thị trường Chi nhánh"
 branching_out_desc: "Nâng cấp nhiều tay chân chỉ nên dành cho những người chịu bỏ tiền."
 handy_workers: "Công nhân Nhiều chi"
 handy_workers_desc: "Thông qua công nghệ nâng cấp nhiều tay chân tiên phong, giai cấp công nhân đã được cải thiện về số lượng chi."
 luxury_limbs: "Tay chân Xa xỉ"
 luxury_limbs_desc: "Quyền lực đi kèm với đặc quyền: giới tinh hoa có quyền ưu tiên cao hơn trong việc tiếp cận công nghệ nhiều tay chân."
 murdered_martyrs: "Đối tượng Hiến tế"
 murdered_martyrs_desc: "Các nạn nhân của quá trình nâng cấp thử nghiệm được truy tặng làm vật hiến tế nghi lễ để chấm dứt nỗi đau của họ."
 artificial_pain_relief: "Giảm đau Nhân tạo"
 artificial_pain_relief_desc: "Ngành công nghiệp dược phẩm tập trung vào việc phát triển các loại thuốc giảm đau hiệu quả cho những cá nhân đã cấy ghép máy móc khi có nhu cầu."
 chained_experiments: "Thử nghiệm Bắt buộc"
 chained_experiments_desc: "Chỉ công dân mới có quyền lựa chọn không tham gia thử nghiệm."
 cyber_opposition: "Phản đối Cấy ghép"
 cyber_opposition_desc: "Sự từ chối nhận trách nhiệm của chính phủ đã gây ra sự phản đối chính trị mạnh mẽ."
 cyber_event_bliss_commercial: "Module Cực lạc Thương mại hóa"
 cyber_event_bliss_commercial_desc: "Bộ phận cấy ghép thương mại hóa có thể cung cấp sự tận hưởng và cảm giác hạnh phúc được kích thích bằng hóa chất tùy theo nhu cầu."
 cyber_event_bliss_underground: "Module Cực lạc Thương mại hóa"
 cyber_event_bliss_underground_desc: "Các bộ phận cấy ghép không ổn định thu được qua các con đường mờ ám có thể tạo ra niềm vui và sức khỏe chỉ bằng một nút bấm."
 cyber_event_bliss_regulate: "Module Cực lạc được Quản lý"
 cyber_event_bliss_regulate_desc: "Chính phủ hài lòng với việc quản lý các module giải trí và tái tạo hiện có mà không có ý định tự sản xuất."
 cyber_event_worklife_name: "$cyber.615.name$"
 cyber_event_worklife_own: "Ký ức Công nhân Không giới hạn"
 cyber_event_worklife_own_desc: "Mọi người không cần phải lưu trữ riêng biệt các phần ký ức khi làm việc và khi ở nhà."
 cyber_event_worklife_leave: "Hạn chế Ký ức Công nhân"
 cyber_event_worklife_leave_desc: "Yêu cầu mọi người phân tách ký ức liên quan đến công việc sau khi rời khỏi nơi làm việc để tránh rò rỉ bí mật thương mại."
 cyber_event_worklife_isolate: "Tách biệt Ký ức Công nhân"
 cyber_event_worklife_isolate_desc: "Yêu cầu mọi người tách biệt hoàn toàn ký ức liên quan đến công việc và thời gian rảnh rỗi để tránh rò rỉ bí mật thương mại và xung đột đạo đức với nhà tuyển dụng."
 mod_pop_cyborg_specialist_happiness: "Mức độ hạnh phúc của $pop_cat_specialist$ người máy"
 cyber_event_parental_control: "Kiểm soát Vận động Con cái Hoàn toàn"
 cyber_event_parental_control_desc: "Cha mẹ có thể kiểm soát các chức năng vận động của con cái vị thành niên."
 cyber_event_parental_limited: "Kiểm soát Vận động Con cái Có hạn"
 cyber_event_parental_limited_desc: "Cha mẹ có thể kiểm soát con cái vị thành niên một cách hạn chế, chẳng hạn như việc chạy nhảy và âm lượng phát ra v.v."
 cyber_event_parental_enforcers: "Kiểm soát Vận động Pháp luật"
 cyber_event_parental_enforcers_desc: "Mặc cho cha mẹ phản đối, việc kiểm soát các chức năng vận động chỉ được dành riêng cho lực lượng thực thi pháp luật."
 cyber_event_knowledge_engineering: "Chuyển giao Kiến thức Kỹ thuật"
 cyber_event_knowledge_engineering_desc: "Chuyển giao kiến thức chuyên môn liên quan đến kỹ thuật vào ý thức của các nhà khoa học, với cái giá là hy sinh nghiên cứu trong các lĩnh vực khác."
 cyber_event_knowledge_physics: "Chuyển giao Kiến thức Vật lý"
 cyber_event_knowledge_physics_desc: "Chuyển giao kiến thức chuyên môn liên quan đến vật lý vào ý thức của các nhà khoa học, với cái giá là hy sinh nghiên cứu trong các lĩnh vực khác."
 cyber_event_knowledge_society: "Chuyển giao Kiến thức Xã hội"
 cyber_event_knowledge_society_desc: "Chuyển giao kiến thức chuyên môn liên quan đến xã hội học vào ý thức của các nhà khoa học, với cái giá là hy sinh nghiên cứu trong các lĩnh vực khác."
 cyber_implant_taxes: "Thuế Bộ phận Cấy ghép"
 cyber_implant_taxes_desc: "Đánh thuế nặng vào nguyên liệu thô và quá trình sản xuất bộ phận cấy ghép máy móc."
 cyber_implant_taxes_tt: "Điểm năng lượng mỗi tháng: §G+5%§!\nChi phí phát triển $pop_cat_cyborg$: §R+10%§!"
 cyber_reformed_implant_taxes: "Cải cách Thuế Bộ phận Cấy ghép"
 cyber_reformed_implant_taxes_desc: "Cải cách thuế đối với nguyên liệu thô và quá trình sản xuất bộ phận cấy ghép máy móc sẽ mang lại lợi ích ngắn hạn."
 cyber_reformed_implant_taxes_tt: "Điểm năng lượng mỗi tháng: §G+10%§!"
 cyber_market_standards: "Tiêu chuẩn Thị trường Bộ phận Cấy ghép"
 cyber_market_standards_desc: "Khởi kiện những thương nhân sản xuất các bộ phận cấy ghép máy móc kém chất lượng nhất để nâng cao tiêu chuẩn."
 cyber_implant_weapons: "Vũ khí hóa Bộ phận Cấy ghép"
 cyber_implant_weapons_desc: "Cho phép công dân lắp đặt bộ phận cấy ghép vũ khí cá nhân."
 cyber_implants_dismantled: "Lệnh Hạn chế Bộ phận Cấy ghép Nguy hiểm"
 cyber_implants_dismantled_desc: "Tất cả các bộ phận cấy ghép được thiết kế với mục đích làm tổn thương người khác sẽ bị tịch thu và thay thế bằng các sản phẩm an toàn hơn."
 cyber_implant_hacks: "Xâm nhập Bộ phận Cấy ghép"
 cyber_implant_hacks_desc: "Tin tặc nắm giữ mã nguồn điều khiển bộ phận cấy ghép cốt lõi có thể truy cập - thậm chí là thao túng - bộ phận cấy ghép của người khác."
 cyber_counter_hacking: "Chống xâm nhập Bộ phận Cấy ghép"
 cyber_counter_hacking_desc: "Nhân viên thu thập dữ liệu thông qua mạng lưới thông tin liên lạc của chúng ta để theo dõi các tin tặc xâm nhập bất hợp pháp vào bộ phận cấy ghép."
 cyber_protests: "Biểu tình Trì hoãn Bộ phận Cấy ghép"
 cyber_protests_desc: "Những dân số vốn đã quen với việc các công nghệ nâng cấp liên tục được đổi mới của chúng ta bày tỏ sự bất mãn mạnh mẽ đối với sự chậm trễ của sản lượng gần đây."
 cyber_stop_protests: "Giải tán Người biểu tình"
 cyber_stop_protests_desc: "Đập tan các hoạt động biểu tình phản đối việc lịch trình lắp đặt bộ phận cấy ghép của chúng ta bị trì hoãn."
 # Chính sách
 policy_cyberization_standards: "Tiêu chuẩn Cấy ghép Máy móc"
 policy_cyberization_standards_desc: "Đối với xã hội của chúng ta, việc cấy ghép trên toàn dân là cần thiết, nhưng những người phản đối việc cấy ghép máy móc hoàn toàn có thể chọn nâng cấp một phần."
 cyberization_standards_full_name: "Cấy ghép Máy móc Hoàn toàn"
 cyberization_standards_full: "$cyberization_standards_full_name$"
 cyberization_standards_full_effect: "Nhà lãnh đạo Thuyết Duy tâm nhận được đặc điểm: §Y$leader_trait_cyborg$§!\nDân số Thuyết Duy tâm nhận được đặc điểm: §Y$trait_cybernetic$§!"
 cyberization_standards_full_desc: "Tất cả các cá thể đều phải tiến hành lắp đặt toàn bộ bộ phận cấy ghép máy móc.\n\n§E$cyberization_standards_full_effect$§!"
 cyberization_standards_limited_name: "Cấy ghép Máy móc Một phần"
 cyberization_standards_limited: "$cyberization_standards_limited_name$"
 cyberization_standards_limited_effect: "Nhà lãnh đạo Thuyết Duy tâm nhận được đặc điểm: §Y$leader_trait_limited_cyborg$§!\nDân số Thuyết Duy tâm nhận được đặc điểm: §Y$trait_limited_cybernetic$§!"
 cyberization_standards_limited_desc: "Những người phản đối việc nâng cấp hoàn toàn có thể lắp đặt bộ phận cấy ghép máy móc một cách hạn chế.\n\n§E$cyberization_standards_limited_effect$§!"
 # GIAI ĐOẠN 1 CẤY GHÉP MÁY MÓC
 cyber.100.name: "Kiểm soát Tương lai" # Giai đoạn 1 - Sự kiện bắt đầu
 cyber.100.desc.shared: "Những đột phá gần đây về bộ phận cấy ghép máy móc cao cấp vào một ngày nào đó sẽ tạo ra khả năng định hình lại xã hội. Chúng ta có thể loại bỏ mọi điểm yếu sinh học, trở nên nhanh hơn, mạnh hơn và thông minh hơn."
 cyber.100.desc.shared_unplugged: "Những đột phá gần đây về bộ phận cấy ghép máy móc cao cấp vào một ngày nào đó sẽ tạo ra khả năng định hình lại xã hội, lần này chúng ta sẽ tự mình kiểm soát. Bằng cách loại bỏ những khiếm khuyết và điểm yếu sinh học trong công nghệ nâng cấp hiện tại, chúng ta có thể khiến bản thân trở nên thông minh hơn, nhanh hơn và mạnh mẽ hơn."
 cyber.100.desc: "$cyber.100.desc.shared$\n\nCác tập đoàn lớn đã đưa ra một số đề xuất thương mại và dự báo triển vọng bán hàng, tuy nhiên các quan chức chính phủ lại kiên quyết cho rằng quốc gia phải nắm quyền kiểm soát công nghệ đầy tiềm năng này."
 cyber.100.desc.unplugged: "$cyber.100.desc.shared_unplugged$\n\nCác tập đoàn lớn đã đưa ra một số đề xuất thương mại và dự báo triển vọng bán hàng, tuy nhiên các quan chức chính phủ lại kiên quyết cho rằng quốc gia phải nắm quyền kiểm soát công nghệ đầy tiềm năng này."
 cyber.100.desc.megacorp: "$cyber.100.desc.shared$\n\nCác nhà thầu phụ đã đưa ra một số đề xuất thương mại và dự báo triển vọng bán hàng, tuy nhiên hội đồng quản trị của chúng ta lại kiên quyết cho rằng công nghệ quan trọng này phải nằm trong phạm vi độc quyền."
 cyber.100.desc.megacorp_unplugged: "$cyber.100.desc.shared_unplugged$\n\nCác nhà thầu phụ đã cung cấp các đề xuất thương mại và dự báo triển vọng bán hàng cho việc sản xuất bộ phận cấy ghép của bên thứ ba, trong khi hội đồng quản trị công ty của chúng ta lại kiên quyết cho rằng quyền tiếp cận công nghệ quan trọng này phải được giữ độc quyền cho chúng ta."
 cyber.100.a: "Chúng ta sẽ quốc hữu hóa ngành công nghiệp nâng cấp."
 cyber.100.a.megacorp: "Duy trì phát triển nội bộ."
 cyber.100.a.tt: "$situation_cyberization_triggered_modifier$$cyber_control_government_effects$"
 cyber.100.b: "Chúng ta sẽ tư nhân hóa quy trình phân phối."
 cyber.100.b.megacorp: "Hãy giao việc này cho các nhà thầu phụ."
 cyber.100.b.tt: "$situation_cyberization_triggered_modifier$$cyber_control_corporate_effects$"
 cyber.105.name: "Lấy từ nhân dân, dùng cho nhân dân"
 cyber.105.desc: "Vì nhiều thiết kế máy móc mà chúng ta dự định sẽ nằm ngoài tầm với của người bình thường, một số người tự cải tạo cảm thấy rất tức giận.\n\nHọ cho rằng nếu công khai sơ đồ nguyên lý và nới lỏng các quy định về môi trường có liên quan, hầu như ai cũng có thể tự chế tạo và sửa chữa các bộ phận nâng cấp của riêng mình."
 cyber.105.desc.megacorp: "Các nhà thầu độc lập phàn nàn rằng rất khó để tiếp cận nhiều thiết kế máy móc mà chúng ta đã lên kế hoạch.\n\nHọ cho rằng nếu công khai bản thiết kế và nới lỏng các bằng sáng chế liên quan đến sản xuất, việc sản xuất bộ phận cấy ghép máy móc sẽ được cải thiện."
 cyber.105.a: "Luật pháp và quy định tồn tại không phải là không có lý do."
 cyber.105.a.megacorp: "Đây là tài sản trí tuệ của chúng ta."
 cyber.105.a.tt: "Chỉ số điều chỉnh từ tình huống §Y$situation_cyberization$§! không thay đổi."
 cyber.105.b: "Nới lỏng quản lý ngành công nghiệp."
 cyber.105.b.crafters: "Để mọi người tự do chế tạo."
 cyber.105.b.megacorp: "Cung cấp bản thiết kế nguồn mở."
 cyber.105.b.gov.tt: "Cập nhật chỉ số điều chỉnh từ tình huống §Y$situation_cyberization$§!:\n§GThêm: §!$cyber_control_independent_effects$\n§RXóa: §!$cyber_control_government_effects$"
 cyber.105.b.cor.tt: "Cập nhật chỉ số điều chỉnh từ tình huống §Y$situation_cyberization$§!:\n§GThêm: §!$cyber_control_independent_effects$\n§RXóa: §!$cyber_control_corporate_effects$"
 # Cơ hội trong Giai đoạn 1 - Nghiên cứu
 cyber.120.name: "Giảm gánh nặng Tinh thần"
 cyber.120.desc: "Một nhóm nghiên cứu đã đệ trình một dự luật mới, sẽ tích hợp trí tuệ nhân tạo giám sát vào các thiết bị di động của chúng ta, và sau đó có thể tích hợp trực tiếp vào các bộ phận máy móc.\n\nNhững trí tuệ nhân tạo giám sát này sẽ hướng dẫn công dân của chúng ta chuyển sự chú ý từ những công việc nhàm chán sang các nhiệm vụ đòi hỏi nhiều trí não hơn. Mặc dù điều này sẽ làm mất đi một phần quyền tự chủ, nhưng sự gia tăng năng suất chưa từng có sẽ là điều không thể bỏ qua."
 cyber.120.a: "Năng suất là trên hết."
 cyber.120.a.spiritual: "Chúng ta nên coi đây là một ân huệ."
 cyber.120.b: "Sự hy sinh quyền tự chủ này là quá lớn."
 cyber.120.b.spiritual: "Chúng ta sẽ không ngày càng đi xa hơn trên con đường chệch khỏi sự thần thánh."
 cyber.120.c: "Sẽ có thể chấp nhận được nếu có công tắc tắt bật chỉ bằng một nút bấm."
 cyber.120.d: "Điều này sẽ mang lại cho chúng ta bao nhiêu quyền kiểm soát đây..."
 # Thử thách trong Giai đoạn 1 - Nghiên cứu
 cyber.160.name: "Rối loạn Phân ly Máy móc"
 cyber.160.desc: "Một bộ phim truyền hình mới được đánh giá cao đã thu hút trí tưởng tượng của công chúng.\n\nCâu chuyện diễn ra trong một thế giới nơi các bộ phận cấy ghép máy móc thịnh hành, kể về một công nhân được nâng cấp đã phải trải qua sự chia cắt đau đớn với cơ thể đã bị cải tạo của mình. Kết thúc bi thảm của câu chuyện đã đưa ra một lời chỉ trích gần như không che giấu đối với việc cấy ghép máy móc hoàn toàn và sự xóa nhòa danh tính không thể tránh khỏi của [Owner.Species.GetAdj].\n\nThành công vang dội của bộ phim này đã châm ngòi cho sự phản đối mạnh mẽ đối với sáng kiến cấy ghép máy móc, kể từ khi bộ phim phát sóng, số lượng người đăng ký làm đối tượng thử nghiệm có sẵn đã giảm mạnh 60%."
 cyber.160.a: "Phát động chiến dịch quan hệ công chúng."
 cyber.160.b: "Tăng cường quy định đối với bộ phận cấy ghép."
 cyber.160.c: "Cố chịu đựng rồi sẽ qua thôi."
 cyber.160.d: "Kiểm duyệt bộ phim dài tập này."
 cyber.160.e: "Phong tỏa mọi tin tức đưa tin."
 # GIAI ĐOẠN 2 CẤY GHÉP MÁY MÓC
 cyber.200.name: "Trung tâm Nâng cấp"
 cyber.200.desc.gov: "Sau một thời gian đấu đá chính trị nội bộ, trách nhiệm sản xuất các bộ phận nâng cấp máy móc cuối cùng cũng đã được chia đều cho các cơ quan chính phủ khác nhau. Khi tất cả đều được chia phần, họ chắc chắn sẽ giám sát lẫn nhau.\n\nNhưng kế hoạch cuối cùng cũng phải được thực hiện. Cộng đồng nghiên cứu khoa học cần ít nhất một $building_augmentation_center$ để làm trung tâm phát triển máy móc."
 cyber.200.desc.cor: "Giấc mơ từng có nay đã nằm trong tầm tay, không còn nghi ngờ gì nữa, nhiều công ty trong biên giới của chúng ta sẽ thu được lợi nhuận khổng lồ từ việc này. Một trong những lợi ích của ngành công nghiệp máy móc bùng nổ là tốc độ ra mắt các sản phẩm tiêu dùng mới ngày càng nhanh.\n\nNhưng kế hoạch cuối cùng cũng phải được thực hiện. Các nhà vận động hành lang doanh nghiệp đã kiến nghị xây dựng một $building_upload_center$ để làm trung tâm phát triển máy móc."
 cyber.200.desc.ind: "Mạng lưới thông tin liên lạc của chúng ta tràn ngập những ý tưởng thiết kế điên rồ, từ các bộ phận tăng cường khớp thần kinh đến tuyến vị giác máy móc, không gì là không có. Hầu hết chúng đều rất phi thực tế và tốn kém để thực hiện, mặc dù một số thiết kế trông vẫn rất hứa hẹn.\n\nNhưng kế hoạch cuối cùng cũng phải được thực hiện. Cộng đồng trực tuyến cần ít nhất một $building_augmentation_center$ để làm trung tâm phát triển máy móc."
 cyber.200.a.gov: "Phê duyệt giấy phép xây dựng."
 cyber.200.a.cor: "Phê duyệt."
 cyber.200.a.ind: "Ủy quyền."
 cyber.200.a.tt: "§RYêu cầu hành động: §!\nXây dựng một $building_augmentation_center$ để tình huống §Y$situation_cyberization$§! có thể tiếp tục.\n\nMỗi $building_augmentation_center$ cung cấp §G+200§! vị trí $job_augmentor_with_icon$.\n\n$job_augmentor_research_effect_desc$"
 cyber.205.name: "Dự án Biểu diễn" # Giai đoạn 2 - Sự kiện bắt đầu
 cyber.205.desc.shared: "Đã đến lúc bắt đầu một số dự án biểu diễn quy mô lớn hơn. Điều này đòi hỏi sự đầu tư liên tục và sẽ chỉ được thực hiện trên các hành tinh có xây dựng $building_augmentation_center$, nhưng kinh nghiệm thu được có thể ngay lập tức cải thiện năng suất."
 cyber.205.desc.gov: "Các thử nghiệm quy mô nhỏ được thực hiện bởi các dự án nghiên cứu do chính phủ tài trợ đã xác nhận rằng nâng cấp máy móc có thể gia tăng sản lượng.\n\n$cyber.205.desc.shared$"
 cyber.205.desc.cor: "Các thử nghiệm quy mô nhỏ trên nhóm tình nguyện viên tập trung đã xác minh rằng nâng cấp máy móc có thể gia tăng sản lượng.\n\n$cyber.205.desc.shared$"
 cyber.205.desc.ind: "Các báo cáo từ những người tự cải tạo đã xác minh rằng nâng cấp máy móc có thể gia tăng sản lượng.\n\n$cyber.205.desc.shared$"
 cyber.205.a: "Nâng cấp giai cấp tinh hoa."
 cyber.205.a.tt: "Sản lượng tài nguyên của $pop_cat_ruler$ khi có $building_augmentation_center$: §G+10%§!"
 cyber.205.b: "Nâng cấp chuyên gia."
 cyber.205.b.tt: "Sản lượng tài nguyên của $pop_cat_specialist$ khi có $building_augmentation_center$: §G+10%§!"
 cyber.205.c: "Nâng cấp công nhân."
 cyber.205.c.tt: "Sản lượng tài nguyên của $pop_cat_worker$ khi có $building_augmentation_center$: §G+10%§!"
 cyber.205.d: "Nâng cấp tất cả mọi người."
 cyber.205.d.tt: "Tài nguyên tạo ra từ §Hnhững vị trí§! £job£ khi có $building_augmentation_center$: §G+5%§!"
 cyber.210.name: "Phát triển Song song"
 cyber.210.desc.gov.rival: "Các nhà báo đã tiết lộ bằng chứng về việc chính phủ đang tài trợ cho các cuộc thử nghiệm liên quan đến chip theo dõi suy nghĩ. Một khi những thiết bị này được phát triển hoàn thiện, chúng có thể được cấy ghép vào não của công dân, thu thập dữ liệu chi tiết về tính cách và sự an toàn."
 cyber.210.desc.cor.rival: "Bằng chứng tại tòa án liên quan đến một tranh chấp thương hiệu cho thấy doanh nghiệp đang thử nghiệm các bộ phận cấy ghép thực tế tăng cường, nhằm mục đích kết nối mượt mà với dây thần kinh thị giác của người tiêu dùng. Sơ đồ nguyên lý đã liệt kê những lợi ích cho người dùng, cũng như khả năng chiếm đoạt thông tin thị giác của doanh nghiệp."
 cyber.210.desc.ind.rival: "Những người tự cải tạo độc lập đã bắt đầu thay thế tay chân của mình bằng các bộ phận máy móc cơ bản. Không chỉ không có bất kỳ phương pháp nào để đảm bảo phúc lợi của những người tự phẫu thuật này, mà mọi người còn lo lắng rằng việc áp dụng bộ phận cấy ghép không kiểm soát này có thể gây hại nhiều hơn lợi."
 cyber.210.a: "Chúng ta có thể tận dụng việc này."
 cyber.210.a.tt: "Tốc độ tiến triển của tình huống §Y$situation_cyberization$§! trong §Y1§! năm sau đó: §G+25%§!\n\n"
 cyber.210.b: "Vậy hãy dừng lại đi."
 cyber.210.b.tt: "Tốc độ tiến triển của tình huống §Y$situation_cyberization$§! trong §Y1§! năm sau đó: §R-25%§!"
 # Cơ hội trong Giai đoạn 2 - Kết quả thử nghiệm và Đối thủ trong Ngành
 cyber.220.name: "Nhiều tay chân Phối hợp"
 cyber.220.desc: "Chúng ta đã đạt được sự đột phá đáng kể trong lĩnh vực giao diện thần kinh. Bộ khuếch đại tín hiệu não bộ có thể cho phép người dùng điều khiển mượt mà nhưng có giới hạn một nhóm tay chân nhân tạo. Trong tương lai, công nghệ này cũng có thể được tích hợp trực tiếp vào não bộ máy móc mà không cần thiết bị ngoại vi.\n\nTrong giai đoạn thử nghiệm sơ bộ, đối tượng thử nghiệm đã thể hiện sự nhanh nhẹn cao hơn và khả năng thao tác vật thể chính xác, thậm chí còn có trình độ chiến đấu cao hơn. Tuy nhiên, những lo ngại về chi phí sản xuất đã thúc đẩy mọi người quyết định xem công nghệ tiên phong này nên được ưu tiên sử dụng cho nhóm người nào."
 cyber.220.a: "Các nhà khoa học của chúng ta cần nhiều [owner.species.GetHandNamePlural] hơn"
 cyber.220.b: "Tập trung tăng cường xây dựng quân đội."
 cyber.220.c: "Ưu tiên giúp những người bị khuyết tật lấy lại sự tự do."
 cyber.220.d: "Tất nhiên là phải trao tay cho những người sẵn sàng trả nhiều tiền nhất."
 cyber.220.e: "Cung cấp thêm nhân lực cho giai cấp công nhân!"
 cyber.220.f: "Lợi thế của giới tinh hoa là điều cấp bách nhất."
 # Thử thách trong Giai đoạn 2 - Kết quả thử nghiệm và Đối thủ trong Ngành
 cyber.260.name: "Xoắn ngược"
 cyber.260.desc: "Cuộc thử nghiệm một loại module cột sống mới đã kết thúc trong thất bại thảm hại. Lực đẩy quá mạnh do động cơ cấy ghép tạo ra đã khiến tủy sống của nhiều đối tượng thử nghiệm bị tổn thương vĩnh viễn.\n\nNhững hình ảnh về kết quả khủng khiếp này đã bị rò rỉ, gây ra sự khó chịu trong công chúng, dẫn đến tình trạng thiếu hụt nghiêm trọng tình nguyện viên cho các cuộc thử nghiệm trong tương lai."
 cyber.260.a: "Tạm dừng tất cả các thử nghiệm cho đến khi tìm ra giải pháp."
 cyber.260.a.tt: "Tốc độ tiến triển của tình huống §Y$situation_cyberization$§! trong §Y6§! tháng sau đó: §R-50%§!"
 cyber.260.b: "Bồi thường cho gia đình các nạn nhân."
 cyber.260.c: "Nếu không tìm được tình nguyện viên thì đành phải dùng biện pháp mạnh."
 # GIAI ĐOẠN 3 CẤY GHÉP MÁY MÓC
 cyber.300.name: "Sự kiện Ra mắt" # Giai đoạn 3 - Sự kiện bắt đầu
 cyber.300.desc: "Chúng ta đã tích trữ một lượng lớn các bộ phận cấy ghép máy móc cho người dân [Owner.Species.GetName] ở tất cả các trung tâm đô thị lớn trên cả nước. Những thiết bị này được thiết kế bởi $job_augmentor_plural$ đảm bảo có thể cải thiện đáng kể các chức năng sinh lý của chúng ta.\n\nNgày vứt bỏ quá khứ để chào đón tương lai máy móc cuối cùng cũng đã đến."
 cyber.300.a: "Hãy cấy ghép máy móc thôi."
 cyber.300.a.tt: "Nhà lãnh đạo nhận được đặc điểm: §Y$leader_trait_cyborg$§!\nDân số nhận được đặc điểm: §Y$trait_cybernetic$§!\n\n$job_augmentor_growth_effect_desc$\n\nTốc độ nâng cấp phụ thuộc vào hướng giải quyết tình huống và số lượng công trình $building_augmentation_center$."
 cyber.305.name: "Người phản đối Cấy ghép Máy móc" # Thuyết Duy tâm là những người phản đối việc cấy ghép máy móc
 cyber.305.desc.shared: "Trên thực tế, họ thậm chí còn thiếu cả những bộ phận cấy ghép cơ bản nhất, điều này khiến họ gặp khó khăn trong việc hoạt động trong một xã hội ngày càng gắn kết chặt chẽ như chúng ta.\n\nViệc bắt buộc tất cả mọi người phải lắp đặt bộ phận cấy ghép hoàn chỉnh sẽ giúp họ hòa nhập tốt hơn vào xã hội, nhưng chắc chắn sẽ gây ra sự oán hận."
 cyber.305.desc: "Các nhóm tôn giáo phản đối việc kết hợp [Owner.Species.GetFleshTypeCyberCreed] với máy móc đã chủ động rút khỏi các hoạt động của dân số cấy ghép máy móc của chúng ta. $cyber.305.desc.shared$"
 cyber.305.desc.spiritualist: "Những tín đồ sùng đạo miễn cưỡng đánh đồng [Owner.Species.GetFleshTypeCyberCreed] với máy móc đã chủ động rút khỏi các hoạt động của dân số cấy ghép máy móc của chúng ta. $cyber.305.desc.shared$"
 cyber.305.desc.none: "Tính đạo đức của việc kết hợp [Owner.Species.GetFleshTypeCyberCreed] với máy móc là một chủ đề đã được mọi người say sưa bàn tán từ lâu. Đáng tiếc là, xét đến việc nâng cao hiệu quả do quá trình cấy ghép máy móc mang lại, những người chọn từ chối có thể sẽ gặp bất lợi.\n\nÉp buộc mọi người lắp đặt bộ phận cấy ghép có thể đảm bảo không ai bị tụt lại phía sau, nhưng điều này cũng chắc chắn sẽ gây ra sự oán hận."
 cyber.305.desc.unplugged: "Tính đạo đức của việc tái kết hợp [Owner.Species.GetFleshTypeCyberCreed] với máy móc là một chủ đề đã được mọi người say sưa bàn tán từ lâu. Tuy nhiên, các bộ khuếch đại do chúng ta tự thiết kế không còn bị thao túng bởi những cỗ máy đã đồng hóa chúng ta nữa, vì vậy chúng cực kỳ hiệu quả. Những người chọn từ chối có thể sẽ gặp bất lợi.\n\nÉp buộc mọi người lắp đặt bộ phận cấy ghép có thể đảm bảo không ai bị tụt lại phía sau, nhưng điều này cũng chắc chắn sẽ gây ra sự oán hận."
 cyber.305.a: "Họ phải học cách thích nghi."
 cyber.305.a.materialist: "Tôn giáo là cái gì chứ, chúng ta phải tiến về phía trước."
 cyber.305.a.spiritualist: "Tín ngưỡng phải theo kịp thời đại."
 cyber.305.a.tt: "$cyberization_standards_full_effect$\n\nMở khóa chính sách: §Y$policy_cyberization_standards$§!\n"
 cyber.305.b: "Chúng ta hãy nhượng bộ lẫn nhau."
 cyber.305.b.spiritualist: "Tìm kiếm sự thấu hiểu lẫn nhau."
 cyber.305.b.tt: "$cyberization_standards_limited_effect$\n\nMở khóa chính sách: §Y$policy_cyberization_standards$§!\n"
 # Cơ hội trong Giai đoạn 3 - Cách đối xử với Người không cấy ghép máy
 cyber.320.name: "Tiềm năng Ấu trùng"
 cyber.320.birth.desc: "Với sự ra đời của công nghệ hoàn toàn mới nhằm lắp đặt bộ phận cấy ghép cho trẻ sơ sinh, chúng ta bỗng chốc rơi vào bế tắc. Những nâng cấp tiên phong này ở trẻ sơ sinh có sức mạnh thay đổi vĩnh viễn mối quan hệ của chúng ta với công nghệ, giải phóng tiềm năng máy móc bẩm sinh từ thuở ấu thơ và thúc đẩy nền văn minh của chúng ta lên những tầm cao chưa từng có. $cyber.320.end.desc$"
 cyber.320.metamorphosis.desc: "Gần đây, chúng ta đã đạt được một bước đột phá đáng kinh ngạc, giúp cho việc cấy ghép vi mạch trực tiếp vào cơ thể ấu trùng trở nên khả thi. Trong quá trình phát triển biến thái, ấu trùng của chúng ta có được khả năng tự nhiên hấp thụ các hệ thống máy móc. Việc nâng cấp ở giai đoạn hóa nhộng có thể giải phóng tiềm năng máy móc chưa được khai thác của chúng và thúc đẩy nền văn minh của chúng ta lên những tầm cao mới đáng kinh ngạc. $cyber.320.end.desc$"
 cyber.320.lithoid.desc: "Với sự ra đời của công nghệ hoàn toàn mới nhằm lắp đặt bộ phận cấy ghép vào những thế hệ con cháu tinh thể mới, chúng ta bỗng chốc rơi vào bế tắc. Những nâng cấp như vậy sẽ khiến thế hệ mới của chúng ta hình thành một sự gắn kết tự nhiên với khoáng chất kim loại, giải phóng tiềm năng máy móc của chúng từ khi còn rất nhỏ và thúc đẩy nền văn minh của chúng ta lên những tầm cao mới đáng kinh ngạc. $cyber.320.end.desc$"
 cyber.320.root.desc: "Với sự ra đời của công nghệ hoàn toàn mới nhằm lắp đặt bộ phận cấy ghép vào những chồi non mới, chúng ta bỗng chốc rơi vào bế tắc. Những nâng cấp như vậy sẽ khiến thế hệ mới của chúng ta truyền tải các xung điện dung thông qua mạng lưới nấm, giải phóng tiềm năng máy móc của chúng từ khi còn rất nhỏ. $cyber.320.end.desc$"
 cyber.320.egg.desc: "Với sự ra đời của công nghệ hoàn toàn mới nhằm lắp đặt bộ phận cấy ghép vào chim non, chúng ta bỗng chốc rơi vào bế tắc. Những nâng cấp tiên tiến như vậy có khả năng định hình lại bộ xương bằng công nghệ vĩnh viễn, giải phóng tiềm năng máy móc của chúng từ khi còn rất nhỏ và thúc đẩy nền văn minh của chúng ta lên những tầm cao mới đáng kinh ngạc. $cyber.320.end.desc$"
 cyber.320.other.desc: "Với sự ra đời của công nghệ hoàn toàn mới nhằm lắp đặt bộ phận cấy ghép vào con non, chúng ta cũng rơi vào bế tắc: những nâng cấp tiên tiến như vậy có khả năng định hình lại bộ xương bằng công nghệ vĩnh viễn, giải phóng tiềm năng máy móc của chúng từ khi còn rất nhỏ và thúc đẩy nền văn minh của chúng ta lên những tầm cao mới đáng kinh ngạc. $cyber.320.end.desc$"
 cyber.320.end.desc: "\n\nTuy nhiên, nếu bắt đầu phụ thuộc vào nâng cấp máy móc từ khi còn quá nhỏ, nó có thể dẫn đến việc loài của chúng ta cuối cùng mất đi khả năng sinh tồn trong trạng thái tự nhiên."
 cyber.320.a: "Tiến hóa là điều tất yếu đối với chúng ta."
 cyber.320.b: "Tuổi thơ phải được giữ trong trạng thái tự nhiên thuần khiết."
 # Thử thách trong Giai đoạn 3 - Cách đối xử với Người không cấy ghép máy
 cyber.360.name: "Nỗi đau Chuyển hóa"
 cyber.360.desc: "Gần đây, một số cá nhân bắt đầu công khai bày tỏ sự hối hận vì đã tham gia cải tạo cơ thể mang tính thử nghiệm. Việc thay thế thân não bằng các bộ phận máy móc có thể dẫn đến nỗi sợ hãi sinh tồn kéo dài, một số người mô tả trải nghiệm của họ như một vòng tuần hoàn liên tục của sự đau đớn không thể chịu đựng được.\n\nTrước yêu cầu bồi thường không ngừng, chúng ta phải làm rõ lập trường của mình về trách nhiệm quốc gia."
 cyber.360.a: "Cấm các cải tạo cực đoan."
 cyber.360.a.tt: "Tốc độ tiến triển của tình huống §Y$situation_cyberization$§! trong §Y6§! tháng sau đó: §R-50%§!"
 cyber.360.b: "Sự hiến tế sẽ kết thúc nỗi đau của họ."
 cyber.360.c: "Cung cấp thuốc giảm đau mạnh hơn."
 cyber.360.d: "Tìm kiếm các đối tượng thử nghiệm từ tầng lớp thấp nhất."
 cyber.360.e: "Chúng ta không có trách nhiệm."
 # GIAI ĐOẠN 4 CẤY GHÉP MÁY MÓC
 cyber.405.name: "Thuế Bộ phận Cấy ghép" # Đối thủ từ chính phủ
 cyber.405.desc: "Chứng kiến lợi nhuận mà ngành công nghiệp nâng cấp buông lỏng quản lý mang lại, các quan chức chính quyền địa phương luôn tranh giành nhau để bắt kịp những diễn biến mới nhất. Từ khai thác tài nguyên cho đến lắp đặt thành phẩm, mọi giai đoạn sản xuất bộ phận cấy ghép đều bị đánh một khoản thuế lớn.\n\nSự quan liêu thái quá và mức phí cắt cổ đã làm chậm lại tiến độ nâng cấp của chúng ta, cản trở quá trình cấy ghép máy móc hoàn toàn."
 cyber.405.a: "Chấp nhận hệ thống thuế."
 cyber.405.b: "Bãi bỏ hệ thống thuế."
 cyber.405.b.tt: "Tốc độ tiến triển của tình huống §Y$situation_cyberization$§!: §G+25%§!\n\n"
 cyber.405.c: "Cải cách hệ thống thuế nâng cấp."
 cyber.405.c.tt: "Tốc độ tiến triển của tình huống §Y$situation_cyberization$§! trong §Y1§! năm sau đó: §R-10%§!"
 cyber.410.name: "Cuộc chiến Tư pháp" # Xung đột với chính phủ leo thang
 cyber.410.desc: "Do không theo kịp sự chấp nhận của công chúng đối với việc áp dụng bộ phận cấy ghép, các nhà lập pháp của chúng ta đang cố gắng hết sức để hạn chế một số khía cạnh của việc nâng cấp.\n\nCác quy định mới được đề xuất lên án “chứng nghiện bộ phận cấy ghép” của chúng ta, rằng mỗi lần nâng cấp đều “khiến chúng ta ngày càng xa rời định nghĩa về [Owner.Species.GetName]”, đồng thời thiết lập một hạn mức tối đa cho tỷ lệ bộ phận cấy ghép của mỗi cá nhân, chỉ khi nằm trong hạn mức này họ mới có đủ điều kiện được pháp luật bảo vệ. Xét cho cùng, ở một mức độ nào đó, chúng ta có nguy cơ trở nên giống cỗ máy hơn là [Owner.Species.GetName]."
 cyber.410.a: "Bác bỏ các quy định đang được đề xuất."
 cyber.410.a.tt: "Tốc độ tiến triển của tình huống §Y$situation_cyberization$§! trong §Y1§! năm sau đó: §G+25%§!"
 cyber.410.b: "Tìm kiếm sự thỏa hiệp."
 cyber.410.b.tt: "Tốc độ tiến triển của tình huống §Y$situation_cyberization$§! trong §Y1§! năm sau đó: §R-25%§!"
 cyber.415.name: "Không có sự Đảm bảo" # Đối thủ từ tập đoàn
 cyber.415.desc: "Trong cơn sốt điên cuồng chạy theo lợi nhuận, thị trường nâng cấp tràn ngập các bộ phận cấy ghép rẻ tiền, kém chất lượng, và khi những thiết bị này chắc chắn xảy ra sự cố, các công ty cũng từ chối cung cấp dịch vụ hỗ trợ khách hàng.\n\nTrong một trường hợp được đưa tin rộng rãi gần đây, một diễn viên nổi tiếng khi đang biểu diễn trên sân khấu đã bị hỏng bộ phận cấy ghép điều hòa nhịp tim. Đáng tiếc là hậu quả lại mang tính chất bùng nổ."
 cyber.415.a: "Thị trường sẽ tự điều chỉnh."
 cyber.415.a_industrial: "Việc này quá đỗi bình thường."
 cyber.415.a.tt: "Tốc độ tiến triển của tình huống §Y$situation_cyberization$§!: §G+25%§!"
 cyber.415.b: "Chúng ta phải đảm bảo an toàn cho người dùng."
 cyber.415.c: "Trừng phạt những người vi phạm nghiêm trọng nhất."
 cyber.415.c.tt: "Tốc độ tiến triển của tình huống §Y$situation_cyberization$§!: §R-25%§!"
 cyber.420.name: "Thiết kế Nguy hiểm" # Xung đột với tập đoàn leo thang
 cyber.420.desc: "Gần đây, một loại bộ phận cấy ghép máy móc mới đầy nghi vấn đã nhận được sự chú ý rộng rãi. Những bộ phận cấy ghép này không được thiết kế để hỗ trợ người dùng, mà là để làm tổn thương người khác: các máy phun chất độc, máy bóp nghẹt nano và máy gây nhiễu não bộ điện tử này đã càn quét khắp các đường phố lớn ngõ hẻm.\n\nNhững người ủng hộ cho rằng những bộ phận cấy ghép này là cần thiết để tự vệ, trong khi những người khác thì khẳng định công nghệ này không thể mang lại bất kỳ lợi ích nào."
 cyber.420.a: "Hãy cứ để họ tự vũ trang."
 cyber.420.b: "Thế này thì nguy hiểm quá."
 cyber.420.b.tt: "Tốc độ tiến triển của tình huống §Y$situation_cyberization$§!: §R-25%§!"
 cyber.420.b_pacifist: "Phải tháo dỡ tất cả các bộ phận cấy ghép bạo lực."
 cyber.420.b.tt_pacifist: "Dùng những vật liệu này để tạo ra thứ gì đó... an toàn hơn.\n\n"
 cyber.425.name: "Tấn công Phần mềm Điều khiển" # Đối thủ độc lập
 cyber.425.desc: "Trong một cuộc tấn công phối hợp, nhiều nhóm tin tặc đã hợp lực đánh cắp phần mềm cốt lõi dùng để vận hành tất cả các bộ phận cấy ghép. Chúng đe dọa rằng nếu chúng ta không đáp ứng yêu cầu của chúng, chúng sẽ công bố mã nguồn ra công chúng.\n\nĐến nay, chúng ta không có lý do gì để nghi ngờ quyết tâm của chúng. Nếu mã nguồn bị công khai, chúng ta sẽ không có lựa chọn nào khác ngoài việc tiến hành viết lại toàn bộ, và sự chậm trễ này sẽ gây ra tác động tàn phá đối với công việc nâng cấp của chúng ta."
 cyber.425.a: "Trả tiền chuộc."
 cyber.425.b: "Viết lại phần mềm."
 cyber.425.b.tt: "Tốc độ tiến triển của tình huống §Y$situation_cyberization$§! trong §Y1§! năm sau đó: §R-25%§!"
 cyber.425.c: "Tôi muốn xem chúng định làm trò gì."
 cyber.425.c.tt: "May là tin tặc của chúng ta còn cao tay hơn."
 cyber.430.name: "Những bộ phận nâng cấp không tự nguyện" # Xung đột với đối thủ độc lập leo thang
 cyber.430.desc.demands: "Mặc dù chúng ta đã trả khoản tiền chuộc khổng lồ cho tổ chức xâm nhập hệ thống bảo mật, nhưng đêm qua kho lưu trữ mã nguồn chính của chúng ta vẫn bị tải lên tất cả các mạng thông tin công cộng. Nội dung bị rò rỉ ở phần mở đầu còn đi kèm với một hình ảnh tục tĩu, chế nhạo sự bất lực của chúng ta trong việc ngăn chặn cuộc tấn công.\n\nDư luận công chúng dần sục sôi, “sự hối hận của người mua” đối với các bộ phận cấy ghép điều khiển đã gia tăng rõ rệt."
 cyber.430.desc.protest: "Việc viết lại chương trình điều khiển bộ phận cấy ghép vừa tốn thời gian vừa tốn sức, làm chậm nhịp độ sản xuất.\n\nKhi người dân ngày càng phụ thuộc vào các thiết bị nâng cấp mới nhất, nhiều người đã đổ ra đường biểu tình phản đối việc trì hoãn ra mắt sản phẩm."
 cyber.430.a: "Sản phẩm mới sẽ sớm ra mắt."
 cyber.430.b: "Mặc kệ họ."
 cyber.430.c.demands: "Bắt đầu phản công xâm nhập."
 cyber.430.c.protest: "Giải tán những người biểu tình."
 cyber.21.name: "Dân số Nâng cấp" # Tình huống 1 - Sự kiện cuối cùng
 cyber.21.desc: "Hôm nay là một bước ngoặt đối với xã hội chúng ta. Cuối cùng, chúng ta cũng có thể sử dụng toàn bộ các bộ phận máy móc tích hợp bên trong để nâng cấp cơ thể của chính mình.\n\nQuá trình này không hề thuận buồm xuôi gió, và sự chuyển đổi là không hề dễ dàng. Nhưng bất kể cái giá phải trả là gì, giờ đây một cơ thể mới đã mở ra những khả năng vô tận trước mắt chúng ta."
 cyber.21.a: "Chúng ta sẽ trở nên mạnh mẽ hơn."
 cyber.21.a.start: "Thêm chỉ số điều chỉnh cho §Y$building_augmentation_center$§!: $TABBED_NEW_LINE$"
 cyber.21.a.end: "Mở khóa toàn bộ hiệu ứng của truyền thống sau: ['tradition_category:tradition_cybernetics']"
 cyber.21.a.gov.tt: "$cyber.21.a.start$$cyber_control_government_effects$\n$cyber.21.a.end$"
 cyber.21.a.cor.tt: "$cyber.21.a.start$$cyber_control_corporate_effects$\n$cyber.21.a.end$"
 cyber.21.a.ind.tt: "$cyber.21.a.start$$cyber_control_independent_effects$\n$cyber.21.a.end$"
