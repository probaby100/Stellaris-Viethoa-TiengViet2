 auth_cyber_dictatorial_collectivist_desc: "Sự sùng bái cá nhân đối với kẻ độc tài và sức ảnh hưởng đến thần dân đã được tăng cường thông qua các bộ phận cấy ghép kiểm soát. Những người kính sợ nhà lãnh đạo rất hiếm khi nổi dậy chống lại chế độ."
