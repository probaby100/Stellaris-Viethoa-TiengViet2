 #TẬP ĐOÀN ĐẦU SỎ
 edict_battle_royale: "Trận chiến Sinh tử"
 edict_battle_royale_desc: "Kích hoạt một giao diện chỉ tiêu được làm giống trò chơi điện tử, dụ dỗ các chuyên gia và nhân công tranh giành cơ hội thăng tiến cùng huy hiệu thành tích. Sự đày đọa không hồi kết này lại vô tình làm giảm bớt đi một phần năng suất vốn dĩ được tăng lên."
 concept_edict_battle_royale: "$edict_battle_royale$"
