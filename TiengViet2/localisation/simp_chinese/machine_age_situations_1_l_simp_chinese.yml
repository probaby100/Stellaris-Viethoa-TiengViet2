 # Công trình
 building_augmentation_center: "Trung tâm Nâng cấp"
 building_augmentation_center_desc: "Một công trình tiến hành lắp đặt bộ phận cấy ghép máy móc. Có khu mua sắm, trung tâm vận hành và cửa hàng máy móc."
 building_augmentation_center_government_desc: "Bộ y tế chính thức cho phép công dân lựa chọn và lắp đặt các bộ phận cấy ghép máy móc đã được phê duyệt."
 building_augmentation_center_corporate_desc: "Một khu phức hợp khổng lồ đáp ứng mọi nhu cầu cấy ghép máy móc của bạn, đi kèm với trung tâm mua sắm kỹ thuật số cá nhân và khu spa sang trọng sau phẫu thuật."
 building_augmentation_center_independent_desc: "Các bác sĩ cấy ghép chợ đen có thể lắp đặt bất kỳ loại bộ phận cấy ghép nào, nhưng cái giá bạn phải trả có thể không chỉ là vài điểm năng lượng."
 building_augmentation_center_hive_desc: "Dây chuyền lắp ráp vô tận các bộ phận cấy ghép máy móc. Đầy đủ kho chứa tài nguyên, trung tâm vận hành và xưởng gia công."
 building_augmentation_center_creed_desc: "Một thánh địa của sự nâng cấp siêu việt, nơi các tín đồ được tái sinh thông qua sự dung hợp thiêng liêng."
