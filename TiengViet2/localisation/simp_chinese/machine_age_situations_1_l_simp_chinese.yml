 concept_auth_cyber_imperial_collectivist: "$auth_cyber_imperial_collectivist$"
 building_cyberdome: "Đấu trường Cấy ghép"
 building_cyberdome_desc: "Tổ chức những trận đấu cấy ghép tàn bạo giữa các vận động viên đã qua cường hóa để mua vui cho công dân đế chế. Những võ sĩ, vận động viên và người chạy nước rút được cấy ghép sẽ tranh giành sự sùng bái của khán giả cho đến khi gục ngã hoặc bỏ mạng."
