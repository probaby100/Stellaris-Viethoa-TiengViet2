 edict_stately_acclaim: "Lời khen Trang trọng"
 edict_stately_acclaim_desc: "Nhóm đầu sỏ chỉ đích danh những nỗ lực vượt bậc của phe phái đang bị bóc lột, nâng cao độ ủng hộ và sự thu hút của họ. Chút danh tiếng ngắn ngủi này cũng mở ra cơ hội đổi đời trong xã hội."
