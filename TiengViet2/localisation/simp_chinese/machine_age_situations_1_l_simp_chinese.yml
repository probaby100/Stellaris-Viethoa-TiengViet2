 #Mạng lưới Đế chế Tập thể
 auth_cyber_imperial_collectivist: "Mạng lưới Đế chế"
 auth_cyber_imperial_collectivist_desc: "Mạng lưới Đế chế cho phép toàn bộ dân cư tiếp cận một cơ sở giải trí quy mô lớn hoàn toàn mới. Ta có thể xây dựng một $building_cyberdome$ tráng lệ tại thủ đô để làm nơi cho các vận động viên cấy ghép tham gia vào những môn thể thao đẫm máu nhất, đồng thời phát sóng trực tiếp đến vô số hành tinh khác."
