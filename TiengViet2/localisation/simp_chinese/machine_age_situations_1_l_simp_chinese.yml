 #ĐẾ CHẾ
 edict_levied_experience: "Trưng thu Kinh nghiệm"
 edict_levied_experience_desc: "Trích xuất tri thức từ người dân thông qua các thiết bị cấy ghép, giúp nâng cao kinh nghiệm cho các nhà lãnh đạo mà không phải lãng phí thời gian vào những công việc lao động thấp kém."
 concept_edict_levied_experience: "$edict_levied_experience$"
 unlock_edict_levied_experience: "$unlock_edict_tt$['concept_edict_levied_experience']"
 edict_neurocasted_spectacles: "Phát sóng Thần kinh Cảnh tượng"
 edict_neurocasted_spectacles_desc: "Từ khi những hình ảnh tàn khốc tại Đấu trường Cấy ghép ở thủ đô được phát trực tiếp vào các bộ não cấy ghép thông qua mạng lưới thần kinh, người dân đã nườm nượp đổ về đây. Khán giả có thể ngồi an toàn trong kén của mình và tận hưởng trải nghiệm của các võ sĩ dưới góc nhìn thứ nhất. Đây đúng là năm của những giải đấu!"
 edict_neurocasted_spectacles_effect: "Độ hạnh phúc của dân cư ngoài hành tinh thủ đô: §G+10%§!$DOUBLE_NEW_LINE$§EHiệu ứng của $building_cyberdome$:§!$building_cyberdome_edict_effects$"
 requires_cyberdome: "§RCần xây dựng một $building_cyberdome$ trên hành tinh thủ đô§!\n\n$edict_neurocasted_spectacles_desc$"
