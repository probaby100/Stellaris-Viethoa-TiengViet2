 r_the_rulerchip: "Chip Thống trị"
 r_the_rulerchip_desc: "Bộ phận nâng cấp công nghệ cao này lưu trữ những kinh nghiệm được đúc kết từ mỗi người sở hữu trong quá khứ, giúp nhà thống trị có thể tích lũy kiến thức từ thế hệ này sang thế hệ khác."
 create_relic_the_rulerchip: "Tạo ra di vật: §Y$r_the_rulerchip$§!"
 rulerchip_passive_tooltip: "Thêm lựa chọn đặc điểm nhà thống trị: §G+1§!"
 rulerchip_intergenerational_knowledge: "Kiến thức Liên thế hệ"
 rulerchip_intergenerational_knowledge_desc: "Người cai trị của chúng ta đang đào sâu vào lõi lưu trữ của §Y$r_the_rulerchip$§! để nâng cao tầm hiểu biết."
 rulerchip_intergenerational_knowledge_tooltip: "Kinh nghiệm người cai trị nhận được: §G+50%§!"
 rulerchip_intergenerational_knowledge_science_tooltip: "\n§EMỗi người cai trị §Y$scientist_with_icon$§! đời trước:$NEW_LINE$§Y$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §!§G+5%§! (Tối đa §G+25%§!)\nHiệu ứng hiện tại: §!"
