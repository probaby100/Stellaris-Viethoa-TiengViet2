 #ĐỘC TÀI
 edict_self_indictment_protocol: "Giao thức Tự thú"
 edict_self_indictment_protocol_desc: "Kích hoạt tính năng ẩn trong các bộ phận cấy ghép cá nhân, sử dụng phân tích nguồn cấp dữ liệu thời gian thực theo hướng khám phá để tự động phát hiện và báo cáo hành vi phạm tội mà không cần chủ nhân đồng ý."
