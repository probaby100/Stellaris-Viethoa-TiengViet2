 # Máy Tính Tác Chiến
 BIO_COMBAT_COMPUTER_DEFAULT: "Bản Năng Chiến Đấu"
 BIO_COMBAT_COMPUTER_DEFAULT_DESC: "Tất cả các phi thuyền sinh học đều sở hữu bản năng chiến đấu cơ bản, có khả năng thực hiện các động tác né tránh và tính toán nhắm mục tiêu."
 BIO_COMBAT_COMPUTER_BASIC: "Mô Cấy Thần Kinh"
 BIO_COMBAT_COMPUTER_BASIC_DESC: "Các mô cấy này tích hợp trực tiếp với hệ thống hữu cơ của phi thuyền, cho phép đưa ra quyết định chớp nhoáng và điều phối chiến thuật chính xác. Hoạt động như một máy tính tác chiến sống, chúng nâng cao nhận thức tình huống và tối ưu hóa hiệu suất trên chiến trường."
 BIO_COMBAT_COMPUTER_ADVANCED: "Mô Cấy Thần Kinh Tiên Tiến"
 BIO_COMBAT_COMPUTER_ADVANCED_DESC: "Là phiên bản tiến hóa của các mô cấy thần kinh tiêu chuẩn, hệ thống này nâng tầm khả năng xử lý chiến thuật và tốc độ ra quyết định. Chúng mang lại hiệu suất và sự phối hợp vượt trội, cho phép phi thuyền sinh học nhanh chóng thích nghi với các điều kiện chiến trường không ngừng biến đổi."
 BIO_COMBAT_COMPUTER_SAPIENT: "Mô Cấy Thần Kinh Có Tri Giác"
 BIO_COMBAT_COMPUTER_SAPIENT_DESC: "Các mô cấy này dung chứa một trí tuệ sinh học có nhận thức, có khả năng tư duy chiến lược độc lập. Sự kết hợp giữa trực giác hữu cơ và khả năng phân tích nhân tạo này cho phép phi thuyền sinh học linh hoạt thích ứng với các tình huống tác chiến phức tạp, thể hiện năng lực ra quyết định gần như tự động hoàn toàn."
 BIO_COMBAT_COMPUTER_AUTONOMOUS: "Mô Cấy Thần Kinh Tự Trị"
 BIO_COMBAT_COMPUTER_AUTONOMOUS_DESC: "Hệ thống này vận hành hoàn toàn độc lập. Trí tuệ sinh học có khả năng tự nhận thức được tích hợp bên trong cho phép phi thuyền phân tích, lập kế hoạch và thực thi các quyết định mà không cần bất kỳ sự can thiệp nào từ bên ngoài, đạt đến hiệu quả chiến đấu chưa từng có."
 BIO_COMBAT_COMPUTER_PRECOG: "Bản Năng Chiến Đấu Thấu Thị"
 BIO_COMBAT_COMPUTER_PRECOG_DESC: "Những mô cấy này khai thác sức mạnh của linh năng để truyền cho phi thuyền trực giác tiềm thức, giúp nó đoán trước hành động của kẻ thù trước cả khi chúng xảy ra. Khả năng gần như siêu nhiên này mở ra không gian ra quyết định rộng lớn cho hạm đội, cho phép phản ứng gần như ngay tức khắc trước cả những mối đe dọa phức tạp nhất."
 BIO_COMBAT_COMPUTER_SWARM_DEFAULT: "$BIO_COMBAT_COMPUTER_DEFAULT$ (Bầy Đàn)"
 BIO_COMBAT_COMPUTER_SWARM_DEFAULT_DESC: "$BIO_COMBAT_COMPUTER_DEFAULT_DESC$"
 BIO_COMBAT_COMPUTER_PICKET_DEFAULT: "$BIO_COMBAT_COMPUTER_DEFAULT$ (Phòng Không)"
 BIO_COMBAT_COMPUTER_PICKET_DEFAULT_DESC: "$BIO_COMBAT_COMPUTER_DEFAULT_DESC$"
 BIO_COMBAT_COMPUTER_LINE_DEFAULT: "$BIO_COMBAT_COMPUTER_DEFAULT$ (Phòng Tuyến)"
 BIO_COMBAT_COMPUTER_LINE_DEFAULT_DESC: "$BIO_COMBAT_COMPUTER_DEFAULT_DESC$"
