 concept_biological_ship_desc: "—Phi Thuyền Sinh Học sử dụng phân cấp chiến hạm đặc thù, có vai trò rõ ràng, và trải qua 3 giai đoạn trưởng thành.$NEW_LINE$—Chi phí chế tạo chủ yếu tiêu hao $i_food$ thay vì $i_alloys$$NEW_LINE$—Chi phí bảo trì chủ yếu tiêu hao $i_food$ thay vì $i_energy$$NEW_LINE$Chịu sự chi phối bởi công nghệ §Y£society£Sinh Học§! thay vì công nghệ §Y£engineering£Hàng Không Vũ Trụ§!.$NEW_LINE$$h_line$§LLượng lớn sợi cơ sống cấu thành nên thân tàu sống, bên trong chứa đầy các bào quan phát quang sinh học có khả năng giải phóng các hợp chất cao năng lượng, tạo ra các vụ nổ nhiệt quang học phục vụ cho việc đẩy tàu.§!"
 default_ship: "Phi Thuyền Cơ Khí"
 bio_ship: "Phi Thuyền Sinh Học"
 # Mô Tả Bộ Phi Thuyền
 biogenesis_01_shipset_desc: "§HLoại Bộ Phi Thuyền: ['concept_biological_ship', Sinh Học]§!\nNhững chiến hạm sống này sinh ra đã là những kẻ săn mồi bậc cao. Cơ thể có tri giác bán phần của chúng thích nghi, săn mồi và tấn công với một ý chí vô tận."
 biogenesis_02_shipset_desc: "§HLoại Bộ Phi Thuyền: ['concept_biological_ship', Sinh Học]§!\nĐược tạo ra cho những kẻ can trường, những phi thuyền giữa các vì sao với lớp vỏ cứng cáp này không chỉ đang phục vụ — chúng đang sống và trưởng thành cùng với những nhà thám hiểm dũng cảm bên trong."
 humanoid_01_shipset_desc: "Được rèn giũa cho những thử thách khắc nghiệt của không gian sâu thẳm, những phi thuyền này vừa kiên cường vừa quyết đoán. Chúng mang theo hy vọng và ước mơ của những người tạo ra chúng để chinh phục những điều chưa biết, vươn tới những vì sao xa xôi nhất."
 synthetics_01_shipset_desc: "Những thiết kế này thể hiện sự thuần túy của một tư duy không mệt mỏi. Các cấu trúc tản nhiệt dạng cuộn xoắn có khả năng phân tán nguồn năng lượng đầu ra cực lớn từ bộ vi xử lý trung tâm đang ép xung, đảm bảo vận hành hoàn hảo nhằm theo đuổi hiệu suất tuyệt đối."
 mammalian_01_shipset_desc: "Bền bỉ vượt thời gian, những phi thuyền vững chãi này là hiện thân cho tinh thần kiên cường của những người tạo ra chúng. Lớp vỏ dày dặn cung cấp khả năng cách nhiệt và bảo vệ vững chắc, cùng với hệ thống dự phòng giúp chúng sống sót qua những điều kiện khắc nghiệt nhất."
 reptilian_01_shipset_desc: "Vuông vức và thực dụng, thiết kế thô kệch này gợi nhớ đến sự dẻo dai của những kẻ săn mồi. Sự hiện diện của chúng trong khoảng không tĩnh lặng là minh chứng cho sự ngoan cường máu lạnh của những người chế tạo ra chúng."
 avian_01_shipset_desc: "Thanh thoát và uyển chuyển, những cỗ máy bay đa dụng này là hiện thân của vẻ đẹp bay lượn. Từng đường cong và góc cạnh đều kể câu chuyện về một giống loài coi không gian là sự kéo dài của bầu trời chứ không phải là một rào cản."
 arthropoid_01_shipset_desc: "Chitin hay thép, hình thức hay chức năng — đều chẳng có gì khác biệt. Những phi thuyền này được chế tạo không phải để truyền cảm hứng, mà là để trường tồn, lớp vỏ xếp chồng lên nhau của chúng là minh chứng cho triết lý sinh tồn thuần túy."
 molluscoid_01_shipset_desc: "Thanh lịch nhưng bền bỉ, những con tàu này vừa là nơi trú ẩn vừa là ngọn giáo sắc bén. Ẩn dưới lớp vỏ cứng cáp là những hệ thống phức tạp, âm thầm điều hòa dòng chảy năng lượng và chu trình luân chuyển dưỡng chất một cách hiệu quả."
 fungoid_01_shipset_desc: "Những con tàu hình củ hành này gợi lên vẻ đẹp nở rộ của nấm. Chúng được thiết kế để tự cung tự cấp, mạng lưới hệ thống chuyên biệt bên trong đan xen phức tạp, phản ánh logic của hệ sợi nấm."
 plantoid_01_shipset_desc: "Những phi thuyền xanh ngắt này không chỉ bay lượn giữa các vì sao, mà còn cắm rễ vào chúng. Các khoang quang hợp duy trì sự cân bằng, điều hòa hệ sinh thái bên trong con tàu."
 lithoid_01_shipset_desc: "Được trui rèn qua thời gian và áp lực, những con tàu tựa như những khối đá này là hiện thân của sự vĩnh cửu. Ma trận tinh thể silicon nâng đỡ hệ thống lõi, hút lấy sức mạnh từ chính những thế lực kiến tạo nên thiên nhiên."
 necroid_01_shipset_desc: "Tăm tối và kỳ dị, những nhà thờ trôi nổi này là đài tưởng niệm cho cái chết và sự tái sinh. Lõi năng lượng ngập tràn sức mạnh entropy cùng thiết kế mang đậm tính nghi thức của chúng, đang thì thầm về sức mạnh của hư không và tham vọng vĩnh cửu."
 nemesis_01_shipset_desc: "To lớn và uy nghi, những thiết kế này khiến kẻ khác phải phục tùng. Cấu trúc thượng tầng được gia cố và hệ thống dự phòng phô diễn một sức mạnh thống trị vô song."
 aquatic_01_shipset_desc: "Cân bằng giữa kiểu dáng khí động học và độ bền bỉ vững chắc, những con tàu này hội tụ sức mạnh của đại dương. Cấu trúc nội thất mang đậm tính thủy sinh kết hợp với ngoại hình thanh thoát, phản ánh sự duyên dáng của những người tạo ra chúng."
 toxoid_01_shipset_desc: "Những con tàu rò rỉ khí thải, phát ra những tiếng kêu lạch cạch đáng ngại, phớt lờ mọi quy tắc và luật lệ — nhưng chúng vẫn hoạt động. Chạy bằng rác thải và được chắp vá lại với nhau bằng sự sáng tạo ngoan cố, chúng vẫn kiên cường tồn tại ở những nơi mà các con tàu khác phải bó tay."
 cybernetics_01_shipset_desc: "Lớp mạ chrome sáng bóng, mạch điện vo ve, phản xạ thần kinh giờ đã lùi vào dĩ vãng. Kết nối thần kinh trực tiếp đồng nghĩa với độ trễ bằng 0, không có bất kỳ giới hạn nào — chỉ còn lại sự chuẩn xác thuần túy, bùng nổ đến mức tối đa."
