 BIO_EMPTY_DRIVE_DESC: "$EMPTY_DRIVE_DESC$"
 BIO_HYPER_DRIVE_1: "Trường Siêu Không Gian Sinh Học I"
 BIO_HYPER_DRIVE_1_DESC: "Bằng cách không ngừng tạo lực đẩy vào siêu không gian, phi thuyền có thể luồn lách qua những con đường siêu hẹp giữa các vì sao."
 BIO_HYPER_DRIVE_2: "Trường Siêu Không Gian Sinh Học II"
 BIO_HYPER_DRIVE_2_DESC: "$BIO_HYPER_DRIVE_1_DESC$"
 BIO_HYPER_DRIVE_3: "Trường Siêu Không Gian Sinh Học III"
 BIO_HYPER_DRIVE_3_DESC: "$BIO_HYPER_DRIVE_1_DESC$"
 BIO_JUMP_DRIVE_1: "Cơ Quan Bước Nhảy"
 BIO_JUMP_DRIVE_1_DESC: "Cơ quan bước nhảy có khả năng xé toạc một khoảng trống cỡ bằng phi thuyền trên kết cấu của thực tại, thực hiện những bước nhảy tức thời giữa các hệ sao. Bản chất của vùng không gian mà phi thuyền vượt qua trong khoảng thời gian đó vẫn còn là một ẩn số."
 BIO_PSI_JUMP_DRIVE_1: "Cơ Quan Bước Nhảy Linh Năng"
 BIO_PSI_JUMP_DRIVE_1_DESC: "Cơ quan bước nhảy linh năng có khả năng tập trung tiềm năng linh năng của phi thuyền và thủy thủ đoàn, làm biến dạng chuỗi không-thời gian cục bộ, xóa nhòa khoảng cách giữa điểm khởi hành và đích đến — ít nhất là trên lý thuyết."
 tech_bio_hyper_drive_1: "Di Chuyển Siêu Không Gian"
 tech_bio_hyper_drive_1_desc: "Tựa như những sợi tơ nhện, các chiều kích khác của không gian đa chiều len lỏi giữa giếng trọng lực của hầu hết các ngôi sao. Về mặt lý thuyết, việc du hành với tốc độ siêu quang tốc là hoàn toàn khả thi qua các tuyến đường siêu không gian này."
 tech_bio_hyper_drive_2: "Điểm Xuyên Phá Đường Siêu Không Gian"
 tech_bio_hyper_drive_2_desc: "Chúng ta đã xác nhận sự tồn tại của những \"điểm xuyên phá\" đặc thù trong không gian, nơi các phi thuyền có thể tiến vào đường siêu không gian với mức tiêu hao năng lượng thấp nhất. Khám phá này sẽ dọn đường cho việc phát triển một thế hệ siêu động cơ hoàn toàn mới."
 tech_bio_hyper_drive_3: "Luồng Trượt Siêu Không Gian"
 tech_bio_hyper_drive_3_desc: "Thế hệ siêu động cơ mới có khả năng khai thác các luồng trượt á không gian, công nghệ đột phá này đã cải thiện đáng kể hiệu suất của nó."
 tech_bio_jump_drive_1: "$BIO_JUMP_DRIVE_1$"
 tech_bio_jump_drive_1_desc: "$BIO_JUMP_DRIVE_1$ mang tính cách mạng này có khả năng thao túng sự liên tục của không-thời gian cục bộ ở cấp độ lượng tử, và tái cấu trúc nó về trạng thái giống hệt với địa điểm đích, nhờ đó con tàu có thể \"nhảy vọt\" qua lại giữa các vì sao gần như ngay tức khắc."
