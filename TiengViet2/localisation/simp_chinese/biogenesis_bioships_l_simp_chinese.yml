 tech_bio_shields_1: "$tech_shields_1$"
 BIO_SHIELD_1: "Cơ Bắp Lệch Hướng"
 BIO_SHIELD_1_DESC: "Mô cơ chuyên biệt có khả năng tạo ra trường năng lượng, hình thành nên lá chắn lệch hướng bảo vệ. Mặc dù chỉ có thể hấp thụ một lượng sát thương rất hạn chế, nhưng nó có thể tái tạo nhanh chóng."
 SMALL_BIO_SHIELD_1: "$BIO_SHIELD_1$ Cỡ Nhỏ"
 MEDIUM_BIO_SHIELD_1: "$BIO_SHIELD_1$ Cỡ Trung"
 LARGE_BIO_SHIELD_1: "$BIO_SHIELD_1$ Cỡ Lớn"
 tech_bio_shields_2: "$tech_shields_2$"
 BIO_SHIELD_2: "Cơ Bắp Lệch Hướng Cải Tiến"
 BIO_SHIELD_2_DESC: "Mô cơ được tinh chỉnh có khả năng dẫn truyền năng lượng hiệu quả hơn, từ đó gia cố lá chắn lệch hướng. Những hệ thống nâng cấp này có thể hấp thụ nhiều sát thương hơn và nạp lại nhanh hơn, cung cấp khả năng phòng ngự mạnh mẽ hơn trong các cuộc chiến kéo dài."
 SMALL_BIO_SHIELD_2: "$BIO_SHIELD_2$ Cỡ Nhỏ"
 MEDIUM_BIO_SHIELD_2: "$BIO_SHIELD_2$ Cỡ Trung"
 LARGE_BIO_SHIELD_2: "$BIO_SHIELD_2$ Cỡ Lớn"
 tech_bio_shields_3: "$tech_shields_3$"
 BIO_SHIELD_3: "Cơ Bắp Lá Chắn"
 BIO_SHIELD_3_DESC: "Công nghệ khiên sinh học tiên tiến này tích hợp các mô dẫn truyền năng lượng được cường hóa, sở hữu năng lực phòng thủ mạnh mẽ hơn. Nó có thể chống lại các đòn tấn công năng lượng và động năng một cách hiệu quả, đảm bảo phi thuyền sinh học có thể phòng ngự linh hoạt trong nhiều môi trường chiến đấu khác nhau."
 SMALL_BIO_SHIELD_3: "$BIO_SHIELD_3$ Cỡ Nhỏ"
 MEDIUM_BIO_SHIELD_3: "$BIO_SHIELD_3$ Cỡ Trung"
 LARGE_BIO_SHIELD_3: "$BIO_SHIELD_3$ Cỡ Lớn"
 tech_bio_shields_4: "$tech_shields_4$"
 BIO_SHIELD_4: "Cơ Bắp Lá Chắn Tiên Tiến"
 BIO_SHIELD_4_DESC: "Là đỉnh cao của công nghệ khiên sinh học, mô cơ cường hóa này có khả năng dẫn truyền năng lượng hiệu quả hơn, gia tăng cường độ của khiên. Nó mang lại sự bảo vệ kiên cố trước các đòn tấn công năng lượng và động năng, đảm bảo năng lực phòng ngự đa chiều trong chiến đấu."
 SMALL_BIO_SHIELD_4: "$BIO_SHIELD_4$ Cỡ Nhỏ"
 MEDIUM_BIO_SHIELD_4: "$BIO_SHIELD_4$ Cỡ Trung"
 LARGE_BIO_SHIELD_4: "$BIO_SHIELD_4$ Cỡ Lớn"
 tech_bio_shields_5: "$tech_shields_5$"
 BIO_SHIELD_5: "Cơ Bắp Lá Chắn Siêu Cấp"
 BIO_SHIELD_5_DESC: "Mô siêu thích ứng có khả năng điều hướng những luồng năng lượng khổng lồ, hình thành nên lớp phòng ngự gần như bất khả xâm phạm. Hệ thống tiên tiến này có thể tái tạo nhanh chóng, bảo vệ phi thuyền sinh học an toàn ngay cả dưới những đợt tấn công tàn nhẫn nhất."
 SMALL_BIO_SHIELD_5: "$BIO_SHIELD_5$ Cỡ Nhỏ"
 MEDIUM_BIO_SHIELD_5: "$BIO_SHIELD_5$ Cỡ Trung"
 LARGE_BIO_SHIELD_5: "$BIO_SHIELD_5$ Cỡ Lớn"
 tech_bio_dark_matter_deflector: "$tech_dark_matter_deflector$"
 DARK_MATTER_BIO_DEFLECTOR: "Cơ Bắp Lá Chắn Vật Chất Tối"
 DARK_MATTER_BIO_DEFLECTOR_DESC: "Công nghệ khiên sinh học tối tân này tích hợp vật chất tối vào mô hữu cơ, nâng cao đáng kể khả năng dẫn truyền năng lượng và năng lực phòng ngự. Việc cấy ghép loại vật chất đặc biệt này giúp cơ bắp có thể tạo ra những lá chắn đạt tới cảnh giới tối cao, có khả năng chịu đựng những đòn đả kích phi thường."
 SMALL_DARK_MATTER_BIO_DEFLECTOR: "$DARK_MATTER_BIO_DEFLECTOR$ Cỡ Nhỏ"
 MEDIUM_DARK_MATTER_BIO_DEFLECTOR: "$DARK_MATTER_BIO_DEFLECTOR$ Cỡ Trung"
 LARGE_DARK_MATTER_BIO_DEFLECTOR: "$DARK_MATTER_BIO_DEFLECTOR$ Cỡ Lớn"
 tech_bio_psionic_barrier: "$tech_psionic_barrier$"
 PSI_BIO_SHIELD: "Cơ Bắp Lá Chắn Zro"
 PSI_BIO_SHIELD_DESC: "Mô cơ tiên tiến này được dung hợp với Zro - một loại vật chất có hoạt tính thần giao cách cảm, có khả năng tạo ra khiên chắn với độ chính xác và tính thích ứng vô song. Các đặc tính độc đáo của nó giúp tăng cường độ dẻo dai và khả năng tái tạo của khiên sinh học, mang lại mức độ phòng ngự gần như mang sức mạnh siêu nhiên."
 SMALL_PSI_BIO_SHIELD: "$PSI_BIO_SHIELD$ Cỡ Nhỏ"
 MEDIUM_PSI_BIO_SHIELD: "$PSI_BIO_SHIELD$ Cỡ Trung"
 LARGE_PSI_BIO_SHIELD: "$PSI_BIO_SHIELD$ Cỡ Lớn"
 tech_bio_psionic_shield: "$tech_psionic_shield$"
 PSI_BIO_BARRIER: "Mô Cộng Hưởng Linh Năng"
 PSI_BIO_BARRIER_DESC: "Lá chắn sinh học phi thường này khống chế năng lượng linh năng thông qua các mô được nuôi cấy đặc biệt, tạo ra một hệ thống phòng thủ có khả năng thích ứng với các mối đe dọa ập đến với độ chính xác khó tin. Hiệu ứng cộng hưởng của nó giúp cường hóa độ bền của khiên và tăng tốc độ tái tạo, biến nó thành một bức tường thành vững chắc chống lại những đòn tấn công khó lường nhất."
 SMALL_PSI_BIO_BARRIER: "$PSI_BIO_BARRIER$ Cỡ Nhỏ"
 MEDIUM_PSI_BIO_BARRIER: "$PSI_BIO_BARRIER$ Cỡ Trung"
 LARGE_PSI_BIO_BARRIER: "$PSI_BIO_BARRIER$ Cỡ Lớn"
 tech_bio_archaeoshield: "$tech_archaeoshield$"
 BIO_ARCHAEO_SHIELD: "Mô Trường Lực Trì Hoãn"
 BIO_ARCHAEO_SHIELD_DESC: "Bằng cách nuôi cấy mô phản chiếu khiên trên các nốt sần của cổ vật, công nghệ này có thể tạo ra trường lực trì hoãn, làm chậm lại dòng chảy thời gian ngay tại khoảnh khắc bị tấn công. Sự trì hoãn này giúp nâng cao khả năng hấp thụ năng lượng tấn công của khiên, cải thiện đáng kể sự dẻo dai trong phòng ngự."
