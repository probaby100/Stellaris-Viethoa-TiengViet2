 tech_weaver_buffer_2_desc: "Bắn các bào tử chữa lành về phía phi thuyền đồng minh, sửa chữa các hư hỏng nhỏ trên thân tàu và gia tăng sự bền bỉ giữa chiến trường ác liệt."
