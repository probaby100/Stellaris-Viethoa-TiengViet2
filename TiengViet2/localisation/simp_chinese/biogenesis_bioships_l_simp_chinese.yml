 tech_weaver_debuffer_2: "Xúc Tu Gây Nhiễu"
 tech_weaver_debuffer_2_desc: "Các xúc tu gây nhiễu hữu cơ sẽ giải phóng các xung năng lượng bất ổn, làm nhiễu loạn lá chắn của kẻ thù và làm suy yếu khả năng phòng ngự của chúng."
 tech_weaver_debuffer_3: "Xúc Tu Đàn Áp"
 tech_weaver_debuffer_3_desc: "Hệ thống đàn áp tinh vi có khả năng khuếch đại trường nhiễu, làm suy yếu hiệu quả cường độ lá chắn, giảm bớt năng lực phòng thủ của phi thuyền địch."
 tech_weaver_debuffer_4: "Xúc Tu Gây Rối"
 tech_weaver_debuffer_4_desc: "Những xúc tu mạnh mẽ phóng ra trường đàn áp diện rộng, bằng cách gây rối loạn hệ thống khiên và thông tin liên lạc của địch, làm suy yếu sức chiến đấu của toàn bộ đội hình đối phương."
 tech_weaver_debuffer_5: "Xúc Tu Điện Sinh Học"
 tech_weaver_debuffer_5_desc: "Các xung điện sinh học tự thích ứng làm suy yếu khiên và gây rối loạn hệ thống nhắm mục tiêu, khiến kẻ thù trở nên yếu ớt và mất phương hướng."
 tech_weaver_debuffer_6: "Sóng Plasma Sinh Học"
 tech_weaver_debuffer_6_desc: "Các sóng plasma sinh học phức tạp có thể vô hiệu hóa khiên và làm tê liệt hệ thống từ khoảng cách cực xa, khiến kẻ thù hoàn toàn bất lực."
 bio_confuser_tt_intro: "Tối đa"
 bio_confuser_tt_outro: " xác suất khiến phi thuyền quân sự rơi vào trạng thái ['concept_confusion', Hỗn Loạn] trong £time£ §Y5-10§! ngày, tùy thuộc vào kích cỡ của phi thuyền mục tiêu"
 concept_confusion: "Hỗn Loạn"
 concept_confusion_desc: "Những phi thuyền bị mất phương hướng sẽ mất khả năng phân biệt bạn thù, dẫn đến việc chúng tấn công loạn xạ."
 BIO_CONFUSER_GUN_1: "Bào Tử U Ám"
 BIO_CONFUSER_GUN_1_DESC: "Đạn hữu cơ được bơm enzyme bất ổn sẽ gây nhiễu loạn hệ thống nhắm mục tiêu của địch, làm giảm độ chính xác của chúng."
