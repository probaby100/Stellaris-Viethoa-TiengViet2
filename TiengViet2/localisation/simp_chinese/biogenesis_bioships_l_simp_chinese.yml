 BIO_ANTI_EVASION_GUN_4_DESC: "Sử dụng hệ thống nhắm mục tiêu hữu cơ phức tạp, có khả năng dự đoán các thao tác né tránh, khiến ngay cả những con mồi lanh lẹ nhất cũng khó lòng tẩu thoát."
