 BIO_FISSION_REACTOR: "Trao Đổi Chất Phân Hạch"
 BIO_FISSION_REACTOR_DESC: "Với kỹ thuật công nghệ sinh học phù hợp, đường tiêu hóa có thể đóng vai trò như một lò phản ứng hạt nhân sinh học, giúp sản sinh năng lượng dựa trên quá trình trao đổi chất phân hạch cảm ứng, nhưng bù lại sẽ tạo ra chất thải hạt nhân độc hại."
