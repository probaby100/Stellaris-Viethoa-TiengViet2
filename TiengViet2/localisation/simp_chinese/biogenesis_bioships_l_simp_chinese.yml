 # Các bộ phận đặc biệt
 MAULER_PURSUIT_1: "Chu Trình Trao Đổi Chất"
 MAULER_PURSUIT_1_DESC: "Việc tái chế các chất thải hóa học do cơ quan đẩy của phi thuyền sinh ra có thể gia tăng sức bền bỉ."
 MAULER_PURSUIT_2: "Chu Trình Năng Lượng"
 MAULER_PURSUIT_2_DESC: "Việc bổ sung thêm các hạt vi mô dễ nổ vào chu trình luân chuyển của phi thuyền có thể cải thiện sức bền bỉ hơn nữa."
 MAULER_BITER_1: "Chất Lỏng Ăn Mòn"
 MAULER_BITER_1_DESC: "Tuyến cấy ghép đã điều chỉnh lại thành phần hóa học trong thể dịch của $mauler_class_plural_cap$ của chúng ta, khiến nó mang tính ăn mòn và gia tăng tiềm năng tàn phá."
 MAULER_BITER_2: "Chất Lỏng Siêu Ăn Mòn"
 MAULER_BITER_2_DESC: "Việc bổ sung thêm các hạt vi mô dễ nổ vào thể dịch của $mauler_class_plural_cap$ có thể cường hóa hơn nữa khả năng gây sát thương của nó, đặc biệt hữu hiệu khi đối phó với lớp giáp của phi thuyền địch."
 weapon_type_mandible: "§YLớp Ngàm§!"
 mod_weapon_type_mandible_weapon_damage_mult: "Sát Thương Vũ Khí Lớp Ngàm"
 APPLIED_MODIFIERS_SUPPORT_TITLE: "Các chỉ số sửa đổi được áp dụng bởi vũ khí hỗ trợ:"
 WEAVER_GROWTH_AURA_1: "Pheromone Sinh Trưởng"
 WEAVER_GROWTH_AURA_1_DESC: "Nhện Dệt sẽ phát tán ra những tín hiệu sinh hóa phức tạp, thúc đẩy sự trưởng thành của các sinh vật hữu cơ xung quanh. Những Pheromone Sinh Trưởng này có thể gia tăng tốc độ sinh trưởng và khả năng thích nghi, đảm bảo hạm đội sẽ tiến hóa chớp nhoáng để đối phó với bất kỳ thử thách nào."
 WEAVER_GROWTH_AURA_2: "Pheromone Sinh Trưởng Ngoại Lai"
 WEAVER_GROWTH_AURA_2_DESC: "Công nghệ sinh học tối tân đã khuếch đại hiệu lực của những pheromone này, thúc đẩy quá trình sinh trưởng và tối ưu hóa các phi thuyền sinh học đồng minh một cách đáng kinh ngạc. Vầng hào quang được nâng cấp này đảm bảo hạm đội sẽ đạt đến trạng thái lý tưởng với tốc độ kinh hồn, ngay cả trong những trận chiến khốc liệt nhất."
 GROWTH_AURA: "$WEAVER_GROWTH_AURA_1$"
 GROWTH_AURA_TT: "§PHào quang này chỉ có tác dụng đối với những phi thuyền sinh học có khả năng trưởng thành.§!"
 ARKSHIP_GROWTH_AURA: "$WEAVER_GROWTH_AURA_1$"
 ARKSHIP_GROWTH_AURA_DESC: "$WEAVER_GROWTH_AURA_1_DESC$"
 WEAVER_BOOSTER_1: "Bộ Khuếch Đại Cộng Sinh Cơ Bản"
 WEAVER_BOOSTER_1_DESC: "Cơ quan hữu cơ này thắt chặt mối liên kết giữa các phi thuyền sinh học, nâng cao khả năng điều phối và truyền dẫn năng lượng của toàn bộ hạm đội. Sự tồn tại của nó đảm bảo hiệu suất chiến đấu và quản lý tài nguyên được gia tăng rõ rệt."
 WEAVER_BOOSTER_2: "Bộ Khuếch Đại Cộng Sinh Cải Tiến"
 WEAVER_BOOSTER_2_DESC: "Là một phiên bản tân tiến hơn của Bộ Khuếch Đại Cộng Sinh, cơ quan này có khả năng tùy cơ ứng biến dựa trên nhu cầu của hạm đội, từ đó cải thiện hiệu suất và tốc độ phản ứng. Nó tối ưu hóa hiệu năng tổng thể của hạm đội, đảm bảo khả năng thích nghi liền mạch trong suốt quá trình tác chiến."
 HARBINGER_INCUBATOR_1: "Chất Nền Lồng Ấp"
 HARBINGER_INCUBATOR_1_DESC: "Chất nền tế bào này sinh trưởng bao quanh những quả trứng máy bay chiến đấu đang ấp, đóng vai trò như một lồng ấp bằng công nghệ sinh học."
 HARBINGER_INCUBATOR_2: "$HARBINGER_INCUBATOR_1$ Siêu Tốc"
 HARBINGER_INCUBATOR_2_DESC: "Máy bay chiến đấu của phi thuyền này được ấp trong môi trường có chứa khí thiên nhiên ngoài hành tinh, giúp chúng trưởng thành vô cùng nhanh chóng."
 HARBINGER_CHITIN_1: "Điều Hòa Sinh Trưởng Kitin"
 HARBINGER_CHITIN_1_DESC: "Hệ nội tiết trong nhà chứa máy bay của phi thuyền có thể kích thích phản ứng sinh trưởng kitin của máy bay chiến đấu trong giai đoạn phát triển, gia tăng sức chịu đựng của chúng."
 HARBINGER_CHITIN_2: "Điều Hòa Sinh Trưởng Tinh Thể"
 HARBINGER_CHITIN_2_DESC: "Việc cấy tinh thể hiếm vào bộ xương ngoài bằng kitin của máy bay chiến đấu có thể nâng cao hơn nữa khả năng chống chịu sát thương của chúng."
 STINGER_RANGE_1: "Cụm Đo Cự Ly"
 STINGER_RANGE_1_DESC: "Một nhóm các đám rối thần kinh thứ cấp chuyên phụ trách xử lý dữ liệu cảm biến."
 STINGER_RANGE_2: "$STINGER_RANGE_1$ Cải Tiến"
 STINGER_RANGE_2_DESC: "Việc cấy tinh thể hiếm vào bao myelin có thể nâng cao khả năng xử lý mục tiêu."
 STINGER_FIRE_RATE_1: "Lỗ Tản Nhiệt"
 STINGER_FIRE_RATE_1_DESC: "Một chuỗi các lỗ tản nhiệt mọc trên lồng ngực của phi thuyền này có khả năng xả khí thải nhiệt độ cực cao ra ngoài không gian, giúp gia tăng tốc độ bắn của vũ khí."
 STINGER_FIRE_RATE_2: "Lỗ Thoát Hạt Vi Mô Dễ Nổ"
 STINGER_FIRE_RATE_2_DESC: "Việc sử dụng các hạt vi mô dễ nổ làm môi trường trao đổi nhiệt đòi hỏi phải có một chất nền tế bào đặc thù để ngăn chặn những vụ nổ ngoài ý muốn."
 # Áo Giáp/Lớp Mai
 tech_bio_ship_armor_1: "$tech_ship_armor_1$"
 BIO_ARMOR_1: "$NANOCOMPOSITE_CARAPACE$"
 BIO_ARMOR_1_DESC: "Lớp giáp sinh học tiên tiến này kết hợp mô hữu cơ bền bỉ với vật liệu có cấu trúc nano, tạo thành một lớp vỏ sống có khả năng chống chọi trước những vụ va chạm cực mạnh. Lớp vỏ này có khả năng tự động thích ứng với sát thương, tái tạo nhanh chóng, mang đến sự bảo vệ vô song cho phi thuyền sinh học."
 SMALL_BIO_ARMOR_1: "$BIO_ARMOR_1$ Cỡ Nhỏ"
 MEDIUM_BIO_ARMOR_1: "$BIO_ARMOR_1$ Cỡ Trung"
 LARGE_BIO_ARMOR_1: "$BIO_ARMOR_1$ Cỡ Lớn"
 tech_bio_ship_armor_2: "$tech_ship_armor_2$"
 BIO_ARMOR_2: "$CERAMO_CHITIN_CARAPACE$"
 BIO_ARMOR_2_DESC: "Sự dung hợp giữa kitin cường hóa và hợp chất gốm sứ đã ban cho lớp giáp sinh học này độ bền và khả năng chịu nhiệt vô đối. Cấu trúc xếp lớp của nó tạo nên lớp phòng ngự vững chắc, đồng thời vẫn giữ được sự linh hoạt cần thiết cho một cơ thể hữu cơ."
 SMALL_BIO_ARMOR_2: "$CERAMO_CHITIN_CARAPACE$ Cỡ Nhỏ"
 MEDIUM_BIO_ARMOR_2: "$CERAMO_CHITIN_CARAPACE$ Cỡ Trung"
 LARGE_BIO_ARMOR_2: "$CERAMO_CHITIN_CARAPACE$ Cỡ Lớn"
 tech_bio_ship_armor_3: "$tech_ship_armor_3$"
 BIO_ARMOR_3: "$PLASTEEL_CARAPACE$"
 BIO_ARMOR_3_DESC: "Lớp giáp sinh học này kết hợp các mô hữu cơ bền bỉ với vật liệu gia cố bằng thép nhựa, đạt được sự cân bằng tuyệt vời giữa độ cứng cáp và tính linh hoạt. Cấu trúc lai tạp này mang lại khả năng chống chịu xuất sắc trước cả tấn công động năng lẫn tấn công năng lượng, biến nó thành lựa chọn đáng tin cậy cho các phi thuyền sinh học."
 SMALL_BIO_ARMOR_3: "$PLASTEEL_CARAPACE$ Cỡ Nhỏ"
 MEDIUM_BIO_ARMOR_3: "$PLASTEEL_CARAPACE$ Cỡ Trung"
 LARGE_BIO_ARMOR_3: "$PLASTEEL_CARAPACE$ Cỡ Lớn"
 tech_bio_ship_armor_4: "$tech_ship_armor_4$"
 BIO_ARMOR_4: "Lớp Mai Thép Bền"
 BIO_ARMOR_4_DESC: "Được bơm đầy những hợp chất hữu cơ siêu bền, lớp giáp sinh học này có thể chống lại các sát thương dai dẳng một cách vô cùng hiệu quả. Cấu trúc lai tạp của nó đảm bảo độ bền bỉ vượt trội, đồng thời không làm ảnh hưởng đến độ linh hoạt của vật thể mang sinh học."
 SMALL_BIO_ARMOR_4: "$DURASTEEL_CARAPACE$ Cỡ Nhỏ"
 MEDIUM_BIO_ARMOR_4: "$DURASTEEL_CARAPACE$ Cỡ Trung"
 LARGE_BIO_ARMOR_4: "$DURASTEEL_CARAPACE$ Cỡ Lớn"
 tech_bio_ship_armor_5: "$tech_ship_armor_5$"
 BIO_ARMOR_5: "Lớp Mai Neutronium"
 BIO_ARMOR_5_DESC: "Lớp mai này là một kỳ quan của công nghệ sinh học, nó dung hợp các sợi neutronium vào mô hữu cơ, hình thành nên một lớp giáp gần như không thể bị xuyên thủng. Cấu trúc đậm đặc và dễ thích nghi này cung cấp lớp bảo vệ vô đối, ngay cả khi phải đối mặt với những sức mạnh hủy diệt tàn khốc nhất."
 SMALL_BIO_ARMOR_5: "$NEUTRONIUM_CARAPACE$ Cỡ Nhỏ"
 MEDIUM_BIO_ARMOR_5: "$NEUTRONIUM_CARAPACE$ Cỡ Trung"
 LARGE_BIO_ARMOR_5: "$NEUTRONIUM_CARAPACE$ Cỡ Lớn"
 tech_bio_dragon_armor: "$tech_dragon_armor$"
 DRAGON_BIO_ARMOR: "$DRACONIC_CARAPACE$"
 DRAGON_BIO_ARMOR_DESC: "Đỉnh cao trong quá trình tiến hóa của giáp sinh học, thiết kế của lớp mai này lấy cảm hứng từ những kẻ săn mồi bậc cao trong thời kỳ cổ đại. Cấu trúc xếp lớp của nó là sự kết hợp giữa vật chất hữu cơ có khả năng tái tạo và hợp kim sinh học gần như bất hoại, tạo nên một lớp phòng ngự vừa hung bạo vừa kiên cường y như sinh vật đã khơi nguồn cảm hứng cho nó."
 SMALL_DRAGON_BIO_ARMOR: "$DRAGON_BIO_ARMOR$ Cỡ Nhỏ"
 MEDIUM_DRAGON_BIO_ARMOR: "$DRAGON_BIO_ARMOR$ Cỡ Trung"
 LARGE_DRAGON_BIO_ARMOR: "$DRAGON_BIO_ARMOR$ Cỡ Lớn"
 tech_bio_archaeoarmor: "$tech_archaeoarmor$"
 BIO_ARCHAEO_ARMOR: "Lớp Mai Xung Điện"
 BIO_ARCHAEO_ARMOR_DESC: "Ứng dụng các nguyên lý của xung từ và trường phóng xạ, lớp ion hóa này bên trong lớp mai có thể tạo ra các điện tích phản ứng, làm phân tán năng lượng va chạm."
