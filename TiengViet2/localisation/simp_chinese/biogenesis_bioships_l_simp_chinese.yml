 BIO_SHIP_THRUSTER_5_DESC: "Bằng cách cấy vật chất tối vào các mô của phi thuyền, nó có thể \"bơi\" giữa các không gian, di chuyển theo những cách thức hoàn toàn đi ngược lại với các định luật vật lý thông thường và sự hiểu biết hiện tại về lực đẩy."
