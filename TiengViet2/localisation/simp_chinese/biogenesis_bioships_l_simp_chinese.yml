 BIO_CONFUSER_GUN_3_DESC: "Đạn sinh học tự thích ứng được triển khai, đặc biệt nhắm vào điểm yếu thần kinh của các thành viên phi hành đoàn hữu cơ hoặc người máy sinh học, từ đó làm suy giảm hiệu suất của kẻ địch."
