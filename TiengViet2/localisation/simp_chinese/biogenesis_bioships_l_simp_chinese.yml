 bio_ship_unique_components: "Cơ Quan Phụ Trợ"
 bio_ship_unique_components_DESC: "Những cơ quan phụ trợ này được nuôi cấy hoặc cấy ghép vào phi thuyền sống, được thiết kế để điều chỉnh tinh vi hàng loạt khả năng độc đáo."
 MAULER_STAGE_1_GROWTH_1: "Tuyến Sinh Trưởng $ship_growth_stage_1$"
 MAULER_STAGE_1_GROWTH_1_DESC: "Tuyến cấy ghép này tiết ra một hỗn hợp hormone steroid mạnh mẽ, thúc đẩy phi thuyền phát triển sang giai đoạn trưởng thành tiếp theo."
 MAULER_STAGE_1_GROWTH_2: "Tuyến Sinh Trưởng $ship_growth_stage_1$ Gia Tốc"
 MAULER_STAGE_1_GROWTH_2_DESC: "Cơ quan này pha trộn thêm khí thiên nhiên ngoài hành tinh vào quá trình tiết hormone và steroid, có khả năng gia tốc tốc độ sinh trưởng của phi thuyền sinh học."
