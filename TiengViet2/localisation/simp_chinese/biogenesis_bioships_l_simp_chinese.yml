 BIOSHIP_SENSOR_1: "Định Vị Bức Xạ"
 BIOSHIP_SENSOR_1_DESC: "Những cơ quan cảm thụ này sử dụng cơ chế sinh học tương tự như radar để hoạt động trong không gian sâu thẳm, cung cấp cho phi thuyền khả năng dò tìm và theo dõi cơ bản."
 BIOSHIP_SENSOR_2: "Thụ Thể Trọng Lực"
 BIOSHIP_SENSOR_2_DESC: "Những cơ quan cảm thụ này được dùng để phát hiện những biến động trọng lực trong không gian do sự hiện diện của các phi thuyền."
 TECH_UNLOCK_BIOSHIP_SENSOR_2_TITLE: "§HMở khóa Bộ Phận:§! $BIOSHIP_SENSOR_2$"
 TECH_UNLOCK_BIOSHIP_SENSOR_2_DESC: "§H$BIOSHIP_SENSOR_2$§!\n$BIOSHIP_SENSOR_2_DESC$"
 BIOSHIP_SENSOR_3: "Thụ Thể Á Không Gian"
 BIOSHIP_SENSOR_3_DESC: "Các cơ quan cảm thụ có khả năng phát hiện các luồng sóng á không gian (subspace) sinh ra khi phi thuyền di chuyển. Độ nhạy và tầm hoạt động của chúng vượt xa các cơ quan cảm thụ không gian sâu từng được phát triển trước đây."
 TECH_UNLOCK_BIOSHIP_SENSOR_3_TITLE: "§HMở khóa Bộ Phận:§! $BIOSHIP_SENSOR_3$"
 TECH_UNLOCK_BIOSHIP_SENSOR_3_DESC: "§H$BIOSHIP_SENSOR_3$§!\n$BIOSHIP_SENSOR_3_DESC$"
 BIOSHIP_SENSOR_4: "Thụ Thể Tachyon"
 BIOSHIP_SENSOR_4_DESC: "Cơ quan cảm thụ tận dụng các chùm tia tachyon xoay tròn để phát hiện những chuyển động giữa các vì sao ở khoảng cách cực xa."
 TECH_UNLOCK_BIOSHIP_SENSOR_4_TITLE: "§HMở khóa Bộ Phận:§! $BIOSHIP_SENSOR_4$"
 TECH_UNLOCK_BIOSHIP_SENSOR_4_DESC: "§H$BIOSHIP_SENSOR_4$§!\n$BIOSHIP_SENSOR_4_DESC$"
