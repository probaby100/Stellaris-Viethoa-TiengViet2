 tech_weaver_buffer_4_desc: "Giải phóng sinh khối có khả năng thích ứng cao vào đúng mục tiêu có thể sửa chữa những hư hỏng nặng và thúc đẩy tái tạo cơ quan."
 tech_weaver_buffer_5: "Bào Tử Thông Minh Của Nhện Dệt"
 tech_weaver_buffer_5_desc: "Các thể trị liệu thông minh sau khi được giải phóng có thể chủ động tìm kiếm mục tiêu, sửa chữa những hư hỏng chí mạng, cải thiện đáng kể tỷ lệ sống sót trên chiến trường."
 tech_weaver_buffer_6: "Thiết Bị Tái Tạo Thần Bí Của Nhện Dệt"
 tech_weaver_buffer_6_desc: "Vũ khí hỗ trợ sinh học này có thể sửa chữa và tái tạo gần như tức thời, đảm bảo sự sống sót của đồng minh ngay cả trong những cuộc giao tranh ác liệt nhất."
