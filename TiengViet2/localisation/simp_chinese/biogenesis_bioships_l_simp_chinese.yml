 # Công Nghệ Kiến Ngàm
 tech_maulers: "$mauler_class_plural_cap$"
 tech_maulers_desc: "Những đột phá trong công nghệ sinh học cho phép chúng ta nuôi cấy ra những cỗ máy bay không gian có khả năng di chuyển nhanh hơn ánh sáng, phục vụ cho mục đích quân sự."
 TECH_UNLOCK_mauler_stage_1_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $mauler_stage_1$"
 TECH_UNLOCK_mauler_stage_1_CONSTRUCTION_DESC: "§H$mauler_stage_1$§!\n$mauler_class_cap$ là loại phi thuyền sinh học quân sự cơ bản nhất, được trang bị vũ khí tầm ngắn và lớp giáp mai dày cộm."
 tech_mauler_build_speed: "Lồng Ấp Kiến Ngàm Tiêu Chuẩn"
 tech_mauler_build_speed_desc: "Những lồng ấp này giúp đẩy nhanh quá trình thụ thai cho phôi thai của chiến hạm bên trong các buồng sinh học ngập tràn dưỡng chất. Dù còn thô sơ, nhưng chúng đánh dấu bước tiến đầu tiên trong việc tạo ra một hạm đội được nuôi cấy thay vì được chế tạo."
 tech_mauler_build_speed_effect: "$mod_ship_mauler_cost_mult$: §G-5%§!\nTốc Độ Chế Tạo $mauler_class_cap$: §G+25%§!"
 tech_mauler_growth_1: "Lồng Ấp Kiến Ngàm Cải Tiến"
 tech_mauler_growth_1_desc: "Quy trình ấp trứng tinh xảo giúp rút ngắn thời gian trưởng thành của các phi thuyền hữu cơ, đồng thời gia cố thêm sự vững chắc cho cấu trúc của chúng. Hệ thống cung cấp dưỡng chất được nâng cấp và điều chỉnh gen đảm bảo các phi thuyền vừa linh hoạt vừa kiên cường."
 TECH_UNLOCK_mauler_stage_2_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $mauler_stage_2$"
 TECH_UNLOCK_mauler_stage_2_CONSTRUCTION_DESC: "§H$mauler_stage_2$§!\nLai tạo $mauler_class_cap$ $ship_growth_stage_2$ để cung cấp hỏa lực và lớp giáp mạnh mẽ hơn."
 gateway_bio_ships: "§HCon Đường Của Phi Thuyền Sinh Học§!\n§ECông nghệ này mở đường cho việc phát triển thêm nhiều phi thuyền sinh học uy lực hơn nữa.§!"
 tech_mauler_growth_2: "Lồng Ấp Kiến Ngàm Tiên Tiến"
 tech_mauler_growth_2_desc: "Những cơ sở này có khả năng tạo ra các phi thuyền sở hữu sức sống và khả năng thích nghi vô song. Ma trận gen tối ưu cùng sự hỗ trợ công nghệ sinh học tiên tiến đảm bảo hiệu suất vượt trội trong không gian."
 TECH_UNLOCK_mauler_stage_3_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $mauler_stage_3$"
 TECH_UNLOCK_mauler_stage_3_CONSTRUCTION_DESC: "§H$mauler_stage_3$§!\n$mauler_class_cap$ $ship_growth_stage_3$ là đỉnh cao của $mauler_class_cap$, được trang bị vô số vũ khí tầm ngắn đến tận răng."
 # Công Nghệ Nhện Dệt
 tech_weavers: "$weaver_class_plural_cap$"
 tech_weavers_desc: "Dựa trên nền tảng công nghệ sinh học sơ khai, Nhện Dệt được thiết kế để đạt được sự cân bằng hoàn hảo giữa sự nhanh nhẹn và năng lực chiến đấu được tăng cường."
 TECH_UNLOCK_weaver_stage_1_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $weaver_stage_1$"
 TECH_UNLOCK_weaver_stage_1_CONSTRUCTION_DESC: "§H$weaver_stage_1$§!\n$weaver_class_cap$ là một chiến hạm sinh học cỡ trung linh hoạt, được thiết kế để hỗ trợ các trận chiến của hạm đội bằng khả năng cơ động nhằm đối phó với những mục tiêu cỡ lớn của phe địch."
 tech_weaver_build_speed: "Lồng Ấp Nhện Dệt Tiêu Chuẩn"
 tech_weaver_build_speed_desc: "Những cơ sở này có chức năng nuôi cấy các phi thuyền sinh học cỡ trung bên trong các buồng sinh học tinh vi, tận dụng nguồn cung cấp dưỡng chất dồi dào và tối ưu hóa gen để sản sinh ra những phi thuyền linh hoạt và có khả năng thích ứng cao cho hạm đội."
 tech_weaver_build_speed_effect: "$mod_ship_weaver_cost_mult$: §G-5%§!\nTốc Độ Chế Tạo $weaver_class_cap$: §G+25%§!"
 tech_weaver_growth_1: "Lồng Ấp Nhện Dệt Cải Tiến"
 tech_weaver_growth_1_desc: "Những cơ sở này áp dụng các kỹ thuật công nghệ sinh học tiên tiến nhằm đẩy nhanh chu kỳ sinh trưởng và tăng cường khả năng thích nghi của phi thuyền. Ma trận gen được cải tiến và môi trường tối ưu hóa đảm bảo những phi thuyền sinh học này không chỉ bền bỉ mà còn có tốc độ phản ứng cực nhanh trong chiến đấu."
 TECH_UNLOCK_weaver_stage_2_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $weaver_stage_2$"
 TECH_UNLOCK_weaver_stage_2_CONSTRUCTION_DESC: "§H$weaver_stage_2$§!\nTiến hành lai tạo $weaver_class_cap$ $ship_growth_stage_2$ để cải thiện khả năng cơ động, qua đó nâng cao năng lực thích ứng trong các hoạt động của hạm đội."
 tech_weaver_growth_2: "Lồng Ấp Nhện Dệt Tiên Tiến"
 tech_weaver_growth_2_desc: "Những cơ sở này sản xuất ra các phi thuyền sinh học có độ chính xác và tính đa dụng vô đối. Kỹ thuật sinh trưởng mang tính đột phá và sự cường hóa gen mang tính thích nghi tạo ra những phi thuyền có thể phát triển mạnh mẽ ngay cả trong những môi trường chiến thuật khắc nghiệt nhất."
 TECH_UNLOCK_weaver_stage_3_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $weaver_stage_3$"
 TECH_UNLOCK_weaver_stage_3_CONSTRUCTION_DESC: "§H$weaver_stage_3$§!\nLai tạo có mục tiêu $weaver_class_cap$ $ship_growth_stage_3$ để đạt được sự nhanh nhẹn vượt bậc, nâng cao năng lực biến hóa trong chiến thuật."
 # Công Nghệ Trùng Mẫu
 tech_harbingers: "$harbinger_class_plural_cap$"
 tech_harbingers_desc: "Trùng Mẫu đánh dấu một bước tiến vĩ đại trong chiến tranh công nghệ sinh học, là sự kết hợp hoàn hảo giữa hỏa lực hùng hậu và độ bền bỉ của công nghệ hữu cơ. Những phi thuyền này chính là nòng cốt của hạm đội."
 TECH_UNLOCK_harbinger_stage_1_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $harbinger_stage_1$"
 TECH_UNLOCK_harbinger_stage_1_CONSTRUCTION_DESC: "§H$harbinger_stage_1$§!\n$harbinger_class_cap$ bảo vệ toàn bộ hạm đội bằng cách sinh ra vô vàn đàn máy bay chiến đấu."
 tech_harbinger_build_speed: "Lồng Ấp Trùng Mẫu Tiêu Chuẩn"
 tech_harbinger_build_speed_desc: "Các cơ sở này nuôi cấy những phi thuyền sinh học cỡ lớn, cung cấp dưỡng chất cho chúng bằng kỹ thuật truyền dinh dưỡng tiên tiến để đảm bảo sự bền bỉ và sẵn sàng cho chiến đấu."
 tech_harbinger_build_speed_effect: "$mod_ship_harbinger_cost_mult$: §G-5%§!\nTốc Độ Chế Tạo $harbinger_class_cap$: §G+25%§!"
 tech_harbinger_growth_1: "Lồng Ấp Trùng Mẫu Cải Tiến"
 tech_harbinger_growth_1_desc: "Những cơ sở tối tân này ứng dụng công nghệ sinh học tiên tiến nhằm thúc đẩy sự phát triển và củng cố tính toàn vẹn của cấu trúc. Nhờ đó, các phi thuyền được tạo ra sở hữu độ bền bỉ vượt trội và hiệu suất tác chiến được nâng cao rõ rệt."
 TECH_UNLOCK_harbinger_stage_2_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $harbinger_stage_2$"
 TECH_UNLOCK_harbinger_stage_2_CONSTRUCTION_DESC: "§H$harbinger_stage_2$§!\nCác công nghệ nuôi cấy nâng cao có khả năng tạo ra những phi thuyền mạnh mẽ và đáng tin cậy hơn."
 tech_harbinger_growth_2: "Lồng Ấp Trùng Mẫu Tiên Tiến"
 tech_harbinger_growth_2_desc: "Hệ thống ấp trứng tiên tiến có khả năng tạo ra các chiến hạm sinh học sở hữu độ bền bỉ và hỏa lực xuất chúng. Thông qua việc tinh chỉnh gen và môi trường sinh trưởng lý tưởng, những chiến hạm này sở hữu sức chịu đựng vô song, đủ để thống trị mọi chiến trường."
 TECH_UNLOCK_harbinger_stage_3_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $harbinger_stage_3$"
 TECH_UNLOCK_harbinger_stage_3_CONSTRUCTION_DESC: "§H$harbinger_stage_3$§!\nĐược lai tạo nhằm hướng tới sức mạnh tối thượng và chiếm lĩnh ưu thế trên chiến trường."
 # Công Nghệ Ong Độc
 tech_stingers: "$stinger_class_plural_cap$"
 tech_stingers_desc: "Ong Độc được thiết kế để giáng những đòn hủy diệt vào các mục tiêu giá trị cao, cực kỳ thành thạo trong việc khai thác điểm yếu từ hàng phòng thủ của kẻ thù."
 TECH_UNLOCK_stinger_stage_1_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $stinger_stage_1$"
 TECH_UNLOCK_stinger_stage_1_CONSTRUCTION_DESC: "§H$stinger_stage_1$§!\nNhững phi thuyền sinh học nhanh nhẹn và chết chóc, được sinh ra để thực hiện các cuộc tập kích chuẩn xác và giành lợi thế chiến thuật."
 tech_stinger_build_speed: "Lồng Ấp Ong Độc Tiêu Chuẩn"
 tech_stinger_build_speed_desc: "Những cơ sở này nuôi cấy ra các phi thuyền sinh học có thiết kế thon gọn và nhanh nhẹn, được thiết kế tối ưu cho sự chuẩn xác và tốc độ. Bằng việc ứng dụng các buồng sinh học tiên tiến cùng dung dịch dinh dưỡng đặc chế, chúng sản sinh ra những phi thuyền có khả năng thực hiện các đòn tấn công chuẩn xác và hiệu quả."
 tech_stinger_build_speed_effect: "$mod_ship_stinger_cost_mult$: §G-5%§!\nTốc Độ Chế Tạo $stinger_class_cap$: §G+25%§!"
 tech_stinger_growth_1: "Lồng Ấp Ong Độc Cải Tiến"
 tech_stinger_growth_1_desc: "Những cơ sở tinh vi này đã đẩy nhanh chu kỳ sinh trưởng và nâng cao độ chính xác của công nghệ sinh học, từ đó tạo ra những phi thuyền có khả năng cơ động và độ chuẩn xác vượt trội. Những cải tiến này biến Ong Độc thành một thế lực hủy diệt trong các cuộc đối đầu chiến thuật."
 TECH_UNLOCK_stinger_stage_2_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $stinger_stage_2$"
 TECH_UNLOCK_stinger_stage_2_CONSTRUCTION_DESC: "§H$stinger_stage_2$§!\nCung cấp tốc độ và độ chuẩn xác cao hơn cho các hoạt động tác chiến."
 tech_stinger_growth_2: "Lồng Ấp Ong Độc Tiên Tiến"
 tech_stinger_growth_2_desc: "Là đỉnh cao của công nghệ nuôi cấy phi thuyền sinh học, những cơ sở tiên tiến này có khả năng sản xuất ra những chiếc Ong Độc sở hữu tốc độ và sức sát thương không đối thủ. Ma trận gen tối ưu cùng công nghệ ấp trứng đột phá đảm bảo những phi thuyền này sẽ thống trị mọi chiến trường với sự chuẩn xác nhanh nhạy và chết người."
 TECH_UNLOCK_stinger_stage_3_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! $stinger_stage_3$"
 TECH_UNLOCK_stinger_stage_3_CONSTRUCTION_DESC: "§H$stinger_stage_3$§!\nĐược sinh ra để đạt được tốc độ, sự chuẩn xác tuyệt đối và thống trị chiến trường."
