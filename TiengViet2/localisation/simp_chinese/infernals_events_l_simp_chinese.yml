 # RG Timeline events
 TIMELINE_EVENT_ORIGIN_RG_START: "$origin_red_giant$\n§L[GetDate]§!"
 TIMELINE_EVENT_ORIGIN_RG_START_TOOLTIP: "§HĐường hầm Sao§!\n§YSự kiện Nguồn gốc§!\n\nChúng ta đã phát hiện ra một loạt các nhiễu loạn không gian thứ nguyên. Cuộc hành trình tìm kiếm nguồn gốc sự bất ổn chết người của ngôi sao đã bắt đầu."
 TIMELINE_EVENT_ORIGIN_RG_END_NOVA: "Sự sụp đổ của Ngôi sao Khổng lồ\n§L[GetDate]§!"
 TIMELINE_EVENT_ORIGIN_RG_END_NOVA_TOOLTIP: "§HChứng kiến Siêu tân tinh§!\n§YSự kiện Nguồn gốc§!\n\nNgôi sao của chúng ta đã phình to và cuối cùng đã nuốt chửng toàn bộ hệ sao. Các hành tinh đã hóa thành đống đổ nát tan chảy, tài nguyên thì trôi dạt vô định giữa chốn hư không vô tận. Giờ đây, chúng ta chẳng còn sự lựa chọn nào khác ngoài việc kiến tạo lại một tương lai mới giữa các vì sao"
 TIMELINE_EVENT_ORIGIN_RG_END_STABLE: "An ủi Ngôi sao Khổng lồ\n§L[GetDate]§!"
 TIMELINE_EVENT_ORIGIN_RG_END_STABLE_TOOLTIP: "§HCứu vãn Hành tinh mẹ§!\n§YSự kiện Nguồn gốc§!\n\nKích thước của ngôi sao đã ổn định, tránh được một thảm họa tàn khốc. Lượng bức xạ được gia tăng từ ngôi sao đòi hỏi chúng ta phải có sự thích nghi, nhưng khi đối mặt với những thử thách này, chúng ta sẽ càng trở nên mạnh mẽ hơn bao giờ hết."
 TIMELINE_EVENT_ORIGIN_RG_END_NORMAL: "Sự tĩnh lặng của Ngôi sao Khổng lồ\n§L[GetDate]§!"
 TIMELINE_EVENT_ORIGIN_RG_END_NORMAL_TOOLTIP: "§HCứu vãn Hành tinh mẹ§!\n§YSự kiện Nguồn gốc§!\n\nChúng ta đã đảo ngược thành công những biến đổi tàn phá của ngôi sao mẹ, đưa nó trở về trạng thái yên bình như thời kỳ đầu chúng ta mới tiến hóa. Chúng ta đã chứng minh được bản lĩnh vượt qua nghịch cảnh diệt vong đáng sợ nhất, và đã sẵn sàng đối mặt với mọi thử thách mà vũ trụ này sẽ mang đến."
 # COSMIC DAWN
 # All strings below are in order of their appearance ingame
 infernals.2500.name: "Tín hiệu từ Vực thẳm" # giới thiệu
 infernals.2500.desc: "Các lần quét định hướng cho thấy một cơ sở phức tạp được chôn vùi dưới bề mặt §Y[root.capital_scope.GetName]§!, và càng vào gần lõi, cơ sở càng trở nên rộng lớn và có mức độ phức tạp càng cao. Vật liệu và dấu hiệu năng lượng của chúng rất đồng nhất với những cái kén ngủ đông trong lần đầu tiên chúng ta thức tỉnh.\n\nĐó nhất định là di tích còn sót lại từ một nền văn minh tiền thân của chúng ta. Nếu chúng ta có thể tiếp cận được cơ sở này, có thể chúng ta sẽ tìm được câu trả lời cho những bí ẩn lớn nhất về quá khứ của mình: Chúng ta là ai? Chúng ta đã trải qua những chuyện gì?"
 infernals.2500.a: "Hành trình bắt đầu."
 INF_ORIGIN_COSMIC_DAWN_DRILLING: "Khoan xuyên Lớp vỏ" # từ 2500
 INF_ORIGIN_COSMIC_DAWN_DRILLING_DESC: "Để tìm hiểu xem mình là ai, trước hết phải biết được nguồn cội của mình. Chúng ta cần khai quật các cơ sở bị chôn vùi sâu dưới bề mặt §Y[owner.Capital.GetName]§!."
 infernals.2505.name: "Thêm Những Người Anh em Thức tỉnh"
 infernals.2505.desc.a: "Chúng ta đã phát hiện ra thêm những kén ngủ đông chứa các cá thể §Y[root.GetSpeciesNamePlural]§! sống và đang cố gắng đánh thức họ, nhưng xem ra họ cũng chẳng có ấn tượng gì mấy về quá khứ cả."
 infernals.2505.desc.b: "Chúng ta đã tìm thấy thêm các kén ngủ đông chứa những cá thể §Y[root.GetSpeciesNamePlural]§! đang sống. Dù cho có tiến hành hợp nhất thì rõ ràng họ cũng không có được chút ký ức nào hữu ích."
 infernals.2505.a: "Cấp phép khai quật toàn diện."
 infernals.2505.b: "Chỉ dỡ bỏ những phần cần thiết."
 infernals.2505.c: "Thuê đội nhóm bên ngoài tiến hành khai quật."
 situation_cosmic_dawn: "Khai quật Sâu"
 situation_cosmic_dawn_type: "$situation_cosmic_dawn$"
 situation_cosmic_dawn_monthly_change_tooltip: "Tiến độ hiện tại của cuộc khai quật sâu."
 situation_cosmic_dawn_desc: "Các cuộc khai quật đã hé lộ một cơ sở ngầm chứa đầy những công nghệ tiên tiến, dữ liệu lưu trữ và vô số các kén ngủ đông khác của những người anh em đang say giấc nồng. Lịch sử của chúng ta đã được chôn giấu ở đây; nếu có thể khai quật toàn bộ, có thể chúng ta sẽ tìm được câu trả lời về việc mình rốt cuộc là ai."
 situation_cosmic_dawn_finish_tt: "Để hiểu rõ bản thân, cần phải tìm lại quá khứ xa xăm."
 situation_cd_mod_mining: "$approach_cd_mining$"
 situation_cd_mod_drilling: "$approach_cd_drilling$"
 situation_cd_mod_financial: "$approach_cd_financial$"
 situation_cd_mod_storm: "$TRIGGER_FAIL$Dự án đặc biệt §Y$INF_ORIGIN_COSMIC_DAWN_STORM$§! chưa được hoàn thành"
 situation_cd_mod_bribe: "$TRIGGER_FAIL$Dự án đặc biệt §Y$INF_ORIGIN_COSMIC_DAWN_BRIBE$§! chưa được hoàn thành"
 sit_cd_stage1_tt: "Chúng ta đã bắt đầu xuyên thủng lớp vỏ hành tinh."
 sit_cd_stage2_tt: "Bắt đầu từ đây, bề mặt đã hoàn toàn khuất tầm nhìn."
 sit_cd_stage3_tt: "Xuyên qua nửa lớp vỏ, nhiệt độ đang leo thang."
 sit_cd_stage4_tt: "Tiến sâu vào lớp vỏ, có thể nghe thấy âm thanh cuồn cuộn phát ra từ phần lõi."
 sit_cd_stage5_tt: "Nếu tiếp tục tiến lên, chúng ta sẽ bị lõi hành tinh nuốt chửng."
 approach_cd_mining: "Khai thác Lộ thiên"
 approach_cd_mining_tt: "Cho phép tất cả mọi người tham gia khai quật. Sẵn tiện thu thập thêm tài nguyên khoáng sản.\nTiến độ hàng tháng: §Y+$@approach_cd_mining$§!\n\n"
 approach_cd_drilling: "Khoan Định hướng"
 approach_cd_drilling_tt: "Triển khai các thiết bị khoan tối ưu và chính xác nhất, chỉ đào những phần cần thiết.\nTiến độ hàng tháng: §Y+$@approach_cd_drilling$§!\n\n"
 approach_cd_financial: "Khích lệ Kinh tế"
 approach_cd_financial_tt: "Điều chỉnh ủy quyền nhận thầu khai thác sang phương thức này, và giữ lại một phần lợi nhuận.\nTiến độ hàng tháng: §Y+$@approach_cd_financial$§!\n\n"
 # Stage 2
 infernals.2510.name: "Chứng mất trí nhớ và Dữ liệu"
 infernals.2510.intro: "Sau khi liên tục phát hiện thêm nhiều kén ngủ đông, chúng ta nhận ra rằng ký ức của những người bên trong dường như đã bị xóa sạch hoàn toàn."
 infernals.2510.desc.a: "$infernals.2510.intro$\n\nMột số người anh em vừa mới tỉnh giấc đã hỏi chúng ta cùng một câu hỏi: Các người là ai?\n\nMặc dù xã hội đã trải qua hàng thế kỷ phát triển rực rỡ, nhưng chúng ta cũng chẳng hề tiến gần đến câu trả lời hơn so với họ chút nào.\n\n$infernals.2510.outro$"
 infernals.2510.desc.b: "$infernals.2510.intro$\n\nSau khi những người anh em đang say giấc được đánh thức, cũng giống như những người khác, họ chẳng nhớ chút gì về nguồn gốc của mình. Nếu không có câu trả lời, thì chúng ta chỉ có thể tự tay tạo nên trang lịch sử cho riêng mình.\n\n$infernals.2510.outro$"
 infernals.2510.outro: "Điều khác biệt so với những người ngủ đông là, trong cơ sở dữ liệu của bọn họ lại lưu giữ một thông tin mới đến kinh ngạc. Sau khi phân tích lại nhiều lần, chúng ta có thể khẳng định kết quả là chính xác. Dữ liệu cho thấy, kể từ lần ngủ đông đầu tiên, đã có hơn 12 tỷ năm trôi qua.\n\nĐiều này có nghĩa là nguồn cội của chúng ta có thể bắt nguồn từ thuở khai thiên lập địa của vũ trụ, cái thời đại mà những ngôi sao và hành tinh đầu tiên mới được sinh ra. Có lẽ, chúng ta chính là một trong những dạng sống thông minh đầu tiên tiến hóa trong vũ trụ này."
 infernals.2510.a: "Tìm hiểu về lịch sử bị thất lạc của chúng ta."
 infernals.2510.b: "Vũ trụ nên thuộc về chúng ta."
 # Stage 3
 infernals.2515.name: "Sự thất bại của Hệ thống Duy trì Sự sống"
 infernals.2515.desc: "Chúng ta đã phát hiện ra một thảm kịch. Những ghi chép từ cơ sở lưu trữ đông lạnh nguyên vẹn này cho thấy §Y[event_target:homeworld.GetName]§! đã trôi dạt hàng tỷ năm trước khi bị hệ sao hiện tại bắt được. Lực hút đó đã kích hoạt một đợt sóng thủy triều khổng lồ.\n\nMặc dù những biến động sức mạnh đó đã kiến tạo nên hành tinh thiên đường núi lửa mà chúng ta gọi là nhà ngày nay, nhưng tác động ban đầu đã phá hủy nghiêm trọng các bộ lưu trữ năng lượng của cơ sở. Hệ thống tự động đã ưu tiên bảo vệ các cá thể cấp cao, đồng thời vô hiệu hóa các khoang cấp thấp cũng như ngừng việc bảo trì cấu trúc.\n\n[GetScientistPlural] của chúng ta dự đoán rằng trước khi cơ sở sụp đổ hoàn toàn do lỗi rò rỉ bộ phận lưu trữ năng lượng bị kích hoạt, rất có thể chúng ta chỉ có thể cứu được một người.\n\nNếu hệ thống phân cấp không quyết định thứ tự ưu tiên, có lẽ chúng ta đã cứu được nhiều người hơn."
 infernals.2515.a: "Sự tiến bộ của khoa học đóng vai trò thiết yếu."
 infernals.2515.a.tt: "Lãnh đạo nhận được: £scientist£§Y$scientist$§!"
 infernals.2515.b: "Ưu tiên bảo vệ các chuyên gia là một quyết định sáng suốt."
 infernals.2515.b.tt: "Lãnh đạo nhận được: £official£§Y$official$§!"
 infernals.2515.c: "Tháo dỡ các bộ phận lưu trữ năng lượng mà không kích hoạt sự đánh thức."
 infernals.2515.c.tt: "Những cá nhân có thể thay thế được, nhưng đế chế của chúng ta đang cần thêm không gian để phát triển."
 infernals.2520.name: "Nơi trú ẩn Liên sao"
 infernals.2520.desc: "§Y[event_target:leader.GetName]§! đang khôi phục lại kho lưu trữ đông lạnh của bọn họ. Khám phá mới nhất của họ cho thấy, dường như có rất nhiều nhóm nhỏ [root.GetSpeciesNamePlural] đang rải rác trên khắp dải ngân hà dưới trạng thái đông lạnh, hệt như chúng ta đã từng.\n\nKho lưu trữ ghi lại tọa độ của những hành tinh này, nhưng tính từ thời điểm đó cho đến nay, cả một ngôi sao đã được sinh ra rồi lụi tàn, nên việc xác định vị trí hiện tại của chúng cần đến những phương pháp nội suy vô cùng phức tạp. Như một bằng chứng về tính khả thi, [event_target:leader.GetName] đã định vị được một hành tinh như thế, nhưng quá trình giải mã toàn bộ dữ liệu chỉ mới được bắt đầu.\n\nĐồng thời, một ý nghĩ đáng lo ngại đã xuất hiện: §Y[root.Capital.GetStarName]§! có lẽ không phải là hành tinh mẹ thật sự của chúng ta, mà chỉ là một trong số rất nhiều nơi trú ẩn mà thôi. Nếu đúng là vậy, nguồn cội của chúng ta nằm ở đâu? Liệu điều đó có còn quan trọng nữa không?"
 infernals.2520.a: "Chúng ta phải tìm được những người đồng bào của mình."
 infernals.2520.b: "Hành tinh này bây giờ chính là nhà của chúng ta."
 cosmic_dawn_anomalies_event_chain_title: "Nơi trú ẩn Liên sao"
 cosmic_dawn_anomalies_event_chain_desc: "Nhiều khả năng có rất nhiều nhóm [root.GetSpeciesNamePlural] đang rải rác trên khắp thiên hà trong trạng thái đông lạnh, giống như chúng ta trước đây.\n\nKho lưu trữ đã ghi lại tọa độ của những hành tinh này, nhưng qua bao thăng trầm, ngay cả một ngôi sao cũng đã trải qua quá trình sinh diệt, vì thế việc xác định vị trí của chúng hiện nay cần phải áp dụng các thuật toán nội suy cực kỳ phức tạp."
 # Anomaly 2
 cosmic_dawn_sleepers_category: "Những người Ngủ đông Biệt lập"
 cosmic_dawn_sleepers_category_desc: "Tương truyền rằng tại các tọa độ hành tinh này có một số lượng lớn những người đang ngủ đông cũng như công nghệ của họ, chúng ta nên tiến hành điều tra kỹ lưỡng."
 infernals.2525.name: "$cosmic_dawn_sleepers_category$"
 infernals.2525.desc: "§Y[root.leader.GetName]§! đã phát hiện một cơ sở lưu trú dưới lòng đất với nhiều đồng bào đang trong trạng thái đông lạnh hơn, và đã đánh thức họ thành công. Khác với chúng ta, họ vẫn còn giữ lại được một vài mảnh ký ức mờ nhạt về tiền kiếp, và lấy câu chuyện về một đế chế không gian vĩ đại sẽ có một ngày trở lại để cứu vớt họ làm lẽ sống.\n\nHọ tỏ ra e dè, nhưng vẫn nhận chúng ta là đồng bào. Chúng ta có thể tự xưng mình là đấng cứu thế mà họ hằng mong đợi bấy lâu, trở thành người kế thừa của thứ vinh quang cổ đại ấy. Hoặc là chúng ta có thể nói ra sự thật: Chúng ta đang gầy dựng nên một đế chế hoàn toàn mới, vừa mong muốn học hỏi từ họ, lại vừa sẵn lòng truyền đạt kiến thức lại cho họ.\n\nNhững manh mối bổ sung thu thập được từ trong kho lưu trữ này đã giúp chúng ta thu hẹp phạm vi của hành tinh tiếp theo có khả năng sở hữu các khoang đông lạnh."
 infernals.2525.a: "Chúng ta là những đấng cứu thế cổ đại của bọn họ."
 infernals.2525.b: "Chúng ta đang xây dựng một tương lai hoàn toàn mới."
 infernals.2525.c: "Đồng hóa bọn họ."
 # Anomaly 3
 cosmic_dawn_sleepers2_category: "Những người Ngủ đông Đề phòng"
 cosmic_dawn_sleepers2_category_desc: "$cosmic_dawn_sleepers_category_desc$"
 infernals.2530.name: "$cosmic_dawn_sleepers2_category$"
 infernals.2530.desc: "§Y[root.leader.GetName]§! lại phát hiện thêm một nhóm đồng bào đang trong trạng thái đông lạnh và đã đánh thức họ thành công, nhưng thay vì biết ơn, họ lại tỏ ra sợ hãi và đuổi chúng ta đi. Họ chẳng thèm nhận chúng ta là đồng bào, cũng chẳng hoan nghênh sự có mặt của chúng ta.\n\nSau những cuộc đàm phán căng thẳng, họ bày tỏ ý định muốn rời đi và khám phá dải ngân hà. Chúng ta có thể bán rẻ cho họ một chiếc phi thuyền đơn giản. Hoặc, do nhu cầu cấp thiết về lực lượng lao động, chúng ta có thể ép họ di cư đến thuộc địa gần nhất. Có thể đến lúc đó họ sẽ hiểu được lý do vì sao chúng ta phải làm như vậy.\n\nKho lưu trữ của cơ sở này cũng đã hé lộ vị trí của một hành tinh khác, nơi chứa nhiều khoang đông lạnh hơn."
 infernals.2530.a: "Cấp cho họ một con tàu."
 infernals.2530.b: "Mang họ về nhà."
 infernals.2530.b.tt: "£pop£$POPS$ nhận được: §G+200§!"
 infernals.2530.c: "Đồng hóa bọn họ."
 # Ship returns
 infernals.2531.name: "Người Trở Về"
 infernals.2531.desc: "Những người ngủ đông trước đây lấy phi thuyền của chúng ta nay đã trở lại, cưỡi trên một chiến hạm khổng lồ. Trong cuộc hành trình chinh phục không gian, họ đã chạm trán với bọn cướp biển, và sau cùng đã đánh bại kẻ thù bằng mưu trí xuất chúng.\n\nViệc chiếm đoạt chiến hạm của kẻ địch đã đánh thức dã tâm cướp biển bên trong họ, kể từ đó những vụ cướp bóc của họ ngày càng trở nên táo tợn, nhắm vào những mục tiêu hùng mạnh hơn. Nhưng dù có thành công rực rỡ đến đâu, thì kiếp sống cướp biển cũng không thể là kế sinh nhai lâu dài.\n\nGiờ đây, họ đã trở lại, tìm kiếm sự ổn định hoặc vươn tới một mục tiêu lớn lao hơn. Với chiến hạm, kinh nghiệm và những chiến lợi phẩm sẵn có, họ vẫn mang lại một giá trị vô cùng to lớn."
 infernals.2531.a: "Điều này thật xứng đáng."
 infernals.2531.a.tt: "Chúng ta có thể đưa phi thuyền của họ vào hạm đội để gia tăng sức mạnh. Nhận một tuần dương hạm."
 infernals.2531.b: "Cải tạo phi thuyền của họ, sử dụng để khai hoang hành tinh mới."
 infernals.2531.b.tt: "Nhận một §H$colonizer$§!."
 infernals.2531.c: "Chúng ta vẫn còn chỗ trống ở thủ đô để chứa chấp họ."
 infernals.2531.c.tt: "£pop£$POPS$ nhận được: §G+200§!"
 # Anomaly 4
 cosmic_dawn_sleepers3_category: "Cảng Không gian của Những người Ngủ đông"
 cosmic_dawn_sleepers3_category_desc: "$cosmic_dawn_sleepers_category_desc$"
 infernals.2535.name: "$cosmic_dawn_sleepers3_category$"
 infernals.2535.desc: "§Y[root.leader.GetName]§! đã phát hiện một cơ sở ngưng trệ quy mô nhỏ, cùng một cảng không gian ẩn giấu, bên trong chứa một phi thuyền khoa học gần như nguyên vẹn, chỉ cần sửa chữa qua loa là có thể hoạt động bình thường.\n\nNơi này cũng lưu trữ một kho dữ liệu khoa học khổng lồ, bao gồm cả các mẫu vật từ các giống loài khác được bảo quản kỹ lưỡng[GetInterstellarRefugiaDesc2535] Hiện vẫn chưa rõ liệu những mẫu vật này là bị cưỡng ép hay tự nguyện giao nộp, nhưng trên con tàu này có một phòng giam đặc biệt được thiết kế riêng cho các hàng hóa có tri giác.\n\nThông qua việc nghiên cứu chúng, chúng ta có thể thu hoạch được rất nhiều lợi ích, thậm chí có thể khám phá thêm những dạng sống mới chưa từng được biết đến."
 infernals.2535.contact: ", trong đó có một vài mẫu vật có thể là tổ tiên của những sinh vật có trí tuệ hiện đại." # in ra dòng này trong [GetInterstellarRefugiaDesc2535] phía trên
 infernals.2535.nocontact: "." # Không thể để trống, nên giữ lại dấu chấm câu.
 infernals.2535.a: "Nghiên cứu các mẫu vật."
 infernals.2535.b: "Giao trả các mẫu vật cho gia đình của họ."
 infernals.2535.c: "Tiêu hủy bằng chứng."
 # Random Stasis Pods discovered
 infernals.2536.1: "Sau nhiều tháng làm việc miệt mài, toàn bộ những [root.GetSpeciesNamePlural] mới đang chìm trong giấc ngủ đông trên [planet.GetName] đã gia nhập hàng ngũ của chúng ta."
 infernals.2536.1.a: "Thiết lập đường bay hướng tới hệ sao đó!"
 infernals.2536.1.b: "Chúng ta chẳng còn thì giờ để quan tâm đến việc này nữa." # kết thúc cơ hội sinh thêm khoang ngủ đông.
 infernals.2536.2: "Lại thêm một khoang đông lạnh được mở khóa thành công, những người bên trong đang được đưa về nhà."
 infernals.2536.3: "Chúng ta đã giải cứu được nhiều [root.GetSpeciesNamePlural] hơn, và đang hỗ trợ họ thích nghi với một vũ trụ lạnh lẽo hơn, nơi cần sự ấm áp của các vì sao để duy trì sự sống."
 infernals.2536.4: "Nhiều [root.GetSpeciesNamePlural] từ thời xa xưa đã được đánh thức thành công trên [planet.GetName]."
 infernals.2536.5: "Lại tìm thấy một khoang đông lạnh nữa."
 infernals.2536.6: "[root.leader.GetName] đã tìm thấy thêm những khoang đông lạnh, mang theo nhiều [root.GetSpeciesNamePlural] từ thời xa xưa đến với hiện tại của chúng ta."
 infernals.2536.7: "[root.leader.GetName] lại tìm thấy thêm một khoang đông lạnh chứa đựng những [root.GetSpeciesNamePlural] đang ngủ đông an toàn."
 infernals.2536.8: "[root.leader.GetName] đã mở khóa thành công một khoang đông lạnh cổ đại trên [planet.GetName], và hiện đang tiến hành liệu pháp chống sốc lạnh cho những cư dân bên trong."
 infernals.2536.9: "Chúng ta đã tìm thấy thêm một khoang đông lạnh có chứa [root.GetSpeciesNamePlural] trên [planet.GetName]."
 infernals.2536.10: "Nhiều [root.GetSpeciesNamePlural] từ thời viễn cổ đang được đánh thức để sát cánh cùng chúng ta."
 # Stage 4
 infernals.2540.name: "Nhà tù Viễn cổ"
 infernals.2540.desc: "Đợt khai quật mới nhất mang lại một khám phá chấn động: Những người ngủ đông này đã tỉnh giấc từ hàng thế kỷ trước, nhưng lại chưa từng rời khỏi cơ sở này.\n\nPhân tích kiến trúc cho thấy, cơ sở này đã bị khóa từ bên ngoài, có vẻ như được dùng để giam cầm họ. Chúng ta đã bị tấn công khi cố gắng cắt phá các cánh cửa gia cố, nhưng sau đó những người ngủ đông lại nhanh chóng rút lui.\n\nKho lưu trữ có lẽ sẽ hé lộ những manh mối hữu ích, nhưng việc tra cứu có nguy cơ làm tình hình thêm phần căng thẳng. Chúng ta có thể lựa chọn đột kích vào cơ sở để nhanh chóng dứt điểm vấn đề, hoặc tìm cách mua chuộc họ để đổi lấy sự hợp tác."
 infernals.2540.a: "Đột kích vào cơ sở."
 infernals.2540.b: "Trao tặng quà cáp và thiện chí."
 INF_ORIGIN_COSMIC_DAWN_STORM: "Đột kích vào Cơ sở Ngủ đông"
 INF_ORIGIN_COSMIC_DAWN_STORM_DESC: "Chúng ta cần phải thâm nhập vào cơ sở, và dùng vũ lực để dẹp bỏ bọn người ngủ đông đã thức tỉnh cản đường."
 infernals.2545.name: "Đột phá Nhà tù"
 infernals.2545.desc: "Quân đội của ta đã tràn vào cơ sở, nhanh chóng khống chế được phần lớn cư dân bên trong mà chỉ vấp phải vài sự kháng cự yếu ớt.\n\nKho lưu trữ cho thấy đây từng là một nhà tù. Những kẻ bị nhốt ở đây đều là những kẻ theo chủ nghĩa cực đoan, ủng hộ việc sử dụng các công nghệ quá khích để hâm nóng lại vũ trụ đang nguội lạnh, trong đó có một vài ý tưởng viển vông, nhưng số khác lại có thể mang đến những hậu quả mang tính thảm họa.\n\nMột số thủ lĩnh §Y[root.GetSpeciesNamePlural]§! tại nhà tù này đã mang theo thuốc nổ và tự nhốt mình trong phòng chứa trung tâm, đe dọa yêu cầu tất cả mọi người phải ở lại và được đông lạnh một lần nữa.\n\nChúng ta có thể xả một loại khí vô hình vào trong các đường hầm để vô hiệu hóa số thuốc nổ này nhằm bảo vệ sự toàn vẹn của kết cấu, nhưng làm vậy sẽ khiến phần lớn những kẻ bị giam cầm trong đó bị ngạt thở nhanh chóng."
 infernals.2545.a: "Bơm khí vào trong các đường hầm."
 infernals.2545.a.tt: "£pop£$POPS$ nhận được: §G+100§!"
 infernals.2545.b: "Nhanh chóng rút quân."
 infernals.2545.b.tt: "£pop£$POPS$ nhận được: §G+400§!"
 INF_ORIGIN_COSMIC_DAWN_BRIBE: "Mua chuộc Cơ sở Ngủ đông"
 INF_ORIGIN_COSMIC_DAWN_BRIBE_DESC: "Nếu chúng ta có thể làm cho những cư dân tại cơ sở này phụ thuộc vào mình, chúng ta sẽ nắm được lợi thế để thương lượng quyền ra vào cơ sở. Chúng ta nên cung cấp cho họ thật nhiều nhu yếu phẩm và tài nguyên thiết yếu."
 infernals.2550.name: "Đột phá Nhà tù"
 infernals.2550.desc: "Sau nhiều tháng trao đổi hàng hóa, những cựu tù nhân từng trong trạng thái ngủ đông này đã dần phụ thuộc vào nguồn tiếp tế của chúng ta. Khi chúng ta đánh tiếng sẽ cắt đứt chuỗi cung ứng, họ lập tức trở nên hoảng loạn và vội vã nhượng lại quyền kiểm soát cơ sở.\n\nKho lưu trữ đã khẳng định lại rằng nơi này từng là một nhà tù. Đám người này trước đây từng cố gắng hết sức để sử dụng các biện pháp công nghệ cực đoan nhằm hâm nóng lại vũ trụ, trong số đó có không ít những ý tưởng điên rồ, phần còn lại dù có khả thi thì cũng tiềm ẩn những hiểm họa chết người.\n\nMay mắn thay, họ dường như đã lãng quên tất cả những chuyện quá khứ đó. Theo quan sát của các nhà khoa học tại hiện trường, những cựu tù nhân này đang dần dần hòa nhập vào cộng đồng, từ từ đạt được sự đồng hóa."
 infernals.2550.a: "Làm tốt lắm."
 infernals.2550.a.tt: "£pop£$POPS$ nhận được: §G+300§!"
 # Stage 5
 infernals.2555.name: "Sự cố Thảm khốc"
 infernals.2555.intro: "Một vụ tai nạn vừa xảy ra tại công trường khai quật mới nhất. Trạm phát điện của cơ sở đã bị hư hại, tuy nhiên các khoang ngủ đông vẫn đang trong tình trạng hoạt động."
 infernals.2555.outro: "Hiện tại chúng ta vẫn chưa thể xác định được hệ thống này còn trụ được bao lâu nữa. Nếu muốn giải cứu những người ngủ đông, chúng ta phải khẩn trương hành động trước khi cơ sở bị mất điện hoàn toàn."
 infernals.2555.desc.a: "$infernals.2555.intro$\n\nMọi sự hoài nghi đang đổ dồn vào nhóm Hỏa ngục vừa mới được đồng hóa dạo gần đây. Có lời đồn đại rằng họ làm việc thiếu sự tận tâm.\n\n$infernals.2555.outro$"
 infernals.2555.desc.b: "$infernals.2555.intro$\n\nHay tin về thảm kịch này, cộng đồng cư dân Hỏa ngục được giải cứu trước đây đã tình nguyện tham gia, góp sức đẩy nhanh quá trình cứu hộ.\n\n$infernals.2555.outro$"
 infernals.2555.a: "Loại trừ những lao động bất trung."
 infernals.2555.b: "Xuất tiền thuê thêm nhân công."
 infernals.2555.c: "Tiến hành cứu hộ tốc hành."
 infernals.2555.d: "Hành động một cách cẩn trọng."
 # Option events from above (Stage 4)
 infernals.2560.name: "Vớt vát Cục diện"
 infernals.2560.desc: "Chúng ta chỉ cho phép những lao động trung thành tuyệt đối mới được phép bước vào, nhằm giảm thiểu rủi ro bị phá hoại.\n\nThật đáng tiếc, do việc sàng lọc an ninh đã làm hạn chế số lượng nhân lực, chúng ta không thể kịp cứu lấy cơ sở này, hậu quả là tất cả những người đang ngủ đông đều đã vong mạng.\n\nNỗi an ủi duy nhất còn sót lại chính là việc được nghiên cứu loại công nghệ này. Sự thoái hóa chậm chạp và quá trình ngừng hoạt động của nó có thể sẽ mang lại cho chúng ta những kiến thức vô cùng giá trị."
 infernals.2560.a: "Thật là một điều đáng tiếc."
 infernals.2565.name: "$infernals.2560.name$"
 infernals.2565.desc: "Chúng ta đã treo thưởng hậu hĩnh cho công tác cứu hộ, và đã nhận được một lượng lớn đơn đăng ký tham gia.\n\nNhưng không may, do bất mãn trước việc chúng ta dùng sự giàu có để khống chế, một tên cựu tù nhân đã có hành động phá hoại, dẫn đến việc toàn bộ những người đang ngủ đông đều phải bỏ mạng.\n\nMay mắn thay, hành vi phá hoại này chỉ mang tính nhắm mục tiêu, chúng ta vẫn có thể nghiên cứu được các kỹ thuật công nghệ cũng như dữ liệu lưu trữ tại đây. Sự cố lần này đã bộc lộ những lỗ hổng trong quá trình sàng lọc, và ngay từ bây giờ chúng ta có thể bắt đầu khắc phục nó."
 infernals.2565.a: "Đúng là một hành vi hèn hạ vô sỉ!"
 infernals.2570.name: "$infernals.2560.name$"
 infernals.2570.intro: "Rất nhiều công nhân và đội ngũ cứu hộ đã đổ xô vào trong cơ sở ngầm, giúp chúng ta có thể nhanh chóng giải cứu an toàn những [Species.GetName] đang chìm trong giấc ngủ khỏi các khoang đông lạnh sắp sửa mất điện. Khi chứng kiến thảm kịch mà mình vừa mới thoát khỏi, những công dân mới này đã bày tỏ lòng biết ơn vô hạn đối với lực lượng cứu hộ."
 infernals.2570.outro: "Thật đáng tiếc, trong lúc vội vàng hỗn loạn, nhiều khoang ngủ đông đã bị hư hại hoặc mở ra, khiến cho giá trị nghiên cứu khoa học bị sụt giảm đi đáng kể."
 infernals.2570.desc.a: "$infernals.2570.intro$\n\n$infernals.2570.outro$"
 infernals.2570.desc.b: "$infernals.2570.intro$\n\nKhông chỉ có vậy, những tình nguyện viên từng là tù nhân giờ đây đã được đồng hóa còn phụ giúp hỗ trợ giao tiếp với những người mới đến, cấp phát nhu yếu phẩm, và trợ giúp họ sớm hòa nhập vào cuộc sống mới.\n\n$infernals.2570.outro$"
 infernals.2570.a: "Cũng may là có nhóm tình nguyện viên chi viện này."
 infernals.2570.a.tt: "£pop£$POPS$ nhận được: §G+400§!"
 infernals.2570.b: "Làm tốt lắm."
 infernals.2570.b.tt: "£pop£$POPS$ nhận được: §G+400§!"
 infernals.2570.c: "$ACKNOWLEDGED$"
 infernals.2570.c.tt: "£pop£$POPS$ nhận được: §G+400§!"
 infernals.2575.name: "$infernals.2560.name$"
 infernals.2575.desc: "Trước khi bắt tay vào giải cứu những người đang ngủ đông, các nhà khoa học của chúng ta đã cẩn thận phân tích từng hệ thống để đảm bảo hiểu rõ từng chi tiết mà chúng ta sắp phải đối phó.\n\nChỉ tiếc là, quá trình từ khi phân tích đến khi đưa ra công bố rồi tiến hành nghiên cứu sâu hơn đã ngốn một khoảng thời gian quá dài. Đến lúc chúng ta đã chuẩn bị sẵn sàng, thì hệ thống duy trì sự sống đã bị sập nguồn, cuối cùng chẳng còn ai sống sót cả.\n\nDù cho kết quả có đau xót đến mấy, thì chiến dịch cứu hộ này cũng đã gặt hái được những thành tựu khoa học to lớn, bản thân công nghệ thu thập được cũng mang trong mình những giá trị đỉnh cao."
 infernals.2575.a: "Mừng thay, người sống rồi cũng được hưởng lợi."
 infernals.2575.b: "$ACKNOWLEDGED$"
 # Situation completed
 infernals.2580.name: "Lịch sử được Phơi bày"
 infernals.2580.desc: "Chúng ta cuối cùng cũng đã đặt chân đến phần lõi trung tâm, với quy mô lớn đến mức khó mà tin nổi. Tồn tại sâu bên trong hành tinh là một tổ hợp kiến trúc hình vòng cung đồ sộ, được cung cấp năng lượng bởi dòng magma, đây là nơi an nghỉ của hàng nghìn người ngủ đông.\n\nNó cũng lưu giữ một kho tàng khổng lồ ghi chép về quá khứ của chúng ta: Sự trỗi dậy của đế chế thiên hà thuở sơ khai, và những lời gửi gắm từ kỷ nguyên Đại tĩnh mịch của vũ trụ. Có những người chọn cách ngủ đông, có những người tiếp tục vùng vẫy trước số mệnh an bài, nhưng cũng có rất nhiều người đã ngã xuống trong khi cố chấp phủ nhận sự thật.\n\nChính kho báu khổng lồ này đã hé lộ chân lý vốn đã bị vùi sâu từ bao đời nay. Một số cho rằng nó minh chứng cho việc chúng ta thực sự là ai và liệu sau này chúng ta sẽ trở thành người thế nào. Tuy nhiên, những người khác lại lập luận rằng, chúng ta đã gây dựng nên một bản thể hoàn toàn mới đầy triển vọng, cấu trúc xã hội của thế hệ đi trước đã không còn phù hợp với bối cảnh của vũ trụ ngày nay nữa.\n\nDù kết quả ra sao, hệ thống đường hầm chằng chịt và bao la này đều có thể được tận dụng để phục vụ cho mọi định hướng của chúng ta."
 infernals.2580.a: "Chúng ta phải tái thiết lại đế chế thời viễn cổ."
 infernals.2580.b: "Các đế chế khác nên biết tôn trọng di sản của chúng ta."
 infernals.2580.b.tt: "Lãnh đạo nhận được: £commander£§Y$commander$§!, cấp độ khởi điểm §G5§!"
 infernals.2580.c: "Chúng ta nên tập trung hướng về tương lai."
 infernals.2580.d: "Vấn đề cốt lõi là chúng ta phải hành thiện."
 # Relic & Specimen
 r_pyroglyphic_codex: "Hỏa Văn Điển Tịch"
 r_pyroglyphic_codex_desc: "Một thiết bị thiên văn học tinh thể phức tạp, lưu trữ lượng thông tin đồ sộ về một nền văn minh từ cổ chí kim, với nội dung chính tập trung giảng giải về cách thức để xã hội phát triển rực rỡ."
 r_pyroglyphic_codex_effect_tt: "\nSau khi kích hoạt lần đầu §!$r_pyroglyphic_codex$§Y, thủ đô sẽ được bổ sung vĩnh viễn hiệu ứng §Y$infernal_library$§!, cụ thể như sau:$TABBED_NEW_LINE$—$MOD_PLANET_MAX_DISTRICTS_ADD$: §G+5§!$TABBED_NEW_LINE$—$MOD_PLANET_HOUSING_MULT$: §G+20%§!$TABBED_NEW_LINE$—$MOD_PLANET_AMENITIES_ADD$: §G+10%§!"
 infernal_library: "Kiến trúc Lòng đất"
 infernal_library_desc: "Nghệ thuật kiến trúc thời viễn cổ vừa được tái khám phá trên hành tinh này, đã hé mở một hướng đi mới cho việc kiến tạo nên những thành phố hang động khổng lồ. Với những chi tiết và cấu trúc chưa từng có làm cho người ta phải kinh ngạc, nó nhắc nhở cho muôn dân về nguồn gốc thực sự của mình."
 pyroglyphic_codex_mod: "$r_pyroglyphic_codex$"
 pyroglyphic_codex_mod_desc: "Những bí mật đầy mê hoặc được khai phá từ trong Hỏa Văn Điển Tịch đang dẫn dắt những hướng nghiên cứu hoàn toàn mới mẻ, và sẽ là nguồn khơi gợi cảm hứng khoa học suốt hàng năm trời."
 infernal_stasispod: "Khoang Ngủ đông Viễn cổ"
 infernal_stasispod_desc_short: "Một cỗ quan tài được đẽo gọt từ đá tổng hợp, trang bị hệ thống kiểm soát nhiệt độ tinh vi bậc nhất."
 infernal_stasispod_desc_details: "Người [Species.GetName] thời viễn cổ đã sử dụng những chiếc khoang ngủ đông này cho giấc ngủ kéo dài suốt hàng tỷ năm, và chỉ khi nào mức nhiệt độ môi trường tăng lên đến ngưỡng có thể duy trì sự sống thì nó mới tự động đánh thức người bên trong. Tại các cơ sở nơi mà chiếc khoang này được tìm thấy, hầu hết các hệ thống đã không còn hoạt động, và những người bên trong cũng đã tử vong, chính cơ sở này đã trở thành một đài tưởng niệm trang nghiêm về bao thăng trầm gian khổ của những người [Species.GetName] còn sống sót."
 ####################################
 # Sự kiện Thuộc địa
 ####################################
 # Imminent Eruption
 infernals.3000.name: "Sắp Phun trào"
 infernals.3000.desc: "Hệ thống cảnh báo địa chất đã phát đi thông báo khẩn, dự báo có khả năng cao sẽ xảy ra một đợt phun trào núi lửa gần khu định cư chính trên §Y[planet.GetName]§! trong vòng một năm tới.\n\nChúng ta có thể đổ dồn tài nguyên vào việc giảm áp có kiểm soát, nhằm tận dụng dòng chảy dung nham để phục vụ cho việc phát điện địa nhiệt, đồng thời cắt cử thêm nhân sự túc trực để thu thập magma nhằm chiết xuất những loại kim loại quý hiếm khi hiện tượng phun trào xảy ra; hoặc tập trung tổng lực vào việc sơ tán thường dân cùng với các vật tư thiết yếu trong khu vực, để cố gắng giảm thiểu rủi ro xuống mức thấp nhất.\n\nBởi lẽ những dự báo này hoàn toàn có thể xảy ra sai số, chúng ta cũng có thể chọn cách tạm thời án binh bất động, và tiếp tục duy trì việc theo dõi."
 infernals.3000.a: "Rút lui khẩn cấp!"
 infernals.3000.a.tt: "Cần §Y500§!$energy$."
 infernals.3000.b: "Quan sát và chờ đợi."
 infernals.3000.c: "Tập trung phát điện."
 infernals.3000.d: "Thu thập magma."
 infernals.3005.name: "Sơ tán Kịp thời"
 infernals.3005.desc: "Quyết định sơ tán thuộc địa trước quả thực là một nước cờ đúng đắn. Núi lửa đã phun trào sớm hơn dự kiến, gây ra hư hại nghiêm trọng cho các công trình. Sau khi áp suất ngầm dưới lòng đất đã giảm đi, những người định cư giờ đây đã có thể quay trở về để bắt đầu quá trình tái thiết một cách an toàn."
 infernals.3010.name: "Cơn thịnh nộ của Núi lửa"
 infernals.3010.desc: "Núi lửa đã bùng nổ trước thời hạn, khiến cho thuộc địa bị một phen trở tay không kịp, các cơ sở hạ tầng đã bị phá hủy một cách nặng nề, kèm theo những tổn thất sinh mạng vô cùng lớn."
 infernals.3015.name: "Quan sát và chờ đợi."
 infernals.3015.desc: "Vài tháng trôi qua, hoạt động núi lửa xung quanh thuộc địa trên §Y[planet.GetName]§! đã dần lắng xuống. Dù rằng nguy cơ tiềm ẩn về lâu dài vẫn còn đó, nhưng chí ít thì thuộc địa hiện tại vẫn đang được an toàn."
 infernals.3015.a: "Chấp nhận mạo hiểm cũng đáng."
 infernals.3020.name: "Nâng cấp Lưới điện"
 infernals.3020.desc: "Đội ngũ kỹ thuật đã thi công xong hệ thống an ninh, giúp xả bớt khối magma áp suất cao từ lòng đất một cách chậm rãi, và thông qua các tổ hợp phát điện để chuyển hóa thứ năng lượng đó thành điện năng, nhờ vậy mà hiệu suất lưới điện của thuộc địa đã được gia tăng một cách rõ rệt trong thời gian ngắn."
 infernals.3025.name: "Thu thập Magma"
 infernals.3025.desc: "Hiện tượng phun trào núi lửa đã bị ngăn chặn thành công bởi bộ nhiễu sóng siêu âm cùng với lớp rào chắn vật lý, một lượng lớn magma đã bị giữ lại trên bề mặt và dần đông cứng. Các đội khai thác đã bắt tay vào tiến hành khai thác những vỉa quặng này."
 # Lava Sports
 infernals.3030.name: "Thể thao Dung nham"
 infernals.3030.desc: "Có thể nhiều người sẽ cho rằng chẳng ai dại dột gì mà lại gần dòng chảy dung nham cuồn cuộn trên bề mặt mở, nhưng ở trên §Y[planet.GetName]§! thì lại hoàn toàn khác.\n\nNhững cư dân định cư đã điều khiển chiếc xuồng lượn của mình băng qua những dòng dung nham đang sôi trào, lạng lách để né những tảng đá khổng lồ đang trôi nổi, rồi tăng tốc để vượt qua những thác dung nham ngoạn mục. Đã có kẻ bắt đầu cá cược cho kết quả của những trận đua này, và các sòng bạc mọc lên thậm chí còn thu hút cả những nhóm tội phạm có tổ chức. Một số ít tay đua thậm chí đã phải bỏ mạng trong những tai nạn đáng tiếc.\n\nPháp luật vẫn chưa hề có quy định cấm đối với hành động này, bởi vì có lẽ chẳng ai nghĩ tới việc lại có người liều lĩnh tới nhường vậy. Chúng ta có thể mắt nhắm mắt mở làm ngơ trước sự cuồng nhiệt của họ, và để họ tự do vui chơi, nhưng với tình trạng cờ bạc ngày càng nở rộ, nó có nguy cơ làm nảy sinh những hành vi nguy hiểm hơn, thậm chí là tội phạm. Hoặc là, chúng ta có thể siết chặt các quy định quản lý môn thể thao này, dù cho có thể sẽ vấp phải nhiều sự phàn nàn, nhưng về lâu về dài sẽ giúp giảm thiểu thương vong cùng với tội phạm. Cũng có một cách khác là cấm tiệt nó luôn, dù là cách giải quyết nhanh gọn nhất nhưng lại tiêu tốn nhiều chi phí để thực thi."
 infernals.3030.a: "Cứ để chúng mặc sức tung hoành đi."
 infernals.3030.b: "Kiểm soát môn thể thao này."
 infernals.3030.c: "Chấm dứt ngay cái trò ngu ngốc này!"
 lava_surfboard: "Ván Lướt sóng Dung nham"
 lava_surfboard_desc_short: "Một tấm ván dài được chế tạo từ thép, phần dưới đáy được hàn ghép với thiết bị nâng nổi tự chế."
 lava_surfboard_desc_details: "Tấm ván lướt sóng được sử dụng trong môn thể thao dung nham trên [Event.Planet.GetName] này mặc dù được chắp vá từ vô số các mảnh linh kiện khác nhau, nhưng lại thể hiện một sự khéo léo cùng với trí tưởng tượng phi thường. Khả năng nâng nổi và bảo vệ khỏi sức nóng của tấm ván này được đánh giá rất cao, bên cạnh đó, thiết kế bề ngoài của nó cũng phản chiếu tinh thần tự lực tự cường đầy kiên cường của những người tiên phong vùng biên viễn."
 infernals.3035.name: "Cứ để chúng mặc sức tung hoành đi!"
 infernals.3035.desc: "Khi chúng ta cho phép người dân tự do chạy theo trào lưu này, môn thể thao dung nham đã thực sự tạo nên một cơn sốt dữ dội. Khung cảnh những chiếc xuồng bay lao vút trên dòng dung nham cuồn cuộn đã nhanh chóng trở thành biểu tượng văn hóa tiêu biểu của §Y[planet.GetName]§!.\n\nĐiều đáng tiếc là, sự cuồng nhiệt thái quá đã làm lu mờ đi vấn đề an toàn, dẫn đến việc liên tiếp có những báo cáo tản mác về các trường hợp tử vong do đua thuyền. Bọn cho vay nặng lãi dường như cũng đang thừa nước đục thả câu để trục lợi từ máu cờ bạc của những người đam mê thể thao dung nham. Dù nhận được sự ủng hộ nồng nhiệt từ công chúng, chúng ta vẫn phải tiếp tục theo dõi sát sao để đề phòng những hệ lụy tiêu cực có thể nảy sinh."
 infernals.3035.a: "Thật là một sự tình đáng lo ngại."
 infernals.3040.name: "Chỉ thị An toàn"
 infernals.3040.desc: "Ban đầu, những người dân định cư đã kịch liệt phản đối việc chính quyền đế quốc can thiệp vào sở thích của họ, tuy nhiên những biện pháp an toàn mới được áp dụng cho việc đua thuyền đã gần như loại trừ triệt để mọi vụ tai nạn khi lướt sóng, các tay đua bắt đầu lên tiếng ca ngợi những quy định này vì đã bảo vệ sự an toàn cho chính họ, và công chúng cũng dần dần chấp nhận.\n\nCác hoạt động đánh bạc liên quan đến môn thể thao dung nham cũng đã phải tuân thủ nguyên tắc minh bạch tài chính và chịu sự quản lý thuế, nguồn thu này sẽ được dùng để trang bị đồ bảo hộ cho người tham gia. Mặc dù vẫn còn một số nhỏ lên tiếng oán trách chính quyền đánh thuế không công bằng, nhưng hầu hết các phần tử tội phạm trong sòng bạc đã bị dẹp yên."
 infernals.3040.a: "An toàn là trên hết, có những chuyện một khi đã xảy ra thì hối cũng không kịp."
 infernals.3045.name: "Lệnh Cấm Thể thao"
 infernals.3045.desc: "Cơ quan thi hành án đã ra tay dẹp bỏ hành vi nguy hiểm này. Bất chấp sự phản đối dữ dội từ công chúng, những cuộc biểu tình đã bùng nổ khắp nơi trên thuộc địa. Nhưng các dòng dung nham đã được đặt dưới sự giám sát liên tục, khiến các tay đua cũng chẳng còn cơ hội để mà tham gia nữa, số ca tử vong đã trở về mốc không, và các sòng bạc cũng gần như không còn bóng dáng."
 infernals.3045.a: "Ngoài cách đó ra, chẳng còn con đường nào khác."
 lava_sports_flow: "Thể thao Dung nham: §GCho phép§!"
 lava_sports_flow_desc: "Cho phép những người định cư tự do chạy theo trào lưu này, làm dấy lên cơn sốt thể thao dung nham cuồng nhiệt."
 lava_sports_regulated: "Thể thao Dung nham: §YQuản lý§!"
 lava_sports_regulated_desc: "Ban đầu, những người dân định cư đã kịch liệt phản đối việc chính quyền đế quốc can thiệp vào sở thích của họ, tuy nhiên những biện pháp an toàn mới được áp dụng cho việc đua thuyền đã gần như loại trừ triệt để mọi vụ tai nạn khi lướt sóng, các tay đua bắt đầu lên tiếng ca ngợi những quy định này vì đã bảo vệ sự an toàn cho chính họ, và công chúng cũng dần dần chấp nhận."
 lava_sports_banned: "Thể thao Dung nham: §RLệnh cấm§!"
 lava_sports_banned_desc: "Cơ quan thi hành án đã ra tay dẹp bỏ hành vi nguy hiểm này."
 # Kindled Myths
 infernals.3055.name: "Huyền thoại được Thắp sáng"
 infernals.3055.desc: "Các cá thể thuộc một giống loài siêu quang tốc nguyên thủy tại §Y[pre_ftl_planet.GetName]§! có diện mạo cực kỳ giống với những vị thần trong truyền thuyết cổ xưa nhất của chúng ta, điều này có thể giải thích một phần là do hiện tượng tiến hóa hội tụ cũng như quy luật tâm lý học phổ quát, nhưng khi chúng ta càng đi sâu vào tìm hiểu giống loài này, thì sự liên kết ấy lại càng trở nên rõ nét hơn.\n\nLiệu chúng có thật sự là những sinh vật bước ra từ những câu chuyện thần thoại của chúng ta hay không? Khả năng này đã thu hút được rất nhiều sự quan tâm, chúng ta có thể rót thêm nguồn lực để đẩy mạnh quá trình nghiên cứu. Nhưng đôi khi, một chuỗi những sự trùng hợp cũng chẳng hề mang một hàm ý sâu xa nào cả, việc cố gắng tìm hiểu sâu xa hơn có thể sẽ làm bại lộ sự tồn tại của chúng ta, gây ra những hệ lụy không thể lường trước."
 infernals.3055.a: "Hãy bỏ qua sự trùng hợp này."
 infernals.3055.b: "Điều tra sâu hơn."
 infernals.3060.name: "Giả thuyết Ngớ ngẩn"
 infernals.3060.desc: "Mặc dù đã có không ít người lên tiếng kêu gọi điều tra, thế nhưng việc tiếp tục theo đuổi cái giả thuyết về những người ngoài hành tinh trong thần thoại kia hoàn toàn không phải là một quyết định sáng suốt. Suy cho cùng thì giống loài đó cũng có những câu chuyện thần thoại, những truyền thuyết và cả những quan niệm về nhân sinh quan riêng biệt, và rất có thể chúng sẽ hoàn toàn khác xa với những gì mà chúng ta đã giả định. Các cuộc nghiên cứu liên quan hiện đã bị đình chỉ, và nguồn kinh phí sẽ được phân bổ lại cho các lĩnh vực khác."
 infernals.3060.a: "Vừa quen lại vừa lạ."
 infernals.3065.name: "Sự Biến động của Nền văn minh Nguyên thủy"
 infernals.3065.desc: "Do quá nôn nóng muốn gán ghép giống loài này với thần thoại, các đặc vụ của chúng ta đã phớt lờ đi quy trình an toàn đối với các tiếp xúc liên quan đến nền văn minh siêu quang tốc nguyên thủy. Cư dân bản địa trên khắp hành tinh đã nhiều lần ghi lại được hình ảnh tàu của chúng ta, chúng đánh cắp thiết bị, thậm chí đã có một lần chúng bắt cóc cả một đặc vụ của chúng ta để làm vật thí nghiệm. Sau khi phát hiện ra sự tồn tại của chúng ta, giống loài này đã nổ ra bạo loạn và có những phản ứng trái ngược nhau.\n\nMặc dù quá trình diễn ra có phần rối loạn, thế nhưng sợi dây liên kết trong thần thoại này lại khiến cho công chúng nước ta cảm thấy vô cùng phấn khích, hiện tại toàn bộ đế chế đang có cái nhìn đối với giống loài này dưới một lăng kính nhuốm màu tín ngưỡng tâm linh."
 infernals.3065.a: "Đáng lẽ ra chúng ta phải cẩn thận hơn."
 infernals.3070.name: "Phát hiện Đáng kinh ngạc"
 infernals.3070.desc: "Quá trình nghiên cứu sâu rộng về các cư dân tại §Y[pre_ftl_planet.GetName]§! đã bác bỏ hoàn toàn giả thuyết về mối liên hệ thần thoại, cho dù thực tế có rất nhiều điểm tương đồng giữa hai bên, thế nhưng cuối cùng người ta vẫn tìm ra được những điểm khác biệt không thể dung hòa.\n\nMặc dù tình hình đã trở nên phức tạp hơn, nhưng sự quan tâm dành cho giống loài này vẫn không hề thuyên giảm. Có một luồng ý kiến cho rằng, bọn họ chính là hậu duệ của những sinh linh nguyên thủy trong các câu chuyện của chúng ta, và sự khác biệt đó là kết quả của một quá trình tiến hóa dài đằng đẵng. Tuy phải thừa nhận rằng giờ đây họ đã tạo nên một cộng đồng hoàn toàn độc lập, nhưng đối với nhiều người trong đế chế, họ vẫn cảm nhận được một mối liên kết tâm linh vô cùng bền chặt với họ."
 infernals.3070.a: "Đối với chúng ta mà nói, thì đây là một thành quả vô cùng vĩ đại."
 # Molten Core Grand Archive specimen
 infernals.3200.name: "Lõi Nóng chảy"
 infernals.3200.desc: "Theo đà mở rộng không ngừng của thuộc địa tại §Y[planet.GetName]§!, ngày càng có thêm nhiều chứng cứ chứng minh sự tồn tại của một nền văn minh đã tuyệt duyệt từng hoạt động tại đây và đã sử dụng đến $sr_living_metal$, dù cho đến tận bây giờ người ta vẫn chưa thể tìm thấy được chút vết tích nào về cách thức mà họ đã thu thập được vật liệu này.\n\nMới đây một lời giải đáp đã xuất hiện: một quả cầu bọc trong từ trường, phát ra ánh sáng kỳ lạ, đang chầm chậm nhô lên từ dòng dung nham sâu dưới lòng đất. Dù chưa thể rõ cấu tạo và mục đích ban đầu của nó, nhưng ở điều kiện nhiệt độ cực cao, nó sẽ không ngừng tiết ra $sr_living_metal$. Phát hiện này một mặt đã khéo léo hóa giải được bí ẩn khảo cổ kia, nhưng mặt khác nó lại đẩy chúng ta vào một bài toán mới - liệu chúng ta nên xử lý nó như thế nào."
 infernals.3200.a: "Hãy giữ lại di vật này."
 infernals.3200.a.accept: "Khối kỳ vật này là thứ mà chúng ta chưa bao giờ nghiên cứu và chế tạo được, nó không chỉ là một nguồn cung cấp $sr_living_metal$ vô cùng quý giá, mà còn mang trong mình những giá trị về khoa học và lịch sử to lớn."
 infernals.3200.b: "Ném nó trở lại vào dung nham."
 infernals.3200.b.deny: "Chẳng có gì đáng ca ngợi về một chủng tộc bị tuyệt diệt chỉ vì không thể tự thay đổi mình. Những di vật này nên bị phá hủy và để nó chìm vào quên lãng vĩnh viễn trong dòng chảy lịch sử."
 infernal_molten_core: "Lõi Nóng chảy"
 infernal_molten_core_desc_short: "Một khối cầu lấp lánh sắc bạc trắng, được bao bọc bên trong một trường lực phát ra tiếng rít nhẹ, bề mặt điểm xuyết những đường vân hệt như kim loại lỏng."
 infernal_molten_core_desc_details: "Trường lực của vùng lõi sẽ chỉ giãn ra khi gặp phải nhiệt độ cao, tạo điều kiện cho một giọt $r_living_metal$ trào ra. Những kẻ tạo ra vùng lõi này từ thuở sơ khai có lẽ đã khuất bóng từ lâu, nhưng hiện tại nó vẫn là một minh chứng hùng hồn cho kiến thức khoa học uyên bác cùng với khả năng sáng tạo vượt bậc của họ."
 # CD Timeline events
 TIMELINE_EVENT_ORIGIN_CD_START: "Thanh âm từ Vực thẳm\n§L[GetDate]§!"
 TIMELINE_EVENT_ORIGIN_CD_START_TOOLTIP: "§HTruy lùng Vết tích§!\n§YSự kiện Nguồn gốc§!\n\nChúng ta đã thu được một chuỗi tín hiệu phức tạp rất yếu ớt phát ra từ sâu bên trong lòng đất, có nguồn gốc từ một mạng lưới cấu trúc cổ kính khổng lồ ẩn sâu dưới lớp vỏ hành tinh, những công trình này vốn dĩ đã tồn tại từ trước khi chúng ta chìm vào giấc ngủ miên man dài đằng đẵng kia."
 TIMELINE_EVENT_ORIGIN_CD_END: "Lịch sử được Mở khóa\n§L[GetDate]§!"
 TIMELINE_EVENT_ORIGIN_CD_END_TOOLTIP: "§HHoàn thành Chuỗi Sự kiện§!\n§YSự kiện Nguồn gốc§!\n\nChúng ta đã phát hiện ra một công trình kiến trúc viễn cổ khổng lồ nằm ẩn sâu bên trong lòng hành tinh, đồng thời khai quật được một cuốn cổ thư ghi chép lại những tri thức đã bị thất truyền. Chúng ta mang trong mình sứ mệnh thừa kế một di sản cổ xưa và mạnh mẽ, và giờ đây, chúng ta đã sẵn sàng để tiếp nhận món quà vô giá này."
