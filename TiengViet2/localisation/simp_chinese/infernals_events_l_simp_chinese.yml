 ####################################
 # useful refs:
 # [From.GetName] hành tinh
 # [From.GetStarName]
 # [Leader.GetName] nhà khoa học
 spires_of_light_category: "Tháp Ánh sáng"
 spires_of_light_category_desc: "Quét sơ bộ cho thấy một loạt cấu trúc phát sáng cao chót vót nổi lên giữa một địa hình bình thường. Nguồn gốc và mục đích của chúng vẫn chưa rõ ràng, nhưng ánh sáng rực rỡ của chúng cho thấy đây không chỉ là hiện tượng tự nhiên."
 infernals.500.name: "$spires_of_light_category$"
 infernals.500.desc: "Tàu thăm dò được cử đến điều tra các cột phát sáng xác định rằng chúng được hình thành từ dung nham silicat có tính dẻo. Vật chất này bị đẩy lên qua các khe nứt của nền đá nền, đông cứng trước khi có thể xuyên thủng bề mặt, tạo thành các cấu trúc có thể cao tới hàng trăm mét, cuối cùng tự sụp đổ do sức nặng của chính mình.\n\nQuá trình này tạo nên một khu rừng gồm các ngọn tháp được làm từ thủy tinh núi lửa gần như trong suốt và tinh khiết, mỗi ngọn tháp phản chiếu ánh sáng màu cam ấm áp từ lớp dung nham vẫn đang cuồn cuộn bên dưới.\n\nNhà khoa học [Leader.GetName] suy đoán rằng những mảnh vỡ của các ngọn tháp sụp đổ này có thể trở thành một nguồn tài nguyên quý giá."
 #EXCELLENT:0 (first option has default answer)
 infernals.500.a: "Lặng lẽ rời khỏi nơi linh thiêng này."
 infernals.500.b: "Tham gia đấu thầu giấy phép khai thác."
 infernals.500.c: "Dùng làm bia tập bắn."
 lava_whirlpool_category: "Xoáy nước Dung nham"
 lava_whirlpool_category_desc: "Khảo sát đầu tiên trên [Planet.GetName] đã phát hiện một dạng hình thái giống như bão kỳ lạ trong biển dung nham chính của hành tinh, cực kỳ hiếm thấy và xứng đáng được điều tra sâu hơn."
 infernals.56.name: "Xoáy nước Dung nham"
 infernals.56.desc: "[Leader.GetName] đã xác nhận hình thái kỳ lạ này là một xoáy nước dung nham. Hiện tượng này cực kỳ hiếm gặp và chưa từng được ghi nhận với quy mô lớn như vậy. [Leader.GetName] kinh ngạc trước hiện tượng kỳ thú này và đã ra lệnh tiến hành nhiệm vụ thu thập mẫu.\n\nCác mẫu vật cho thấy hoạt động của xoáy nước phần nào được duy trì bởi một hồ kim loại sống ổn định: kim loại sống sau khi bị dòng chảy xé toạc đang cố gắng tái hợp, quá trình tái hợp này tiếp tục khuấy động dung nham, duy trì hoạt động của xoáy nước. Việc thu thập mẫu cũng cho thấy việc khai thác loại kim loại sống này tương đối dễ dàng."
 infernals.56.a: "Khởi động hoạt động khai thác."
 outgassing_category: "Thoát khí"
 outgassing_category_desc: "Quét thường quy trên [Planet.GetName] phát hiện sự biến động hóa học bất thường trong bầu khí quyển. Một cuộc điều tra sâu hơn có thể hé lộ sự thật."
 infernals.1001.name: "Thoát khí"
 infernals.1001.desc: "Sự biến động hóa học trong bầu khí quyển đã được xác nhận theo thời gian và phạm vi bề mặt, và nó diễn ra mạnh mẽ nhất trên biển dung nham khổng lồ trơ trọi của hành tinh, do đó tàu thăm dò đã được cử đến để lấy mẫu.\n\nSau khi phân tích kỹ lưỡng, [Leader.GetName] xác nhận rằng biển dung nham trên [Planet.GetName] đang giải phóng một loại khí tự nhiên dị hành tinh quý hiếm. Khám phá bất ngờ này cho thấy, nếu được khai thác thành công, hành tinh này có thể trở thành một nguồn cung cấp tài nguyên tiềm năng cho nền công nghiệp của chúng ta."
 infernals.1001.a: "Khởi động quy trình khai thác."
 crystal_lava_lakes_category: "Hồ Dung nham Tinh thể"
 crystal_lava_lakes_category_desc: "Bề mặt của hành tinh này dường như có những hồ dung nham chảy tự do rộng lớn, có thể có tiềm năng khai thác tài nguyên và xứng đáng được điều tra sâu hơn."
 infernals.1002.name: "Hồ Dung nham Tinh thể"
 infernals.1002.desc: "Những hình ảnh đầu tiên từ bề mặt của [Planet.GetName] đã tiết lộ một cấu trúc địa chất chấn động và ngoài dự kiến, được gọi là \"Hồ Dung nham Tinh thể\". Những khối dung nham này đã tồn tại từ lâu, chứa các khoáng chất đặc biệt có khả năng tự sắp xếp thành cấu trúc tinh thể ở các dải nhiệt độ nhất định. Nhờ đó, bề mặt hồ trông vô cùng trong suốt và lấp lánh ánh kim màu đỏ. Dưới ảnh hưởng của quỹ đạo hành tinh, hiệu ứng thị giác này biến động theo chu kỳ thay đổi nhiệt độ theo mùa.\n\nCảnh quan tuyệt đẹp của Hồ Dung nham Tinh thể có thể thu hút một lượng lớn du khách. Các khoáng chất tinh thể trong hồ có thể được thu thập trong thời kỳ hoạt động để phát triển các phương tiện lưu trữ năng lượng."
 infernals.1002.a: "Phát triển nơi này thành khu nghỉ dưỡng."
 infernals.1002.b: "Khai thác năng lượng từ hồ."
 crystal_lava_resort: "Khu nghỉ dưỡng Hồ Dung nham Tinh thể"
 crystal_lava_resort_desc: "Những hồ dung nham tinh thể tuyệt đẹp trên bề mặt hành tinh này đã được phát triển thành các khu du lịch sang trọng, thu hút du khách từ khắp thiên hà."
 bioadaptive_flora_category: "Thảm thực vật Thích nghi Sinh học"
 bioadaptive_flora_category_desc: "[Planet.GetName] trông giống như một vùng đất hoang núi lửa điển hình, nhưng nồng độ oxy lại cao bất thường, chắc chắn phải có một loài sinh vật đặc biệt nào đó đang tạo ra oxy."
 infernals.1003.name: "Thảm thực vật Thích nghi Sinh học"
 infernals.1003.desc: "Ban đầu [Planet.GetName] được đánh giá là một hành tinh dung nham rực lửa điển hình, tuy nhiên quá trình điều tra đã phát hiện ra một hệ sinh thái thực vật bản địa phức tạp tồn tại trong các thung lũng nứt nẻ đan chéo trên bề mặt hành tinh. Những loài thực vật này có khả năng tạo ra oxy và thu thập lượng nước ít ỏi, hình thành nên các khu vực vi khí hậu gần như ôn đới giữa vùng đất hoang rực lửa.\n\nHệ sinh thái này tạo ra môi trường sống phù hợp cho những giống loài vốn không thể sống sót trên hành tinh núi lửa, và bản thân thảm thực vật cũng có thể phù hợp để phát triển nông nghiệp. Đề xuất những người định cư đi sâu vào hẻm núi để khám phá chi tiết các sinh vật trong đó."
 infernals.1003.a: "Đánh dấu khu vực là khu vực phù hợp định cư."
 infernals.1003.tooltip_a: "Thêm một công cụ sửa đổi hành tinh giúp tăng khả năng chống chịu tính cư trú và tốc độ tăng trưởng."
 bioadaptive_flora_modifier: "Thảm thực vật Thích nghi Sinh học"
 bioadaptive_flora_modifier_desc: "Thảm thực vật bản địa kiên cường bao phủ các thung lũng nứt nẻ trên hành tinh này, tạo ra các khu vực vi khí hậu mát mẻ và giàu oxy hơn, giúp duy trì khả năng cư trú hạn chế ngay cả trong môi trường núi lửa."
 tectonic_icebreaker_category: "Hoạt động Phá băng Kiến tạo"
 tectonic_icebreaker_category_desc: "Hiện tượng nhiệt độ thấp bất thường đã được phát hiện trong lớp regolith của [Planet.GetName], một quá trình hoặc vật thể nào đó có thể đang làm nguội đi một số khu vực trên bề mặt. Quá trình khoan khảo sát sẽ hé lộ thêm thông tin."
 infernals.1004.name: "Hoạt động Phá băng Kiến tạo"
 infernals.1004.desc: "[Leader.GetName] báo cáo rằng bên dưới bề mặt núi lửa của §Y[from.GetName]§! tồn tại những dòng sông băng rộng lớn, được bao bọc bởi các lớp đá khoáng chất đặc biệt có đặc tính cách nhiệt tuyệt vời. Các hoạt động kiến tạo đang từ từ phá hủy những lớp cách nhiệt này, và [Leader.GetName] dự đoán rằng nếu sông băng và các khu vực khác của hành tinh đạt đến mức cân bằng nhiệt độ, hành tinh sẽ giảm nhiệt đáng kể, chuyển từ một hành tinh núi lửa thành một hành tinh khô cằn,\n\nChúng ta có thể đẩy nhanh quá trình này để cải thiện khả năng cư trú của nó. Tuy nhiên, hiện tượng này có giá trị khoa học rất lớn và cũng có thể để nó diễn biến tự nhiên để thuận tiện cho việc nghiên cứu."
 infernals.1004.a: "Ổn định hoạt động kiến tạo."
 infernals.1004.b: "Đẩy nhanh quá trình tan chảy sông băng."
 infernal_oasis_category: "Ốc đảo Hỏa ngục"
 infernal_oasis_category_desc: "Những hình ảnh chấn động từ §Y[from.GetName]§! cho thấy một khu vực màu xanh lá cây rực rỡ, rộng bằng một lục địa, đột nhiên xuất hiện trên một hành tinh đang cháy rực và tan chảy. Cảnh tượng hiếm gặp này cho thấy một tình trạng cực kỳ bất thường trên bề mặt của nó."
 infernals.505.name: "Nơi Tôn ẩn Giữa Thảm họa"
 infernals.505.desc: "Cấu trúc địa chất và đặc điểm kiến tạo độc đáo của §Y[from.GetName]§! đã tạo nên một kỳ quan hiếm có và tráng lệ. Phần lớn diện tích hành tinh là sa mạc nóng bức, ngập tràn khói núi lửa và dung nham chảy xiết. Một mảng đá lục địa khổng lồ và vững chắc đã trồi lên từ lớp vỏ, cao vút lên hàng chục kilomet so với bề mặt. Cao nguyên được hình thành từ đó vươn lên trên những đám mây độc hại, nuôi dưỡng hệ động thực vật bản địa và hình thành một hệ sinh thái thịnh vượng.\n\nCao nguyên này không chỉ phù hợp làm nơi sinh sống cho nhiều giống loài mà còn có thể ẩn chứa những bí ẩn khoa học kinh ngạc."
 infernals.505.a: "Một khám phá đáng kinh ngạc."
 NAME_Vermilion: "Vermilion"
 NAME_Kira: "Kira"
 mysterious_ringing_category: "Tiếng Rung Bí ẩn"
 mysterious_ringing_category_desc: "Các nhà khoa học đã nắm bắt được các đỉnh sóng vô tuyến đều đặn tại một địa điểm trên [Planet.GetName], dường như đồng bộ hóa với thời gian chuyển đổi từ đêm sang ngày của nguồn tín hiệu."
 infernals.3210.name: "Tiếng Rung Bí ẩn"
 infernals.3210.desc: "Đội ngũ nghiên cứu khoa học đã đến [from.GetName] để theo dõi tín hiệu này và xác nhận nó xuất phát từ một hệ thống hang động ngầm, bên trong hang động có trang bị các thiết bị nghiên cứu khoa học.\n\n[Leader.GetName] đã dẫn đội đi sâu vào hang động và phát hiện một mật thất được phong ấn bằng hợp kim chưa biết tên, từ bên trong vọng ra tiếng rung yếu ớt. [GetMysteriousRingingDesc3210]\n\nSau khi trang bị thiết bị bảo vệ thính giác và tiến vào, mọi người phát hiện một sinh vật không rõ nguồn gốc đang ngủ say, và bên cạnh nó chính là nguồn phát ra tín hiệu: một thiết bị hình trụ kỳ lạ.\n\nKết quả phân tích cho thấy, thiết bị này định kỳ phát ra các xung vô tuyến và phát ra âm thanh giống như âm nhạc trong vài giờ, cũng như âm thanh tương tự sinh vật đó. [Leader.GetName] suy đoán mục đích của nó là đánh thức sinh vật đó theo một lịch trình cố định."
 infernals.3210.individual: "Đội ngũ điều tra phát hiện một điểm yếu ở lớp phong ấn, sau khi phá vỡ nó, âm thanh lập tức trở nên đinh tai nhức óc, gây ra hoảng loạn và giận dữ trong số các thành viên."
 infernals.3210.gestalt: "Đội ngũ điều tra phát hiện một điểm yếu ở lớp phong ấn, sau khi phá vỡ nó, âm thanh lập tức trở nên đinh tai nhức óc, dẫn đến quá tải giác quan ở các cá thể con, khiến chúng sụp đổ nhận thức."
 infernals.3210.a: "Sao chép tài liệu nghiên cứu của nó rồi rút lui."
 infernals.3210.b: "Cố gắng đánh thức và chiêu mộ sinh vật này."
 infernals.3210.btt: "Lãnh đạo nhận được: £scientist£§Y$scientist$§!, cấp độ khởi điểm §G4§!."
 infernals.3210.c: "Đánh cắp thiết bị."
 infernals.3210.ctt: "Công nhân được hưởng lợi từ việc liên tục được nhắc nhở quay lại làm việc. Mở khóa quyết định: §G+10%§! sản lượng £job£['concept_jobs'], §R-5%§! £happiness£['concept_happiness']."
 decision_planetary_workshift: "Bắt buộc thực thi chế độ làm việc theo ca trên hành tinh."
 decision_planetary_workshift_desc: "$planetary_workshift_deployed_desc$"
 planetary_workshift_deployed: "Đã bắt buộc thực thi chế độ làm việc theo ca trên hành tinh."
 planetary_workshift_deployed_desc: "Đảm bảo toàn bộ hành tinh làm việc theo cùng một múi giờ, nâng cao hiệu quả giao tiếp nhóm, đánh đổi bằng việc hạnh phúc giảm sút."
 ####################################
 # Sự kiện Nguồn gốc
 ####################################
 # Red Giant Origin
 infernals.45.name: "Xu hướng Đáng lo ngại"
 infernals.45.desc: "Trong một thời gian dài, chúng ta đã tin rằng §Y[capital_star.GetName]§! là một ngôi sao khổng lồ đỏ điển hình, nhưng những phân tích gần đây cho thấy kích thước và lượng khí thải bức xạ của nó đang tiếp tục tăng lên, đã gây ra những tác động rõ rệt đối với khí hậu, dẫn đến sự hoảng loạn ngày càng tăng trong dân cư.\n\nXu hướng hiện tại không có dấu hiệu dừng lại, vì sự tồn tại của giống loài, chúng ta phải tìm ra nguyên nhân của hiện tượng này."
 infernals.45.desc.gestalt: "Trong một thời gian dài, chúng ta đã tin rằng §Y[capital_star.GetName]§! là một ngôi sao khổng lồ đỏ điển hình, nhưng những phân tích gần đây cho thấy kích thước và lượng khí thải bức xạ của nó đang tiếp tục tăng lên, đã gây ra những tác động rõ rệt đối với khí hậu.\n\nXu hướng hiện tại không có dấu hiệu thay đổi, vì sự tồn tại của giống loài, chúng ta phải tìm ra nguyên nhân của hiện tượng này."
 infernals.45.a: "Giữ bình tĩnh, đừng thổi phồng vấn đề."
 infernals.45.b: "Chúng ta phải nhanh chóng điều tra."
 infernals.45.c: "Chúng ta còn những việc quan trọng hơn."
 infernals.45.d: "Khởi động chiến dịch ứng phó truyền thông công chúng."
 infernals.45.public.tt: "\n§HTình hình:§! $situation_red_giant_expansion$\n—Thiết lập giải pháp ứng phó tình hình thành §Y$approach_reassure_public$§!,\n—Thu nhập tài nguyên hàng tháng: §G10§!£unity£"
 infernals.45.cause.tt: "\n§HTình hình:§! $situation_red_giant_expansion$\n—Thiết lập giải pháp ứng phó tình hình thành §Y$approach_find_the_cause$§!"
 infernals.50.name: "Tân tinh Ngôi sao"
 infernals.50.desc: "[GetRedGiantEndingExplode]"
 infernals.50.totalIgnorance: "Giờ đây, nguyên nhân gây ra thảm họa Sao Khổng lồ Đỏ không còn quan trọng nữa. Tất cả những gì chúng ta có thể làm là chấp nhận thực tế đã rồi và xây dựng lại mọi thứ trên đống đổ nát."
 infernals.50.semiIgnorance: "Sự tàn phá do vụ nổ sao gây ra đã xóa sạch mọi bằng chứng cần thiết để truy lùng thủ phạm.\n\nTất cả những gì chúng ta có thể làm là chấp nhận thực tế đã rồi và xây dựng lại mọi thứ trên đống đổ nát."
 infernals.50.defaultEnding: "Quá trình do những người ngoài hành tinh sống sót khởi xướng tại trạm khai thác hoang phế cuối cùng cũng đi đến hồi kết: §Y[Target.GetStarName]§! xảy ra một vụ nổ tân tinh, gần như nuốt chửng toàn bộ hệ sao. Plasma và bức xạ tuyệt đẹp sẽ thiêu rụi §Y[event_target:red_giant_homeworld_tmp.GetName]§!, cùng với toàn bộ hệ sao mẹ, cho đến khi không còn lại gì.\n\n[GetMegacorpDesc50]\n\n[GetLususMiningDesc]"
 infernals.50.megacorp: "Hành tinh mẹ của chúng ta giờ đã trở thành một kho tàng khoáng sản trải rộng khắp hệ sao, tài nguyên phân bố rộng rãi và vô cùng dễ khai thác. So với khi bị vùi sâu trong lòng các hành tinh hay vệ tinh, chi phí khai thác những tài nguyên này giờ đây đã giảm đi đáng kể. Dựa vào chuỗi cung ứng tài nguyên chi phí thấp này, lợi nhuận của chúng ta hứa hẹn sẽ tăng vọt."
 infernals.50.nonmegacorp: "Dù hành tinh mẹ giờ đây đã hoang tàn, nhưng vụ nổ tân tinh đã phơi bày nguồn tài nguyên khoáng sản dồi dào trong toàn bộ hệ sao. Những tài nguyên này có thể dễ dàng thu thập được thông qua các thiết bị khai thác thông thường. Bằng nguồn của cải này, chúng ta sẽ kiến tạo một tương lai hoàn toàn mới."
 infernals.50.lususExists: "Trạm khai thác lóe lên xung năng lượng cuối cùng, sau đó hoàn toàn ngừng hoạt động, chỉ còn lại chúng ta trơ trọi dọn dẹp phần còn lại của hành tinh mẹ."
 infernals.50.lususGone: "Kể từ khi trạm khai thác biến mất, §Y[event_target:red_giant_homeworld_tmp.GetName]§! đã có thể yên tâm rằng, chuyện như vậy sẽ không bao giờ xảy ra nữa."
 infernals.50.a: "Chúng ta phải dốc toàn lực để xây dựng lại quê hương."
 infernals.51.name: "Giảm nhẹ Tân tinh"
 infernals.51.desc: "Trải qua quá trình dọn dẹp quy mô lớn, bề mặt của §Y[this.GetName]§! một lần nữa lại thích hợp cho $trait_infernal_plural$ sinh tồn. Dù một phần những vết sẹo vĩnh viễn vẫn còn hiện diện, nhưng nó có thể được tận dụng tối đa cho các giá trị nghiên cứu khoa học độc đáo."
 infernals.60.name: "Khôi phục Trạng thái Bình thường"
 infernals.60.desc: "Thông qua việc tinh chỉnh thiết bị hút, trích xuất khí hydro từ các lớp bên ngoài của ngôi sao và điều tiết chính xác tỷ lệ năng lượng nạp vào, chúng ta đã đảo ngược thành công quá trình phình to của §Y[Target.GetStarName]§!, đưa nó trở về giai đoạn sao khổng lồ đỏ ôn hòa và ổn định.\n\nKết quả quan trắc cho thấy khí hậu trên §Y[Target.GetStarName]§! đang dần phục hồi sự ổn định. Trong tương lai, khả năng sinh sống có hy vọng được cải thiện thêm, và hành tinh mẹ của chúng ta sẽ tiếp tục đóng vai trò là cốt lõi của đế chế.\n\n[GetRedGiantEndingKalmStationStatus]"
 infernals.60.lususDestroyed: "Do không còn trạm khai thác nào trong số các [Owner.Species.GetHandNamePlural], có lẽ chúng ta sẽ không bao giờ có thể làm rõ hoàn toàn chuyện gì đã xảy ra, nhưng chúng ta hoàn toàn có thể tận dụng vật chất được giải phóng trong quá trình co lại của ngôi sao."
 infernals.60.lususAlive: "Bởi vì chúng ta đã làm chủ được phương thức điều khiển trạm khai thác, chúng ta có thể quyết định công dụng tiếp theo của nó."
 infernals.60.a: "Tháo dỡ trạm khai thác."
 infernals.60.b: "Tiếp tục nghiên cứu trạm khai thác."
 infernals.60.c: "Biến nó thành tượng đài chiến thắng của chúng ta."
 infernals.60.d: "Cuối cùng cũng có thể thở phào nhẹ nhõm."
 infernals.65.name: "Ngôi sao Phình to"
 infernals.65.desc: "Những quan trắc liên tục đã xác nhận rằng §Y[Target.system_star.GetName]§! đang phình to với tốc độ chóng mặt. Những ảnh hưởng vật lý do bức xạ tăng cường cũng đang được ghi nhận liên tục. Trừ khi tìm ra cách ngăn chặn sự phình to này, bằng không §Y[Target.system_star.GetName]§! sẽ triệt tiêu chúng ta hoàn toàn trước cả khi nó nuốt chửng hành tinh này.\n\n[GetMegacorpDesc65]"
 infernals.65.nonmegacorp: "Bảo vệ khỏi bức xạ sao có thể câu thêm cho chúng ta chút thời gian. Có một phương án khác nguy hiểm hơn nhưng lại mang tiềm năng to lớn, đó là tận dụng lượng bức xạ được tăng cường để thúc đẩy năng lực sản xuất năng lượng và công nghiệp."
 infernals.65.megacorp: "Việc đầu tư vào công tác bảo vệ hành tinh sẽ tạo ra một lớp lá chắn chống lại những biến động, góp phần củng cố nền tảng tài sản. Nhưng nếu chúng ta chuyển sang khai thác lượng bức xạ được tăng cường này, rất có thể chúng ta sẽ cải thiện được các chỉ số năng lượng và công nghiệp."
 infernals.65.a: "Bảo vệ hành tinh mẹ."
 infernals.65.b: "Khai thác hiện tượng này."
 infernals.70.name: "Ngôi sao Đói khát"
 infernals.70.desc: "Hành tinh nằm trong cùng nhất của hệ sao chúng ta đã phải gánh chịu hậu quả nặng nề nhất, nó đã bị §Y[Target.GetName]§! nuốt chửng. Dù rằng nguồn nguyên liệu thô ở đó vẫn còn tồn tại, nhưng chúng đã chìm sâu vào lòng ngôi sao nóng rực, vô phương tái khai thác.\n\nDù chúng ta vẫn có thể gánh chịu những thiệt hại kinh tế trước mắt, nhưng tương lai của §Y[Owner.Capital.GetName]§! mà thảm họa này phản chiếu lại thật sự khiến người ta phải rùng mình kinh sợ."
 infernals.75.name: "Thiệt hại Liên đới"
 infernals.75.desc: "Ngôi sao khổng lồ đỏ của chúng ta đang phình to theo một cách chưa từng có trong lịch sử, và giờ đây nó đã nuốt chửng thêm một hành tinh nữa. Trừ phi ngôi sao này trút bỏ lớp vật chất bên ngoài của nó trong một vụ nổ tân tinh dữ dội, bằng không nguồn tài nguyên trù phú trên hành tinh này sẽ mãi mãi vĩnh viễn không thể chạm tới được nữa."
 infernals.95.name: "Đường hầm Sao"
 infernals.95.desc: "Sự thật về §Y[capital_star.GetName]§! còn kỳ dị hơn những gì chúng ta tưởng tượng rất nhiều. Các cuộc điều tra không ngừng nghỉ đã phát hiện ra rằng ẩn sâu bên trong ngôi sao là một cặp đường hầm không gian thứ nguyên.\n\nMột trong số đó vận chuyển vật chất giàu hydro trực tiếp ra lớp ngoài, đẩy nhanh phản ứng nhiệt hạch và gia tăng sản lượng heli. Đáng lý ra điều này sẽ khiến lõi sao co lại, nhưng đường hầm còn lại lại chủ động hút lấy năng lượng, triệt tiêu hiệu ứng co rút, khiến cho ngôi sao cứ thế tiếp tục phình to.\n\nDữ liệu viễn trắc sơ bộ chỉ ra rằng hai đường hầm này kết nối với nhiều khu vực khác nhau trong thiên hà. Sự sống còn của chúng ta phụ thuộc vào việc liệu có thể kịp thời tìm ra điểm đến của những đường hầm này hay không."
 infernals.95.a: "Chúng ta cần phải điều tra ba trong số những địa điểm đó."
 infernals.95.a.tt: "Đã định vị được các mục tiêu khả thi có thể dùng để thực hiện tam giác đạc nhằm tìm ra nguồn gốc của hiện tượng trong không gian thứ nguyên."
 infernals.105.name: "Tổn thương Không gian thứ nguyên"
 infernals.105.desc: "Các đợt quét thiên văn học xung quanh §Y[FromFromFrom.GetName]§! đã phát hiện ra những tổn thương không gian thứ nguyên không thể giải thích được. Mặc dù hiện tại khu vực này không có lối ra nào, nhưng trong quá khứ có thể đã từng xuất hiện một đường hầm trên quỹ đạo xung quanh hành tinh khí khổng lồ này. Những dữ liệu này đã cung cấp các hiểu biết về vật lý có thể áp dụng cho nhiều lĩnh vực khác.\n\nĐồng thời, chúng ta phải tiếp tục tìm kiếm ở những nơi khác, nhằm xác định nguồn gốc của đường hầm không gian thứ nguyên đang hoạt động bên trong ngôi sao."
 infernals.105.a: "Tiếp tục tìm kiếm."
 infernals.110.name: "Phế liệu Kim loại Ngoài hành tinh"
 infernals.110.desc: "Các đợt quét xung quanh §Y[FromFromFrom.GetName]§! cho thấy sự tồn tại của tổn thương không gian thứ nguyên. Chúng ta cũng đã tìm thấy những đống phế liệu kim loại cổ đại gần hành tinh này. Đống phế liệu này nằm ổn định trên quỹ đạo và có thể có liên quan đến những tổn thương kia.\n\nViệc liên tục quét các biến động không gian thứ nguyên này sẽ giúp tối ưu hóa mạng lưới năng lượng mặt trời xung quanh ngôi sao mẹ.\n\nMặc dù những dữ liệu này rất hữu ích, nhưng chúng ta vẫn cần phải điều tra ít nhất một địa điểm nữa thì mới có thể khóa được nguồn gốc của vấn đề."
 infernals.110.a: "Bán đấu giá phế liệu kim loại."
 infernals.115.name: "Hoàn tất Tam giác đạc"
 infernals.115.desc: "Cuối cùng cũng đạt được bước đột phá quan trọng.\n\nViệc phát hiện thêm tổn thương xung quanh §Y[FromFromFrom.GetName]§! đã cho phép chúng ta thông qua phép tam giác đạc, khóa được nguồn gốc của dị thường ngôi sao đến một hệ sao chưa biết có chứa tín hiệu thù địch.\n\nPhát hiện này có lẽ cuối cùng sẽ giúp chúng ta chống lại được những thế lực chưa biết đang can thiệp vào ngôi sao.\n\nNếu có thể tiến vào hệ sao §YLusus§!, có lẽ chúng ta sẽ có thể viết lại số phận của §Y[FromFromFromFrom.Target.solar_system.GetName]§! và thậm chí là của toàn bộ nền văn minh."
 infernals.115.a: "Tiếp cận một cách thận trọng."
 infernals.115.b: "Chuẩn bị phô trương vũ lực."
 infernals.115.c: "Thực hiện nghi thức ban phước trước khi tiếp cận."
 red_giant_lusus_triangulated_tt: "Tiết lộ một hệ sao mới."
 infernals.2115.name: "Đột kích Đổ bộ"
 infernals.2115.desc: "Lực lượng của ta đã hoàn toàn kiểm soát trạm không gian này. Mặc dù cư dân địa phương đã có sự kháng cự, nhưng trang bị của chúng rất thô sơ, lại thiếu kinh nghiệm thực chiến, nhiều kẻ thậm chí còn chưa trưởng thành. Toàn bộ những kẻ sống sót đều đã bị bắt giữ.\n\nChúng ta đã bắt đầu nghiên cứu cách thức để kiểm soát các đường hầm không gian thứ nguyên kia, chúng có vẻ là một loại thiết bị hút dùng để khai thác năng lượng. Với thời gian, có thể chúng ta sẽ giải quyết được vấn đề mà hệ sao mẹ đang phải đối mặt."
 infernals.2115.a: "Triệt để phá hủy."
 infernals.2115.b: "Thẩm vấn những kẻ sống sót."
 infernals.2115.c: "Bắt chúng làm nô lệ."
 infernals.2115.d: "Những kẻ sống sót tạo thành một mối đe dọa, hãy tiêu diệt chúng."
 infernals.2115.e: "Trò chuyện với những kẻ sống sót."
 infernals.2115.f: "Thanh tẩy trạm khai thác."
 infernals.2115.g: "Nuốt chửng chúng."
 infernals.400pops: "Đã sinh ra §G400§! £pop£ $POPS$ tại [this.GetName]"
 infernals.300pops: "Đã sinh ra §G300§! £pop£ $POPS$ tại [this.GetName]"
 infernals.2121.name: "Người ngoài hành tinh Toàn bộ bị Tiêu diệt"
 infernals.2121.desc: "Trạm khai thác không gian thứ nguyên đã bị phá hủy, toàn bộ nhân viên bên trong đều đã tử vong.\n\nViệc phá hủy trạm khai thác đã kích nổ một loại phương tiện dự trữ năng lượng chưa biết, lượng năng lượng được giải phóng đã tràn vào §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§! thông qua đường hầm không gian thứ nguyên bị sụp đổ, khiến tình hình của nó xấu đi nghiêm trọng.\n\nTuy nhiên, quá trình vận chuyển hydro đến ngôi sao đã dừng lại. Tình hình tuy tồi tệ, nhưng sẽ không tiếp tục xấu đi nữa. Mặc dù có thể chúng ta sẽ không bao giờ có thể tìm hiểu được nguồn gốc và thiết kế của trạm khai thác này, nhưng ít nhất cũng có thể yên tâm rằng, sức mạnh này sẽ không bao giờ rơi vào tay của kẻ thù.\n\nĐáng tiếc là chúng ta hiện chưa có cách nào để khiến §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§! phục hồi ngay lập tức. Nếu muốn tác động đến trạng thái của ngôi sao, chỉ có thể dựa vào các ghi chép để khôi phục lại hoạt động của trạm khai thác."
 infernals.2121.a: "Dọn dẹp tàn cuộc."
 infernals.2122.name: "Trạm khai thác bị Hủy diệt"
 infernals.2122.desc: "Những mảnh vỡ của trạm khai thác đang trôi dạt trong không gian, sự hủy diệt của nó đã mang đến cho chúng ta một cơ hội mới để thay đổi số phận của §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§!, tuy nhiên điều đó không hề dễ dàng, mà đòi hỏi những nỗ lực gian khổ."
 infernals.2125.name: "Đàm phán với Người ngoài hành tinh"
 infernals.2125.desc: "Trải qua một quá trình nghiên cứu dài đằng đẵng và gian khổ, cuối cùng chúng ta cũng đã phát triển được một thiết bị phiên dịch cơ bản, cho phép chúng ta giao tiếp với các cư dân của trạm khai thác.\n\nTrạm khai thác này đã hoạt động qua nhiều thế hệ, liên tục di chuyển giữa các hành tinh khí khổng lồ, thông qua thiết bị hút không gian thứ nguyên để hút năng lượng từ những ngôi sao xa xôi, nhằm cung cấp năng lượng cho hệ thống duy trì sự sống và động cơ bước nhảy không gian hùng mạnh.\n\nNhững cư dân ngoài hành tinh không hoàn toàn hiểu được cơ chế của hệ thống, họ cũng không hề hay biết mục tiêu hút của họ là một ngôi sao, dẫn đến sự hủy diệt của ngôi sao đó.\n\nDù có phần bối rối, nhưng họ rất mong muốn được rời khỏi nơi này, và cam kết sẽ truyền đạt kiến thức cùng công nghệ của mình cho chúng ta, để đổi lấy một nơi ở an toàn và một mái nhà để sinh con đẻ cái."
 infernals.2125.a: "Cung cấp nơi trú ẩn cho họ."
 infernals.2125.b: "Tặng cho họ một phi thuyền để tự tìm đường sống."
 infernals.2125.c: "Xả khí thải từ xa cho trạm khai thác."
 infernals.2125.d: "Cho phép họ tự phán xét chúng ta."
 infernals.2130.name: "Hoạt động Khai thác Không gian thứ nguyên"
 infernals.2130.desc: "Trạm khai thác đã hút khí hydro từ hành tinh khí khổng lồ, vận chuyển đến lớp ngoài của ngôi sao thông qua một đường hầm không gian thứ nguyên, kích hoạt phản ứng nhiệt hạch heli, giải phóng ra năng lượng dư thừa, sau đó biến lượng năng lượng đó thành §Y$entropy_crystals$§! để cung cấp năng lượng cho trạm.\n\nNguyên nhân gốc rễ dẫn đến sự bất ổn của §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§! nằm ở lỗi hiệu chuẩn mà các cư dân không thể phát hiện hoặc không thể khắc phục, cùng với sự hao mòn của thiết bị.\n\nDựa vào công nghệ cổ xưa của họ, chúng ta có thể đảo ngược quá trình này, nhưng điều này cực kỳ khó khăn. Một phương án khả thi khác là kích hoạt hiện tượng tân tinh trên ngôi sao, khiến một lượng lớn khoáng sản bị phơi bày, trở thành nguồn tài nguyên có thể khai thác một cách dễ dàng."
 infernals.2130.a: "Đã đến lúc bắt đầu."
 infernals.2131.desc: "Trạm khai thác đã hút khí hydro từ hành tinh khí khổng lồ, vận chuyển đến lớp ngoài của ngôi sao thông qua một đường hầm không gian thứ nguyên, kích hoạt phản ứng nhiệt hạch heli, giải phóng ra năng lượng dư thừa, sau đó biến lượng năng lượng đó thành §Y$entropy_crystals$§! để cung cấp năng lượng cho trạm.\n\nCư dân trên trạm chỉ có thể truyền đạt lại bằng miệng về cơ chế hoạt động của thiết bị, và những thông tin này chưa chắc đã chính xác. Bọn họ đã mất liên lạc với hành tinh mẹ của mình từ hàng ngàn năm trước, có lẽ là do nền văn minh của họ đã sụp đổ hoặc đã bị tiêu diệt. Cùng với sự tích tụ của các sai số hiệu chuẩn và sự lão hóa của thiết bị, quá trình hút ngày càng trở nên không ổn định, và hiện nay nó thậm chí có thể phá hủy §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§!.\n\nDựa vào công nghệ cổ xưa của họ, chúng ta có thể đảo ngược quá trình này, nhưng điều này cực kỳ khó khăn. Một phương án khả thi khác là kích hoạt hiện tượng tân tinh trên ngôi sao, khiến một lượng lớn khoáng sản bị phơi bày, trở thành nguồn tài nguyên có thể khai thác một cách dễ dàng."
 infernals.2135.name: "Mối đe dọa Kết thúc"
 infernals.2135.desc: "Sau khi biết được tình cảnh của chúng ta, các cư dân bên trong trạm rơi vào tình trạng hoảng loạn. Họ tự cho rằng mình là những sinh vật duy nhất cô độc trong vũ trụ, chưa từng mảy may nghĩ rằng vẫn còn những giống loài khác cùng tồn tại trong thiên hà này.\n\nChúng ta chưa kịp hiểu rõ bọn họ rốt cuộc đã làm chuyện tày đình gì, thì họ đã bắt đầu tự phá dỡ trạm khai thác trong sự hối hận tột cùng, hủy diệt vĩnh viễn phần lớn các bộ phận bên trong.\n\nVì thế, việc kiểm soát quá trình phình to của ngôi sao sẽ trở nên vô vàn khó khăn. Chúng ta phải đưa ra quyết định về việc làm thế nào để đối phó với những sinh vật ngoài hành tinh bất ổn này, và cũng cần cân nhắc xem liệu có nên ban cho họ sự tha thứ mà họ đang mong mỏi hay không."
 infernals.2135.a: "Thu nhận họ và sửa chữa trạm khai thác."
 infernals.2135.b: "Xử lý họ và phá hủy trạm khai thác."
 infernals.2135.c: "Bắt họ làm nô lệ và phá hủy trạm khai thác."
 infernals.2140.name: "Khả năng Ổn định"
 infernals.2140.desc: "Trải qua những nỗ lực gian khổ đến tột cùng, chúng ta giờ đây đã hoàn toàn kiểm soát được vận mệnh của §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§!. Nếu không có sự can thiệp nào, nó sẽ thuận theo chu kỳ sống tự nhiên với thể tích hiện tại của nó.\n\nThế nhưng, cái trạm khai thác cổ xưa xập xệ đó đã không thể chịu đựng thêm bất kỳ sự tái cấu trúc nào nữa. Mỗi lần điều chỉnh là mỗi lần nó phải đánh đổi bằng tuổi thọ của các thiết bị. Giờ đây, trước mắt chúng ta chỉ còn lại một lựa chọn duy nhất:\n\nHoặc là thu nhỏ ngôi sao lại kích thước ban đầu; hoặc là buộc nó tiếp tục phình to, biến toàn bộ hệ sao này thành một kho báu tài nguyên khổng lồ có thể dễ dàng khai thác.\n\nCác [GetScientistPlural] của chúng ta sẽ thực hiện cấu hình lại lần cuối cùng, sau lần này, kết cục duy nhất của nó sẽ là bị ngoại lực tháo dỡ nhanh chóng."
 infernals.2140.a: "Giữ nguyên trạng thái hiện tại của ngôi sao."
 infernals.2140.b: "Tăng tốc độ phình to của ngôi sao."
 infernals.2140.bdesc: "Không thể tránh khỏi việc khiến §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§! phình to."
 infernals.2140.c: "Đưa ngôi sao trở lại trạng thái bình thường."
 infernals.2140.cdesc: "Không thể tránh khỏi việc khiến §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§! thu nhỏ."
 infernals.2145.name: "Đạt được Sự ổn định"
 infernals.2145.desc: "Sau khi chúng ta hoàn toàn nắm quyền kiểm soát đối với thể tích và những biến động năng lượng của ngôi sao, §Y[Target.GetStarName]§! cuối cùng cũng đã hoàn toàn ổn định lại. Trong vài triệu năm tới, nó sẽ tiếp tục duy trì trạng thái hiện tại, dân chúng của chúng ta cũng đã có thể một lần nữa được tận hưởng một cuộc sống ổn định và có thể dự đoán được ở hệ sao mẹ.\n\nMặc dù sự phình to của ngôi sao đã gây ra những tác động rõ rệt đối với việc quản lý cơ sở hạ tầng, nhưng chúng ta đã biến nguy thành cơ, vừa có thể tận dụng triệt để nguồn năng lượng dồi dào của nó, vừa có thể duy trì sự sinh tồn ổn định bên trong hệ sao."
 infernals.2145.a: "Cuối cùng, chúng ta đã tự nắm lấy vận mệnh của mình."
 infernals.2151.name: "Trạm khai thác Bí ẩn"
 infernals.2151.desc: "Sau khi tiến vào hệ sao này, hạm đội của ta đã vấp phải sự phản kháng chớp nhoáng từ một nhóm các cá thể con tự động, sau khi nhanh chóng dọn dẹp chúng, chúng ta đã có thể tiếp cận trạm khai thác của người ngoài hành tinh để khảo sát ở cự ly gần.\n\nDù bên ngoài có vô số những vết chắp vá, nhưng thiết bị này vẫn đang hoạt động. Trong khi đang cố gắng tiến vào một trong những khoang cập bến, chúng ta đã thiết lập được liên lạc với một giống loài ngoài hành tinh lạ mặt. Mặc dù gặp phải rào cản ngôn ngữ, nhưng chúng ta có thể khẳng định rằng thiết bị này chính là nguồn phát sinh các đường hầm không gian thứ nguyên đã tác động đến §Y[event_target:situation_red_giant_target_shortterm.GetStarName]§!.\n\nHiện tại, chúng ta đang dốc sức để xây dựng các phương thức giao tiếp, có lẽ chúng ta sẽ có thể giải quyết vấn đề thông qua các con đường ngoại giao. Nhưng nếu thất bại, có thể chúng ta sẽ phải cân nhắc đến những phương pháp trực diện hơn, như là đổ bộ vào cơ sở hoặc phá hủy nó hoàn toàn. Thế nhưng, nếu chưa tìm hiểu cặn kẽ mục đích thực sự của nó mà đã vội vàng hành động vũ trang thì rủi ro đối với ngôi sao sẽ là rất lớn."
 infernals.2151.a: "Dịch ngôn ngữ của bọn chúng."
 infernals.2151.b: "Cưỡng chế tiến vào trạm khai thác."
 infernals.2151.c: "Phá hủy trạm khai thác."
 infernals.2160.name: "Tia lửa Khủng hoảng"
 infernals.2160.desc: "Các nghiên cứu chuyên sâu đã chỉ ra rằng, trạm khai thác không gian thứ nguyên này đã lưu trữ một lượng nhiệt năng khổng lồ dưới một hình thức cực kỳ kỳ lạ, được các [GetScientistPlural] của ta đặt tên là §Y$entropy_crystals$§!. Cơ sở này đã lợi dụng vòng lặp phản hồi nhiệt để khuếch đại năng lượng được truyền vào.\n\nNếu có thể sao chép được công nghệ này, chúng ta sẽ nắm trong tay một sức mạnh vô tiền khoáng hậu, dù cho có thể nhiều người sẽ cho rằng điều này là trái tự nhiên và đầy nguy hiểm. Phương pháp này có thể sẽ sản sinh ra một lượng nhiệt thừa vô cùng lớn, nhưng nếu chúng ta có thể tìm ra cách để tồn tại trong những điều kiện như thế này, thì cả thiên hà sẽ nằm gọn trong tay chúng ta."
 infernals.2160.a: "Nghiên cứu chuyên sâu."
 infernals.2160.a.tt: "[GetRedgiantAlreadyHyperthermiaPickable]Khám phá ra §Y$entropy_crystals$§!, thúc đẩy quá trình tiến triển của Siêu nhiệt Thiên hà."
 infernals.2160.a.ttunlock: "Mở khóa đặc quyền thăng tiến $ap_galactic_hyperthermia$.\n"
 infernals.2160.b: "Công nghệ này quá nguy hiểm, không nên tiếp tục."
 infernals.2160.c: "Cách ứng dụng nguyên thủy của §Y$entropy_crystals$§!."
 situation_red_giant_expansion: "Ngôi sao khổng lồ đỏ Phình to"
 situation_red_giant_expansion_type: "$situation_red_giant_expansion$"
 situation_red_giant_expansion_desc: "Những thay đổi nhanh chóng trong bức xạ của ngôi sao đang đe dọa đến sự ổn định của hành tinh mẹ. Nếu tình trạng này cứ tiếp diễn, §Y[Owner.Capital.GetStarName]§! cuối cùng sẽ phát nổ thành tân tinh, nghiền nát toàn bộ hệ sao."
 situation_red_giant_expansion_monthly_change_tooltip: "Tiến trình phình to sẽ phụ thuộc vào khả năng nắm bắt và đối phó với nguyên nhân của chúng ta."
 situation_red_giant_expansion_fail_tooltip: "§Y[Target.solar_system.GetName]§! sẽ phát nổ siêu tân tinh."
 situation_red_giant_expansion_finish_tooltip: "§Y[Target.solar_system.GetName]§! sẽ trở lại trạng thái bình thường."
 situation_red_giant_expansion_stage_1: "Ngôi sao của chúng ta khá tĩnh lặng, nhưng lượng bức xạ phát ra lại cao bất thường."
 situation_red_giant_expansion_stage_2: "Ngôi sao của chúng ta lớn hơn so với thời kỳ chúng ta tiến hóa, điều này đã ảnh hưởng rõ rệt đến hành tinh mẹ."
 situation_red_giant_expansion_stage_3: "Thể tích của ngôi sao đã quá lớn và cực kỳ nguy hiểm, những hoạt động cực đoan của nó đang đe dọa sự ổn định của hành tinh mẹ."
 situation_red_giant_expansion_stage_4: "Ngôi sao khổng lồ đỏ đang thiêu rụi toàn bộ hệ sao, khiến cho việc sinh tồn trở nên vô cùng khó khăn."
 situation_red_giant_expansion_stage_5: "Ngôi sao của chúng ta đang trên bờ vực phát nổ, nó sẽ gây ra sức tàn phá khủng khiếp lên hệ sao mẹ."
 rg_default_progress: "\nTăng mỗi tháng: §Y+7§!\n\n"
 rg_small_progress: "\nTăng mỗi tháng: §G+3§!\n\n"
 rg_high_progress: "\nTăng mỗi tháng: §R+50§!\n\n"
 rg_no_progress: "\nTăng mỗi tháng: §Y0§!\n\n"
 rg_small_negative_progress: "\nTăng mỗi tháng: §Y-3§!\n\n"
 rg_medium_negative_progress: "\nTăng mỗi tháng: §G-25§!\n\n"
 rg_high_negative_progress: "\nTăng mỗi tháng: §G-50§!\n\n"
 approach_reassure_public: "Trấn an công chúng."
 approach_find_the_cause: "Tìm ra nguyên nhân."
 approach_suppress_unrest2: "Trấn áp bạo loạn."
 approach_disrupt_subspace_tunnels2: "Phá hủy các đường hầm không gian thứ nguyên."
 approach_add_fuel_to_the_fire3: "Thêm dầu vào lửa."
 approach_wait_and_see3: "Quan sát và chờ đợi."
 approach_siphon_stellar_material3: "Hút lấy vật chất từ sao."
 approach_continue_siphoning4: "Tiếp tục hút."
 approach_stabilize_the_star4: "Ổn định ngôi sao."
 approach_cease_activity4: "Dừng mọi hoạt động."
 approach_reverse_inflation4: "Đảo ngược sự phình to."
 approach_at_any_cost: "Bằng mọi giá."
 approach_reassure_public_effect: "Những thông tin về cuộc khủng hoảng này có thể làm lung lay sự ổn định của xã hội, hãy giữ bí mật. $rg_default_progress$"
 approach_find_the_cause_effect: "Sự phình to của ngôi sao không thể dừng lại, phải tiến hành điều tra toàn diện ngay lập tức để tìm ra nguyên nhân gốc rễ. $rg_default_progress$"
 approach_suppress_unrest2_effect: "Trong bối cảnh xã hội hỗn loạn, vấn đề rất khó được giải quyết hiệu quả, hãy ưu tiên khôi phục trật tự và ổn định. $rg_default_progress$"
 approach_disrupt_subspace_tunnels2_effect: "Để bảo vệ sự toàn vẹn của ngôi sao, phải lập tức triển khai các biện pháp đối phó, phá hủy các đường hầm không gian thứ nguyên. $rg_small_progress$"
 approach_add_fuel_to_the_fire3_effect: "Việc này sẽ mang đến cơ hội khai thác quy mô lớn các hành tinh trong hệ sao mẹ, tối đa hóa lượng khoáng sản thu được. $rg_high_progress$"
 approach_wait_and_see3_effect: "Chúng ta không thể vội vàng đưa ra quyết định được nữa, kiên nhẫn quan sát mới là thượng sách. $rg_small_negative_progress$"
 approach_siphon_stellar_material3_effect: "Nếu trực tiếp loại bỏ vật chất khỏi ngôi sao, có lẽ sẽ đẩy nhanh quá trình khôi phục trạng thái bình thường. $rg_medium_negative_progress$"
 approach_continue_siphoning4_effect: "Chúng ta có thể lợi dụng nguồn năng lượng này để thiêu rụi hệ sao mẹ, và thu gom của cải từ những mảnh vỡ còn sót lại. $rg_high_progress$"
 approach_stabilize_the_star4_effect: "Chúng ta có thể ổn định ngôi sao ở trạng thái hiện tại, và duy trì trạng thái thích nghi như hiện nay. $rg_no_progress$"
 approach_cease_activity4_effect: "Chúng ta có thể đóng cửa các trạm khai thác, để ngôi sao từ từ khôi phục lại trạng thái bình yên. $rg_small_negative_progress$"
 approach_reverse_inflation4_effect: "Chúng ta có thể thu nhỏ kích thước ngôi sao về nguyên bản, khôi phục lại khả năng sinh sống của hành tinh mẹ. $rg_high_negative_progress$"
 approach_at_any_cost_effect: "Phải kìm hãm xu hướng phình to để tránh khỏi thảm họa, dù có phải trả bất cứ giá nào.\nTăng mỗi tháng: §G+0.5§!\n\n"
 INF_ORIGIN_RED_GIANT_TRIANGULATION: "Tam giác đạc Nguồn gốc nhiễu loạn Không gian thứ nguyên"
 INF_ORIGIN_RED_GIANT_TRIANGULATION_DESC: "Những địa điểm khả thi để thực hiện tam giác đạc tìm kiếm nguồn gốc gây nhiễu loạn."
 INF_ORIGIN_RED_GIANT_PROTECT_HOMEWORLD: "Bảo vệ Hành tinh mẹ"
 INF_ORIGIN_RED_GIANT_PROTECT_HOMEWORLD_DESC: "Trong khi dốc sức để đảo ngược những thay đổi của các vì sao, bản thân chúng ta cũng phải chuẩn bị để đối phó với nhiệt độ cao. Việc thích ứng với mức nhiệt độ cao hơn sẽ giúp chúng ta tồn tại và phát triển trong tương lai rực lửa này."
 INF_ORIGIN_RED_GIANT_EXPLOIT: "Khai thác Nhiệt năng"
 INF_ORIGIN_RED_GIANT_EXPLOIT_DESC: "Sự tăng cường bức xạ mang đến thách thức lâu dài, nhưng trong ngắn hạn, nó có thể làm tăng cường khả năng sản xuất năng lượng và công nghiệp."
 INF_ORIGIN_RED_GIANT_BOARD_STATION: "Đổ bộ vào Trạm khai thác"
 INF_ORIGIN_RED_GIANT_BOARD_STATION_DESC: "Lũ ngoài hành tinh liều lĩnh này đang trục lợi từ ngôi sao của chúng ta, chúng ta phải ngay lập tức đổ bộ và đoạt lấy quyền kiểm soát."
 INF_ORIGIN_RED_GIANT_PARLAY: "Nghiên cứu Ngôn ngữ học Nước ngoài Khẩn cấp"
 INF_ORIGIN_RED_GIANT_PARLAY_DESC: "Cư dân của trạm khai thác đang nắm quyền kiểm soát thiết bị hút không gian thứ nguyên, thiết bị đang hủy diệt ngôi sao của chúng ta. Chúng ta cần thiết lập kết nối liên lạc để đảm bảo sự hợp tác của họ trong việc giải quyết vấn đề."
 INF_THERMOPHILE_ADAPTATION: "Tiến hóa Kháng nhiệt"
 INF_THERMOPHILE_ADAPTATION_DESC: "Chúng ta đang bước trên con đường thắp sáng cả thiên hà, nhưng bản thân chúng ta phải chuẩn bị để đối mặt với nhiệt độ cao. Thích nghi với mức nhiệt độ khắc nghiệt hơn sẽ giúp chúng ta tiếp tục hưng thịnh trong tương lai rực lửa đang chờ đón.\n\n§HHoàn thành:§!$TABBED_NEW_LINE$—Thêm sửa đổi §Y$crisis_thermophile_adaptation$§!$TABBED_NEW_LINE$—§Y$mod_pc_volcanic_habitability$§! Tăng cường §G+50%§!"
