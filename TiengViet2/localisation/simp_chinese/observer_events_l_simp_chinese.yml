l_simp_chinese:
 observer.15.name: "Đại Hãn trở lại"
 observer.15.desc: "Dù bại trận, Đại Hãn vẫn tập hợp được một hạm đội khác và nay đang tiến về tiền tuyến."
 observer.24.name: "Lính đánh thuê [marauder_mercenary_country.GetSpeciesName]"
 observer.24.desc: "[marauder_mercenary_country.GetSpeciesName] hiện có sẵn lính đánh thuê để chiêu mộ."
 observer.56.desc: "Các nhà khảo cổ của §H[From.GetName]§! đã tìm ra tọa độ bí mật hệ sao quê hương của giống loài §HVultaum§!"
 observer.57.desc: "Các nhà khảo cổ của §H[From.GetName]§! đã tìm ra tọa độ bí mật hệ sao quê hương của giống loài §HYuht§!"
 observer.58.desc: "Các nhà khảo cổ của §H[From.GetName]§! đã tìm ra tọa độ bí mật hệ sao trung tâm của §HLiên Minh Thứ Nhất§!"
 observer.59.desc: "Các nhà khảo cổ của §H[From.GetName]§! đã tìm ra tọa độ bí mật hệ sao quê hương của người §HIrassian§!"
 observer.60.desc: "Các nhà khảo cổ của §H[From.GetName]§! đã tìm ra tọa độ bí mật hệ sao trung tâm của §HCybrex§!"
 observer.61.desc: "§H[From.GetName]§! đã thu thập đủ dữ liệu cần thiết để mở khóa §HMạng lưới Cổng L§! Sau khi nghiên cứu xong công nghệ Cổng L và hoàn thành dự án đặc biệt để khởi động một Cổng L trong lãnh thổ, họ sẽ tiến vào được Cụm sao L."
 observer.63.desc: "§H[From.GetName]§! đã mở lại thành công con đường tới Cụm sao L! Những sinh vật khổng lồ mang tên §H$nanite_space_dragon_baby_plural$§! bay ra từ mọi Cổng L hiện có, nhưng có vẻ chúng không hề tỏ ý thù địch."
 observer.66.name: "Hiệp Hòa Dessanu"
 observer.66.desc: "§H[From.GetName]§! đã mở thành công Cụm sao L, nhưng lại bất ngờ phát hiện ra nơi này đã bị một nền văn minh cao cấp mang tên §HHiệp Hòa Dessanu§! chiếm giữ!"
 observer.68.desc: "Những kẻ ngốc nghếch bất cẩn của §H[From.GetName]§! đã mưu toan đùa giỡn với thứ sức mạnh vượt ngoài tầm hiểu biết, hậu quả là giải phóng một Hóa thân Hư Không đầy quyền năng và hằn học tại hệ sao §H[shroud_spawn_system.GetName]§!"
 observer.70.name: "Tín Hiệu Chân Trời"
 observer.70.desc: "Các sĩ quan khoa học của §H[From.Owner.GetName]§! đã nhận được một tín hiệu bí ẩn, dường như được phát ra từ trung tâm của một lỗ đen..."
 observer.71.name: "Sâu Thời Gian"
 observer.71.desc: "Sâu Thời Gian đã khiến hệ sao quê hương của §H[From.Owner.GetName]§! trở nên... khác lạ."
 observer.72.desc: "Sâu Thời Gian đã hiện nguyên hình tại hệ sao quê hương của §H[From.Owner.GetName]§!. Trận chiến bắt đầu..."
