l_simp_chinese:
 ### Thành trì
 ## Chuỗi Sự kiện - Cuộc phiêu lưu sinh lợi cho cựu chiến binh
 subject.1.title: "Cuộc phiêu lưu phát tài"
 subject.1.desc: "Một phái đoàn cựu chiến binh quy mô lớn đã gửi thư yêu cầu được rời khỏi địa phương để đến thuộc địa ở [subject_empire.Capital.GetName] - nơi này cũng là thủ đô của chư hầu [subject_empire.GetName] của chúng ta. Kèm theo bức thư là một khoản tiền tặng để \"làm cho bánh răng của bộ máy quan liêu hoạt động trơn tru hơn\", như cách họ nói giảm nói tránh.\n\nCó vẻ như trong số các cựu chiến binh của chúng ta đang lưu truyền nhiều câu chuyện như vậy, kể về việc một người đến những hệ sao này đã phát tài trong các cuộc phiêu lưu như thế nào - hoặc là làm lính đánh thuê, hoặc là làm hải tặc. Dù là cách nào, rõ ràng là những cựu chiến binh này đã dốc hết vốn liếng để huy động vốn cộng đồng, hy vọng có thể kiếm được lợi nhuận gấp mấy lần thông qua việc đến [subject_empire.Capital.GetName].\n\nNếu chúng ta quyết định phái họ đến [subject_empire.Capital.GetName] dưới danh nghĩa chính thức, ít nhất họ có nhiều khả năng đóng vai trò tích cực đối với giới lãnh đạo địa phương hơn - và cũng có nhiều khả năng tôn trọng luật pháp và quy định của chư hầu chúng ta hơn - so với việc để họ tự ý chạy đến đó."
 subject.1.a: "Gửi thư công thức cho phép họ đến [subject_empire.Capital.GetName]."
 subject.1.a.tt: "Cựu chiến binh sẽ được gửi đến [subject_empire.GetName] để hỗ trợ xây dựng."
 subject.1.b: "Họ muốn làm gì thì làm."
 subject.1.b.tt: "Cựu chiến binh có thể gây rắc rối ở [subject_empire.GetName]."
 subject.1.c: "Chúng ta sẽ không bị mua chuộc bởi đám người muốn làm hải tặc này."
 subject.1.c.tt: "Nhóm cựu chiến binh này không được phép rời khỏi đế quốc của chúng ta."
 subject.3.title: "Cựu chiến binh đến từ [overlord_empire.Capital.GetName]"
 subject.3.desc: "Chúng ta đã tiếp nhận một nhóm cựu chiến binh từ mẫu quốc [overlord_empire.GetName]. Có vẻ như [overlord.Ruler.GetRegnalName] đã chính thức phái họ đến để hỗ trợ chúng ta xây dựng, đồng thời chia sẻ kiến thức và kinh nghiệm của họ với lực lượng của chúng ta - ít nhất họ nói như vậy.\n\nTuy nhiên, ngay từ đầu, những người lính này đã nhận ra rõ ràng rằng những gì họ thấy hoàn toàn khác với những gì họ tưởng tượng. Những lời phàn nàn và bất mãn trong nội bộ nhóm cũng đã đến tai chúng ta. Có vẻ như họ tin chắc rằng mình có thể tìm thấy kho báu ở địa phương, hoặc có thể làm nghề hải tặc để ăn cắp đồ từ chúng ta.\n\nNếu chúng ta có kế hoạch để nhóm cựu chiến binh này ở lại địa phương, chúng ta phải cẩn thận không để họ quá tự do."
 subject.3.a: "Hãy tận dụng tốt kinh nghiệm của họ."
 subject.3.b: "Gửi họ trở lại [overlord_empire.GetName]."
 subject.10.title: "Mối quan hệ tốt đẹp"
 subject.10.desc: "Mặc dù chúng ta có chút dè dặt về việc cử nhóm cựu chiến binh khao khát phiêu lưu đó đến [subject_empire.Capital.GetName], nhưng chúng ta đã nhận được báo cáo từ chư hầu nói rằng nhóm cựu chiến binh đó đã coi địa phương này là nhà của họ và đã phát huy tác dụng nhiều hơn dự kiến."
 subject.10.a: "Có vẻ như chúng ta đã lo lắng vô ích."
 subject.12.title: "Cựu chiến binh trở về"
 subject.12.desc: "Sau một thời gian ngắn lưu lại tại [subject_empire.Capital.GetName], cựu chiến binh của chúng ta đã được gửi về nhà tại [Root.Capital.GetName]. Rõ ràng là họ chỉ chứng tỏ mình là một mớ rắc rối, gây ra thảm họa giữa những người dân của quốc gia chư hầu của chúng ta."
 subject.12.a: "Cuối cùng thì mọi chuyện đúng như chúng ta dự đoán."
 subject.14.title: "Cuộc phiêu lưu của Hải tặc"
 subject.14.desc: "Mối lo ngại ban đầu của chúng ta là hoàn toàn chính đáng. Ngay sau khi đến [subject_empire.GetName], cựu chiến binh của chúng ta đã lập tức chuyển nghề làm hải tặc. Nếu không có gì bất ngờ, những hành động ngang ngược này sẽ không bị quy trách nhiệm cho chúng ta."
 subject.14.a: "Chúng ta hy vọng mọi chuyện sẽ diễn ra như thế này."
 subject.16.title: "Làm trái lệnh - Lính đánh thuê"
 subject.16.desc: "Có vẻ như những cựu chiến binh yêu cầu chúng ta cho phép đến [subject_empire.Capital.GetName] không những không tuân theo lệnh của chúng ta, mà còn mượn danh nghĩa của chúng ta để làm mọi việc xấu xa. Lúc này nếu chúng ta đứng ra thanh minh rằng chúng ta đã không quản lý tốt cấp dưới, chắc chắn sẽ mất hết thể diện."
 subject.16.a: "Hy vọng sau này họ có thể cải tà quy chính."
 subject.18.title: "Làm trái lệnh - Hải tặc"
 subject.18.desc: "Có vẻ như những cựu chiến binh này đã kháng lệnh của chúng ta, và vẫn khởi hành đến [subject_empire.Capital.GetName]. Báo cáo mới nhất của chúng ta cho biết, họ đã hoàn toàn từ bỏ mọi biểu tượng thuộc về chúng ta và bắt đầu sự nghiệp hải tặc của mình."
 subject.18.a: "Không có gì đáng ngạc nhiên."
 #Modifiers
 specialist_bulwark_veterans_modifier: "Kinh nghiệm Cựu chiến binh"
 specialist_bulwark_veterans_modifier_desc: "Một tiểu đội cựu chiến binh đóng vai trò cốt yếu trong việc giảng dạy và hỗ trợ chúng ta, đã tận dụng tối đa công nghệ từ [subject_empire.GetHandNamePlural] của chúng ta."
 ## Chuỗi Sự kiện - Nâng cấp Chư hầu
 subject.55.title: "Một Yêu cầu"
 subject.55.desc: "Chúng ta được biết rằng, mẫu quốc của chúng ta đã đầu tư một lượng năng lượng và tài nguyên đáng kể để cải thiện các công trình căn cứ sao của họ, nhằm mục đích tăng mạnh năng lực và tiềm năng sản xuất.\n\nDo công tác phòng thủ là một nền tảng quan trọng trong mối quan hệ giữa hai đế quốc chúng ta, chúng ta đã tìm cách thiết lập một thỏa thuận để có được một phần công nghệ đó, từ đó tiến hành cải tiến tương tự cho một trong những căn cứ sao của chúng ta."
 subject.55.a: "Soạn thảo một thông điệp gửi đến [overlord_empire.Capital.GetName]."
 subject.55.b: "Chúng ta chưa đến mức túng quẫn phải đi ăn xin."
 subject.60.title: "Một Yêu cầu"
 subject.60.desc: "Chúng ta đã nhận được một thông điệp từ [subject_empire.Capital.GetName], trong đó bày tỏ một yêu cầu của [subject_empire.GetName].\n\nCó vẻ như họ rất quan tâm đến việc đầu tư vào các căn cứ sao của mình, và cũng đã nghe nói về những tiến bộ mà chúng ta đã đạt được trong lĩnh vực này. Họ dường như rất sẵn lòng trả một cái giá nhất định để đổi lấy sự hỗ trợ của chúng ta."
 subject.60.a: "Vậy thì cứ làm như thế, chúng ta sẽ cử một số kỹ sư qua đó."
 subject.60.a.tt: "§Y[targeted_starbase.GetName]§! sẽ được nâng cấp bằng công nghệ căn cứ sao mới nhất của chúng ta."
 subject.60.b: "Chúng ta còn không đủ dùng cho chính mình."
 subject.62.title: "Căn cứ đã Nâng cấp"
 subject.62.desc: "Ngay sau khi chúng ta gửi thông điệp cho [overlord_empire.GetName], các kỹ sư đã nhanh chóng đến [targeted_starbase.GetName]. Họ gần như ngay lập tức huy động mọi nguồn nhân lực địa phương để xây dựng lại toàn bộ căn cứ sao, và nhanh chóng hoàn thành công trình này.\n\nMặc dù một số chi tiết về việc xây dựng lại căn cứ sao vẫn được giữ bí mật với chúng ta, nhưng chỉ cần có thời gian, các kỹ sư của chúng ta chắc chắn sẽ có thể hiểu sâu hơn."
 subject.62.desc_overlord_gestalt: "Ngay sau khi chúng ta gửi thông điệp cho [overlord_empire.GetName], [overlord_empire.GetEngineerPlural] đã nhanh chóng đến [targeted_starbase.GetName]. Họ gần như ngay lập tức huy động mọi tài nguyên cần thiết, và nhanh chóng hoàn thành việc xây dựng lại căn cứ sao.\n\nMặc dù một số chi tiết về việc xây dựng lại căn cứ sao vẫn được giữ bí mật với chúng ta, nhưng chỉ cần có thời gian, các kỹ sư của chúng ta chắc chắn sẽ có thể hiểu sâu hơn."
 subject.62.a: "Dù sao đi nữa chúng ta vẫn vô cùng biết ơn."
 subject.65.title: "Yêu cầu bị Từ chối"
 subject.65.desc: "Mẫu quốc đã gửi lại cho chúng ta một phản hồi thô bạo, nói rõ rằng họ không có thời gian cũng như hứng thú để giúp đỡ chúng ta nâng cao khả năng phòng thủ."
 subject.65.a: "Thật đáng thất vọng."
 #Modifiers
 specialist_bulwark_helpful_overlord_modifier: "Mẫu quốc tốt bụng"
 specialist_bulwark_helpful_overlord_modifier_desc: "Ai cũng biết rằng, mẫu quốc này thường xuyên dang tay giúp đỡ khi chư hầu của ngài gặp khó khăn, và nhờ vậy mà ngài rất được lòng dân."
 ## Chuỗi Sự kiện - Thành trì bị Chiếm đóng
 subject.100.title: "Thành trì Suy tàn"
 subject.100.desc: "Chúng ta đã nhận được một thông điệp từ thuộc địa bị chiếm đóng của [subject_empire.GetName], với những lời lẽ vỡ vụn giống như chính quốc gia của họ lúc này vậy. Quốc gia chư hầu của chúng ta không thể tự vệ, và đang tìm kiếm sự giúp đỡ từ chúng ta.\n\nDo tính chất quân phiệt trong thỏa thuận ngoại giao của chúng ta, lẽ tự nhiên chúng ta nên can thiệp, và bảo vệ quốc gia chư hầu của mình khỏi bị tổn hại thêm. Một số cố vấn của chúng ta thì lại cho rằng, có lẽ việc khích lệ chư hầu vùng lên tự vệ thay vì can thiệp trực tiếp mới là quyết định phù hợp hơn cho cả hai bên."
 subject.100.desc_overlord_gestalt: "Chúng ta đã nhận được một thông điệp từ thuộc địa bị chiếm đóng của [subject_empire.GetName], với những lời lẽ vỡ vụn giống như chính quốc gia của họ lúc này vậy. Quốc gia chư hầu của chúng ta không thể tự vệ, và đang tìm kiếm sự giúp đỡ từ chúng ta.\n\nDo tính chất quân phiệt trong thỏa thuận ngoại giao của chúng ta, lẽ tự nhiên chúng ta nên can thiệp, và bảo vệ quốc gia chư hầu của mình khỏi bị tổn hại thêm. Chúng ta cũng đang tiến hành các tính toán, nhằm xác định xem liệu việc khích lệ chư hầu vùng lên tự vệ thay vì can thiệp trực tiếp có phải là quyết định phù hợp hơn cho cả hai bên hay không."
 subject.100.a: "Chúng ta khích lệ họ tự vệ."
 subject.100.a.tt: "§Y[subject_empire.GetName]§! có thể sẽ trở nên quân phiệt hơn một chút."
 subject.100.b: "Dù thế nào đi nữa, bảo vệ chư hầu là trách nhiệm của mẫu quốc."
 subject.100.c: "Họ phải học cách tự lực cánh sinh rồi."
 subject.105.title: "Thành trì Suy tàn"
 subject.105.desc: "Nỗi thống khổ của nhân dân chúng ta vẫn đang tiếp diễn, nhiều người bắt đầu gửi gắm hy vọng vào việc mẫu quốc [overlord_empire.GetName] của chúng ta có thể cung cấp chút giúp đỡ. Họ đã tống tiền chúng ta quá nhiều trong một thời gian dài, giờ đây chỉ có việc họ tham gia vào cuộc chiến, giải phóng nhân dân chúng ta khỏi sự nhục nhã từ bên ngoài mới là công bằng.\n\nSau khi công khai kêu gọi sự giúp đỡ, cuối cùng chúng ta cũng nhận được một số cố vấn quân sự phái cử từ mẫu quốc, họ sẽ đến giúp nhân dân chúng ta giành lại lãnh thổ. Họ đã bắt đầu thảo luận về cách chúng ta có thể tận dụng tốt hơn nhân dân của mình về mặt quân sự, mặc dù điều này cũng phải trả một cái giá tương xứng."
 subject.105.desc_subject_gestalt: "Vì nỗi thống khổ ở các thuộc địa của chúng ta vẫn đang tiếp diễn, chúng ta bắt đầu gửi gắm hy vọng vào việc mẫu quốc [overlord_empire.GetName] có thể cung cấp chút giúp đỡ. Họ đã tống tiền chúng ta quá nhiều trong một thời gian dài, giờ đây chỉ có việc họ tham gia vào cuộc chiến, giải phóng chúng ta khỏi sự nhục nhã từ bên ngoài mới là công bằng.\n\nSau khi cử một số drone đi cầu cứu, cuối cùng chúng ta cũng nhận được một số cố vấn quân sự phái cử từ mẫu quốc, họ sẽ đến giúp tổ chức chúng ta giành lại lãnh thổ. Xem xét kỳ vọng ban đầu của chúng ta đối với mẫu quốc, kết quả này chỉ ở mức tạm chấp nhận được, và chúng ta sẽ không thể huy động tài nguyên của mình như kế hoạch ban đầu."
 subject.105.desc_overlord_gestalt: "Nỗi thống khổ của nhân dân chúng ta vẫn đang tiếp diễn, nhiều người bắt đầu gửi gắm hy vọng vào việc mẫu quốc [overlord_empire.GetName] của chúng ta có thể cung cấp chút giúp đỡ. Họ đã tống tiền chúng ta quá nhiều trong một thời gian dài, giờ đây chỉ có việc họ tham gia vào cuộc chiến, giải phóng nhân dân chúng ta khỏi sự nhục nhã từ bên ngoài mới là công bằng.\n\nSau khi công khai kêu gọi sự giúp đỡ, cuối cùng chúng ta cũng nhận được một số [overlord_empire.GetIndividualName] quân sự phái cử từ mẫu quốc, họ sẽ đến giúp nhân dân chúng ta giành lại lãnh thổ. Có vẻ như mẫu quốc của chúng ta cho rằng, tốt nhất là chúng ta nên tự tổ chức nhân dân của mình để khôi phục lại vùng đất đã mất, chứ không nên hy vọng họ sẽ nhúng tay vào giúp đỡ chúng ta tận tình."
 subject.105.desc_both_gestalt: "Vì nỗi thống khổ ở các thuộc địa của chúng ta vẫn đang tiếp diễn, chúng ta bắt đầu gửi gắm hy vọng vào việc mẫu quốc [overlord_empire.GetName] có thể cung cấp chút giúp đỡ. Họ đã tống tiền chúng ta quá nhiều trong một thời gian dài, giờ đây chỉ có việc họ tham gia vào cuộc chiến, giải phóng chúng ta khỏi sự nhục nhã từ bên ngoài mới là công bằng.\n\nSau khi công khai kêu gọi sự giúp đỡ, cuối cùng chúng ta cũng nhận được một số [overlord_empire.GetIndividualName] quân sự phái cử từ mẫu quốc, họ sẽ đến giúp chúng ta tổ chức tài nguyên để giành lại lãnh thổ. Có vẻ như mẫu quốc của chúng ta cho rằng, tốt nhất là chúng ta nên tự tổ chức lại và khôi phục vùng đất đã mất, chứ không nên hy vọng họ sẽ nhúng tay vào giúp đỡ chúng ta tận tình."
 subject.105.a: "Giành lại tự do, bằng mọi giá."
 subject.105.b: "Tự do cũng có giá của nó, điều này không đáng."
 subject.107.title: "Người Bảo vệ"
 subject.107.desc: "Toàn bộ người dân [subject_empire.GetName] đã đoàn kết một lòng, quyết tâm đánh đuổi ngoại bang, vùng lên bảo vệ quê hương của họ, luôn sẵn sàng cống hiến thân mình cho đế quốc. Hy vọng điều này có thể giải quyết được những vấn đề mà chư hầu của chúng ta đang gặp phải."
 subject.107.a: "Ừm, tin tốt."
 subject.110.title: "Người Yêu Chuộng Hòa Bình"
 subject.110.desc: "Ngay cả khi bị chiếm đóng, nhân dân [subject_empire.GetName] vẫn từ chối bất kỳ nỗ lực nào nhằm giành lại lãnh thổ."
 subject.110.a: "Chúng ta đành lực bất tòng tâm."
 #Modifiers
 specialist_bulwark_home_defense_force_modifier: "Bảo Vệ Tổ Quốc"
 specialist_bulwark_home_defense_force_modifier_desc: "Ngoại trừ việc chứng kiến nước mất nhà tan, hiếm có điều gì có thể dễ dàng khơi dậy sự vĩ đại trong trái tim con người đến vậy."
 specialist_bulwark_defensive_overlord_modifier: "Mẫu quốc che chở"
 specialist_bulwark_defensive_overlord_modifier_desc: "Mẫu quốc tốt thì hiến kế, mẫu quốc vĩ đại thì tự mình ra tay."
 ## Chuỗi Sự kiện - Cuồng nhiệt Chiến tranh
 subject.1003.title: "Cuồng nhiệt Chiến tranh"
 subject.1003.desc: "Có báo cáo cho biết một phong trào phái diều hâu đang được ấp ủ trên [Root.Capital.GetName], và một cựu chiến binh đang giữ vị trí trung tâm mang tính biểu tượng của phong trào này. Thông qua việc lãng mạn hóa quá khứ từng có thể tùy ý xâm phạm, san phẳng các đế quốc khác của chúng ta, họ hối thúc chúng ta đưa ra một chương trình nghị sự quyết liệt hơn, mang lại nhiều lợi ích hơn cho chính người dân của chúng ta, đồng thời làm suy yếu các đối thủ của chúng ta.\n\nDưới nền hòa bình mong manh và ngắn ngủi hiện tại, họ nhanh chóng giành được sự ủng hộ của đông đảo người nghèo và binh lính. Nếu cảm thấy phong trào này sẽ mang lại rắc rối, các cố vấn của chúng ta chỉ ra rằng, nhân vật then chốt của phong trào này chính là vị thủ lĩnh bù nhìn đó, nếu loại bỏ được yếu tố gây rắc rối này, toàn bộ phong trào sẽ sụp đổ."
 subject.1003.a: "Thực ra chương trình nghị sự của họ lại khá phù hợp với kế hoạch của chúng ta."
 subject.1003.b: "Hãy kết thúc trò hề này trước khi sự việc vượt khỏi tầm kiểm soát."
 subject.1005.title: "Hướng đi của Chiến tranh"
 subject.1005.desc: "Do phong trào trước đó được mặc nhiên chấp thuận, tháng trước những lời kêu gọi yêu cầu chính phủ thể hiện thái độ hiếu chiến hơn không ngừng gia tăng. Khi xung đột giữa giới lãnh đạo của chúng ta và phong trào lên đến đỉnh điểm, [Root.GetRulerTitle] [Root.GetRulerName] của chúng ta đã công khai lên tiếng ủng hộ phong trào này.\n\nRõ ràng là, chúng ta không chỉ ủng hộ nó, mà còn chuẩn bị đáp ứng nhiều yêu cầu được đưa ra, một đám đông những người ủng hộ đang nóng lòng chờ đợi động thái tiếp theo của chúng ta."
 subject.1005.a: "Chúng ta sẽ tìm một vị trí cho thủ lĩnh cũ của họ."
 subject.1005.a.tt: "Một §YChỉ huy§! sẽ được triệu tập."
 subject.1005.b: "Đã đến lúc chấp nhận khuynh hướng quân sự trong nội bộ đế quốc chúng ta."
 subject.1005.c: "Chúng ta sẽ tận dụng các nguồn lực trong tay để khôi phục hạm đội vinh quang thuở nào."
 subject.1010.title: "Cuồng nhiệt Chiến tranh"
 subject.1010.desc: "Chúng ta đã nhận được báo cáo từ quốc gia chư hầu [subject_empire.GetName]. Báo cáo này tóm tắt cách mà quần chúng bị kích động đến điên cuồng bởi một cựu chiến binh của họ. Họ hiện đang tìm kiếm một kênh để xả cơn giận, họ yêu cầu lãnh đạo của họ phát động chiến tranh.\n\nĐể nhanh chóng dập tắt bạo loạn, chính phủ [subject_empire.GetName] đã chấp nhận phong trào này, và đưa ra một số lời hứa, nhưng những người cung cấp thông tin của chúng ta rất nghi ngờ về việc liệu họ có thể thực hiện được hay không."
 subject.1010.a: "Vậy ra họ muốn chúng ta hiếu chiến hơn, đúng không?"
 #Modifiers
 specialist_overlord_war_fever_modifier: "Tập trung Chiến tranh"
 specialist_overlord_war_fever_modifier_desc: "Đế quốc đã dành phần lớn nguồn lực của mình để xây dựng và duy trì một lực lượng hải quân hùng mạnh hơn."
 ## Chuỗi Sự kiện - Kiệt quệ vì Chiến tranh
 subject.1052.title: "Chán ghét Chiến tranh"
 subject.1052.desc: "Mặc dù bản chất của hiệp ước giữa chúng ta và [overlord_empire.GetName] là về mặt quân sự, nhưng chúng ta không ngờ rằng nó lại gây ra tác động tồi tệ như vậy đối với chúng ta. Nhân dân của chúng ta đang phải chịu đựng những yêu cầu không ngừng từ mẫu quốc, một số cố vấn của chúng ta suy đoán rằng, nếu tình trạng này tiếp tục, nó sẽ gây ra tác động lâu dài đến các kế hoạch dài hạn của chúng ta."
 subject.1052.desc_gestalt: "Mặc dù bản chất của hiệp ước giữa chúng ta và [overlord_empire.GetName] là về mặt quân sự, chúng ta không hề lên kế hoạch cũng như không lường trước được tác động tàn khốc mà nó sẽ mang lại cho chúng ta. Vì chúng ta luôn phải vật lộn với những yêu cầu từ mẫu quốc, nhiều kế hoạch nội bộ của chúng ta đã phải gác lại, chỉ để đáp ứng nhu cầu khổng lồ của quân đội chúng ta."
 subject.1052.a: "[overlord_empire.GetName] sẽ lắng nghe tình cảnh khó khăn của chúng ta."
 subject.1052.b: "Chúng ta sẽ phải nhẫn nhịn."
 subject.1055.title: "Chán ghét Chiến tranh"
 subject.1055.desc: "Chư hầu của chúng ta, [subject_empire.GetName], đã gửi cho chúng ta một công hàm, báo cáo về những xung đột trong nước do chúng ta ép buộc họ can dự vào chiến tranh. Sau khi đã hoàn toàn hiểu rõ bản chất của hiệp ước ngoại giao đã được đồng ý trước đó, họ bắt đầu yêu cầu chúng ta thay đổi chính sách vì lợi ích của họ, điều này thật có chút đáng ngạc nhiên."
 subject.1055.a: "Chúng ta sẽ đảm bảo với họ rằng chúng ta sẽ tiến hành điều tra việc này."
 subject.1055.b: "Xung đột của họ là chuyện riêng của họ."
 subject.1055.b.tt: "§Y[subject_empire.GetName]§! có thể mất đi lòng trung thành vì chúng ta phớt lờ khó khăn của họ."
 subject.1057.title: "Mối quan ngại Hợp lý"
 subject.1057.desc: "Chúng ta đã nhận được phản hồi lịch sự từ [overlord_empire.GetName]. Trong thư giải thích rằng họ sẽ nghiên cứu cách giải quyết tình hình ngoại giao hiện tại, và sẽ tính đến các vấn đề của chúng ta trong các kế hoạch tiếp theo."
 subject.1057.a: "Vô cùng cảm tạ."
 subject.1060.title: "Chế độ Tự Hủy diệt"
 subject.1060.desc: "Mặc dù công hàm của chúng ta đã giải thích chi tiết tình hình, nhưng dường như các đồng minh của chúng ta ở [overlord_empire.GetName] hoàn toàn không quan tâm đến vấn đề của chúng ta. Nếu bản chất hiếu chiến của họ tiếp tục không suy giảm, nhân dân của chúng ta chắc chắn sẽ phải chịu khổ.\n\nKhông lâu sau, phản hồi của mẫu quốc và chi tiết về hoàn cảnh khó khăn hiện tại của chúng ta đã được công chúng biết đến. Chúng ta nhận thấy sự trỗi dậy của một nhóm chính trị nhỏ phản đối việc tiếp tục chịu sự cai trị của [overlord_empire.Capital.GetName]. Rõ ràng là họ không hề có hứng thú an ủi chúng ta, vậy sự trung thành của chúng ta đối với họ rốt cuộc có thể đổi lại được điều gì?"
 subject.1060.desc_gestalt: "Mặc dù công hàm của chúng ta đã giải thích tình hình một cách chi tiết và ngắn gọn, nhưng dường như người bảo vệ của chúng ta, [overlord_empire.GetName], đã quyết định phớt lờ hoàn cảnh khó khăn của chúng ta. Họ không chỉ không quan tâm đến sự trung thành của chúng ta, mà dường như còn quyết tâm tiếp tục hành vi phá hoại hiện tại của họ.\n\nMặc dù khi mới ký kết hiệp ước với họ, chúng ta đã hy vọng vào một kết quả tốt đẹp hơn, nhưng các tính toán hiện tại của chúng ta cho thấy, nó sẽ tiếp tục gây rắc rối cho đế quốc của chúng ta."
 subject.1060.a: "Chúng ta vẫn chưa thể chống lại mẫu quốc của mình."
 subject.1060.b: "... Hoặc là chúng ta có thể?"
 subject.1062.title: "Biểu tình Gia tăng"
 subject.1062.desc: "Có vẻ như sự bác bỏ của chúng ta đã làm nổ ra một phong trào chính trị biểu tình nhỏ trên [subject_empire.GetName]. Mặc dù họ không mấy hài lòng với phản hồi của chúng ta, nhưng phong trào này vẫn đang cố gắng tìm kiếm chỗ đứng, và nhìn chung đế quốc của họ cũng không có khả năng chống lại sự thống trị của chúng ta."
 subject.1062.desc_gestalt: "Có vẻ như sự bác bỏ của chúng ta đã khiến [subject_empire.GetRulerTitle] bắt đầu đặt câu hỏi về tính chính đáng trong việc chúng ta tiếp tục cai trị họ. Mặc dù từ tình hình hiện tại, có thể họ đang do dự về hiệp ước ngoại giao của chúng ta, nhưng vẫn chưa đến mức có thể phản đối."
 subject.1062.a: "Họ nhất định phải tiếp tục thần phục."
 #Modifiers
 specialist_overlord_war_exhaustion_modifier: "Mức độ Chán ghét Chiến tranh"
 specialist_overlord_war_exhaustion_modifier_desc: "Đôi khi, vũng lầy của chiến tranh thậm chí có thể xé rách cả những đế quốc hùng mạnh nhất."
