 ## Chuỗi Sự kiện - Chỉ huy Đối địch
 subject.1102.title: "Những Chỉ huy Cãi vã"
 subject.1102.desc: "Chúng ta nhận thấy những bất đồng và tranh cãi giữa một số chỉ huy hạm đội và lãnh đạo ngày càng gia tăng. Nếu [admiral_democracy.GetName] cho rằng chúng ta nên làm gì đó, thì có thể chắc chắn rằng [admiral_oligarchy.GetName] sẽ làm ngược lại.\n\nBan đầu, đây dường như chỉ là một cuộc cạnh tranh lành mạnh giữa các đối thủ, nhưng gần đây bầu không khí ngày càng trở nên khó chịu, sặc mùi thuốc súng, và chúng ta thấy các đồng nghiệp của họ cũng bắt đầu chọn phe."
 subject.1102.a: "Dù thế nào đi nữa, chúng ta cũng phải chấm dứt cuộc cãi vã này."
 subject.1102.b: "Sớm muộn gì họ cũng sẽ tự giải quyết được thôi."
 subject.1105.title: "Bộ Chỉ huy bị Chia rẽ"
 subject.1105.desc_democracy: "Đây không còn là vấn đề bất đồng ý kiến đơn thuần nữa, bởi toàn bộ bộ tư lệnh hải quân đã đạt đến mức hoàn toàn thù địch với nhau. Cuộc tranh chấp ban đầu giữa hai vị chỉ huy giờ đây đã chia đôi cả văn phòng, không còn ai cố gắng hòa giải giữa họ nữa.\n\nNgoài sự chia rẽ trong bộ tư lệnh, họ hiện cũng đã phân tách thành hai nhóm chính trị được xác định rõ ràng, một bên ủng hộ ban lãnh đạo dân chủ hiện tại của chúng ta, bên kia cho rằng bộ tư lệnh nên đóng vai trò chính trị lớn hơn trong chính phủ của chúng ta."
 subject.1105.desc_oligarchy: "Đây không còn là vấn đề bất đồng ý kiến đơn thuần nữa, bởi toàn bộ bộ tư lệnh hải quân đã đạt đến mức hoàn toàn thù địch với nhau. Cuộc tranh chấp ban đầu giữa hai vị chỉ huy giờ đây đã chia đôi cả văn phòng, không còn ai cố gắng hòa giải giữa họ nữa.\n\nNgoài sự chia rẽ trong bộ tư lệnh, họ hiện cũng đã phân tách thành hai nhóm chính trị được xác định rõ ràng, một bên ủng hộ ban lãnh đạo hiện tại của chúng ta, bên kia cho rằng quần chúng nên đóng vai trò chính trị lớn hơn trong chính phủ của chúng ta."
 subject.1105.desc_neither: "Đây không còn là vấn đề bất đồng ý kiến đơn thuần nữa, bởi toàn bộ bộ tư lệnh hải quân đã đạt đến mức hoàn toàn thù địch với nhau. Cuộc tranh chấp ban đầu giữa hai vị chỉ huy giờ đây đã chia đôi cả văn phòng, không còn ai cố gắng hòa giải giữa họ nữa.\n\nNgoài sự chia rẽ trong bộ tư lệnh, họ hiện cũng đã phân tách thành hai nhóm chính trị được xác định rõ ràng, một bên cho rằng bộ tư lệnh nên đóng một vai trò quan trọng trong chính phủ của chúng ta, bên kia cho rằng quần chúng nên được trao nhiều quyền lực chính trị hơn."
 subject.1105.a: "Họ định tiếp tục hành vi ngu ngốc này cho đến bao giờ?"
 subject.1107.title: "Những Chỉ huy Cãi vã"
 subject.1107.desc: "Chúng ta nhận được tin rằng, chư hầu của chúng ta, [subject_empire.GetName], dường như đang trải qua một cuộc đấu tranh nội bộ, bộ tư lệnh hải quân của họ đang rơi vào hỗn loạn sau khi hai vị chỉ huy vướng vào xung đột.\n\nGiới lãnh đạo của họ đang bận rộn kiểm soát tình hình, và vì những người ủng hộ của hai vị chỉ huy đối địch vẫn đang tiếp tục tranh giành quyền lực, chúng ta nghi ngờ không biết họ có còn là đồng minh và chư hầu đáng tin cậy của chúng ta hay không."
 subject.1107.a: "Hãy can thiệp trước khi tình hình trở nên tồi tệ hơn."
 subject.1107.b: "Giải quyết công việc nội bộ của họ không phải là phần việc của chúng ta."
 subject.1110.title: "Mẫu quốc Can thiệp"
 subject.1110.desc: "Vì chúng ta lo ngại rằng cuộc xung đột trong bộ tư lệnh sẽ lan sang các nhà lãnh đạo khác trong đế quốc của chúng ta, đồng minh của chúng ta [overlord_empire.GetName] đã can thiệp và xoay sở để dập tắt tình hình. Có vẻ như cả [admiral_oligarchy.GetName] và [admiral_democracy.GetName] đều không muốn chống lại giới lãnh đạo của [overlord_empire.Capital.GetName]."
 subject.1110.a: "Cuối cùng thì cuộc tranh cãi cũng kết thúc."
 subject.1112.title: "Mẫu quốc Can thiệp"
 subject.1112.desc: "Khi các nhà ngoại giao từ [overlord_empire.GetName] đến và giúp điều hòa tình hình, chúng ta đã đặt nhiều hy vọng vào việc [admiral_oligarchy.GetName] và [admiral_democracy] đạt được thỏa hiệp. Nhưng sau vài ngày cãi vã liên tục, có vẻ như điểm chung duy nhất mà hai bên đạt được là mẫu quốc của chúng ta không đóng vai trò gì trong cuộc tranh chấp của họ."
 subject.1112.a: "Ngay cả họ cũng không thể giúp được gì sao?"
 subject.1115.title: "Âm mưu Ám sát"
 subject.1115.desc: "Cuộc xung đột giữa hai phe trong bộ tư lệnh đã kéo dài hàng tuần, thậm chí hàng tháng, một phe do [admiral_oligarchy.GetName] lãnh đạo, phe kia do [admiral_democracy.GetName] lãnh đạo, trước đó chưa xảy ra bất kỳ vụ bạo lực trực tiếp nào, nhưng bây giờ người ta lại phát hiện ra thi thể của một người ủng hộ dân chủ.\n\nMặc dù chúng ta không tìm thấy bất kỳ bằng chứng nào cho thấy phe kia có liên quan đến vụ giết người này, nhưng nó chắc chắn sẽ gây ra phản ứng dữ dội và bạo lực hơn từ cả hai phía."
 subject.1115.a: "Chúng ta có thể làm gì để cứu vãn tình hình này đây?"
 subject.1120.title: "Một Thảm họa Công cộng"
 subject.1120.desc: "Chúng ta nhận được báo cáo về một con tàu chở hàng không rõ danh tính bị rơi tại một khu dân cư trên [crash_planet.GetName]. Trong lúc chúng ta đang tìm cách để giúp đỡ họ, tất cả những người từng sống ở đó đã tạm thời được sơ tán đến nơi trú ẩn.\n\nNhóm thiểu số tinh hoa không chỉ chủ trương phớt lờ hoàn cảnh khó khăn của những người bị đuổi khỏi nhà, mà còn ủng hộ việc phát triển một mỏ khoáng sản mới trong khu vực, bởi vì con tàu chở hàng dường như đã phát hiện ra một mạch khoáng sản nguyên vẹn và phong phú mà chúng ta chưa từng thấy trước đây. Tất nhiên, đối thủ của họ cực lực phản đối ý tưởng này, và yêu cầu chúng ta tập trung sức lực vào việc xây dựng lại nhà cửa cho những người bị nạn."
 subject.1120.a: "Chúng ta sẽ xây dựng lại nhà cửa cho họ."
 subject.1120.b: "Nhắc đến khoáng sản thì tôi không buồn ngủ nữa."
 subject.1125.title: "Vấn đề Nguồn vốn"
 subject.1125.desc: "Ngày nay, những cuộc tranh cãi và xung đột này không còn giới hạn ở bộ tư lệnh nữa, chúng ta có thể thấy chúng ở mọi bộ phận của đế quốc. Sự kiện gần đây nhất liên quan đến số vốn được phân bổ cho [Root.Capital.GetName] phục vụ nhu cầu dân sinh, phe thiểu số tinh hoa muốn phân bổ lại số tiền đó cho quân đội."
 subject.1125.a: "Sự phân bổ ban đầu là có lý do của nó."
 subject.1125.b: "Phe thiểu số tinh hoa đã đúng, hãy chuyển nguồn vốn cho quân đội."
 subject.1130.title: "Bạo lực Đường phố"
 subject.1130.desc: "Sau một cuộc biểu tình đặc biệt tàn bạo gần văn phòng của phe thiểu số tinh hoa, một số thành viên của cả hai phe này đã bị thẩm vấn. Không có gì đáng ngạc nhiên, câu chuyện của hai bên hoàn toàn khác nhau, đa số đều đổ lỗi cho đối phương.\n\nHọ không chỉ muốn chúng ta chọn một phe, mà cả hai bên đều sẵn sàng can thiệp để đảm bảo rằng thời gian chúng ta đầu tư là xứng đáng."
 subject.1130.a: "Những người theo chủ nghĩa dân túy có quyền này."
 subject.1130.b: "Rõ ràng là, phe thiểu số tinh hoa vô tội trong vụ tấn công này."
 subject.1135.title: "Bê bối Dân chủ"
 subject.1135.desc: "Chúng ta đã nhận được một báo cáo, đề cập đến việc một đồng minh thân cận của [admiral_democracy.GetName] đã biển thủ công quỹ cho những chi tiêu cá nhân mờ ám. Nhiều người cho rằng hành động này có thể là đại diện cho phe phái của người đó. Nếu công chúng biết rằng phong trào này đã biển thủ công quỹ để phục vụ lợi ích cá nhân, chắc chắn điều đó sẽ dội một gáo nước lạnh vào chương trình nghị sự theo chủ nghĩa dân túy của họ."
 subject.1135.a: "Chúng ta sẽ bảo vệ họ, chỉ lần này thôi."
 subject.1135.b: "Một vụ bê bối đáng để chia sẻ."
 subject.1140.title: "Tìm Ra Hung Thủ"
 subject.1140.desc: "Sau một cuộc điều tra dài đằng đẵng, có vẻ như cuối cùng họ cũng đã tìm ra hung thủ của vụ án mạng đầu tiên tại văn phòng bộ tư lệnh. Tất cả bằng chứng đều hướng về một trong những cố vấn thân cận nhất của [admiral_oligarchy.GetName], người đã tự ý ra lệnh ám sát đối thủ của họ.\n\nMặc dù [admiral_oligarchy.GetName] không làm gì sai, nhưng nếu công chúng biết được, nó sẽ gây ra tác động xấu đến phong trào của họ."
 subject.1140.a: "Chúng ta đảm bảo họ sẽ không biết đâu."
 subject.1140.b: "Vậy là hung thủ cuối cùng cũng được tìm thấy."
 subject.1142.title: "Bão Tố Nổi Lên"
 subject.1142.desc: "Chúng ta không chỉ thấy cuộc xung đột này đang diễn ra ở bộ tư lệnh, mà thậm chí nó còn lan rộng ra toàn bộ đế quốc. Mặc dù hầu hết các vụ bạo lực không được công khai, nhưng cả hai bên đều chịu tổn thất nặng nề vào thời điểm này.\n\nNhững người cung cấp thông tin của chúng ta ở cả hai phe nói với chúng ta rằng, cả hai bên đều đang dòm ngó quyền lãnh đạo quốc gia, và lên kế hoạch dùng vũ lực đoạt quyền để triệt để loại bỏ đối thủ. Vào thời điểm này, có vẻ như [Root.GetRulerTitle] của chúng ta cũng buộc phải đứng về một phe, nếu không sẽ bị phe kia lật đổ."
 subject.1142.a: "Phong trào dân túy của [admiral_democracy.GetName]."
 subject.1142.b: "Quyền lãnh đạo quân sự của [admiral_oligarchy.GetName]."
 subject.1145.title: "Kết Thúc Cuộc Cạnh Tranh"
 subject.1145.desc: "[Root.GetAdmiraltyWinner]\n\n[Root.GetAdmiraltyLoserConsequences]\n\n[Root.GetAdmiraltyConsequences]"
 subject.1145.a: "Hy vọng tình huống tồi tệ nhất đã qua."
 subject.1145.a.separatist.tt: "Lực lượng ly khai đã kiểm soát §Y[separatist_home.GetName]§!."
 subject.1147.title: "Chư Hầu Chia Rẽ"
 subject.1147.desc: "Có vẻ như bộ tư lệnh của chư hầu [subject_empire.GetName] của chúng ta có nhiều bất đồng và xung đột, dẫn đến việc đế quốc của họ bị chia cắt thành hai phần. Mặc dù xung đột vẫn diễn ra dữ dội, nhưng có vẻ như cả hai bên đều đã chấp nhận sự tiếp tục cai trị của chúng ta."
 subject.1147.a: "Ít nhất chúng ta không phải nghe về chuyện này nữa."
 #Scripted Loc
 overlord_admiralty_democratic_victory: "Sau khi cuộc xung đột ở bộ tư lệnh lên đến đỉnh điểm, có vẻ như phe dân chủ đã đẩy lùi đối thủ của họ, bởi vì họ đã kiểm soát được nhiều học viện trung tâm của chúng ta."
 overlord_admiralty_oligarchic_victory: "Sau khi cuộc xung đột trong nội bộ bộ tư lệnh lên đến đỉnh điểm, có vẻ như phe thiểu số tinh hoa đã giành chiến thắng trong cuộc xung đột đang ấp ủ này, bởi vì tất cả các thuộc địa của chúng ta đều đang loan báo rộng rãi về tin tức này."
 overlord_admiralty_democratic_killed_opponents: "Trong khi mọi thứ đều nằm trong tầm kiểm soát, các chỉ huy của phe dân chủ đã tiến hành một phiên tòa giả tạo chóng vánh đối với những đối thủ cũ của họ, và sau đó xử tử công khai họ như những kẻ phản bội đế quốc."
 overlord_admiralty_democratic_released_opponents: "Trong khi mọi thứ đều nằm trong tầm kiểm soát, các chỉ huy của phe dân chủ đã tiến hành một phiên tòa giả tạo chóng vánh đối với những đối thủ cũ của họ, và sau đó đã thả họ ra sau khi thu một khoản tiền phạt khổng lồ."
 overlord_admiralty_democratic_separatists: "Mặc dù mọi thứ đều nằm dưới sự kiểm soát của phe dân chủ, nhưng những đối thủ cũ của họ đã biến mất trong sự hỗn loạn. Không lâu sau, chúng ta đã nhận được báo cáo về việc phong trào ly khai đang không ngừng phát triển trong số nhiều thành viên cũ của bộ tư lệnh."
 overlord_admiralty_oligarchic_killed_opponents: "Sau khi đưa ra một tuyên bố công khai, họ ngay lập tức có một bài phát biểu, lên án đối thủ của họ là những kẻ kích động, dân túy và bán nước. Những phần tử dân chủ thế lực nhất đã nhanh chóng bị xử tử, số còn lại thì biến mất khỏi tầm mắt của công chúng."
 overlord_admiralty_oligarchic_released_opponents: "Sau khi đưa ra một tuyên bố công khai, họ ngay lập tức có một bài phát biểu, lên án những đối thủ cũ của họ. Bọn họ đều bị phạt nặng, và bị áp dụng các biện pháp để đảm bảo rằng sẽ không bao giờ trở thành rắc rối nữa."
 overlord_admiralty_oligarchic_separatists: "Sau khi đưa ra một tuyên bố công khai, cuộc truy nã đối với những đối thủ cũ của họ đã nhanh chóng bắt đầu, nhưng không mang lại kết quả gì. Sau cuộc đấu tranh hỗn loạn tại văn phòng bộ tư lệnh, phe dân chủ gần như biến mất."
 overlord_admiralty_imposed_government: "Ngay sau khi loại bỏ đối thủ của mình, họ đã quyết định áp đặt các chính sách chính phủ của riêng họ lên đế quốc của chúng ta."
 overlord_admiralty_continued_government: "Mặc dù họ đã loại bỏ đối thủ và tiếp quản đế quốc của chúng ta, nhưng có vẻ như họ rất vui lòng để mọi thứ tiếp tục như thường lệ - ít nhất là vào lúc này."
 overlord_admiralty_imposed_leadership: "Khi đối thủ của họ đã ra đi, họ quyết định không chỉ áp đặt các chính sách của riêng mình lên chính phủ của chúng ta, mà còn để thủ lĩnh cũ của họ đích thân lãnh đạo."
 #Tooltip loc
 bickering_admirals_democratic_boon_tt: "Phe dân chủ của bộ tư lệnh sẽ giành được nhiều ảnh hưởng hơn."
 bickering_admirals_democratic_boon_significant_tt: "Phe dân chủ của bộ tư lệnh sẽ giành được nhiều ảnh hưởng hơn một cách đáng kể."
 bickering_admirals_oligarchic_boon_tt: "Phe thiểu số tinh hoa của bộ tư lệnh sẽ giành được nhiều ảnh hưởng hơn."
 bickering_admirals_oligarchic_boon_significant_tt: "Phe thiểu số tinh hoa của bộ tư lệnh sẽ giành được nhiều ảnh hưởng hơn một cách đáng kể."
 #Modifiers & Deposits
 d_admirals_bickering_crashed_cargo_ship: "Tàu Chở Hàng Bị Rơi"
 d_admirals_bickering_crashed_cargo_ship_desc: "Tàu chở hàng đã phá hủy một khu dân cư, nhưng lại vô tình húc mở một mạch khoáng sản."
 specialist_overlord_admirals_bickering_democratic_funding_modifier: "Quỹ Chuyên Dụng Dân Sinh"
 specialist_overlord_admirals_bickering_democratic_funding_modifier_desc: "Khoản ngân sách dành riêng cho nhu cầu sinh hoạt của người dân ở quốc gia chúng ta."
 specialist_overlord_admirals_bickering_oligarchic_funding_modifier: "Quỹ Chuyên Dụng Quân Sự"
 specialist_overlord_admirals_bickering_oligarchic_funding_modifier_desc: "Khoản ngân sách dành riêng cho quân đội và các nhu cầu liên quan ở quốc gia chúng ta."
 ### Học viện
 ## Chuỗi Sự kiện - Tiến Bộ Công Nghệ
 subject.2005.title: "Tiến Bộ Công Nghệ"
 subject.2005.desc: "Nhờ vào nhiều giao dịch với [overlord_empire.GetName], chúng ta đã có thể tập trung nỗ lực vào việc thiết lập và cải thiện các hoạt động nội bộ của đế quốc. Dưới sự nỗ lực làm việc của các nhà khoa học và kỹ sư, chúng ta đã chứng kiến các thuộc địa của mình phát triển bùng nổ trong vài năm qua. Những điều mà cách đây vài năm người ta vẫn cho là ảo tưởng, bỗng chốc không chỉ trở thành hiện thực, mà còn trở nên vô cùng phổ biến.\n\nChúng ta nhận được tin rằng, trưởng quan của chúng ta ở [overlord_empire.GetName] muốn tự mình đến xem những tiến bộ mới nhất của chúng ta, và rất có thể sẽ mang một số thành quả đó về quê hương của họ."
 subject.2005.desc_gestalt: "Nhờ vào nhiều giao dịch với [overlord_empire.GetName], chúng ta đã có thể tập trung nỗ lực vào việc kiến thiết và cải tạo đế quốc. Do chúng ta đã dành ra một phần lớn trí tuệ tập thể để hoàn thành nhiệm vụ này, những kỳ tích kỹ thuật và công nghệ trước đây được cho là bất khả thi, giờ đây đã trở nên quen thuộc trên các hành tinh của chúng ta.\n\nChúng ta nhận được tin rằng, người giám sát của chúng ta ở [overlord_empire.GetName] muốn tự mình đến xem những tiến bộ mới nhất của chúng ta, và rất có thể sẽ mang một số thành quả đó về quê hương của họ."
 subject.2005.a: "Tất nhiên rồi, hoan nghênh họ đến."
 subject.2010.title: "Trách Nhiệm Của Chư Hầu"
 subject.2010.desc: "Khi sứ giả từ [overlord_empire.GetName] chuẩn bị đến nơi, chúng ta phải quyết định mức độ sẵn sàng chia sẻ các thiết kế và sáng tạo mới nhất của mình với mẫu quốc. Nếu chúng ta chia sẻ, chắc chắn sẽ được khen ngợi, nhưng có thể họ sẽ kiểm soát trực tiếp hơn phương hướng nỗ lực của chúng ta trong tương lai."
 subject.2010.a: "Dù sao đi nữa, vẫn hãy chia sẻ với mẫu quốc của chúng ta."
 subject.2010.b: "Phần lớn hãy giữ lại cho chính chúng ta."
 subject.2015.title: "Tiến Bộ Công Nghệ"
 subject.2015.desc: "Chúng ta nhận được tin rằng, chư hầu của chúng ta, [subject_empire.GetName], gần đây đã đạt được những tiến bộ đáng kể trong việc cải thiện sự phát triển thuộc địa của họ. Một số thiết kế và sáng tạo đã được mang về [overlord_empire.Capital.GetName], và triển vọng phát triển của chúng đều rất tốt. Nếu muốn, chúng ta có thể yêu cầu họ nghiên cứu một lĩnh vực cụ thể, thay vì để họ tiếp tục nỗ lực mà không có sự giám sát."
 subject.2015.a: "Rõ ràng là họ đang tự nghiên cứu rất tốt."
 subject.2015.b: "Hãy để họ tập trung sức lực vào Vật lý."
 subject.2015.c: "Họ sẽ tiến hành nghiên cứu Xã hội học về xã hội của mình."
 subject.2015.d: "Kỹ thuật - sẽ là trọng tâm nghiên cứu của họ."
 subject.2020.title: "Phát Triển Không Giám Sát"
 subject.2020.desc: "Có vẻ như mẫu quốc [overlord_empire.GetAdj] của chúng ta đánh giá cao điều này, và tiếp tục cho phép chúng ta tự do hành động mà không can thiệp hay áp dụng các biện pháp kiểm soát."
 subject.2020.a: "Vậy thì chúng ta sẽ tiếp tục cố gắng."
 subject.2025.title: "Chỉ Thị Vật Lý"
 subject.2025.desc: "Sau khi xem qua các thiết kế và sáng tạo gần đây của chúng ta, mẫu quốc đã ban hành một chỉ thị cho chúng ta. Vì đã nhận ra tiềm năng to lớn tiềm ẩn trong những thiết kế sáng tạo này, có vẻ như họ mong muốn từ nay trở đi chúng ta sẽ bắt đầu tập trung vào nghiên cứu Vật lý."
 subject.2025.a: "Cứ làm như vậy đi."
 subject.2030.title: "Chỉ Thị Xã Hội Học"
 subject.2030.desc: "Sau khi xem qua các thiết kế và sáng tạo gần đây của chúng ta, mẫu quốc đã ban hành một chỉ thị cho chúng ta. Vì đã nhận ra tiềm năng to lớn tiềm ẩn trong những thiết kế và ý tưởng này, có vẻ như họ mong muốn từ nay trở đi chúng ta sẽ bắt đầu tập trung vào nghiên cứu Xã hội học."
 subject.2030.a: "Cứ làm như vậy đi."
 subject.2035.title: "Chỉ Thị Kỹ Thuật"
 subject.2035.desc: "Sau khi xem qua các thiết kế và sáng tạo gần đây của chúng ta, mẫu quốc đã ban hành một chỉ thị cho chúng ta. Vì đã nhận ra tiềm năng to lớn tiềm ẩn trong những thiết kế và cải tiến này, có vẻ như họ mong muốn từ nay trở đi chúng ta sẽ bắt đầu tập trung vào nghiên cứu Kỹ thuật."
 subject.2035.a: "Cứ làm như vậy đi."
