 specialist_technocracy_technology_inflation_general: "Tiến Bộ Công Nghệ"
 specialist_technocracy_technology_inflation_general_desc: "Mọi lĩnh vực nghiên cứu và phát triển công nghệ đều đã đạt được những tiến bộ vượt bậc."
 specialist_technocracy_technology_inflation_physics: "Tiến Bộ Công Nghệ - Vật Lý"
 specialist_technocracy_technology_inflation_physics_desc: "Sau khi chứng kiến những tiến bộ toàn diện và rõ rệt của chúng ta, mẫu quốc đã ra lệnh cho chúng ta tập trung toàn lực vào một lĩnh vực duy nhất."
 specialist_technocracy_technology_inflation_society: "Tiến Bộ Công Nghệ - Xã Hội Học"
 specialist_technocracy_technology_inflation_society_desc: "Sau khi chứng kiến những tiến bộ toàn diện và rõ rệt của chúng ta, mẫu quốc đã ra lệnh cho chúng ta tập trung toàn lực vào một lĩnh vực duy nhất."
 specialist_technocracy_technology_inflation_engineering: "Tiến Bộ Công Nghệ - Kỹ Thuật"
 specialist_technocracy_technology_inflation_engineering_desc: "Sau khi chứng kiến những tiến bộ toàn diện và rõ rệt của chúng ta, mẫu quốc đã ra lệnh cho chúng ta tập trung toàn lực vào một lĩnh vực duy nhất."
 ## Chuỗi Sự kiện - Nghiên Cứu Mang Tính Hủy Diệt
 subject.2055.title: "Nghiên Cứu Mang Tính Hủy Diệt"
 subject.2055.desc: "Chúng ta đã liên tục tiến hành rất nhiều nghiên cứu về chính cấu trúc của hành tinh trên [targeted_planet.GetName], nhằm xác định cách cải tạo hành tinh vì lợi ích của thuộc địa. Đáng tiếc là những diễn biến gần đây đã đi chệch hướng, chất thải độc hại đã gây ô nhiễm những vùng đất rộng lớn, khiến chúng hoàn toàn không thể ở được.\n\nTuy nhiên, các tính toán của chúng ta chỉ ra rằng, đây không chỉ là một sự cố đơn lẻ, chỉ cần kiểu nghiên cứu hành tinh trên diện rộng này còn tiếp diễn, thì có thể sẽ còn nhiều thảm họa như thế này xảy ra."
 subject.2055.a: "Hiện tại chúng ta vẫn sẽ tiếp tục nghiên cứu."
 subject.2055.a.tt: "Xác suất cực lớn sẽ tạo ra thêm tác dụng phụ trên [targeted_planet.GetName]."
 subject.2055.b: "Tạm dừng nghiên cứu cho đến khi làm rõ thực hư."
 subject.2060.title: "Nghiên Cứu Mang Tính Hủy Diệt: Khủng Hoảng Đất Hoang"
 subject.2060.desc: "Một trong những tác dụng phụ gây ra bởi chất thải độc hại từ các nghiên cứu của chúng ta trên [targeted_planet.GetName] là sự tuyệt chủng của một số loài động thực vật từng phát triển mạnh mẽ ở đó, điều này đã gây ra hàng loạt vấn đề cho hệ động thực vật trên hành tinh. Có lẽ hơi bất ngờ, nhưng may mắn là phần lớn cư dân sống trên [targeted_planet.GetName] không bị tổn hại vì điều này, tuy nhiên nó vẫn khiến cuộc sống trở nên khó khăn hơn."
 subject.2060.a: "Đó cũng không phải là chuyện lớn không thể xử lý."
 subject.2060.a.tt: "Xác suất rõ rệt sẽ tạo ra thêm tác dụng phụ trên [targeted_planet.GetName]."
 subject.2060.b: "Đã tiến hành đủ lâu rồi, dừng thí nghiệm thôi."
 subject.2065.title: "Nghiên Cứu Mang Tính Hủy Diệt: Khủng Hoảng Đại Dương"
 subject.2065.desc: "Ước tính ban đầu của chúng ta không được chính xác như hy vọng, và những diễn biến đi chệch hướng gần đây trên [targeted_planet.GetName] lớn hơn nhiều so với kỳ vọng trước đó. Chất thải độc hại ban đầu đã khuếch tán vào các khối nước của hành tinh, từ đó lại làm ảnh hưởng đến các vùng đất lân cận.\n\nVì những vùng nước và đất đai rộng lớn này không còn thích hợp để sinh sống, thuộc địa của chúng ta buộc phải di dời vì lý do an toàn."
 subject.2065.a: "Đến bước này rồi quay lại đã quá muộn."
 subject.2065.a.tt: "Xác suất lớn sẽ tạo ra thêm tác dụng phụ trên [targeted_planet.GetName]."
 subject.2065.b: "Mất bò mới lo làm chuồng, đã đến lúc kết thúc thí nghiệm."
 subject.2070.title: "Nghiên Cứu Mang Tính Hủy Diệt: Khủng Hoảng Dung Nham"
 subject.2070.desc: "Chúng ta nhận được báo cáo rằng dung nham đang trào ra từ lớp vỏ của [targeted_planet.GetName]. Có vẻ như những nghiên cứu gần đây trên hành tinh này đã làm nó mất đi sự ổn định, đến mức động đất đã trở nên phổ biến trong những tháng gần đây, và người dân bắt đầu mất niềm tin vào các nhà khoa học ở đó.\n\nNhìn vào tình hình này, có vẻ như các nhà khoa học của chúng ta đã xác định rằng hiện tại chúng ta đã chạm đáy, dù là theo nghĩa bóng hay nghĩa đen."
 subject.2070.desc_gestalt: "Những nghiên cứu mà chúng ta đã thực hiện gần đây trên [targeted_planet.GetName] dường như đã gây ra nhiều tác dụng phụ hơn cho hành tinh này. Sau một trận động đất nhẹ xảy ra gần một trong những thuộc địa của chúng ta, khí độc và đá nóng chảy đã bất ngờ phun trào từ dưới mặt đất, biến tình hình vốn đang được kiểm soát thành một thảm họa lớn.\n\nXét đến hàng loạt tai họa gần đây xảy ra trên [targeted_planet.GetName], ước tính qua tính toán của chúng ta là những gì chúng ta đang thấy hiện tại đã là kịch bản tồi tệ nhất rồi."
 subject.2070.a: "Ít nhất thì cũng không thể tồi tệ hơn được nữa."
 #Modifiers & Deposits
 specialist_technocracy_reduced_research: "Nghiên Cứu Bị Cản Trở"
 specialist_technocracy_reduced_research_desc: "Xét đến những thiệt hại rõ rệt đã gây ra trước đó, tiến độ nghiên cứu của hành tinh này đã bị tạm dừng để các nghiên cứu tiếp theo có thể được tiến hành an toàn hơn."
 d_technocracy_toxic_waste_blocker: "Chất Thải Độc Hại"
 d_technocracy_toxic_waste_blocker_desc: "Một mảnh đất hoang tàn chứa đầy độc tính, hậu quả của việc nghiên cứu tính toàn vẹn cấu trúc của hành tinh. Những nhà khoa học máu lạnh có lẽ sẽ quan tâm xem điều này sẽ ảnh hưởng như thế nào đến cuộc sống của người dân trên hành tinh."
 d_technocracy_barren_lands_blocker: "Đất Hoang"
 d_technocracy_barren_lands_blocker_desc: "Vùng đất hoang hóa còn sót lại sau khi chất thải độc hại vốn có trên hành tinh đã tiêu diệt một lượng lớn hệ động thực vật."
 d_technocracy_toxic_ocean_blocker: "Nước Độc"
 d_technocracy_toxic_ocean_blocker_desc: "Một lượng lớn khối nước trên hành tinh đã bị ô nhiễm bởi chất thải độc hại, gây ra thiệt hại không thể đong đếm cho những vùng đất xung quanh, khiến chúng không còn thích hợp cho những cư dân cũ sinh sống."
 d_technocracy_molten_waste_blocker: "Đất Hoang Nóng Chảy"
 d_technocracy_molten_waste_blocker_desc: "Sau một trận động đất lớn chưa từng có xảy ra trên hành tinh, dung nham nóng chảy đã trào ra từ dưới lòng đất, gây ra thiệt hại không thể đong đếm cho nhiều thuộc địa xung quanh."
 ## Chuỗi Sự kiện - Thí Nghiệm!
 subject.2105.title: "Nghiên Cứu Thử Nghiệm"
 subject.2105.desc: "Với việc những yêu cầu từ [overlord_empire.GetName] bay đến như bông tuyết, công tác nghiên cứu của chúng ta đã trở nên ngày càng quan trọng. Rất nhiều nhà khoa học của chúng ta đang phải vật lộn với áp lực này, nhưng từ đó lại lóe lên những tia sáng thiên tài và những bước đột phá đáng kinh ngạc thỉnh thoảng xuất hiện.\n\nMột trong những thành quả mới nhất đó là đến từ [targeted_scientist.GetName], người đã thiết kế và dự định tiến hành một loạt các thí nghiệm trong một phòng ban của chúng ta. Vấn đề duy nhất là, trong mọi kế hoạch nghiên cứu của họ đều bao gồm các thí nghiệm trên cơ thể sống của [Root.GetSpeciesNamePlural]."
 subject.2105.desc_gestalt: "Chúng ta đã nhận được thêm những chỉ thị từ [overlord_empire.GetName], họ mong muốn chúng ta nâng cao hơn nữa sản lượng nghiên cứu. Về việc làm thế nào để chúng ta không phụ lòng mong mỏi của mẫu quốc, chúng ta đã tiến hành rất nhiều tính toán, và chúng ta tin rằng mình đã tìm ra cách điều chỉnh quy trình để đạt được mục tiêu.\n\nTuy nhiên, để hiện thực hóa điều này một cách trọn vẹn, chúng ta phải tiến hành một loạt các thí nghiệm trên các drone và mạng lưới thần kinh chia sẻ của mình. Điều này chắc chắn sẽ mang theo rủi ro rất lớn."
 subject.2105.a: "Chúng ta sẽ tài trợ cho những nghiên cứu này." #Non-Gestalt yes
 subject.2105.b: "Dừng nghiên cứu lại." #Non-Gestalt no
 subject.2105.c: "Hãy tiếp tục đi." #Gestalt yes
 subject.2105.d: "Chúng ta không thể nhượng bộ về điều này." #Gestalt no
 subject.2110.title: "Nghiên Cứu Toàn Tâm Toàn Ý"
 subject.2110.desc: "Chúng ta đã nhận được một báo cáo từ một khu dân cư trên [Root.Capital.GetName]. Có liên quan đến nơi ở của [targeted_scientist.GetName]. Lực lượng thực thi pháp luật địa phương đã tìm thấy một vài thi thể còn sót lại của [Root.GetSpeciesNamePlural] - có vẻ như là một phần của những thí nghiệm khủng khiếp đã thất bại tại hiện trường.\n\nChúng ta được báo rằng, vẫn chưa có ai có thể lần theo dấu vết của [targeted_scientist.GetName], người bằng cách nào đó đã tránh được mọi cảm biến."
 subject.2110.a: "Có lẽ điều đó là để đạt được kết quả tốt hơn."
 subject.2112.title: "Nghiên Cứu Thử Nghiệm"
 subject.2112.desc: "Chúng ta nhận được tin báo từ [subject_empire.GetName] - nghe nói rằng họ đã bắt đầu tiến hành các thí nghiệm nguy hiểm trên chính giống loài của mình, và kết quả của các thí nghiệm thường là thảm họa. Mặc dù sứ giả địa phương của chúng ta không yêu cầu chúng ta can thiệp một cách rõ ràng, nhưng rõ ràng họ đang ám chỉ chúng ta."
 subject.2112.desc_gestalt: "Chúng ta nhận được tin báo từ [subject_empire.GetName] - nghe nói rằng họ đã bắt đầu tiến hành các thí nghiệm nguy hiểm trên chính giống loài của mình. Dù nguyên nhân vẫn chưa rõ ràng, ngoại trừ khả năng có thể gây tổn hại cho chính họ, chúng ta cho rằng việc để họ tiếp tục sẽ không mang lại bất kỳ rủi ro đặc biệt nào."
 subject.2112.a: "Chúng ta không có quyền can thiệp vào công việc nội bộ của họ."
 subject.2112.b: "Dừng nghiên cứu lại."
 subject.2115.title: "Nghiên Cứu Bị Từ Chối"
 subject.2115.desc: "Sứ giả từ mẫu quốc của chúng ta mang đến một mệnh lệnh rõ ràng, yêu cầu chấm dứt các thí nghiệm và thử nghiệm đang được tiến hành gần đây trên [Root.Capital.GetName] nhằm vào [Root.GetSpeciesAdj]. Mặc dù không nêu rõ bất kỳ lý do cụ thể nào, nhưng ý tứ của nó là vô cùng rõ ràng."
 subject.2120.title: "Nghiên Cứu Được Chấp Thuận"
 subject.2120.desc: "Chúng ta vẫn chưa nhận được bất kỳ phản hồi nào từ mẫu quốc [overlord_empire.GetName] của mình. Họ dường như đã biết về các nghiên cứu mà chúng ta mới bắt đầu gần đây, và chọn cách không can thiệp bằng bất kỳ hình thức nào.\n\nTheo kế hoạch của mình, chúng ta cần xác định xem bước tiếp theo chúng ta sẽ tiến hành những thí nghiệm nào. Một thiết kế có rủi ro càng lớn, mối nguy hiểm tiềm tàng càng cao, thì càng có nhiều khả năng mang lại lợi ích lâu dài cho đế quốc của chúng ta."
 subject.2120.a: "Chúng ta sẽ dốc sức vào các thí nghiệm thích hợp."
 subject.2120.a.tt: "Chúng ta sẽ tiếp tục tiến hành các thí nghiệm nguy hiểm hơn."
 subject.2120.b: "Thực hiện một vài bài kiểm tra ở mức độ nhẹ hơn"
 subject.2120.b.tt: "Chúng ta sẽ tiến hành các thí nghiệm an toàn hơn."
 subject.2125.title: "Thí Nghiệm Thất Bại"
 subject.2125.desc: "Chúng ta đã thực hiện rất nhiều thí nghiệm, nhưng cuối cùng kết quả chỉ mang lại sự thất bại và thất vọng. Nếu phải nói có ý nghĩa gì, thì đó là chúng ta đã học được cách tránh những cạm bẫy trong tương lai."
 subject.2130.title: "Thí Nghiệm Thành Công"
 subject.2130.desc: "Hầu hết các thí nghiệm của chúng ta cuối cùng cũng đã được đền đáp, và mang lại một số thu hoạch bất ngờ. Phần lớn các đối tượng thử nghiệm thậm chí còn sống sót, và thể hiện rất tốt. Vì vậy nhìn chung, các thí nghiệm được coi là khá thành công."
 subject.2130.a: "Tin tốt đấy."
 subject.2135.title: "Thí Nghiệm Thành Công"
 subject.2135.desc: "Mặc dù có người sẽ nói rằng chi phí cao hơn dự kiến, nhưng chúng ta đã đạt được thành công vang dội trong nhiều thí nghiệm. Qua một vài kết quả thú vị và bất ngờ, những gì chúng ta học được còn nhiều hơn so với dự đoán ban đầu."
 subject.2135.a: "Một cái giá xứng đáng."
 subject.2140.title: "Đột Biến Bất Ngờ"
 subject.2140.desc: "Nhiều thí nghiệm của chúng ta đã dẫn đến những thay đổi thú vị ở các đối tượng thử nghiệm, về hình thể hoặc tính cách, từ kỳ dị, đáng sợ cho đến những biến đổi nhỏ bé không đáng kể đều xảy ra. Thật bất ngờ, những cá thể đột biến này đã trốn thoát khỏi phòng thí nghiệm, bắt đầu tác động đến các khu vực khác trong đế quốc của chúng ta."
 subject.2140.a: "Thật sự rất thú vị..."
 subject.2145.title: "Pha Trộn Và Kết Hợp"
 subject.2145.desc: "Nhiều thí nghiệm ban đầu của chúng ta đã kết thúc trong thất bại, đến mức chúng ta phải thiết kế lại một số phần và thử lại. Trong một viễn cảnh thiết kế lại khác thường, chúng ta đã đưa vào một cá thể [targeted_species.Species.GetAdj]. Dù không đặt nhiều kỳ vọng, nhưng cuối cùng lại đạt được thành công ngoài mong đợi. Với chiến thắng này, chúng ta sẽ tiếp tục tiến hành các thí nghiệm trên cả hai giống loài của mình."
 subject.2145.a: "Tuy không giống như những gì chúng ta tưởng tượng, nhưng vẫn rất thú vị."
 subject.2145.a.tt: "Hợp nhất §Y100§! £pop£ §Hnhân khẩu [Root.Species.GetName]§! và §Y100§! £pop£ §Hnhân khẩu [targeted_species.Species.GetName]§! thành §Y100§! £pop£ §Hnhân khẩu [new_species.Species.GetName]§!"
 subject.2150.title: "Thí Nghiệm Thất Bại"
 subject.2150.desc: "$subject.2125.desc$"
 ### Chung
 ## Chuỗi Sự kiện - Bất Đồng Quan Điểm của Du Khách Mẫu Quốc
 subject.3005.title: "Mối Nguy Hiểm Tại Nhà"
 subject.3005.desc: "Sau khi chúng ta trở thành chư hầu của họ, một lượng lớn người từ [overlord_empire.GetName] đã bắt đầu đến thăm thế giới của chúng ta và bày tỏ sự quan tâm đến văn hóa cũng như con người nơi đây. Ban đầu, chúng ta cho rằng đây là một điều tốt đẹp cho mọi người, nhưng dạo gần đây, chúng ta chứng kiến sự gia tăng các cuộc xung đột giữa người dân địa phương và du khách [overlord_empire.GetAdj] - dường như họ mang theo một vài hiểu lầm về đế quốc của chúng ta, và họ có xu hướng sử dụng văn hóa cùng lý tưởng của [overlord_empire.GetAdj] để biện minh cho hành vi thô lỗ của mình."
 subject.3005.a: "Sớm muộn gì hai đế quốc của chúng ta cũng sẽ cùng nhau thịnh vượng."
 subject.3005.b: "Hạn chế việc đi lại của thường dân."
 subject.3010.title: "Sự Bất Đồng Trên [subject_empire.Capital.GetName]"
 subject.3010.desc: "Chúng ta đã nhận được một số tin tức đáng lo ngại, nguồn cơn xuất phát từ việc những người của chúng ta đi đến thăm [subject_empire.Capital.GetName] - thủ đô của [subject_empire.GetName]. Chính quyền [subject_empire.GetName] yêu cầu họ phải sơ tán khỏi hành tinh ngay lập tức, rõ ràng là sau một vài cuộc gọi là xung đột, thường dân của chúng ta đã không còn được chào đón trong lãnh thổ của họ nữa."
 subject.3010.a: "Dù thế nào đi chăng nữa, biên giới vẫn sẽ mở cửa."
 subject.3010.b: "Nếu người dân của chúng ta cư xử không đúng mực, thì họ nên về nhà."
 subject.3015.title: "Mở Cửa Biên Giới"
 subject.3015.desc: "Có vẻ như mẫu quốc của chúng ta đã nghe được tình hình này, và cử một nhóm nhỏ quan chức cùng binh lính đến để làm rõ lập trường của họ về vấn đề này. Họ đã thể hiện một cách dứt khoát và rõ ràng rằng, hoặc là chúng ta mở cửa biên giới một cách hòa bình cho thường dân của họ, hoặc là họ sẽ dùng vũ lực để ép buộc hai bên phải mở cửa biên giới với nhau."
 subject.3015.a: "Chuyện này không đáng để phải động binh đao."
 subject.3020.title: "Chư Hầu Được Đặc Quyền"
 subject.3020.desc: "Có vẻ như mẫu quốc của chúng ta đã nghe được tình hình này, và quyết định chấp nhận quyết định đóng cửa biên giới đối với việc đi lại của thường dân [overlord_empire.GetAdj] của chúng ta. Một số quan chức của chúng ta lo ngại điều này có thể gây ra sự cố ngoại giao, nhưng lần này dường như chúng ta đã may mắn tránh được."
 subject.3020.a: "Kết quả tốt hơn nhiều so với những gì chúng ta mong đợi."
 #Modifiers
 specialist_overlord_frustrated_population: "Nhập Gia Nhưng Không Tùy Tục"
 specialist_overlord_frustrated_population_desc: "Những du khách phớt lờ phong tục và chuẩn mực địa phương, làm xáo trộn nghiêm trọng cuộc sống thường ngày của hành tinh này."
 ## Chuỗi Sự kiện - Những Cuộc Hành Hương
 subject.3055.title: "Những Người Hành Hương Trên [overlord_empire.Capital.GetName]"
 subject.3055.desc: "Chúng ta nhận được tin rằng, một nhóm người hành hương từ [subject_empire.GetName] đã bằng mọi cách tìm đến vùng không gian của chúng ta. Có vẻ như họ tin rằng [overlord_empire.GetName] đại diện cho một tầm quan trọng nào đó về mặt tôn giáo tại quê hương của họ. Mặc dù các chi tiết liên quan đến đức tin tôn giáo của họ vẫn chưa rõ ràng, nhưng nhóm người này với tư cách là khách du lịch cư xử vô cùng đúng mực, trong suốt thời gian lưu trú, mọi người chỉ dành lời khen ngợi cho họ chứ không hề có một lời phàn nàn nào."
 subject.3055.a: "Có vẻ như, đây là một cơ hội để thể hiện thiện chí."
 subject.3060.title: "Thường Dân Trở Về"
 subject.3060.desc: "Một nhóm thường dân đến du lịch tại [overlord_empire.Capital.GetName] của [overlord_empire.GetName] cuối cùng đã trở về, mang theo đủ loại giai thoại kỳ thú, kể lại những người họ gặp và hoàn cảnh địa phương. Có vẻ như người dân của chúng ta đã nhận được sự tiếp đãi nồng hậu trong suốt chuyến thăm, và hiện nay ngày càng có nhiều người sẵn lòng đến đó du lịch. Nếu chúng ta có thể gây chút ảnh hưởng lên mẫu quốc, có lẽ chúng ta có thể tổ chức các hoạt động giao lưu văn hóa tương tự một cách thường xuyên hơn."
 subject.3060.a: "Đặt nền móng cho mối quan hệ song phương trong tương lai."
 subject.3060.b: "Chỉ là sự nhiệt tình bốc đồng nhất thời mà thôi."
 subject.3065.title: "Mối Quan Hệ Khăng Khít"
 subject.3065.desc: "Nhóm người hành hương đầu tiên đến thăm vô cùng thân thiện, mang đến thiện chí. Không chỉ dừng lại ở đó, có vẻ như [subject_empire.GetName] đã đầu tư một số nguồn lực, với hy vọng sẽ nâng tầm hoạt động này thành một mối quan hệ song phương mang tính lâu dài, trong tương lai họ sẽ cử những người hành hương đến theo một cơ sở chính quy hơn."
 subject.3065.a: "Rất vui khi nghe điều này."
 subject.3070.title: "Chuyến Hành Hương Cuối Cùng"
 subject.3070.desc: "Nhóm người hành hương mà chúng ta tiếp nhận trên [overlord_empire.Capital.GetName] đã nhận được sự tiếp đãi nồng hậu, và họ cũng vô cùng thích thú trong suốt thời gian lưu trú. Tuy nhiên, chúng ta vẫn nhận được thông báo rằng [subject_empire.GetName] sẽ đình chỉ các hoạt động giao lưu viếng thăm như vậy trong tương lai."
