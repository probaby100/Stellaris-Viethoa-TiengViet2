 civic_machine_anglers: "Người máy Đại dương"
 civic_machine_anglers_desc: "Thiết kế của xã hội cơ khí này đáp ứng khả năng vận hành trơn tru trong các môi trường nước khác nhau, đồng thời họ rất giỏi trong việc xây dựng cơ sở hạ tầng đại dương vô song để thúc đẩy tăng trưởng kinh tế."
