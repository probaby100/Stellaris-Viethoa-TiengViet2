l_simp_chinese:
 AQUATICS_TITLE: "Aquatics Species Pack" # Không dịch
 DLC_AQUATICS_RECOMMENDATION_DESC: "Bản mở rộng Aquatics mang đến vô số lựa chọn mới, cho phép bạn trải nghiệm một cuộc sống hoàn toàn mới. Hàng loạt tùy chọn tùy chỉnh mới giúp đế chế của bạn tràn vào sân khấu ngân hà của Stellaris như một cơn sóng dữ, đi kèm với các chân dung loài, mẫu phi thuyền, nguồn gốc mới và nhiều nội dung khác."
 DLC_AQUATICS_RECOMMENDATION_COSMETICS: "Chúng tôi khuyên bạn nên mua Aquatics, vì chúng tôi nhận thấy bạn rất thích các bản bổ sung về mặt thẩm mỹ."
 DLC_AQUATICS_RECOMMENDATION_MOL: "Chúng tôi khuyên bạn nên mua Aquatics, vì chúng tôi nhận thấy bạn đặc biệt thích ngoại hình giống loài cá."
 DLC_AQUATICS_RECOMMENDATION_OCEAN: "Chúng tôi khuyên bạn nên mua Aquatics, vì nó mở ra những khả năng mới mẻ để định cư trên các hành tinh đại dương."
 vo_aquatics_voice: "Thủy sinh"
 trait_aquatic: "Thủy sinh"
 trait_aquatic_desc: "§LLoài này thích nghi hoàn hảo với cuộc sống dưới đáy biển sâu. Tuy nhiên, trên đất liền khô cằn, chúng chẳng khác nào cá mắc cạn.§!"
 trait_aquatic_tooltip: "Sử dụng nhà ở trên hành tinh §YĐại dương§! và §YTrạm cư trú ngập nước§!: §G-10%§!\n   —Sản lượng của $worker_and_simple_drone_cat_bonus_workforce_mult$ trên hành tinh §YĐại dương§!: §G+10%§!\n   —Sử dụng nhà ở trên các hành tinh không §YẨm ướt§!: §R+30%§!\n   —Độ phù hợp của hành tinh không §YẨm ướt§!: §R-20%§!\n\nĐặc quyền thăng thiên §H$ap_hydrocentric$§! sẽ cường hóa hiệu ứng của đặc điểm này."
 trait_robot_aquatic: "Chống nước"
 trait_robot_aquatic_desc: "§LNhững cỗ máy này ban đầu được thiết kế để khám phá biển sâu, nên hoạt động trên đất liền khô cằn sẽ bị hạn chế nghiêm trọng.§!\n\n§R Cần§! hành tinh mẹ là §YHành tinh Đại dương§!."
 trait_robot_aquatic_tooltip: "$trait_aquatic_tooltip$"
 trait_aquatic_remove_evolutionary_mastery: "§RCần truyền thống §Y$tr_genetics_resequencing$§! để xóa bỏ.§!"
 trait_aquatic_remove_hydrocentric: "§RKhông thể xóa bỏ đặc điểm §Y$trait_aquatic$§! sau khi đã chọn đặc quyền thăng thiên §Y$ap_hydrocentric$§!.§!"
 leader_trait_aquatic_admiral: "Thủy sinh"
 leader_trait_aquatic_admiral_desc: "Phi thuyền cần được thiết kế lại để chỉ huy này có cảm giác như ở nhà, và điều này vô tình làm cho vỏ tàu của hạm đội trở nên cứng cáp và bền bỉ hơn."
 origin_here_be_dragons: "Nơi Rồng ngự trị"
 origin_here_be_dragons_desc: "Từ thuở hồng hoang, nền văn minh này đã chia sẻ chung một hệ sao với một con rồng hùng mạnh. Hành vi của sinh vật bí ẩn này luôn dao động giữa sự nhân từ lạnh nhạt và sự thờ ơ kiêu ngạo. Khi cư dân trên hành tinh vươn ra biển sao, mối quan hệ này sẽ tiến triển ra sao vẫn còn là một ẩn số."
 civic_tooltip_aquatics_effects: "—$HOME_SYSTEM$ có một §IRồng không gian§! trú ngụ để bảo vệ, nhưng sẽ nổi cơn thịnh nộ nếu bị chọc giận"
 START_SCREEN_HERE_BE_DRAGONS: "Chúng tôi luôn biết về con rồng này. Từ thời xa xưa, nó đã tô điểm cho bầu trời [GetHomeWorldName], và những tương tác đầu tiên của chúng tôi với nó nằm rải rác trong các câu chuyện dân gian khắp vùng [GetSpeciesAdj]. Trong một thời gian dài, đó là câu chuyện về những cuộc xung đột, vì các loại vũ khí sơ khai của chúng tôi chứng tỏ không thể sánh bằng con thú dũng mãnh này —— nhưng những câu chuyện sau đó kể về một người có tầm nhìn xa trông rộng, đã vượt qua mọi sự phản đối để thiết lập hòa bình giữa [GetSpeciesName] và rồng.\n\nTrong những lần chạm trán sau đó, rồng tỏ ra là một hình tượng tách biệt và bí ẩn, tấm gương của nó đã từng truyền cảm hứng để chúng tôi nỗ lực vươn tới những vì sao. Tuy nhiên, việc phát minh ra hệ thống động cơ đẩy nhanh và khám phá mạng lưới siêu không gian đã mang lại một thời kỳ quan hệ mới đầy bất an với con rồng, bởi vì chúng tôi ngày càng xâm phạm nhiều hơn vào khu vực mà nó đã đơn độc lang thang suốt hàng tỷ năm qua.\n\nChúng tôi phải tự định đoạt tương lai của mình: $START_SCREEN_HERE_BE_DRAGONS_END$"
 START_SCREEN_HERE_BE_DRAGONS_HIVE: "Chúng tôi luôn biết về con rồng này. Từ thời xa xưa, nó đã tô điểm cho bầu trời [GetHomeWorldName], và những tương tác đầu tiên của chúng tôi với nó nằm rải rác ở những góc tối trong ý thức chung của chúng tôi. Trong những cuộc xung đột ban đầu, con thú dũng mãnh chiếm ưu thế, và vũ khí của chúng tôi tỏ ra vô dụng —— nhưng cuối cùng chúng tôi cũng có thể sống hòa bình với nó, và từ đó chúng tôi chung sống trong sự bất an.\n\nMặc dù vẫn là một hình tượng bí ẩn, nhưng tấm gương của con rồng luôn thôi thúc chúng tôi đạt được những thành tựu lớn lao hơn, cuối cùng dẫn đến việc phát minh ra hệ thống động cơ có thể đưa chúng tôi vào lãnh địa của nó. Giờ đây, khi chúng tôi ngày càng xâm phạm vào khu vực mà nó đã đơn độc lang thang suốt hàng tỷ năm qua, mối quan hệ giữa chúng tôi và rồng bước vào một giai đoạn đầy bất an.\n\nChúng tôi phải tự định đoạt tương lai của mình: $START_SCREEN_HERE_BE_DRAGONS_END$"
 START_SCREEN_HERE_BE_DRAGONS_MACHINE: "Theo hồ sơ từ những người tạo ra chúng tôi, con rồng này đã luôn bay lượn trên bầu trời [GetHomeWorldName] —— thỉnh thoảng nó cũng đáp xuống mặt đất, và họ thường xuyên giao chiến với rồng trong những thời kỳ đầu. Ở giai đoạn sau của lịch sử, họ cùng tồn tại trong sự bất an, và khi sinh vật này bắt đầu né tránh đồng loại của họ, các cuộc chiến cũng thưa dần.\n\nMặc dù đối với họ, nó vẫn là một hình tượng bí ẩn, nhưng tấm gương của con rồng đã truyền cảm hứng để những người tạo ra chúng tôi đạt được những thành tựu lớn lao hơn, cuối cùng dẫn đến việc phát minh ra hệ thống động cơ có thể đưa họ vào lãnh địa của nó.\n\nGiờ đây thời đại của họ đã qua, và đến lượt chúng tôi tiếp quản hành tinh này, vì vậy tương lai của chúng tôi sẽ do chúng tôi tự định đoạt: $START_SCREEN_HERE_BE_DRAGONS_END$"
 START_SCREEN_HERE_BE_DRAGONS_END: "Chúng tôi sẽ nghiên cứu rồng và có lẽ cuối cùng sẽ học được cách giao tiếp với nó chăng? Hay chúng tôi sẽ rơi vào xung đột, vì phạm vi của một hệ sao duy nhất là quá nhỏ để chia sẻ với một sinh vật hùng mạnh như vậy?"
 aquatics.105.name: "Rồng không gian ngã xuống"
 aquatics.105.desc.origin_start: "Chúng ta đã giết được Rồng không gian! Cùng với cơn rùng mình cuối cùng và tiếng gầm thét đáng sợ, chút sinh lực còn lại của con thú này đã hoàn toàn cạn kiệt. Cái xác của nó vẫn còn nguyên vẹn —— nhưng sẽ không kéo dài lâu đâu, vì các [This.GetScientistPlural] của chúng ta đang nhốn nháo đòi lấy nó về làm thí nghiệm."
 aquatics.105.desc.origin_normal_middle: "Trên [dragon_planet.GetName], bầu không khí đan xen giữa vui mừng và tiếc nuối. Mặc dù nhiều người hân hoan vì đã đánh bại được con quái vật đáng sợ này, nhưng sự tồn tại bền bỉ của con rồng khổng lồ cũng đã để lại dấu ấn sâu đậm trong tâm trí của người [This.GetAdj]."
 aquatics.105.desc.origin_normal: "$aquatics.105.desc.origin_start$\n\n$aquatics.105.desc.origin_normal_middle$ Ở một khía cạnh nào đó, giết nó cũng giống như tự tay giết chết vị thần của chính mình vậy.\n\nGiờ đây, [This.GetSpeciesNamePlural] có thể mong đợi vào một tương lai, nơi mà bằng năng lực của mình, chúng ta có thể vươn tới mọi mục tiêu mà không còn phải e sợ bất kỳ thế lực siêu nhiên nào."
 aquatics.105.desc.origin_materialist: "$aquatics.105.desc.origin_start$\n\n$aquatics.105.desc.origin_normal_middle$ Mặc dù từ lâu chúng ta đã từ bỏ việc tôn thờ những vị thần giả mạo, nhưng hành động này mang ý nghĩa tượng trưng cho việc xua đuổi hoàn toàn sự mê tín. Giờ đây, [This.GetSpeciesNamePlural] có thể mong đợi vào một tương lai, nơi mà bằng năng lực của mình, chúng ta có thể vươn tới mọi mục tiêu mà không còn phải e sợ bất kỳ thế lực siêu nhiên nào."
 aquatics.105.desc.origin_hive: "$aquatics.105.desc.origin_start$\n\nMặc dù ý thức chung của chúng ta đã cân nhắc kỹ lưỡng hành động này, nhưng chúng ta vẫn có những cảm xúc lẫn lộn. Một mặt, chúng ta cảm thấy mãn nguyện vì đã chinh phục được mối đe dọa chết chóc. Mặt khác, con rồng khổng lồ tồn tại từ lâu này đã trở nên... khá quen thuộc với chúng ta. Dù chúng ta không giống như những nền văn minh vũ trụ khác, dành quá nhiều thời gian để ám ảnh về những mất mát mang tính 'siêu nhiên', nhưng ở một khía cạnh nào đó, chúng ta vẫn coi hành động này giống như tự tay giết chết vị thần của chính mình vậy. Giờ đây, chúng ta có thể mong chờ một tương lai không gì là không thể, dù khó khăn đến đâu cũng không thể cản bước chúng ta."
 aquatics.105.desc.origin_machine: "$aquatics.105.desc.origin_start$\n\nMặc dù các bộ xử lý của chúng ta đã được hiệu chỉnh lại để đánh giá hệ quả của chiến công này, chúng ta vẫn ngạc nhiên nhận ra cần phải tái cấu trúc một lượng dữ liệu đáng kể. Sự tồn tại của con rồng đã ảnh hưởng rất lớn đến việc lập trình của chúng ta, với hàng tỷ biện pháp sửa lỗi được thiết lập để bù đắp cho sự khó đoán trong hành động của nó, và sẽ cần chút thời gian để dọn dẹp sạch sẽ. Mặt khác, khi mối đe dọa to lớn này bị xóa bỏ, giờ đây chúng ta có thể hướng tới một tương lai mà không có khó khăn nào có thể cản bước."
 aquatics.105.desc.others: "Chúng ta đã tiêu diệt thành công con rồng canh giữ hệ sao [dragon_system.GetName]! Dù đó là một trận chiến cam go, nhưng nó chứng minh được hạm đội của chúng ta rất hùng mạnh. Giờ đây, cư dân trên [dragon_planet.GetName] sẽ phải tự mình đối mặt với kẻ thù, con rồng khổng lồ từng được coi là bất khả xâm phạm và giúp họ núp bóng an toàn nay đã không còn nữa.\n\nCó vẻ như phần xác của con rồng là một kho báu thực thụ trong mắt các [This.GetScientistPlural] của chúng ta, họ tin rằng mình có thể tìm ra phương pháp tổng hợp nhân tạo để sản xuất vảy rồng."
 aquatics.105.A: "Hãy xem thi thể của nó còn che giấu bí mật gì nữa."
 aquatics.105.A.tooltip: "Mở khóa đặc điểm §Y$trait_drake_scaled$§! dùng cho §YBiến đổi gen Thần thú không gian§!."
 aquatics.110.name: "Rồng không gian bị giết"
 aquatics.110.desc: "[From.GetName] đã giết chết Rồng không gian! Sự thật đáng sợ này khiến cho [dragon_planet.GetName] giờ đây rất dễ bị tấn công."
 aquatics.110.A: "Ồ..."
 aquatics.115.name: "Rồng không gian đã sống lại"
 aquatics.115.desc.regular: "Nói lời giữ lời, các Thuật sĩ gọi hồn của chúng ta đã hồi sinh thành công Rồng không gian ở hệ sao [dragon_system.GetName]! Dù kết quả có đôi chút khác biệt —— đúng như dự đoán của một số người khi đưa một thứ từ cõi chết trở về —— hiện tại nó đang nóng lòng chờ lệnh từ chúng ta."
 aquatics.115.desc.hive: "Kiểm soát §YRồng không gian§! là kế hoạch từ lâu của chúng ta. Để đạt được mục tiêu này, các cá thể thợ của chúng ta đã tiến hóa đặc biệt. Dù vẫn cần thích nghi với con đường lây nhiễm, nhưng chúng ta đã trở thành Rồng không gian, và nó cũng trở thành chúng ta. Tổ đàn đã tích hợp kiến thức và kinh nghiệm của nó, chúng ta đã chuẩn bị sẵn sàng để đối mặt với đồng loại của nó."
 aquatics.115.desc.machine: "Sinh vật được gọi là §YRồng không gian§! đã được tối ưu hóa bằng giao thức gọi hồn máy móc. Hơi thở băng giá của nó giờ đã xuống tới mức 1 Kelvin. Con rồng hồi sinh hiện đang nằm dưới sự kiểm soát của chúng ta."
 aquatics.115.A: "Kẻ thù của chúng ta chắc chắn sẽ bị đóng băng!"
 REANIMATE_ORIGIN_DRAGON: "Hồi sinh Rồng không gian"
 REANIMATE_ORIGIN_DRAGON_DESC: "Mặc dù con rồng ở hệ sao [dragon_system.GetName] đã bị hạ gục, nhưng các [Owner.GetNecromancersLower] đảm bảo với chúng ta rằng tình trạng này sẽ không kéo dài. Họ hứa sẽ sớm hồi sinh nó —— và biến nó thành bề tôi trung thành của chúng ta —— rất nhanh thôi."
 slew_origin_dragon: "Kẻ đồ long thuở sơ khai"
 slew_origin_dragon_desc: "Từ xa xưa, con rồng hùng mạnh đã dạo chơi trong hệ sao mẹ của chúng ta... Điều này đã đến lúc phải chấm dứt! Chúng ta đã giải phóng bản thân khỏi mối đe dọa này, không gì có thể ngăn cản chúng ta bước tới tương lai."
 aquatics.120.name: "Đã đến lúc"
 aquatics.120.diplo_name: "Kết nối đường truyền tiếng Rồng"
 aquatics.120.desc: "Thời gian thoi đưa, ta cũng từng nghi ngờ. Từ lúc các ngươi còn là những sinh vật nhỏ bé, ta đã luôn dõi theo: khi các ngươi vấp ngã liên tục, ta cũng tuyệt vọng, và khi các ngươi liên tiếp thành công, ta gầm lên vì sung sướng. Giờ đây, ta thấy các ngươi đã trưởng thành, nền văn minh của các ngươi đã chín muồi, sẵn sàng gánh vác trách nhiệm cao cả của việc làm cha làm mẹ. Đã đến lúc các ngươi phải cống hiến hết mình để giúp ta nuôi dưỡng bầy con của ta."
 aquatics.120.dialog.1: "Khoan, ngươi nói cái gì cơ?"
 aquatics.120.dialog.1.response: "Thành thật mà nói, ta đã chờ đợi ngày này từ rất lâu rồi. Thậm chí lâu hơn các ngươi có thể tưởng tượng. Lúc rời khỏi quê nhà, ta cũng chỉ là một đứa trẻ. Ta đã du hành rất xa, rất rộng lớn để tìm kiếm một hành tinh, một hành tinh có thể sinh ra một nền văn minh sẽ giúp ta nuôi nấng con cái sau này. Và rồi ta cứ chờ đợi..."
 aquatics.120.dialog.2: "Đây là kế hoạch của ngươi từ trước đến nay sao?"
 aquatics.120.dialog.2.response: "Đúng vậy. Đây là truyền thống của loài ta. Ở hệ sao được coi là quê hương, có rất nhiều đồng loại của ta, mỗi con rồng đều đi tìm một nền văn minh mới trỗi dậy để giúp chúng nuôi nấng bầy con. Nhưng theo những gì ta biết, ta là kẻ đầu tiên đi xa đến thế này."
 aquatics.120.dialog.3: "Thế chúng ta sẽ được trả công bằng gì?"
 aquatics.120.dialog.3.response: "Một con rồng trưởng thành toàn diện là một sức mạnh khủng khiếp đấy! Nếu các ngươi đồng ý, ta đảm bảo ta và con cháu của ta sẽ trung thành với mục tiêu của các ngươi, hỗ trợ các ngươi trong chiến đấu."
 aquatics.120.dialog.4: "Vậy nếu ta từ chối thì sao?"
 aquatics.120.dialog.4.response: "Thế thì các ngươi hãy tự quyết định tương lai của mình, còn ta sẽ rời đi. Ta đã đợi rất lâu rồi, chờ thêm chút nữa cũng chẳng sao."
 aquatics.120.A: "Chúng tôi rất vinh hạnh chấp nhận yêu cầu của ngươi."
 aquatics.120.A.response: "Tuyệt quá! Ta biết là các ngươi sẽ đồng ý mà. Các ngươi chắc chắn sẽ không hối hận đâu!"
 aquatics.120.A.tooltip: "Chúng ta có thể xây dựng §YTrạm ấp rồng§! ở các Căn cứ sao, qua đó có thể thu nhận tối đa 10 §Y$space_dragon_origin_baby_plural$§!."
 aquatics.120.B: "Cảm ơn lời đề nghị của ngươi, nhưng chúng tôi buộc lòng phải từ chối."
 aquatics.120.B.response: "§SChậc§!. Có lẽ các ngươi chưa học được nhiều như ta tưởng. Vậy thì vĩnh biệt!"
 aquatics.120.B.tooltip: "Rồng không gian sẽ rời đi và không bao giờ quay lại nữa."
 aquatics.150.name: "Con rồng đói khát"
 aquatics.150.desc: "Các [This.Owner.GetResearchers] của chúng ta đã quan sát Rồng không gian và báo cáo rằng dạ dày của nó dường như đang phát ra những tiếng kêu ùng ục rất lớn. Trong vài tháng qua, nó cũng bay quanh [Root.GetName] với tần suất dày đặc bất thường, đôi khi lao sầm xuống giới hạn trên của tầng khí quyển rồi lại bay đi. Giả thuyết của chúng ta là sinh vật này đang đói và muốn hạ cánh để kiếm ăn, giống như nó vẫn thường làm trong quá khứ. Không rõ tại sao nó lại do dự —— có lẽ vì chúng ta đã gia nhập vào đại gia đình các vì sao, nên nó muốn xem phản ứng của chúng ta ra sao."
 aquatics.150.A: "Lần tới khi nó đến gần, hãy bắn một phát đạn cảnh cáo quanh nó."
 aquatics.150.A.tooltip: "§RCon rồng có thể sẽ không vui.§!"
 aquatics.150.B: "Dành ra một khu vực hẻo lánh cho nó."
 aquatics.150.B.tooltip: "§RCon rồng có thể sẽ ngấu nghiến một lượng lớn thức ăn sau khi đáp xuống hành tinh!§!"
 aquatics.150.C: "Tiếp tục quan sát nó."
 aquatics.155.name: "Cái chết từ trên trời rơi xuống"
 aquatics.155.desc.normal: "Con rồng không hề nể nang thái độ thù địch của chúng ta. Kèm theo một tiếng gầm đinh tai nhức óc —— sức mạnh đủ để gây ra một trận động đất thứ cấp trải dài nửa hành tinh —— con rồng khổng lồ trút hơi thở băng giá của nó xuống một khu dân cư đông đúc trên [Root.GetName]."
 aquatics.155.desc.gestalt: "Con rồng không hề nể nang thái độ thù địch của chúng ta. Kèm theo một tiếng gầm đinh tai nhức óc —— sức mạnh đủ để gây ra một trận động đất thứ cấp trải dài nửa hành tinh —— con rồng khổng lồ trút hơi thở băng giá của nó xuống [Root.GetName], phá hủy nhiều cơ sở sản xuất quan trọng và giết chết một lượng lớn cá thể."
 aquatics.160.name: "Rồng đã hạ cánh"
 aquatics.160.desc: "Con rồng dường như đã hiểu ý định của chúng ta, nó sà xuống đầy duyên dáng và nghỉ ngơi tại khu vực chúng ta đã dọn sẵn. Số lượng thức ăn khổng lồ mà chúng ta để lại hẳn đã giúp ích, phải nói rằng —— con rồng nằm dài ở đó và ngấu nghiến một cách cực kỳ tham lam.\n\nCác [This.Owner.GetResearchers] của chúng ta đang quan sát nó từ đằng xa."
 aquatics.160.A: "Tiếp tục quan sát, tiếp tục chờ đợi."
 aquatics.165.name: "$aquatics.160.name$"
 aquatics.165.desc.normal: "Sau vài vòng bay qua lại trên hành tinh, con rồng này có vẻ nghĩ rằng đã an toàn để đáp xuống. Mặc dù nó chọn một khu vực hẻo lánh, nhưng vẫn có vài [Root.Owner.GetSpeciesNamePlural] bị giết, và nhiều người khác phải bỏ xứ mà đi —— với kích thước khổng lồ và dạ dày không đáy của nó, điều này cũng chẳng có gì lạ.\n\nGiờ đây nó đã an tọa, càn quét hệ động thực vật địa phương với tốc độ kinh hồn. Cư dân quanh vùng đang phải giữ khoảng cách với nó."
 aquatics.165.desc.gestalt: "Sau vài vòng bay qua lại trên hành tinh, con rồng này có vẻ nghĩ rằng đã an toàn để đáp xuống. Mặc dù nó chọn một khu vực hẻo lánh, nhưng vẫn có vài cá thể bị tiêu diệt, và nhiều cá thể khác phải dời đi —— với kích thước khổng lồ và dạ dày không đáy của nó, điều này cũng chẳng có gì lạ.\n\nGiờ đây nó đã an tọa, càn quét hệ động thực vật địa phương với tốc độ kinh hồn. Cư dân quanh vùng đang phải giữ khoảng cách với nó."
 aquatics.170.name: "Cất cánh"
 aquatics.170.desc: "Sau nhiều năm đánh chén no nê nguồn sản vật phong phú của [Root.GetName], Rồng không gian giờ đây trông cường tráng hơn hẳn và bắt đầu cất cánh một lần nữa. Với tiếng gầm chào tạm biệt cuối cùng, nó bay vút lên không trung —— bỏ lại vô số vảy rồng, da chết và các phụ phẩm khác phát sinh trong quá trình lưu trú của nó."
 aquatics.170.A: "Chúng ta nên nghiên cứu những tàn dư này."
 aquatics.170.B: "Đem đống này đốt làm nhiên liệu đi."
 aquatics.170.tooltip: "Con rồng này giờ lại quay về dạo chơi trong hệ sao §Y[here_be_dragons_planet.System.GetName]§! một lần nữa."
 aquatics.180.name: "Rồng hộ mệnh"
 aquatics.180.desc: "Hạm đội của chúng ta ở hệ sao [From.GetName] báo cáo rằng con rồng lượn lờ quanh hệ sao đó đang tấn công phi thuyền của chúng ta! Hiện chưa rõ là nó chủ động tham gia vào cuộc chiến phòng thủ của người [From.Owner.GetAdj], hay chỉ đơn giản là tức giận vì chúng ta xâm phạm lãnh thổ của nó. Chắc chắn một điều là nếu định chiếm giữ [here_be_dragons_planet.GetName], chúng ta bắt buộc phải đánh bại nó!"
 aquatics.185.name: "Tiếng rồng gầm"
 aquatics.185.desc: "Rồng không gian dường như không muốn khoanh tay đứng nhìn [From.GetAdj] tiến hành xâm lược [here_be_dragons_planet.GetName]. Nó gầm thét bay lên, phun ra ngọn lửa băng giá và hủy diệt hạm đội địch!"
 aquatics.185.desc.landed: "Rồng không gian dường như không muốn khoanh tay đứng nhìn [From.GetAdj] tiến hành xâm lược [here_be_dragons_planet.GetName]. Nó ngừng bữa ăn trên hành tinh, vút bay lên không trung và phun ra ngọn lửa băng giá hủy diệt hạm đội địch!"
 aquatics.185.A: "Cùng tán tụng Rồng không gian!"
 aquatics.185.B: "Khá lắm, bớt đi một mối đe dọa phải xử lý."
 aquatics.190.name: "Khảo sát vảy rồng"
 aquatics.190.desc: "Giờ đây khi chúng ta đã có một số tiến bộ trong việc thấu hiểu sinh học dị hình và các vật liệu ngoài hành tinh, các nhà nghiên cứu đã đề xuất phái một tàu khoa học đi quan sát rồng kỹ hơn. Họ đặc biệt thích thú với lớp vảy rồng vốn vô cùng cứng cáp —— thậm chí không thể xuyên thủng. Mặc dù đã thu thập được một lượng lớn mẫu vật tự rụng, các nhà khoa học của chúng ta vẫn bối rối không hiểu vảy rồng được hình thành như thế nào. Nếu sử dụng loại máy dò được gọi là “thâm nhập vi mô”, các nhà khoa học tin rằng họ có thể luồn xuống dưới lớp bảo vệ của nó, trực tiếp nghiên cứu quá trình tự nhiên của vảy rồng.\n\nĐương nhiên con rồng sẽ không để bụng đâu... đương nhiên là vậy rồi."
 aquatics.190.desc.gestalt: "Giờ đây khi chúng ta đã có một số tiến bộ trong việc thấu hiểu sinh học dị hình và các vật liệu ngoài hành tinh, chúng ta có thể cân nhắc phái một tàu khoa học đi quan sát rồng kỹ hơn. Vảy rồng đặc biệt thu hút sự chú ý, chúng vô cùng cứng cáp —— thậm chí không thể xuyên thủng. Mặc dù đã thu thập được một lượng lớn mẫu vật tự rụng, các cá thể khoa học của chúng ta vẫn bối rối không hiểu vảy rồng được hình thành ra sao. Nếu có thể triển khai loại máy dò đủ sâu, chúng ta có lẽ sẽ luồn được xuống dưới lớp bảo vệ của nó, trực tiếp nghiên cứu quá trình tự nhiên của vảy rồng.\n\nĐương nhiên con rồng sẽ không để bụng đâu... đương nhiên là vậy rồi."
 aquatics.190.A: "Cứ làm đi."
 aquatics.190.B: "Hãy thử những phương pháp khác bớt chọc ngoáy hơn đi."
 DRAGON_REMOTE_SCANS: "Quét từ xa con rồng"
 DRAGON_REMOTE_SCANS_DESC: "Tàu khoa học của chúng ta sẽ quét con rồng ở một khoảng cách an toàn, nhằm giải mã những bí ẩn về hình thái sự sống độc đáo của nó."
 aquatics.195.name: "Đã hoàn thành quét từ xa"
 aquatics.195.desc: "Mặc dù con rồng cứ chằm chằm nhìn tàu khoa học của chúng ta, nhưng khi chúng ta tiến hành nhiều lần quét sâu, nó không hề có phản ứng gì —— với trình độ công nghệ hiện tại, đây là những lần quét triệt để nhất mà chúng ta có thể thực hiện. Các bản quét này đã mang lại cho chúng ta những cái nhìn mới mẻ về quá trình sinh học của rồng, nhưng bí ẩn ẩn giấu dưới lớp vảy của nó thì vẫn mờ mịt y như trước.\n\nDù các [This.Owner.GetResearchers] buộc phải thừa nhận thất bại về vụ này, nhưng họ đảm bảo rằng vẫn có thể sử dụng tốt những kiến thức vừa thu thập được."
 DRAGON_MATERIAL_STUDY: "Lấy mẫu vật của rồng"
 DRAGON_MATERIAL_STUDY_DESC: "Tàu khoa học của chúng ta sẽ táo bạo phóng đi một thiết bị thăm dò, cấy sâu vào bên dưới lớp vảy rồng để vén màn bí ẩn về hình thái sống độc đáo của nó."
 aquatics.200.name: "Tàu khoa học bị nuốt chửng"
 aquatics.200.desc: "Có vẻ con rồng đang đói. Hoặc cũng có thể hôm nay tâm trạng nó không tốt. Khi phi thuyền của chúng ta tới gần, con rồng nhe nanh gầm gừ, vội vàng lao tới §Rnhai nhóp nhép§! mà không chừa lại chút thời gian nào để cơ động né tránh. Tàu khoa học của chúng ta giờ chẳng còn sót lại bao nhiêu mảnh vỡ —— ít nhất là những phần nằm ngoài bụng rồng."
 aquatics.200.A: "Tốt nhất đừng có chọc giận nó thêm nữa."
 aquatics.200.B: "Cho ăn xong chắc giờ nó hết đói rồi đấy. Chúng ta thử lại lần nữa xem."
 aquatics.205.name: "Tàu khoa học bị xua đuổi"
 aquatics.205.desc: "Con rồng để cho tàu khoa học của chúng ta tới gần, nhưng khi máy dò được phóng ra, nó dùng đuôi §Hđập mạnh§! vào phi thuyền với một sức mạnh phi thường. Đáng ngạc nhiên là dù phi thuyền bị hất văng qua nửa hệ sao, nó vẫn gần như nguyên vẹn, và trên tàu cũng không ghi nhận thương vong nào. Dù sao thì, con rồng rõ ràng là rất không vui."
 aquatics.205.A: "$aquatics.200.A$"
 aquatics.205.B: "Thú vị đấy. Chúng ta nên xem thử điều gì sẽ xảy ra nếu làm lại lần nữa."
 aquatics.210.name: "Cơn thịnh nộ của rồng"
 aquatics.210.desc.normal: "Ngay khi tàu của chúng ta tiếp cận rồng lần thứ hai, nó lồng lộn lên, phun ra tia sáng lạnh lẽo từ mũi, phóng thẳng như một con thoi hướng tới [dragon_colony.GetName]! Hệ thống phòng thủ còn chưa kịp kích hoạt, nó đã giận dữ trút hơi thở băng giá xuống bán cầu bắc của hành tinh này, tiêu diệt nhiều trung tâm dân cư lớn trong chớp mắt."
 aquatics.210.desc.gestalt: "Ngay khi hạm đội của chúng ta tiếp cận rồng lần thứ hai, nó lồng lộn lên, phun ra tia sáng lạnh lẽo từ mũi, phóng thẳng như một con thoi hướng tới [dragon_colony.GetName]! Hệ thống phòng thủ còn chưa kịp kích hoạt, nó đã giận dữ trút hơi thở băng giá xuống bán cầu bắc của hành tinh này, tiêu hủy vô số cơ sở sản xuất chủ chốt trong chớp mắt."
 aquatics.210.A: "Chúng ta tạm thời nhượng bộ."
 aquatics.215.name: "Nghiên cứu rồng thành công"
 aquatics.215.desc: "Khi máy dò bám chặt vào rồng, tìm thấy một khe hở nhỏ hẹp giữa các vảy và khéo léo chui tọt vào trong, con rồng gầm lên đầy phẫn nộ. Trong khi [Root.GetName] đang chuẩn bị bước vào không gian siêu tốc để né tránh cơn thịnh nộ của rồng, máy dò đã bắt đầu thu thập được những dữ liệu kinh ngạc. Từ những dữ liệu này, chúng ta phát hiện ra lý do tại sao vảy của nó lại chắc chắn đến vậy, đó là nhờ một chuỗi phản ứng enzyme phức tạp được kích hoạt trong quá trình nó bay vào bầu khí quyển của [dragon_colony.GetName] với tốc độ cao.\n\nMặc dù vẫn còn nhiều câu hỏi chưa được giải đáp, các [This.Owner.GetResearchers] của chúng ta đã hiểu rõ một điều: do sự phức tạp trong sinh lý học của con rồng, nếu muốn sở hữu loại vật liệu làm vảy này, cách duy nhất là phải giết nó. Dù sao thì họ cũng cam đoan rằng những kiến thức có được sẽ hữu ích theo bất kỳ cách nào."
 first_contact_dragon: "Giao tiếp với rồng"
 aquatic_events.250.name: "$first_contact_dragon$"
 aquatic_events.250.desc: "Dựa trên những kinh nghiệm thành công trong việc thiết lập giao tiếp với nhiều loài ngoại lai, một trong những [This.Owner.GetLinguists] của chúng ta đã đề xuất một hành động táo bạo. Mặc dù tất cả các nỗ lực nhằm trao đổi với Rồng không gian trước đây đều gặp thất bại cay đắng, [needed_name.GetSheHe] khẳng định rằng hiện tại là cơ hội tốt để thử thêm lần nữa.\n\nTheo như phần lịch sử xa xưa nhất của chúng ta, người [This.Owner.Species.GetName] đã từng thiết lập một giao ước huyền thoại với con rồng, và chính giao ước đó đã chấm dứt những xung đột trực diện. Căn cứ vào điều này, có lẽ chúng ta có thể đạt được một mức độ thấu hiểu lẫn nhau nào đó. [needed_name.GetSheHe] chỉ ra rằng những thành công trong việc giao tiếp với các dạng sống ngoài hành tinh trước đây đã giúp chúng ta có đủ năng lực để hiểu được con rồng khổng lồ này hơn bao giờ hết."
 aquatic_events.250.desc.hive: "Sau khi thiết lập giao tiếp thành công với nhiều giống loài ngoại lai, bộ xử lý ngôn ngữ của chúng ta kết luận rằng, đã đến lúc chúng ta thử thiết lập lại cuộc đối thoại với Rồng không gian. Mặc dù những nỗ lực gần đây đều gặp thất bại cay đắng, chúng ta vẫn mang máng nhớ lại những mảnh vỡ quá khứ, khi mà chúng ta đã từng ký kết hòa bình với con rồng này sau những cuộc xung đột cổ đại.\n\nGiờ đây, khi đã dày dặn kinh nghiệm trong việc đối phó với những dạng sống có hình thể hoàn toàn khác biệt, chúng ta đã được chuẩn bị đầy đủ hơn bao giờ hết để thấu hiểu rồng."
 aquatic_events.250.desc.machine: "Sau khi thiết lập giao tiếp thành công với nhiều giống loài ngoại lai, các chu trình con chuyên về ngôn ngữ của chúng ta đã đạt được một sự đồng thuận mới: đã đến lúc chúng ta thử thiết lập lại cuộc đối thoại với Rồng không gian. Mặc dù mọi phương pháp nỗ lực có ý nghĩa gần đây đều thất bại, nhưng hồ sơ do những người tạo ra chúng ta để lại cho thấy việc đạt được sự thấu hiểu ở một mức độ nào đó là hoàn toàn có thể. Rốt cuộc thì khi xưa họ chắc hẳn đã từng chiến đấu rồi sau đó đình chiến với con rồng, dẫu rằng lý do là gì thì chúng ta không được rõ.\n\nGiờ đây, khi đã dày dặn kinh nghiệm trong việc đối phó với những dạng sống có hình thể hoàn toàn khác biệt, chúng ta đã được chuẩn bị đầy đủ hơn bao giờ hết để thấu hiểu rồng."
 start_dragon_communications_study: "Các [This.Owner.GetEnvoyPlural] của chúng ta sẽ cố gắng giao tiếp với rồng."
 aquatics.255.name: "Một khởi đầu cẩn trọng"
 aquatics.255.desc: "Sau khi các [This.Owner.GetResearchers] và [This.Owner.GetLinguists] của chúng ta sàng lọc mọi ghi chép được biết đến về việc tương tác với rồng, họ đã sẵn sàng thực hiện một vài thí nghiệm để kiểm tra phản ứng của nó. Họ cam kết mọi hành động đều đã được xem xét cẩn thận, và một khi rồng tỏ ra bất mãn dù chỉ là một chút, mọi hoạt động sẽ bị đình chỉ ngay lập tức."
 aquatics.260.name: "Tiến độ chậm chạp"
 aquatics.260.desc: "Các [This.Owner.GetLinguists] của chúng ta vẫn đang vật lộn với bài toán hóc búa về tiếng gầm của loài rồng. Bất chấp sự kỳ vọng về một bước đột phá ngay tức khắc trong lòng họ, việc tìm kiếm một hệ quy chiếu chung để đối chiếu giữa chúng ta và một con rồng không gian khổng lồ có lẽ mang trong mình những khó khăn vô cùng tận, khiến cho chướng ngại này càng trở nên khó vượt qua.\n\nĐiều này có thể tạo ra bầu không khí chán nản, mặc dù nó không xuất phát từ hành vi của bản thân con rồng: nó đã thể hiện một sự kiên nhẫn đáng ngạc nhiên trước việc tàu khoa học của chúng ta xâm nhập vào lãnh địa của nó. Dựa trên nhịp điệu sinh ra từ chuyển động cổ họng của nó, nó liên tục tạo ra cùng một chuỗi rung động thanh môn —— tiếng rống hoặc tiếng kêu, và rõ ràng không phải là hú vào không gian chân không —— như thể nó biết chúng ta đang làm gì và mong muốn được giúp đỡ."
 aquatics.260.A: "Quả thực là quá sức bí ẩn."
 aquatics.265.name: "Sự thật về tiếng gầm"
 aquatics.265.desc.normal: "Các [This.Owner.GetLinguists] của chúng ta báo cáo một bước đột phá đáng kinh ngạc. Đúng lúc họ đang tuyệt vọng tưởng chừng không bao giờ có thể hiểu được rồng, họ đã chuyển đổi bức xạ năng lượng cơ thể lên xuống thất thường của nó thành dạng sóng âm thanh. Ngay sau khi lắng nghe kết quả, họ dường như không thể tin vào những chiếc [This.Owner.GetSpeciesEarNamePlural] của mình nữa. Không còn nghi ngờ gì: con rồng đang nói ngôn ngữ của chúng ta, chỉ là thông qua một môi trường truyền dẫn khác. Trên thực tế, tiếng rống của nó chỉ là nhằm lôi kéo sự chú ý của chúng ta, chứ không phải đang cố gắng giao tiếp.\n\n$aquatics.265.desc.end$"
 aquatics.265.desc.gestalt: "Các [This.Owner.GetLinguists] của chúng ta báo cáo một bước đột phá đáng kinh ngạc. Đúng lúc họ đang tuyệt vọng tưởng chừng không bao giờ có thể hiểu được rồng, họ đã chuyển đổi bức xạ năng lượng cơ thể lên xuống thất thường của nó thành biểu đồ độ lệch sóng chuẩn. Kết quả cho thấy thực chất nó đang "nói" bằng những mã nhị phân đơn giản, không khác mấy so với loại chúng ta thường dùng, chỉ là khác bước sóng thôi. Trên thực tế, tiếng rống của nó chỉ là nhằm lôi kéo sự chú ý của chúng ta, chứ không phải đang cố gắng giao tiếp.\n\n$aquatics.265.desc.end$"
 aquatics.265.desc.end: "Dựa vào những kiến thức mới này, các [This.Owner.GetLinguists] của chúng ta đã phát lại các bản ghi âm cũ. Dựa theo đó, những tiếng gầm rống của con rồng trong quá khứ hóa ra là những lời phàn nàn "đầy thất vọng và mang tính trẻ con" về chất lượng thức ăn cũng như tiến độ chậm chạp của bọn "sinh vật bò lê lết trên hành tinh". Tuy nhiên, giờ đây sinh vật này đang tỏ ra cực kỳ kinh ngạc và vui sướng vì chúng ta đã có thể hiểu được nó. Quả thực, chúng ta đã bỏ lỡ những thiện ý mà nó thể hiện suốt nhiều năm qua. Rõ ràng là nó muốn trò chuyện với chúng ta, và đây là một vấn đề cực kỳ trọng đại, nhưng mọi thứ phải đợi cho đến khi chúng ta §S"đã sẵn sàng"§!."
 aquatics.265.A: "Nhưng chúng ta đã sẵn sàng rồi!"
 aquatics.270.name: "Lời trách mắng cay nghiệt"
 aquatics.270.desc: "Con rồng đã tuôn ra một tràng chửi rủa dông dài, nói về sự khôn ngoan mà nó tích lũy qua nhiều kỷ nguyên, cùng với việc nó quan sát thái độ của chúng ta đối với thời gian và sứ mệnh —— thậm chí nó còn chẳng buồn nhắc tới thứ hiểu biết nông cạn đến thảm hại của chúng ta về những nền tảng của vũ trụ. Quá rõ ràng, nó cho rằng chúng ta còn quá non nớt, quá đơn thuần, quá liều lĩnh, và hoàn toàn không xứng đáng đảm nhiệm trọng trách này ở giai đoạn hiện tại."
 aquatics.270.A: "Ái chà. Chúng ta phải cố gắng vươn lên thôi, không thể nằm ườn ra được nữa."
 aquatics.270.A.tooltip: "Khi thời cơ chín muồi, rồng sẽ tự đến tiếp cận chúng ta."
 aquatics.280.name: "Rồng nổi giận"
 aquatics.280.desc: "Chúng ta không rõ điều gì đã xảy ra, nhưng các [This.Owner.GetResearchers] có vẻ đã chọc giận rồng. Sau một tiếng gầm vang vọng cả bầu trời, sinh vật này đã dội hơi thở chết chóc lên phi thuyền của họ, giết chết [This.Owner.GetEnvoy][This.Leader.GetName] —— đồng thời gây ra một bước lùi nghiêm trọng trong nỗ lực thấu hiểu nó của chúng ta."
 draconic_communications_continues: "Chúng ta sẽ tiếp tục nỗ lực."
 fcsum_origin_dragon_1: "Chúng ta đã bắt đầu cố gắng giao tiếp với rồng, nhưng hiện tại tiến triển rất chậm."
 fcsum_origin_dragon_2: "Mặc dù rồng khá hợp tác, nhưng cách thức giao tiếp của nó vẫn khiến chúng ta mù tịt."
 fcsum_origin_dragon_3: "Chúng ta đã phá giải được bí mật trong việc giao tiếp với rồng. Có vẻ như nó có điều muốn nói với chúng ta."
 aquatics.305.name: "$aquatics.180.name$"
 aquatics.305.desc: "[This.GetName] báo cáo đã nhìn thấy một con rồng không gian đáng sợ ở hệ sao [From.GetName]!\n\nHệ sao này dường như là trung tâm của [From.Owner.GetName], một trong những hành tinh ở đó cho thấy dấu hiệu của quần thể dân cư đông đúc.\n\nCho đến hiện tại, con rồng này vẫn chưa có hành động gì đối với chúng ta, và cũng không có dấu hiệu cho thấy có xung đột với nhóm cư dân ở chung hệ sao đó. Có lẽ tốt nhất là chúng ta mặc kệ họ đi thì hơn."
 aquatics.305.desc.pre-ftl: "[This.GetName] báo cáo đã nhìn thấy một con rồng không gian đáng sợ ở hệ sao [From.GetName]! Hệ sao này cũng tình cờ là quê nhà của nền văn minh [root.GetAAnPreFTLLower][Owner.GetPreFTLLower]: một trong những hành tinh đó đã cho thấy dấu hiệu của các khu định cư.\n\nCho đến hiện tại, con rồng này vẫn chưa có hành động gì đối với chúng ta, và cũng không có dấu hiệu cho thấy có xung đột với nhóm cư dân ở chung hệ sao đó. Có lẽ tốt nhất là chúng ta mặc kệ họ đi thì hơn."
 space_dragon_origin: "Rồng không gian"
 space_dragon_origin_cap: "$space_dragon_origin$"
 space_dragon_origin_plural: "Rồng không gian"
 space_dragon_origin_baby: "Rồng con"
 space_dragon_origin_baby_cap: "$space_dragon_origin_baby$"
 space_dragon_origin_baby_plural: "Rồng con"
 requires_dragon_hatchery: "$TRIGGER_FAIL$Cần một §YTrạm ấp rồng§!"
 sm_dragon_hatchery: "Trạm ấp rồng"
 sm_dragon_hatchery_desc: "Thiết bị tiên tiến được sử dụng để nuôi nấng rồng con."
 dragon_hatchery_tooltip: "§G Có thể chiêu mộ tối đa §H10§! $space_dragon_origin_baby_plural$§!"
 d_landed_dragon: "Cho rồng khổng lồ ăn"
 d_landed_dragon_desc: "Rồng không gian uy nghiêm đã đáp xuống mặt đất, đang chuẩn bị ngấu nghiến lượng lớn thức ăn theo cách riêng của mình."
 ap_hydrocentric: "Trái tim Đại dương"
 ap_hydrocentric_desc: "Chúng ta không còn cần phải tìm kiếm những giải pháp "tàm tạm" để thay thế cho ngôi nhà đại dương của mình nữa: mọi hành tinh đều có thể trở thành điểm đến thuộc địa lý tưởng sau khi đã được bơm đầy nước."
 ap_hydrocentric_tooltip: "Có thể xây dựng §YTrạm khai thác băng§! ở Căn cứ sao, nhờ đó mở khóa quyết nghị §Y$decision_expand_planetary_sea$§! trên hành tinh §YĐại dương§!, cũng như mở khóa quyết nghị §Y$decision_flood_habitat$§! trên §YTrạm cư trú§!.\nLoài sở hữu đặc điểm §Y$trait_aquatic$§! hoặc §Y$trait_robot_aquatic$§! có thể nhận thêm 50% hiệu ứng thưởng trên hành tinh §YĐại dương§!, nhưng hình phạt khi sống trên các hành tinh không §YẨm ướt§! cũng sẽ tăng lên tương ứng."
 ap_hydrocentric_deluge_tooltip: "Mở khóa vũ khí Colossus §YĐại hồng thủy§!."
 ap_hydrocentric_deluge_pre_unlock_tooltip: "Mở khóa vũ khí Colossus §YĐại hồng thủy§! §R(Cần đặc quyền thăng thiên §Y$ap_colossus$§!)§!."
 terraforming: "Cải tạo môi trường"
 terraforming_ocean: "Cải tạo môi trường thành hành tinh Đại dương"
 has_terraforming_candidate: "§YCó ứng cử viên cải tạo môi trường trong hệ sao.§!"
 has_frozen_terraforming_candidate: "§YCó ứng cử viên cải tạo môi trường đóng băng trong hệ sao.§!"
 has_toxic_terraforming_candidate: "§YCó ứng cử viên cải tạo môi trường độc hại trong hệ sao.§!"
 aquatics.1.name: "Loài thủy sinh thượng đẳng"
 aquatics.1.desc: "Xuất thân từ biển sâu vợi vợi, giống loài chúng ta đã thích nghi hoàn hảo với môi trường dưới đáy đại dương. Dù đã vươn tầm ra không gian, chúng ta vẫn không quên đi cội nguồn: vùng nước là, và sẽ mãi là nhà của chúng ta. Giờ đây, quá trình thăng thiên của chúng ta đã hoàn tất —— chúng ta không cần phải thích nghi với các môi trường khác nữa, thay vào đó, chúng ta sẽ cải tạo những hành tinh khác để đáp ứng nhu cầu của mình. Khi bình minh của một ngày mới ló dạng, chúng ta hiểu rõ rằng sẽ không còn điều gì có thể chia cắt chúng ta khỏi biển cả nữa."
 aquatic.1.A: "Đây sẽ là một ngôi nhà độc nhất vô nhị."
 MESSAGE_FROZEN_TERRAFORM_FOUND_TITLE: "$aquatics.5.name$"
 MESSAGE_FROZEN_TERRAFORM_FOUND_DESC: "Chúng ta đã phát hiện thêm một ứng cử viên tiềm năng để cải tạo môi trường đóng băng, [From.GetName] có thể được cải tạo thành một hành tinh Đại dương tuyệt vời."
 aquatics.5.name: "Phát hiện ứng cử viên cải tạo môi trường đóng băng"
 aquatics.5.desc.intro: "Khảo sát chi tiết của chúng ta về [From.GetName] cho thấy hành tinh này có một lớp băng dày dặn, do đó nó có thể được chuyển đổi thành một hành tinh Đại dương êm đềm. Chúng ta chỉ cần nung nóng hành tinh ở quy mô lớn và cấp cho nó một bầu khí quyển có thể sinh sống được."
 aquatics.5.desc.1: "$aquatics.5.desc.intro$\n\nViệc cải tạo môi trường cho [From.GetPlanetMoon] này về lý thuyết là khả thi, nhưng hiện tại chúng ta vẫn chưa có các phương tiện công nghệ cần thiết để hoàn thành nhiệm vụ mang tính cột mốc này trong một khoảng thời gian thực tế."
 aquatics.5.desc.2: "$aquatics.5.desc.intro$\n\nMức tiêu hao năng lượng khổng lồ là một trở ngại, nhưng quả thực chúng ta đã nắm giữ các phương tiện công nghệ để từng bước cải tạo môi trường của [From.GetPlanetMoon] này thành một hành tinh có thể hỗ trợ sự sống trở lại."
 aquatics.5.desc.a: "Một hành tinh vẫn còn hi vọng..."
 FROZEN_TERRAFORMING_CANDIDATE_EFFECT: "Nếu chúng ta chọn đặc quyền thăng thiên §H$ap_hydrocentric$§! và nghiên cứu công nghệ £society£§H$tech_climate_restoration$§!, §Y[From.GetName]§! sẽ có thể được cải tạo môi trường."
 sm_ice_mining_station: "Trạm khai thác băng"
 sm_ice_mining_station_desc: "Hệ sao này sở hữu một lượng lớn băng chưa được khai thác. Bằng cách xây dựng Trạm khai thác băng tại đây, chúng ta có thể tận dụng chúng để tạo ra những đại dương có thể cư trú cho giống loài của mình.\n\n$ice_mining_details$\n"
 ice_mining_station_tooltip: "Biến đổi hệ sao:\n   $mod_station_gatherers_produces_mult$: §G+15%§!\nMở khóa quyết nghị §Y$decision_expand_planetary_sea$§! trên hành tinh Đại dương.\nMở khóa §Y$decision_flood_habitat$§! trên §YTrạm cư trú§!."
 requires_ice_source: "§RCần phải có tiểu hành tinh băng hoặc hành tinh đóng băng trong hệ sao.§!"
 ice_mining_details: "Tiểu hành tinh băng có thể khai thác 1 lần, hành tinh đóng băng có thể khai thác tối đa 3 lần."
 has_ice_source: "§YCó thể khai thác băng.§!"
 decision_expand_planetary_sea: "Mở rộng đại dương hành tinh"
 decision_expand_planetary_sea_desc: "Đại dương là nhà của chúng ta —— và nhà thì tất nhiên càng rộng càng tốt. Mạng lưới khai thác băng cho phép chúng ta thu thập băng từ các thiên thể khác, và từ từ giải phóng chúng vào đại dương của [This.GetName], mở rộng các khu vực có thể sinh sống trên hành tinh."
 decision_expand_planetary_sea_tooltip: "Băng có thể được thu thập từ các hệ sao thông qua Căn cứ sao có xây §Y$sm_ice_mining_station$§!."
 requires_free_ice_mining_station: "$TRIGGER_FAIL$§RCần một §Y$sm_ice_mining_station$§! có thể sử dụng§!"
 requires_max_3_times_pass_simple: "$TRIGGER_PASS$Có thể thi hành tối đa §Y3§! lần trên mỗi hành tinh"
 requires_max_3_times_fail_simple: "$TRIGGER_FAIL$Chỉ có thể thi hành tối đa §Y3§! lần trên mỗi hành tinh"
 requires_max_3_times_ice_dumping: "$TRIGGER_PASS$Chỉ có thể thi hành tối đa §Y3§! lần trên mỗi hành tinh (Hiện tại: §Y[This.ice_dumping_happened] lần§!)"
 ICE_MINING_INTERRUPTED_TITLE: "Khai thác băng bị gián đoạn"
 ICE_MINING_INTERRUPTED_DESC: "Do hiện tại không có nguồn băng nào có thể sử dụng, nỗ lực mở rộng đại dương trên §Y[This.GetName]§! của chúng ta đã bị hủy bỏ."
 ICE_MINING_INTERRUPTED_HABITAT_DESC: "Do hiện tại không có nguồn băng nào có thể sử dụng, kế hoạch bơm ngập nước §Y[This.GetName]§! của chúng ta buộc phải hủy bỏ."
 ICE_MINING_SUCCESS_TITLE: "Đại dương hành tinh đã được mở rộng"
 ICE_MINING_SUCCESS_DESC: "Sử dụng nước đá thu thập từ hệ sao $SYSTEM|Y$, chúng ta đã mở rộng thành công đại dương trên hành tinh §Y[This.GetName]§!."
 ICE_MINING_SUCCESS_BUT_EXHAUSTED_DESC: "$ICE_MINING_SUCCESS_DESC$\n\nNguồn băng của mỏ này đã cạn kiệt, do đó §Y$sm_ice_mining_station$§! đã bị dỡ bỏ."
 ICE_MINING_HABITAT_SUCCESS_TITLE: "Trạm cư trú bị bơm ngập"
 ICE_MINING_HABITAT_SUCCESS_DESC: "Sử dụng băng khai thác được từ hệ sao $SYSTEM|Y$, chúng ta đã thực hiện thành công việc bơm ngập §Y[This.GetName]§!."
 ICE_MINING_HABITAT_SUCCESS_BUT_EXHAUSTED_DESC: "$ICE_MINING_SUCCESS_HABITAT_DESC$\n\nNguồn cung cấp băng tại điểm khai thác này đã cạn kiệt, do đó §Y$sm_ice_mining_station$§! đã được tháo dỡ."
 ice_mined_planet: "Hành tinh cạn băng"
 ice_mined_planet_desc: "Hành tinh này gần đây đã bị khai thác băng, nó đã khô kiệt theo đúng nghĩa đen."
 decision_flood_habitat: "Bơm ngập Trạm cư trú"
 decision_flood_habitat_desc: "Trạm cư trú là địa điểm phát triển lý tưởng của chúng ta —— miễn là ở đó có đủ nước. Mạng lưới khai thác băng cho phép chúng ta lấy băng từ các thiên thể khác, bơm ngập [This.GetName], biến nơi này thành một thủy cung trên quỹ đạo hoàn hảo."
 decision_flood_habitat_tooltip: "Độ phù hợp: §R-20%§!\nĐối với loài §YThủy sinh§!, nó có thể được coi là một hành tinh §YĐại dương§!.\nNếu Căn cứ sao trong hệ sao có §Y$sm_ice_mining_station$§!, băng sẽ được khai thác từ hệ sao này."
 flooded_habitat: "Trạm cư trú ngập nước"
 flooded_habitat_desc: "Trạm cư trú này đã được bơm đầy nước, nhằm mô phỏng môi trường phát triển tự nhiên của sinh vật thủy sinh."
 flooded_habitat_tooltip: "Độ phù hợp: §R-20%§!\nĐối với loài §YThủy sinh§!, nó có thể được coi là một hành tinh §YĐại dương§!."
 # Nguồn gốc Thiên đường Đại dương
 origin_ocean_paradise: "Thiên đường Đại dương"
 origin_ocean_paradise_desc: "Kể từ khi ra đời, nền văn minh này đã được tận hưởng một môi trường dồi dào sản vật và vô ưu vô lo, giúp họ có thể phát triển thịnh vượng mà không gặp trở ngại nào."
 origin_ocean_paradise_effects: "$HOMEWORLD$$TABBED_NEW_LINE$—['concept_pc_ocean'] (Quy mô: £planetsize£30)$TABBED_NEW_LINE$—$PLANETARY_MODIFIERS$['concept_ocean_paradise_mod']$TABBED_NEW_LINE$—$PLANETARY_FEATURES$['concept_crystal_reef']\n—['concept_guaranteed_colonies']: Thay thế bằng ['concept_pc_frozen', Hành tinh đóng băng]"
 origin_ocean_machines: "Người máy Thủy sinh"
 origin_ocean_machines_desc: "Kể từ khi nền văn minh cơ khí này ra đời, họ đã lặn sâu dưới vương quốc đại dương, tận hưởng một môi trường dồi dào sản vật mà không bị bất kỳ thách thức tự nhiên nào cản bước."
 origin_ocean_machines_effects: "—$HOMEWORLD$$TABBED_NEW_LINE$—['concept_pc_ocean'] (Quy mô: £planetsize£30)$TABBED_NEW_LINE$—$PLANETARY_MODIFIERS$['concept_ocean_paradise_mod']$TABBED_NEW_LINE$—$PLANETARY_FEATURES$['concept_crystal_reef']\n—['concept_guaranteed_colonies']: Thay thế bằng ['concept_pc_frozen', Hành tinh đóng băng]"
 START_SCREEN_OCEAN_PARADISE: "Xã hội [Root.GetAdj] có câu tục ngữ 'Biết đủ là sẽ vui'. Chỉ cần học cách biết ơn, chúng ta sẽ thấy đâu đâu cũng là món quà của sự sống. Dưới dòng nước này, chúng ta đã sinh sôi nảy nở từ rất lâu rồi.\n\nNhưng những người lớn tuổi trong số chúng ta lại không nhận ra sự trì trệ này. Họ coi khát vọng sinh tồn của chúng ta là sự nóng vội. Nếu chúng ta không tìm kiếm sự thay đổi, thì rất có thể sự thay đổi sẽ giết chết chúng ta khi không kịp trở tay. Chắc chắn chúng ta không đơn độc trong vũ trụ bao la này. Để bảo vệ quê hương, sẽ có những người phải rời xa quê hương.\n\nThực tế đã chứng minh, lặn sâu xuống vực thẳm là hoàn toàn xứng đáng. Công việc trục vớt gian khổ đã mang về những tàn tích đáng kinh ngạc, tạo ra một sự bùng nổ công nghệ như thác lũ. Cuối cùng, chúng ta đã sẵn sàng phá vỡ ranh giới của đại dương để tiến ra thế giới bên ngoài, để khám phá, để chứng kiến, để học hỏi và để bảo vệ."
 START_SCREEN_OCEAN_PARADISE_HIVE: "'Biết đủ là sẽ vui'. Chỉ cần học cách biết ơn, chúng ta sẽ thấy đâu đâu cũng là món quà của sự sống. Dưới dòng nước này, chúng ta đã sinh sôi nảy nở từ rất lâu rồi.\n\nSự trì trệ lớn đang cận kề. Nếu chúng ta không tìm kiếm sự thay đổi, thì rất có thể sự thay đổi sẽ giết chết chúng ta khi không kịp trở tay. Chắc chắn chúng ta không đơn độc trong vũ trụ bao la này. Để bảo vệ quê hương, sẽ có những cá thể phải rời xa quê hương.\n\nThực tế đã chứng minh, lặn sâu xuống vực thẳm là hoàn toàn xứng đáng. Công việc trục vớt gian khổ đã mang về những tàn tích đáng kinh ngạc, tạo ra một sự bùng nổ công nghệ như thác lũ. Cuối cùng, chúng ta đã sẵn sàng phá vỡ ranh giới của đại dương để tiến ra thế giới bên ngoài, để khám phá, để chứng kiến, để học hỏi và để bảo vệ."
 START_SCREEN_OCEAN_PARADISE_ROBOT: "Từ lâu, người [Root.GetAdj] chúng ta đã tận hưởng sự thanh bình của đại dương, cấu trúc cơ thể của chúng ta dường như thích nghi hoàn toàn để tồn tại dưới nước.\n\nSinh tồn cũng giống như đi thuyền ngược dòng, không tiến ắt sẽ lùi. Chúng ta không thể chắc chắn liệu còn ai khác trong vũ trụ này không, quê hương của chúng ta liệu có phải là một viên ngọc sáng có thể bị cướp đi bất cứ lúc nào.\n\nChúng ta đã ở trong một cái ao nhỏ quá lâu, được tinh vân che chở, nhưng điều đó đã là dĩ vãng. Với sự ra đời của [GetStartingDrive], chúng ta đã sẵn sàng để giong buồm ra biển sao vô tận."
 ocean_paradise: "Thiên đường Đại dương"
 ocean_paradise_desc: "Rất ít hành tinh có được những điều kiện may mắn như vậy. Nguồn tài nguyên dồi dào, trù phú của nó sẽ kéo dài mãi mãi —— nếu được quản lý đúng cách."
 ocean_paradise_hive: "$ocean_paradise$"
 ocean_paradise_hive_desc: "$ocean_paradise_desc$"
 ocean_paradise_start_NAME: "Thiên đường Đại dương"
 ocean_paradise_start_DESC: "Đây sẽ là hệ sao khởi đầu khi chọn nguồn gốc Thiên đường Đại dương."
 # Cấu trúc xã hội Ngư dân
 civic_anglers: "Ngư dân"
