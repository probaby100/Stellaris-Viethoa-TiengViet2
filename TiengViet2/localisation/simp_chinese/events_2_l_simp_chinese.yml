 war_in_heaven.4.b.satellite.tt: "§Y[Root.GetName]§! trở thành một $preset_satellite$ của §Y[from.GetName]§!.\n$war_in_heaven_satellite_text$"
 war_in_heaven.4.b.signatory.tt: "§Y[Root.GetName]§! trở thành một $preset_signatory$ của §Y[from.GetName]§!.\n$war_in_heaven_signatory_text$"
 war_in_heaven.4.b.thrall.tt: "§Y[Root.GetName]§! trở thành một $preset_thrall$ của §Y[from.GetName]§!.\n$war_in_heaven_thrall_text$"
 war_in_heaven.4.b.political_client.tt: "§Y[Root.GetName]§! trở thành một $preset_political_client$ của §Y[from.GetName]§!.\n$war_in_heaven_political_client_text$"
 war_in_heaven.4.b.herald.tt: "§Y[Root.GetName]§! trở thành một $preset_herald$ của §Y[from.GetName]§!.\n$war_in_heaven_herald_text$"
 war_in_heaven_dominion_text: "Quốc gia chư hầu $preset_dominion$ phải nộp 30% tài nguyên cơ bản làm cống nạp, hệ tư tưởng chính trị dần dần chuyển thành §YCuồng Tín Tâm linh§!."
 war_in_heaven_satellite_text: "Quốc gia chư hầu $preset_satellite$ phải nộp 30% điểm nghiên cứu làm cống nạp."
 war_in_heaven_signatory_text: "Quốc gia chư hầu $preset_signatory$ bị cấm sở hữu nô lệ, cũng như không được tiến hành thanh lọc."
 war_in_heaven_thrall_text: "Quốc gia chư hầu $preset_thrall$ phải nộp 30% tài nguyên cơ bản làm cống nạp."
 war_in_heaven_political_client_text: "$preset_political_client$ không có bất kỳ tự do nào trong vấn đề ngoại giao và bỏ phiếu."
 war_in_heaven_herald_text: "Quốc gia chư hầu $preset_herald$ phải tham gia vào tất cả các cuộc chiến của quốc gia tông chủ."
 war_in_heaven.4.b: "Chúng ta sẽ thề trung thành với [From.GetName]."
 war_in_heaven.4.c: "Chúng ta sẽ không đứng về phe nào trong cuộc đấu tranh này."
 war_in_heaven.4.c.2: "Chúng đều sẽ thất bại dưới tay chúng ta!"
 war_in_heaven.4.d: "Là một quốc gia chư hầu, việc này không do chúng ta tự quyết định."
 war_in_heaven.5.name: "Chương cuối của Cuộc chiến trên Thiên đàng"
 war_in_heaven.5.desc: "Trải qua một cuộc giao tranh tàn khốc và dai dẳng, đế chế §H[WarInHeavenFEOne.GetName]§! cuối cùng đã giành chiến thắng đầy tự hào trong cuộc chiến quyết định bá quyền ngân hà này. Nền văn minh tổ tiên bại trận đã bị túc địch nuốt chửng hoàn toàn, giờ đây §H[WarInHeavenFEOne.GetSpeciesName]§! đang nhìn xuống toàn cõi ngân hà, với một vị thế thống trị không thể lay chuyển.\n\nNgân hà hiện đang duy trì một nền hòa bình vô cùng mong manh, nhưng trật tự mới này liệu có thể tồn tại được bao lâu?"
 war_in_heaven.5.a: "Nền hòa bình dưới trướng [WarInHeavenFEOne.GetSpeciesName]."
 war_in_heaven.6.name: "$war_in_heaven.5.name$"
 war_in_heaven.6.desc: "Trải qua một cuộc giao tranh tàn khốc và dai dẳng, Cuộc chiến trên Thiên đàng đã kết thúc với một thế trận giằng co giữa hai bên. §H[WarInHeavenFEOne.GetName]§! và §H[WarInHeavenFETwo.GetName]§! đã ký kết hiệp định đình chiến, rút hạm đội về biên giới của từng bên.\n\nNgân hà hiện đang duy trì một nền hòa bình vô cùng mong manh, nhưng đợt đình chiến này liệu có thể kéo dài được bao lâu?"
 war_in_heaven.6.a: "Chiến tranh vẫn chưa kết thúc..."
 war_in_heaven.11.name: "Đế chế Thức tỉnh bị Đánh bại"
 war_in_heaven.11.desc: "Cuộc chiến tranh giữa các Đế chế Cổ đại đã kết thúc bằng sự thất bại của một phe, nhưng đây không phải là tác phẩm do kẻ thù truyền kiếp của chúng làm ra. Có lẽ cuộc đại chiến đã bào mòn thực lực của chúng, hoặc có thể đơn thuần là nhờ sức mạnh của các loài non trẻ, đế chế cổ đại cuối cùng đã bị hủy diệt bởi những sinh vật mà chúng luôn coi là yếu ớt, điều này hoàn toàn thay đổi mọi cục diện. Giờ đây, câu hỏi đặt ra là, liệu §H[RemainingAwakened.GetName]§! có thể tránh được việc đi vào vết xe đổ của kẻ thù truyền kiếp hay không? Hay sự kiện này đã đánh dấu một kỷ nguyên mới cho toàn bộ dải ngân hà?"
 war_in_heaven.11.a: "Chuyện này thì phải chờ xem..."
 war_in_heaven.13.name: "Tổ chức Không Liên kết"
 war_in_heaven.13.desc: "Bên trong ngọn lửa chiến tranh của các Đế chế Cổ đại, không phải tất cả các giống loài non trẻ đều lựa chọn đứng về một phe. Có một số loài giống như chúng ta, vẫn duy trì lập trường trung lập, nhưng nếu chiến tranh lan đến lãnh thổ của mình, chúng ta sẽ chỉ có thể đơn độc chống lại sự đe dọa của các Đế chế Cổ đại. Chúng ta đã nhận được thông điệp từ những đế chế khác, họ quyết định thành lập một §HTổ chức Không Liên kết§!, giương cao ngọn cờ phản kháng lại cả hai phe trong cuộc chiến. Nhờ vào sức mạnh quân sự và tầm ảnh hưởng của chúng ta, họ đã quyết định mời chúng ta trở thành minh chủ của thế lực liên minh này. Một khi chấp nhận, chúng ta gần như chắc chắn sẽ phải đồng thời khai chiến với cả hai Đế chế Thức tỉnh, nhưng ít nhất chúng ta sẽ có đồng minh hỗ trợ, không phải đối mặt với hai Đế chế Cổ đại trong sự đơn độc."
 war_in_heaven.13.desc2: "Giữa cuộc đại chiến của các Đế chế Cổ đại, không phải tất cả các loài non trẻ đều đã chọn phe. Có một số, ví dụ như chúng ta, vẫn giữ thái độ trung lập; nhưng nếu cán cân chiến tranh nghiêng về một bên, e rằng chúng ta sẽ phải đối mặt với mối đe dọa từ các Đế chế Cổ đại trong sự đơn độc. Chúng ta đã nhận được thông điệp của những đế chế khác, họ quyết định thành lập một §HTổ chức Không Liên kết§!, giương cao ngọn cờ phản kháng lại cả hai phe của cuộc chiến. Xét trên việc chúng ta đang là một liên bang hùng mạnh, là một thành viên nắm vai trò lãnh đạo của [Root.GetAllianceName], họ quyết định mời chúng ta mở rộng liên minh hiện có của mình để thiết lập một tổ chức như dự kiến. Việc chấp thuận yêu cầu này cơ bản đồng nghĩa với việc khai chiến với các Đế chế Thức tỉnh, nhưng so với việc phải một mình chống lại kẻ địch hùng mạnh, chúng ta ít nhất có thể sát cánh chiến đấu cùng các đồng minh."
 war_in_heaven.13.a: "Chúng ta sẽ lãnh đạo tổ chức này!"
 war_in_heaven.13.b: "Không, việc này quá đỗi nguy hiểm!"
 war_in_heaven.13.c: "Chúng ta có thể tự bảo vệ chính mình."
 war_in_heaven.15.name: "Yêu cầu gia nhập tổ chức"
 war_in_heaven.15.desc: "§H[From.GetName]§! chính thức nộp đơn xin gia nhập §HTổ chức Không Liên kết§!."
 war_in_heaven.15.a: "Rất hân hạnh khi có họ tham gia!"
 war_in_heaven.15.b: "Không, chúng ta không cần đến họ."
 war_in_heaven.16.name: "Cuộc chiến với những Kẻ Phục hưng"
 war_in_heaven.16.desc: "Chẳng mấy chốc, các Đế chế Cổ đại đã nhận ra sự tồn tại của §HTổ chức Không Liên kết§!. Cả hai bên đều đã cử đại diện đến [Root.Capital.GetName], yêu cầu giải tán liên minh và ép tất cả thành viên phải chọn phe trong cuộc chiến tranh này. Chúng ta hiển nhiên đã cự tuyệt điều đó, và sáng nay, cả §H[FirstSleeper.GetName]§! lẫn §H[SecondSleeper.GetName]§! đều đã đưa ra lời tuyên chiến với chúng ta."
 war_in_heaven.16.a: "Cả hai bọn bay hãy cút khỏi cái ngân hà này đi!"
 war_in_heaven.18.name: "Sự sụp đổ của những Kẻ Phục hưng"
 war_in_heaven.18.desc: "Trải qua một cuộc xung đột kéo dài và tàn khốc, cuộc chiến bắt nguồn từ những mâu thuẫn giữa hai Đế chế Cổ đại này đã kết thúc với sự diệt vong của cả hai phe. Những gã khổng lồ kiêu ngạo từng sở hữu sức mạnh công nghệ cổ đại vô song nay đã hóa thành tro bụi của lịch sử, dải ngân hà vừa đón chào một bình minh hoàn toàn mới, và các giống loài mới nổi sẽ tự tay viết nên định mệnh của chính mình."
 war_in_heaven.18.a: "Đây chính là thời đại của [Root.GetName]!"
 war_in_heaven.19.name: "Tổ chức Không Liên kết"
 war_in_heaven.19.desc: "Bên trong cuộc đại chiến của các Đế chế Cổ đại, không phải tất cả các giống loài non trẻ đều lựa chọn đứng về một phe. Có một số loài giống như chúng ta, vẫn duy trì lập trường trung lập, nhưng nếu chiến tranh lan đến lãnh thổ của mình, chúng ta sẽ chỉ có thể đơn độc chống lại sự đe dọa của các Đế chế Cổ đại. Dưới sự lãnh đạo của §H[From.GetName]§!, §HTổ chức Không Liên kết§! đã được thành lập, với mục tiêu chống lại các đế chế tiên phong đã châm ngòi chiến tranh. Tham gia vào liên minh này đồng nghĩa với việc đồng thời nổ súng với các Đế chế Sa ngã Thức tỉnh ở cả hai phe của cuộc chiến, nhưng ít nhất, những kẻ trung lập tham gia vào tổ chức này sẽ không còn phải chiến đấu đơn độc nữa."
 war_in_heaven.19.desc2: "Giữa cuộc đại chiến của các Đế chế Cổ đại, không phải tất cả các loài non trẻ đều đã chọn phe. Có một số, ví dụ như chúng ta, vẫn giữ thái độ trung lập; nhưng nếu cán cân chiến tranh nghiêng về một bên, e rằng chúng ta sẽ phải đối mặt với mối đe dọa từ các đế chế tiên phong trong sự đơn độc. §H[From.GetName]§!, chủ tịch liên bang của chúng ta, đã đổi tên cộng đồng chung của chúng ta thành §HTổ chức Không Liên kết§!, giương cao ngọn cờ phản kháng lại cả hai phe trong cuộc chiến. Việc thành lập tổ chức này cơ bản đồng nghĩa với việc khai chiến với các Đế chế Thức tỉnh, nhưng so với việc phải một mình chống lại kẻ địch hùng mạnh, chúng ta ít nhất có thể sát cánh chiến đấu cùng các đồng minh."
 war_in_heaven.19.desc3: "Giữa cuộc đại chiến của các Đế chế Cổ đại, không phải tất cả các loài non trẻ đều đã chọn phe. Có một số, ví dụ như chúng ta, vẫn giữ thái độ trung lập; nhưng nếu cán cân chiến tranh nghiêng về một bên, e rằng chúng ta sẽ phải đối mặt với mối đe dọa từ các đế chế tiên phong trong sự đơn độc. §H[From.GetName]§! đã dũng cảm tiên phong, tuyên bố liên minh của họ sẽ đóng vai trò là một §HTổ chức Không Liên kết§!, giương cao ngọn cờ phản kháng lại cả hai phe trong cuộc chiến, và mời gọi các quốc gia trung lập khác đoàn kết lại dưới lá cờ của họ. Việc gia nhập tổ chức này cơ bản đồng nghĩa với việc khai chiến với các Đế chế Sa ngã Thức tỉnh, nhưng so với việc phải một mình chống lại kẻ địch hùng mạnh, chúng ta ít nhất có thể sát cánh chiến đấu cùng các đồng minh."
 war_in_heaven.19.a: "Chúng ta sẽ gia nhập tổ chức này!"
 war_in_heaven.19.a2: "Chúng ta sẽ nói không với sự bạo ngược của những bộ xương khô đó!"
 war_in_heaven.19.b: "Không, việc này quá đỗi nguy hiểm!"
 war_in_heaven.19.b2: "Chúng ta không thể ủng hộ phương châm hành động như thế này được."
 war_in_heaven.20.name: "Đồng ý gia nhập tổ chức"
 war_in_heaven.20.desc: "§H[From.GetName]§! đã phê duyệt việc chúng ta gia nhập §HTổ chức Không Liên kết§!, bây giờ chúng ta sẽ cùng các bên trung lập khác chống lại sự đe dọa của những Đế chế Cổ đại này."
 war_in_heaven.20.a: "Vì chiến thắng và tự do!"
 war_in_heaven.21.name: "Từ chối tham gia tổ chức"
 war_in_heaven.21.desc: "§H[From.GetName]§! đã từ chối yêu cầu gia nhập §HTổ chức Không Liên kết§! của chúng ta, bây giờ chúng ta chỉ đành tự mình chống lại mối đe dọa từ các Đế chế Cổ đại."
 war_in_heaven.21.a: "Việc này thật khó xử..."
 war_in_heaven.22.name: "Tổ chức Không Liên kết"
 war_in_heaven.22.desc: "Trong cuộc chiến giữa các Đế chế Cổ đại, không phải tất cả các giống loài non trẻ đều chọn đứng về một bên. Chẳng hạn như chúng ta vẫn giữ nguyên sự trung lập, nhưng điều này đồng nghĩa với việc chúng ta phải đơn độc đối mặt với mối đe dọa của các Đế chế Thức tỉnh. Với mục tiêu kháng cự lại các thế lực trong cuộc chiến, §HTổ chức Không Liên kết§! đã được thành lập dưới sự dẫn dắt của §H[From.GetName]§!."
 war_in_heaven.22.desc2: "Không phải tất cả các loài non trẻ đều lựa chọn tham chiến giữa chừng với các Đế chế Cổ đại. Có một số, ví dụ như chúng ta, vẫn giữ thái độ trung lập; nhưng nếu cán cân chiến tranh nghiêng về một bên, e rằng chúng ta sẽ phải đối mặt với mối đe dọa từ các Đế chế Thức tỉnh trong sự đơn độc. §H[From.GetName]§! đã dũng cảm tiên phong, tuyên bố liên minh của họ sẽ đóng vai trò là một §HTổ chức Không Liên kết§! giương cao ngọn cờ phản kháng lại cả hai phe trong cuộc chiến, đồng thời mời gọi các quốc gia trung lập khác đoàn kết lại dưới lá cờ của họ."
 war_in_heaven.22.a: "Một canh bạc lớn."
 war_in_heaven_is_over: "Cuộc chiến trên Thiên đàng Kết thúc"
 ####################################
 ##Dân du mục không gian
 ####################################
 #namarian.6.name: "Cuộc chạm trán bất thường tại [From.From.From.GetName]"
 #namarian.6.desc: "Chúng ta đã chạm trán một dạng tàu bè ngoài hành tinh tại hệ sao §Y[From.From.From.GetName]§!! Những vật thể lạ này được đánh dấu là thuộc về [from.GetAdj], nhưng ta không tài nào bắt được bất kỳ tín hiệu liên lạc nào của họ, khiến việc giải mã ngôn ngữ trở nên bất khả thi.\n\nChúng ta đành phải đợi xem điều gì sẽ xảy ra tiếp theo..."
 namarian.9.desc: "Các thuyền viên du mục trên hạm đội Kẻ Đạp Sóng đã gửi lời nhắn cho chúng ta. Họ nói rằng họ đang rời khỏi rìa hệ sao để tiến tới điểm dừng chân tiếp theo. Liệu họ sẽ đi về đâu? Liệu họ có tìm thấy thứ mình hằng kiếm tìm?"
 namarian.9.a: "Có kẻ vẫn mang lòng hoài nghi..."
 namarian.9.a.phobe: "Tạ ơn trời đất."
 namarian.9.c.phile: "Chúc chuyến đi bình an."
 namarian.10.name: "Dân du mục biển sao"
 namarian.10.desc: "Cầu chúc ngày mát lành và đêm ấm áp luôn kề bên người, hỡi [Root.GetAdj][Root.GetRulerTitle]. Ta là [contact_speaker_leader.GetName]. Ta đại diện cho hạm đội du mục, cất lên tiếng nói cho muôn vàn linh hồn Namarian trên hạm đội Kẻ Đạp Sóng.\n\nNgười không cần phải lo sợ bọn ta, hạm đội này chẳng màng tranh giành các thiên thể. Bọn ta chỉ mong nhận được sự tôn trọng, và hành trình không bị ngáng đường."
 namarian.21.desc: "Xin chào, [Root.GetAdj][Root.GetRulerTitle]. Chúng ta có một lời thỉnh cầu. Trên chuyến hành trình xuyên qua cõi hư không thăm thẳm, một số người dân của chúng ta đã mệt mỏi rã rời, ánh mắt chẳng còn thấy đích đến. Chúng ta không phải bạo chúa, nên sẽ chẳng ép buộc ai phải theo trọn vẹn chuyến đi. Vì vậy chúng ta tha thiết xin người: liệu các người có thể tiếp nhận những thuyền viên ấy không? Cho họ nương náu trên [NomadMissionPlanet.GetName] của các người, được chứ?"
 namarian.21.a: "Chúng tôi sẽ tiếp nhận họ."
 namarian.21.a.tooltip: "§H[NomadMissionPlanet.GetName]§!:\n§G+300§!£pop£§H Dân du mục§!"
 namarian.21.a.response: "Vô cùng cảm tạ các bạn, [Root.GetSpeciesAdj]. Cầu chúc cho chúng ta cùng các bạn đều toại nguyện như ý."
 namarian.21.b: "Chúng tôi không thể cưu mang họ."
 namarian.21.b.response: "Thật không may chút nào, [Root.GetSpeciesAdj]. Mong sao những kẻ rớt lại có thể gắng gượng thêm chút nữa. Chúng ta sẽ lên đường ngay đây."
 namarian.21.c: "Vì sao họ lại bất mãn?"
 namarian.21.c.response: "Đường xa vạn dặm, rất có thể cả đời này chúng ta cũng chẳng tới được bến đỗ cuối cùng. Có người muốn tìm kiếm một mục tiêu mà đời mình có thể chạm tới, thay vì chôn vùi cả kiếp sống trên chuyến hành trình không hồi kết."
 namarian.21.d: "Họ sẽ hòa nhập vào xã hội chúng tôi bằng cách nào?"
 namarian.21.d.response: "Chúng là một lũ nhát gan vừa duy tâm lại vừa đòi hỏi cái gọi là bình đẳng, còn chuyện chúng có sống hòa thuận với các người được hay không thì tùy các người định liệu."
 namarian.30.name: "Hạm đội du mục biển sao"
 namarian.30.desc_01: "Cầu chúc ngày mát lành và đêm ấm áp luôn kề bên các người, [Root.GetAdj][Root.GetRulerTitle]."
 namarian.30.desc_02: "Chúc phúc cho các bạn, [Root.GetAdj][Root.GetRulerTitle]. Mong các bạn luôn êm ấm."
 namarian.30.desc_03: "Các người có đòi hỏi gì, [Root.GetSpeciesAdj]?"
 namarian.30.a: "Hãy kể thêm cho chúng tôi nghe về đế chế của các bạn."
 namarian.30.a.response: "Như lời ta từng nói thuở ban đầu gặp gỡ, chúng ta đến từ hạm đội Kẻ Đạp Sóng. Đời đời kiếp kiếp chúng ta ngược xuôi giữa cõi hư không của các vì sao, và sẽ còn tiếp diễn mãi về sau.\n\nHạm đội gồm nhiều cá nhân họp thành, tất cả đều phải dốc trọn sức lực vì mục tiêu chung. Có kẻ muốn rời đàn để định cư trên các thiên thể, nhưng phần đông vẫn khao khát vượt qua cõi hư không tiếp theo để ngắm nhìn những cảnh tượng phía trước."
 namarian.30.b: "Các bạn định đi đâu?"
 namarian.30.b.response_trust: "Vì người là đồng minh được Kẻ Đạp Sóng tin cậy, [Root.GetSpeciesAdj], ta sẽ hé lộ đôi điều:\n\nHạm đội hiện đang trên đường tìm kiếm. Tổ tiên chúng ta từng buộc phải rời bỏ quê nhà để lao vào cõi sâu thẳm không đáy. Họ mong hậu thế có thể tìm thấy ý nghĩa tồn tại của mình; ngàn năm sau ngày họ bỏ lại hành tinh mẹ đầy cồn cát, chúng ta vẫn sống và đi theo nguyện ước năm xưa của họ.\n\nNhững gì cần nói chỉ có vậy. Chúc người bình an."
 namarian.30.b.response: "Chúng ta đang xuôi theo những dòng sông hư không để khám phá. Chuyến đi này đã kéo dài ngàn năm, nhưng chúng ta vẫn sẽ tiếp tục dong buồm. Đích đến của chúng ta chính là biển sao rộng lớn của vũ trụ. Nghe qua có vẻ mơ hồ khó hiểu, nhưng bấy nhiêu đã gói trọn lý tưởng của chúng ta. Cầu mong nó che chắn cho các bạn khỏi ánh nắng thiêu đốt."
 namarian.30.b.response_no_trust: "Xin thứ lỗi chúng ta không thể tiết lộ, [Root.GetSpeciesAdj]. Còn chuyện gì khác không?"
 namarian.30.c: "Tạm biệt."
 namarian.30.c.response: "Chúc thuận buồm xuôi gió, [Root.GetSpeciesAdj]."
 namarian.41.desc: "Cầu mong người được tắm trong làn gió mát, hỡi [Root.GetAdj][Root.GetRulerTitle]. Chúng ta thấy khối cầu mà các người gọi là §Y[NomadMissionPlanet.GetName]§! hiện vẫn chưa có ai chiếm giữ. Chúng ta muốn thỉnh cầu: Liệu có thể để một nhánh người của chúng ta dựng nhà tại đây chăng?\n\nChúng ta biết đây là đòi hỏi không hề nhỏ — nhường cả một hệ sao để cho chúng ta một mái nhà. Chúng ta xin đợi hồi đáp, dẫu quyết định của người ra sao."
 namarian.41.a: "Hệ sao này, cùng \"khối cầu\" đó thuộc về các bạn."
 namarian.41.a.tooltip: "Bạn sẽ §Rnhượng lại§! quyền kiểm soát hệ sao §H[NomadMissionPlanet.GetStarName]§!\n\nTạo một đế chế §Yngười Namarian§! với §B1.5K£pop£§! trên §H[NomadMissionPlanet.GetName]§!\n\nMối quan hệ giữa bạn với §Y[nomad_fleet_country.GetName]§! và đế chế §YNamarian§! được §Gcải thiện§!\n\n"
 namarian.41.b.tooltip: "Mối quan hệ với §Y[nomad_fleet_country.GetName]§! trở nên §Rxấu đi§!\n\n"
 namarian.41.a.response: "Chúng ta tự đáy lòng cảm ơn các bạn. Giữa cõi sao lạnh giá buốt xương, tấm lòng nồng hậu này đã xua đi phần nào giá rét. Hạm đội du mục chúng ta xin chúc cho các bạn cùng đế chế non trẻ một tương lai rạng rỡ."
 namarian.41.b: "Chúng tôi không thể chiều theo ý các người."
 namarian.41.b.phobe: "\"Hành tinh\" này là của chúng ta."
 namarian.41.b.spirit: "Không, đây là vùng đất thiêng bất khả xâm phạm của chúng ta."
 namarian.41.b.response: "Đây quả là tin dữ đối với chúng ta, [Root.GetSpeciesAdj]. Mong sao ở vũng nước tiếp theo, họ sẽ tìm thấy chốn mong chờ bấy lâu thay vì một cơn bão cát thiêu đốt. Cắt đứt liên lạc."
 namarian.41.c: "Tại sao lại hứng thú với hành tinh này?"
 namarian.41.c.response: "Dong buồm giữa những dòng sông hư không quả thực vô vàn gian khó, nhưng đó cũng chỉ là bước ngắn trong hành trình dài đằng đẵng. Người của đế chế chúng ta chỉ mong tìm một chốn dung thân, và §Y[NomadMissionPlanet.GetName]§! có thể đáp ứng điều đó.\n\nHỡi [Root.GetAdj][Root.GetRulerTitle], người có bằng lòng cho họ chốn nương náu chăng?"
 namarian.100.name: "Liên lạc khẩn cấp"
 namarian.100.desc: "[Root.GetSpeciesAdj], cầu mong mặt trời thiêu đốt và hạn hán khốc liệt sẽ mãi bám riết lấy các người. Kẻ Đạp Sóng vĩnh viễn đoạn tuyệt qua lại với các người."
 namarian.105.name: "Tuyên bố thù địch"
 namarian.105.desc: "Các người hãy nếm mùi gầm thét của sóng dữ đi, lũ [Root.GetSpeciesAdj]!"
 namarian.110.name: "Tín hiệu cầu cứu"
 namarian.110.desc: "Tình thế ngàn cân treo sợi tóc, chúng tôi khẩn thiết cầu cứu, hỡi [Root.GetAdj][Root.GetRulerTitle]. Hạm đội đang bị [attacker_country.GetName] tấn công, xin hãy tiếp viện!"
 namarian.110.a: "Chúng tôi sẽ chi viện cho các bạn."
 namarian.110.a.reply: "Hạm đội sẽ mãi khắc ghi ơn này, xin hãy mau lên!"
 namarian.110.b: "Rất tiếc, chúng tôi không thể can thiệp."
 namarian.110.b.reply: "...Nguyền rủa muôn dân và hành tinh của các người đời đời chịu cảnh hạn hán, [Root.GetSpeciesAdj]. Chấm dứt liên lạc."
 namarian.110.c: "Chúng tao sẽ không giúp."
 namarian.500.title: "Đề xuất giao thương của dân du mục"
 namarian.500.desc: "Thật vui được tái ngộ, hỡi [Root.GetRulerTitle] của ốc đảo. Việc qua lại giữa các hành tinh xung quanh giúp chúng ta lượm lặt được nhiều thứ hữu ích từ tàn tích của các giống loài bỏ đi. Cũng nhờ thế mà chúng ta vừa đóng xong dàn tàu mới.\n\nThực ra việc đóng dư tàu này là để giải quyết lượng tài nguyên tồn đọng. Chúng ta muốn đoàn buôn luôn nhẹ gánh, cơ động và không bị ràng buộc, nên mới tìm đến các người với mong muốn đôi bên chốt được một mối làm ăn."
 namarian.500.a: "Đoàn buôn?"
 namarian.500.a.reply: "Là con thuyền cứu thế giữa hạm đội. Nơi những người thợ của chúng ta làm việc và nghỉ ngơi. Đoàn tàu lang bạt giữa vũ trụ cần nó để cung cấp không gian sinh tồn, vì thế chúng ta cần phải giảm bớt gánh nặng trên lưng nó.\n\nNếu các chiến hạm họp thành cánh tay của hạm đội, thì đoàn thuyền chính là trái tim."
 namarian.500.b: "Làm ăn?"
 namarian.500.c: "Nói nghe thử xem."
 namarian.505.desc: "Chúng ta có một lời đề nghị. Chúng ta cần năng lượng cùng khoáng sản để duy trì chuyến đi. Đổi lại, chúng ta sẽ giao cho các người §Ynăm con tàu§! kiểu mới của mình"
 namarian.505.a: "Chỉ có năm con thôi à?"
 namarian.505.a.reply: "Chúng ta chỉ muốn bán chừng đó thôi. Dù sao đoàn tàu cũng cần phải biết tự bảo vệ mình cả công lẫn thủ."
 namarian.505.b: "Cứ tiếp tục đi."
 namarian.505.c: "Chúng tôi không tin vào kỹ thuật của người Namarian."
 namarian.510.desc: "Đó là cách chúng ta sinh tồn: không ngừng thu gom tài nguyên, giữ cho xưởng đóng tàu luôn luôn đỏ lửa. Đó chẳng những là truyền thống mà còn là lẽ sống còn. Thay vì để chúng làm nặng gánh hạm đội, chúng ta thà thấy những tạo tác của mình được cư dân trên các thiên thể mua về sử dụng.\n\nChúng ta dám chắc rằng thiết kế của mình sẽ không khiến người phải thất vọng."
 namarian.510.a: "Hãy giới thiệu đôi chút về các con tàu này đi."
 namarian.510.a.reply: "Tuần dương hạm, chắc các người gọi vậy nhỉ. Được trang bị lá chắn, cùng với dàn phóng tia hồ quang và súng bắn plasma."
 namarian.510.b: "Chúng tôi rất có hứng thú."
 namarian.510.c: "Chúng tôi không hứng thú."
 namarian.511.desc: "Một câu trả lời mát dạ làm sao, hỡi [Root.GetAdj][Root.GetRulerTitle], chúng ta chỉ xin đổi lấy §Y2000§!£minerals£ hoặc §Y2000§!£energy£ để bù đắp."
 namarian.511.a: "Chúng tôi rất sẵn lòng chi trả §Y2000§!£energy£."
 namarian.511.e: "Chúng tôi sẵn lòng chi trả §Y2000§!£minerals£."
 namarian.511.b: "Bớt giá thêm chút nữa đi."
 namarian.511.c: "Chúng tôi không kham nổi."
 namarian.511.d: "Không đời nào."
 namarian.512.desc: "Chúng ta biết rõ giá trị đồ của mình mà, hỡi kẻ ngụ cư thiên thể. Đòi hỏi của ta chẳng hề quá đáng đâu."
 namarian.513.b: "Chúng tôi rất sẵn lòng đỡ đòn cho các bạn bằng §Y1500§!£energy£."
 namarian.513.c: "Chúng tôi vẫn không kham nổi."
 namarian.513.d: "Chúng tôi sẵn lòng chi trả khoản đó bằng §Y1500§!£minerals£ khoáng sản."
 namarian.513.desc: "Ban đầu chúng ta mong ít nhất cũng gỡ lại được tiền vốn đóng tàu, nhưng giờ chỉ cần §Y1500§!£minerals£ hoặc §Y1500§!£energy£ là có thể để lại số tàu này cho các người."
 namarian.514.desc: "Tàu sẽ giong buồm tới ốc đảo trung tâm của các người — [Root.Capital.GetName] chứ? Phải rồi. Trong vòng §Y30§! ngày sẽ bàn giao xong xuôi.\n\nChúc người thuận buồm xuôi gió, mãi mãi được bóng râm mát lành che chở, hỡi [Root.GetRulerName]."
 namarian.514.a: "Tạm biệt nhé, [contact_speaker_leader.GetName]."
 namarian.514.b: "Rất vui vì đã chốt được mối làm ăn."
 namarian.520.title: "Liên lạc mã hóa"
 namarian.520.desc: "Này, kẻ ngụ cư thiên thể.\n\nChúng tao có tin mật muốn báo cho tụi mày đây."
 namarian.520.a: "Người Namarian, hãy xưng danh tính."
 namarian.520.a.reply: "Danh tính tụi tao chẳng có gì đặc biệt cả. Chỉ là mấy kẻ nhiệt tình trên hạm đội Kẻ Đạp Sóng mà thôi."
 namarian.520.b: "Nói đi xem nào."
 namarian.521.desc: "Dạo gần đây tụi mày vừa tậu §Y5 con tàu§! mới cóng do tụi tao đóng đúng không? Tàu chạy nhanh lại gắn toàn vũ khí nòng lớn chứ gì?\n\nChuyện là thế này, dẫu tụi mày không... à mà thôi, tao nói thẳng luôn cho vuông. Để giữ vững yên ổn cho vùng này, xứ bắt tay mua bán tàu với tụi tao đâu phải chỉ có mỗi mình tụi mày. Láng giềng của tụi mày, §H[other_empire.GetName]§!, cũng vừa chốt xong một kèo làm ăn với hạm đội Kẻ Đạp Sóng đấy."
 namarian.521.a: "Rồi sao nữa?"
 namarian.521.b: "Có gì thì nói thẳng ra."
 namarian.522.desc: "Họ cũng chốt một kèo tương tự, lại sắp có thêm §Y5 con tàu§! chuẩn bị được chuyển tới thủ đô [other_empire.Capital.GetName] của [other_empire.GetAdj]. Nhưng tụi tao chẳng hề muốn mấy con tàu bứt ra từ hạm đội lại đi cúc cung phục vụ cho [other_empire.GetName], nên giờ muốn nhờ tụi mày giúp một tay."
 namarian.522.b: "Tại sao lại nói cho chúng tôi chuyện này?"
 namarian.522.b.reply: "Tụi tao chẳng tin nổi lũ [other_empire.GetSpeciesNamePlural]. Khác hẳn với các đế chế mà tụi tao từng gặp trước đây, đến giờ chúng nó vẫn chưa chịu nhả tiền ra. Tụi tao ngờ rằng chúng đang tính câu giờ đợi tàu cập bến thủ đô rồi mới trở mặt quỵt nợ. Vì chúng thừa biết thủ lĩnh hạm đội đang nóng lòng muốn rời khỏi cõi sao này càng sớm càng tốt..."
 namarian.522.c: "Thế các người định tính sao?"
 namarian.522.c.reply: "Tụi tao có quyền truy cập vào bảng cài đặt lái tự động của xưởng đóng tàu đoàn buôn. Chỉ cần ra lệnh cho toàn bộ đội tàu tập kết tại [Root.Capital.GetName], chặn không cho nửa số tàu đáng lẽ phải giao bay về thiên thể của [other_empire.GetAdj] tại [other_empire.Capital.GetName] là xong. Tụi tao chẳng đời nào bị tóm đâu."
 namarian.522.d: "Vậy các người muốn chúng tôi làm gì?"
 namarian.522.e: "Không hứng thú."
 namarian.523.desc: "Tụi tao cần thấy lợi ích thực tế. Cầm chắc trong tay §Y1000§!£energy£ dù sao cũng ăn đứt ba cái lời hứa suông của lũ ngụ cư thiên thể [other_empire.GetAdj]."
 namarian.523.c: "Đồng ý."
 namarian.523.a: "Không đời nào."
 namarian.523.b: "Chúng tôi không kham nổi."
 namarian.524.desc: "Cầu mong bóng râm che chở cho các người, [Root.GetRulerName]. Tàu bè sẽ đến đúng hẹn — không thiếu một chiếc nào. Chúc mọi sự tốt lành."
 namarian.524.a: "Ngắt đường truyền."
 namarian.525.desc: "Thật không may chút nào.\n\nCầu chúc ngày mát lành và đêm ấm áp luôn kề bên các người, hỡi những kẻ ngụ cư thiên thể."
 namarian.525.desc.poor: "Chỉ toàn nóng nực và khô cằn. Thật chẳng may chút nào. Chúng ta từng ngỡ rằng [Root.GetName] sẽ là bến đỗ bình yên nhất cho đoàn tàu của mình."
 namarian.525.a: "Ngắt đường truyền."
 namarian.526.desc: "Chúng ta hiểu mà.\n\nHỡi kẻ ngụ cư thiên thể, mong rằng sau này không bên nào trong chúng ta phải hối hận vì quyết định ngày hôm nay.\n\nNgắt liên lạc."
 namarian.526.a: "Tạm biệt."
 namarian.530.title: "Tàu du mục đã bàn giao"
 namarian.530.desc.15ships: "Theo đúng thỏa thuận giữa chúng ta với hạm đội du mục Kẻ Đạp Sóng, §Y5§! con tàu vũ trang đã được chuyển tới hệ sao [Root.Capital.GetStarName], hiện đang neo đậu trên quỹ đạo thủ đô của ta."
 namarian.530.desc.30ships: "Theo đúng hợp đồng giữa chúng ta với hạm đội du mục Kẻ Đạp Sóng cùng những kẻ tự ý hành động trong nội bộ họ — tổng cộng §Y10§! con tàu vũ trang từ cả hai bên đã được chuyển tới hệ sao [Root.Capital.GetStarName], hiện đang neo đậu trên quỹ đạo thủ đô ta."
