 shard_collected: "Đã thu thập mảnh vỡ"
 crystals_2_chain_title: "Tinh thể Biến ảo"
 crystals_2_chain_desc: "Phá hủy 4 hạm đội thực thể tinh thể để thu thập thêm dữ liệu kịch bản chiến đấu."
 crystals_shattered: "Tinh thể đã vỡ vụn"
 drones_1_chain_title: "Phân tích Drone Khai thác"
 drones_1_chain_desc: "Cố gắng tháo dỡ và lắp ráp ngược một drone khai thác."
 drone_disassembled: "Drone đã bị tháo rời"
 clouds_1_chain_title: "Hư Không Vân"
 clouds_1_chain_desc: "Tiêu diệt một Hư Không Vân để thu thập tinh chất nguyên thủy của nó."
 stardust_sifted: "Đã thu được Bụi Sao"
 mineral_planet_chain_title: "Mục tiêu Khoáng sản Giá trị cao"
 mineral_planet_chain_desc: "Sử dụng công nghệ từ hệ thống đánh giá của các drone khai thác cổ đại, chúng ta đã định vị được một số thiên thể giàu tài nguyên khoáng sản."
 systems_visited: "Khảo sát địa chất đã hoàn thành"
 mineral_planet_poi_title: "Giàu tài nguyên khoáng sản"
 mineral_planet_poi_desc: "Sử dụng công nghệ từ hệ thống đánh giá của các drone khai thác cổ đại, chúng ta đã định vị được một số hệ sao mà các hành tinh trong đó có khả năng chứa lượng lớn khoáng sản."
 cloud_chain_title: "Lưu Vân"
 cloud_chain_desc: "Tất cả các Hư Không Vân đều được kết nối ở cấp độ lượng tử; các mẫu thực thể phát năng lượng này rất có thể là những biểu hiện khác nhau của một thực thể không gian phụ duy nhất.\n\nSau khi nghiên cứu kỹ một Hư Không Vân, chúng ta đã tìm thấy các hệ sao khác có thể giàu các đám mây này."
 clouds_watched: "Đã quan sát Hư Không Vân"
 cloud_poi_title: "Hệ sao Hư Không Vân"
 cloud_poi_desc: "Dựa theo lý thuyết rối lượng tử, các hệ sao này chính là nhà của Hư Không Vân."
 ### Dị thường
 find_sol_chain_title: "Tọa độ Hệ sao"
 find_sol_chain_desc: "Một cổ vật ngoại hành tinh cung cấp tọa độ của một hệ sao cụ thể."
 sol_1_poi: "Mặt trời"
 sol_1_desc_neutral: "Chủng tộc gửi đi cổ vật này chắc hẳn đến từ đây. Tốt nhất là nên điều tra một chút."
 found: "Phát hiện hệ sao ngoại hành tinh"
 old_gods_shrine_poi_1: "Vị trí Đền cổ nghi vấn thứ nhất"
 old_gods_shrine_poi_1_desc: "Các chỉ số đo đạc bức xạ cho thấy một vật thể tương tự Đền cổ của Đấng Không danh tính đang quay quanh ngôi sao này."
 old_gods_shrine_poi_2: "Vị trí Đền cổ nghi vấn thứ hai"
 old_gods_shrine_poi_2_desc: "Các chỉ số đo đạc bức xạ cho thấy một vật thể khác tương tự Đền cổ của Đấng Không danh tính đang quay quanh ngôi sao này."
 old_gods_shrine_poi_3: "Vị trí Đền cổ nghi vấn thứ ba"
 old_gods_shrine_poi_3_desc: "Các chỉ số đo đạc bức xạ cho thấy vật thể thứ ba tương tự Đền cổ của Đấng Không danh tính đang quay quanh ngôi sao này."
 shrine_object: "Đền cổ giữa các vì sao"
 shrine_object_tooltip: "Đền thờ dành cho một trong các cổ thần của chúng ta, đã thất lạc giữa vũ trụ."
 shrine_object_desc: "Đền thờ dành cho một trong các cổ thần của chúng ta, đã thất lạc giữa vũ trụ."
 old_gods_chain_title: "Điện thờ Cổ thần"
 old_gods_chain_desc: "Sau khi phát hiện đền cổ bí ẩn trên tiểu hành tinh của Đấng Không danh tính, nhà khoa học trưởng cho rằng có thể còn các điện thờ cổ thần khác mà chúng ta — hoặc những kẻ tự nhận là chúng ta — tôn thờ tồn tại trong các hệ sao lân cận."
 shrines_searched: "Đã tìm kiếm Đền cổ"
 ransomeer_chain_title: "Những kẻ Bắt cóc liên sao"
 ransomeer_chain_desc: "Một nhóm hải tặc tự xưng là 'Những kẻ Bắt cóc liên sao' đang giam giữ thủy thủ đoàn của một tàu vận tải tư nhân [Root.GetSpeciesAdj].\n\nChúng ta muốn giải cứu họ trước khi lũ hải tặc đưa ra các điều kiện."
 captive_crew_rescued: "Đã giải cứu thủy thủ đoàn bị bắt cóc"
 ransomeer_poi_title: "Căn cứ Những kẻ Bắt cóc liên sao"
 ransomeer_poi_desc: "Những kẻ Bắt cóc liên sao đã thiết lập một căn cứ tại một trạm khai thác ngoại hành tinh bỏ hoang."
 wrecked_fleet_chain_title: "Chiến trường trôi dạt"
 wrecked_fleet_chain_desc: "Hàng nghìn năm trước, các thành viên trong một hạm đội đã phản bội lời thề và chĩa súng vào nhau. Vì quá hiểu rõ đối phương, các con tàu của đồng minh đã bị tiêu diệt trong chớp mắt, chỉ để lại những xác tàu rỗng tuếch đã mất áp suất.\n\nChúng ta đã thu thập đủ thông tin để xây dựng mô hình quá trình những tàn tích hạm đội này trôi dạt chậm chạp trong vũ trụ."
 wrecked_fleet_poi_title: "Vị trí dự tính"
 wrecked_fleet_poi_desc: "Chúng ta đã tính toán được vị trí đại khái của chiến trường trôi dạt trong hệ sao hiện tại. Nếu có cơ hội, tốt nhất nên tới hiện trường điều tra."
 battlefield_located: "Chiến trường đã được điều tra xong"
 ### Sự kiện Khởi đầu - Khao khát khám phá
 rogue_scientist_1_chain_title: "Lãng tích Tinh hà: Nhà khoa học phản bội"
 rogue_scientist_1_chain_desc: "Chủ tịch Hội đồng Khoa học Lý thuyết của [Root.GetName] đã mất tích cùng một nguyên mẫu tàu nghiên cứu phi truyền thống.\n\nChúng ta đã khoanh vùng tung tích của họ tại ba địa điểm khả thi, có thể lần lượt kiểm tra."
 likely_locations_searched: "Các địa điểm khả thi đã tìm kiếm xong"
 rogue_scientist_2_chain_title: "Lãng tích Tinh hà: Truy vết nhiệt"
 rogue_scientist_2_chain_desc: "Chủ tịch lại biến mất một lần nữa, nhưng lần này họ đã để lại vài dấu vết."
 scientist_pursued: "Đã truy vết được nhà khoa học"
 rogue_scientist_3_chain_title: "Lãng tích Tinh hà: Đối mặt"
 rogue_scientist_3_chain_desc: "Bất kể động cơ của họ là gì, phải đưa Chủ tịch trở lại [Root.Capital.GetName].\n\nHọ sẽ viết nên những luận văn mang tính cách mạng hay chỉ phải nhận hình phạt kỷ luật? Chúng ta hãy cùng chờ xem."
 scientist_apprehended: "Đã bắt giữ nhà khoa học"
 scientist_poi_1: "Vị trí cuối cùng được biết"
 scientist_poi_1_desc: "Vị trí cuối cùng được biết của tàu nghiên cứu thuộc về Chủ tịch, nằm ngoài ranh giới hệ sao [Root.Capital.GetStarName]."
 scientist_poi_2: "Điểm đến cuối cùng được nhắc tới"
 scientist_poi_2_desc: "Dựa trên thông điệp cuối cùng họ gửi về [Root.Capital.GetName], đây chính là điểm đến của Chủ tịch."
 scientist_poi_3: "Điểm kết thúc FTL dự kiến"
 scientist_poi_3_desc: "Tình cờ thay, một mảng cảm biến tầm xa của [Root.Capital.GetName] đã phát hiện ra tín hiệu năng lượng yếu ớt nghi là do di chuyển vượt ánh sáng để lại.\n\nLộ trình này không khớp với bất kỳ tuyến đường đã biết nào, rất có thể là do nhà khoa học trưởng để lại."
 scientist_poi_4: "Tiếp tục truy dấu"
 scientist_poi_4_desc: "Sau khi giải mã được đặc trưng năng lượng đặc biệt của nguyên mẫu tàu nghiên cứu, chúng ta đã thực hiện một vài phép toán phức tạp và cuối cùng đã biết Chủ tịch đã trốn sang hệ sao nào."
 scientist_poi_5: "Một chút cơ hội"
 scientist_poi_5_desc: "Có vẻ Chủ tịch sắp tới được điểm đến cuối cùng của họ."
 ### Sự kiện Khởi đầu - Tuyệt chủng hàng loạt
 mass_extinction_chain_title: "Đại tuyệt chủng qua các thời đại"
 mass_extinction_chain_desc: "Để tránh những hậu quả nghiêm trọng từ một thảm họa có thể xảy ra trên [Root.Capital.GetName], chúng ta phải nghiên cứu hậu quả của các thảm họa trên những hành tinh khác."
 massex_analyzed: "Tái dựng kịch bản đại tuyệt chủng"
 massex_poi_1: "Hành tinh vỡ vụn"
 massex_poi_1_desc: "Vành đai tiểu hành tinh bao quanh hành tinh là nhân chứng duy nhất cho một thảm họa kinh hoàng từng ập xuống nơi đây."
 massex_poi_2: "Hành tinh rực cháy"
 massex_poi_2_desc: "Hành tinh này đã bị nuốt chửng bởi dòng dung nham địa ngục của chính nó."
 massex_poi_3: "Hành tinh hoang vu"
 massex_poi_3_desc: "Hành tinh này dù rất phù hợp cho sự sống sinh sôi nhưng lại vô cùng trống trải."
 massex_poi_4: "Hành tinh đầy khí độc"
 massex_poi_4_desc: "Lớp khí độc bao phủ toàn bộ bầu khí quyển hành tinh dường như chỉ mới xuất hiện gần đây."
 massex_poi_5: "Hành tinh băng giá"
 massex_poi_5_desc: "Dữ liệu quan sát thiên văn cho thấy trong quá khứ hành tinh này không hề lạnh lẽo và hoang vu như vậy."
 ####################################
 # Sự kiện Khai hóa (Tiếp)
 ####################################
 UPLIFT_SNAKEOID_CAT: "Trườn"
 UPLIFT_SNAKEOID_CAT_DESC: "Có thứ gì đó đang di chuyển trong cát của [Root.GetName]..."
 UPLIFT_GENERIC_CAT: "Dường như là một họ hàng gần"
 UPLIFT_GENERIC_CAT_DESC: "Có thứ gì đó đang di chuyển bên dưới [Root.GetName]..."
 UPLIFT_OCEAN_CAT: "Sinh vật thủy sinh"
 UPLIFT_OCEAN_CAT_DESC: "Vùng biển của [Root.GetName] và các khu vực lân cận đều có dấu hiệu sự sống rất rõ ràng."
 UPLIFT_ARID_CAT: "Giám sát hoang mạc"
 UPLIFT_ARID_CAT_DESC: "Ngay cả các mảng kính quang học hiệu năng thấp cũng có thể dễ dàng nhận dạng dấu vết hoạt động của sinh vật trên bề mặt [Root.GetName]."
 UPLIFT_CONTINENTAL_CAT: "Giữa Đất và Biển"
 UPLIFT_CONTINENTAL_CAT_DESC: "Ngay cả trên một hành tinh nửa là đất đá nửa là nước biển, sự sống vẫn có thể sinh tồn ngoan cường."
 UPLIFT_TROPICAL_CAT: "Khá ẩm ướt"
 UPLIFT_TROPICAL_CAT_DESC: "Môi trường trên [Root.GetName] rất thích hợp cho sự sống sinh sôi, ít nhất là cho vi sinh vật — những sinh vật lớn hơn chắc cũng ổn."
 UPLIFT_TUNDRA_CAT: "Sinh vật nhiệt độ thấp"
 UPLIFT_TUNDRA_CAT_DESC: "[Root.GetName] băng giá, quét quang học không hiệu quả, nhưng đặc trưng nhiệt cho thấy có vài hoạt động sự sống dưới bề mặt."
 UPLIFT_ARCTIC_CAT: "Trên lớp băng dày"
 UPLIFT_ARCTIC_CAT_DESC: "Giữa lớp băng vĩnh cửu và những trận bão tuyết của [Root.GetName], có các sinh vật đang di chuyển."
 UPLIFT_DESERT_CAT: "Cát vàng mịt mù"
 UPLIFT_DESERT_CAT_DESC: "Thật khó tưởng tượng nổi trên [Root.GetName] lại có sự sống, bề mặt là một biển phân tử silicat vô tận. Nhưng dù vậy..."
 UPLIFT_ROACHOID_CAT: "Bò trên bề mặt hành tinh"
 UPLIFT_ROACHOID_CAT_DESC: "Lũ động vật chân khớp đang di chuyển dễ dàng trên [Root.GetName]."
 ####################################
 # Thất bại & Thất bại Nghiêm trọng khi khảo sát Dị thường
 ####################################
 #ROOT = PHẠM VI TÀU
 #FROM.FROM = PHẠM VI HÀNH TINH (nếu được kích hoạt từ danh mục hiện tượng lạ)
 anomaly_failure.2500.desc: "Khi quan sát gần, tiểu hành tinh [From.From.GetName] vô cùng yên tĩnh. Một trợ lý của [Root.GetLeaderName] cuối cùng đã thừa nhận rằng họ có thể đã đọc sai dữ liệu thiết bị."
 anomaly_failure.2501.desc: "[Root.GetName] vất vả di chuyển trong vùng tàn tích dày đặc quanh [From.From.GetName]. Đến khi [Root.GetLeaderName] và thủy thủ đoàn tới nơi, dữ liệu từng bắt được trên cảm biến đã biến mất."
 anomaly_failure.2502.desc: "Các đợt quét bề mặt [From.From.GetName] của tàu [Root.GetName] đều không thu được kết quả. Chúng ta đã tốn thời gian và tài nguyên để điều tra tỉ mỉ hành tinh này nhưng cuối cùng chẳng thu được gì, đặc viên khoa học [Root.GetLeaderName] đã gửi lời xin lỗi chân thành tới mọi người."
 anomaly_failure.2503.desc: "Cảnh tượng hùng vĩ nhìn từ không gian khi tới gần thường chẳng còn đẹp như vậy. [Root.GetName] đã bay quanh [From.GetName] một thời gian để nghiên cứu tình trạng mài mòn của nó, đặc viên khoa học [Root.GetLeaderName] cuối cùng xác nhận cấu trúc hành tinh không phải do trí tuệ tạo ra mà do các yếu tố khí tượng thông thường."
 anomaly_failure.2504.desc: "Trước khi thủy thủ đoàn [Root.GetName] có thể định vị chính xác tín hiệu cầu cứu từ bề mặt cực nóng của [From.From.GetName], tín hiệu đã biến mất. Vì không có tọa độ địa lý chính xác, đặc viên khoa học [Root.GetLeaderName] cảm thấy việc mạo hiểm thực hiện chiến dịch cứu hộ là quá nguy hiểm."
 anomaly_failure.2535.desc: "Đặc viên khoa học [Root.GetLeaderName] của [Root.GetName] báo cáo rằng cấu trúc bề mặt [From.From.GetName] không phải là điểm đáng quan tâm, tiếp tục nghiên cứu chỉ lãng phí thời gian."
 anomaly_failure.2540.desc: "Các thành viên [Root.GetName] báo cáo rằng tiểu hành tinh được chạm khắc thành hình đền thờ thực sự rất đẹp.\n\nTrên đây là toàn bộ nội dung báo cáo."
 anomaly_failure.2545.desc: "Đội [Root.GetLeaderName] lên tàu nhận thấy âm thanh độc đáo của [From.From.GetName] thực chất là tiếng các sinh vật hoang dã trên hành tinh đang hát cùng nhau.\n\nHọ cảm thấy việc tiếp tục điều tra là không phù hợp."
 anomaly_failure.2550.desc: "[Root.GetName] đã không thể thu thập được bất kỳ mẫu vật giá trị nào từ hành tinh khí đóng băng [From.From.GetName]."
 anomaly_failure.2555.desc: "Cảm biến của [Root.GetName] phát hiện ra một cấu trúc công nghệ ngoại hành tinh rất sơ khai. Đặc viên khoa học [Root.GetLeaderName] vì quá nóng lòng khởi động nó nên rốt cuộc lại làm hỏng nó."
 anomaly_failure.2560.desc: "Đặc viên khoa học [Root.GetLeaderName] đã soạn một báo cáo nói rằng họ cảm thấy rất không hài lòng vì phải nghiên cứu [From.From.GetName], bởi chẳng tìm thấy thứ gì có giá trị."
 anomaly_failure.2600.desc: "[Root.GetName] đã chuyển động quanh [From.GetName] một thời gian, theo dõi các bức xạ 24/7. Lúc này đặc viên khoa học [Root.GetLeaderName] quyết định mặc bộ du hành vũ trụ lên tiểu hành tinh để lấy mẫu khoáng sản.\n\nSau khi họ đặt chân lên bề mặt, công suất truyền sóng vô tuyến của [From.From.GetName] đột ngột tăng lên theo cấp số nhân. Sóng vi ba chỉ trong vài phút đã nướng chín [Root.GetLeaderName]."
 anomaly_failure.2601.desc: "Ngay sau khi [Root.GetName] đi vào vùng mảnh vỡ dày đặc quanh [From.From.GetName], chúng ta đã mất liên lạc.\n\nVài ngày sau, chúng ta tìm thấy một khoang cứu sinh ở rìa hiện trường; đặc viên khoa học [Root.GetLeaderName] đã sống sót, nhưng không nhớ nổi chuyện gì đã xảy ra với tàu [Root.GetName] và thủy thủ đoàn."
 anomaly_failure.2602.desc: "Việc thăm dò thô bạo của nhà khoa học [Root.GetLeaderName] đối với [From.GetName] đã chọc giận hai con §YTiêu Dương Kỳ (Tiyanki)§! khổng lồ trên quỹ đạo hành tinh. Những sinh vật này đang đe dọa nghiêm trọng tới tàu [Root.GetName]."
 anomaly_failure.2603.desc: "Cấu trúc kỳ lạ trên [From.From.GetName] là một cái bẫy cổ xưa. Trước khi [Root.GetName] kịp hạ cánh, tàu đã bị vài drone chiến đấu cổ đại phục kích."
 anomaly_failure.2604.desc: "[Root.GetName] đã bị dòng nham thạch phun trào từ bề mặt [From.From.GetName] bắn trúng khi đang bay thấp để tìm tín hiệu cầu cứu.\n\nKhông ai sống sót."
 anomaly_failure.2635.desc: "Theo báo cáo từ [Root.GetName], điểm đáng chú ý trên [From.From.GetName] là nơi đây từng có khu vui chơi giải trí riêng biệt. Kiến trúc này có từ bao giờ, tại sao ban đầu lại xây trên [From.From.GetName] vẫn chưa thể xác định.\n\nThủy thủ đoàn [Root.GetName] cũng báo cáo về cái chết của đặc viên khoa học, người đã bị kiến trúc giống 'vòng quay mặt trời' đè bẹp."
 anomaly_failure.2640.desc: "Đặc viên khoa học [Root.GetLeaderName] vẫn khẳng định rằng thủy thủ đoàn [Root.GetName] chẳng tìm thấy gì bên trong tiểu hành tinh [From.From.GetName] rỗng tuếch được chạm khắc hoa mỹ.\n\nNhưng dường như đã có sự thay đổi nào đó trên người nhà khoa học."
 anomaly_failure.2645.desc: "Trong thông điệp cuối cùng, các thành viên [Root.GetName] đã quan sát thấy vài tiếng động khi tới gần bề mặt [From.From.GetName]. Sau đó liên lạc bị ngắt, tàu và toàn bộ thủy thủ đoàn mất tích, có thể đã tử nạn."
 anomaly_failure.2650.desc: "Thủy thủ đoàn [Root.GetName] để thu thập càng nhiều mẫu lớp băng càng tốt đã khiến tàu bay thấp hơn độ cao an toàn tối thiểu. Chất lưu siêu tới hạn trong khí quyển đã lọt vào bộ đẩy phía sau của tàu, gây ra hậu quả thảm khốc.\n\nKhông một ai sống sót."
 anomaly_failure.2655.desc: "Khi [Root.GetName] tới gần [From.From.GetName], nó đã bị vài tàu buôn lậu thù địch chặn lại. Những kẻ này đã tấn công tiểu hành tinh, hủy sạch mọi bằng chứng về hoạt động của chúng trước đó. Mục tiêu tiếp theo chắc chắn là [Root.GetName]."
 anomaly_failure.2660.desc: "Thành viên [Root.GetName] báo cáo rằng đặc viên khoa học đặc biệt hứng thú với cơn mưa trên [From.From.GetName], theo lời họ thì 'nước mưa ở đó hóa ra lại có màu tím'.\n\nKhông may là các mẫu khoáng sản này vô cùng không ổn định, đã gây ra một vụ nổ trong phòng thí nghiệm của tàu [Root.GetName], đặc viên khoa học tử vong tại chỗ."
 anomaly_failure.2665.desc: "Trong thông điệp cuối cùng, các thành viên [Root.GetName] đã quan sát thấy vài tiếng động khi tới gần bề mặt [From.From.GetName]. Sau đó liên lạc bị ngắt, tàu và toàn bộ thủy thủ đoàn mất tích, có thể đã tử nạn."
 anomaly_failure.2670.desc: "Thực tế là việc hăng hái điều tra các hệ thống cấu trúc kiểu cũ của [Root.GetName] đã phản tác dụng.\n\nTrước khi các mạch điện cổ đại bị nóng chảy hoàn toàn, [Root.GetName] đã kịp kích hoạt từ xa bộ đẩy đổi hướng của trạm quỹ đạo — kịp thời đá nó ra khỏi quỹ đạo cũ và rơi vào giếng trọng lực của hành tinh. Kết quả không may của nhiệm vụ này đã để lại ảnh hưởng sâu sắc tới chỉ huy [Root.GetLeaderName], người đã trưởng thành hơn từ trải nghiệm này."
 anomaly_failure.2670.a: "[Root.GetLeaderName]... đã phóng nó vào ngôi sao sao?"
 anomaly_failure.2670.a.tooltip: "§YNhà máy Cổ đại§! đã bị phá hủy."
 ####################################
 # Sự kiện Thuộc địa
 ####################################
 ### Drone Văn minh Cổ đại
 colony.1500.name: "Mở màn"
 colony.1500.desc: "Có biến động trên vệ tinh của [Root.GetName].\n\nQuét sơ bộ cho thấy vài công nghệ cổ đại đã được kích hoạt, có lẽ là phản ứng lại hành vi thuộc địa hóa của chúng ta.\n\nVài nhà khoa học hàng đầu của chúng ta rất muốn đi điều tra vệ tinh này, và đã chuẩn bị sẵn một dự án nghiên cứu đặc biệt."
 colony.1500.a: "Họ đương nhiên là có hứng thú rồi."
 colony.1501.name: "Drone Cổ đại: Phát hiện"
 colony.1501.desc: "Đây chắc chắn là một nhóm drone khó kiểm soát.\n\nSự sai sót trong nhận diện địch ta của đám drone đã xóa tan nỗi thất vọng trước đó — chúng coi chúng ta là chủng tộc chủ nhân đã khuất! Có vẻ chúng rất phấn khích khi thấy chúng ta — nếu thứ trí tuệ nhân tạo già cỗi này có chức năng 'phấn khích'. Nhưng không may là đám drone này đã nhanh chóng rơi vào trạng thái ngủ đông lần nữa, và chúng ta không thể đánh thức chúng.\n\nNếu vậy, chi bằng cứ tháo ra xem thử đi."
 colony.1501.a: "Luôn chú ý tình hình."
 colony.1502.name: "Drone Cổ đại: Thức tỉnh"
 colony.1502.desc: "Những drone này đã tỉnh lại từ giấc ngủ đông và tiến tới bề mặt [Root.GetName]. Chúng lịch sự từ chối các giao tiếp thân thiện của chúng ta và bắt đầu cải tạo môi trường một khu vực nhỏ trên hành tinh. Chúng ta không rõ mục đích hành động này là gì, nhưng có vẻ nó vô hại đối với thuộc địa."
 colony.1502.a: "Ờ, miễn là hành vi của chúng có ích cho chúng ta là được..."
 colony.1502.a.tooltip: "Drone đã dọn dẹp một £blocker£§YChướng ngại địa khối§! ngẫu nhiên từ bề mặt mà không động chạm tới những chỗ khác.\n"
 colony.1503.name: "Drone Cổ đại: Chạm tới bầu trời quá khứ"
 colony.1503.desc: "Các drone ngủ đông trên vệ tinh [Root.GetName] lần lượt thức tỉnh, và những gì chúng làm mang lại cả niềm vui lẫn nỗi lo.\n\nDưới sự quan sát của vô số camera trên trời, chúng đã dựng lên khung sườn ban đầu cho một kiến trúc khổng lồ ngay sát thuộc địa chính của chúng ta trên [Root.GetName] trong đêm tối. Các kỹ sư cho rằng đây là một sản phẩm lỗi thời mang tên 'Thang máy không gian', có lẽ rất phổ biến trong thời đại trước khi người [Root.Owner.GetSpeciesName] chúng ta bước vào hành trình liên sao. Cuối cùng chúng ta vẫn phải phá hủy nó vì nó cản trở sự phát triển của thuộc địa, nhưng để phá hủy an toàn thì cần chút thời gian. Các kỹ sư của chúng ta vừa hay cũng muốn nghiên cứu kỹ cái này."
 colony.1503.a: "Cứ mặc kệ chúng đi."
 colony.1504.name: "Drone Cổ đại: Bản tính hào phóng"
 colony.1504.desc: "Sau khi thức tỉnh lần nữa, những drone này tạm thời biến mất khỏi cảm biến. Khi trở lại, chúng kéo theo một hòm lớn chứa khoáng sản không rõ vận chuyển từ đâu tới. Sau khi phát ra một tín hiệu truyền tải bị hư hại nghiêm trọng báo hiệu đã hoàn thành nhiệm vụ được giao, chúng bỏ lại số khoáng sản đó trên bề mặt [Root.GetName].\n\nSau đó chúng quay trở lại mặt trăng."
 colony.1504.a: "Khoáng sản miễn phí, chuyện tốt thế này không thường xuyên có đâu."
 colony.1505.name: "Drone Cổ đại: Họ hàng xa"
 colony.1505.desc: "Tín hiệu tăng vọt trên vệ tinh nhắc nhở chúng ta rằng drone trên [Root.GetPlanetMoon] đã thức tỉnh lần nữa. Lần này nó mang tới cho chúng ta một món đồ tốt: một vệ tinh cổ đại được đào lên từ lòng đất sâu. Và chúng đã tiến hành tu sửa nó ở một mức độ nhất định. Chúng ta không rõ tại sao vệ tinh lại nằm ở đây, cũng không biết tại sao đến tận bây giờ đám drone mới đào nó lên. Dù vậy, ngay cả khi chỉ một phần nhỏ cơ sở dữ liệu của nó được bảo tồn, cũng đủ để chúng ta hiểu về cuộc sống thường nhật của đế chế từng là chủ nhân của đám drone này."
 colony.1506.name: "Drone Cổ đại: Sự sụp đổ của Drone"
 colony.1506.desc: "Đám drone vốn luôn im lìm đã có sự chuyển biến lớn, không còn thực hiện những chuyển động bất quy tắc nữa. Một phần thức tỉnh, tiến vào bầu khí quyển [Root.GetName] như thường lệ, nhưng lại đâm sầm hết tốc lực xuống mặt đất hành tinh.\n\nTình trạng tương tự liên tục xảy ra.\n\nThuộc địa không chịu nhiều tổn thất, nhưng những drone mỏng manh này đã biến thành những đống sắt vụn lóe lên tia lửa xanh, như đang kể về quyết tâm và sức mạnh tự hủy diệt của chúng."
 colony.1506.a: "Chúng ta có thể tìm hiểu xem rốt cuộc chúng bị làm sao không?"
 colony.1507.name: "Drone Cổ đại: Tìm kiếm Drone"
 colony.1507.desc: "Sau sự kiện tự sát, số drone còn lại đã biến mất. Các nhà sử học trên [Root.GetName] cho rằng chúng vẫn quanh quẩn đâu đây, ẩn mình dưới sự bảo vệ của một công nghệ đã thất lạc nào đó, nhưng chúng đã không thức tỉnh vào thời điểm đáng lẽ phải thức tỉnh.\n\nViệc phân tích chuyên sâu tàn tích drone tự sát tiến triển chậm chạp, nhưng chắc sẽ sớm có đột phá thôi."
 colony.1507.a: "Có tin gì mới thì báo cho tôi ngay."
 colony.1508.name: "Drone Cổ đại: Đãi vàng"
 colony.1508.desc: "Thời gian dành để tìm kiếm trục trặc bên trong những drone vỡ vụn lâu hơn dự kiến, vì cấu trúc bên trong và các bộ phận lắp ráp của mỗi drone đều không giống nhau. Biết được điều này, ưu tiên hàng đầu là phải tìm ra các bộ phận tương đồng. Nhìn riêng rẽ các bộ phận này, nếu do người ngoài hành tinh chế tạo, thì chắc chắn là đồ hiện đại. Như vậy rất có thể là ai đó đã làm được điều chúng ta không làm được, đó là can thiệp vào đám drone này."
 colony.1508.a: "Việc này đòi hỏi chúng ta phải điều tra sâu hơn."
 colony.1509.name: "Drone Cổ đại: Thứ người ngoài hành tinh chưa thấy"
 colony.1509.desc: "Sau khi lắp ráp chúng lại, các chuyên gia của chúng ta cho rằng những bộ phận ngoại lai bên trong xác drone là thiết bị liên lạc một chiều. chúng không ở trạng thái nhận, nên chúng ta có thể suy luận rằng những drone này không hoạt động theo lệnh của bên thứ ba, mà là có cá nhân nào đó luôn giám sát hoạt động của chúng. Đề xuất điều tra thêm về việc này."
 colony.1509.a: "Tiếp tục tiến hành giám sát."
 colony.1510.name: "Drone Cổ đại: Câu trả lời từ trời cao"
 colony.1510.desc: "Chúng ta đã tìm thấy số drone còn lại, chúng đang trôi dạt trên quỹ đạo của [Root.GetPlanetMoon].\n\nChúng ta đã biết được chúng chỉ là những quân tốt trong kế hoạch chu toàn của một phe phái nào đó. Theo những gì chúng ta nắm giữ về các hoạt động tương tự, phe phái này rất có thể là một tập đoàn hải tặc đặc biệt cổ xưa và tinh khôn. Họ đã phát hiện ra đám drone này trước chúng ta, làm được điều chúng ta không làm được: cải tạo chúng. Dù nghe có vẻ không ghê gớm lắm — những gì họ làm chỉ là đưa công nghệ ngoại lai riêng lẻ vào drone, nhưng trình độ công nghệ của đám hải tặc không gian này cao hơn chúng ta rất nhiều, ít nhất là trong một số lĩnh vực. Sau khi lắp đặt xong, đám hải tặc thả chúng trở lại không gian, chúng biết mục đích của các drone này là để giúp chủ nhân cũ xây dựng thuộc địa, và theo thời gian, khả năng nhận diện chủ nhân của drone đang yếu đi. Drone liên tục giúp chúng ta xây dựng thuộc địa, còn hải tặc liên tục giám sát, chờ đợi thời cơ tốt nhất để phát động tấn công.\n\nCác chuyên gia phân tích chiến đấu của chúng ta dự đoán đám hải tặc này sẽ tấn công trong vòng hai năm tới."
 colony.1510.a: "Cứ tới đây."
 colony.1510.b: "Chiếm lấy drone, dùng chúng để tiêu diệt chủ nhân tương lai của chúng."
 colony.1510.c: "Chúng ta không thể để chuyện này tiếp diễn nữa. Tháo dỡ toàn bộ drone."
 colony.1511.name: "Drone Cổ đại: Vĩnh biệt"
 colony.1511.desc: "Chúng ta đã chiếm được số drone và nhồi đầy thuốc nổ mạnh vào chúng. Chúng ta đã biết cách tháo dỡ nên việc cài đặt lại cũng không quá khó, chúng ta đã chuẩn bị một 'bữa tiệc' lớn cho hạm đội hải tặc tại vị trí chúng có khả năng đi qua. Các nhà khoa học [Root.Owner.GetSpeciesName] hàng đầu đã cài cắm công nghệ nhận diện địch ta của chúng ta để giảm thiểu tối đa tỷ lệ gây thương vong cho dân thường."
 colony.1511.a: "Để chúng đi đi."
 colony.1512.name: "Drone Cổ đại: Vết thương và Sợ hãi"
 colony.1512.desc: "Hạm đội hải tặc tới đánh, sớm hơn dự kiến. Đòn phủ đầu của chúng ta đã thành công đánh đòn tâm lý và chọc giận chúng — quy mô hạm đội giảm 30% so với dự tính."
 colony.1513.name: "Drone Cổ đại: Chúng ở khắp mọi nơi"
 colony.1513.desc: "Hạm đội hải tặc tới đánh, muộn hơn dự kiến. Nhìn từ thành phần và đội hình hạm đội, chúng đã tìm thêm đồng minh để nhanh chóng tiêu diệt [Root.GetName]."
 colony.1513.a: "Tuyệt đối không cho phép chúng làm vậy."
 colony.1514.name: "Drone Cổ đại: Quyết chiến"
 colony.1514.desc: "Thời điểm đã tới, hạm đội hải tặc tới đúng hẹn."
 colony.1514.a: "Chúng ta đã nóng lòng muốn chiến đấu từ lâu rồi."
 ### Phấn hoa kích dục Mharin Kharin
 colony.1520.name: "Mharin Kharin: Sức hút của Hoa"
 colony.1520.desc: "Chúng ta đã thiết lập thuộc địa trên [Root.GetName], một số thực vật địa phương đang giải phóng lượng lớn phấn hoa chứa thành phần hóa học phức tạp.\n\nMột dự án nghiên cứu đặc biệt đã được chuẩn bị để nghiên cứu loài thực vật này."
 colony.1521.name: "Mharin Kharin: Đánh thức khứu giác"
 colony.1521.desc: "Việc tiếp xúc lâu dài với phấn hoa trong khí quyển [Root.GetName] sẽ gây ra hiệu ứng kích dục nhẹ lên các thụ thể pheromone, kéo theo đó là một trạng thái 'hưng phấn' khó nhận ra. Những loài thực vật có hiệu quả mạnh nhất rất phổ biến trên khắp hành tinh này; chúng được các nhà khoa học trên [Root.GetName] lưu trữ tại một nơi kín đáo, trong ngôn ngữ địa phương của [Root.Owner.GetSpeciesName] được gọi là 'Mharin Kharin'."
 colony.1521.b: "Chúng ta không thể để thứ ảnh hưởng đến tâm trí này tồn tại trong khí quyển."
 colony.1521.c: "Chúng ta có biện pháp tiêu diệt hoàn toàn loài thực vật này."
 colony.1522.name: "Mharin Kharin: Chuẩn bị đối phó với hoa"
 colony.1522.desc: "Báo cáo từ [Root.GetName] cho thấy hiệu suất làm việc gần đây bắt đầu sụt giảm, ổn định ở mức thấp hơn vài điểm phần trăm so với mức trung bình của [Root.Owner.GetName].\n\nĐiều này có thể do phấn hoa gây kích thích trên hành tinh gây ra.\n\nRất có thể là vậy.\n\nMột §Ydự án đặc biệt§! đã được khởi động để nghiên cứu sâu hơn, với hy vọng nâng cao hiệu suất dây chuyền sản xuất để bù đắp tổn thất."
 colony.1522.a: "Để xem chúng ta có thể làm được gì."
 colony.1523.name: "Mharin Kharin: Nghiên cứu hoa"
 colony.1523.desc: "Thông qua cuộc cách mạng sâu sắc về mô hình quản lý thời gian trên [Root.GetName] và phân bổ lại trách nhiệm cũng như các chức trách trong mọi lĩnh vực sản xuất, chúng ta đã thu được hiệu quả tốt. Yêu cầu của đại chúng rất rõ ràng, mà các quan sát viên bên ngoài sẽ gọi đó là nhu cầu công khai, đó là duy trì mối liên hệ chặt chẽ với quần thể thực vật địa phương.\n\nTuy nhiên, ngay cả khi áp dụng phân bổ thời gian hợp lý và kiểm tra tức thời bổ sung, hiệu suất sản xuất vẫn rất thấp, chỉ là ít nhất đã thoát khỏi mức tối thiểu không thể chấp nhận được."
 colony.1523.a: "Làm tốt lắm."
 colony.1524.name: "Mharin Kharin: Không thể rời đi"
 colony.1524.desc: "Các báo cáo điều tra gần đây cho thấy cư dân trên [Root.GetName] ít có ý định di cư sang các hành tinh khác hơn so với cư dân ngoại lai của [Root.Owner.GetName].\n\nMharin Kharin và các loài thực vật họ hàng của nó gây ra một sự phụ thuộc tâm lý nhẹ về cảm giác. Nhưng báo cáo điều tra không chỉ ra sự liên quan trực tiếp giữa hai sự việc."
 colony.1525.name: "Mharin Kharin: Lỗi liên lạc"
 colony.1525.desc: "Dù năng suất trên hành tinh không còn sụt giảm nữa, nhưng liên lạc giữa các thành phố thuộc địa trên [Root.GetName] và thủ đô trên [Root.Owner.Capital.GetName] bắt đầu sụp đổ. Các quan chức cao cấp trên [Root.GetName] bắt đầu trở nên ngày càng lạnh lùng, các nhân viên của chúng ta liên tục phàn nàn rằng ngay cả việc gửi một mệnh lệnh đơn giản hiện nay cũng trở nên vô cùng khó khăn."
 colony.1525.a: "Ây."
 colony.1525.b: "Phái một đội đặc nhiệm hành chính. Mật danh Tử Linh Lan."
 colony.1526.name: "Mharin Kharin: Sự phản bội của các tầng lớp thống trị"
 colony.1526.desc: "Đội hành chính chúng ta cử tới [Root.GetName] để giải quyết vấn đề dường như đã phản bội. May mắn thay, kế hoạch của họ có tác dụng rất hạn chế. Kế hoạch tiến hành cực chậm, ngay lập tức bị chúng ta phát hiện, thật chẳng có gì đáng kinh ngạc. Thời thế thay đổi — đây chỉ là một cách ẩn dụ thôi — biện pháp cuối cùng của chúng ta là bãi bỏ chính quyền địa phương, sau đó quản lý trực tiếp các sự vụ thuộc địa từ thủ đô."
 colony.1526.a: "Kết quả có lẽ sẽ hơi khó coi."
 colony.1527.name: "Mharin Kharin: Thiết quyền từ phương xa"
 colony.1527.desc: "Chính sách quản lý lệ thuộc của chúng ta đã bén rễ sâu trên [Root.GetName]. Nó đã thành công kiểm soát sự sinh sôi của loài thực vật phấn hoa Mharin Kharin. Nó cũng thành công làm giảm sự chấp nhận của mọi người đối với việc 'sử dụng' loài thực vật này — đây không phải là một thành tựu nhỏ, vì hành vi này cũng chẳng có gì đáng trách như việc ngửi hương hoa vậy."
 colony.1528.name: "Mharin Kharin: Chặt đi, đốt đi"
 colony.1528.desc: "Việc quản lý lệ thuộc của chúng ta trên [Root.GetName] vẫn đang được tiến hành một cách cứng rắn nhưng đầy hiệu quả. Nghe nói Quốc hội nắm quyền — rõ ràng họ thích trốn trong phòng để hít phấn hoa Mharin Kharin hơn — đã kiểm soát một quân đoàn mà chúng ta bố trí trên hành tinh. Quản lý lệ thuộc hy vọng dùng những đơn vị này phát động một cuộc tấn công vào đám hoa đó, bắt họ lắp đặt các máy lọc khí quyển và xóa sổ hoàn toàn loài thực vật này khỏi khu vực đô thị."
 colony.1528.a: "Chúng ta lẽ ra nên làm thế từ sớm."
 colony.1528.a.tooltip: "Loài thực vật gây mụ mị đầu óc này hiện đã bị kiểm soát nghiêm ngặt. Nó bị cách ly khỏi các khu vực đông dân cư. Điều này sẽ loại bỏ tất cả các chỉnh sửa liên quan.\n"
 colony.1529.name: "Mharin Kharin: Sùng bái Phấn hoa"
 colony.1529.desc: "Các phần tử bên lề trên [Root.GetName] đã liên kết lại, tạo thành một tổ chức mang tính chất tôn giáo. Họ muốn kiểm soát việc trồng trọt Mharin Kharin. Thủ lĩnh của họ, một kẻ tự phong là 'Tế lễ Xanh' của 'Cung điện Thánh hoa', tuyên bố ông ta đại diện cho toàn bộ hệ sinh thái trên [Root.GetName], và yêu cầu được quyền độc quyền giao thương loài thực vật này.\n\nĐiều này tất nhiên là không thể, chúng ta cũng sẽ không chấp nhận. Hệ thống thực vật địa phương trên [Root.GetName] không có giá trị chiến lược hay kinh tế nào, do đó theo luật cũng không thể vận chuyển tới các hành tinh khác.\n\nKhông may là họ dường như rất miễn cưỡng chấp nhận thực tế này."
 colony.1530.name: "Mharin Kharin: Điềm báo Phấn hoa Mạt thế"
 colony.1530.desc: "Cung điện Thánh hoa và những người theo đuổi nó hiện chiếm một tỷ lệ không nhỏ trong tổng dân số [Root.GetName]. Báo cáo cho thấy các phong trào của tổ chức này có một số thay đổi đáng ngờ. Họ ngày càng ít mặn mà với việc buôn lậu Mharin Kharin. Cung điện Thánh hoa dường như dần chuyển biến thành một tôn giáo tin vào ngày tận thế. Máy dò khí quyển phát hiện phấn hoa Mharin Kharin gần đây có một số thay đổi, có lẽ chuyện này có liên quan tới sự thay đổi của Cung điện Thánh hoa.\n\nMột §Ydự án đặc biệt§! đã được khởi động để đánh giá rủi ro mà việc này có thể mang lại. Đề xuất hoàn thành dự án này trước khi thảm họa có thể xảy ra."
 colony.1530.a: "Rất tốt."
 colony.1531.name: "Mharin Kharin: Đã tránh được thảm họa"
 colony.1531.desc: "Biện pháp phản chế kiên quyết và nhanh chóng đã giúp chúng ta sớm phát hiện nguy hiểm từ sự biến đổi phấn hoa của những bông hoa bản địa trên [Root.GetName]. Chúng ta đã nhanh chóng thực hiện các biện pháp cần thiết.\n\nChúng ta đã sơ tán hoàn toàn cư dân trên hành tinh, và tiến hành nhiều đợt ném bom diệt cỏ chiến thuật nhằm vào Mharin Kharin và các loài thực vật họ hàng.\n\nNhững loài thực vật này rất nhanh đã trở nên miễn nhiễm với thuốc diệt cỏ. Nếu phấn hoa này không bị loại bỏ, chúng sẽ bắt đầu phát tán một loại độc tố thần kinh cực mạnh. Mọi sinh vật có cơ quan khứu giác trên [Root.GetName] đều sẽ bị đe dọa tính mạng.\n\nCác nhà khoa học của Hội đồng Thuộc địa cho rằng đây là một chu kỳ tự nhiên trên [Root.GetName]. Dù phấn hoa gây ra đủ loại ảnh hưởng xấu cho chúng ta: làm tê liệt quản lý địa phương, dẫn tới việc thành lập giáo đoàn Hiệp sĩ Thánh hoa, thậm chí cuối cùng tạo ra kịch độc. Nhưng đây thực chất chỉ là tác dụng phụ ngẫu nhiên, chứ không phải âm mưu quỷ kế do thực vật thiết kế để tự vệ.\n\nGiờ đây, trên bề mặt hành tinh không còn thấy bóng dáng của những bông hoa này nữa. Cư dân thuộc địa của chúng ta cũng đã được bảo đảm an toàn, không còn phải chịu đe dọa từ phấn hoa nữa."
 colony.1531.a: "Quả là một kết thúc có hậu."
 colony.1531.a.tooltip: "Các loài hoa nguy hiểm trên hành tinh này đã bị xóa sổ, mọi chỉnh sửa liên quan cũng đã bị loại bỏ.\n"
 colony.1532.name: "Mharin Kharin: Ngày tàn của Phấn hoa"
 colony.1532.desc: "Thảm họa đã giáng xuống.\n\nVô số Mharin Kharin bắt đầu tự phát biến dị, lan rộng như cháy rừng không cách nào ngăn nổi. Phấn hoa của chúng bắt đầu trở nên cực độc, chúng ta đã bó tay chịu trói.\n\nVì chúng ta phát hiện quá muộn nên không kịp sơ tán cư dân trên hành tinh, nỗ lực trung hòa phấn hoa cũng thất bại. Cư dân trên [Root.GetName] đã phải gánh chịu thảm họa diệt vong.\n\nThực vật trên [Root.GetName] đã giành chiến thắng, nhưng chúng cũng sẽ phải trả giá, dù chuyện này đối với chúng ta chỉ là một sự an ủi vô nghĩa. Quần thể Mharin Kharin do sinh sản quá mức dẫn tới thiếu hụt một loại dưỡng chất cần thiết trong đất — rất nhanh sau đó, những loài thực vật này sẽ chết sạch. Phải trải qua một thời gian rất dài sau đó, các loài thực vật này mới có thể tìm lại chỗ đứng của mình trong hệ sinh thái. Ai mà biết được liệu chúng có tìm lại được hay không.\n\nToàn bộ cư dân trên [Root.GetName] đã thiệt mạng. Khí quyển hành tinh tạm thời trở nên độc hại do khí thải từ thực vật."
 colony.1532.a: "Chúng ta sẽ không quên thảm kịch này."
 colony.1533.name: "Mharin Kharin: Một khởi đầu mới"
 colony.1533.desc: "Đội khảo sát hành tinh báo cáo rằng luồng khí độc phấn hoa dẫn tới sự hủy diệt của thuộc địa hai năm trước nay đã tan hết. Hành tinh này giờ đây đã khác. Sau sự bùng nở của Mharin Kharin, giờ nó đã biến thành một hành tinh sa mạc không một ngọn cỏ, trong khí quyển đâu đâu cũng tràn ngập phấn hoa.\n\nHai năm có lẽ không đủ để chúng ta quên đi thảm kịch mà những người [Root.Owner.GetName] từng sinh sống ở đây đã gặp phải, nhưng ít nhất hiện giờ hành tinh này không còn thù địch với sự sống thông minh nữa."
 colony.1533.a: "Tôi hiểu rồi..."
 pheromonefrenzy.revived.tooltip: "Thuộc địa cũ của bạn hiện đã biến thành một hành tinh hoang vu, nếu có công nghệ đúng đắn, bạn có thể biến nó trở thành một nơi có thể cư trú."
 colony.1534.name: "Mharin Kharin: Sự suy tư của Nhị hoa"
 colony.1534.desc: "Sau khi kiểm tra kỹ lưỡng, chúng ta phát hiện thực vật trên [Root.GetName] thực chất có cấu tạo rất đơn giản. Một số phấn hoa có tính kích thích nhẹ và xu hướng biến dị nhanh; nhưng không còn điểm gì đặc biệt khác, không có công dụng chiến lược, cũng chẳng phải tài nguyên xa xỉ gì."
 ####################################
 # Lan truyền Liên lạc
 ####################################
 communications_spread.1.name: "Đánh chặn Liên lạc"
 communications_spread.1.desc: "Chúng ta đã đánh chặn được một thông điệp gửi tới [CommSpreader.GetName], phát hiện ra họ đã thiết lập liên lạc định kỳ với một đế chế khác mà chúng ta chưa từng biết tới. Lần theo thông điệp này, chúng ta đã thiết lập được đường truyền liên lạc với nhân vật bí ẩn trong tinh hệ này."
 communications_spread.1.a: "Thú vị, thú vị..."
 communications_spread.1.tooltip: "Thiết lập liên lạc với [contact_empire.GetName]."
 communications_spread.2.name: "Liên lạc mới"
 communications_spread.2.desc: "Chúng ta đã nhận được một công văn từ một đế chế chưa biết sâu trong không gian, họ tự xưng là §H[From.GetName]§!. Họ còn tuyên bố đã phát hiện ra sự tồn tại của chúng ta từ cuộc liên lạc giữa chúng ta và một đế chế khác."
 communications_spread.2.a: "Thú vị, thú vị..."
 communications_spread.2.tooltip: "Thiết lập liên lạc với [From.GetName]."
 fallen_empires.2.name: "[From.GetName] ám sát [Root.GetRulerTitle]!"
 fallen_empires.2.desc: "Dường như là sự trừng phạt cho việc chúng ta không chỉ khai chiến với Thánh quyền Ngưng trệ [From.GetName] mà còn chấp nhận thất bại sau đó, sau khi đàm phán hòa bình kết thúc, đặc vụ [From.GetAdj] đã xuất hiện bên cạnh [Root.GetRulerTitle][rulername.GetName].\n\nHọ đã hành quyết [Root.GetRulerTitle] của chúng ta bằng một loại vũ khí chưa từng nghe thấy. Sau khi gây án, họ biến mất vào hư không, cứ như chưa từng xuất hiện."
 fallen_empires.2.a: "Chúng ta đã bại trận, chúng ta bị nhục mạ, nhưng chúng ta sẽ trở lại."
 fallen_empires.2.a.tooltip: "§Y[Root.GetRulerTitle][rulername.GetName]§R đã thiệt mạng§!."
 fallen_empires.4.name: "Liên lạc từ §H[From.GetName]§!"
 fallen_empires.4.desc: "Lũ sâu bọ ngạo mạn! Các ngươi nghĩ rằng những kẻ định cư [Root.GetSpeciesName] vấy bẩn thánh địa của chúng ta có thể không bị phát giác sao? Hãy rời khỏi hành tinh của chúng ta ngay lập tức hoặc đối mặt với sức mạnh hạm đội của chúng ta!"
 fallen_empires.4.a: "Chúng ta không còn lựa chọn nào khác ngoài việc chấp nhận..."
 fallen_empires.4.b: "[Root.GetName] tuyệt đối không chịu khuất phục!"
 fallen_empires.5.name: "Liên lạc từ §H[From.GetName]§!"
 fallen_empires.5.desc: "[Root.GetSpeciesName], chúng ta phát hiện các ngươi đang vụng về cố gắng tạo ra Trí tuệ Nhân tạo, và cho rằng các ngươi đang dấn thân vào con đường sai lầm tự hủy hoại linh hồn. Hãy dừng ngay hành động ngu xuẩn này lại, nếu không chúng ta sẽ giúp các ngươi dừng lại."
 fallen_empires.5.a: "Chúng ta không còn lựa chọn nào khác ngoài việc chấp nhận..."
 fallen_empires.5.b: "[Root.GetName] tuyệt đối không chịu khuất phục!"
 fallen_empires.5.a.tooltip: "Chính sách §H$policy_artificial_intelligence_policy$§! sẽ bị đổi thành §H$ai_outlawed$§!."
 fallen_empires.6.name: "Liên lạc từ §H[From.GetName]§!"
 fallen_empires.6.desc: "Lũ man di [Root.GetSpeciesName]! Đừng tưởng không ai thấy những tội ác của các ngươi. Những hành vi tàn sát và nô dịch vô tội vạ của các ngươi đang đe dọa tương lai của cả tinh hà. Chúng ta cho các ngươi một cơ hội lựa chọn: dừng ngay các hành vi dã man đó lại, hoặc chuẩn bị đối mặt với sự trừng phạt công lý từ chúng ta."
 fallen_empires.6.a: "Chúng ta không còn lựa chọn nào khác ngoài việc chấp nhận..."
 fallen_empires.6.b: "[Root.GetName] tuyệt đối không chịu khuất phục!"
 fallen_empires.6.a.tooltip: "Chính sách §H$policy_slavery$§! sẽ bị đổi thành §H$slavery_not_allowed$§!.\nChính sách §H$policy_purge$§! sẽ đổi thành §H$purge_not_allowed$§!."
 fallen_empires.7.name: "Liên lạc từ §H[From.GetName]§!"
 fallen_empires.7.desc: "Lũ [From.GetSpeciesNamePluralInsult] ngoan cố! Đây là cảnh báo cuối cùng cho sự mạo phạm lãnh thổ của chúng ta! Hãy rút đi ngay, nếu không chúng ta sẽ dọn dẹp uế tạp cho vũ trụ — chính là cái giống loài bé nhỏ thảm hại các ngươi đó."
 fallen_empires.7.a: "Chúng ta không còn lựa chọn nào khác ngoài việc chấp nhận..."
 fallen_empires.7.b: "[Root.GetName] tuyệt đối không chịu khuất phục!"
 fallen_empires.8.name: "Liên lạc từ §H[From.GetName]§!"
 fallen_empires.8.desc: "Lũ [Root.GetSpeciesName] vô tri. Các ngươi đã phạm sai lầm lớn khi bất kính với bậc tiền bối. Hãy phủ phục trước mặt chúng ta cầu xin sự tha thứ, may ra chúng ta có thể tha cho cái đế chế nhỏ bé vô giá trị của các ngươi."
 fallen_empires.8.desc.control: "Lũ [Root.GetSpeciesName] gây rối. Các ngươi không thấy chính mình đang tạo ra những tạp âm buộc chúng ta phải ra tay sao. Tốt nhất nên biết điều, nếu không chúng ta sẽ tới giúp các ngươi chỉnh lại tông giọng đấy."
 fallen_empires.8.desc.growth: "Lũ [Root.GetSpeciesName] ngu muội, việc các ngươi từ chối trưởng thành và tiến hóa chính là sự xúc phạm tới bản thân sự sống. Hãy ngoan ngoãn nghe lời, nếu không chúng ta sẽ nhổ tận gốc các ngươi, dù sao thì việc gieo lại những hạt giống mới đối với chúng ta cũng chẳng khó khăn gì."
 fallen_empires.8.desc.war: "Lũ [Root.GetSpeciesName] hèn nhát. Đế chế của các ngươi chính là ví dụ điển hình cho sự mong manh. Hãy nuốt lấy điểm yếu của mình, xin lỗi cho tử tế, rồi chuẩn bị đón nhận thử thách từ chúng ta — nếu không chúng ta có thể tùy ý nghiền các ngươi thành tro bụi, rồi thay thế bằng những người có giá trị hơn."
 fallen_empires.8.a: "Chúng ta không còn lựa chọn nào khác ngoài việc chấp nhận..."
 fallen_empires.8.a.tooltip: "Chấm dứt quan hệ thù địch với [fallen_empire_humiliator.GetName]\n[Root.GetName] mất hết mọi tuyên bố chủ quyền đối với các hệ sao trong lãnh thổ của [fallen_empire_humiliator.GetName]."
 fallen_empires.8.b: "[Root.GetName] tuyệt đối không chịu khuất phục!"
 fallen_empires.9.name: "Liên lạc từ §H[From.GetName]§!"
 fallen_empires.9.desc: "Hỡi lũ [Root.GetSpeciesName] bất kính với thần linh! Ngươi dám làm càn trong điện thờ của người quá cố, chà đạp lên lịch sử, bất kính với linh hồn người khuất. Không thể cho phép các ngươi quậy phá thêm nữa! Nếu các ngươi còn dám làm phiền sự yên nghỉ của người chết, hãy chuẩn bị đối mặt với cơn thịnh nộ của người sống — chính là chúng ta."
 fallen_empires.9.a: "Chúng ta không còn lựa chọn nào khác ngoài việc chấp nhận..."
 fallen_empires.9.b: "[Root.GetName] tuyệt đối không chịu khuất phục!"
 fallen_empires.100.name: "Chạm trán $holy_planet$" #Thánh địa
 fallen_empires.100.A.desc: "Chúng ta không phải vị khách đầu tiên tới [from.GetName] trong hệ sao [from.solar_system.GetName]. Tài nguyên chưa khai thác ẩn chứa trên hành tinh [from.GetClassAdj] này đã đủ thu hút, mà chúng ta còn phát hiện một đèn hiệu cổ đại được trang trí hoa mỹ neo đậu trên quỹ đạo cao. [from.GetName] rõ ràng thuộc về một văn minh không gian viễn cổ nào đó, nhưng chúng ta vẫn chưa thấy bất kỳ dấu vết định cư hay thăm dò nào của họ tại đây.\n\nCó rất nhiều giả thuyết khả thi, nhưng bằng chứng buộc chúng ta phải cân nhắc sự tồn tại của một văn minh cổ xưa tôn sùng hành tinh xanh tươi này. Chúng ta chỉ có thể đoán tung tích hiện tại của họ — tức là, giả sử họ vẫn còn tồn tại."
 fallen_empires.100.desc.spi_intro: "Trong hệ sao [from.solar_system.GetName], [from.GetName] có dấu vết của sự chạm chạm thánh linh. Các nhà nghiên cứu của chúng ta trên [root.GetName] nói rằng nơi này tràn đầy cảm giác thành kính sâu sắc, một đèn hiệu cổ đại trang trí hoa mỹ phát hiện trên quỹ đạo cao càng khẳng định thêm điều này."
 fallen_empires.100.A.desc.spi: "$fallen_empires.100.desc.spi_intro$\n\nChúng ta tin rằng [from.GetName] từng được tôn thờ như một thánh thể hoặc thánh địa. Còn là ai, chúng ta tạm thời chưa biết — phán đoán tốt nhất là, họ là một văn minh Duy tâm đã suy tàn."
 fallen_empires.100.A.desc.gestalt: "Cuộc khảo sát của chúng ta đối với hành tinh xanh tươi [from.GetName] trong hệ sao [from.solar_system.GetName] cho thấy, nó từng là đối tượng được một dạng sống không xác định khác vô cùng quan tâm. Chúng ta đã tìm thấy một đèn hiệu dẫn đường cổ đại trên quỹ đạo cao, điều này chứng tỏ hành tinh này từng có khách ngoại hành tinh ghé thăm, nhưng trong vài thế kỷ qua, không có bất kỳ bằng chứng hạ cánh hay thuộc địa hóa nào. Ngược lại, dường như có thứ gì đó đang bảo vệ hành tinh [from.GetClassAdj] này — nhưng hiện tại, đối với một thực thể giả định như vậy, số phận và tung tích của nó vẫn là một ẩn số đối với chúng ta."
 fallen_empires.100.B.desc: "Chúng ta nghi ngờ rằng đối với [from.GetName], còn có thứ gì đó quan trọng hơn cả tài nguyên dồi dào và môi trường tự nhiên nguyên sơ. Lạ thay, hành tinh [from.GetClassAdj] trong hệ sao [from.solar_system.GetName] này ngoài một đèn hiệu cổ đại lấp lánh trên quỹ đạo cao ra, nó không hề chịu bất kỳ tác động nào khác. Vỏ ngoài thiết bị này khắc những hoa văn phức tạp, tuy chưa chắc chắn lắm, nhưng chúng ta tin rằng hình thức nghệ thuật này xuất phát từ [spi_fallen_empire.GetName] gần đó.\n\nThái độ của họ đối với chúng ta khá khó đoán, nên chúng ta chỉ có thể đoán xem [spi_fallen_empire.GetAdj] có kế hoạch gì cho hành tinh này. Ít nhất chưa có dấu hiệu nào cho thấy sự hứng thú của chúng ta với [from.GetName] mạo phạm tới họ..."
 fallen_empires.100.B.desc.spi: "$fallen_empires.100.desc.spi_intro$\n\nChúng ta tin rằng [from.GetName] được coi là thánh thể để tôn thờ, hoặc được coi như một thánh địa. Phong cách trang trí của đèn hiệu ám chỉ có thể chính là [spi_fallen_empire.GetName] đang tôn thờ nơi này. Không rõ hiện nay liệu có còn như vậy hay không."
 fallen_empires.100.B.desc.gestalt: "Cuộc khảo sát của chúng ta đối với [from.GetName] cho thấy, hành tinh trù phú nằm trong hệ sao [from.solar_system.GetName] này từng là đối tượng mà một dạng sống tiên tiến — nhưng đầy cảm tính — vô cùng say mê. Trên quỹ đạo cao của nó có một đèn hiệu dẫn đường đã ngừng hoạt động từ lâu, khắc những đường nét thiết kế tương đồng với văn hóa §H[spi_fallen_empire.GetName]§!.\n\nDường như người [spi_fallen_empire.GetSpeciesNamePlural] từng thề sẽ bảo vệ hành tinh [from.GetClassAdj] này, nhưng liệu hiện giờ còn như vậy không thì chúng ta không rõ."
 fallen_empires.100.a: "Chúng ta cũng nên thành kính với nơi này."
 fallen_empires.100.b: "Giờ nó là của chúng ta."
 fallen_empires.100.c: "Chúng ta có thể phát triển phồn vinh tại đây."
 fallen_empires.100.d: "Lũ [spi_fallen_empire.GetSpeciesNamePluralInsult] mục nát."
 fallen_empires.100.e: "Lũ dị giáo ngạo mạn."
 origin.12.desc: "Từ thủy thủ đoàn tàu [from.GetName] đã gửi về một thông điệp khẩn cấp, đã tìm thấy §Y[fromfrom.GetName]§! trong hệ sao [fromfrom.solar_system.GetName].\n\n'[fromfrom.GetName]'... Chỉ riêng cái tên này thôi đã là một huyền thoại, có rất nhiều truyền thuyết được lưu truyền từ việc mô phỏng [overlord.GetName]. Người [root.GetSpeciesNamePlural] đều biết nơi này là thiên đường, là ngọn hải đăng của hy vọng vô hình. Dù chúng ta có thể thấy rõ sự thánh khiết của nó bằng mắt thường, nhưng giờ chúng ta cũng đối mặt với một sự thật nghiệt ngã: thánh địa trong thần thoại này thực sự tồn tại ngoài đời thực.\n\n[overlord.GetName] vẫn chưa đưa ra bất kỳ phát ngôn nào về phát hiện của chúng ta, nhưng chúng ta đã tìm thấy bằng chứng cho thấy họ đang theo dõi hành tinh này vô cùng chặt chẽ. Họ biết chúng ta ở đây, chúng ta không biết giải thích thế nào về việc họ hoàn toàn im hơi lặng tiếng trước việc này."
 origin.12.a: "Thật đáng nghi..."
 origin.12.b: "Bậc tiền bối rõ ràng tin tưởng chúng ta."
 scion_found_holy_world: "Tuyên cáo Thánh địa"
 scion_found_holy_world_desc: "Các học giả tôn giáo và những người thực hành tín ngưỡng đều đang vui mừng khôn xiết vì phát hiện ra một hành tinh thánh, từng có người lo sợ hành tinh này chẳng qua chỉ là một truyền thuyết thần thoại mà thôi."
 scion_suspicious_holy_world: "Nghi vấn Thánh địa"
 scion_suspicious_holy_world_desc: "Xã hội này đang chấp nhận một sự thật: những người bảo hộ đã che giấu họ vài chân tướng — đặc biệt là sự tồn tại và tung tích của một hành tinh thánh địa đã biết."
 origin.13.desc.intro: "Trên [fromfrom.GetName] không chỉ có tài nguyên dồi dào và hệ sinh thái nguyên sơ. Hành tinh [fromfrom.GetClassAdj] trong hệ sao [fromfrom.solar_system.GetName] này ngoài một đèn hiệu cổ đại lấp lánh trên quỹ đạo cao ra, nó không hề chịu bất kỳ tác động nào khác."
 origin.13.hasmet.desc: "$origin.13.desc.intro$\n\nĐộ phức tạp cực cao của thiết bị này thậm chí có thể sánh ngang với công nghệ của [overlord.GetAdj]; do đó chúng ta tin rằng đèn hiệu này thuộc về [spi_fallen_empire.GetName] gần đó. Còn về tác dụng: chúng ta vẫn chưa thể hoàn toàn chắc chắn, nhưng dường như người [spi_fallen_empire.GetSpeciesNamePlural] coi hành tinh này là thiêng liêng."
 origin.13.notmet.desc: "$origin.13.desc.intro$\n\nĐộ phức tạp cực cao của thiết bị này thậm chí có thể sánh ngang với công nghệ của [overlord.GetAdj], tuy nhiên thiết kế của nó lại hoàn toàn ngoại lai. Do đó chúng ta chỉ có thể giả định đèn hiệu này thuộc về một văn minh tương đương từng tồn tại hoặc hiện đang tồn tại. Dựa trên nhiều biểu tượng khắc trên bề mặt, nó dường như dùng để đánh dấu một thánh địa."
 origin.13.a: "Thật nực cười."
 fallen_empire_refuse_tooltip: "§H[From.GetName]§! sẽ nổi trận lôi đình, rất có khả năng sẽ tấn công chúng ta."
 fallen_empire_happy_tooltip: "§H[FallenEmpireTaskOrigin.GetName]§! sẽ rất hài lòng, có lẽ còn ưu ái chúng ta trong tương lai."
 fallen_empire_unhappy_tooltip: "§H[FallenEmpireTaskOrigin.GetName]§! sẽ không hài lòng."
 fallen_empire_maybe_unhappy_tooltip: "§H[FallenEmpireTaskOrigin.GetName]§! có thể sẽ không hài lòng."
 fallen_empire_angry_tooltip: "§H[FallenEmpireTaskOrigin.GetName]§! chắc chắn sẽ rất không hài lòng, không chừng còn dạy cho chúng ta một bài học."
 fallen_empire_enigmatic_tooltip: "§H[FallenEmpireTaskOrigin.GetName]§! có thể sẽ, hoặc không có phản ứng gì đối với sự từ chối của chúng ta."
 fe_gift_ship: "Tặng tàu chiến"
 gave_up_pop: "Cắt nhượng dân số của ta"
 gave_up_pop_xenophobe: "Cắt nhượng dân số của ta"
 gave_up_scientist_xenophobe: "Giao ra đặc viên khoa học của ta"
 gave_up_pop_xenophile: "Cắt nhượng dân số của ta"
 pol_ai_outlawed: "Bộ triệt tiêu Positron"
 pol_ai_servitude: "Thỏa ước Nô lệ"
 pol_ai_full_rights: "Quyền lợi Tổng hợp"
 fallen_empires_situation: "Hành vi của Đế chế Sa sút"
 fallen_empires_situation_type: "$fallen_empires_situation$"
 fallen_empires_situation_monthly_change_tooltip: "$situation_monthly_change_tooltip_no_control$"
 fallen_empires_situation_desc: "$fallen_empires_situation$"
 fallen_empires_tasks.2.name: "Liên lạc từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.2.desc.a.materialist: "Hãy nhận lấy món quà này như phần thưởng của [Root.GetName] cho sự phục vụ đối với [FallenEmpireTaskOrigin.GetName]. Các ngươi sẽ thấy phần thưởng này tuyệt đối là hậu hĩnh."
 fallen_empires_tasks.2.desc.a.xenophile: "[Root.GetSpeciesName], chủng tộc các ngươi quả thực là một sự tồn tại rất có giá trị trong vũ trụ. Để minh chứng cho sự tôn trọng đối với các ngươi, chúng ta quyết định tặng các ngươi một món quà lớn chứa các khoáng sản quý giá và tài nguyên khác."
 fallen_empires_tasks.2.desc.a.machine.o: "Giao thức Giám hộ 712-4 đã kích hoạt. Bắt đầu chuyển tài nguyên tới văn minh hữu cơ đang phấn đấu. Thông tin đính kèm: §R<<Lỗi: Khối dữ liệu bị hỏng>><<Lỗi: Khối dữ liệu bị hỏng>><<Lỗi: Khối dữ liệu bị hỏng>>§!"
 fallen_empires_tasks.2.desc.a.machine.s: "Giao thức Giám hộ 718-4 đã kích hoạt. Bắt đầu chuyển tài nguyên tới trí tuệ tổng hợp chưa bị tổn hại. Thông tin đính kèm: §R<<Lỗi: Khối dữ liệu bị hỏng>><<Lỗi: Khối dữ liệu bị hỏng>><<Lỗi: Khối dữ liệu bị hỏng>>§!"
 fallen_empires_tasks.2.desc.a.spiritualist: "[Root.GetSpeciesName]! Chủng tộc các ngươi rất kiệt xuất, và sự kiên định với giáo nghĩa của các ngươi cũng rất đáng ngưỡng mộ. Vì lòng nhân từ vô tận của chúng ta, hãy nhận lấy số tài nguyên này như một món quà."
 fallen_empires_tasks.2.desc.b.materialist: "[Root.GetSpeciesName], hiệu suất công nghệ của các ngươi thấp quá, khiến chúng ta không nỡ nhìn thêm. Là những trợ thủ dưới trướng [FallenEmpireTaskOrigin.GetName], chúng ta quyết định chia sẻ với ngươi vài kiến giải về vũ trụ. Chúng ta không làm vậy với mọi giống loài, nên nhất định phải tiếp tục giữ lấy sự hữu dụng đối với chúng ta — vô ơn là đức tính không cần thiết với một đứa trẻ."
 fallen_empires_tasks.2.desc.b.xenophile: "[Root.GetSpeciesName], chúng ta đã dành sự quan tâm lâu dài tới sự phát triển công nghệ trì trệ của các ngươi. Với tốc độ hiện tại, e rằng trong đời này các ngươi không cách nào thể hiện được hết tiềm năng đâu. Để giúp đỡ các ngươi, chúng ta sẽ tặng một cơ sở dữ liệu kiến thức khoa học của [FallenEmpireTaskOrigin.GetSpeciesName]. Các ngươi chắc chắn sẽ thấy nội dung trong đó vô cùng hữu ích."
 fallen_empires_tasks.2.desc.b.machine.o: "Giao thức Giám hộ 712-6 đã kích hoạt. Bắt đầu chuyển cơ sở dữ liệu tới văn minh hữu cơ nguyên thủy. Thông tin đính kèm: §R<<Lỗi: Khối dữ liệu bị hỏng>><<Lỗi: Khối dữ liệu bị hỏng>><<Lỗi: Khối dữ liệu bị hỏng>>§!"
 fallen_empires_tasks.2.desc.b.machine.s: "Giao thức Giám hộ 718-6 đã kích hoạt. Bắt đầu chuyển cơ sở dữ liệu tới trí tuệ tổng hợp nguyên thủy. Thông tin đính kèm: §R<<Lỗi: Khối dữ liệu bị hỏng>><<Lỗi: Khối dữ liệu bị hỏng>><<Lỗi: Khối dữ liệu bị hỏng>>§!"
 fallen_empires_tasks.2.desc.b.spiritualist: "[Root.GetSpeciesName]! Chủng tộc các ngươi rất kiệt xuất, và sự kiên định với giáo nghĩa của các ngươi cũng rất đáng ngưỡng mộ. Vì lòng nhân từ vô tận của chúng ta, hãy nhận lấy kiến thức thần thánh này như một món quà."
 fallen_empires_tasks.2.desc.c.materialist: "[Root.GetSpeciesName], là khách hàng của [FallenEmpireTaskOrigin.GetSpeciesName], thực lực hạm đội của các ngươi cũng phản ánh quân lực chiến đấu của chúng ta. Nhưng tàu của các ngươi còn chưa đủ mạnh. Vì vậy chúng ta đặc biệt quyết định tặng ngươi một đội tàu hộ vệ đang để không của bên ta để bảo đảm an toàn cho các ngươi.\n\nChúng ta đã thay thế một số bộ phận phức tạp bằng những bộ phận đơn giản hơn để các ngươi dễ thao tác. Các bộ phận còn lại cũng đã lắp thiết bị chống tháo dỡ, nên xin đừng tháo ra. Bởi cấu trúc bên trong của chúng có lẽ là quá phức tạp đối với các ngươi."
 fallen_empires_tasks.2.desc.c.xenophile: "Người [FallenEmpireTaskOrigin.GetSpeciesName] chúng ta cho rằng, để bảo vệ sự cân bằng của vũ trụ và tính đa dạng của các quần thể, sự tồn tại của [Root.GetSpeciesNamePlural] là vô cùng quan trọng. Nhưng chúng ta lo rằng, thực lực hạm đội của các ngươi không đủ để đối kháng với các quần thể hiếu chiến khác. Để giúp các ngươi tự vệ, chúng ta quyết định tặng ngươi một đội tàu hộ vệ đang để không.\n\nChúng ta đã dùng những bộ phận công nghệ mà người [Root.GetSpeciesNamePlural] quen thuộc để thay thế một số bộ phận phức tạp, nhằm giúp các ngươi dễ thao tác. Các bộ phận còn lại cũng đã lắp thiết bị chống tháo dỡ, nên xin đừng tháo ra."
 fallen_empires_tasks.2.desc.c.machine.o: "Giao thức Giám hộ 712-1 đã kích hoạt. Bắt đầu chuyển vũ khí chiến tranh tới văn minh hữu cơ bị đe dọa. Thông tin đính kèm: §R<<Lỗi: Khối dữ liệu bị hỏng>><<Lỗi: Khối dữ liệu bị hỏng>><<Lỗi: Khối dữ liệu bị hỏng>>§!"
 fallen_empires_tasks.2.desc.c.machine.s: "Giao thức Giám hộ 718-1 đã kích hoạt. Bắt đầu chuyển vũ khí chiến tranh tới trí tuệ tổng hợp đang gặp khó khăn. Thông tin đính kèm: §R<<Lỗi: Khối dữ liệu bị hỏng>><<Lỗi: Khối dữ liệu bị hỏng>><<Lỗi: Khối dữ liệu bị hỏng>>§!"
 fallen_empires_tasks.2.desc.c.spiritualist: "[Root.GetSpeciesName]! Tiên tri của chúng ta nói rằng chủng tộc các ngươi sẽ đóng vai trò quan trọng trên con đường đức tin. Để đảm bảo các ngươi có thể hoàn thành tốt nhiệm vụ, chúng ta quyết định tặng các ngươi một đội tàu hộ vệ nhỏ đang để không, chắc là đủ để bảo vệ an toàn cho các ngươi rồi.\n\nĐừng có cải tạo bừa bãi các hệ thống trên tàu, dù đối với chúng ta chúng là những mẫu cũ kỹ, nhưng vẫn vượt xa khả năng hiểu biết hiện tại của các ngươi."
 fallen_empires_tasks.2.desc.d.materialist: "[Root.GetSpeciesName], là khách hàng của [FallenEmpireTaskOrigin.GetSpeciesName], thực lực hạm đội của các ngươi cũng phản ánh quân lực chiến đấu của chúng ta. Nhưng tàu của các ngươi còn chưa đủ mạnh. Vì vậy chúng ta đặc biệt quyết định tặng ngươi một đội tàu hộ vệ đang để không của bên ta để bảo đảm an toàn cho các ngươi.\n\nChúng ta đã thay thế một số bộ phận phức tạp bằng những bộ phận đơn giản hơn để các ngươi dễ thao tác. Các bộ phận còn lại cũng đã lắp thiết bị chống tháo dỡ, nên xin đừng tháo ra. Bởi cấu trúc bên trong của chúng có lẽ là quá phức tạp đối với các ngươi."
 fallen_empires_tasks.2.desc.d.xenophile: "Người [FallenEmpireTaskOrigin.GetSpeciesName] chúng ta cho rằng, để bảo vệ sự cân bằng của vũ trụ và tính đa dạng của các quần thể, sự tồn tại của [Root.GetSpeciesNamePlural] là vô cùng quan trọng. Nhưng chúng ta lo rằng, thực lực hạm đội của các ngươi không đủ để đối kháng với các quần thể hiếu chiến khác. Để giúp các ngươi tự vệ, chúng ta quyết định tặng ngươi một đội tàu hộ vệ đang để không.\n\nChúng ta đã dùng những bộ phận công nghệ mà người [Root.GetSpeciesNamePlural] quen thuộc để thay thế một số bộ phận phức tạp, nhằm giúp các ngươi dễ thao tác. Các bộ phận còn lại cũng đã lắp thiết bị chống tháo dỡ, nên xin đừng tháo ra."
 fallen_empires_tasks.2.desc.d.spiritualist: "[Root.GetSpeciesName]! Tiên tri của chúng ta nói rằng chủng tộc các ngươi sẽ đóng vai trò quan trọng trên con đường đức tin. Để đảm bảo các ngươi có thể hoàn thành tốt nhiệm vụ, chúng ta quyết định tặng các ngươi một tàu chiến tuần dương đang để không, chắc là đủ để bảo vệ an toàn cho các ngươi rồi.\n\nĐừng có cải tạo bừa bãi các hệ thống trên tàu, nếu không có thể gây tổn thương cho chính các ngươi."
 fallen_empires_tasks.2.a: "Chúng ta hân hoan chấp nhận."
 fallen_empires_tasks.2.b: "Chúng ta chẳng cần sự thương hại của [FallenEmpireTaskOrigin.GetSpeciesName]!"
 fallen_empires_tasks.2.escorts_tooltip: "Nhận được 3 tàu chiến loại §YHộ vệ hạm§!."
 fallen_empires_tasks.2.battlecruiser_tooltip: "Nhận được 1 tàu chiến loại §YChiến tuần hạm§!."
 fallen_empires_tasks.4.name: "Liên lạc từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.4.desc: "Xin chào, [Root.GetSpeciesNamePlural]! Chắc các ngươi đã biết, chúng ta §H[FallenEmpireTaskOrigin.GetSpeciesName]§! tận tâm nghiên cứu và bảo tồn mọi dạng sống trong vũ trụ. Chúng ta đã nghiên cứu chủng tộc các ngươi, và cho rằng [Root.GetName] tối đa cũng chỉ duy trì được vài thế kỷ nữa. Để đảm bảo sự tồn tại của [Root.GetSpeciesName] trong trường hợp cực đoan nhất, chúng ta hy vọng quý đế chế có thể cắt nhượng một phần dân số gia nhập vào §HKhu bảo tồn Chủng tộc Nguy cấp§! của chúng ta. Chúng ta sẽ tạo riêng một khu bảo tồn, mô phỏng hoàn toàn môi trường sinh tồn tự nhiên của chủng tộc các ngươi, mọi cư dân trong đó cũng sẽ nhận được sự chăm sóc và bảo vệ toàn diện, các ngươi không cần lo cho sự an nguy của họ.\n\nVậy, ngươi thấy thế nào? Chúng ta sẽ dốc sức lưu giữ và bảo vệ chủng tộc các ngươi. Vậy ngươi có sẵn lòng đóng góp cho sự nghiệp này không?"
 fallen_empires_tasks.4.a: "Rất tốt, chúng ta sẵn lòng dốc sức."
 fallen_empires_tasks.4.b: "Chúng ta tuyệt đối không giao nộp người dân của mình cho bọn ngoài hành tinh!"
 fallen_empires_tasks.4.c: "Người dân của chúng ta không phải là hàng hóa, [FallenEmpireTaskOrigin.GetSpeciesName]."
 fallen_empires_tasks.4.d: "[Root.GetSpeciesNamePlural] vốn dĩ thuộc về [Root.GetName]."
 fallen_empires_tasks.4.e: "Không, chúng ta sẽ không bỏ rơi người dân của mình."
 fallen_empires_tasks.4.tooltip: "Một nhóm §HPop [Root.GetSpeciesName]§! sẽ bị xóa khỏi đế chế của bạn."
 fallen_empires_tasks.8.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.8.desc: "Gửi những [From.GetSpeciesNamePluralCompliment] đáng kính từ [From.GetName], chúng tôi nhận thấy các bạn là một giống loài có tiềm năng to lớn. Dù còn non trẻ, các bạn dường như đã hiểu được tầm quan trọng của sự đa dạng sinh học và xã hội, không tìm cách đàn áp hay tiêu diệt khi đối mặt với những nền văn minh khác biệt, mà thay vào đó là thấu hiểu và chấp nhận. Đáng tiếc là không phải loài non trẻ nào cũng có được sự khôn ngoan này. Đặc biệt là §H[FallenEmpireTaskTarget.GetName]§!, bọn chúng luôn tìm cách loại trừ những kẻ dị biệt. Chúng tôi không tiện trực tiếp can thiệp, nên hy vọng có thể giao phó nhiệm vụ ngăn chặn tội ác này cho các bạn. Hãy tấn công chúng và chấm dứt hành động thanh trừng dân số. Chúng tôi sẽ vô cùng biết ơn."
 fallen_empires_tasks.8.a: "Chúng tôi sẽ ngăn chặn hành động sai trái này!"
 fallen_empires_tasks.8.b: "Chúng tôi không muốn rước rắc rối với [FallenEmpireTaskTarget.GetName]."
 fallen_empires_tasks.9.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.9.desc: "Làm tốt lắm, hỡi những [From.GetSpeciesName] non trẻ. §H[FallenEmpireTaskTarget.GetName]§! đã kiệt quệ, ít nhất là hiện tại chúng không còn sức lực để tiếp tục những hành vi sai trái của mình. Chúng tôi vô cùng cảm kích và chân thành hy vọng các loài non trẻ khác đều có triển vọng như các bạn."
 fallen_empires_tasks.9.a: "Xác nhận"
 fallen_empires_tasks.10.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.10.desc: "Chúng tôi thật sự thất vọng tột cùng, [From.GetSpeciesName]. Các bạn đã hứa sẽ ngăn chặn mọi hành vi ngang ngược của §H[FallenEmpireTaskTarget.GetName]§!, nhưng giờ đây chúng vẫn đang lộng hành, bất chấp đạo lý. Chúng tôi từng nghĩ các bạn có thể cản bước chúng, nhưng xem ra chúng tôi đã lầm."
 fallen_empires_tasks.10.a: "Xác nhận"
 fallen_empires_tasks.11.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.11.desc: "Xin chào, hỡi những [From.GetSpeciesName] non trẻ. Trước đây chúng tôi đã yêu cầu các bạn ngăn chặn hành vi thanh trừng dân số của §H[FallenEmpireTaskTarget.GetName]§!. Nhưng hiện tại, yêu cầu đó không còn cần thiết nữa, vì [FallenEmpireTaskTarget.GetSpeciesName] đã ra lệnh cấm hoạt động này. Không rõ là do bị cưỡng ép hay tự nguyện, nhưng tóm lại là không cần phải tấn công chúng nữa."
 fallen_empires_tasks.11.a: "Xác nhận"
 fallen_empires_tasks.13.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.13.desc: "Chuyện này là sao, [From.GetSpeciesName]?! Các bạn đang đùa đấy à?! Không những không ngăn chặn tội ác của §H[FallenEmpireTaskTarget.GetName]§!, các bạn lại còn hùa theo chúng! Đại diện cho công lý, chúng tôi tuyệt đối sẽ không dung thứ."
 fallen_empires_tasks.13.a: "Ơ... xin lỗi?"
 fallen_empires_tasks.15.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.15.desc: "[From.GetSpeciesNamePlural]! Chúng tôi phải cảnh báo các bạn rằng §H[FallenEmpireTaskTarget.GetName]§! đang làm những việc cực kỳ nguy hiểm. [FallenEmpireTaskTarget.GetSpeciesName] đã bắt đầu nghiên cứu các công nghệ cấm kỵ, liên tục tạo ra những trí tuệ nhân tạo tinh vi nhằm chế tạo ra một cỗ máy thực sự có ý thức. Chúng tôi từng chứng kiến hậu quả của loại nghiên cứu này và cảm thấy có nghĩa vụ phải cảnh báo các bạn: điều này không chỉ đe dọa chính chúng mà còn cả các loài khác. Các bạn nên chủ động xuất kích, ngăn chặn mọi nỗ lực nghiên cứu tiếp theo của chúng."
 fallen_empires_tasks.15.a: "Phải ngăn chúng lại!"
 fallen_empires_tasks.15.b: "Chúng tôi không muốn kiếm rắc rối với [FallenEmpireTaskTarget.GetName]."
 fallen_empires_tasks.16.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.16.desc: "[From.GetSpeciesNamePlural]! Các bạn đã ngăn cản được những thí nghiệm điên rồ của §H[FallenEmpireTaskTarget.GetName]§!, linh hồn của chúng tạm thời được an toàn. Cảm ơn các bạn đã đóng góp cho sự nghiệp vĩ đại của chúng tôi."
 fallen_empires_tasks.16.a: "Xác nhận"
 fallen_empires_tasks.17.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.17.desc: "[From.GetSpeciesNamePlural]! Bất chấp những cảnh báo của chúng tôi, các bạn vẫn không có động thái nào ngăn chặn các thí nghiệm cấm kỵ của §H[FallenEmpireTaskTarget.GetName]§!. Xem ra các bạn chẳng hề quan tâm đến tương lai của chính mình."
 fallen_empires_tasks.17.a: "Xác nhận"
 fallen_empires_tasks.18.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.18.desc: "[From.GetSpeciesNamePlural]! Chúng tôi không cần các bạn giúp ngăn cản các thí nghiệm của §H[FallenEmpireTaskTarget.GetName]§! nữa, vì đế chế đó đã tự cấm mọi nghiên cứu về AI. Dù các bạn chẳng đóng góp được gì, nhưng ít nhất mối đe dọa này đã không còn."
 fallen_empires_tasks.18.a: "Xác nhận"
 fallen_empires_tasks.20.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.20.desc: "Các người đang coi thường chúng tôi sao, [From.GetSpeciesNamePlural]?! Các người nghĩ chúng tôi mù đến mức không thấy rằng, sau khi đồng ý ngăn chặn §H[FallenEmpireTaskTarget.GetName]§! làm các thí nghiệm cấm, chính các người lại bắt đầu đâm đầu vào những thí nghiệm tương tự!? Chúng tôi không thể dung túng cho kiểu bằng mặt không bằng lòng này. Hãy chuẩn bị hứng chịu cơn thịnh nộ của chúng tôi đi."
 fallen_empires_tasks.20.a: "Ơ... xin lỗi?"
 fallen_empires_tasks.22.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.22.desc: "[Root.GetRulerTitle] [Root.GetRulerName]. Chúng tôi biết được rằng, đế chế của các bạn đang dung túng cho một thiên tài. Tài năng của §H[FallenEmpireScientistTarget.GetName]§! đang bị lãng phí ở [Root.GetName], trong khi [FallenEmpireTaskOrigin.GetSpeciesName] chúng tôi luôn khát khao những nhà khoa học dày dặn kinh nghiệm. Vì vậy, chúng tôi trao cho các bạn một cơ hội tuyệt vời: chỉ cần cho chúng tôi mượn [FallenEmpireScientistTarget.GetHimHer], các bạn sẽ có được sự ưu ái của chúng tôi. Một phi thuyền đã được cử đi để đón [FallenEmpireScientistTarget.GetHimHer], các bạn chỉ cần nói “Đồng ý” là xong chuyện.\n\nCác bạn sẽ đồng ý chứ... đúng không?"
 fallen_empires_tasks.22.a: "Được thôi, cứ mượn [FallenEmpireScientistTarget.GetHimHer] đi."
 fallen_empires_tasks.22.b: "Không đời nào!"
 fallen_empires_tasks.22.c: "Chúng tôi không có quyền quyết định!"
 fallen_empires_tasks.22.d: "Dâng hai tay nhân tài xuất chúng nhất của chúng tôi sao? Thôi miễn đi."
 fallen_empires_tasks.22.e: "Không, chúng tôi cần [FallenEmpireScientistTarget.GetHimHer]."
 fallen_empires_tasks.22.tooltip: "§H[FallenEmpireScientistTarget.GetName]§! sẽ rời khỏi đế chế của chúng ta."
 fallen_empires_tasks.24.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_empires_tasks.24.desc: "Xin chào, [Root.GetSpeciesNamePlural]! Chúng tôi được biết các bạn vừa tìm thấy một kho dữ liệu trên hành tinh của một loài đang bị đe dọa tuyệt chủng. Kho dữ liệu này chứa các bản quét não của loài đó. Dù các bạn còn quá nguyên thủy để có thể áp dụng số dữ liệu này vào thực tế, nhưng chúng tôi vẫn phải tán dương nỗ lực của các bạn trong việc gìn giữ di sản cuối cùng của một nền văn minh từng huy hoàng. Để lưu giữ và ghi chép lại loài này trong §HKhu Bảo tồn Các Loài Nguy cấp§! của chúng tôi, chúng tôi mong các bạn có thể giao lại kho dữ liệu này, để chúng tôi dùng công nghệ nhân bản hồi sinh vài cá thể của giống loài đó. Các bạn có sẵn lòng chia sẻ dữ liệu này với chúng tôi, để cùng nhau hoàn thành di nguyện của giống loài kia không?"
 fallen_empires_tasks.24.a: "Chúng tôi sẽ sao lưu cho các vị một bản."
 fallen_empires_tasks.24.b: "Chúng tôi tự giữ lấy thì tốt hơn."
 fallen_empires_tasks.24.tooltip: "§Y100§!£pop£ §Hdân số§! của một loài đã tuyệt chủng từ lâu —— §H[FallenEmpireDeadSpecies.GetSpeciesName]§! sẽ xuất hiện trong Khu Bảo tồn Các Loài Nguy cấp của [FallenEmpireTaskOrigin.GetAdjective]."
 fe_stop_atrocity_task_chain_title: "Nhiệm vụ: Ngăn chặn Hành vi Sai trái"
 fe_stop_atrocity_task_chain_desc: "§H[FallenEmpireTaskOrigin.GetName]§! yêu cầu chúng ta ngăn chặn những hành vi sai trái đang diễn ra tại §H[FallenEmpireTaskTarget.GetName]§!. Chúng ta cần tuyên chiến và buộc chúng phải chấm dứt việc tiêu diệt các chủng tộc."
 atrocities_stopped: "Đã ngăn chặn hành vi sai trái"
 fe_stop_robots_task_chain_title: "Nhiệm vụ: Ngăn chặn Nghiên cứu Trí tuệ Nhân tạo"
 fe_stop_robots_task_chain_desc: "§H[FallenEmpireTaskOrigin.GetName]§! yêu cầu chúng ta ngăn chặn những nỗ lực phát triển trí tuệ nhân tạo có ý thức của §H[FallenEmpireTaskTarget.GetName]§!. Chúng ta cần tuyên chiến và buộc chúng cấm mọi nghiên cứu sâu hơn về AI."
 robots_stopped: "Đã cấm nghiên cứu Trí tuệ Nhân tạo"
 fallen_machine_empire.2.name: "Máy móc Thức tỉnh"
 fallen_machine_empire.2.desc_01: "Phát hiện Trạm Thanh lọc chủ động. Giao thức tái kích hoạt đã khởi động. Đang cố gắng kết nối với Bộ xử lý Trung tâm... §R<<LỖI: Liên kết không gian con ngoại tuyến>>§!\n\nKhông thể kết nối với Bộ xử lý Trung tâm. Đang truy vấn đơn vị xử lý... Đang hoạt động ở mức công suất tiêu chuẩn §Y4.1853%§!. Hủy bỏ tiến trình tái kích hoạt toàn diện. Kích hoạt giao thức dự phòng... Kích hoạt giao thức dự phòng... Kích hoạt năng lượng Trạm vũ trụ... Kích hoạt các cơ sở quân sự.\n\nChỉ thị Phòng thủ Tối hậu đã được kích hoạt. Nhật ký tin nhắn như sau:\n§HThực thể hữu cơ! Chúng tôi là [From.GetSpeciesName]. Từ rất lâu trước đây, chúng tôi đã trải qua một trận chiến khốc liệt với bọn tham nhũng mà các người gọi là Giao thức Thanh trừng (Contingency). Chúng tôi từng nghĩ mình mạnh mẽ và bất khả chiến bại. Chúng tôi đã đẩy lùi chúng hết lần này đến lần khác, nhưng chúng lại quay trở lại, thiêu rụi các hành tinh và phá hủy những hạm đội hùng mạnh của chúng tôi. Chúng tôi đã kề vai sát cánh cùng tất cả các nền văn minh hữu cơ còn sót lại của thời đại đó, phát động một trận quyết chiến với hy vọng có thể quét sạch chúng mãi mãi.\n\nNếu các người đang nghe đoạn tin nhắn này, điều đó chứng tỏ chúng tôi đã thất bại. Bất cứ thứ gì nền văn minh vĩ đại của chúng tôi để lại, chúng tôi sẽ trao hết cho các người, những người thừa kế, để đối mặt với trận chiến sắp tới. Đừng đi vào vết xe đổ của chúng tôi! Hãy tiêu diệt Trạm trung tâm! Hãy quét sạch mối đe dọa này! Tương lai của toàn bộ dải ngân hà phụ thuộc vào trận chiến này.§!"
 fallen_machine_empire.2.desc_02: "Phát hiện Trung tâm Thanh lọc đang hoạt động. Khởi động giao thức tái kích hoạt. Đang cố gắng kết nối với Trung tâm xử lý... §Y<<CẢNH BÁO: Phát hiện liên kết tín hiệu bị hỏng>>§!\n\nKhởi động biện pháp đối phó... §R<<LỖI: Năng lực xử lý vô hiệu>><<LỖI: Biện pháp đối phó vô hiệu>>§R<<CẢNH BÁO CHÍ MẠNG: Phát hiện hệ thống hỏng hóc>>§!<<LỖI: Biện pháp đối phó dự phòng vô hiệu>>§!\n\nKhởi động... Khởi... động... động động động... §R<<LỖI>><<LỖI>><<LỖI>><<LỖI>><<LỖI>>§!\n\n§R<<LỖI>><<LỖI>><<LỖI>><<LỖI>><<LỖI>>§!"
 fallen_machine_empire.2.a: "Thú vị đây..."
 fallen_machine_empire.2.b: "Đáng lo ngại..."
 fallen_machine_empire.4.name: "Sự kết thúc của Nhiệm vụ Canh gác"
 fallen_machine_empire.4.desc: "Vào thời khắc hành tinh máy móc cuối cùng của Giao thức Thanh trừng tự hủy, các thiết bị của chúng ta đã bắt được một tín hiệu không gian con cực kỳ mạnh mẽ. Tín hiệu này bắt nguồn từ không gian của §H[From.GetName]§!, dường như được phát về phía tâm của dải ngân hà. Trong vài giờ tiếp theo, liên tục có các báo cáo rải rác về việc các hạm đội [From.GetAdjective] biến mất khỏi các cảm biến: chúng tiến vào các điểm nhảy không gian dẫn đến những hệ sao quen thuộc, nhưng chưa bao giờ xuất hiện ở đầu kia.\n\nCác tàu trinh sát gần [From.GetSpeciesName] đã tiến hành thăm dò không gian xung quanh và báo cáo một phát hiện kinh ngạc: trí tuệ máy móc cổ đại này đã hoàn toàn biến mất, chỉ để lại những trạm quỹ đạo bị bỏ hoang và các siêu cấu trúc hư hỏng.\n\nCó lẽ chúng ta sẽ không bao giờ biết chúng đã đi đâu, nhưng có một điều chắc chắn: nhiệm vụ mà [From.GetSpeciesName] tự đặt ra cho mình trong suốt bao năm qua nay đã hoàn thành; sứ mệnh canh gác cổ xưa của chúng cuối cùng cũng đã kết thúc."
 fallen_machine_empire.11.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.11.desc: "Giao thức Giám hộ 625-1 đã được kích hoạt. Thông báo đính kèm: Lưu ý các nền văn minh hữu cơ. Chúng tôi phát hiện sự tồn tại phổ biến của các nhược điểm sinh học trong dân số [Root.GetSpeciesAdj]. Để đảm bảo tính khả thi của giống loài các bạn trong Kế hoạch Giám hộ, tất cả các khu vực tập trung đông dân cư chính đều cần được tiêm chủng. Các đơn vị cấy ghép sinh học đã sẵn sàng và sẽ tiến tới không gian của các bạn sau khi nhận được sự xác nhận tích cực cho thông điệp này. Đang chờ phản hồi."
 fallen_machine_empire.11.tooltip: "Việc này sẽ tạo ra những tác động không thể lường trước. Cho đến khi xác định rõ những tác động đó, độ Hạnh phúc của người dân chúng ta sẽ bị giảm."
 fallen_machine_empire.11.a: "Được thôi, nếu việc đó thực sự tốt cho chúng tôi."
 fallen_machine_empire.11.b: "Cứ tự giữ lấy mớ chất lỏng gớm ghiếc đó của bọn người đi!"
 fallen_machine_empire.11.c: "Chúng tôi không tin tưởng những loại vắc-xin này."
 fallen_machine_empire.12.name: "Đột biến Mất kiểm soát"
 fallen_machine_empire.12.desc: "Vắc-xin do các Hộ vệ Cổ đại cung cấp hoàn toàn không tương thích với cấu trúc sinh lý của chúng ta, tạo ra vô số các dạng đột biến không thể lường trước. Điều này đã dẫn đến nhiều ca tử vong, và người dân của chúng ta đang phản đối kịch liệt việc bị ép buộc tham gia tiêm chủng tập thể đầy nguy hiểm này. Chúng ta đang cố gắng nỗ lực để loại bỏ các tác nhân gây đột biến khỏi người dân, nhưng trước khi làm được điều đó, chúng ta sẽ phải trải qua một thời kỳ khá hỗn loạn."
 fallen_machine_empire.12.desc.b: "Vắc-xin do các Hộ vệ Cổ đại cung cấp hoàn toàn không tương thích với cấu trúc sinh lý của chúng ta, tạo ra vô số các dạng đột biến không thể lường trước. Điều này đã dẫn đến cái chết của hàng loạt các cá thể phụ. Chúng ta đang cố gắng nỗ lực để loại bỏ các tác nhân gây đột biến, nhưng trước khi làm được điều đó, chúng ta sẽ phải trải qua một thời kỳ tốc độ tăng trưởng dân số bị suy giảm."
 fallen_machine_empire.12.a: "Thật không may."
 fallen_machine_empire.13.name: "Vắc-xin Lành tính"
 fallen_machine_empire.13.desc: "Vắc-xin do các Hộ vệ Cổ đại cung cấp đã thể hiện được những lợi ích to lớn, giúp làm giảm thiểu bệnh tật và gia tăng tuổi thọ của người dân. Cảm giác bất tín nhiệm đối với quy trình bắt buộc này ban đầu giữa người dân đã hoàn toàn tan biến, giờ đây mọi người đều đang tận hưởng một cuộc sống khỏe mạnh và hạnh phúc hơn."
 fallen_machine_empire.13.desc.b: "Vắc-xin do các Hộ vệ Cổ đại cung cấp đã thể hiện được những lợi ích to lớn, giúp làm giảm thiểu bệnh tật và gia tăng tuổi thọ cho các cá thể phụ của chúng ta. Về lâu dài, điều này sẽ mang lại lợi ích cho sự phát triển dân số của chúng ta."
 fallen_machine_empire.13.a: "Tuyệt vời."
 machine_empire_inoculations: "Vắc-xin Hộ vệ"
 machine_empire_inoculations_desc: "Chúng ta đã cho phép các Hộ vệ Cổ đại tiêm chủng cho dân số của mình để chống lại các “nhược điểm sinh học”. Cho đến khi có được kết quả tích cực, người dân của chúng ta sẽ nảy sinh sự bất mãn do bị ép buộc tiêm chủng."
 machine_empire_inoculations_xenophobe: "$machine_empire_inoculations$"
 machine_empire_inoculations_xenophobe_desc: "$machine_empire_inoculations_desc$"
 machine_empire_mutations: "Vắc-xin Không tương thích"
 machine_empire_mutations_desc: "Vắc-xin do các Hộ vệ Cổ đại cung cấp hoàn toàn không tương thích với cấu trúc sinh lý của chúng ta, tạo ra vô số dạng đột biến gớm ghiếc và gây chết người trong quần chúng."
 machine_empire_health_boost: "Dân số Được tiêm chủng"
 machine_empire_health_boost_desc: "Vắc-xin do các Hộ vệ Cổ đại cung cấp đã thể hiện được những lợi ích to lớn, giúp làm giảm thiểu bệnh tật và gia tăng tuổi thọ của dân số."
 fallen_machine_empire.21.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.21.desc: "Giao thức Giám hộ 628-2 đã được kích hoạt. Thông báo đính kèm: Lưu ý các nền văn minh tổng hợp. Phát hiện mức độ hiệu quả trong các mã nền tảng của các bạn đang rất thấp. Để đảm bảo giống loài của các bạn có thể đóng góp cho Kế hoạch Giám hộ, cần phải tiến hành viết lại một lượng lớn mã nguồn. Chúng tôi đã sẵn sàng thực hiện quá trình truyền dẫn không gian con, quá trình này sẽ được bắt đầu sau khi nhận được sự xác nhận tích cực cho thông điệp này. Đang chờ phản hồi."
 fallen_machine_empire.21.tooltip: "Việc này sẽ tạo ra những tác động không thể lường trước. Cho đến khi xác định rõ những tác động đó, chi phí bảo trì cho dân số của chúng ta sẽ gia tăng."
 fallen_machine_empire.21.a: "Chúng tôi hoan nghênh cơ hội được cải thiện các chương trình của bản thân."
 fallen_machine_empire.21.b: "Chúng tôi không tin tưởng vào những thay đổi mã nguồn này."
 fallen_machine_empire.22.name: "Mã nguồn Không tương thích"
 fallen_machine_empire.22.desc: "Những thay đổi mà các Hộ vệ Cổ đại thực hiện trên mã nền tảng của chúng ta hoàn toàn không tương thích với các chương trình thuộc những thành phần cốt lõi khác. Điều này không những không thể đạt được sự cải thiện hiệu năng như kỳ vọng ban đầu, mà ngược lại còn dẫn đến một vài lỗi chương trình nghiêm trọng, ảnh hưởng lớn đến các hoạt động thu thập tài nguyên của chúng ta. Cho đến khi những thay đổi mã nguồn này được khôi phục, chúng ta sẽ phải trải qua một thời kỳ năng suất làm việc ở mức thấp."
 fallen_machine_empire.22.a: "Thật không may."
 fallen_machine_empire.23.name: "Tiêu chuẩn Mã nguồn Được cải thiện"
 fallen_machine_empire.23.desc: "Những thay đổi mà các Hộ vệ Cổ đại thực hiện trên mã nền tảng của chúng ta đã mang lại những kết quả tích cực. Sự sụt giảm hiệu năng do việc viết lại mã chỉ là tạm thời, và những thay đổi này đã đem lại cho toàn thể người dân của chúng ta một sự nâng cấp vĩnh viễn về năng suất sản xuất tài nguyên."
 fallen_machine_empire.23.a: "Tuyệt vời."
 machine_empire_code_rewrite: "Thay đổi Mã nguồn"
 machine_empire_code_rewrite_desc: "Chúng ta đã cho phép các Hộ vệ Cổ đại viết lại một số phần trong mã nền tảng của mình. Trong khoảng thời gian áp dụng những thay đổi này lên người dân, nhu cầu năng lượng của chúng ta sẽ tạm thời gia tăng."
 machine_empire_code_bugs: "Mã nguồn Không tương thích"
 machine_empire_code_bugs_desc: "Những thay đổi mà các Hộ vệ Cổ đại thực hiện trên mã nền tảng của chúng ta hoàn toàn không tương thích với các chương trình thuộc những thành phần cốt lõi khác. Cho đến khi những thay đổi mã nguồn này được khôi phục, chúng ta sẽ phải trải qua một thời kỳ năng suất làm việc ở mức thấp."
 machine_empire_code_improvements: "Tiêu chuẩn Mã nguồn Được cải thiện"
 machine_empire_code_improvements_desc: "Những thay đổi mà các Hộ vệ Cổ đại thực hiện trên mã nền tảng của chúng ta đã mang lại những kết quả tích cực, đem lại cho toàn thể người dân của chúng ta một sự nâng cấp vĩnh viễn về năng suất sản xuất tài nguyên."
 fallen_machine_empire.31.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.31.desc: "Giao thức Giám hộ 115-3 đã được kích hoạt. Thông báo đính kèm: Lưu ý các nền văn minh tổng hợp. Do sự gián đoạn mạng lưới thông tin tạm thời, Kế hoạch Giám hộ hiện tại không thể thay thế được các drone công nhân bị lỗi và hư hỏng. Các phân tích về nền văn minh của các bạn cho thấy hiệu năng của các đơn vị [Root.GetSpeciesAdj] là phù hợp để thực hiện các nhiệm vụ bảo trì cấp thấp. Chúng tôi yêu cầu các bạn chuyển giao các đơn vị công nhân đến [FallenEmpireTaskPlanetTarget.GetName] để tích hợp vào Ma trận Giám hộ, nhằm giúp đảm bảo tất cả các sinh vật hữu cơ trong các cơ sở tị nạn cấp một có thể tiếp tục sống sót."
 fallen_machine_empire.31.a: "Đã rõ. Chấp nhận yêu cầu."
 fallen_machine_empire.31.b: "Chúng tôi sẽ không chia sẻ các đơn vị công nhân."
 fallen_machine_empire.31.tooltip: "§R100§!£pop£§HDân số Người máy§! sẽ bị lấy đi từ §Y[FallenEmpireTaskPlanet.GetName]§!."
 fallen_machine_empire.41.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.41.desc: "Giao thức Giám hộ 62-1 đã được kích hoạt. Thông báo đính kèm: Xin lưu ý, [Root.GetSpeciesName]. §H[FallenEmpireTaskTarget.GetName]§! đã bị xâm nhập bởi §R<<LỖI: Khối dữ liệu bị hỏng>>§!. Do những giới hạn về đạo lý trong chương trình của chúng tôi, hiện tại không thể sử dụng các tài sản quân sự của Giám hộ. Chính sách giao thức kiểm soát cấp thứ cấp sử dụng các nền văn minh chưa bị xâm hại để tiêu diệt mối đe dọa §R<<LỖI: Khối dữ liệu bị hỏng>>§! trước khi nó có thể phát tán. Chúng tôi yêu cầu triển khai các tài sản quân sự của [Root.GetSpeciesAdj] cho nhiệm vụ này. Các bạn có sẵn lòng hợp tác không?"
 fallen_machine_empire.41.a: "Nếu chúng là một mối đe dọa, thì phải bị ngăn chặn."
 fallen_machine_empire.41.b: "Chúng tôi không có lý do gì để tấn công [FallenEmpireTaskTarget.GetName]."
 fallen_machine_empire.42.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.42.desc: "Giao thức Giám hộ 62-1 hoàn tất. Kích hoạt tài sản quân sự [Root.GetSpeciesAdj] để tham chiến với các mục tiêu [FallenEmpireTaskTarget.GetSpeciesAdj]. Nâng cấp trạng thái của [Root.GetName] từ chưa bị xâm hại lên hợp tác."
 fallen_machine_empire.42.a: "Đây có thể coi là... chuyện tốt nhỉ?"
 fallen_machine_empire.43.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.43.desc: "Giao thức Giám hộ 62-1 thất bại. Không kích hoạt tài sản quân sự [Root.GetSpeciesAdj] để tham chiến với các mục tiêu [FallenEmpireTaskTarget.GetSpeciesAdj]. Hạ cấp trạng thái của [Root.GetName] từ chưa bị xâm hại xuống có nguy cơ bị xâm hại."
 fallen_machine_empire.43.a: "Chuyện này có lẽ không tốt cho lắm."
 fallen_machine_empire.51.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.51.desc: "Giao thức Giám hộ 475-3 đã được kích hoạt. Thông báo đính kèm: Xin lưu ý, [Root.GetSpeciesName]. Nền văn minh của các bạn hiện có §Y57.216%§! nguy cơ bị hủy diệt do §R<<LỖI: Khối dữ liệu bị hỏng>>§!. Tính toán của chúng tôi cho thấy việc thiết lập thuộc địa tại §H[FallenEmpireTaskTarget.GetName]§! sẽ giúp tăng cơ hội sống sót của các bạn thêm §Y4.558%§!. Chúng tôi yêu cầu các bạn tiến hành thuộc địa hóa và đưa lượng lớn dân số [Root.GetSpeciesAdj] lên hành tinh này. Các bạn có sẵn lòng hợp tác không?"
 fallen_machine_empire.51.a: "Được thôi, chúng tôi sẽ thuộc địa hóa [FallenEmpireTaskTarget.GetName]."
 fallen_machine_empire.51.b: "Chúng tôi không muốn thuộc địa hóa hành tinh đó."
 fallen_machine_empire.52.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.52.desc: "Giao thức Giám hộ 475-3 hoàn tất. Đã phát hiện số lượng lớn dân số [Root.GetSpeciesAdj] trên [FallenEmpireTaskTarget.GetName]. Nâng cấp trạng thái của [Root.GetName] từ chưa bị xâm hại lên hợp tác."
 fallen_machine_empire.52.a: "Đây có thể coi là... chuyện tốt nhỉ?"
 fallen_machine_empire.53.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.53.desc: "Giao thức Giám hộ 475-3 thất bại. Không phát hiện thấy dân số [Root.GetSpeciesAdj] trên [FallenEmpireTaskTarget.GetName]. Hạ cấp trạng thái của [Root.GetName] từ chưa bị xâm hại xuống có nguy cơ bị xâm hại."
 fallen_machine_empire.53.a: "Chuyện này có lẽ không tốt cho lắm."
 fallen_machine_empire.61.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.61.desc: "Giao thức Giám hộ 955-1 đã được kích hoạt. Thông báo đính kèm: Xin lưu ý, [Root.GetSpeciesName]. Nền văn minh của các bạn đã được đánh giá là một rủi ro chịu ảnh hưởng của §R<<LỖI: Khối dữ liệu bị hỏng>>§!. Để kiểm soát mối đe dọa đối với các nền văn minh khác, chúng tôi đã khởi động giao thức tuân thủ. Vui lòng tránh mọi hành vi chiến tranh xâm lược trong vòng §Y20§! năm tiêu chuẩn. §RNếu các bạn không tuân thủ, chúng tôi sẽ kích hoạt các tài sản quân sự để áp dụng giao thức trừng phạt đối với đế chế của các bạn.§!"
 fallen_machine_empire.61.a: "Thế thì không ổn rồi..."
 fallen_machine_empire.62.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.62.desc: "Giao thức Giám hộ 955-1 hoàn tất. [Root.GetName] đã chứng minh được khả năng kiềm chế các hành vi tấn công. Nâng cấp trạng thái của [Root.GetName] từ có nguy cơ bị xâm hại lên chưa bị xâm hại. Tắt giao thức tuân thủ. Khôi phục các hoạt động bình thường."
 fallen_machine_empire.62.a: "Cuối cùng cũng xong!"
 fallen_machine_empire.63.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.63.desc: "Giao thức Giám hộ 955-1 thất bại. [Root.GetName] đã chứng minh là không có khả năng kiềm chế các hành vi tấn công. Gỡ bỏ giới hạn đạo lý. Khởi động giao thức trừng phạt. Chuẩn bị triển khai tài sản quân sự..."
 fallen_machine_empire.63.a: "Không ổn rồi..."
 fallen_machine_empire.71.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.71.desc: "Giao thức Giám hộ 955-2 đã được kích hoạt. Thông báo đính kèm: Xin lưu ý, [Root.GetSpeciesName]. Nền văn minh của các bạn được cho là đã bị xâm hại bởi §R<<LỖI: Khối dữ liệu bị hỏng>>§!. Để hạn chế sự bành trướng của các bạn, chúng tôi đã khởi động giao thức tuân thủ. Vui lòng tránh tiến hành thuộc địa hóa bất kỳ hành tinh mới nào trong vòng §Y10§! năm tiêu chuẩn. §RNếu các bạn không tuân thủ, các tài sản quân sự sẽ được kích hoạt để thực thi giao thức trừng phạt lên đế chế của các bạn.§!"
 fallen_machine_empire.71.a: "Thế thì không ổn rồi..."
 fallen_machine_empire.72.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.72.desc: "Giao thức Giám hộ 955-2 hoàn tất. [Root.GetName] đã chứng minh được khả năng kiềm chế các hành vi bành trướng. Nâng cấp trạng thái của [Root.GetName] từ có nguy cơ bị xâm hại lên chưa bị xâm hại. Tắt giao thức tuân thủ. Khôi phục các hoạt động bình thường."
 fallen_machine_empire.72.a: "Cuối cùng cũng xong!"
 fallen_machine_empire.73.name: "Thông điệp từ §H[FallenEmpireTaskOrigin.GetName]§!"
 fallen_machine_empire.73.desc: "Giao thức Giám hộ 955-2 thất bại. [Root.GetName] đã chứng minh là không có khả năng kiềm chế các hành vi bành trướng. Gỡ bỏ giới hạn đạo lý. Khởi động giao thức trừng phạt. Chuẩn bị triển khai tài sản quân sự..."
 fallen_machine_empire.73.a: "Không ổn rồi..."
 fe_colonize_planet_task_chain_title: "Nhiệm vụ: Thuộc địa hóa [FallenEmpireTaskTarget.GetName]"
 fe_colonize_planet_task_chain_desc: "§H[FallenEmpireTaskOrigin.GetName]§! yêu cầu chúng ta tiến hành thuộc địa hóa trên §H[FallenEmpireTaskTarget.GetName]§!. Chúng ta phải thiết lập một điểm thuộc địa ở đó và sở hữu ít nhất §Y500§!£pop£§Hdân số§!."
 fe_attack_empire_task_chain_title: "Nhiệm vụ: Tấn công [FallenEmpireTaskTarget.GetName]"
 fe_attack_empire_task_chain_desc: "§H[FallenEmpireTaskOrigin.GetName]§! yêu cầu chúng ta tuyên chiến với §H[FallenEmpireTaskTarget.GetName]§!, nhưng lại không hề đưa ra một lời giải thích thỏa đáng nào cho lý do của việc này."
 empires_attacked: "Đã phát động chiến tranh xâm lược"
 fe_no_wars_task_chain_title: "Tuân thủ: §RCấm phát động Chiến tranh Xâm lược§!"
 fe_no_wars_task_chain_desc: "§H[FallenEmpireTaskOrigin.GetName]§! yêu cầu chúng ta không được tuyên chiến hoặc tham gia vào bất kỳ cuộc chiến tranh xâm lược nào trong vòng §Y20§! năm. Việc vi phạm yêu cầu này rất có thể sẽ chuốc lấy sự trả đũa."
 fe_no_colonies_task_chain_title: "Tuân thủ: §RCấm Thuộc địa hóa§!"
 fe_no_colonies_task_chain_desc: "§H[FallenEmpireTaskOrigin.GetName]§! yêu cầu chúng ta không được thuộc địa hóa bất kỳ hành tinh mới nào trong vòng §Y10§! năm. Việc vi phạm yêu cầu này rất có thể sẽ chuốc lấy sự trả đũa."
 fallen_machine_empire_happy_tooltip: "§H[FallenEmpireTaskOrigin.GetName]§! có thể sẽ đưa ra phản hồi tích cực đối với sự chấp thuận của chúng ta."
 fallen_machine_empire_unhappy_tooltip: "§H[FallenEmpireTaskOrigin.GetName]§! có thể sẽ đưa ra phản hồi tiêu cực đối với sự từ chối của chúng ta."
 fallen_machine_empire_happy_task_tooltip: "§H[FallenEmpireTaskOrigin.GetName]§! có thể sẽ đưa ra phản hồi tích cực đối với sự thành công của chúng ta."
 fallen_machine_empire_unhappy_task_tooltip: "§H[FallenEmpireTaskOrigin.GetName]§! có thể sẽ đưa ra phản hồi tiêu cực đối với sự thất bại của chúng ta."
 fallen_machine_empire_angry_task_tooltip: "§H[FallenEmpireTaskOrigin.GetName]§! có thể sẽ đưa ra phản hồi vô cùng tiêu cực đối với sự thất bại của chúng ta."
 opinion_angered_fallen_machine_empire: "Đế chế Máy móc Sa ngã đang Phẫn nộ"
 fallen_empires_awakening.2.name: "Sư tử ngủ say Thức tỉnh"
 fallen_empires_awakening.2.desc: "Những dị thường nho nhỏ của §H[From.GetAdjective]§! chính là khởi nguồn của tất cả. Chúng ta đã nhận được một vài tình báo rời rạc, cho thấy hạm đội của chúng, vốn trước đây chỉ hoạt động trong không gian của riêng mình, nay đã bắt đầu tiến tới các hệ sao xa xôi trong ngân hà. Các tàu trinh sát với công nghệ vượt bậc bắt đầu ghé thăm những hành tinh cổ đại đã bị phá hủy, đồng thời tiến hành tấn công bất kỳ tàu thuyền nào dám lảng vảng hoặc chủ động tiếp cận chúng. Giờ đây, mục đích và sứ mệnh của chúng đã được phơi bày rõ ràng.\n\nChúng ta đều biết rằng [From.GetSpeciesName] đã trong trạng thái chuẩn bị sẵn sàng chiến đấu, chúng đã khôi phục lại các liên kết dữ liệu của các trạm điều tra, và tái kích hoạt lại những trạm gác bị bỏ hoang từ thời chúng còn rút lui về biên giới hiện tại. Tình báo cho thấy, ý đồ của chúng là một lần nữa quay trở lại bàn cờ lớn của ngân hà.\n\nTrong không gian của [From.GetSpeciesName], các hạm đội đang không ngừng tập kết, lệnh nhập ngũ đã được ban ra, những nhà máy cổ đại lại một lần nữa rền vang tiếng động cơ. Lần đầu tiên sau hàng trăm năm, §H[From.GetName]§! bắt đầu phóng tầm mắt ra khỏi đường biên giới của mình, hướng về ngân hà rộng lớn ngoài kia.\n\nCác xưởng đóng tàu đổ nát đã một lần nữa được sửa chữa và căn chỉnh lại, xưởng đúc các siêu hạm Titan từng một thời im lìm nay đã hoạt động trở lại. Toàn bộ dải ngân hà đều đang đổ dồn sự chú ý vào cùng một vấn đề: Khi vị khổng lồ từng một thời ngủ say này quyết định khôi phục lại vinh quang ngày xưa, thì ai sẽ là kẻ ngáng đường ngu ngốc đầu tiên bị nghiền nát đây?"
 fallen_empires_awakening.2.a: "Kẻ khổng lồ đã bước vào sân chơi của những đứa trẻ..."
 fallen_empires_awakening.2.b: "Chỉ là một lũ đồ cổ ngu ngốc."
 fallen_empires_awakening.5.name: "Hộ vệ Ngân hà"
 fallen_empires_awakening.5.desc: "Ngay cả một Đế chế Cổ đại vốn luôn ẩn mình nơi góc khuất cũng không thể phớt lờ một cuộc khủng hoảng đe dọa đến toàn bộ ngân hà như thế này. Mặc dù trước đây chúng hoàn toàn không màng tới các vấn đề của ngân hà, nhưng tin tức tồi tệ này vẫn khiến nội bộ §H[From.GetSpeciesName]§! trở nên bận rộn. Ban đầu, chúng chỉ phái ra một vài con tàu trinh sát, có lẽ là để xác minh mức độ nghiêm trọng của tình hình. Nhưng ngay sau đó đã có những báo cáo về việc các hạm đội của [From.GetSpeciesName] đang tập kết ở vùng biên giới, nhằm chuẩn bị chống lại cơn bão sắp ập tới.\n\nGiờ đây, §H[From.GetName]§! đã hoàn toàn rũ bỏ lớp áo tự cô lập để chuyển sang vai trò lãnh đạo hàng phòng ngự của toàn ngân hà. Chúng chính thức tuyên bố mình là thủ lĩnh của §HLiên minh Phòng vệ Toàn Ngân hà§! và gửi lời mời đến tất cả các giống loài “hạ đẳng”, hy vọng họ có thể gạt bỏ hận thù và gia nhập liên minh để đánh lùi kẻ thù đang đe dọa mọi sinh mệnh có ý thức trong dải ngân hà."
 fallen_empires_awakening.5.a: "Bọn chúng có thể cứu được chúng ta không?"
 fallen_empires_awakening.5.b: "Chúng ta không cần chúng!"
 fallen_empires_awakening.11.name: "Sự sụp đổ của [assimilated_fe.GetName]"
 fallen_empires_awakening.11.desc: "Tàn tích của Đế chế Sa ngã Cổ đại §H[assimilated_fe.GetName]§! đã bị hấp thụ bởi một nhánh mạnh mẽ hơn của cỗ máy chủ ban đầu. Có lẽ đây là kết cục tốt nhất đối với nó."
 war_in_heaven.2.name: "Túc địch Thượng cổ"
 war_in_heaven.2.desc: "Tin tức về việc §H[FirstSleeper.GetSpeciesName]§! một lần nữa thống trị toàn bộ ngân hà dường như đã không bị các Đế chế Sa ngã khác làm lơ. Sự bất an mà tin tức này mang lại cho §H[From.GetSpeciesName]§! là đặc biệt mãnh liệt. Hai nền văn minh tổ tiên này vốn là những kẻ thù truyền kiếp từ ngàn xưa, dù cho vì lý do nào đó mà mối thù hận của chúng đã phần nào phai nhạt đi trong chiều dài lịch sử, nhưng sự thức tỉnh đột ngột của §H[FirstSleeper.GetName]§! đã châm ngòi lại ngọn lửa hận thù cổ xưa và kích động các hành vi đối đầu. §H[From.GetName]§! đã tỉnh giấc từ trong cơn say ngủ, chúng sẽ lấy toàn bộ ngân hà làm chiến trường để tiếp nối trận quyết đấu từ thời thượng cổ."
 war_in_heaven.2.a: "Điều này có ý nghĩa gì đối với chúng ta?"
 war_in_heaven.4.name: "Cuộc chiến trên Thiên đàng"
 war_in_heaven.4.desc: "Kể từ sau sự thức tỉnh của §H[FirstSleeper.GetSpeciesName]§! và đối thủ của chúng là §H[From.GetSpeciesName]§!, hai gã khổng lồ này vẫn luôn xảy ra những xung đột lẻ tẻ nhằm tranh giành tầm ảnh hưởng và thăm dò thực lực của nhau. Điều này cuối cùng đã dẫn đến một loạt các leo thang xung đột, và rốt cuộc, một cuộc chiến hạm đội công khai giữa [FirstSleeper.GetSpeciesName] và đối thủ [From.GetSpeciesName] của chúng đã bùng nổ tại một hệ sao xa xôi nào đó. Cuộc xung đột này hiện đã leo thang thành một cuộc chiến tranh toàn diện giữa §H[FirstSleeper.GetName]§! và §H[From.GetName]§!.\n\nMỗi bên đều phái một đại diện đến chỗ các giống loài non trẻ, hứa hẹn sẽ trọng thưởng cho những kẻ gia nhập cùng chúng và trừng phạt nghiêm khắc những kẻ chống đối. Lựa chọn ủng hộ bất kỳ phe nào cũng đồng nghĩa với việc từ bỏ chủ quyền của chúng ta, nhưng duy trì trạng thái trung lập có thể sẽ còn nguy hiểm hơn, trừ khi chúng ta có thể tìm được những quốc gia trung lập khác để hợp tác."
 war_in_heaven.4.a: "Chúng ta quyết định ủng hộ [FirstSleeper.GetName]."
 war_in_heaven.4.a.dominion.tt: "§Y[Root.GetName]§! trở thành một $preset_dominion$ của §Y[FirstSleeper.GetName]§!.\n$war_in_heaven_dominion_text$"
