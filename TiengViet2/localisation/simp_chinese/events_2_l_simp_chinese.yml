 FANTASTIC: "Tuyệt vời."
 ####################################
 #Phân loại Bất thường
 ####################################
 #ROOT = PHẠM VI HÀNH TINH
 #FROM = PHẠM VI PHI THUYỀN
 NAME_Former_Cult_Flagship: "Soái hạm của Tà giáo cũ"
 AST_WAVELENGTHS_1_CAT: "Sóng vô tuyến Tiểu hành tinh"
 AST_WAVELENGTHS_1_DESC: "Tiểu hành tinh [Root.GetName] đang phát ra bức xạ xung có kiểm soát. Có ai, hay thứ gì đó, đang muốn nói chuyện với chúng ta chăng?"
 AST_DEBRIS_FIELD_1_CAT: "Bãi mảnh vỡ"
 AST_DEBRIS_FIELD_1_DESC: "Cảm biến báo cáo có thể có thứ gì đó thú vị nằm trong đống đổ nát dày đặc quanh [Root.GetName]."
 HBL_LUSH_PLANET_1_CAT: "Hành tinh xanh tốt"
 HBL_LUSH_PLANET_1_DESC: "Màu sắc của [Root.GetName] đặc biệt xanh lục, các bản quét ban đầu cho thấy trên bề mặt có thể có vài món đồ thú vị."
 UHB_ANCIENT_RUINS_1_CAT: "Tháp bia"
 UHB_ANCIENT_RUINS_1_DESC: "Trên bề mặt [Root.GetName] rải rác những công trình kiến trúc vô cùng đáng kinh ngạc, yêu cầu tiến hành khảo cổ ngay lập tức."
 UHB_MOLTEN_CHART_CAT: "Nóng chảy"
 UHB_MOLTEN_CHART_DESC: "Bề mặt nóng rực của [Root.GetName] phát ra tín hiệu cầu cứu yếu ớt."
 GEN_PLAYGROUND_CAT: "Di tích đầy thú vị"
 GEN_PLAYGROUND_DESC: "Trên một khoảnh nhỏ bề mặt [Root.GetName] rải rác những công trình kiến trúc vô cùng đáng kinh ngạc, yêu cầu tiến hành khảo cổ ngay lập tức."
 AST_SHRINE_1_CAT: "Tiểu hành tinh được điêu khắc"
 AST_SHRINE_1_DESC: "[Root.GetName] bị khoét rỗng một phần, và được điêu khắc vô cùng tinh xảo. Các đường vân trên đá trông hơi quen mắt..."
 HBL_MUSIC_1_CAT: "Âm thanh trong đêm"
 HBL_MUSIC_1_DESC: "Trên [Root.GetName] có hoạt động sóng âm khác thường."
 GAS_ZRO_ICE_CAT: "Hành tinh băng khổng lồ"
 GAS_ZRO_ICE_DESC: "[Root.GetName] thiếu hydro và heli, không thể xếp vào loại hành tinh khí khổng lồ, mà là hành tinh băng khổng lồ."
 AST_ILLICIT_DARK_CAT: "Tiểu hành tinh bức xạ"
 AST_ILLICIT_DARK_DESC: "[Root.GetName] phát ra một hỗn hợp hạt bức xạ đáng sợ vào không gian theo chu kỳ."
 TOX_PURPLE_RAIN_CAT: "Sao độc rực rỡ"
 TOX_PURPLE_RAIN_DESC: "Môi trường sinh học đầy độc tính của [Root.GetName] tạo cho hành tinh này một cảnh quan độc đáo."
 FROZ_BASE_CAT: "Vùng hoang dã đóng băng"
 FROZ_BASE_DESC: "Cảm biến phát hiện hoạt động ngoài dự kiến ở một nơi hẻo lánh trên bề mặt đóng băng của [Root.GetName]."
 FROZ_BASE2_CAT: "Đồng bằng băng tuyết"
 FROZ_BASE2_DESC: "Cảm biến phát hiện hoạt động ngoài dự kiến ở một nơi hẻo lánh trên bề mặt vùng cực của [Root.GetName]."
 TROP_PETS_CAT: "Chạy trốn"
 TROP_PETS_DESC: "Phát hiện những kiểu chuyển động bất thường trong các bụi cây rậm rạp của khu rừng nhiệt đới trên [Root.GetName]."
 BARR_BASE_CAT: "Đồng bằng cằn cỗi"
 BARR_BASE_DESC: "Quét sơ bộ cho thấy trên bề mặt hành tinh có một tín hiệu xung liên tục phát ra ngoài không gian bao la."
 PROJ_MOON_CAT: "Vô cùng kỳ lạ"
 PROJ_MOON_DESC: "Theo các bản quét ban đầu, [Root.GetName] có vài đặc tính kỳ lạ, số liệu của nó khác xa với dự đoán của chúng ta về các hành tinh loại này..."
 SEA_CAT: "Biến ảo khôn lường"
 SEA_DESC: "Một bóng dáng mờ ảo đang cuộn trào bên dưới dòng hải lưu của đại dương trên [Root.GetName]."
 MOLTEN_BASE_CAT: "Nhịp điệu nóng rực"
 MOLTEN_BASE_DESC: "Cảm biến quét được chuyển động có nhịp điệu trên bề mặt nóng rực của [Root.GetName]."
 LEVELED_CAT: "Hơi nước cuộn trào"
 LEVELED_DESC: "[Root.GetName] dường như chỉ có duy nhất một đặc điểm địa chất thú vị..."
 DIMENSIONAL_POCKET_CAT: "Nhiễu loạn chiều không gian"
 DIMENSIONAL_POCKET_DESC: "Bãi mảnh vỡ nơi [Root.GetName] tọa lạc đang cuộn trào dưới ảnh hưởng của một thế lực vô danh nào đó."
 HAB_CORN_CAT: "Chấm xanh nhỏ"
 HAB_CORN_DESC: "Quét quang học cho thấy trên bề mặt [Root.GetName] có vài vệt xanh lục khác thường."
 HAB_MAT_CAT: "Kim loại lấp lánh"
 HAB_MAT_DESC: "Cảm biến phổ năng lượng tán xạ ngược cho thấy có vật chất quý giá trong lớp vỏ hành tinh."
 ATM_ANOMALY_CAT: "Hiện tượng khí quyển bất thường"
 ATM_ANOMALY_DESC: "Số liệu thực tế về khí quyển của [Root.GetName] khác với giá trị mô phỏng."
 FRBR_GRIMACING_CAT: "Thay đổi trong chớp mắt"
 FRBR_GRIMACING_DESC: "Các bản quét lặp đi lặp lại trên bề mặt [Root.GetName] cho ra số liệu không nhất quán, có vẻ như bản thân hành tinh này đang không ngừng xảy ra biến động lớn."
 FROZ_ILLUMINATED_CAT: "Băng tuyết phát sáng"
 FROZ_ILLUMINATED_DESC: "Trên bề mặt [Root.GetName] rải rác các hiện tượng quang học không thể giải thích, có thể nhìn thấy rõ ràng từ ngoài không gian."
 GAS_CLOUDY_CAT: "Mây múa"
 GAS_CLOUDY_DESC: "Đặc điểm khí quyển của [Root.GetName] rất không bình thường so với một hành tinh khí khổng lồ cỡ trung."
 GAIA_MOVE_CAT: "Tựa như thiên đường"
 GAIA_MOVE_DESC: "Đây là hành tinh cấp Gaia, dự kiến [Root.GetName] sẽ có các dạng sống phong phú..."
 FROZ_BOX_CAT: "Chứa đựng bí ẩn"
 FROZ_BOX_DESC: "Bản quét cho thấy trên những đỉnh núi đóng băng của §H[Root.GetName]§! có những tạo tác ngoài hành tinh vô cùng khác thường."
 CONT_SIGNS_CAT: "Vết sẹo hành tinh"
 CONT_SIGNS_DESC: "Bề mặt của [Root.GetName] dường như chi chít vết lõm, điều này cũng không có gì lạ.\n\nĐiểm bất thường là hình dạng của những vết sẹo này, chúng phân bố không theo quy luật. Không có vẻ là kết quả của các vụ va chạm thiên thạch."
 AST_CRATER_CAT: "Khu vực bão bụi"
 AST_CRATER_DESC: "Trên [Root.GetName] có một loạt các hố va chạm. Nhưng trong một cái hố lớn hơn, có thứ gì đó đã mang lại cảm giác không đồng nhất về mặt thị giác..."
 BAR_COLONY_CAT: "Nhìn từ trên cao"
 BAR_COLONY_DESC: "Trên bề mặt cằn cỗi của [Root.GetName], cảm biến quang học phát hiện ra một số thứ có vẻ là các công trình kiến trúc."
 TOX_MAT_CAT: "Vẻ ngoài cực độc"
 TOX_MAT_DESC: "Cảm biến phổ năng lượng tán xạ ngược cho thấy có vật chất quý giá bên dưới bầu khí quyển cực độc của [Root.GetName]."
 AST_CLUSTER_CAT: "Cụm quặng"
 AST_CLUSTER_DESC: "Một nhóm khoáng vật xếp ngay ngắn trôi qua vành đai mảnh vỡ của [Root.GetName], có thể bắt nguồn từ người ngoài hành tinh."
 GAEA_CHECKERED_CAT: "Dò mìn"
 GAEA_CHECKERED_DESC: "Bản quét hình ảnh của [Root.GetName] cho thấy, toàn bộ hành tinh được bao phủ bởi những đường vân như hình mạng lưới."
 GEN_ABANDONED_SHIP_CAT: "Neo đậu"
 GEN_ABANDONED_SHIP_DESC: "Bản quét sơ bộ [Root.GetName] đã cho ra kết quả đáng kinh ngạc.\n\nDường như có thứ gì đó cũng đang quét chúng ta..."
 GEN_DESERT_CAT: "Cồn cát"
 GEN_DESERT_DESC: "Bầu khí quyển của [Root.GetName] cực kỳ mỏng, nhưng dường như có thứ gì đó giống như gió đang thổi qua biển cát trên bề mặt."
 TOX_STRUCTURES_CAT: "Kiến trúc cực độc"
 TOX_STRUCTURES_DESC: "Dưới đám mây độc của [Root.GetName], một loại cấu trúc phi tự nhiên nào đó đang đứng sừng sững trên bề mặt chứa đầy độc tính."
 TROP_WOODS_CAT: "Vương quốc rừng rậm"
 TROP_WOODS_DESC: "Bề mặt của [Root.GetName] được bao phủ bởi một loại cây có hình thù kỳ lạ."
 HOLE_RADIATION_CAT: "Cầu vồng trong bóng tối"
 HOLE_RADIATION_DESC: "Cảm biến phát hiện ra các chỉ số bất thường xung quanh [Root.GetName], không nên xuất hiện ở khoảng cách gần lỗ đen như vậy."
 UHB_BUOY_CAT: "Hiệu ứng Doppler"
 UHB_BUOY_DESC: "Một tín hiệu chao đảo lượn lờ quanh [Root.GetName], và nó không phát ra từ bề mặt hành tinh."
 GAIA_RECORD_CAT: "Quyết tử"
 GAIA_RECORD_DESC: "Vùng đồng bằng xanh tươi của [Root.GetName] vô cùng tĩnh lặng, ngoại trừ tín hiệu phát sóng yếu ớt nhưng đều đặn đó."
 CRYSTAL_MANUFACTORY_CAT: "Nhà máy cổ đại"
 CRYSTAL_MANUFACTORY_DESC: "Một công trình kiến trúc cổ xưa, có vẻ như đã bị bỏ hoang đang lơ lửng trên không trung [Root.GetName], ngoài nó ra thì đây chỉ là một tiểu hành tinh bình thường."
 ####################################
 #Sự kiện Bất thường
 ####################################
 anomaly.75.name: "Bộ não đá"
 anomaly.75.desc: "Quét tiểu hành tinh khổng lồ [From.GetName] đã thu được kết quả thú vị. Lõi của tảng đá này chứa một mạng lưới tinh thể dẫn điện mang dòng điện yếu. Các thành viên trên [Root.GetName] nhận thấy mạng lưới tinh thể này có nét tương đồng với mạng lưới thần kinh nguyên thủy, họ cho rằng ngay cả khi thiên thể này không có trí tuệ hoàn chỉnh thì nó cũng có thể suy nghĩ ở một mức độ nào đó. Họ yêu cầu lấy lõi ra và mang đến trạm quỹ đạo gần nhất để nghiên cứu kỹ hơn."
 anomaly.75.a: "Cứ làm vậy đi."
 anomaly.75.b: "Cố gắng điều tra bề mặt là được."
 anomaly.75.b.tooltip: "Thêm yếu tố sửa đổi §YBộ não đá§! cho [From.GetName]:\n£physics£§G+8§!"
 anomaly.75.c: "Nó có nét giống chúng ta. Chúng ta hãy nói chuyện với nó."
 anomaly.75.c.tooltip: "Ra lệnh cho [Root.GetName] kết nối tàu thăm dò bề mặt với [From.GetName] và giải mã cái gọi là hoạt động thần kinh của nó."
 IS_LITHOID_EMPIRE_ICON_TIP: "Vì §H[This.Owner.GetName]§! là quốc gia thuộc dạng sống §YThạch nhân§!, tùy chọn này có thể sử dụng" #không phải tooltip kích hoạt thực, được sử dụng cùng với icon = {}
 anomaly.76.desc: "Tôi là [rock_scientist.GetName]. Nhiệm vụ này rất thử thách, nhưng tôi cho rằng chúng ta đã thành công giải mã những nội dung này thành những thứ giống như... có lẽ không phải là ngôn ngữ, mà là khái niệm, hoặc ý tưởng. Chúng ta có thể phản hồi những thứ tương tự lại cho tiểu hành tinh, biết đâu có thể giao tiếp được.\n\nChúng tôi sẽ hiển thị một số §Y<đầu ra đã lọc>§!, tôi sẽ cố gắng hết sức để đưa ra một §G“§!lời giải thích hoàn chỉnh hơn§G”§! cho dữ liệu gốc."
 anomaly.76.a: "Nghĩ lại thì, làm thế có vẻ không khôn ngoan lắm."
 anomaly.76.a.tooltip: "Từ bỏ việc giao tiếp trực tiếp với [rock_brain.GetName], giữ khoảng cách để nghiên cứu đi."
 anomaly.76.b: "Cứ làm vậy đi."
 anomaly.77.desc: "\n§Y<Mới><Ý tưởng>.<Lý do>.<Lý do><Gây bối rối>.§!\n\n\n§G“§!Nói thêm một câu, [rock_brain.GetName] không có cơ quan cảm giác theo nghĩa truyền thống. Nó coi những đầu vào của chúng ta là ý tưởng của chính nó. Ít nhất thì ở một mức độ nào đó là như vậy.§G”§!"
 anomaly.77.a: "<Ngươi vẫn chưa hiểu rằng chúng ta không phải là ngươi sao?>"
 anomaly.77.a.response: "\n§Y<Ý tưởng>-<Khác biệt><Phối hợp>-<Giống nhau><Phân kỳ>-<Khác biệt>.§! \n\n\n§G“§!Tôi nghi ngờ bộ não đá cho rằng chúng ta chỉ là sự sai lệch nhận thức nhất thời, nhưng trong quá khứ nó thực sự đã từng có những suy nghĩ như vậy. Chúng ta là một thú tiêu khiển thoáng qua.§G”§!"
 anomaly.77.b: "<Các người đã trôi dạt trên quỹ đạo của [rock_sun.GetName] bao lâu rồi?>"
 anomaly.77.b.response: "\n§Y<Không phải>...<Vừa rồi><Không phải>.<Không phải>.§!\n\n\n§G“§![rock_brain.GetName] không nhận ra, thậm chí chưa từng cảm nhận được sự tồn tại của [rock_sun.GetName]. Ngoài việc nắm bắt hạn chế những ý tưởng xảy ra liên tiếp, nó còn thiếu khái niệm về thời gian.§G”§!"
 anomaly.77.c: "“Chúng ta có nhận được thứ gì hữu ích từ việc này không?”"
 anomaly.77.c.response: "\n§Y<...>§!\n\n\n§G“§!Ồ, có chứ, sự giao tiếp này đang phát triển mạng lưới giải mã của chúng ta với tốc độ đáng kinh ngạc. Tôi rất ngạc nhiên khi thấy nó hoạt động hiệu quả hệt như mã hóa gốc, nhưng tôi cũng nhận được một số chỉ số cảnh báo...§G”§!"
 anomaly.77.d: "<Hãy nói chuyện gì đó khác đi...>"
 anomaly.78.desc: "\n§Y<Truy--.<Truy vấn>.§!\n\n\n§G“§!Đúng như tôi lo lắng. Tàu thăm dò của chúng ta đang làm cạn kiệt năng lượng thúc đẩy ý thức của [rock_brain.GetName]. Bản thân [rock_brain.GetName] cũng không phải là một hệ thống khép kín hoàn hảo, nên sớm muộn gì chuyện này cũng sẽ xảy ra — dù cho có thể sẽ tốn hàng ngàn vạn năm, nhưng ít nhất không phải là lúc này...§G”§!"
 anomaly.78.a: "<Chúng tôi có thể giúp gì cho các người không?>"
 anomaly.78.a.response: "\n§Y<Có>.§!\n\n\n§G“§!Nó nói nó ổn, nhưng thực tế không phải vậy. Chúng tôi đã thử truyền lại một ít năng lượng vào mạng lưới thần kinh, nhưng việc này chỉ tạo ra những sóng não nhiễu hơn, chứ không phải mạnh hơn. Chúng ta đã vượt qua ranh giới, dù chúng ta có làm gì đi nữa, chút năng lượng còn lại sẽ nhanh chóng biến mất. Nó không có cách nào phát hiện ra nhận thức của mình đang chậm lại, cũng không thể biết rằng điều này đồng nghĩa với sự kết thúc của nó. Càng không biết cái chết nghĩa là gì...§G”§!"
 anomaly.78.b1: "<Có trăn trối gì không?>"
 anomaly.78.b1.response: "\n§Y<Lặp lại><Bằng> - <Cảm nhận>.<[rock_fallen_empire.GetRealName]>.§!\n\n\n§G“§!Liệu nó có nhớ lại chúng ta, hay là bây giờ, một lần nữa, cụ thể hóa chúng ta thông qua suy nghĩ của nó? E rằng tín hiệu đang suy yếu nhanh chóng. Chúng tôi cũng không chắc phải hiểu "[rock_fallen_empire.GetRealName]" như thế nào — nó dường như là ngôn từ gần gũi nhất với ngôn ngữ truyền thống mà chúng ta nhận được từ [rock_brain.GetName], nhưng ý nghĩa của nó vẫn rất mờ mịt. Có lẽ chỉ là thuật toán phân tích của chúng ta đang sụp đổ vì mạng lưới thần kinh mục tiêu bị lỗi.§G”§!"
 anomaly.78.b2: "$anomaly.78.b1$"
 anomaly.78.b2.response: "\n§Y<Lặp lại><Bằng> - <Cảm nhận>.§!\n\n\n§G“§!Liệu nó có nhớ lại chúng ta, hay là bây giờ, một lần nữa, cụ thể hóa chúng ta thông qua suy nghĩ của nó? E rằng tín hiệu đang suy yếu nhanh chóng — có lẽ chỉ là thuật toán phân tích của chúng ta đang sụp đổ vì mạng lưới thần kinh mục tiêu bị lỗi.§G”§!"
 anomaly.78.c: "“Đến lúc nói lời tạm biệt rồi.”"
 anomaly.79.desc: "[rock_brain.GetName] đã chìm vào tĩnh lặng. Mọi phương án mà chuyên viên khoa học [rock_scientist.GetName] cố gắng thực hiện để sạc lại năng lượng cho mạng khoáng thạch của tiểu hành tinh này đều thất bại; tất cả những tia sáng trí tuệ từng kích thích các tế bào thần kinh thô sơ của nó đều đã biến mất, nhưng chúng ta đã học được rất nhiều điều từ người họ hàng tiến hóa xa xôi này."
 anomaly.79.a: "Đây là cá thể cuối cùng, hay là cá thể đầu tiên của "loài" này?"
 anomaly.80.name: "Đá đau đầu"
 anomaly.80.desc: "Lõi của [From.From.GetName] vừa được lấy ra cẩn thận khỏi lớp vỏ tiểu hành tinh thì đã phản ứng xấu với môi trường chân không ngoài không gian. Trước khi cục đá này nứt ra một cách chậm rãi nhưng không thể đảo ngược, thiết bị của [Root.GetName] đã phát hiện một sự gia tăng năng lượng đột ngột.\n\nSau đó chúng tôi đã thu hồi được một lượng lớn khoáng vật dẫn điện, nhưng dòng điện bí ẩn từng mang lại sự sống cho chúng thì không còn nữa."
 anomaly.80.a: "Bản thân những viên tinh thể này vẫn có giá trị."
 anomaly.81.desc: "Các chuyên gia gọi hồn của chúng ta đã để lại những dấu vết mới trên lớp khoáng thạch mỏng manh của tiểu hành tinh, khắc lên đó những câu thần chú thô kệch, và nạp đầy dòng điện xung. Tuy nhiên, ý thức từng là của [rock_brain.GetName] không quay trở lại.\n\nGiờ đây nó đã trở thành một thứ khác, chìm trong một giấc mơ tà ác — được gắn thêm động cơ đẩy định hướng, chờ đợi sự điều khiển của chúng ta."
 anomaly.85.name: "Hành tinh thì thầm"
 anomaly.85.desc: "Những tín hiệu điện từ bất thường từ [From.GetName] và các hành tinh lân cận đã thu hút sự chú ý của phi hành đoàn trên [Root.GetName]. Nghiên cứu kỹ hơn cho thấy những tín hiệu này là những liên lạc được mã hóa với nội dung vô cùng tầm thường. Sau đó, dường như nhận ra có người nghe lén, hoạt động điện từ đột ngột dừng lại, nhưng trước đó, [Root.GetName] đã ghi lại được trạng thái của [From.GetName] và các hành tinh khác trong hệ sao của nó."
 anomaly.85.a: "Sử dụng những dữ liệu này để nghiên cứu sâu hơn về viễn thông."
 anomaly.85.b: "Khớp dữ liệu với tất cả các hành tinh trong hệ sao này."
 anomaly.90.name: "Dây leo quấn quanh"
 anomaly.90.desc: "Đám cỏ xanh rậm rạp trên [From.GetName] sau khi chạm vào tàu thăm dò của [Root.GetName] đã xé nát nó một cách hung hãn dị thường. Những dây leo dẻo dai này vươn mạnh về phía con tàu ở đằng xa, đưa ra một lời giải thích hợp lý cho việc hành tinh này vắng bóng động vật.\n\nĐã khởi động một §YDự án Đặc biệt§! để điều tra thêm về đời sống thực vật trên hành tinh này."
 anomaly.90.a: "Loài thực vật ăn thịt người này là một mối đe dọa."
 anomaly.91.name: "Quân đoàn cỏ xanh"
 anomaly.91.desc: "Việc kiểm tra tỉ mỉ đã tiết lộ rằng hành vi bạo lực của cỏ và dây leo trên [From.From.GetName] không phải là phản xạ tự vệ vô thức.\n\nNhững loài thực vật này có một trật tự xã hội nội bộ phức tạp. Các loại cây khác nhau ở các khu vực khác nhau có những sứ mệnh khác nhau, trong đó một trong những loại cây quan trọng nhất dường như chịu trách nhiệm xua đuổi động vật ăn cỏ địa phương và những kẻ xâm nhập từ bầu trời."
 anomaly.91.a.tooltip: "Đã thêm yếu tố sửa đổi §YThực vật xảo quyệt§! cho [From.From.GetName]:\n£society£§G+6§!"
 anomaly.95.name: "Bảo vật phương xa"
 anomaly.95.desc: "Một tấm nhôm được tìm thấy lẫn trong đống đá vụn trôi nổi quanh [From.GetName], bề mặt được anot hóa khiến nó nổi bật giữa các mảnh vỡ kim loại xung quanh. Trên đó có vẽ hai động vật có vú với hình thù buồn cười, cùng một số khối hình học tẻ nhạt."
 anomaly.95.a: "Có lẽ có thể dùng làm đế lót ly uống rượu của tôi."
 anomaly.95.b: "Phân tích tấm nhôm này."
 anomaly.95.c: "Chắc chắn có người sẵn sàng trả giá để mua."
 anomaly.95.b.tooltip: "Thêm tọa độ Hệ Mặt trời vào nhật ký tình báo.\n"
 anomaly.96.name: "Lục địa Trái đất"
 anomaly.96.desc.neutral: "Tọa độ khắc trên tấm nhôm nhìn chung là chính xác.\n\nĐây là Hệ Mặt trời, và tấm nhôm này rõ ràng đến từ hành tinh được các phi hành gia của chúng ta đánh dấu là Hệ Mặt trời-III."
 anomaly.96.desc.phobe: "Chúng ta đã tìm ra nguồn gốc của đống phế liệu kim loại cũ nát đáng ngờ đó. Hệ Mặt trời là một hệ sao nhỏ xoay quanh một ngôi sao lùn vàng, một vùng khỉ ho cò gáy hoàn toàn không xứng với sự huy hoàng của [Root.Owner.GetName]."
 anomaly.96.desc.phile: "Cuối cùng chúng ta cũng đến được Hệ Mặt trời, nơi người ta đang dốc hết tâm huyết dùng những cách thức cực kỳ nguyên thủy để giao tiếp với thế giới bên ngoài. Nguồn gốc mà tấm nhôm đánh dấu dường như là tảng đá thứ ba tính từ ngôi sao, hẳn là một hành tinh lục địa."
 anomaly.96.a.neutral: "Đúng là đường xá xa xôi."
 anomaly.96.a.phobe: "Phát biểu một tuyên bố. Sau đó ném tấm nhôm vào ngôi sao của họ."
 anomaly.96.a.phile: "Các bạn gọi vào không gian hư vô, và chúng tôi đã đến."
 anomaly.100.name: "Vượt qua Pioneer"
 anomaly.100.desc: "Một tấm nhôm mạ vàng được anot hóa đã được tìm thấy trên bề mặt của [From.GetName]. Trước khi tiến hành bất kỳ phân tích hay đối chiếu dữ liệu nào, tất cả các thành viên trên [Root.GetName] đã nhận ra nguồn gốc của nó."
 anomaly.100.a: "Tấm nhôm đến từ... Tàu Pioneer 11."
 anomaly.105.name: "Bản nhạc dĩ vãng"
 anomaly.105.desc: "[Root.GetName] đã tìm thấy một chiếc đĩa vàng trong khi điều tra trường hấp dẫn yếu của [From.GetName]. Chiếc đĩa đã được thu hồi, phân tích ban đầu cho thấy những rãnh nhỏ trên bề mặt nó có thể là dữ liệu âm thanh và video đã được mã hóa, do một nền văn minh ngoài hành tinh nào đó tạo ra."
 anomaly.105.a: "Có lẽ có thể dùng làm đế lót ly uống bia."
 anomaly.105.b: "Tiến hành phân tích."
 anomaly.105.c: "Những người yêu âm nhạc ngoài hành tinh chắc chắn sẽ trả giá cao."
 anomaly.105.b.tooltip: "Thêm tọa độ Hệ Mặt trời vào nhật ký tình báo.\n"
 anomaly.106.name: "Lục địa Trái đất"
 anomaly.106.desc.neutral: "Tọa độ ghi trên đĩa nhìn chung là chính xác.\n\nĐây là Hệ Mặt trời, và chiếc đĩa này rõ ràng đến từ hành tinh được các phi hành gia của chúng ta đánh dấu là Hệ Mặt trời-III."
 anomaly.106.desc.phobe: "Chúng ta đã tìm ra nguồn gốc khả dĩ của chiếc đĩa cũ nát mà chúng ta đã khôi phục. Chỉ là hệ sao này thực sự quá đỗi nhỏ bé trong không gian, xoay quanh một ngôi sao lùn vàng thảm hại. Trước sự tráng lệ của [Root.Owner.GetName], đây chỉ là một vùng đất hoang vu không đáng nhắc tới."
 anomaly.106.desc.phile: "Cuối cùng chúng ta cũng đến được Hệ Mặt trời, nơi một số sinh vật đang khó nhọc giao tiếp thông qua những phương tiện rất thô sơ. Nguồn gốc của chiếc đĩa này có vẻ là hành tinh thứ ba của Hệ Mặt trời, đó là một hành tinh lục địa."
 anomaly.106.a.neutral: "Đúng là đường xá xa xôi."
 anomaly.106.a.phobe: "Đưa ra tuyên bố. Ném chiếc đĩa vào ngôi sao của họ."
 anomaly.106.a.phile: "Các bạn gọi vào không gian hư vô, và chúng tôi đã đến."
 anomaly.110.name: "Âm thanh quá khứ"
 anomaly.110.desc: "Bên trong một pháo đài trên bề mặt [From.GetName], từng bị dân tộc [Owner.GetPreFTLLowerPlural] bỏ hoang từ lâu, một chiếc đĩa vàng nằm yên trên một bệ đá, bị che phủ bởi lớp bụi bào tử dày.\n\nBan đầu nó được cho là một tạo tác ngoài hành tinh tầm thường, có thể mang ý nghĩa tôn giáo nào đó, nhưng một máy tính lưu trữ đã nhanh chóng nhận ra nó là Đĩa Vàng mạ vàng mang theo khi phóng tàu thăm dò Voyager."
 anomaly.110.a: "Phát lại ngay."
 anomaly.115.name: "Kho chứa Tế bào"
 anomaly.115.desc: "[From.GetName] bị rỗng một phần. Bên trong nó là một cấu trúc tổ ong dày đặc, được làm từ một loại hợp kim chưa biết tên. Trong đó cất giữ rất nhiều đồ chứa vật chất gen ngoài hành tinh. Đây rõ ràng là một kho lưu trữ sự sống, ghi lại dữ liệu gen của một nền văn minh đã mất. Hầu hết các nhân tố di truyền đã bị hư hại nghiêm trọng và không thể phục hồi, nhưng chúng ta vẫn có thể học được nhiều điều từ đó."
 anomaly.115.b.evopred: "Thật là chu đáo!"
 anomaly.120.name: "Cự thạch Edic"
 anomaly.120.desc: "[From.GetName] không có người ở, và thực sự không thể sinh sống được, nhưng không phải là chưa từng có ai ghé thăm. Bề mặt của nó rải rác những cột tháp cao chót vót, được điêu khắc từ một loại khoáng thạch không thuộc hành tinh này, rõ ràng là do một nền văn minh không gian đam mê nghệ thuật nào đó đặt ở đây. Những đường cong mềm mại của các cột bia này đã chạm trổ nên một đoạn lịch sử mộng ảo đến mức nó chắc chắn là hư cấu.\n\nChắc chắn là vậy."
 anomaly.120.a: "Chụp ảnh rồi lưu vào hồ sơ."
 anomaly.120.b: "Chúng... thật đẹp."
 anomaly.120.b.tooltip: "Sao chép rộng rãi bản kỹ thuật số của những văn bia này vào §YĐế quốc§! của chúng ta."
 anomaly.121.desc: "Bản có chú thích của những hình ảnh tháp bia từ [From.From.GetName] này rất được ưa chuộng trên [Root.GetName].\n\nNhiều người nói rằng những sử biên niên tuyệt mỹ này đã hoàn toàn thay đổi cách nhìn của họ về sinh vật ngoài hành tinh."
 anomaly.121.a.tooltip: "§Y600§!£pop£§HDân số§! nhận được tư tưởng §YThân ngoại§!."
 anomaly.121.b.tooltip: "§Y300§!£pop£§HDân số§! nhận được tư tưởng §YThân ngoại§!."
 anomaly.125.name: "Lai lịch không rõ"
 anomaly.125.desc: "Sau khi [Root.GetName] chặn được tín hiệu cầu cứu, đã phái tàu thăm dò đến bề mặt không ổn định của [From.GetName]. Có vẻ như một tàu chở hàng chưa đăng ký gần đây đã đâm vào hành tinh này. Bất kể khi đó nó chở thứ gì, tất cả đều đã hóa thành cát bụi. Tuy nhiên, dữ liệu khảo sát hệ sao này trong máy tính điều hướng của nó vẫn có thể khôi phục."
 anomaly.125.a: "Cứ làm vậy đi."
 anomaly.130.name: "Rơi do Trọng lực"
 anomaly.130.desc: "Cuộc khảo sát tiểu hành tinh của [Root.GetName] tạm thời bị dừng lại, vì một tàu thăm dò đã bị một dị thường trọng lực bất ngờ bắt giữ.\n\nTrước khi bị phá hủy bởi sức mạnh cực lớn, con tàu này đã kịp truyền về một số dữ liệu. Và sức mạnh đó đã nhanh chóng biến mất không tì vết."
 anomaly.130.a: "Ít nhất thì không ai bị thương."
 anomaly.135.name: "Khu vui chơi bị bỏ hoang"
 anomaly.135.desc: "Các công trình trên [From.GetName] không cũ như chúng ta nghĩ ban đầu. Nó có vẻ là một loại khu vui chơi nào đó. Chuyên viên khoa học [Root.GetLeaderName] cho biết những thiết bị kỳ diệu này phức tạp đến mức dị thường, chúng ta có thể học hỏi được rất nhiều điều từ chúng. Dưới góc nhìn của những người xây dựng ra chúng, đây có thể là mảng cảm biến tối tân, hoặc cũng có thể là những công trình nghệ thuật khổng lồ.\n\nTuy nhiên, dưới con mắt của người [Root.Owner.GetSpeciesNamePlural] chúng ta, nơi này trông giống như một nơi bạn sẽ dẫn trẻ nhỏ đến chơi hơn."
 anomaly.140.name: "Ngôi đền quen thuộc"
 anomaly.140.desc: "Phần lớn tiểu hành tinh này đã được điêu khắc tinh xảo bằng tia laser, trông giống như một ngôi đền thu nhỏ của người [Root.Owner.GetSpeciesName]: Đây là một ngôi đền cổ thờ phụng §YTôn giả Vô danh§!, ngài là một vị thần chuyên cai quản sự hủy diệt trong nhiều tín ngưỡng cổ xưa của người [Root.Owner.GetSpeciesAdj].\n\nNgôi đền này đã lơ lửng trong không gian một thời gian dài, còn lâu hơn cả thời gian chúng ta nắm giữ công nghệ du hành vũ trụ — khám phá này khiến nhiều nhà nghiên cứu của chúng ta bối rối không hiểu nổi.\n\nVì vật thể được phát hiện này vẫn chưa rõ lai lịch, chuyên viên khoa học [Root.GetLeaderName] đề xuất chúng ta tìm kiếm thêm các thiên thể có đặc điểm tương tự với ngôi đền vũ trụ này. [Root.leader.GetHeSheCap][Root.leader.GetHasHave] chuẩn bị một danh sách các ứng viên có khả năng trong các hệ sao lân cận."
 anomaly.140.a: "Có lẽ tốt nhất là mặc kệ những thứ này."
 anomaly.140.a.tooltip: "§LHãy để vị thần đang say ngủ tiếp tục chìm trong giấc mộng.§!"
 anomaly.140.b: "Chúng ta xem xong rồi đi."
 anomaly.140.c: "Chúng ta sẽ không bị ảnh hưởng bởi bọn tà đạo này."
 anomaly.140.c.tooltip: "Ra lệnh cho [Root.GetName] san bằng ngôi đền."
 anomaly.142.name: "Cổ thần: Gần Nữ thần Ban ơn"
 anomaly.142.desc: "[Root.GetName] đã tiến vào hệ sao [Root.GetStarName]. Phi hành đoàn báo cáo rằng xung quanh ngôi sao đó thực sự có một vật thể khác quay quanh, trông không khác gì ngôi đền của Tôn giả Vô danh."
 anomaly.142.a: "Bắt đầu điều tra."
 anomaly.143.name: "Cổ thần: Gần Thần Dũng khí"
 anomaly.143.desc: "[Root.GetName] đã tiến vào hệ sao [Root.GetStarName]. Phi hành đoàn báo cáo rằng một vật thể khác trên quỹ đạo có sự tương đồng rất cao với ngôi đền của Tôn giả Vô danh."
 anomaly.143.a: "Làm tốt lắm."
 anomaly.144.name: "Cổ thần: Gần Nữ thần Thấu thị"
 anomaly.144.desc: "Phi hành đoàn trên [Root.GetName] cứ ngỡ việc tìm kiếm ngôi đền của Nữ thần Thấu thị sẽ tốn nhiều công sức hơn, không ngờ vừa tiến vào [Root.GetStarName] đã thấy được chỉ dẫn rất rõ ràng. Các vì sao trong hệ sao này được khắc những họa tiết bằng khoáng thạch nhân tạo, tất cả đều chỉ về một khu vực trung tâm."
 anomaly.144.a: "Tôi biết rồi."
 anomaly.145.name: "Hát vì cớ gì"
 anomaly.145.desc: "Động vật trên [From.GetName] — dù là thú săn mồi hay con mồi — đều sẽ tụ tập lại với nhau khi màn đêm buông xuống, và sau đó... ca hát.\n\nTiếng hú, tiếng lách cách, tiếng kêu réo, tiếng gầm gừ, tiếng xì xào lẫn lộn vào nhau, thoạt nghe thì ồn ào chói tai, nhưng nếu lắng nghe kỹ sẽ nhận ra có một giai điệu ẩn chứa có thể nhận biết được. Phi hành đoàn trên [Root.GetName] cũng nói rằng thứ âm nhạc đó nghe cũng khá hay.\n\nChúng tôi cho rằng phải có sự can thiệp từ bên ngoài mới có thể tạo ra bản hợp xướng của những sinh vật phi trí tuệ này. Chúng ta không thể hiểu được nguyên nhân, nhưng ít nhất chúng ta có thể nghiên cứu xem họ đã làm điều đó như thế nào."
 anomaly.145.b.evopred: "Tốt hơn là giao tiếp thông qua hóa học."
 anomaly.150.name: "Bên dưới Zro"
 anomaly.150.desc: "[From.GetName] không phải là một hành tinh băng khổng lồ bình thường, hành tinh băng khổng lồ này được cấu tạo từ loại băng cực kỳ hiếm gặp. Bên trong băng bao bọc rất nhiều Zro, và có thể tiến hành khai thác ngay ở tầng thượng lưu của bầu khí quyển hành tinh."
 anomaly.150.a.tooltip: "Khám phá mỏ §YTinh thể Băng Zro§!."
 anomaly.155.name: "Hành vi phi pháp"
 anomaly.155.desc: "[Root.GetName] đã tìm thấy một công nghệ ẩn giấu đáng lo ngại trong các hố trũng trên bề mặt tiểu hành tinh.\n\nRõ ràng là có ai đó — bằng một phương pháp thô sơ đơn giản — đã tạo ra một lỗ sâu một chiều ổn định tại đây. Chuyên viên khoa học [Root.GetLeaderName] kết luận rằng tiểu hành tinh này là một lối ra. Đầu kia của lỗ sâu là một khu vực chưa xác định cách một lỗ đen nào đó vài năm ánh sáng, và có một lượng nhỏ vật chất tối — vì bị hút — rò rỉ ra khỏi lỗ sâu.\n\nBất kể ai đã xây dựng lỗ sâu này, dường như họ đã từ bỏ hoạt động này."
 anomaly.155.a.tooltip: "Khám phá mỏ §YVật chất Tối§!."
 anomaly.160.name: "Mưa tím"
 anomaly.160.desc: "Những hình ảnh về cơn mưa màu tím quyến rũ trên [From.GetName] được chụp bởi tàu thăm dò bề mặt của [Root.GetName], đã lan truyền đến tay giới tinh hoa văn hóa ở [Root.Owner.Capital.GetName].\n\nMặc dù khám phá này không có giá trị nghiên cứu khoa học, nhưng những hình ảnh về cơn mưa rực rỡ gợi nhiều liên tưởng này vẫn thắp lên một tia lửa phục hưng trong lĩnh vực nghệ thuật của người [Root.Owner.GetSpeciesName], sự kiện này có thể nhiều năm sau mới đơm hoa kết trái."
 anomaly.165.name: "Cổ thần: Ngôi đền của Nữ thần Ban ơn"
 anomaly.165.desc: "Việc giải mã chữ tượng hình trong ngôi đền của Nữ thần Ban ơn diễn ra suôn sẻ hơn dự kiến. Các nhà ngôn ngữ học phụ trách dự án này nói rằng, những văn bản này mang lại cảm giác thân thuộc một cách khó hiểu: có thể dễ dàng “chạm” đến trái tim họ, mặc dù ngữ pháp của nó cổ xưa và rườm rà.\n\nTuy nhiên, họ chỉ ra rằng, những thông điệp này ngầm ám chỉ một số chủ đề và bối cảnh rất tối nghĩa, khó hiểu. Trừ khi chúng ta kết hợp với các văn bản khác về vị thần bốn ngôi này, nếu không sẽ rất khó để hiểu đầy đủ thông điệp của họ."
 anomaly.166.name: "Cổ thần: Ngôi đền của Thần Dũng khí"
 anomaly.166.desc: "Sau nhiều ngày làm việc tỉ mỉ, thậm chí có vài lần khiến người ta suy sụp, chuyên viên khoa học [Root.GetLeaderName] đã lấy lại được cuộn giấy của Thần Dũng khí: một cuộn vải dệt thông thường được niêm phong bằng màng nhựa dẻo dai. Cuộn giấy này đã được mang về [Root.GetName] để nghiên cứu thêm."
 anomaly.167.name: "Cổ thần: Ngôi đền của Nữ thần Thấu thị"
 anomaly.167.desc: "Chuyên viên khoa học [Root.GetLeaderName] đã báo cáo tình hình liên quan đến ngôi đền của Nữ thần Thấu thị.\n\nTrên tường của nó khảm những dòng chữ biểu ý, bị bóp méo nghiêm trọng bởi các lớp sơn bảo vệ. Các nhân viên đã cố gắng giải mã sơ bộ loại chữ này, nhưng thất bại; ngữ pháp của nó hoàn toàn khác biệt với các hệ thống ngôn ngữ khác mà chúng ta từng gặp. Phi hành đoàn trên [Root.GetName] đã cố gắng loại bỏ lớp sơn bảo vệ với hy vọng nhìn rõ hơn, nhưng không thành công.\n\nNgay khi nhiệm vụ sắp bị tuyên bố thất bại — bên bờ vực của sự tức giận sắp bùng nổ — [Root.GetLeaderName] đột nhiên bắt đầu nhận thức được các đoạn văn bản mạch lạc.\n\nPhi hành đoàn không mất nhiều thời gian để sử dụng những manh mối này lập thành chỉ mục. Chẳng bao lâu sau, họ đã phác họa trần nhà, các bức tường và sàn nhà thành một mô hình xoắn ốc: Đây là một phần của một bức tranh rộng lớn hơn, mà chúng tôi tin rằng có thể hoàn thiện bằng văn bản từ các ngôi đền khác."
 anomaly.168.name: "Cổ thần: Tiết lộ"
 anomaly.168.desc: "Giáo lý trọn vẹn của chư thần — bởi vì chúng tôi cho rằng những văn bản được khôi phục nên được xem như vậy — mang ý nghĩa khải thị đối với chúng ta, nó mang tính hủy diệt đối với những nền tảng hão huyền mà tôn giáo cổ đại của chúng ta dựa vào.\n\nKhi đặt trong bối cảnh xoay quanh người [Root.GetSpeciesAdj], những văn bản này chỉ rõ rằng, chúng ta được định sẵn là sẽ đạt được thành tựu vĩ đại dưới sự dẫn dắt bằng các thủ đoạn mạnh mẽ của một nhà lãnh đạo tôn giáo. Chúng ta được định sẵn là sẽ trở thành thần, nhưng quá khứ của chúng ta tràn ngập những lời tiên tri chết yểu và tội lỗi sinh ra từ sự thiếu hiểu biết. Sự cứu rỗi chỉ là thoáng qua."
 anomaly.168.a: "Phong tỏa khám phá này."
 anomaly.168.a.tooltip: "§LKiến thức là sức mạnh. Kiến thức thần bí là sức mạnh thần bí.§!"
 anomaly.168.b: "Chúng ta có thể dùng thứ này để đổi lấy chút tiền."
 #anomaly.168.b.tooltip: "Một số tập đoàn tín ngưỡng giàu có hơn đã đánh hơi được vụ này, và đang rất quan tâm."
 anomaly.168.c: "Nhưng chúng ta có thể học được gì từ điều này?"
 #anomaly.168.c.tooltip: "Bất kể tính chân thực hay hiệu lực của các văn bản thiêng liêng này ra sao, sự thật vẫn là chúng ta có chung các khái niệm tôn giáo với một chủng tộc du hành vũ trụ lâu đời và chưa từng được biết đến."
 anomaly.168.d: "Chúng ta sẽ tiến bước theo sự chỉ dẫn của thần linh!"
 #anomaly.168.d.tooltip: "Bắt đầu một cuộc phục hưng tôn giáo.\nDân số bản địa của bạn sẽ nhận được các tư tưởng §YCuồng tín Duy tâm§! và §YĐộc tài§!."
 #anomaly.169.name: "Chấp nhận Thánh chỉ"
 #anomaly.169.desc: "Người dân [Root.GetSpeciesName] đang kêu gào cần một ai đó dẫn dắt họ đi theo đức tin mới mà cũ này."
 #anomaly.169.a: "Chúng ta không nên thay đổi cách thức hoạt động của mình."
 #anomaly.169.b: "Người dân của chúng ta xứng đáng được chỉ dẫn."
 #anomaly.169.b.tooltip: "Chuyển đổi §YCẢI CÁCH CHÍNH PHỦ§! ngay lập tức sang §YTHÁNH CHỈ§!."
 anomaly.170.name: "Kẻ lưu đày"
 anomaly.170.desc: "Đã phát hiện một tín hiệu phát ra từ một trạm nghiên cứu nhỏ trên bề mặt [FromFrom.GetName], nhưng [Root.Owner.GetName] không có bản ghi nhận thành lập lẫn bản ghi nhận cấp phép nào cho trạm nghiên cứu này. Bên trong chỉ có một nhà khoa học người [Root.Owner.GetSpeciesAdj], nếu những nghiên cứu trên [FromFrom.GetName] là đáng tin cậy, thì công bằng mà nói đây thực sự là một nhà nghiên cứu khá tài năng và có nhiều thành quả. Nhưng có một vấn đề về danh tính của người này, chúng ta không thể đối chiếu thông tin liên quan trong hồ sơ chính thức của đế quốc, người này cũng từ chối công khai danh tính, chỉ nói mình là một “Kẻ lưu đày”.\n\nNgười này đã bày tỏ mong muốn được quay lại [Root.Owner.Capital.GetName] để trực tiếp phục vụ cho [Root.Owner.GetName], với điều kiện là [Root.GetName] phải rời khỏi [FromFrom.GetName] ngay lập tức, và bất kỳ phi thuyền nào của người [Root.Owner.GetSpeciesAdj] cũng không được quay lại đó."
 anomaly.170.a: "Đừng có mơ. Lật tung trạm nghiên cứu đó lên cho ta."
 anomaly.170.a.tooltip: "Bắt giữ §YKẻ lưu đày§!, điều tra triệt để trạm nghiên cứu không được cấp phép."
 anomaly.170.b: "[Root.Owner.GetRulerTitle] hoan nghênh kẻ lưu đày trở lại biên chế."
 anomaly.170.b.tooltip: "Một Kẻ lưu đày $scientist_with_icon$ cấp 3 đã gia nhập đế quốc của chúng ta."
 the_exile_background: "§Y[Root.GetName]§! được tìm thấy tại một tiền đồn nghiên cứu trên §Y[Root.GetBackgroundPlanet]§! có quần xã sinh vật [Root.GetHomeWorldBiome]."
 anomaly.171.name: "Trống trải đìu hiu"
 anomaly.171.desc: "Bản thân trạm nghiên cứu không có gì đặc biệt. Quy mô của nó rất nhỏ, chỉ là một nơi trú ẩn tạm thời dùng để chống chọi với môi trường khắc nghiệt, chỉ có thể tiến hành nghiên cứu bề mặt hành tinh trong thời gian hạn chế, trước khi môi trường khắc nghiệt làm nó sụp đổ.\n\nTrạm nghiên cứu trên [From.From.From.GetName] đã sắp kết thúc vòng đời của mình, nhưng cái lạnh giá của hành tinh đó vẫn chưa thả xuống cọng rơm cuối cùng. Những trang thiết bị còn hoạt động tốt, rẻ tiền và dùng một lần đã được sử dụng triệt để, cơ sở dữ liệu nội bộ chứa đầy những dữ liệu hành tinh cực kỳ bình thường nhưng chi tiết, cũng như những thí nghiệm đơn giản được thực hiện trong môi trường khắc nghiệt.\n\nĐiều thú vị là, dường như các mạch khoáng sản dưới nền móng của trạm nghiên cứu đã không được kiểm tra sâu. Bản quét của [Root.GetName] cho thấy phần lớn dãy núi bị băng tuyết bao phủ này có thể bị rỗng bên trong. Đáng báo động hơn là, chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng cư dân duy nhất của trạm nghiên cứu này, “Kẻ lưu đày” bí ẩn đó đã biến mất dạng."
 anomaly.171.a: "Thật khó hiểu."
 anomaly.172.name: "Tiến sâu xuống lòng đất"
 anomaly.172.desc: "Trạm nghiên cứu trên [From.From.From.GetName] có chút bất thường. Bản thân tòa nhà không có gì kỳ lạ — một nơi trú ẩn tạm thời nhỏ gọn dùng để chống chọi với môi trường khắc nghiệt, chỉ có thể tiến hành nghiên cứu hành tinh ở cấp độ bề mặt trong thời gian hạn chế trước khi bị môi trường khắc nghiệt đánh gục — nhưng nó tình cờ được xây dựng trên một tảng đá đâm thủng biển băng trên bề mặt hành tinh.\n\nCác thành viên trên [Root.GetName] phát hiện ra rằng, bên trong ngọn núi này có những hang động và lối đi phức tạp, có thể đi vào từ bên trong trạm nghiên cứu.\n\nTrong một hang đá lớn hơn, họ đã tìm thấy thi thể mất nước của các thành viên cũ của trạm nghiên cứu. Những nhà nghiên cứu người [Root.Owner.GetSpeciesAdj] này vốn được phái đi nơi khác, nhưng rõ ràng, họ đã đến hành tinh nguy hiểm không người ở này.\n\nTất nhiên, “Kẻ lưu đày” đó hiện đã biệt tăm biệt tích. [Root.GetName] đã phóng một khoang thoát hiểm, đưa thi thể của người đã khuất về [Root.Owner.Capital.GetName]."
 anomaly.175.name: "Mằn mặn"
 anomaly.175.desc: "Tàu nghiên cứu [Root.GetName] không thể tìm thấy nguồn gốc của những chỉ số kỳ lạ mà chúng ta phát hiện được trên [From.From.GetName], những chỉ số này dường như chỉ là tiếng vọng của cảm biến. Tuy nhiên, chuyên viên khoa học [Root.GetLeaderName] — một người tự xưng là người sành ăn và đam mê lịch sử — tuyên bố rằng đã có một khám phá lớn ở đó.\n\nMỏ khoáng vật được tìm thấy trong một vài tảng băng lớn trên bề mặt dường như có mối liên hệ mật thiết với muối tinh của người [Root.Owner.GetSpeciesAdj]: Muối tinh từng là một loại gia vị không thể thiếu trong nhiều món ăn truyền thống của người [Root.Owner.GetSpeciesAdj], nhưng từ lâu người ta đã cho rằng nó đã cạn kiệt trên [Root.Owner.Capital.GetName].\n\nCác nhà sử học ẩm thực từ lâu đã nghi ngờ rằng loại khoáng vật làm gia vị này không phải là sản phẩm có nguồn gốc từ hành tinh mẹ của chúng ta, và khám phá của chuyên viên khoa học trên [From.From.GetName] đã cung cấp một số hỗ trợ cho giả thuyết này. Còn việc mùi vị của loại muối này có thực sự giống muối tinh của người [Root.Owner.GetSpeciesAdj] trước kia hay không, điều đó không quan trọng nhất: Chỉ riêng ý tưởng khôi phục lại các món ăn truyền thống bằng loại gia vị rất giống này thôi cũng đủ để khiến nền kinh tế và vị giác của chúng ta vô cùng hưng phấn."
 anomaly.175.a: "Ngon tuyệt."
 anomaly.180.name: "Anh bạn nhỏ"
 anomaly.180.desc: "Trên [From.From.GetName] đầy ắp những sinh vật nhỏ bé và sặc sỡ, nằm giữa ranh giới của thực vật và động vật. Chúng thiếu tiềm năng tiến hóa thực sự, nhưng so với kích thước cơ thể, sức mạnh và khả năng phối hợp có tổ chức của chúng thật đáng kinh ngạc.\n\nChuyên viên khoa học [Root.GetLeaderName] đã bị chúng mê hoặc, và thừa nhận dành tình cảm đặc biệt cho “anh bạn nhỏ màu đỏ” đó."
 anomaly.180.a: "Thật đáng mừng."
 anomaly.180.b: "[Root.Owner.GetName] không thể dung thứ cho sự tồn tại của những sinh vật này."
 anomaly.180.b.tooltip: "Các nhân viên của [Root.GetName] đã tiến hành công tác tiêu diệt triệt để và nhanh chóng, đảm bảo những sinh vật ngoài hành tinh dễ thương này sẽ không bao giờ xâm phạm [Root.Owner.GetName] nữa.\n"
 anomaly.180.c: "Chúng ta chỉ có thể đứng xem, không thể can thiệp."
 anomaly.180.d: "Đừng đụng vào những sinh vật nhỏ bé đáng yêu đó, [Root.GetLeaderName]."
 anomaly.180.e: "Chúng sẽ bị nuốt chửng."
 anomaly.180.e.tooltip: "Dinh dưỡng từ những người ngoài hành tinh “dễ thương” này sẽ nuôi no [Root.Owner.GetSpeciesSpawnNamePlural] của chúng ta.\n"
 anomaly.185.name: "Cận kề cái chết"
 anomaly.185.desc: "Tín hiệu dường như phát ra từ một cấu trúc tương tự như ăng-ten tín hiệu. Phía chúng ta đã phóng máy bay không người lái thám hiểm từ [Root.GetName], hy vọng có thể tìm thấy thêm manh mối trên bề mặt hành tinh.\n\nKho chứa trong hang động mà chuyên viên khoa học [Root.GetLeaderName] tìm thấy đã bị cạy mở một cách rất dễ dàng. Anh ta nhận định nhà kho này từng được sử dụng bởi một chủng tộc ngoài hành tinh đã diệt vong từ lâu, có vẻ là nơi ẩn náu cuối cùng của chủng tộc đó. Mặc dù trình độ công nghệ của chủng tộc này khá tiên tiến, nhưng dường như họ chưa từng tiến hành thám hiểm không gian, kết quả là đã bị diệt vong vì một thảm họa tự nhiên nào đó liên quan đến toàn bộ hành tinh. Kho chứa có diện tích rộng lớn, trong đó chứa đầy hàng chục ngàn chiếc hộp đen. Theo nhận định của [Root.GetName], những chiếc hộp này đều là thiết bị lưu trữ dữ liệu.\n\nĐã khởi động một §YDự án Đặc biệt§! để tiến hành giải mã thêm những chiếc hộp này."
 anomaly.190.name: "Dự án Khảo sát Vệ tinh"
 anomaly.190.desc: "Chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng, họ cảm thấy dữ liệu cảm ứng thu thập được trên [Root.GetName] hoàn toàn không đáng tin cậy. Đáng ngờ nhất trong số đó là vệ tinh của [From.From.GetName], họ đã khởi động một §YDự án Đặc biệt§! để tiến hành điều tra sâu hơn.\n\nVui lòng xem nhật ký tình báo để biết thêm chi tiết."
 anomaly.191.name: "Kết quả Khảo sát Vệ tinh"
 anomaly.191.desc: "Đã tìm thấy một thiết bị vô cùng khó tin trên vệ tinh. Trung tâm của nó là một máy tính hệ tam phân, chương trình của nó dường như không ngừng thực hiện các phép toán hoán vị mới dựa trên dữ liệu hành tinh mà nó thu thập được. Dữ liệu được tạo ra sau khi tính toán, thông qua việc điều chế mảng liên lạc mạnh mẽ, đã được phát đến bề mặt hành tinh mà vệ tinh quay quanh. Mặc dù tín hiệu này thoạt nhìn có vẻ chỉ là những đoạn mã lộn xộn, nhưng phương pháp điều chế này lại có thể khiến tín hiệu đi vào bầu khí quyển của hành tinh và sau khi bị phản xạ trở nên không khác gì dữ liệu cảm ứng thu thập thông thường.\n\nMặc dù chúng ta không thể xác định được công dụng của thiết bị này, nhưng thông qua cuộc điều tra này, tôi đã học hỏi được công nghệ kỹ thuật của sinh vật ngoài hành tinh và được hưởng lợi rất nhiều."
 anomaly.191.a.tooltip: "Vệ tinh nhận được yếu tố sửa đổi §YKhảo sát Vệ tinh§!:\n£engineering£§G+6§!\n\n"
 anomaly.195.name: "Bờ biển Chạng vạng"
 anomaly.195.desc: "Chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng, trong vùng biển của [From.From.GetName] có các lưới hình học lớn và linh hoạt do con người tạo ra, vật liệu chủ yếu là một loại nhựa tổng hợp nào đó.\n\nNhững lưới nhựa này vẫn có thể nhìn thấy rõ ràng từ quỹ đạo ngoài bầu khí quyển, hiện tại vẫn chưa rõ công dụng của chúng, dường như chỉ được dùng để trang trí."
 anomaly.200.name: "Năng lượng Địa nhiệt"
 anomaly.200.desc: "Những tiếng gõ đều đặn được theo dõi trên quỹ đạo hóa ra là một cỗ máy thu thập địa nhiệt khổng lồ vô cùng cổ xưa trên hành tinh, vẫn đang hoạt động thoi thóp. Mặc dù những cỗ máy bị bỏ hoang từ lâu này đã không còn chắc chắn nữa, nhưng chúng vẫn liên tục bơm chất lỏng siêu nóng từ lõi hành tinh ra.\n\nMặc dù tất cả các bộ phận lưu trữ năng lượng của nó đã bị hỏng và rò rỉ, nhưng vẫn có thể thu được một lượng nhỏ năng lượng từ đó."
 anomaly.205.name: "Bằng phẳng vạn dặm"
 anomaly.205.desc: "Sau khi điều tra kỹ lưỡng điều kiện địa lý của [From.From.GetName], [Root.GetName] đã không thể tìm thấy bất kỳ hiện tượng đáng chú ý nào.\n\nThay vào đó, điều kiện địa lý ở đây bình thường đến mức đáng kinh ngạc... Đặc điểm duy nhất của nó là chẳng có đặc điểm gì cả. Mặc dù địa thế có chút phân biệt cao thấp, nhưng toàn bộ bề mặt của [From.From.GetName] lại bằng phẳng một cách vô cùng bất tự nhiên. Đồng thời, các thảm thực vật khác nhau trên hành tinh cũng rất tẻ nhạt, khiến người ta nhìn qua là quên ngay."
 anomaly.205.a: "Đây tính ra là... chuyện tốt nhỉ?"
 anomaly.205.a.tooltip: "Tất cả £blocker£§YChướng ngại vật Ô đất§! đã bị xóa khỏi [From.From.GetName]."
 anomaly.210.name: "Cạm bẫy Chiều không gian"
 anomaly.210.desc: "[Root.GetName] lẽ ra phải tiến đến [From.From.From.GetName] để nghiên cứu các tình huống bất thường gần đó, nhưng lại gặp sự cố bất trắc trên đường đi. Toàn bộ con tàu, bao gồm chuyên viên khoa học [Root.GetLeaderName] và phi hành đoàn, đã đột nhiên biến mất trong khi đang điều tra một đống đổ nát trong không gian.\n\nVà vài phút sau, con tàu lại xuất hiện trở lại.\n\nTheo báo cáo của [Root.GetLeaderName], họ đã đến một không gian siêu chiều trong nháy mắt. Họ nhìn qua cổng quan sát bên ngoài và thấy xung quanh đầy ắp các loại phi thuyền ngoài hành tinh, tất cả đều bị mắc kẹt bất động trong khoảng không vô tận. Trước khi phi hành đoàn có thể xác định được vị trí, cảnh vật bên ngoài con tàu đột nhiên biến mất, và con tàu lại trở về không gian bình thường.\n\nNhưng không may là, một nửa số nhân viên trên tàu đã biến mất — chuyên viên khoa học [Root.GetLeaderName] cho rằng những phi hành đoàn này có lẽ đã bị mắc kẹt vĩnh viễn ở đó do một cơ chế không thể biết nào đó."
 anomaly.211.name: "Trôi dạt Chiều không gian"
 anomaly.211.desc: "Phi hành đoàn mất tích của [Root.GetName] vốn bị cho là đã lạc trong khe nứt chiều không gian nay đã xuất hiện trở lại.\n\nTất cả các phi hành đoàn mất tích đều được đặt trên một phi thuyền có công nghệ tương tự như phi thuyền thám hiểm của phe ta, lơ lửng ở vị trí mà [Root.GetName] ban đầu gặp phải cạm bẫy chiều không gian. Tất cả các thành viên phi hành đoàn đều nói rằng họ không nhớ chuyện gì đã xảy ra trong thời gian đó, chỉ mang máng cảm thấy mình đã rời đi một lúc.\n\nPhi hành đoàn hy vọng có thể trở lại làm việc dưới quyền chuyên viên khoa học [Root.GetLeaderName], và đã giao lại con tàu cho đế quốc của người [Root.Owner.GetSpeciesAdj]."
 anomaly.211.desc.bio: "Phi hành đoàn mất tích của [Root.GetName] vốn bị cho là đã lạc trong khe nứt chiều không gian nay đã xuất hiện trở lại.\n\nHọ gọi cho chúng ta từ một phi thuyền hữu cơ, con tàu này có sự tương đồng kỳ lạ với tàu nghiên cứu của chúng ta, nhưng lại... khác biệt một cách tinh tế. Cách thức di chuyển, nhịp đập của nó hoàn toàn không tuân theo bất kỳ bản thiết kế gen nào đã biết, giống như một sự hiểu biết kỳ dị của một ý thức ngoài hành tinh méo mó nào đó về con tàu của chúng ta. Nó lơ lửng, chờ đợi trong im lặng ở tọa độ gần nơi [Root.GetName] gặp sự nhiễu loạn lần đầu tiên.\n\nPhi hành đoàn không nhớ gì cả. Chỉ có một cảm giác mơ hồ về sự vắng mặt, một cảm giác đã đi đến một nơi khác, dài hơn nhiều so với khoảng thời gian họ cảm nhận được. Tuy nhiên, họ lại không thay đổi, ít nhất bản thân họ nói vậy.\n\nPhi hành đoàn hy vọng có thể trở lại làm việc dưới quyền chuyên viên khoa học [Root.GetLeaderName], và không ngần ngại giao lại con tàu kỳ dị và im lặng của họ cho đế quốc của người [Root.Owner.GetSpeciesAdj]. Nhưng khi chúng tôi nhận được thông điệp của họ, một sự cộng hưởng sâu lắng và xa lạ vang lên ong ong trong quá trình liên lạc. Con tàu tuy bất động, nhưng có cảm giác như nó đang lắng nghe."
 anomaly.211.a: "Rất tốt."
 anomaly.211.a.tooltip: "Nhận được một Tàu Nghiên cứu."
 anomaly.211.b: "Vì sự an toàn của người dân [Root.Owner.GetSpeciesAdj] thì phải tiêu diệt nó."
 anomaly.211.c: "Sự an toàn của người dân [Root.Owner.GetSpeciesNamePlural] phụ thuộc vào việc có tiêu diệt chúng hay không."
 anomaly.211.b.tooltip: "Chúng bắt đầu tấn công rồi!"
 anomaly.215.name: "Cảnh quan Trù phú"
 anomaly.215.desc: "Bề mặt của [From.From.GetName] tràn ngập nhiều khu vực có thảm thực vật mọc quá mức um tùm, vô cùng bất tự nhiên.\n\nChuyên viên khoa học [Root.GetLeaderName] vẫn không thể giải thích cơ chế làm cho đất đai trên hành tinh này vô cùng màu mỡ ở một số khu vực, nhưng cho rằng thực vật ở đây chỉ cần chế biến qua loa là người [Root.Owner.GetSpeciesAdj] có thể tiêu thụ bình thường."
 anomaly.215.desc.serv: "Bề mặt của [From.From.GetName] rải rác những thảm thực vật dày đặc không theo quy luật.\n\nChuyên viên khoa học [Root.GetLeaderName] vẫn chưa thể đưa ra lời giải thích cho các nguyên lý đằng sau việc đất đai màu mỡ bất thường mang tính cục bộ, nhưng tuyên bố rằng hầu hết các loại thực vật bản địa đều phù hợp để người [Root.Owner.GetSpeciesAdj] làm vật trưng bày sống dùng làm thức ăn, và hầu như không cần phải chế biến."
 anomaly.215.a.tooltip: "Thêm yếu tố sửa đổi §YTrù phú§! cho [From.GetName]:\nThêm §GThực phẩm§!"
 anomaly.220.name: "Khoáng sản Phong phú"
 anomaly.220.desc: "Chuyên viên khoa học [Root.GetLeaderName] đã báo cáo chi tiết về mỏ khoáng sản trên [From.GetName]. Do quá trình kiến tạo vỏ trái đất độc đáo, [Root.GetName] đã tập trung một số lượng lớn các mạch khoáng sản quý giá gần bề mặt."
 anomaly.220.a.tooltip: "Thêm yếu tố sửa đổi §YQuặng thô§! cho [From.GetName]:\nThêm §GKhoáng thạch§!"
 anomaly.225.name: "Cái bóng Lang thang"
 anomaly.225.desc: "Luôn có những vùng bóng tối lớn lướt qua bề mặt của [From.GetName].\n\nThứ tạo ra những bóng đen này không phải là mây, mà là một lớp vật chất hữu cơ lơ lửng phía trên bầu khí quyển, để thuận tiện cho việc hoạt động, trên đó còn có cấu trúc giống như các khớp nối.\n\nChuyên viên khoa học [Root.GetLeaderName] vẫn không thể xác định lớp vật chất hữu cơ này là thực vật hay động vật, cũng không thể giải thích được những bóng đen mà nó tạo ra có tác dụng gì."
 anomaly.225.a.tooltip: "Thêm yếu tố sửa đổi §YMúa rối bóng§! cho [From.GetName]:\n£society£ §G+4§!"
 anomaly.230.name: "Biến đổi khôn lường"
 anomaly.230.desc.v1: "Cấu trúc địa lý của [From.GetName] thực sự đang trong quá trình biến đổi. Chuyên viên khoa học [Root.GetLeaderName] cho rằng điều này là do hoạt động của vỏ hành tinh gây ra. Hoạt động của vỏ hành tinh này tuy thú vị nhưng lại cực kỳ thâm sâu. Tuy nhiên, điều mà [Root.Owner.GetName] quan tâm, là một phương pháp nào đó có thể chấm dứt sự tái cấu trúc tự thân vô tận và vô trật tự này của hành tinh. Nói một cách đơn giản, sử dụng phương pháp này để biến đổi hành tinh không những tốn rất ít thời gian, mà trên lý thuyết còn có khả năng làm cho hành tinh trở nên dễ sinh sống hơn.\n\n[Root.GetLeaderName] cần thêm 200 Điểm Năng lượng để tiến hành khảo sát hoạt động địa lý, nhằm chứng minh xem kế hoạch cải tạo chính xác như dao mổ của bác sĩ phẫu thuật mà chuyên viên khoa học đề xuất có thực sự khả thi hay không. Tất nhiên, nếu sau này muốn sử dụng công nghệ cải tạo môi trường hiện có thì cũng được thôi."
 anomaly.230.desc.v2: "Cấu trúc địa lý của [From.GetName] thực sự đang trong quá trình biến đổi. Chuyên viên khoa học [Root.GetLeaderName] cho rằng điều này là do hoạt động của vỏ hành tinh gây ra. Hoạt động của vỏ hành tinh này tuy thú vị nhưng lại cực kỳ thâm sâu. Tuy nhiên, điều mà [Root.Owner.GetName] quan tâm, là những bước nào đó có thể chấm dứt quá trình tự biến đổi của hành tinh. Nói một cách đơn giản, sau khi sử dụng các bước này để biến đổi hành tinh, không những tốn rất ít thời gian, mà trên lý thuyết còn có khả năng làm cho hành tinh trở nên dễ sinh sống hơn.\n\n[Root.GetLeaderName] cần thêm 200 Điểm Năng lượng để tiến hành khảo sát hoạt động địa lý, nhằm chứng minh xem kế hoạch mà chuyên viên khoa học đề xuất có thực sự dùng được hay không. Hiện tại chúng ta vẫn chưa thể tiến hành cải tạo môi trường theo cách thông thường, nên đây thực sự là một cơ hội ngàn năm có một."
 anomaly.230.a: "Chỉ đơn thuần nghiên cứu quá trình tự nhiên của sự biến đổi đó."
 anomaly.230.a.tooltip: "Thêm yếu tố sửa đổi §YBiến đổi khôn lường§! cho [From.GetName]:\n£physics£§G+4§!"
 anomaly.230.b: "Cung cấp cho [Root.GetName] 200 Điểm Năng lượng."
 anomaly.230.b.tooltip: "Tiêu hao Điểm Năng lượng, cố gắng làm cho hành tinh ổn định và trở nên dễ ở hơn. Có khoảng §Y50% cơ hội thành công§!.\n"
 anomaly.230.c: "Chúng tôi không muốn lãng phí Điểm Năng lượng vào một giả định không chắc chắn như vậy."
 anomaly.231.name: "Cải tạo Môi trường Chiến thuật"
 anomaly.231.desc: "Chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng, [From.From.GetName] thực sự có thể được cải tạo! Trong khoảng thời gian hành tinh bước vào giai đoạn tự chuyển hóa không ổn định kéo dài vài tháng, chúng ta có một khoảng thời cơ rất ngắn. [Root.GetLeaderName] cho rằng có thể cấy chất nổ cỡ nhỏ vào lớp vỏ hành tinh, cộng với tác dụng chiếu xạ chiến lược của bầu khí quyển hành tinh, là có thể làm ngưng quá trình tự chuyển hóa không bao giờ ngừng nghỉ của [From.From.GetName], biến nó thành một hành tinh dễ dàng sinh sống hơn.\n\nĐã thành lập một §YDự án Đặc biệt§!, nhưng thời gian đang vô cùng gấp rút."
 anomaly.232.name: "Cải tạo Môi trường Chiến thuật thất bại"
 anomaly.232.desc: "Phi hành đoàn của [Root.GetName] rất tiếc phải báo cáo: mặc dù phía chúng ta đã xác định thành công thời cơ cải tạo môi trường, nhưng cuối cùng vẫn không kịp nắm bắt cơ hội cải tạo [From.From.GetName]. Cơ hội như vậy có lẽ trong vài thế kỷ tới sẽ không xuất hiện lại."
 anomaly.233.name: "Cải tạo Môi trường Chiến thuật thành công"
 anomaly.233.desc: "Chuyên viên khoa học [Root.GetLeaderName] vô cùng tự hào báo cáo: [From.From.GetName] có thể được phân loại lại thành hành tinh khô cằn, chứ không còn là hành tinh hoang vu nữa. Thành công của cuộc thử nghiệm này đã thúc đẩy mạnh mẽ sự phát triển khoa học của người [Root.Owner.GetSpeciesAdj]."
 anomaly.233.desc.mach: "Chuyên viên khoa học [Root.GetLeaderName] tự hào báo cáo rằng [From.From.GetName] hiện đã có thể được phân loại lại thành hành tinh máy móc chứ không phải hành tinh hoang vu. Thử nghiệm lớn này đã làm phong phú thêm rất nhiều kiến thức khoa học của người [Root.Owner.GetSpeciesAdj]."
 anomaly.235.name: "Nghệ thuật Ánh sáng và Bóng tối"
 anomaly.235.desc.v1: "Chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng, những làn sóng lấp lánh rải rác dưới lớp băng bao phủ [From.GetName] bắt nguồn từ công nghệ ngoài hành tinh.\n\nTrên hành tinh này đã từng xảy ra những cuộc chiến tranh cổ đại, khi đó có một chiến đấu cơ ngoài hành tinh bị vỡ nát và rơi xuống đây, chỉ có lõi vũ khí chính nằm lộ ra ngoài thân tàu là không bị phá hủy. Có vẻ như vũ khí laser mà chủng tộc ngoài hành tinh này sử dụng tương tự như những gì hạm đội của người [Root.Owner.GetSpeciesAdj] hiện đang sử dụng, lõi vũ khí của nó thỉnh thoảng phát ra những tia năng lượng thấp lên bề mặt băng của [From.GetName], nhưng do khí hậu của hành tinh quá khắc nghiệt, tia laser không thể làm tan băng, nên đã tạo ra nghệ thuật ánh sáng và bóng tối vô cùng đẹp mắt."
 anomaly.235.desc.v2: "Chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng, những làn sóng lấp lánh rải rác dưới lớp băng bao phủ [From.GetName] bắt nguồn từ công nghệ ngoài hành tinh.\n\nTrên hành tinh này đã từng xảy ra những cuộc chiến tranh cổ đại, khi đó có một chiến đấu cơ ngoài hành tinh bị vỡ nát và rơi xuống đây, chỉ có lõi vũ khí chính nằm lộ ra ngoài thân tàu là không bị phá hủy. Có vẻ như vũ khí laser mà chủng tộc ngoài hành tinh này sử dụng tiên tiến hơn nhiều so với những gì hạm đội của người [Root.Owner.GetSpeciesAdj] hiện đang sử dụng, lõi vũ khí của nó thỉnh thoảng phát ra những tia laser năng lượng thấp lên bề mặt băng của [From.GetName], nhưng do khí hậu của hành tinh quá khắc nghiệt, tia laser không thể làm tan băng, nên đã tạo ra nghệ thuật ánh sáng và bóng tối vô cùng đẹp mắt."
 anomaly.235.b: "Chúng ta có thể tận dụng công nghệ này."
 anomaly.240.name: "Hành tinh Khổng lồ Giả tạo"
 anomaly.240.desc: "Chúng ta từng nghĩ hành tinh này là một hành tinh khí cỡ nhỏ rất hiếm gặp, nhưng sự thật không phải vậy.\n\nLớp bụi dày trôi nổi phía trên bầu khí quyển đã đánh lừa các chuyên viên khoa học, những gì được che giấu dưới lớp bụi đó chẳng qua chỉ là một hành tinh cằn cỗi nhưng vô cùng bình thường mà thôi.\n\nKhám phá này khiến các nhà thiên văn học ở [Root.Owner.Capital.GetName] vô cùng xấu hổ."
 anomaly.240.a.tooltip: "[From.GetName]: Được phân loại lại thành hành tinh §YHoang vu§!."
 anomaly.245.name: "Thiên đường Chết chóc"
 anomaly.245.desc: "Trên [From.GetName] đúng là có sức sống dồi dào.\n\nChỉ là những sinh vật này đều cực kỳ tàn nhẫn.\n\nMặc dù hành tinh này rất thích hợp để thuộc địa hóa, nhưng phi hành đoàn của [Root.GetName] cảnh báo rằng, có thể sẽ phải đối mặt với các cuộc tấn công dữ dội từ sinh vật bản địa."
 anomaly.250.name: "Khí lạ không rõ"
 anomaly.250.desc: "[Root.GetName] đã thu hồi một chiếc hộp kim loại hình chữ nhật từ bề mặt của [From.GetName]. Năm mặt của chiếc hộp này đều có một số lỗ nhỏ, và chuyên viên khoa học [Root.GetLeaderName] cũng vì thế mà kết luận đây không phải là chiếc hộp dùng để đựng đồ, mà là một công cụ nào đó dùng để tỏa mùi. Thử nghiệm ban đầu cho thấy, mùi vốn được cất giữ trong hộp hiện vẫn đang từ từ tỏa ra.\n\nĐể tìm hiểu rõ công dụng cụ thể của chiếc hộp này, đã thành lập một §YDự án Đặc biệt§!. Có lẽ các loài sinh vật ngoài hành tinh dùng mùi để truyền tải thông tin, sau đó thông qua các hóa chất trong khí quyển để nhận thông tin, từ đó tiến hành giao tiếp cũng không chừng."
 anomaly.250.a: "Thối không chịu nổi."
 anomaly.251.name: "Khí lạ không rõ"
 anomaly.251.desc: "Chiếc hộp này đúng là có lưu trữ một loại dữ liệu nào đó. Chuyên viên khoa học [Root.GetLeaderName] thừa nhận, ban đầu mọi người đều hy vọng trong hộp chứa đựng những tài liệu quan trọng về lịch sử hành tinh hoặc một nền văn hóa nào đó, nhưng kết quả lại vô cùng đáng thất vọng.\n\nTrong chiếc hộp tỏa hương thơm này chứa đựng những câu chuyện rất ngắn, mùi hương sẽ thay đổi nhanh chóng ở gần cuối mỗi chương của câu chuyện, và sự thay đổi này dường như là để hù dọa hoặc mua vui cho người đọc, tóm lại là một câu chuyện cười. Mặc dù công nghệ lưu trữ mùi của chiếc hộp đáng để nghiên cứu, nhưng những câu chuyện cười trong đó thì hoàn toàn vô giá trị.\n\nPhi hành đoàn của [Root.GetName] cảm thấy không được thoải mái cho lắm vì ngửi thấy một loại mùi nào đó do sinh vật ngoài hành tinh tạo ra. Tuy nhiên, về lý do tại sao chiếc hộp lại bị vứt ở một hành tinh hoang vắng không bóng người này, [Root.GetLeaderName] lại không muốn suy đoán."
 anomaly.255.name: "Ngày Tận thế Đã qua"
 anomaly.255.desc: "Trên [From.GetName] đã từng có một loài sinh vật ngoài hành tinh với trí tuệ khá phát triển sinh sống, có lẽ chỉ cần vài thập kỷ nữa là họ có thể phát triển được công nghệ du hành vũ trụ, nhưng trước đó họ đã tự kết liễu chính mình. Mặc dù bản thân hành tinh này đã phục hồi sau đợt tàn phá dữ dội vô nghĩa đó, nhưng trên bề mặt vẫn còn những vết sẹo rất rõ ràng.\n\nTrên bề mặt còn sót lại một vài di tích, trong đó có một tấm bia đá được bảo quản khá tốt. [Root.GetLeaderName] đã giải mã thông điệp trên đó một cách vô cùng dễ dàng, hóa ra là một lời cảnh báo do những người sống sót sau ngày tận thế khắc lại cho hậu thế. Nguyên nhân trực tiếp dẫn đến sự tuyệt diệt của chủng tộc họ chính là việc phát minh ra “vũ khí tối thượng”. Một đặc điểm tâm lý nào đó của chủng tộc này đã khiến cơ chế hủy diệt lẫn nhau không còn hiệu lực.\n\nBởi vì vũ khí tối thượng rất khó bị tiêu hủy, những người sống sót đó — những người cuối cùng đã chết rất nhanh vì những nguyên nhân không rõ ràng — trước khi chết đã giấu chúng sâu dưới lòng đất, và để lại thông điệp khuyên người đời sau đừng đi tìm chúng."
 anomaly.255.a: "Vậy thì chúng ta đừng đi tìm nữa."
 anomaly.255.b: "Hãy đi tìm những vũ khí đó."
 anomaly.256.name: "Khám phá Thú vị"
 anomaly.256.desc: "Có vẻ như “vũ khí tối thượng” trên hành tinh này chẳng qua chỉ là công nghệ vũ khí cơ bản nhất trong mắt chúng ta mà thôi.\n\nHọ có thể sử dụng những công nghệ này để dẫn đến ngày tận thế, có lẽ chỉ vì họ vô cùng thích giết chóc mà thôi."
 anomaly.256.a: "Mặc dù bình thường, nhưng rất hữu dụng."
 anomaly.256.a.tooltip.mass: "Nhận công nghệ: §YMáy phóng Khối lượng§!"
 anomaly.256.a.tooltip.miss: "Nhận công nghệ: §YTên lửa§!"
 anomaly.256.a.tooltip.laser: "Nhận công nghệ: §YLaser Đỏ§!"
 anomaly.256.b: "Đối với [Root.Owner.GetName] mà nói, thì chẳng có tác dụng gì."
 anomaly.257.name: "Khám phá Tàn khốc"
 anomaly.257.desc: "Chuyên viên khoa học [Root.GetLeaderName] cho rằng quyết định giấu vũ khí của những người sống sót là vô cùng chính xác. Mặc dù những vũ khí được tìm thấy trong hang động dưới lòng đất này có cùng nguyên lý với các trang bị hiện đang phục vụ cho [Root.Owner.GetName], nhưng lại tiên tiến hơn. Những công nghệ này chắc chắn sẽ giúp ích rất nhiều cho cỗ máy chiến tranh của người [Root.Owner.GetSpeciesAdj]."
 anomaly.257.a: "Gì cơ? Chúng ta đã có những công nghệ này rồi."
 anomaly.257.b: "Nâng cấp vũ khí laser của chúng ta."
 anomaly.257.c: "Nâng cấp máy phóng khối lượng của chúng ta."
 anomaly.257.d: "Nâng cấp tên lửa của chúng ta."
 anomaly.258.name: "Tay trắng trở về"
 anomaly.258.desc: "Cuộc tìm kiếm không có kết quả. Dù cho có là loại vũ khí lợi hại đến mức nào, thì bây giờ cũng chẳng còn nữa rồi."
 anomaly.260.name: "Nhà máy Khoáng sản"
 anomaly.260.desc: "[Root.GetName] đã tìm thấy một tòa nhà ngoài hành tinh duy nhất trên toàn bộ [From.GetName]. Chuyên viên khoa học [Root.GetLeaderName] cho rằng tất cả các tòa nhà khác trên hành tinh đều đã bị di dời đi nơi khác vì một lý do nào đó, nhưng không biết tại sao lại để lại một tòa nhà như vậy.\n\nTòa nhà này là một nhà máy chế biến để xử lý các mạch khoáng sản phong phú trên hành tinh, sau khi [Root.GetName] tiến hành khảo sát sơ bộ, đã kết luận rằng có thể dễ dàng khởi động lại nó."
 anomaly.260.a: "Tốt quá rồi."
 anomaly.260.a.tooltip: "Thêm §YNhà máy Cổ đại§! cho [From.GetName].\n"
 anomaly.265.name: "Cuộc đua Xe Ngoài hành tinh"
 anomaly.265.desc: "Trong các hố trũng trên bề mặt nông mềm của [From.GetName] có những vết hằn dài không đều. Chuyên viên khoa học [Root.GetLeaderName] đã tìm thấy đủ loại phế liệu vô cùng đáng ngạc nhiên ở gần những vết hằn đó: những phương tiện có bánh xe bị đâm hỏng. Trông chúng không giống như đồ dùng để nghiên cứu khoa học, mà là để chở người.\n\nPhi hành đoàn của [Root.GetName] cho rằng nơi này hẳn là địa điểm đua xe của người ngoài hành tinh. Ở nơi gần như không có trọng lực này, các sinh vật ngoài hành tinh lái phương tiện của mình lao vào nhau, kiểm tra sức mạnh và tốc độ của xe, thật thú vị."
 anomaly.265.a: "Thật lợi hại."
 anomaly.265.a.tooltip: "Thêm yếu tố sửa đổi §YVết phanh xe§! cho [From.GetName]:\n£engineering£§G+6§!"
 anomaly.270.name: "Tai nạn Đâm xe Lớn"
 anomaly.270.desc: "Mặc dù hố thiên thạch ở đây lẽ ra chỉ là do va chạm thiên thạch thông thường gây ra, nhưng những đường vân phức tạp trong hố hẳn là được tạo ra sau vụ va chạm.\n\nChuyên viên khoa học [Root.GetLeaderName] cho rằng những vết hằn trên bề mặt này không phải do thiên thạch gây ra, mà là do tiểu hành tinh [From.GetName] va chạm với một loại cơ sở hạ tầng quỹ đạo không xác định hoặc tàu vũ trụ ngoài hành tinh nào đó gây ra."
 anomaly.270.a: "Thật kỳ lạ."
 anomaly.270.a.tooltip: "Thêm yếu tố sửa đổi §YĐường đua Tử thần§! cho [From.GetName]:\n£engineering£§G+3§!"
 anomaly.275.name: "Động cơ Đẩy bị Bỏ hoang"
 anomaly.275.desc: "Trung tâm của một trong những miệng hố lớn trên [From.GetName] có máy móc bằng kim loại do người ngoài hành tinh chế tạo.\n\nChuyên viên khoa học [Root.GetLeaderName] cho rằng những cỗ máy lớn này được dùng để đẩy toàn bộ hành tinh. Mục đích của việc đó là đẩy [From.GetName] ra khỏi quỹ đạo ban đầu, nhưng không rõ điểm đến. [Root.GetName] đang túc trực, có thể tiến hành tháo dỡ và phân tích những động cơ đẩy này, biết đâu có thể nâng cấp công nghệ động cơ đẩy của chúng ta."
 anomaly.275.a: "Cứ làm vậy đi."
 anomaly.275.b: "Cứ để đó mặc kệ đi."
 anomaly.280.name: "Thuộc địa Thất bại"
 anomaly.280.desc: "Trên [From.GetName] đã từng có thuộc địa của người ngoài hành tinh, ít nhất là một nỗ lực thuộc địa hóa ban đầu. Chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng lần thuộc địa hóa đó rõ ràng là chưa chín muồi, các công trình được xây dựng hoàn toàn không thể chống chọi lại khí hậu khắc nghiệt của [From.GetName].\n\n[Root.GetName] không muốn tay trắng trở về, nên đã mang theo một thiết bị lọc khí quyển phế liệu về tàu, nghĩ rằng có thể nghiên cứu được gì đó."
 anomaly.280.a: "Chúng ta có thể rút kinh nghiệm từ họ."
 anomaly.280.b: "Thứ này chẳng có tác dụng gì cả."
 anomaly.280.c: "[Root.Owner.GetName] sẽ không bao giờ mắc phải sai lầm như vậy."
 anomaly.285.name: "Lớp vỏ Bất thường"
 anomaly.285.desc: "Thứ mà [Root.GetName] tìm thấy trên [From.GetName] không phải là công trình kiến trúc, mà là những tầng đá khoáng vô cùng bình thường. Chuyên viên khoa học [Root.GetLeaderName] cho rằng những tầng đá này lộ ra khỏi mặt đất là do các mảng kiến tạo vỏ hành tinh khác nhau va chạm vào nhau, sự đặc biệt về hình dạng của chúng là do cấu trúc vật lý khác thường trong lớp vỏ của hành tinh gây ra.\n\nBởi vì hình dạng của nó quá ngay ngắn, có vẻ như một loài sinh vật ngoài hành tinh nào đó đã từng chỉnh sửa lớp vỏ của [From.GetName]."
 anomaly.285.a: "Thật có ý nghĩa."
 anomaly.285.a.tooltip: "Thêm yếu tố sửa đổi §YLớp vỏ Bất thường§! cho [From.GetName]:\n£engineering£§G+2§!\n£physics£§G+2§!"
 anomaly.290.name: "Mạch khoáng Tiềm năng"
 anomaly.290.desc: "Tài nguyên khoáng sản của [From.GetName] vô cùng phong phú.\n\nKhông may là, phần lớn quặng trong đó không có tác dụng với chúng ta. Tuy nhiên, chuyên viên khoa học [Root.GetLeaderName] cho rằng nhiều nguyên tố trong lớp vỏ của [From.GetName] có thể được chuyển hóa thành quặng hữu ích cho phía ta thông qua việc oanh tạc bằng positron.\n\n[Root.GetName] hy vọng [Root.Owner.GetName] có thể cấp 1000 Điểm Năng lượng để thực hiện kế hoạch này."
 anomaly.290.a: "Không được, không phê duyệt."
 anomaly.290.b: "Rất tốt, chuẩn bị oanh tạc bằng positron."
 #anomaly.292.desc: "Phi hành đoàn của [Root.GetName] vui mừng báo cáo rằng cuộc thử nghiệm đã thành công, và một số lượng lớn các mạch khoáng chất dày đặc trên [From.From.GetName] đã được chuyển hóa thành kim loại quý."
 anomaly.292.desc: "Phi hành đoàn của [Root.GetName] đã báo cáo về sự thành công của cuộc thử nghiệm. Nhiều mạch khoáng trên [From.From.GetName] hiện nay đã có thể được chúng ta sử dụng."
 anomaly.295.name: "Lộn ngược Đảo điên"
 anomaly.295.desc: "Khi [Root.GetName] đi qua vành đai tiểu hành tinh trên đường đến [From.GetName], chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng phi thuyền đã trải qua vài lần thay đổi trọng lực bất ngờ. Vì tò mò, [Root.GetLeaderName] đã cử máy bay không người lái đi khảo sát nguyên nhân.\n\nKết quả là, máy bay không người lái đã tìm thấy một vài máy tạo trọng lực cũ kỹ của người ngoài hành tinh. Do bị đảo cực và thiếu pin, những máy tạo trọng lực này thỉnh thoảng lại phát ra sóng phản trọng lực vào hư không. Nhưng tác dụng của nó không mạnh, không thể gây ra bất kỳ thiệt hại đáng kể nào. Chúng ta không thể khôi phục hiệu ứng của máy tạo trọng lực về cường độ ban đầu của chúng.\n\nChuyên viên khoa học [Root.GetLeaderName] cho rằng những máy tạo trọng lực này ban đầu được dùng để cung cấp trọng lực nhân tạo cho một tiểu hành tinh tương đối lớn nào đó trong vành đai tiểu hành tinh, nhưng do một sự cố nào đó, tiểu hành tinh này đã vỡ vụn thành từng mảnh."
 anomaly.295.a: "Ý tưởng này thật phiền phức."
 anomaly.3000.name: "Sai lầm Sơ đẳng"
 anomaly.3000.desc: "Theo báo cáo từ phi hành đoàn của [Root.GetName], nhiệm vụ của họ đã thất bại. Chuyên viên khoa học [Root.GetLeaderName] nổi hứng muốn tự tay điều khiển máy bay không người lái để thu thập mẫu quặng, kết quả là đã vô tình đâm vào quặng, mặc dù lực đâm không mạnh nhưng số quặng đã hoàn toàn vỡ nát.\n\nPhi hành đoàn cũng đề cập rằng, chuyên viên khoa học [Root.GetLeaderName] cảm thấy vô cùng áy náy về điều này, vả lại những quặng vỡ đó cũng có chút giá trị."
 anomaly.3000.a: "Quặng bị vỡ cũng vẫn là quặng."
 anomaly.3000.b: "[Root.Owner.GetName] không thể chấp nhận những hành vi bất cẩn như vậy."
 anomaly.3005.name: "Lồng giam Vàng"
 anomaly.3005.desc: "Cấu trúc của khối khoáng thạch này giống như một căn phòng, không có từ nào khác diễn tả chính xác hơn.\n\nLoại khoáng thạch cấu tạo nên căn phòng này rất được người [Root.Owner.GetName] ưa chuộng. Khối khoáng thạch này là một khối đa diện 32 mặt rỗng bên trong, kết quả quét cộng hưởng từ cho thấy bên trong rỗng, rất có thể từng có người sinh sống. Nhưng bên trong khối khoáng thạch không giống như vẻ ngoài bóng bẩy của nó, có vẻ như đã bị ai đó phá hoại đến mức hỗn loạn không chịu nổi.\n\nChuyên viên khoa học [Root.GetLeaderName] báo cáo rằng do sự phá hoại này, chúng ta rất khó tìm thấy thông tin có giá trị từ bên trong khối khoáng thạch. Nhưng cấu trúc bên ngoài của tòa nhà có thể chống chọi được áp lực không gian sâu thẳm, công nghệ xây dựng của nó chắc chắn vô cùng tiên tiến."
 anomaly.3005.a: "Thật khó hiểu."
 anomaly.3010.name: "Bản sao Tinh thể"
 anomaly.3010.desc: "Khối quặng này là một máy ghi hình ba chiều, ngoại hình góc cạnh rõ ràng, có dạng bán trong suốt. Hiện tại nó đang được đặt an toàn trong chùm tia kéo của [Root.GetName], nhưng việc giải mã nội dung của nó vẫn cần có thời gian.\n\nĐã thành lập một §YDự án Đặc biệt§! để đẩy nhanh tiến độ này."
 anomaly.3010.a: "Chắc chắn chẳng phải chuyện tốt đẹp gì."
 anomaly.3010.b: "Rất tốt."
 anomaly.3012.desc: "Tài liệu dữ liệu trong máy ghi hình ba chiều là một thỏa thuận thương mại giữa ba cường quốc từng thống trị khu vực này. Nội dung trong đó chúng ta không thể hiểu được và cũng vô nghĩa, nhưng chuyên viên khoa học [Root.GetLeaderName] cho rằng điều này có thể cải thiện đáng kể khả năng giao tiếp của chúng ta với người ngoài hành tinh."
 anomaly.3015.name: "Doanh trại Ngoài hành tinh"
 anomaly.3015.desc: "Hình ảnh dò tìm được trên quỹ đạo thực sự là một tòa nhà. Điều tra thêm phát hiện ra rằng tòa nhà rõ ràng được sử dụng cho mục đích quân sự. Mặc dù đã bị bỏ hoang một thời gian — ở quy mô thiên hà thì không lâu lắm — nhưng chuyên viên khoa học [Root.GetLeaderName] cho rằng từ doanh trại bị bỏ hoang dưới lớp bụi và kho vũ khí trống rỗng vẫn có thể tìm thấy bí mật chiến thuật của người ngoài hành tinh.\n\nĐã thành lập một §YDự án Đặc biệt§! để nghiên cứu đống đổ nát này."
 anomaly.3015.a: "Đã rõ."
 anomaly.3015.b.pacifist: "Vì đã trở thành đống đổ nát, vậy thì đừng quan tâm đến nó nữa."
 anomaly.3017.name: "Doanh trại Ngoài hành tinh"
 anomaly.3017.desc: "Chuyên viên khoa học [Root.GetLeaderName] đã tiến hành phân tích chi tiết về lịch sử ngoài hành tinh đối với [From.From.GetName], nhưng kết quả cuối cùng không khả quan. Doanh trại này đã được xây dựng từ lâu trước khi hành tinh trở nên cằn cỗi, nhưng không biết vì lý do tự nhiên hay chiến tranh mà nay đã biến thành một đống đổ nát như thế này.\n\nKết luận có thể rút ra là: Vũ khí và chiến lược mà những người ngoài hành tinh này sử dụng không tiên tiến hơn những gì chúng ta đang sử dụng hiện nay.\n\nTuy nhiên, chuyên viên khoa học [Root.GetLeaderName] nói rằng bản thân đã nhận được rất nhiều cảm hứng từ cuộc thăm dò này."
 anomaly.3017.a: "Vẫn có ích đấy chứ."
 anomaly.3020.name: "Mạng lưới"
 anomaly.3020.desc: "Cấu trúc topo đặc biệt của [From.GetName] đã chia gọn hành tinh thành vô số quần xã khác nhau, khí hậu của từng quần xã duy trì sự cân bằng của môi trường xung quanh một cách tinh tế. Chuyên viên khoa học [Root.GetLeaderName] nghi ngờ mạnh mẽ rằng đây là kết quả của một công nghệ cải tạo môi trường tiên tiến, nhưng chúng ta không thể giải thích họ đã làm điều đó như thế nào.\n\nMặc dù vậy, kết quả cải tạo môi trường là điều hiển nhiên đối với [Root.GetLeaderName] và phi hành đoàn của [Root.GetName]."
 anomaly.3020.a: "Thật có ý nghĩa."
 anomaly.3025.name: "Cơ sở Tự động Cổ đại"
 anomaly.3025.desc: "Chúng tôi đã tìm thấy một tòa nhà của người ngoài hành tinh bị thực vật che lấp ở trung tâm một khu vực có thảm thực vật rất dày đặc trên [From.GetName], ban đầu chúng tôi tưởng nó đã bị phá hủy, nhưng sau khi [Root.GetName] khảo sát cẩn thận đã phát hiện ra rằng, nó vẫn chưa bị sự xói mòn bởi hệ thực vật cực kỳ rậm rạp trên hành tinh này.\n\nĐã khởi động một §YDự án Đặc biệt§! để tìm lối vào tòa nhà."
 anomaly.3025.a: "Rất có ý nghĩa."
 anomaly.3027.desc: "Tòa nhà cỏ mọc um tùm này là nhà máy chế biến khoáng sản của người ngoài hành tinh. Nhà máy nằm ở [From.From.GetName] này mặc dù đã bị bỏ hoang từ lâu, nhưng dường như đã từng được tự động hóa hoàn toàn, trên sàn nhà máy còn có một lượng lớn xác của robot tự động — cơ thể của chúng chủ yếu được tạo thành từ các hợp chất hữu cơ, bên trong sử dụng bộ xương trong bằng polyme để chống đỡ, nay cũng đã mục nát cùng nhau.\n\nChuyên viên khoa học [Root.GetLeaderName] cho rằng chính những tàn tích hữu cơ này sau khi hóa lỏng đã ngấm vào lòng đất, khiến đất đai trở nên màu mỡ, và các loài thực vật trên hành tinh mới có thể phát triển mạnh mẽ và dẻo dai đến vậy.\n\nCó thể tái kích hoạt nhà máy này, nhưng những người công nhân tự động quyến rũ mà [Root.GetLeaderName] quan tâm sẽ không bao giờ có thể sống lại được nữa."
 anomaly.3027.a: "Đã hiểu."
 anomaly.3027.a.tooltip: "Thêm §YNhà máy Cổ đại§! cho [From.GetName].\n"
 anomaly.3030.name: "Neo đậu Tạm thời"
 anomaly.3030.desc: "Một chiếc tàu không người lái đã được phát hiện trên vùng đồng bằng của [From.GetName], cảm biến của nó đã phản hồi lại sự hiện diện của [Root.GetName] trên quỹ đạo hành tinh.\n\nPhi hành đoàn của [Root.GetName] không thể xác nhận chiếc tàu này bị bỏ rơi khi nào, cũng như không biết ai là người đã bỏ rơi nó. Còn về tung tích của các phi hành đoàn ban đầu thì càng không thể điều tra được. Theo như lời của chuyên viên khoa học [Root.GetLeaderName], nếu muốn thu nạp nó vào hạm đội của phía ta, việc kích hoạt từ xa chiếc phi thuyền hạng nhẹ này sẽ không thành vấn đề."
 anomaly.3030.a: "Tất nhiên, đằng nào cũng không có ai lấy."
 anomaly.3030.a.tooltip: "Nhận được một tàu §YHộ vệ hạm§!."
 anomaly.3030.b.phobe: "Chúng ta không biết thứ này từ đâu tới, cũng không biết nó sẽ đi về đâu. Tháo dỡ đi."
 anomaly.3035.name: "Kiểm đếm Kho dự trữ"
 anomaly.3035.desc.carefree: "Sự thật chứng minh, [From.GetPlanetMoon] [From.GetName] cằn cỗi chẳng có gì thú vị cả.\n\nKhi phi hành đoàn đang theo dõi các thiết bị tĩnh lặng, chuyên viên khoa học [Root.GetLeaderName] trong lúc nhàn rỗi đã kiểm tra tình trạng dự trữ năng lượng của [Root.GetName]. Theo báo cáo của họ, lượng năng lượng được bổ sung trong lần rời cảng trước của [Root.GetName] ít hơn mức tiêu chuẩn, nhưng nhiều khả năng hơn là do sự quản lý lỏng lẻo của [Root.GetLeaderName] đối với các nguồn lực đã dẫn đến tình trạng khó xử này.\n\nDù sao đi nữa, con tàu này cần thêm năng lượng để làm nguồn cung cấp bổ sung."
 anomaly.3035.desc.meticulous: "Sự thật chứng minh, [From.GetPlanetMoon] [From.GetName] cằn cỗi chẳng có gì thú vị cả.\n\nKhi phi hành đoàn đang theo dõi các thiết bị tĩnh lặng, chuyên viên khoa học [Root.GetLeaderName] đã tiến hành kiểm kê cẩn thận dự trữ năng lượng của [Root.GetName]. Theo báo cáo của họ, lượng năng lượng được bổ sung trong lần rời cảng trước của [Root.GetName] nhiều hơn mức tiêu chuẩn, điều này rất có thể là do nhầm lẫn trên giấy tờ.\n\n[Root.Leader.GetName] đã tự nguyện đề xuất nộp lại số năng lượng dư thừa cho chính quyền của người [Root.Owner.GetSpeciesAdj]."
 anomaly.3035.a: "Thu hoạch ngoài ý muốn."
 anomaly.3035.b: "Quả nhiên không ngoài dự đoán."
 anomaly.3040.name: "Cướp biển Bị lưu đày"
 anomaly.3040.desc: "Thứ mà chúng ta lầm tưởng là cụm khoáng sản thực chất là lớp vỏ kim loại của hai tàu Hộ vệ hạm ngoài hành tinh, chúng đang lặng lẽ trôi qua vành đai tiểu hành tinh.\n\nChuyên viên khoa học [Root.GetLeaderName] đã thiết lập liên lạc với họ, phi hành đoàn của hai con tàu này tự xưng rằng trước đây họ đều là hải tặc, nay đã bị thủ lĩnh lưu đày. Họ nghe nói [Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName] là người cai trị của [Root.Owner.GetName], một người rất gần gũi với dân, nên đặc biệt đến xin tị nạn."
 anomaly.3040.desc.fallback: "Thứ mà chúng ta lầm tưởng là mạch khoáng sản thực chất là lớp vỏ kim loại của hai tàu Hộ vệ hạm ngoài hành tinh, chúng đang lặng lẽ trôi qua vành đai tiểu hành tinh.\n\nChuyên viên khoa học [Root.GetLeaderName] đã thiết lập liên lạc với họ, phi hành đoàn của hai con tàu này tự xưng rằng trước đây họ đều là hải tặc, nay đã bị thủ lĩnh băng đảng lưu đày. Điều rất kỳ diệu là, họ tin rằng chúng ta sẽ đối xử tử tế với họ, nên đặc biệt đến xin tị nạn."
 anomaly.3040.a: "Họ có thể có ích."
 anomaly.3040.a.tooltip: "Thu nạp những tên cướp biển bị lưu đày và nhận được hai tàu §YHộ vệ hạm§!."
 anomaly.3040.b: "Chúng ta không cần sự giúp đỡ của họ. Tịch thu đồ đạc của họ, chỉ để lại cho họ cái mạng thôi."
 anomaly.3040.c: "[Root.Owner.GetName] không thể dung thứ cho những kẻ như họ tồn tại."
 anomaly.3040.c.tooltip: "Cướp biển bị lưu đày chuyển sang trạng thái thù địch!"
 anomaly.3040.d: "Chúng ta phải từ chối yêu cầu tị nạn của họ."
 anomaly.3050.name: "Lưới sắt Chói tai"
 anomaly.3050.desc: "[From.GetName] rải rác những vành đai khoáng vật nhấp nhô, treo lơ lửng trên bề mặt vốn đã vô cùng gồ ghề của nó bằng những bộ khung cao chót vót và có tính đàn hồi. Do thường xuyên bị xáo trộn bởi luồng không khí, các khung bị lắc lư và những dải ruy băng xếp tầng cọ xát vào nhau, tạo ra sóng âm mà người [Root.Owner.GetSpeciesNamePlural] không thể nghe thấy.\n\nChuyên viên khoa học [Root.GetLeaderName] báo cáo rằng việc tách sóng âm này khỏi tiếng ồn xung quanh của hành tinh gặp khó khăn, đồng thời cũng đề xuất nếu có ý định khai thác, nên phá hủy các vành đai khoáng vật, để [Root.Owner.GetName] thu hồi và tái sử dụng."
 anomaly.3050.a: "Tách âm thanh ra và tiến hành nghiên cứu."
 anomaly.3050.a.tooltip: "[From.GetName]:\n£society£§G+9§!"
 anomaly.3050.b: "Chuẩn bị thu hồi vành đai khoáng vật."
 anomaly.3050.b.tooltip: "[From.GetName]:\n£minerals£§G+6§!"
 anomaly.3055.name: "Vương quốc Rừng rậm"
 anomaly.3055.desc: "[From.GetName] là một hành tinh nhiệt đới có hệ sinh thái phong phú. Tuy nhiên, phân tích cận cảnh thảm thực vật trên bề mặt của nó lại cho thấy sự thiếu đa dạng sinh học một cách bất thường, một loại cây cao lớn đặc biệt đã trở thành thành phần chủ đạo của hệ sinh thái.\n\nMặc dù bản thân loài cây này không gây ra tác hại gì, nhưng sự thống trị duy nhất của nó sẽ tác động bất lợi đến sự sống còn của các loài động vật nhỏ trên hành tinh này, nếu muốn thuộc địa hóa, việc trồng trọt hoa màu hiệu quả trên bề mặt của nó cũng sẽ vô cùng khó khăn.\n\nChuyên viên khoa học [Root.GetLeaderName] với tư cách là một chuyên gia sinh học ngoài hành tinh danh tiếng, đã lên kế hoạch tái cân bằng hệ sinh thái của hành tinh này."
 anomaly.3055.a: "Đồng ý kế hoạch."
 anomaly.3055.a.tooltip: "Thêm yếu tố sửa đổi §YMất cân bằng Sinh thái§! cho [From.GetName]:\n£food£§R-20%§!\n"
 anomaly.3055.b: "Cứ giữ nguyên hiện trạng đi."
 anomaly.3055.b.tooltip: "Thêm yếu tố sửa đổi §YMất cân bằng Sinh thái§! cho [From.GetName]:\n£food£§R-20%§!"
 anomaly.3056.desc: "Sự cân bằng đã được khôi phục — hoặc có lẽ là lần đầu tiên đạt được. Tia phóng xạ từ [Root.GetName] đã xóa bỏ khả năng sinh sản của những loại cây thân gỗ lâu năm bao phủ hành tinh này từ bấy lâu nay. Còn có một số cây bị thiêu rụi thành tro bụi, nhằm mục đích đạt được sự cân bằng thực sự càng sớm càng tốt."
 anomaly.3057.desc: "Việc tiêu diệt quyết liệt những cây cối bao phủ [From.From.GetName] bấy lâu nay đã gây ra hậu quả ngoài ý muốn.\n\nSố lượng những loài động vật nhỏ trước đây phải chật vật kiếm sống vì những cái cây này nay đã tăng vọt, và cũng có ý muốn tấn công hung hãn hơn — hay nói cách khác là trở nên hoang dã hơn. Vùng đất cháy đen bị cô lập từng là nơi tọa lạc của khu rừng rậm rạp, nay lại trở thành chiến trường cho các cuộc tranh chấp lãnh thổ."
 anomaly.3057.a: "Có lẽ lẽ ra chúng ta không nên can thiệp."
 anomaly.3057.a.tooltip: "§RĐộng vật Hoang dã Nguy hiểm§! hiện đã rải rác khắp [From.From.GetName]."
 anomaly.3060.name: "Phi thuyền Giấu trong Biển cát"
 anomaly.3060.desc: "Chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng, chúng ta đã phạm một sai lầm ngớ ngẩn, những gợn sóng biển cát mà chúng ta nhìn thấy trên sa mạc của [From.GetName] thực chất là do động cơ đẩy của phi thuyền khởi động tạo ra.\n\nCó một phi thuyền ngoài hành tinh bị vùi lấp chúc đầu xuống biển cát, hệ thống đẩy hoạt động ngắt quãng của nó đã khuấy động nên những cơn sóng trên cồn cát phía trên. Có vẻ như thứ này đã bị mắc kẹt ở đây một thời gian rồi, dưới tác dụng của động cơ đẩy nó ngày càng cắm sâu vào cồn cát. [Root.GetName] không có thiết bị và phương pháp nào có thể trục vớt con tàu này, [Root.GetLeaderName] đề xuất cử một phi thuyền đến [From.GetName] để tiến hành khai quật nó."
 anomaly.3060.a: "Đã rõ."
 anomaly.3060.b: "Cái bẫy rõ ràng thế này, chúng ta sẽ không mắc mưu đâu."
 anomaly.3060.c: "Bất kỳ sinh vật hữu cơ nào còn sót lại đều sẽ bị tiêu diệt."
 anomaly.3061.desc: "[Root.GetFleetName] cuối cùng cũng trục vớt thành công chiếc phi thuyền ngoài hành tinh.\n\nNhưng nó trống rỗng, hoặc có thể nói, đã bị tháo dỡ không còn sót lại gì.\n\nPhi hành đoàn ban đầu chắc hẳn đã tháo dỡ toàn bộ những thứ không quan trọng rồi bỏ tàu rời đi, để lại chiếc vỏ rỗng này chìm trên [From.From.GetName]. Các kỹ sư của [Root.GetFleetName] đã bận rộn một lúc lâu, cuối cùng cũng nạp đầy năng lượng và khởi động lại phi thuyền."
 anomaly.3061.a: "Hạm đội của người [Root.Owner.GetSpeciesAdj] đã có thành viên mới."
 anomaly.3061.a.tooltip: "Nhận được một tàu §YHộ vệ hạm§!."
 anomaly.3062.desc: "[Root.GetFleetName] sử dụng cáp cường độ cao cuối cùng đã trục vớt thành công phi thuyền ngoài hành tinh bị chìm, nhưng đồng thời cũng nghe thấy tiếng gầm rú khi hệ thống vũ khí của nó khởi động!"
 anomaly.3062.a: "Né tránh mau!"
 anomaly.3062.a.tooltip: "§Y“Tàu Đà Điểu”§! đã bắt đầu tấn công!"
 anomaly.3063.desc: "Hoạt động thu hồi đã thất bại. Sợi cáp cường độ cao của [Root.GetFleetName] quấn quanh thân tàu trong khoảnh khắc kéo lên đã cắt thân tàu bị ăn mòn nghiêm trọng thành nhiều khúc.\n\nCác mảnh vỡ riêng lẻ thì khá dễ thu hồi, nhưng toàn bộ phi thuyền đã biến thành đống sắt vụn."
 anomaly.3063.a: "Lại làm hỏng chuyện rồi."
 anomaly.3065.name: "Liên lạc Vô hiệu"
 anomaly.3065.desc: "Một trạm chuyển tiếp liên lạc chắp vá đã được buộc vào [From.GetName] một cách vô cùng nghiệp dư.\n\nChuyên viên khoa học [Root.GetLeaderName] cho rằng đây là một phần của mạng lưới liên lạc hải tặc. Phân tích sơ bộ cho thấy nội dung liên lạc không chứa bất kỳ thông tin chiến thuật nhạy cảm nào, chỉ là những cuộc trò chuyện bình thường giữa các thành viên phi hành đoàn của tàu hải tặc."
 anomaly.3065.a: "Có lẽ chúng ta có thể nhìn thoáng qua cuộc sống ở không gian sâu thẳm."
 anomaly.3065.b: "Có lẽ chúng ta có thể nhìn thoáng qua cuộc sống ở không gian sâu thẳm."
 anomaly.3070.name: "Đổ sông đổ biển"
 anomaly.3070.desc: "Chỉ số thu được phát ra từ một khoang kim loại nhỏ, chuyên viên khoa học [Root.GetLeaderName] nhận định đây là một chiếc thuyền cứu sinh ngoài hành tinh cổ đại.\n\nThứ này rõ ràng là đã bị giếng trọng lực ở rìa hố đen nhốt lại ở đây từ rất lâu về trước, vì vấn đề góc độ nên không thể thoát ra được — còn về việc đây là cố ý hay tình cờ thì vẫn chưa rõ — động cơ đẩy của thuyền cứu sinh kể từ đó đã luôn gắng sức chạy thoát khỏi chân trời sự kiện của hố đen. Hiện tại nó đã ở quá gần chân trời sự kiện của hố đen, không thể tiến hành thu hồi được nữa.\n\nBáo cáo của [Root.GetLeaderName] đột nhiên bị gián đoạn, sau đó phi hành đoàn của [Root.GetName] gửi thông báo nói rằng, chuyên viên khoa học đó đang run rẩy toàn thân, dường như cảm thấy vô cùng buồn bã trước số phận bi thảm của chiếc thuyền cứu sinh này."
 anomaly.3070.desc.mach: "Chỉ số thu được phát ra từ một khoang kim loại nhỏ, chuyên viên khoa học [Root.GetLeaderName] nhận định đây là một chiếc thuyền cứu sinh ngoài hành tinh cổ đại.\n\nThứ này rõ ràng là đã bị giếng trọng lực ở rìa hố đen nhốt lại ở đây từ rất lâu về trước, vì vấn đề góc độ nên không thể thoát ra được — còn về việc đây là cố ý hay tình cờ thì vẫn chưa rõ — động cơ đẩy của thuyền cứu sinh kể từ đó đã luôn gắng sức chạy thoát khỏi chân trời sự kiện của hố đen. Hiện tại nó đã ở quá gần chân trời sự kiện của hố đen, không thể tiến hành thu hồi được nữa.\n\nBáo cáo của [Root.GetLeaderName] đột nhiên bị gián đoạn, sau đó phi hành đoàn của [Root.GetName] gửi thông báo nói rằng, chuyên viên khoa học đó dường như bị ảnh hưởng sâu sắc bởi dữ liệu mới này, do nó đã làm thay đổi đáng kể thống kê đánh giá rủi ro và dự đoán tỷ lệ sống sót của [Root.GetName]."
 anomaly.3070.a: "Có thể hiểu được."
 anomaly.3075.name: "Bức xạ Phân tán"
 anomaly.3075.desc: "Đáng ngạc nhiên là dữ liệu do hệ thống này thu thập thực sự đến từ chính bản thân [From.GetName].\n\nĐối với một hố đen, kích thước của nó khá nhỏ, dường như có thể giải thích lý do tại sao lại có bức xạ thoát ra từ chân trời sự kiện của nó. Chuyên viên khoa học [Root.GetLeaderName] cho rằng hố đen này đang sụp đổ, và sẽ sớm biến mất, nhưng rất khó để nói liệu quá trình này có hoàn tất trước cái chết nhiệt của vũ trụ hay không.\n\nTheo lời của [Root.GetLeaderName], những nhiễu loạn trọng lực mà hố đen này phải chịu đựng trong giai đoạn hình thành đã khiến nó trở nên “bất an”, qua đó tiếp tục tăng cường năng lượng chảy ra khỏi chân trời sự kiện của nó."
 anomaly.3075.a: "Chúng ta có thể học hỏi được rất nhiều điều từ đó."
 anomaly.3075.a.tooltip: "[From.GetName]:\n£physics£§G+9§!"
 anomaly.3080.name: "Nhà máy Đồ chơi"
 anomaly.3080.desc: "Mặc dù phần lớn các công trình trên [From.GetName] đều đã hóa thành đống đổ nát, nhưng vẫn còn một số ít được lưu giữ. Khi [Root.GetName] đi qua hành tinh này lần đầu tiên, chỉ tìm thấy một tòa nhà khá nguyên vẹn, đứng trơ trọi giữa đống đổ nát của [From.GetName].\n\nĐó chính là nguồn gốc của tiếng ồn.\n\nTòa nhà này không chỉ có cấu trúc hoàn chỉnh, theo như chuyên viên khoa học [Root.GetLeaderName] nói, dường như còn có dấu hiệu hoạt động.\n\nĐó là một cơ sở sản xuất, chuyên biến polyme nhựa thành một loại đồ vật không xác định, tuy nhiên dường như là dùng để trang trí. Nguyên liệu sản xuất và sản phẩm cuối cùng của nó không có giá trị nghiên cứu đối với [Root.Owner.GetName], nhưng chúng ta có thể nghiên cứu quy trình sản xuất tự động của nó."
 anomaly.3080.a: "Có lẽ chúng ta nên thiết lập một cứ điểm và tiến hành quan sát."
 anomaly.3080.a.tooltip: "Thêm một §YNhà máy Đồ chơi Ngoài hành tinh§! cho [From.GetName]."
 anomaly.3085.name: "Quân Vương"
 anomaly.3085.desc: "Trên quỹ đạo chậm chạp xung quanh [From.GetName] khổng lồ có một cơ sở dữ liệu di động đang lơ lửng. [Root.GetName] sau khi trục vớt nó đã phát hiện ra rằng bên trong dường như chứa nội dung được viết bằng một loại ngôn ngữ ngoài hành tinh nào đó. Từ vựng cấu thành của nó không hoàn toàn xa lạ, nhưng ngữ pháp lại vô cùng phức tạp.\n\nChuyên viên khoa học [Root.GetLeaderName] đề nghị nên tiến hành nghiên cứu thêm để giải mã nội dung và nguồn gốc của văn bản này."
 anomaly.3085.a: "Tiến hành phân tích trên [Root.Owner.Capital.GetName]."
 anomaly.3085.b: "Không cần quan tâm đến nó."
 anomaly.3086.name: "Bản Đọc thử Quân Vương"
 anomaly.3086.desc: "Tiêu đề của văn bản này có thể được dịch đại khái là “Người Cai trị Khu vực”, toàn bộ tác phẩm dường như được viết bằng phương ngữ cổ của người [book_writer.GetSpeciesAdj], phương ngữ này thường được sử dụng tại [book_writer.GetName].\n\nNội dung chắc chắn mang lại giá trị lịch sử nhất định cho họ, biết đâu lại còn có thể mang đến điều gì đó gợi mở."
 anomaly.3086.a: "Bí mật này tốt nhất là đừng nói ra — không cần thiết phải cho họ biết."
 anomaly.3086.b: "Chúng ta phải vật quy nguyên chủ. Liên lạc với họ."
 anomaly.3086.c: "Ngòi bút của họ sáo rỗng thế này, thì tư duy đương nhiên cũng yếu kém không chịu nổi. Liên lạc với họ."
 anomaly.3087.name: "[book_writer.GetName]"
 anomaly.3087.desc: "Chúng tôi nghe nói bạn đã tìm thấy bản sao cuối cùng của Quân Vương. Đây là một di sản văn hóa lịch sử vô cùng quan trọng đối với xã hội chúng tôi.\nChúng tôi từng cho rằng nó đã bị phá hủy trong cuộc tấn công của hải tặc nhiều năm trước, nhưng giờ đây nó lại rơi vào tay những con người văn minh, chúng tôi vô cùng vui mừng.\n\nBạn có thể giao lại nó cho chúng tôi được không? Chúng tôi sẽ dùng Điểm Năng lượng để làm phần thưởng."
 anomaly.3087.a: "Tất nhiên là được."
 anomaly.3088.name: "[book_writer.GetName]"
 anomaly.3088.desc: "Chúng tôi nghe nói bạn đã tìm thấy bản sao cuối cùng của Quân Vương. Đây là một di sản văn hóa lịch sử vô cùng quan trọng đối với xã hội chúng tôi.\n\nChúng tôi từng cho rằng nó đã bị phá hủy trong cuộc tấn công của hải tặc nhiều năm trước, nhưng giờ đây nó lại rơi vào tay những con người văn minh, chúng tôi vô cùng vui mừng.\n\nBạn có thể giao lại nó cho chúng tôi được không?"
 anomaly.3088.a: "Không. Tiện thể nói luôn, chúng tôi cho rằng thứ này chẳng ra gì."
 anomaly.3088.b: "Không. Những dòng chữ này chính là công cụ của bọn lừa đảo."
 anomaly.3088.c: "Hãy mang theo cuốn sách của các người xuống địa ngục luôn đi."
 anomaly.3089.name: "[book_writer.GetName]"
 anomaly.3089.desc: "Tuyệt đối không dung thứ cho việc các người phê phán văn học của chúng tôi!\n\nCác người sẽ phải hối hận!"
 anomaly.3089.a: "Hừ, một lũ mọt sách."
 anomaly.3089.b: "Sinh vật hữu cơ thật đáng thương."
 anomaly.3090.name: "Kẻ Bắt cóc Liên sao: Đèn tín hiệu Khẩn cấp"
 anomaly.3090.desc: "Trên quỹ đạo êm đềm của [From.GetName] lại đang lơ lửng một chiếc đèn tín hiệu khẩn cấp. Lớp vỏ ngoài của nó đã bị hư hỏng nặng, dường như bị hỏa lực vũ khí bắn trúng hoặc bị ảnh hưởng bởi một vụ nổ lớn.\n\nĐây có vẻ là mẫu dành riêng cho phi thuyền dân sự của người [Root.Owner.GetSpeciesAdj] — được sử dụng làm biện pháp khẩn cấp để phóng ra khi hệ thống liên lạc gặp sự cố — nhưng mức độ hư hỏng nghiêm trọng của nó khiến chúng ta không thể biết được tình hình cụ thể.\n\nNó liên tục lặp lại một tín hiệu yếu ớt và bị bóp méo."
 anomaly.3090.a: "Điều tra tín hiệu truyền đi."
 anomaly.3090.b: "Có lẽ là một cái bẫy — tốt nhất đừng dấn thân vào nguy hiểm."
 anomaly.3091.name: "Kẻ Bắt cóc Liên sao: SOS"
 anomaly.3091.desc: "Thiết bị định vị đã xác nhận tín hiệu đến từ [Root.Owner.GetSpeciesAdj], và sóng phát ra từ nó hiện đã dần ổn định."
 anomaly.3091.a: "Đây là Đế chế [Root.Owner.GetSpeciesAdj]. Hãy cho biết danh tính của các người."
 anomaly.3091.a.tooltip: "Mở hệ thống liên lạc."
 anomaly.3091.b: "Ngắt kết nối hoàn toàn. Mọi chuyện chấm dứt tại đây."
 anomaly.3092.name: "Tù binh [Root.GetSpeciesAdj]"
 anomaly.3092.desc: "Có... có ai ở đó không? Tôi là thuyền trưởng tàu vận tải dân sự 'Luxion' của [Root.GetSpeciesAdj].\n\nÀ, phải nói là cựu thuyền trưởng mới đúng. Tàu Luxion không còn nữa rồi. Chúng tôi bị hải tặc tràn lên tàu, cả nhóm bị bắt làm con tin ngay trước khi tàu nổ tung."
 anomaly.3092.a: "Các người bị ai bắt giữ?"
 anomaly.3092.a.response: "Bọn chúng... tôi nghe chúng tự xưng là cái gì đó liên quan đến liên sao? Những Kẻ Bắt Cóc Liên Sao phải không?\n\nChúng không phải dạng vừa đâu. Nếu chúng cho rằng không thể tống tiền được gì từ [Root.GetName] để đổi lấy mạng sống của chúng tôi, chúng sẽ ra tay sát hại tất cả. Tôi nghe lén được rằng chúng đang thảo luận về các điều kiện tống tiền rồi..."
 anomaly.3092.b: "Chúng tôi sẽ không cứu các người."
 anomaly.3092.c: "Chúng tôi sẽ đến cứu các người."
 anomaly.3093.name: "Tù binh [Root.GetSpeciesAdj]"
 anomaly.3093.desc: "Cái gì? Gì cơ?! Các người không thể thấy chết mà không cứu!\n\nNếu chúng cho rằng không thể dùng chúng tôi để đòi tiền chuộc từ [Root.GetName], chúng chắc chắn sẽ hạ sát chúng tôi mà không hề chớp mắt! Ngay cả khi các người trả tiền chuộc, mạng sống của chúng tôi cũng chẳng được đảm bảo đâu! Các người không thể—"
 anomaly.3093.a: "Vĩnh biệt."
 anomaly.3094.name: "Tù binh [Root.GetSpeciesAdj]"
 anomaly.3094.desc: "Ôi, thực sự đa tạ, đa tạ [Root.GetRulerTitle] rất nhiều! Chúng tôi dường như đang bị giam cầm trong một trạm không gian nào đó, nhưng vị trí cụ thể thì tôi cũng không rõ.\n\nTôi sẽ tăng cường tần số phát sóng ngay lập tức, các bạn có thể dùng thiết bị định vị khẩn cấp để đo đạc tam giác, xác định nơi chúng tôi bị bắt giữ..."
 anomaly.3094.a: "Vị trí đã được ghi nhận vào Nhật ký Tình báo."
 anomaly.3095.name: "Những Kẻ Bắt Cóc Liên Sao: Kế hoạch Hoàn hảo"
 anomaly.3095.desc: "Dù căn cứ của bọn hải tặc được ẩn giấu rất kỹ, nhưng khi đã biết cách tìm thì nó lại hiện ra mồn một.\n\nMột hạm đội dàn đội hình kỳ lạ đang lững lờ tiến ra từ phía sau một cơ sở khai thác khoáng sản cũ — rõ ràng là chúng không hề chuẩn bị cho những vị khách không mời mà đến."
 anomaly.3095.a: "Mở hệ thống liên lạc. Phải để các tù nhân chuẩn bị sẵn sàng."
 anomaly.3096.name: "Tù binh [Root.GetSpeciesAdj]"
 anomaly.3096.desc: "Xin chào, [Root.GetRulerTitle]. Có vẻ như mọi chuyện rắc rối này đều bắt nguồn từ tàu của [Root.GetSpeciesAdj] sao?\n\nNhững vị chủ nhà 'hiếu khách' của chúng tôi có vẻ sắp rời khỏi vị trí hiện tại. Việc đột kích vào nơi này sẽ gây nguy hiểm cho tất cả, nhưng... nếu ngài trực tiếp tấn công vào căn cứ, tôi nghĩ chúng tôi có thể liều một phen để xem có chiếm được tàu cứu sinh nào không.\n\nĐừng bắn nổ chúng tôi khi chúng tôi thoát ra ngoài nhé!"
 anomaly.3096.a: "Được thôi."
 anomaly.3098.name: "Những Kẻ Bắt Cóc Liên Sao: Cát bụi lại về với cát bụi"
 anomaly.3098.desc: "Căn cứ của bọn hải tặc tống tiền đã bị tiêu diệt, và những tù binh [Root.GetSpeciesAdj] cũng tan biến cùng nó. Các tù nhân dường như đã cố gắng liên lạc với hạm đội ngoại hành tinh đang tấn công, nhưng đã bị đối phương phớt lờ."
 anomaly.3098.a: "Chúng ta sẽ không bao giờ quên thảm kịch này."
 anomaly.3099.name: "Những Kẻ Bắt Cóc Liên Sao: Cứu tinh bất ngờ"
 anomaly.3099.desc: "Chiến dịch của [From.From.GetName] đã tiêu diệt hoàn toàn lực lượng của Những Kẻ Bắt Cóc Liên Sao.\n\nCác tù binh [Root.GetSpeciesAdj] đã trốn thoát thành công trong lúc giao tranh, hiện đang ở trên một tàu cứu sinh và chuẩn bị hội quân với tàu cứu hộ của [Root.GetSpeciesAdj]."
 anomaly.3099.a: "Chúng tôi vô cùng biết ơn vì điều này."
 opinion_live_captives: "Tù binh còn sống"
 anomaly.3100.name: "Những Kẻ Bắt Cóc Liên Sao: Nghi vấn"
 anomaly.3100.desc: "Một chiến dịch quân sự không rõ nguồn gốc đã tiêu diệt hoàn toàn lực lượng của Những Kẻ Bắt Cóc Liên Sao.\n\nCác tù binh [Root.GetSpeciesAdj] đã thoát chết một cách thần kỳ, đánh cắp một tàu cứu sinh trong lúc hỗn loạn và đang trên đường trở về [Root.Capital.GetName]."
 anomaly.3100.a: "Thật là một cuộc hội ngộ đầy bí ẩn và ngẫu nhiên."
 anomaly.3101.name: "Những Kẻ Bắt Cóc Liên Sao: Thu dọn tàn cuộc"
 anomaly.3101.desc: "Căn cứ hải tặc đang dần tan rã trong chuỗi phản ứng dây chuyền do tàu ta gây ra. Cùng lúc đó, chúng ta bắt đầu tìm kiếm những người sống sót từ tàu Luxion.\n\nNếu họ thực sự lên được tàu cứu sinh, đáng lẽ giờ này phải liên lạc với chúng ta rồi..."
 anomaly.3101.a: "Quét tất cả các tần số."
 anomaly.3102.name: "Giải cứu tù binh [Root.GetSpeciesAdj]"
 anomaly.3102.desc: "[Root.GetRulerTitle], đây là thủy thủ đoàn tàu Luxion.\n\nKế hoạch diễn ra rất suôn sẻ. Sau khi các ngài tấn công căn cứ, đám lính gác đều chạy hết lên tàu chiến, nhờ vậy chúng tôi đã phá được cửa phòng giam. Các tàu cứu sinh không có người trông coi, có vẻ các ngài đã gây ra rắc rối không nhỏ cho bọn hải tặc nên chẳng ai để ý đến việc chúng tôi bỏ trốn."
 anomaly.3102.a: "Chào mừng trở về, những người bạn quả cảm."
 anomaly.3103.name: "Tù binh [Root.GetSpeciesAdj]"
 anomaly.3103.desc: "Alo——\n\n——Không có tàu cứu sinh, chúng tôi——\n\n——Bị bỏ rơi, kết thúc rồi————————————————"
 anomaly.3103.a: "Thuyền trưởng?"
 anomaly.3103.a.response: "……………\n……………\n……………\n……………\n……………\n……………\n"
 anomaly.3103.b: "……"
 anomaly.3104.name: "Những Kẻ Bắt Cóc Liên Sao: Hóa thành tro bụi"
 anomaly.3104.desc: "Những người [Root.GetSpeciesNamePlural] bị giam giữ cuối cùng đã không thể thoát khỏi căn cứ hải tặc. Chúng ta không thể xác nhận chính xác họ đã hy sinh như thế nào — do tàu cứu sinh không phóng được hay họ vốn dĩ chưa kịp thoát ra khỏi phòng giam — nhưng điều đó không thay đổi được sự thật là họ đã tử nạn.\n\nNgười dân [Root.GetSpeciesAdj] chắc chắn sẽ biết ơn hành động quyết liệt của [Root.GetRulerTitle] thuộc [Root.GetName], nhưng có lẽ thảm kịch này sẽ còn ám ảnh họ trong một thời gian dài."
 anomaly.3104.a: "Đúng là như vậy..."
 anomaly.3105.name: "Những Kẻ Bắt Cóc Liên Sao: Mọi chuyện đã ổn?"
 anomaly.3105.desc: "Thủy thủ đoàn tàu Luxion đã trở về an toàn tại [Root.Capital.GetName], một thảm họa đã được ngăn chặn, và hành động quyết đoán của [Root.GetRulerTitle] thuộc [Root.GetName] khiến người dân [Root.GetAdj] vô cùng tự hào.\n\nSự kiện bắt cóc tống tiền của bọn hải tặc đã kết thúc, băng nhóm đó cũng đã bị xóa sổ, nhưng vẫn còn một số điểm chưa rõ ràng. Ví dụ, những tù binh tuyên bố rằng họ từng nhìn thấy một hạm đội hải tặc quy mô lớn hơn nhiều qua cửa sổ tàu sau khi bị bắt. Từ tình hình hiện tại, có thể khẳng định mối đe dọa thực sự lớn hơn nhiều so với những gì chúng ta thấy.\n\nNhững kẻ thực hiện vụ tống tiền này đã bị xử lý."
 anomaly.3105.a: "Thật đáng để suy ngẫm..."
 anomaly.3110.name: "Tín hiệu về quá khứ"
 anomaly.3110.desc: "Không nằm ngoài dự đoán, [Root.GetName] đã định vị thành công nguồn gốc tín hiệu của [From.GetName].\n\nDù hành tinh này trông có vẻ hoàn toàn hoang sơ, nhưng ở đỉnh một ngọn đồi tại bán cầu nam, người ta đã phát hiện ra một cột khoáng thạch trắng bóng loáng. Tín hiệu phát ra từ chính cột trụ này, vốn được thiết kế đặc biệt để tránh cộng hưởng.\n\nChuyên viên khoa học [Root.GetLeaderName] đã tạm dừng công việc hiện tại để chuẩn bị cho một §Y Dự án Đặc biệt §!, nhằm giải mã thông tin mà tín hiệu này mang theo."
 anomaly.3110.a: "Một đề xuất hay."
 anomaly.3110.b: "Lời kẻ chết thì có gì đáng nghe."
 anomaly.3110.c: "Tháo dỡ cột trụ, tìm thiết bị phát sóng."
 anomaly.3111.name: "Tín hiệu vụt tắt"
 anomaly.3111.desc: "Chúng ta cứ ngỡ khối đá khổng lồ chỉ là lớp vỏ bảo vệ cho thiết bị phát sóng, nhưng sự thật không phải vậy.\n\nSau khi bị lấy ra, bản thân thiết bị phát sóng trở nên vô dụng. Khối đá bị phá hủy vốn có cấu trúc nội bộ giúp nó vận hành. Giờ đây chúng ta không thể khôi phục lại chức năng của nó nữa."
 anomaly.3111.a: "Thật đáng thất vọng."
 anomaly.3112.desc: "Thật bất ngờ, khối đá khổng lồ đã bị tháo rời một cách dễ dàng. Trái ngược với dự đoán ban đầu, thiết bị phát sóng nhỏ ở trung tâm cung cấp năng lượng cho cấu trúc khoáng vật của khối đá, giúp quá trình phát tín hiệu diễn ra."
 anomaly.3112.a: "Thật thú vị."
 anomaly.3112.b: "Đáng tiếc, chuyện này cũng chẳng có gì mới."
 anomaly.3113.name: "Tín hiệu đã được giải mã"
 anomaly.3113.desc: "Chuyên viên khoa học [From.GetLeaderName] báo cáo rằng tín hiệu từ [From.From.GetName] đã được giải mã hoàn toàn.\n\nĐây là một đoạn ghi chép lịch sử về một trận chiến từ ngàn năm trước đã cướp đi sinh mạng của hàng trăm người. Một liên minh kiên cường đã tan rã vì sự phản bội và lừa dối, hạm đội hùng hậu của họ đã tự tàn sát lẫn nhau trước cả khi kẻ thù ập tới.\n\nCó vẻ những mảnh vỡ này được giữ lại như những tấm bia mộ. Kẻ thù đã bắn trúng điểm yếu của thân tàu, tiêu diệt toàn bộ thủy thủ đoàn ngay tại thời điểm đó."
 anomaly.3113.a: "Nghiên cứu các ghi chép này." # dữ liệu xã hội trên hành tinh
 anomaly.3113.b: "Tính toán quỹ đạo và vị trí hiện tại của tàn tích hạm đội."
 anomaly.3114.name: "Hải tặc ẩn mình"
 anomaly.3114.desc: "Khi đến hệ sao [From.GetName], rõ ràng là [Root.GetName] đã chậm chân một bước.\n\nCách đây không lâu, một hạm đội hải tặc không rõ nguồn gốc đã phát hiện ra bãi chiến trường này và tháo dỡ nó để lấy vật liệu xây dựng căn cứ trên một tiểu hành tinh gần đó.\n\nCông việc nghiên cứu của chúng ta kết thúc tại đây, có vẻ một cuộc xung đột là không thể tránh khỏi."
 anomaly.3115.name: "Hạm đội trôi dạt"
 anomaly.3115.desc: "[Root.GetName] đã tìm thấy những mảnh vỡ trôi dạt trong hệ sao [From.GetName]. Nhiều con tàu được nhắc đến trong tin nhắn đã hóa thành cát bụi sau nhiều năm bị mài mòn, nhưng vẫn còn một số ít được bảo quản khá nguyên vẹn.\n\nTrong số đó có sáu con tàu mà các kỹ sư có thể tiến hành sửa chữa khẩn cấp.\n\nMở §Y Nhật ký Tình báo §! để xem chi tiết."
 anomaly.3115.a: "Thật sự thú vị."
 anomaly.3116.name: "Trưng dụng hạm đội"
 anomaly.3116.desc: "Một phần tàn tích của hạm đội cổ đại đã hoạt động trở lại, mặc dù các kỹ sư được cử đến không thể thống nhất về cách thức họ đã làm được điều đó.\n\nHạm đội này hiện đã được biên chế vào lực lượng của [Root.GetSpeciesAdj]."
 anomaly.3116.a.tooltip: "§Y Hạm đội Liên minh Cổ đại §! đã được sửa chữa."
 anomaly.3117.name: "Hạm đội khởi động"
 anomaly.3117.desc: "Các kỹ sư ban đầu dồn sức lực vào các chiến hạm Dreadnought khổng lồ. Theo dữ liệu ghi lại, đây là những con tàu đầu tiên khai hỏa tấn công các tàu khác trong trận chiến năm xưa.\n\nTuy nhiên, đó hóa ra là một sai lầm.\n\nMặc dù chúng ta đã cố tình né tránh các hệ thống cấp cao của con tàu, nhưng máy tính của nó vẫn đột ngột khởi động và tấn công tàu của ta bằng các xung cao tần. Do trước đó chúng ta đã tắt tường lửa chiến đấu để tăng băng thông hoạt động, các xung này đã lập tức chiếm quyền kiểm soát tất cả các tàu ta ở gần đó. Những bản nhật ký cuối cùng trước khi mất liên lạc cho thấy toàn bộ hệ thống duy trì sự sống đã hỏng, và con tàu được thiết lập để hướng thẳng tới [Root.Owner.Capital.GetName].\n\nDự đoán toàn bộ thủy thủ đoàn đã tử nạn. Máy tính chiến đấu cổ đại cũng đã nhắm vào hành tinh mẹ của chúng ta, chúng ta cần chuẩn bị cho tình huống xấu nhất."
 anomaly.3118.name: "Hạm đội bị hủy diệt"
 anomaly.3118.desc: "Chiến hạm Dreadnought bị tiêu diệt, các tàu còn lại đã kích hoạt, sự kiện kết thúc"
 anomaly.3119.name: "Hạm đội bị hủy diệt"
 anomaly.3119.desc: "Chiến hạm Dreadnought bị kẻ khác phá hủy, các tàu còn lại đều bị hủy"
 anomaly.3120.name: "Quét sạch hải tặc"
 anomaly.3120.desc: "Mối đe dọa đã được chấm dứt. Có lẽ chúng ta có thể tận dụng được một phần công nghệ cổ đại mà bọn hải tặc đã đánh cắp."
 anomaly.3120.a: "Nhưng những nghi vấn vẫn chưa được giải đáp..."
 anomaly.3120.b: "$anomaly.3120.a$"
 # có thể có một căn cứ hải tặc được xây dựng tại địa điểm này, chúng đã đến đó trước
 # Nhà máy sản xuất
 anomaly.3125.name: "Công xưởng cổ đại"
 anomaly.3125.desc: "Trạm quỹ đạo này dường như từng là trung tâm khai thác và chế biến khoáng sản từ tiểu hành tinh, thiết kế có phần tương đồng với các trạm khai thác của chúng ta.\n\nChuyên viên khoa học [Root.GetLeaderName] tin rằng nếu cử một vài kỹ sư — tốt nhất là những người [Root.Owner.GetSpeciesNamePlural] đang có mặt trên tàu — chúng ta có thể khiến nó hoạt động trở lại."
 anomaly.3125.a: "Chúng ta không quan tâm đến tàn tích của ngoại hành tinh."
 anomaly.3125.b: "Hãy tái thiết cảng vũ trụ này."
 anomaly.3125.c: "Tốt nhất là đừng chuốc thêm rắc rối."
 # Phản hồi mặc định
 anomaly.3126.name: "Công xưởng cổ đại: Trạm khai thác mới"
 anomaly.3126.desc: "Các kỹ sư đã hoàn thành nhiệm vụ, tân trang lại trạm khai thác cũ kỹ này bằng các linh kiện và cơ chế điều khiển đã được cải tiến của [Root.Owner.GetSpeciesAdj]."
 # Các hiệu ứng một lần khác nhau
 anomaly.3127.name: "Công xưởng cổ đại"
 anomaly.3127.desc.1: "$anomaly.3126.desc$\n\nCó vẻ như công xưởng này ban đầu được dùng để khai thác và tinh luyện đá Betharian — giờ đây nó đã được khôi phục như mới."
 anomaly.3127.desc.2: "$anomaly.3126.desc$\n\nChúng ta vẫn còn nhiều điều chưa biết về chức năng ban đầu của trạm không gian này. Có vẻ nơi đây từng dùng để khai thác và tinh luyện những tài nguyên khác, chứ không phải các loại khoáng sản mà chúng ta quan tâm. Những giả thuyết trên cần được điều tra thêm mới có thể xác nhận."
 anomaly.3127.desc.3: "$anomaly.3126.desc$\n\nChúng ta nhận được báo cáo về việc thu hồi được một loại vật chất chưa xác định từ phòng chế biến của công xưởng — có lẽ trạm khai thác này từng xử lý những loại khoáng vật mà chúng ta chưa từng thấy bao giờ."
 anomaly.3127.a.1: "Tuyệt vời."
 anomaly.3127.a.2: "Vẫn còn nhiều điều đáng để nghiên cứu."
 anomaly.3127.a.3: "Thú vị đấy..."
 # Drone xuất hiện
 anomaly.3128.name: "Công xưởng cổ đại: Drone khởi động"
 anomaly.3128.desc: "Chuyến thám hiểm của các kỹ sư [Root.Owner.GetSpeciesName] đã không thu được kết quả gì. Cảng vũ trụ này đã quá cũ nát để có thể khởi động lại, nhiều cấu trúc đã đổ sập ngay khi thử vận hành.\n\nNgay khi công xưởng sụp đổ, có thứ gì đó đã bò ra từ lòng đất — chúng dùng các tia laser năng lượng cao cắt đứt một lối đi và nhìn chằm chằm vào [Root.GetFleetName]."
 # Tinh thể xuất hiện
 anomaly.3129.name: "Công xưởng cổ đại: Động đến ổ kiến lửa cổ đại"
 anomaly.3129.desc: "Lớp đá cũ bị phá vỡ, và có thứ gì đó tuôn trào ra ngoài.\n\nHoàn toàn không phải là những khối quặng bóng loáng như mong đợi, mà là những tinh thể sắc nhọn hình răng cưa đã nghiền nát trạm quỹ đạo cũ kỹ, sau đó chuyển mục tiêu sang [Root.GetFleetName]."
 anomaly.3129.a.tooltip: "Công xưởng cổ đại bị hủy.\n\n[Root.GetFleetName] đang bị tấn công!"
 anomaly.3130.name: "Tranh luận và Thảo luận"
 anomaly.3130.desc: "Chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng trên [From.GetPlanetMoon] [From.GetName] thực sự từng tồn tại một nền văn minh khá phát triển, nhưng họ đã tự diệt vong trước khi kịp bay ra khỏi [From.GetPlanetMoon]. Thông qua việc phân tích những mảnh vỡ từ trạm liên lạc không dây cổ đại trên bề mặt hành tinh, thủy thủ đoàn [Root.GetName] đã dần phục dựng lại quá trình biến mất của cả một nền văn minh.\n\nTừ rất lâu trước đây, quan điểm của nền văn minh này đã bị chia rẽ thành hai phe, mà ngày nay chúng ta gọi là chủ nghĩa tập thể và chủ nghĩa cá nhân. Dù những tranh cãi triết học này không liên quan nhiều đến đời sống của người dân [Root.Owner.GetName], nhưng nền văn minh đó đã sụp đổ vì không biết nên áp dụng hình thái ý thức và tiêu chuẩn đạo đức nào."
 anomaly.3130.desc.colle: "Chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng trên [From.GetPlanetMoon] [From.GetName] thực sự từng tồn tại một nền văn minh phát triển, nhưng đã tự diệt vong trước khi kịp bay vào vũ trụ. Nhờ phân tích mảnh vỡ trạm liên lạc cổ đại, thủy thủ đoàn [Root.GetName] đã phục dựng lại sự lụi tàn này.\n\nTrong quá khứ, họ bị chia rẽ giữa chủ nghĩa tập thể và chủ nghĩa cá nhân. Mặc dù bản chất của chủ nghĩa tập thể là điều hiển nhiên với người dân [Root.Owner.GetName], nhưng nền văn minh này đã tan rã vì không thống nhất được quan điểm và tiêu chuẩn tâm lý."
 anomaly.3130.desc.mater: "Chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng trên [From.GetPlanetMoon] [From.GetName] từng có văn minh phát triển nhưng đã tự diệt vong. Qua phân tích mảnh vỡ trạm liên lạc, thủy thủ đoàn [Root.GetName] đã tái hiện lại quá trình này.\n\nHọ từng chia rẽ giữa chủ nghĩa tập thể và chủ nghĩa cá nhân. Dù bản chất chủ nghĩa cá nhân là điều quá rõ ràng với người dân [Root.Owner.GetName], nhưng họ đã sụp đổ vì không biết nên chọn lối sống và tiêu chuẩn tâm lý nào."
 anomaly.3130.a: "Thật là tồi tệ."
 anomaly.3130.b: "Đây thậm chí còn chẳng phải là những tư tưởng thực sự..."
 anomaly.3135.name: "Giữ bình tĩnh"
 anomaly.3135.desc: "Trở về từ hành tinh hoang vu [From.GetName], chuyên viên khoa học [Root.GetLeaderName] đã mang theo một tấm vải dệt từ sợi thực vật. Dù không rõ nguồn gốc và công dụng, nhưng thực nghiệm cho thấy vật này thấm hút nước cực tốt. Dù nó chẳng giúp ích gì cho nghiên cứu, nhưng [Root.GetLeaderName] lại cực kỳ yêu thích nó, đi đâu cũng mang theo bên mình.\n\n' [Root.GetLeaderName] đúng là một người kỳ quặc.' Các thủy thủ đoàn xì xào bàn tán."
 anomaly.3135.a: "Thế nghĩa là sao?"
 anomaly.3135.a.tooltip: "[Root.GetLeaderName] đã có được một chiếc khăn tắm."
 ####################################
 # Sự kiện quốc gia
 ####################################
 # Thấy sao chổi
 country.999.name: "Bắt gặp sao chổi"
 country.999.desc: "Người [Root.GetSpeciesNamePlural] vốn dĩ rất hiếu kỳ, và việc một ngôi sao chổi băng ngang qua bầu trời [Root.Capital.GetName] đã khơi dậy sự kinh ngạc trong lòng dân chúng.\n\nHọ tin chắc rằng đây là điềm báo cho một sự kiện trọng đại sắp tới."
 country.999.a: "Đây là một điềm lành."
 country.999.desc.pac: "Người [Root.GetSpeciesNamePlural] vốn rất hiếu kỳ, sao chổi trên bầu trời [Root.Capital.GetName] đã gợi lên sự khiêm nhường trong dân chúng.\n\nHọ tha thiết hy vọng một phép màu như vậy sẽ khiến mọi sinh vật trong thiên hà đoàn kết làm một vào một ngày nào đó."
 country.999.a.pac: "Đây là một điềm lành."
 country.999.desc.mil: "Một ngôi sao chổi lướt qua tầng thượng lưu khí quyển, đuôi lửa rực cháy thiêu đốt bầu trời của [Root.Capital.GetName]. Quỹ đạo thiên thể đầy sức mạnh của nó đã để lại ấn tượng sâu sắc cho người dân thủ đô.\n\nHọ dùng hành trình không thể cản phá này để ví von cho sự tất yếu rằng [Root.GetName] cuối cùng sẽ bước lên đỉnh cao bá chủ của thiên hà."
 country.999.a.mil: "Nguyện chiến thắng luôn ở bên ta."
 country.999.desc.spirit: "Một luồng sáng vắt ngang bầu trời đêm của [Root.Capital.GetName], đường cong mềm mại của nó tương phản hoàn toàn với những ngôi sao đang chuyển động chậm chạp.\n\nCư dân [Root.Capital.GetName] coi đó là minh chứng cho sự công nhận của bề trên, cũng là một lời chúc phúc thầm lặng cho sự nghiệp của chúng ta."
 country.999.a.spirit: "Đúng là như vậy."
 country.999.desc.material: "Gần đây, hệ sao [Root.Capital.GetStarName] phát hiện một thiên thể nhỏ có đuôi bằng khí và bụi.\n\nSự xuất hiện của nó chẳng có gì đặc biệt."
 country.999.a.material: "Đã rõ."
 country.999.desc.phile: "Một ngôi sao chổi với chiếc đuôi rực sáng băng qua đường chân trời của [Root.Capital.GetName], như một sứ giả đến từ những vì sao xa xôi. Người dân [Root.GetSpeciesName] vô cùng phấn khích, tin rằng nó thầm báo hiệu rằng chúng ta không hề đơn độc trong vũ trụ.\n\nHọ ủng hộ tham vọng của [Root.GetName] hơn bao giờ hết, sẵn sàng dang rộng vòng tay đón chào cả thiên hà."
 country.999.a.phile: "Thật là một tin tốt lành."
 country.999.desc.phobe: "Một ngôi sao chổi đáng sợ lảng vảng trên bầu trời [Root.Capital.GetName]. Vệt sáng lâu tan đó như một lời nhắc nhở tàn khốc với người [Root.GetSpeciesName] rằng chúng ta khó lòng sống yên ổn. Trong vũ trụ bao la, những thứ đáng sợ chưa biết có lẽ đang cận kề hơn chúng ta tưởng.\n\nChúng ta nên coi đó là một tín hiệu và giữ thái độ cảnh giác cao độ với các sinh vật ngoại hành tinh."
 country.999.a.phobe: "Đây là một điềm gở."
 country.999.desc.coll: "Nhiều nhóm người [Root.GetSpeciesNamePlural] đã quan sát thấy một ngôi sao chổi vụt qua bầu trời [Root.Capital.GetName]. Thiên thể cô độc và bé nhỏ này lại khiến nhiều người cảm thấy bất an sâu sắc. Những người [Root.GetSpeciesName] tìm đến nhau để xác nhận mình không đơn độc nhằm tìm kiếm sự an ủi.\n\nHọ tin rằng, đây là điềm báo cho việc xã hội [Root.GetSpeciesAdj] sẽ phải đối mặt với số phận bị cô lập và ly tán."
 country.999.a.coll: "Thật đáng báo động."
 country.999.desc.ind: "Một ngôi sao chổi kiêu hãnh lướt đi trong hệ sao [Root.Capital.GetStarName], có thể nhìn thấy rõ từ [Root.Capital.GetName]. Nó băng qua vũ trụ, tràn đầy sức sống và không gì ngăn cản được.\n\nĐó chính là lý tưởng mà mỗi người [Root.GetSpeciesNamePlural] đều muốn phấn đấu."
 country.999.a.ind: "Đây là một điềm lành."
 country.999.desc.mach: "Các đơn vị [Root.GetSpeciesNamePlural] trên [Root.Capital.GetName] báo cáo đã quan sát thấy một thiên thể nhỏ bằng băng đang bốc hơi trong hệ sao, tại tọa độ xích vĩ 10.3 độ và xích kinh 2 giờ 54 phút 8 giây.\n\nĐo đạc cho thấy khoảng cách từ thiên thể này đến hằng tinh là khoảng 3.75 đơn vị thiên văn, kích thước và độ sáng của đuôi sao chổi rất đáng chú ý. Kích thước thiên thể được tính toán vào khoảng 5x10x6 km khối. Sự kiện quan sát kết thúc bình thường, không có bất thường nào xảy ra."
 country.999.a.mach: "Đã nhận."
 country.999.desc.belief: "Hệ sao [Root.Capital.GetStarName] gần đây phát hiện một ngôi sao chổi.\nCó thể nhìn thấy rõ từ bề mặt §H [Root.Capital.GetName] §!, thiên thể này đã gây ra những phản ứng mạnh mẽ trong lòng quần chúng.\n\nHầu như không ai có thể phủ nhận rằng, việc một thiên thể xuất hiện trong vòng lặp §H [GetCycleName] §! rõ ràng là do [GetCycleAttitude]."
 ####################################
 # Sự kiện khởi đầu
 ####################################
 # Nhà khoa học phản bội
 country.1000.name: "Lãng khách giữa tinh không"
 country.1000.desc: "Trưởng quan khoa học của bộ phận nghiên cứu [Root.GetName] đã mất tích.\n\nChiếc tàu thám hiểm khoa học thử nghiệm được tài trợ riêng của họ cũng không còn ở đó nữa.\n\nGiới khoa học [Root.Capital.GetName] đang xôn xao náo loạn."
 country.1000.a: "Thật kỳ lạ."
 country.1001.name: "Lãng khách giữa tinh không: Đã có mưu tính"
 country.1001.desc: "Trưởng quan khoa học — chính xác là cựu trưởng quan — vẫn chưa được tìm thấy. Tuy nhiên, một vài tin tức về con tàu thử nghiệm cũng như các nghiên cứu riêng tư của ông ta đã đến tai chúng ta. Dù có vài tin đồn khá phi lý, nhưng rõ ràng việc tìm lại ông ta càng sớm càng tốt sẽ có lợi cho [Root.GetName].\n\nNhật ký Tình báo đã được cập nhật."
 country.1001.a: "Tốt lắm."
 country.1001.a.tooltip: "Bắt đầu chuỗi sự kiện 'Lãng khách giữa tinh không: Nhà khoa học phản loạn'"
 country.1003.name: "Lãng khách giữa tinh không: Ngõ cụt"
 country.1003.desc: "Trưởng quan khoa học không có mặt trong hệ sao này.\n\nChuyến đi này hoặc là hoàn toàn tốn công vô ích, hoặc là manh mối đã bị đứt đoạn từ lâu."
 country.1003.a: "Tiếp tục tìm kiếm."
 country.1005.name: "Lãng khách giữa tinh không: Thoáng qua"
 country.1005.desc: "Con tàu của nhà khoa học đang ở trong hệ sao này — nếu chúng ta không nhầm.\n\nChúng ta không thể định vị họ qua cảm biến, nhưng họ đã chủ động gọi cho chúng ta. Hãy nối máy tín hiệu của họ về [Root.Capital.GetName]."
 country.1005.a: "Mở hệ thống liên lạc."
 country.1010.name: "Trưởng quan khoa học" # đối thoại với nhà khoa học
 country.1010.desc: "[Root.GetRulerTitle], tôi xin gửi tới ngài lời chào chân thành nhất.\n\nTôi đoán ngài không chỉ đơn thuần đến đây để hàn huyên đâu nhỉ?"
 country.1010.a: "Thế này là có ý gì?"
 country.1010.a.response: "Ngài chắc là muốn hỏi về việc tôi biến mất khỏi [Root.GetName].\n\nTôi chỉ rời đi một lát thôi, chỉ thế thôi. Tôi đang tìm kiếm Cánh cửa Thực tại. Nhưng rõ ràng là tôi vẫn chưa tìm thấy.\n\nNó cũng không ở đây. Tôi phải tiếp tục nghiên cứu của mình rồi. Nhưng tôi sẽ không mang theo những chiếc drone tìm thấy này đâu."
 country.1010.b: "Chúng tôi có thể cử tàu hộ tống ông về nhà."
 country.1010.b.response: "Hiện tại tôi không muốn về nhà.\n\nNhưng để thể hiện thành ý, hãy nhận lấy những chiếc drone này như một món quà tôi gửi tặng cho [Root.GetName]. Tôi tìm thấy chúng ở rìa hệ sao này. Sau khi sửa chữa xong, tôi mới nhận ra chúng hoàn toàn không phù hợp để dùng làm thiết bị thăm dò nghiên cứu."
 country.1010.c: "Ông phải lập tức trở về thủ đô."
 country.1010.c.response: "Xin lỗi, nghiên cứu của tôi chỉ mới bắt đầu. Sứ mệnh đang vẫy gọi, tất cả là vì khoa học.\n\nNhưng để thể hiện thành ý, hãy nhận những chiếc drone này làm quà tặng cho [Root.GetName]. Tôi tìm thấy chúng ở vùng ngoại vi hệ sao này. Sau khi đại tu, tôi thấy chúng không thích hợp để nghiên cứu thám hiểm chút nào."
 country.1010.d: "Cuộc đối thoại kết thúc."
 country.1015.name: "Lãng khách giữa tinh không: Drone"
 country.1015.desc: "Trưởng quan khoa học lại biến mất một cách bí ẩn lần nữa.\n\nTuy nhiên, họ thực sự đã để lại một vài chiếc drone. Những chiếc drone này được trang bị vũ khí và đang khởi động!"
 country.1020.name: "Lãng khách giữa tinh không: Drone hư hại"
 country.1020.desc: "Các mô-đun hệ thống nhận diện địch ta của những chiếc drone này đã bị tháo bỏ, chắc là do trưởng quan làm. Tuy nhiên bộ vi xử lý đánh giá mối đe dọa của chúng vẫn còn nguyên vẹn. Do hành động phá hoại của người này, cấp độ đe dọa đã tăng lên đôi chút.\n\nTrưởng quan khoa học có vẻ không muốn chúng tấn công ta, nhưng chúng đã yểm hộ rất tốt để ông ta trốn thoát thành công.\n\nXem §Y Dự án Đặc biệt §! trong Nhật ký Tình báo để biết vị trí cuối cùng mà trưởng quan xuất hiện."
 country.1022.name: "Lãng khách giữa tinh không: Drone bị bắn hạ"
 country.1022.desc: "Những chiếc drone mà nhà khoa học để lại dường như đã bị ai đó hoặc thứ gì đó bắn hạ.\n\nChúng ta nên tận dụng cơ hội này để tìm kiếm manh mối về trưởng quan.\n\nMột §Y Dự án Đặc biệt §! đã được thêm vào Nhật ký Tình báo."
 country.1025.name: "Lãng khách giữa tinh không: Hoàn thành dự án đặc biệt"
 country.1025.desc: "Chúng ta đã giải mã được thông tin năng lượng trên tàu khoa học mà trưởng quan để lại, có thể tiếp tục truy vết ông ta.\n\nXem Nhật ký Tình báo để biết thêm chi tiết."
 country.1030.name: "Lãng khách giữa tinh không: Gặp rắc rối rồi"
 country.1030.desc: "Con tàu khoa học của trưởng quan thoắt ẩn thoắt hiện, rất khó để dò tìm, nhưng đó chưa phải là điều khó nhất.\n\nDữ liệu trên cảm biến cho thấy những con số khó hiểu, hình ảnh hiển thị cho thấy hai bên tàu của trưởng quan là hai chiếc hộ vệ hạm đang hằm hằm sát khí.\n\nTrưởng quan vật lý học đang gửi lời chào tới chúng ta."
 country.1035.name: "Trưởng quan khoa học" # đối thoại với nhà khoa học
 country.1035.desc: "Xin chào [Root.GetRulerTitle].\n\nCho phép tôi gửi lời chào nồng nhiệt tới hạm đội của [Root.GetSpeciesName]. E rằng sự xuất hiện đột ngột của tôi đã làm phật lòng các sinh vật ngoại hành tinh trong hệ sao này, giờ đây tàu của họ đang bao vây lấy tôi.\n\nNếu ngài có thể giúp tôi bù đắp cho sự thất lễ này thì thật tốt quá. Sau khi giải quyết xong, tôi sẽ rất vui lòng chia sẻ những trải nghiệm thám hiểm của mình với các bạn."
 country.1035.a: "Tại sao ông lại bỏ chạy?"
 country.1035.a.response: "Chạy ư? Tôi chỉ là rời đi thôi.\n\n[Root.GetRulerTitle], tôi biết các người không thích hành động của tôi cho lắm. Nhưng tôi không thể để những cuộc đấu đá phe phái không hồi kết trong giới khoa học [Root.GetSpeciesName] làm hại đến nghiên cứu của mình.\n\nHơn nữa, một vài nghiên cứu cũng cần phải khảo sát thực địa. Luôn là như vậy."
 country.1035.b: "Trước tiên hãy kể cho chúng tôi về Cánh cửa Thực tại."
 country.1035.b.response: "Vào thời điểm này, tôi không tiện kể chi tiết. Tôi không muốn, ừm, làm mình trông giống như một gã ngốc. Ngộ nhỡ cuối cùng chứng minh là tôi sai thì sao?\n\nNhưng biết đâu cuối cùng tất cả chúng ta đều biến thành những hình ảnh trình chiếu không gian ba chiều. Liệu chuyện đó có đáng không?"
 country.1035.c: "Chúng tôi sẽ giúp ông giải quyết tình hình."
 country.1040.name: "Hải tặc Thái Dương" # đối thoại với hải tặc
 country.1040.desc: "Cút đi! Chúng ta là những người tìm thấy con tàu ma nát bét này trước.\n\nAi thấy trước là của người đó, chứ không phải ai lên tàu trước là của người đó. Nó là của chúng ta, không phải của các ngươi. Hơn nữa thuyền trưởng của nó cũng chết rồi."
 country.1040.a: "Đám rác rưởi ngoại bang, dám gây hấn với chúng ta, các ngươi sớm muộn gì cũng phải hối hận." # cực đoan bài ngoại
 country.1040.a.response: "Đúng là đồ xấu xí còn hay làm trò. Lũ man di, đây không phải lần đầu chúng ta đối đầu đâu."
 country.1040.b: "Dùng 150 năng lượng để đổi lấy con tàu." # hòa bình hoặc thông thường, trả tiền chuộc
 country.1040.c: "Chuẩn bị vũ khí." # đánh chúng
 country.1040.d: "Giờ mà cút đi thì còn giữ được mạng." # đe dọa suông?
 country.1040.d.response: "Hư trương thanh thế! Đồ mặt thớt, đây không phải lãnh địa của ngươi.\nNhững vì sao này thuộc về Hải tặc Thái Dương."
 country.1041.name: "Hải tặc Thái Dương"
 country.1041.desc: "150 năng lượng? Cái giá này chắc còn chưa bằng mớ tiền lẻ của lũ heo nhà, thật xảo quyệt. Nhưng mà...\n\nHaiz, con tàu ma chết tiệt này mang lại rắc rối còn nhiều hơn lợi lộc.\n\nAnh em! Chúng ta đi!"
 country.1041.a: "Hãy cầu nguyện đừng bao giờ gặp lại chúng ta nữa, lũ thảm hại."
 country.1041.b: "Mọi thứ đều là phù du, vật chất lại càng như thế."
 country.1041.c: "Tiền là vạn năng. Nếu không làm được, nghĩa là ngươi chưa có đủ tiền."
 country.1041.d: "Mời rời đi."
 country.1042.name: "Hải tặc Thái Dương"
 country.1042.desc: "Những kẻ ngốc này cần được dạy dỗ một bài học.\n\nAnh em! Cầm vũ khí lên!"
 country.1042.a: "Các ngươi sẽ thấy được sự lợi hại của quân đoàn [Root.GetSpeciesNamePlural]."
 country.1044.name: "Trưởng quan khoa học"
 country.1044.desc: "Tôi không nhịn được mà nghe thấy vài mẩu đối thoại — dù sao thì họ cũng phát sóng trên băng tần mở mà.\n\nTôi nghĩ cuộc giao dịch diễn ra khá suôn sẻ."
 country.1045.name: "Trưởng quan khoa học" # đối thoại, tình huống đã giải quyết
 country.1045.desc: "[Root.GetRulerTitle], tôi thấy ngài đã dọn sạch đám hải tặc đó chỉ trong nháy mắt.\n\nLà một nhà khoa học, tôi ghét tranh đấu... nhưng tôi cũng hiểu rõ trong tình huống đó, đây là điều cần thiết. Nếu tôi rơi vào tay đám hải tặc đó, chắc hẳn đãi ngộ sẽ chẳng ra sao."
 country.1045.a: "Đúng là vậy. Giờ có gì thì nói nhanh đi."
 country.1045.a.response: "Ồ, được thôi.\n\nChuyện là... tôi sẽ không làm phiền ngài bằng những chi tiết rườm rà nữa, [Root.GetRulerTitle], nhưng có một quan niệm rằng, mọi thứ đều là hư ảo. Hay nói cách khác, thực tại mà chúng ta nhận thức thực ra không phải vậy, ít nhất không hoàn toàn là vậy, thậm chí còn gần với hư vô hơn những thứ khác. Điều đó có nghĩa là, tất cả những thứ này — bao gồm cả tôi, cả ngài [Root.GetRulerTitle], và cả những quy luật vũ trụ mà chúng ta cho là bất biến — chẳng qua chỉ là những trò đùa của ánh sáng. Vũ trụ này chẳng qua chỉ là hoa trong gương, trăng dưới nước, là hình phản chiếu, hay là một ảnh trình chiếu không gian, một lăng kính. Sau cùng cũng chỉ là những tia sáng mê hoặc tán sắc từ thực tại chân chính mà thôi.\n\nHiểu chưa? Những luồng sáng này chắc chắn phải đến từ một nơi nào đó. Từ Cánh cửa Thực tại."
 country.1045.b: "Ông phải lập tức trở về [Root.Capital.GetName]."
 country.1046.name: "Trưởng quan khoa học" # đối thoại tiếp nối, nhận vật lý
 country.1046.desc: "[Root.GetRulerTitle], ngài hiểu rõ là tôi sẽ không quay về mà.\n\nThực tế, tôi cũng đã cân nhắc những khả năng khác. Tôi nghĩ trong thời gian ngắn tôi khó lòng quay về được.\n\nTất cả dữ liệu nghiên cứu trong tay tôi, chỉ cần tôi thấy hữu ích cho người dân [Root.GetSpeciesName], tôi sẽ tải lên cơ sở dữ liệu của [Root.Capital.GetName]. Nhưng những dữ liệu liên quan đến Cánh cửa Thực tại tôi sẽ tự giữ lại. Hiện tại tôi thấy mình vẫn chưa chuẩn bị sẵn sàng. Nhưng rõ ràng, chẳng ai chuẩn bị sẵn sàng cả.\n\nTôi phải đi đây."
 country.1046.a: "Đợi đã——"
 country.1047.name: "Lãng khách giữa tinh không: Kẻ mù"
 country.1047.desc: "Kiểm tra sơ bộ, trưởng quan thực sự đã nói là làm. Nghiên cứu vật lý của [Root.GetName] đã được tăng cường nhẹ.\n\nNhà khoa học lại biến mất một lần nữa, nhưng lần này, hành tung của người này đã bị chúng ta phát hiện trước khi rời khỏi hệ sao.\n\nNếu họ muốn đi tìm Cánh cửa Thực tại này, thì chúng ta cũng sẽ đi.\nXem Nhật ký Tình báo để biết thêm chi tiết."
 country.1050.name: "Lãng khách giữa tinh không: Mở ra Cánh cửa Thực tại" # kết thúc
 country.1050.desc: "Tàu khoa học thử nghiệm lần đầu tiên xuất hiện rõ ràng trên cảm biến của chúng ta. Nó đang quay quanh hằng tinh của hệ sao này ở khoảng cách cực gần, tuy nhiên những nơi khác không có gì đặc biệt.\n\nChỉ cần quét quang học đơn giản, bí mật của con tàu này đã bị lộ hoàn toàn. Thiết kế thân tàu rất bình thường, không có gì độc đáo. Trên đó có nhiều lưới kim loại hình chữ thập, trông giống như nam châm điện dưới sự điều khiển của điện áp xoay chiều. Chỉ cần đủ gần hằng tinh, con tàu có thể bẻ cong nhẹ các tia xạ phát ra từ hằng tinh, quấn chúng quanh thân tàu để ngụy trang cho chính mình.\n\nCông nghệ này về lý thuyết nghe có vẻ hay, nhưng ứng dụng thực tế lại có những vấn đề rõ rệt. Do tiếp xúc với bức xạ hằng tinh quá lâu, toàn bộ thiết bị của nó đã bị nướng chín và trở nên vô dụng."
 country.1051.name: "Trưởng quan khoa học" # bắt đầu đối thoại cuối
 country.1051.desc: "Chào ngài, [Root.GetRulerTitle].\n\nTôi có đầy đủ lý do để tin rằng các người sẽ tiếp tục bám theo chúng tôi.\n\nVì vậy tôi đã thực hiện một vài biện pháp."
 country.1051.a: "Trưởng quan khoa học, ông muốn làm gì?"
 country.1051.a.response: "Tôi nghĩ mình đã tìm thấy Cánh cửa Thực tại rồi. Ít nhất là một Cánh cửa Thực tại. Có thể còn nhiều hơn nữa. Biết đâu bản thể thực sự của chúng ta đang ở đó. Biết đâu bản thể thực sự của mọi thứ đều ở đó. Phải thừa nhận là, trong đầu tôi chẳng có một khái niệm cụ thể nào cả. Tôi biết những kiến thức mình đạt được này cũng chẳng giúp ích gì được cho ai. Nhưng nếu tôi dừng lại ở đây, thì thật là thiếu trách nhiệm."
 country.1051.b: "Ông định làm thế nào?"
 country.1051.b.response: "Tôi sẽ thử xuyên qua Cánh cửa Thực tại để tiến tới Thực tại chân chính. Rõ ràng, ánh sáng từ thực tại không chỉ đơn thuần đi qua đây. Toàn bộ vũ trụ giống như một tấm kính lớn, chúng ta chỉ là một mẩu méo mó, một vết xước nhỏ trong đó mà thôi. Sự sống của chúng ta bắt nguồn từ thứ ánh sáng huy hoàng phía trên chúng ta.\n\nĐó chính là Cánh cửa Thực tại, tôi tin rằng nó sẽ mở ra."
 country.1051.c: "Hành động của ông vừa lỗ mãng vừa nguy hiểm."
 country.1052.name: "Trưởng quan khoa học" # giai đoạn hai
 country.1052.desc: "Hành động của tôi đã gây ra nhiều rắc rối, tôi vô cùng xin lỗi về điều đó, [Root.GetRulerTitle]. Nhưng, tôi không nợ [Root.GetName] bất cứ thứ gì, đối với họ tôi đã nhân chí nghĩa tận. Giờ tôi phải hoàn thành sứ mệnh của mình. Ngài đã dùng nghị lực phi thường để theo đến tận đây, tôi rất cảm kích trước sự giúp đỡ của ngài, nhưng ngay từ đầu tôi đã hạ quyết tâm, sẽ không thay đổi ý định."
 country.1052.a: "Chúng ta có thể coi như chưa có chuyện gì xảy ra, hãy cùng chúng tôi về nhà đi."
 country.1052.b: "Ông phải bị đưa ra xét xử."
 country.1053.name: "Trưởng quan khoa học"
 country.1053.desc: "[Root.GetRulerTitle], cánh cửa đã mở.\n\nTạm biệt."
 country.1053.a: "Trưởng quan khoa học?"
 country.1055.name: "Lãng khách giữa tinh không: Cửa đã đóng"
 country.1055.desc: "Tàu khoa học hoàn toàn trống rỗng.\n\nTất cả quần áo dùng cho hoạt động ngoài không gian đều được đặt ngăn nắp tại chỗ cũ. Nhật ký tàu cho thấy cửa khoang áp suất chưa bao giờ mở ra ngoài.\n\nCon tàu vẫn đang quay quanh hằng tinh, nhưng hiện tại đã nằm dưới quyền kiểm soát của [Root.Owner.GetSpeciesAdj]."
 country.1055.a: "Thật là đáng sợ."
 country.1055.a.tooltip: "Chúng ta đã thu hồi được tàu khoa học, các chức năng cơ bản của tàu vẫn có thể sử dụng bình thường."
 country.1061.name: "Lãng khách giữa tinh không: Hải tặc đã bị tiêu diệt"
 country.1061.desc: "Đám Hải tặc Thái Dương đe dọa trưởng quan khoa học đã bị tiêu diệt, nhưng không phải do tay chúng ta làm.\n\nTrưởng quan đang gửi lời chào tới chúng ta."
 ### Chuỗi sự kiện khởi đầu Đại tuyệt chủng
 country.1100.name: "Đại tuyệt chủng"
 country.1100.desc: "Bước chân đầu tiên của chúng ta vào hư không phía trên §Y [Root.Capital.GetName] §! không chỉ đơn thuần bị thúc đẩy bởi sự tò mò hay khao khát chinh phục, mà còn là một hành động tất yếu.\n\nSinh quyển của §Y [Root.Capital.GetName] §! đã trải qua những thay đổi dữ dội. Các nhà khoa học cảnh báo rằng một cuộc đại tuyệt chủng rất có thể sẽ xảy ra, sự diệt vong mang tính chu kỳ này là quy luật tự nhiên của các sinh vật hành tinh trong vũ trụ này.\n\nChúng ta đã thiết lập một dự án nghiên cứu nhắm vào vài hành tinh không còn khả năng duy trì sự sống do các thảm họa thiên văn lớn. Thông qua việc phục dựng các thảm họa này, chúng ta kỳ vọng có thể giúp §Y [Root.Capital.GetName] §! và chủng tộc §Y [Root.GetSpeciesName] §! tránh đi vào vết xe đổ."
 country.1100.a: "Vì tương lai của [Root.GetSpeciesAdj]."
 country.1100.owned: "Mục tiêu nằm trong lãnh thổ nước khác. Hãy tìm mục tiêu khác."
 country.1105.name: "Đại tuyệt chủng: Hành tinh sụp đổ"
 country.1105.desc: "Các nhà thiên văn học của chúng ta tin chắc rằng, vành đai tiểu hành tinh của hệ sao này từng là một hành tinh có thể sinh sống được, nhưng đã bị một thế lực chưa xác định đánh nát.\n\nĐã khởi động §Y Dự án Đặc biệt §! để nghiên cứu sâu hơn về các thiên thể chính trong vành đai tiểu hành tinh."
 country.1110.name: "Đại tuyệt chủng: Hành tinh cháy sạm"
 country.1110.desc: "Trong số các hành tinh quay quanh hằng tinh này, có một hành tinh còn in hằn dấu vết rõ rệt của thảm họa. Bề mặt hành tinh được bao phủ bởi các đại dương khoáng sản nửa tan chảy, bầu khí quyển cực kỳ nóng bức. Tuy nhiên, các nhà thiên văn học [Root.GetSpeciesAdj] khẳng định nơi đây có thể từng xuất hiện sự sống.\n\nĐã khởi động §Y Dự án Đặc biệt §! để nghiên cứu sâu hơn về hành tinh rực lửa này."
 country.1115.name: "Đại tuyệt chủng: Hành tinh hoang vu"
 country.1115.desc: "Trong hệ sao này, có một hành tinh vẫn còn lưu giữ rõ rệt các dấu vết hóa thạch của sinh quyển trước đây. Thứ gì đã biến một sinh quyển đang hưng thịnh trở thành một vùng đất khô cằn không một bóng cây?\n\nĐã khởi động §Y Dự án Đặc biệt §! để nghiên cứu nguyên nhân của sự chuyển biến thảm khốc này."
 country.1120.name: "Đại tuyệt chủng: Hành tinh độc hại"
 country.1120.desc: "Được biết, các động thực vật trên hành tinh này sẽ giải phóng khí độc khiến các loài khác ngạt thở, có lẽ đây là do các khí hoạt tính liên tục trào ra từ dưới lớp vỏ hành tinh gây nên.\n\nĐã khởi động §Y Dự án Đặc biệt §! để nghiên cứu hiện tượng này."
 country.1125.name: "Đại tuyệt chủng: Hành tinh lạnh giá"
 country.1125.desc: "Trong hệ sao này có một hành tinh kỳ lạ, bề mặt hành tinh bị bao phủ bởi lớp này đến lớp khác các loại băng có thành phần khác nhau. Có thể suy đoán rằng, hành tinh này từng có các quần xã sinh vật đa dạng.\n\nĐã khởi động §Y Dự án Đặc biệt §! để điều tra khả năng này."
 country.1130.name: "Đại tuyệt chủng: Tiểu hành tinh"
 country.1130.desc: "Hành tinh nhỏ này thực chất từng là một phần của một hành tinh có thể sinh sống được — thậm chí có thể từng có người cư ngụ. Hình thái nứt vỡ của nó có quy luật nhưng lại chồng chéo lên nhau, có thể thấy sự hủy diệt của hành tinh này đã được thiết kế sẵn, mặc dù khi thực hiện có thể hơi vội vàng.\n\nTất cả các dấu hiệu đều chỉ ra rằng, hành tinh này từng là hành tinh mẹ của một loài nào đó, nhưng loài đó cuối cùng lại tự tay hủy diệt nó. Chúng ta có lẽ sẽ không bao giờ biết được điều gì đã thúc đẩy chúng thực hiện hành vi hủy diệt hành tinh này, nhưng có lẽ chúng ta nên cảm thấy may mắn vì điều đó."
 country.1135.name: "Đại tuyệt chủng: Tan chảy"
 country.1135.desc: "Số phận bi thảm của hành tinh này có thể quy kết cho sự biến ảo khôn lường của vũ trụ.\n\nCác nhà khoa học của chúng ta cho rằng, một sự nhiễu loạn trọng lực do sự bất thường của không thời gian trong ngắn hạn gây ra đã ép hành tinh này vào quỹ đạo quá gần hằng tinh. Mặc dù nó đang chậm chạp chuyển động xoáy ốc về quỹ đạo ban đầu của mình, nhưng vẫn liên tục phải chịu sự nung nấu từ nhiệt lượng dư thừa của hằng tinh."
 country.1140.name: "Đại tuyệt chủng: Hoang vu"
 country.1140.desc: "Đối với những sự sống từng tồn tại trên hành tinh hoang vu này, số phận của chúng ngay từ đầu đã được định đoạt.\n\nLoài chủ đạo thậm chí còn chưa kịp tiến hóa ra trí thông minh hay phát minh ra nông nghiệp thì các cơ chế địa lý đã khiến đất đai bị chua hóa trầm trọng.\n\nCác mẫu vật chiết xuất từ lớp đất dưới sâu và các di hài hóa thạch cho thấy, các khoáng chất cực kỳ quan trọng cho việc tái tạo đất đã bị bộ xương nội sinh của sinh vật địa phương tiêu thụ sạch sành sanh.\n\nXương của chúng sẽ hoàn toàn hóa thạch chứ không phân hủy, sự tồn tại của chúng thôi đã làm cạn kiệt hệ sinh thái mỏng manh, khiến nó xảy ra sự chuyển biến vĩnh viễn."
 country.1145.name: "Đại tuyệt chủng: Độc hại"
 country.1145.desc: "Chúng ta từng lầm tưởng rằng những khe rãnh chằng chịt trên lớp vỏ hành tinh là do các hoạt động địa chất nhào nặn nên, tuy nhiên chúng thực chất lại là những vết sẹo vĩnh cửu để lại bởi những bộ rễ khổng lồ đâm sâu vào lòng đất.\n\nTại một thời điểm nào đó trong quá khứ, một sự đột biến có thể do loài có trí tuệ gây ra đã khiến thực vật địa phương bắt đầu mọc điên cuồng mất kiểm soát. Với sự trợ giúp của các luồng khí quyển tầng thấp, nhiều loại thực vật như vậy đã dùng phấn hoa để sinh sôi nảy nở.\n\nẢnh hưởng này lúc đầu có vẻ nhẹ nhàng, nhưng càng về sau càng dữ dội, các hạt bụi ngày càng dày đặc trong tầng khí quyển cuối cùng đã khiến tất cả động vật trên hành tinh sặc chết trong vòng vài tháng."
 country.1150.name: "Đại tuyệt chủng: Băng phong"
 country.1150.desc: "Một sự thay đổi bất thường trong thành phần khí quyển đã khiến hành tinh này từ từ bước vào thời kỳ băng hà, quá trình này bắt đầu từ trước khi [Root.Owner.GetName] hình thành và có thể vẫn sẽ tiếp diễn ngay cả khi chúng ta không còn nữa.\n\nNguyên nhân chính xác gây ra sự thay đổi khí quyển vẫn chưa rõ ràng, nhưng tồn tại vài giả thuyết, ví dụ như cải tạo môi trường thất bại hoặc các hoạt động khủng bối nội bộ hành tinh vân vân. Một số phần tử cấp tiến trong cộng đồng khoa học [Root.Owner.Capital.GetName] thậm chí cho rằng, sự biến đổi khí hậu cấp tập này có thể là do xả thải khí thải công nghiệp tràn lan gây ra.\n\nChỉ có số ít nhà khoa học tán thành quan điểm này. Suy cho cùng, nếu một chủng tộc có khả năng thực hiện công nghiệp hóa hoàn toàn, thì sao có thể ngốc đến mức vô tình tự hủy diệt chính mình chứ?"
 country.1150.desc.industrialist: "Sự biến đổi đột ngột phi tự nhiên trong thành phần hóa học của tầng khí quyển đã khiến hành tinh này bước vào kỷ băng hà một cách chậm chạp nhưng không thể tránh khỏi — thời kỳ này đã bắt đầu trước khi [Root.Owner.GetName] được thiết lập, và rất có thể khi chúng ta diệt vong nó vẫn chưa kết thúc.\n\nBởi vì những trải nghiệm công nghiệp hóa đã từng xảy ra trên hành tinh của chính mình, chúng ta cảm thấy khá quen thuộc với nguyên nhân của nó: việc xả thải khí thải công nghiệp không ngừng vào bầu khí quyển dẫn đến biến đổi khí hậu dữ dội, và công nghệ của họ vẫn chưa phát triển đến mức có thể giải quyết vấn đề này.\n\nKết luận này đã thu hút sự chú ý nhất định trong giới khoa học của chúng ta, mặc dù đa số mọi người chỉ ra rằng công nghệ của chúng ta 'có lẽ' đã đủ phát triển để tránh được sự kiện tuyệt chủng như vậy."
 country.1155.name: "Đại tuyệt chủng: Nghiên cứu đã hoàn thành"
 country.1155.desc: "Chuyến thám hiểm khoa học lần này chúng ta đã thu hoạch được nhiều thứ ngoài mong đợi. Các nhà khoa học [Root.GetSpeciesAdj] giờ đây đã nắm giữ một lượng dữ liệu khổng lồ chưa từng có, đủ để thiết lập một mô hình chính xác cho tương lai của [Root.Capital.GetName].\n\nBáo cáo ban đầu cho thấy, ngoại trừ các hoạt động vũ trụ kỳ quái và sự sụp đổ đột ngột của [Root.GetName], [Root.Capital.GetName] ít nhất sẽ không thực sự gặp nguy hiểm trong vòng trăm năm tới."
 country.1155.a: "Chúng ta còn có thể học được gì từ những hành tinh này nữa không?"
 country.1155.b: "Người dân của [Root.GetSpeciesName] có thể yên tâm rồi."
 country.1155.c: "Hãy công khai dữ liệu của những hành tinh này."
 country.1156.name: "Đại tuyệt chủng: Điều tra đã hoàn thành"
 country.1156.desc: "Mặc dù bản dữ liệu này vơ đũa cả nắm cho tất cả các hệ sao, khó tránh khỏi có chút phiến diện, nhưng thông qua việc triển khai nghiên cứu trên các hành tinh riêng lẻ, [Root.GetName] có thể suy luận ra dữ liệu điều tra của hệ sao nơi nó tọa lạc."
 country.1156.a: "Tuyệt."
 country.1157.name: "Đại tuyệt chủng: Tin tưởng vào tương lai"
 country.1157.desc: "Khi ngày càng có nhiều tin tức về các nghiên cứu được truyền tới tai người dân qua các phương tiện truyền thông, mọi người ngày càng trở nên lo âu bồn chồn. Giờ đây chúng ta có thể một lần quét sạch mọi nghi ngờ của họ."
 country.1157.a: "Hành tinh mẹ đã an toàn."
 country.1157.b: "Đây lại là một hành động thành công nữa dưới sự lãnh đạo của [Root.GetRulerTitle]."
 country.1158.name: "Đại tuyệt chủng: Truyền đạt thông tin"
 country.1158.desc: "Dữ liệu thu thập được trong chuyến thám hiểm khoa học vô cùng quý giá đối với [Root.GetName]. Do đó, việc sử dụng dữ liệu cũng được kiểm soát nghiêm ngặt, để phòng tránh những chuyện thiếu cân nhắc xảy ra.\n\nNghiên cứu hiện đã kết thúc. Vì sự phát triển của khoa học, nhiều người kêu gọi công khai các dữ liệu liên quan."
 country.1158.a: "Tốt lắm."
 ####################################
 # Sự kiện kể chuyện
 ####################################
 story.1.name: "Báo cáo tiếp xúc: Sự sống đơn giản"
 story.1.desc: "Tin tức trên [Root.GetName] tràn ngập về việc phát hiện ra các sinh vật ngoại hành tinh cách đây không lâu.\n\nMặc dù nó còn cách rất xa mức độ của sinh vật có trí tuệ, nhưng ít nhất điều đó chứng minh rằng bên ngoài không gian có sự sống tồn tại."
 story.1.desc.phobe: "Tin tức trên [Root.GetName] tràn ngập về việc phát hiện ra các sinh vật ngoại hành tinh. Mặc dù nó chưa đạt đến mức độ sinh vật trí tuệ, nhưng ít nhất nó chứng minh sự sống ngoài hành tinh là có thật. Đây là một thực tại không thể tránh khỏi, và người dân bắt đầu lo lắng cho tương lai."
 story.1.desc.phile: "Tin tức trên [Root.GetName] tràn ngập về sinh vật ngoại hành tinh. Phép màu của sự sống này một lần nữa khiến người dân [Root.GetSpeciesAdj] tràn đầy mong đợi về lần tiếp xúc đầu tiên với những sinh vật trí tuệ khác."
 story.1.desc.spiri: "Tin tức trên [Root.GetName] xôn xao về sinh vật ngoại hành tinh. Kể từ khi phát hiện ra phép màu của tạo hóa bên ngoài [Root.Capital.GetName], các nhà huyền học [Root.GetSpeciesAdj] liên tục tổ chức các nghi lễ thần bí để cố gắng tìm kiếm thêm câu trả lời."
 story.1.desc.gesta: "Chúng ta đã xác nhận sự tồn tại của sự sống hữu cơ bậc thấp bên ngoài sinh quyển của [Root.Capital.GetName]."
 story.1.desc.term: "Đã phát hiện vi sinh vật dị hình hữu cơ. Đã điều chỉnh mô hình thuật toán về xác suất tồn tại của các dị hình trí tuệ hữu cơ theo tình hình thực tế. Nếu chúng thực sự tồn tại, chúng sẽ bị phát hiện. Chúng sẽ bị tiêu diệt."
 story.1.desc.evopred: "Chúng ta không cô đơn. [Root.GetName] lần đầu tiên xác định được sự tồn tại của sự sống khác trong vũ trụ; từ vi sinh vật đến sinh vật ngoại hành tinh, [Root.GetHomeWorldName] không phải là sân khấu tiến hóa duy nhất. Một cơn đói khát vô danh thức tỉnh sau giấc ngủ dài, sục sôi trong cơ thể chúng ta. Và cánh cung săn bắn của chúng ta đã được giương lên lần nữa."
 story.2.name: "Báo cáo tiếp xúc: Cư dân không gian sâu"
 story.2.desc: "Tin tức trên [Root.GetName] tràn ngập về sinh vật ngoại hành tinh mới phát hiện. Những sinh vật này dường như cư ngụ trong không gian sâu. So với chúng, các vi sinh vật cực đoan trên [Root.Capital.GetName] chẳng đáng là gì."
 story.2.desc.phile: "Tin tức trên [Root.GetName] xôn xao về sinh vật ngoại hành tinh. Chúng sống trong không gian sâu thẳm, khiến các vi sinh vật trên [Root.Capital.GetName] trở nên mờ nhạt. Dù có người hoài nghi, nhưng việc gặp gỡ sự sống ngoại lai là điều đã được dự đoán. Các nhà sinh vật học [Root.GetSpeciesAdj] không giấu nổi sự phấn khích trước khả năng thích nghi của chúng."
 story.2.desc.followup: "Người dân trên [Root.GetName] đón nhận báo cáo về các sinh vật ngoại hành tinh một cách bình tĩnh. Việc sự sống thực sự tồn tại trong chân không đã gây ra tranh luận ngắn ngủi trong giới khoa học [Root.Capital.GetName]. Tuy nhiên vì trước đó đã phát hiện sự sống bậc thấp, nên người [Root.GetSpeciesNamePlural] không quá kinh ngạc."
 story.2.desc.gesta: "Chúng ta quan sát thấy các vi sinh vật hữu cơ cực đoan đang du hành trong không gian sâu."
 story.2.desc.evopred: "[Root.GetName] đã chạm trán các thực thể hữu cơ không gian! Các [GetScientistPlural] của chúng ta vẫn chưa chắc chắn tại sao những sinh vật khổng lồ như vậy có thể tiến hóa giữa chân không vũ trụ khắc nghiệt, cũng như không biết chúng sở hữu những đặc tính di truyền thích nghi nào. Chúng ta đang rất nóng lòng muốn tìm hiểu."
 story.3.name: "Báo cáo tiếp xúc: Động vật hành tinh"
 story.3.desc: "Trên [Root.GetName] tràn ngập tin tức về việc phát hiện sinh vật ngoại hành tinh. Dù theo tiêu chuẩn của [Root.GetSpeciesAdj] thì chúng chưa phải sinh vật trí tuệ, nhưng sự tồn tại của chúng đã bác bỏ cách phân loại sự sống đơn giản của chúng ta. Chúng nhắc nhở ta rằng vũ trụ cực kỳ phức tạp và ẩn chứa vô vàn khả năng."
 story.3.desc.spiri: "Các giáo sĩ trên [Root.Capital.GetName] nhìn chung đều công nhận việc tìm thấy thực thể hữu cơ ngoại hành tinh — dù là bậc thấp. Tuy nhiên phát hiện này cũng gây ra tranh luận về giáo lý — liệu đây là bằng chứng người [Root.GetSpeciesNamePlural] là chủ tể muôn loài, hay chúng ta chỉ đơn giản là chưa gặp được đồng bào của mình ngoài không gian sâu?"
 story.3.desc.followup: "Sau khi báo cáo về sinh vật ngoại hành tinh được công bố, các nhà sinh vật học [Root.GetSpeciesAdj] vui mừng nhận thấy thực thể sống phức tạp này không quá khác biệt so với những gì có trên [Root.Capital.GetName]. Dù nó bác bỏ cách phân loại đơn giản nhưng ngoài bản năng động vật thuần túy thì cũng không có gì đặc biệt. Dù vậy, nó cho thấy vài hình thái sự sống là phổ biến."
 story.3.desc.gesta: "Chúng ta đã phát hiện động vật trên các hành tinh lạ."
 story.3.desc.evopred: "[Root.GetName] đã phát hiện ra những hình thái sự sống phức tạp mới! Những sinh vật này có thể không có trí tuệ hoàn chỉnh, nhưng nền văn minh của chúng ta luôn sẵn lòng đón nhận mọi loại mẫu nhiễm sắc thể. Các [GetScientistPlural] đã bắt đầu tính toán xem cần bao nhiêu vật chất di truyền để tất cả dân cư của ta đều được hưởng một phần."
 story.4.name: "Báo cáo tiếp xúc: Sự sống cận trí tuệ"
 story.4.desc: "Trên [Root.GetName] tràn ngập tin tức về sinh vật ngoại hành tinh vừa chạm trán. Thực thể này đã tiến gần đến mức sinh vật trí tuệ, thật khiến người ta phấn khích. Nhưng chúng ta cũng phải nhận thức rõ rằng, dù [Root.GetName] chỉ mới bước lên đài danh vọng của hệ sao, nhưng đây đã là một tiến triển đáng kể."
 story.4.desc.phobe: "Việc quan sát thấy động vật ngoại hành tinh đã gây ra hoảng loạn trên [Root.Capital.GetName]. Những thứ trong video — bước chân nặng nề và ánh mắt trống rỗng của chúng — gây ra sự bất an sâu sắc cho dân chúng [Root.GetSpeciesAdj]. Việc chúng có phải ngoại lai hay không không quan trọng, quan trọng là các nhà sinh vật học khẳng định chúng rất giống chúng ta. Đó như một tấm gương méo mó cho thấy con đường tiến hóa khập khiễng mà chúng ta cố gắng lãng quên."
 story.4.desc.phile: "Sau khi chạm trán sự sống ngoại lai, báo đài [Root.GetSpeciesAdj] tràn ngập những tranh luận. Trí tuệ của sinh vật này thật đáng kinh ngạc. Chúng ta phải hiểu rằng đây là bước tiến lớn dù ta chỉ mới bắt đầu khám phá hệ sao. Đa số người [Root.GetSpeciesNamePlural] đồng ý ta có trách nhiệm giúp đỡ các loài khác bước lên con đường tương tự, nếu họ đã sẵn sàng."
 story.4.desc.spiri: "Sau khi gặp gỡ sự sống ngoại lai, các tổ chức tôn giáo [Root.GetSpeciesAdj] xôn xao bàn tán. Trí tuệ của sinh vật này rất ấn tượng. Chúng ta nhận ra dù [Root.GetName] mới bắt đầu hành trình nhưng đây đã là bước ngoặt. Có tranh luận gay gắt về việc liệu ta có nên dẫn lối cho họ nếu họ đủ thông minh để khám phá tinh không hay không."
 story.4.desc.followup: "Sau nhiều lần phát hiện sinh vật bậc thấp, thủ đô [Root.GetSpeciesAdj] nhận được tin họ đã quan sát thấy một sinh vật thần kỳ với tiềm năng tiến hóa to lớn. Báo cáo này nhận được sự quan tâm cực kỳ lớn."
 story.4.desc.gesta: "Chúng ta xác nhận sự tồn tại của sinh vật ngoại hành tinh sắp tiến hóa ra ý thức tự thân."
 story.4.desc.evopred: "Chúng ta đã phát hiện ra những hình thái sự sống ngoại lai hoàn toàn mới. Những sinh vật này phức tạp hơn đa số sự sống trên [GetHomeWorldName], có trí tuệ cận mức thông minh. Chúng ta đã bắt đầu thiết lập các quy trình hậu cần và nhân bản cần thiết để xử lý những bộ gen mới đầy hấp dẫn này."
 story.5.name: "Báo cáo tiếp xúc: Di tích"
 story.5.desc: "Người dân [Root.GetName] bàn tán xôn xao về tin tức phát hiện di tích ngoại hành tinh. Những dấu vết này được coi là bằng chứng sắt đá về việc người ngoài hành tinh từng tồn tại và hoạt động — chúng ta tuy hiện tại cô độc, nhưng ít nhất không phải kẻ đầu tiên đặt chân vào tinh không."
 story.5.desc.phobe: "Các cơ quan liên quan trên [Root.Capital.GetName] bày tỏ lo ngại về báo cáo di tích ngoại hành tinh. Đây là bằng chứng cho thấy sự sống từng hoạt động trên vũ đài vũ trụ, dù vài chuyên gia [Root.GetSpeciesAdj] cho rằng đó chỉ là hiện tượng địa chất hoặc biến đổi tự nhiên."
 story.5.desc.phile: "Các nhà nghiên cứu ngoại hành tinh [Root.GetSpeciesAdj] rất phấn khích công bố quan điểm về phát hiện mới. Cơn bão khoa học này tạm thời gây ảnh hưởng tiêu cực đến các lĩnh vực khác."
 story.5.desc.followup: "'Sinh vật thông minh không tìm được bạn đồng hành' là tiêu đề một bài báo nóng hổi trên [Root.Capital.GetName]. Người dân cho rằng sự chú ý đang dồn vào sinh vật bậc thấp, trong khi các chủng tộc thông minh thực sự vẫn 'đeo mặt nạ bí ẩn'. Những báo cáo về di tích dường như chỉ làm tăng thêm sự mỉa mai cho chuyện này."
 story.5.desc.gesta: "Chúng ta tìm thấy bằng chứng về sự tồn tại của sinh vật trí tuệ ngoại hành tinh trên hành tinh lạ."
 story.6.name: "Báo cáo tiếp xúc: Chủng tộc [GetPreFTLUpperPlural]"
 story.6.desc: "Tin hạm đội ta phát hiện văn minh ngoại hành tinh [GetPreFTLLower] đã lan truyền khắp [Root.GetName]. Dù chưa nắm giữ khả năng du hành không gian, nhưng người ngoài hành tinh trên [primitive_planet.GetName] đã đủ thông minh và xã hội của họ có mọi đặc trưng của một văn minh tiên tiến."
 story.6.desc.phobe: "Tin về sinh vật [GetPreFTLLower], hay còn gọi là văn minh [primitive_planet.GetName], cho thấy chúng có trí tuệ sơ khai không được chào đón tại [Root.Capital.GetName]. Sự bất an bao trùm các cuộc thảo luận, một số ít kêu gọi dùng mọi thủ đoạn để thiết lập bá quyền [Root.GetSpeciesAdj], trong khi đa số không muốn nhắc đến chúng."
 story.6.desc.phile: "Báo cáo về văn minh [GetPreFTLLower] được giới trí thức [Root.GetName] ăn mừng nhiệt liệt. Cuối cùng ta cũng chứng minh được bước chân vào tinh không không hề vô nghĩa. Họ có thể tạm thời chưa bằng ta, nhưng sự tồn tại của họ là ngọn hải đăng hy vọng soi sáng vũ trụ tĩnh lặng này."
 story.6.desc.followup5: "Phát hiện sự sống trí tuệ khiến giới khoa học [Root.Capital.GetName] hò reo. Dù chưa thể bay vào không gian, nhưng người ngoài hành tinh trên [primitive_planet.GetName] có trí tuệ cao và xã hội tiến bộ. Các học giả cho rằng đây là cơ hội tuyệt vời để nghiên cứu một xã hội ngoại lai sống thay vì chỉ nhìn vào di tích cổ."
 story.6.desc.followup4: "Báo cáo về văn hóa [GetPreFTLLower] được chào đón, nối tiếp sau phát hiện về loài chưa khai hóa. [Root.GetName] hiện là văn minh đầu tiên ta biết bước vào tinh không, nhưng việc thấy những kẻ khác chỉ chậm hơn ta vài kỷ nguyên hay vài thế kỷ thật sự rất phấn khích."
 story.6.desc.followup123: "So với những sinh vật không trí tuệ thường thấy, báo cáo về chủng tộc [primitive_planet.GetName] thuộc nhóm [GetPreFTLLower] chắc chắn đã thắp lại ngọn lửa đam mê khoa học ngoại lai tại [Root.Capital.GetName], vốn trước đây bị coi là lý thuyết suông."
 story.6.desc.gesta: "Xác nhận sự tồn tại của văn minh [GetPreFTLLower]. Họ chưa có khả năng du hành siêu vượt ánh sáng, bị cản trở bởi những cá tính chia rẽ của chính mình."
 story.6.desc.evopred: "Chúng ta đã tìm thấy sinh vật trí tuệ! Một tàu của ta gặp văn minh [GetPreFTLLower], chứng minh ta không cô đơn. Hơn nữa nhiễm sắc thể của họ rất hợp để hấp thụ. Ta đang cân nhắc các phương án từ quan sát đến xâm lược. Khả năng là rất... ngon lành."
 story.7.name: "Báo cáo tiếp xúc: Những lữ khách không gian bí ẩn"
 story.7.desc: "[Root.GetName] không mất quá lâu để chạm trán sinh vật trí tuệ ngoại hành tinh. Báo cáo gửi về thủ đô mô tả ngắn gọn về những sinh vật này và đề cập đến việc lỡ mất cơ hội giao lưu với họ."
 story.7.desc.phobe: "[Root.Capital.GetName] sục sôi sau tin phát hiện tàu lạ. Hiện chưa rõ mục đích của họ, nên tốt nhất hãy chuẩn bị cho tình huống xấu nhất."
 story.7.desc.phile: "[Root.GetName] cuối cùng đã gặp được những lữ khách khác giữa tinh không. Dù chưa rõ ý đồ của họ, nhưng thủ đô [Root.Capital.GetName] tràn ngập niềm vui sau báo cáo. Cuối cùng cũng có ai đó chứng kiến mọi chuyện rồi!"
 story.7.desc.followup6: "Chúng ta gặp sinh vật trí tuệ có khả năng hàng không vũ trụ. Khác với các loài [GetPreFTLLowerPlural] từng thấy, ta chưa kịp nhìn rõ những kẻ điều khiển con tàu này cũng như mục đích của họ."
 story.7.desc.followup12345: "Tin về tàu ngoại hành tinh truyền về thủ đô như một dấu chấm tròn trịa cho chương đầu tiên của đế chế [Root.GetName] tiến vào quần tinh."
 story.7.desc.mach.followup12345: "Chúng ta quan sát thấy tàu ngoại hành tinh với khả năng hàng không tiên tiến. Dù chưa liên lạc, nhưng chắc chắn người [Root.GetSpeciesNamePlural] không phải đế chế duy nhất có thể khám phá không gian."
 story.7.desc.gesta: "Chạm trán sự sống ngoại lai cao cấp. Tiếp xúc là không thể tránh khỏi."
 story.7.desc.evopred: "Phát hiện sự sống có khả năng du hành không gian. Cột mốc này dấy lên tranh luận: nếu họ có gen quý, ta nên cưỡng đoạt hay lịch sự yêu cầu? Chỉ cần nhân bản mẫu tự nguyện là đủ cho dân số ta. Kết quả lần đầu tiếp xúc sẽ giúp ta trả lời."
 story.7.a.swarm: "Con mồi?"
 story.contact_report.materialist: "Sự sống mới mang lại những hiểu biết khoa học giá trị."
 story.contact_report.spiritualist: "Chúng ta và vũ trụ là một."
 story.contact_report.militarist: "Sẵn sàng tiếp xúc với những mối đe dọa tiềm tàng."
 story.contact_report.pacifist: "Sự tồn tại của sự sống mở rộng sự hiểu biết của chúng ta."
 story.contact_report.egalitarian: "Sự đa dạng làm phong phú trí tuệ tập thể."
 story.contact_report.xenophile: "Đón nhận mối liên kết với sự sống mới."
 story.contact_report.xenophobe: "Củng cố phòng thủ đề phòng bất trắc."
 story.contact_report.authoritarian: "Chúng ta phải xưng bá hoàn vũ."
 story.contact_report.gestalt_consciousness_hive: "Chuẩn bị tích hợp trí tuệ của chúng."
 story.contact_report.gestalt_consciousness_machine: "Phân tích dữ liệu để đạt hiệu suất tối ưu."
 story.contact_report_first_alien_life_found: "Thú vị."
 story.contact_report_first_alien_life_found_materialist: "Đây là một cơ hội khoa học."
 story.contact_report_first_alien_life_found_pacifist: "Không cần lo lắng."
 story.contact_report_first_alien_life_found_militarist: "Đây là mối đe dọa tiềm tàng."
 story.contact_report_first_alien_life_found_egalitarian: "Khả năng mới để chia sẻ tri thức."
 story.contact_report_first_alien_life_found_authoritarian: "Phải duy trì trật tự."
 story.contact_report_first_alien_life_found_spiritualist: "Đây là ý nguyện của bề trên."
 story.contact_report_first_alien_life_found_xenophile: "Một khởi đầu mới."
 story.contact_report_first_alien_life_found_xenophobe: "Sự sống mới, mối đe dọa mới."
 story.contact_report_first_alien_life_found_hive: "Tiềm năng này dành cho trí tuệ tập thể."
 story.contact_report_first_alien_life_found_machine: "Đã thu thập thông tin."
 story.8.name: "Báo cáo tiếp xúc: Tinh Thần Thú"
 story.8.desc: "Phát hiện sinh vật khổng lồ trong hư không khiến [Root.GetName] trở nên nhỏ bé hơn bao giờ hết. Con quái vật đầu tiên mà đế chế vĩ đại của ta gặp cũng có thể là con cuối cùng. Hình ảnh nó lan truyền khắp đế chế gây ra hoảng sợ cực độ, nhiều người yêu cầu chính phủ hành động. Hạm đội báo cáo sức mạnh nó có thể dễ dàng nghiền nát những hạm đội mạnh nhất, khuyên ta nên cẩn trọng."
 story.8.desc.spirit: "Dân chúng [Root.GetSpeciesAdj] đang cầu nguyện. Những quái vật trong bóng tối khiến nhiều người nghi ngờ sự tỉnh táo của chính mình, thậm chí lung lay đức tin. Chúng là đấng tạo hóa bảo hộ, hay là kẻ thù của vạn vật?"
 story.8.desc.phile: "[Root.GetName] đã gặp gỡ một sự tồn tại vô cùng trang nghiêm. Sự hiện diện của sinh vật khổng lồ này là minh chứng tốt nhất cho những phép màu vô tận của vũ trụ. Trước mặt nó, bất kỳ sinh vật nào cũng trở nên nhỏ bé như đom đóm so với ánh trăng. Dù chưa rõ hành vi của nó, người dân thủ đô vừa kính sợ vừa hy vọng vào những gì nó mang lại."
 story.8.desc.mach: "Phát hiện cá thể khổng lồ không rõ đặc tính buộc [Root.GetName] phải định nghĩa lại các thông số về diện tích bề mặt tối đa của kẻ thù tiềm tàng. Dự báo tỷ lệ sống sót nếu xung đột với nó là không lạc quan. Khuyên các đơn vị nghiên cứu và chiến đấu tiếp tục quan sát và nâng cấp hạm đội."
 story.8.desc.followup7: "Ta tìm thấy sinh vật vượt xa mọi loài từng thấy. Nó có thể lớn tương đương vệ tinh của một hành tinh. Đây là bước ngoặt lịch sử của [Root.GetName]. Chỉ hy vọng chủng tộc ta còn sống sót để nhìn lại ngày này."
 story.8.desc.followup123456: "Tin về quái vật khổng lồ xuất hiện trong hư không càn quét cả đế chế. Người quan tâm, kẻ lạc quan, nhưng đa số là sợ hãi. Tài liệu lịch sử sẽ ghi dấu ngày trọng đại này."
 story.8.desc.mechanical: "Có tin tức về một cấu trúc khổng lồ trong không gian sâu đang trải dài qua [Root.GetName]. Dù trông không giống sinh vật, nhưng sự tồn tại của nó cho thấy những khả năng về kỹ thuật và siêu công trình."
 story.8.a: "Chẳng lẽ chỉ còn bóng tối này thôi sao?"
 story.8.b: "Chúng ta chỉ là cát bụi trùng chí mà thôi."
 story.8.c: "Thật là mở mang tầm mắt."
 story.8.d: "Đã nhận thông tin. Đang cập nhật cơ sở dữ liệu."
 story.8.e: "Ác quỷ thử thách đức tin của chúng ta."
 story.8.f: "Minh chứng thiêng liêng."
 story.8.g: "Hãy nghĩ xem chúng có thể dạy ta điều gì."
 story.8.h: "Hãy tưởng tượng chúng sẽ là những chiến lợi phẩm hùng vĩ ra sao."
 ### Quái vật không gian
 story.101.name: "Amip Không gian"
 story.101.desc.phile: "Hạm đội ta vừa gặp một hình thái sự sống không gian mới mẻ, xinh đẹp và thần kỳ. Vì sự hiểu lầm dữ liệu của các phân tích viên, chúng được gọi là 'Amip Không gian', dù kích thước lớn hơn cả hộ vệ hạm của [Root.Owner.GetAdj]. Ta nên tránh tiếp xúc và quan sát chúng từ xa."
 story.101.desc.phobe: "Hạm đội ta vừa gặp một sự sống không gian mới đáng sợ. Do hiểu lầm dữ liệu, chúng bị gọi là 'Amip Không gian', dù lớn hơn hộ vệ hạm của [Root.Owner.GetAdj]. Việc chấm dứt sự tồn tại của đám dị hình gớm ghiếc này chắc cũng chẳng hại gì, vì khoa học hoặc vì lý do nào đó."
 story.101.desc.milit: "Hạm đội gặp sự sống không gian. Được gọi là 'Amip Không gian', lớn hơn hộ vệ hạm ta. Chúng có hành vi thù địch với tàu [Root.Owner.GetAdj], nhưng ta cho phép nghiên cứu thêm."
 story.101.desc.pacif: "Hạm đội gặp sự sống không gian chưa từng thấy. Gọi là 'Amip Không gian', lớn hơn hộ vệ hạm. Dù chúng nóng tính, nhưng ta có thể nghiên cứu từ xa từ thủ đô."
 story.101.desc.mater: "Hạm đội gặp sự sống không gian. Gọi là 'Amip Không gian', lớn hơn hộ vệ hạm [Root.Owner.GetAdj]."
 story.101.desc.gesta: "Hạm đội gặp sự sống không gian mới. Dù cá thể lớn hơn hộ vệ hạm ta, nhưng đàn 'Amip Không gian' này vẫn quá yếu so với hạm đội của ta."
 story.101.desc: "Hạm đội gặp sự sống không gian mới. Gọi là 'Amip Không gian', lớn hơn hộ vệ hạm [Root.GetAdj]."
 story.101.a: "Triển khai dự án đặc biệt nghiên cứu Amip Không gian từ xa."
 story.101.b: "Hạm đội của ta có thể nhanh chóng hạ gục sinh vật này."
 story.105.name: "Amip Không gian vĩnh cửu"
 # dự án hoàn thành
 story.105.desc.phile: "Amip Không gian — cái tên giờ đã phổ biến ở thủ đô — là loài sống đơn độc. Con trưởng thành luôn đi kèm các sinh vật bán độc lập gọi là roi (flagella). Roi được amip tự tạo ra và điều khiển qua dịch RNA. Ta từng tưởng chúng là amip con, nhưng thực ra chúng không có cơ quan sinh sản, giống như những cánh tay nối dài có thể tách ra tấn công kẻ địch rồi quay về tái cấu trúc. Đặc tính tái sinh của da amip hay cách di chuyển của roi đều có giá trị quân sự."
 story.105.desc.pacif: "Cái tên Amip Không gian đã trở nên cực kỳ nổi tiếng tại thủ đô. Chúng sống độc lập, con trưởng thành có các sinh vật bán tự chủ gọi là roi đi cùng, được điều khiển bằng RNA. Roi không phải con non mà là phần cơ thể có thể tách rời để tấn công, sau đó quay lại để được 'biên dịch' lại."
 story.105.desc: "Amip Không gian — tên gọi thông dụng khi việc phân loại khoa học quá rắc rối — sống đơn độc trong không gian. Chúng tạo ra các roi bán độc lập từ dịch RNA để điều khiển. Các roi này tấn công trong phạm vi nhất định rồi quay về cơ thể mẹ để tái thiết kế. Da của chúng có khả năng tái sinh và roi có tiềm năng ứng dụng quân sự."
 story.105.desc.gesta: "Một con amip không gian thường đi kèm các đoạn roi bán tự chủ để phòng thủ và di chuyển vật thể. Chúng không chung ý chí, mà con mẹ dùng dịch RNA để lập trình cho roi thực hiện các nhiệm vụ phức tạp."
 story.105.a: "Thật là kỳ diệu."
 story.110.name: "Giải phẫu Amip Không gian"
 # nghiên cứu mảnh vỡ
 story.110.desc.phobe: "Amip Không gian — giờ là từ miệt thị của quân đội ta — phức tạp hơn tưởng tượng. Lớp vỏ cứng bảo vệ vô số cá thể nhỏ bên trong, giống như các máy bay tấn công của tàu mẹ. Những con nhỏ này cấu tạo đơn giản, trong khi con mẹ có hàng trăm cơ quan để sinh tồn trong không gian. Khi tiêu diệt, đa số cơ quan bị hỏng, nhưng nếu hạ gục đủ 5 con bằng cách nhắm vào các vị trí đặc thù, ta có thể phục dựng một cái xác hoàn chỉnh."
 story.110.desc.milit: "Amip Không gian — tên gọi chính thức của quân đội — rất phức tạp. Vỏ của chúng chứa các 'máy bay tấn công' sinh học nhỏ. Khi tiêu diệt chúng, các cơ quan thường bị cháy xém. Nhưng các nhà nghiên cứu cho rằng nếu dùng hỏa lực chính xác hạ gục 5 con, ta sẽ có đủ mẫu vật để phục dựng toàn bộ sinh lý của chúng."
 story.110.desc: "Cái tên Amip Không gian đã ăn sâu vào lòng dân dù trái với quy tắc đặt tên truyền thống. Chúng có vỏ cứng bảo vệ các cá thể nhỏ bên trong. Dù các cơ quan thường bị hỏng khi bị tiêu diệt, nhưng nhóm nghiên cứu đã nhận diện được các đặc trưng sinh lý và điểm yếu của chúng."
 story.110.desc.gesta: "Amip không gian phức tạp hơn dự kiến. Vỏ cứng của chúng bảo vệ các túi chứa amip nhỏ đóng vai trò như phi cơ tấn công. Sau khi tiêu diệt chúng, dù nhiều cơ quan bị hỏng nhưng ta đã nắm được các đặc điểm sinh học và điểm yếu của chúng."
 story.110.a.phobe: "Tìm mọi cách tiêu diệt chúng nhanh nhất có thể."
 story.110.b.milit: "Dùng để luyện tập bắn bia."
 story.110.c: "Tốt lắm."
 story.115.name: "Amip Không gian đã bị tiêu diệt" # nhiệm vụ giết 5 con
 story.115.desc.phobe: "Sau khi giết vài con, ta thấy các vật thể dạng sợi không phải con non hay ký sinh mà là công cụ do con trưởng thành tạo ra. Chúng thực hiện nhiệm vụ rồi quay về túi chứa. Điểm yếu duy nhất là độ trễ khi nhận lệnh, nhưng được bù đắp bằng số lượng và phản xạ tự thân. Hãy cứ giết sạch chúng đi."
 story.115.desc.milit: "Qua các mảnh vỡ, ta thấy các sợi roi không có đầu mà có trung tâm xử lý hạt để giải mã lệnh RNA từ amip mẹ. Chúng là binh lính, bia đỡ đạn, công cụ trinh sát. Hiệu quả chiến đấu của amip phụ thuộc vào việc giải phóng các sợi này, điều mà quân đội ta có thể học hỏi."
 story.115.desc: "Sau khi hạ con thứ tư, một cái xác hoàn chỉnh đã được phục dựng tại thủ đô. Bí mật quý giá nhất là lớp màng da có thể hấp thụ và chuyển hóa bức xạ vũ trụ thành chất dinh dưỡng."
 story.115.a.phobe: "Đúng là như vậy." # bổ trợ, +20% sát thương amip
 story.115.b.milit: "Nên học hỏi điều này." # bổ trợ, cải thiện phi cơ tấn công
 story.115.c: "Kiến thức này rất hữu ích." # bổ trợ, +5% năng lượng
 story.201.name: "Thực thể Tinh thể"
 story.201.desc.base: "Các [This.Owner.GetResearchers] đã hoàn thành báo cáo về các vật thể tinh thể trôi nổi phi thường trong hệ sao [This.System.GetName]. Khám phá của họ rất chấn động."
 story.201.desc.phile: "$story.201.desc.base$\n\nNhững vật thể lớn như phi thuyền và các vệ tinh tinh thể nhỏ ban đầu trông như vô tri, nhưng khi tàu ta đến gần, chúng đột ngột đổi hướng và phát ra sóng năng lượng. Đây có thể là một dạng sống — chúng ta cần xử lý thận trọng nhưng cũng đầy tò mò."
 story.201.desc.phobe: "$story.201.desc.base$\n\nCác tinh thể này có thể gây nguy hiểm vì chúng phản ứng khi tàu ta tới gần. Ta nên cử hạm đội thử nghiệm sự hung hăng của chúng, nếu thấy đe dọa thì tiêu diệt ngay."
 story.201.desc.pacif: "$story.201.desc.base$\n\nVì không muốn mạo phạm những tinh thể này, ta hãy giám sát chúng từ xa từ thủ đô."
 story.201.desc.spiri: "$story.201.desc.base$\n\nHình thái và những góc cạnh tự nhiên của chúng cộng hưởng với tâm hồn người [Root.Owner.GetSpeciesAdj]. Ta nên lùi lại và quan sát chúng một cách hòa bình từ xa."
 story.201.desc.milit: "$story.201.desc.base$\n\nNgay cả khi không tìm thấy công dụng chiến đấu, việc nghiên cứu một tinh thể bị đập nát chắc chắn sẽ mang lại những khám phá thú vị."
 story.201.desc: "$story.201.desc.base$\n\nTa có thể chọn giao chiến trực tiếp hoặc quan sát an toàn từ xa."
 story.201.a: "Công bố dự án đặc biệt nghiên cứu tinh thể từ xa."
 story.201.b: "Hạm đội của ta có thể đập nát chúng."
 story.205.name: "Tinh thể bất diệt"
 story.205.desc.phile: "Thực thể Tinh thể thực sự là sinh mệnh. Dù vài học giả bảo thủ gọi chúng là 'vật chất silicat hoạt tính', nhưng đa số dân chúng đều tán thưởng khái niệm mới này. Chúng sống đơn lẻ, mỗi mẫu thể thường đi kèm một lính gác và một đội quân tinh thể nhỏ. Chúng dường như không sinh sản hay già đi. Màu sắc khác nhau không phải do tuổi tác mà do điện tích nội tại thay đổi thuộc tính phản xạ."
 story.205.desc: "Thực thể Tinh thể dường như thực sự là sinh mệnh. Chúng sống đơn lẻ với lính gác và quân đoàn đi kèm. Ta chưa biết gì về phân cấp xã hội của chúng. Chúng không sinh sản hay già đi, màu sắc phụ thuộc vào biến đổi năng lượng bên trong."
 story.205.desc.pacif: "Các thực thể tinh thể có thể phát ra sóng năng lượng vào mục tiêu và không may là chúng thích làm vậy với bất kỳ ai đến gần."
 story.205.desc.spiri: "Thực thể Tinh thể không thể dùng khái niệm sống hay chết đơn giản để mô tả. Chúng là sự tồn tại độc đáo không già đi, ra đời từ rất lâu trước đây. Màu sắc cho thấy năng lượng bên trong của chúng."
 story.205.desc.gesta: "Tinh thể có lẽ là vật sống, khác biệt với sự sống hữu cơ hay nhân tạo truyền thống. Chúng không sinh sản, và sự thay đổi màu sắc là do phóng điện năng lượng nội tại."
 story.205.a: "Kiến thức này chắc chắn giúp ích cho phát triển công nghệ."
 story.205.a.tooltip: "Thêm bổ trợ §Y Lăng kính §! cho đế chế:\n£physics£ §G +10% §!"
 story.205.b: "Tìm công dụng thực tế cho thông tin này."
 story.205.b.tooltip: "Thêm bổ trợ §Y Sonar Tinh thể §! cho đế chế:\nTốn £energy£ §Y 30 §! năng lượng để §Y khảo sát ngay lập tức §! khi vào hệ sao có tinh thể."
 story.205.aa: "Có cách nào tận dụng trong chiến đấu không?"
 story.205.bb: "Nghe có vẻ sau này sẽ có lúc cần đến."
 story.210.name: "Thực thể Tinh thể bị nghiền nát"
 story.210.desc.milit: "Tinh thể là kẻ thù đáng sợ. Ta đã tìm thấy điểm yếu cấu trúc chung, hy vọng vài cuộc khảo sát nữa sẽ xác nhận được nó. Năng lượng chúng phóng ra liên quan đến tần số nhấp nháy. [Root.GetSpeciesAdj] sẽ gặp nhiều loại màu sắc với khả năng chiến đấu khác nhau."
 story.210.desc.mater: "Tinh thể có xu hướng tấn công tàu ta vì coi hạm đội kim loại là mối đe dọa cần xua đuổi. Qua giao tranh, ta thấy điểm yếu cấu trúc và tần số ánh sáng liên quan đến năng lượng. Ta sẽ tiếp tục giao chiến để tìm hiểu thêm vì không thể khai thác chúng như tài nguyên tự nhiên."
 story.210.desc: "Do hòa bình là khó khả thi, ta sẽ tiếp tục giao chiến để tìm hiểu về chúng."
 story.210.desc.gesta: "Chúng coi tàu ta là vật thể kim loại cần xua đuổi. Điểm yếu cấu trúc đã được phát hiện. Cần chuẩn bị cho các biến thể màu sắc khác nhau của chúng."
 story.210.a: "Đã rõ."
 story.215.name: "Đã tiêu diệt Thực thể Tinh thể"
 story.215.desc.milit: "[Root.GetName] chỉ để lại những mảnh vụn tinh thể. Bí mật của chúng có thể mãi là ẩn số, nhưng quân đội ta hiện đã rất giỏi trong việc đập nát chúng và cải thiện vũ khí từ đó."
 story.215.desc.mater: "Sau khi nghiên cứu hàng ngàn mẫu vật, các kỹ sư đã tìm ra cách biến mảnh vụn tinh thể thành vật liệu hữu dụng. Đây là một chiến thắng công nghiệp."
 story.215.desc: "Dù xung đột nhiều, chúng vẫn là bí ẩn. Ta tìm thấy vài công dụng từ mảnh vỡ nhưng hiểu biết vẫn còn rất ít."
 story.215.desc.gesta: "Sự thật về bản chất của chúng có lẽ sẽ mãi không bao giờ được biết đến."
 story.215.a.milit: "Chiến thắng quan trọng hơn sự thật nhiều."
 story.215.b.mater: "Phải tận dụng mọi tài nguyên vũ trụ mang lại."
 story.215.b.mater.tooltip: "Ban hành sắc lệnh §Y Treo thưởng Tinh thể Cao cấp §!."
 story.215.c: "Thật đáng tiếc."
 story.215.c.tooltip: "Ban hành sắc lệnh §Y Treo thưởng Tinh thể §!."
 story.219.name: "Sonar Tinh thể"
 story.219.desc: "[From.GetFleetName] gặp tinh thể tại [From.From.GetName]. Ta có thể dùng năng lượng phát ra chùm sáng cao tần khiến chúng tự tan rã từ bên trong như lăng kính cộng hưởng, rồi thu thập mảnh vỡ bằng cảm biến."
 story.219.a: "Cứ tiến hành đi."
 story.219.a.tooltip: "Dùng £energy£ §R -30 §! năng lượng để §Y khảo sát ngay lập tức §! hệ sao [From.From.GetName]."
 story.219.b: "Lần này thì thôi."
 story.219.c: "Chúng ta không có đủ tài nguyên."
 story.220.name: "Cầu Thủy Tinh"
 story.220.desc.hostile: "Phát hiện lượng lớn tinh thể tại [From.GetName]. Có thể đây là nhà của chúng, việc tháo dỡ cấu trúc này sẽ có giá trị nghiên cứu lớn."
 story.220.desc.nonhostile: "Đây rõ ràng là một cái tổ hoặc nơi tụ tập, có một cấu trúc tinh thể khổng lồ chưa từng thấy."
 story.220.desc.gesta: "Cấu trúc này có tính chất giống sinh vật tinh thể nhưng kích thước to lớn khủng khiếp."
 story.220.a.nonhostile: "Cứ làm thế đi."
 story.221.name: "Hoàn thành điều tra tinh thể"
 story.221.desc: "Nghiên cứu cấu trúc tinh thể đã kết thúc. Dù khó đưa ra kết luận cụ thể do chúng thiếu hoạt động, nhưng cấu trúc cơ thể chúng rất thần kỳ, giúp ta mô phỏng khả năng tái tạo cao cấp."
 story.221.desc.gesta: "Giờ ta có thể sao chép đặc tính tái cấu trúc cao cấp quan sát được trên chúng."
 story.221.a: "Đáng khen ngợi."
 story.223.name: "Điều tra tinh thể bị gián đoạn"
 story.223.desc: "Cấu trúc tinh thể ở hệ sao xa đã bị hủy, không thể tiếp tục nghiên cứu từ xa."
 story.223.desc.gesta: "Nghiên cứu từ xa đã bị hủy bỏ."
 story.223.a: "Thật đáng tiếc."
 story.223.a.tooltip: "Dự án đặc biệt §H Cấu trúc Tinh thể §! đã bị hủy."
 story.301.name: "Drone khai thác cổ đại"
 story.301.desc.pacif: "Phát hiện các drone không gian từ hàng ngàn năm trước, vốn dùng để khai thác quặng tự động nhưng đã bị bỏ rơi. Chúng không có giao thức liên lạc mà ta có thể hiểu và tấn công bất kỳ tàu [Root.Owner.GetSpeciesAdj] nào đến gần."
 story.301.desc.mater: "Chức năng của chúng rất rõ ràng — khai thác quặng — nhưng ai ra lệnh thì không rõ, vì hàng ngàn năm qua không có quặng nào được xuất ra khỏi đây."
 story.301.desc: "Chúng dùng laser khai thác mạnh mẽ và đe dọa các tàu đến gần. Dù là đồ cũ nhưng vẫn cần chú ý."
 story.301.desc.gesta: "Chúng sở hữu laser khai thác công suất lớn và thể hiện hành vi hung hăng khi ta tiếp cận."
 story.301.a: "Thiết lập trạm nghe lén tại [Root.Capital.GetName]."
 story.301.b: "Tháo tung chúng ra xem cấu tạo bên trong thế nào."
 story.305.name: "Quy tắc vận hành Drone khai thác"
 # bắt đầu chuỗi hệ sao mẹ của drone khai thác sau khi hoàn thành
 story.305.desc.pacif: "Ngoại trừ những lúc đe dọa tàu thuyền của [Root.GetSpeciesAdj], đám drone này chỉ thuần túy thực hiện các công việc khai thác máy móc.\n\nNhưng có một điểm thú vị là, chúng không hoàn toàn im lặng mà thường xuyên phát ra các tín hiệu xung âm thanh, chẳng rõ là gửi cho ai."
 story.305.desc.mater: "Hiệu suất khai thác của những chiếc drone này cực kỳ ấn tượng, nếu là các công nhân của [Root.GetSpeciesAdj] thì những khu vực này chắc hẳn đã bị coi là cạn kiệt từ lâu. Các kỹ sư cấp cao của chúng ta đang tìm cách ứng dụng phương thức vận hành của chúng vào các khu khai thác tổng hợp và cảng vũ trụ của [Root.GetName] nhằm tăng năng suất và giảm lãng phí năng lượng.\n\nĐiều thú vị là đám drone này không hề im lặng, chúng phát ra các tín hiệu xung, dù không thường xuyên nhưng lại dùng loại tín hiệu rất khó để phân biệt với nhiễu nền. Không rõ kẻ nào đang tiếp nhận những tín hiệu này."
 story.305.desc: "Đám drone trên các tiểu hành tinh này không ngừng nghỉ khai thác các nguồn tài nguyên đang dần cạn kiệt, một quy trình đơn điệu nhưng rất đáng để nghiên cứu. Các khu khai thác tổng hợp trên [Root.Capital.GetName] có thể học hỏi cách tối đa hóa sản lượng quặng trong khi vẫn tiết kiệm được năng lượng.\n\nNgoài ra, những chiếc drone này không hoàn toàn im lặng, chúng thỉnh thoảng lại phát ra tín hiệu xung âm thanh với bước sóng rất khó tách biệt khỏi nhiễu nền, không rõ liệu có ai nhận được những tín hiệu này hay không."
 story.305.desc.gesta: "Lũ drone trên tiểu hành tinh đang miệt mài khai thác tài nguyên một cách không mệt mỏi. Quá trình nghiên cứu chúng khá tẻ nhạt nhưng lại mang giá trị cao. Thực tế, chúng ta có thể học được cách tối ưu hóa hiệu suất khai thác đồng thời giảm thiểu tiêu thụ năng lượng.\n\nBên cạnh đó, chúng ta phát hiện ra drone không hề im lặng. Chúng phát ra các tín hiệu xung với tần số cực thấp và bước sóng khó lòng phân biệt được với tạp âm nền. Liệu có ai đang nhận những tín hiệu này hay không vẫn còn là một ẩn số."
 story.305.a: "Đã rõ."
 story.305.a.tooltip: "Cho phép sử dụng sắc lệnh §Y Tối ưu hóa Drone §!."
 story.305.b: "Tìm hiểu cách chúng phân tích các điểm khai thác."
 story.305.b.tooltip: "Thêm một số hành tinh giàu khoáng sản vào Nhật ký Tình báo."
 story.310.name: "Tháo dỡ Drone Khai thác"
 story.310.desc.mater: "Các drone khai thác đã bị tiêu diệt sau một trận chiến ác liệt với tàu của [Root.GetSpeciesAdj]. May mắn thay, các viên pin năng lượng là bộ phận bền bỉ nhất nên chúng ta đã thu hồi được một số viên còn nguyên vẹn. Công nghệ của những viên pin này vượt xa trình độ hiện tại của chúng ta, nhưng các thử nghiệm ban đầu cho thấy ta có thể chuyển đổi đầu ra của chúng thành năng lượng hữu dụng.\n\nSau khi viên pin cuối cùng cạn kiệt, các kỹ sư thử nghiệm đã phát hiện ra sự bất thường trong bức xạ nền. Hóa ra kể từ lần đầu chạm trán, đám drone này đã liên tục phát sóng ở một tần số hiếm gặp, nhưng chúng phát cho ai mới được?\n\nNhững chiếc drone này chứa đựng nguồn năng lượng khổng lồ nhưng có hạn. Nếu chúng ta phát hiện và vô hiệu hóa chúng kịp thời, nguồn năng lượng này sẽ thuộc về chúng ta."
 story.310.desc: "Drone khai thác đã bị phá hủy sau cuộc giao tranh với hạm đội [Root.GetSpeciesAdj]. Thật may là các viên pin năng lượng của chúng rất kiên cố, giúp chúng ta thu hồi được vài đơn vị chưa bị hư hại. Dù công nghệ của chúng vượt bậc so với ta, nhưng kết quả kiểm tra cho thấy có thể chuyển đổi chúng thành nguồn năng lượng dự trữ.\n\nKhi viên pin cuối cùng dùng hết, các kỹ sư đã nhận thấy điều bất thường trong bức xạ nền. Đám drone này đã liên tục phát tín hiệu ở một tần số lạ kể từ khi ta gặp chúng, nhưng mục tiêu nhận tin vẫn là một ẩn số.\n\nLũ drone này là nguồn cung năng lượng dồi dào nhưng có hạn. Chúng ta cần tìm cách vô hiệu hóa chúng nhanh gọn để tận dụng nguồn lực này."
 story.310.desc.gesta: "Chúng ta đã tiêu diệt đám drone khai thác trong trận chiến. May mắn là pin năng lượng của chúng rất bền nên ta đã thu giữ được một ít. Trình độ công nghệ của những viên pin này nằm ngoài tầm hiểu biết của ta, nhưng thử nghiệm cho thấy có thể chuyển hóa chúng thành năng lượng.\n\nNgay khi viên pin cuối cùng cạn sạch, chúng ta nhận thấy bức xạ nền xung quanh các [Root.GetUnitDronePlural] tham gia thí nghiệm đã giảm đi rõ rệt. Có vẻ như đám drone này không hề im lặng, chúng thỉnh thoảng phát tín hiệu ở một tần số kỳ lạ ngay từ khi ta mới chạm trán. Những kẻ nhận tin có lẽ đã không còn nữa.\n\nTóm lại, đám drone này có thể trở thành nguồn năng lượng hiệu quả nhưng có hạn, miễn là chúng ta tìm và vô hiệu hóa chúng một cách bài bản."
 story.310.a: "Rất tốt."
 story.310.a.tooltip: "Cho phép sử dụng sắc lệnh §Y Treo thưởng Drone §!."
 story.320.name: "Hoàn thành Khảo sát Địa chất"
 story.320.desc: "Bằng cách giải mã ngược thuật toán đánh giá của drone khai thác cổ đại, chúng ta đã tìm thấy và khảo sát tất cả các kho dự trữ khoáng sản khổng lồ."
 story.330.name: "Trung tâm Xử lý Quặng Cổ đại"
 story.330.desc: "[Root.GetName] đã phát hiện một lượng lớn drone khai thác tại hệ sao [From.GetName]. Có vẻ nơi đây từng là một trung tâm khai thác và xử lý quặng khổng lồ, thậm chí có thể là nơi cuối cùng còn sót lại trong thiên hà."
 story.330.desc.gesta: "Chúng ta phát hiện một lượng lớn drone khai thác tại hệ sao [From.GetName]. Nơi đây dường như là một trạm khai thác và chế biến quặng quy mô lớn, có lẽ là địa điểm cuối cùng thuộc loại này trong cả thiên hà."
 story.330.a: "Dĩ nhiên rồi."
 story.330.b: "Hãy xem chúng ta có thể học được gì từ nơi này."
 story.331.name: "Hoàn thành Quan sát Quy trình"
 story.331.desc: "Hóa ra việc không can thiệp vào trung tâm xử lý quặng cổ đại này là một quyết định sáng suốt. Thông qua việc quan sát lâu dài nhịp độ vận hành đơn điệu của nó, chúng ta đã thành công nắm bắt được vài kỹ thuật xử lý nguyên liệu tự động với trình độ vượt xa công nghệ hiện tại của chúng ta."
 story.331.desc.gesta: "$story.331.desc$"
 story.331.a: "Vậy hãy lấy những công nghệ đó về dùng thôi."
 story.331.b: "Trúng độc đắc rồi."
 story.333.name: "Đã phá hủy căn cứ drone khai thác"
 story.333.desc: "Trung tâm xử lý quặng ở [location_planet.GetStarName] đã bị hủy. Lượng lớn quặng thô và quặng đã xử lý đã bị văng vào không gian và rơi xuống [location_planet.GetName] như thiên thạch."
 story.333.desc.gesta: "Trung tâm xử lý quặng đã bị tiêu diệt."
 story.333.a: "Chúng ta đã nghiên cứu đủ di tích rồi."
 story.333.a.tooltip: "Dự án đặc biệt §H Trung tâm Xử lý Tự động §! đã bị hủy.\n $story.333.b.tooltip$"
 story.333.b: "Trúng độc đắc rồi."
 story.333.b.tooltip: "Trữ lượng khoáng sản của [location_planet.GetName] đã dồi dào hơn."
 story.401.name: "Hư Không Vân"
 story.401.desc.spiri: "Báo cáo mô tả hiện tượng đầy thi vị này là 'Hư Không Vân' — những tinh tú rực rỡ cuộn trào trong bóng đêm. Các giáo sĩ coi đây là sứ giả của ý chí vĩ đại, tốt nhất đừng manh động trước khi hiểu rõ chúng."
 story.401.desc: "Điều tra những đống đổ nát ban đầu cho thấy những đám mây bụi phát ra năng lượng mạnh mẽ, có thể tự di chuyển. Đây là điềm báo chẳng lành, có lẽ vũ trụ có những thứ không nên chạm vào."
 story.401.desc.gesta: "Một đám mây các hạt tích tụ, mang năng lượng khổng lồ và tự chủ chuyển động."
 story.401.a.spiri: "Dù có liên quan đến thần linh hay không, ta vẫn phải nghiên cứu nó."
 story.401.b.spiri: "Cứ giao việc này cho các chỉ huy."
 story.401.c: "Chỉ quan sát từ xa."
 story.401.d: "Cứ giao việc này cho các chỉ huy."
 story.401.e: "Có lẽ nên tiêu diệt nó."
 story.405.name: "Hư không dần sáng tỏ"
 story.405.desc.spiri: "Hư Không Vân là những kẻ quan sát vũ trụ, ra đời từ thuở sơ khai, chứng kiến các ngôi sao tỏa sáng và hành tinh hình thành. Chúng nhắc nhở ta về sự nhỏ bé của chính mình."
 # +6 nghiên cứu vật lý, +10% sát thương vs mây
 story.405.desc: "Hư Không Vân là những thực thể cổ xưa nhất, hình thành chỉ vài tỷ năm sau khi vũ trụ ra đời. Chúng lẽ ra đã thành sao nhưng không phải. Trí thông minh bản năng của chúng bắt nguồn từ từ trường cực mạnh gắn kết các hạt bụi, giống như mạng thần kinh. Dù cách xa nhau, chúng vẫn gửi xung tín hiệu cho nhau, có thể là qua hiện tượng rối lượng tử."
 story.405.desc.gesta: "Những đám mây này dường như liên lạc với nhau qua các xung tín hiệu, có thể liên quan đến rối lượng tử."
 story.405.a.spiri: "Hãy giữ lòng khiêm nhường."
 story.405.a.spiri.tooltip: "Thêm bổ trợ §Y Thiết kế Vĩ đại §! cho §Y Đế chế §!:\n £happiness£ Hạnh phúc: §G +5% §!"
 story.405.b: "Chúng đừng hòng cản bước ta."
 story.405.b.tooltip: "Thêm bổ trợ §Y Kẻ dọn mây §! cho đế chế:\n Sát thương lên Hư Không Vân: §G +10% §!"
 story.405.c: "Chúng ta có thể truy vết các xung này không?"
 story.405.c.tooltip: "Thêm các hệ sao nghi vấn có §Y Hư Không Vân §! vào Nhật ký Tình báo."
 story.410.name: "Mây đen bao phủ"
 # bổ trợ đế chế -10% hạnh phúc trong 3 năm, +10% sát thương vs mây
 story.410.desc.spiri: "Hư Không Vân đã bị tiêu diệt nhưng ta cũng phải trả giá. Trước khi từ trường sụp đổ, thủy thủ đoàn đều cảm thấy tận thế sắp đến. Có lẽ ta đã sai."
 story.410.desc: "Ta đã chiến thắng Hư Không Vân dù tổn thất không nhỏ, chinh phục được một trong những bí ẩn đáng sợ nhất thiên hà."
 story.410.desc.gesta: "Chúng ta đã chinh phục được một trong những bí ẩn lớn nhất với cái giá đắt đỏ."
 story.410.a.spiri: "Ta còn chẳng biết mình sai ở đâu, làm sao bù đắp?"
 story.410.b: "Hôm nay là một ngày đáng nhớ."
 story.501.name: "Tiyanki"
 story.501.desc.spiri: "Các thánh nhân gọi thực thể trôi nổi này là '§Y Tiyanki §!'. Chúng là sinh vật không gian hiền lành và thiêng liêng, du hành qua các hệ sao bằng cách vào hạ tầng không gian và ăn khí từ các hành tinh khí khổng lồ."
 story.501.desc: "Tiyanki rất ôn hòa, có thể vào không gian phụ thấp chiều để di chuyển dễ dàng. Chúng ăn khí ở tầng thượng lưu khí quyển, gần như không bao giờ chủ động tấn công. Cứ việc phớt lờ chúng."
 story.501.desc.gesta: "Sinh vật '§Y Tiyanki §!' rất phục tùng, chúng ăn khí từ các hành tinh khí và không chủ động tấn công."
 story.501.a.spiri: "Thật đáng ngưỡng mộ."
 story.501.a.mater: "Săn chúng cũng chẳng được lợi lộc gì."
 story.501.a.exploratobot: "Đã đăng ký sinh vật không gian ôn hòa!"
 galactic_features.361.name: "Hậu duệ hôi thối"
 galactic_features.361.desc: "Sau khi hạm đội tại [From.From.From.GetStarName] bị quét sạch, Hư Không Vân ở đó đã gom đủ vật chất để thực hiện phân đôi vô tính. Giờ đây lại có thêm một Hư Không Vân nữa đang săn lùng."
 galactic_features.361.a: "Đáng sợ."
 galactic_features.361.a.milit: "Kinh hãi."
 galactic_features.361.a.phobe: "Gớm ghiếc."
 galactic_features.361.a.phile: "Thật quyến rũ."
 galactic_features.361.a.spiri: "Thần linh sẽ bảo vệ chúng ta."
 galactic_features.361.a.mater: "Đã rõ."
 galactic_features.361.a.tooltip: "§R Hư Không Vân §! đã xuất hiện tại hệ sao §Y [From.From.From.GetStarName] §!."
 ####################################
 # Sự kiện Khai hóa
 ####################################
 # Tìm thấy loài Tiền trí tuệ
 #uplift.6000.name.1: "Tìm thấy loài có thể Khai hóa"
 uplift.6000.name.2: "Phát hiện loài Tiền trí tuệ"
 uplift.6000.continental.desc: "Những sinh vật thú vị đang lang thang khắp các đồng bằng và bờ biển của [From.GetName]. [Root.GetName] báo cáo rằng dạng sống [presapient_species.GetSpeciesClass] này đang sử dụng công cụ, dù quy mô hiện còn hạn chế, nhưng về lâu dài chúng có tiềm năng đạt tới mức độ của một loài có trí tuệ.\n\n[Owner.GetScientistCapital][Root.GetLeaderName] nhấn mạnh rằng việc phát hiện sự sống ngoài hành tinh ở trạng thái này là một cơ hội hiếm có. Nếu chúng ta chọn khai hóa chúng, chúng có thể trở nên rất hữu dụng."
 uplift.6000.ocean.desc: "Theo lời [Root.GetName], một loài [presapient_species.GetSpeciesClass] bản địa của [From.GetName] không chỉ bước đầu làm chủ được đại dương bao la của hành tinh này mà còn chiếm lĩnh cả những dải đất nhỏ rải rác trên bề mặt.\n\n[Owner.GetScientistCapital][Root.GetLeaderName] đề xuất chúng ta nên theo dõi sát sao sự phát triển của chúng và hỗ trợ chúng tiến tới con người hoàn thiện về trí tuệ nếu có thể."
 uplift.6000.tropical.desc: "Trong những tán rừng nhiệt đới rậm rạp của [From.GetName] ẩn chứa thứ mà [Owner.GetScientistCapital][Root.GetLeaderName] của [Root.GetName] gọi là một 'tiền văn minh'.\n\nCác sinh vật [presapient_species.GetSpeciesClass] tạo nên xã hội sơ khai này vẫn còn tụt hậu xa so với tiến trình tiến hóa, nhưng họ đã xây dựng nền tảng xã hội dựa trên ngôn ngữ và tư duy trừu tượng đang dần hình thành.\n\n[Owner.GetScientistCapital][Root.GetLeaderName] gợi ý rằng những sinh vật đặc biệt này có thể trở thành nền tảng thực nghiệm phù hợp cho các công nghệ thúc đẩy tiến hóa nhanh."
 uplift.6000.arid.desc: "Một loài [presapient_species.GetSpeciesClass] trên [From.GetName] đang thể hiện trí thông minh khác thường. Giữa môi trường khô cằn và đầy sỏi đá của hành tinh, những sinh vật này đã tiến hóa để thống trị môi trường sống của mình. Các thử nghiệm của [Owner.GetScientistCapital][Root.GetLeaderName] từ [Root.GetName] cho thấy rằng với công nghệ phù hợp, tốc độ tiến hóa của chúng có thể được đẩy nhanh đáng kể."
 uplift.6000.desert.desc: "Băng qua những sa mạc trên [From.GetName], dạng sống [presapient_species.GetSpeciesClass] thú vị này thể hiện những đặc điểm tiềm năng để tiến hóa thành loài có lý tính cao cấp.\n\nDù tiến trình phát triển của loài này dường như đã dậm chân tại chỗ suốt hàng nghìn năm qua, chúng ta có thể tạo ra một cú hích công nghệ cho sự tiến hóa của chúng."
 uplift.6000.savannah.desc: "Trên những thảo nguyên của [From.GetName], chúng ta quan sát thấy những sinh vật cao lớn, thanh tú đang thực hiện các hình thức giao tiếp sơ khai, hợp tác tìm kiếm thức ăn và lẩn tránh thú săn mồi trên hành tinh. [Owner.GetScientistCapital][Root.GetLeaderName] của [Root.GetName] tin rằng những sinh vật [presapient_species.GetSpeciesClass] này có thể thích hợp với các công nghệ nhằm nâng cao tốc độ tiến hóa."
 uplift.6000.tundra.desc: "Môi trường khắc nghiệt thường thúc đẩy sự tiến hóa đầy tính thích nghi, và vùng băng giá trên [From.GetName] không phải ngoại lệ.\n\n[Owner.GetScientistCapital][Root.GetLeaderName] đặc biệt quan tâm đến một trong những loài [presapient_species.GetSpeciesClass] có khả năng trượt điêu luyện trên bề mặt đóng băng của hành tinh. Chỉ cần một cú hích nhẹ đúng hướng, chúng thậm chí có thể đạt tới trí tuệ thực thụ."
 uplift.6000.arctic.desc: "Dù nhiệt độ trên [From.GetName] quanh năm dưới âm độ, nhưng nơi này không hề khó sống hay cằn cỗi.\n\nNhiều loài [presapient_species.GetSpeciesClass] đã tiến hóa để chống chịu được môi trường này, và [Owner.GetScientistCapital][Root.GetLeaderName] tin rằng chỉ cần đưa vào một tác động ngoại cảnh cụ thể, một hoặc nhiều loài trong số này sẽ có khả năng đạt tới trí tuệ..."
 uplift.6000.alpine.desc: "Thực tế chứng minh dãy núi trập trùng trên [From.GetName] đã tạo ra môi trường màu mỡ cho những dạng sống độc đáo của hành tinh này. Đặc biệt là một loài [presapient_species.GetSpeciesClass] đã thích nghi với độ cao cực hạn, thậm chí bắt đầu có hình thức giao tiếp cơ bản qua âm thanh. Với sự tác động đúng đắn, những sinh vật này cuối cùng có thể đạt tới trí tuệ hoàn chỉnh."
 uplift.6000.nuked.desc: "Dù hành tinh này tràn ngập phóng xạ chết chóc, nhưng ít nhất một dạng sống tiên tiến vẫn đang sinh sôi mạnh mẽ trên [From.GetName]. [Owner.GetScientistCapital][Root.GetLeaderName] báo cáo rằng sinh vật [presapient_species.GetSpeciesClass] này thể hiện khả năng ra quyết định tập thể đầy ấn tượng, và các tác động từ bên ngoài có thể thúc đẩy chúng đạt tới tầm cao tiến hóa lớn hơn."
 uplift.6000.gaia.desc: "Môi trường trên [From.GetName] gần như hoàn hảo cho sự tiến hóa; nguồn tài nguyên dồi dào đã tạo nên một mái ấm trù phú cho các quần thể động thực vật đa dạng. Trong thiên đường này, [Owner.GetScientistCapital][Root.GetLeaderName] đã phát hiện ra một xã hội nguyên thủy của loài [presapient_species.GetSpeciesClass] thông minh, có thể trở thành ứng cử viên tuyệt vời cho việc tiến hóa nhanh."
 uplift.6000.relic.desc: "Giữa những tòa tháp đổ nát và những con phố đầy bụi bặm trên [From.GetName], một dạng sống tiền trí tuệ thú vị đang lang thang. [Owner.GetScientistCapital][Root.GetLeaderName] cho rằng những sinh vật [presapient_species.GetSpeciesClass] nhỏ nhắn và thông minh này có thể từng được nuôi làm thú cưng. Theo giả thuyết này: sau khi loài chủ của chúng sụp đổ, những con vật này đã tiến hóa nhanh chóng, và nếu có các yếu tố ngoại cảnh phù hợp, chúng hiện đã đủ điều kiện để đạt tới trí tuệ hoàn chỉnh."
 uplift.6000.fallback.desc: "Theo [Root.GetName], một loài [presapient_species.GetSpeciesClass] bản địa của [From.GetName] đã bước đầu làm chủ được môi trường hành tinh.\n\n[Owner.GetScientistCapital][Root.GetLeaderName] đề xuất giám sát chặt chẽ sự phát triển của chúng, và nếu có thể, hãy khai hóa chúng để đạt tới trạng thái có trí tuệ hoàn chỉnh."
 uplift.6000.wilderness.desc: "[Root.GetName] phát hiện có dạng sống thông minh đang sinh sống trên [from.GetName]. Dù thiếu sự dẫn dắt từ trí tuệ cộng sinh, loài [presapient_species.GetSpeciesClass] này đã đạt tới mức độ kiểm soát môi trường đáng kể.\n\nChúng ta sẽ tiếp tục theo dõi sát sao sự phát triển của sinh vật này, biết đâu một ngày nào đó sẽ sát nhập chúng vào đế chế. Sự xuất hiện của những sinh vật này báo hiệu tiềm năng thức tỉnh của [from.GetName]."
 uplift.6000.a: "Đúng vậy, chúng ta có kiến thức đó."
 uplift.6000.b: "Để sau đi."
 uplift.6000.nomads: "Đón họ lên tàu."
 # Khai hóa Tiền trí tuệ thành công
 uplift.6010.name: "Khai hóa thành công"
 uplift.6010.continental.desc: "Loài thống trị trên [Root.GetName], [From.GetName], đã được khai hóa. Chỉ cần một chút can thiệp gen là đủ để giải phóng tiềm năng tiềm ẩn bên trong chúng, khiến khả năng nhận thức và sự linh hoạt trong thao tác của chúng được nâng cao đáng kể, trong khi các thành viên thuộc thế hệ cũ sẽ được lắp đặt các bộ phận cơ khí nhỏ."
 uplift.6010.ocean.desc: "Công việc thúc đẩy tiến hóa của chúng ta cho loài [From.GetName] theo hướng có lợi đã đạt được thành công vang dội. Các chương trình giáo dục đã được triển khai cho những cá thể trẻ nhất — giờ đã là những con người thực thụ — trong khi những thế hệ trước của chúng có thể được điều chỉnh tâm lý bằng công nghệ gen."
 uplift.6010.tropical.desc: "[From.GetName] đã được khai hóa thành công, trở thành những cư dân [Root.Owner.GetName] thực thụ và định cư trong thuộc địa mà chúng ta thiết lập trên hành tinh nhiệt đới [Root.GetName]."
 uplift.6010.arid.desc: "Thành công rồi!\n\nLoài [From.GetName] bản địa tại [This.GetName] đã được khai hóa thành dân cư của [This.Owner.GetName]."
 uplift.6010.desert.desc: "[From.GetName] giờ đây chính là bằng chứng cho năng lực công nghệ của [Root.Owner.GetName]."
 uplift.6010.savannah.desc: "Công việc khai hóa [From.GetName] đạt hiệu quả rõ rệt: chỉ cần sửa đổi một chút mã gen của chúng, chúng ta đã dẫn dắt chúng tiến hóa thành những cộng sự có khả năng nhận thức."
 uplift.6010.tundra.desc: "[From.GetName] giờ đã là sinh vật có trí tuệ, và khá thông minh.\n\nChúng hiện đang nằm dưới sự cai trị của [Root.Owner.GetName]."
 uplift.6010.arctic.desc: "Loài [From.GetName] sinh sống trên những đồng bằng băng giá của [Root.GetName] đã đạt được khả năng nhận thức với sự giúp đỡ từ [Root.Owner.GetSpeciesName].\n\nGiờ đây chúng đã gia nhập thuộc địa của chúng ta trên hành tinh [Root.GetName] và trở thành một phần của xã hội [Root.Owner.GetName]."
 uplift.6010.alpine.desc: "Chúng ta đã cải tạo gen cho [From.GetName], giúp loài này tiến hóa tới trí tuệ hoàn chỉnh thành công. Giờ đây, khi chúng nhìn lên bầu trời sao từ những dãy núi hiểm trở, chúng đã có cảm nhận chân thực hơn về bản thân."
 uplift.6010.nuked.desc: "Từ khởi đầu khiêm tốn, [From.GetName] đã tiến hóa để có thể gia nhập [Root.Owner.GetName]."
 uplift.6010.gaia.desc: "Nhờ vào nỗ lực của chúng ta, [From.GetName] đã được khai hóa thành công. Thật là phúc lành khi có thể khiến chúng hiểu rõ bản thân đang sống trong một thiên đường như thế nào."
 uplift.6010.relic.desc: "Nhìn quanh hành tinh di tích của mình, loài thống trị trên [Root.GetName] đã thức tỉnh sau giấc ngủ dài. Công việc khai hóa chúng tới trí tuệ hoàn chỉnh đã trở thành một thành công rực rỡ."
 uplift.6010.fallback.desc: "[From.GetName] đạt được trí tuệ hoàn chỉnh thông qua khai hóa, hiện đang là minh chứng sống cho năng lực khoa học và công nghệ của [Root.Owner.GetName]."
 uplift.6010.a: "[This.Owner.GetName] rất chào đón chúng."
 uplift.6010.tt: "§Y[This.Owner.GetName]§! nhận được §Y50$r_influence$§!."
 ####################################
 # Sự kiện Theo dõi
 ####################################
 uplift.7000.name: "Đứng dậy và Tiếp bước"
 uplift.7000.desc: "[From.From.From.GetName] đã chung sống với chúng ta được một thời gian.\n\nTình hình trên hành tinh [From.GetName] hiện tại vẫn ổn định."
 uplift.7010.name: "Khởi đầu khó khăn"
 uplift.7010.desc: "Việc sát nhập loài [From.From.From.GetName] đã được khai hóa diễn ra thuận lợi hơn dự kiến, nhưng chưa đạt đến mức chúng ta mong đợi.\n\nDù chúng ta đã cố gắng định hình tâm lý cho [From.From.From.GetName], nhưng họ vẫn chưa hoàn toàn thích nghi được với cách thức làm việc của chúng ta tại [From.Owner.GetName]."
 ####################################
 # Sự kiện Tư tưởng
 ####################################
 #From = planet
 #From.From.From = uplifted species
 uplift.7200.name: "Tập trung nội tại"
 uplift.7200.desc: "Khá nhiều công dân [From.From.From.GetName] dường như không hài lòng với những học thuyết vũ trụ mà chúng ta giảng dạy.\n\nMột cá nhân hoặc tổ chức ẩn danh nào đó đang lan truyền thông tin sai lệch, thổi phồng tầm quan trọng của [From.From.From.GetName] cũng như việc [Root.Owner.GetName] thực hiện khai hóa cho họ."
 uplift.7200.a: "Chuyện này chắc chắn sẽ tự lắng xuống thôi."
 uplift.7200.b: "Cứ để họ giữ lại những niềm tin huyền bí của riêng mình."
 uplift.7200.b.tooltip: "[From.From.From.GetName] nhận được tư tưởng §YChủ nghĩa Duy tâm§!."
 uplift.7200.c: "Bằng mọi giá phải đưa họ trở lại con đường đúng đắn."
 uplift.7200.c.tooltip: "[From.From.From.GetName] nhận được tư tưởng §YChủ nghĩa Duy vật§!."
 uplift.7205.name: "Những người từ chối nhập ngũ"
 uplift.7205.desc: "Do sự căm ghét vũ khí của người dân [From.From.From.GetName], người dân trên [Root.GetName] đã đệ trình thỉnh nguyện chính thức về việc thiết lập các khu vực phi chiến sự."
 uplift.7205.a: "Được thôi."
 uplift.7205.b: "Sự dũng cảm kiên định với niềm tin của họ rất đáng khen ngợi."
 uplift.7205.b.tooltip: "[From.From.From.GetName] nhận được tư tưởng §YChủ nghĩa Hòa bình§!."
 uplift.7205.c: "Họ phải hiểu rằng bóng ma chiến tranh luôn bao trùm lấy chúng ta."
 uplift.7205.c.tooltip: "[From.From.From.GetName] nhận được tư tưởng §YChủ nghĩa Quân phiệt§!."
 uplift.7210.name: "Khủng hoảng người lạ"
 uplift.7210.desc: "Theo các báo cáo, những công dân [From.From.From.GetName] vừa được khai hóa trên [Root.GetName] bắt đầu lo lắng khi những người thầy [Root.Owner.GetSpeciesName] của họ đề cập đến khả năng giao tiếp với các thực thể không xác định ngoài không gian."
 uplift.7210.a: "Tôi hiểu rồi..."
 uplift.7210.b: "Cái gọi là sinh vật ngoài hành tinh đối với chúng ta chỉ là một cơ hội khác mà thôi."
 uplift.7210.b.tooltip: "[From.From.From.GetName] nhận được tư tưởng §YChủ nghĩa Thân ngoại§!."
 uplift.7210.c: "Nỗi sợ hãi những điều chưa biết của họ là hoàn toàn bình thường."
 uplift.7210.c.tooltip: "[From.From.From.GetName] nhận được tư tưởng §YChủ nghĩa Bài ngoại§!."
 uplift.7215.name: "Biến đổi nội bộ"
 uplift.7215.desc: "Dù [Root.Owner.GetName] đã cung cấp một khuôn khổ cấu trúc khá khả thi để điều chỉnh trật tự xã hội của họ, nhưng có vẻ nó không phù hợp với loài [From.From.From.GetName] vừa được khai hóa.\n\nViệc trí tuệ của họ đột nhiên ngang bằng với chúng ta đã tước đi tiềm năng phát triển văn hóa xã hội kéo dài hàng nghìn năm. Do đó, trật tự xã hội của [From.From.From.GetName] cực kỳ bất ổn; chẳng hạn hôm nay họ tôn thờ gia tộc, ngày mai các lãnh đạo cộng đồng có thể tuyên bố hủy bỏ mọi mối quan hệ huyết thống."
 uplift.7215.a: "Thật thú vị."
 uplift.7215.b: "Hy vọng [From.From.From.GetName] có thể tìm thấy giá trị của bản thân giữa đồng loại."
 uplift.7215.b.tooltip: "[From.From.From.GetName] nhận được tư tưởng §YChủ nghĩa Uy quyền§!."
 uplift.7215.c: "Chỉ khi tự chủ độc lập mới có thể thực hiện giá trị bản thân."
 uplift.7215.c.tooltip: "[From.From.From.GetName] nhận được tư tưởng §YChủ nghĩa Bình đẳng§!."
 ####################################
 # Sự kiện Tương tác với Dân cư Tiền trí tuệ
 ####################################
 uplift.7500.name: "Phá hoại"
 uplift.7500.desc: "Một nhóm loài chưa khai hóa trên [From.GetName] không rõ bằng cách nào đã lọt vào khu vực cách ly an ninh ở ngoại vi thuộc địa của chúng ta. Dù đã bị đuổi đi ngay sau đó, nhưng chúng đã gây hư hại nghiêm trọng cho vài tuyến vận tải liên sao chuyên trách vận chuyển tiền tệ của chúng ta.\n\nE rằng chúng ta sẽ mất vài trăm Năng lượng."
 uplift.7510.name: "Thực nghiệm thực thể sống"
 uplift.7510.desc: "Các nhà nghiên cứu sinh vật ngoài hành tinh trên [Root.GetName] đã công bố một bức thư ngỏ, yêu cầu cơ quan lập pháp địa phương dỡ bỏ các hạn chế về việc tiếp cận và thực nghiệm trên các sinh vật thông minh.\n\nHọ trình bày quan điểm từ góc độ nghiên cứu, cảnh báo rằng nếu luật pháp không được sửa đổi, hiệu suất thực nghiệm của toàn bộ nhóm nghiên cứu trên [Root.GetName] sẽ sụt giảm.\n\nNhững vấn đề đạo đức liên quan vẫn còn đang gây tranh cãi."
 uplift.7510.a: "Phớt lờ những kẻ tự phụ đó đi."
 uplift.7510.a.tooltip: "Các nhà khoa học địa phương sẽ rất không hài lòng về việc này."
 uplift.7510.b: "Chúng ta sẽ chấp nhận đề nghị của họ."
 uplift.7510.b.tooltip: "Cư dân địa phương sẽ rất không hài lòng về việc này."
 uplift.7510.c: "Đạo đức? Chúng ta không quan tâm đến số phận của các loài thấp kém."
 uplift.7510.c.tooltip: "§YĐế chế của bạn§! nhận được tư tưởng §YChủ nghĩa Bài ngoại Cực đoan§!.\n"
 uplift.7520.name: "Sự bất an"
 uplift.7520.desc: "Các sinh vật cận trí tuệ trên [Root.GetName] đang gây rối ở ngoại vi thuộc địa của chúng ta. Sự hiện diện của [Root.Owner.GetName] dường như đã chọc giận chúng, chúng liên tục chạy qua lại giữa ranh giới thuộc địa và một địa điểm nào đó ở phía đông."
 uplift.7520.a: "Đuổi chúng đi, cố gắng không dùng vũ lực."
 uplift.7520.a.tooltip: "Các sinh vật địa phương sẽ không còn quấy rầy cư dân thuộc địa nữa."
 uplift.7520.b: "Dùng vũ lực để dạy cho lũ súc vật ngu ngốc này một bài học."
 uplift.7520.b.tooltip: "Lũ sinh vật xấu xí đó sẽ không bao giờ làm phiền cư dân thuộc địa nữa."
 uplift.7520.c: "Cố gắng tìm hiểu xem chúng đã đi đâu."
 uplift.7525.name: "Mất mát vĩnh viễn"
 uplift.7525.desc: "Một nhóm nhà nghiên cứu dị chủng cùng một đội quân sự đã rời khỏi thuộc địa để truy tìm tung tích các sinh vật địa phương.\n\nThứ họ tìm thấy là mảnh vỡ của một con tàu gieo mầm cổ xưa, rõ ràng là cốt lõi của một văn minh [Owner.GetPreFTLLower] nhỏ bé nào đó, vốn đã lụi tàn từ lâu.\n\nLoài thống trị bản địa trên [Root.GetName] dường như là sản phẩm của một chương trình gieo mầm hoặc chỉnh sửa gen cổ xưa; dựa trên cấu trúc xung quanh tàu gieo mầm, rõ ràng chúng từng tồn tại dưới dạng bộ lạc, sở hữu trí tuệ cao hơn, thậm chí có cả ngôn ngữ viết cơ bản.\n\nChúng ta không thể đoán được điều gì đã khiến chúng bị thoái hóa giống loài, nhưng bản thân hành vi của chúng lại mang nhiều ý nghĩa hơn. Chúng gần như cảm nhận theo bản năng rằng [Root.Owner.GetSpeciesNamePlural] chúng ta tương đồng với những 'người khai sáng' ban đầu của chúng từ giữa các vì sao. Có lẽ xã hội có trật tự của chúng ta đã đánh thức một xung lực tạo dựng trật tự nào đó vốn bị vùi lấp bởi bản tính thấp kém hơn của chúng.\n\nCó lẽ cuối cùng chúng ta có thể xoa dịu nỗi lo âu tiến hóa của chúng bằng cách khai hóa chúng lên ngang tầm với mình, nhưng hiện tại, chúng ta đã có được những hiểu biết quý giá về việc thao túng các thực thể hữu cơ của các nền văn hóa không gian cổ đại."
