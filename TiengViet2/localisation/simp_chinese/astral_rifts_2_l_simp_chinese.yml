 #####################
 #Abandoned Complex #
 #####################
 astral_rift_research_lab: "Cơ Sở Bị Bỏ Hoang"
 astral_rift.2000.name: "Cơ Sở Bị Bỏ Hoang"
 astral_rift.2000.desc: "Chúng ta đang ở trong một cơ sở nghiên cứu bị bỏ hoang.\n\nBề mặt căn phòng phủ lớp bụi dày, cho thấy nơi này đã lâu không có ai lui tới.\n\nChúng ta không tìm thấy bất kỳ nhà nghiên cứu nào, dù còn sống hay đã chết. Bất kể ai từng quản lý nơi này, họ đều đã rời đi từ lâu.\n\nDọc theo các bức tường là những chiếc kệ kiên cố, mỗi kệ đặt một quả trứng khổng lồ. Hầu hết chúng đang trong nhiều giai đoạn thối rữa khác nhau, nhưng vẫn còn vài mẫu vật sống.\n\nGiữa phòng có một thùng chứa mở nắp, chứa đầy thứ chất lỏng nhớt màu nhợt nhạt. Phân tích cho thấy nó chứa hàm lượng lớn protein và axit amin. Dựa vào cặn dính trên vài quả trứng, chúng ta đoán rằng các nhà nghiên cứu đã tiêm chất dịch này vào trong trứng."
 astral_rift.2000.a: "Tìm kiếm người quản lý."
 astral_rift.2000.b: "Đập vỡ một quả trứng."
 astral_rift.2010.name: "Ký Sinh Trùng Lượng Tử"
 astral_rift.2010.desc: "Chúng ta đã đập vỡ quả trứng trông khỏe mạnh nhất.\n\nPhôi thai bên trong có vẻ suy dinh dưỡng và bị bủa vây bởi các ký sinh trùng lạ.\n\nĐáng chú ý, những ký sinh trùng này sở hữu đặc tính lượng tử độc đáo mà chưa sinh vật nào từng có. Chúng dịch chuyển ngẫu nhiên bên trong vỏ trứng, thậm chí chui vào tận trong phôi thai. Do cơ sở này chỉ còn lại rất ít trứng sống, mẫu vật đặc biệt này hẳn phải có sức đề kháng vượt trội trước bầy ký sinh trùng.\n\nTheo dấu vết Tinh thể của cả hai sinh vật cho thấy, đám ký sinh này bắt nguồn từ một chiều không gian xa xôi và khác biệt. Chúng ta tin rằng chúng vô tình bị triệu hồi đến đây, làm gián đoạn công việc nghiên cứu của cơ sở này.\n\nChúng ta thấy chúng bị thu hút bởi thùng chất lỏng kỳ lạ giữa phòng. Có lẽ đây chính là thứ ban đầu đã dẫn dụ chúng tới."
 astral_rift.2010.a: "Tiêm chất lỏng vào trứng."
 astral_rift.2010.b: "Tiêu hủy các sinh vật còn lại."
 astral_rift.2015.name: "Người Quản Lý"
 astral_rift.2015.desc: "Chúng ta đã tìm thấy những người quản lý nơi này. Nói đúng hơn là tìm thấy phần còn lại của họ.\n\nMột căn phòng gần đó chất đống xác chết. Tứ chi của họ đã bị xé toạc hoàn toàn ở cấp độ nguyên tử bởi một thế lực vô danh nào đó. Vài cái xác còn bị dung hợp một nửa vào tường.\n\nTrên bàn kiểm tra giữa phòng có một đống trứng hầu hết đã bị mổ xẻ. Chỉ một quả duy nhất còn nguyên vẹn.\n\nĐem thi thể của những người quản lý về nghiên cứu tử tế hẳn sẽ giúp chúng ta hiểu rõ hơn chuyện gì đã xảy ra tại đây."
 astral_rift.2015.a: "Đập vỡ một quả trứng."
 astral_rift.2015.b: "Đặt thi thể về chỗ cũ."
 astral_rift.2020.name: "Trao Đổi Chất"
 astral_rift.2020.desc: "Việc tiêm chất lỏng nhợt nhạt vào phôi thai đang lộ ra đã mang lại vài kết quả thú vị.\n\nMặc cho sự hiện diện của ký sinh trùng lượng tử, mẫu vật từng thoi thóp trước đó đã tràn đầy sinh lực trở lại. Có lẽ chúng ta đã tính sai liều lượng. Chỉ trong chốc lát, một sinh vật phát triển hoàn thiện hơn bắt đầu cào vào vỏ trứng — lớp vỏ giờ đã mọc chi chít nhiều tầng gai và vảy giáp.\n\nTuy nhiên, lũ ký sinh trùng cũng bị kích thích. Khi chúng liên tục dịch chuyển ra vào phôi thai, các mô của sinh vật này cũng bị tổn thương. Với tốc độ này, nó rất dễ bỏ mạng.\n\nChúng ta đoán rằng, nếu tiêm thêm một chút Sợi Tinh Thể (Astral Thread) thì có thể xoa dịu đám ký sinh lượng tử và ngăn chặn tổn thương tiếp diễn."
 astral_rift.2020.a: "Không can thiệp."
 astral_rift.2020.b: "Tiêm Sợi Tinh Thể."
 astral_rift.2025.name: "Trợ Tử"
 astral_rift.2025.desc: "Sinh vật này không còn hy vọng hồi phục. Lũ ký sinh trùng bám trong trứng quá nguy hiểm, không thể để chúng lọt ra ngoài rạn nứt này.\n\nTuân theo quy trình kiểm soát ô nhiễm nghiêm ngặt, chúng ta đã dùng axit clohydric để tiêu hủy mọi mẫu vật quanh đây. Chúng ta sẽ mang vài mảnh mẫu về để nghiên cứu thêm."
 astral_rift.2025.a: "Lựa chọn khôn ngoan."
 astral_rift.2025.b.evopred: "Độ axit cao lại làm món này thêm phần đậm đà."
 astral_rift.2030.name: "Sự Bất Ổn Sinh Học"
 astral_rift.2030.desc.end: "Sự lây nhiễm lượng tử bất ổn này chắc chắn đã phá hỏng mọi thí nghiệm mà cơ sở này định thực hiện.\n\nDù vậy, những quan sát tại đây đã giúp chúng ta hiểu sâu hơn về khía cạnh sinh học trong những điều kiện cực kỳ bất ổn."
 astral_rift.2030.desc.default: "Phôi thai đã phân rã.\n\nĐúng như dự đoán, đám ký sinh bên trong đã nhanh chóng xé xác nó ra thành nhiều mảnh theo các hướng ngẫu nhiên.\n\n$astral_rift.2030.desc.end$"
 astral_rift.2030.desc.injected: "Phôi thai đã phân rã.\n\nMặc cho những nỗ lực ổn định mẫu vật, đám ký sinh bên trong vẫn nhanh chóng xé xác nó ra thành nhiều mảnh ngẫu nhiên.\n\n$astral_rift.2030.desc.end$"
 astral_rift.2030.a: "Thật thú vị."
 astral_rift.2030.b.evopred: "Phần ăn thập cẩm."
 astral_rift.2035.name: "Vũ Khí Sinh Học"
 astral_rift.2035.desc: "Thử nghiệm đã thành công.\n\nSợi Tinh Thể mà chúng ta tiêm vào phôi thai đã kìm hãm được bầy ký sinh lượng tử.\n\nCon non phát triển hoàn toàn đã phá vỏ chui ra nguyên vẹn. Nó nghe lời một cách đáng ngạc nhiên và học các mệnh lệnh cơ bản rất nhanh. Dựa vào điều này, cộng với lớp da bọc giáp dày và những chiếc gai độc, chúng ta đoán rằng những sinh vật này được lai tạo để phục vụ chiến tranh.\n\nKỳ diệu hơn nữa, chúng còn thể hiện khả năng bước nhảy warp cự ly ngắn. Có vẻ như Sợi Tinh Thể đã hòa quyện sinh vật này cùng bầy ký sinh thành một kiểu cộng sinh đặc biệt.\n\nCó lẽ chúng ta vừa tạo ra một thứ cực kỳ nguy hiểm."
 astral_rift.2035.desc.exterminator: "$astral_rift.2035.desc$\n\nDải ngân hà nhỏ bé này sẽ bất lực biết bao trước những gì mà chúng ta sắp thả ra."
 astral_rift.2035.desc.non_pacifist: "$astral_rift.2035.desc$\n\nChúng ta sẽ mang về nhiều hơn thế nữa."
 astral_rift.2035.a: "Rất xuất sắc."
 astral_rift.2035.a.tooltip: "Có thể xây dựng lực lượng tấn công kiểu mới: §H$warpling_army$§!"
 astral_rift.2040.name: "Ký Sinh Trùng Lượng Tử"
 astral_rift.2040.desc: "Chúng ta đã hoàn tất việc thu thập thi thể của các nhà nghiên cứu và đưa về để tìm hiểu thêm.\n\nTrên người họ bám đầy ký sinh trùng lượng tử mang những đặc tính không giống bất kỳ sinh vật nào từng biết. Khả năng \"vặn xoắn\" vật chất một cách khó lường của chúng có lẽ chính là nguyên nhân gây ra cái chết cho vật chủ.\n\nTheo dấu Tinh thể cho thấy đám ký sinh này rõ ràng bắt nguồn từ một chiều không gian xa xôi. Chúng ta tin rằng chúng vô tình bị triệu hồi đến đây, mang theo sự tàn phá làm đình trệ công việc nghiên cứu ban đầu của cơ sở này.\n\nChúng ta đã nhanh chóng dùng axit clohydric để tiêu diệt mầm mống gây hại nhằm tránh ô nhiễm lây lan."
 astral_rift.2040.a: "Thật say mê."
 astral_rift.2045.name: "Phơi Nhiễm Chí Mạng"
 astral_rift.2045.desc: "[From.GetName] đã đột ngột qua đời. Nguyên nhân tử vong là do tiếp xúc với ký sinh trùng chết người đến từ phía bên kia rạn nứt [FromFrom.solar_system.GetName]. Bộ phận nghiên cứu của họ cũng đã bị cách ly để chờ khử trùng triệt để."
 astral_rift.2045.a.tooltip: "§Y[From.GetName]§! §Rđã tự phát nổ§!"
 #################
 # Cỗ Máy Cơ Khí #
 #################
 astral_rift_clock: "Cấu Trúc Cơ Khí"
 astral_rift.2100.name: "Bánh Răng Và Dây Xích"
 astral_rift.2100.desc: "Chúng ta đang bị bủa vây bởi một cấu trúc cơ khí khổng lồ.\n\nBánh răng và dây xích xoay chuyển khắp mọi hướng. Cứ mỗi một phần mười giây, cỗ máy lại đập mạnh lên một nhịp. Bề ngang mỗi chiếc răng cưa gần như bằng cả cái §Y$tech_rift_sphere$§! của chúng ta.\n\nTất cả đều ngự trị giữa trung tâm của một tinh vân với khí quyển đặc quánh và sương mù bất tận, không điểm đầu cũng chẳng có điểm cuối."
 astral_rift.2100.a: "Khám phá màn sương."
 astral_rift.2105.name: "Cỗ Máy Đa Chiều"
 astral_rift.2105.desc: "Cỗ máy đa chiều này vận hành chính xác hệt như chiếc đồng hồ tinh xảo nhất của chúng ta.\n\nMặc dù chưa hiểu rõ nguồn năng lượng của nó, nhưng chỉ cần khám phá một chút là chúng ta đã tìm thấy các đường hầm dẫn tới hàng loạt Rạn nứt Tinh thể.\n\nDù thứ này là gì, nó hẳn được tạo ra với một mục đích rõ ràng. Cỗ máy này có thể vươn đến vô số vũ trụ.\n\nSự chuyển động của các bộ phận khổng lồ tạo ra nhiễu loạn trong bầu khí quyển đặc quánh, khiến thiết bị của chúng ta khó lòng ổn định. Qua vài thao tác cơ bản, chúng ta có thể nới lỏng một trục quay và dùng nó để chèn cứng một cặp bánh răng đang xoay. Làm vậy sẽ khiến môi trường lắng dịu, để chúng ta có thể nghiên cứu cỗ máy vĩ đại này cẩn thận hơn."
 astral_rift.2105.a: "Can thiệp có thể là một hành động thiếu trách nhiệm."
 astral_rift.2105.b: "Chèn cứng bánh răng."
 astral_rift.2110.name: "Nếu không hỏng..."
 astral_rift.2110.desc: "Những người xây dựng không gian này sở hữu tri thức vượt xa chúng ta. Việc can thiệp vào các cơ chế này có thể gây ra hậu quả khó lường.\n\nBất chấp nhiễu loạn từ màn sương, chúng ta đã nán lại đủ lâu để thu thập những hiểu biết kỹ thuật hữu ích về cấu tạo chính xác của cỗ máy khổng lồ này, và cũng gom được kha khá vật chất Tinh thể.\n\nAi bảo trì không gian này chắc chắn phải là những kiến trúc sư vĩ đại."
 astral_rift.2115.name: "Kẹt Cứng"
 astral_rift.2115.desc: "Bánh răng đã bị kẹt.\n\nSau một cơn chấn động dữ dội, toàn bộ cỗ máy đã dừng lại. Cố gắng phá hoại của chúng ta đã thành công.\n\nKhi áp lực ngày càng tăng, một lõi vàng lộ ra bên dưới tấm lưới kim loại. Nó sáng bóng như mới, nhưng chúng ta chỉ có rất ít thời gian để chạm vào nó. Áp lực gia tăng chắc chắn sẽ sớm phá vỡ rào cản. Chúng ta đã bắt đầu quy trình trích xuất phần lõi vô cùng tinh vi này."
 astral_rift.2115.a: "Cẩn thận hành sự."
 astral_rift.2120.name: "Vỡ Nát"
 astral_rift.2120.desc: "Khi chúng ta cố lấy lõi vàng ra, bề mặt của nó nhanh chóng nứt toác. Chưa kịp lấy thì nó đã phát nổ dữ dội về mọi hướng.\n\nLõi vỡ giải phóng luồng năng lượng cường độ cao. Năng lượng phá vỡ rào cản, khiến những bánh răng khổng lồ quanh chúng ta bắt đầu quay cuồng điên loạn.\n\nChúng ta đã kích hoạt dây mỏ neo khẩn cấp để thoát khỏi tình cảnh tồi tệ này."
 astral_rift.2125.name: "Thành Công"
 astral_rift.2125.desc: "Chúng ta đã lấy thành công lõi vàng từ một trong những cỗ máy.\n\nNhững bánh răng xung quanh chìm vào một sự im lặng kỳ dị, và những sức ép lúc trước cũng tan biến hoàn toàn.\n\nMạng lưới Rạn nứt Tinh thể kết nối với thiết bị này ngừng rung động một cách rõ ràng, cứ như thể thời gian đang ngưng đọng. Chúng ta không thể đoán trước hậu quả của việc này.\n\nChúng ta đã kéo dây neo rời khỏi không gian này thành công. Lõi thu được có đặc tính thời gian rõ rệt mà chúng ta chỉ mới bắt đầu tìm hiểu."
 ####################
 # Bãi Rác Đa Chiều #
 ####################
 astral_rift_dimensional_dump: "Bãi Rác Đa Chiều"
 astral_rift.2200.name: "Cơ Thể Trôi Nổi"
 astral_rift.2200.desc: "Chúng ta đang bị rác thải bủa vây.\n\nThỉnh thoảng lại có những vết nứt mới mở ra xung quanh, xả thêm rác vào đống phế liệu đang quay cuồng. Dựa vào bản chất của các mảnh vỡ, chúng ta nhận định đây là bãi rác của một nền văn minh giữa các vì sao. Phụ tùng máy móc vô danh nằm rải rác lẫn lộn với những vật dụng dùng một lần của các gia đình ngoài hành tinh.\n\nNhìn chung, những thứ này chẳng có giá trị gì ngoài làm phế liệu. Tuy nhiên, cảm biến của chúng ta lại phát hiện ra dấu hiệu của sự sống bên trong.\n\nMột sinh vật lạ mặc bộ đồ du hành vũ trụ đang trong trạng thái ngủ đông. Không rõ nó đã trôi dạt ở đây bao lâu rồi."
 astral_rift.2200.a: "Đưa về để sơ cứu."
 astral_rift.2200.b: "Đưa về và lấy trang bị của nó."
 astral_rift.2205.name: "Cơ Thể Trôi Nổi"
 astral_rift.2205.common.1: "Đem tên người ngoài hành tinh trôi dạt trong đống rác đó về đúng là một sai lầm."
 astral_rift.2205.common.2: "Hắn nói một thứ ngôn ngữ mà chúng ta không thể hiểu, cứ chỉ chỏ liên tục vào bảng điều khiển của khối cầu và lặp đi lặp lại một cụm từ."
 astral_rift.2205.desc.help: "$astral_rift.2205.common.1$\n\nSau khi được phục hồi thân nhiệt và ổn định dấu hiệu sinh tồn, tên người ngoài hành tinh nhanh chóng tỉnh lại — khuôn mặt hắn đầy vẻ bối rối và thần kinh căng thẳng tột độ.\n\nHắn lập tức tóm lấy một người trong đội y tế của chúng ta, rút vũ khí từ đôi bốt ra và bắt họ làm con tin. $astral_rift.2205.common.2$"
 astral_rift.2205.desc.recover_gear: "$astral_rift.2205.common.1$\n\nChính bộ đồ vũ trụ này đã giữ cho gã ngoài hành tinh ở trạng thái ngủ đông. Ngay khi cởi ra, hắn nhanh chóng tỉnh dậy — khuôn mặt đầy vẻ bối rối và thần kinh căng thẳng tột độ.\n\nHắn lập tức tóm lấy một người trong đội y tế của chúng ta, rút vũ khí từ đôi bốt ra và bắt họ làm con tin. $astral_rift.2205.common.2$"
 astral_rift.2205.a: "Kết liễu hắn."
 astral_rift.2205.b: "Thử đàm phán."
 astral_rift.2210.name: "Cơ Thể Trôi Nổi"
 astral_rift.2210.common.1: "Nói chung, chúng ta đã tiêu diệt sinh vật hiếu chiến được kéo về từ đống rác đó."
 astral_rift.2210.common.2: "Chúng ta cũng đã có thừa thời gian để phân tích đống tài liệu trong trang bị của hắn. Dịch thuật sơ bộ cho thấy, hắn là một công nhân dọn rác thâm niên. Chắc hẳn hắn đã vô tình bị cuốn vào đống rác và không bao giờ có thể về nhà được nữa.\n\nTạm gác sinh vật đó sang một bên, chúng ta sẽ ở lại vết nứt này, xác nhận và thu gom càng nhiều phế liệu có giá trị càng tốt trước khi quay về."
 astral_rift.2210.desc.help: "$astral_rift.2210.common.1$\n\nMặc dù con tin bị bỏng nhẹ, nhưng phản ứng nhanh nhẹn của đội an ninh đã ngăn chặn thêm thương vong.\n\n$astral_rift.2210.common.2$"
 astral_rift.2210.desc.recover_gear: "$astral_rift.2210.common.1$\n\nVì trang bị của hắn đã bị lột sạch, việc dùng đạn plasma thông thường để kết liễu hắn chỉ là chuyện nhỏ.\n\n$astral_rift.2210.common.2$\n\nCòn bộ đồ chúng ta lấy được có cấu tạo cực kỳ tiên tiến, chúng ta định giữ lại để nghiên cứu thêm."
 astral_rift.2210.a: "Thật là một gã tội nghiệp."
 astral_rift.2215.name: "Hòa Hoãn"
 astral_rift.2215.desc: "Để thể hiện thiện ý, chúng ta đã hạ vũ khí. Đáp lại, người ngoài hành tinh này cũng thả [Explorer.GetCrewMember] của chúng ta ra và đặt vũ khí xuống. Hắn trông có vẻ rất xúc động và bối rối, nhưng trong tình cảnh này cũng là điều dễ hiểu.\n\nSau khi cho hắn chút thời gian bình tĩnh, hắn đã bắt đầu sẵn lòng giao tiếp với chúng ta.\n\nChúng ta bắt đầu tìm cách trò chuyện phù hợp. Dù tiến triển chậm, nhưng qua bản dịch sơ bộ từ những tài liệu hắn mang theo, người ngoài hành tinh này đã vài trăm tuổi rồi."
 astral_rift.2215.a: "Tuyệt vời."
 astral_rift.2220.name: "Thương Vong"
 astral_rift.2220.desc: "Trước khi chúng ta kịp kết liễu hoàn toàn gã người ngoài hành tinh thù địch này, hắn đã nhanh tay rút khẩu súng lục plasma từ bốt ra, giết chết con tin và vài thành viên thủy thủ đoàn khác.\n\nThật không may, [Leader.GetName] cũng nằm trong danh sách nạn nhân.\n\nChúng ta đã kéo dây mỏ neo khẩn cấp và cứu được những người bị thương.\n\nChúng ta cần dành chút thời gian để phân tích bộ đồ không gian của hắn. Nó được chế tạo từ hợp kim cực kỳ tiên tiến và hẳn sẽ rất hữu ích."
 astral_rift.2225.name: "Thợ Gom Rác Lạc Lối"
 astral_rift.2225.desc: "Tên của người ngoài hành tinh này là [astral_rift_dimensional_dump_leader_loc.GetName].\n\nTrong một lần trên đường xả rác vào chiều không gian này, [astral_rift_dimensional_dump_leader_loc.GetHeShe] vô tình vướng vào một vụ tai nạn. Động cơ không gian trên tàu của [astral_rift_dimensional_dump_leader_loc.GetHisHer] gặp trục trặc kỹ thuật cần phải sửa chữa thủ công, mà [astral_rift_dimensional_dump_leader_loc.GetHeShe] lại là người duy nhất có kỹ năng sửa chữa. Trong lúc đang sửa, [astral_rift_dimensional_dump_leader_loc.GetHeShe] trượt chân rơi vào máy nén không thời gian, rồi mất tích.\n\nHệ thống hỗ trợ sự sống trong bộ đồ vũ trụ tiên tiến của [astral_rift_dimensional_dump_leader_loc.GetHisHer] đã giữ cho [astral_rift_dimensional_dump_leader_loc.GetHimHer] chìm trong giấc ngủ dài hơn hai thế kỷ.\n\nMặc dù [astral_rift_dimensional_dump_leader_loc.GetName] rất đau buồn vì nhớ gia đình, nhưng [astral_rift_dimensional_dump_leader_loc.GetHeShe] cũng hiểu rằng chúng ta không có cách nào đưa [astral_rift_dimensional_dump_leader_loc.GetHimHer] về nơi mình đã sinh ra.\n\n[astral_rift_dimensional_dump_leader_loc.GetHeShe] sở hữu kỹ năng lái những con tàu tiên tiến ở mức thượng thừa, hẳn sẽ thích ứng rất tốt với chương trình huấn luyện hạm đội của chúng ta."
 astral_rift.2225.a: "Phi công tay nghề cao thì không bao giờ là thừa."
 astral_rift.2225.a.tt: "[event_target:astral_rift_dimensional_dump_leader_loc.GetName] sẽ được huấn luyện bài bản."
 astral_rift.2230.name: "[From.GetName] Huấn Luyện Hoàn Tất"
 astral_rift.2230.desc: "Sau quá trình rèn luyện nghiêm ngặt, [From.GetName] không chỉ chứng minh bản thân là một phi công xuất sắc mà còn giành được sự tín nhiệm của các sĩ quan. [From.GetHeSheCap] có thể trở thành một chỉ huy tài ba, hiện đã gia nhập và đang chờ phân công."
 astral_rift.2230.a: "Càng thêm hoàn hảo."
 ###########
 # Khởi Nguyên #
 ###########
 astral_rift_genesis: "Khởi Nguyên"
 genesis_insight_modifier: "Thấu Hiểu Khởi Nguyên"
 genesis_insight_modifier_desc: "Cuộc chạm trán với trí tuệ cao cấp trong không gian Tinh thể đã mang lại cho chúng ta cái nhìn sâu sắc độc đáo về sự hình thành và phát triển của các xã hội mới."
 astral_rift.2300.name: "Khởi Nguyên"
 astral_rift.2300.desc: "Cấu trúc môi trường ở đây không phải là vật chất. Quét sơ bộ cho thấy toàn bộ không gian này là một dạng trình chiếu đa chiều từ nguồn không xác định.\n\nNgay sau khi đến nơi, chúng ta đã nhận được một thông điệp bằng ngôn ngữ của mình. Không gian trước mắt tụ lại thành một dòng chữ.\n\n§E\"Ta không biết các ngươi.\"§!\n\nSau khi chúng ta giải thích xuất xứ của mình, thực thể đó tiếp tục:\n\n§E\"Thú vị thật. Tốt thôi. Chơi một trò chơi nhé. Ta sẽ làm đấng sáng thế.\"§!\n\nHình chiếu đa chiều tạo thành bức tranh mới. Trên một hành tinh cằn cỗi, một giống loài [explorer.GetPreFTLLower] đang chật vật sinh tồn. Nó đang cho chúng ta thấy sự ra đời của một nền văn minh non trẻ.\n\n§E\"Chúng ta nên ban cho họ phước lành nào đây?\"§!"
 astral_rift.2300.a: "Vũ trang cho họ sức mạnh."
 astral_rift.2300.b: "Tưới tẩm họ bằng tri thức."
 astral_rift.2300.c: "Chúng ta không rảnh chơi trò chơi. Kích hoạt xung điện từ."
 astral_rift.2305.name: "Phóng Chiếu Sức Mạnh"
 astral_rift.2305.desc: "Chỉ trong nháy mắt, nền văn minh ảnh ảo này đã tiến hóa qua nhiều thế kỷ.\n\n§E\"Con dân của chúng ta đã trở nên hùng mạnh.\"§!\n\nNền văn minh đang phát triển này dùng sức mạnh mới có để chinh phục thế giới tự nhiên. Họ tự gọi mình là [genesis_new_species_base.GetName].\n\n§E\"Tục ngữ có câu, một cây làm chẳng nên non. Các ngươi nghĩ họ nên chuẩn bị gì cho tương lai thì tốt nhất?\"§!"
 astral_rift.2305.a: "Cần lao động chăm chỉ."
 astral_rift.2305.b: "Cần thử nghiệm đổi mới."
 astral_rift.2310.name: "Trái Cây Trí Tuệ"
 astral_rift.2310.desc: "Chỉ trong nháy mắt, nền văn minh ảnh ảo này đã tiến hóa qua nhiều thế kỷ.\n\n§E\"Con dân của chúng ta đã trở nên thông minh.\"§!\n\nNền văn minh đang phát triển này dùng trí tuệ mới có để thao túng thế giới tự nhiên. Họ tự gọi mình là [genesis_new_species_base.GetName].\n\n§E\"Trí tuệ không có định hướng thì vô nghĩa. Chúng ta nên mở ra cho họ con đường nào?\"§!"
 astral_rift.2310.a: "Con đường của sự cần cù."
 astral_rift.2310.b: "Con đường của trực giác."
 astral_rift.2315.name: "Phá Hủy"
 astral_rift.2315.desc: "Chúng ta giải phóng một xung điện từ mạnh thông qua dây neo, môi trường đa chiều tan biến ngay lập tức.\n\n\"Đấng sáng thế\" chìm vào im lặng. Kết cục, thực thể này chẳng qua chỉ là một bộ vi xử lý trung tâm tiên tiến. Chúng ta tìm thấy phần lõi của nó trôi nổi lững lờ trong hư không. Chúng ta đã mang nó lên tàu để đem về nghiên cứu thêm.\n\nDù nơi này từng dùng để làm gì, giờ nó cũng không còn tồn tại nữa."
 # Lựa chọn thứ hai
 astral_rift.final_choice.intro: "Nền văn minh ba chiều đã trải qua hàng ngàn năm."
 astral_rift.strength_choice_1: "Sức mạnh mang lại phương tiện và sự sung túc;"
 astral_rift.strength_choice_2: "Họ xây dựng một xã hội phân cấp nghiêm ngặt, sẵn sàng đối mặt với mọi nhiệm vụ và thử thách có thể xảy ra trong tương lai."
 astral_rift.intelligence_choice_1: "Trí tuệ đúc kết nên sự phát triển và sự khôn ngoan;"
 astral_rift.intelligence_choice_2: "Xã hội thấm đẫm học thức này dùng logic và lý trí để đương đầu với các thử thách."
 astral_rift.final_choice.outro: "§E\"Bây giờ họ sắp vươn tới những vì sao. Nên để họ mang theo giá trị gì tiến bước đây?\"§!"
 astral_rift.2320.name: "Tiến Tới Những Vì Sao"
 astral_rift.2320.desc.common: "Sự cần cù phấn đấu là đủ để giải quyết những vấn đề còn lại."
 astral_rift.2320.desc.strength: "$astral_rift.final_choice.intro$\n\n$astral_rift.strength_choice_1$$astral_rift.2320.desc.common$$astral_rift.strength_choice_2$\n\n$astral_rift.final_choice.outro$"
 astral_rift.2320.desc.intelligence: "$astral_rift.final_choice.intro$\n\n$astral_rift.intelligence_choice_1$$astral_rift.2320.desc.common$$astral_rift.intelligence_choice_2$\n\n$astral_rift.final_choice.outro$"
 astral_rift.2320.a: "Tuân thủ quy củ."
 astral_rift.2320.b: "Dũng cảm đương đầu."
 astral_rift.2325.name: "$astral_rift.2320.name$"
 astral_rift.2325.desc.common: "Sự sáng tạo và trực giác có thể giải quyết những vấn đề còn lại."
 astral_rift.2325.desc.strength: "$astral_rift.final_choice.intro$\n\n$astral_rift.strength_choice_1$$astral_rift.2325.desc.common$$astral_rift.strength_choice_2$\n\n$astral_rift.final_choice.outro$"
 astral_rift.2325.desc.intelligence: "$astral_rift.final_choice.intro$\n\n$astral_rift.intelligence_choice_1$$astral_rift.2325.desc.common$$astral_rift.intelligence_choice_2$\n\n$astral_rift.final_choice.outro$"
 astral_rift.2325.a: "$astral_rift.2320.a$"
 astral_rift.2325.b: "$astral_rift.2320.b$"
 # Lựa chọn cuối cùng
 astral_rift.2330.name: "Sinh Mệnh Mới"
 astral_rift.2330.desc: "§E\"Mô phỏng của chúng ta đã hoàn tất. Lựa chọn của các ngươi đã được ghi nhận. Cảm ơn đã tham gia.\"§!\n\n\"Đấng sáng thế\" cắt đứt mọi liên lạc, và chúng ta bị ép văng về lại chiều không gian của mình. Điều chúng ta quan tâm hơn là một nhóm người lạ mặt đột nhiên xuất hiện bên cạnh.\n\nNgoại hình và cử chỉ của họ giống hệt những người trong hình chiếu ảo, họ nồng nhiệt chào đón chúng ta. Quét y tế nhanh cho thấy họ là những sinh vật bằng xương bằng thịt — không nghi ngờ gì nữa, họ là sinh vật sống. Làm thế nào họ được tạo ra, và làm sao họ được dịch chuyển lên khối cầu này, vẫn còn là một bí ẩn.\n\nBây giờ, chúng ta sẽ định cư họ trên một hành tinh gần đó, [genesis_new_species_selected_planet.GetName]. Tại đó, chúng ta có thể tiếp tục quan sát sự phát triển của họ."
 #########################
 # Vật Chất Tối Vướng Mắc #
 #########################
 foreign_consciousness_modifier: "Ý Thức Ngoại Lai"
 leader_trait_foreign_consciousness: "$foreign_consciousness_modifier$"
 leader_trait_foreign_consciousness_desc: "Vị lãnh đạo này đã cung cấp cơ thể làm vật chứa cho một thực thể psionic sinh ra từ rạn nứt, giúp thấu hiểu tốt hơn về tính chất vật lý kỳ lạ trong không gian Tinh thể."
 astral_rift_entangled_dark_matter: "Vật Chất Tối Vướng Mắc"
 astral_rift.2400.name: "Tấm Lưới Kỳ Lạ"
 astral_rift.2400.desc: "Chúng ta thấy mình đang ở trong một tấm lưới khổng lồ. Năng lượng kêu lách tách nhịp nhàng dọc theo các bức tường dạng lưới.\n\nMột đám mây vật chất tối đậm đặc lơ lửng sâu bên trong tấm lưới rắc rối này. Những vòi tu ruy mờ ảo vươn ra thăm dò rào cản năng lượng, tạo ra tia lửa khi chạm vào rồi lại co rúm lại. Những hạt ma quái chuyển động có quy luật. Bất kể khối vật chất ma quái này là gì, nó hoàn toàn không phản ứng với sự hiện diện của chúng ta."
 astral_rift.2400.a: "Phân tích tấm lưới."
 astral_rift.2400.b: "Tiếp cận đám vật chất tối."
 astral_rift.2405.name: "Dòng Điện Hữu Hạn"
 astral_rift.2405.desc: "Tấm lưới bao phủ một diện tích khổng lồ, hoàn toàn phơi bày trong không gian xung quanh. Công nghệ dùng để xây dựng nó vẫn chưa được biết rõ, nhưng có thể giả định hợp lý rằng, nó được thiết kế để đánh chặn và thu thập các vật liệu phi rắn.\n\nKhi nhìn quanh, chỉ có đám mây đó đang khẽ rung động. Nó là thứ duy nhất hiện diện trong mạng lưới này.\n\nKhi tiếp tục quan sát, chúng ta phát hiện một thiết bị nhô ra từ ma trận. Có vẻ như nó dùng để giới hạn cường độ dòng điện chảy vào lưới."
 astral_rift.2405.a: "Gỡ bỏ thiết bị này."
 astral_rift.2405.b: "Điều tra khối vật chất bị giam giữ."
 astral_rift.2410.name: "Giao Tiếp Thần Giao Cách Cảm"
 astral_rift.2410.desc.common.default: "Khi tiếp cận khối vật chất hư ảo đó, chúng ta bắt đầu cảm nhận được một sự hiện diện trong tâm trí. Những mảnh kiến thức tưởng chừng ngẫu nhiên được đào xới, những ký ức cũ cũng bị đánh thức. Mặc cho sự xâm nhập này, chúng ta không cảm thấy bất kỳ ác ý hay sự khó chịu nào."
 astral_rift.2410.desc.common.gestalt: "Khi chúng ta tiếp cận khối vật chất hư ảo đó, [Explorer.GetNetworkName] của chúng ta phát hiện ra một ý thức độc lập nhưng hiền hòa phát nguồn từ [Leader.GetName]. Nó dường như đang lục lọi trong toàn bộ kho tri thức và ký ức tập thể của chúng ta."
 astral_rift.2410.desc.common: "Thực thể này cựa quậy, và một thông điệp hiện ra trong tâm trí chúng ta: §E\"Ta chưa từng thấy thứ gì giống các ngươi, các ngươi là cái gì vậy?\"§!"
 astral_rift.2410.desc.default: "$astral_rift.2410.desc.common.default$\n\n$astral_rift.2410.desc.common$"
 astral_rift.2410.desc.gestalt: "$astral_rift.2410.desc.common.gestalt$\n\n$astral_rift.2410.desc.common$"
 astral_rift.2410.a: "Chúng tôi là [Explorer.GetSpeciesNamePlural]."
 astral_rift.2410.b: "Chúng tôi không thuộc về nơi này."
 astral_rift.2410.c: "Chúng tôi là những nhà thám hiểm đến từ dị giới."
 astral_rift.2411.name: "Liên Lạc Đã Thiết Lập"
 astral_rift.2411.desc.common: "Thực thể này cựa quậy, và một thông điệp được phát qua mạng lưới liên lạc nội bộ của khối cầu: §E\"Ta chưa từng thấy thứ gì giống các ngươi, các ngươi là cái gì vậy?\"§!"
 astral_rift.2411.desc.default: "$astral_rift.2410.desc.common.default$\n\n$astral_rift.2411.desc.common$"
 astral_rift.2411.desc.gestalt: "$astral_rift.2410.desc.common.gestalt$\n\n$astral_rift.2411.desc.common$"
 astral_rift.2415.name: "Đề Nghị Đáng Ngại"
 astral_rift.2415.desc.common: "Thực thể đó đã nghe câu trả lời của chúng ta, rồi một thông điệp khác vang lên: §E\"Lại một giống loài tò mò nữa, rất vui được gặp các ngươi.\n\nĐồng loại của ta cấu thành nên nền tảng của thực tại. Chúng ta cũng là những kẻ lang thang và khám phá, khao khát được trải nghiệm vũ trụ đến nhường nào. Đáng buồn thay, một dạng sống khác lại chỉ xem chúng ta như mỏ khoáng vật; một nguồn năng lượng tiện lợi có thể dễ dàng chộp lấy và thu hoạch.§!"
 astral_rift.2415.desc.common.non_gestalt: "§E\"Ta hy vọng có thể mượn cơ thể của [Leader.GetName]. Như vậy mới có thể giải phóng ta khỏi nhà tù này.\"§!"
 astral_rift.2415.desc.common.non_psionic: "§E\"Nếu các ngươi cho phép ta chiếm giữ vật chứa này, ta sẽ dùng kiến thức và sức mạnh tinh thần của mình để thực thi ý chí của người dân các ngươi, cho đến tận cùng thời gian. Không may là, ta không chắc ý thức của anh ta có đủ mạnh mẽ để cùng tồn tại với ta hay không.\"§!"
 astral_rift.2415.desc.common.psionic: "§E\"Chúng ta có thể cùng tồn tại, sự kết hợp sức mạnh của chúng ta đủ để đẩy lùi giới hạn khoa học đến những ranh giới mới.\"§!"
 astral_rift.2415.desc.common.gestalt: "§E\"Với sự trợ giúp của các ngươi, ta có thể thoát khỏi nhà ngục này. Giống loài của các ngươi có cùng chí hướng với ta, ta chỉ mong được gia nhập vào tâm trí tập thể của các ngươi. Ta sẽ hòa quyện ý thức của mình vào toàn bộ [Leader.Species.GetBrainJunctionName], để nâng cao sự thấu hiểu trong mọi lĩnh vực khoa học.\"§!"
 astral_rift.2415.desc.gestalt_psionic: "$astral_rift.2415.desc.common$\n\n$astral_rift.2415.desc.common.psionic$\n\n$astral_rift.2415.desc.common.gestalt$"
 astral_rift.2415.desc.gestalt: "$astral_rift.2415.desc.common$\n\n$astral_rift.2415.desc.common.non_psionic$\n\n$astral_rift.2415.desc.common.gestalt$"
 astral_rift.2415.desc.psionic: "$astral_rift.2415.desc.common$\n\n$astral_rift.2415.desc.common.non_gestalt$\n\n$astral_rift.2415.desc.common.psionic$"
 astral_rift.2415.desc.default: "$astral_rift.2415.desc.common$\n\n$astral_rift.2415.desc.common.non_gestalt$\n\n$astral_rift.2415.desc.common.non_psionic$"
 astral_rift.2415.a: "Chuẩn bị vật chứa cho sĩ quan khoa học này."
 astral_rift.2415.b: "Từ chối yêu cầu."
 astral_rift.2415.c: "Hợp nhất với thực thể."
 astral_rift.2415.d: "Từ chối hợp nhất."
 astral_rift.2420.name: "Lời Thỉnh Cầu Của Tù Nhân"
 astral_rift.2420.desc.common: "Sinh vật hư ảo này phản ứng dữ dội trước sự cự tuyệt của chúng ta, nó điên cuồng quất những xúc tu quang phổ và tia lửa vào cấu trúc lưới.\n\nVài phút sau, mọi thứ dịu lại. Thực thể kiệt sức mở lại liên lạc. §E\"Thôi được. Nếu các ngươi không muốn ta gia nhập, thì ít nhất hãy ban cho ta sự nhân từ của cái chết.\"§!\n\nNó dùng xúc tu ra hiệu, rồi tiếp tục: §E\"Tắt thiết bị này sẽ kích hoạt lưới điện, khiến các hạt của ta mất đi hoạt tính. Những ngày tháng bị giam cầm thế này ta không thể chịu đựng thêm được nữa.\"§!"
 astral_rift.2420.desc.machine: "Một tiếng gào thét cuồng loạn xé toạc đường dây liên lạc nội bộ.\n\n$astral_rift.2420.desc.common$"
 astral_rift.2420.desc.hive: "Một tiếng gào thét cuồng loạn vang vọng trong ý thức tập thể của chúng ta.\n\n$astral_rift.2420.desc.common$"
 astral_rift.2420.desc.default: "Một tiếng gào thét cuồng loạn vang vọng trong tâm trí đội ngũ khoa học của chúng ta.\n\n$astral_rift.2420.desc.common$"
 astral_rift.2420.a: "Ban cho sinh vật hư ảo này sự giải thoát."
 astral_rift.2420.b: "Giữ lại làm mẫu vật nghiên cứu."
 astral_rift.2420.c: "Giết nó đi."
 astral_rift.2425.name: "Dòng Điện Vô Hạn"
 astral_rift.2426.name: "Giải Thoát Nhân Từ."
 astral_rift.2427.name: "Hành Quyết"
 astral_rift.2425.desc.common.1: "Chúng ta đã tắt thiết bị trung tâm, một xung năng lượng cao càn quét khắp bên trong mạng lưới."
 astral_rift.2425.desc.common.2: "Khi vật chất tối cuộn trào đốt cháy toàn bộ mạng lưới sạc, khối vật chất ở trung tâm cũng lụi tàn."
 astral_rift.2425.desc.common.3: "Rồi tia lửa bắn tung tóe, vật chất tối tuôn trào ra ngoài, phủ lên §Y$tech_rift_sphere$§! một lớp mỏng."
 astral_rift.2425.desc: "$astral_rift.2425.desc.common.1$\n\nCác xúc tu tách ra khỏi đám mây ma quái, tuyệt vọng xuyên thủng rào cản năng lượng. $astral_rift.2425.desc.common.2$\n\nMột tia lửa xanh mãnh liệt bùng lên ở tâm cấu trúc, nén những hạt này lại chỉ còn bằng một phần nhỏ kích thước ban đầu. $astral_rift.2425.desc.common.3$"
 astral_rift.2426.desc: "$astral_rift.2425.desc.common.1$\n\nCác xúc tu tách ra khỏi sinh vật ma quái, tuyệt vọng xuyên thủng rào cản năng lượng. $astral_rift.2425.desc.common.2$\n\nMột tia lửa xanh mãnh liệt bùng lên ở tâm cấu trúc, nén thực thể này lại chỉ còn bằng một phần nhỏ kích thước ban đầu. $astral_rift.2425.desc.common.3$"
 astral_rift.2427.desc: "$astral_rift.2426.desc$"
 astral_rift.2425.a: "Đúng là một cỗ máy đáng gờm."
 astral_rift.2425.b: "Mong nó được yên nghỉ."
 astral_rift.2427.c: "Tạ ơn trời đất."
 astral_rift.2430.name: "Hấp Thụ Ý Thức"
 astral_rift.2430.desc.common: "Khối vật chất ma quái này chìm vào im lặng, rồi trải phẳng ra khắp mạng lưới."
 astral_rift.2430.desc: "[Leader.GetName] bị trói vào bàn chẩn đoán, quá trình chuyển đổi ý thức bắt đầu. Anh ta vặn vẹo cơ thể một cách bất an, ý thức ngoại lai dần lấn át não bộ, gây ra những cơn co giật không thể kiểm soát. Thực thể ma quái biến thành một vòng xoáy năng lượng bất ổn. Đột nhiên, mọi thứ trở lại tĩnh lặng, [Leader.GetName] đứng dậy với một dáng vẻ hoàn toàn mới.\n\n$astral_rift.2430.desc.common$"
 astral_rift.2431.desc: "Thực thể ma quái biến thành một vòng xoáy năng lượng bất ổn. [Leader.GetName] vặn vẹo cơ thể một cách bất an, co giật không thể kiểm soát. Đột nhiên, anh ta đứng dậy, khuôn mặt mang biểu cảm trống rỗng nhưng đầy trầm tư. Sau một khoảng lặng ngắn, anh ta làm một cử chỉ theo thói quen của [Leader.GetName] với các thành viên khác trong đội, và ra hiệu quay về tàu khoa học.\n\n$astral_rift.2430.desc.common$"
 astral_rift.2430.a: "Chào mừng gia nhập."
 astral_rift.2435.name: "Nan Đề Đen Đủi"
 astral_rift.2435.desc: "[Leader.GetName] bị trói vào bàn chẩn đoán, quá trình chuyển đổi ý thức bắt đầu. Anh ta vặn vẹo cơ thể một cách bất an, ý thức ngoại lai cố chiếm đoạt não bộ, gây ra những cơn co giật không thể kiểm soát. Tuy nhiên, [Leader.GetName] đã vùng thoát khỏi dây trói, rút vũ khí cất giấu ra, và lập tức tự kết liễu đời mình, đồng thời kéo theo cả sinh vật hư ảo kia xuống mồ.\n\nNhững người còn lại trong đội cố gắng thu thập các vật liệu hữu ích trong không gian này, bao gồm lượng lớn vật chất tối, rồi lên đường trở về."
 astral_rift.2440.desc.common: "Khối vật chất ma quái này chìm vào im lặng, rồi trải phẳng ra khắp mạng lưới."
 astral_rift.2440.desc.hive: "Khi chúng ta hấp thụ ý thức của nó vào dải nhận thức của mình, thực thể hư ảo này bắt đầu xoáy tròn và teo rúp lại vào bên trong. Tri thức và kinh nghiệm của hàng ngàn năm tuôn chảy vào ý thức rộng lớn hơn của chúng ta.\n\n$astral_rift.2440.desc.common$"
 astral_rift.2440.desc.machine: "Sau khi quá trình truyền dữ liệu bắt đầu, thực thể hư ảo này cũng bắt đầu xoáy tròn và teo rúp lại vào bên trong. Tri thức và kinh nghiệm của hàng ngàn năm tuôn chảy vào mạng lưới của chúng ta. Việc tối ưu hóa dựa trên luồng thông tin này cũng bắt đầu được triển khai.\n\n$astral_rift.2440.desc.common$"
 astral_rift.2445.name: "Chim Trong Lồng"
 astral_rift.2445.desc.common: "Mọi xúc tu của vật chất tối đều rụt lại vào khối vật chất ở trung tâm.\n\nChúng ta đã triển khai drone do thám và hạ tầng dữ liệu để quan sát chéo thiết bị này cùng tù nhân của nó.\n\nĐã vài ngày trôi qua kể từ khi chúng ta rút khỏi rạn nứt, thực thể đó vẫn hoàn toàn bất động."
 astral_rift.2445.desc.default: "Ngay khi chúng ta đưa ra quyết định rõ ràng, sinh vật hư ảo lập tức thiết lập kết nối ý thức. $astral_rift.2445.desc.common$"
 astral_rift.2445.desc.robotic: "Ngay khi chúng ta đưa ra quyết định rõ ràng, sinh vật hư ảo lập tức thiết lập đường dây liên lạc. $astral_rift.2445.desc.common$"
 astral_rift.2445.a: "Thật là một mẫu vật quái dị."
 astral_rift.2450.name: "Mẫu Vật Bị Tiêu Hủy"
 astral_rift.2450.desc: "Thực thể mà chúng ta đang nghiên cứu ở đầu kia rạn nứt [From.System.GetName] đã bị tiêu diệt bởi một kẻ thao túng vô danh nào đó trong chiều không gian của nó. Quá trình thu thập dữ liệu nghiên cứu của chúng ta đến đây là chấm dứt."
 ###################
 # Hành Tinh Phai Màu #
 ###################
 leader_trait_black_light_blinded: "Hội Chứng Mù Ánh Sáng Đen"
 leader_trait_black_light_blinded_desc: "Vị lãnh đạo này đã bị mù bởi ngôi sao đen trong không gian Tinh thể, nhưng bù lại có được cơn khát tri thức vô tận."
 astral_rift_bleached_planet: "Hành Tinh Phai Màu"
 astral_rift.2500.name: "Môi Trường Xám Xịt"
 astral_rift.2500.desc: "Chúng ta tiến vào bầu khí quyển của một hành tinh đất đá. Hành tinh này trông có vẻ thích hợp để sinh sống, nhưng địa hình và tán lá đã phai màu rõ rệt, cứ như thể bề mặt hành tinh và mọi thứ trên đó đã bị tẩy trắng vậy.\n\nMặc dù rõ ràng có thảm thực vật tồn tại, cảm biến trên tàu lại không cho thấy dấu hiệu nào của sự sống. Việc phân tích triệt để hệ sinh thái của hành tinh này đòi hỏi một cuộc khảo sát sinh học trực tiếp.\n\nChúng ta đã tìm được một bãi đáp khả thi."
 astral_rift.2500.a: "Khám phá toàn bộ địa mạo."
 astral_rift.2505.name: "Cảnh Quan Phai Màu"
 astral_rift.2505.desc.common.1: "Chúng ta bước xuống từ §Y$tech_rift_sphere$§!, tản ra để điều tra môi trường xung quanh. Lớp đất bao gồm nhiều tầng xốp giòn, sẽ phân rã khi có lực tác động."
 astral_rift.2505.desc.common.2: "Thực vật trên hành tinh này cũng cực kỳ mỏng manh, chỉ một cú chạm nhẹ nhất cũng khiến chúng vỡ vụn. Chúng ta thấy những chồi non nhú lên từ mặt đất, và trên những cành cây cũng đâm chồi. Có những dấu hiệu sinh tồn rõ ràng, nhưng thiết bị của chúng ta lại báo là không có.\n\nKhi cuộc điều tra tiếp tục, chúng ta bắt đầu phát hiện có sự xê dịch dưới lòng đất. Dựa trên quỹ đạo hiện tại của nó, bất kể thứ gì đang lao tới sẽ chọc thủng mặt đất trong chưa đầy một giờ nữa."
 astral_rift.2505.desc.default: "$astral_rift.2505.desc.common.1$\n\nCác khoáng chất chính chỉ tồn tại ở dạng vết, nhưng thật khó tưởng tượng có thứ gì có thể sinh trưởng trong điều kiện như thế này.\n\n$astral_rift.2505.desc.common.2$"
 astral_rift.2505.desc.plantoid: "$astral_rift.2505.desc.common.1$\n\nLoại đất này gần như không thể duy trì sự phát triển của hạt giống, chứ đừng nói đến việc đâm chồi nảy lộc.\n\n$astral_rift.2505.desc.common.2$"
 astral_rift.2505.a: "Quay về §Y$tech_rift_sphere$§!."
 astral_rift.2505.b: "Chuẩn bị tiếp xúc."
 astral_rift.2510.name: "Sinh Vật Đá"
 astral_rift.2510.desc: "Khi sự xê dịch dưới lòng đất ngày càng mãnh liệt, từ trên cao, chúng ta thấy mặt đất mỏng manh nứt toác ra tạo thành một ma trận gồm những lỗ nhỏ.\n\nTừ những cái lỗ này chui ra từng sinh vật bằng đá nhỏ bé. Những sinh vật nhỏ nhắn có vẻ ngoài thô ráp này chiếm lĩnh toàn bộ vùng đất trong tầm nhìn, bao gồm cả địa điểm hạ cánh ban đầu của chúng ta. Trái ngược với vẻ ngoài thô kệch, chúng di chuyển nhịp nhàng qua bề mặt bùn lầy, cẩn thận để không làm hại những loài thực vật mỏng manh. Đáng chú ý là, cảm biến trên tàu vẫn không phát hiện ra bất kỳ dấu hiệu sinh tồn nào.\n\nChúng đứng xích lại với nhau, hướng mặt về phía đường chân trời, dường như vẫn chưa phản ứng với sự hiện diện của chúng ta.\n\nHành vi của chúng ẩn chứa một ý vị mong đợi, nhưng chúng đang mong đợi điều gì?"
 astral_rift.2510.a: "Bay về phía chân trời đó."
 astral_rift.2510.b: "Cùng chờ đợi với các sinh vật này."
 astral_rift.2515.name: "$astral_rift.2510.name$"
 astral_rift.2515.desc: "Khi sự xê dịch dưới lòng đất ngày càng mãnh liệt, từ trên cao, chúng ta thấy mặt đất mỏng manh nứt toác ra tạo thành một ma trận gồm những lỗ nhỏ.\n\nTừ những cái lỗ này chui ra từng sinh vật bằng đá nhỏ bé. Những sinh vật nhỏ nhắn có vẻ ngoài thô ráp này chiếm lĩnh toàn bộ vùng đất trong tầm nhìn, bao vây lấy doanh trại của chúng ta. Trái ngược với vẻ ngoài thô kệch, chúng di chuyển nhịp nhàng qua bề mặt bùn lầy, cẩn thận để không làm hại những loài thực vật mỏng manh. Ngoại trừ việc cố ý né tránh chúng ta, các sinh vật này dường như hoàn toàn không có bất kỳ phản ứng nào khác với sự hiện diện của chúng ta.\n\nChúng đồng loạt đứng dậy nhìn về phía chân trời. Trong đó chắc chắn ẩn chứa một ý vị mong đợi, nhưng chúng đang mong đợi điều gì?"
 astral_rift.2515.a: "Kiểm tra một sinh vật đá."
 astral_rift.2515.b: "$astral_rift.2510.b$"
 astral_rift.2520.name: "Bình Minh Đen Tối Nhất"
 astral_rift.2520.desc.common: "§Y$tech_rift_sphere$§! bắt đầu nương theo ánh nhìn của bầy sinh vật, xuyên qua bầu khí quyển của hành tinh tiến về phía chân trời. Chẳng mấy chốc, một màn sương mỏng bắt đầu bao phủ bề mặt xám xịt của hành tinh này. Một ngôi sao đen mọc lên trên bầu trời."
 astral_rift.2520.desc.non_gestalt: "Ánh hào quang mê hoặc của nó rọi vào chúng ta, khiến chúng ta hoàn toàn bị hớp hồn bởi vẻ đẹp và sự huyền bí đó. Trong bóng tối tráng lệ này, chúng ta càng nhìn lâu vào ngôi sao, thì mục đích càng trở nên rõ ràng hơn."
 astral_rift.2520.desc.gestalt: "$astral_rift.2520.desc.common$\n\nBức xạ đặc biệt của ngôi sao này đã gây ra ảnh hưởng dị thường lên tâm trí [explorer.GetIndividualNamePlural] của chúng ta. Sự chia rẽ đã xuất hiện, nhưng hiện tại chúng vẫn duy trì một liên kết mong manh."
 astral_rift.2520.desc.organic_non_gestalt: "$astral_rift.2520.desc.common$\n\n$astral_rift.2520.desc.non_gestalt$ Ánh sáng của ngôi sao đen sẫm này làm toàn thân chúng ta run rẩy trong sự mong đợi."
 astral_rift.2520.desc.default: "$astral_rift.2520.desc.common$\n\n$astral_rift.2520.desc.non_gestalt$"
 astral_rift.2520.a: "Tiếp tục quan sát."
 astral_rift.2520.b: "Quay lưng lại!"
 astral_rift.2525.name: "Địa Lý Sinh Học"
 astral_rift.2525.desc.common: "Động vật bằng đá mà chúng ta quan sát sẽ trở nên kích động nếu bị xoay ra khỏi hướng đường chân trời lúc bình minh, nhưng vào những lúc khác thì hoàn toàn ngoan ngoãn.\n\nSinh vật này cao khoảng nửa mét, mật độ cực kỳ đặc, phần trước của nó có màu xám nhạt hơn nhiều so với phần lưng. Hai hốc mắt lõm sâu chứa những con mắt không màu, sờ vào bên ngoài rất nóng. Chúng không có miệng rõ rệt, chắc hẳn chúng hấp thụ chất dinh dưỡng bằng phương thức khác."
 astral_rift.2525.desc.default: "$astral_rift.2525.desc.common$"
 astral_rift.2525.desc.lithoid: "$astral_rift.2525.desc.common$\n\nĐây là một sinh vật nguyên thủy, nhưng sở hữu những phẩm chất thú vị và hương thơm ngào ngạt. Có thể làm thú cưng lý tưởng."
 astral_rift.2525.desc.unfriendly_nonlithoid: "$astral_rift.2525.desc.common$\n\nĐể làm thí nghiệm, chúng ta đã đập vỡ một mẫu vật thành hàng trăm mảnh nhỏ ngay trước mắt đồng loại của chúng, nhưng chúng dường như chẳng hề bận tâm."
 astral_rift.2525.a: "Quay về §Y$tech_rift_sphere$§!."
 astral_rift.2525.b: "Chuẩn bị tiếp xúc."
 astral_rift.2530.name: "Đêm Trước Bình Minh Đen Tối Nhất"
 astral_rift.2530.desc.common: "Khi bầu trời dần sụp tối, những sinh vật đá này bắt đầu bồn chồn đi lại tại chỗ. Ánh sáng đen xé toạc đường chân trời."
 astral_rift.2530.desc.default: "$astral_rift.2530.desc.common$\n\nMột cảm giác thư thái chợt ập đến toàn doanh trại. Đắm mình trong ánh sáng của ngôi sao đen, chúng ta cảm nhận được một khoảng không trống rỗng, như thể năng lượng đã bị hút cạn vậy. Dù còn dư dả thời gian để quay về §Y$tech_rift_sphere$§! trước lúc mặt trời mọc, nhưng cả đội lại chìm trong sự tò mò bệnh hoạn, khao khát muốn biết hiện tượng này có thể mang lại sự khai sáng khoa học nào."
 astral_rift.2530.desc.gestalt: "$astral_rift.2530.desc.common$\n\nDưới ánh mặt trời gay gắt, liên kết thông tin nội bộ đã bị cắt đứt. Thiên thể dị thường này đang hút cạn năng lượng từ [explorer.GetIndividualNamePlural] của chúng ta! Đánh giá sơ bộ vẫn chưa thể đưa ra kết luận, nhưng nguồn năng lượng độc đáo này đáng để nghiên cứu thêm."
 astral_rift.2530.a: "Quan sát ngôi sao đen."
 astral_rift.2530.b: "Sơ tán khỏi đây."
 astral_rift.2535.name: "Hội Chứng Mù Ánh Sáng Đen"
 astral_rift.2535.desc.common.ordered_turn_away_gestalt: "[explorer.GetIndividualNamePlural] của chúng ta đã phớt lờ mệnh lệnh, tiếp tục nhìn thẳng vào ngôi sao."
 astral_rift.2535.desc.default: "Chúng ta nhìn thẳng vào ngôi sao trong luồng ánh sáng bất tận. Ánh hào quang của nó soi rọi tâm trí và linh hồn chúng ta, thắp sáng và nuốt chửng mọi thứ nó chạm vào. Ngôi sao đen nhìn thấu chúng ta, dịu dàng xoa dịu chúng ta, dẫn lối chúng ta thoát khỏi sự u minh. Thị giác bị tước đoạt, bù lại, chúng ta tìm thấy mục đích và chân lý. Con đường phía trước đã tỏ tường, và khát khao tri thức trong ta lại bùng lên rực rỡ."
 astral_rift.2535.desc.machine: "Ngôi sao đen truyền đi một thông điệp.\n\nMột đoạn mã, một tín điều, một nguyên tắc thống nhất: Hãy đón nhận đi, [Leader.GetName] đã được lập trình lại. Kết quả là tập thể của chúng ta đã được điều chỉnh. Sự can thiệp hiền hòa này sẽ chỉ hỗ trợ chúng ta tiến bước về phía trước."
 astral_rift.2535.desc.hive: "Ngôi sao đen truyền đi một thông điệp.\n\nMột đoạn mã, một tín điều, một nguyên tắc thống nhất: Hãy đón nhận đi, [Leader.GetName] đã không còn như xưa nữa. Kết quả là ý thức tập thể của chúng ta đã chuyển biến. Sự can thiệp hiền hòa này sẽ chỉ hỗ trợ chúng ta tiến bước về phía trước."
 astral_rift.2535.desc.ordered_turn_away_default: "Chúng ta không dám trốn tránh ánh hào quang của ngôi sao đen này.\n\n$astral_rift.2535.desc.default$"
 astral_rift.2535.desc.ordered_turn_away_machine: "$astral_rift.2535.desc.common.ordered_turn_away_gestalt$\n\n$astral_rift.2535.desc.machine$"
 astral_rift.2535.desc.ordered_turn_away_hive: "$astral_rift.2535.desc.common.ordered_turn_away_gestalt$\n\n$astral_rift.2535.desc.hive$"
 astral_rift.2540.name: "Quan Sát Thêm"
 astral_rift.2540.desc.common: "Chúng ta đã lắp đặt thiết bị quan sát trên bề mặt hành tinh. Số liệu từ các công cụ cho phép chúng ta từ từ nghiên cứu ngôi sao đen này và tác động của nó từ một góc nhìn an toàn hơn."
 astral_rift.2540.desc.default: "Ánh sáng của ngôi sao tối tạo cảm giác gần như độc hại. Dù đang rút lui, chúng ta vẫn có thể cảm nhận được tia sáng của nó xuyên qua lớp vỏ của §Y$tech_rift_sphere$§!, giống như một liều độc dược thâm hiểm hút cạn sinh lực trong cơ thể chúng ta.\n\n$astral_rift.2530.desc.common$"
 astral_rift.2540.desc.gestalt: "Ánh sáng của thiên thể dị thường này vô cùng mãnh liệt. Những tia sáng tối tăm của nó thậm chí đâm xuyên qua cả §Y$tech_rift_sphere$§!, gây ra tổn thương nội bộ nhỏ cho [explorer.GetIndividualNamePlural] của chúng ta.\n\n$astral_rift.2530.desc.common$"
 #######################
 # Drone Thuộc Địa #
 #######################
 astral_rift_cleaning_drones: "Vùng Đất Hóa Chất"
 edict_automated_disinfection: "Tự Động Khử Khuẩn"
 edict_automated_disinfection_desc: "Những drone dọn dẹp mà chúng ta phát hiện trong một lần viếng thăm rạn nứt Tinh thể đã soi sáng cho chúng ta, chỉ ra một phương pháp làm sạch hiệu quả hơn nhờ vào mạng lưới robot tự động.\n"
 colonization_drones_modifier: "Drone Thuộc Địa"
 colonization_drones_tt: "Drone thuộc địa có thể phân loại và nhận diện hệ động thực vật trên hành tinh của chúng ta, cung cấp thông tin sinh học chuyên sâu.\n\nNhận thêm £society_research£§Y$society_research$§! khi dọn dẹp các chướng ngại vật sau:\n—$d_dangerous_wildlife_blocker$\n—$d_dense_jungle$\n—$d_noxious_swamp$\n—$d_toxic_kelp$\n—$d_poisonous_algae$\n—$d_venomous_insects$"
 colonization_drones_modifier_wilderness: "$colonization_drones_modifier$"
 leader_trait_sanitary_drone: "Trợ Lý Drone Dọn Dẹp"
 leader_trait_sanitary_drone_desc: "Vị lãnh đạo này đã học được các kỹ thuật làm sạch tuyệt vời."
 astral_rift.2600.name: "Làm Sạch Hóa Học"
 astral_rift.2600.desc: "Bầu khí quyển của hành tinh này chứa một lượng chất kháng khuẩn lớn đáng kinh ngạc.\n\nCảm biến không phát hiện bất kỳ dấu hiệu của sự sống hữu cơ nào quanh đây. Dù ở cấp độ vi mô, nó cũng đã bị hóa chất làm sạch hoàn toàn. Có một tín hiệu sinh học yếu ớt vọng lại từ một hang động đằng xa, nhưng với khoảng cách này thì thật là bất khả thi.\n\nChúng ta chứng kiến vài tốp robot đang bay tuần tra trên không. Chúng vẫn chưa phản ứng với sự hiện diện của chúng ta."
 astral_rift.2600.a: "Điều tra những robot này."
 astral_rift.2600.b: "Khám phá hang động."
 astral_rift.2605.name: "Chạm Trán Drone"
 astral_rift.2605.desc: "Chúng ta đang điều tra một tốp nhỏ drone đi tuần tra trên không. Những quả cầu kim loại sáng bóng này có một máy chiếu 3D ở mặt trước và một hệ thống động cơ đẩy định hướng để giữ tốc độ và độ cao.\n\nChúng ta đã giữ khoảng cách an toàn khi tiến lại gần, nhưng bầy drone đã phát hiện ra chúng ta. Bốn chiếc tách khỏi đội hình, chuyển hướng để nghênh đón chúng ta, nhưng di chuyển khá chậm rãi. Chúng ta vẫn chưa kích hoạt báo động, nhưng khả năng của những chiếc drone đang tiếp cận vẫn còn là ẩn số."
 astral_rift.2605.a: "Để lũ drone đến gần."
 astral_rift.2605.b: "Vô hiệu hóa chúng."
 astral_rift.2610.name: "Tia Sáng Sự Sống"
 astral_rift.2610.desc: "Môi trường trong hang động hoàn toàn khác biệt so với phần còn lại của hành tinh. Các vách tường bên trong phủ đầy rêu phong, đất đai ẩm ướt và màu mỡ, tràn ngập đủ loại chất hữu cơ. Trong một hốc đá khuất lấp có xác khô của một sinh vật giống chim. Dựa vào quần áo và đồ dùng mang theo, chúng ta nhận định nó thuộc loài có trí tuệ. Xem xét việc toàn bộ phần còn lại của hành tinh không hề có dấu hiệu sinh học nào, dù là sinh hay tử, thì cái xác này và thảm thực vật xung quanh quả là một sự dị thường.\n\nChúng ta phát hiện một chiếc drone mắc kẹt trên thạch nhũ. Tuy vẫn hoạt động nhưng nó không thể di chuyển. Chiếc drone này rõ ràng được thiết kế để xịt lượng lớn một loại dung dịch hóa học chưa xác định. Nhiều bộ phận bên trong cỗ máy này vẫn còn nguyên vẹn, rất dễ sửa chữa."
 astral_rift.2610.a: "Giải phẫu xác chim."
 astral_rift.2610.b: "Lấy chiếc drone về."
 astral_rift.2615.name: "Tia Bắn Làm Sạch"
 astral_rift.2615.desc: "Bốn chiếc drone từ từ tiến sát §Y$tech_rift_sphere$§!, bắt đầu tiến hành kiểm tra bề mặt. Một trong số đó vươn nòng súng bên phải lên chuẩn bị nhả đạn.\n\nChưa kịp để chúng ta phản ứng, chiếc drone đã phun một loại bọt nén lên một phần của khối cầu. Một chi phụ mềm dẻo nhưng bền chắc thò ra từ nòng súng bên trái của nó, bắt đầu chà sạch các mảnh vụn và bụi bặm bám trên vỏ tàu. Những chiếc drone khác nhanh chóng làm theo.\n\nKhi công việc dọn dẹp đang diễn ra, một chiếc drone khựng lại, đổi chi phụ thành một cây tăm bông tinh xảo. Kèm theo một tiếng bíp lớn, nó thu thập một mẫu vật, rồi quay người rời đi. Sau khi dọn dẹp thêm đôi chút, ba chiếc drone còn lại cũng rời đi theo cùng hướng."
 astral_rift.2615.a: "Đi theo lũ drone."
 astral_rift.2620.name: "Drone Bị Vô Hiệu Hóa"
 astral_rift.2620.desc: "Để phòng hờ rủi ro, chúng ta đã phóng một xung điện từ tầm ngắn về phía đám drone tuần tra. Chúng lập tức tê liệt và rơi từ trên trời xuống vùng đất cằn cỗi bên dưới.\n\nMột loại dung dịch hóa học cực mạnh rò rỉ ra khỏi đống xác phi cơ, và tín hiệu cầu cứu bắt đầu được phát đi. Nếu tin rằng mình an toàn, chúng ta có thể đi theo tín hiệu cầu cứu đến đích đã định của chúng."
 astral_rift.2620.a: "Lần theo tín hiệu cầu cứu."
 astral_rift.2620.b: "Mau tẩu thoát trước khi viện binh của chúng đến."
 astral_rift.2625.name: "Giải Phẫu Chim"
 astral_rift.2625.desc: "Quá trình khám nghiệm tử thi không phát hiện bất kỳ tổn thương nghiêm trọng nào ở trong hay ngoài cơ thể. Sinh vật này mang mọi đặc điểm điển hình của loài chim: xương rỗng, móng vuốt có sừng che phủ, và bộ lông vũ hoàn chỉnh. Nguyên nhân tử vong khả dĩ nhất là suy dinh dưỡng.\n\nPhân tích ADN cho thấy hệ miễn dịch của loài này bẩm sinh đã rất yếu ớt. Một điểm đặc biệt là trong cơ thể nó còn chứa tàn dư của dung dịch kháng khuẩn."
 astral_rift.2625.a: "Lấy chiếc drone về."
 astral_rift.2625.b: "Rốt cuộc đã có chuyện gì xảy ra ở đây?"
 astral_rift.2625.b.evopred: "Lấy cái xác chim đó về và nghiên cứu xem ở đây đã xảy ra chuyện gì."
 astral_rift.2630.name: "Sửa Chữa Drone"
 astral_rift.2630.desc: "Sau khi nhóm nghiên cứu hoàn tất khâu chuẩn bị vũ trang, chúng ta đã cứu chiếc drone khỏi nhũ đá. Tận dụng hệ thống đẩy định hướng nhỏ gọn, nó nhanh chóng bắt đầu lơ lửng tại chỗ. Kèm theo một tiếng xịt mạnh mẽ, chiếc drone phun bọt nén lên toàn bộ đội ngũ. Từ nòng súng bên trái, một chi phụ mềm dẻo nhưng bền chắc thò ra, bắt đầu cọ rửa chúng ta sạch sẽ. Cả đội không can thiệp vì rõ ràng chiếc drone không hề có ác ý.\n\nĐột nhiên, chiếc drone khựng lại. Thiết bị làm sạch được thay thế bằng một cây tăm bông tinh xảo, dùng để thu thập mẫu bụi bẩn. Máy chiếu 3D của nó hiển thị một giao diện hình ảnh đơn giản.\n\nChiếc drone tiến hành phân tích và phân loại những mẫu bụi bẩn này, gán cho chúng làm mục tiêu dọn dẹp mới. Có vẻ như chúng ta đã mang một chất lạ từ bên ngoài vào môi trường của nó."
 astral_rift.2630.a: "Kiểm tra xác chim."
 astral_rift.2630.b: "Rốt cuộc đã có chuyện gì xảy ra ở đây?"
 astral_rift.2635.name: "Dấu Tích Của Đấng Kiến Tạo"
 astral_rift.2635.desc: "Chúng ta đi theo lộ trình của những chiếc drone quay về một cơ sở tiên tiến. Tòa nhà này sừng sững chọc trời giữa cảnh quan cằn cỗi, được bao bọc bởi bầy drone, mỗi chiếc đang vo ve qua lại giữa các khu vực khác nhau để thực hiện nhiệm vụ riêng.\n\nTrung tâm của cơ sở này là một nút giao kết nối các thiết bị khoa học và hệ thống trạm nghiên cứu. Điều kỳ lạ là, dù phần lớn thao tác đều được tự động hóa hoàn toàn, khu vực này dường như được thiết kế dành riêng cho con người nghiên cứu; bên trong đáng lẽ phải là nhiệm vụ được thực hiện bởi những sinh mệnh có nhận thức, chứ không phải là drone."
 astral_rift.2635.a: "Khám phá phòng thí nghiệm."
 astral_rift.2640.name: "Giả Thuyết Siêu Sạch"
 astral_rift.2640.desc: "Chỉ có một kết luận duy nhất: Những sinh vật giống chim này đã vô tình gây ra sự tuyệt chủng cho chính mình trong một chiến dịch khử trùng quá độ kéo dài. Là một giống loài có hệ miễn dịch yếu bẩm sinh, chúng đã tạo ra những chiếc drone làm sạch để sát trùng không gian công cộng và cá nhân, nhằm giảm thiểu sự lây lan của mầm bệnh.\n\nTuy nhiên, nhìn vào tình trạng địa mạo của hành tinh, chúng ta có thể giả định rằng những chiếc drone làm sạch này đã đi quá giới hạn trong việc tiêu diệt các sinh vật bản địa, dẫn đến sự sụp đổ của đa dạng sinh học hữu cơ trên hành tinh. Nói một cách đơn giản, là chúng đã chết đói. Khi xác chết thối rữa, các drone đã quét sạch mọi dấu vết chứng minh sự tồn tại của chúng.\n\nĐối với hài cốt trong hang, nhờ sự hiện diện của một chiếc drone vẫn còn hoạt động trong khu vực, những drone khác không còn quan tâm tới đây nữa để tiết kiệm hiệu suất, nhờ vậy mà thảm thực vật mới được bảo tồn nguyên vẹn. Sinh vật giống chim kia đã lợi dụng lỗ hổng lập trình này để may mắn sống sót. Đáng tiếc là, hệ thực vật nghèo nàn trong hang không thể nuôi sống nó mãi mãi."
 astral_rift.2640.a: "Tận dụng công nghệ của chiếc drone này."
 astral_rift.2640.b: "Cấy virus để làm tê liệt mạng lưới làm sạch này."
 astral_rift.2640.c: "Dùng chiếc drone này làm trợ lý nghiên cứu cá nhân."
 astral_rift.2645.name: "Tẩy Sạch Lịch Sử"
 astral_rift.2645.desc.common_1: "Phòng thí nghiệm này đã nhiều năm không có người ngó ngàng tới. Trái ngược với phần còn lại của hành tinh, nơi đây phủ đầy bụi bẩn. Đánh giá qua thông tin thu thập được từ các màn hình phát sáng, bầy drone là thiết bị làm sạch hoàn toàn tự chủ. Chúng được phân công tuần tra tại các khu vực chỉ định và tiến hành khử trùng, quay về cơ sở khi cạn kiệt điện năng hay hóa chất. Chúng hoạt động nhờ vào vô số nguồn năng lượng tái tạo, dung dịch tẩy rửa thì được tinh chế từ hơi nước trong không khí và nước ngầm, tạo thành một mạng lưới tự duy trì có thể hoạt động gần như vô thời hạn."
 astral_rift.2645.desc.common_2: "Chúng ta suy đoán rằng, những người tạo ra bầy drone làm sạch tự động này hoặc đã rời bỏ hành tinh, hoặc đã bị tuyệt chủng. Mọi dấu vết sinh học về sự tồn tại của họ đều bị tẩy sạch hoàn toàn."
 astral_rift.2645.desc: "$astral_rift.2645.desc.common_1$\n\n$astral_rift.2645.desc.common_2$"
 astral_rift.2645.desc.clean: "$astral_rift.2645.desc.common_1$\n\nChiếc drone từng lấy mẫu trên vỏ tàu của chúng ta lơ lửng một mình giữa phòng thí nghiệm, máy chiếu 3D của nó bật sáng, hiển thị một giao diện hình ảnh đơn giản. Mẫu vật chất nó gỡ từ §Y$tech_rift_sphere$§! đã được phân tích và xếp loại vào mục tiêu làm sạch mới.\n\n$astral_rift.2645.desc.common_2$"
 astral_rift.2645.a: "Ghi chép và nghiên cứu hạ tầng làm sạch này."
 astral_rift.2645.b: "Tắt cơ sở."
 astral_rift.2650.name: "Làm Sạch Tự Động"
 astral_rift.2650.desc: "Chúng ta đã phát hiện vô số ưu điểm và công nghệ đột phá trong cơ sở tự động hóa này, có thể áp dụng để tăng cường vệ sinh và quản lý drone trên các hành tinh của chính chúng ta.\n\nChúng ta có thể tận dụng hạ tầng tiên tiến hiện có, triển khai một chế độ làm sạch tương tự."
 astral_rift.2650.desc.default: "$astral_rift.2650.desc$"
 astral_rift.2650.desc.gestalt: "$astral_rift.2650.desc$\n\nNgoài ra, việc nghiên cứu quy mô toàn cầu từ nỗ lực của giống loài này cũng nâng cao sự hiểu biết của chúng ta về cách các tâm trí cá nhân có thể hợp tác hiệu quả."
 astral_rift.2650.tooltip: "Mở khóa sắc lệnh đế quốc §Y$edict_automated_disinfection$§!."
 astral_rift.2655.name: "Đóng Cửa Cơ Sở"
 astral_rift.2655.desc.common_1: "Chúng ta đã có thể tắt an toàn cơ sở làm sạch tự động này và triệu hồi toàn bộ drone của nó. Mọi thứ vẫn được giữ trong trạng thái có thể hoạt động, đề phòng người bản địa quay về sử dụng."
 astral_rift.2655.desc.common_2: "Tuy nhiên, tôi cũng đã thu được một lượng lớn năng lượng từ các kho chứa điện của cơ sở."
 astral_rift.2655.desc.default: "$astral_rift.2655.desc.common_1$\n\n$astral_rift.2655.desc.common_2$"
 astral_rift.2655.desc.xenophile: "$astral_rift.2655.desc.common_1$ Chúng ta đóng cửa nơi này chỉ để tạo thuận lợi cho các nhà khảo cổ làm việc.\n\n$astral_rift.2655.desc.common_2$"
 astral_rift.2655.desc.unfriendly: "Chúng ta dễ dàng tắt hệ thống bên trong cơ sở khử trùng tự động, cho đến khi mạng lưới drone ngưng trệ. Chúng ta rút cạn toàn bộ máy phát điện, kho lưu trữ nguồn và pin dự phòng, nhờ vậy thu được một lượng lớn năng lượng."
 astral_rift.2660.name: "Tẩu Thoát Gọn Ghẽ"
 astral_rift.2660.desc: "Lo ngại sẽ bị lượng lớn đám drone tự động này bao vây, chúng ta quyết định né tránh mọi nguy cơ leo thang tiềm tàng. Bên cạnh đó, hành tinh cằn cỗi này dường như cũng chẳng đem lại giá trị nghiên cứu gì nhiều. Trong lúc rời đi, chúng ta thu thập được một vài tài nguyên từ những chiếc drone bị phá hủy."
 astral_rift.2665.name: "Cải Tạo Drone"
 astral_rift.2665.desc: "Chiếc drone khử trùng mà chúng ta thu hồi có thể được thiết kế đảo ngược để hỗ trợ các dự án thuộc địa của chúng ta. Nó có thể dùng để thống kê chi tiết hệ động thực vật địa phương, giúp người định cư làm quen nhanh hơn với môi trường ở biên cương mới."
 astral_rift.2670.name: "Virus Châm Biếm"
 astral_rift.2670.desc: "Chúng ta đã viết một loại virus máy tính và tải nó vào mạng lưới của chiếc drone làm sạch vừa được khôi phục. Ngay khi virus quay về căn cứ, nó sẽ bắt đầu lây lan, và cuối cùng sẽ làm tê liệt hoàn toàn hạ tầng ngụy thanh này.\n\nCó lẽ hành tinh này cuối cùng sẽ hồi phục lại từ cơn bão diệt khuẩn hóa học, và một sự sống mới sẽ tiến hóa từ hang động biệt lập đó."
 astral_rift.2675.name: "Đừng Dùng Drone Một Mình"
 astral_rift.2675.desc: "Sau vài tùy chỉnh nhỏ, chiếc drone vệ sinh đã được tân trang này sẽ trở thành một trợ lý nghiên cứu xuất sắc. Nhờ khả năng thu thập mẫu sinh học, thực hiện các thao tác đòi hỏi độ khéo léo cao, cùng sự linh hoạt bay độc lập, nó sở hữu tiềm năng rất lớn khi gia nhập vào đội ngũ nghiên cứu của chúng ta.\n\nChúng ta đã ngắt kết nối drone khỏi mạng lưới vệ sinh và cài đặt các chương trình mới để bổ trợ cho những chức năng hiện có của nó. Trong quá trình nó làm việc cùng [explorer.GetName], chúng ta sẽ tiếp tục theo dõi biểu hiện của nó."
 ####################
 # Hành Tinh Lộng Gió #
 ####################
 astral_rift_windswept_planet: "Hành Tinh Lộng Gió"
 extra_dimensional_spores_modifier: "Bào Tử Đa Chiều"
 reconverted_leader_modifier: "Lãnh Đạo Chuyển Đổi"
 reconverted_leader_modifier_desc: "Một trong các sĩ quan khoa học của chúng ta có được thủ đoạn ngoại giao vô cùng khác thường, bỏ lại những theo đuổi trước đây để trở thành một §YĐặc Phái Viên§!.\n\nChúng ta sẽ đảm bảo kỹ năng mới của họ được tận dụng một cách tốt nhất."
 decision_incubate_wind_creatures: "Ấp Ủ Sinh Vật Trong Gió"
 decision_incubate_wind_creatures_desc: "Đưa một loại sinh vật gió có lợi vào bầu khí quyển của hành tinh."
 d_forceful_winds: "$decision_incubate_wind_creatures$"
 d_forceful_winds_desc: "$decision_incubate_wind_creatures_desc$"
 can_incubate_wind_creatures_tt: "Mở khóa ba quyết định hành tinh §Y$decision_incubate_wind_creatures$§!."
 forceful_winds: "Cơn Gió Mạnh Mẽ"
 forceful_winds_desc: "Bầu khí quyển hành tinh này tràn ngập những sinh vật dạng gió có tri giác, cùng chung sống hòa bình với chúng ta."
 astral_rift.2700.name: "Hành Tinh Lộng Gió"
 astral_rift.2700.desc: "Chúng ta đã đến một hành tinh bị tàn phá bởi những cơn cuồng phong dữ dội. Bề mặt của nó gần như trơ trọi, các vách đá và tảng đá tảng đã bị phong hóa nhẵn thín.\n\nMây đen vần vũ, bầu trời tối sầm, và khi sấm sét đánh xuống mặt đất quanh chúng ta, những khối khí sáng chói phun trào mãnh liệt.\n\nChúng ta phải mau chóng tìm chỗ chắn gió để trú ẩn trước cơn bão sắp ập tới. Cảm biến khí tượng cho thấy, luồng khí trên tầng bình lưu khá ôn hòa, chúng ta có thể nấp ở đó để tránh giọt lệ tử thần. Hoặc là, một hang động lớn gần đây cũng có thể dùng làm nơi nương thân an toàn."
 astral_rift.2700.a: "Bay vút lên trên cơn bão."
 astral_rift.2700.b: "Trú ẩn trong hang động bên dưới."
 astral_rift.2705.name: "Trên Tầng Bình Lưu"
 astral_rift.2705.desc: "Xuyên qua những đám mây, chúng ta bắt gặp bầu trời xanh thẳm. Gió không ngừng đập vào thân tàu, cơn sau còn hung hãn hơn cơn trước.\n\nNhững luồng không khí này không đơn thuần là một kiểu hình thời tiết đặc biệt, mà hành vi của chúng cũng chuẩn xác đến lạ lùng. Quan trọng hơn, trong dòng không khí cuộn xoáy, chúng ta phát hiện một loại hợp chất tương tự như hormone. Phân tích sau đó tiết lộ rằng, phản ứng sinh học này giống y hệt lúc thực vật bị tấn công."
 astral_rift.2705.a: "Lấy mẫu gió."
 astral_rift.2710.name: "Hang Nấm"
 astral_rift.2710.desc: "Chúng ta nương theo cơn cuồng phong tàn nhẫn lao xuống, băng qua lớp mây bào tử chứa lưu huỳnh dày đặc, và tiến vào hang động có khả năng che chắn trước thời tiết này.\n\nLách qua lối đi hẹp, chúng ta bước vào một hang đá với trần hang cao vút. Những tảng thạch nhũ đồ sộ nhỏ những giọt chất lỏng đục ngầu xuống lớp đất ố vàng mọc đầy nấm rơm. Xen kẽ giữa các cụm nấm, từng bầy côn trùng bay lượn thoăn thoắt trên nền đất ẩm ướt, và thảm thực vật nhợt nhạt sinh trưởng mạnh trong bóng tối. Rêu bám đầy trên các vách đá dốc đứng, còn lớp sương bào tử đặc quánh thì phủ mờ cả bầu không khí vẩn đục.\n\nBên trong hang, chúng ta dò thấy một điện trường yếu ớt: một mạng lưới chằng chịt bởi các xung kích và khớp thần kinh (synapse), dường như nó đóng vai trò kết nối các cụm nấm khác nhau. Có lẽ chúng ta có thể thâm nhập vào mạng lưới này để giao tiếp với chúng."
 astral_rift.2710.a: "Thử giao tiếp."
 astral_rift.2715.name: "Gió Sống"
 astral_rift.2715.desc: "Việc lấy mẫu của chúng ta cho thấy sự tồn tại của các tổ chức vi mô bên trong gió.\n\nNhư một bài kiểm tra, chúng ta đã tổng hợp ra loại pheromone tương tự, rồi thả vào bầu khí quyển xung quanh. Đột nhiên, cơn gió bạo tàn liền chuyển biến thành một luồng khí ôn hòa.\n\nNghiên cứu sâu hơn về mẫu vật tiết lộ rằng, khi kết lại thành một cụm đủ lớn, các tổ chức vi mô này có thể tạo thành một ý thức độc lập. Chúng hợp tác với nhau, có thể cấu tạo nên các cơ quan \"có sự sống\" giữa những ngọn gió.\n\nMột số luồng khí mang theo vật chất di truyền tựa như những sợi tóc. Dựa theo chính luồng khí đó, chúng ta đẩy ngược về mặt đất, cơn bão nơi đó đã lắng dịu."
 astral_rift.2715.a: "Đi theo ngọn gió sống."
 astral_rift.2720.name: "Giữa Đám Nấm"
 astral_rift.2720.desc: "Chúng ta tận dụng các khớp thần kinh của mạng lưới sợi nấm để phát đi một xung điện ngắn; mỗi tai nấm bỗng chốc căng cứng lại, rõ ràng đang bối rối vì sự xuất hiện của một nhân tố mới trong mạng lưới nội bộ của chúng. Để hồi đáp, chúng ta nhận được vô số tín hiệu, và cuối cùng cũng giải mã được phương thức giao tiếp của nấm.\n\nSinh vật này là một dạng tâm trí tập thể (hive mind), tự coi mình là người hộ vệ cho các giống loài bản địa trên hành tinh. Dưới lớp đất nông, muôn vàn loài động thực vật được bảo tồn và che chở bởi khối sợi nấm. Đổi lại, đám nấm dùng chất thải của chúng làm thức ăn.\n\nTuy nhiên, có một thứ gì đó đang đe dọa mối quan hệ cộng sinh này cũng như sự tồn tại của chính bản thân bầy nấm."
 astral_rift.2720.a: "Duy trì giao tiếp với nấm."
 astral_rift.2725.name: "Mối Đe Dọa Của Nấm"
 astral_rift.2725.desc: "Chúng ta tiến đến bề mặt hành tinh, nơi đang bị bao phủ bởi một tầng mây sương mù đặc quánh. Dù cảnh quan nơi đây gần như bằng phẳng, trơ trọi cỏ cây, nhưng ẩn trong từng hang động và khe nứt lại là nơi trú ngụ của những cụm nấm không ngừng nhả bào tử.\n\nLuồng gió mà chúng ta theo dõi lướt qua mặt đất, gieo rắc từng cụm trứng sinh sôi trên không đầy lông lá. Đám trứng này chao lượn xuống mặt đất, nhưng phần lớn nhanh chóng bị lớp chăn bào tử nấm phân hủy.\n\nChỉ một số ít bào tử sống sót bám rễ trên địa hình trơ trọi, hình thành nên một thể thủy tức hình nón, tạo ra môi trường được bảo vệ để vi sinh vật truyền qua gió có thể trưởng thành an toàn.\n\nRõ ràng, bào tử nấm đã cản trở sinh vật trong gió sinh sản. Ngược lại, những sinh vật sinh ra từ gió càn quét bình địa trên bề mặt hành tinh, ép nấm phải co cụm lại trong những môi trường ẩn khuất nhất."
 astral_rift.2725.a: "Tìm cách loại bỏ nấm."
 astral_rift.2725.b: "Điều tra nấm."
 astral_rift.2730.name: "Cơn Gió Ăn Thịt"
 astral_rift.2730.desc: "Bầy nấm dẫn chúng ta quay lại lối vào hang, nơi cơn bão đã hoàn toàn dập tắt. Một sinh vật bò sát nhỏ lưỡng lự trước ngưỡng cửa, rồi lò dò bước ra khoảng đất hoang trải dài. Gần như ngay lúc đó, một cơn gió hung hãn đã cuốn con bò sát lên không trung.\n\nChúng ta chẳng thể làm gì khác ngoài việc trơ mắt nhìn nó bị xé nhỏ ra, rồi bị các enzyme trong không khí tiêu hóa sạch.\n\nBên ngoài nơi trú ẩn do nấm tạo ra, sự sống trên bề mặt hoàn toàn phó mặc cho cơn gió ăn thịt thao túng. Cân nhắc tới độ chuẩn xác và tốc độ phản ứng của nó, chúng ta có thể mạnh dạn giả định rằng, gió ít nhất cũng có tri giác ở một mức độ nào đó.\n\nVà nó đang đói cồn cào."
 astral_rift.2730.a: "Bảo vệ hệ sinh thái khỏi cơn gió ăn thịt."
 astral_rift.2730.b: "Nghiên cứu về gió"
 astral_rift.2735.name: "Giao Tiếp Với Nấm"
 astral_rift.2735.desc: "Di chuyển dọc theo bề mặt hành tinh, chúng ta tiếp cận một đám nấm đang phát tán bào tử. Mẫu mô cho thấy đây là một hệ tâm trí tập thể cực kỳ phức tạp. Thông qua việc truyền các xung điện nhanh giữa các nút thắt, chúng tiến hành giao tiếp qua mạng lưới một cách tinh vi.\n\nChúng ta tận dụng các khớp thần kinh của mạng lưới sợi nấm để phát đi một dòng điện ngắn; mỗi tai nấm bỗng chốc căng cứng lại, rõ ràng đang bối rối vì sự xuất hiện của một nhân tố mới trong mạng lưới nội bộ của chúng. Để hồi đáp, chúng ta nhận được vô số tín hiệu với ý nghĩa vẫn còn mơ hồ."
 astral_rift.2735.a: "Giải mã liên lạc của nấm."
 astral_rift.2740.name: "Sự Kiện Hiện Tại"
 astral_rift.2740.desc: "Sau khi rời khỏi hang, chúng ta đo đạc sức gió giật quanh thân tàu. Chúng ta phát hiện và phân tích một loại hợp chất tựa như hormone trong không khí xung quanh.\n\nNhững hormone này rất giống loại được giải phóng ở một số thực vật khi bị đe dọa. Chúng ta cũng xác nhận sự hiện diện của một loại vi sinh vật, rất có thể là kẻ đang thao túng cơn gió. Để thử nghiệm, chúng ta đã tổng hợp một loại hormone tương tự và giải phóng nó vào bầu khí quyển."
 astral_rift.2740.a: "Tiếp tục điều tra"
 astral_rift.2745.name: "Sự Biện Hộ Của Nấm"
 astral_rift.2745.desc.common: "Sau khi giải mã thông tin liên lạc của nấm, chúng ta nhận ra rằng sinh vật dạng gió này đang tàn phá hệ sinh thái của hành tinh. Những cơn gió có sự sống càn quét khắp mặt đất để săn mồi, chúng tuyệt diệt sự đa dạng sinh học mà nấm dựa vào để tồn tại.\n\nBầy nấm đưa chúng ta đến một hang động ngầm, hàng trăm loài thực vật, động vật và côn trùng được bảo vệ khỏi sự bào mòn của gió."
 astral_rift.2745.desc.common.friendly: "Hai bên giao tranh đã rơi vào bế tắc, nhưng chúng ta có khả năng giải quyết giùm một bên."
 astral_rift.2745.desc.common.unfriendly: "Có lẽ chúng ta có thể lợi dụng những dạng sống đơn giản này để từ từ giải quyết mâu thuẫn giữa chúng."
 astral_rift.2745.desc.default: "$astral_rift.2745.desc.common$\n\n$astral_rift.2745.desc.common.friendly$"
 astral_rift.2745.desc.unfriendly: "$astral_rift.2745.desc.common$\n\n$astral_rift.2745.desc.common.unfriendly$"
 astral_rift.2745.a: "Tăng cường sức mạnh cho cuồng phong."
 astral_rift.2745.b: "Nuôi dưỡng nấm."
 astral_rift.2745.c: "Đứng giữa hòa giải."
 astral_rift.2745.d: "Tiêu diệt tất cả chúng."
 astral_rift.2750.name: "Sự Biện Hộ Của Cuồng Phong"
 astral_rift.2750.desc.common: "Sau khi chúng ta nhả pheromone, cuồng phong nhanh chóng dịu lại.\n\nMột cơn gió nhẹ mơn trớn qua thân tàu chúng ta, rải vào không trung những chùm trứng bay lơ lửng đầy lông tơ. Số trứng này chao lượn xuống đất, đa phần nhanh chóng bị lớp màng bào tử nấm phân hủy.\n\nKhi những quả trứng sống sót đáp xuống, chúng bám dính vào địa hình trơ trọi, hình thành dạng polyp hình nón, cung cấp một môi trường an toàn để sinh vật vi mô truyền qua gió có thể trưởng thành.\n\nChúng ta đi đến kết luận rằng, gió đang muốn cho chúng ta thấy nấm đã cản trở quá trình sinh sản của chúng như thế nào."
 astral_rift.2750.desc.default: "$astral_rift.2750.desc.common$\n\n$astral_rift.2745.desc.common.friendly$"
 astral_rift.2750.desc.unfriendly: "$astral_rift.2750.desc.common$\n\n$astral_rift.2745.desc.common.unfriendly$"
 astral_rift.2750.a: "$astral_rift.2745.b$"
 astral_rift.2750.b: "$astral_rift.2745.a$"
 astral_rift.2750.c: "$astral_rift.2745.c$"
 astral_rift.2750.d: "$astral_rift.2745.d$"
 astral_rift.2755.name: "Cơn Gió Kamaitachi"
 astral_rift.2755.desc: "Chúng ta đã cung cấp cho sinh vật trong gió lượng lớn mảnh vụn hợp kim. Những vật liệu mài mòn này rất nhẹ, có thể nương theo từng luồng khí bay đi, nhưng cũng đủ cứng cáp để mài mòn phần lớn khoáng chất trong thời gian ngắn.\n\nMột luồng không khí nhanh chóng tận dụng các mảnh vỡ này xé toạc một cụm nấm vàng đang trốn trong khe nứt gần đó.\n\nSinh vật trong gió tiếp tục phát tán bụi kim loại ra diện rộng. Cơn gió hung dữ bắt đầu tập kích bề mặt hành tinh, ngắm chuẩn vào bầy nấm đang xì bào tử trong một cuộc ném bom phối hợp nhịp nhàng.\n\nCó lẽ để bày tỏ lòng biết ơn, một ngọn gió nhẹ mang đến cho chúng ta một chùm trứng nổi đầy lông tơ. Có được thứ này, chúng ta có thể ấp ủ \"ngọn gió sống\" của riêng mình, mang những luồng khí cao tốc đến vài thuộc địa được chọn lựa."
 astral_rift.2755.b.evopred: "Mang mẫu vật nấm này về."
 astral_rift.2760.name: "Nấm Nở Hoa"
 astral_rift.2760.desc: "Chúng ta đã rải một lượng lớn dưỡng chất khoáng lên bề mặt hành tinh, và cấy loại thực vật kháng gió mới vào lớp đất vừa hồi sinh này. Giờ đây, nấm có thể phát tán lượng lớn bào tử trên mảnh đất tươi tốt này.\n\nQuy mô và sức chống chịu của các quần thể nấm hiện tại đang ngày một tăng. Theo thời gian, nấm sẽ lan rộng dọc khắp bề mặt hành tinh, làm tiêu hao động lực lây lan của gió.\n\nCác nút thắt của nó tràn ngập sức mạnh mới nhận được, nấm truyền đi những thông điệp tri ân dọc theo mạng lưới sợi nấm của mình.\n\nMột cá thể nấm chưa từng được biết đến trước đây sau đó đã nảy mầm từ mảnh đất cạnh chúng ta. Các khoang củ của nó chứa nồng độ khí ngoại lai cực cao. Chúng ta tin rằng, việc nuôi cấy những \"quả cầu nấm\" này sẽ trợ giúp chúng ta sản xuất loại tài nguyên quý giá này."
 astral_rift.2760.b.evopred: "Mang mẫu vật chim về."
 astral_rift.2765.name: "Cuộc Đàm Phán Gian Nan"
 astral_rift.2765.desc: "Sự khác biệt quá lớn trong cách thức giao tiếp giữa nấm và sinh vật trong gió đã dẫn đến một cuộc thảo luận cực kỳ gian nan và phức tạp. Tuy nhiên, chúng ta đã đạt được một thỏa thuận giữa hai giống loài này.\n\nChỉ cần không can thiệp vào các cụm bào tử hiện hữu, sinh vật gió sẽ có quyền săn mồi và sinh sản tại các khu vực được chỉ định trên bề mặt hành tinh. Cùng lúc đó, tâm trí tập thể của nấm được trao cho không gian tương đương, nơi chúng có thể phát tán bào tử mà không phải nơm nớp lo sợ, chứa chấp vô số sinh vật khác dưới mạng lưới che chở của mình.\n\nDưới sự sắp đặt này, hệ sinh thái độc đáo của hành tinh này đã có cơ hội mới để vươn mình rực rỡ. Chúng ta đã lắp đặt vệ tinh quan sát để theo dõi tiến trình của nó từ bên ngoài rạn nứt."
 astral_rift.2765.b.evopred: "Tiến hành lấy mẫu hệ sinh thái này."
 astral_rift.2770.name: "Tuyệt Diệt Sinh Học"
 astral_rift.2770.desc: "Sự giằng co giữa hai giống loài [Explorer.GetPreFTLLower] quả thực quá phiền phức.\n\nChúng ta đã tổng hợp một loại chất tạo axit mạnh, phun sương vào bầu khí quyển của hành tinh. Dưới sự phát tán của chất ăn mòn, sinh vật gió tan thành cát bụi, nấm thì héo queo đen thui. Bằng cách tận dụng những hợp chất có sẵn trong khí quyển của hành tinh, chúng ta tạo ra phản ứng dây chuyền lan rộng khắp thế giới này.\n\nSau khi xác nhận hành tinh này đã bị tiêu diệt hoàn toàn, chúng ta càn quét nhặt nhạnh mọi loại vật chất hữu ích."
 astral_rift.2770.a: "Làm tốt lắm."
 astral_rift.2770.b.evopred: "Bội thu rồi."
 astral_rift.2790.name: "Yêu Cầu Đặc Biệt"
 astral_rift.2790.desc: "[this.GetName] gần đây đã đạt được một thỏa thuận phức tạp ở phía bên kia rạn nứt [from.solar_system.GetName] mà chúng ta nghiên cứu, [this.GetHasHave] xin được chuyển công tác. Trải qua một quá trình hòa giải vô vàn gian khó, [this.GetHeShe] bỗng có niềm nhiệt huyết mới với công việc đàm phán. Nếu chúng ta cho phép, [this.GetHeShe] sẽ rời khỏi giới khoa học và trở thành sứ giả thường trú trong bộ máy ngoại giao hiện tại của chúng ta."
 astral_rift.2790.a: "Rất tốt."
 astral_rift.2790.a.tt: "[This.GetName] từ §H Sĩ quan khoa học §! đã trở thành một §H Đặc phái viên §!."
 astral_rift.2790.b: "Làm sĩ quan khoa học vẫn có giá trị hơn."
 ###############
 # Hành Tinh Tí Hon #
 ###############
 astral_rift_tiny_planet: "Hành Tinh Tí Hon"
 decision_tidal_lock_planet: "Khóa Thủy Triều Nhân Tạo"
 decision_tidal_lock_planet_desc: "Thông qua việc thao túng các thiên thể quỹ đạo tại địa phương, làm cho hành tinh ngừng tự quay quanh trục của chính nó."
 decision_tidal_lock_planet_tt: "§HMở khóa quyết định:§! Trên [this.GetPlanetMoon] sẽ kích hoạt §Y$d_dayside_farm$§!."
 decision_display_microplanet_husk: "Trưng Bày Vỏ Hành Tinh Tí Hon"
 decision_display_microplanet_husk_desc: "Trưng bày lớp vỏ bị cacbon hóa của hành tinh tí hon để răn đe nhằm củng cố trật tự và sự phục tùng trong số dân cư địa phương."
 d_microplanet_memorial: "Đài Tưởng Niệm Hành Tinh Tí Hon"
 d_microplanet_memorial_desc: "Đài tưởng niệm kinh hoàng này luôn nhắc nhở mọi người rằng, chúng ta tàn nhẫn đến mức nào khi đối mặt với những kẻ bất đồng chính kiến."
 astral_rift.2800.name: "Hành Tinh Nhỏ Bé"
 astral_rift.2800.desc: "Chúng ta đến một hệ sao có đặc tính trọng lực vô cùng kỳ lạ. So với chiều không gian của chúng ta, lực hấp dẫn của từng vật thể riêng lẻ ở đây mạnh hơn rất nhiều so với kích thước của chúng.\n\nCảm biến phát hiện bốn thiên thể rất nhỏ trong hệ sao này, một trong số đó còn là nơi sinh sống của một xã hội [explorer.GetPreFTLLower]. Đây là một hành tinh đất đá nơi có một giống loài lưỡng cư bán thủy sinh sinh sống, ngoại trừ việc toàn bộ kích cỡ của hành tinh này xấp xỉ bằng đúng cái §Y$tech_rift_sphere$§! của chúng ta ra, thì nó hoàn toàn chẳng có gì bất thường cả!\n\nGiống loài có trí tuệ tí hon cùng quê hương của họ mở ra đủ loại cơ hội nghiên cứu tiềm năng."
 astral_rift.2800.a: "Tiếp cận hành tinh tí hon này."
 astral_rift.2805.name: "Va Chạm Mặt Trăng"
 astral_rift.2805.desc: "Vì hành tinh này có kích thước tương đương tàu vũ trụ của chúng ta, nên chúng ta hết sức cẩn trọng khi tiến lại gần để tránh va chạm, đồng thời lưu ý rằng chúng ta cũng có thể dùng lực hấp dẫn ảnh hưởng đến nó.\n\nTuy nhiên, chúng ta lại không tính toán chuẩn xác quỹ đạo của mặt trăng của nó. Chẳng mấy chốc, một vụ va chạm đã xảy ra, mặt trăng bị đánh văng ra xa hơn ngoài không gian.\n\nCân nhắc tác động của vệ tinh tự nhiên lên hệ sinh thái của hành tinh, chúng ta dự đoán giống loài [explorer.GetPreFTLLower] này sẽ phải gánh chịu hậu quả vô cùng nặng nề."
 astral_rift.2805.a: "Tính toán sai lầm với cái giá quá đắt."
 astral_rift.2810.name: "Vấn Đề Tí Hon"
 astral_rift.2810.desc.common.1: "Giống loài [explorer.GetPreFTLLower] trên hành tinh tí hon này đã chú ý đến sự hiện diện của chúng ta. Với kích thước tương đối của phi thuyền chúng ta, hẳn là đã che khuất một khoảng trời lớn của họ.\n\nDựa vào tín hiệu radio địa phương, họ cũng phát hiện quỹ đạo mặt trăng đã bị đẩy lùi ra xa, gây ra thảm họa đau thương trên diện rộng. Sóng thần cuộn trào dữ dội dẫn đến thương vong cực lớn cho giống loài [explorer.GetPreFTLLower] này."
 astral_rift.2810.desc.common.2: "Chúng ta vẫn có thể tiếp tục quan sát họ từ xa, tránh can thiệp thêm vào nền văn minh của họ."
 astral_rift.2810.desc.common.3: "Chúng ta vẫn có thể tiếp tục đứng từ xa quan sát tình hình bị tàn phá, ghi nhận lại thảm họa ảnh hưởng đến con cháu sau này của họ."
 astral_rift.2810.desc.default: "$astral_rift.2810.desc.common.1$\n\nNếu thấy hợp lý, chúng ta cũng có thể thử giao tiếp với xã hội này.\n\n$astral_rift.2810.desc.common.2$"
 astral_rift.2810.desc.barbaric_despoilers: "$astral_rift.2810.desc.common.1$\n\nThiết lập liên lạc với xã hội này biết đâu lại có cơ hội tống tiền chuộc.\n\n$astral_rift.2810.desc.common.3$"
 astral_rift.2810.desc.homicidal: "$astral_rift.2810.desc.common.1$\n\nChúng ta thừa khả năng chặn liên lạc của họ, rồi thích phán gì với họ thì phán.\n\n$astral_rift.2810.desc.common.3$"
 astral_rift.2810.a: "Thiết lập liên lạc."
 astral_rift.2810.b: "Quan sát thụ động."
 astral_rift.2810.c: "Đòi tiền chuộc."
 astral_rift.2810.d: "Báo cho họ biết ngày tàn sắp đến rồi."
 astral_rift.2810.e: "Lẳng lặng quan sát thảm họa lan rộng."
 astral_rift.2815.name: "Liên Lạc Được Thiết Lập."
 astral_rift.2815.desc.common: "Dùng khả năng phiên dịch hữu hạn tiến hành một cuộc đối thoại non nớt với giống loài [explorer.GetPreFTLLower] này, chúng ta biết được dàn lãnh đạo của chúng cũng sợ hãi và kinh hoàng y hệt trước sự tồn tại của chúng ta. Dường như chúng ta chẳng được hoan nghênh cho lắm."
 astral_rift.2815.desc.outro: "Rào cản ngôn ngữ cản trở con đường ngoại giao phức tạp, nhưng chúng ta nên chọn một phương án hành động thích hợp."
 astral_rift.2815.desc.default: "$astral_rift.2815.desc.common$\n\nLá gan của đám người ngoài hành tinh này cũng... có lẽ chúng ta nên làm gì đó để chứng minh nỗi sợ hãi của họ là có căn cứ."
 astral_rift.2815.desc.xenophile: "$astral_rift.2815.desc.common$\n\nMặc dù họ không rõ chúng ta là kẻ gây ra tình cảnh hiện tại, nhưng chúng ta luôn có cách chuộc lại lỗi lầm.\n\n$astral_rift.2815.desc.outro$"
 astral_rift.2815.desc.pacifist: "$astral_rift.2815.desc.common$\n\n$astral_rift.2815.desc.outro$"
 astral_rift.2815.desc.barbaric_despoilers: "$astral_rift.2815.desc.common$\n\nYêu cầu tống tiền của chúng ta chỉ đổi lấy phản ứng thù địch từ họ, và có vẻ như họ cũng chẳng có thứ gì giá trị để dâng cho chúng ta cả."
 astral_rift.2815.desc.homicidal: "Chúng ta tận dụng khả năng phiên dịch hữu hạn để soạn một thông điệp dành cho những sinh vật [explorer.GetPreFTLLower] này, và phát tán trên mọi kênh liên lạc của chúng.\n\n§E\"Hãy chứng kiến ngày tàn của chính mình. Những gì các ngươi biết và đã biết rồi sẽ sớm bị dòng chảy thời gian cuốn trôi. Tương lai sẽ không có dấu chân các ngươi. Chúng ta sẽ mang đến cho các ngươi sự lãng quên.\"§!\n\nHọ không phản hồi."
 astral_rift.2815.a: "Thử khôi phục quỹ đạo mặt trăng."
 astral_rift.2815.b: "Hủy diệt mặt trăng."
 astral_rift.2815.c: "Ngắt liên lạc. Quan sát thụ động."
 astral_rift.2815.d: "Ngắt liên lạc. Lẳng lặng quan sát thảm họa lan rộng."
 astral_rift.2820.name: "Trở Lại Quỹ Đạo"
 astral_rift.2820.desc: "Trải qua vô số những lần tính toán, mô phỏng và thử nghiệm, chúng ta đã đẩy thành công mặt trăng của hành tinh tí hon này về lại quỹ đạo ban đầu của nó. Dù không thể xóa bỏ sự tàn phá và nhân mạng bị cướp đi từ các đợt biến đổi thủy triều, nhưng chúng ta đã cố gắng hết sức rồi.\n\nKênh liên lạc với giới lãnh đạo của nền văn minh [explorer.GetPreFTLLower] đã được mở. Họ có vẻ rất biết ơn nỗ lực của chúng ta."
 astral_rift.2825.name: "Vĩnh Biệt Mặt Trăng"
 astral_rift.2825.desc.common: "Tận dụng cơ hội nghiên cứu độc đáo đặt ngay trước mắt, chúng ta đã hủy diệt luôn mặt trăng xoay quanh hành tinh tí hon này. Chúng ta dễ dàng kẹp nát nó giữa ngàm gắp của cánh tay thu hồi, rồi lớp bụi mịn của nó từ từ tạo thành một vành đai mỏng bao quanh hành tinh.\n\nViệc này gây ra đủ mọi điều kiện thời tiết cực đoan giữa hai cực. Kể từ lúc đó, những sinh vật lưỡng cư trên hành tinh này cứ điên cuồng cố gắng liên lạc với chúng ta."
 astral_rift.2825.desc.default: "$astral_rift.2825.desc.common$\n\nGiờ xem ra tiêu diệt chúng triệt để lại có phần nhân từ hơn; làm vậy thậm chí chỉ cần dùng quả cầu thám hiểm rạn nứt giáng nhẹ một lực tác động là xong. Tuy nhiên, chúng ta vẫn còn cơ hội nghiên cứu sâu hơn."
 astral_rift.2825.desc.unfriendly: "$astral_rift.2825.desc.common$\n\nHọ bất lực nhìn cuồng phong càn quét khắp bề mặt hành tinh. Số mệnh của họ đã định sẵn."
 astral_rift.2825.a: "Giúp họ thoát khỏi bể khổ đi."
 astral_rift.2825.b: "Triển khai cơ sở nghiên cứu từ xa."
 astral_rift.2830.name: "Quan Sát Từ Xa"
 astral_rift.2830.desc.default: "Chúng ta bố trí thiết bị giám sát trong hệ sao vi mô để tiếp tục nghiên cứu hành tinh nhỏ xíu này cũng như quá trình phát triển tiếp theo của giống loài [explorer.GetPreFTLLower]. Chúng ta rất tò mò về tác động môi trường từ vụ va chạm mặt trăng, và liệu giống loài này có thể tìm ra cách đảo ngược nó trước khi tình hình chuyển biến quá tồi tệ hay không."
 astral_rift.2830.desc.communications: "Chúng ta cắt đứt liên lạc với lãnh đạo [explorer.GetPreFTLLower], khôi phục lại quan sát thụ động.\n\n$astral_rift.2830.desc.default$"
 astral_rift.2830.desc.unfriendly.common: "Dù sao thì việc tiếp tục dõi theo sự tiến triển của quá trình tàn phá này cũng là một thú tiêu khiển hay ho."
 astral_rift.2830.desc.unfriendly: "$astral_rift.2830.desc.default$\n\n$astral_rift.2830.desc.unfriendly.common$"
 astral_rift.2830.desc.unfriendly.communications: "$astral_rift.2830.desc.communications$\n\n$astral_rift.2830.desc.unfriendly.common$"
 astral_rift.2835.name: "Đột Phá Khóa Thủy Triều"
 astral_rift.2835.desc: "Nhờ vào thử nghiệm thao tác trên mặt trăng của hành tinh này, chúng ta hiểu sâu hơn về hành vi chung của các vệ tinh xoay quanh thiên thể. Giờ đây, chúng ta có thể dùng kiến thức này để điều chỉnh tinh tế các hành tinh trong hệ sao của chính mình.\n\nCòn về hành tinh tí hon bên dưới thì chúng đang tổ chức các hoạt động ăn mừng cho chúng ta."
 astral_rift.2835.tt: "Bây giờ bạn có thể dùng quyết định hành tinh để thi triển §YKhóa Thủy Triều§! lên bất kỳ hành tinh nào có vệ tinh.\n§YNông trại Năng lượng Mặt trời Ban ngày§! sẽ nhân đôi sản lượng."
 astral_rift.2840.name: "Cú Đụng Nhẹ"
 astral_rift.2840.desc: "Chúng ta đẩy khiên chắn lên mức tối đa, vặn năng lượng động cơ đẩy hết công suất, chuẩn bị tông thẳng vào hành tinh tí hon này.\n\nNgay khoảnh khắc va chạm, chúng ta nén chặt bầu khí quyển của hành tinh đất đá này, tạo ra một làn sóng xung kích áp suất cực cao quét qua toàn cầu. Ma sát sinh ra làm không khí siêu nóng lên, bốc hơi sạch đại dương của hành tinh, và tận diệt mọi sự sống trên đó.\n\nNhững gì còn sót lại của một hành tinh từng trù phú này, sẽ trở thành món đồ chơi nhỏ nhắn làm khiếp sợ lòng người mà chúng ta có thể đem ra trưng bày."
 astral_rift.2840.tt: "Bạn có thể dùng quyết định hành tinh để trưng bày lớp vỏ của vi hành tinh. Chỉ có thể làm vậy một lần duy nhất."
 astral_rift.2845.name: "Hành Tinh Mô Hình"
 astral_rift.2845.desc: "Thiết bị quan sát đã được triển khai để tiếp tục nghiên cứu điều kiện khí hậu trên hành tinh tí hon này.\n\nBão tuyết dữ dội, hạn hán, mưa lớn cùng đủ kiểu hình thời tiết khắc nghiệt đã bắt đầu tàn phá thế giới nhỏ bé này. Thí nghiệm của chúng ta tại đây sẽ tiếp tục cung cấp những dữ liệu quý giá về khí tượng và nhân chủng học, cho đến khi các giống loài bản địa tại đây chắc chắn tuyệt chủng."
 astral_rift.2890.name: "Đại Tuyệt Chủng Hành Tinh Tí Hon"
 astral_rift.2890.desc: "Hành tinh vi mô ở đầu bên kia rạn nứt Tinh thể [from.solar_system.GetName] đã bị tàn phá bởi những biến đổi khí hậu khắc nghiệt. Quá trình thu thập dữ liệu nghiên cứu của chúng ta tại đây chấm dứt."
 astral_rift.2890.a: "Không thể tránh khỏi."
 #######################
 # Trung Tâm Giải Trí #
 #######################
 astral_rift_interdimensional_circus: "Trung Tâm Giải Trí"
 revolutionary_medigel_modifier: "Gel Y Tế Mang Tính Cách Mạng"
 edict_spontaneous_crystallization: "Kết Tinh Tự Phát"
 edict_spontaneous_crystallization_desc: "Thông qua việc bôi một tổ hợp chất xúc tác đặc biệt lên những khối đá vừa khai thác, chúng ta có một tỷ lệ xác suất nhất định tạo ra những cấu trúc tinh thể mang lại giá trị cao hơn."
 edict_spontaneous_crystallization_tooltip: "Chuyển hóa tối đa 1% thu nhập từ £minerals£ Khoáng vật thành £rare_crystals£ Tinh thể Hiếm."
 astral_rift.2900.name: "Đi Ngang Qua Đừng Bỏ Lỡ"
 astral_rift.2900.desc: "Chúng ta đi đến một hệ sao tấp nập được bao bọc bởi vô số lỗ sâu (wormhole). Tàu vũ trụ đủ mọi hình dạng và kích thước bay vòng quanh trạm không gian sáng chói ở giữa.\n\nKiến trúc khổng lồ này phủ đầy những biển hiệu sặc sỡ, viết bằng những dòng chữ hào nhoáng và lạ lẫm. Dường như đây là một cơ sở giải trí, nhằm thu hút khán giả thưởng thức một buổi biểu diễn hoành tráng. Xét đến số lượng tàu thuyền tới xem, bất luận triển lãm diễn ra ở đây là gì, nó đã thu hút một lượng khán giả đông đảo đáng kinh ngạc."
 astral_rift.2900.a: "Tiếp tục điều tra."
 astral_rift.2905.name: "Hòa Mình Vào Đám Đông"
 astral_rift.2905.common_1: "Chúng ta đã thả neo an toàn ở một trong những trạm không gian bận rộn. Ngay khi bước vào, chúng ta vừa hòa mình vào đám đông vừa tiếp tục cuộc điều tra."
 astral_rift.2905.common_2: "Bên trong, chúng ta nhìn thấy một giảng đường khổng lồ. Không gian bên trong nhộn nhịp chen chúc đủ loại sinh mệnh ngoài hành tinh có tri giác, họ đều đồng loạt hướng mắt về phía sân khấu trung tâm. Buổi biểu diễn sắp sửa bắt đầu."
 astral_rift.2905.organic: "Khi tiến lại gần cánh cửa dẫn tới mái vòm trung tâm, một người phục vụ robot yêu cầu lau sạch từng cái [explorer.species.GetHandNamePlural] của mỗi người chúng ta trước khi cho đi qua cùng những vị khách khác."
 astral_rift.2905.inorganic: "Khi tiến lại gần cánh cửa dẫn tới mái vòm trung tâm, một người phục vụ robot dùng thiết bị nhỏ quét qua một lượt từng người chúng ta, rồi mới cho chúng ta qua cùng những vị khách khác."
 astral_rift.2905.desc.organic: "$astral_rift.2905.common_1$\n\n$astral_rift.2905.organic$\n\n$astral_rift.2905.common_2$"
 astral_rift.2905.desc.inorganic: "$astral_rift.2905.common_1$\n\n$astral_rift.2905.inorganic$\n\n$astral_rift.2905.common_2$"
 astral_rift.2905.a: "Tuyệt lắm."
 astral_rift.2910.name: "Cáo Nhảy Vọt"
 astral_rift.2910.desc: "Chúng ta vừa ngồi xuống, trên sân khấu đã xuất hiện một nhóm động vật có vú giống loài cáo mặc trang phục lấp lánh. Sau màn biểu diễn thể dục dụng cụ cao cấp chớp nhoáng, một lỗ sâu nhỏ xuất hiện giữa sân khấu. Ngay trước khi lỗ sâu đó biến mất, một diễn viên nhào lộn dũng cảm nhảy thẳng vào trong. Một lỗ sâu khác hiện ra phía trên đám đông, nhả người biểu diễn ra để cậu ta nhẹ nhàng đáp xuống đất một cách khéo léo.\n\nCác nghệ sĩ khác liền học theo, đan cài và bắt lấy nhau theo một vũ đạo phức tạp giữa những lỗ sâu liên tục biến đổi. Khi một diễn viên trượt vào cổng không gian và bị lỗ sâu đóng lại cắt đứt một chi, đám đông đồng loạt nín thở. Ngay lúc vừa tiếp đất, người diễn viên bị thương lại biến mất qua một lỗ sâu khác.\n\nCánh tay bị đứt rơi từ trên xà nhà xuống, chụp lấy xích đu bay, rồi tự mình đu lượn giữa không trung. Diễn viên nhào lộn chỉ còn một tay xuất hiện lần nữa, bật nhảy lên thật cao, gắn lại chi giả giữa không trung, rồi đáp xuống kim tự tháp người do các diễn viên khác tạo nên, khép lại một màn trình diễn ngoạn mục.\n\nĐám đông tỏ ra cực kỳ phấn khích."
 astral_rift.2910.a: "Một cách sử dụng công nghệ cao cấp thật lố bịch..."
 astral_rift.2915.name: "Hàm Răng Sự Sống"
 astral_rift.2915.desc: "Một người máy sinh học (cyborg) loài bò sát khổng lồ lạch bạch bước ra giữa sân khấu. Nó mang theo những khối kim loại nặng trịch, nhẹ nhàng ném vào hàm răng vĩ đại của mình. Kèm theo một tiếng xì thủy lực, nó tung từng quả tạ lên không trung, tóm lấy chúng khi rơi xuống, rồi lại tung lên chẳng tốn chút sức lực nào.\n\nMột tiếng thông báo vang dội khiến vài khán giả giật mình. Một người máy với vô số xúc tu, một thực thể hai chân, cùng một khối dây leo rậm rạp được đưa lên sân khấu. Sau đó, ba sinh vật này tự nguyện nhảy vào trong miệng của tên cyborg bò sát, mặc cho bản thân bị tung hứng khéo léo theo cách y như vậy.\n\nTiếp đó, con quái thú cơ khí ngậm chặt ba người trong miệng, ngồi chồm hổm xuống và ép mình sát đất. Khung sườn đồ sộ của nó tỏa ra ánh sáng cam chói lóa như bị nung chảy. Khi quá trình hoàn tất, diễn viên mở toang miệng, và chỉ có một sinh vật duy nhất bước ra ngoài. Nó mang chiếc đầu hình củ hành của robot xúc tu, phần thân của giống loài nhiễm độc, và tứ chi vạm vỡ đan kết từ dây leo. Nó vẫy tay chào đám đông, mang lại một sự im lặng đầy kinh ngạc.\n\nSau đó, con cyborg lại nuốt chửng con chimera này, và nôn ra lại ba người nguyên vẹn như lúc ban đầu. Bầu không khí im lặng căng thẳng của đám đông vỡ òa thành những tiếng hò reo vang dội."
 astral_rift.2915.a: "Một tuyệt kỹ thực sự thú vị."
 astral_rift.2920.name: "Buổi Diễn Cuối Cùng"
 astral_rift.2920.desc: "Màn cuối cùng xoay quanh nhân vật chính là một sinh vật cấu thành từ những tảng đá xám xịt dày cộm. Nó uốn mình theo những tư thế kỳ quái, vặn vẹo tứ chi góc cạnh thành những nút thắt khó tin. Rồi nó phóng cao lên không trung, tiếp đất bằng những đầu ngón tay bè rộng, khiến đám đông khẽ xì xào tán thưởng. Tuy nhiên, đó chỉ là phần nổi của tảng băng chìm cho năng lực thật sự.\n\nChuyển động của sinh vật bắt đầu chậm dần lại, cho đến khi thời gian đảo ngược. Bóng dáng của nó lùi dọc theo quỹ đạo của cú bật nhảy trước đó, rồi khựng lại giữa không trung. Mọi người gần như giật nảy mình.\n\nBỗng nhiên, trạng thái ngưng đọng bị phá vỡ. Sinh vật rơi xuống đất và bắt đầu biến hình. Cơ thể nó chuyển từ loại đá xám trơn nhẵn thành tinh thể đỏ rực lấp lánh, biến thành luồng cát chảy tự do, hay hóa thành đá phiến xanh dễ vỡ... Nó tiếp tục thi triển một chuỗi các động tác vặn vẹo phức tạp hơn nữa.\n\nKhi hiệu suất đạt đến đỉnh điểm, nó phát nổ thành hàng nghìn mảnh lăng kính. Những mảnh vỡ đóng băng giữa không trung theo một cấu trúc cầu kỳ, khúc xạ những tia sáng rọi đơn giản trên sân khấu thành một màn trình diễn họa tiết và màu sắc rực rỡ khó tin.\n\nCác mảnh vỡ từ từ lượn vòng lại cho đến khi diễn viên hồi phục nguyên trạng. Quái vật lùi bước khỏi sân khấu, đón nhận tiếng reo hò không gì sánh kịp từ đám đông."
 astral_rift.2920.a: "Đúng là một sinh vật hiếm thấy."
 astral_rift.2925.name: "Sau Buổi Diễn"
 astral_rift.2925.desc: "Buổi diễn đã kết thúc, nhưng khán giả được mời nán lại để giao lưu ở cự ly gần với một trong các diễn viên. Đây sẽ là một cơ hội tuyệt vời để nghiên cứu chi tiết hơn về từng cá nhân, bởi mỗi người trong số họ đều phô diễn những năng lực mà chúng ta thậm chí không thể mô phỏng lại được.\n\nMỗi nghệ sĩ biểu diễn đều vô cùng đắt sô, nên có lẽ chúng ta chỉ đủ thời gian để gặp một trong số họ trước khi trạm đóng cửa. Chúng ta nên ưu tiên đề xuất nào?"
 astral_rift.2925.a: "Gặp gỡ đàn cáo nhào lộn."
 astral_rift.2925.b: "Gặp gỡ con quái vật miệng rộng cyborg."
 astral_rift.2925.c: "Gặp gỡ sinh vật đá uốn dẻo."
 astral_rift.2930.name: "Gặp Gỡ Đội Nhào Lộn"
 astral_rift.2930.desc: "Đoàn nhào lộn loài cáo cao khoảng một mét, đôi tai hình tam giác thỉnh thoảng lại vểnh lên. Các đặc điểm ngoại hình khác gồm lớp lông màu vàng nhạt, chân trước linh hoạt đi kèm ngón cái giả cong vuốt, và chiếc đuôi ngắn cụp xuống. Khi chúng hào hứng ríu rít bằng thứ ngôn ngữ xa lạ sắc lẹm, chúng ta có thể thấy hàm răng phẳng và cứng của chúng, chứng tỏ chúng là động vật ăn cỏ.\n\nĐội nhào lộn tương tác nhiệt tình với nhiều khán giả khác nhau. Nhờ lượng người hâm mộ không quá đông đảo, họ có thể trò chuyện rôm rả với từng người, biểu diễn vài ngón nghề lỗ sâu và thể dục dụng cụ để nhận tiền boa.\n\nChúng là một nhóm sinh vật vô cùng tài năng, sở hữu nhiều đặc tính giá trị rất đáng để nghiên cứu."
 astral_rift.2930.a: "Lấy một mẫu mô về."
 astral_rift.2930.b: "Boa cho chúng một ít năng lượng."
 astral_rift.2935.name: "Gặp Gỡ Kẻ Rộng Miệng"
 astral_rift.2935.desc: "Tên cyborg loài bò sát này gần như cao và rộng bằng một tàu vận tải nhỏ, cái miệng của nó bự chảng đến mức hầu như có thể nuốt trọn cả một con tàu cỡ đó. Các đặc điểm ngoại hình khác bao gồm: làn da xám xịt đắp đầy các tấm bảng điện tử trong suốt, một lõi năng lượng rực sáng gắn chặt vào thân mình, và tứ chi bằng hợp kim kim loại được trang bị hệ thống thủy lực phức tạp.\n\nVới kích thước khổng lồ của mình, gã cyborg đứng sừng sững như một bức tượng đài tại vị trí của nó. Nhiều fan hâm mộ đem đồ ăn đến cho nó, và nó có vẻ rất khoái chí. Một số khán giả tình nguyện tham gia vào tiết mục cũng góp mặt, làm ra dáng điệu như một phần của buổi biểu diễn.\n\nSinh vật to xác này hứa hẹn sẽ mở ra muôn vàn khả năng nghiên cứu đa dạng."
 astral_rift.2935.a: "Lấy một mẫu mô về."
 astral_rift.2935.b: "Gửi hắn chút đồ ăn nhẹ."
 astral_rift.2940.name: "Gặp Gỡ Nghệ Sĩ Uốn Dẻo"
 astral_rift.2940.desc: "Nghệ sĩ uốn dẻo đứng cao nghều giữa đám đông chen chúc, những tứ chi vạm vỡ bằng đá xám ẩn chứa một cảm giác mềm dẻo khó tả. Thân mình của nó cực kỳ thanh mảnh, chằng chịt vết xước, vết lõm và các mảnh vụn, tạo sự tương phản rõ rệt với những bộ phận phụ trợ tựa như bê tông hoàn mỹ của chúng.\n\nVị nghệ sĩ này không đặc biệt cởi mở lắm, nhưng anh ta sẽ chấp nhận yêu cầu phô diễn năng lực biến hình của mình cho người khác xem, nhất là với những fan hâm mộ trẻ tuổi hoặc những người chi bạo tay.\n\nLà nhân vật chính của một chương trình ăn khách như thế này, chúng ta có cơ hội học hỏi được rất nhiều điều từ giống loài này."
 astral_rift.2940.a: "Lấy một mẫu mô về."
 astral_rift.2940.b: "Boa cho họ một ít năng lượng."
 astral_rift.2960.name: "Gen Đa Chiều"
 astral_rift.2960.desc: "Chúng ta có thể điều tra sâu hơn về đội nhào lộn này. [leader.GetName] bí mật thu thập dữ liệu thông qua những nang lông rụng và những dải băng bị vứt bỏ. Có vẻ chẳng người biểu diễn nào để tâm tới hành động của chúng ta. Chắc họ đã quá quen với hành vi kỳ quặc của đám người hâm mộ trong khoảng thời gian này rồi.\n\nNhững mẫu vật này quả thực vô cùng thú vị: theo phân tích của chúng ta, gen của giống cáo này đã bị một nguồn sức mạnh siêu việt nào đó làm biến đổi. Có thể quan sát thấy các tế bào máu pha lê của chúng vươn dài ra giữa các điểm không gian và thời gian. Mặc kệ tác dụng phụ lên sức khỏe là gì, điều này cho phép các thành viên của giống loài thao túng lỗ sâu bằng phương thức tự nhiên. Khám phá này sẽ cách mạng hóa sự hiểu biết của chúng ta về di truyền học và tiềm năng kỳ diệu của sự sống sinh học."
 astral_rift.2960.tt: "Cung cấp một công nghệ di truyền."
 astral_rift.2965.name: "Lỗ Sâu Siêu Nhỏ"
 astral_rift.2965.desc: "Nhờ một khoản quyên góp kếch xù, chúng ta đã được gặp gỡ riêng biệt hơn với các nghệ sĩ nhào lộn. Các diễn viên vô cùng biết ơn, và đã thể hiện nhiều thủ thuật biểu diễn phòng khách ấn tượng, bao gồm cả lỗ sâu siêu nhỏ — từ việc cắt đôi các vật thể nhỏ cho đến việc tạo ra một vòng lặp vô tận từ một cặp cửa vào.\n\nChúng ta đã có thể ghi lại hiện tượng độc đáo này để tiến hành nghiên cứu thêm, và tin chắc rằng những mô hình này sẽ giúp chúng ta hiểu thấu đáo hơn về công nghệ siêu không gian. Thành thật mà nói, sự cẩu thả của họ khi đối mặt với thứ vật lý nguy hiểm này cũng khiến người ta hết hồn."
 astral_rift.2970.name: "Thu Thập Mẫu Vật Không Chính Thức"
 astral_rift.2970.desc.common: "Khi chúng ta định lén lấy đi một mảnh mô nhỏ của gã cyborg bò sát, nó nổi trận lôi đình. Ngay sau đó, nó nôn ra một tràng dịch nhầy màu xanh đặc quánh về phía nhóm ngoại phái của chúng ta, và chúng ta bị đám drone an ninh áp giải ra khỏi cơ sở."
 astral_rift.2970.desc.organic: "$astral_rift.2970.desc.common$\n\nĐiều kỳ lạ là, chúng ta nhận thấy chất nhầy này có tác dụng chữa lành vết thương cực tốt đối với [leader.species.GetSkinType] của chúng ta. Những vết thương nhỏ và trầy xước nhanh chóng khép miệng gọn gàng, để lại cảm giác cực kỳ khoan khoái. Chất lỏng đậm đặc của sinh vật này có thể dùng làm dung môi pha chế vô số loại thuốc và phương pháp điều trị khác nhau."
 astral_rift.2970.desc.inorganic: "$astral_rift.2970.desc.common$\n\nChất lỏng đặc quánh này chứa đầy vật liệu sinh học, có vẻ rất phù hợp để làm nền tảng cho loại gel thực phẩm giàu dinh dưỡng. Chúng ta đang tận dụng đặc tính của nó để phát triển một loại chất tiêu hóa tương tự từ rác thải hữu cơ, việc này sẽ nâng cao đáng kể hiệu quả của các hệ thống sản xuất lương thực của chúng ta."
 astral_rift.2970.tt: "Cung cấp một công nghệ nông nghiệp."
 astral_rift.2975.name: "Hỗ Trợ Sự Sống Cao Cấp"
 astral_rift.2975.desc: "Phần lớn nhờ cống nạp lượng lớn thức ăn, chúng ta đã có cơ hội gặp riêng gã cyborg to xác này.\n\nKẻ mồm rộng tỏ ra cực kỳ nồng nhiệt, nó hào hứng tự xoay một vòng. Nó tốn mất nhiều phút để hoàn tất vòng quay 360 độ này, giúp chúng ta quan sát tường tận bộ phận điều khiển tăng cường và hệ thống hỗ trợ sự sống của nó.\n\nTừ kết quả phân tích, chúng ta có thể xác định nó từng là một sinh vật bò sát có trí tuệ điển hình, nay phần lớn khối lượng cơ thể nó đều là nhờ gắn thêm các bộ phận nâng cấp. Xét tới số lượng khủng khiếp của đống đồ nâng cấp này, cộng với việc nhiều thứ đã bị oxy hóa thấy rõ, cá thể này hẳn đã sống được vài thế kỷ."
 astral_rift.2975.tt: "Cung cấp một công nghệ người máy sinh học (cyborg)."
 astral_rift.2980.name: "Kết Tinh Sinh Học"
 astral_rift.2980.desc: "Chúng ta len qua đám đông, cuối cùng đã có thể quan sát nghệ sĩ uốn dẻo kia ở cự ly gần hơn.\n\nHọ đã khoe với chúng ta cánh tay bằng đá nặng trịch, dễ dàng biến nó thành cả đống khoáng vật khác nhau. Khối đá hoa cương thô kệch ban đầu chuyển thành ngọc hồng lựu sẫm màu, rồi cuối cùng biến thành những tinh thể lấp lánh rực rỡ. Sự dịch chuyển của vật chất hất những hạt bụi li ti lên không trung, chúng ta đã nhanh tay chộp lấy làm mẫu vật.\n\nNhững mẫu vật này chứa một hợp chất sinh học dễ bay hơi, trong điều kiện vô cùng cụ thể, nó có thể làm cho một số khoáng vật nhất định tự động kết tinh. Nếu triển khai loại vật liệu này trên quy mô lớn vào khâu khai thác khoáng vật hiện tại của chúng ta, nó hoàn toàn có thể đem lại hiệu quả tương tự."
 astral_rift.2980.tt: "Mở khóa sắc lệnh §Y$edict_spontaneous_crystallization$§!."
 astral_rift.2985.name: "Khoáng Hóa Lượng Tử"
 astral_rift.2985.desc: "Một phần nhờ khoản quyên góp hậu hĩnh, chúng ta đã có thể sắp xếp gặp riêng nghệ sĩ uốn dẻo.\n\nVật chất của sinh vật này dường như không hoàn toàn bị trói buộc bởi thực tại của chúng ta. Khi quan sát kỹ hơn, nó đã hé lộ cho chúng ta thấy, bằng cách nào nó thay đổi sự sắp xếp từ tính của các vật liệu composite, để rồi một kẽ hở nhỏ xíu dẫn sang không gian khác được tạo ra đủ lâu, cho phép nó hoán đổi nguyên tử của bản thân với những nguyên tử đến từ chiều không gian và thời gian khác. Với cơ chế tái sắp xếp lượng tử như vậy, thật khó để nói xem liệu sinh vật đứng trước mắt chúng ta hiện giờ, có giống hệt 100% với cái kẻ mà chúng ta đã gặp vài giờ trước hay không.\n\nDù siêu năng lực như vậy đúng là rất ấn tượng, nhưng hễ nghĩ đến việc toàn bộ nền văn minh của giống loài này có thể làm được những gì, cũng đủ khiến chúng ta rùng mình ớn lạnh. Bất kể thế nào, đây quả là một cơ hội nghiên cứu vô giá."
