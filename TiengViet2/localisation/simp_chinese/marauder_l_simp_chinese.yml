 awakened_marauders: "Kẻ cướp bóc thức tỉnh"
 marauder.15.1.desc: "Hỡi những kẻ ngoại lai. Chúng ta là [encountered_marauder.GetSpeciesNamePlural]. Không giống như các đế chế giữa các vì sao thuộc các 'nền văn minh' khác trong thiên hà, chúng ta không có người cai trị, nhưng với tư cách là đại diện được tất cả các gia tộc bầu chọn, ta xin cảnh báo các người tại đây:\n\nĐừng mơ dùng những lời đe dọa yếu ớt của các người để thách thức chúng ta. Cứ thử phái hạm đội của các người đến lãnh thổ [encountered_marauder.GetSpeciesName] xem, và đừng hy vọng chúng có thể an toàn trở về, các chiến binh của chúng ta không ngại giải trí một chút đâu.\n\nTất nhiên, nếu các người muốn cống nạp, thì chúng ta luôn hoan nghênh các người ghé thăm thường xuyên... hoặc khi các người cần lính đánh thuê và có thể trả đủ tiền thù lao."
 marauder.15.2.desc: "Hây yaaaa!!! Quá trời lũ bùn đất!\n\nMày muốn gì, đồ bùn đất ngu ngốc? Mặt mày bị sao vậy? Tai nạn lò phản ứng à? Phơi ra ngoài chân không? Hây yaaaa!! Nhìn mày kìa!\n\nBọn tao là [encountered_marauder.GetSpeciesNamePlural]. Bọn tao đi săn lũ bùn đất. Nếu mày đến lãnh địa của [encountered_marauder.GetSpeciesName], bọn tao sẽ nấu súp bùn đất. Mày không thích điều đó, phải không? Hây yaaaaa!!\n\nHoặc có thể mày quen những bọn bùn đất khác. Hoặc mày muốn biến bọn chúng thành súp. Chúng ta có thể thương lượng. Nếu giá cả hợp lý, [encountered_marauder.GetSpeciesNamePlural] cũng sẵn sàng đánh lũ bùn đất khác thay cho mày."
 marauder.15.3.desc: "Chúng ta là [encountered_marauder.GetSpeciesNamePlural], những bề tôi trung thành của §HMẹ Hư Không§!: Người là đấng toàn tri toàn năng, là người báo thù tối cao thống trị không gian.\n\nNgười đã khiến chúng ta từ bỏ hành tinh quê hương của tổ tiên từ lâu, chuyển đến sống trong miền đất vĩnh hằng của Người — không gian lạnh lẽo, ban cho chúng ta sứ mệnh săn lùng bọn dị giáo, và hiến tế để làm hài lòng Người.\n\nĐáng tiếc thay, cuộc chiến tranh tôn giáo đã vắt kiệt sức lực của chúng ta, và khiến chúng ta nảy sinh bất đồng. Chúng ta đang vật lộn tìm kiếm sự giúp đỡ của Người, hy vọng nhận được sự chỉ dẫn của nữ thần, và việc tiêu diệt lũ dị dạng dị giáo chắc chắn sẽ làm Người hài lòng ———— ngay cả khi làm vậy vì nhận lệnh của bọn dị giáo khác. Do đó, chỉ cần các người trả đủ tiền, rất nhiều tín đồ của chúng ta sẵn lòng chiến đấu vì các người..."
 marauder.15.a: "Ngắt liên lạc."
 marauder_diplo_header: "[current_marauder_diplomacy.GetName]"
 marauder_diplo_header_2: "[encountered_marauder.GetName]"
 marauder_diplo_header_3: "[From.GetName]"
 marauder_diplo_header_4: "[raiding_marauder.GetName]"
 greatkhan_diplo_header: "[raider_khanate.GetRulerTitle] [raider_khanate.GetRulerName]"
 marauder.19.desc_01: "[Root.GetName] là một mầm bệnh của tự nhiên. Sự tồn tại bẩn thỉu không có chút khái niệm danh dự nào của các người được gọi là gì... 'Ý thức bầy đàn' à? Hay gọi là gì cũng được. Các người đúng là một đống tập hợp của mọi sai lầm có thể xảy ra trong thiên hà.\n\nCác chiến binh của [marauder_country_1.GetSpeciesNamePlural] không muốn dây dưa với các người."
 marauder.19.desc_02: "[Root.GetName] chỉ là một lũ man rợ. Hành động sát hại những người vô tội một cách ngu ngốc của các người đủ để khiến những chiến binh kiên cường nhất của chúng ta cũng phải buồn nôn.\n\nChúng ta sẽ không làm ăn với các người."
 marauder.19.desc_03: "Á chà, cái máy biết nói. Chủ của mày đâu rồi, cái đầu sắt? Họ có biết mày bị hỏng không?\n\nNếu bọn mày dám bén mảng đến gần địa bàn của chúng ta, các chiến binh của chúng ta sẽ rất vui vẻ đem bọn mày ra làm bia tập bắn, ngay cả khi làm vậy chẳng mang lại chút vinh dự nào. Giờ thì mau biến khỏi mắt bọn tao đi."
 marauder.19.desc_04: "Các người có lẽ tự huyễn hoặc rằng mình rất đáng sợ, với cái vẻ ngoài quấn đầy lửa như dưới địa ngục chui lên. Có lẽ các người quên rằng lửa cuối cùng rồi cũng sẽ bị dập tắt. Đem những lời lẽ biến thành tro bụi của các người ra chỗ khác mà nói đi."
 marauder.19.2.desc_01: "Hây yaaaa!! Đồ bùn đất bầy đàn ăn tạp! Chắc chắn sẽ không để mày biến bọn tao thành súp đâu! Cút đi, đồ bùn đất bầy đàn!"
 marauder.19.2.desc_02: "Hây yaaaa!! Bọn tao thích đập phá, nhưng không giống mày! Mày cuồng quá rồi, bùn đất! Bọn tao không thèm nói chuyện với mày!"
 marauder.19.2.desc_03: "Ya ha yi ha!!!!!! Nó, nó có hiểu không vậy? Nó là cỗ máy giết chóc đúng không? Nó chỉ biết giết, giết, giết?\n\nĐồ đầu sắt! Tự sát! Tao ra lệnh cho mày tự giết chính mình!\n\nA ha, nó hỏng rồi, đồ vô dụng."
 marauder.19.2.desc_04: "Hây yaaaa!!! Vừa nóng vừa hôi, toàn mùi khói! Dùng để nhóm lửa được không? Không à? Phù!\n\nCút đi, đồ xỉ than vô dụng!"
 marauder.19.3.desc_01: "Các người là kẻ thù truyền kiếp của Mẹ Hư Không. Nếu có thể, các người thậm chí sẽ nuốt chửng cả chính hư không đúng không?\n\nLũ quái vật gớm ghiếc."
 marauder.19.3.desc_02: "Mẹ Hư Không đòi hỏi sự cống tế, nhưng không phải do các người gây ra với quy mô này. Thứ các người tôn thờ chính là sự hủy diệt, điều này khiến các người trở thành lũ dị giáo tà ác nhất."
 marauder.19.3.desc_03: "Ngươi lạnh lẽo và trống rỗng, giống như chính hư không vậy. Mẹ Hư Không tôn trọng điều đó. Vì vậy, sự hủy diệt của ngươi sẽ khiến Người cảm thấy vô cùng vui sướng.\n\nChỉ vậy thôi."
 marauder.19.3.desc_04: "Ngươi dám mang ngọn lửa rực cháy vào lãnh địa của Mẹ Hư Không sao? Bản chất của ngươi khiến Người kinh tởm.\n\nHãy mau chóng rời đi trong lặng lẽ như đám tro tàn lạnh ngắt."
 marauder.19.a: "Con mồi..."
 marauder.19.b: "Lũ cặn bã ngoài hành tinh."
 marauder.19.c: "Chủng loài: §H[From.GetSpeciesName].§! Định danh: §R Sâu bọ.§!"
 marauder.19.d: "Tất cả các người rồi cũng sẽ bị thiêu rụi như những kẻ khác thôi!"
 marauder.20.1.desc_01: "Nói đi, kẻ ngoại lai. Các chiến binh của chúng ta đang lắng nghe đây."
 marauder.20.1.desc_02: "Chúng ta quyết không cúi đầu trước lũ ngoài hành tinh."
 marauder.20.1.desc_03: "Là hình phạt cho việc thua trận đấu tay đôi, tôi phải theo giao kèo mà chịu trách nhiệm giao thiệp với người ngoài trong vòng này.\n\nNgươi đến đây làm gì?"
 marauder.20.1.desc_04: "Giải thích xem tại sao ngươi lại làm phiền chúng ta. Chúng ta vẫn đang tiếp tục các nhiệm vụ chiến đấu."
 marauder.20.1.desc_05: "Ah! Cuối cùng cũng có một quân nhân thực thụ đến đây!\n\nSức mạnh chiến đấu của quân đội [Root.GetSpeciesName] chúng ta cũng đã nghe danh. Hàng ngàn [marauder_country_1.GetSpeciesNamePlural] đang nóng lòng muốn đích thân khiêu chiến các người trên chiến trường."
 marauder.20.1.desc_06: "Xin chào, [Root.GetSpeciesNamePlural]. Đồ cống nạp của các người khiến các chiến binh của chúng ta rất hài lòng.\n\nTa nói thẳng nhé... mặc dù vẫn có một số kẻ muốn tấn công các người, nhưng chúng đã bị dẹp yên rồi. Ít nhất là dẹp được phần lớn."
 marauder.20.1.desc_07: "Kiếm của chúng ta đã tra vào vỏ, hỡi [Root.GetSpeciesNamePlural]. Hiện tại các người không cần phải lo lắng."
 marauder.20.2.desc_01: "Đang yên đang lành thì bị mày phá hỏng cả một buổi tối, đồ bùn đất! Hây yaaaa!! Mày muốn gì?!"
 marauder.20.2.desc_02: "Thứ duy nhất tệ hơn cả bùn đất chính là sâu bùn! Không! Đừng hỏi đó là cái gì! Hây yaaaa!!!!"
 marauder.20.2.desc_03: "Hây yaaaa... *Khụ khụ**ực ực**phụt*... yaaaaa!!!!"
 marauder.20.2.desc_04: "Mày có gì muốn bọn tao đi đập phá không, đồ bùn đất? [marauder_country_2.GetSpeciesNamePlural] rất giỏi đập phá đấy!"
 marauder.20.3.desc_01: "Hôm nay Mẹ Hư Không đang rất giận dữ. Ta có thể cảm nhận được.\n\nChúng ta cần phải nỗ lực hơn nữa để làm Người nguôi giận..."
 marauder.20.3.desc_02: "Ta chỉ là bề tôi của Người. Ta không biết gì về ngươi cả.\n\nNhưng Người... Người đã nhìn thấu cái bản chất sâu bọ của ngươi."
 marauder.20.3.desc_03: "Mỗi khi phi thuyền của các người du hành qua không gian vô tận, đó đều là sự báng bổ lãnh địa của Người. Còn chúng ta thì đang gắng sức xoa dịu cơn thịnh nộ của Người. Cần biết rằng, cơn thịnh nộ của Người rất đáng sợ..."
 marauder.20.3.desc_04: "Cuộc thánh chiến giáo lý lần thứ chín đã diễn ra đến chu kỳ thứ 167. Các phe phái dị giáo vẫn đang ngoan cố chống trả... Vì Mẹ Hư Không, chúng ta tuyệt đối sẽ không nương tay."
 marauder.20.b: "Chúng ta biết một mục tiêu rất thích hợp để các người tập kích..."
 encourage_raid: "Thuê [marauder_species.GetNamePlural] đi tập kích một trong những kẻ thù truyền kiếp của bạn."
 marauder.20.busy.b.1.response: "Các chiến binh của chúng ta đã đi tập kích rồi, không có tâm trí đâu mà lo việc khác."
 marauder.20.busy.b.2.response: "Hây yaaaa! Bọn tao đang đi cướp rồi, bùn đất! Không có thời gian làm việc khác đâu!"
 marauder.20.busy.b.3.response: "Để cưỡng chế thực thi ý chí của Mẹ Hư Không, chúng ta đã đi tập kích bọn không có đức tin rồi. Nếu có ý kiến gì thì đợi sau khi tập kích xong hẵng nói."
 marauder.20.cooldown.b.1.response: "Lần tập kích trước đã khiến chúng ta tổn thất nặng nề, hiện giờ chúng ta hoàn toàn không có đủ tàu để phát động một cuộc tấn công khác, xin hãy quay lại sau."
 marauder.20.cooldown.b.2.response: "Bùn đất, bọn tao phải từ chối, vì hạm đội chưa chuẩn bị xong, những hư hỏng từ lần tập kích trước vẫn chưa được sửa chữa!"
 marauder.20.cooldown.b.3.response: "Cuộc tập kích lần trước của chúng ta vừa mới kết thúc, bây giờ phát động cuộc tấn công nữa là quá sớm. Giờ chúng ta nên cầu nguyện trong im lặng, để bày tỏ lòng thành kính với Mẹ Hư Không."
 marauder.20.d: "Chúng ta dự định thuê một vài lính đánh thuê."
 hire_mercenaries: "Thuê hạm đội lính đánh thuê của [marauder_species.GetName] trong thời gian ngắn."
 marauder.20.e: "Ngắt liên lạc."
 marauder.20.need_rivals: "Hiện tại bạn không có kẻ thù truyền kiếp nào."
 marauder.20.f: "Ông có thể làm phiền ngừng cái tiếng la hét chói tai đó lại được không?"
 marauder.20.f.response: "Hây yaaaa!!! Cái... la hét gì chứ?"
 marauder.20.g: "Chúng ta muốn thuê một nhà lãnh đạo."
 hire_mercenary_leader: "Thuê một nhà lãnh đạo xuất sắc của [marauder_species.GetName], cho đến khi họ qua đời."
 hire_admiral_merc: "\nBạn đã thuê vĩnh viễn một tư lệnh hạm đội xuất sắc của [marauder_species.GetName]."
 hire_general_merc: "\nBạn đã thuê vĩnh viễn một tướng lĩnh lục quân xuất sắc của [marauder_species.GetName]."
 hire_commander_merc: "\nBạn đã thuê vĩnh viễn một chỉ huy xuất sắc của [marauder_species.GetName]."
 marauder.30.e: "Bỏ đi, đừng bận tâm."
 marauder.30.f: "Tạm biệt."
 marauder.31.1.desc: "Ha! Các người muốn chúng ta đi tập kích một trong những kẻ thù truyền kiếp của các người á?\n\nChúng ta không muốn xen vào những cuộc tranh chấp tẻ nhạt giữa các người, nhưng nếu các người ra giá hợp lý, thì chúng ta cũng có thể cân nhắc...\n\nCác người muốn chúng ta tấn công ai?"
 marauder.31.2.desc: "Mày, mày muốn bọn tao đi tập kích một đứa bùn đất kẻ thù của mày? Được thôi, có thể...\n\nNhưng mày muốn bọn tao đánh đứa bùn đất nào?"
 marauder.31.3.desc: "Vì các người đã cống nạp, chúng ta có thể cân nhắc việc đi tập kích lũ vô đức tin.\n\nCác người định bảo chúng ta đi tập kích ai?"
 marauder.31.a: "§Y[raid_target_1.GetName].§!"
 marauder.31.b: "§Y[raid_target_2.GetName].§!"
 marauder.31.c: "§Y[raid_target_3.GetName].§!"
 marauder.31.d: "§Y[raid_target_4.GetName].§!"
 marauder.31.e: "Bỏ đi, đừng bận tâm."
 marauder.31.f: "Tạm biệt."
 marauder.32.1.desc: "[preliminary_target.GetName] quả thực là một mục tiêu tập kích thích hợp cho các chiến binh của chúng ta, chúng ta có thể cân nhắc ra tay với chúng..."
 marauder.32.2.desc: "Đúng thế, cái tên [preliminary_target.GetName] này dùng để nấu súp bùn đất thì không còn gì bằng. Tuyệt lắm. Nhưng có vẻ hơi mệt đấy..."
 marauder.32.3.desc: "Mẹ Hư Không cực kỳ bất mãn với lũ vô đạo [preliminary_target.GetName], nên có một cuộc viễn chinh chiến lược để quán triệt ý chí của Mẹ Hư Không..."
 marauder.32.a: "Chúng ta sẽ trả tiền cho các người, xin hãy dạy cho chúng một bài học."
 marauder.32.1.a.response: "Vậy cứ quyết định thế đi, chúng ta sẽ phát động tấn công vào lúc bình minh."
 marauder.32.2.a.response: "Hây yaaaa!!!! Lũ bùn đất này chắc chắn sẽ phải há hốc mồm cho xem!"
 marauder.32.3.a.response: "Phải cho chúng thấy cơn thịnh nộ của Mẹ Hư Không."
 hire_raid: "\n[current_marauder_diplomacy.GetName] đã tập hợp một hạm đội cướp bóc, chuẩn bị tấn công [preliminary_target.GetName]."
 marauder.34.1.desc: "Mạnh nhất trong toàn thiên hà là lính đánh thuê của [marauder_country_1.GetSpeciesName], đám này mặc dù trông có vẻ thô lỗ, nhưng tính kỷ luật của chúng thuộc hàng bậc nhất. Để bảo vệ danh dự của mình, chúng thậm chí sẽ làm theo yêu cầu của nhà tuyển dụng mà đi tấn công cả những [marauder_country_1.GetSpeciesNamePlural] khác.\n\nĐây là những hạm đội hiện có thể thuê."
 marauder.34.2.desc: "Ngay cả chiến binh bùn đất mạnh nhất cũng chẳng đánh lại nổi một đứa trẻ con của [marauder_country_2.GetSpeciesName], Hây yaaaa!!! Chuyện này thì ai cũng biết cả.\n\nNhưng bọn này đâu phải trẻ con!!! Bọn lính đánh thuê [marauder_country_2.GetSpeciesName] hung hãn này đánh nhau kinh khủng lắm đấy! Chúng sẵn sàng phục vụ cho lũ bùn đất như mày, cũng sẵn lòng đi đánh bọn bùn đất khác, nếu mày ra giá phải chăng, chúng thậm chí còn dám tấn công cả đám [marauder_country_2.GetSpeciesNamePlural] nữa!\n\nDanh sách các hạm đội [marauder_country_2.GetSpeciesName] hiện có thể thuê như sau:"
 marauder.34.3.desc: "Một số người trong các chiến binh của chúng ta cho rằng việc tiêu diệt những kẻ vô đạo là đang quán triệt ý chí của Mẹ Hư Không, ngay cả khi làm vậy là do bọn vô đạo khác sai khiến. Chúng sẽ không ngần ngại tiêu diệt những [marauder_country_3.GetSpeciesNamePlural] khác, bởi vì trong mắt những kẻ cực đoan này, ngoại trừ bản thân ra, tất cả những kẻ khác đều là bọn dị giáo.\n\nNhưng đừng lo lắng. Chúng sẽ không ngu ngốc đến mức đi tấn công nhà tuyển dụng đâu. Tiện thể nói luôn, ta cũng rất an toàn: bởi vì ta là người tìm việc cho chúng, và ta cũng có thể chia một phần lợi nhuận mà chúng kiếm được.\n\nĐây là những hạm đội hiện có thể thuê:"
 marauder.34.1.a: "Hạm đội Hậu duệ Hư Không."
 marauder.34.2.a: "Đội đột kích Bùn đất số 234."
 marauder.34.3.a: "Quán quân Thần Tuyển."
 voidborn_hire: "\nBạn sẽ thuê hạm đội lính đánh thuê này trong 5 năm tiếp theo. Hạm đội này bao gồm:\n\n§Y6 Tàu Tuần dương\n8 Pháo hạm\n16 Tàu Cướp bóc§!"
 marauder.34.1.b: "Hạm đội Kỵ sĩ Tinh tú."
 marauder.34.2.b: "Hạm đội Tiếng gầm Cuồng loạn"
 marauder.34.3.b: "Giáo đoàn Đêm đen."
 star_riders_hire: "\nBạn sẽ thuê hạm đội lính đánh thuê này trong 5 năm tiếp theo. Hạm đội này bao gồm:\n\n§Y4 Tàu Tuần dương\n6 Pháo hạm\n12 Tàu Cướp bóc§!"
 marauder.34.1.c: "Phi đội Cơn bão Nguyên thủy."
 marauder.34.2.c: "Phi đội Tín đồ Cuồng nhiệt."
 marauder.34.3.c: "Đội tiên phong Hoàng hôn."
 storm_wing_hire: "\nBạn sẽ thuê hạm đội lính đánh thuê này trong 5 năm tiếp theo. Hạm đội này bao gồm:\n\n§Y2 Tàu Tuần dương\n4 Pháo hạm\n8 Tàu Cướp bóc§!"
 marauder.34.d: "Thôi, hãy thảo luận về các vấn đề khác đi."
 marauder.34.e: "Tạm biệt."
 marauder.37.1.a.desc: "Chúc mừng, [Root.GetSpeciesNamePlural], với hạm đội vừa mới thuê này, các người có thể tập kích [random_fallen_empire.GetName] được rồi đấy!\n\nÁi chà, có lẽ bây giờ chưa phải lúc ra tay. Nhưng có một điều chắc chắn: thực lực của hạm đội lính đánh thuê này rất mạnh!"
 marauder.37.1.b.desc: "Hạm đội này là của các người rồi, [Root.GetSpeciesNamePlural]. Hãy nhớ kỹ: một [marauder_country_1.GetSpeciesName] có thể địch lại ít nhất mười chiến binh của các chủng tộc khác. Các người có thể dùng điều này để điều chỉnh việc tính toán quân lực của mình."
 marauder.37.2.a.desc: "Lựa chọn của mày rất chính xác, bùn đất! Vì mày đã thuê lũ [marauder_country_2.GetSpeciesNamePlural] cuồng bạo này, bọn bùn đất khác sẽ không thể thuê chúng để tấn công mày nữa! Hây yaaaa!!!!"
 marauder.37.3.a.desc: "Những thánh chiến binh này sẽ phục vụ tốt cho các người, [Root.GetSpeciesNamePlural]. Nhưng có một điểm cần lưu ý, đừng có bước lên tàu của họ. Họ coi tàu của mình là những thánh vật, bất kỳ kẻ vô đạo nào to gan dám bước lên tàu của họ sẽ bị Mẹ Hư Không trừng phạt."
 marauder.37.a: "Còn chuyện khác nữa..."
 marauder.37.b: "Tạm biệt."
 marauder_1_tribute: "Cống nạp cho [marauder_country.GetSpeciesName]"
 marauder_1_tribute_desc: "Chúng ta đã cống nạp cho [marauder_country.GetName], và chúng đồng ý sẽ tạm thời không tấn công chúng ta."
 marauder_2_tribute: "$marauder_1_tribute$"
 marauder_2_tribute_desc: "$marauder_1_tribute_desc$"
 marauder_3_tribute: "$marauder_1_tribute$"
 marauder_3_tribute_desc: "$marauder_1_tribute_desc$"
 marauder.35.1.desc: "Haha, đầu óc ngươi bị đá đập vào rồi à, kẻ ngoại lai! Ngươi muốn chúng ta giúp ngươi chống lại những Đế chế Thức tỉnh đó sao?\n\nTa phải từ chối thôi."
 marauder.35.2.desc: "Hây yaaaa!!!!\n\nKhông nha, bọn bùn đất, mặc dù bọn tao hành xử điên rồ, nhưng bọn tao chưa điên đến mức dám đi tấn công bọn bùn đất sa ngã đó."
 marauder.35.3.desc: "Mặc dù chúng là bọn vô đạo, nhưng phát động tấn công chúng vào lúc này chẳng khác nào lấy trứng chọi đá, đây không phải là ý chí của Mẹ Hư Không.\n\nMuốn dọn dẹp chúng thì ít nhất cũng phải đợi thêm một hai ngàn năm nữa."
 marauder.40.1.desc: "Được, chuyện này có thể thu xếp, chúng ta có rất nhiều chiến binh cừ khôi đang tìm kiếm những thách thức và cơ hội mới.\n\nNếu các người có thể đưa ra cái giá đủ tốt để khiến họ phá bỏ lời thề với đồng tộc, thì họ có thể thề trung thành với các người và chiến đấu vì các người."
 marauder.40.2.desc: "Hây yaaaa!! Đúng vậy, đúng vậy! Nhiều chiến binh [marauder_species.GetName] tinh ranh rất sẵn lòng chiến đấu vì lũ bùn đất đấy! Chỉ cần điều kiện hợp lý là được."
 marauder.40.3.desc: "Đúng vậy, những chiến binh mạnh nhất của chúng ta rất sẵn lòng dẫn dắt binh lính của các người ra trận. Với sự hỗ trợ bằng điểm Năng lượng của các người, chúng ta có thể phục vụ Mẹ Hư Không tốt hơn.\n\nLý do khiến các chiến binh của chúng ta dũng cảm và có sức chiến đấu cao là vì họ dành cả đời để phục vụ Mẹ Hư Không."
 marauder.40.1.a: "Thuê tư lệnh hạm đội"
 marauder.40.2.a: "Thuê tướng lĩnh lục quân"
 marauder.40.3.a: "Thuê chỉ huy"
 marauder.40.a.response: "Rất tốt, lời thề đã được lập, giờ các người có thể tùy ý sử dụng những chiến binh này."
 marauder.40.b.response: "Ái chà! Tên [marauder_species.GetName] này cực kỳ xảo quyệt đấy! Ngươi rất may mắn đó, [Root.GetSpeciesNamePlural]!"
 marauder.40.c.response: "Mẹ Hư Không đã ban phước cho chúng ta ký kết khế ước này, hy vọng các dũng sĩ của chúng ta có thể giúp các người hoàn thành tâm nguyện."
 marauder.46.name: "Có sẵn Lính đánh thuê Cướp bóc"
 marauder.46.desc: "Cùng với sự bành trướng không ngừng của các khu vực trong thiên hà, biên giới của các quốc gia bắt đầu tiếp xúc với nhau, những cuộc xung đột vũ trang sắp tới sẽ là điều không thể tránh khỏi.\n\nCác gia tộc Cướp bóc sau khi nhận thức được điều này, đã bắt đầu rời khỏi hệ sao quê nhà của mình để tìm kiếm danh tiếng và vinh quang ở các hệ sao bên ngoài. Họ chọn trở thành lính đánh thuê, cung cấp dịch vụ cho nhà tuyển dụng nào trả giá cao nhất."
 marauder.46.a: "Lính đánh thuê giỏi rất khó tìm."
 leader_trait_mercenary_warrior: "Chiến binh đánh thuê"
 leader_trait_mercenary_warrior_desc: "Nhà lãnh đạo này xuất thân từ một nền văn hóa chiến binh vũ trụ, người này đã học được các chiến thuật du kích phi truyền thống từ khi còn rất nhỏ."
 leader_trait_great_khan: "Đại Khả Hãn"
 leader_trait_great_khan_desc: "Đại Khả Hãn là một nhà cai trị cực kỳ lôi cuốn, một nhà chiến thuật xuất chúng và, nếu những lời đồn đại là sự thật, thì còn là một người có siêu năng lực ngoại cảm mạnh mẽ."
 leader_trait_ruler_great_khan: "$leader_trait_great_khan$"
 leader_trait_ruler_great_khan_desc: "$leader_trait_great_khan_desc$"
 marauder.50.name: "Chấm dứt khế ước đánh thuê"
 marauder.50.desc: "Khế ước lính đánh thuê của chúng ta với §H[Root.GetName]§! đã hết hạn. Lãnh đạo của họ ———— chỉ huy [Root.Leader.GetName] lập tức đề nghị gia hạn hợp đồng với chúng ta, để những con tàu hiện đang nghe lệnh của [Root.Leader.GetHerHis] tiếp tục phục vụ cho chúng ta thêm năm năm nữa... Tất nhiên là phải trả thêm phí.\n\nNếu chúng ta từ chối, những lính đánh thuê này sẽ rời bỏ chúng ta để đi tìm chủ mới."
 marauder.50.a: "Gia hạn hợp đồng."
 marauder.50.b: "Để họ rời đi."
 marauder.71.name: "Chỉ huy đánh thuê bị thay thế"
 marauder.71.desc: "Do cựu chỉ huy của §H[Root.GetName]§! qua đời đột ngột, [marauder_species.GetNamePlural] đã phái chỉ huy §H[new_leader.GetName]§! đến tiếp quản chức vụ của cựu chỉ huy."
 marauder.76.name: "Lính đánh thuê [marauder_species.GetName] biến mất"
 marauder.76.desc: "Việc mất đi hệ sao quê nhà dường như đã giáng một đòn mạnh vào lính đánh thuê §H[marauder_species.GetName]§! của [Root.GetName]. Dù khế ước năm năm chúng ta ký kết với họ vẫn chưa hết hạn, nhưng đám người đó đã cuốn gói tháo chạy cùng với tàu của họ không chừa lại dấu vết nào!\n\nThông điệp liên lạc cuối cùng mà họ để lại là:\n\n§RChúng ta nhất định sẽ báo thù.§!"
 marauder.76.a: "Khế ước của chúng ta còn chưa kết thúc mà!"
 marauder.77.name: "Lính đánh thuê gia nhập Đại Khả Hãn"
 marauder.77.desc: "Sự trỗi dậy của [raider_khanate.GetName] dưới trướng Đại Khả Hãn đã đẩy nhiều lính đánh thuê [raider_khanate.GetSpeciesName] đã ký khế ước với chúng ta rơi vào cơn cuồng tín chủ nghĩa dân tộc, những lính đánh thuê này phớt lờ khế ước đã ký với chúng ta và lần lượt phản bội để gia nhập phe của Đại Khả Hãn."
 marauder.86.a.desc: "Chú ý, [Root.GetSpeciesNamePlural].\n\nNếu các người muốn kẻ khác thay mình làm bia đỡ đạn xông pha trận mạc, các người có thể đi thuê hạm đội lính đánh thuê [marauder_mercenary_country.GetSpeciesName]. Nếu các người có thể trả mức giá họ yêu cầu, các người sẽ có được đội quân đánh thuê mạnh nhất trong vũ trụ."
 marauder.86.a: "Cảm ơn đã thông báo."
 marauder.87.a.desc: "Hây yaaaa!!! Nghe đây, bọn bùn đất!\n\nCác chiến binh của chúng ta vì rảnh rỗi quá đâm ra buồn chán, đã bắt đầu nội chiến rồi, thương vong vô số! Nhưng chúng ta có cách giải quyết... Chúng ta quyết định phái những chiến binh lợi hại nhất của mình đến phục vụ cho bùn đất, tất nhiên là các người phải trả bằng Năng lượng! Nếu các người muốn đội quân đánh thuê mạnh nhất vũ trụ chi viện cho mình, thì hãy nhanh tay lên!"
 marauder.88.a.desc: "Mẹ Hư Không toàn tri toàn năng có một lời nhắn nhủ dành cho ngươi:\n\nMẹ Hư Không đã thấu hiểu những gì ngươi khao khát, hiện tại ngươi có thể thuê một số hạm đội lính đánh thuê của chúng ta. Thuyền viên của chúng ta đều là những người được huấn luyện bài bản, nếu có thể cung cấp đủ thù lao, tất cả họ đều sẽ nghe theo mệnh lệnh của ngươi.\n\nĐây là một món quà khó tin, xin đừng lãng phí tấm lòng của Người."
 marauder.101.1.desc: "Những kẻ yếu đuối của [Root.GetSpeciesName], các chiến binh của chúng ta đang chuẩn bị tấn công hệ sao của các người, chọn dũng cảm đối mặt với họ, hay trốn chui trốn nhủi như những kẻ hèn nhát để trơ mắt nhìn các chiến binh của chúng ta cướp đi của cải của các người.\n\nTất nhiên, các người cũng có thể cống nạp ngay bây giờ, nếu giá trị đồ cống nạp đủ lớn, chúng ta có thể cân nhắc việc không tấn công các người..."
 marauder.101.2.desc: "Hây yaaaa!!!! [Root.GetSpeciesName] —— bùn đất! Bọn tao đến hệ sao của bọn mày chơi đây! Tiện thể cướp chút đồ, để bọn mày khỏi vì quá giàu mà béo núc ních ra!\n\nTrừ khi bọn mày có thể tìm ra lý do để ngăn cản bọn tao làm điều đó..."
 marauder.101.3.desc: "[Root.GetSpeciesNamePlural]. Mẹ Hư Không đã giáng thánh huấn, mong muốn dùng hệ sao của các người làm nơi tế tự để ăn mừng quyền thống trị vĩnh hằng của Người đối với cõi hư không này. Chúng ta là những bề tôi trung thành của Mẹ Hư Không, chúng ta phải quán triệt ý chí của Người.\n\nMột hạm đội bao gồm những chiến binh ưu tú nhất của chúng ta đang tiến đến hệ sao của các người để thu thập đồ hiến tế. Hoặc nếu các người sẵn lòng thỏa mãn cơn đói của Mẹ Hư Không, cũng có thể chủ động cống nạp ngay từ bây giờ, nếu số lượng cống nạp đủ, chúng ta cũng có thể dừng cuộc tấn công nhắm vào các người."
 marauder.101.a: "Dâng đồ cống nạp §Y(Năng lượng)§!"
 marauder.101.b: "Dâng đồ cống nạp §Y(Khoáng sản)§!"
 marauder.101.c: "Dâng đồ cống nạp §Y(Thức ăn)§!"
 marauder.101.1.a.response: "Thật đáng tiếc! Xem ra phải để các chiến binh của chúng ta đi tìm vui ở nơi khác rồi.\n\nNgười dân của các người đã an toàn, ít nhất là trong thời gian ngắn sẽ không bị chúng ta tấn công."
 marauder.101.d: "Đừng hòng lấy bất cứ thứ gì từ chúng ta."
 marauder.101.1.b.response: "Nếu các người không chịu chủ động dâng cống nạp, thì chúng ta sẽ đến cướp! Các người sẽ phải hối hận vì quyết định ngu xuẩn này!"
 marauder.101.2.a.response: "Bọn mày biết điều đấy, bùn đất! Giờ thì bọn tao đành đi chỗ khác kiếm ăn thôi! Bọn mày có thể yên tâm rồi!"
 marauder.101.2.b.response: "Mày có thể nói vậy thì tốt quá rồi, bùn đất! [raiding_marauder.GetSpeciesNamePlural] rất thích thử thách!\n\nHây yaaaa!!!!"
 marauder.101.3.a.response: "Không chọc giận Mẹ Hư Không, cách làm của ngươi rất khôn ngoan. Ngươi không thể tưởng tượng được sự trả thù của Người khủng khiếp đến mức nào đâu."
 marauder.101.3.b.response: "Dù trước khi đề nghị, Mẹ Hư Không toàn tri toàn năng đã đoán trước được ngươi sẽ phản hồi như thế này, nhưng chúng ta vẫn phải làm theo thủ tục. Bây giờ, bất kể giàu nghèo, người dân của chúng ta sẽ tiến hành một cuộc thánh chiến để bảo vệ đức tin vĩ đại của mình. Tất nhiên, tất cả là nhân danh Chúa tể."
 marauder.102.1.desc: "Cuối cùng thì các người cũng phải khóc lóc chạy đến cầu xin sự thương xót rồi, [Root.GetSpeciesNamePlural]? Các người vẫn có thể dâng cống nạp để quỳ lạy van xin chúng ta tránh xa lãnh thổ của các người, nhưng chúng ta sẽ tăng giá."
 marauder.102.2.desc: "Sao nào, bùn đất? Bọn mày không muốn bọn tao tới chơi nữa à? Bọn mày muốn bọn tao đi? Hây yaaaa!!\n\nBọn mày có thể trả tiền, nhưng giá cả cũng phải tăng theo..."
 marauder.102.3.desc: "Mẹ ta cảm thấy phẫn nộ trước những lời lẽ và hành động báng bổ của ngươi, [Root.GetSpeciesNamePlural]... Vô cùng phẫn nộ. Mỗi một [Root.GetSpeciesName] mà chúng ta đem đi hiến tế sống trong cuộc thánh chiến đều sẽ xoa dịu đi một tia phẫn nộ của Người, nhưng bấy nhiêu liệu đã đủ chưa?\n\nNếu ngươi muốn dâng đồ cống nạp cho Mẹ Hư Không để bắt chúng ta rút quân, tốt nhất là ngươi nên biết rõ, bây giờ Người đang cần nhiều vật hiến tế hơn."
 marauder.102.d: "Anh bạn à, anh bạn trông thật gớm ghiếc."
 marauder.102.e: "Ngắt liên lạc."
 marauder.102.1.a.response: "Hãy nghĩ xem sự từ chối ngu ngốc của các người đã mang lại bao nhiêu tai họa khi chúng ta yêu cầu cống nạp lúc ban đầu. Các người nên rút ra bài học từ chuyện này, [Root.GetSpeciesNamePlural]."
 marauder.102.2.a.response: "Ya ha yi ha!!!! Thế thì tốt rồi. Bọn tao đã lấy được thứ mình muốn. Tạm thời chưa cần uống súp bùn đất nữa, tạm thời thôi."
 marauder.102.3.a.response: "Mẹ Hư Không rất hài lòng. Những vật hiến tế sống này khiến tinh thần Người vô cùng vui sướng, Người đã cho phép các chiến binh của mình rút lui. Tạm biệt, [Root.GetSpeciesName]."
 marauder.102.1.b.response: "Ta... Ngươi, ngươi... vẻ ngoài của ta, chuyện đó không quan trọng...\n\nNgươi sẽ phải hối hận vì những lời lẽ lăng mạ khinh miệt này, [Root.GetSpeciesName]. Các chiến binh của chúng ta sẽ xé xác cái hạm đội nực cười của các người thành từng mảnh!"
 marauder.111.1.desc: "[Root.GetSpeciesNamePlural], có thể chui ra khỏi hang chuột chũi của các người được rồi đấy. Chúng ta đã 'giải phóng' đủ của cải từ chỗ các người rồi, bây giờ đang dùng tàu chở về đây.\n\nNày! Các anh em lái tàu! Chúng ta phải về [marauder_system.GetName] thôi. Hãy rời khỏi địa bàn của lũ khốn này đi, cái chỗ quái quỷ này làm ta thấy phát tởm."
 marauder.111.2.desc: "Bùn đất, bọn tao đã cướp đủ rồi, không cần cướp nữa, tàu của bọn tao đã đầy đến mức không chứa nổi nữa rồi.\n\nGiờ bọn tao sẽ về [marauder_system.GetName] đây."
 marauder.111.3.desc: "Thánh chiến đã kết thúc. Mẹ Hư Không rất hài lòng với sự tàn phá mà chúng ta đã gây ra trên lãnh thổ của các người, [Root.GetSpeciesNamePlural]. Bây giờ Người đã cho phép chúng ta trở về [marauder_system.GetName] rồi."
 marauder.111.a: "Cút mau đi!"
 marauder.112.1.desc: "Chuyện này rất thú vị đúng không? Cuộc chiến này mới thật hào hứng làm sao! Những chiến binh hùng mạnh nhất của chúng ta sẽ so tài với những đội quân tinh nhuệ nhất của các người. Hãy xem ai mới là kẻ chiến thắng!"
 marauder.112.2.desc: "Bùn đất, mày có chuyện gì? Bọn tao đang bận đi dọn sạch địa bàn của mày đây!"
 marauder.112.3.desc: "Chúng ta tồn tại chỉ vì ý chí của Mẹ ta. Dù hiện tại những kẻ rủng rỉnh tiền bạc thuê chúng ta đến tiêu diệt các người, nhưng chỉ cần kết quả cuối cùng có thể khiến nhiều kẻ dị giáo trở thành vật tế sống cho Mẹ ta hơn, Mẹ ta chắc chắn sẽ đồng ý với hành động của chúng ta."
 marauder.104.name: "Tàu Cướp bóc tấn công [Root.GetName]"
 marauder.104.desc: "Đoàn cướp bóc [marauder_country.GetSpeciesName] đã đổ bộ lên §H[Root.GetName]§!! Hạm đội của chúng đã triển khai hàng loạt chiến đấu cơ cỡ nhỏ từ trên quỹ đạo, bọn [marauder_country.GetSpeciesNamePlural] đã tấn công một số khu dân cư nằm rải rác trên [Root.GetPlanetMoon] trước khi rút lui. Lực lượng phòng thủ trên mặt đất của chúng ta hoàn toàn không kịp phản ứng."
 marauder.104.a: "Lũ khốn kiếp."
 marauder.105.desc: "Bọn buôn nô lệ [marauder_country.GetSpeciesName] đã đổ bộ lên §H[Root.GetName]§!! Các chiến đấu cơ đã oanh tạc nhiều khu định cư trên [Root.GetPlanetMoon], bắt giữ vô số thực dân và còng tay họ lôi lên hạm đội của những kẻ cướp bóc trên quỹ đạo."
 marauder.105.a: "Nhất định phải bắt chúng phải trả giá vì điều này."
 marauder.106.desc: "Một lực lượng nhỏ quân đội của [marauder_country.GetSpeciesName] đã tiến hành một cuộc chiến đánh nhanh rút gọn trên §H[Root.GetName]§!. Những đợt đổ bộ nhảy dù rải rác của chúng đã khiến các đơn vị phản ứng chiến thuật chỉ huy lực lượng phòng thủ mặt đất không kịp trở tay, cho đến khi lũ man rợ này cướp phá xong các khu định cư và bình an vô sự trở về hạm đội trên quỹ đạo của chúng thì họ mới kịp phản ứng."
 marauder.106.a: "Chuyện này thật sự quá tồi tệ."
 marauder.107.desc: "Bọn buôn nô lệ [marauder_country.GetSpeciesName] đã đổ bộ lên §H[Root.GetName]§!! Những chiến đấu cơ rít gào trút cơn mưa bom, phá tung cánh cửa của những khu tị nạn sinh vật hữu cơ, sau đó một đoàn cướp bóc trang bị tận răng đã bao vây khu tị nạn.\n\nNhững sinh vật hữu cơ đang bối rối vừa mới tỉnh giấc khỏi những giấc mơ êm đềm bên trong khu tị nạn đã bị lũ buôn nô lệ này tóm gọn và đưa lên hạm đội trên quỹ đạo của chúng."
 marauder.107.a: "Vật phẩm trưng bày sống của chúng ta!"
 marauder.108.desc: "Đoàn cướp bóc [marauder_country.GetSpeciesName] đã đổ bộ lên §H[Root.GetName]§!! Đám cướp bóc này đã cướp phá một số tiền đồn của chúng ta trên [Root.GetPlanetMoon] và tàn sát hàng ngàn tiểu thể trước khi trở lại hạm đội trên quỹ đạo."
 marauder.108.wilderness.desc: "Đoàn cướp bóc [marauder_country.GetSpeciesAdj] đã xâm phạm §H[Root.GetName]§!! Đám cướp đê tiện này đã lục soát nhiều cơ sở của chúng ta trên [Root.GetPlanetMoon], tàn sát hàng trăm cá thể cộng sinh trước khi quay trở lại hạm đội trên quỹ đạo."
 marauder.108.a: "Chúng ta phải trừng phạt hành động vô liêm sỉ này."
 marauder.112.a: "Ai đã thuê các người đến tấn công chúng ta?"
 marauder.112.1.a.response: "Lũ hèn nhát đáng thương đó không dám đến đánh các người, nên mới thuê chúng ta đến tấn công. Biết được danh tính của chúng cũng chẳng có ý nghĩa gì với các người đâu, bởi vì bản thân đám đó vốn chẳng có gì quan trọng.\n\nNhưng vì thù lao chúng trả rất hậu hĩnh, nên chúng ta cũng sẵn lòng giấu giếm danh tính của chúng."
 marauder.112.2.a.response: "Đó là bí mật, bùn đất! Chúng là bùn đất, giống như mày vậy, bọn tao chỉ có thể nói bấy nhiêu thôi."
 marauder.112.3.a.response: "Một lũ dị giáo. Một lũ vô đạo. Một lũ dị giáo.\n\nChúng ta chỉ nhận tiền của người ta thì phải làm việc thay cho họ thôi, rất nhanh sẽ không còn liên lạc với họ nữa, nhưng số Năng lượng mà họ bỏ ra có thể làm hài lòng ý chí của Mẹ Hư Không."
 marauder.112.b: "Ngắt liên lạc."
 marauder.114.name: "Từ bỏ cướp bóc"
 marauder.114.desc: "Những tổn thất nặng nề mà chúng ta giáng xuống hạm đội cướp bóc của [marauder_country.GetSpeciesName] đủ để khiến chúng phải dừng bước cướp bóc. Có vẻ như sau khi cân nhắc tất cả các lựa chọn khả thi, bọn [marauder_country.GetSpeciesNamePlural] cuối cùng đã quyết định ngừng cướp bóc và trở về lãnh thổ của mình."
 marauder.114.a: "Bọn chúng tự cao tự đại, kết cục là tự chuốc lấy nhục nhã."
 marauder.116.name: "Hạm đội cướp bóc bị tiêu diệt"
 marauder.116.desc: "Hạm đội cướp bóc của [From.GetSpeciesName] đã cố gắng cướp phá lãnh thổ của chúng ta, nhưng đã bị tiêu diệt hoàn toàn tại hệ sao [destroyed_fleet_system.GetName]. Không tìm thấy bất kỳ ai sống sót trong đống mảnh vỡ của những con tàu."
 marauder.116.a: "Hãy để thất bại thảm hại này trở thành bài học cho chúng."
 marauder.117.desc: "Kẻ cướp bóc §H[marauder_country.GetSpeciesName]§! từng quyết định phát động cướp bóc §H[marauder_target.GetName]§! sau một phen 'khích lệ' của chúng ta nay đã cụp đuôi chạy về hệ sao của chúng! Hạm đội cướp bóc của chúng bị hư hại nghiêm trọng, buộc chúng phải từ bỏ kế hoạch cướp bóc ban đầu."
 marauder.117.a: "Đám hèn nhát này!"
 marauder.120.name: "[raiding_marauder.GetSpeciesName] đang tới"
 marauder.120.desc: "Một hạm đội §H[raiding_marauder.GetSpeciesName]§! đang tiến tới biên giới của chúng ta! Chúng ta đã chặn được các cuộc liên lạc của hạm đội này, chúng được một quốc gia thù địch thuê để tấn công hệ sao của chúng ta, hiện chúng đang gửi thông điệp cho chúng ta trên một kênh công khai."
 marauder.121.1.desc: "Những kẻ nhát cáy núp trong bóng tối muốn mượn tay chúng ta để giết người, vì đám giòi bọ đó quá e ngại nên không dám tự mình ra tay. Không biết trong số các chiến binh [Root.GetSpeciesName] có ai đủ can đảm để cùng chúng ta quyết chiến một trận quang minh chính đại trên chiến trường hay không, hay sẽ ngoan ngoãn đứng yên để chúng ta cướp bóc lãnh thổ của các người? Hãy cho chúng ta thấy danh dự của các người!"
 marauder.121.2.desc: "Hây yaaaa!!! Kẻ thù của bọn mày cũng không ít đâu nha, bùn đất! Những kẻ thù đó đã thuê bọn tao đến phá hoại hệ sao của mày! Bọn tao rất sẵn lòng làm giúp họ đó!"
 marauder.121.3.desc: "Nếu một đám dị giáo trả tiền thuê chúng ta đi tiêu diệt một đám dị giáo khác, thì tại sao chúng ta lại phải từ chối? Sớm muộn gì chúng ta cũng sẽ xử lý hết thảy đám tà giáo đó, nhưng ít nhất hiện tại chúng ta sẽ nhắm vào các người."
 marauder.121.a: "Báo động đỏ!"
 marauder.122.name: "Tàu Cướp bóc [raid_parent.GetSpeciesName] rút lui"
 marauder.122.desc: "Dưới sự 'khích lệ' của chúng ta, §H[raid_parent.GetSpeciesNamePlural]§! đã phái một hạm đội cướp bóc đến chỗ §H[raid_victim.GetName]§!. Bây giờ các con tàu đã chất đầy chiến lợi phẩm và nô lệ, và đã sẵn sàng cho chuyến hành trình trở về. Các chủ tàu đều bày tỏ rằng cuộc tấn công này rất thành công."
 marauder.122.a: "Làm tốt lắm."
 marauder.123.desc: "Một hạm đội tư lược thuộc về một chủng tộc chưa từng được biết đến trước đây đang xâm phạm biên giới của chúng ta! Những kẻ man rợ tự xưng là §H[raiding_marauder.GetSpeciesNamePlural]§! này rõ ràng đã được các thế lực bên ngoài thù địch với chúng ta hậu thuẫn để tấn công lãnh thổ của chúng ta. Chúng đang gửi một thông điệp cho chúng ta từ kênh công khai."
 marauder.124.name: "Hạm đội Cướp bóc [raiding_marauder.GetSpeciesName] bị tiêu diệt"
 marauder.124.desc: "Dưới sự xúi giục của chúng ta, hạm đội tư lược do lũ [raiding_marauder.GetSpeciesNamePlural] lập ra đã bị [fleet_destroyer.GetName] tiêu diệt hoàn toàn tại hệ sao [destroyed_fleet_system.GetName]! Chưa có bất kỳ báo cáo liên quan nào về những người sống sót."
 marauder.124.a: "Hy vọng chúng đã gây ra được chút sát thương cho kẻ thù trước khi bị tiêu diệt."
 marauder.501.name: "Tiếng trống chiến tranh"
 marauder.501.desc: "Từ thuở hồng hoang cho đến tận hôm nay, lần đầu tiên các bộ lạc lớn nhỏ của §H[raider_khanate.GetSpeciesNamePlural]§! ngừng lại cuộc nội chiến cuồng nhiệt của mình, đoàn kết lại với nhau một cách chưa từng có dưới trướng của một vị §HĐại Khả Hãn§!. Vị thống soái này với tài năng xuất chúng và ý chí kiên cường, đã bộc lộ được tài năng trong tầng lớp chiến binh, và cuối cùng đã hoàn thành được một công cuộc thống nhất vĩ đại ngoài sức tưởng tượng. Mặc dù những bộ lạc này chẳng qua cũng chỉ là một nhóm những chủng loài xảo quyệt, mê tín và hiếu chiến, nhưng vị Đại Khả Hãn vĩ đại mới đăng quang này đã giành được lòng trung thành và sự yêu mến của tất cả các bộ lạc [raider_khanate.GetSpeciesName].\n\nVì chúng đã dập tắt đi ngọn lửa nội chiến, [raider_khanate.GetSpeciesNamePlural] sẽ hướng ánh mắt về những nơi khác trong dải ngân hà này. Tất cả các hạm đội đã được tập hợp lại, chở theo vô số chiến binh cuồng nhiệt. Mặc dù vài tháng trước đây chúng vẫn là những kẻ thù không đội trời chung với nhau, nhưng hiện tại, chúng đã là những đồng chí luôn khao khát được cùng nhau bành trướng thông qua các cuộc chiến tranh đối ngoại."
 marauder.501.a: "Một mối đe dọa mới đã ra đời."
 marauder.502.desc: "Ta là §H[raider_khanate.Ruler.GetName]§!, là Đại Khả Hãn của §H[raider_khanate.GetName]§!, ta ở đây để tuyên bố với toàn thiên hà rằng, chúng ta sắp sửa chào đón một kỷ nguyên mới. Kỷ nguyên tăm tối khi [raider_khanate.GetSpeciesNamePlural] đấu đá lẫn nhau vì vinh quang và tài nguyên đã kết thúc rồi.\n\nTa xin hứa với người dân của mình rằng, đế chế vĩ đại mới được thành lập sẽ khiến cái tên của chủng loài [raider_khanate.GetSpeciesName] được khắc ghi vĩnh viễn trong biên niên sử của thiên hà.\n\nNhững kẻ có ý đồ cản đường chúng ta hãy nhớ cho kỹ: Ta sẽ bằng mọi giá để người dân của ta thực hiện được hoài bão của mình, nếu các người cả gan chống đối chúng ta, [raider_khanate.GetName] chắc chắn sẽ tiêu diệt các người."
 marauder.502.a: "Thật là những lời lẽ hùng hồn."
 marauder.502.b: "Đang tính toán vector rủi ro."
 marauder.504.name: "Đại Khả Hãn đã đoạt lấy [conquered_planet.GetName]!"
 marauder.504.desc: "Sau khi đánh tan lực lượng phòng thủ của §H[conquered_planet.GetName]§!, lực lượng mặt đất của [From.GetName] đã lấy danh nghĩa của Đại Khả Hãn để chiếm đóng [conquered_planet.GetPlanetMoon]! Bọn chúng đã cắm cờ của đế chế mới nổi này lên cao tại các khu định cư chính trên bề mặt [conquered_planet.GetPlanetMoon]. Bây giờ, những thực dân của [From.GetSpeciesName] đã bị đuổi khỏi nơi ở đã bị phá hủy của họ, và bị dồn hết lên các tàu vận tải."
 marauder.504.a: "Phải ngăn cản tên Đại Khả Hãn đó!"
 marauder.506.name: "Đại Khả Hãn nhận lấy thất bại"
 marauder.506.desc: "[great_khan.GetName], Đại Khả Hãn của [From.GetName], [great_khan.GetHerHis] huênh hoang tự nhận bản thân là một thiên tài quân sự, nhưng lại chuốc lấy thất bại đáng xấu hổ tại hệ sao [khan_death_system.GetName]. Khi hạm đội do [great_khan.GetSheHe] chỉ huy bị đánh tan trong trận giao chiến với hạm đội của [khan_destroyer.GetName], Đại Khả Hãn cùng các hầu cận của [great_khan.GetHerHis] đã lên tàu vận tải cỡ nhỏ trốn chạy vào các tuyến không gian đa chiều và tháo chạy tán loạn.\n\nMặc dù đến tận bây giờ, [great_khan.GetName] vẫn đang chuẩn bị cho một hạm đội mới để bắt đầu lại cuộc chinh phạt của [great_khan.GetHerHis], nhưng chiến thắng vĩ đại này sẽ mang lại nguồn động viên to lớn cho tất cả các quốc gia đang phản kháng lại bè lũ xâm lược [From.GetName] tham lam vô độ."
 marauder.506.a: "Xem ra Đại Khả Hãn không phải là bất khả chiến bại."
 marauder.508.desc: "Ta là Thiên Khả Hãn của [From.GetName], [great_khan.GetName]. Thất bại của ta tại [khan_destroyer.GetRealName] chẳng qua chỉ là tổn thất chút ít vũ khí mà thôi. [khan_destroyer.GetSpeciesNamePlural] là những chiến binh dũng cảm, là đối thủ đáng kính, nhưng chúng vẫn không thể thoát khỏi số phận bị ta đánh bại.\n\nĐại cục thiên hà vốn đã định, thuận ta thì sống, nghịch ta thì chết. Hạm đội mới tinh của ta đã chuẩn bị xong rồi."
 marauder.508.desc.1: "$marauder.508.desc$ Sau khi chiến tranh kết thúc, tất cả những tổng đốc vùng bảo hộ ủng hộ ta đều sẽ nhận được phong thưởng của ta."
 marauder.508.desc.2: "$marauder.508.desc$ Hãy thề thần phục ta đi, nhân lúc các người vẫn còn thời gian để lựa chọn."
 marauder.508.desc.3: "$marauder.508.desc$ Kẻ nào chống đối ta phải chết."
 marauder.508.a: "Tên đồ tể đó đã quay trở lại rồi."
 marauder.510.name: "Cái chết của Đại Khả Hãn"
 marauder.510.desc: "Đại Khả Hãn [great_khan.GetName] đã chết. Hạm đội của [great_khan.GetHerHis] đã gặp phải thất bại lần thứ hai tại hệ sao [khan_death_system.GetName], sau khi hạm đội bị đánh bại bởi [khan_destroyer.GetName], Đại Khả Hãn đã không cố gắng bỏ trốn mà quyết tâm cùng chung số phận với soái hạm của [great_khan.GetHerHis].\n\nVới cái chết của vị thủ lĩnh đáng kính của mình, [From.GetName] một lần nữa dấy lên một trận tinh phong huyết vũ tranh quyền đoạt lợi. Những quân phiệt dưới quyền của Đại Khả Hãn đang cầm vũ khí chống lại nhau, chỉ để tranh giành di sản của [great_khan.GetHerHis] ———— quyền kiểm soát đế chế. Rốt cuộc ai mới là người có thể cười đến cuối cùng vẫn chưa thể biết được."
 marauder.510.a: "Xem ra sự thống trị của [great_khan.GetName] đã kết thúc vào ngày hôm nay."
 marauder.513.a.desc: "Đại Khả Hãn [great_khan.GetName] của [raider_khanate.GetName] đã chết! Thông tin chi tiết vẫn chưa rõ ràng, nhưng những thông tin chúng ta chặn được cho thấy, Đại Khả Hãn đã bị hạ độc chết bởi một tên lãnh chúa đầy dã tâm dưới quyền [great_khan.GetHerHis].\n\nCùng với cái chết của nhà lãnh đạo đáng kính của mình, [raider_khanate.GetName] một lần nữa lại dấy lên một trận tinh phong huyết vũ tranh giành quyền lực. Các lãnh chúa dưới quyền Đại Khả Hãn giao tranh với nhau, chỉ để tranh giành di sản của [great_khan.GetHerHis] ———— quyền kế thừa đế chế. Rốt cuộc ai có thể cười đến cuối cùng thì vẫn chưa biết được."
 marauder.513.b.desc: "Đại Khả Hãn [great_khan.GetName] của [raider_khanate.GetName] đã chết! Theo những thông tin mà chúng ta chặn được, nguyên nhân cái chết của Đại Khả Hãn là do không thể chống chọi lại sự tấn công của căn bệnh có tên Sốt Sarakelean, đây là một căn bệnh phổ biến và gây tử vong của [raider_khanate.GetSpeciesNamePlural], nó là di sản để lại từ môi trường sống tồi tệ trên các trạm vũ trụ trước khi [raider_khanate.GetName] trỗi dậy."
 marauder.513.c.desc: "Đại Khả Hãn [great_khan.GetName] của [raider_khanate.GetName] đã chết! Những thông tin chặn được cho thấy, Đại Khả Hãn đã bị ám sát bởi lực lượng đặc nhiệm được cử đi bởi một thế lực ngoài hành tinh không rõ danh tính. Hiện tại không có bất kỳ chính phủ nào lên tiếng nhận trách nhiệm về việc này."
 marauder.513.d.desc: "Đại Khả Hãn [great_khan.GetName] của [raider_khanate.GetName] đã chết! Thông tin chi tiết hiện vẫn chưa rõ ràng, nhưng những thông tin chúng ta chặn được cho thấy, Đại Khả Hãn đã bị một tì thiếp ngoài hành tinh ám sát ngay trong căn phòng cá nhân của [great_khan.GetHerHis] trên soái hạm của [great_khan.GetHerHis]. Động cơ ám sát chưa rõ."
 marauder.513.e.desc: "Đại Khả Hãn của [raider_khanate.GetName] đã chết! Dựa theo những thông tin chặn được hiện tại, [great_khan.GetName] do tuổi cao sức yếu, đã qua đời từ vài ngày trước một cách thanh thản.\n\nMặc dù người ta tin rằng Khả Hãn đã chỉ định người thừa kế, nhưng [raider_khanate.GetName] vẫn dấy lên một trận tinh phong huyết vũ tranh giành quyền lực. Những lãnh chúa dưới trướng Đại Khả Hãn đang cầm vũ khí chống lại nhau để tranh giành di sản của [great_khan.GetHerHis] —— quyền kiểm soát đế chế, rốt cuộc ai có thể cười đến cuối cùng vẫn chưa biết được."
 liberated_planet.part1: "Sau khi chúng ta đánh bại toàn bộ quân đội của Khả Hãn trên bề mặt §H[liberated_planet.GetName]§!, quân đội của chúng ta đã hoàn toàn kiểm soát được [liberated_planet.GetPlanetMoon] này."
 liberated_planet.part2: "Trước khi quân đội của Khả Hãn chiếm đóng [raider_khanate.GetName], hành tinh này từng thuộc về §H[planet_former_owner.GetName]§!. Nếu chúng ta trả lại hành tinh cho họ, có lẽ họ sẽ rất biết ơn."
 marauder.516.name: "Giải phóng [liberated_planet.GetName]"
 marauder.516.desc: "Quân đội của chúng ta đã giải phóng thành công §H[liberated_planet.GetName]§! khỏi quân đội Khả Hãn! Bây giờ [liberated_planet.GetPlanetMoon] này cuối cùng đã trở lại trong tầm kiểm soát của chúng ta."
 marauder.516.a: "Đây là một thắng lợi vĩ đại!"
 marauder.517.desc: "$liberated_planet.part1$\n\n$liberated_planet.part2$"
 marauder.517.a: "Thắng làm vua."
 marauder.517.a.tooltip: "[liberated_planet.GetName] đã gia nhập đế chế của chúng ta."
 marauder.517.b: "Chúng ta là những người giải phóng, chứ không phải kẻ chinh phục."
 marauder.517.b.tooltip: "[liberated_planet.GetName] đã trở về với [planet_former_owner.GetName]."
 marauder.518.desc: "$liberated_planet.part1$"
 marauder.519.desc: "Sau cuộc tấn công thành công và đánh bại quân đội Khả Hãn trên §H[liberated_planet.GetName]§!, §H[From.GetName]§! đã gửi yêu cầu trả lại quyền kiểm soát [liberated_planet.GetPlanetMoon] một cách hòa nhã với chúng ta."
 opinion_returned_marauder_planet: "Hành tinh đã được giải phóng"
 opinion_kept_marauder_planet: "Chiếm đoạt hành tinh đã được giải phóng"
 marauder.524.name: "Tin rằng Đại Khả Hãn đã chết"
 marauder.524.a.desc: "Mặc dù ý nghĩ rằng Đại Khả Hãn có thể tái xuất giang hồ và xuất hiện trên một hạm đội mới nào đó vẫn khiến người ta lo âu, nhưng dựa trên thất bại toàn diện của các bộ lạc, khả năng này vô cùng mong manh.\n\nMặc dù xác chết vẫn không rõ tung tích, nhưng người ta tin rằng Đại Khả Hãn đã tử trận khi trạm không gian và thiết giáp hạm cuối cùng của bộ lạc bị phá hủy."
 marauder.524.b.desc: "$marauder.524.a.desc$\n\nCùng lúc đó, các thuyền viên của chúng ta vẫn tiếp tục tìm kiếm trong đống xác của hạm đội tiền Khả Hãn. Họ đã phát hiện ra một chiếc ghế khổng lồ dính đầy máu đang trôi dạt trong không gian, và về cơ bản có thể khẳng định đây chính là ngai vàng của Đại Khả Hãn."
 marauder.524.a: "Cảm tạ trời đất!"
 marauder.524.b: "Khám phá tuyệt vời đấy."
 marauder.526.name: "Sư tử ngủ gật thức tỉnh"
 marauder.526.desc: "Gần đây, một trạm cư trú không gian dưới quyền kiểm soát của §H[awakened_horde.GetName]§! đã bị phá hủy, điều này đã trực tiếp dẫn đến việc trong lịch sử của §H[From.GetSpeciesNamePlural]§! đã phá lệ mà đoàn kết lại dưới sự cai trị của một vị Đại Khả Hãn. Vị quân phiệt đầy bí ẩn này bằng tài năng siêu phàm của mình, tương truyền còn là một nhà ngoại cảm có sức mạnh to lớn, đã thuyết phục các bộ tộc của [From.GetSpeciesNamePlural] gác lại những tranh chấp để mưu cầu sự sống còn.\n\nNhững thiết giáp hạm khổng lồ từ tốn rẽ sóng rời khỏi những nơi neo đậu được cất giấu trước đó, chở đầy những chiến binh cuồng nhiệt của [From.GetSpeciesName]. Dưới sự lãnh đạo và cổ vũ của Đại Khả Hãn, chúng sẽ thay mặt những đồng bào đã ngã xuống giáng đòn trừng phạt cuối cùng xuống toàn bộ thiên hà này."
 marauder.550.a.desc: "Ta tuyệt đối sẽ không phụ lòng [raider_khanate.GetName]. Hàng tỷ người đang làm theo sự dẫn dắt của ta."
 marauder.550.b.desc: "Ta là Thiên Khả Hãn, [great_khan.GetName]. Ngươi đến để thần phục trước sự cai trị của ta sao?"
 marauder.550.c.desc: "Có chí thì nên."
 marauder.550.d.desc: "Ngươi đã có vinh hạnh diện kiến Đại Khả Hãn. Có lời gì thì nói đi."
 marauder.550.e.desc: "Kẻ nào đang thỉnh cầu diện kiến Đại Khả Hãn?"
 marauder.550.f.desc: "Dưới ánh sao vẫn còn rất nhiều lãnh thổ đang chờ chúng ta đến chinh phục."
 marauder.550.g.desc: "Con dân của ta đã phải chịu đựng quá nhiều đau khổ rồi. Ta sẽ mở ra cho họ một không gian sinh tồn mới trong dải thiên hà này."
 marauder.550.h.desc: "Ta khóc thương cho những sinh mạng đã bị quân đội của chúng ta sát hại, nhưng vì tương lai của [raider_khanate.GetSpeciesName] nên ta không còn cách nào khác."
 marauder.550.i.desc: "Đế chế mà ta đang xây dựng sẽ đem lại lợi ích cho toàn bộ thiên hà. Dù hiện tại trông có vẻ không phải như vậy, nhưng một ngày nào đó, nó sẽ trở thành ngọn hải đăng của sự ổn định và phồn vinh trong vũ trụ này, thu hút mọi sinh vật có trí tuệ trong toàn vũ trụ.\n\nCuối cùng, ánh sáng của hòa bình sẽ tỏa sáng khắp thiên hà này. Ta nhất định sẽ làm được."
 marauder.550.j.desc: "Triều đình của ta luôn mở cửa chào đón những tổng đốc trung thành. Ngươi có chuyện gì muốn hỏi sao?"
 marauder.550.k.desc: "Ngươi đại diện cho vùng lãnh địa của [Root.GetSpeciesName], đúng không? [Root.GetName], có vẻ như tên là vậy. Đại Khả Hãn có thể giúp gì được cho ngươi đây?"
 marauder.550.l.desc: "Mặc dù các người không phải là những sinh vật hữu cơ, [Root.GetSpeciesNamePlural], nhưng tất cả các sinh vật có trí tuệ thần phục [raider_khanate.GetName] đều sẽ được đối xử bình đẳng.\n\nTa thề."
 marauder.550.m.desc: "Đôi khi ta cũng nghĩ rằng, nếu ta là một robot giống như ngươi, thì nhiều chuyện sẽ dễ dàng hơn nhiều. Ái chà."
 marauder.550.n.desc: "Nói cách khác, kẻ đang đối thoại với ta là ý thức trung tâm của [Root.GetSpeciesName] à? Thú vị thật."
 marauder.550.o.desc: "Nghe nói lũ drone của [Root.GetSpeciesName] sẽ phục tùng mệnh lệnh của bộ não ý thức bầy đàn một cách vô điều kiện. Chỉ cần ý thức tập thể của các người cũng phục tùng ta giống như vậy, thì chúng ta có thể sống hòa thuận với nhau."
 marauder.550.p.desc: "Ngươi chấp nhận sự cai trị của ta là một hành động khôn ngoan. Bằng cách đó, cuộc sống hạnh phúc của [Root.GetSpeciesName] sẽ được đảm bảo."
 marauder.550.q.desc: "Ngươi biết không, [Root.GetSpeciesNamePlural] và [raider_khanate.GetSpeciesNamePlural] thực ra rất giống nhau. Các người sẽ đóng một vai trò quan trọng trong đế chế vũ trụ mà ta sẽ thành lập."
 marauder.550.a: "Chúng ta muốn thảo luận về vấn đề quy thuận..."
 marauder.550.a.2.response: "Ngươi nghĩ ta ngu đến mức tin [Root.GetSpeciesName] thêm một lần nữa sao? Không, lần này sẽ chỉ có đầu rơi máu chảy thôi. Ngươi đã tự mình vứt bỏ cái tư cách tồn tại trong trật tự không gian vũ trụ mới mà ta xây dựng."
 marauder.550.b: "Một [From.GetSpeciesName] như ngươi... cái miệng lưỡi cũng lưu loát đấy chứ."
 marauder.550.b.response: "Ừm, đúng thế. Ngôn ngữ mà ngươi đang nhắc tới chắc hẳn là thứ ngôn ngữ mà [From.GetSpeciesNamePlural] từng sử dụng trước đây, một phương ngữ khá là cổ hủ và có phần... hừm, thô lỗ.\n\nNói ra có thể ngươi không tin, nhưng ngôn ngữ của [From.GetSpeciesName] cũng từng có thời kỳ cực kỳ phát triển. Chỉ là trong ngàn năm vừa qua nó mới thoái hóa đến mức tồi tàn như vậy.\n\nNhưng tình trạng này sẽ sớm thay đổi. Bắt đầu từ bây giờ, tất cả các [From.GetSpeciesNamePlural] đều sẽ học phiên bản ngôn ngữ phong phú và cổ xưa nhất của chúng ta. Sẽ không còn nghe thấy những tiếng la hét chói tai nữa."
 marauder.550.c: "Chuyện gì đã xảy ra với 'Mẹ Hư Không'?"
 marauder.550.c.response: "Sự mê tín và tôn giáo chỉ mang lại sự tàn phá vô tận cho [From.GetSpeciesName]. Những ai muốn tiếp tục sùng bái Mẹ Hư Không hay các biểu tượng tinh thần khác đều có thể làm vậy, nhưng điều này không còn là quy định bắt buộc nữa.\n\nTa muốn dẫn dắt [From.GetSpeciesNamePlural] cùng toàn thể vũ trụ tiến vào kỷ nguyên khoa học và tiến bộ mới. Lũ cuồng tín với tư duy hạn hẹp không thể nào bước vào thế giới tương lai mà ta muốn kiến tạo."
 marauder.550.d: "Chúng ta muốn lấy lại quyền tự trị của mình."
 marauder.550.d_fail: "§RSau khi quy thuận Đại Khả Hãn, không được phép thực hiện hành động chống đối trong vòng 1 năm!§!"
 marauder.551.a.desc: "Lựa chọn sáng suốt. Sau khi quy thuận, ngươi sẽ trở thành chư hầu của [raider_khanate.GetName], có nghĩa vụ cung cấp nhân lực và vật lực cho các cuộc chiến mà chúng ta đang tiến hành. Tuy nhiên, ngoại trừ điều đó, ngươi không cần phải ra tiền tuyến, trước khi chúng ta chinh phục toàn cõi thiên hà, ngươi chỉ cần quản lý tốt công việc nội bộ của mình là được.\n\n§YKhi trở thành chư hầu sẽ nhận được:§!\n§R£energy£ -30% Thu nhập Năng lượng\n£minerals£ -30% Thu nhập Khoáng sản\n£food£ -30% Thu nhập Thức ăn\n£navy_size£ -30% Quy mô Hạm đội§!\n\n[raider_khanate.GetName] sẽ trở nên hùng mạnh hơn."
 marauder.551.a.response: "Bây giờ ngươi đã được phép tự coi mình là bề tôi trung thành của Đại Khả Hãn thuộc [raider_khanate.GetName]. Sau khi ký kết khế ước, vô số sinh mạng của [Root.GetSpeciesName] đã được cứu rỗi. Đối với [Root.GetName] đây thực sự là một ngày trọng đại.\n\nĐợi sau khi ta bình định vũ trụ, chúng ta sẽ xem xét lại việc điều chỉnh chế độ chư hầu; có thể ta sẽ sáp nhập lãnh thổ của các người vào đế chế của chúng ta một cách gắn kết hơn. Nhưng đó là chuyện sau này, còn hiện tại ngươi muốn cai trị thế nào thì tùy ngươi."
 marauder.551.b.response: "Ha! Điều đó là không thể.\n\nVậy thì chúng ta đành phải binh đao tương kiến thôi, [Root.GetSpeciesNamePlural]. Với ta thì cũng chẳng có gì khác biệt —— hành tinh của các người dù có thế nào cũng sẽ quy thuận [raider_khanate.GetName] thôi."
 marauder.551.a: "Chúng ta chấp nhận điều kiện của ngươi."
 marauder.551.a.tt: "§Y[This.GetName]§! trở thành chư hầu của §Y[raider_khanate.GetName]§!"
 marauder.551.b: "Ngươi nhầm rồi. Ý chúng ta là muốn §Hngươi§! phải quy thuận."
 marauder.552.name: "[From.GetName] đã quy thuận!"
 marauder.552.desc: "§H[new_satrapy.GetName]§! đã quy thuận Đại Khả Hãn! Chúng đã trở thành chư hầu của [raider_khanate.GetName], và các hạm đội cũng đã dỡ bỏ tình trạng thù địch.\n\nMặc dù chúng vẫn chưa chính thức gia nhập cuộc viễn chinh vĩ đại ra ngoài không gian của [raider_khanate.GetSpeciesNamePlural], nhưng chúng đã cam kết sẽ cung cấp tài nguyên và nhân lực cho bộ máy chiến tranh của Đại Khả Hãn!"
 marauder.552.a: "Đúng là lũ tép riu không có xương sống!"
 marauder.553.name: "Hãn quốc xây dựng căn cứ tại [capital_star.GetName]"
 marauder.553.desc: "Để 'bảo vệ' chúng ta, §H[raider_khanate.GetName]§! đã thiết lập một căn cứ quân sự lớn mạnh tại hệ sao §H[capital_star.GetName]§!, đồng thời đóng quân một hạm đội với quy mô không hề nhỏ. Dụng ý thứ hai của căn cứ này dường như là để khích lệ chúng ta nhanh chóng hoàn thành nghĩa vụ của một chư hầu, cũng như đôn đốc tiến độ chiêu mộ [Root.GetSpeciesNamePlural] gia nhập hạm đội của Đại Khả Hãn."
 marauder.553.a: "Chờ sự phân phó của Đại Khả Hãn..."
 marauder.554.a.desc: "Hãy suy nghĩ cho kỹ, [Root.GetSpeciesNamePlural]. Nếu ngươi cứ cố chấp như vậy thì không có đường quay đầu lại đâu. Ngươi có yêu cầu quy thuận lần nữa, ta cũng sẽ không chấp nhận.\n\nNhững chư hầu to gan dám chống đối sẽ chỉ có một con đường là triệt để biến mất."
 marauder.554.a: "Chúng ta tuyên bố độc lập hoàn toàn!"
 marauder.554.a.response: "Thế thì được thôi. Các người đã đi vào đường cùng rồi, [Root.GetSpeciesNamePlural]. Ta nhất định sẽ xóa sổ đế chế của các người —— ta thề đó!\n\nĐiều này sẽ cung cấp một bài học hoàn hảo cho toàn bộ thiên hà về việc chống lại ý chí của Đại Khả Hãn sẽ có kết cục như thế nào."
 marauder.554.b: "A, nếu vậy thì thôi đi."
 marauder.554.b.response: "Sớm biết thế còn hơn. Đừng cố thách thức sự kiên nhẫn của ta, [Root.GetSpeciesNamePlural]."
 marauder.550.r.desc: "Ta đã tin tưởng ngươi, [Root.GetSpeciesName]. Ta đã dành cho ngươi một vị trí trước bàn của ta... Vậy mà ngươi lại dùng hành động này để đền đáp ta."
 marauder.550.s.desc: "Ta tuyệt đối sẽ không dung thứ cho những hành động phản nghịch. Không có gì để nói nữa."
 marauder.550.t.desc: "Tên tiểu nhân đâm lén sau lưng. Ngươi còn có mặt mũi nói bản thân muốn trở thành chư hầu sao?\n\nNgươi lại cả gan dám đùa giỡn ta, ta tuyệt đối không thể tha thứ."
 marauder.550.u.desc: "Đây là ân oán cá nhân, [Root.GetSpeciesName]."
 marauder.550.v.desc: "Ngươi và cả đám người coi thường những sinh vật có cảm xúc giống như ngươi, chính là lý do khiến ta cần phải vững vàng dẫn dắt vũ trụ này.\n\nViệc các người tiếp tục tồn tại bản thân nó đã là một mối đe dọa. Ta quyết định sẽ chấm dứt mối đe dọa này."
 marauder.550.w.desc: "Hây yaaaa!!! Bùn đất! Mày đang... *khụ khụ*\n\nTa, ý ta là, ngươi đang trò chuyện với một Đại Khả Hãn đáng kính, có chuyện gì thì nói mau."
 marauder.620.name: "Hãn quốc chia năm xẻ bảy"
 marauder.620.desc: "Cái chết của §HĐại Khả Hãn§! đã dẫn đến sự sụp đổ của §H[From.GetName]§!. Không có một vị vua cai trị cường quyền, [From.GetSpeciesNamePlural] lại một lần nữa lao vào những cuộc nội chiến. Dưới sự chỉ huy của những §HKẻ kế nghiệp§!, những viên sĩ quan cấp cao quyền lực và mạnh mẽ nhất, đế chế đã phân liệt thành vô số phe phái.\n\nMỗi một phe phái đều tự xưng là Đại Khả Hãn của Trướng Sao, tuyệt không cho phép bất cứ ai nghi ngờ. Cái thời [From.GetSpeciesName] đồng lòng hợp lực nay đã đến hồi kết."
 marauder.620.a: "Xem ra là ông trời không chiều lòng người rồi."
 marauder.630.name: "Hãn quốc quay về con đường cũ"
 marauder.630.desc: "Trước khi Đại Khả Hãn qua đời, có rất nhiều công cuộc cải cách đang được tiến hành, nhằm chuyển đổi [From.GetSpeciesNamePlural] từ các bộ lạc rời rạc thành một đế chế liên sao đoàn kết và vững mạnh. Cái chết của Đại Khả Hãn giờ đây đã làm cho tất cả các cải cách ấy tan thành mây khói trong nháy mắt.\n\nTất cả các quân phiệt kế vị Đại Khả Hãn đều không bộc lộ một chút hứng thú nào đối với những cải cách này, và [From.GetSpeciesNamePlural] đều đã quay lại phương thức hành xử cướp bóc lúc trước. [From.GetSpeciesNamePlural] đã trở thành một đám ô hợp rời rạc."
 marauder.630.a: "Có lẽ đó là ý trời không thể cãi."
 marauder.640.name: "Hãn quốc mới"
 marauder.640.desc: "Thật không ngờ, §Hđế chế [From.GetSpeciesName]§! lại thành công vượt qua những sóng gió sau cái chết của §HĐại Khả Hãn§!. Do Khả Hãn mới lập tức đăng quang, nó đã xóa tan hoàn toàn ý đồ đường ai nấy đi của mọi người.\n\nNhìn chung, dường như [From.GetSpeciesName] được hồi sinh này lại tập trung vào việc củng cố các vùng lãnh thổ hiện tại của mình hơn, lại chẳng mảy may hứng thú với những cuộc chinh phạt mới."
 marauder.640.a: "Cứ xem bọn chúng còn có thể bám trụ được đến khi nào."
 marauder.660.name: "Hãn quốc Trướng Sao mới"
 marauder.660.desc: "$marauder.660.1.desc$\n\n$marauder.660.2.desc$"
 marauder.660.1.desc: "Cuộc đấu tranh quyền lực mà §H[From.GetName]§! vướng phải sau khi §HĐại Khả Hãn§! chết cuối cùng đã khép lại. Do việc [From.GetSpeciesNamePlural] trong quá trình chinh phục đã chứng kiến một tư tưởng bình đẳng chưa từng có, một phe phái dân chủ mới nổi đã tìm cách cải cách thể chế của đế chế này thông qua hình thức liên bang liên sao."
 marauder.660.2.desc: "Với tư cách là chư hầu của hãn quốc, chúng ta được mời làm thành viên sáng lập để gia nhập liên bang này. Hơn nữa, hãn quốc gần đây cũng đã soạn thảo một bản hiến pháp cho phép chúng ta ly khai, cũng như thiết lập lại toàn bộ chủ quyền độc lập của mình."
 marauder.660.a: "Vậy chúng ta hãy gia nhập liên bang mới này đi."
 marauder.660.b: "Cuối cùng thì cũng thoát khỏi gông xiềng rồi!"
 marauder.661.desc: "$marauder.660.1.desc$\n\n$marauder.661.2.desc$"
 marauder.661.2.desc: "Các lãnh địa chư hầu trước đây của hãn quốc đều đã nhận được lời mời gia nhập liên bang này với tư cách là những cá thể bình đẳng, hoặc họ cũng có thể lựa chọn không tham gia để đòi lại chủ quyền độc lập hoàn toàn."
 marauder.661.a: "Xem diễn biến mọi việc thế nào đã."
 marauder.665.a.desc: "§Y<<Cái chết của Đại Khả Hãn đã khiến cho đế chế của [From.GetSpeciesName] rơi vào hỗn loạn. Không một ai nhận cuộc gọi liên lạc của các người.>>§!"
 marauder.665.a: "Bên đó rốt cuộc đã xảy ra chuyện gì vậy?"
 marauder.670.name: "Kết cục của chư hầu"
 marauder.670.desc: "Sau cái chết của Đại Khả Hãn, hỗn loạn và bạo loạn nối tiếp nhau xảy ra, lịch sử của chúng ta với tư cách là một vùng lãnh địa chư hầu trong đế chế đã biến mất không còn tung tích —— mục tiêu mà chúng ta thề sẽ trung thành chỉ có Đại Khả Hãn mà thôi. Bây giờ chúng ta lại có thể tiếp tục tự định đoạt vận mệnh của chính mình.\n\nToàn bộ lực lượng quân sự của hãn quốc đóng quân tại [Root.Capital.solar_system.GetName] đã rời khỏi trạm gác để quay về với dân tộc của mình, những vật phẩm quân sự còn sót lại sau cuộc tháo dỡ đầu tiên đều bị bỏ lại tại đó."
 marauder.670.a: "Chúng ta tự do rồi."
 marauder.671.name: "Hãn quốc tháo dỡ trạm không gian đóng quân"
 marauder.671.desc: "Do hãn quốc mới gặp khó khăn trong việc duy trì những cuộc chinh phạt của Đại Khả Hãn, tướng quân của họ đã quyết định tiến thêm một bước trong việc củng cố sức mạnh chiến đấu của mình. Vì vậy, họ đã điều động toàn bộ nhân lực từ các trạm không gian đóng quân tại các quốc gia chư hầu, và tiến hành dỡ bỏ trạm không gian."
 marauder.671.a: "Sự kiểm soát của bọn chúng đang dần nới lỏng."
 marauder_skirmishing: "Lấy những kẻ cướp bóc ra làm đá thử vàng"
 marauder_skirmishing_desc: "Những cuộc chiến không ngừng nghỉ với lũ cướp bóc liên tục quấy nhiễu biên giới đã tạo cơ hội cho hạm đội của chúng ta rèn luyện trong thực chiến, tăng cường hiệu quả chiến đấu."
 marauder.701.name: "Người tị nạn [marauder_neighbor_species.GetName]"
 marauder.701.desc: "Một chiếc tàu vận tải chở theo lượng lớn người tị nạn [marauder_neighbor_species.GetName] từ hướng §H[marauder_neighbor.GetName]§! đã xâm nhập vào lãnh thổ của chúng ta. Chắc chắn họ đã bị đuổi khỏi những trạm không gian tồi tàn — những nơi mà họ từng gọi là nhà, có thể là do các biện pháp kiểm soát dân số vì nguồn tài nguyên có hạn. Họ đã được phép định cư lại tại §H[Root.GetName]§!."
 marauder.701.a: "Chúng ta hoan nghênh họ."
 marauder.702.name: "Thử nghiệm nhỏ"
 marauder.702.a.desc: "Những cuộc xung đột dai dẳng trên khu vực biên giới với §H[marauder_neighbor.GetName]§! đã mài giũa được quân đội của chúng ta. Năng lực của họ đã được rèn luyện trong thực chiến, họ thậm chí còn học hỏi được những chiến thuật tác chiến của [marauder_neighbor_species.GetName], điều này chắc chắn có thể mang lại cho họ lợi thế trong các trận chiến sau này."
 marauder.702.b.desc: "Sau những cuộc xung đột kéo dài ở biên giới của chúng ta với §H[marauder_neighbor.GetName]§!, đội máy bay không người lái [root.GetIndividualName] của chúng ta dường như đã phát triển một khả năng tự chủ nhất định. Hiện tại, nó đã có thể phản ứng với các chiến thuật chiến đấu không thể lường trước của [marauder_neighbor_species.GetNamePlural].\n\nTất nhiên, các máy bay không người lái này phải được xử lý ngay trước khi chúng có thể phát triển khả năng đe dọa chiến đấu đơn lẻ, nhưng hiện tại, điều này sẽ chỉ khiến chúng ta có thêm những lợi thế trong những cuộc xung đột trước mắt sắp tới."
 marauder.702.c.desc: "Sau những cuộc xung đột kéo dài với §H[marauder_neighbor.GetName]§!, các đơn vị tác chiến của chúng ta đã buộc phải thực hiện những sửa đổi trong việc lập trình để đối phó với những chiến thuật không thể dự đoán được của [marauder_neighbor_species.GetNamePlural].\n\nTất nhiên, những dữ liệu mới này cuối cùng cũng sẽ bị xóa, nếu không hệ thống sẽ bị suy giảm. Nhưng với hiện tại thì điều này sẽ thực sự có thể mang lại cho chúng ta lợi thế trong các cuộc xung đột có thể dự đoán được trong ngắn hạn."
 marauder.703.name: "Khoang cứu sinh [marauder_neighbor_species.GetName]"
 marauder.703.desc: "Sau một trận giao tranh gần đây giữa hai quân đoàn tại §H[marauder_neighbor.GetName]§!, một chiếc khoang cứu sinh của [marauder_neighbor_species.GetName] đã bay vào trong lãnh thổ của chúng ta. Đội tuần tra biên giới đã chặn lại chiếc khoang cứu sinh này, khi mở ra họ phát hiện bên trong là một vị chỉ huy [marauder_neighbor_species.GetName], và vị tư lệnh này nguyện thề phục vụ chúng ta một cách vô điều kiện cho đến lúc chết."
 marauder.703.a: "Chào mừng đã lên tàu, thưa chỉ huy."
 marauder.703.b: "Chúng ta không cần thêm chỉ huy nào nữa."
 marauder.703.c: "An tử luôn cho đống thịt này đi."
 marauder.703.d: "Ăn luôn con sinh vật này đi."
 marauder.703.e: "Đến chết mới thôi? Tốt lắm, lôi ra ngoài thanh tẩy đi."
 marauder.703.f: "Ném cả cái khoang này vào lò luyện hợp kim của chúng ta đi."
 gain_marauder_admiral: "Chúng ta có được một người chỉ huy [marauder_neighbor_species.GetName] kỳ cựu."
 gain_marauder_fleet: "Chúng ta thu được một hạm đội nhỏ của kẻ cướp bóc."
 marauder.704.name: "Hạm đội trôi dạt"
 marauder.704.desc: "Chúng ta vừa phát hiện một đội tàu chiến [marauder_neighbor_species.GetName] bị bỏ hoang tại hệ sao [border_system.GetName], nằm không xa lãnh thổ của §H[marauder_neighbor.GetName]§!. Nhật ký hệ thống máy tính trên tàu tiết lộ rằng thuyền viên của họ đã chạy trốn vào lãnh thổ của chúng ta để tị nạn nhằm tránh khỏi cuộc chiến tranh đẫm máu từ một phe phái khác. Đáng tiếc là, họ lại không mang theo đủ vật tư thiết yếu, và chẳng mấy chốc thì chết hết do đói khát. Những con tàu này từ đó cứ trôi dạt trong vũ trụ.\n\nNhững kỹ sư của chúng ta đã kiểm tra kỹ càng, chúng vẫn đang trong tình trạng tốt. Chỉ cần có thuyền viên, những con tàu này có thể lập tức gia nhập hạm đội của chúng ta."
 marauder.704.a: "Tốt đấy, những con tàu này vẫn còn chút giá trị."
 marauder.704.b: "Không, thứ này đúng là một đống rác rưởi. Tháo dỡ hết cho ta."
 marauder.705.name: "Kho dự trữ tài nguyên [marauder_neighbor_species.GetName]"
 marauder.705.desc: "Tình cờ thay, đội tuần tra biên giới mới đây đã phát hiện ra một thùng chứa tài nguyên nằm ẩn sâu trong vũ trụ tối tại hệ sao [border_system.GetName], nằm trên biên giới giữa chúng ta và §H[marauder_neighbor.GetName]§!. Chiếc thùng chở hàng cực lớn này chứa đầy những chiến lợi phẩm mà [marauder_neighbor_species.GetName] đã thu thập được từ các cuộc cướp bóc, vậy mà nó lại trôi nổi giữa vũ trụ trong hàng thế kỷ.\n\nChúng ta suy đoán, có lẽ thùng chứa này đã bị lãng quên, hoặc là chủ sở hữu của nó đã chết trong một cuộc cướp bóc khác hay trong vô số cuộc chiến đấu nội bộ của [marauder_neighbor_species.GetName]. Dù là gì đi nữa, thứ bên trong thùng giờ là của chúng ta rồi."
 marauder.706.name: "Trạm cư trú [marauder_neighbor_species.GetName] bị bỏ hoang"
 marauder.706.desc: "Chúng ta vừa phát hiện ra di tích một trạm cư trú không gian xây dở của [marauder_neighbor_species.GetName], nằm trên [border_planet.GetName], tọa lạc trong lãnh thổ nước ta. Rõ ràng, vào một thời điểm nào đó trong quá khứ §H[marauder_neighbor.GetName]§! đã cố gắng thiết lập một trạm cư trú kiên cố ở hệ sao [border_system.GetName], tuy nhiên do lý do nào đó mà dự án này đã bị bỏ hoang triệt để.\n\nDo vị trí nằm quá gần [border_planet.GetName], trạm cư trú vẫn chưa hoàn thiện này đã không bị phát hiện trong cuộc điều tra sơ bộ tại hệ sao này của chúng ta. Hiện tại, tình trạng của trạm cư trú này chẳng khá khẩm hơn một đống rác không gian là bao, thế nhưng chúng ta vẫn có thể khai thác được lượng khoáng sản đáng kể từ đống tàn tích này."
 marauder.706.a: "Vớt, ra sức vớt cho ta."
 marauder.707.name: "Tàu con thoi [marauder_neighbor_species.GetName]"
 marauder.707.desc: "Gần đây, một con tàu bay của [marauder_neighbor_species.GetName] đã tiến vào lãnh thổ của chúng ta tại hệ sao [border_system.GetName], trong khi nó đang bị đuổi theo bởi bọn tàu cướp bóc của §H[marauder_neighbor.GetName]§!. Chúng ta không rõ vì sao họ lại bị chính người của mình truy sát, nhưng sau khi chạm mặt với đội canh gác biên giới của chúng ta, những tàu cướp bóc đó đã rút lui.\n\nCon tàu bay bị hư hỏng nghiêm trọng này sau đó đã được thu hồi, chúng ta phát hiện ra những thuyền viên trên đó đã chết không lâu sau khi bay vào [border_system.GetName]. Còn khoang chở hàng của con tàu này thì chứa đầy các con chip Năng lượng bị đánh cắp."
 marauder.707.a: "Thứ chúng ta vớt được, thì đó là của chúng ta."
 HORDE_SUCCESSOR_GREETING_01: "Chúng ta ghi nhớ những chuyện trong quá khứ của Đại Khả Hãn."
 HORDE_SUCCESSOR_GREETING_02: "Chúng ta là những người thừa kế chân chính tiếp quản di sản của Đại Khả Hãn!"
 HORDE_SUCCESSOR_GREETING_03: "Nhân danh Đại Khả Hãn!"
 HORDE_SUCCESSOR_GREETING_04: "Đại Khả Hãn sống mãi trong lòng chúng ta."
 HORDE_SUCCESSOR_GREETING_05: "Đại Khả Hãn sẽ phù hộ chúng ta."
 HORDE_SUCCESSOR_GREETING_06: "Tuyệt đối không có ý định làm hại con dân của Đại Khả Hãn."
 HORDE_SUCCESSOR_WAR_GREETING_01: "Ngươi không thể đánh bại hậu duệ của Đại Khả Hãn."
 HORDE_SUCCESSOR_WAR_GREETING_02: "Hãy lấy việc đánh bại các người, coi như là để tưởng nhớ đến Đại Khả Hãn đi."
 HORDE_SUCCESSOR_WAR_GREETING_03: "Chúng ta sẽ thực hiện lời hứa của mình với Đại Khả Hãn, nghiền nát cái quốc gia nhỏ bé của các người."
 HORDE_SUCCESSOR_WAR_GREETING_04: "Chúng ta muốn đánh bại các người! Đây là ý chí của Đại Khả Hãn!"
 HORDE_SUCCESSOR_WAR_GREETING_05: "Anh linh của Đại Khả Hãn đã báo mộng cho ta, ra lệnh cho ta thiêu rụi đế chế của các người thành tro bụi!"
 HORDE_SUCCESSOR_WAR_GREETING_06: "Khả Hãn đã từng nói cho chúng ta biết, nên xử lý những thứ như ngươi bằng cách nào rồi."
 FRIENDLY_COLOSSUS_GREETING_01: "Các người có nhìn thấy siêu vũ khí của chúng ta không? Đó quả là một kỳ tích công nghệ, chúng ta rất sẵn lòng cho đại diện của các người tham quan một số khu vực không mang tính bảo mật của nó."
 FRIENDLY_COLOSSUS_GREETING_02: "Đừng lo lắng siêu vũ khí của chúng ta sẽ trở thành mối đe dọa với các người, sức mạnh hủy diệt của siêu vũ khí đó chỉ nhắm vào kẻ địch của chúng ta thôi, nó sẽ không tấn công bạn bè của chúng ta đâu."
 NEUTRAL_COLOSSUS_GREETING_01: "Chúng ta có siêu vũ khí hùng mạnh với sức mạnh có thể hủy diệt cả một hành tinh làm hậu thuẫn, nên sẽ không một ai dám coi thường chúng ta!"
 NEUTRAL_COLOSSUS_GREETING_02: "Nếu cần thiết, chúng ta luôn sẵn sàng tung ra sức mạnh hủy thiên diệt địa của siêu vũ khí đó, chúng ta chân thành hy vọng sự việc sẽ không đi đến bước đường đó."
 HOSTILE_COLOSSUS_GREETING_01: "Tốt nhất là ngươi nên cầu nguyện đừng để nhìn thấy hỏa lực mang tính hủy diệt từ siêu vũ khí của chúng ta!"
 HOSTILE_COLOSSUS_GREETING_02: "Siêu vũ khí mà chúng ta chế tạo ra vốn là dùng để đối phó với những kẻ địch như [From.GetName], nếu không muốn chúng ta dùng vũ khí đó để tấn công các người, thì đừng có khiêu khích chúng ta."
 PACIFIST_COLOSSUS_GREETING_01: "Siêu vũ khí mà chúng ta chế tạo ra vốn chỉ là để bảo vệ người dân của chúng ta, chứ không hề có ý định dùng nó cho chiến tranh. Nhưng nếu tình hình trở nên cấp bách, nó cũng có thể được dùng để tiêu diệt những kẻ có âm mưu đe dọa đến vũ trụ."
 SPIRITUALIST_COLOSSUS_GREETING_01: "Chúng ta đã truyền linh lực vào siêu vũ khí, siêu vũ khí đó sẽ tiêu diệt tất cả lũ dị giáo cũng như những thứ báng bổ thần linh."
 MATERIALIST_COLOSSUS_GREETING_01: "Siêu vũ khí của chúng ta là viên ngọc sáng rực của sự phát triển khoa học công nghệ, cũng là minh chứng rõ ràng cho việc khoa học là vô hạn."
 PURIFIER_COLOSSUS_GREETING_01: "Các người chưa nhìn thấy siêu vũ khí của chúng ta sao, lũ cặn bã ngoài hành tinh? Bỏ đi, đợi đến khi siêu vũ khí này thổi bay [From.Capital.GetName] lên chầu trời, các người tự nhiên sẽ nhận thức được sức mạnh của nó."
 EXTERMINATOR_COLOSSUS_GREETING_01: "Hiện tại siêu vũ khí này đã có thể đưa vào sử dụng, như vậy, hiệu suất của chiến dịch thanh lọc mọi sinh vật hữu cơ sẽ được tăng thêm 254.88%."
 HIVE_COLOSSUS_GREETING_01: "Lý do chúng ta có thể chế tạo ra siêu vũ khí là nhờ vào ý chí của sự tư duy."
 FRIENDLY_COLOSSUS_REACT_GREETING_01: "Siêu vũ khí của các người khiến các kỹ sư của chúng ta vô cùng sốc, thật tuyệt vời khi hai đế chế của chúng ta có thể duy trì một mối quan hệ hữu nghị."
 FRIENDLY_COLOSSUS_REACT_GREETING_02: "Chỉ có những kẻ ngốc mới đi gây chiến với [From.GetName], xét cho cùng thì các người sở hữu siêu vũ khí mà. Chúng ta rất vui khi có thể kết nối mối quan hệ thân thiện với đế chế của các người."
 NEUTRAL_COLOSSUS_REACT_GREETING_01: "Việc các người chế tạo ra một siêu vũ khí như vậy khiến chúng ta vô cùng băn khoăn. Sức mạnh của siêu vũ khí đó là quá mức lớn mạnh, nó sẽ làm đảo lộn sự cân bằng thế lực của cả vũ trụ."
 NEUTRAL_COLOSSUS_REACT_GREETING_02: "Siêu vũ khí của các người rất hoành tráng, nhưng cũng rất đáng sợ. Thứ này thật sự có thể hủy diệt được cả một hành tinh sao?"
 HOSTILE_COLOSSUS_REACT_GREETING_01: "Siêu vũ khí mà các người khoác lác cũng chỉ là một chiếc tàu vũ trụ thôi, và miễn là tàu vũ trụ thì đều có thể bị phá hủy, đừng quên điều này."
 HOSTILE_COLOSSUS_REACT_GREETING_02: "Mấy cái siêu vũ khí này... rốt cuộc các người phải ngu ngốc đến mức nào mới đi chế tạo thứ quái vật như vậy. Các người hãy thử nghĩ xem có thể chế tạo được bao nhiêu chiến hạm từ đống tài nguyên đó đi."
 WAR_COLOSSUS_GREETING_01: "Nhân lúc vẫn còn cơ hội, những kẻ ngốc các người mau đầu hàng đi! Nếu không, siêu vũ khí của chúng ta sẽ trực tiếp khiến các người bốc hơi khỏi thế giới này!"
 WAR_COLOSSUS_GREETING_02: "Trước sức mạnh áp đảo từ siêu vũ khí của chúng ta, các người đừng nuôi hy vọng chống trả nữa. Siêu vũ khí đó sẽ trực tiếp nghiền nát thế giới của các người thành cặn bã."
 CAN_TAKE_HOSTILE_ACTION_SATRAPY: "Với tư cách là một chư hầu, chúng ta không cho phép điều này."
 CAN_TAKE_HOSTILE_ACTION_OVERLORD: "Với tư cách là một quốc gia chủ quyền, chúng ta không thể thực hiện hành động này."
