l_simp_chinese:
 marauder.1.name: "Chạm trán [encountered_marauder.GetRealName]"
 marauder.1.desc: "Chúng ta đã hoàn tất việc giải mã ngôn ngữ của chúng, [This.Owner.GetEnvoy][This.Leader.GetName] đã xác định §H[encountered_marauder.GetName]§! là một nền văn minh du mục mang tên §H[encountered_marauder.GetRealName]§!. Chúng chiếm giữ hàng loạt trạm không gian khổng lồ gần hệ sao §H[marauder_system.GetName]§!, với số lượng dân cư đông đúc sống chen chúc trong những môi trường bẩn thỉu. Dù vậy, hoặc có lẽ chính vì vậy, chúng dường như đã phát triển một nền văn hóa cực kỳ hiếu chiến. Sống trong không gian lạnh lẽo đã trở thành bản năng thứ hai của chúng, khiến chúng vô cùng sành sỏi trong giao tranh vũ trụ.\n\n[encountered_marauder.GetSpeciesName] không có khái niệm chính quyền trung ương, mà chia thành nhiều phe phái khác nhau, không ngừng cắn xé lẫn nhau để tranh giành tài nguyên và danh dự. Với dân số khổng lồ và khả năng đóng tàu trên các trạm không gian, nếu không có những cuộc nội chiến không hồi kết này, chúng chắc chắn sẽ trở thành mối đe dọa nghiêm trọng đối với hòa bình của cả thiên hà."
 marauder.1.a: "Cố gắng liên lạc với chúng."
 marauder.3.name: "Phát hiện chiến binh [From.GetSpeciesName]"
 marauder.3.desc: "Trong vài tháng qua, chúng ta đã nhận được các báo cáo lẻ tẻ về một nhóm nhỏ lính đánh thuê và hải tặc ngoài hành tinh hoạt động gần biên giới. Chúng tự xưng là §H[From.GetSpeciesNamePlural]§!, và có vẻ như là một đám người bị lưu đày, đến từ một nền văn minh chiến binh du mục sống trên các trạm không gian đông đúc tại hệ sao §H[marauder_system.GetName]§!.\n\nChúng đi qua biên giới của chúng ta một cách yên bình, nhưng cảnh báo chúng ta đừng chọc giận [marauder_system.GetName]. [From.GetSpeciesName] không có chính quyền tập trung, nhưng chúng có nhiều phe phái khác nhau, liên tục đánh rập lẫn nhau và thường xuyên tấn công các hệ sao lân cận. Xét đến số lượng khổng lồ và khả năng đóng tàu của chúng, nếu chúng ngừng đánh nhau, [From.GetSpeciesNamePlural] rất có thể sẽ trở thành một thế lực hùng mạnh trong thiên hà."
 marauder.5.name: "Hồi kết của [From.GetName]"
 marauder.5.desc: "Nền văn minh chiến binh du mục từng lẫy lừng §H[From.GetSpeciesNamePlural]§! nay đã diệt vong. Thế lực của §H[marauder_killer.GetName]§! đã phá hủy trạm không gian khổng lồ cuối cùng chứa phần lớn dân số của chúng. Những người tị nạn sống sót đang chạy toán loạn khắp thiên hà.\n\nMặc dù có thể vẫn còn một số hải tặc và lính đánh thuê [From.GetSpeciesName] lọt lưới, nhưng việc mất đi nơi sinh sống trong không gian là một đòn chí mạng không thể vãn hồi đối với chúng. Điều này đã chấm dứt hoàn toàn sự nghiệp cướp bóc của chúng."
 marauder.5.a: "Đúng là như vậy."
 marauder.6.name: "Sự trả thù của [marauder_species.GetNamePlural]"
 marauder.6.desc: "Một hạm đội lính đánh thuê §H[marauder_species.GetName]§! khổng lồ vừa thoát khỏi không gian đa chiều tại hệ sao §H[attacked_system.GetName]§!! Có vẻ như khi chúng ta phá hủy trạm không gian cuối cùng của chúng, những lính đánh thuê [marauder_species.GetName] đóng quân ở nơi khác còn sống sót đã dẹp bỏ hiềm khích và hợp lực với nhau.\n\nChúng ta không rõ làm thế nào chúng tránh được các thiết bị dò tìm của chúng ta để đến được [attacked_system.GetName], nhưng chúng đã gửi một thông điệp trên kênh công khai."
 marauder.7.1.desc: "Gửi những kẻ hèn nhát đê tiện của [Root.GetName]:\n\nNếu các người đã hủy hoại nhà của chúng ta, chúng ta cũng sẽ thiêu rụi nhà các người. Chúng ta đã không còn gì trong tay — tất cả là nhờ ơn các người. Giờ đây chúng ta chỉ cầu mong được ngã xuống trên chiến trường, và khi bước chân xuống suối vàng, chúng ta cũng sẽ kéo theo những kẻ mà các người gọi là chiến binh đi cùng.\n\nChuẩn bị phòng ngự đi!"
 marauder.7.2.desc: "Lũ bùn đất [Root.GetName]! Bọn mày phá nhà tao, giờ bọn tao đến đập nhà mày! Bọn tao biết mình có thể không sống nổi, nhưng bọn tao sẽ kéo theo càng nhiều lũ bùn đất đệm lưng càng tốt!\n\nGiết sạch lũ bùn đất! Hây yaaaaaa!!!!"
 marauder.7.3.desc: "Gửi những kẻ phản trắc [Root.GetName]:\n\nCác người đã vấy bẩn vùng đất thánh của chúng ta, sát hại vô số con dân. Các người tưởng Mẹ Hư Không sẽ tha thứ cho những tội ác này sao?\n\nMẹ Hư Không đòi hỏi sự hy sinh, và chúng ta chắc chắn sẽ tuân theo. Đây sẽ là màn chào sân cuối cùng của chúng ta trong cái thế giới đầy tội lỗi này."
 #marauder.7.a: "Vào vị trí chiến đấu!"
 marauder.8.desc: "Một hạm đội lính đánh thuê §H[marauder_species.GetName]§! khổng lồ đã tiến vào §H[From.GetName]§!. Có vẻ như khi chúng ta phá hủy trạm không gian cuối cùng của chúng, những lính đánh thuê [marauder_species.GetName] đóng quân ở nơi khác còn sống sót đã dẹp bỏ hiềm khích để hợp lực lại.\n\nChúng có ý định trả thù cho sự hủy diệt của quê hương, và các cuộc liên lạc bị chặn lại cho thấy những chiến binh này đang định đồng quy vu tận với chúng ta."
 marauder.10.name: "Người tị nạn [marauder_species.GetName] đã đến"
 marauder.10.desc: "Một hạm đội tàu chở hàng đầy vết thương mang theo những người tị nạn §H[marauder_species.GetName]§! đã đến hệ sao của chúng ta sau khi quê hương của chúng bị hủy diệt. Họ đã được phép định cư tại §H[Root.GetName]§!.\n\nMặc dù những người tị nạn này đã quen sống trên các trạm không gian bẩn thỉu và chật chội, nhưng họ có vẻ thích nghi khá tốt với hành tinh quê hương mới. Hy vọng họ đã sẵn sàng vứt bỏ quá khứ cướp bóc và làm hải tặc của mình."
 marauder.10.a: "Chúng ta sẽ sắp xếp nhà mới cho họ."
 gov_marauder_clans: "Các gia tộc cướp bóc"
 gov_marauder_clans_desc: "Một nhóm các gia tộc và bộ lạc, nếu không đi cướp bóc các nước láng giềng thì cũng đang lao vào đánh giết lẫn nhau."
 RT_RELUCTANT_EMISSARY: "Đại sứ bất đắc dĩ"
 civic_anarcho_tribalism: "Chủ nghĩa bộ lạc vô chính phủ"
 civic_anarcho_tribalism_desc: ""
 gov_marauder_khanate: "Hãn quốc cướp bóc"
 gov_marauder_khanate_desc: "Một đế chế thống nhất được hình thành từ các gia tộc cướp bóc khác nhau, thề trung thành với một Đại Khả Hãn."
 gov_successor_khanate: "Hãn quốc kế vị"
 gov_successor_khanate_desc: "Một bộ lạc kế nghiệp, cố gắng tái hiện lại ánh hào quang của đế chế Đại Khả Hãn."
 RT_GREAT_KHAN: "Đại Khả Hãn"
 civic_great_khans_vision: "Tầm nhìn của Đại Khả Hãn"
 civic_great_khans_vision_desc: ""
 gov_diadochi: "Quốc gia du mục kế nghiệp"
 gov_diadochi_desc: "Một quốc gia kế nghiệp được thành lập bởi một người kế vị, thường là các nhà lãnh đạo quân sự chủ chốt của Đại Khả Hãn đã khuất."
 civic_diadochi: "Kẻ kế nghiệp"
 civic_diadochi_desc: ""
 civic_great_khans_legacy: "Di sản của Đại Khả Hãn"
 civic_great_khans_legacy_desc: ""
 RT_KHAN: "Khả Hãn"
 opinion_war_diadochi: "Cuộc chiến của kẻ kế nghiệp"
