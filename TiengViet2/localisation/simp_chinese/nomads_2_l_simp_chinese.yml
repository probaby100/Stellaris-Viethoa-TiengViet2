 # Số ít: £nomad£ ['concept_nomadic_empire'] or £nomad£ §H$concept_nomadic_empire$§!
 # Số nhiều: £nomad£ ['concept_nomadic_empires'] or £nomad£ §H$concept_nomadic_empires$§!
 concept_nomadic_empire: "Đế Chế Du Mục"
 concept_nomadic_empires: "Đế Chế Du Mục"
 concept_nomadic_empire_desc: "£nomad£ §H$concept_nomadic_empires$§! là một dạng văn minh vận hành trên các £arkship£ ['concept_arkships'] có thể di chuyển, thay vì bám rễ tại các £colony£ ['concept_colonies'] cố định. Bọn họ không có khả năng tuyên bố chủ quyền đối với £system£ ['concept_systems'] hoặc thực hiện định cư trên £planet£ ['concept_planets'].\n\n§HĐế Chế Du Mục§! có khả năng xây dựng £waystation£ ['concept_waystations'] nhằm khai thác các nguồn tài nguyên, đồng thời cũng có thể nhận các £contract£ ['concept_contracts'] được đưa ra từ các £planet£ ['concept_settled_empires']."
 # Số ít: £district£ ['concept_district_ark_military'] or £district£ §H$concept_district_ark_military$§!
 # Số nhiều: £district£ ['concept_district_ark_military_plural'] or £district£ §H$cconcept_district_ark_military_plural$§!
 concept_district_ark_military: "$district_ark_military$"
 concept_district_ark_military_plural: "$district_ark_military_plural$"
 concept_district_ark_military_desc: "—£housing£['concept_housing']: §G+200§!\n—£mod_job_technician_add£Cương vị ['concept_technicians']: §G+200§!\n\n§L$district_generator_desc$§!"
 # Số ít: ['concept_operational_reserves'] or §H$concept_operational_reserves$§!
 concept_operational_reserves: "Kho Dự Trữ Vận Hành"
 concept_operational_reserves_desc: "§H$concept_operational_reserves$§! của £nomad£ ['concept_nomadic_empires'] là sự thể hiện mang tính tổng hợp của £minerals£ ['concept_minerals'] và £energy£ ['concept_energy'].\n\n§H$concept_minerals$§! và §H$concept_energy$§! vẫn luôn có các khoản thu chi, nhưng sẽ được hiển thị dưới hình thức của ['concept_situation'].\n\nCác §HGiai đoạn§! khác nhau của cục diện sẽ mang đến những sự ảnh hưởng đối với nhiều phương diện của £arkship£ ['concept_arkships'] thuộc đế chế, bạn cũng có thể lựa chọn các §Hphương án đối phó§! khác nhau để tiết kiệm các tài nguyên tiêu thụ hoặc là đốt cháy tài nguyên để gia tăng sản lượng.\n\nBạn có thể mua sắm §H$concept_minerals$§! và §H$concept_energy$§! từ trong £market£ ['concept_market'], nhưng không có cách nào để bán chúng đi."
 operational_reserves_desc: "§t$concept_operational_reserves_desc$§!\n\n§GClick vào ['concept_operational_reserves'] để mở cơ sở dữ liệu\nClick vào £operational_reserves£ trong thanh menu để mở ['concept_situation_log_view']§!"
 # Số ít: £planet£ ['concept_settled_empire'] or £planet£ §H$concept_settled_empire$§!
 # Số nhiều: £planet£ ['concept_settled_empires'] or £planet£ §H$concept_settled_empires$§!
 concept_settled_empire: "Đế Chế Định Cư"
 concept_settled_empires: "Đế Chế Định Cư"
 concept_settled_empire_desc: "£planet£ §H$concept_settled_empires$§! được dùng để chỉ các nền văn minh tiến hành sự thống trị bằng cách dựa vào £colony£['concept_colonies'] cố định trên £planet£ ['concept_planets'], bọn họ có khả năng tuyên bố chủ quyền đối với £system£ ['concept_systems'] và sử dụng ['concept_starbases'] để tiến hành phòng ngự.\n\nĐối với £nomad£ ['concept_nomadic_empires'] mà nói, §HĐế Chế Định Cư§! chính là nguồn cung cấp tiềm năng của £contract£ ['concept_contracts'] và ['concept_diplomatic_pacts'], thế nhưng khi hạm đội của những người dân du mục này vượt qua khu vực biên giới của các Đế Chế Định Cư thì cũng có khả năng sẽ gây ra những cọ xát mang tính ngoại giao."
 # Số ít: £contract£ ['concept_contract'] or £contract£ §H$concept_contract$§!
 # Số nhiều: £contract£ ['concept_contracts'] or £contract£ §H$concept_contracts$§!
 concept_contract: "Hợp Đồng"
 concept_contracts: "Hợp Đồng"
 concept_contract_desc: "£contract£ §H$concept_contracts$§! không chỉ bao gồm những nhiệm vụ do £planet£ ['concept_settled_empires'] ban hành cho £nomad£ ['concept_nomadic_empires'], mà còn bao gồm cả những nhiệm vụ do chính bản thân §H$concept_nomadic_empire$§! kiến nghị trong nội bộ.\n\nNhững nhiệm vụ này bao quát hàng loạt các hoạt động hành động, từ việc tập kích những kẻ thù truyền kiếp cho đến việc chuyên chở các nhà ngoại giao, thông thường chỉ có thể do £arkship£ ['concept_arkships'] mới có thể hoàn thành.\n\n§HHợp Đồng§! được liệt kê trong ô tùy chọn $situation_log_view_tab_situation_log$ ở bên trong £interface£ ['concept_situation_log_view']."
 # Số ít: £waystation£ ['concept_waystation'] or £waystation£ §H$concept_waystation$§!
 # Số nhiều: £waystation£ ['concept_waystations'] or £waystation£ §H$concept_waystations$§!
 concept_waystation: "$waystation$"
 concept_waystations: "$waystation_plural$"
 concept_waystation_desc: "£waystation£ §H$concept_waystations$§! là một loại trạm không gian, do £nomad£ ['concept_nomadic_empires'] xây dựng nên, có khả năng thu thập các tài nguyên từ các thiên thể, đồng thời thiết lập nên một tuyến đường thương mại mang tầm vóc giữa các vì sao, nó cũng được biết đến với tên gọi là £wayline£ ['concept_waylines'].\n\nNhững tài nguyên được thu thập bởi §H$concept_waystations$§! sẽ được dự trữ ở bên trong §HKho dự trữ trạm tiếp vận§!, chờ đợi £construction_ship£ ['concept_logistic_ship'] hoặc £arkship£ ['concept_arkship'] tìm đến để tiến hành khai thác chiết xuất.\n\nNgay cả khi không nhận được sự cho phép của §Hngười sở hữu hệ sao§!, thì cũng có thể xây dựng nên §H$concept_waystations$§! ở bên trong £system£ ['concept_systems'], nhưng việc này sẽ gây ra những tác động tiêu cực đối với hoạt động ngoại giao của người sở hữu hệ sao, đồng thời trao cho bọn họ mục tiêu chiến tranh §H$war_goal_wg_expel_nomads$§!. Việc ký kết ['concept_wayline_pact'] thì lại có thể loại bỏ được những hình phạt tiêu cực này.$DOUBLE_NEW_LINE$Số lượng §H$concept_waystations$§! mà đế chế có thể duy trì được sẽ bị giới hạn bởi ['concept_starbase_capacity']."
 # Số ít: £wayline£ ['concept_wayline'] or £wayline£ §H$concept_wayline$§!
 # Số nhiều: £wayline£ ['concept_waylines'] or £wayline£ §H$concept_waylines$§!
 concept_wayline: "Đường trạm tiếp vận"
 concept_waylines: "Đường trạm tiếp vận"
 concept_wayline_desc: "£wayline£ §H$concept_waylines$§! là những đường bay thương mại ở các vì sao được thiết lập bởi các £waystation£ ['concept_waystations'] tại các £system£ ['concept_systems'] lân cận.\n\n§HModule trạm tiếp vận§! sẽ cung cấp các hiệu ứng cùng với các vật phẩm chỉnh sửa truyền bá theo dọc theo §H$concept_wayline$§!, các hiệu ứng này cũng sẽ được chia sẻ thông qua các ['concept_wayline_pacts'] được ký kết với §Hngười sở hữu hệ sao§!. Ví dụ, §H$sm_waystation_logistics_hub$§! có thể thu thập toàn bộ các tài nguyên được các §H$concept_waystations$§! dự trữ ở tất cả các khu vực dọc theo toàn bộ £waystation£ §H$concept_wayline$§!."
 # Số ít: ['concept_wayline_pact'] or §H$concept_wayline_pact$§!
 # Số nhiều: ['concept_wayline_pacts'] or §H$concept_wayline_pacts$§!
 concept_wayline_pact: "$wayline_pact$"
 concept_wayline_pacts: "$wayline_pact_plural$"
 concept_wayline_pact_desc: "§H$concept_wayline_pacts$§! là một dạng ['concept_diplomatic_pacts'] được ký kết giữa £nomad£ ['concept_nomadic_empire'] và một đế chế khác. Những bản hiệp ước này có thể khiến cho cả hai bên đế chế đều nhận được lợi ích từ những §Hvật phẩm chỉnh sửa§! £wayline£ ['concept_wayline'] được truyền bá ở dọc theo §HĐường trạm tiếp vận§!.\n\nNgoài ra, nếu như hiệp ước này được ký kết giữa §H$concept_nomadic_empire$§! và £planet£ ['concept_settled_empire'], thì những sự trừng phạt mang tính ngoại giao được tạo ra bởi §HĐường trạm tiếp vận§! sẽ bị xóa bỏ."
 # Số ít: £construction_ship£ ['concept_logistic_ship'] or £construction_ship£ §H['concept_logistic_ships']§!
 # Số nhiều: £construction_ship£ ['concept_logistic_ships'] or £construction_ship£ §H['concept_logistic_ships']§!
 concept_logistic_ship: "$nomads_constructor$"
 concept_logistic_ships: "$nomads_constructor_plural$"
 concept_logistic_ship_desc: "£construction_ship£§H$concept_logistic_ship$§! có khả năng tiến hành khai thác tài nguyên từ các thiên thể, đồng thời vận chuyển những tài nguyên này về các $arkship_cap_plural$.$tt_use$—Tiến hành việc ['scripted_action:logistic_harvest_resources'] từ những hành tinh, tiểu hành tinh, vệ tinh $NEW_LINE$—Xây dựng ['concept_waystations'] tại £system£['concept_systems'] để mở rộng cho £wayline£ ['concept_waylines']$NEW_LINE$—Xây dựng £waystation£ ['concept_megastructures']$NEW_LINE$—Thu thập các nguồn tài nguyên từ bên trong £waystation£ §H$concept_waystations$§!$NEW_LINE$—Không có cách nào để có thể chế tạo ra những £arkship£ ['concept_arkships'] mới giống như các §HTàu Ark§! khác$NEW_LINE$—Nghiên cứu các ['concept_special_projects'] đặc biệt$tt_gain$—Xây dựng các §H$concept_logistic_ships$§! ở bên trong £arkship£ ['concept_arkship']"
 # Số ít: £arkship£ ['concept_arkship'] or £arkship£ §H$concept_arkship$§!
 # Số nhiều: £arkship£ ['concept_arkships'] or £arkship£ §H$concept_arkships$§!
 concept_arkship: "$arkship_cap$"
 concept_arkships: "$arkship_cap_plural$"
 concept_arkship_desc: "£arkship£ §H$concept_arkships$§! là một dạng phi thuyền khổng lồ chuyên chở các £nomad£ ['concept_nomadic_empires'] bay xuyên suốt qua cõi hư không, đồng thời phát huy được các tác dụng của £colony£ ['concept_colony'], ['concept_starbase'] và ['concept_military_ship'].$DOUBLE_NEW_LINE$-Với tư cách là §HThuộc địa§!, trên phi thuyền có tồn tại £district£ ['concept_districts'], £zone£ ['concept_district_specializations'], £building£ ['concept_buildings'] cùng với £pop£ ['concept_pops'].$NEW_LINE$-Với tư cách là §HCăn cứ Sao§!, phi thuyền có thể đảm nhận vai trò là ['concept_shipyards'], đồng thời có thể được trang bị cho các §HModule Tàu Ark§! cùng với §HHệ thống§!.$NEW_LINE$-Công việc xây dựng của §HThuộc địa§! và §HCăn cứ Sao§! của §H$concept_arkships$§! sẽ dùng chung một hàng chờ dự án.$NEW_LINE$-Với tư cách là §HPhi thuyền Quân sự§!, §H$concept_arkships$§! sở hữu vô số các khoang chứa máy bay cùng với các trang bị dùng để phòng thủ, ngoài ra còn được trang bị thêm lớp vỏ ngoài dày đặc chắc chắn cùng với tấm lá chắn mang uy lực to lớn.$NEW_LINE$-§H$concept_arkships$§! có thể sử dụng £construction_ship£ ['concept_logistic_ships'] và £waystation£ ['concept_waystations'] để thu thập tài nguyên.$NEW_LINE$-§H$concept_arkships$§! cũng có thể thực hiện một vài hành động mang tính chiến lược khác, bao gồm: $TABBED_NEW_LINE$-['concept_survey']$TABBED_NEW_LINE$-['concept_build_megastructure']$TABBED_NEW_LINE$-['scripted_action:arkship_harvest_resources']$TABBED_NEW_LINE$-§HModule Tàu Ark§! có khả năng mở khóa thêm nhiều các hành động ở bậc cao hơn nữa.$NEW_LINE$-Sau khi nghiên cứu về £engineering_research£ §Y$tech_arkship_construction$§!, sẽ có thể chế tạo được các §H$concept_arkships$§! hoàn toàn mới ở bên trong các ['concept_megastructures'] do §H$concept_arkships$§! xây dựng nên.$NEW_LINE$-Sau khi nghiên cứu về £engineering_research£ §Y$tech_arkship_tier_2$§! và £engineering_research£ §Y$tech_arkship_tier_3$§!, sẽ có thể tiến hành nâng cấp đối với các §H$concept_arkships$§!."
 # Verb (action): £settle£ ['concept_arkship_settle'] or £settle£ §H$concept_arkship_settle$§!
 # Verb (ongoing): £settle£ ['concept_arkship_settling'] or £settle£ §H$concept_arkship_settling$§!
 # Noun: £settle£ ['concept_arkship_settlement'] or £settle£ §H$concept_arkship_settlement$§!
 concept_arkship_settle: "Định Cư"
 concept_arkship_settling: "Định Cư"
 concept_arkship_settlement: "$arkship_settle$"
 concept_arkship_settle_desc: "£settle£ §H$concept_arkship_settle$§! là từ dùng để chỉ hành vi cho phép £arkship£ ['concept_arkship'] thả neo nằm yên trên một hành tinh vĩnh viễn, kết thúc đi quá trình di chuyển du mục.\n\nĐòi hỏi phải hoàn thành việc học về truyền thống ['tradition_category:tradition_adaptability'] hoặc ['tradition_category:tradition_versatility'].\n\nNếu muốn tiến hành §H$concept_arkship_settle$§!, cần phải lựa chọn một chiếc §HTàu Ark§!, tiến hành click chuột phải vào một ['concept_habitable_world'] chưa có người thực dân hóa, hoặc là click vào nút §HThực dân hóa§! ở bên trong £interface£ ['concept_colony_view'].\n\nCác đế chế sở hữu nhiều §HTàu Ark§! hơn có thể lựa chọn tiếp tục làm một đế chế du mục, đồng thời biến £planet£ ['concept_settled_empire'] vừa mới được thực dân hóa thành một ['concept_subject'].\n\nTất cả các ['concept_waystations'] nằm ở bên trong các hệ sao không có thuộc quyền sở hữu của bất kỳ ai đều sẽ bị chuyển đổi thành ['concept_outposts']"
 # Verb (action): £embark£ ['concept_arkship_embark'] or £embark£ §H$concept_arkship_embark$§!
 # Verb (ongoing): £embark£ ['concept_arkship_embarking'] or £embark£ §H$concept_arkship_embarking$§!
 # Noun: £embark£ ['concept_arkship_embarkation'] or £embark£ §H$concept_arkship_embarkation$§!
 concept_arkship_embark: "Lên Tàu"
 concept_arkship_embarking: "Lên Tàu"
 concept_arkship_embarkation: "$decision_nomad_embarkation$"
 concept_arkship_embark_desc: "£embark£ §H$concept_arkship_embark$§! là từ dùng để chỉ hành vi cho phép £planet£ ['concept_settled_empire'] rời khỏi ['concept_habitable_world'], để bước lên một chiếc £arkship£ ['concept_arkship'], sau đó chuyển biến thành một £nomad£ ['concept_nomadic_empire'].\n\nHành vi này đòi hỏi phải hoàn thành việc học về truyền thống ['tradition_category:tradition_adaptability'] hoặc ['tradition_category:tradition_versatility'].\n\nNếu muốn tiến hành §HLên Tàu§!, thì cần phải mở ra giao diện ['concept_decisions'] tại một £colony£ ['concept_colony'], sau đó tiến hành lựa chọn §H$decision_nomad_embarkation$§!.\n\nNếu như đế chế có sở hữu nhiều ['concept_colonies'], thì có thể lựa chọn cách thức biến đổi những phần dư dả thành một ['concept_subject'], hoặc là biến §HĐế Chế Du Mục§! vừa mới được hình thành này thành một §H$concept_subject$§!."
