 district_ark_waystation_trade_flavor_desc: "$zone_ark_waystation_trade_desc$"
 job_ark_waystation_trader_gestalt: "Drone Điều Hành Thương Mại"
 job_ark_waystation_trader_gestalt_plural: "$job_ark_waystation_trader_gestalt$"
 job_ark_waystation_trader_gestalt_desc: "Đây là một đơn vị xử lý có nhiệm vụ điều phối luồng hàng hóa giữa các trạm tiếp vận của chúng ta và các thị trường rộng lớn hơn. Mục tiêu duy nhất của nó là đạt hiệu quả tối đa."
 mod_job_ark_waystation_trader_gestalt_add: "Vị trí $job_ark_waystation_trader_gestalt$"
 mod_pop_ark_waystation_trader_bonus_workforce_mult: "Hiệu suất vị trí của $job_ark_engineer_plural$"
 job_ark_harvester_gestalt: "Drone Thu Hoạch Không Gian"
 job_ark_harvester_gestalt_plural: "Drone Thu Hoạch Không Gian"
 job_ark_harvester_gestalt_desc: "Các drone thu hoạch do phi hành gia vận hành, được thiết kế đặc biệt cho các hoạt động ngoài không gian, nhiệm vụ chính của chúng là rời khỏi Tàu Ark để thu thập khoáng sản từ quỹ đạo."
 job_ark_harvester_gestalt_effect_desc: "$job_ark_harvester_effect_desc$"
