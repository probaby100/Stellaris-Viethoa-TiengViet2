 col_capital_nomad: "Thủ Đô Tàu Ark"
 col_capital_nomad_desc: "$col_capital_workforce_desc$"
 col_capital_nomad_tt: "Thủ đô Tàu Ark của đế chế du mục này đóng vai trò là trung tâm hành chính cho toàn bộ chính phủ. Nơi đây là nhà của những nhà lãnh đạo chỉ huy các hạm đội vượt qua muôn vàn vì sao."
 col_capital_nomad_foundry: "Tàu Ark Lò Rèn (Thủ Đô)"
 col_capital_nomad_foundry_desc: "$col_foundry_desc$"
 col_capital_nomad_foundry_tt: "Âm thanh dồn dập từ các lò rèn ở thủ đô thậm chí còn át cả tiếng gầm rú của những động cơ lớn nhất."
 col_capital_nomad_factory: "Tàu Ark Nhà Máy (Thủ Đô)"
 col_capital_nomad_factory_desc: "$col_factory_desc$"
 col_capital_nomad_factory_tt: "Công nhân từ các nhà máy và thợ thủ công tấp nập trên mỗi tầng boong của thủ đô, liên tục cung cấp năng lượng cho những hệ thống vận hành con tàu này."
 col_capital_nomad_trade: "Tàu Ark Giao Thương (Thủ Đô)"
 col_capital_nomad_trade_desc: "$col_city_desc$"
 col_capital_nomad_trade_tt: "Thủ đô của chúng ta là một trung tâm giao thương sầm uất với các khoang chứa luôn ngập tràn những món hàng được mang về từ khắp nơi trong dải ngân hà."
 col_nomad_city: "Tàu Ark Thành Phố"
 col_nomad_city_desc: "$col_city_desc$"
 col_nomad_city_tt: "Mọi tầng boong của con tàu này đều chật ních cư dân, những đại lộ và khu chợ trên đó ngập tràn sức sống của hoạt động buôn bán giao thương."
 col_nomad_foundry: "Tàu Ark Lò Rèn"
 col_nomad_foundry_desc: "$col_foundry_desc$"
 col_nomad_foundry_tt: "Hơi nóng hầm hập tỏa ra từ các lò luyện kim hợp kim thẩm thấu qua mọi khoang tàu, trong khi tiếng đập nhịp nhàng của máy móc công nghiệp vang vọng khắp các hành lang."
 col_nomad_factory: "Tàu Ark Chế Tạo"
 col_nomad_factory_desc: "$col_factory_desc$"
 col_nomad_factory_tt: "$col_factory_tt$"
 col_nomad_bureau: "Tàu Ark Thống Nhất"
 col_nomad_bureau_desc: "$col_bureau_desc$"
 col_nomad_bureau_tt: "Toàn bộ Tàu Ark này tập trung vào việc quản lý và gắn kết người dân."
 col_nomad_research: "Tàu Ark Nghiên Cứu"
 col_nomad_research_desc: "$col_research_desc$"
 col_nomad_research_tt: "Các phòng thí nghiệm trên Tàu Ark này luôn tiên phong trong các nỗ lực nghiên cứu và phát triển công nghệ."
 col_nomad_farming: "Tàu Ark Nông Nghiệp"
 col_nomad_farming_desc: "$col_farming_desc$"
 col_nomad_farming_tt: "Những mảng thủy canh bất tận và các hệ thống chế biến sinh khối ở đây cung cấp lương thực thiết yếu, giúp quần thể duy trì sự sống trong suốt những chuyến hải trình đằng đẵng giữa các vì sao."
 col_nomad_generator: "Tàu Ark Máy Phát"
 col_nomad_generator_desc: "$col_generator_desc$"
 col_nomad_generator_tt: "Những mảng lõi lò phản ứng khổng lồ nằm rải rác trên Tàu Ark này luôn rực sáng và kêu ù ù, cung cấp sức mạnh cần thiết cho toàn bộ hạm đội."
 col_nomad_fortress: "Tàu Ark Pháo Đài"
 col_nomad_fortress_desc: "$col_fortress_desc$"
 col_nomad_fortress_tt: "Tàu Ark này được trang bị dày đặc các tháp pháo và được gia cố bằng những vách ngăn vững chắc, biến nó thành một pháo đài di động thực thụ."
