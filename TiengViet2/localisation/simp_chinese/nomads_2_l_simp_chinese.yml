 zone_ark_harvest: "Cảng Thu Hoạch"
 zone_ark_harvest_desc: "Phân bổ không gian chuyên dụng trên Tàu Ark để phân loại và sơ chế các tài nguyên thu thập được, cho phép tận dụng các máy móc hiệu suất cao cùng lợi thế thao tác trong môi trường có trọng lực, từ đó gia tăng sản lượng tài nguyên."
 planet_ark_harvester: "$job_ark_harvester_plural$"
 zone_ark_food: "Khoang Thủy Canh Trên Tàu Ark"
 zone_ark_food_desc: "Nông trại thủy canh tích hợp của Tàu Ark cung cấp lương thực cho cư dân của chúng ta."
 zone_ark_waystation_trade: "Trung Tâm Thương Mại trạm tiếp vận"
 zone_ark_waystation_trade_desc: "Giao thương tấp nập diễn ra trên các tầng boong này khi các chuyên gia bắt đầu điều phối việc vận chuyển hàng hóa giữa các trạm tiếp vận của chúng ta và thị trường của các quốc gia định cư."
