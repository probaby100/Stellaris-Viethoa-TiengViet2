 mobile: "Đang di chuyển"
 stationary: "Neo đậu"
 district_ark_city: "Boong sinh hoạt"
 district_ark_city_plural: "$district_ark_city$"
 district_ark_city_desc: "Một phân khu rộng lớn trên tàu được quy hoạch cho các chức năng sinh sống, thương mại và cộng đồng. Đây là trái tim đang đập của nền văn minh di động của chúng ta."
 district_ark_generator: "Hệ Lò Phản Ứng"
 district_ark_generator_plural: "$district_ark_generator$"
 district_ark_generator_desc: "Một tổ hợp các lò phản ứng công suất lớn được xếp dọc theo phần dưới của thân tàu, truyền nguồn năng lượng khổng lồ đến mọi hệ thống trên tàu."
 district_ark_basic: "Boong Tàu Ark"
 district_ark_basic_name: "Nhà Ở Cơ Bản"
 district_ark_basic_plural: "$district_ark_basic$"
 district_ark_basic_desc: "Những tầng boong này hiện đang được sử dụng làm nơi cư trú, nhưng có thể được phát triển thêm cho nhiều mục đích chuyên biệt hơn."
 district_ark_military: "Khối Kỹ Thuật Vũ Khí"
 district_ark_military_plural: "$district_ark_military$"
 district_ark_military_desc: "Những kỹ sư chuyên môn sinh sống trong các khu vực kỹ thuật bọc giáp này chịu trách nhiệm bảo trì hệ thống vũ khí, hệ thống phòng thủ và tính toàn vẹn của thân tàu."
 district_ark_military_name: "Lõi Kỹ Thuật"
 district_ark_military_flavor_desc: "$district_ark_military_desc$"
 pc_ark: "Tàu Ark"
 mod_pc_ark_habitability: "Độ thích cư trên Tàu Ark"
 job_ark_waystation_trader: "Kiểm Toán trạm tiếp vận"
 job_ark_waystation_trader_plural: "$job_ark_waystation_trader$"
 job_ark_waystation_trader_desc: "Quản lý từ xa một trạm tiếp vận là một công việc hậu cần mệt mỏi và không bao giờ kết thúc, nhưng phải có người làm thôi."
 job_ark_harvester: "Thợ Thu Hoạch Không Gian"
 job_ark_harvester_plural: "Thợ Thu Hoạch Không Gian"
 job_ark_harvester_desc: "Thợ Thu Hoạch Không Gian xử lý việc thu gom và chế biến các mỏ tài nguyên trên quỹ đạo, tăng đáng kể sản lượng thu hoạch được."
 mod_job_ark_waystation_trader_add: "Vị trí $job_ark_waystation_trader$"
 mod_job_ark_harvester_add: "Vị trí $job_ark_harvester$"
 job_ark_harvester_plural_with_icon: "£job_ark_harvester£ $job_ark_harvester_plural$"
 mod_pop_ark_harvester_bonus_workforce_mult: "Hiệu suất vị trí của $job_ark_harvester_plural$"
 zone_ark_missile_silos: "Hầm Phóng Tên Lửa"
 zone_ark_missile_silos_desc: "Các đội ngũ bảo dưỡng chuyên dụng giữ cho các hầm chứa luôn trong trạng thái sẵn sàng, đánh đổi lượng năng lượng khổng lồ lấy khả năng tấn công phủ đầu."
 zone_ark_ammunition_lines: "Dây Chuyền Đạn Dược"
 zone_ark_ammunition_lines_desc: "Sản xuất đạn động năng suốt ngày đêm để đảm bảo các khẩu pháo vĩ đại của chúng ta không bao giờ ngừng gầm thét. Mỗi máy nạp, vỏ đạn và liều thuốc phóng đều được tính toán một cách chính xác."
 zone_ark_laser_capacitors: "Tụ Điện Laser"
 zone_ark_laser_capacitors_desc: "Các dãy tụ điện dung lượng cao truyền năng lượng trực tiếp vào các mảng laser, duy trì tốc độ bắn ở giới hạn xả nhiệt của các bộ phát."
 zone_ark_flight_decks: "Boong Phóng"
 zone_ark_flight_decks_desc: "Hoạt động huấn luyện không ngừng nghỉ giúp chúng ta triển khai chiến cơ với độ chính xác vô song, dệt nên những lưới lửa tầng lớp."
 zone_ark_missile_silos_module_synergy_tt: "Mô-đun §H$sm_explosive_cat$§! cung cấp vị trí $soldier_type_plural_with_icon$: §G+$@arkship_module_jobs|0$§!"
 zone_ark_ammunition_lines_module_synergy_tt: "Mô-đun §H$sm_projectile_cat$§! cung cấp vị trí $soldier_type_plural_with_icon$: §G+$@arkship_module_jobs|0$§!"
 zone_ark_laser_capacitors_module_synergy_tt: "Mô-đun §H$sm_energy_cat$§! cung cấp vị trí $soldier_type_plural_with_icon$: §G+$@arkship_module_jobs|0$§!"
