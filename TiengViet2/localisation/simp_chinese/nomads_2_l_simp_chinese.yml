 sm_waystation_aetherophasic_anchor: "Nút Neo Kết Nối Không Gian Đa Chiều"
 sm_waystation_aetherophasic_anchor_desc: "Tòa kiến trúc này đã giúp cho hạm đội đang phiêu bạt của chúng ta được cố định một cách vững chãi tại một tọa độ xác định trong không gian bao la. Thông qua trạm tiếp vận được neo chặt tại vị trí này, chúng ta đã biến hệ sao này trở thành trung tâm kết nối không gian tối thượng cho công trình §H$crisis_sphere_0$§!. Tất cả những năng lượng mà chúng ta thu thập được từ khắp các nẻo đường trong không gian vô cực của dải ngân hà sẽ được tập trung dồn về chốn này, từ đó sẽ xé toạc tấm màn ranh giới ngăn cách giữa các thế giới với nhau."
 requires_waystation_aetherophasic_anchor: "Để có thể khởi động quy trình cuối cùng, Đế chế Du Mục nhất thiết phải thiết lập được tọa độ chuẩn xác cho module trạm tiếp vận §HNút Neo Kết Nối Không Gian Đa Chiều§!. Hệ sao là nơi mà module trạm tiếp vận này đang trú ngụ cũng sẽ trở thành địa điểm tiếp nhận sự hiện diện của §H$crisis_sphere_0$§!."
