 pc_ark_desc: "Mang cả hành tinh lên con thuyền, biến con thuyền thành một thế giới."
 zone_ark_military_eco: "Lò Rèn Hư Không"
 zone_ark_military_eco_desc: "Việc chuyển đổi một số xưởng đúc của chúng ta thành các cơ sở chuyên sản xuất các tấm giáp bọc tiêu chuẩn mang lại cho chúng ta nguồn linh kiện dự phòng luôn sẵn sàng để chống lại sự mài mòn."
 zone_ark_shipwright: "Trại Kỹ Sư Tàu Thủy"
 zone_ark_shipwright_desc: "Đưa việc xây dựng và dịch vụ bảo trì tàu vào chương trình nghị sự quân sự cho phép huy động binh lính hỗ trợ cho các nhà máy đóng tàu hải quân."
 zone_ark_shipwright_module_synergy_tt: "Vị trí $soldier_type_plural_with_icon$ được cung cấp bởi mô-đun §H$sm_naval_support_cat$§!: §G+$@arkship_module_jobs|0$§!"
 zone_ark_shipwright_module_synergy_gestalt_tt: "Vị trí $job_warrior_drone_swap_plural_with_icon$ được cung cấp bởi mô-đun §H$sm_naval_support_cat$§!: §G+$@arkship_module_jobs|0$§!"
 zone_ark_reactor_physics: "Máy Gia Tốc Hạt Năng Lượng Cao"
 zone_ark_reactor_physics_desc: "Một cơ sở chuyên nghiên cứu vật lý hạt năng lượng cao, được đặt sâu bên trong cốt lõi của Tàu Ark."
 zone_ark_farm_society: "Trạm Quan Sát Xã Hội Sinh Thái"
 zone_ark_farm_society_desc: "Các nhà nghiên cứu sử dụng những phòng thí nghiệm chuyên dụng này để tiến hành các nghiên cứu quan sát trên cư dân của Tàu Ark."
 zone_ark_military_engineering: "Khu Phức Hợp Nghiên Cứu Quân Sự"
 zone_ark_military_engineering_desc: "Sự trao đổi học thuật liên ngành giữa các nhà nghiên cứu và bộ phận bảo trì Tàu Ark của chúng ta đã mang lại những kết quả đầy thiết thực."
