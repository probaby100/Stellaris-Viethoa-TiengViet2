 district_ark_engine_bypass: "Chuyển Hướng Động Cơ"
 district_ark_engine_bypass_plural: "$district_ark_engine_bypass$"
 district_ark_engine_bypass_desc: "Hệ thống chuyển hướng động cơ cho phép bỏ qua phương pháp tản nhiệt truyền thống, truyền trực tiếp năng lượng dư thừa vào lực đẩy của động cơ, đánh đổi bằng sản lượng năng lượng."
 district_ark_shield_overloader: "Bộ Quá Tải Khiên"
 district_ark_shield_overloader_plural: "$district_ark_shield_overloader$"
 district_ark_shield_overloader_desc: "Bơm vật chất lạ vào lò phản ứng cho phép chúng ta duy trì lá chắn vượt quá thông số kỹ thuật thông thường."
