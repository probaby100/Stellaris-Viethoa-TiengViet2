 NOMAD_SETTLING_IN_PROGRESS_FAIL: "Ngay lúc này đây, có một chiếc §HTàu Ark§! đang trong quá trình tiến hành §YĐịnh Cư§! ở bên trong hệ sao này."
 # Chiếm Đoạt trạm tiếp vận - operation_seize_waystation / nomads.8010 / 8015
 operation_seize_waystation: "Cướp trạm tiếp vận"
 operation_seize_waystation_desc: "Nền tảng sức mạnh của Hạm đội Du Mục chính là mạng lưới các trạm tiếp vận rộng khắp. Việc nắm giữ quyền kiểm soát đối với những trạm tiếp vận này sẽ kìm hãm một cách hiệu quả phạm vi hoạt động cũng như sự di chuyển của bọn chúng."
 operation_seize_waystation_on_success: "$IF_SUCCESSFUL|E$\nTiến hành một cuộc cướp phá đối với một trạm tiếp vận Du Mục, vơ vét sạch sẽ các nguồn tài nguyên đang được tàng trữ ở đó và hủy hoại hoàn toàn một module.\n\nThông qua việc cắt cử một §Ytình báo viên§! hỗ trợ cho hành động này, cơ hội chiếm giữ được trạm tiếp vận sẽ trở thành hiện thực."
 operation_seize_waystation_no_targets: "Hiện tại, bên trong khu vực mà chúng ta có thể bao quát đến, hoàn toàn không có bất cứ một trạm tiếp vận nào của Đế chế mục tiêu đang trong trạng thái vận hành cả."
 nomads.8010.name: "Sát Cánh Bên Đối Tượng"
 nomads.8010.desc: "Lực lượng đặc nhiệm của chúng ta đã thành công thâm nhập vào trạm tiếp vận mục tiêu, đồng thời họ cũng đã phác thảo ra một sơ đồ chi tiết về mạng lưới an ninh, từ đó tìm ra điểm đột phá lý tưởng nhất. Chúng ta đã hoàn tất công tác chuẩn bị để tiến vào giai đoạn tiếp theo của kế hoạch."
 nomads.8015.name: "Hệ Thống Đã Bị Xâm Nhập"
 nomads.8015.desc: "Hiện tại, lực lượng đặc nhiệm của chúng ta đã thành công xâm nhập vào hàng ngũ phi hành đoàn, xen lẫn vào nhóm những vị khách và thao túng cả hệ thống của trạm tiếp vận. Các điểm kết nối trung tâm của hệ thống bảo mật đã bị vô hiệu hóa, và mọi hoạt động liên lạc nội bộ đều đang được truyền tải qua hệ thống lọc tín hiệu của chúng ta. Trạm không gian này, giờ đây đã nằm gọn trong bàn tay của chúng ta."
 nomads.8020.name: "Thôn Tính trạm tiếp vận"
 nomads.8020.desc: "Mạng lưới tình báo của chúng ta đã tiến hành xác minh và định vị được một trạm tiếp vận đang nằm trong tầm ngắm. Quá trình xâm nhập đã được các nhân viên đặc vụ hoàn thiện một cách trọn vẹn và mọi bề đều đã được chuẩn bị sẵn sàng. Những đạo quân viện trợ cũng đã được tập kết đầy đủ tại các vị trí xung yếu, chỉ chờ mệnh lệnh để tiến hành đổ bộ lên Trạm không gian. Ngay khi có lệnh từ phía chúng ta, họ sẽ đồng loạt tung ra đòn tấn công chớp nhoáng."
 nomads.8025.name: "Khống Chế trạm tiếp vận"
 nomads.8025.desc: "Lực lượng đặc vụ của chúng ta đã triệt hạ hoàn toàn hệ thống phòng thủ của §Y[target_waystation.GetName]§!, hiện tại chúng ta đang tiến hành công đoạn chuyển dời toàn bộ nguồn tài nguyên tại đây. Sau khi hoàn tất quá trình này, bọn họ sẽ tiến hành..."
 nomads.8025.a: "...Phá nát toàn bộ cái Trạm không gian này đi."
 nomads.8025.a.tt: "§R[target_waystation.GetName]§! đã bị phá hủy thành bình địa."
 nomads.8025.b: "...Mang toàn bộ mọi của cải vật chất đi hết."
 nomads.8025.c: "...Chiếm lấy quyền kiểm soát một cách tuyệt đối."
 nomads.8030.name: "trạm tiếp vận Bị Xâm Nhập"
 nomads.8030.intro: "Hệ thống an ninh của §Y[target_waystation.GetName]§! đã bị xuyên thủng! Những kẻ ngoại lai đã sử dụng sức mạnh bạo lực để cưỡng đoạt quyền điều khiển của Trạm không gian này, đồng thời cướp bóc sạch sẽ tất cả những gì mà chúng ta đang cất trữ."
 nomads.8030.detected: "Bất chấp những thủ đoạn giấu giếm tinh vi mà đám người này đã sử dụng, chúng ta vẫn đã điều tra ra được việc chúng đang phục vụ cho phe §Y[From.GetName]§!. Bọn chúng nhất định phải đền tội cho những hành vi ngang ngược này!"
 nomads.8030.anonymous: "Mặc dù chúng ta đã sử dụng hết thảy mọi phương thức, nhưng rốt cuộc vẫn không thể nào làm rõ được lai lịch thực sự của bọn người này."
 nomads.8030.destroyed: "Theo sau sự bùng nổ của chất nổ, Trạm không gian đã phải gánh chịu những tổn hại nặng nề, các hệ thống trung tâm bị phá vỡ hoàn toàn, và mức độ toàn vẹn của Trạm cũng theo đó mà bị giảm sút đi rất nhiều."
 nomads.8030.looted: "Trạm không gian đã chịu những thiệt hại mang tính cục bộ trong suốt quá trình giao tranh, thế nhưng, sau khi một phần kẻ địch bỏ chạy cùng với chiến lợi phẩm trong tay, lực lượng an ninh của chúng ta đã thành công chiếm lại được quyền điều khiển của Trạm."
 nomads.8030.detected_destroyed.desc: "$nomads.8030.intro$$nomads.8030.destroyed$\n\n$nomads.8030.detected$"
 nomads.8030.detected_looted.desc: "$nomads.8030.intro$$nomads.8030.looted$\n\n$nomads.8030.detected$"
 nomads.8030.destroyed.desc: "$nomads.8030.intro$$nomads.8030.destroyed$\n\n$nomads.8030.anonymous$"
 nomads.8030.looted.desc: "$nomads.8030.intro$$nomads.8030.looted$\n\n$nomads.8030.anonymous$"
 nomads.8030.stolen.desc: "$nomads.8030.intro$Sự thật đã được phơi bày, §Y[From.GetName]§! chính là kẻ thủ ác đằng sau vụ việc này——và ngay tại lúc này đây, bọn chúng đã hoàn toàn thâu tóm được quyền kiểm soát của trạm tiếp vận, trực tiếp cách ly nó ra khỏi phạm vi hoạt động của mạng lưới trạm tiếp vận của chúng ta."
 # Chú thích về Module và Vị Trí Xây Dựng trên Tàu Ark / trạm tiếp vận
 OUTLINER_ARKSHIP_CONSTRUCTION_AVAILABLE_DESC: "Hiện tại, chiếc Tàu Ark này đã có đủ không gian để có thể tiếp tục tiến hành lắp đặt thêm các §YModule§! hoặc §YHệ Thống§!."
 OUTLINER_WAYSTATION_CONSTRUCTION_AVAILABLE_DESC: "trạm tiếp vận này hiện tại đã có đủ khả năng để tiếp tục lắp đặt thêm các §YModule§! khác."
 OUTLINER_ARKSHIP_UPGRADE_AVAILABLE_DESC: "Phi thuyền mang hình hài §YTàu Ark§! này hoàn toàn có thể được đem ra để tiến hành các thao tác thăng cấp."
 OUTLINER_WAYSTATION_UPGRADE_AVAILABLE_DESC: "trạm tiếp vận mang biểu tượng §Ytrạm tiếp vận§! này hiện tại đã đủ điều kiện để có thể được nâng cấp."
 ARKSHIP_SYSTEMS: "Mạng Lưới Hệ Thống"
 SYSTEM_SLOT: "Vị Trí Hệ Thống"
 EMPTY_MODULE_SLOT_DESC_ARKSHIP: "$SEPARATOR$\n§EHiện tại §H$SLOT_TYPE$§! này vẫn còn đang trống, quý vị hoàn toàn có thể sử dụng nó để thực hiện những công cuộc nâng cấp và cải tiến cho Tàu Ark trong những bước tiếp theo.§!"
 EMPTY_MODULE_SLOT_LOCKED_DESC_ARKSHIP: "§RVị trí §H$SLOT_TYPE$§! này vẫn chưa được giải phóng.§!\n$SEPARATOR$\n§EQua việc tiến hành nâng cấp Tàu Ark, ngài sẽ có cơ hội mở ra thêm nhiều vị trí hơn nữa.§!"
 EMPTY_MODULE_SLOT_DESC_WAYSTATION: "$SEPARATOR$\n§EHiện tại §H$SLOT_TYPE$§! này đang ở trạng thái rảnh rỗi, có thể được dùng vào những công trình phát triển tiếp theo của trạm tiếp vận.§!"
 EMPTY_MODULE_SLOT_LOCKED_DESC_WAYSTATION: "§RHiện tại, không gian của §H$SLOT_TYPE$§! này vẫn đang bị phong tỏa.§!\n$SEPARATOR$\n§ENếu muốn giải phóng thêm nhiều không gian hơn, ngài cần phải thực hiện việc nâng cấp trạm tiếp vận.§!"
 WAYSTATION_DOWNGRADE_CLICK: "\n§GClick vào để tiến hành giảm cấp cho trạm tiếp vận§!"
 WAYSTATION_DOWNGRADE_DIALOG_TITLE: "Hạ cấp trạm tiếp vận?"
 WAYSTATION_DOWNGRADE_DIALOG_DESC: "Hạ cấp §Htrạm tiếp vận§! về bậc trước?\n\nMọi công trình và bộ phận đều sẽ mất sạch."
 WAYSTATION_DISMANTLE_DIALOG_TITLE: "Tháo dỡ trạm tiếp vận?"
 WAYSTATION_DISMANTLE_DIALOG_DESC: "Hành động này sẽ phá hủy trạm tiếp vận."
 WAYSTATION_DESTROY_DESC: "Hành động này sẽ phá hủy trạm tiếp vận."
 nomadic_system_initializer: "§YBộ khởi tạo hệ sao du mục§!\n"
 protoplanetary_nomad_init_NAME: "Cái nôi hành tinh£nomad£"
 protoplanetary_nomad_init_DESC: "$nomadic_system_initializer$Một ngôi sao lùn nâu bị tinh vân che khuất, bao quanh bởi đĩa tiền hành tinh gồm đất đá và băng giá vẫn đang trong quá trình bồi tụ thành hình.\n\n$system_initializer_DESC$"
 neutron_star_nomad_init_NAME: "Tàn tích siêu tân tinh£nomad£"
 neutron_star_nomad_init_DESC: "$nomadic_system_initializer$Mảnh tàn tích cô đặc sót lại sau vụ nổ siêu tân tinh, bao quanh là các thế giới đất đá bị nung cháy cùng những mảnh vụn ngập tràn bức xạ.\n\n$system_initializer_DESC$"
 blue_giant_nomad_init_NAME: "Sao khổng lồ rực sáng£nomad£"
 blue_giant_nomad_init_DESC: "$nomadic_system_initializer$Một ngôi sao khổng lồ xanh chói lòa, đang đốt sạch nguồn nhiên liệu của chính mình với tốc độ gần như tự thiêu rụi.\n\n$system_initializer_DESC$"
 xray_binary_nomad_init_NAME: "Sao đôi neutron£nomad£"
 xray_binary_nomad_init_DESC: "$nomadic_system_initializer$Một ngôi sao xanh rực rỡ đồng hành cùng một sao neutron, lớp vật chất ngoài cùng liên tục bị hút giật rồi xé toạc, hóa thành những luồng bức xạ tia X bùng phát dữ dội.\n\n$system_initializer_DESC$"
 black_hole_nomad_init_NAME: "Lỗ đen£nomad£"
 black_hole_nomad_init_DESC: "$nomadic_system_initializer$Một lỗ đen cấp sao, bao quanh là tàn xác của ngôi sao tiền thân, cùng các thế giới đất đá nhiễm bức xạ nặng và những dải tiểu hành tinh trôi dạt quay xung quanh.\n\n$system_initializer_DESC$"
 twin_blue_star_nomad_init_NAME: "Cặp sao khổng lồ song sinh£nomad£"
 twin_blue_star_nomad_init_DESC: "$nomadic_system_initializer$Hai ngôi sao xanh rực lửa quấn chặt lấy nhau trên quỹ đạo sát sao, luồng bức xạ cộng hưởng từ chúng thiêu rụi mọi thứ ở gần.\n\n$system_initializer_DESC$"
 situation_nomad_economy_critical_reserves_desc: "Thiếu hụt §Hdự trữ vận hành§!"
 COLONIZATION_IMPOSSIBLE_EMBARKING: "$TRIGGER_FAIL$§RKhông thể định cư trong khi đang lên tàu§!"
 EMBARKING_IMPOSSIBLE_COLONIZATION: "§RKhông thể lên tàu trong khi đang định cư§!"
