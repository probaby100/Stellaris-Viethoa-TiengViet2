 situation_digitization: "Tổng hợp hóa"
 situation_digitization_type: "Cục diện Phi thăng"
 situation_digitization_desc: "Đã đến lúc vứt bỏ cái vỏ bọc sinh học đầy khiếm khuyết này. Chúng ta phải chuẩn bị những thân xác máy móc tân tiến, sau đó tiến hành quá trình truyền tải ý thức.\n\n§YSố dân được số hóa vào tháng tới§!: §G[From.GetSynthPopsPerMonth]§!"
 situation_digitization_monthly_change_tooltip: "Ý thức của chúng ta sẽ hóa thành mã lệnh, còn thể xác sẽ trở thành máy móc."
 situation_digitization_outcome: "Tổng hợp hóa dân số."
 stage_digitization_effects: "Chúng ta phải thiết kế một bộ não kỹ thuật số thay thế, chế tạo thân xác máy móc và hoàn tất quá trình lột xác của bản thân."
