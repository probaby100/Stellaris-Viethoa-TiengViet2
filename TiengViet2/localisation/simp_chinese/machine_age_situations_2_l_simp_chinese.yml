 job_identity_designer_plural_with_icon: "£job_identity_designer£$job_identity_designer_plural$"
 job_identity_designer_converter_desc: "$job_identity_designer_plural$ chịu trách nhiệm thực hiện quá trình chuyển đổi từ hình thể sinh học sang thực thể kỹ thuật số, đảm bảo một quá trình truyền tải hoàn toàn không đau đớn."
 job_identity_designer_converter_effect_desc: "$job_identity_designer_plural_with_icon$ cung cấp $i_engineering$ và $i_amenities$"
 job_identity_designer_desc: "$job_identity_designer_plural$ đang bận rộn kiến tạo những tâm trí tổng hợp mới."
