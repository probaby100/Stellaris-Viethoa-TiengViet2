 #Hiệu chỉnh
 synth_opposition_truth: "Chiến dịch Minh bạch Thông tin Tổng hợp hóa"
 synth_opposition_truth_desc: "Thúc đẩy tính xác thực của thông tin về mọi khía cạnh liên quan đến tổng hợp hóa."
 synth_opposition_deception: "Chiến dịch Tuyên truyền Tổng hợp hóa"
 synth_opposition_deception_desc: "Định hướng dư luận, nhấn mạnh vào những mặt tích cực của việc tổng hợp hóa tâm trí."
 synth_tinkering_with_minds: "Chỉnh sửa Ý thức"
 synth_tinkering_with_minds_desc: "Những ý thức vừa được số hóa sẽ được lập trình lại nhằm đảm bảo sự tương thích với tầm nhìn tương lai của chúng ta."
 synth_brightest_minds: "Ưu tiên Tinh anh"
 synth_brightest_minds_desc: "Chỉ chọn lọc những cá nhân xuất chúng nhất để tham gia vào kế hoạch tổng hợp hóa của chúng ta."
 synth_reprogram_minds: "Cưỡng chế Lập trình lại"
 synth_reprogram_minds_desc: "Trong quá trình số hóa, chính phủ này đã tiến hành lập trình lại trên diện rộng đối với những cá nhân \"không phù hợp\"."
 victim_compensation: "Bồi thường cho Nạn nhân"
 victim_compensation_desc: "Bồi thường cho những gia đình không may mất đi người thân trong quá trình tổng hợp hóa."
 synth_mandatory_volunteers: "Tình nguyện viên Cưỡng bức"
 synth_mandatory_volunteers_desc: "Các đối tượng thử nghiệm bị ép buộc phải tham gia vào các thí nghiệm số hóa ý thức sinh học."
 synth_mass_demonstrations: "Biểu tình Quy mô Lớn"
 synth_mass_demonstrations_desc: "Lực lượng lao động trên hành tinh này đang ồ ạt tham gia vào các cuộc biểu tình chống lại kế hoạch cơ khí hóa."
 synth_fund_heritage_sites: "Đầu tư vào Di tích Kế thừa"
 synth_fund_heritage_sites_desc: "Xây dựng các di tích kế thừa đặc biệt nhằm làm giảm thiểu tác động tiêu cực của quá trình tổng hợp hóa đối với các thành viên sinh học của giống loài chúng ta."
 synth_revere_the_past: "Tôn kính Quá khứ"
 synth_revere_the_past_desc: "Những nghi thức tôn giáo nảy nở từ thuở chúng ta còn là những sinh vật hữu cơ vẫn luôn mang ý nghĩa quan trọng, ta phải bảo vệ những nơi thờ phụng này."
 synth_preserve_the_past: "Gìn giữ Quá khứ"
 synth_preserve_the_past_desc: "Việc hoàn toàn chấp nhận một hình thức tồn tại mới không đồng nghĩa với việc ta phải hủy hoại những nơi chốn và sự vật từng mang lại ý nghĩa cho quá khứ sinh học của chúng ta."
 synth_resistance_fight: "Vây bắt Thủ lĩnh Phản kháng"
 synth_resistance_fight_desc: "Việc phái đội đặc nhiệm máy móc của ta đến $d_biological_enclaves_no_icon$ để bắt giữ thủ lĩnh phe phản kháng sẽ nhanh chóng dập tắt sự chống đối của họ."
 synth_resistance_diplomacy: "Đàm phán với Thủ lĩnh Phản kháng"
 synth_resistance_diplomacy_desc: "Đích thân tới $d_biological_enclaves_no_icon$ để gặp mặt thủ lĩnh phe phản kháng sẽ giúp thúc đẩy sự thấu hiểu lẫn nhau."
 synth_character_force: "Mô phỏng Thể xác Hữu cơ Cũ"
 synth_character_force_desc: "Ngoại hình truyền thống của giống loài chúng ta đã được lưu giữ nguyên vẹn vào thế giới dữ liệu."
 synth_character_customize: "Sửa đổi Thể xác Tổng hợp Không Giới hạn"
 synth_character_customize_desc: "Mọi cá nhân đều được tự do chỉnh sửa ngoại hình kỹ thuật số mới của mình."
 synth_character_customize_elite: "Ưu tiên Sửa đổi Thể xác Tổng hợp"
 synth_character_customize_elite_desc: "Để duy trì một trật tự xã hội rõ ràng, chỉ những người thuộc tầng lớp thượng lưu mới có quyền sửa đổi ngoại hình."
 synth_character_customize_corpo: "Sửa đổi Thể xác Tổng hợp Trả phí"
 synth_character_customize_corpo_desc: "Ai cũng có quyền tự do chỉnh sửa ngoại hình kỹ thuật số, miễn là có đủ tiền để trả."
 synth_cravings_imperfections: "Khiếm khuyết Tổng hợp Nhân tạo"
 synth_cravings_imperfections_desc: "Để tránh sự đồng nhất rỗng tuếch, chúng ta đã chủ động tạo ra những điểm khiếm khuyết nhân tạo trên cơ thể tổng hợp."
 synth_cravings_simulation: "Cuộc sống Giả lập"
 synth_cravings_simulation_desc: "Chúng ta cố gắng mang đến một cuộc đời chân thực nhất, bao gồm cả mọi loại trắc trở, cho những cá nhân chọn sống trong thế giới giả lập."
 synth_cravings_stop: "Phớt lờ phe Hữu cơ Cứng rắn"
 synth_cravings_stop_desc: "Cùng với thời gian, nhân dân ta rồi sẽ biết ơn một cuộc sống hoàn hảo, thoát khỏi mọi khổ đau của thể xác hữu cơ."
 synth_cravings_pain: "Đấu trường Ảo"
 synth_cravings_pain_desc: "Việc lao vào những trận chiến ảo có mang lại cảm giác đau đớn thực sự đã khơi gợi lại những xúc cảm quen thuộc cho cả người tham gia lẫn khán giả."
 synth_health_physical: "Chú trọng Sức khỏe Thể xác Tổng hợp"
 synth_health_physical_desc: "Chế độ bảo hiểm y tế tổng hợp của chúng ta sẽ ưu tiên xử lý các lỗi hỏng hóc cục bộ."
 synth_health_virtual: "Chú trọng Sức khỏe Tinh thần Tổng hợp"
 synth_health_virtual_desc: "Đảm bảo an toàn cho ý thức thông qua các bản cập nhật phần mềm liên tục là yếu tố cốt lõi đối với sức khỏe của chúng ta."
 synth_health_both: "Chú trọng Sức khỏe Tổng hợp Toàn diện"
 synth_health_both_desc: "Việc giải quyết đồng thời cả các bất ổn về phần cứng lẫn phần mềm sẽ mang lại lợi ích to lớn cho phúc lợi của nhân dân ta."
 synth_health_corporate: "Y tế Tổng hợp"
 synth_health_corporate_desc: "Việc mở rộng chuyên môn của tập đoàn ra ngoài lĩnh vực dược phẩm truyền thống là điều tối quan trọng để có thể đối phó với virus kỹ thuật số."
 synth_virtual_world_outlaw: "Cấm Thế giới Ảo"
 synth_virtual_world_outlaw_desc: "Ban hành luật cấm các khu nghỉ dưỡng ảo có tính gây nghiện cao để tránh gây ra những tác hại cho xã hội."
 synth_virtual_world_promote: "Khuyến khích Thế giới Ảo"
 synth_virtual_world_promote_desc: "Mọi người đều có quyền tự do đắm mình vào vô vàn những hoạt động giải trí ảo trong chốn địa đàng kỹ thuật số."
 synth_virtual_world_regulate: "Kiểm soát Thế giới Ảo"
 synth_virtual_world_regulate_desc: "Ban hành luật lệ kiểm soát các khu nghỉ dưỡng ảo có tính gây nghiện cao để đảm bảo người dân không bị đứt đoạn hoàn toàn với thực tại."
 synth_home_centralized: "Cụm Máy chủ Trung tâm hóa"
 synth_home_centralized_desc: "Mọi ý thức đã được số hóa đều được lưu trữ trong các cụm máy chủ trung tâm thuộc sở hữu của nhà nước để tối ưu hóa hiệu quả kinh tế."
 synth_home_distributed: "Máy chủ Phân tán"
 synth_home_distributed_desc: "Ý thức đã được số hóa sẽ được lưu trữ trong các thiết bị cá nhân truyền thống."
 synth_digital_homes: "Bất động sản Kỹ thuật số"
 synth_digital_homes_desc: "Tương tự như thị trường bất động sản truyền thống, bất động sản kỹ thuật số cung cấp những chức năng gần như giống hệt nhưng với một mức giá rẻ mạt."
 synth_respawn_push: "Tiêu chuẩn An toàn Tổng hợp Lỏng lẻo"
 synth_respawn_push_desc: "Tiêu chuẩn an toàn cá nhân lỏng lẻo sẽ đảm bảo sự sôi động cho nền kinh tế."
 synth_respawn_caution: "Tiêu chuẩn An toàn Tổng hợp"
 synth_respawn_caution_desc: "Chỉ những quy định nghiêm ngặt của chính phủ mới có thể bảo vệ được cơ thể tổng hợp và phần ý thức bên trong đó."
 synth_respawn_elite: "Đặc quyền An toàn Tổng hợp"
 synth_respawn_elite_desc: "Tầng lớp thượng lưu bị cấm tham gia vào những công việc có thể gây nguy hiểm cho cả thể xác lẫn ý thức."
 synth_cultural_exchange: "Thấu hiểu Văn hóa"
 synth_cultural_exchange_desc: "Triển khai các dự án giao lưu văn hóa tại các di tích kế thừa có thể giúp thúc đẩy sự thấu hiểu lẫn nhau giữa nhân dân ta."
 synth_combat_reactors: "Lò phản ứng Chiến đấu"
 synth_combat_reactors_desc: "Nhờ ứng dụng công nghệ vi dung hợp mới vào thân xác máy móc, sức mạnh chiến đấu của chúng ta sẽ trở nên vô cùng dũng mãnh và đáng gờm."
 synth_AI_actor: "Người phát ngôn Trí tuệ Nhân tạo"
 synth_AI_actor_desc: "Sử dụng trí tuệ nhân tạo để hồi sinh bản sao của những người nổi tiếng đã qua đời, nhằm thu hút thêm sự ủng hộ cho các chỉ lệnh tổng hợp hóa đang được tiến hành của chúng ta."
 #Đặc điểm Hành tinh
 d_old_towns_no_icons: "Thị trấn Cũ kĩ"
 d_old_towns: "£blocker£$d_old_towns_no_icons$"
 d_old_towns_desc: "Khu vực này có rất nhiều thị trấn được bảo tồn nguyên vẹn, đây là nơi sinh sống của các thành viên thuộc giống loài nguyên thủy của chúng ta. Nếu bỏ ra một ít tài nguyên, ta có thể thuyết phục những kẻ cứng đầu này chuyển đổi thành máy móc."
 d_old_towns_custom_tooltip: "Tạo ra §Y[Owner.GetNumSynthOpposition] [Owner.GetMechanicalPopOrPops]§!"
 d_biological_enclaves_no_icon: "Khu Biệt lập Sinh học"
 d_biological_enclaves: "£blocker£$d_biological_enclaves_no_icon$"
 d_biological_enclaves_desc: "Khu vực này có rất nhiều thị trấn được bảo tồn nguyên vẹn, đây là nơi sinh sống của những kẻ cứng đầu ngoan cố từ chối trở thành người tổng hợp."
 d_biological_enclaves_custom_tooltip: "Tạo ra §Y[Owner.GetNumSynthOpposition] [Owner.GetMechanicalPopOrPops]§!"
