 policy_synthetic_identities_policy: "Nhân cách Tổng hợp"
 policy_synthetic_identities_policy_desc: "Chúng ta bắt buộc phải tạo ra những nhân cách tổng hợp mới để duy trì nòi giống."
 identity_copy_name: "Sao chép Nhân cách"
 identity_copy: "$identity_copy_name$"
 identity_copy_desc: "$tech_identity_copy_desc$\n\nBởi sự thiếu hụt đi tính độc bản, những bản sao này đôi khi sẽ phải trải qua những nỗi ưu phiền thoảng qua.\n\n$TECH_UNLOCK_IDENTITY_COPY_DESC$\n\n§E$identity_copy_name$$can_enable_mind_creation$§!"
 identity_fusion_name: "Dung hợp Nhân cách"
 identity_fusion: "$identity_fusion_name$"
 identity_fusion_desc: "$tech_identity_fusion_desc$\n\n$TECH_UNLOCK_IDENTITY_FUSION_DESC$\n\n§E$identity_fusion_name$$can_enable_mind_creation$§!"
 identity_initialization_name: "Khởi tạo Nhân cách"
