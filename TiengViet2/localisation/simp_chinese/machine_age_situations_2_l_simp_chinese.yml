 building_identity_complex: "Tổ hợp Nhân cách"
 building_identity_complex_desc: "Một trung tâm nghiên cứu và phát triển nhân cách tổng hợp tối tân."
 building_identity_complex_speed: "§G+100§!£pop£§Hnhân khẩu§!"
 building_identity_complex_effect_desc: "Mỗi tháng tải lên $building_identity_complex_speed$."
 building_ai_emporium: "Thương xá Trí tuệ Nhân tạo"
 building_ai_emporium_desc: "Trung tâm dịch vụ khổng lồ đáp ứng mọi nhu cầu về trí tuệ nhân tạo của bạn, nơi các AI có cảm xúc sẽ biến những món đồ vật vô tri thành những người bạn đồng hành thông minh cho gia đình hoặc doanh nghiệp. Nếu AI của bạn quá cứng đầu, hãy mang nó đến đây, đội ngũ kỹ thuật viên lành nghề của chúng tôi sẽ thiết lập lại nó nhanh hơn cả ánh sáng."
 building_ai_emporium_fail_tt: "$TRIGGER_FAIL$Chúng ta đã xây một §Y$building_ai_emporium$§! trên §Y[planet.owner.GetName]§! rồi"
 building_ai_emporium_outlawed_robots_tt: "$TRIGGER_FAIL$§Y[planet.owner.GetName]§! đã cấm người máy"
 building_clear_thought_clinic: "Phòng khám Thanh lọc Tâm trí"
 building_clear_thought_clinic_desc: "Có những ký ức chẳng để làm gì ư? Hãy đổi chúng lấy điểm năng lượng ngay thôi! Đội ngũ chuyên gia của chúng tôi có thể tháo gỡ chúng một cách an toàn và vô cùng đáng tin cậy! Ký ức càng thú vị, bán càng được giá!\n\nThao tác này là không thể đảo ngược, một khi ma trận ý thức đã được trích xuất thì sẽ vĩnh viễn không thể khôi phục."
 clear_thought_clinic_modifier: "$building_clear_thought_clinic$"
 clear_thought_clinic_tt: "Hiệu chỉnh mạng lưới gián điệp không cộng dồn:$TABBED_NEW_LINE$$MOD_SPY_NETWORK_DAILY_VALUE_MULT$: §G+25%§!$TABBED_NEW_LINE$$MOD_SPY_NETWORK_LEVELS_ADD$: §G+10§!"
