 policy_computation_core_allocation: "Tập trung Lõi Tính toán"
 policy_computation_core_allocation_desc: "Các tập đoàn tổng hợp hóa có thể chuyển dịch chu kỳ tính toán từ hệ thống lõi sang các công tác tối ưu hóa cho các ban ngành xã hội giá trị cao với độ trễ bằng không."
