 computation_core_stability_tt: "\n\n$EFFECTS_HEADER$$NEW_LINE$—Mỗi $pop_group_unit$ $pop_cat_civilian_plural$ giúp §Y$bureaucrat_jobs_bonus_workforce_mult$§! tăng §G+0.5%§!"
