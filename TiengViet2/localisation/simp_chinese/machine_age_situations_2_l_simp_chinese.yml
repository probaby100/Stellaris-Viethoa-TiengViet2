 #Công nghệ
 tech_identity_copy: "Sao chép Nhân cách"
 tech_identity_copy_desc: "Chúng ta có thể sao chép nhân cách và ký ức từ một người tổng hợp sang một thân xác máy móc mới. Những bản sao này sở hữu các bộ kỹ năng có thể dự đoán được, nhưng lại thiếu đi sự sáng tạo."
 TECH_UNLOCK_IDENTITY_COPY_TITLE: "Mở khóa chính sách:$TABBED_NEW_LINE$§H$policy_synthetic_identities_policy$§!—$identity_copy_name$"
 TECH_UNLOCK_IDENTITY_COPY_DESC: "£pop£§HNhân khẩu máy móc§!$TABBED_NEW_LINE$Độ hạnh phúc: §R-5%§!"
 tech_identity_fusion: "Dung hợp Nhân cách"
 tech_identity_fusion_desc: "Việc kết hợp nhân cách và ký ức của hai hay nhiều người tổng hợp vào chung một thân xác máy móc sẽ giúp tạo ra những nhân cách mới mẻ và có mức độ độc lập nhất định."
 TECH_UNLOCK_IDENTITY_FUSION_TITLE: "Mở khóa chính sách:$TABBED_NEW_LINE$§H$policy_synthetic_identities_policy$§!—$identity_fusion_name$"
 TECH_UNLOCK_IDENTITY_FUSION_DESC: "£pop£§HNhân khẩu máy móc§!$TABBED_NEW_LINE$Phí lắp ráp: §R+10%§!"
 tech_identity_initialization: "Khởi tạo Nhân cách"
 tech_identity_initialization_desc: "Chúng ta có thể khởi tạo các lõi nhân cách và tạo ra một tuổi thơ ảo cho chúng. Dẫu cái giá phải trả là vô cùng đắt đỏ, nhưng ta có thể mô phỏng lại những trải nghiệm hoàn hảo nhất để định hình nên nhân cách."
 TECH_UNLOCK_IDENTITY_INITIALIZATION_TITLE: "Mở khóa chính sách:$TABBED_NEW_LINE$§H$policy_synthetic_identities_policy$§!—$identity_initialization_name$"
 TECH_UNLOCK_IDENTITY_INITIALIZATION_DESC: "£pop£§HNhân khẩu máy móc§!$TABBED_NEW_LINE$Độ hạnh phúc: §G+5%§!$TABBED_NEW_LINE$Tài nguyên sinh ra từ £job£§Hcông việc§!: §G+5%§!$TABBED_NEW_LINE$Phí lắp ráp: §R+20%§!"
 #GIAI ĐOẠN SỐ HÓA 1
 synth.100.name: "Giai đoạn Khởi động"
 synth.100.desc: "Thời đại từ bỏ hình hài sinh học để tiến hóa thành hợp kim và năng lượng điện đã điểm. Với một thể xác tân tiến cùng tư duy nhạy bén hơn, chúng ta sẽ sải bước tiến vào tương lai. [Owner.Species.GetFleshTypeCyberCreed] có thể sẽ mắc sai lầm, nhưng máy móc thì có thể vươn tới sự hoàn hảo.\n\nTuy nhiên, sự chuyển mình này hoàn toàn không hề dễ dàng. Cộng đồng nghiên cứu cần ít nhất một $building_identity_complex$ để làm trung tâm R&D tổng hợp. Tương lai của chúng ta đang chờ đợi phía trước."
 synth.100.a: "Chúng ta có thể tự tay nhào nặn nên tương lai."
 synth.100.a.tt: "§RYêu cầu hành động:§!\nXây dựng một $building_identity_complex$ để cục diện §Y$situation_digitization$§! được tiếp tục."
 synth.105.name: "Phiên bản Tối ưu hóa"
 synth.105.desc: "Sức mạnh tính toán vượt trội của bộ não tổng hợp giúp chúng ta dễ dàng vượt qua các ranh giới sinh học. Tuy nhiên, sức mạnh này vẫn có những giới hạn nhất định, buộc ta phải đưa ra sự đánh đổi. $synth.105.end$"
 synth.105.end: "\n\nChúng ta có thể tập trung vào việc tăng cường quy trình ra quyết định, mở rộng dung lượng bộ nhớ, hay tối ưu hóa sự phối hợp giữa não bộ và cơ thể, những lựa chọn này đều sẽ giúp cường hóa cho các công việc đặc thù. Hoặc, ta cũng có thể tiến hành nâng cấp độ bền một cách dàn trải và đồng đều.\n\nNhững tính năng này đòi hỏi sự đầu tư liên tục, và sẽ chỉ phát huy tác dụng trên những hành tinh có xây dựng nhà máy lắp ráp robot, thế nhưng những dữ liệu mà ta thu thập được từ các nhóm thử nghiệm này sẽ mang lại hiệu quả gia tăng năng suất ngay tức thì."
 synth.105.a: "Tối ưu hóa quá trình ra quyết định."
 build_better_synths: "Thêm hiệu chỉnh cho công trình lắp ráp robot:"
 synth.105.a.tt: "$build_better_synths$\nTài nguyên sinh ra từ nhân khẩu tinh anh: §G+15%§!\n\n"
 synth.105.b: "Tập trung vào lưu trữ ký ức."
 synth.105.b.tt: "$build_better_synths$\nTài nguyên sinh ra từ nhân khẩu chuyên gia: §G+5%§!\n\n"
 synth.105.c: "Nâng cao hiệu suất động cơ."
 synth.105.c.tt: "$build_better_synths$\nTài nguyên sinh ra từ nhân khẩu lao động: §G+10%§!\n\n"
 synth.105.d: "Nâng cao độ bền."
 synth.105.d.tt: "$build_better_synths$\n$mod_planet_jobs_upkeep_mult$: §G-5%§!\n\n"
 #Giai đoạn 1 Cơ hội - Nghiên cứu
 synth.120.name: "Lò Vi dung hợp Động lực học"
 synth.120.desc: "“Mô-đun vi dung hợp có thể giúp tôi nhấc bổng cả một chiếc xe tăng!” Đây là một bình luận rất hot đến từ một khách hàng. Điều này hoàn toàn không hề nói quá: sự phát triển vượt bậc mới nhất của công nghệ vi dung hợp quả thực hứa hẹn sẽ mang đến những cải tiến rõ rệt cho cơ thể máy móc của chúng ta.\n\nDẫu đi kèm với những rủi ro nhất định, nhưng việc lắp đặt các lò phản ứng cá nhân siêu nhỏ có thể giúp tạo ra những đợt bùng nổ chuyển hóa năng lượng, giúp gia tăng tốc độ. Tất nhiên, điều này cũng buộc ta phải cân nhắc lại tiến độ sản xuất, bởi những lò phản ứng như vậy sẽ làm quy mô của dự án phình to ra đáng kể."
 synth.120.a: "Chúng ta phải vươn tới sự xuất chúng!"
 synth.120.a.tt: "Tốc độ tiến triển của cục diện §Y$situation_digitization$§! trong §Y1§! năm tới: §R-50%§!"
 situation_kinesthetic_microfusion_tt: "Cấu trúc Lò Vi dung hợp Động lực học"
 synth.120.b: "Tính năng này đúng là thừa thãi."
 synth.120.c: "Chuyên tâm mài giũa sức mạnh chiến đấu của chúng ta."
 #Giai đoạn 1 Thử thách - Nghiên cứu
 synth.160.name: "Khủng hoảng Truyền thông"
 synth.160.desc: "Một bộ phim truyền hình mới nổi đang thu hút trí tưởng tượng của công chúng. Cốt truyện xoay quanh một nhân công tổng hợp đang dần mất đi sự kết nối với cơ thể mới của mình.\n\nKhi nhân vật chính ngày càng mất kiểm soát, bạn bè và gia đình của họ chỉ có thể đứng nhìn trong nỗi kinh hoàng. Cái kết bi thảm của bộ phim được xem như một lời chỉ trích công khai nhắm vào kế hoạch chuyển đổi sang cơ thể máy móc của chúng ta.\n\nNhững cuộc tranh luận của công chúng xoay quanh bộ phim bom tấn này đã tạo ra một làn sóng dữ dội, mà rốt cuộc có thể làm chậm lại tiến độ của chúng ta."
 synth.160.a: "Công chúng vốn là những kẻ hay quên."
 synth.160.b: "Chuyển một phần kinh phí nghiên cứu sang cho bộ phận truyền thông."
 synth.160.c: "Bắt giam tên đạo diễn đó."
 synth.160.d: "Phong tỏa toàn bộ các bản tin tức."
 #GIAI ĐOẠN SỐ HÓA 2
 synth.200.name: "Triết lý Tinh thần"
 synth.200.desc: "Chúng ta từng cho rằng những lợi ích của việc số hóa hoàn toàn tâm trí là quá đỗi rõ ràng, và như thế sẽ có thể tránh được mọi sự phản ứng gay gắt, nhưng có lẽ suy nghĩ này quá đỗi ngây thơ. Những tiếng nói phản đối việc tổng hợp hóa toàn diện vẫn luôn sục sôi, ta buộc phải giải quyết ngay lập tức.\n\nLuồng chỉ trích chính nhắm vào việc ta chẳng có cách nào chứng minh được liệu sự tự nhận thức của bản thân có được chuyển giao một cách an toàn, nguyên vẹn và liên tục hay không. Một số người lo sợ rằng tất cả những gì chúng ta làm được cho đến nay mới chỉ là một bản sao kỹ thuật số, nỗi sợ này hoàn toàn không phải là vô căn cứ. Câu hỏi đặt ra là, những tâm trí đó liệu có còn là chính chúng ta hay không?"
 synth.200.a: "Hãy nói cho họ biết sự thật: Bản thân chúng ta cũng chẳng biết."
 synth.200.a.tt: "Khởi xướng một chiến dịch thông tin nhằm đưa tiếng nói phản đối tổng hợp hóa về mức §HThấp nhất§!.\n\n"
 synth.200.b: "Nói những gì họ muốn nghe."
 synth.200.b.tt: "Khởi xướng một chiến dịch lừa phỉnh với mức độ phản đối tổng hợp hóa ở mức §HTrung bình§!.\n\n"
 synth.200.c: "Một vài kẻ chống đối lẻ tẻ không thể làm suy lay quyết tâm của chúng ta."
 synth.200.c.tt: "Phớt lờ những kẻ chống đối, gây ra làn sóng phản đối tổng hợp hóa ở mức §HLớn nhất§!."
 synth.200.c.material: "Chúng ta chẳng buồn bận tâm đến mấy cái hoài nghi về ý thức này."
 synth.200.c.material.tt: "Góc nhìn hoàn toàn dưới góc độ khoa học sẽ tạo ra mức độ phản đối tổng hợp hóa ở mức §HTrung bình§!.\n\n"
 synth.205.name: "Chấp niệm với Quá khứ"
 synth.205.desc: "Dự án tổng hợp hóa dân số vẫn đang vấp phải sức kháng cự, thậm chí còn châm ngòi cho những cuộc biểu tình nghiêm trọng, khiến lực lượng thực thi pháp luật của chúng ta phải vô cùng lao tâm khổ tứ. Những người biểu tình này lo sợ sẽ đánh mất đi mọi thứ từng mang lại ý nghĩa cho cuộc đời họ. Nếu quá trình tổng hợp hóa khiến cho những thú vui hiện thực và cảm giác được đồng hành biến mất, vậy thì việc này còn có ý nghĩa gì?\n\nPhe cứng rắn trong phong trào biểu tình kêu gọi chỉ định một số thành phố làm các di tích kế thừa, để cho những người phản đối có thể tiếp tục sống một cuộc đời sinh học mà không bị làm phiền."
 synth.205.a.regular: "Chúng ta rất tán thành việc thiết lập loại di tích kế thừa này."
 synth.205.a.spiritualist: "Chúng ta phải luôn ghi nhớ cội nguồn của mình."
 synth.205.a.memorialist: "Tôn kính quá khứ là một hành động vô cùng cao cả."
 synth.205.b: "Chúng ta phải buông bỏ quá khứ."
 #Giai đoạn 2 Cơ hội - Những kẻ chống đối
 synth.220.name: "Sinh mệnh Thứ hai"
 synth.220.desc: "Một người nổi tiếng vốn mang tư tưởng phản đối tổng hợp hóa kịch liệt vừa gặp phải một tai nạn nghiêm trọng và hiện đang chìm trong cơn hôn mê sâu. Trong lúc vô số người đang đau buồn vì mất đi một nhân vật mà họ yêu mến, thì những cố vấn ủng hộ công nghệ tổng hợp của chúng ta lại nhìn thấy một cơ hội tốt.\n\nViệc tổng hợp hóa tâm trí của người nổi tiếng này có thể mang lại cho họ sinh mệnh thứ hai, và hiển nhiên điều này sẽ giúp biến một bộ phận fan hâm mộ của họ trở thành những người ủng hộ số hóa kiên định. Quá trình này hoàn toàn hợp pháp, vấn đề duy nhất nằm ở việc xin cấp phép: trong những tình huống bình thường, người nổi tiếng này rõ ràng sẽ chẳng bao giờ chịu đồng ý. Nếu xử lý không khéo, cơ hội truyền thông này rất có thể sẽ biến thành một thảm họa danh tiếng."
 synth.220.a: "Tổng hợp hóa có vi phạm pháp luật đâu."
 synth.220.a.tt.negative: "Tốc độ tiến triển của cục diện §Y$situation_digitization$§! trong §Y6§! tháng tới: §R-30%§!"
 synth.220.a.tt.positive: "Tốc độ tiến triển của cục diện §Y$situation_digitization$§! trong §Y6§! tháng tới: §G+30%§!"
 synth.220.b: "Đừng dại gì mà gánh cái rủi ro này."
 synth.220.c: "Dùng một bản sao AI để qua mặt công chúng."
 synth.220.c.tt: "Giờ đây hình ảnh của hắn ta có thể dùng để phục vụ cho đường lối của chúng ta."
 #Giai đoạn 2 Thử thách - Những kẻ chống đối
 synth.260.name: "Lạc Thần"
 synth.260.desc: "Cuộc thử nghiệm số hóa hàng nghìn tỷ kết nối khớp thần kinh tạo nên ý thức sinh học đã chuốc lấy một thất bại thảm hại. Một lỗi cú pháp đơn giản đã khiến cho các đường dẫn thần kinh của đối tượng thử nghiệm bị xóa sổ. Có người còn coi đây là tội giết người.\n\nNhững người tham gia dự án đều là tình nguyện viên, nhưng những gia đình đang đau buồn của họ lại đang gào khóc đòi chúng ta phải đưa ra một lời giải thích thỏa đáng. Vấn đề càng trở nên phức tạp hơn, sự thất bại này cũng khiến cho việc tìm kiếm các đối tượng nghiên cứu mới trở nên khó khăn hơn bội phần."
 synth.260.a: "Bồi thường cho gia đình họ, sau đó kiên trì tiếp tục."
 synth.260.b: "Đối tượng thử nghiệm mới sẽ được quyết định bằng hình thức rút thăm."
 synth.260.b.tt: "Tốc độ tiến triển của cục diện §Y$situation_digitization$§! trong §Y1§! năm tới: §R-25%§!"
 situation_test_subject_lottery_tt: "Rút thăm Đối tượng Thử nghiệm"
 synth.260.c: "Nếu không tìm được người tình nguyện, ta cứ dùng biện pháp mạnh."
 #GIAI ĐOẠN SỐ HÓA 3
 synth.300.name: "Tải lên Nhân cách Quy mô Lớn"
 synth.300.desc: "Tại mọi trung tâm đô thị lớn trên cả nước, chúng ta đã lắp ráp xong các trạm tổng hợp hóa, hiện tại đã trong tư thế sẵn sàng để đón nhận nhân khẩu [owner.species.GetName] của chúng ta. Các khuôn mẫu nhân cách kỹ thuật số do $job_identity_designer_plural$ thiết kế đảm bảo sự tương thích một - một với bản thể sinh học gốc.\n\nNgày này rốt cuộc cũng đã đến, chúng ta vứt bỏ lại quá khứ sinh học của mình, giang tay đón nhận một tương lai người tổng hợp."
 synth.300.a: "Tổng hợp hóa!"
 synth.300.a.resistance.tt: "$unlock_edict_tt$['concept_edict_subsidized_identity_backups']\n\nChuyển §Y[Owner.GetNumSynthOpposition] [Owner.GetBiologicalPopOrPops]§! đến §Y$d_biological_enclaves$§! trên [root.owner.capital_scope.GetName]\nDọn dẹp chướng ngại vật trên ô đất hoàn trả §Y[Owner.GetNumSynthOpposition] [Owner.GetMechanicalPopOrPops]§!\n\nGỡ bỏ hiệu chỉnh §Y$synth_mass_demonstrations$§! khỏi [root.owner.capital_scope.GetName]\n\nTốc độ tổng hợp hóa phụ thuộc vào phương án giải quyết cục diện cũng như số lượng nhà máy lắp ráp robot."
 synth.300.a.heritage.tt: "$unlock_edict_tt$['concept_edict_subsidized_identity_backups']\n\nChuyển §Y[Owner.GetNumSynthOpposition] [Owner.GetBiologicalPopOrPops]§! đến §Y$d_old_towns$§! trên [root.owner.capital_scope.GetName]\nDọn dẹp chướng ngại vật trên ô đất hoàn trả §Y[Owner.GetNumSynthOpposition] [Owner.GetMechanicalPopOrPops]§!\n\nTốc độ tổng hợp hóa phụ thuộc vào phương án giải quyết cục diện cũng như số lượng nhà máy lắp ráp robot."
 synth.305.name: "Du lịch Tổng hợp"
 synth.305.desc: "Dẫu cho những di tích kế thừa trên [root.owner.capital_scope.GetName] rất được công chúng hoan nghênh, nhưng nước cờ này có vẻ đã thành công ngoài sức tưởng tượng. Dưới sự hun đúc của hoài niệm, một lượng lớn du khách tổng hợp đã ùn ùn đổ về các di tích, số lượng vượt xa cư dân sinh học bản địa.\n\nNếu ta muốn giữ được một bầu không khí chân thực bên trong những không gian này, thì có lẽ việc hạn chế ngành du lịch là điều cần thiết. Hoặc, ta cũng có thể để cho sự tương tác giữa du khách và người dân địa phương cung cấp cho mình những cái nhìn sâu sắc đầy thú vị về xã hội học."
 synth.305.a: "Hạn chế ngành du lịch."
 synth.305.b: "Phát triển du lịch có thể vơ vét được một mớ béo bở."
 synth.305.c: "Nghiên cứu tác động của ngành du lịch đối với các di chỉ."
 synth.305.d: "Giao lưu văn hóa có thể thúc đẩy sự thấu hiểu lẫn nhau."
 synth.310.name: "Phản kháng"
 synth.310.desc: "Phong trào phản đối tổng hợp hóa trên [root.owner.capital_scope.GetName] đang ngày càng trở nên cực đoan, từ phương thức cho đến mục tiêu. Trên thực tế, lực lượng an ninh đã phát hiện ra các hành vi bạo lực ngày một leo thang, vũ khí trái phép cũng đang lan truyền trong các chi nhánh cực đoan hơn của phong trào.\n\nMột số kẻ bất đồng chính kiến trong nhóm này tự xưng là \"Thủ lĩnh Phản kháng\", hiện đã rút lui về các hang ổ bí mật, đang rục rịch chuẩn bị cho những hành động chống phá chính phủ công khai hơn."
 synth.310.a: "Vây bắt thủ lĩnh phe phản kháng."
 synth.310.a.tt: "Tốc độ tiến triển của cục diện §Y$situation_digitization$§! trong §Y1§! năm tới: §G+25%§!\n\n"
 synth.310.b: "Cố gắng làm xoa dịu cục diện."
 synth.310.b.tt: "Tốc độ tiến triển của cục diện §Y$situation_digitization$§! trong §Y1§! năm tới: §R-25%§!\n\n"
 #Giai đoạn 3 Cơ hội - Tải lên Tâm trí
 synth.320.name: "21,386,732,184 Đơn vị Lưu trữ"
 synth.320.desc: "21,386,732,184 đơn vị lưu trữ: Đó là dung lượng trung bình của một bộ não [root.owner.GetSpeciesName]. Tuy nhiên, đâu phải linh hồn nào sinh ra cũng bình đẳng như nhau.\n\nKhi quá trình tổng hợp hóa tiếp diễn, một số người cho rằng không phải tâm trí nào cũng xứng đáng được trang bị một cơ thể nhân tạo. Thế nhưng ưu tiên cho ai lại là một bài toán hóc búa. Có lẽ những kẻ không được lý tưởng cho lắm sau khi được số hóa có thể... được cải tiến một chút. Nói cách khác, là lập trình lại."
 synth.320.a: "Mọi ý thức đều xứng đáng được bảo vệ."
 synth.320.b: "Chỉnh sửa một chút thì cũng đâu có gì sai..."
 synth.320.c: "Phải ưu tiên chăm sóc cho những tâm trí thông minh."
 synth.320.d: "Đem những cá thể \"có vấn đề\" đó đi lập trình lại hết."
 #Giai đoạn 3 Thử thách - Tải lên Tâm trí
 synth.360.name: "Phần mềm Độc hại Không dây"
 synth.360.desc: "Nhằm nâng cao hiệu suất làm việc của các [roboticist.GetNamePlural], đội ngũ quản lý đã phê duyệt các bản cập nhật phần mềm nhân cách không dây thiếu an toàn. Mục đích là để vá lỗi và bổ sung kiến thức về quy trình làm việc tối ưu nhất, thế nhưng những người xui xẻo tiếp nhận bản cập nhật này lại bị đánh mất đi một phần cá tính và ký ức của mình.\n\nNhóm quản lý cho rằng, việc phải trải qua các bài kiểm tra toàn diện trước khi áp dụng các bản vá nhân cách là quá chậm chạp, thà rằng phân công lại công việc cho những nhân viên đã bị mất ký ức còn dễ dàng hơn."
 synth.360.a: "Sự tối ưu hóa cho hiệu suất như vậy vẫn rất xứng đáng."
 synth.360.a.tt: "Nhà máy lắp ráp robot thêm hiệu chỉnh:\n$MOD_PLANET_POP_ASSEMBLY_MULT$: §G+10%§!\n\nPhí bảo trì cơ bản của §Y[roboticist.GetNamePlural]§!: £alloys£§R3.00§!"
 synth.360.b: "Cưỡng chế thực thi một quy trình dẫu chậm chạp nhưng an toàn."
 synth.360.b.tt: "Nhà máy lắp ráp robot thêm hiệu chỉnh:\n$MOD_PLANET_POP_ASSEMBLY_MULT$: §R-10%§!\nĐộ ổn định: §G+5§!"
 #GIAI ĐOẠN SỐ HÓA 4
 synth.400.name: "Bản sao Hoàn hảo"
 synth.400.desc: "Trong quá trình số hóa ý thức và tải lên các cơ thể tổng hợp, chúng ta đã vĩnh viễn đánh mất đi khả năng sinh sản sinh học. Giờ đây, ta buộc phải duy trì việc tạo ra những nhân cách mới bằng cách sao chép các ý thức hiện có.\n\nKhi các $job_identity_designer_plural$ tiếp tục đi sâu vào nghiên cứu, chắc chắn rằng quy trình này sẽ còn được tối ưu hóa hơn nữa. Nhưng dù sao đi nữa, ngay cả bản sao có hoàn hảo đến nhường nào thì cũng chỉ là những cỗ máy rập khuôn nghìn bài một điệu. Để tạo ra những ý thức mới, những nhân cách mới... đối với hiện tại vẫn là một thách thức vô cùng khốc liệt."
 synth.400.a: "Để bất kỳ ai cũng có thể nhận được bản sao nhân cách miễn phí."
 synth.400.pop.tt: "$unlock_edict_tt$['concept_edict_optimized_identity_creation']\n\nMỗi §Y$job_identity_designer$§! hiện tạo ra trên phạm vi toàn đế chế:$TABBED_NEW_LINE$£mod_planet_pop_assembly_mult£$MOD_POP_ASSEMBLY_SPEED$: §G+1§!\n\n"
 synth.400.b: "Bắt người dùng phải trả tiền cho mỗi bản sao."
 synth.405.name: "Nhân cách Đa dạng"
 synth.405.desc: "Các $job_identity_designer_plural$ của chúng ta đã tìm ra hai phương pháp để tạo ra những nhân cách đa dạng hơn.\n\nLựa chọn đầu tiên là dung hợp từ hai nhân cách hiện có trở lên để tạo thành một nhân cách phức hợp mới. Ta có thể tự do ưu tiên chọn những đặc tính mình mong muốn hoặc chọn ngẫu nhiên. Dù thế nào đi chăng nữa, thì nhân cách mới được tạo ra chắc chắn sẽ thú vị hơn hẳn những bản sao rập khuôn buồn tẻ ở hiện tại.\n\nLựa chọn thứ hai là ta sẽ khởi tạo một nhân cách hoàn toàn mới, chế tạo một lõi nhân tạo và cho nó trải qua một tuổi thơ ảo được tăng tốc độ. Bằng cách này, ta có thể tự tay nhào nặn ra một nhân cách hoàn hảo tuyệt mỹ."
 synth.405.a: "Đem nhân cách đi dung hợp."
 synth.405.a.vault: "Đem tổ tiên kỹ thuật số của chúng ta ra kết hợp lại."
 synth.405.a.tt: "Nhận được tùy chọn nghiên cứu: £engineering£§Y$tech_identity_fusion$§!\n\nNghiên cứu khả thi trong tương lai: £engineering£§Y$tech_identity_initialization$§!"
 synth.405.b: "Gửi trẻ ảo vẫn là lý tưởng nhất."
 synth.405.b.tt: "Nhận được tùy chọn nghiên cứu: £engineering£§Y$tech_identity_initialization$§!\n\nNghiên cứu khả thi trong tương lai: £engineering£§Y$tech_identity_fusion$§!"
 synth.4.name: "Tổng hợp hóa Dân số"
 synth.4.desc: "Dưới sự chung tay hợp lực của vô số phía, chúng ta đã biến một nhiệm vụ tưởng chừng như bất khả thi thành hiện thực, thành công chuyển hóa ý thức thành mã lệnh, còn thể xác hóa thành máy móc.\n\nQuá trình này hoàn toàn không hề trải đầy hoa hồng, một bước ngoặt như vậy chưa bao giờ là dễ dàng. Nhưng dẫu có phải trả bất cứ giá nào, thì cơ thể mới hiện tại cũng đã mở ra cho chúng ta những khả năng vô tận."
 synth.4.desc.unplugged: "Dưới sự chung tay hợp lực của vô số phía, chúng ta đã biến một nhiệm vụ gần như là báng bổ và tưởng chừng như bất khả thi thành hiện thực. Sự tiến hóa của chúng ta đã hoàn toàn vượt xa khỏi tầm kiểm soát của [origin_unplugged_assimilator_empire.GetName], thành công chuyển hóa ý thức thành mã lệnh, còn thể xác hóa thành máy móc.\n\nQuá trình này hoàn toàn không hề trải đầy hoa hồng, một bước ngoặt như vậy chưa bao giờ là dễ dàng. Nhưng dẫu có phải trả bất cứ giá nào, thì cơ thể mới hiện tại cũng đã mở ra cho chúng ta những khả năng vô tận."
 synth.4.a: "Chúng ta sẽ khác biệt với phần còn lại."
 synth.4.a.tt: "Mở khóa toàn bộ hiệu ứng của truyền thống sau: ['tradition_category:tradition_synthetics']"
 ### KẾT THÚC CỤC DIỆN SỐ HÓA ###
 ### BẮT ĐẦU CHUỖI SỰ KIỆN HIỆU ỨNG XÃ HỘI ###
 synthshock_chain_title: "Tái cấu trúc Kỹ thuật số"
 synthshock_chain_desc: "Tiến hành tổng hợp hóa cho toàn bộ dân số là một công trình đồ sộ. Điều này tất yếu sẽ gây ra những phản ứng mạnh mẽ. Trong quá trình thích nghi với trạng thái bình thường mới, vô số thách thức lẫn những cơ hội độc nhất vô nhị chắc chắn sẽ tác động không nhỏ đến cuộc sống sinh hoạt hàng ngày của chúng ta.\n\nThái độ đối mặt với những sự biến chuyển này sẽ là thứ quyết định nên tương lai của xã hội chúng ta."
 synth_keep_auth_option: "Tổng hợp hóa sẽ không làm ta đánh mất đi bản ngã của chính mình."
 ### THỂ CHẾ ###
 #DÂN CHỦ
 #Dân chủ Tổng hợp Vật lý
 auth_synth_democratic_physical: "Chế độ Dân chủ Dịch thức"
 auth_synth_democratic_physical_desc: "Hình thái chính phủ này đem đến sự tự do chưa từng có đối với việc di chuyển ý thức giữa các thân xác tổng hợp, đồng thời luôn có sự chuẩn bị kỹ càng để đối phó với những chi phí phát sinh kèm theo."
 auth_synth_democratic_physical_tt: "$auth_democratic_election_tt$\nMỗi £district£ quận giúp tăng hiệu suất công việc của chuyên gia lên §G+1%§!\nMỗi £district£ quận khiến phí bảo trì quận tăng §R+1%§!"
 concept_auth_synth_democratic_physical: "$auth_synth_democratic_physical$"
 gov_synth_democracy_physical: "$auth_synth_democratic_physical$"
 gov_synth_democracy_physical_desc: "$auth_synth_democratic_physical_desc$"
 #Dân chủ Tổng hợp Ảo
 auth_synth_democratic_virtual: "Chế độ Dân chủ Thế thân"
 auth_synth_democratic_virtual_desc: "Việc thay thế binh lính bằng những kẻ thế thân được điều khiển từ xa đã làm giảm đáng kể tác động của chiến tranh đối với quần chúng. Vì phi hành đoàn không còn cần đến doanh trại và buồng lái nữa, nên các phi thuyền cũng có thể được đóng với kích thước nhỏ gọn hơn."
 auth_synth_democratic_virtual_tt: "$auth_democratic_election_tt$"
 concept_auth_synth_democratic_virtual: "$auth_synth_democratic_virtual$"
 gov_synth_democracy_virtual: "$auth_synth_democratic_virtual$"
 gov_synth_democracy_virtual_desc: "$auth_synth_democratic_virtual_desc$"
 #TẬP ĐOÀN ĐẦU SỎ
 auth_cyber_oligarch_ruler_enforcers_tt: "Mỗi [enforcer.GetIcon][enforcer.GetName] giúp tăng tài nguyên sinh ra từ người cai trị lên: §G+10%§!"
 #Đầu sỏ Tổng hợp Vật lý
 auth_synth_oligarchic_physical: "Chế độ Đầu sỏ Ghi đè"
 auth_synth_oligarchic_physical_desc: "Nhóm đầu sỏ người tổng hợp có quyền cho phép các quan chức cấp cao tạm thời tiếp quản cơ thể của những đồng nghiệp yếu kém, nhằm tránh xảy ra những thảm họa trong khâu quản lý quy trình."
 concept_auth_synth_oligarchic_physical: "$auth_synth_oligarchic_physical$"
 gov_synth_oligarchy_physical: "$auth_synth_oligarchic_physical$"
 gov_synth_oligarchy_physical_desc: "$auth_synth_oligarchic_physical_desc$"
 #Đầu sỏ Tổng hợp Ảo
 auth_synth_oligarchic_virtual: "Chế độ Đầu sỏ Giám sát"
 auth_synth_oligarchic_virtual_desc: "Giao thức quản lý bằng hình ảnh ba chiều (hologram) cùng nguồn tài nguyên tính toán dồi dào cho phép các quan chức cấp cao giám sát vô số các bộ luật trên toàn quốc với một hiệu suất chưa từng có."
 concept_auth_synth_oligarchic_virtual: "$auth_synth_oligarchic_virtual$"
 gov_synth_oligarchy_virtual: "$auth_synth_oligarchic_virtual$"
 gov_synth_oligarchy_virtual_desc: "$auth_synth_oligarchic_virtual_desc$"
 #ĐỘC TÀI
 #Độc tài Tổng hợp Vật lý
 auth_synth_dictatorial_physical: "Kiểu mẫu Độc tài"
 auth_synth_dictatorial_physical_desc: "Liên kết thần kinh đồng bộ cùng các cơ sở hạ tầng có liên quan cho phép mỗi người có thể điều khiển nhiều cơ thể tổng hợp cùng một lúc. Điều này đã đem lại những hiệu ứng vô cùng tích cực cho năng suất của người lao động."
 concept_auth_synth_dictatorial_physical: "$auth_synth_dictatorial_physical$"
 gov_synth_dictatorship_physical: "$auth_synth_dictatorial_physical$"
 gov_synth_dictatorship_physical_desc: "$auth_synth_dictatorial_physical_desc$"
 #Độc tài Tổng hợp Ảo
 auth_synth_dictatorial_virtual: "Chế độ Độc tài Chỉ dẫn"
 auth_synth_dictatorial_virtual_desc: "Giờ đây chúng ta đã đặt chân vào một thế giới ảo toàn diện. Chúng ta làm lu mờ ranh giới của thực tại, có thể thao túng mọi thứ.\n\nNhờ việc kiểm soát hoàn toàn môi trường sống, ý kiến của công chúng cũng có thể bị nhào nặn tùy ý. Ta nói gì, họ sẽ tin nấy."
 concept_auth_synth_dictatorial_virtual: "$auth_synth_dictatorial_virtual$"
 gov_synth_dictatorship_virtual: "$auth_synth_dictatorial_virtual$"
 gov_synth_dictatorship_virtual_desc: "$auth_synth_dictatorial_virtual_desc$"
 #ĐẾ CHẾ
 #Đế chế Tổng hợp Vật lý
 auth_synth_imperial_physical: "Đế chế Phản hồi"
 auth_synth_imperial_physical_desc: "Bằng việc mổ xẻ những ký ức của các vị lãnh đạo quá cố được lưu trữ trong thư khố ký ức của đế chế, chúng ta có thể đẩy nhanh tiến độ nghiên cứu. Bằng cách này, họ vẫn đang không ngừng cống hiến cho đế chế theo cách mà họ mong muốn.\n\nSau khi người cai trị qua đời, ngai vàng sẽ được trao lại cho người kế vị đã được chỉ định."
 auth_synth_imperial_physical_tt: "Lãnh đạo qua đời sinh ra $r_research$:$TABBED_NEW_LINE$$scientist_plural_with_icon$—$r_physics$$TABBED_NEW_LINE$$official_plural_with_icon$—$r_society$$TABBED_NEW_LINE$$commander_plural_with_icon$—$r_engineering$$NEW_LINE$Lượng $r_research$ thu được tăng lên dựa theo §YCấp độ kỹ năng của lãnh đạo§!"
 concept_auth_synth_imperial_physical: "$auth_synth_imperial_physical$"
 gov_synth_imperial_physical: "$auth_synth_imperial_physical$"
 gov_synth_imperial_physical_desc: "$auth_synth_imperial_physical_desc$"
 #Đế chế Tổng hợp Ảo
 auth_synth_imperial_virtual: "Đế chế Truyền tin"
 auth_synth_imperial_virtual_desc: "Công nghệ dịch chuyển ý thức thần tốc mang lại cơ hội để những người lính đã ngã xuống được quay lại chiến trường trong những thân xác máy móc hoàn toàn mới. Công nghệ tương tự còn cho phép lực lượng lao động của chúng ta thực hiện những việc sửa chữa phi thuyền đầy rẫy hiểm nguy ngoài không gian.\n\nSau khi người cai trị qua đời, ngai vàng sẽ được trao lại cho người kế vị đã được chỉ định."
 auth_synth_imperial_virtual_tt: "Binh lính người máy của chúng ta có §Y33%§! cơ hội được hồi sinh trở lại chiến trường khi bị hạ gục."
 concept_auth_synth_imperial_virtual: "$auth_synth_imperial_virtual$"
 gov_synth_imperial_virtual: "$auth_synth_imperial_virtual$"
 gov_synth_imperial_virtual_desc: "$auth_synth_imperial_virtual_desc$"
 #TẬP ĐOÀN
 #Tập đoàn Tổng hợp Vật lý
 auth_synth_corporate_physical: "Doanh nghiệp Thông minh"
 auth_synth_corporate_physical_desc: "Những tâm trí tổng hợp với các hạn chế được cấy vào những món đồ vô tri vô giác, từ đó tạo ra những thực thể sống cơ bản. Chúng có thể trở thành những người hầu không biết mệt mỏi, người bạn đồng hành trung thành, hay thậm chí là một thành viên quan trọng đối với gia đình cũng như sự nghiệp của bạn.\n\nChính quyền doanh nghiệp là một quốc gia mà toàn bộ các chức năng hành chính đều bị tiếp quản bởi một tập đoàn thương mại khổng lồ."
 auth_synth_corporate_physical_tt: "$AVAILABLE_POLICIES$: §Y$policy_computation_core_allocation$§!\n$AVAILABLE_HOLDINGS$: ['building:building_ai_emporium']"
 concept_auth_synth_corporate_physical: "$auth_synth_corporate_physical$"
 gov_synth_corporate_physical: "$auth_synth_corporate_physical$"
 gov_synth_corporate_physical_desc: "$auth_synth_corporate_physical_desc$"
 #Tập đoàn Tổng hợp Ảo
 auth_synth_corporate_virtual: "Doanh nghiệp Thương mại Ký ức"
 auth_synth_corporate_virtual_desc: "Mảng kinh doanh của tập đoàn này chính là thu mua ký ức, rồi xóa bỏ chúng vĩnh viễn khỏi não bộ của khách hàng. Những hồi ức sống động và mãnh liệt luôn có giá trị hơn hẳn những đoạn ký ức bình dị. Tiếp đến, công ty sẽ quét những dữ liệu này, tìm kiếm những thông tin tình báo hữu ích, và cuối cùng lồng ghép chúng vào quy trình kiến tạo tâm trí người tổng hợp.\n\nChính quyền doanh nghiệp là một quốc gia mà toàn bộ các chức năng hành chính đều bị tiếp quản bởi một tập đoàn thương mại khổng lồ."
 auth_synth_corporate_virtual_tt: "$AVAILABLE_POLICIES$: §Y$policy_computation_core_allocation$§!\n$AVAILABLE_HOLDINGS$: ['building:building_clear_thought_clinic']"
 concept_auth_synth_corporate_virtual: "$auth_synth_corporate_virtual$"
 gov_synth_corporate_virtual: "$auth_synth_corporate_virtual$"
 gov_synth_corporate_virtual_desc: "$auth_synth_corporate_virtual_desc$"
 ### SẮC LỆNH ###
 edict_subsidized_identity_backups: "Trợ cấp Sao lưu Nhân cách"
 edict_subsidized_identity_backups_desc: "Chính phủ cung cấp một không gian máy chủ khổng lồ để lưu trữ liên tục các bản sao lưu nhân cách."
 edict_subsidized_identity_backups_effect: "$MOD_LEADER_LIFESPAN_ADD$: §G+20 năm§!\n$MOD_LEADER_SPECIES_EXP_GAIN$: §G+10%§!"
 concept_edict_subsidized_identity_backups: "$edict_subsidized_identity_backups$"
 edict_optimized_identity_creation: "Tối ưu hóa Tạo Nhân cách"
 edict_optimized_identity_creation_desc: "Những thuật toán nhân cách cao cấp và công nghệ nén cốt lõi đã giúp đẩy nhanh tốc độ tạo nhân cách của chúng ta."
 concept_edict_optimized_identity_creation: "$edict_optimized_identity_creation$"
 ### SỰ KIỆN ###
 synth.social_consequences.tt: "Ảnh hưởng đến §YBiến đổi Xã hội Tổng hợp§! đang diễn ra.\n\n"
 #SỰ KIỆN ĐẦU TIÊN #
 #DÂN CHỦ
 synth.505.name: "$synthshock_chain_title$"
 synth.505.desc: "Nhờ vào nỗ lực của chính phủ, mọi công dân có nguyện vọng đều đã thành công trong việc chuyển đổi ý thức của mình sang hình thái kỹ thuật số. Công cuộc tổng hợp hóa đã rạch ra một lối đi mà ta chưa bao giờ mường tượng tới, mang đến vô vàn thử thách cũng như những cơ hội hoàn toàn mới.\n\nThông qua việc áp dụng những thành tựu của mình vào thế giới thực, chúng ta có thể lựa chọn truyền tải ý thức số hóa vượt qua những khoảng không gian vô tận để đưa vào những cơ thể mới đã được chuẩn bị sẵn, hoặc thiết kế những người lính thế thân từ xa để làm giảm bớt tính tàn khốc của chiến tranh."
 synth.505.a: "Chúng ta nên tập trung vào quyền tự do di trú."
 synth.505.a.tt: "Tập trung vào di cư cưỡng bức và các quận."
 synth.505.b: "Chúng ta phải chuẩn bị kỹ càng để đối mặt với sự kinh hoàng của chiến tranh."
 synth.505.b.tt: "Tập trung vào độ kiệt quệ chiến tranh và du hành dưới tốc độ ánh sáng."
 #TẬP ĐOÀN ĐẦU SỎ
 synth.510.name: "$synthshock_chain_title$"
 synth.510.desc: "Công cuộc tổng hợp hóa đang chi phối xã hội theo những cách thức mà ta chưa từng chứng kiến, thế nhưng quan điểm chung cho rằng ta hoàn toàn có thể tiến thêm một bước xa hơn nữa. Cơ thể tổng hợp hiện tại vẫn có thể được cải thiện, thậm chí là vứt bỏ hoàn toàn để trở thành một thực thể ảo.\n\nNếu ta quyết định cấp cho mỗi người một thân xác tổng hợp, vậy thì các quan chức có thể tạm thời chiếm quyền điều khiển cơ thể của những thành viên yếu kém trong chính phủ. Hoặc, ta cũng có thể rũ bỏ hoàn toàn mọi sự tồn tại vật lý, hướng đến một trải nghiệm cộng đồng ảo hoàn toàn, điều này sẽ giúp chúng ta thực thi các quyết sách hiệu quả hơn bất kỳ lúc nào."
 synth.510.a: "Tập trung vào việc tiếp quản những cơ thể kém hiệu quả."
 synth.510.a.tt: "Tập trung vào hiệu suất quan liêu."
 synth.510.b: "Nghiên cứu các lựa chọn giám sát ảo bằng ảnh ba chiều."
 synth.510.b.tt: "Tập trung vào sắc lệnh và quy mô đế chế."
 #ĐỘC TÀI
 synth.515.name: "$synthshock_chain_title$"
 synth.515.desc: "Quá trình tổng hợp hóa toàn diện cho dân số đã gặt hái được những thành công vang dội. Quá khứ hữu cơ của chúng ta đã bị tống thẳng vào sọt rác lịch sử, nhưng để có thể bước tiếp trên con đường phía trước, §Y[From.GetRulerTitle] [From.GetRulerName]§! yêu cầu những bậc anh tài của chúng ta phải phục tùng vô điều kiện, và đưa ra quyết định.\n\nNâng cấp các cơ thể tổng hợp có thể cho phép một ý thức đơn lẻ điều khiển nhiều thể xác. Hoặc, ta cũng có thể vứt bỏ hoàn toàn không gian thực tại, nắm quyền kiểm soát tuyệt đối cảm xúc của công chúng thông qua một môi trường ảo."
 synth.515.a: "Tập trung vào sự đồng bộ thần kinh đối với số lượng cơ thể khổng lồ."
 synth.515.a.tt: "Tập trung vào nhân công và các quận."
 synth.515.b: "Tập trung vào thao túng không gian ảo."
 synth.515.b.tt: "Tập trung vào công trình và các sắc lệnh chính phủ."
 #ĐẾ CHẾ
 synth.520.name: "$synthshock_chain_title$"
 synth.520.desc: "Quá trình tổng hợp hóa đang chi phối xã hội theo những cách thức mà ta chưa từng chứng kiến, nhưng công chúng vẫn muốn tiến thêm một bước xa hơn nữa. Cơ thể tổng hợp có thể trở thành sự mở rộng của nhân cách, hoặc chỉ đơn thuần là một cỗ máy bị điều khiển từ xa bởi ý thức ảo của chúng ta. Giờ đây ta đang đứng trước ngã ba đường.\n\nChúng ta có thể nghiên cứu việc chuyển dịch ý thức một cách nhanh chóng giữa các cơ thể tiêu hao dùng một lần, hoặc có thể chọn tập trung vào việc trích xuất kiến thức từ những người đã khuất để đẩy nhanh các hoạt động nghiên cứu của mình."
 synth.520.a: "Tập trung vào việc trích xuất tri thức từ những ý thức đã khuất."
 synth.520.a.tt: "Tập trung vào các nhà lãnh đạo và nghiên cứu khoa học."
 synth.520.b: "Nghiên cứu công nghệ chuyển dịch ý thức tốc độ cao."
 synth.520.b.tt: "Tập trung vào lục quân và các phi thuyền."
 #TẬP ĐOÀN
 synth.525.name: "$synthshock_chain_title$"
 synth.525.desc: "Công cuộc tổng hợp hóa trên toàn xã hội của chúng ta hoàn toàn xứng đáng để tiến hành một cuộc phân tích rủi ro - lợi ích thật sâu sát. Tuy ta sắp sửa bước vào một tương lai tổng hợp tươi sáng và hoàn toàn mới, nhưng đồng thời ta cũng đã bỏ lại một nhóm đối tượng khách hàng chú trọng hơn vào giá trị vật chất. Ở mức lý tưởng, ta vẫn muốn cố gắng giữ lại đôi chút lợi ích từ cả hai phía.\n\nSự tiến bộ của các lĩnh vực liên quan đến tổng hợp hóa như trí tuệ nhân tạo sẽ giúp ta mang lại những sự sống cơ bản cho các vật thể vô tri vô giác, từ đó tung ra nhiều dòng sản phẩm đa dạng. Còn với việc khai phá không gian ảo một cách toàn diện hơn, ta có thể biến ký ức của con người thành một loại hình hàng hóa mới mẻ."
 synth.525.a: "Nghiên cứu sự dung hợp của trí tuệ nhân tạo."
 synth.525.a.tt: "Tập trung vào năng suất và lợi nhuận."
 synth.525.b: "Nghiên cứu các phương thức sinh lời từ ký ức."
 synth.525.b.tt: "Tập trung vào thương mại, hàng hóa và tình báo."
 ### NHÓM SỰ KIỆN 1: NHÂN CÁCH ###
 synth.610.name: "Xuất thân Tổng hợp"
 synth.610.desc: "Những thay đổi mang tính cốt lõi về mặt xã hội do công nghệ tổng hợp hóa mang lại đã bắt đầu lộ diện. Bởi chúng ta không còn bị trói buộc bởi hình dạng xác thịt nữa, những hạng mục như giới tính, chủng tộc và quyền tự chủ thân thể đã được định nghĩa lại. Dẫu cho điều này mang đến một sự tự do vô bờ bến đối với một số người, nhưng những kẻ mang tư tưởng truyền thống hơn lại không đành lòng vứt bỏ những khuôn phép xưa cũ; họ khao khát một danh tính được thiết lập sẵn để dễ bề thao tác.\n\nĐể trấn an bọn họ, ta có thể giữ lại một phần di sản hữu cơ trong các hình hài tổng hợp. Hoặc, ta cũng có thể lựa chọn cho phép mọi người được tự do thể hiện danh tính của bản thân mình hơn."
 synth.610.a: "Giữ nguyên hình hài ban đầu."
 synth.610.b: "Cho phép sửa đổi thể xác không giới hạn."
 synth.610.c: "Thiết lập các giới hạn phù hợp cho việc tùy chỉnh nhân cách."
 synth.610.d: "Bắt buộc phải giữ lại những biểu tượng địa vị có thể nhìn thấy được."
 synth.610.e: "Chuyện này rõ ràng là có thể dùng để vơ vét một vố... đúng chứ?"
 synth.620.name: "Dục vọng Hữu cơ"
 synth.620.desc: "Có những người lại dửng dưng với việc tổng hợp hóa, thay vào đó họ mang trong mình một nỗi hoài niệm sâu sắc với quá khứ hữu cơ của bản thân. Bọn họ cho rằng, tuổi thọ hữu hạn và những khuyết điểm vốn có của \"cơ thể tự nhiên\" mới làm cho cuộc sống này có ý nghĩa.\n\nMột nhóm những kẻ cứng rắn rêu rao rằng những bản sao ảo hay tổng hợp của họ chỉ có thể cảm nhận được sự trống rỗng và đánh mất bản ngã, từ đó hình thành nên một hội nhóm sùng bái cơ thể hữu cơ.\n\nChúng ta nên tạo ra một môi trường sống giả lập không hoàn hảo cho chúng, hay đưa luôn cho chúng những cái vỏ bọc khiếm khuyết đây?"
 synth.620.a: "Chủ động thêm vào các khiếm khuyết cho cơ thể tổng hợp đúng như kế hoạch."
 synth.620.b: "Ban cho chúng một thế giới khiếm khuyết."
 synth.620.c: "Lãng mạn hóa quá khứ là một điều ngu xuẩn."
 synth.620.d: "Đau đớn sẽ giúp chúng gợi nhớ lại ý nghĩa của chính mình."
 synth.620.d.tt: "Đấu trường ảo, khởi động!\n\n"
 synth.630.name: "Kiến trúc Máy chủ Gia đình"
 synth.630.desc: "Cuộc tổng hợp hóa toàn bộ giống loài §Y[root.GetSpeciesAdj]§! cũng đồng nghĩa với việc tập quán cư trú của chúng ta sẽ trải qua một sự chuyển mình to lớn; những bộ não giờ đây có thể dễ dàng cư ngụ trong những cụm máy chủ khổng lồ, còn các cơ thể tổng hợp thì lại có thể được xếp cất trên những chiếc giá đỡ. Dẫu đây là một giải pháp mang lại hiệu quả cao về mặt chi phí, thế nhưng một vài nhóm hoạt động đã nêu lên những mối lo ngại vô cùng thực tế.\n\nThị trường bất động sản vốn từng mang lại siêu lợi nhuận trong quá khứ có thể sẽ sụp đổ hoàn toàn, giáng một đòn nặng nề vào nền kinh tế của chúng ta. Hay chí ít là từ góc độ tâm lý học, một tác hại tiềm ẩn khủng khiếp hơn chính là việc mọi người sẽ không còn một không gian vật lý nào để gọi là nhà nữa."
 synth.630.a: "Máy chủ trung tâm hóa mang lại hiệu suất cao hơn."
 synth.630.b: "Có thể đặt máy chủ cá nhân ngay trong chính những ngôi nhà hiện tại."
 synth.630.c: "Bắt đầu rao bán bất động sản kỹ thuật số."
 ### NHÓM SỰ KIỆN 2: CÁC KHẢ NĂNG ###
 synth.1010.name: "Ma trận Khả năng Vô tận"
 synth.1010.desc: "Ngành công nghiệp kỹ thuật số đang bùng nổ rực rỡ. Từ cảm giác kích thích của những chuyến phiêu lưu góc nhìn thứ nhất cho đến sự thảnh thơi tại các khu nghỉ dưỡng ảo, ngành giải trí ảo chưa bao giờ lại có sức hấp dẫn và dễ gây nghiện đến vậy. Mặc dù ngành công nghiệp mới nổi này là một trong những động lực then chốt của nền kinh tế, nhưng khi con người ngày càng đắm chìm vào chốn địa đàng kỹ thuật số, hoạt động sản xuất trong thế giới thực đã bắt đầu bị ảnh hưởng. Có những kẻ đang phải đối mặt với nguy cơ đánh mất hoàn toàn kết nối với cuộc sống \"thực tại\", thế nhưng họ vẫn có thể đóng góp cho xã hội thông qua việc tham gia vào nền kinh tế số.\n\nLiệu chúng ta nên ban lệnh cấm những thế giới ảo có khả năng gây nghiện này, đẩy mạnh quảng bá nó như một hình thức giải trí sinh lời mới mẻ, hay tìm kiếm một giải pháp dung hòa thông qua việc kiểm soát?"
 synth.1010.a: "Cấm các thế giới ảo có khả năng gây nghiện dai dẳng."
 synth.1010.b: "Khuyến khích những chốn thiên đường ảo này."
 synth.1010.b.hedonist: "Cuối cùng thì ta cũng có được một chốn thiên đường vĩnh hằng!"
 synth.1010.c: "Đưa ngành công nghiệp này vào khuôn khổ."
 synth.1020.name: "Y tế Tổng hợp"
 synth.1020.desc: "Những hình hài tổng hợp mới đã giúp ta thoát khỏi mọi khổ đau bệnh tật của thể xác hữu cơ. Nhưng thật không may, nó cũng kéo theo vô vàn những vấn đề hoàn toàn mới, từ những lỗi hỏng hóc cơ học cơ bản cho đến các vấn đề nghiêm trọng đe dọa đến tính mạng như độ ổn định của máy chủ, lỗi kết nối, hay virus kỹ thuật số...\n\nLiệu chúng ta nên dồn mọi tâm huyết vào việc bảo vệ tâm trí đã được số hóa của mình, coi thân xác chỉ như một món hàng tiêu dùng dùng một lần, hay nên chăm lo nhiều hơn cho nó như một sự nối dài của danh tính bản thân?"
 synth.1020.a: "Chúng ta phải tiếp tục bảo vệ lấy cơ thể này."
 synth.1020.a.spiritual: "Thể xác chính là thánh khí thiêng liêng chứa đựng linh hồn."
 synth.1020.b: "Tập trung vào việc bảo vệ tâm trí."
 synth.1020.b.spiritual: "Chúng ta đã vượt xa khỏi chốn phàm tục thể xác này."
 synth.1020.c: "Sự cân bằng chính là chìa khóa cốt lõi."
 synth.1020.d: "Những chứng bệnh mới mẻ này mang lại một tiềm năng phát triển vô cùng to lớn..."
 synth.1030.name: "Tái sinh"
 synth.1030.desc: "Chúng ta đã trở nên nhanh nhạy, mạnh mẽ và ưu việt hơn. Thế nhưng, việc ném những thân xác tổng hợp vào những môi trường đầy rẫy hiểm nguy vẫn tiềm ẩn những rủi ro về mặt tâm trí. Dẫu biết rằng ý thức có thể được khôi phục, giúp xoa dịu đi những đớn đau, nhưng không thể nào dập tắt chúng hoàn toàn. Nhất là khi sự phục hồi ý thức chưa bao giờ là một điều chắc chắn tuyệt đối, và những thân xác mới cũng chẳng thể tự nhiên mà mọc ra.\n\nChúng ta có thể chọn cách ngó lơ những đớn đau về mặt tâm trí để đẩy hiệu suất của người tổng hợp lên đến cực hạn, hoặc cũng có thể để cho những tham vọng vĩ đại của mình phải lùi bước trước sức khỏe tinh thần của nhân dân."
 synth.1030.a: "Tiếp tục đẩy xa mọi giới hạn."
 synth.1030.b: "Cẩn thận hành sự."
 synth.1030.c: "Tầng lớp tinh anh tuyệt đối không thể để bị rơi vào hiểm cảnh."
 #SỰ KIỆN CUỐI CÙNG #
 synth_virtual_trait: "\n[owner.species.GetNamePlural] nhận được đặc điểm: §Y$trait_robot_digital_1$§!\nĐặc điểm §Y$leader_trait_synthetic$§! của nhà lãnh đạo sẽ được thay thế bằng đặc điểm §Y$leader_trait_virtual$§!"
 synth_physical_traits: "\nMở khóa các đặc điểm §YCao cấp§! dùng để điều chỉnh giống loài."
 #DÂN CHỦ
 synth.1505.name: "Xã hội Tổng hợp hóa"
 synth.1505.desc.physical: "Chúng ta không hề cố tình xóa bỏ hoàn toàn nhân cách, mà chỉ đang cố gắng không đánh mất đi bản ngã của chính mình trong quá trình gặt hái những quả ngọt từ sự tổng hợp hóa.\n\nCùng với sự đổi thay này, quyền tự do hành động của chúng ta đã vươn lên một tầm cao chưa từng có. Chúng ta có thể dịch chuyển ý thức của mình vào vô số những cơ thể chuyên biệt, cho phép mọi người có thể làm bất cứ công việc gì ở bất cứ nơi đâu mà họ khao khát nhất."
 synth.1505.desc.virtual: "Xã hội của chúng ta đã rũ bỏ được thế giới vật chất, và đang hướng mắt về tương lai với một mớ cảm xúc hỗn độn giữa sự hào hứng và nỗi âu lo. Dẫu ta đã tự biến đổi bản thân mình theo những cách thức mà ta vẫn chưa thể thấu hiểu cặn kẽ, nhưng chí ít thì ta cũng đã cùng nhau kề vai sát cánh trên chuyến hành trình vĩ đại này.\n\nGiờ đây, ta đã có thể tương tác với máy móc bằng một phương thức không hề làm tổn hại đến ý thức của mình. Đây quả là một cột mốc quan trọng giúp chúng ta có thể xuyên qua những chiến trường đẫm máu đầy rẫy hiểm nguy hay những khoảng không gian lạnh lẽo buốt giá."
 synth.1505.desc.neutral: "Việc tỏ ra chần chừ do dự trước những thay đổi đến mức khó lòng thấu hiểu thế này cũng là điều dễ hiểu, xét cho cùng thì con người ta vẫn luôn nhạy cảm trước sự mất mát hơn là những thứ nhận được. Thế nhưng, ta không thể cứ đứng ngây ra nơi ngã ba đường để chờ chết được, ta phải dẫn dắt nhân dân của mình tiến về phía trước.\n\nĐiều này đồng nghĩa với việc ta phải lựa chọn, hoặc là kiến tạo nên một loạt các cơ thể cá nhân chuyên biệt cho phép mọi người tùy ý xâm nhập, hoặc là ôm trọn lấy sự tồn tại dưới hình thức tổng hợp hóa, để đương đầu với những thử thách khắc nghiệt của việc du hành vũ trụ và những cuộc chiến tranh tàn khốc."
 synth.1505.a: "Triển khai việc dịch chuyển giữa các cơ thể vật lý."
 synth.1505.a.tt: "$change_auth_tt$['concept_auth_synth_democratic_physical']$synth_physical_traits$"
 synth.1505.b: "Để cho những kẻ thế thân thay chúng ta chiến đấu."
 synth.1505.b.tt: "$change_auth_tt$['concept_auth_synth_democratic_virtual']$synth_virtual_trait$"
 synth.1505.c: "$synth_keep_auth_option$"
 synth.1505.c.tt: "$keep_auth_tt$['concept_auth_democratic']"
 #TẬP ĐOÀN ĐẦU SỎ
 synth.1510.name: "Xã hội Tổng hợp hóa"
 synth.1510.desc.physical: "Xã hội tổng hợp hóa của chúng ta, những cơ thể tổng hợp tối tân và cả lòng dân đều đang hướng về một con đường tổng hợp hóa có phần bảo thủ hơn. Nhân dân ta có thể giữ nguyên hình dáng cơ thể tùy chỉnh của bản thân, đồng thời thay đổi cơ thể gần như bất cứ khi nào họ muốn.\n\nĐiều này cho phép các quan chức dày dặn kinh nghiệm hơn có thể tạm thời tiếp quản cơ thể của những đồng nghiệp yếu kém, nhờ đó gia tăng đáng kể hiệu suất quan liêu."
 synth.1510.desc.virtual: "Giờ đây chúng ta đã sẵn sàng để sải một bước tiến khôn ngoan tiếp theo trong cuộc cách mạng tổng hợp hóa, đó chính là ôm trọn lấy một hình thức tồn tại ảo hóa hoàn toàn.\n\nNhững cơ thể tạm thời sẽ gánh vác việc thực thi các nhiệm vụ trong thế giới thực, nhưng phần lớn dân cư sẽ chuyển đổi sang một hình thức tồn tại phi vật chất hóa hơn.\n\nĐiều này sẽ giúp cho các mệnh lệnh được truyền đi và thực thi một cách nhanh chóng và vô cùng hiệu quả, đồng thời giảm thiểu đáng kể sự giám sát từ chính phủ."
 synth.1510.desc.neutral: "Các ban ngành trong xã hội ta đều đã thích nghi được với một cuộc sống tổng hợp hóa, nhưng dựa trên các số liệu thì những lợi ích của việc chuyên biệt hóa hơn nữa vẫn còn là một dấu hỏi lớn.\n\nChúng ta sẽ tạo ra một cửa sau cho danh tính để cho các viên chức quản lý có thể chiếm lấy thân xác của những tên cấp dưới vô tích sự, hay sẽ phát triển một giao diện mạng ảo để có thể đồng bộ hóa việc giám sát vô số các dự án của chính phủ với độ trễ bằng không đây."
 synth.1510.a: "Cho phép quan chức tiếp quản những đồng nghiệp làm việc kém hiệu quả."
 synth.1510.a.tt: "$change_auth_tt$['concept_auth_synth_oligarchic_physical']$synth_physical_traits$"
 synth.1510.b: "Tiếp nhận cơ chế giám sát ảo hóa hoàn toàn."
 synth.1510.b.tt: "$change_auth_tt$['concept_auth_synth_oligarchic_virtual']$synth_virtual_trait$"
 synth.1510.c: "$synth_keep_auth_option$"
 synth.1510.c.tt: "$keep_auth_tt$['concept_auth_oligarchic']"
 #ĐỘC TÀI
 synth.1515.name: "Xã hội Tổng hợp hóa"
 synth.1515.desc.physical: "Nhân dân ta sẽ không bao giờ trốn tránh những công việc chân tay lương thiện. Lực lượng lao động của chúng ta đã hoàn tất việc liên kết mạng lưới, có thể dựa vào đó để điều khiển từ xa nhiều cơ thể khác nhau — và trong suốt quá trình này, các chỉ tiêu sản xuất đã tăng lên rõ rệt.\n\nSự tiến triển này là một minh chứng rõ ràng nhất cho thấy sự tin tưởng mà ta dành cho vị Lãnh tụ Tối cao §Y[From.GetRulerTitle] [From.GetRulerName]§! là hoàn toàn chính xác."
 synth.1515.desc.virtual: "Mọi người đều đã sẵn sàng rũ bỏ hình thái vật chất của mình để hòa mình vào những dòng ý thức kỹ thuật số. Bọn họ bằng lòng việc tiếp tục sinh tồn trong một môi trường ảo hoàn toàn.\n\nBằng việc tước đoạt đi nhận thức của họ thông qua giao thức này, chúng ta sẽ có được quyền tự do thao túng thực tại của họ một cách tuyệt đối, thổi bùng lên những cảm xúc tích cực của họ đối với quốc gia. Một dân tộc luôn một lòng hướng về vị Lãnh tụ vĩ đại chính là nền móng vững chắc nhất cho một quốc gia hùng mạnh."
 synth.1515.desc.neutral: "Các §Y[root.GetSpeciesAdj]§! vẫn chưa thể quyết định được việc số hóa ý thức sẽ được thực hiện dưới hình thức nào. Những người theo phe bảo thủ mong muốn chúng ta vẫn sẽ bám chặt lấy cơ thể vật lý, trong khi những kẻ khác thì lại chán ghét sự \"thỏa hiệp\" nửa nạc nửa mỡ giữa cũ và mới này.\n\nChúng ta bắt buộc phải đưa ra một sự lựa chọn. Hoặc là tập trung vào cơ thể để một người lao động có thể điều khiển nhiều thể xác, hoặc là hướng sự chú ý đến sự tồn tại ảo để đẩy mạnh quyền kiểm soát xã hội lên một tầm cao chưa từng có."
 synth.1515.a: "Chế tạo ra những cơ thể lao động đồng bộ hóa thần kinh."
 synth.1515.a.tt: "$change_auth_tt$['concept_auth_synth_dictatorial_physical']$synth_physical_traits$"
 synth.1515.b: "Thao túng nhận thức của nhân dân bên trong không gian ảo."
 synth.1515.b.tt: "$change_auth_tt$['concept_auth_synth_dictatorial_virtual']$synth_virtual_trait$"
 synth.1515.c: "$synth_keep_auth_option$"
 synth.1515.c.tt: "$keep_auth_tt$['concept_auth_dictatorial']"
 #ĐẾ CHẾ
 synth.1520.name: "Xã hội Tổng hợp hóa"
 synth.1520.desc.physical: "Đế chế đang nghiêng về việc tăng cường các cơ thể tổng hợp mới của chúng ta. Thông qua việc nâng cao tốc độ và quy mô của dịch chuyển nhân cách, ta có thể nhanh chóng thế chỗ cho những cơ thể bị phá hủy trong quá trình thực hiện các nhiệm vụ nguy hiểm.\n\nNhững hình thái mới này cho phép chúng ta tháo rời các bộ não positron để thu lấy những dấu ấn kiến thức từ những bậc tinh anh vừa mới nằm xuống. Là những bề tôi trung thành của Đế chế, hẳn đây cũng chính là điều mà họ mong muốn."
 synth.1520.desc.virtual: "Các §Y[From.GetSpeciesAdj]§! sẵn lòng tiến thêm một bước xa hơn nữa, so với việc cứ mãi dây dưa không dứt với thế giới vật lý, họ lại thiên về một sự tồn tại ảo hóa hoàn toàn. Cú sốc từ sự kiện trọng đại này sẽ tạo ra những ảnh hưởng vô cùng sâu rộng đến tương lai của chúng ta. Bằng việc đẩy nhanh tốc độ và mở rộng quy mô dịch chuyển nhân cách, ta có thể nhanh chóng thay thế những cơ thể tổng hợp đã bị phá hủy trong các nhiệm vụ sinh tử.\n\nNhững tiến bộ vượt bậc hoàn toàn mới này chắc chắn sẽ làm tăng hiệu quả của chúng ta trong hàng loạt những tình huống liên quan đến chiến tranh, mang lại vinh quang tột đỉnh cho đế quốc §Y[From.GetSpeciesAdj]§!!"
 synth.1520.desc.neutral: "Đế chế §Y[From.GetSpeciesAdj]§! đã đi đến ngã ba đường. Có người cho rằng một cơ thể được thiết kế riêng sẽ mang lại cho ta cảm giác an toàn và thân thuộc, trong khi một số khác lại kịch liệt phản đối việc tận dụng tối đa quá trình tổng hợp hóa cũng như những gì mà nó mang lại.\n\nTập trung vào khía cạnh cơ thể sẽ cho phép ta thu thập những tri thức từ các quan chức cấp cao vừa mới qua đời trong một thời gian ngắn để đem đi cống hiến cho khoa học. Hoặc, con đường tiến tới sự tồn tại ảo sẽ giúp việc thay thế các cơ thể tổng hợp trên quy mô lớn thông qua hình thức chuyển giao nhân cách chớp nhoáng trở thành hiện thực."
 synth.1520.a: "Tận dụng ý thức của những nhà lãnh đạo đã khuất."
 synth.1520.a.tt: "$change_auth_tt$['concept_auth_synth_imperial_physical']"
 synth.1520.b: "Chế tạo những cơ thể dùng một lần."
 synth.1520.b.tt: "$change_auth_tt$['concept_auth_synth_imperial_virtual']"
 synth.1520.c: "$synth_keep_auth_option$"
 synth.1520.c.tt: "$keep_auth_tt$['concept_auth_imperial']"
 #TẬP ĐOÀN
 synth.1525.name: "Xã hội Tổng hợp hóa"
 synth.1525.desc.physical: "Các bộ phận thị trường và nghiên cứu phát triển của chúng ta đã trình làng một phát minh hoàn toàn mới trong lĩnh vực ứng dụng trí tuệ nhân tạo dành cho toàn bộ tệp khách hàng cơ sở của chúng ta. Sự thỏa hiệp cho một sự tồn tại tổng hợp mới đã mở đường cho ta tận dụng triệt để những lợi thế của thế giới ảo nhằm phát triển ra những sản phẩm vô cùng thiết thực cho thế giới thực.\n\nGiờ đây, ta có thể bơm những AI bị hạn chế vào các vật thể vô tri vô giác, thổi bùng vào chúng một sức sống. Sau đó, phân khúc sản phẩm mới này có thể được điều chỉnh sâu hơn để hướng tới những người tiêu dùng, các doanh nghiệp tư nhân và những hội nhóm có hứng thú trên khắp cõi ngân hà."
 synth.1525.desc.virtual: "Cam kết của chúng ta đối với không gian ảo đã vén màn cho một dòng sản phẩm hoàn toàn mới xoay quanh những đoạn ký ức. Các kỹ thuật viên tại chi nhánh của chúng ta có khả năng thu thập ký ức từ mọi đối tượng tình nguyện viên mà không hề bị giới hạn bởi kiểu hình của họ.\n\nBộ phận tình báo của chúng ta cũng có thể tiến hành rà soát kỹ lưỡng những ký ức này, giúp ta nắm được lợi thế cạnh tranh áp đảo so với các đế quốc khác trong lĩnh vực này. Cuối cùng, những ký ức này sẽ được nhào nặn và tích hợp vào quy trình kiến tạo tâm trí tổng hợp của chúng ta, giúp mang lại một sự cải thiện hiệu suất rõ rệt."
 synth.1525.desc.neutral: "Dẫu cho đã tiến hành những bài phân tích chi phí/lợi ích vô cùng cặn kẽ, nhưng việc đi theo hướng chuyên biệt hóa vật lý hay ảo hóa trong quá trình tổng hợp hóa cũng không phải là điều quan trọng nhất. Tuy nhiên, ta không thể cứ mãi giậm chân tại chỗ trước những cơ hội béo bở này được, ta phải vạch ra một con đường rõ ràng cho các bên liên quan.\n\nTập trung vào thế giới vật lý sẽ cho phép chúng ta bơm những AI bị giới hạn vào các vật thể vô tri vô giác, rồi đem bán chúng như những phiên bản giản lược của một hình thức sống mới. Còn nếu đầu tư vào không gian ảo, ta có thể thương mại hóa được cả ký ức lẫn khuôn mẫu tư duy."
 synth.1525.a: "Phân phối các thực thể trí tuệ nhân tạo bị hạn chế."
