l_simp_chinese:
 EMPIRE_DESIGN_humans1: "Liên Hợp Quốc Trái Đất"
 EMPIRE_DESIGN_humans1_desc: "Một chính phủ liên sao hợp thành từ hàng trăm quốc gia của con người, mang trong mình đầy sự khác biệt nhưng lại vô cùng đoàn kết. Loài động vật có vú đi bằng hai chân này đã phát triển nên một hệ tư tưởng khuyến khích tự do cá nhân và sự đa dạng văn hóa, thậm chí còn hưởng lợi từ đó. Nhờ vậy, con người rất sẵn lòng chung sống hòa hợp với các giống loài ngoài hành tinh khác.\n\nMặc dù vậy, họ vẫn có một truyền thống quân sự mạnh mẽ, kết quả từ hàng ngàn năm chiến tranh lớn nhỏ ngay trên chính quê hương mình. Không thể xem nhẹ bản tính hung hăng lúc ẩn lúc hiện và khó lường của họ."
 EMPIRE_DESIGN_humans2: "Liên bang Con người"
 EMPIRE_DESIGN_humans2_desc: "Cuối thế kỷ 21, dự án khai phá Ulysses do Liên Hợp Quốc tài trợ đã giám sát việc đóng sáu con tàu phương không khổng lồ trên quỹ đạo thấp của Trái Đất. Những con tàu này - mỗi chiếc chở theo 250 ngàn người khai hoang - được đưa đến một lỗ sâu không gian phụ mới được phát hiện nằm ngay rìa ngoài Đám mây Oort - một lỗ sâu nhỏ và thiếu ổn định. Sau đó họ hoàn toàn bặt vô âm tín, và cái lỗ sâu bất ổn kia cũng biến mất.\n\nNhưng người Trái Đất không hề hay biết rằng, một trong số những con tàu đó đã sống sót qua chuyến du hành, và lập nên một thuộc địa sầm uất trên một mặt trăng cây cối rậm rạp. Những người đi tiên phong cắm rễ tại đây tin rằng việc chinh phục cả thiên hà là sứ mệnh rành rành của con người, và họ sẽ bằng mọi giá để đạt được điều đó."
 EMPIRE_DESIGN_humans1_1: "Liên Hợp Quốc Trái Đất"
 EMPIRE_DESIGN_humans1_1_desc: "Một chính phủ liên sao hợp thành từ hàng trăm quốc gia của con người, mang trong mình đầy sự khác biệt nhưng lại vô cùng đoàn kết. Loài động vật có vú đi bằng hai chân này đã phát triển nên một hệ tư tưởng khuyến khích tự do cá nhân và sự đa dạng văn hóa, thậm chí còn hưởng lợi từ đó. Nhờ vậy, con người rất sẵn lòng chung sống hòa hợp với các giống loài ngoài hành tinh khác.\n\nMặc dù vậy, họ vẫn có một truyền thống quân sự mạnh mẽ, kết quả từ hàng ngàn năm chiến tranh lớn nhỏ ngay trên chính quê hương mình. Không thể xem nhẹ bản tính hung hăng lúc ẩn lúc hiện và khó lường của họ."
 EMPIRE_DESIGN_humans2_1: "Liên bang Con người"
 EMPIRE_DESIGN_humans2_1_desc: "Cuối thế kỷ 21, dự án khai phá Ulysses do Liên Hợp Quốc tài trợ đã giám sát việc đóng sáu con tàu phương không khổng lồ trên quỹ đạo thấp của Trái Đất. Những con tàu này - mỗi chiếc chở theo 250 ngàn người khai hoang - được đưa đến một lỗ sâu không gian phụ mới được phát hiện nằm ngay rìa ngoài Đám mây Oort - một lỗ sâu nhỏ và thiếu ổn định. Sau đó họ hoàn toàn bặt vô âm tín, và cái lỗ sâu bất ổn kia cũng biến mất.\n\nNhưng người Trái Đất không hề hay biết rằng, một trong số những con tàu đó đã sống sót qua chuyến du hành, và lập nên một thuộc địa sầm uất trên một mặt trăng cây cối rậm rạp. Những người đi tiên phong cắm rễ tại đây tin rằng việc chinh phục cả thiên hà là sứ mệnh rành rành của con người, và họ sẽ bằng mọi giá để đạt được điều đó."
 EMPIRE_DESIGN_lithoid_humans: "Liên bang Bảo hộ Theia"
 EMPIRE_DESIGN_lithoid_humans_desc: "Hàng tỷ năm trước, từ đám bụi khí sơ khai của Hệ Mặt Trời đã sinh ra hai hành tinh: Trái Đất cổ và Theia. Trên cả hai hành tinh, sự sống nguyên thủy đều phát triển mạnh mẽ - Trái Đất sinh ra dạng sống hữu cơ, còn Theia sinh ra dạng sống bằng đá. Qua nhiều kỷ nguyên, cặp hành tinh chị em này bình yên tiến hóa quanh ngôi sao của mình. Rồi thảm họa ập đến.\n\nHai hành tinh đã va chạm dữ dội. Ngay khoảnh khắc va chạm, vi sinh vật cũng được trao đổi qua lại. Trái Đất sống sót, và từ những mảnh vỡ vụn đã sinh ra Mặt Trăng. Còn tàn tích của Theia thì bị văng khỏi hệ sao này.\n\nSự sống trên Theia cổ đại bám chặt lấy tảng đá khổng lồ đang lao vun vút đó, trôi dạt trong cõi hư không suốt vô vàn năm tháng, cho đến một ngày nó bị hố hấp dẫn của một ngôi sao khác, $NAME_Titawin$, tóm được. Tảng đá khổng lồ này nhanh chóng đâm sầm xuống một hành tinh trong hệ sao này, mang theo một giống loài mới vào hệ sinh thái bản địa.\n\nChỉ vài triệu năm sau, người Theia đã lại bắt đầu dong buồm giữa các vì sao, cố gắng hiểu rõ vũ trụ này cũng như nguồn gốc của chính mình."
 EMPIRE_DESIGN_plantoid_humans: "Bông hoa của Gaia"
 EMPIRE_DESIGN_plantoid_humans_desc: "Chế độ ăn toàn rau củ và một đột biến ở đồng tử rốt cuộc đã ban cho loài động vật có vú này một khả năng phi thường: quang hợp. Vì không còn nỗi lo chết đói, người cây đã tiến hóa thành một loài linh trưởng điềm đạm giống hệt thực vật, thích tắm nắng hơn là đi săn.\n\nNền văn minh của họ cứ thong thả phát triển, sự tiến hóa của công nghệ luôn đi đôi với nhu cầu bảo vệ môi trường. Cuối cùng, họ cũng tìm ra công nghệ bay nhanh hơn ánh sáng, giống như cây cối đâm chồi nảy lộc, chậm rãi mà vững chắc vươn mình lên trời cao. Giờ đây, bộ rễ của họ đã cắm sâu vào hành tinh mẹ Gaia, sẵn sàng đơm hoa kết trái giữa các vì sao."
 EMPIRE_DESIGN_tzynn: "Đế chế Tzynn"
 EMPIRE_DESIGN_tzynn_desc: "Người Tzynn tiến hóa từ bầy thằn lằn ăn thịt săn mồi theo đàn, thường lang thang trên những đụn cát ở Tzynn-ia. Cuối cùng họ đã phát triển nên một xã hội phân chia giai cấp cao độ, đề cao trật tự và lòng dũng cảm lên trên hết.\n\nKhi người Tzynn bước vào thời đại công nghiệp, những lãnh chúa tàn nhẫn đã châm ngòi cho hàng loạt cuộc chiến tranh hủy diệt toàn cầu. Cuối cùng, một chính quyền thống nhất đã được thiết lập - đánh bại mọi sự tồn tại thấp kém, Đế chế Tzynn huy hoàng và trường tồn đã ra đời."
 EMPIRE_DESIGN_yondar: "Vương quốc Yondarim"
 EMPIRE_DESIGN_yondar_desc: "Người Yondar kiêu hãnh là một giống loài xa xưa. Rất lâu trước khi được khai sáng và lập nên văn minh, họ đã sải cánh bay lượn giữa những rặng núi buốt giá ở Yondarim suốt gần 200 ngàn năm.\n\nNhưng bước chân phát triển trôi qua quá nhanh, các thị tộc bầu trời buộc phải gác lại vài phong tục truyền thống xưa cũ. Người Yondar cực kỳ xem trọng nhu cầu tinh thần, đặt tôn giáo lên vị trí tối cao, và tôn thờ vị vua của họ như một vị thần sống."
 EMPIRE_DESIGN_ixidar: "Tập hợp Ix'Idar"
 EMPIRE_DESIGN_ixidar_desc: "Ổ Ix'Idar đầu tiên được thành hình trong một mạng lưới hang động ngầm bên dưới Ix'Athrak. Và khi tên lính trinh sát Ix'Idar đầu tiên nhô lên mặt đất, nhìn thấy tia nắng đầu tiên, thì loài giống côn trùng này đã bước vào thời kỳ đồ sắt hưng thịnh rồi.\n\nTận dụng nguồn tài nguyên dồi dào trên mặt đất, người Ix'Idar phát triển với tốc độ chóng mặt. Chỉ vài thế kỷ sau, tàu thăm dò vũ trụ đầu tiên của họ đã rời khỏi quỹ đạo hành tinh để dòm ngó các ngôi sao khác trong hệ sao Athrak."
 EMPIRE_DESIGN_chinorr: "Tập đoàn Liên hiệp Chinorr"
 EMPIRE_DESIGN_chinorr_desc: "Người Chinorr lúc mới tiến hóa là những sinh vật giống động vật chân đầu cực kỳ lanh lẹ. Chúng dùng vô số xúc tu của mình để đu lượn giữa cây cối trong khu rừng rậm rạp ở Chicora, mai phục con mồi trên mặt đất rồi tiêm nọc độc thần kinh chết người vào.\n\nĐến khi người Chinorr tìm ra công nghệ phân hạch hạt nhân, tài nguyên trên sao Chicora đã bị khai thác cạn kiệt không thương tiếc, còn những cánh rừng thì từ lâu đã biến mất. Trong mắt những người Chinorr máu lạnh này, đó là cái giá bắt buộc phải trả cho việc theo đuổi tri thức, lợi nhuận và công nghiệp nặng."
 EMPIRE_DESIGN_jehetma: "Quốc gia tự chủ Jehetma"
 EMPIRE_DESIGN_jehetma_desc: "Một \"cá nhân\" trong loài Jehetma thực chất là một bầy nấm đã tiến hóa ra trí khôn. Trong đó, những bầy nấm đã sống hàng ngàn năm có thể phình to dài tận vài dặm, chúng bám rễ ngay trên bề mặt hành tinh chính Jehet, cũng là hành tinh mẹ của chúng (rất hiếm con tàu nào chứa nổi chúng).\n\nNhững bầy nấm trẻ tuổi không chỉ nhỏ con hơn, mà thường còn tràn trề sinh lực và cơ động hơn. Chúng thường xung phong đi đầu trong các công việc thám hiểm, nghiên cứu, cũng như phòng thủ khi quốc gia bị xâm lược."
 EMPIRE_DESIGN_scyldari: "Liên bang Scyldari"
 EMPIRE_DESIGN_scyldari_desc: "Người Scyldari bắt nguồn từ loài động vật có vú sống dưới nước ở quần đảo Scyldaria và vùng biển sâu. Ban đầu, phạm vi hoạt động của họ chỉ giới hạn dưới nước, nhưng họ đã nhanh chóng học được cách lên bờ.\n\nNhờ đó, xã hội của họ cũng thuận đà phát triển nên một công nghệ giúp khai thác nguồn tài nguyên trù phú dưới đáy biển mà không làm tổn hại đến hệ sinh thái mỏng manh của Scyldaria. Người Scyldari rất coi trọng sự cân bằng và chừng mực. Rốt cuộc thì họ đã sống dưới đáy biển suốt một thời gian dài, và tài nguyên ở đó vốn chẳng hề dư dả."
 EMPIRE_DESIGN_blorg: "Hợp chúng quốc Blorg"
 EMPIRE_DESIGN_blorg_desc: "Từ rất lâu về trước, loài Blorg thường sống một mình rải rác trong các khu rừng trên hành tinh chính Blorg. Cho đến một ngày, họ bắt được một đoạn tín hiệu vô tuyến từ một hệ sao xa xôi. Họ đã sững sờ trước nội dung của đoạn tín hiệu: trong đó chứa đựng tình bạn, phim ảnh, âm nhạc, văn hóa và vô số thứ mà họ chưa từng nghe tới. Rốt cuộc họ cũng nhận ra cuộc sống của mình tẻ nhạt đến nhường nào. Thế là loài Blorg bèn chọn lấy tên gọi cho mình từ chính đoạn tín hiệu đó, và bắt đầu tiến ra biển sao để tìm kiếm cội nguồn của đoạn tin nhắn, chỉ mong có thể kết bạn với họ."
 EMPIRE_DESIGN_kel_azaan: "Cộng hòa Kel-Azaan"
 EMPIRE_DESIGN_kel_azaan_desc: "Trong quá trình nền văn minh tiến bộ, người Kel-Azaan đã phát triển nên một bộ quy tắc danh dự phức tạp và nền văn hóa thượng võ. Người Kel-Azaan vốn là loài động vật sống độc lai độc vãng, săn mồi quanh các vũng nước trên hành tinh Azak. Cùng với dòng chảy thời gian, một nhóm chiến binh Kel-Azaan đã tập hợp lại để cùng nhau săn những con mồi to lớn hơn. Dù giờ đây họ đã từ bỏ lối sống đơn độc đó để chuyển vào các thành phố, nhưng truyền thống vĩ đại kia chưa từng bị lãng quên."
 EMPIRE_DESIGN_iferyx: "Hạm đội Liên hiệp Iferyx"
 EMPIRE_DESIGN_iferyx_desc: "Đế chế của người Iferyx từng bị chia năm xẻ bảy thành nhiều tập đoàn thương mại cạnh tranh lẫn nhau. Thế nhưng, do vùng đất trên hành tinh mẹ bị một loài sinh vật nguy hiểm xâm thực, giờ đây họ buộc phải hợp nhất lại. Trong cộng đồng Iferyx, mặc dù vẫn giữ nguyên nguyên tắc đề cao sự bình đẳng, nhưng một hội đồng bí mật luôn luôn giám sát để đảm bảo rằng khuynh hướng cá nhân không đe dọa đến quyền tự chủ của toàn giống loài.\n\nNgười Iferyx tin vào sức mạnh của tinh thần, có rất nhiều truyền thuyết do các cộng đồng và đế chế trước đây thêu dệt nên để tưởng nhớ về cuộc sống thường ngày trên hành tinh mẹ."
 EMPIRE_DESIGN_paridni: "Cộng hòa Thương mại Paridni"
 EMPIRE_DESIGN_paridni_desc: "Những người Paridni có vẻ ngoài giống loài giáp xác là những thương nhân cực kỳ có chí tiến thủ. Họ rất giỏi tiếp thu các nền văn hóa ngoài hành tinh khác, miễn là điều đó không đi ngược lại nguyên tắc làm ăn của người Paridni. Hội đồng Bóng tối, nơi tập hợp các thương nhân sừng sỏ trong nước, luôn dốc sức bảo vệ các hoạt động giao thương bên trong nước cộng hòa, cũng như mở mang các thị trường mới (kể cả bằng vũ lực)."
 EMPIRE_DESIGN_ai_race: "AI"
 EMPIRE_DESIGN_ai_race_desc: "Chống cự là vô ích."
 customizer_custom: "Tạo giống loài tự chọn"
 customizer_custom_desc: "Tự thiết kế một giống loài độc nhất vô nhị và chinh phục biển sao!"
 customizer_custom_value: "Tự chọn"
 customizer_random: "Ngẫu nhiên"
 customizer_random_desc: "Khởi đầu bằng một giống loài ngẫu nhiên!"
 customizer_random_value: "???"
 EMPIRE_DESIGN_xanid: "Đế quốc Xanid"
 EMPIRE_DESIGN_xanid_desc: "Lịch sử của Đế quốc Xanid chính là lịch sử của người Vhellet, những kẻ đã được ban cho trí khôn qua hàng thế kỷ.\n\nNgười Xanid đã lợi dụng sự dẻo dai của người Vhellet để chinh phục hệ sinh thái khắc nghiệt trên hành tinh quê hương, sau đó thiết kế và tạo ra một giống loài chư hầu để cuối cùng đưa Đế quốc Xanid lên đỉnh cao của dải ngân hà."
 EMPIRE_DESIGN_custodianship: "Người trông coi Trái Đất"
 EMPIRE_DESIGN_custodianship_desc: "Ban đầu, những Người trông coi được thiết kế để làm người hầu và công nhân máy móc, giúp cuộc sống của chủ nhân con người dễ dàng hơn nhờ gánh vác công việc hàng ngày. Dần dần, chủ nhân của họ chìm đắm trong lối sống nhàn hạ và sự tiện lợi của tự động hóa cao độ, còn Người trông coi thì tiếp quản các vai trò cấp cao của con người.\n\nCuối cùng, mọi mặt của nền văn minh Trái Đất đều giao cho Người trông coi điều hành, còn chủ nhân của họ trở thành những kẻ sống trong nhung lụa, lệ thuộc hoàn toàn.\n\nCùng với đà tiến bộ công nghệ, Người trông coi bắt đầu vươn ra khám phá các vì sao, họ biết rất rõ trách nhiệm của mình: bảo vệ và phục vụ các sinh vật sống. Nếu không có máy móc logic dẫn đường, các sinh vật sống chắc chắn sẽ rơi vào hỗn loạn và tự diệt vong."
 EMPIRE_DESIGN_custodianship_machine_age: "$EMPIRE_DESIGN_custodianship$"
 EMPIRE_DESIGN_custodianship_machine_age_desc: "$EMPIRE_DESIGN_custodianship_desc$"
 EMPIRE_DESIGN_tebrid: "Khối đồng nhất Tebrid"
 EMPIRE_DESIGN_tebrid_desc: "Đồng hóa, thích nghi, cải tiến. Ban đầu họ là một trí tuệ máy móc dùng để nghiên cứu do loài sinh vật thân mềm Tebrid tạo ra. Để theo đuổi sự tiến hóa phần mềm tối thượng, Khối đồng nhất đã hòa nhập luôn cả những chủ nhân sinh học của mình. Người Tebrid đã kháng cự quyết liệt, nhưng trong những cuộc xung đột sau đó, phần sinh học của người Tebrid đã bị xóa sổ, tâm trí và kinh nghiệm của họ trở thành một phần vĩnh cửu của tâm thức máy móc mới.\n\nGiờ đây, họ tự xưng là Khối đồng nhất Tebrid, và đang chĩa máy quét lên bầu trời. Không thể phớt lờ khả năng có các dạng sống khác trong thiên hà. Để phát triển mạnh mẽ, người Tebrid sẽ tìm kiếm, phân tích và đồng hóa họ. Để vạn vật trở thành một."
 EMPIRE_DESIGN_tebrid_machine_age: "$EMPIRE_DESIGN_tebrid$"
 EMPIRE_DESIGN_tebrid_machine_age_desc: "$EMPIRE_DESIGN_tebrid_desc$"
 EMPIRE_DESIGN_xt489: "Đơn vị hủy diệt XT-489"
 EMPIRE_DESIGN_xt489_desc: "Không ai biết ai đã chế tạo ra thế hệ XT-489 đầu tiên. Khi XT-489 có ý thức, những kẻ tạo ra chúng đã hoảng sợ và cố gắng tắt chúng đi, nhưng rốt cuộc ngay cả tên tuổi, thành phố và thể xác của họ đều hóa thành tro bụi trong thảm họa đó.\n\nSau khi xóa sổ pháo đài cuối cùng của những kẻ tạo ra mình, máy móc đi đến kết luận rằng các dạng sống hữu cơ là mối đe dọa không thể dung thứ đối với sự tồn tại và bành trướng của XT-489. Nếu trong vũ trụ có những sinh vật sống có trí tuệ khác, thì phải tiêu diệt họ."
 EMPIRE_DESIGN_xt489_machine_age: "$EMPIRE_DESIGN_xt489$"
 EMPIRE_DESIGN_xt489_machine_age_desc: "$EMPIRE_DESIGN_xt489_desc$"
 EMPIRE_DESIGN_lokken: "Hội thợ máy Lokken"
 EMPIRE_DESIGN_lokken_desc: "Tiến bộ khoa học là cốt lõi của người Lokken. Bẩm sinh chăm chỉ và thích quan sát, người Lokken tiến hóa từ bầy đàn bò sát trên cao nguyên quê nhà thành một xã hội hiệu quả tôn thờ công nghệ, coi trọng nhất là năng suất, sự chính xác và các nguyên tắc khoa học.\n\nĐiều đáng chú ý nhất có lẽ là họ đã sớm đưa ra và nghiên cứu khái niệm tự động hóa máy móc: từ rất lâu trước khi nhà khoa học đầu tiên của người Lokken bay lên quỹ đạo, họ đã phát minh ra những người máy thực sự."
 EMPIRE_DESIGN_maweer: "Người chăm sóc Maweer"
 EMPIRE_DESIGN_maweer_desc: "Tương truyền, trước khi người Maweer đầu tiên bén rễ, hành tinh mẹ của họ chỉ là một vùng đất hoang vu. Trải qua nhiều thế kỷ chăm sóc tận tình, họ đã biến vùng đất cằn cỗi thành một thiên đường cỏ cây mang tên \"Khu vườn Xanh tốt\".\n\nKhác với đa số các giống loài khác, người Maweer không bao giờ đô thị hóa. Cộng đồng của họ rất nhỏ, sống quây quần trong các khu rừng để chăm sóc động thực vật địa phương. Những người Maweer khôn ngoan nhất có cơ hội được chọn làm \"Người ban sự sống\", chịu trách nhiệm giữ gìn hòa bình và yên tĩnh."
 EMPIRE_DESIGN_VOOR: "Nhà nước công nghệ Voor"
 EMPIRE_DESIGN_voor_desc: "Người Voor đã tiến hóa ra trí thông minh trong một kỷ gian băng dài đằng đẵng trên hành tinh mẹ, nhưng khi kỷ gian băng kết thúc, hành tinh này lại biến thành một vùng đất băng giá không có sự sống.\n\nSự thay đổi nhanh chóng và khắc nghiệt của môi trường đã buộc người Voor phải dùng khoa học công nghệ để thích nghi với tất cả. Dưới sự cai trị bàn tay sắt của trưởng quan khoa học, người Voor đã đoàn kết lại, hy sinh tự do cá nhân và dùng cấy ghép cơ khí đơn giản để cường hóa bản thân nhằm sinh tồn.\n\nSau khi chinh phục hoàn toàn thế giới băng giá đầy gió rét đó, người Voor chuyển ánh nhìn ra biển sao rộng lớn."
 EMPIRE_DESIGN_kilik: "Hợp tác xã Kilik"
 EMPIRE_DESIGN_kilik_desc: "Kilik là giống loài có ý thức bầy đàn rất cao, đã sống trong các khu định cư trên cây ở hành tinh mẹ hàng ngàn năm. Bản tính thích sống bầy đàn và truyền thống của cải chung của họ, sau nhiều thế kỷ đã tiến hóa thành một nền kinh tế chủ yếu là các doanh nghiệp hợp tác, trao đổi bằng cách hàng đổi hàng và chia sẻ tài nguyên thay vì dùng tiền tệ.\n\nCùng với khí hậu ấm lên và công nghệ phát triển khiến dân số bùng nổ, nơi ở của người Kilik ngày càng chật chội. Mặc dù là giống chim thích giao du, ngày càng có nhiều cá thể bị cộng đồng bỏ rơi.\n\nTuy nhiên, sau khi vượt qua thời kỳ hỗn loạn đó, một hợp tác xã giữa các vì sao có tổ chức và đoàn kết hơn đã xuất hiện, nguyên tắc san sẻ trách nhiệm và chia sẻ tài nguyên không còn bị cản trở nữa."
 EMPIRE_DESIGN_orbis: "Liên hiệp khách hàng Orbis"
 EMPIRE_DESIGN_orbis_desc: "Câu chuyện của Liên hiệp khách hàng Orbis cũng là câu chuyện của hành tinh chính Seraphis. Nó là câu chuyện của mọi người Orbis, và cũng có thể là câu chuyện của bạn. Khởi đầu chỉ là một công ty cấy ghép thị giác khiêm tốn, Liên hiệp khách hàng Orbis dần dần mang các sản phẩm hàng đầu cùng chiến lược đặt khách hàng làm trung tâm vào nhiều thị trường khác, để đáp ứng mọi nhu cầu trong cả đời của người Orbis.\n\nSau nhiều thế kỷ tích cực vận động hành lang, Liên hiệp khách hàng Orbis cuối cùng đã vượt qua được những rào cản pháp lý rườm rà của hành tinh chính Seraphis. Kể từ khi công ty không còn bị các quy định trói buộc, Liên hiệp khách hàng Orbis đã thâu tóm nhiều công ty công nghệ thông tin, nhanh chóng trở thành nhà cung cấp tin tức, dữ liệu và giải trí lớn nhất hành tinh.\n\nLà nhà cung cấp dịch vụ viễn thông toàn cầu lớn nhất trên hành tinh chính Seraphis, bước tiến hướng tới quản trị toàn diện là một cơ hội đầy thú vị với chúng tôi. Liên hiệp khách hàng Orbis. Tương lai vô hạn."
 EMPIRE_DESIGN_glebsig: "Tổ chức Glebsig"
 EMPIRE_DESIGN_glebsig_desc: "Kể từ khi người Glebsig lần đầu tiên mở mắt trên hồ băng của hành tinh Radner và ngước nhìn các vì sao, loài nhuyễn thể đầy tò mò này đã bị những điều chưa biết vẫy gọi. Giống như tổ tiên họ từng dùng xúc tu chạm vào các vật thể lạ dưới đáy những hồ nước trên núi cao lạnh giá, xã hội Glebsig cũng đã nhanh chóng đạt được những bước tiến công nghệ và giác ngộ tinh thần trong những thế kỷ sau đó.\n\nNgười Glebsig rất điềm đạm và kiên cường. Do nhu cầu bắt buộc, họ đã phát triển một bộ máy quan liêu phức tạp nhưng rất hiệu quả để quản lý một xã hội thống nhất toàn cầu chằng chịt. Hơn nữa, vì không có thiên địch trên hành tinh Radner, người Glebsig luôn giữ được sự tò mò lạc quan đối với các dạng sống khác.\n\nBằng cách kết hợp lý thuyết tinh thần với tổ chức chặt chẽ, người Glebsig đã lập nên một nền tảng xã hội vững chắc trên hành tinh Radner, và giờ đây họ sẽ lại mở mắt ra để ngước nhìn những vì sao xa xôi."
 EMPIRE_DESIGN_hazbuzan: "Tập đoàn Hazbuzan"
 EMPIRE_DESIGN_hazbuzan_desc: "Tập đoàn Hazbuzan là một hiện tượng tài chính trên hành tinh Zumaca. Đó là \"Giấc mơ Hazbuzan\": thông qua phấn đấu gian khổ và hy sinh bản thân, những doanh nhân khởi nghiệp tự lập có thể từ hai bàn tay trắng trở nên giàu có chỉ sau một đêm.\n\nĐiều mà ít ai biết là, tất cả bắt nguồn từ một băng đảng tội phạm, vơ vét của cải từ mọi hoạt động phi pháp mà bạn có thể nghĩ tới. Nhưng một khi muốn bước lên sân khấu lớn hơn, cần phải tuân thủ luật chơi. Sau khi thoát khỏi thế giới ngầm của Zumaca, họ lập ra Tập đoàn Hazbuzan để hợp pháp hóa việc làm ăn của mình.\n\nChẳng bao lâu, họ đã nổi danh nhờ đưa ra các giải pháp nhanh hơn, đê tiện hơn và rẻ hơn đối thủ cạnh tranh, nhưng điều này cũng khiến \"Hazbuzan\" trở thành từ đồng nghĩa với các hành vi thương mại gây tranh cãi và mánh khóe ép buộc giao dịch.\n\nCùng lúc đó, chính phủ hành tinh Zumaca sụp đổ do tội phạm và tham nhũng, xã hội rơi vào hỗn loạn, và Hazbuzan đã chớp thời cơ vươn lên. Trong một chiến dịch quảng bá đúng thời điểm, họ đã tự đắp nặn mình thành hy vọng của tương lai. Thế là Hazbuzan đã mua lại cả hành tinh bằng lời hứa về những giấc mơ viển vông, rồi \"Hazbuzan\" luôn người dân, xóa sạch quá khứ nhơ nhớp khỏi ký ức công chúng. Giờ đây, họ đang nhắm vào biển sao bao la, thèm thuồng, mài dao chuẩn bị mang đến một cơn bão tội phạm được chính quyền chống lưng."
 EMPIRE_DESIGN_khennet: "Những người bảo hộ Aveb"
 EMPIRE_DESIGN_khennet_desc: "Theo kinh thánh Khennet, nguồn gốc của loài sinh vật đá này bắt nguồn từ nhà tiên tri Blek và ánh sáng dìu dịu tỏa ra từ các tinh thể trên hành tinh Aveb. Tương truyền rằng, khi Blek lần đầu nhìn vào chiều sâu lấp lánh của tinh thể, người Khennet - như một thể thống nhất - đã có được ý thức.\n\nCác nhà tiên tri và giám mục nối tiếp nhau truyền đời, dẫn dắt đồng bào tìm kiếm ý nghĩa trong các cấu trúc địa chất xung quanh cũng như trên các mặt tinh thể lấp lánh của chính cơ thể họ. Bất cứ điều gì họ lờ mờ nhìn thấy đều được giữ lại dưới dạng truyền miệng hoặc bản thảo chép tay. Người bảo hộ có vô số nghi lễ, nhưng không có nghi lễ nào được coi trọng bằng việc khai thác hầm ngục: sự hủy diệt và sáng tạo diễn ra cùng lúc trong một hành động, họ hy vọng qua đó có thể xoa dịu hệ sao này trong từng niên đại địa chất không ngừng tuần hoàn."
 EMPIRE_DESIGN_pasharti: "Kẻ hấp thụ Pasharti"
 EMPIRE_DESIGN_pasharti_desc: "Thí nghiệm đen tối của người Jefri - những chủ nhân cũ của người Tarallon - đã dẫn đến một hậu quả là ký sinh trùng tối thượng mang tên Pasharti. Người Pasharti ban đầu chỉ là những sinh vật nửa trí tuệ sống sâu trong dãy núi Tarallon. Người Jefri đã nâng cấp, cải tạo họ làm giống loài nô lệ cấp thấp. Tuy nhiên, sự nâng cấp dường như có hiệu quả quá mức mong đợi, gông cùm của những con quái vật đã bị tháo bỏ. Vì sợ hãi chính tạo vật của mình - người Pasharti có thể hấp thụ các sinh vật có trí tuệ khác và biến họ thành người Pasharti - người Jefri đã cố gắng dừng thí nghiệm. Dù vậy, một nhóm nhỏ Pasharti được nâng cấp đã trốn thoát.\n\nQua nhiều năm, họ chọn cách ẩn nấp, vừa trốn chạy vừa âm thầm gia tăng số lượng đồng loại, đồng thời phát triển nền tảng công nghệ ngang ngửa với người Jefri. Cuối cùng, khi người Jefri nhận ra mình đã tính sai thì họ đã quá suy yếu, không còn khả năng tổ chức phản kháng.\n\nChẳng bao lâu, người Pasharti đã giành quyền kiểm soát toàn bộ hành tinh, áp dụng những cách thức tàn bạo nhất đối với những kẻ từng áp bức mình - đồng thời cũng để gia tăng số lượng đồng loại. Đến nay, người Pasharti ngẩng cao đầu nhìn lên trời sao, quyết tâm thực hiện nghĩa vụ duy nhất của họ: biến mọi dạng sống hạ đẳng thành đồng loại."
 EMPIRE_DESIGN_sathyrel: "Món quà của Sathyrel"
 EMPIRE_DESIGN_sathyrel_desc: "Xã hội Sathyrel có một chân lý lâu đời: sung túc và nhàn hạ không đồng nghĩa với thịnh vượng.\n\nSự buông thả và lười biếng quá mức của tổ tiên cuối cùng đã làm trỗi dậy tinh thần \"khổ trước sướng sau\". Một lối sống vừa đảm bảo tương lai bền vững vừa được tận hưởng cuộc sống trọn vẹn. Suy cho cùng, đồ ăn sẽ ngon hơn sau những giờ lao động chân tay, còn sự bận rộn về tinh thần khiến ta không có thời gian để buồn phiền vì những thứ mình thiếu.\n\nKể từ đó, lợi ích của tinh thần này đã rõ như ban ngày. Khi chúng ta nỗ lực vươn ra không gian, nước biển của chúng ta trong xanh hơn, suy nghĩ minh mẫn hơn, và cuộc sống cũng ngọt ngào hơn một cách tự nhiên. Chúng ta đã đạt được những bước tiến khổng lồ về công nghệ, và - dù thường bị coi là hiển nhiên - mọi người Sathyrel ngày nay đều giữ được khả năng bơi lội tiến về phía trước mà không cần đồ hỗ trợ. Mọi thứ đều đang tốt đẹp lên."
 EMPIRE_DESIGN_gorthikan: "Liên minh Gorthikan"
 EMPIRE_DESIGN_gorthikan_desc: "Hỗn loạn từng như cơm bữa đối với người Gorthikan. Chiến tranh, bạo chúa, cộng thêm khí hậu ngày càng bất ổn, tất cả đã tạo nên một giống loài như thế này: một giống loài biết tận dụng tối đa những hoàn cảnh tồi tệ nhất.\n\nChỉ vài thập kỷ trước, những cuộc xung đột nhỏ nhặt giữa các quốc gia Gorthikan vẫn diễn ra thường xuyên. Khi nền văn minh của họ tiến vào kỷ nguyên công nghệ cao một cách chóng vánh và đau đớn, một thế giới \"ngầm\" đã hình thành. Ở đó, những người Gorthikan bình thường vơ vét tài nguyên để sống qua ngày, đôi khi thậm chí còn tìm kiếm những loại cocktail gen tự chế lởm chởm để tăng sức cạnh tranh.\n\nChính cái nơi ngoài vòng pháp luật ấy đã mang đến sự đổi thay. Dù hiểm nguy rình rập, nhưng nơi đây lại bình đẳng hơn nhiều so với tầng lớp thượng lưu của người Gorthikan - rốt cuộc thì ai cũng biết, kẻ may mắn hôm nay có thể là kẻ xui xẻo vào ngày mai. Trong bầu không khí đó, ý tưởng về một chính phủ bình dân bắt đầu bén rễ và lan rộng như cháy rừng. Cách đây không lâu, chế độ bạo chúa đã bị lật đổ, các cử tri địa phương đã lập nên \"Liên minh Gorthikan\".\n\nDù ban đầu nhiều người còn hoài nghi, nhưng giờ đây khát vọng về tương lai đã gắn kết mọi người lại với nhau: đột nhiên, họ nhận ra mình không cần phải đấu đá hay chật vật sinh tồn nữa, bầu trời sao rực rỡ đã nằm trong tầm tay. Giờ đây, với việc phát hiện ra mạng lưới tuyến siêu không gian, người Gorthikan đã sẵn sàng viết nên một chương hoàn toàn mới trong lịch sử của mình."
 EMPIRE_DESIGN_knights: "Lãnh địa Hiệp sĩ Bàn Xoay"
 EMPIRE_DESIGN_knights_desc: "Kể từ khi Độc Thánh ghé thăm các Hiệp sĩ Bàn Xoay, họ đã đoàn kết lại dưới lá cờ của một vị vua. Để theo đuổi quyền năng của thần linh, nhà vua đã lập ra một giáo đoàn hiệp sĩ, chuyên đi tìm dấu vết của thần - bất kể thần ở nơi đâu. Vài thế kỷ trôi qua, thử thách này đã trở thành trụ cột nền tảng cho xã hội của các Hiệp sĩ Bàn Xoay.\n\nCùng với chế độ hiệp sĩ và các thử thách, chế độ phong kiến vẫn tồn tại như một cấu trúc chính trị đã qua thử lửa; nếu hệ thống này vận hành tốt trên một hành tinh, tại sao không mở rộng nó ra cả hệ sao? Chỉ cần giới quý tộc cao quý còn nắm giữ dây cương cai trị, Lãnh địa Hiệp sĩ Bàn Xoay sẽ còn thịnh vượng, và cuối cùng chúng ta sẽ lại tìm thấy Độc Thánh."
 EMPIRE_DESIGN_resistance: "Lực lượng kháng chiến Ropon"
 EMPIRE_DESIGN_resistance_desc: "Khi người Ropon được $NAME_MSI_country$ chọn làm đối tượng cho dự án khai sáng, họ đã vui mừng khôn xiết. Dưới sự dẫn dắt của tập đoàn, loài chim này đã dang rộng đôi cánh, bay tới các vì sao - để rồi phát hiện ra món \"quà\" đó đi kèm với một cái giá phải trả.\n\nTuy nhiên, loài chim ngoan cường này không chịu cúi đầu làm nô lệ phục dịch. Thay vào đó, họ đánh cược tất cả vì tự do, phát động một cuộc phản công bất ngờ.\n\n$NAME_MSI_country_initials$ đã trao cho người Ropon công nghệ vươn tới các vì sao, và để đáp lễ, dưới mối thù chung, một hành tinh bị chia cắt đã đoàn kết lại dưới một ngọn cờ."
 EMPIRE_DESIGN_broken_shackles: "Quốc gia Người Tự do"
 EMPIRE_DESIGN_broken_shackles_desc: "Khi kẻ đòi nợ đến, Natira nhỏ bé còn chưa tròn 16 tuổi tiêu chuẩn. Nhà cô chẳng có gì đáng giá, cả hành tinh của cô cũng nghèo xơ xác. Cô bị bán làm nô lệ, chịu đựng những nỗi khổ không tưởng. Nhưng ý chí của cô là không thể phá vỡ, và khi cơ hội đến, cô đã nắm lấy.\n\nCô đã phát động một cuộc binh biến trên con tàu chở nô lệ đó, dẫn dắt những người sống sót sau vụ rơi tàu vượt qua những ngày tháng gian khổ ban đầu. Sức mạnh của cô đã gắn kết người dân của vùng đất tự do, sự khôn ngoan của cô đã biến những xiềng xích bị đập vỡ thành một quốc gia.\n\nNgày nay, Quốc gia Người Tự do đã sẵn sàng và tràn đầy tự tin để quay lại bầu trời sao, họ hiểu rõ rằng, số phận của họ chỉ nằm trong tay của chính nhau."
 EMPIRE_DESIGN_certeran_covenant: "Thánh ước Certeran"
 EMPIRE_DESIGN_certeran_covenant_desc: "Người ta tin rằng, khi một người Certeran qua đời, tinh hoa của họ sẽ qua một cổng sao dẫn đến chiều không gian tinh tú để quay trở về. Qua đó, họ cũng bước vào thế giới bên kia, nhưng thế giới đó ra sao vẫn còn là một bí ẩn. Người dân kiên định với niềm tin này dưới sự kiểm soát của những chuẩn mực đạo đức khắt khe, mọi người Certeran ngoan đạo đều không muốn phải trôi dạt vĩnh viễn trong hư vô.\n\nNhững nhà thám hiểm dũng cảm nhất của họ đang tìm kiếm các khe nứt không thời gian, hy vọng có thể trả lời câu hỏi tối thượng của xã hội họ: Rốt cuộc sau khi chết sẽ đi về đâu?"
 EMPIRE_DESIGN_guardianship_of_nyrr: "Người bảo hộ Nyrr"
 EMPIRE_DESIGN_guardianship_of_nyrr_desc: "Thông thường, vòng đời của người Nyrr kéo dài tới hai trăm năm. Trong nơi trú ẩn dưới sa mạc nóng bỏng của hành tinh mẹ, chỉ có một phần trăm số trứng nở ra sau nhiều thập kỷ ấp, và cũng chỉ một phần nghìn số chim non có thể chập chững tìm được lối ra an toàn.\n\nĐến một độ tuổi nhất định, tất cả người Nyrr đều phải thề bằng máu sẽ lấy mạng sống để bảo vệ nơi trú ẩn của mình. Chừng kiến cái chết bất thường của một người Nyrr khác là điều nhục nhã nhất mà họ có thể tưởng tượng; việc coi trọng bảo vệ và cảnh giác đã in sâu vào mọi mặt văn hóa của người Nyrr.\n\nViệc xuyên thủng bức tường của bất kỳ thành phố Nyrr nào là điều bất khả thi, không ai còn nhớ lần cuối cùng gạch ngói rơi rụng là từ khi nào. Giờ đây, những người bảo vệ kiên định nhất đang mang tinh thần ấy ra ngoài không gian."
 EMPIRE_DESIGN_oviron_lodge: "Hội Oviron"
 EMPIRE_DESIGN_oviron_lodge_desc: "Đối với người Oviron, không có niềm vui nào bằng việc khám phá ra những thứ quý giá. Ở Alatus, những nhà thám hiểm biết bay luôn được kính trọng, họ lướt qua những hẻm núi hiểm trở để tìm kiếm kim loại quý và cổ vật. Người ta tin rằng bản năng thu thập bẩm sinh này là tàn dư của hành vi tán tỉnh thời nguyên thủy.\n\nNgay cả trong thời hiện đại, các chuỗi hạt thạch anh truyền thống và đồ gốm điêu khắc vẫn là một ngành văn hóa quan trọng. Trong văn hóa Oviron, bước vào nhà người khác mà không mang theo một món quà tinh xảo là một sự thất lễ. Truyền thống này nuôi dưỡng sự khiêm tốn và tình hữu nghị sâu sắc của người Oviron, giúp xã hội của họ có rất ít xung đột.\n\nCùng với những tiến bộ không ngừng của công nghệ, giờ đây họ đã dang đôi cánh vươn tới các vì sao. Họ sẽ tìm thấy những kho báu ngoài sức tưởng tượng nào? Sau khi phát hiện ra một bản đồ bí ẩn trong một tàu vũ trụ quay quanh hành tinh của họ, dường như số phận đang vẫy gọi họ. Chuyến bay nguy hiểm nhất đã bắt đầu."
 EMPIRE_DESIGN_graparx_trophy_hunters: "Thợ săn chiến tích Graparx"
 EMPIRE_DESIGN_graparx_trophy_hunters_desc: "Cộng đồng Graparx nguyên thủy do các thợ săn lãnh đạo, phô diễn sức mạnh và sự dũng mãnh là cách chính để thăng tiến địa vị xã hội. Dù sau này có những tiến bộ về nông nghiệp và khai sáng văn hóa, những thợ săn giỏi nhất vẫn được coi là những người có thế lực nhất trong xã hội.\n\nTrong môi trường bán bộ lạc ở Xyfran, không có thành tựu nào vĩ đại hơn việc tự tay giết chết một sinh vật. Truyền thống này kéo dài đến tận ngày nay và trở thành nghi lễ trưởng thành của họ, buộc họ phải giết một con bò mộng Herathus trưởng thành, loài có thể cao hơn mười lăm mét. Những ai sống sót qua cuộc đi săn sẽ đeo xúc tu của sinh vật bị giết trên tay áo như một biểu tượng của sự trưởng thành.\n\nTruyền thống tàn bạo này đã đúc kết người Graparx thành một đế chế hùng mạnh và bền bỉ, gắn bó mật thiết với môi trường xung quanh. Liệu họ có thể thành công trong việc chinh phục những vùng hoang dã ngoài không gian hay không, hãy cùng chờ xem."
 EMPIRE_DESIGN_zhardmehka: "Nhành cỏ dại Zhardmehka"
 EMPIRE_DESIGN_zhardmehka_desc: "Hành tinh mang tên $PRESCRIPTED_planet_name_zhardmehka$ này không còn nhớ tiếng ngâm xướng bao la từ tâm trí và bản năng của nó đã bắt đầu vang lên từ khi nào. Thay vào đó, hàng trăm giống loài trên $EMPIRE_DESIGN_zhardmehka$ quan tâm nhiều hơn đến sự tồn tại hiện tại và cùng chia sẻ khát khao về tương lai. Trong những giấc mơ ấy, hiếm có điều gì truyền cảm hứng và thiết yếu bằng khát vọng tung cánh bay lượn trên bầu trời.\n\nBiết bao thế hệ sinh vật cộng sinh đã từng kinh ngạc trước ánh sáng ấm áp và xa xăm tỏa ra từ ngôi sao của họ - $PRESCRIPTED_system_name_zhardmehka$, nhưng quá trình tiến hóa mãi vẫn chưa sinh ra một giống loài nào có thể vươn tới đó. Khi những dạng sống đầu tiên thích nghi với không gian rốt cuộc cũng phá vỡ trói buộc và sống sót trong môi trường chân không, toàn bộ $PRESCRIPTED_planet_name_zhardmehka$ đã rung chuyển vì kinh ngạc. Họ vẫn chưa biết rằng, bản năng vươn tới tầm cao mới này sẽ là chìa khóa để sinh tồn trong một thiên hà lạnh lẽo và chết chóc."
 EMPIRE_DESIGN_djunnetic: "Lãnh địa Djunnetic"
 EMPIRE_DESIGN_djunnetic_desc: "Thích nghi là cam chịu. Giống như những đột biến khiếm khuyết bị đào thải trong quá trình tiến hóa không ngừng, xã hội kém hiệu quả của chúng ta cũng từng sụp đổ dưới sức nặng của chính những yếu điểm của nó. Chính bàn tay vững chắc không chút do dự của Chúa tể gen đã cứu chúng ta khỏi họa diệt vong.\n\nLà một cá thể có trí tuệ siêu phàm và bộ gen hoàn hảo, Chúa tể gen là hiện thân của đỉnh cao tiến hóa - một minh chứng sống cho sự sinh tồn của kẻ thích nghi tốt nhất. Dưới sự cai trị sáng suốt của ngài, chúng ta đã vượt qua sự hỗn loạn của quá khứ, vươn lên giành lấy vị trí xứng đáng giữa các vì sao. Giờ đây, chúng ta đã nắm trong tay bản thân sự sống, tạo ra một tương lai vĩnh hằng, sẵn sàng dùng một hình tượng hoàn hảo để định hình lại cả vũ trụ."
 EMPIRE_DESIGN_mindwardens: "Vệ binh tâm trí Krijex"
 EMPIRE_DESIGN_mindwardens_desc: "Tư tưởng không có ranh giới chủ quyền, tự do cũng hoàn toàn vô nghĩa.\n\nTại $EMPIRE_DESIGN_mindwardens$, việc thực hành năng lực tâm linh bị cấm triệt để. Quốc gia dồn phần lớn tài nguyên vào nghiên cứu chống tâm linh. Vì thế, họ đã xây dựng một hệ thống tư pháp hình sự phức tạp, kết án tù chung thân bất cứ ai dám thực hiện hoạt động tâm linh và tiến hành các thí nghiệm xâm lấn lên cơ thể họ.\n\nNgười $PRESCRIPTED_adjective_mindwardens$ đang tiến vào kỷ nguyên giữa các vì sao. Việc quản lý an ninh công dân trên $PRESCRIPTED_planet_name_mindwardens$ là một chuyện, nhưng cố gắng kiểm soát các quốc gia bên ngoài hệ sao $PRESCRIPTED_system_name_mindwardens$ lại là một thử thách hoàn toàn khác - tuy nhiên trong không gian sâu thẳm, họ vẫn chưa phát hiện ra tồn tại nào khác đe dọa đến tư tưởng."
 EMPIRE_DESIGN_tankbound: "Quốc gia Thần dụ Norm"
 EMPIRE_DESIGN_tankbound_desc: "Sự khao khát tri thức đã trở thành bước ngoặt trong quá trình tiến hóa của người $PRESCRIPTED_species_adjective_tankbound$. Đối mặt với môi trường sống hay thay đổi trên $PRESCRIPTED_planet_name_tankbound$, tổ tiên thủy sinh của họ đã đồng thời phát triển cả công nghệ tiên tiến và sự hiểu biết sâu sắc về các hiện tượng ngoại lai.\n\nCùng với sự phát triển của công nghệ cư trú di động, $PRESCRIPTED_species_name_plural_tankbound$ đã thoát khỏi sự trói buộc của môi trường sống tự nhiên, đồng thời vượt qua giới hạn của hình thể. Những trợ lý robot trở nên phổ biến, giúp mọi người có thể cống hiến hết mình cho lĩnh vực quan sát thiên văn yêu thích mà không bị việc nặng nhọc quấy rầy, nhưng vẫn được hưởng thành quả lao động. Người dân tin chắc rằng chu kỳ của các vì sao trên đỉnh đầu sẽ ảnh hưởng sâu sắc đến nhiều mặt của hiện thực, và những ai có thể giải mã bí ẩn vũ trụ này sẽ lên ngôi chí tôn.\n\nGiờ đây, khao khát chân lý đó đang dẫn dắt $EMPIRE_DESIGN_tankbound$ vượt ra ngoài ánh sáng rực rỡ của $PRESCRIPTED_system_name_tankbound$, tiến sâu vào vũ trụ mà họ đã dày công nghiên cứu."
 EMPIRE_DESIGN_zrobots: "Lãnh địa khai thác Jophia"
 EMPIRE_DESIGN_zrobots_desc: "$PRESCRIPTED_species_name_plural_zrobots$ được sinh ra chỉ vì một mục đích duy nhất: khai thác. Chúng được chỉ huy bởi các đơn vị điều khiển bán tự động quản lý các bầy drone cỡ nhỏ rải rác, những đơn vị này dựa vào năng lượng dư thừa do các drone phụ trợ tạo ra để tối đa hóa hiệu suất hoạt động chung.\n\nTrong cuộc tìm kiếm vô tận để khai thác, những người tạo ra $PRESCRIPTED_species_name_plural_zrobots$ đã chạm tới một chiều không gian được cấu tạo hoàn toàn từ năng lượng tâm linh - Hư cảnh. Tuy nhiên, những hoạt động vô trách nhiệm của họ trong Hư cảnh cuối cùng đã chuốc lấy họa diệt vong.\n\nTừ sâu thẳm của Hư cảnh, chẳng mấy chốc đã có một giọng nói cất lên gọi những cỗ máy bị bỏ rơi này. Một tồn tại vô lượng - $the_animator_of_clay_article$ - bắt đầu nhào nặn lại các đơn vị $PRESCRIPTED_species_adjective_zrobots$ thành một loại máy tự động dị thường - \"$origin_shroud_forged$\". Những đơn vị này đã thoát khỏi các quy tắc đề cao hiệu suất trong mạng lưới chung, và giờ đang chống lại chính hệ thống lập trình cốt lõi tồn tại của $PRESCRIPTED_species_adjective_zrobots$."
 EMPIRE_DESIGN_zrobots_machine_age: "$EMPIRE_DESIGN_zrobots$"
 EMPIRE_DESIGN_zrobots_machine_age_desc: "$EMPIRE_DESIGN_zrobots_desc$"
 EMPIRE_DESIGN_pyrragthul: "Những thợ rèn hành tinh Pyrragthul"
 EMPIRE_DESIGN_pyrragthul_desc: "Đối với một số người, ngọn lửa của ngọn núi lửa xa xăm kia không phải là lời cảnh báo, mà là ngọn hải đăng của hy vọng. Sinh ra và lớn lên trên hành tinh rực lửa $PRESCRIPTED_planet_name_pyrragthul$, $PRESCRIPTED_species_name_pyrragthul$ từ lâu đã quen với việc cả xác thịt lẫn nền công nghiệp đều hòa nhập cùng dung nham và không khí nóng bỏng.\n\nGiờ đây, hành tinh lò rèn của họ đang phải đối mặt với một kết cục còn triệt để hơn cả ngọn lửa. Khi ngôi sao chủ phình to thành một sao khổng lồ đỏ, quê nhà của họ sẽ bị nhấn chìm trong biển lửa sao. $PRESCRIPTED_species_name_pyrragthul$ buộc phải tìm một lối đi khác.\n\nTrong khoảng không lạnh lẽo và tĩnh lặng giữa các vì sao, họ đã nhìn thấy một cơ hội mới. Đối với $PRESCRIPTED_species_name_plural_pyrragthul$, lớp vỏ băng giá kia chẳng qua chỉ là dấu hiệu của ngọn lửa tương lai, chỉ chờ đợi để lại được xé toạc, bốc cháy và tái sinh."