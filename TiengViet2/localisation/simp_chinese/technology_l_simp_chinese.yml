 ####################################
 # Nhánh Súng Phóng Khối Lượng
 tech_mass_drivers_1: "Súng Phóng Khối Lượng"
 tech_mass_drivers_1_desc: "Máy phóng đạn điện từ này sử dụng nam châm để gia tốc đạn xuyên giáp lên một vận tốc cực lớn."
 tech_mass_drivers_2: "Súng Coilgun"
 tech_mass_drivers_2_desc: "Súng Coilgun là phiên bản nâng cấp của súng phóng khối lượng đời đầu, sử dụng các cuộn dây điện từ để gia tốc đạn một cách hiệu quả hơn."
 tech_mass_drivers_3: "Súng Railgun"
 tech_mass_drivers_3_desc: "Railgun là khẩu pháo gia tốc điện từ tân tiến nhất, sử dụng hai đường ray song song để đẩy đạn bay ra ngoài với một vận tốc không tưởng."
 tech_mass_drivers_4: "Súng Railgun Tân Tiến"
 tech_mass_drivers_4_desc: "Phiên bản mới của khẩu Railgun cổ điển, sử dụng các thanh ray cứng cáp hơn và được bơm thêm năng lượng. Loại vũ khí này uy lực hơn và chuẩn xác hơn nhiều so với trước đây."
 tech_mass_drivers_5: "Pháo Gauss"
 tech_mass_drivers_5_desc: "Sau khi nâng cấp thiết kế cuộn cảm điện từ đời cũ, phiên bản mới này mang đến sức tàn phá thậm chí còn vượt xa cả súng Railgun tối tân nhất. Nó bắn nhanh hơn và chính xác hơn rất nhiều."
 tech_kinetic_artillery_1: "Pháo Động Năng"
 tech_kinetic_artillery_1_desc: "Khẩu pháo có tầm bắn cực xa, hỏa lực dữ dội và độ chính xác vô cùng đáng gờm."
 tech_kinetic_artillery_2: "Pháo Động Năng Tân Tiến"
 tech_kinetic_artillery_2_desc: "Hệ thống hỏa lực hạm đội tầm xa mạnh mẽ hơn, được trang bị bệ phóng và hệ thống kiểm soát hỏa lực phiên bản nâng cấp."
 tech_mass_accelerator_1: "Pháo Mega"
 tech_mass_accelerator_1_desc: "Một khẩu pháo gia tốc khối lượng khổng lồ chỉ có thể lắp đặt trên bệ vũ khí trục tàu. Có khả năng nã những phát đạn đầy uy lực từ một khoảng cách cực xa."
 tech_mass_accelerator_2: "Pháo Giga"
 tech_mass_accelerator_2_desc: "Khẩu pháo gia tốc khối lượng vô địch này có thể dễ dàng xé toạc cả những tấm khiên phòng thủ vững chãi nhất."
 # Nhánh Pháo Tự Động
 tech_autocannons_1: "Pháo Tự Động"
 tech_autocannons_1_desc: "Vũ khí đạn đạo cỡ nòng lớn, bắn ra các vỏ đạn bị quăng đi. Lợi thế cốt lõi của những khẩu súng máy này là tốc độ xả đạn cực nhanh."
 tech_autocannons_2: "Pháo Tự Động Cắt Xé"
 tech_autocannons_2_desc: "Những khẩu pháo tự động nâng cấp này sở hữu khả năng bám đuôi mục tiêu và hệ thống kiểm soát hỏa lực hoàn thiện hơn, qua đó tốc độ bắn cũng được gia tăng."
 tech_autocannons_3: "Pháo Tự Động Bão Lửa"
 tech_autocannons_3_desc: "Sở hữu thiết kế tân tiến, khẩu pháo tự động này có khả năng trút cả một cơn mưa đạn có sức công phá cao lên đầu mục tiêu."
 tech_flak_batteries_1: "Pháo Phòng Không"
 tech_flak_batteries_1_desc: "Pháo phòng không có thể nã đạn ghém ở cự ly gần, gây sát thương khủng khiếp cho phi thuyền chiến đấu địch, đương nhiên nó cũng có thể đánh chặn tên lửa."
 tech_flak_batteries_2: "Pháo Cối Phòng Không"
 tech_flak_batteries_2_desc: "Phiên bản pháo phòng không nâng cấp được trang bị các loại đạn ghém đời mới với sức công phá ác liệt hơn."
 tech_flak_batteries_3: "Pháo Phòng Không Hạng Nặng"
 tech_flak_batteries_3_desc: "Ứng dụng thuật toán theo dõi dự đoán kết hợp cùng hỏa lực bắn loạt uy lực, những khẩu pháo này mang trong mình khả năng tiêu diệt phi thuyền địch đến khó tin."
 # Nhánh Tên Lửa
 tech_missiles_1: "Tên Lửa Hạt Nhân"
 tech_missiles_1_desc: "Tên lửa không gian được gắn đầu đạn hạt nhân phân khối lớn. Dù là một tàn dư công nghệ cũ kỹ từ trước kỷ nguyên vũ trụ, thứ vũ khí dẫn đường thô sơ này lại có hiệu quả cao đến bất ngờ nếu ở trong tầm bắn."
 tech_missiles_2: "Tên Lửa Nhiệt Hạch"
 tech_missiles_2_desc: "Tên lửa không gian sâu phiên bản nâng cấp, được trang bị đầu đạn nhiệt hạch uy lực hơn, cải thiện đáng kể năng lực bay."
 tech_missiles_3: "Tên Lửa Phản Vật Chất"
 tech_missiles_3_desc: "Những tên lửa tối tân này được trang bị đầu đạn phản vật chất vô cùng đáng gờm. Hệ thống định vị hoàn thiện cũng giúp tăng cường khả năng dò tìm mục tiêu."
 tech_missiles_4: "Tên Lửa Lượng Tử"
 tech_missiles_4_desc: "Thế hệ tên lửa không gian sâu mới nhất, được gắn đầu đạn với uy lực kinh hồn bạt vía, có thể hút lấy năng lượng chân không điểm không trực tiếp từ môi trường."
 tech_missiles_5: "Tên Lửa Marauder"
 tech_missiles_5_desc: "Loại tên lửa đỉnh cao này tích hợp một hệ thống trí tuệ nhân tạo điều hướng cơ bản, giúp nâng tầm khả năng truy lùng mục tiêu và hiệu suất của tên lửa."
 tech_swarmer_missiles_1: "Tên Lửa Bầy Đàn"
 tech_swarmer_missiles_1_desc: "Những quả tên lửa cỡ nhỏ này có thể khai hỏa thành từng bầy, được thiết kế chuyên biệt để khắc chế hệ thống phòng thủ điểm của địch."
 tech_swarmer_missiles_2: "Tên Lửa Lốc Xoáy"
 tech_swarmer_missiles_2_desc: "Công nghệ thu nhỏ tân tiến cho phép chúng ta nhồi nhét những đầu đạn uy lực hơn vào tên lửa bầy đàn, đồng thời cường hóa khả năng bay của chúng."
 # Nhánh Ngư Lôi
 tech_torpedoes_1: "Ngư Lôi Không Gian"
 tech_torpedoes_1_desc: "Ngư lôi thực chất chỉ là những quả tên lửa khổng lồ bay chậm rì. Chúng được gắn thêm đầu đạn sát thương cao cùng máy điều biến khiên bảo vệ, giúp chúng có thể an toàn xuyên thủng các hàng rào năng lượng."
 tech_torpedoes_2: "Ngư Lôi Bọc Giáp"
 tech_torpedoes_2_desc: "Ngư lôi không gian sau khi nâng cấp được đắp thêm một lớp giáp, giúp chúng chống chịu tốt hơn trước hệ thống phòng thủ điểm của kẻ địch. Khi phát nổ, những mảnh giáp vỡ vụn của ngư lôi cũng sẽ văng ra và gây thêm sát thương phụ."
 tech_torpedoes_3: "Ngư Lôi Kẻ Hủy Diệt"
 tech_torpedoes_3_desc: "Loại ngư lôi tân tiến bọc một đầu đạn siêu hạng. Sở hữu một thiết kế thon gọn hơn, động cơ phản lực nhanh hơn và máy điều biến khiên cải tiến giúp nó dễ dàng luồn lách qua các hàng rào năng lượng."
