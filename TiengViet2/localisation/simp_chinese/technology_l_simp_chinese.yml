 # Công Nghệ Đế Chế Máy Móc
 #####################################
 tech_probability_theory: "Xác Suất Học Sinh Vật Hữu Cơ"
 tech_probability_theory_desc: "Nhờ vào hệ thống mô phỏng toán học đủ tinh vi, chúng ta có thể dự đoán được phần nào những biến động kinh tế của các giống loài hữu cơ. Chúng ta có thể tận dụng cơ hội này để thao túng thị trường chứng khoán của họ nhằm chuộc lợi cho bản thân."
 tech_binary_motivators: "Chương Trình Thúc Đẩy Nhị Phân"
 tech_binary_motivators_desc: "Các chương trình thúc đẩy tiên tiến này nhẹ hơn nhiều so với phiên bản trước, cho phép các đơn vị robot có thêm khoảng trống để phân bổ cho các hệ thống phụ."
 tech_nanite_assemblers: "Máy Lắp Ráp Nano"
 tech_nanite_assemblers_desc: "Sử dụng các nanobot được lập trình sẵn để hỗ trợ lắp ráp các đơn vị máy móc mới, cho phép chúng sở hữu những bản mẫu tiên tiến hơn và được trang bị nhiều hệ thống phụ hơn."
 tech_adaptive_combat_algorithms: "Thuật Toán Tác Chiến Thích Ứng"
 tech_adaptive_combat_algorithms_desc: "Các sinh vật hữu cơ thường áp dụng những chiến thuật phi logic và khó lường, điều này khiến chúng ta gặp nhiều khó khăn trong việc đối phó hiệu quả. Nhưng với các chiến thuật thích ứng cùng những chiến thể mới cơ động hơn, chúng ta sẽ giành được lợi thế quyết định."
 tech_biomechanics: "Cơ Sinh Học"
 tech_biomechanics_desc: "Trải qua hàng triệu năm tiến hóa không ngừng nghỉ, đôi khi sinh vật hữu cơ lại tìm ra được những giải pháp thanh lịch và tối giản đến bất ngờ. Chúng ta có thể ứng dụng những điều này vào thiết kế máy móc của mình."
 tech_singularity_core: "Lõi Điểm Kỳ Dị"
 tech_singularity_core_desc: "Việc nghiên cứu một hố đen bị thu giữ bên trong môi trường được kiểm soát sở hữu giá trị khoa học vô cùng to lớn."
 tech_micro_replicators: "Máy Nhân Bản Vi Mô"
 tech_micro_replicators_desc: "Những cỗ máy nhân bản được trang bị thiết bị hiển vi cho phép chúng ta sao chép ra các drone mang nhiều chi tiết vô cùng phức tạp."
 tech_self_assembling_components: "Linh Kiện Tự Lắp Ráp"
 tech_self_assembling_components_desc: "Lấy cảm hứng từ DNA của sinh vật hữu cơ, những trí tuệ cơ khí siêu nhỏ này có thể tự động lắp ghép thành hầu hết các bộ phận cần thiết cho những drone đời mới."
