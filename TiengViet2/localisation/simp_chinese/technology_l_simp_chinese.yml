 # Căn cứ sao
 tech_starbase_1: "Xây Dựng Căn Cứ Sao"
 tech_starbase_1_desc: "Để khai thác triệt để tài nguyên trong hệ sao, chúng ta cần thiết lập một cơ sở không gian tập trung ở quỹ đạo gần với ngôi sao trung tâm."
 tech_starbase_2: "Cảng Sao"
 tech_starbase_2_desc: "Những căn cứ sao thuở ban đầu chỉ là các tiền đồn tạm bợ. Việc có được một Cảng sao kiên cố sẽ đảm bảo chúng ta kiểm soát chặt chẽ hệ sao này."
 tech_starbase_3: "Cứ Điểm Sao"
 tech_starbase_3_desc: "Khi lưu lượng giao thông không gian ngày một tăng, chúng ta cần những căn cứ sao lớn và đáng tin cậy hơn để duy trì quyền kiểm soát các tuyến hàng hải trong hệ sao."
 tech_starbase_4: "Pháo Đài Sao"
 tech_starbase_4_desc: "Những pháo đài không gian hùng mạnh này sẽ đóng vai trò là cứ điểm cho mọi hoạt động quân sự trong hệ sao, sự hiện diện của chúng đủ sức đẩy lùi cả những kẻ thù ngoan cố nhất."
 tech_starbase_5: "Thành Trì Sao"
 tech_starbase_5_desc: "Một ý tưởng về trạm không gian quân sự khổng lồ có khả năng một mình chống chọi với nhiều hạm đội tấn công đang được phác thảo. Khi trở thành hiện thực, những Thành trì sao này sẽ là đài kỷ niệm vĩ đại ngự trị ở trung tâm hệ sao."
 tech_modular_engineering: "Kỹ Thuật Mô-đun"
 tech_modular_engineering_desc: "Tối ưu hóa quy trình xây dựng căn cứ sao bằng thiết kế mô-đun, giúp cắt giảm chi phí và thời gian thi công hiện tại."
 tech_defense_platform_hull_1: "Cải Thiện Tính Toàn Vẹn Cấu Trúc"
 tech_defense_platform_hull_1_desc: "Khung sườn được gia cố cùng khiên chống bạo động tăng cường khả năng hấp thụ lực sốc sẽ đảm bảo tính toàn vẹn cấu trúc của nền tảng ngay cả dưới áp lực khổng lồ."
 # Mô-đun Cảng Sao
 #tech_corvette_assembly: "Thiết Kế Tàu Hộ Tống Tân Tiến"
 #tech_corvette_assembly_desc: "Không sử dụng" # TẠM THỜI
 #tech_destroyer_assembly: "Thiết Kế Khu Trục Hạm Tân Tiến"
 #tech_destroyer_assembly_desc: "Không sử dụng" # TẠM THỜI
 tech_solar_panel_network: "Công Nghệ Chuyển Hóa Năng Lượng Quỹ Đạo"
 tech_solar_panel_network_desc: "Công nghệ tấm pin mặt trời tiên tiến có thể bù đắp chi phí vận hành của các căn cứ sao. Tuy nhiên, những tấm pin này cần chiếm dụng một mô-đun của căn cứ để có thể sản xuất đủ năng lượng."
 tech_mining_terminal: "Nghiệp Đoàn Khai Khoáng"
 tech_mining_terminal_desc: "Các nghiệp đoàn khai khoáng có tổ chức sẽ giám sát hiệu quả việc khai thác tài nguyên trong hệ sao. Họ có thể đưa những thợ mỏ độc lập chuyên đào bới tự do vào khuôn khổ, từ đó gia tăng đáng kể sản lượng."
 tech_zero_gravity_assembly_sequence: "Khung Lắp Ráp Không Trọng Lực"
 tech_zero_gravity_assembly_sequence_desc: "Những khung cấu trúc này được trang bị vô số công cụ hữu ích, giúp công nhân làm việc tại các công trường trên quỹ đạo an toàn và nhanh chóng hơn. Các nhiệm vụ ngoài không gian chưa bao giờ dễ dàng đến thế."
 # Phi Thuyền Chiến Đấu
 tech_strike_craft_1: "Tác Chiến Hàng Không Mẫu Hạm"
 tech_strike_craft_1_desc: "Phi thuyền chiến đấu có người lái tầm ngắn, sở hữu tốc độ cao, kích thước nhỏ gọn và khả năng sinh tồn đột phá mạnh mẽ."
 tech_strike_craft_2: "Phi Thuyền Chiến Đấu Cải Tiến"
 tech_strike_craft_2_desc: "Thế hệ phi thuyền chiến đấu mới được trang bị hệ thống điện tử hàng không cải tiến, cùng với khả năng cơ động tuyệt vời và kho vũ khí uy lực hơn."
 tech_strike_craft_3: "Phi Thuyền Chiến Đấu Tân Tiến"
 tech_strike_craft_3_desc: "Phi thuyền chiến đấu được nâng cấp toàn diện với hiệu suất vượt xa các phiên bản tiền nhiệm, đây chính là cỗ máy trong mơ của mọi phi công."
 # Quân Đội và Trang Bị - Kỹ Thuật
 tech_planetary_defenses: "Phòng Thủ Hành Tinh"
 tech_planetary_defenses_desc: "Vũ trụ vô tận lạnh lẽo, những kẻ dòm ngó thì xảo quyệt và tàn nhẫn, hãy luôn sẵn sàng để bảo vệ quê hương của chúng ta."
 tech_assault_armies: "Lực Lượng Viễn Chinh Giữa Các Vì Sao"
 tech_assault_armies_desc: "Xâm lược một hành tinh chưa bao giờ là chuyện dễ dàng. Trước khi xuất quân, chúng ta phải giải quyết triệt để bài toán hậu cần và tiếp tế khổng lồ."
 tech_drop_pod: "Khoang Đổ Bộ Quỹ Đạo"
 tech_drop_pod_desc: "Những khoang đổ bộ quỹ đạo dùng một lần này có thể thay thế các tàu đổ bộ mỏng manh, giúp quân ta thả quân trang nhẹ với tốc độ chớp nhoáng, bất chấp mọi địa hình."
 # Linh Kiện Giáp Tàu
 tech_ship_armor_1: "Vật Liệu Tổng Hợp Nano"
 tech_ship_armor_1_desc: "Lớp giáp nano gia cố sẽ tạo thêm một màng bảo vệ, sự hiện diện của nó có thể chính là ranh giới giữa sự sống và cái chết trên chiến trường."
 tech_ship_armor_2: "Vật Liệu Tổng Hợp Gốm-Kim"
 tech_ship_armor_2_desc: "Sự kết hợp giữa nhiều loại kim loại và gốm sứ khác nhau, vừa cứng cáp lại không kém phần dẻo dai."
 tech_ship_armor_3: "Vật Liệu Plasteel"
 tech_ship_armor_3_desc: "Plasteel là sự pha trộn giữa nhựa và kim loại, mang tính đàn hồi cao. Nó không chỉ tăng cường sức mạnh thân tàu mà còn có giá thành sản xuất rẻ."
 tech_ship_armor_4: "Vật Liệu Durasteel"
 tech_ship_armor_4_desc: "Loại vật liệu này vô cùng chắc chắn và chịu lực tốt, là lựa chọn cực kỳ phù hợp cho cấu trúc tàu."
 tech_ship_armor_5: "Vật Liệu Neutronium"
 tech_ship_armor_5_desc: "Với mật độ cực cao và kết cấu siêu cứng, lớp giáp neutronium có thể chống chịu hỏa lực mạnh hơn gấp nhiều lần so với các loại giáp hợp kim thông thường."
 tech_crystal_armor_1: "Lớp Phủ Pha Lê Tổng Hợp"
 tech_crystal_armor_1_desc: "Lớp phủ được truyền tinh thể pha lê giúp thân tàu trở nên bền bỉ hơn."
 tech_crystal_armor_2: "Lớp Phủ Pha Lê Rèn"
 tech_crystal_armor_2_desc: "Việc thêm vật liệu pha lê vào trong quá trình rèn giúp độ cứng của hợp kim được nâng lên một tầm cao mới."
 tech_dragon_armor: "Giáp Vảy Rồng Nhân Tạo"
 tech_dragon_armor_desc: "Vảy của Rồng Ether được cấu tạo từ nhiều lớp cấu trúc nano khoáng chất đặc biệt, có khả năng tự phục hồi. Việc áp dụng các phương pháp chế tạo độc đáo cho phép chúng ta sao chép chính xác những cấu trúc tự liền này."
 tech_armor_hardeners_1: "Gia Cố Giáp"
 tech_armor_hardeners_1_desc: "$ARMOR_HARDENER_1_DESC$"
 tech_armor_hardeners_2: "Gia Cố Giáp Thích Ứng"
 tech_armor_hardeners_2_desc: "$ARMOR_HARDENER_2_DESC$"
 # Linh Kiện Động Cơ Đẩy
 tech_thrusters_1: "Động Cơ Đẩy Hóa Học"
 tech_thrusters_1_desc: "Một loại động cơ đẩy hóa học đơn giản nhưng hiệu quả, hoạt động dựa vào việc đốt cháy chất xúc tác."
 tech_thrusters_2: "Động Cơ Đẩy Ion"
 tech_thrusters_2_desc: "Loại động cơ điện này tạo lực đẩy thông qua việc gia tốc các chùm tia ion, thay vì sử dụng chất phản lực truyền thống."
 tech_thrusters_3: "Động Cơ Đẩy Plasma"
 tech_thrusters_3_desc: "Động cơ đẩy plasma là dạng động cơ điện cao cấp hơn, mang lại cho phi thuyền tốc độ bay cận quang tốc nhanh hơn cùng độ cơ động vượt trội."
 tech_thrusters_4: "Động Cơ Đẩy Xung Nhịp"
 tech_thrusters_4_desc: "Trong điều kiện cận quang tốc, loại động cơ đẩy nhiệt hạch tối tân này có thể mang đến cho con tàu lợi thế về tốc độ và sự linh hoạt vô song."
 tech_afterburners_1: "Buồng Đốt Tăng Lực"
 tech_afterburners_1_desc: "Bộ đẩy uy lực này có thể gia tăng thêm tốc độ chiến đấu, dù phải tiêu thụ một lượng năng lượng khổng lồ."
 tech_afterburners_2: "Buồng Đốt Tăng Lực Tân Tiến"
 tech_afterburners_2_desc: "Phiên bản nâng cấp của buồng đốt tiêu chuẩn này có thể gia tăng mạnh mẽ tốc độ chiến đấu của con tàu."
 # Trạm Quân Sự
 tech_space_defense_station_1: "Phòng Thủ Không Gian Sâu"
 tech_space_defense_station_1_desc: "Công nghệ này sẽ cho phép chúng ta xây dựng các bệ phòng thủ không gian sâu để bảo vệ căn cứ sao của mình."
 tech_space_defense_station_2: "Tiền Đồn Không Gian Sâu"
 tech_space_defense_station_2_desc: "Nhờ vào phương pháp thi công mới, chúng ta có thể thiết lập những trạm phòng thủ với quy mô lớn hơn ngoài không gian sâu."
 tech_space_defense_station_3: "Cứ Điểm Không Gian Sâu"
 tech_space_defense_station_3_desc: "Những cứ điểm quy mô lớn này hệt như các thành phố nổi giữa vũ trụ. Hàng ngàn binh sĩ đồn trú bên trong, hỏa lực của họ có thể sánh ngang với cả một hạm đội."
 tech_space_defense_station_improvement: "Lực Lượng Công Binh"
 tech_space_defense_station_improvement_desc: "Việc thành lập lực lượng công binh hạm đội chuyên trách sẽ đẩy nhanh tiến độ xây dựng bệ phòng thủ không gian sâu, đồng thời giảm thiểu chi phí và gia tăng độ bền cho chúng."
 tech_space_defense_station_improvement_machine_intelligence: "Tối Ưu Hóa Xây Dựng Trạm Không Gian"
 tech_space_defense_station_improvement_desc_machine_intelligence: "Tiến hành đánh giá chuyên sâu về phương pháp xây dựng các trạm phòng thủ hiện tại nhằm khai phá những cải tiến tiềm năng."
 # Công Nghiệp và Robot
 tech_housing_1: "Hệ Thống Kiểm Soát Khí Hậu"
 tech_housing_1_desc: "Khả năng can thiệp vào quy luật khí hậu hành tinh để áp chế các hiện tượng thời tiết thảm khốc sẽ giúp việc bảo trì nhà ở trở nên dễ dàng hơn, cũng như mở ra những khu vực định cư mới."
 tech_housing_2: "Kỹ Thuật Phản Trọng Lực"
 tech_housing_2_desc: "Nhờ vào công nghệ trọng lực định hướng, các tòa nhà trên bề mặt hành tinh có thể vươn đến những độ cao chưa từng thấy mà không lo sụp đổ cấu trúc. Viễn cảnh về những tòa Tháp Babel sẽ không còn xa nữa!"
 tech_housing_agrarian_idyll: "Không Gian Nông Nghiệp Thơ Mộng"
 tech_housing_agrarian_idyll_desc: "Thông qua việc thành lập các công xã nông thôn phụ thuộc vào khí hậu, chúng ta có thể nuôi sống lượng dân số lớn hơn mà không làm phá vỡ lối sống canh tác nông nghiệp."
 tech_mechanized_mining: "Khai Khoáng Cơ Giới Hóa"
 tech_mechanized_mining_desc: "Ứng dụng kỹ thuật cơ khí vào việc khai thác mỏ là nhu cầu thiết yếu đối với bất kỳ xã hội công nghiệp nào."
 tech_basic_industry: "Nền Tảng Công Nghiệp"
 tech_basic_industry_desc: "Thiết lập một nền tảng công nghiệp vững chắc là điều kiện tiên quyết để vươn ra những vì sao."
 tech_powered_exoskeletons: "Khung Xương Ngoài Trợ Lực"
 tech_powered_exoskeletons_desc: "Bộ trang phục khung xương ngoài này có thể gia tăng sức mạnh và tốc độ của người mặc. Ứng dụng quân sự của nó là quá rõ ràng, nhưng nó cũng có thể được dùng để nâng cao hiệu suất lao động."
 tech_powered_exoskeletons_machine_intelligence: "Động Cơ Điện Cải Tiến"
 tech_powered_exoskeletons_desc_machine_intelligence: "Động cơ điện với sức kéo lớn hơn sẽ gia tăng sức chứa cho các đơn vị robot. Các đơn vị khai khoáng có thể vận chuyển nhiều quặng hơn để xử lý, và các cỗ máy chiến tranh cũng có thể mang vác những loại hỏa lực nặng đô hơn."
 tech_mining_1: "Nứt Gãy Thủy Lực Địa Nhiệt"
 tech_mining_1_desc: "Công nghệ nứt gãy thủy lực mới cho phép chúng ta khoan sâu vào lớp vỏ hành tinh, khai thác nguồn tài nguyên địa nhiệt vốn không thể với tới trước đây."
 tech_mining_2: "Khai Thác Lõi Hành Tinh"
 tech_mining_2_desc: "Nhờ vào các giàn khoan khổng lồ, chúng ta có thể tiến hành khai thác những vỉa quặng siêu sâu gần tâm hành tinh."
 tech_mining_3: "Phân Tách Khoáng Sản"
 tech_mining_3_desc: "Sử dụng phương pháp đo phổ tiên tiến kết hợp cùng công nghệ nứt gãy thủy lực và rửa trôi hóa học, chúng ta có thể nhanh chóng bòn rút các mạch khoáng sản ở tầng nông và trung."
 #tech_mining_network_5: "Chiết Xuất Vật Chất Tinh Khiết"
 #tech_mining_network_5_desc: ""
 tech_synchronized_work_patterns: "Mô Hình Làm Việc Đồng Bộ"
 tech_synchronized_work_patterns_desc: "Đồng bộ hóa mô hình làm việc của mạng lưới khai khoáng, qua đó gia tăng thêm hiệu suất sản xuất."
 tech_engineering_1: "Cơ Học Nano"
 tech_engineering_1_desc: "Những bước đột phá xa hơn trong kỹ thuật cơ khí đòi hỏi chúng ta phải đi sâu vào cấp độ hạt nano. Giờ đây, chúng ta đã có thể thao túng các hệ thống vật lý theo những cách thức chưa từng có."
 tech_engineering_2: "Mạch Điện Tự Kết Nối"
 tech_engineering_2_desc: "Giống như cách các nơ-ron thần kinh hữu cơ nảy mầm sợi trục để tái tạo lại những liên kết đã mất, các mạch điện này cũng sở hữu khả năng tự liền. Giờ đây, ngay cả một hệ thống điện toán đơn giản nhất cũng có triển vọng tự phát triển trong quá trình sử dụng."
 tech_engineering_3: "Vật Liệu Siêu Rắn"
 tech_engineering_3_desc: "Đặc tính cơ học lượng tử của những vật liệu này chính là chìa khóa cho trạng thái chồng chất, đánh dấu một bước phát triển mang tính cách mạng trong khoa học vật liệu và công nghệ công nghiệp."
 #tech_engineering_4: "Cấu Trúc Không Điện Trở"
 #tech_engineering_4_desc: "Những vật liệu tiên tiến này hoàn toàn không chịu tác động của lực ma sát, cho phép tuổi thọ cơ học kéo dài đến một mức độ chưa từng thấy. Bằng cách loại bỏ chất bôi trơn vốn luôn cần thiết trước đây, các cấu trúc của chúng ta có thể vận hành trong những môi trường nhiệt độ khắc nghiệt nhất."
 tech_robotic_workers: "Lực Lượng Lao Động Robot"
 tech_robotic_workers_desc: "Đơn vị lao động nhân tạo này là một lực lượng lao động giá rẻ hoàn hảo, có khả năng thực hiện những công việc tay chân nặng nhọc dưới các khẩu lệnh cơ bản, nhưng lại không thể đảm nhiệm các công việc phức tạp hơn, chẳng hạn như leo cầu thang."
 tech_droid_workers: "Chuyên Gia Droid"
 tech_droid_workers_desc: "Đơn vị nhân tạo phiên bản nâng cấp, sở hữu khả năng vận động sánh ngang với hầu hết các sinh vật hữu cơ. Bộ vi xử lý thần kinh của nó cũng được cải tiến vượt bậc."
 tech_synthetic_workers: "Quản Lý Tổng Hợp"
 tech_synthetic_workers_desc: "Đơn vị nhân tạo cao cấp, mạnh mẽ, nhanh nhẹn và bền bỉ hơn đại đa số các sinh vật hữu cơ. Bộ xử lý thần kinh được nâng cấp mạnh, mang lại khả năng hoạt động hoàn toàn độc lập."
 #tech_enhanced_combat_software: "Phần Mềm Tác Chiến 2.0"
 #tech_enhanced_combat_software_desc: ""
 tech_synthetic_leaders: "Ma Trận Nhân Cách Tổng Hợp"
 tech_synthetic_leaders_desc: "Sau khi được cấy ghép nhân cách, người Tổng hợp cuối cùng cũng có thể giao tiếp xã hội bình đẳng như bao người khác. Một số cá nhân Tổng hợp xuất chúng thậm chí còn có thể trở thành Lãnh đạo."
 tech_integrated_cybernetics: "Cơ Thể Điều Khiển Học Tích Hợp"
 tech_integrated_cybernetics_desc: "Sau khi cải tiến các bộ khung xương ngoài cơ bản, những thiết bị cấy ghép điều khiển học tích hợp này sẽ giúp người sử dụng gia tăng sức đề kháng trước các tác động độc hại từ môi trường."
 tech_integrated_cybernetics_machine_intelligence: "Cơ Thể Điều Khiển Học Thích Ứng"
 tech_integrated_cybernetics_desc_machine_intelligence: "Bằng cách cài đặt các thiết bị cấy ghép điều khiển học có khả năng tự thích ứng với môi trường địa phương, hiệu suất của drone ta sẽ được gia tăng đáng kể."
 tech_mineral_purification_1: "Tinh Chế Khoáng Sản"
 tech_mineral_purification_1_desc: "Tối ưu hóa quy trình xử lý khoáng sản thô sẽ đưa hiệu suất của chúng ta lên một tầm cao mới."
 tech_mineral_purification_2: "Tinh Chế Khoáng Sản Tân Tiến"
 tech_mineral_purification_2_desc: "Thực hiện xử lý cấp hai đối với các loại quặng bán tinh chế sẽ giúp việc lưu trữ và vận chuyển khoáng sản trở nên hiệu quả hơn nhiều."
 tech_assembly_pattern: "Mô Hình Lắp Ráp"
 tech_assembly_pattern_desc: "Bằng việc ứng dụng thuật toán lặp nhanh vào lĩnh vực mô phỏng kiến trúc, chúng ta có thể nhanh chóng xác định được mô hình lắp ráp tối ưu cho mọi dự án xây dựng."
 tech_construction_templates: "Bản Mẫu Xây Dựng"
 tech_construction_templates_desc: "Các bản mẫu đúc sẵn tiêu chuẩn hóa đã làm giảm đáng kể thời gian thi công cho các cơ sở thực địa."
 tech_robomodding: "Hệ Thống Bản Mẫu Máy Móc"
 tech_construction_templates_effect: "Sức chứa của $building_resource_silo$: §G+5000§!"
 tech_robomodding_desc: "Các bản mẫu lắp ráp có thể ghi đè cho phép chúng ta tự do tùy chỉnh thiết kế của robot."
 tech_robomodding_m: "Hệ Thống Bản Mẫu Máy Móc"
 tech_robomodding_m_desc: "Các bản mẫu lắp ráp tiêu chuẩn sẽ giúp phân công lao động cho các Pop Máy móc một cách chi tiết hơn."
 tech_robomodding_points_1: "Tiêu Chuẩn Hóa Mô-đun Chéo"
 tech_robomodding_points_1_desc: "Quá trình sản xuất cải tiến cho phép chúng ta thực hiện các sửa đổi lớn hơn trên robot mà không làm ảnh hưởng đến các chức năng cốt lõi."
 #tech_robomodding_points_1_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"
 #TẠM THỜI
 tech_robomodding_points_2: "Mạch Điện Chuyển Đổi"
 tech_robomodding_points_2_desc: "Quá trình sản xuất cải tiến cho phép tiến hành đại tu tận gốc robot mà vẫn không làm ảnh hưởng đến các chức năng cốt lõi của chúng."
 #tech_robomodding_points_2_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"
 #TẠM THỜI
 tech_matter_generator: "Kiến Tạo Vật Chất"
 tech_matter_generator_desc: "Bằng cách tiêu thụ một nguồn năng lượng khổng lồ, chúng ta có thể chuyển hóa ánh sáng thành vật chất, hệt như tạo ra một thứ từ hư vô."
 tech_mega_assembly: "Hệ Thống Lắp Ráp Siêu Cấp"
 tech_mega_assembly_desc: "Hệ thống bản mẫu lắp ráp tiên tiến có thể giúp gia tăng đáng kể hiệu suất lắp ráp các đơn vị mới."
 tech_robot_assembly_complex: "Hệ Thống Lắp Ráp Robot"
 tech_robot_assembly_complex_desc: "Hệ thống bản mẫu lắp ráp tiên tiến có thể giúp gia tăng đáng kể hiệu suất lắp ráp các robot mới."
 # Khai Khoáng Không Gian
 tech_space_construction: "Xây Dựng Ngoài Không Gian"
 tech_space_construction_desc: "Trước khi có thể xây dựng các trạm không gian quỹ đạo trên những hành tinh khác, các kỹ sư của chúng ta phải giải quyết triệt để những thách thức thiết kế hoàn toàn mới trong xây dựng ngoài không gian."
 #tech_mine_rare_resources_t1: "Tinh Chế Phi Trọng Lực"
 #tech_mine_rare_resources_t1_desc: "Cần phải có các kỹ thuật tinh chế mới để có thể xử lý vô vàn những vật liệu ngoại lai kỳ lạ mà chúng ta đang thu thập được trong quá trình khám phá dải ngân hà."
 #tech_mine_rare_resources_t3: "Chiết Xuất Hạt Nano"
 #tech_mine_rare_resources_t3_desc: "Một phương pháp hiệu quả để chiết xuất các hạt nano sẽ cho phép chúng ta khai thác các nguồn tài nguyên chiến lược mới vốn nằm ngoài tầm với trước đây."
 tech_mining_station_improvement_1: "Gia Công Tại Chỗ"
 tech_mining_station_improvement_1_desc: "Việc gia công khoáng sản ngay trên bề mặt khu vực khai thác của hành tinh sẽ giúp tăng đáng kể hiệu quả khai khoáng."
 tech_mining_station_improvement_2: "Khai Khoáng Tự Động"
 tech_mining_station_improvement_2_desc: "Dựa vào việc ứng dụng rộng rãi máy móc tự động, giờ đây chỉ cần một nhóm nhỏ nhân sự nòng cốt là đủ để điều hành cả một trạm khai thác. Động thái này sẽ giúp tiết giảm chi phí đáng kể."
 tech_mine_satramene: "Tinh Chế Khí Satramene"
 tech_mine_satramene_desc: "Đây là một loại khí kích thích sản sinh tự nhiên trên một số hành tinh. Nó có thể được sử dụng thay thế cho thuốc an thần, có tác dụng xoa dịu lên đại đa số các sinh vật, hoặc được dùng như một phương pháp trấn áp phi sát thương."
 tech_mine_garanthium: "Khai Thác Quặng Garanthium"
 tech_mine_garanthium_desc: "Thiết lập thành công một khu mỏ Garanthium là một bài kiểm tra độc đáo, vì tính dễ uốn nắn của nó khiến cho việc khai thác cũng khó nhằn chẳng kém gì sức hấp dẫn mà nó mang lại."
 tech_mine_orillium: "Khai Thác Quặng Orillium"
 tech_mine_orillium_desc: "Tia hạt ổn định có thể tạo ra một môi trường tương đối an toàn để khai thác quặng Orillium vốn cực kỳ dễ bắt nổ."
 tech_mine_living_metal: "Kim Loại Sống"
 tech_mine_living_metal_desc: "Việc khai thác và xử lý Kim Loại Sống vô cùng khó khăn, nhưng nếu ứng dụng thành công loại kim loại dễ biến đổi này, phần thưởng thu về sẽ là vô giá."
 tech_mine_betharian: "Tinh Chế Đá Betharian"
 tech_mine_betharian_desc: "Đá Betharian có vẻ như khởi nguồn từ một mỏ khoáng sản duy nhất, nhưng từ hàng nghìn năm trước, nó đã bắt đầu xuất hiện rải rác khắp thiên hà. Loại quặng này to cỡ hòn cuội, phân bố thành từng cụm và có tính dễ cháy rất cao."
 tech_mine_rare_crystals: "Khai Thác Pha Lê Quý Hiếm"
 tech_mine_rare_crystals_desc: "Khai thác những tinh thể này mà không làm hỏng hay phá hủy chúng là một công việc đòi hỏi sự cẩn trọng tuyệt đối, cần đến những trang thiết bị tiên tiến với độ chính xác cực cao."
 # Linh Kiện Hào Quang
 tech_aura_nanobot: "Cỗ Máy Lắp Ráp Nanobot"
 #tech_aura_nanobot_desc: ""
 tech_aura_minefield: "Mìn Cảm Ứng"
 #tech_aura_minefield_desc: ""
 # Siêu Cấu Trúc
 tech_mega_engineering: "Kỹ Thuật Siêu Cấu Trúc"
 tech_mega_engineering_desc: "Để hoàn thiện một dự án xây dựng ở quy mô khủng khiếp nhường này, trước tiên chúng ta phải nắm rõ các kiến thức nền tảng về kỹ thuật xây dựng siêu cấu trúc cũng như nguồn tài nguyên khổng lồ cần dự trữ."
