 tech_battleship_hull_1: "Thân Thiết Giáp Hạm Cải Tiến"
 tech_battleship_hull_1_desc: "Tiến bộ trong kỹ thuật đóng tàu sẽ cho phép chúng ta chế tạo những thiết giáp hạm cứng cáp và bền bỉ hơn."
 tech_battleship_hull_2: "Thân Thiết Giáp Hạm Tân Tiến"
 tech_battleship_hull_2_desc: "Thế hệ thiết giáp hạm mới nhất đã được tối ưu hóa tính toàn vẹn của cấu trúc và cải tiến các vách ngăn."
