 materials_desc: "Chế tạo và xử lý vật liệu nhằm nâng cao tính ứng dụng và độ bền của chúng."
 propulsion: "Công Nghệ Đẩy"
 propulsion_desc: "Nghiên cứu về công nghệ động cơ đẩy và kỹ thuật đạn đạo."
 voidcraft: "Công Nghệ Không Gian"
 voidcraft_desc: "Không gian là biên giới cuối cùng, làm chủ được nó là nắm giữ cả tương lai."
 robotics: "Chế Tạo Robot"
 robotics_desc: "Cơ giới hóa toàn diện."
 industry: "Công Nghệ Công Nghiệp"
 industry_desc: "Sáng tạo và sản xuất."
 field_manipulation: "Thao Tác Trường Lực"
 field_manipulation_desc: "Buộc các lực cơ bản phải tuân theo ý chí của chúng ta."
 particles: "Vật Lý Hạt"
 particles_desc: "Phân lập và khai thác các vật chất cùng hiện tượng hạt vi mô."
