 # Kích cỡ tàu
 tech_space_exploration: "Khám Phá Vũ Trụ"
 tech_space_exploration_desc: "Sự hiện thực hóa du hành siêu quang tốc đã mang đến ánh bình minh của kỷ nguyên không gian. Các chuyến bay có người lái xuyên hệ sao giờ đây không chỉ là khả thi, mà đã trở thành một công nghệ thiết yếu."
 tech_corvettes: "Tàu Hộ Tống"
 tech_corvettes_desc: "Sự đột phá trong công nghệ siêu quang tốc cho phép chúng ta nâng cấp các phi thuyền quân sự đất-đối-không truyền thống thành những chiến hạm cơ động với kích thước nhỏ, tốc độ cao, khả năng xoay sở tốt nhưng hỏa lực có phần hạn chế."
 tech_destroyers: "Khu Trục Hạm"
 tech_destroyers_desc: "Dù lớn hơn tàu hộ tống một chút, cấu trúc thân tàu của khu trục hạm vẫn giúp nó duy trì sự linh hoạt như một pháo hạm."
 tech_cruisers: "Tuần Dương Hạm"
 tech_cruisers_desc: "Cấu trúc thân tàu này ban đầu được thiết kế cho tàu thuộc địa thử nghiệm thế hệ mới, vô số điểm gắn kết vũ khí khiến nó trở thành nền tảng lý tưởng để chuyên chở vũ khí hạng nặng và đạn dược."
 tech_battleships: "Thiết Giáp Hạm"
 tech_battleships_desc: "Là lớp chiến hạm quân sự tiêu chuẩn lớn nhất, thiết giáp hạm hiển nhiên được trang bị lớp giáp dày đặc cùng hàng loạt tháp pháo di động."
 tech_titans: "Titan"
 tech_titans_desc: "Thiết kế một chiến hạm ở quy mô này có thể kết hợp hỏa lực áp đảo cùng các hệ thống hỗ trợ tối tân, tạo ra sức mạnh hủy diệt. Tàu Titan có thể làm một soái hạm toàn năng, hỗ trợ các tàu đồng minh xung quanh, hoặc đóng vai trò mồi nhử kẻ thù."
 tech_colossus: "Cự Tượng"
 tech_colossus_desc: "Những tiến bộ trong kỹ thuật siêu cấu trúc đã khai sinh ra chiến hạm lớp Cự Tượng, làm mờ đi ranh giới giữa thực tại và viễn tưởng. Chỉ với một nút bấm, những bệ phóng vũ khí khổng lồ độc lập này có thể tự mình biến đổi hoặc xóa sổ hoàn toàn một thế giới."
 # Nâng cấp tàu
 tech_corvette_hull_1: "Thân Tàu Hộ Tống Cải Tiến"
 tech_corvette_hull_1_desc: "Tiến bộ trong kỹ thuật đóng tàu sẽ cho phép chúng ta chế tạo những tàu hộ tống cứng cáp và bền bỉ hơn."
 tech_corvette_hull_2: "Thân Tàu Hộ Tống Tân Tiến"
 tech_corvette_hull_2_desc: "Thế hệ tàu hộ tống mới nhất đã được tối ưu hóa tính toàn vẹn của cấu trúc và cải tiến các vách ngăn."
 tech_corvette_build_speed: "Mẫu Tàu Hộ Tống Tiêu Chuẩn"
 tech_corvette_build_speed_desc: "Thiết lập các mẫu tàu hộ tống và tiêu chuẩn đóng tàu mới sẽ gia tăng đáng kể hiệu suất của dây chuyền sản xuất."
