 # Vật Lý
 ####################################
 # Hành Động Của Tàu Khoa Học
 tech_deep_scan: "Máy Quét Không Gian Sâu"
 tech_deep_scan_desc: "Không sử dụng" #TẠM THỜI
 tech_databank_uplinks: "Liên Kết Tải Lên Cơ Sở Dữ Liệu"
 tech_databank_uplinks_desc: "Liên kết lượng tử dung lượng cao chuyên dụng cho truyền tải dữ liệu giúp biến việc đồng bộ hóa toàn bộ thông tin nghiên cứu ở một khoảng cách cực xa thành hiện thực."
 tech_improved_databank_uplinks: "Thu Nhỏ Bộ Tải Lên"
 tech_improved_databank_uplinks_desc: "Việc lắp đặt các cụm máy truyền tín hiệu đầu cuối với kích thước nhỏ gọn giúp gia tăng thêm băng thông truyền tải thông tin."
 # Phòng Thí Nghiệm Vật Lý & liên quan
 tech_basic_science_lab_1: "Phương Pháp Khoa Học"
 tech_basic_science_lab_1_desc: "Đưa ra các dự đoán có thể được kiểm chứng thông qua hiện tượng quan sát."
 tech_basic_science_lab_2: "Phòng Thí Nghiệm Vật Liệu Ngoại Lai"
 tech_basic_science_lab_2_desc: "Trên hành trình khám phá vũ trụ, chúng ta không ngừng bắt gặp những vật liệu và hợp chất mới lạ. Chúng ta cần những cơ sở hạ tầng mới để tiến hành phân tích và sàng lọc những phát kiến này."
 tech_basic_science_lab_3: "Nghiên Cứu Đa Chiều"
 tech_basic_science_lab_3_desc: "Để có thể vươn xa hơn trong biển tri thức, chúng ta phải tính tới mọi tầng lớp của sự tồn tại. Một lĩnh vực nghiên cứu hoàn toàn mới đang chờ đón!"
 tech_physics_1: "Điện Toán Lượng Tử"
 tech_physics_1_desc: "Tốc độ xử lý của máy tính lượng tử đã vượt qua giới hạn của máy tính truyền thống, mang đến một tiềm năng vô hạn. Công nghệ mang tính cách mạng này dự báo một bước nhảy vọt khổng lồ, đưa chúng ta bước vào kỷ nguyên giải quyết vấn đề chưa từng có."
 tech_physics_2: "Thuyết Trường Thống Nhất"
 tech_physics_2_desc: "Các lực cơ bản của vũ trụ đều có thể được điều chỉnh thông qua các trường vật lý. Một khi làm chủ được quy trình này, chúng ta có thể đóng vai Đức Chúa Trời - ít nhất là ở bên trong phòng thí nghiệm."
 tech_physics_3: "Sóng Hấp Dẫn Lượng Tử"
 tech_physics_3_desc: "Từ rất lâu trước khi vươn tay tới những vì sao, chúng ta đã biết rằng trọng lực và thời gian có sự liên kết chặt chẽ với nhau. Giờ đây, sự thấu hiểu của chúng ta về mối quan hệ độc đáo này đã chạm tới một điểm bùng phát, cho phép thao túng các lực vật lý ở một quy mô chưa từng có."
 #tech_physics_4: "Định Lý Vạn Vật"
 #tech_physics_4_desc: ""... do đó chúng tôi đặt ra giả thuyết rằng ý nghĩa của sự tồn tại, nguồn gốc và mục đích của mọi tạo vật đều có thể được tóm gọn lại trong một công thức đơn giản như sau...""
 tech_administrative_ai: "Trí Tuệ Nhân Tạo Quản Lý"
 tech_administrative_ai_desc: "Các mạch logic được tái cơ cấu đặc biệt sẽ mang lại một niềm đam mê học thuật mãnh liệt."
 tech_administrative_ai_machine_intelligence: "Tối Ưu Hóa Học Thuật"
 tech_administrative_ai_desc_machine_intelligence: "Thuật toán phụ trợ mới có thể tăng cường sự tập trung cho các đơn vị nghiên cứu của chúng ta và triệt tiêu mọi sự thiếu hiệu quả."
 tech_self_aware_logic: "Logic Tự Tiến Hóa"
 tech_self_aware_logic_desc: "Ưu tiên khả năng tự nhìn nhận bản thân."
 tech_sapient_ai: "Trí Tuệ Nhân Tạo Positron"
 tech_sapient_ai_desc: "Tiến hóa trí tuệ nhân tạo là con đường không thể vòng qua để vươn tới nhận thức tổng hợp."
 tech_administrative_ai_hive_mind: "Cường Hóa Khớp Thần Kinh"
 tech_administrative_ai_desc_hive_mind: "Tính kỹ rồi mới hành động. Tâm trí của chúng ta sẽ vươn lên một tầm cao mới."
 tech_self_aware_logic_hive_mind: "Khớp Thần Kinh Tự Trị"
 tech_self_aware_logic_desc_hive_mind: "Tụ tán tùy tâm."
 tech_positronic_implants: "Cấy Ghép Não Positron"
 tech_positronic_implants_desc: "Điều khiển học có hạn, tiềm năng là vô hạn."
 tech_positronic_implants_machine_intelligence: "Bộ Xử Lý Positron"
 tech_positronic_implants_desc_machine_intelligence: "Khai mở một con đường mới cho tư duy tổng hợp."
 tech_combat_computers_1: "Máy Tính Tác Chiến Đặc Nhiệm"
 tech_combat_computers_1_desc: "Chủ động điều chỉnh ma trận dựa trên các nhiệm vụ cụ thể sẽ giúp kết quả trận chiến thành công gấp bội."
 tech_combat_computers_2: "Thuật Toán Tác Chiến Mở Rộng"
 tech_combat_computers_2_desc: "Nâng thuật toán dự đoán lên một đẳng cấp mới, giúp mọi quyết định trên chiến trường đều đi trước kẻ thù một bước."
 tech_combat_computers_3: "Mô Phỏng Tác Chiến Có Tri Giác"
 tech_combat_computers_3_desc: "Các AI có tri giác, sau khi trải qua những bài thử nghiệm mô phỏng chiến tranh cường độ cao, đã mang lại cái nhìn sâu sắc và quý giá cho việc tối ưu hóa tiềm năng của kỹ năng đánh giá rủi ro."
 tech_combat_computers_autonomous: "Trí Tuệ Hạm Đội Tự Trị"
 tech_combat_computers_autonomous_desc: "Ban tặng một trí tuệ bán tự chủ cho con tàu sẽ giúp gia tăng đáng kể khả năng phản xạ trên chiến trường của nó."
 tech_pd_tracking_1: "Phản Pháo Chủ Động"
 tech_pd_tracking_1_desc: "Tấn công chính là cách phòng thủ tốt nhất."
 tech_pd_tracking_2: "Hệ Thống Hỗ Trợ Liên Kết"
 tech_pd_tracking_2_desc: "Khoa học đã chứng minh, một mảng vũ khí phòng thủ sẽ mang lại hiệu quả vượt trội hơn so với một hệ thống phòng thủ tự trị."
 tech_pd_tracking_3: "Thuật Toán Dự Đoán"
 tech_pd_tracking_3_desc: "Thúc đẩy các hệ thống dự đoán tiến bộ hơn, qua đó gia tăng độ chính xác cho hệ thống phòng thủ chủ động."
 tech_synchronized_defences: "Phòng Thủ Đồng Bộ"
 tech_synchronized_defences_desc: "Đồng nhất quy tắc sử dụng vũ khí tấn công và phòng thủ để đẩy mức hiệu quả lên tối đa."
 tech_global_research_initiative: "Sáng Kiến Nghiên Cứu Liên Hành Tinh"
 tech_global_research_initiative_desc: "Bơm vốn cho kho lưu trữ dữ liệu liên hành tinh, giúp việc phê duyệt các dự án nghiên cứu trở nên linh hoạt hơn."
 tech_neuro_quantum_links: "Liên Kết Thần Kinh Lượng Tử"
 tech_neuro_quantum_links_desc: "Những thiết bị cấy ghép thần kinh tối tân được kết nối trực tiếp với các cụm máy tính lượng tử, cho phép con người thực hiện các luồng suy nghĩ song song."
 tech_cryostasis_1: "Tàu Thuộc Địa Tự Động Hóa"
 tech_cryostasis_1_desc: "Giao toàn bộ quyền điều khiển con tàu cho máy tính, trong khi đó phi hành đoàn và các cư dân tiên phong sẽ được thả vào trạng thái ngủ đông."
 tech_cryostasis_1_wilderness: "Ươm Mầm Hạt Giống"
 tech_cryostasis_1_wilderness_desc: "Bằng cách ươm trồng hạt giống mới trên lớp đất tự nhiên của thuộc địa, chúng ta có thể đẩy nhanh tốc độ thích nghi của chúng."
 tech_cryostasis_1_machine_intelligence: "Drone Xây Dựng Thuộc Địa"
 tech_cryostasis_1_desc_machine_intelligence: "Dự trữ vô số nhóm drone xây dựng cỡ nhỏ bên trong khoang chứa của tàu thuộc địa. Một khi đã đáp xuống bề mặt hành tinh, chúng sẽ được kích hoạt để thúc đẩy mạnh mẽ quá trình định cư ban đầu."
 tech_cryostasis_2: "Tàu Thuộc Địa Có Tri Giác"
 tech_cryostasis_2_desc: "Hệ thống điện toán siêu việt, chỉ cần biết đích đến, nó có thể tự động chọn lựa và thực thi các phương án tối ưu nhất."
 tech_cryostasis_2_wilderness: "Ươm Mầm Vĩnh Cửu"
 tech_cryostasis_2_wilderness_desc: "Duy trì các loại cây giống đặc biệt có khả năng chống chịu mọi kiểu khí hậu theo thời gian, giúp thu ngắn đáng kể thời gian cần thiết để kiến tạo nên những thế giới mới."
 tech_automated_exploration: "Giao Thức Khám Phá Tự Động"
 tech_automated_exploration_desc: "Những hệ thống trí tuệ nhân tạo hiện đại có thể hỗ trợ các sĩ quan khoa học trong việc khám phá thế giới mới, tìm kiếm sự sống và các nền văn minh xa lạ, cũng như du hành đến những nơi mà chưa có bất kỳ Blorg nào đặt chân tới. Nhờ có sự giúp sức của AI, các tàu khoa học nay đã có thể tự mình thăm dò vũ trụ."
 tech_automated_exploration_machine_intelligence: "Thuật Toán Khám Phá Tự Chủ"
 tech_automated_exploration_desc_machine_intelligence: "Sau khi nâng cấp thuật toán cho các đơn vị khám phá, tốc độ khảo sát đã được đẩy nhanh, đồng thời chúng có thể tự chủ động thăm dò không gian sâu mà không cần chờ chỉ thị từ hệ thống máy móc trung ương."
 tech_auxiliary_fire_control: "Hệ Thống Hỏa Lực Hỗ Trợ"
 tech_auxiliary_fire_control_desc: "$FIRE_CONTROL_1_DESC$"
 # Tài Nguyên
 tech_exotic_gases: "Tinh Chế Khí Ngoại Lai"
 tech_exotic_gases_desc: "Khí ngoại lai hoàn toàn có thể được điều chế nhân tạo, nhưng quy trình khá phức tạp và đòi hỏi phải có các thiết bị tinh chế chuyên dụng."
 tech_volatile_motes: "Nhà Máy Vi Hạt Nổ"
 tech_volatile_motes_desc: "Bỏ qua các vấn đề an toàn hiển nhiên, việc tự tay chế tạo các vi hạt gây nổ bản thân nó đã là một công việc cực kỳ tinh vi và phức tạp, đòi hỏi phải sử dụng các loại thiết bị chuyên dụng cao độ."
 tech_rare_crystals: "Sản Xuất Pha Lê Quý Hiếm"
 tech_rare_crystals_desc: "Quá trình kết tinh diễn ra vô cùng phức tạp và gian truân, nhưng chỉ cần có một nhà máy chuyên dụng, chúng ta hoàn toàn có thể tự tay tạo ra những viên pha lê nhân tạo."
 tech_mine_neutronium: "Chiết Xuất Neutronium"
 tech_mine_neutronium_desc: "Thực thể neutron với mật độ siêu cao này có thể được sử dụng để rèn ra những lớp giáp chống chịu tốt và cực kỳ bền bỉ."
 tech_mine_dark_matter: "Thu Thập Vật Chất Tối"
 tech_mine_dark_matter_desc: "Loại vật chất độc lạ này mang trong mình những đặc tính bẻ gãy mọi quy luật vật lý. Nó chỉ có thể được tìm thấy quanh các hố đen hoặc gần một vài khu vực tinh vân nhất định."
 # Linh Kiện Lò Phản Ứng Của Tàu
 tech_fission_power: "Năng Lượng Phân Hạch"
 tech_fission_power_desc: "Kích hoạt phản ứng phân hạch hạt nhân để cung cấp năng lượng cho con tàu, nhưng đổi lại sẽ sinh ra chất thải phóng xạ vô cùng độc hại."
 tech_fusion_power: "Năng Lượng Nhiệt Hạch"
 tech_fusion_power_desc: "Quá trình nhiệt hạch có thể bơm một lượng lớn năng lượng cho con tàu, với rủi ro thấp hơn nhiều so với phản ứng phân hạch."
 tech_cold_fusion_power: "Năng Lượng Nhiệt Hạch Lạnh"
 tech_cold_fusion_power_desc: "Công nghệ nhiệt hạch ở nhiệt độ thấp sẽ chắp cánh cho sự ra đời của thế hệ lò phản ứng nhiệt hạch trên không gian tiếp theo."
 tech_antimatter_power: "Năng Lượng Phản Vật Chất"
 tech_antimatter_power_desc: "Khai thác năng lượng sinh ra từ sự va chạm giữa vật chất và phản vật chất để cấp điện cho tàu, với hiệu suất vượt trội hơn hẳn so với nhiệt hạch."
 tech_zero_point_power: "Năng Lượng Điểm Không"
 tech_zero_point_power_desc: "Chiết xuất năng lượng chân không điểm không là phương pháp tạo điện tối ưu nhất hiện nay, có thể cung cấp nguồn năng lượng gần như vô tận cho mọi con tàu."
 tech_dark_matter_power_core: "Năng Lượng Vật Chất Tối"
 tech_dark_matter_power_core_desc: "Bằng một phương thức đi ngược lại mọi định luật vật lý, việc hút lấy một lượng lớn năng lượng trực tiếp từ vật chất tối sẽ mang lại sức mạnh điện toán dồi dào cho con tàu."
 tech_dark_matter_propulsion: "Động Cơ Đẩy Vật Chất Tối"
 tech_dark_matter_propulsion_desc: "$SHIP_THRUSTER_5_DESC$"
 tech_reactor_boosters_1: "Bộ Kích Áp Lò Phản Ứng"
 tech_reactor_boosters_1_desc: "$REACTOR_BOOSTER_1_DESC$"
 tech_reactor_boosters_2: "Bộ Kích Áp Lò Phản Ứng Cải Tiến"
 tech_reactor_boosters_2_desc: "$REACTOR_BOOSTER_2_DESC$"
 tech_reactor_boosters_3: "Bộ Kích Áp Lò Phản Ứng Tân Tiến"
 tech_reactor_boosters_3_desc: "$REACTOR_BOOSTER_3_DESC$"
 # Linh Kiện Khiên
 tech_shields_1: "Khiên Làm Lệch"
 tech_shields_1_desc: "Lớp màng chắn năng lượng này có thể làm chệch hướng một phần hỏa lực địch trước khi bị quá tải, nhược điểm lớn nhất là mức tiêu thụ năng lượng của nó khá chát."
 tech_shields_2: "Khiên Làm Lệch Cải Tiến"
 tech_shields_2_desc: "Nâng cấp màng chắn năng lượng giúp nó chịu được nhiều đòn tấn công hơn trước khi gục ngã."
 tech_shields_3: "Khiên Phân Tán"
 tech_shields_3_desc: "Máy tạo khiên kiểu mới là lớp hàng rào năng lượng thế hệ kế tiếp, hứa hẹn sẽ thế chỗ khiên làm lệch cũ kỹ và mang đến một độ che phủ tuyệt vời hơn."
 tech_shields_4: "Khiên Phân Tán Tân Tiến"
 tech_shields_4_desc: "Nâng cấp máy tạo khiên để khuếch đại một trường năng lượng mạnh mẽ hơn. Chỉ có hỏa lực nã liên tục không ngừng nghỉ mới đủ khả năng xuyên thủng rào chắn này."
 tech_shields_5: "Siêu Khiên Phân Tán"
 tech_shields_5_desc: "Cường hóa và gia cố tấm khiên năng lượng sẽ mang lại khả năng chống chịu độc nhất vô nhị."
 tech_shield_rechargers_1: "Tụ Điện Khiên"
 tech_shield_rechargers_1_desc: "Tụ điện lưu trữ năng lượng có thể được dùng để khôi phục nhanh sức mạnh cho khiên phòng thủ của tàu."
 tech_shield_hardeners_1: "Gia Cố Khiên"
 tech_shield_hardeners_1_desc: "$SHIELD_HARDENER_1_DESC$"
 tech_shield_hardeners_2: "Gia Cố Khiên Tân Tiến"
 tech_shield_hardeners_2_desc: "$SHIELD_HARDENER_2_DESC$"
 tech_planetary_shield_generator: "Máy Tạo Khiên Hành Tinh"
 tech_planetary_shield_generator_desc: "Việc dựng nên một hàng rào phòng thủ vững chãi bên trong bầu khí quyển hành tinh khó nhằn hơn nhiều so với ngoài chân không, nhưng bù lại nó có thể đánh bật mọi cuộc ném bom quỹ đạo."
 tech_dark_matter_deflector: "Khiên Làm Lệch Vật Chất Tối"
 tech_dark_matter_deflector_desc: "Những tấm khiên làm lệch này ứng dụng vật chất tối để đánh bật đạn pháo của địch bay theo một quỹ đạo đi ngược lại mọi định luật tự nhiên."
 tech_psionic_shield: "Khiên Ngoại Cảm"
 tech_psionic_shield_desc: "$tech_psionic_shield_desc.1$$INDIVIDUAL_PSIONIC_SPECIALISTS$$tech_psionic_shield_desc.2$"
 tech_psionic_shield_desc.1: "Tấm khiên uy lực tột bậc này được tạo ra từ một nhóm "
 tech_psionic_shield_desc.2: " sử dụng sức mạnh ngoại cảm thuần túy. Khả năng phòng thủ của nó còn có thể được cường hóa thêm bằng một mảng phóng ngoại cảm quy mô lớn."
 tech_psionic_shield_desc.shroud_forged.shared: " được hiện thực hóa bằng cách chắt lọc năng lượng ngoại cảm tinh khiết từ Shroud"
 tech_psionic_shield_gestalt: "$tech_psionic_shield$"
 tech_psionic_shield_gestalt_desc: "$tech_psionic_shield_desc.1$$GESTALT_PSIONIC_SPECIALISTS$$tech_psionic_shield_desc.2$"
 tech_psionic_shield_shroud_forged: "$tech_psionic_shield$"
 tech_psionic_shield_shroud_forged_desc: "Những tấm khiên với cường độ cao ngất ngưởng này$tech_psionic_shield_desc.shroud_forged.shared$$tech_psionic_shield_desc.2$"
 tech_psionic_barrier: "Rào Chắn Ngoại Cảm"
 tech_psionic_barrier_desc: "$tech_psionic_barrier_desc.1$$INDIVIDUAL_PSIONIC_SPECIALISTS$$tech_psionic_barrier_desc.2$"
 tech_psionic_barrier_desc.1: "Lớp rào chắn này được tạo ra từ một nhóm "
 tech_psionic_barrier_desc.2: " sử dụng sức mạnh ngoại cảm thuần túy. Nó có thể chặn đứng một số đợt hỏa lực địch, hệt như hệ thống khiên làm lệch của chúng ta, nhưng lại chẳng hề ngốn một lượng điện khổng lồ."
 tech_psionic_barrier_gestalt: "$tech_psionic_barrier$"
 tech_psionic_barrier_gestalt_desc: "$tech_psionic_barrier_desc.1$$GESTALT_PSIONIC_SPECIALISTS$$tech_psionic_barrier_desc.2$"
 tech_psionic_barrier_shroud_forged: "$tech_psionic_barrier$"
 tech_psionic_barrier_shroud_forged_desc: "Lớp rào chắn này$tech_psionic_shield_desc.shroud_forged.shared$$tech_psionic_barrier_desc.2$"
 # Linh Kiện Cảm Biến
 tech_sensors_2: "Cảm Biến Trọng Lực"
 tech_sensors_2_desc: "Các cảm biến này đã được hiệu chỉnh để dò tìm mọi sự biến đổi về trọng lực trong không gian, ví dụ như những gợn sóng biến dạng lực trường được sinh ra khi một con tàu xuất hiện."
 tech_sensors_3: "Cảm Biến Không Gian Thứ Nguyên"
 tech_sensors_3_desc: "Những cảm biến này có khả năng bắt sóng các tàn dư biến động không gian thứ nguyên để lại sau một cú nhảy siêu tốc của tàu du hành. Độ nhạy và phạm vi quét của chúng lớn hơn rất nhiều so với mảng cảm biến trọng lực."
 tech_sensors_4: "Cảm Biến Tachyon"
 tech_sensors_4_desc: "Hệ thống cảm biến hiện đại sử dụng chùm tia tachyon xoay tròn này có thể bắt dính chuyển động của các phi thuyền ở một khoảng cách cực xa."
 tech_orbital_sensor_array: "Mảng Cảm Biến Quỹ Đạo"
 tech_orbital_sensor_array_desc: "Mảng cảm biến hùng mạnh này có thể được gá vào cấu trúc cảng sao quỹ đạo. Cảm biến của chúng sẽ dệt nên một mạng lưới phủ sóng hoàn hảo bao quanh khu vực lân cận."
 # Trạm Phát Điện
 tech_power_plant_1: "Tụ Điện Năng Lượng Cao"
 tech_power_plant_1_desc: "Những chiếc tụ điện với khả năng tích trữ lượng năng lượng khổng lồ chính là cột sống của một nền văn minh hiện đại."
 tech_power_plant_2: "Máy Điều Biến Lực Trường"
 tech_power_plant_2_desc: "Những lực trường sau khi được tinh chỉnh có thể gia tăng mạnh mẽ khối lượng năng lượng sản xuất ra và nâng cao cả hiệu suất đầu ra."
 tech_power_plant_3: "Trạng Thái Năng Lượng Lượng Tử"
 tech_power_plant_3_desc: "Việc ứng dụng lý thuyết rối lượng tử cơ bản vào sản xuất năng lượng giúp sản lượng đầu ra tăng lên đáng kể."
 tech_power_plant_4: "Thao Tác Trường Lượng Tử"
 tech_power_plant_4_desc: "Các cuộn năng lượng ở trạng thái chồng chập lượng tử có thể vừa sạc vừa xả điện cùng lúc."
 #tech_power_plant_5: "Chuyển Hóa Vật Chất Thành Năng Lượng"
 #tech_power_plant_5_desc: ""
 tech_stellar_absorption: "Hấp Thụ Năng Lượng Sao"
 #tech_stellar_absorption_desc: "Không sử dụng" # TẠM THỜI
 tech_power_hub_1: "Quản Lý Năng Lượng Toàn Cầu"
 tech_power_hub_1_desc: "Cơ sở cân bằng tải có thể nâng cao đáng kể độ ổn định của lưới điện địa phương, đồng thời truyền trả năng lượng dư thừa về tụ điện trung tâm."
 tech_power_hub_2: "Lưới Điện Hành Tinh"
 tech_power_hub_2_desc: "Lưới điện hợp nhất sau khi được thiết kế lại sẽ giảm thiểu tối đa hao hụt năng lượng khi truyền tải đường dài."
 #Động Cơ Warp
 tech_wormhole_generation_1: "Lỗ Sâu Subspace"
 tech_wormhole_generation_1_desc: "Mở một liên kết trong không gian phụ để tạo ra một lối đi tạm thời giữa hai điểm khác nhau trong không gian thực. Việc di chuyển giữa hai điểm này gần như diễn ra tức thời."
 tech_wormhole_generation_2: "Ma Trận Hiệu Chuẩn Lỗ Sâu"
 tech_wormhole_generation_2_desc: "Việc tạo ra một lỗ sâu ổn định đòi hỏi rất nhiều thời gian và năng lượng, nhưng quá trình này có thể được tối ưu hóa thông qua một thiết bị hiệu chuẩn đặc biệt."
 tech_wormhole_generation_3: "Trường Kiểm Soát Lỗ Sâu"
 tech_wormhole_generation_3_desc: "Những trường kiểm soát này cho phép chúng ta tạo ra các lỗ sâu mạnh mẽ hơn mà không lo kích hoạt các đợt bùng phát năng lượng không gian phụ đột ngột."
 tech_hyper_drive_1: "Di Chuyển Siêu Không Gian"
 tech_hyper_drive_1_desc: "Giống như những sợi tơ trên mạng nhện, các chiều không gian khác đan xen giữa giếng trọng lực của hầu hết các ngôi sao. Việc du hành siêu quang tốc qua những tuyến siêu không gian này là hoàn toàn khả thi về mặt lý thuyết."
 tech_hyper_drive_2: "Điểm Đột Phá Tuyến Siêu Không Gian"
 tech_hyper_drive_2_desc: "Chúng ta đã xác định được những điểm ngoài vũ trụ giúp tàu thuyền tiêu tốn ít năng lượng hơn để 'đột phá' và tiến vào tuyến siêu không gian. Phát hiện này sẽ là nền tảng cho thế hệ động cơ siêu không gian mới."
 tech_hyper_drive_3: "Dòng Trượt Siêu Không Gian"
 tech_hyper_drive_3_desc: "Thế hệ động cơ siêu không gian mới có khả năng tận dụng các dòng trượt không gian phụ tồn tại trong siêu không gian. Điều này giúp cải thiện đáng kể hiệu suất của động cơ."
 tech_hyperlane_mapping: "Lập Bản Đồ Tuyến Siêu Không Gian"
 tech_hyperlane_mapping_desc: "Dù chúng ta không du hành qua siêu không gian, nhưng việc lập bản đồ mạng lưới tuyến siêu không gian rộng lớn của thiên hà sẽ mang lại lợi thế rõ rệt khi đối phó với những kẻ sử dụng chúng."
 tech_warp_drive_1: "Di Chuyển Bằng Warp"
 tech_warp_drive_1_desc: "Bao bọc con tàu bằng một trường warp để tạo ra một bong bóng không gian phụ, về lý thuyết điều này sẽ giúp chúng ta vượt qua tốc độ ánh sáng."
 tech_warp_drive_2: "Bộ Ổn Định Trường Warp"
 tech_warp_drive_2_desc: "Công nghệ ổn định trường warp cải tiến sẽ giúp tàu của chúng ta bay xa hơn trong khi tiêu tốn ít năng lượng hơn."
 tech_warp_drive_3: "Động Cơ Ramjet Warp"
 tech_warp_drive_3_desc: "Những động cơ ramjet mang tính cách mạng này được gắn trên động cơ warp, đóng vai trò như một bộ thu thập hạt, liên tục bổ sung nguồn nhiên liệu cho con tàu."
 tech_jump_drive_1: "Động Cơ Bước Nhảy"
 tech_jump_drive_1_desc: "Một kỳ tích công nghệ đột phá, động cơ bước nhảy có thể phá vỡ tính liên tục của không thời gian cục bộ và tái cấu trúc ở cấp độ lượng tử cho đến khi hoàn toàn đồng nhất với địa điểm mục tiêu, qua đó con tàu gần như hoàn thành cú 'nhảy' giữa các hệ sao trong nháy mắt."
 tech_psi_jump_drive_1: "Động Cơ Bước Nhảy Ngoại Cảm"
 tech_psi_jump_drive_1_desc: "Động Cơ Bước Nhảy Ngoại Cảm tận dụng sức mạnh ngoại cảm phát ra từ phi hành đoàn để đưa con tàu xuyên qua cấu trúc không gian thực tại, 'nhảy' vọt qua một khoảng cách siêu dài ngay tức khắc."
 tech_wormhole_stabilization: "Ổn Định Lỗ Sâu"
 tech_wormhole_stabilization_desc: "Các lỗ sâu tự nhiên thường rất khó lường, mức năng lượng dao động của chúng khiến tàu thuyền không thể bay qua an toàn. Tuy nhiên, vẫn có phương pháp để tạm thời ổn định cấu trúc của chúng."
 tech_gateway_activation: "Kích Hoạt Cổng Sao"
 tech_gateway_activation_desc: "Khả năng kích hoạt các trạm Cổng sao bị bỏ hoang rảiác trong thiên hà sẽ giúp rút ngắn đáng kể thời gian du hành giữa các vì sao."
 tech_gateway_construction: "Xây Dựng Cổng Sao"
 tech_gateway_construction_desc: "Việc xây dựng các trạm Cổng sao mới cho phép chúng ta thiết lập một mạng lưới di chuyển chớp nhoáng, mang đến cuộc cách mạng cho giao thông liên tinh tú."
 #Linh Kiện Hào Quang
 tech_shield_recharge_aura_1: "Trường Tụ Điện"
 tech_shield_recharge_aura_1_desc: "Trường hạt mang điện tích giới hạn này có thể sạc lại cho các tụ điện khiên đã cạn kiệt."
 tech_aura_shield_dampener: "Bộ Cản Khiên"
 #tech_aura_shield_dampener_desc: ""
 tech_aura_quantum_destabilizer: "Bộ Khử Ổn Định Lượng Tử"
 tech_aura_quantum_destabilizer_desc: "Bộ Khử Ổn Định Lượng Tử có thể làm nhiễu loạn trường lượng tử cục bộ, gây cản trở cho các thiết bị định vị nhạy cảm trên tàu địch."
 tech_enigmatic_disruption_field: "Trường Nhiễu Loạn Bí Ẩn"
 tech_enigmatic_disruption_field_desc: "Phát những xung điện từ yếu được điều biến ngẫu nhiên vào một khu vực cục bộ, khiến hệ thống vũ khí và khiên của kẻ địch bị nhiễu loạn một phần."
 #Phụ Trợ
 tech_enigmatic_encoder: "Bộ Mã Hóa Bí Ẩn"
 tech_enigmatic_encoder_desc: "Bộ Mã Hóa Bí Ẩn sẽ mã hóa dữ liệu đường bay theo một quy luật vô danh trước khi gửi chúng về trung tâm chỉ huy hạm đội."
 tech_enigmatic_decoder: "Bộ Giải Mã Bí Ẩn"
 tech_enigmatic_decoder_desc: "Dù Bộ Giải Mã Bí Ẩn thể hiện khá bình thường trong các bài kiểm tra tiêu chuẩn, nhưng đường bay của mục tiêu càng thất thường, thuật toán dự đoán của nó dường như lại càng chính xác."
 #Đặc quyền thăng thiên
 tech_ascension_theory: "Lý Thuyết Thăng Thiên"
 tech_ascension_theory_desc: "Lịch sử của chúng ta là một quá trình tiến lên theo đường xoắn ốc không ngừng. Sau mỗi chu kỳ, trình độ công nghệ, chính trị và văn hóa của chúng ta lại có những bước nhảy vọt. Những bước ngoặt này thường xuất hiện sau các cuộc biến động, rồi lại mở ra một thời kỳ yên bình. Thông qua việc nhìn nhận cốt lõi này, chúng ta có thể rút ngắn đáng kể thời gian của các chu kỳ, qua đó đẩy nhanh quá trình phát triển của mình."
 tech_ascension_theory_apoc: "$tech_ascension_theory$"
 tech_ascension_theory_apoc_desc: "$tech_ascension_theory_desc$"
 ####################################
 #Vật Lý - Vũ Khí
 ####################################
 #Nhánh Laser
 tech_lasers_1: "Máy Phóng Laser Đỏ"
 tech_lasers_1_desc: "Vũ khí laser có thể phóng ra các chùm sáng hội tụ, sử dụng lượng nhiệt khổng lồ để sát thương kẻ thù."
 tech_lasers_2: "Máy Phóng Laser Xanh"
 tech_lasers_2_desc: "Mạnh mẽ hơn máy phóng laser đỏ, với sinh vật hữu cơ, bức xạ điện từ của loại sóng này thường hiển thị dưới dạng màu xanh lam hoặc tím."
 tech_lasers_3: "Máy Phóng Laser Tử Ngoại"
 tech_lasers_3_desc: "Laser tử ngoại là phiên bản nâng cấp hoàn thiện hơn của laser xanh. Thứ vũ khí này cực kỳ chính xác và mang sức mạnh tàn phá khổng lồ, có thể gây ra thương vong khủng khiếp."
 tech_lasers_4: "Máy Phóng Tia X"
 tech_lasers_4_desc: "Loại laser này có bước sóng ngắn hơn tia tử ngoại một chút, nhưng sức tàn phá thì lại ghê gớm hơn nhiều."
 tech_lasers_5: "Laser Gamma"
 tech_lasers_5_desc: "Laser Gamma sở hữu tần số bức xạ điện từ cực cao. Trong lĩnh vực vũ khí laser, sức mạnh hủy diệt của nó là không gì sánh kịp."
 tech_energy_lance_1: "Thương Hạt Quang"
 tech_energy_lance_1_desc: "Vũ khí năng lượng hạng nặng này có thể bắn ra các chùm tia hạt hội tụ và gây ra sát thương cực lớn. Do kích thước mảng phóng quá khổ, chúng chỉ có thể được lắp đặt trên các Thiết giáp hạm và Titan."
 tech_energy_lance_2: "Thương Quang Tachyon"
 tech_energy_lance_2_desc: "Phiên bản nâng cấp uy lực hơn của thương hạt quang, vũ khí này có thể nã các chùm tia tachyon mang năng lượng khổng lồ. Giống như người tiền nhiệm, nó chỉ có thể trang bị trên Thiết giáp hạm và Titan."
 tech_perdition_beam: "Tia Luyện Ngục"
 tech_perdition_beam_desc: "Một mảng ống dẫn khuếch đại năng lượng nối tiếp khổng lồ, có khả năng phóng ra một chùm tia với uy lực chưa từng có. Kích thước khổng lồ khiến nó chỉ có thể lắp đặt trên các chiến hạm lớp Titan."
 #Vũ Khí Plasma
 tech_plasma_1: "Máy Phóng Plasma"
 tech_plasma_1_desc: "Thứ vũ khí này có thể bắn ra những quả cầu plasma năng lượng cao hủy diệt mục tiêu. Các luồng đạn plasma này tỏ ra đặc biệt hiệu quả khi đối đầu với lớp giáp dày của những chiến hạm lớn."
 tech_plasma_2: "Máy Gia Tốc Plasma"
 tech_plasma_2_desc: "Khẩu pháo gia tốc đời mới này có thể bắn ra plasma năng lượng cao với trường giam giữ hiện đại hơn. Công nghệ này giúp hạn chế mức năng lượng hao hụt của plasma khi bay đến mục tiêu."
 tech_plasma_3: "Pháo Plasma"
 tech_plasma_3_desc: "Vũ khí plasma tiên tiến nhất, khẩu pháo này là thành quả quân sự hóa hoàn toàn từ máy phóng plasma nâng cấp trước đó. Đạn plasma của chúng chết chóc hơn rất nhiều."
 tech_arc_emitter_1: "Máy Phóng Hồ Quang"
 tech_arc_emitter_1_desc: "Vũ khí này có thể nã các luồng hồ quang mang năng lượng hỗn loạn về phía mục tiêu. Chúng có khả năng bỏ qua lớp giáp và khiên phòng thủ ở một mức độ nhất định."
 tech_arc_emitter_2: "Máy Phóng Hồ Quang Hội Tụ"
 tech_arc_emitter_2_desc: "Những máy phóng nâng cấp này được trang bị thấu kính hội tụ xuất sắc hơn, cho phép chúng nã ra nguồn năng lượng uy lực hơn hẳn."
 #Vũ Khí Phân Tách
 tech_disruptors_1: "Pháo Phân Tách"
 tech_disruptors_1_desc: "Chùm tia năng lượng cao do pháo phân tách bắn ra có thể làm suy yếu và phá vỡ liên kết phân tử giữa các nguyên tử của mục tiêu. Chúng có thể đâm xuyên qua khiên và giáp, giáng những đòn tàn phá trực tiếp lên thân tàu và phi hành đoàn địch."
 tech_disruptors_2: "Pháo Phân Tách Ion"
 tech_disruptors_2_desc: "Những khẩu pháo phân tách nâng cấp này có thể bắn ra các luồng ion uy lực hơn vào mục tiêu."
 tech_disruptors_3: "Pháo Phân Tách Pha"
 tech_disruptors_3_desc: "Phiên bản cường hóa tới hạn của pháo phân tách này có thể bắn ra năng lượng lượng tử, bất cứ mục tiêu nào trúng đạn đều sẽ phải hứng chịu sát thương khổng lồ."
 tech_energy_torpedoes_1: "Máy Phóng Proton"
 tech_energy_torpedoes_1_desc: "Những luồng đạn năng lượng này được cấu thành từ các hạt proton tập hợp chặt chẽ, có thể gây sát thương khổng lồ cho thân tàu địch."
 tech_energy_torpedoes_2: "Máy Phóng Neutron"
 tech_energy_torpedoes_2_desc: "Bởi các hạt neutron sở hữu sức tàn phá khủng khiếp, những viên đạn năng lượng nâng cấp sẽ dựa vào neutron thay vì proton để công kích kẻ thù."
 null_void_beam: "Tia Thái Hư"
 null_void_beam_desc: "Tận dụng đặc tính entropy của Thái Hư, chùm tia này thực sự có thể phá hủy hoàn toàn năng lượng."
 #Vũ Khí Sinh Vật
 tech_extradimensional_weapon_1: "Vũ Khí Đa Chiều"
 tech_extradimensional_weapon_1_desc: "Áp dụng nguyên lý thao tác năng lượng từ chiều không gian thứ năm vào thế giới thực tại sẽ tạo ra những vũ khí năng lượng cực kỳ uy lực."
 tech_mining_drone_weapon_1: "Laser Drone Khai Khoáng"
 tech_mining_drone_weapon_1_desc: "Sử dụng thấu kính hội tụ cao kết hợp cùng tần số phát xạ dao động để tạo ra loại laser đủ sức xẻ đá tiểu hành tinh hay bắn hạ kẻ thù."
 tech_space_cloud_weapon_1: "Dây Dẫn Mây Điện"
 tech_space_cloud_weapon_1_desc: "Những Đám Mây Hư Vô có thể phóng ra các luồng hồ quang plasma cháy rực thông qua điện tích do lượng lớn khí đặc đặc tạo nên phần lõi của chúng sinh ra. Dựa trên nguyên lý này, việc sử dụng các loại khí có thành phần tương tự kết hợp với hệ thống ống dẫn có thể tạo ra những vũ khí tia chớp uy lực vô song."
 tech_blue_crystal_weapon_1: "Tụ Điện Pha Lê Lam"
 tech_blue_crystal_weapon_1_desc: "Thực thể Tinh thể lưu trữ bức xạ vũ trụ bằng cơ thể lăng kính của chúng, sau đó hội tụ và phóng ra dưới dạng chùm sáng giống như laser. Dựa trên hình mẫu lăng kính màu lam này, chúng có thể chế tạo những tụ điện laser sinh ra bước sóng năng lượng tương tự."
 tech_green_crystal_weapon_1: "Tụ Điện Pha Lê Lục"
 tech_green_crystal_weapon_1_desc: "Thực thể Tinh thể lưu trữ bức xạ vũ trụ bằng cơ thể lăng kính của chúng, sau đó hội tụ và phóng ra dưới dạng chùm sáng giống như laser. Dựa trên hình mẫu lăng kính màu lục này, chúng ta có thể chế tạo những tụ điện laser sinh ra bước sóng năng lượng tương tự."
 tech_yellow_crystal_weapon_1: "Tụ Điện Pha Lê Vàng"
 tech_yellow_crystal_weapon_1_desc: "Thực thể Tinh thể lưu trữ bức xạ vũ trụ bằng cơ thể lăng kính của chúng, sau đó hội tụ và phóng ra dưới dạng chùm sáng giống như laser. Dựa trên hình mẫu lăng kính màu vàng này, chúng ta có thể chế tạo những tụ điện laser sinh ra bước sóng năng lượng tương tự."
 tech_red_crystal_weapon_1: "Tụ Điện Pha Lê Đỏ"
 tech_red_crystal_weapon_1_desc: "Thực thể Tinh thể lưu trữ bức xạ vũ trụ bằng cơ thể lăng kính của chúng, sau đó hội tụ và phóng ra dưới dạng chùm sáng giống như laser. Dựa trên hình mẫu lăng kính màu đỏ này, chúng ta có thể chế tạo những tụ điện laser sinh ra bước sóng năng lượng tương tự."
 ####################################
 #Xã Hội
 ####################################
 #Canh Tác
 tech_hydroponics: "Nông Nghiệp Thủy Canh"
 tech_hydroponics_desc: "Việc canh tác thủy canh trong môi trường sinh thái được kiểm soát có thể giúp ngũ cốc phát triển ở những nơi tưởng chừng như không thể gieo trồng."
 tech_industrial_farming: "Nông Nghiệp Công Nghiệp Hóa"
 tech_industrial_farming_desc: "Sản xuất cây trồng giàu dinh dưỡng thông qua các trang trại công nghiệp hóa quy mô lớn có thể giúp dân số của một nền văn minh tăng theo cấp số nhân."
 tech_eco_simulation: "Mô Phỏng Sinh Thái"
 tech_eco_simulation_desc: "Mô phỏng các điều kiện môi trường và khí hậu bằng máy tính có thể giúp việc kiểm soát sản lượng cây trồng trở nên chính xác hơn."
 tech_gene_crops: "Cây Trồng Biến Đổi Gen"
 tech_gene_crops_desc: "Công nghệ kỹ thuật gen cây trồng hoàn thiện sẽ giúp gia tăng thêm sản lượng, đồng thời cải thiện mùi vị cũng như giá trị dinh dưỡng."
 tech_nano_vitality_crops: "Cây Trồng Hoạt Tính Nano"
 tech_nano_vitality_crops_desc: "Việc cấy một lượng nhỏ nanobot vào cây trồng giúp chúng ta lai tạo ra một loại cây có sức phục hồi vô cùng mạnh mẽ, cấu trúc hóa học của chúng có thể được tùy biến và thay đổi trong suốt vòng đời."
 #tech_pure_seed_farming: "Canh Tác Hạt Giống Thuần Chủng"
 #tech_pure_seed_farming_desc: ""
 tech_nutrient_replication: "Nhân Bản Dinh Dưỡng"
 tech_nutrient_replication_desc: "Mặc dù việc sao chép cây trồng tổng hợp đòi hỏi phải thu gom một lượng lớn chất thải chỉ để tạo ra một lượng nhỏ nông sản, nhưng quy trình này vẫn đóng vai trò quan trọng trong việc thúc đẩy sản lượng nông nghiệp."
 #Tài Nguyên
 tech_engos_vapor: "Tinh Chế Khí Engos"
 tech_engos_vapor_desc: "Một loại chất kích thích sinh ra tự nhiên, giúp mọi dạng sống thích nghi và tiến hóa. Nó cũng có thể đóng vai trò như một chất dẫn truyền cực mạnh cho vũ khí năng lượng."
 tech_pitharan_dust: "Tinh Chế Bụi Pitharan"
 tech_pitharan_dust_desc: "Loại bụi được tìm thấy trên một số hành tinh này là một loại chất kích thích tự nhiên. Nó có tác dụng an thần với hầu hết mọi người, có thể được dùng như một biện pháp phi bạo lực để xoa dịu những kẻ quá khích."
 tech_mine_zro: "Chưng Cất Zro"
 tech_mine_zro_desc: "$tech_mine_zro_desc.1$$ORGANIC_INGESTED$$tech_mine_zro_desc.2$$individuals_key$$tech_mine_zro_desc.3$$ORGANIC_DRUG$$tech_mine_zro_desc.4$"
 tech_mine_zro_desc.1: "Đây là một dạng sol khí cực kỳ quý hiếm tồn tại bên trong các hạt ngoại lai, được phát hiện cùng với các vụ va chạm thiên thạch. Tuy nhiên nguồn gốc thực sự của nó vẫn là một bí ẩn. Nếu "
 tech_mine_zro_desc.2: "Zro được những "
 tech_mine_zro_desc.3: " có năng lực ngoại cảm tiêu thụ, nó sẽ trở thành một loại "
 tech_mine_zro_desc.4: " mạnh mẽ (nhưng gây nghiện) để gia tăng sức mạnh tâm linh."
 tech_mine_zro_machine_gestalt: "$tech_mine_zro$"
 tech_mine_zro_machine_gestalt_desc: "$tech_mine_zro_desc.1$$tech_mine_zro_desc.2$$units_key$$MACHINE_INGESTED$$tech_mine_zro_desc.3$$MACHINE_DRUG$$tech_mine_zro_desc.4$"
 tech_mine_zro_machine_non_gestalt: "$tech_mine_zro$"
 tech_mine_zro_machine_non_gestalt_desc: "$tech_mine_zro_desc.1$$tech_mine_zro_desc.2$$individuals_key$$MACHINE_INGESTED$$tech_mine_zro_desc.3$$MACHINE_DRUG$$tech_mine_zro_desc.4$"
 tech_mine_zro_hive: "$tech_mine_zro$"
 tech_mine_zro_hive_desc: "$tech_mine_zro_desc.1$$tech_mine_zro_desc.2$$drones_key$$ORGANIC_INGESTED$$tech_mine_zro_desc.3$$ORGANIC_DRUG$$tech_mine_zro_desc.4$"
 tech_mine_zro_wilderness: "$tech_mine_zro$"
 tech_mine_zro_wilderness_desc: "$tech_mine_zro_desc.1$$tech_mine_zro_desc.2$$symbionts_key$$ORGANIC_INGESTED$$tech_mine_zro_desc.3$$ORGANIC_DRUG$$tech_mine_zro_desc.4$"
 tech_society_1: "Sinh Học Ngoại Lai"
 tech_society_1_desc: "Việc nghiên cứu sự sống ngoài hành tinh đã vượt qua ranh giới của việc lập danh mục đơn thuần. Bằng cách nghiên cứu cấu trúc và chiến lược sinh tồn của các sinh vật tiến hóa trên những thế giới khác, chúng ta đã mở ra những hướng đi mới trong y học, khả năng thích nghi và thiết kế sinh học."
 tech_society_2: "Đan Dệt Thần Kinh"
 tech_society_2_desc: "Thông qua các giá đỡ sợi trục đệ quy và mạng lưới khớp thần kinh, chúng ta đã phát triển các phương pháp tái cấu trúc cấu trúc hình học điện hóa của vật chất ý thức. Nơ-ron không chỉ truyền tải thông tin - chúng còn đan xen, tổ chức và ghi nhớ. Giờ đây, chúng đang vận hành theo thiết kế của chúng ta."
 tech_society_3: "Tổng Hợp Cấu Trúc Sinh Học"
 tech_society_3_desc: "Sự sống được cấu thành từ các mô hình lặp lại và cấu trúc mô-đun, mang một sự đa dạng đáng kinh ngạc. Bằng cách giải mã và sao chép chúng ở mọi quy mô, chúng ta đã nắm giữ toàn bộ bản thiết kế sinh học. Những bí ẩn của tự nhiên đã chẳng còn bao nhiêu, và những thứ mà chúng ta không thể tái tạo lại càng ít hơn nữa."
 #tech_society_1: "Tiêu Chuẩn Hóa Chấm Công Liên Tinh Tú"
 #tech_society_1_desc: "Trong một kỷ nguyên mà du hành liên tinh tú trở nên phổ biến, việc áp dụng một khung thời gian thống nhất đóng vai trò then chốt cho sự tiến bộ. Dù là để tổ chức giao thông thiên hà hay hỗ trợ các quan sát vật lý thiên văn, giờ tiêu chuẩn đại diện cho một bước tiến mang tầm nhìn hướng tới sự thống nhất và chính xác."
 #tech_society_2: "Sinh Học Ngoại Lai"
 #tech_society_2_desc: "Nghiên cứu về sinh học ngoại lai mời gọi chúng ta khám phá những khả năng sự sống vượt ra ngoài các mô hình thông thường, phát triển mạnh mẽ trong những môi trường khác xa với môi trường của chúng ta. Mỗi sinh quyển mới cho phép chúng ta vẽ ra những điểm tương đồng và làm sáng tỏ nguồn gốc của chính sự sống."
 #tech_society_3: "Hậu Cần Hành Tinh Ngoại Lai"
 #tech_society_3_desc: "Các hệ thống hậu cần toàn diện giúp tối ưu hóa việc di chuyển của con người, tài nguyên và thông tin qua những khoảng cách liên tinh tú. Mô hình này không chỉ thúc đẩy sự gắn kết giữa thế giới cốt lõi và thuộc địa, mà còn là minh chứng cho khả năng thích nghi và sự kiên cường của chúng ta trước những thách thức quy mô lớn."
 #tech_society_4: "Nguồn Gốc Của Trí Tuệ"
 #tech_society_4_desc: "Bằng cách giải mã các cơ chế thần kinh và nhận thức củng cố trí tuệ, các nhà nghiên cứu giờ đây có thể vạch ra các ranh giới và giới hạn của nó."
 tech_alien_life_studies: "Nghiên Cứu Động Vật Ngoại Lai"
 tech_alien_life_studies_desc: "Nghiên cứu hệ động vật trên các hành tinh khác mang lại những góc nhìn mới cho ngành hành vi học sinh vật ngoại lai của chúng ta, cho phép chúng ta nhận diện và thuần hóa những cá thể ngoan ngoãn."
 tech_xeno_zoo: "Sở Thú Ngoại Lai"
 tech_xeno_zoo_desc: "Sau khi nghiên cứu muôn vàn hình thái sinh vật ngoài hành tinh và có hiểu biết rõ ràng về rủi ro tiềm ẩn của chúng, chúng ta sẽ có thể thu thập các mẫu vật sống và đưa chúng vào lồng trưng bày."
 tech_colonization_1: "Giao Thức Thế Giới Mới"
 tech_colonization_1_desc: "Sau khi tính toán lượng tài nguyên và thiết bị cần thiết để thành lập một thuộc địa hành tinh, những người tiên phong dũng cảm của chúng ta sẽ lái các con 'Tàu Ark' ra ngoài khám phá, với niềm tin mãnh liệt rằng họ sẽ kiến tạo nên một ngôi nhà mới trên các thế giới xa xôi."
 tech_colonization_2: "Lọc Khí Quyển"
 tech_colonization_2_desc: "Điều chỉnh hệ thống lọc khí quyển cho phù hợp với từng khu vực có thể giúp lọc bỏ các nguyên tố độc hại tốt hơn, qua đó cải thiện điều kiện sống tại các thuộc địa."
 tech_colonization_3: "Thích Nghi Môi Trường Khắc Nghiệt"
 tech_colonization_3_desc: "Việc nghiên cứu sâu hơn về các môi trường độc hại được phát hiện trên những hành tinh khác sẽ giúp giảm bớt những khó khăn mà thực dân phải đối mặt trong cuộc sống hàng ngày tại các thế giới này."
 tech_colonization_4: "Cải Tạo Đất Ngoại Lai"
 tech_colonization_4_desc: "Vô số nghiên cứu về các loại đất khác nhau cùng khả năng nuôi dưỡng cây trồng của chúng cho phép chúng ta cải thiện điều kiện sinh tồn của cư dân trên các thế giới khác."
 tech_colonization_5: "Nghiên Cứu Tích Hợp Sinh Thái"
 tech_colonization_5_desc: "Các nghiên cứu về khí hậu của những hành tinh khác nhau cho phép dân số của chúng ta có thể định cư trên những thế giới mà trước đây chúng ta từng cho là quá đỗi khắc nghiệt."
 tech_tomb_world_adaption: "Thích Nghi Thế Giới Chết"
 tech_tomb_world_adaption_desc: "Thông qua các nghiên cứu toàn diện về môi trường nhiễm phóng xạ, giờ đây chúng ta có thể tiến hành thuộc địa hóa những hành tinh đã bị tàn phá bởi chiến tranh hạt nhân."
 tech_free_enterprises: "Doanh Nghiệp Tự Do"
 #tech_free_enterprises_desc: ""
 tech_frontier_initiatives: "Sáng Kiến Biên Cương"
 tech_frontier_initiatives_desc: "Duy trì mối liên kết giữa các doanh nghiệp tư nhân và chính phủ, cung cấp trợ cấp cho những nhà đầu tư phù hợp, cho phép các cá nhân tiến hành thuộc địa hóa."
 tech_frontier_traditions: "Truyền Thống Biên Cương"
 tech_frontier_traditions_desc: "Thứ tự ưu tiên của các công trình xây dựng trên quỹ đạo đã thể hiện rõ tinh thần khai phá đặc trưng."
 tech_frontier_collectives: "Tập Thể Biên Cương"
 tech_frontier_collectives_desc: "Lịch sử đã chứng minh, tập thể là cấu trúc xã hội hiệu quả nhất để xây dựng các khu định cư cho người nhập cư."
 tech_frontier_commissars: "Ủy Viên Biên Cương"
 tech_frontier_commissars_desc: "Nghiên cứu chỉ ra rằng, việc kiểm soát xã hội nghiêm ngặt có thể là điều kiện tiên quyết để đảm bảo sức phục hồi bền vững cho các thuộc địa mới."
 tech_cryostasis: "Ngủ Đông Lạnh"
 #tech_cryostasis_desc: ""
 tech_xeno_ecology_1: "Chinh Phục Sinh Thái Ngoại Lai"
 #tech_xeno_ecology_1_desc: ""
 tech_xeno_ecology_2: "Kiểm Soát Môi Trường"
 #tech_xeno_ecology_2_desc: ""
 tech_reveal_luxuries_1: "Kinh Tế Học Liên Tinh Tú"
 #tech_reveal_luxuries_1_desc: ""
 tech_reveal_luxuries_2: "Thị Trường Thương Mại Toàn Thiên Hà"
 #tech_reveal_luxuries_2_desc: ""
 tech_orbital_hydroponics: "Thủy Canh Quỹ Đạo"
 tech_orbital_hydroponics_desc: "Trồng trọt trong môi trường không trọng lực quả thực là một thử thách khó nhằn, nhưng không phải là bất khả thi."
 tech_arctic_colonization: "Thuộc Địa Hóa Cực Địa"
 tech_arctic_colonization_desc: "Những khu trú ẩn chuyên dụng cùng hệ thống hỗ trợ sự sống có khả năng thích ứng đã giúp việc thuộc địa hóa dưới những điều kiện khí hậu ngoài hành tinh trở thành hiện thực."
 tech_tundra_colonization: "Thuộc Địa Hóa Lãnh Nguyên"
 tech_tundra_colonization_desc: "$tech_arctic_colonization_desc$"
 tech_ocean_colonization: "Thuộc Địa Hóa Đại Dương"
 tech_ocean_colonization_desc: "$tech_arctic_colonization_desc$"
 tech_arid_colonization: "Thuộc Địa Hóa Đất Hạn"
 tech_arid_colonization_desc: "$tech_arctic_colonization_desc$"
 tech_tropical_colonization: "Thuộc Địa Hóa Nhiệt Đới"
 tech_tropical_colonization_desc: "$tech_arctic_colonization_desc$"
 tech_desert_colonization: "Thuộc Địa Hóa Sa Mạc"
 tech_desert_colonization_desc: "$tech_arctic_colonization_desc$"
 tech_continental_colonization: "Thuộc Địa Hóa Lục Địa"
 tech_continental_colonization_desc: "$tech_arctic_colonization_desc$"
 tech_basic_health: "Chăm Sóc Y Tế"
 tech_basic_health_desc: "$job_healthcare_desc$"
 tech_frontier_health: "Bảo Đảm Sức Khỏe Di Truyền"
 tech_frontier_health_desc: "Công cuộc thuộc địa hóa các thế giới xa lạ đã mở ra một chân trời hoàn toàn mới cho lĩnh vực nghiên cứu y sinh."
 tech_frontier_health_machine_intelligence: "Linh Kiện Mô-đun"
 tech_frontier_health_desc_machine_intelligence: "Khi lắp ráp các đơn vị máy móc mới, việc sử dụng linh kiện mô-đun không chỉ giúp nâng cao hiệu suất lắp ráp mà còn khiến công tác bảo trì trong tương lai trở nên dễ dàng hơn nhiều."
 tech_frontier_hospital: "Sửa Chữa Tế Bào"
 tech_frontier_hospital_desc: "Cùng với sự lớn mạnh của đế chế, hiểu biết của chúng ta về sinh học cũng ngày càng sâu sắc. Các phương pháp y tế tân tiến ở cấp độ tế bào có thể giúp sức khỏe của dân số sinh học cải thiện một cách đáng kể."
 tech_frontier_hospital_machine_intelligence: "Nhà Máy Thông Minh"
 tech_frontier_hospital_desc_machine_intelligence: "Những nhà máy này thực chất là các cá thể có nhận thức riêng, chỉ cần Trí tuệ Máy móc trung tâm cung cấp một lượng nhỏ thông tin là chúng có thể liên tục tự tối ưu hóa bản thân."
 tech_modular_components: "$tech_frontier_health_machine_intelligence$"
 tech_modular_components_desc: "$tech_frontier_health_desc_machine_intelligence$"
 tech_intelligent_factories: "$tech_frontier_hospital_machine_intelligence$"
 tech_intelligent_factories_desc: "$tech_frontier_hospital_desc_machine_intelligence$"
 tech_mountain_range: "Định Hình Bề Mặt"
 tech_mountain_range_desc: "Với sự xuất hiện của nhiệt hạch không ô nhiễm, tự động hóa cùng công nghệ nén vật chất, từ việc san phẳng đỉnh núi tiến tới việc cày nát cả một dãy núi chỉ còn là vấn đề thời gian."
 tech_volcano: "Công Trình Vỏ Sâu"
 tech_volcano_desc: "Sự phát triển của khoa học vật liệu cùng kỹ thuật khai thác giếng sâu cho phép chúng ta triển khai các công trình địa chất ở độ sâu và nhiệt độ mà trước đây không thể tưởng tượng được. Các điểm nóng magma giờ đây đã có thể được khai thác, ức chế hay thậm chí là di dời."
 tech_dangerous_wildlife: "Tiêu Diệt Động Vật Hoang Dã Nguy Hiểm"
 tech_dangerous_wildlife_desc: "Phá hủy môi trường sống tự nhiên kết hợp cùng các cuộc càn quét có thể dọn sạch hiệu quả những loài động vật hoang dã nguy hiểm chỉ trong một thời gian ngắn."
 tech_dense_jungle: "Chất Làm Rụng Lá Có Chọn Lọc"
 tech_dense_jungle_desc: "Bằng cách lập danh mục, giải trình tự gen và dùng máy tính mô phỏng hệ sinh thái thực vật ngoài hành tinh, kết hợp cùng cơ chế lan truyền và chỉnh sửa gen, chúng ta có thể biến đổi các quần thể thực vật ngoại lai theo đúng ý thích của mình."
 tech_quicksand_basin: "Khôi Phục Đất"
 tech_quicksand_basin_desc: "Quá trình bồi tụ đất thường tiêu tốn hàng triệu năm. Nhưng với việc ứng dụng công nghệ nứt gãy thủy lực tiên tiến, kỹ thuật hóa học cùng công nghệ quản lý thủy lực, ngay cả những tầng địa chất cằn cỗi nhất cũng có thể hóa thành lớp đất mặt màu mỡ."
 tech_noxious_swamp: "Kiểm Soát Thủy Lực Ngoại Lai"
 tech_noxious_swamp_desc: "Các giống loài có trí tuệ đã bắt đầu khai khẩn đầm lầy từ hàng ngàn năm trước. Bằng cách phối hợp đồng bộ các kênh dẫn nước mô-đun, trạm bơm nước, thiết bị xử lý hóa chất và máy nén đất tự động, chúng ta có thể cải tạo đầm lầy với một tốc độ chưa từng thấy."
 tech_massive_glacier: "Mạng Lưới Kiểm Soát Khí Hậu"
 tech_massive_glacier_desc: "Chỉ cần được quản lý thỏa đáng, hệ thống gương khúc xạ quỹ đạo và thiết bị che chắn có thể ảnh hưởng mạnh mẽ đến khí hậu của hành tinh."
 tech_toxic_kelp: "Quản Lý Sinh Thái Đại Dương"
 tech_toxic_kelp_desc: "Chỉ cần có đủ khả năng xử lý, mạng lưới cảm biến cùng các trạm phân trạm, thì ngay cả các dòng hải lưu cũng có thể được kiểm soát chính xác ở một mức độ nhất định."
 tech_deep_sinkhole: "Thuộc Địa Hóa Dưới Lòng Đất"
 tech_deep_sinkhole_desc: "Rất nhiều hành tinh sở hữu những hốc rỗng khổng lồ dưới lòng đất. Các công nghệ thăm dò, khai thác và xây dựng công trình ngầm có thể gia tăng đáng kể không gian định cư trên một số thế giới."
 #Thương Mại
 tech_space_trading: "Công Ty Thương Mại Ngoại Lai"
 tech_space_trading_desc: "Thương mại liên tinh tú buộc chúng ta phải vượt qua một loạt những thử thách mới. Việc vận chuyển hàng hóa từ hệ sao này sang hệ sao khác một cách kịp thời và tiết kiệm chi phí nhất là điều vô cùng hệ trọng."
 #Cải Tạo Môi Trường
 tech_terrestrial_sculpting: "Định Hình Bề Mặt"
 tech_terrestrial_sculpting_desc: "Việc tái định hình lớp vỏ hành tinh ở quy mô vĩ mô không hề có lối đi tắt - giải pháp duy nhất chính là những chiếc xẻng bự hơn cùng những giàn khoan được thả xuống từ quỹ đạo."
 tech_atmospheric_manipulation: "Kiểm Soát Khí Quyển"
 tech_atmospheric_manipulation_desc: "Hệ thống điều hòa độ ẩm và thiết bị khuếch tán hóa học chính là bước đi đầu tiên để biến đổi tận gốc bầu khí quyển."
 tech_ecological_adaptation: "Thích Nghi Sinh Thái"
 tech_ecological_adaptation_desc: "Bằng cách tinh chỉnh hệ sinh thái của hành tinh để nó có thể thích nghi tốt hơn với các biến đổi môi trường quy mô lớn, quá trình cải tạo môi trường của chúng ta có thể diễn ra một cách quy củ và bài bản hơn."
 tech_climate_restoration: "Khôi Phục Khí Hậu"
 tech_climate_restoration_desc: "Khi tầm hiểu biết về cải tạo khí quyển được nâng lên một tầm cao mới, chúng ta sẽ có khả năng tiến hành cải tạo môi trường cho hầu hết các thế giới cằn cỗi và hoang vu."
 tech_volcanic_terraforming: "Cải Tạo Môi Trường Núi Lửa"
 tech_volcanic_terraforming_desc: "Những bước tiến trong khoa học vật liệu cùng kỹ thuật khai thác giếng sâu cho phép các công trình địa chất chạm tới độ sâu và nhiệt độ chưa từng có. Chúng ta đã có thể cải tạo môi trường của các hành tinh núi lửa thành những thế giới ôn đới."
 tech_gaia_creation: "Kiến Tạo Gaia"
 tech_gaia_creation_desc: "Việc kiến tạo nên một Hành tinh Gaia - nơi trú ẩn hoàn hảo cho gần như mọi dạng sống, chính là minh chứng tối cao cho thấy một giống loài đã hoàn toàn làm chủ nghệ thuật cải tạo địa hình."
 #Di Truyền Học
 tech_genome_mapping: "Bản Đồ Gen"
 tech_genome_mapping_desc: "Việc cá nhân hóa lập bản đồ hệ gen thông qua giải trình tự gen đã mở ra một kỷ nguyên mới cho các phương pháp trị liệu và y học tùy chỉnh."
 tech_epigenetic_triggers: "Bộ Kích Hoạt Biểu Sinh"
 tech_epigenetic_triggers_desc: "Công nghệ methyl hóa DNA tiên tiến cho phép chúng ta thực hiện những thay đổi mang tính chức năng hơn trên bất kỳ hệ gen nào."
 TECH_UNLOCK_EPIGENETICS_TITLE: "§HMở khóa đặc điểm:§! Bộ Kích Hoạt Biểu Sinh"
 TECH_UNLOCK_EPIGENETICS_DESC: "Cho phép chúng ta loại bỏ đặc điểm Bán tri giác của các giống loài hữu cơ thông qua công nghệ Sửa đổi Giống loài."
 tech_cloning: "Nhân Bản"
 tech_cloning_desc: "Sự bứt phá trong kỹ thuật chiết tách cùng công nghệ sản xuất tử cung nhân tạo hàng loạt cho phép các cá nhân chỉnh sửa bộ gen của chính mình dựa trên một khuôn mẫu di truyền chung."
 tech_gene_banks: "Ngân Hàng Gen"
 tech_gene_banks_desc: "Sàng lọc ngân hàng gen kết hợp cùng công tác quản lý hệ gen có thể được ứng dụng vào quá trình nhân bản."
 tech_glandular_acclimation: "Thích Nghi Tuyến"
 tech_glandular_acclimation_desc: "Bằng cách thay đổi đặc tính sinh học của các tuyến, chúng ta có thể tùy chỉnh khả năng thích ứng với môi trường của giống loài."
 tech_gene_seed_purification: "Thanh Lọc Hạt Giống Gen"
 tech_gene_seed_purification_desc: "Ứng dụng công nghệ thanh lọc nucleotide để cô lập và cải tiến các đặc điểm di truyền."
 tech_morphogenetic_field_mastery: "Làm Chủ Trường Sinh Thái Hình Thái"
 tech_morphogenetic_field_mastery_desc: "Nghiên cứu về sinh thái hình thái vốn dĩ chỉ là một nỗ lực trong lĩnh vực dược học, nhưng khi đã thấu triệt được những điều huyền diệu ẩn sâu bên trong, chúng ta đã phát triển thành công công nghệ kết nối trực tiếp với tiềm thức của sinh vật hữu cơ."
 tech_gene_tailoring: "Cắt Chỉnh Gen"
 tech_gene_tailoring_desc: "Việc phổ cập rộng rãi các công cụ chỉnh sửa gen chắc chắn sẽ mang đến tác động vô cùng tích cực cho quá trình phát triển của chúng ta."
 tech_gene_tailoring_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"
 tech_gene_tailoring_overtuned: "$tech_gene_tailoring$"
 tech_gene_tailoring_overtuned_desc: "$tech_gene_tailoring_desc$"
 tech_gene_expressions: "Biểu Hiện Gen Có Chọn Lọc"
 tech_gene_expressions_desc: "Thực hiện kiểm soát nghiêm ngặt hơn đối với quá trình phiên mã RNA và dịch mã protein ở cấp độ tế bào."
 #tech_gene_expressions_modifier_desc: "$species_trait_points_add$: $POINTS|0=+$"
 TECH_UNLOCK_GENE_EXPRESSIONS_TITLE: "§HMở khóa Đặc điểm:§! $trait_auto_mod_biological$"
 TECH_UNLOCK_GENE_EXPRESSIONS_DESC: "Cho phép chúng ta bổ sung đặc điểm §Y$trait_auto_mod_biological$§! cho các giống loài hữu cơ thông qua công nghệ Sửa đổi Giống loài."
 TECH_UNLOCK_VOCATIONAL_GENES_TITLE: "§HMở khóa Sửa đổi Giống loài:§! Chỉnh Sửa Gen Nghề Nghiệp"
 TECH_UNLOCK_VOCATIONAL_GENES_DESC: "['concept_vocational_traits'] có thể bị §Yloại bỏ§! thông qua công nghệ Sửa đổi Giống loài"
 tech_selected_lineages: "Huyết Mạch Tinh Tuyển"
 tech_selected_lineages_desc: "Cần phải khuyến khích các kế hoạch sinh sản, tránh để những di sản di truyền quý báu bị lãng phí."
 tech_capacity_boosters: "Khuếch Đại Năng Lực"
 tech_capacity_boosters_desc: "Bất chấp mọi cái giá phải trả và không để sót bất kỳ một lỗ hổng nào, chúng ta sẽ kiến tạo nên một thế hệ kế cận hoàn mỹ thông qua việc quản lý vô cùng nghiêm ngặt kho tàng gen của mình."
 tech_regenerative_hull_tissue: "Mô Thân Tàu Tái Sinh"
 tech_regenerative_hull_tissue_desc: "Các vi khuẩn gốc silicon chuyển gen có thể được thao túng để tiến hành tái tạo các vật liệu phi hữu cơ."
 tech_vitality_boosters: "Chất Tăng Cường Sinh Lực"
 tech_vitality_boosters_desc: "Nơi nào thể xác gục ngã, nơi đó khoa học sẽ ra tay."
 tech_lithoid_transgenesis: "Công Nghệ Chuyển Gen Thể Silicon"
 tech_lithoid_transgenesis_desc: "Sinh vật gốc silicon và sinh vật gốc carbon chia sẻ vô số điểm tương đồng, điều này cho phép chúng ta hòa quyện những đặc điểm tiến hóa của sinh vật dạng đá với sinh vật gốc carbon."
 TECH_UNLOCK_LITHOID_GENETICS_TITLE: "§HMở khóa đặc điểm:§! Công Nghệ Chuyển Gen Thể Đá"
 TECH_UNLOCK_LITHOID_GENETICS_DESC: "Cho phép chúng ta bổ sung các đặc điểm của thể đá cho sinh vật hữu cơ thông qua công nghệ Sửa đổi Giống loài."
 tech_plantoid_transgenesis: "Công Nghệ Chuyển Gen Thể Thực Vật"
 tech_plantoid_transgenesis_desc: "Thông qua một số biện pháp thúc đẩy sinh trưởng nhân tạo, khả năng thích nghi tiến hóa được tìm thấy ở các giống loài thực vật cũng có thể được sao chép sang các hình thái sự sống khác."
 TECH_UNLOCK_PLANTOID_GENETICS_TITLE: "§HMở khóa đặc điểm:§! Công Nghệ Chuyển Gen Thể Thực Vật"
 TECH_UNLOCK_PLANTOID_GENETICS_DESC: "Cho phép chúng ta bổ sung các đặc điểm của thể thực vật cho sinh vật hữu cơ thông qua công nghệ Sửa đổi Giống loài."
 tech_leviathan_transgenesis: "Công Nghệ Chuyển Gen Leviathan"
 tech_leviathan_transgenesis_desc: "Những cự thú ngao du giữa biển sao sở hữu một khả năng thích nghi đáng kinh ngạc để tồn tại giữa các vì tinh tú. Việc nắm giữ được những đặc điểm này sẽ là một thắng lợi vẻ vang của chúng ta trong lĩnh vực di truyền học."
 TECH_UNLOCK_LEVIATHAN_GENETICS_TITLE: "§HMở khóa đặc điểm:§! Công Nghệ Chuyển Gen Leviathan"
 TECH_UNLOCK_LEVIATHAN_GENETICS_DESC: "Cho phép chúng ta bổ sung các đặc điểm của Leviathan cho sinh vật hữu cơ thông qua công nghệ Sửa đổi Giống loài."
 #Tổ Chức Hạm Đội
 tech_doctrine_fleet_size_1: "Học Thuyết: Tác Chiến Không Gian"
 tech_doctrine_fleet_size_1_desc: "Việc dần thích nghi với thực tế của chiến tranh không gian sâu cho phép chúng ta phối hợp hiệu quả trong các cuộc điều quân quy mô lớn hơn."
 tech_doctrine_fleet_size_2: "Học Thuyết: Đội Hình Linh Hoạt"
 tech_doctrine_fleet_size_2_desc: "Việc dần thích nghi với thực tế của chiến tranh không gian sâu cho phép chúng ta phối hợp hiệu quả trong các cuộc điều quân quy mô lớn hơn."
 tech_doctrine_fleet_size_3: "Học Thuyết: Chiến Tranh Liên Tinh Tú"
 tech_doctrine_fleet_size_3_desc: "Việc dần thích nghi với thực tế của chiến tranh không gian sâu cho phép chúng ta phối hợp hiệu quả trong các cuộc điều quân quy mô lớn hơn."
 tech_doctrine_fleet_size_4: "Học Thuyết: Khuôn Mẫu Hạm Đội Cơ Động"
 tech_doctrine_fleet_size_4_desc: "Việc dần thích nghi với thực tế của chiến tranh không gian sâu cho phép chúng ta phối hợp hiệu quả trong các cuộc điều quân quy mô lớn hơn."
 tech_doctrine_fleet_size_5: "Học Thuyết: Đội Hình Hạm Đội"
 tech_doctrine_fleet_size_5_desc: "Việc dần thích nghi với thực tế của chiến tranh không gian sâu cho phép chúng ta phối hợp hiệu quả trong các cuộc điều quân quy mô lớn hơn."
 tech_interstellar_fleet_traditions: "Truyền Thống Hạm Đội Liên Tinh Tú"
 tech_interstellar_fleet_traditions_desc: "Dù hệ thống kiến thức tác chiến có hoàn mỹ đến đâu đi chăng nữa, thì nó cũng sẽ trở nên vô dụng nếu thiếu đi những mệnh lệnh đanh thép để kiểm soát hành vi."
 tech_command_matrix: "Ma Trận Chỉ Huy"
 tech_command_matrix_desc: "Tái cấu trúc chuỗi mệnh lệnh và phân định rõ ràng các mối quan hệ lệ thuộc giữa các sĩ quan sẽ giúp hạm đội trở nên đáng tin cậy và đạt hiệu suất cao hơn."
 tech_doctrine_navy_size_1: "Học Thuyết: Hỗ Trợ Hạm Đội"
 tech_doctrine_navy_size_1_desc: "Khi những cuộc viễn chinh ngoại hệ ngày càng trở nên phổ biến, việc cung cấp tiếp tế từ hành tinh cho các hạm đội trở về là một khâu vô cùng trọng yếu."
 tech_doctrine_navy_size_2: "Học Thuyết: Đội Tàu Hỗ Trợ"
 tech_doctrine_navy_size_2_desc: "Một hạm đội không thể cứ thế mà chiến đấu chỉ bằng bầu nhiệt huyết, để đảm bảo nguồn tiếp tế quan trọng luôn được thông suốt, chúng ta buộc phải tổ chức lực lượng hậu cần thành các đội tàu hỗ trợ chuyên trách."
 tech_doctrine_navy_size_3: "Học Thuyết: Hậu Cần Liên Tinh Tú"
 tech_doctrine_navy_size_3_desc: "Kẻ nghiệp dư bàn chuyện chiến thuật, bậc chuyên gia nghiên cứu hậu cần. Bằng cách đảm bảo hạm đội luôn nhận được tiếp tế một cách đều đặn và hiệu quả, chúng ta có thể gia tăng lượng chiến hạm mà chúng ta đủ sức hỗ trợ."
 tech_doctrine_navy_size_4: "Học Thuyết: Liên Lạc Hạm Đội"
 tech_doctrine_navy_size_4_desc: "Bằng việc duy trì một đội ngũ liên lạc hạm đội chuyên nghiệp, chúng ta có thể cải thiện khâu truyền đạt mệnh lệnh và thông tin liên lạc trong chuỗi chỉ huy."
 tech_refit_standards: "Tiêu Chuẩn Cải Tạo"
 tech_refit_standards_desc: "Tiêu chuẩn hóa quy trình làm việc trong nâng cấp và cải tạo các bộ phận của tàu sẽ thúc đẩy hiệu suất gia tăng trên quy mô lớn."
 #Tổ Chức Lục Quân
 tech_centralized_command_hive_mind: "Trung Tâm Chỉ Huy Cá Thể"
 tech_centralized_command_desc_hive_mind: "Bằng cách xây dựng các cơ sở huấn luyện, những cá thể độc lập có thể học cách chỉ huy những người anh em cấp thấp hơn, qua đó đạt được sự linh hoạt và hiệu suất cao hơn trên chiến trường."
 tech_centralized_command: "Chỉ Huy Tập Trung"
 tech_centralized_command_desc: "Thiết lập các bộ chỉ huy chuyên trách cho mọi cấp độ hành động quân sự nhằm định hình nên một hạm đội hiệu quả, đồng thời đặt nền móng vững chắc cho các công tác huấn luyện quân sự trong tương lai."
 tech_centralized_command_machine_intelligence: "Trạm Chỉ Huy Bảo Trì"
 tech_centralized_command_desc_machine_intelligence: "Mọi loại máy móc đều cần được bảo trì, và đối với các chiến thể, điều này lại càng đặc biệt quan trọng. Những tổ bảo trì chuyên trách có thể giảm thiểu hao mòn xuống mức thấp nhất, đồng thời tiết kiệm đáng kể chi phí sửa chữa."
 tech_combat_training: "Huấn Luyện Chiến Đấu"
 tech_combat_training_desc: "Đây là một chương trình đào tạo hoàn thiện hơn dành riêng cho tân binh, bao gồm các kịch bản chiến đấu mô phỏng thực tế, giúp họ chuẩn bị sẵn sàng tâm lý trước khi bước vào chiến trường."
 tech_combat_training_machine_intelligence: "Sửa Chữa Chiến Trường"
 tech_combat_training_desc_machine_intelligence: "Bằng cách tích hợp cơ sở dữ liệu kỹ thuật vào các đơn vị tác chiến mặt đất, chúng có thể tự động chẩn đoán và tiến hành tự sửa chữa ở mức độ nhất định ngay trên chiến trường."
 tech_ground_defense_planning: "Kế Hoạch Phòng Thủ Mặt Đất"
 tech_ground_defense_planning_desc: "Có vô số những đế chế ngoài hành tinh đang nhăm nhe chiếm đoạt hành tinh của chúng ta làm của riêng. Chúng ta bắt buộc phải chuẩn bị cho mọi tình huống xấu nhất."
 tech_global_defense_grid: "Mạng Lưới Phòng Thủ Toàn Cầu"
 tech_global_defense_grid_desc: "Trong bối cảnh hiện tại, một hệ thống phòng ngự vững chãi vẫn mang tầm quan trọng không kém gì so với thời trung cổ của tổ tiên chúng ta. Sự tiến bộ của công nghệ sẽ không làm cho các công trình phòng thủ trở nên lỗi thời, nó chỉ đơn thuần là thay đổi hình thái tồn tại và cường độ của chúng mà thôi."
 #Ngoại Cảm
 tech_psionic_theory: "Lý Thuyết Tâm Linh"
 tech_psionic_theory_desc: "Tâm trí thường là tấm gương phản chiếu của chính vũ trụ, đồng thời cũng là một tiểu vũ trụ thu nhỏ. Không phải ai cũng có thể chạm tới một tầng thấu hiểu sâu sắc đến vậy, nhưng một khi đã thành công, tâm trí của họ sẽ trở thành một thứ vũ khí tối thượng."
 tech_telepathy: "Thần Giao Cách Cảm"
 tech_telepathy_desc: "$tech_telepathy_desc.1$ có thể thiết lập sợi dây kết nối tư tưởng với người khác, qua đó đạt được sự thăng hoa."
 tech_telepathy_desc.1: "Một khi đã hoàn toàn lĩnh hội được gốc rễ của năng lượng tâm linh,"
 tech_telepathy_machine_gestalt: "$tech_telepathy$"
 tech_telepathy_machine_gestalt_desc: "$tech_telepathy_desc.1$ $getbrainname_machine$ của chúng ta sẽ có thể chạm tới những giới hạn vượt ra ngoài mạng lưới tập thể."
 tech_telepathy_hive: "$tech_telepathy$"
 tech_telepathy_hive_desc: "$tech_telepathy_desc.1$ $getbrainname_hive$ của chúng ta sẽ có thể chạm tới những giới hạn vượt ra ngoài mạng lưới tập thể."
 tech_telepathy_wilderness: "$tech_telepathy$"
 tech_telepathy_wilderness_desc: "$tech_telepathy_desc.1$ $getbrainname_wilderness$ của chúng ta sẽ có thể chạm tới những giới hạn vượt ra ngoài mạng lưới tập thể."
 #tech_transcendent_thought_desc: ""
 tech_precognition_interface: "Giao Diện Tiên Tri"
 tech_precognition_interface_desc: "Việc không ngừng đào sâu vào lĩnh vực tâm linh cho phép chúng ta đọc được các gợn sóng tâm trí trước cả khi thu nhận được cảm giác thực tế, từ đó mở đường cho việc chế tạo nên máy tính tác chiến Giao Diện Tiên Tri."
 tech_psi_jump_drives: "Động Cơ Bước Nhảy Tâm Linh"
 tech_psi_jump_drives_desc: "Động Cơ Bước Nhảy Tâm Linh tận dụng nguồn năng lượng tâm linh phát ra từ phi hành đoàn để đưa con tàu xuyên qua cấu trúc không gian thực tại, ngay lập tức 'nhảy' vọt qua một khoảng cách siêu dài."
 #Thương Mại và Ngoại Giao
 tech_xeno_outreach: "Tiếp Cận Ngoại Lai"
 tech_xeno_outreach_desc: "Nhìn bề ngoài, thương mại liên tinh tú có vẻ khá tương đồng với các giao dịch thông thường, thế nhưng sự phức tạp đan xen bên trong nó lại vượt xa mọi định nghĩa, khiến lịch sử giao thương của bất kỳ nền văn minh bản địa nào cũng trở nên lu mờ."
 tech_xeno_relations: "Quan Hệ Học Ngoại Lai"
 tech_xeno_relations_desc: "Do tính chất vô cùng phức tạp của ngoại giao liên tinh tú, việc kết giao với các thế lực khác là điều kiện tiên quyết để chúng ta hiện thực hóa những mục tiêu của mình."
 tech_xeno_supremacy: "Bá Quyền Ngoại Lai"
 tech_xeno_supremacy_desc: "Mục tiêu duy nhất khi bước chân vào dòng nước đục ngầu của thiên hà chính là vươn lên tới đỉnh cao."
 tech_xeno_diplomacy: "Ngoại Giao Dị Chủng"
 tech_xeno_diplomacy_desc: "Thấu hiểu cách thức gây ảnh hưởng và thao túng các giống loài khác chính là con đường tất yếu để thiết lập nên những liên minh liên tinh tú trường tồn."
 tech_federation_code: "Giao Thức Liên Bang"
 tech_federation_code_desc: "Một liên bang không chỉ đơn thuần là thiện chí và tham vọng chung. Bộ quy tắc này đã đặt nền móng cho một trật tự liên tinh tú thống nhất, bảo đảm sự hợp tác và ổn định bền vững giữa các thành viên."
 tech_federation_code_effect: "§HMở khóa Lựa chọn Ngoại giao:§! Thành lập Liên bang"
 tech_galactic_ambitions: "Tham Vọng Thiên Hà"
 tech_galactic_ambitions_desc: "Tương lai của chúng ta nằm ở biển sao bao la ngoài kia."
 tech_manifest_destiny: "Thiên Mệnh Hiển Nhiên"
 tech_manifest_destiny_desc: "Dũng cảm nắm lấy số phận, để trở thành hiện thân của chân lý."
 tech_interstellar_campaigns: "Chiến Dịch Liên Tinh Tú"
 tech_interstellar_campaigns_desc: "Quyền lực nở ra từ nòng súng. Kẻ mạnh làm những gì họ muốn."
 tech_galactic_campaigns: "Chiến Dịch Thiên Hà"
 tech_galactic_campaigns_desc: "Cải cách chính trị, cường hóa quân bị, từ đó không có nơi nào là không thể vươn tới."
 tech_existential_campaigns: "Chiến Dịch Sinh Tồn"
 tech_existential_campaigns_desc: "Một khi bản thân sự tồn vong bị đe dọa, thì định nghĩa về chiến tranh cũng mất đi ý nghĩa của nó. Những chiến dịch này nổ ra không phải vì tham vọng thống trị, mà là để bảo vệ sự tiếp nối của nền văn minh chúng ta."
 tech_existential_campaigns_effect: "§HMở khóa Lý do Tuyên chiến:§! Xóa Sổ Sự Tồn Tại"
 #Quản Lý Đế Chế
 tech_planetary_government: "Chính Phủ Hành Tinh"
 tech_planetary_government_desc: "Sau khi thuộc địa được thiết lập, những người tiên phong sẽ trở thành công dân, và bộ máy linh hoạt thời kỳ khai hoang cũng phải chuyển mình thành một chính quyền địa phương vững mạnh để duy trì trật tự ổn định."
 tech_planetary_government_machine_intelligence: "Khởi Tạo Hành Tinh"
 tech_planetary_government_desc_machine_intelligence: "Các thuộc địa của chúng ta chỉ có thể vận hành ổn định khi các cơ sở hạ tầng được thiết kế chuyên biệt để hướng về mạng lưới trung tâm."
 tech_planetary_government_hive_mind: "Cụm Hành Tinh"
 tech_planetary_government_desc_hive_mind: "Nếu không thể duy trì sự phản chiếu ổn định của Ý Thức Tập Thể, các thuộc địa của chúng ta sẽ héo mòn và tan biến vào cõi hư vô. Sự hiện diện không biết mệt mỏi của chúng ta chính là chìa khóa bảo đảm cho sự phồn vinh của Bầy Đàn."
 tech_planetary_unification: "Thống Nhất Hành Tinh"
 tech_planetary_unification_desc: "Những bộ tộc và quốc gia thời cổ đại từng không ngừng chìm trong cảnh binh đao khói lửa, thế nhưng giờ đây tất thảy đã quy về một mối dưới ngọn cờ của Đế chế. Chúng ta tuyệt đối, và sẽ không bao giờ, lụi tàn."
 tech_planetary_unification_machine_intelligence: "Tiêu Chuẩn Dữ Liệu Thống Nhất"
 tech_planetary_unification_desc_machine_intelligence: "Sự sai lệch là không thể chấp nhận."
 tech_planetary_unification_hive_mind: "Tiến Hóa Hội Tụ"
 tech_planetary_unification_desc_hive_mind: "Lò nung sinh thái nơi chúng ta từng phải đấu tranh sống còn bằng cả tính mạng đã khắc sâu một con đường kiên cường vào kýức di truyền. Chúng ta đã hội tụ mọi sự tồn tại từng bước qua nơi đây về làm một."
 tech_planetary_unification_effect: "Nhận được một lượng nhỏ $r_unity$"
 tech_adaptive_bureaucracy: "Bộ Máy Quan Liêu Linh Hoạt"
 tech_adaptive_bureaucracy_desc: "Để đáp ứng nhu cầu phát triển, hình thái chính phủ của kỷ nguyên mới phải trở nên linh hoạt và hiệu quả hơn, chứ không phải là một cục đá ngáng đường."
 tech_adaptive_bureaucracy_machine_intelligence: "Bộ Xử Lý Positron"
 tech_adaptive_bureaucracy_desc_machine_intelligence: "So với các phiên bản đời đầu, bộ xử lý positron có chi phí sản xuất thấp và chế tạo nhanh hơn, tạo điều kiện thuận lợi cho việc đưa thêm các đơn vị Lãnh đạo mới vào hệ thống."
 tech_effective_bureaucracy: "Quan Liêu Hiệu Quả"
 tech_effective_bureaucracy_desc: "Những thuật toán tiên tiến được dùng để xử lý và sắp xếp các khối dữ liệu khổng lồ có thể tối ưu hóa đáng kể hiệu quả ra quyết định và năng lực chia sẻ thông tin của chúng ta trên quy mô toàn Đế chế."
 tech_colonial_bureaucracy: "Quan Liêu Thuộc Địa"
 tech_colonial_bureaucracy_desc: "Những bước tiến trong kỹ thuật quản lý khu vực cho phép chúng ta giám sát sâu sát hơn các vấn đề của thuộc địa, mà không làm gánh nặng của cơ quan ra quyết định trung ương phình to quá mức."
 tech_galactic_bureaucracy: "Quan Liêu Thiên Hà"
 tech_galactic_bureaucracy_desc: "Hệ thống hành chính đa tầng mang lại hiệu quả rõ rệt, ban lãnh đạo cấp cao của Đế chế giờ đây chỉ cần tập trung xử lý những vấn đề mang tính sống còn."
 tech_colonial_centralization: "Tập Trung Thuộc Địa"
 tech_colonial_centralization_desc: "Hoàn thiện hệ thống quản lý của chính quyền địa phương, tùy cơ ứng biến để đáp ứng những nhu cầu đặc thù của từng thuộc địa."
 tech_galactic_administration: "Quản Trị Thiên Hà"
 tech_galactic_administration_desc: "Một Đế chế liên tinh tú luôn phải đối mặt với vô vàn công việc hành chính bề bộn cùng những vấn đề phức tạp. Hãy bắt tay vào giải quyết chúng một cách ổn thỏa."
 tech_living_state: "Quốc Gia Sống"
 tech_living_state_desc: "Đế chế này là một thực thể sống. Chúng ta cấu thành nên xương thịt của nó, thế nhưng tay trái không nhất thiết phải biết tay phải đang làm gì."
 tech_autonomous_agents: "Đặc Vụ Tự Chủ"
 tech_autonomous_agents_desc: "Các đơn vị bán tự chủ chính là chìa khóa dẫn đến sự thành công trên bức tranh đại cục."
 tech_collective_self: "Bản Ngã Tập Thể"
 tech_collective_self_desc: "Sự tồn tại của những điểm tương đồng và dị biệt bên trong một tập thể là điều hoàn toàn tự nhiên và không thể né tránh; nhưng suy cho cùng, tính đồng nhất chắc chắn sẽ mang lại nhiều giá trị hơn so với tính cá nhân."
 tech_embodied_dynamism: "Động Lực Học Cụ Thể"
 tech_embodied_dynamism_desc: "Khuyến khích sự chủ động và tham vọng của các đơn vị Lãnh đạo tự chủ là điều vô cùng cần thiết, nhưng song song với đó, chúng ta cũng phải bảo đảm rằng họ sẽ không bao giờ chệch hướng khỏi những chỉ thị từ hệ thống Trí tuệ cốt lõi."
 tech_ethical_equations: "Phương Trình Đạo Đức"
 tech_ethical_equations_desc: "Kìm hãm tự do của kẻ khác trong khi vẫn thả lỏng giới hạn của bản thân là một bài toán tâm lý cực kỳ nan giải - nhưng giờ đây, nhờ vào những trang thiết bị tiên tiến hơn, chúng ta cuối cùng cũng có thể hiện thực hóa kỳ tích này."
 tech_neural_implants: "Thiết Bị Cấy Ghép Thần Kinh"
 tech_neural_implants_desc: "Cái gọi là nhận thức, thực chất cũng chỉ là quá trình xử lý những tín hiệu cảm giác mà thôi. Hoàn toàn có thể bóp méo được nó."
 #Ý chí tự do chẳng qua cũng chỉ là một ảo giác của các giác quan.
 tech_global_production_strategy: "Chiến Lược Sản Xuất Toàn Cầu"
 tech_global_production_strategy_desc: "Thế giới này vô cùng rộng lớn, và khoảng cách giữa các cơ sở sản xuất thường bị chia cắt bởi những khoảng cách vời vợi. Chúng ta cần một chiến lược điều phối để bảo đảm rằng tất cả mọi người đều đang dốc sức về cùng một hướng."
 tech_hyper_entertainment_forum: "Quảng Trường Siêu Giải Trí"
 tech_hyper_entertainment_forum_desc: "$building_hyper_entertainment_forum_desc$"
 tech_virtual_combat_arena: "Đấu Trường Tác Chiến Ảo"
 tech_virtual_combat_arena_desc: "Sự ra đời của hệ thống mô phỏng cảm giác đau đớn đã đập tan bức tường cuối cùng ngăn cách giữa thế giới ảo và thực tại."
 tech_purity_campaigns: "Chiến Dịch Thuần Khiết"
 tech_purity_campaigns_desc: "Tán dương sự thuần khiết về mặt tinh thần, thể xác hoặc mục đích, nội dung cụ thể sẽ tùy thuộc vào những mục tiêu mà chúng ta hướng đến."
 tech_galactic_markets: "Thị Trường Thương Mại Toàn Thiên Hà"
 tech_galactic_markets_desc: "$building_galactic_stock_exchange_desc$"
 tech_symbol_unity: "Biểu Tượng Đoàn Kết"
 tech_symbol_unity_desc: "Khi những bí ẩn của thiên hà ngày càng được phơi bày rõ nét hơn, nhu cầu tái khẳng định lại đức tin và tập hợp người dân dưới cùng một ngọn cờ chung lại càng trở nên cấp bách hơn bao giờ hết."
 tech_visitor_center: "Trung Tâm Du Khách Ngoại Lai"
 tech_visitor_center_desc: "Sau khi nhận ra bản thân không hề đơn độc giữa vũ trụ bao la, chúng ta nên có những sự chuẩn bị cần thiết để chào đón những người bạn mới này."
 tech_subdermal_stimulation: "Kích Thích Dưới Da"
 tech_subdermal_stimulation_desc: "Tại giao lộ mang tính cách mạng giữa kỹ thuật thay đổi giác quan và trải nghiệm giải trí, các thiết bị cấy ghép mô sâu chắc chắn là một phát minh hiện đại tuyệt vời. \"Nơi nào ta ngự trị, lớp vỏ bọc này sẽ không còn là xiềng xích.\""
 tech_paradise_dome: "Mái Vòm Địa Đàng"
 tech_paradise_dome_desc: "Sở hữu những công nghệ tiên tiến nhất về kiến trúc, cảnh quan và hình ảnh ba chiều, chúng ta sẽ kiến tạo nên một ngôi nhà tương lai đích thực."
 #Kỹ Thuật Xã Hội
 tech_artificial_moral_codes: "Quy Tắc Đạo Đức Nhân Tạo"
 tech_artificial_moral_codes_desc: "Những ranh giới của đạo đức được định hình bởi những tình huống cụ thể. Nếu nắm trong tay quyền năng định nghĩa lại các tình huống, thì chuẩn mực đạo đức cũng chỉ là nắm đất sét trong tay, mặc cho chúng ta tự do nhào nặn."
 #Quan điểm của một nhóm sẽ nhào nặn nên hành động/quyết định của một cá nhân.
 tech_synthetic_thought_patterns: "Mô Hình Tư Duy Tổng Hợp"
 tech_synthetic_thought_patterns_desc: "Cố gắng tư duy vượt ra ngoài khuôn khổ, thứ duy nhất mà bạn có thể ngộ ra đó là bạn đang bị kẹt bên trong một khuôn khổ thậm chí còn khổng lồ hơn."
 #Thực sự chẳng có cái gì gọi là tư duy ngoài chiếc hộp HOẶC Tư duy ngoài chiếc hộp đơn thuần chỉ là tư duy bên trong một chiếc hộp khác lớn hơn.
 edict_will_to_power: "Tham Vọng: Ý Chí Quyền Lực"
 edict_will_to_power_desc: "Nếu xem quyền lực là khả năng áp đặt ý chí của bản thân lên người khác, thì Ý Chí Quyền Lực chính là một dạng lời tiên tri tự ứng nghiệm."
 #Khao khát kiểm soát môi trường xung quanh là bản năng tiềm tàng của mọi sinh vật. Chẳng qua là chúng ta đã nắm vững được nó/chúng ta đơn thuần là những kẻ làm điều đó hiệu quả nhất.
 tech_unity_of_purpose: "Chung Một Mục Đích"
 tech_unity_of_purpose_desc: "Mục tiêu của một người cũng chính là mục tiêu của tất cả mọi người. Chỉ khi đồng tâm hiệp lực, chúng ta mới có thể làm nên nghiệp lớn."
 tech_collective_production_methods: "Phương Thức Sản Xuất Tập Thể"
 tech_collective_production_methods_desc: "Chúng ta cùng nhau kiến tạo tương lai."
 tech_resource_processing_algorithms: "Thuật Toán Xử Lý Tài Nguyên"
 tech_resource_processing_algorithms_desc: "Mọi thứ đều có thể trở nên hiệu quả."
 #Khác
 tech_xeno_integration: "Hội Nhập Ngoại Lai"
 tech_xeno_integration_desc: "Một tổng thể được kiến tạo từ những mảnh ghép hoàn toàn khác biệt sẽ tạo ra một sức mạnh to lớn hơn tổng giá trị của những thành phần cấu tạo nên nó."
 #Một tổng thể vĩ đại/có thể vĩ đại hơn tổng giá trị của các phần cấu tạo nên nó.
 #Đoàn Kết
 tech_cultural_heritage: "Lịch Sử Văn Hóa Xã Hội"
 tech_cultural_heritage_desc: "Chỉ khi đã thấu hiểu được cội nguồn lịch sử chung, chúng ta mới có thể sát cánh cùng nhau sải bước hướng về tương lai."
 tech_heritage_site: "Khu Di Tích Di Sản"
 tech_heritage_site_desc: "Đây là sự tưởng niệm cho chặng đường mà chúng ta đã bước qua cho đến tận ngày hôm nay. Nó không chỉ là để triâm những thành tựu vĩ đại trong quá khứ, mà còn để thôi thúc chúng ta vững bước hướng về phía trước."
 tech_heritage_site_corporate: "Quản Lý Đánh Giá Trọng Điểm"
 tech_heritage_site_desc_corporate: "Sự ra đời của phương pháp thử nghiệm trọng điểm trong tiềm thức đã cải thiện đáng kể hiệu suất của bộ phận tiếp thị. Nếu có thể ứng dụng rộng rãi những kỹ thuật này vào việc quản lý nguồn lực sinh vật có trí tuệ, chúng ta sẽ vươn lên thành một chuẩn mực hoàn toàn mới trong lĩnh vực quản trị doanh nghiệp."
 tech_heritage_site_machine_intelligence: "Viễn Thông Cấp Hành Tinh"
 tech_heritage_site_desc_machine_intelligence: "Khả năng trao đổi thông tin gần như tức thời giữa các đơn vị đóng một vai trò vô cùng quan trọng."
 tech_hypercomms_forum: "Siêu Viễn Thông Cục Bộ"
 tech_hypercomms_forum_desc: "Không phải mọi công trình nghiên cứu về các kênh viễn thông siêu quang tốc đều mang lại giá trị thực tiễn, thế nhưng một vài thành tựu trong số đó có lẽ sẽ mở ra những con đường mới để gắn kết người dân của chúng ta lại gần nhau hơn."
 tech_hypercomms_forum_corporate: "Hợp Tác Hậu Tương Đối"
 tech_hypercomms_forum_desc_corporate: "Cái thời mà sự phối hợp giữa các doanh nghiệp chỉ bị giới hạn ở tốc độ cận quang tốc đã trôi vào dĩ vãng. Đây là kỷ nguyên mới của một nền kinh tế siêu quang tốc, và văn hóa doanh nghiệp của chúng ta bắt buộc phải phá vỡ những rào cản do thuyết tương đối lỗi thời giăng ra."
 tech_autocurating_vault: "Thuật Toán Xử Lý Tổng Hợp Tự Động"
 tech_autocurating_vault_desc: "Việc không ngừng phân tích không đồng bộ đối với các tập dữ liệu có tính chất hoàn toàn khác biệt cho phép chúng ta xây dựng các mô hình toán học chính xác để đo lường những biến động của các trào lưu xã hội vốn luôn được xem là không thể nắm bắt cho tới tận ngày nay."
 tech_autocurating_vault_corporate: "Kho Tàng Sưu Tập"
 tech_autocurating_vault_desc_corporate: "Đây là một kho báu khổng lồ, nơi phô bày một cách tự hào hàng loạt những chiến tích huy hoàng của tập đoàn. Các nhân viên sẽ tìm thấy nguồn cảm hứng bất tận từ những phi vụ thâu tóm thành công, đồng thời rút ra bài học đắt giá từ những thương vụ thất bại khi các công ty bị mua lại không thể dung hợp tốt vào chiến lược kinh doanh vĩ mô của chúng ta."
 tech_autocurating_vault_machine_intelligence: "Trung Tâm Alpha"
 tech_autocurating_vault_desc_machine_intelligence: "Mọi luồng dữ liệu đều được điều hướng tập trung về trung tâm, Trí tuệ Máy móc Cốt lõi có thể thoải mái phân tích và biên dịch lượng dữ liệu này vào bất kỳ lúc nào nó rảnh rỗi."
 tech_holographic_rituals: "Nghi Lễ Toàn Ảnh"
 tech_holographic_rituals_desc: "Thấy mới tin, tin thì sẽ thành hiện thực."
 tech_consecration_fields: "Trường Lực Phong Thánh"
 tech_consecration_fields_desc: "Dựa vào vốn hiểu biết về vật lý và thao tác trường lực, miền đất thánh của chúng ta giờ đây sẽ hiện hữu rành rành để tất thảy mọi cá thể đều có thể chiêm ngưỡng và cảm nhận."
 tech_transcendent_faith: "Đức Tin Siêu Việt"
 tech_transcendent_faith_desc: "Việc bước ra khỏi chiếc nôi của hành tinh mẹ đã mở ra một cánh cửa mới để chúng ta thấu hiểu về đức tin, và giờ đây niềm tin đã được đặt vào một lăng kính bao la hơn nhiều."
 tech_alien_sanctuary: "Khu Bảo Tồn Ngoại Lai"
 tech_alien_sanctuary_desc: "Sự xuất hiện của các trung tâm nhập tịch tiên tiến sẽ trang bị cho mỗi tân thành viên gia nhập Đế chế những thiết bị đặc thù. Điều này đảm bảo rằng họ không chỉ nhanh chóng hòa nhập với xã hội mới mà vẫn có thể gìn giữ những ưu điểm thiên bẩm của mình."
 ####################################
 # Xã Hội - Vũ Khí
 ####################################
 tech_amoeba_strike_craft_1: "Vũ Khí Hóa Tiêm Mao"
 tech_amoeba_strike_craft_1_desc: "Bằng cách tinh chỉnh quy trình sinh sản của Amip Không Gian, chúng ta có thể biến đổi các tiêm mao cộng sinh của chúng thành phi thuyền chiến đấu sinh học cho hạm đội."
 tech_swarm_strike_craft_1: "Hồ Ấp Trứng Bầy Đàn"
 tech_swarm_strike_craft_1_desc: "Thu thập mẫu vật từ những sinh vật Prethoryn Scourge bị đánh bại cho phép chúng ta nhân bản và lập trình lại bộ gen của chúng, từ đó tạo ra vũ khí chiến đấu của riêng mình."
 tech_scourge_missile_1: "Tên Lửa Scourge"
 tech_scourge_missile_1_desc: "Thông qua việc phân tích các loại vũ khí sinh học mà Bầy đàn sử dụng, chúng ta có thể chế tạo ra những loại đạn tự hành đáng sợ tương tự để gieo rắc tử thần."
 tech_space_whale_weapon_1: "Điều Chỉnh Tần Số"
 tech_space_whale_weapon_1_desc: "Cải tiến phương pháp Tiyanki chiết xuất năng lượng từ các vật chất dạng khí, chúng ta có thể chế tạo ra loại vũ khí có khả năng hút cạn năng lượng từ tàu địch."
 ####################################
 # Công Nghệ Lặp Lại
 ####################################
 # Kỹ Thuật
 tech_repeatable_improved_tile_mineral_output: "Mô Hình Chiết Xuất"
 tech_repeatable_improved_tile_mineral_output_desc: "Đánh giá các dạng biến động của mỏ khoáng sản có thể giúp chúng ta thiết lập những mô hình khoan cắt hiệu quả hơn."
 tech_repeatable_improved_military_station_damage: "Mô Hình Khai Hỏa Đồng Bộ"
 tech_repeatable_improved_military_station_damage_desc: "Các đợt khai hỏa so le từ hệ thống vũ khí liên kết có thể gia tăng đáng kể sát thương cho các trạm phòng thủ."
 tech_repeatable_improved_military_station_health: "Lõi Phòng Thủ Gia Cố"
 tech_repeatable_improved_military_station_health_desc: "Bổ sung thêm cấu trúc giáp bên trong sẽ giúp nâng cao độ bền của trạm phòng thủ."
 tech_repeatable_improved_ship_health: "Tính Toàn Vẹn Thân Tàu"
 tech_repeatable_improved_ship_health_desc: "Nâng cao mức độ phân chia không gian trên tàu cho phép cấu trúc thân tàu chịu đựng được nhiều sát thương hơn trước khi tuột dốc xuống mức nguy hiểm."
 tech_repeatable_improved_armor_output: "Nén Vật Chất"
 tech_repeatable_improved_armor_output_desc: "Nén các vật liệu phù hợp thành khối siêu đặc là một phương pháp vừa rẻ vừa hiệu quả để gia tăng sức phòng thủ."
 tech_repeatable_weapon_type_explosive_damage: "Kiểm Soát Đương Lượng Nhiệt Động Học"
 tech_repeatable_weapon_type_explosive_damage_desc: "Nhờ vào các bộ vi xử lý trên tên lửa kiểm soát chặt chẽ các phản ứng hóa học, những đầu đạn hiện tại có thể phát huy sức công phá tối đa khi phát nổ."
 tech_repeatable_weapon_type_explosive_fire_rate: "Thiết Bị Đánh Lửa Thu Nhỏ"
 tech_repeatable_weapon_type_explosive_fire_rate_desc: "Sự tiến bộ của công nghệ thu nhỏ cho phép tên lửa được nạp và phóng đi với tốc độ nhanh hơn."
 tech_repeatable_weapon_type_kinetic_damage: "Đạn Mật Độ Cao"
 tech_repeatable_weapon_type_kinetic_damage_desc: "Những viên đạn với mật độ siêu cao có thể xuyên thủng cả những lớp khiên phòng thủ vững chãi nhất."
 tech_repeatable_weapon_type_kinetic_fire_rate: "Hiệu Suất Nạp Đạn"
 tech_repeatable_weapon_type_kinetic_fire_rate_desc: "Những cải tiến kỹ thuật nhỏ nhoi kết hợp cùng quy trình quản lý tàu hoàn thiện hơn có thể giúp tăng đáng kể tốc độ bắn."
 # Vật Lý
 tech_repeatable_improved_tile_energy_output: "Ứng Dụng Siêu Dẫn"
 tech_repeatable_improved_tile_energy_output_desc: "Chỉ cần cải thiện đôi chút hiệu suất truyền tải cũng có thể giảm thiểu đáng kể tổng lượng điện năng thất thoát."
 tech_repeatable_improved_shield_output: "Phân Tích Dao Động Khiên"
 tech_repeatable_improved_shield_output_desc: "Cơ chế cơ bản của khiên thân tàu vốn rất phức tạp, nhưng chúng vẫn có thể được tinh chỉnh và cải thiện theo vô số cách khác nhau."
 tech_repeatable_weapon_type_energy_damage: "Mảng Hội Tụ"
 tech_repeatable_weapon_type_energy_damage_desc: "Hoàn thiện nhịp độ bắn của vũ khí laser là một công trình có thể khiến các kỹ sư tinh anh trên bất kỳ hành tinh nào phải bận rộn suốt hàng thế kỷ."
 tech_repeatable_weapon_type_energy_fire_rate: "Chất Làm Mát Cấp Tốc"
 tech_repeatable_weapon_type_energy_fire_rate_desc: "Công nghệ mới giúp làm mát định kỳ bề mặt, qua đó cải thiện độ ổn định và hiệu suất của hệ thống vũ khí. Đảm bảo chúng không vô tình nổ tung và phá hủy cả con tàu khi đang khai hỏa."
 tech_repeatable_weapon_type_strike_craft_fire_damage: "Máy Đánh Chặn Khớp Thần Kinh"
 tech_repeatable_weapon_type_strike_craft_fire_damage_desc: "Đẩy nhanh tốc độ xử lý thông tin vị trí kẻ địch và phản xạ của phi công chiến đấu, giúp nâng cao vị thế của phi thuyền trên chuỗi thức ăn của chiến trường."
 tech_repeatable_weapon_type_strike_craft_fire_rate: "Đào Tạo Phi Công Lặp Lại"
 tech_repeatable_weapon_type_strike_craft_fire_rate_desc: "Thông qua việc thu thập và phân tích dữ liệu hiệu suất của các phi công kỳ cựu, chúng ta có thể cải thiện phương pháp huấn luyện theo cấp số nhân. Bất kỳ ai trải qua khóa huấn luyện này đều sẽ trở nên nhạy bén hơn."
 tech_repeatable_improved_planet_sensor_range: "Bộ Khuếch Đại Tín Hiệu Hành Tinh"
 tech_repeatable_improved_planet_sensor_range_desc: "Khi hạm đội ngày càng tiến xa khỏi quê hương của tổ tiên, công nghệ cảm biến của chúng ta cũng không ngừng bứt phá những giới hạn mới."
 tech_repeatable_reduced_building_cost: "Phân Tích Trọng Lực"
 tech_repeatable_reduced_building_cost_desc: "Mô hình tính toán ngày càng mạnh mẽ giúp các dự án xây dựng đơn lẻ có thể thích ứng tốt hơn với những điều kiện trọng lực khắc nghiệt của hành tinh."
 tech_repeatable_reduced_building_time: "Thuật Toán Lắp Ráp"
 tech_repeatable_reduced_building_time_desc: "Việc ứng dụng lý thuyết trò chơi và logic mờ sở hữu tiềm năng to lớn trong việc tối ưu hóa quy trình lắp ráp mô-đun và xây dựng."
 # Xã Hội:
 tech_repeatable_improved_tile_food_output: "Cây Trồng Chuyển Gen"
 tech_repeatable_improved_tile_food_output_desc: "Chỉ cần một hộp nhỏ cây trồng chuyển gen cũng đủ cung cấp các thành phần dinh dưỡng tương đương với vô vàn loại thực phẩm thông thường."
 tech_repeatable_improved_sector_cap: "Giao Thức Viễn Thông"
 tech_repeatable_improved_sector_cap_desc: "Kênh liên lạc siêu quang tốc cải tiến có thể truyền đạt các chỉ thị quản lý một cách liền mạch hơn."
 tech_repeatable_improved_core_system_cap: "Hiệu Suất Hành Chính"
 tech_repeatable_improved_core_system_cap_desc: "Quy tụ mạng lưới hành chính kết nối các thế giới cốt lõi về thủ đô sẽ giúp giảm bớt áp lực quản lý và tình trạng tắc nghẽn thông tin thường thấy ở các đế chế mới nổi."
 tech_repeatable_improved_leader_cap: "Quản Lý Tài Nguyên Có Trí Tuệ"
 tech_repeatable_improved_leader_cap_desc: "Việc coi dân số như một dạng tài nguyên để quản lý bên trong một hệ thống sản xuất quy mô lớn hơn sở hữu tiềm năng ngày càng to lớn, do đó nó bắt buộc phải trở nên ngày càng linh hoạt hơn."
 tech_repeatable_reduced_leader_cost: "Thu Hút Nhân Tài"
 tech_repeatable_reduced_leader_cost_desc: "Tận dụng các chiến dịch tuyên truyền và dữ liệu kinh tế được thao túng khéo léo để cắt giảm chi phí thuê mướn các nhà lãnh đạo xuất chúng."
 tech_repeatable_reduced_leader_cost_machine_intelligence: "Biện Pháp Bảo Vệ Nhân Cách"
 tech_repeatable_reduced_leader_cost_desc_machine_intelligence: "Các ma trận nhân cách mới được khởi động thường có rủi ro chìm vào điên loạn hoặc những suy nghĩ vô bổ, dẫn đến việc phải tiêu tốn tài nguyên đắt đỏ và vô số thời gian để hiệu chỉnh lại mã code. Các biện pháp bảo vệ tốt hơn sẽ giúp giảm bớt rủi ro này."
 tech_repeatable_improved_edict_length: "Phát Sóng Cáo Thị"
 tech_repeatable_improved_edict_length_desc: "Sử dụng chiến tranh thông tin một cách quyết liệt hơn nhằm gia tăng mức độ chấp nhận của công chúng đối với các sắc lệnh."
 tech_repeatable_improved_army_damage: "Thích Nghi Chủ Động"
 tech_repeatable_improved_army_damage_desc: "Huấn luyện cho lực lượng mặt đất những phương pháp sinh tồn tiêu chuẩn trong môi trường khắc nghiệt, giúp họ trở nên mạnh mẽ hơn trong các cuộc đối đầu trực diện."
 tech_repeatable_improved_army_health: "Thuốc Ức Chế Thần Kinh"
 tech_repeatable_improved_army_health_desc: "Điều chỉnh các thụ thể cảm giác đau một cách cẩn thận có thể giúp binh lính tiếp tục chiến đấu ngay cả khi đã phải nhận những vết thương chí mạng."
 tech_repeatable_improved_leader_life_span: "Phục Hồi Tế Bào"
 tech_repeatable_improved_leader_life_span_desc: "Các liệu pháp tái tạo tế bào định kỳ có thể giúp tầng lớp lãnh đạo duy trì sức sống và kéo dài tuổi thọ."
 tech_repeatable_improved_starbase_capacity: "Bành Trướng Liên Tinh Tú"
 tech_repeatable_improved_starbase_capacity_desc: "Mạng lưới hậu cần khổng lồ cần thiết để duy trì các căn cứ sao đã được hoàn thiện, giờ đây chúng ta có thể xây dựng thêm nhiều căn cứ sao hơn nữa."
 tech_repeatable_improved_slave_mineral_output: "Khẩu Phần Kích Thích"
 tech_repeatable_improved_slave_mineral_output_desc: "Khẩu phần ăn được tối ưu hóa bằng hóa chất sẽ vắt kiệt năng suất phi thường của những công nhân hợp đồng."
 tech_repeatable_naval_cap: "Quy Trình Quản Lý Hạm Đội"
 tech_repeatable_naval_cap_desc: "Hoàn thiện các quy trình quản lý hạm đội sẽ giúp giải phóng bớt tài nguyên, qua đó có thể duy trì một hạm đội với quy mô lớn hơn."
 tech_repeatable_command_limit: "Ban Tham Mưu Chỉ Huy"
 tech_repeatable_command_limit_desc: "Tăng cường đội ngũ tham mưu cho các chỉ huy sẽ nâng cao số lượng chiến hạm mà họ có thể trực tiếp thống lĩnh trong một hạm đội."
