 computing_desc: "Nghiên cứu khoa học về ứng dụng thuật toán."
 metaphysics: "Siêu Hình Học"
 metaphysics_desc: "Tri thức là vô tận."
 statecraft: "Nghệ Thuật Trị Quốc"
 statecraft_desc: "Nghệ thuật để xây dựng một xã hội thành công."
 biology: "Sinh Học"
 biology_desc: "Môn khoa học nghiên cứu về sự đa dạng và phức tạp của các dạng sống."
 military_theory: "Lý Luận Quân Sự"
 military_theory_desc: "Nghệ thuật chiến tranh và các khía cạnh quan trọng của nó."
 new_worlds: "Lý Thuyết Thế Giới Mới"
 new_worlds_desc: "Các giao thức thuộc địa hóa và huấn luyện khai hoang."
 psionics: "Lý Thuyết Ngoại Cảm"
 psionics_desc: "Tâm trí vượt lên vật chất."
