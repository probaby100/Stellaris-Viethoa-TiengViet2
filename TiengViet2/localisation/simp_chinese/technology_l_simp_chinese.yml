 # Cổng Sao
 #####################################
 gateway_capital: "§HCon Đường Nội Chính§!\n§ECông nghệ này cho phép tiếp tục nâng cấp các tòa nhà thủ phủ và nhận được £unity£§HThống nhất§!. Nâng cấp thủ phủ hành tinh là điều kiện tiên quyết để xây dựng các §HTòa nhà Cấp cao§!.§!"
 gateway_biological: "§HCon Đường Sinh Học§!\n§ECông nghệ này cho phép tiếp tục phát triển các công nghệ cường hóa và thích nghi sinh học.§!"
 gateway_ship: "§HCon Đường Phi Thuyền§!\n§ECông nghệ này cho phép chế tạo các trạm không gian lớn hơn và những phi thuyền mạnh mẽ hơn.§!"
 gateway_psionics: "§HCon Đường Ngoại Cảm§!\n§ECông nghệ này sẽ thúc đẩy hơn nữa sự phát triển công nghệ trong lĩnh vực ngoại cảm.§!"
 gateway_robotics: "§HCon Đường Máy Móc§!\n§ECông nghệ này sẽ thúc đẩy hơn nữa sự phát triển công nghệ trong lĩnh vực người máy.§!"
 gateway_kinetic_weapons: "§HCon Đường Vũ Khí Động Năng§!\n§ECông nghệ này sẽ thúc đẩy hơn nữa sự phát triển công nghệ trong lĩnh vực vũ khí động năng.§!"
 gateway_energy_weapons: "§HCon Đường Vũ Khí Năng Lượng§!\n§ECông nghệ này sẽ thúc đẩy hơn nữa sự phát triển công nghệ trong lĩnh vực vũ khí năng lượng.§!"
 gateway_power_generation: "§HSản Xuất Năng Lượng§!\n§ECông nghệ này sẽ thúc đẩy hơn nữa sự phát triển công nghệ trong một số lĩnh vực khác nhau.§!"
 gateway_espionage: "§HCon Đường Bí Mật§!\n§ECông nghệ này sẽ thúc đẩy hơn nữa sự phát triển của các hoạt động tình báo và chiến dịch ngầm.§!"
 gateway_infrastructure: "§HCon Đường Cơ Sở Hạ Tầng§!\n§ECông nghệ này sẽ thúc đẩy hơn nữa sự phát triển của cơ sở hạ tầng dân sự.§!"
 gateway_cloaking: "§HCon Đường Tàng Hình§!\n§ECông nghệ này sẽ thúc đẩy hơn nữa sự phát triển công nghệ của máy tạo trường tàng hình.§!"
 gateway_detection: "§HCon Đường Dò Tìm§!\n§ECông nghệ này sẽ thúc đẩy hơn nữa sự phát triển công nghệ trong việc dò tìm hạm đội tàng hình.§!"
 gateway_node_reformatting: "§HCon Đường Tái Định Dạng Điểm Nút§!\n§ECông nghệ này sẽ mang lại nhiều cải tiến hơn trong nghị trình tái định dạng điểm nút.§!"
 gateway_node_culling: "§HCon Đường Loại Bỏ Điểm Nút§!\n§ECông nghệ này sẽ mang lại nhiều cải tiến hơn trong nghị trình loại bỏ điểm nút.§!"
 gateway_zone: "§HCon Đường Chuyên Biệt Hóa Đặc Khu Nông Thôn§!\n§ECông nghệ này sẽ tiếp tục dẫn dắt sự tiến bộ và phát triển trong lĩnh vực công trình chuyên biệt hóa cho các đặc khu nông thôn.§!"
