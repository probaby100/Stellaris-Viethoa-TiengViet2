 tech_curator_lab: "Phòng Thí Nghiệm Khám Phá Curator"
 tech_curator_lab_desc: "Những cơ sở thí nghiệm trên tàu này được tích hợp các công nghệ tiên tiến của hội Curator cổ đại, giúp đẩy nhanh tốc độ khảo sát."
 tech_archeology_lab: "Phòng Thí Nghiệm Khảo Cổ Curator"
 tech_archeology_lab_desc: "Phòng thí nghiệm trên tàu được trang bị những công cụ khảo cổ học hiện đại, bao gồm cả một cơ sở dữ liệu khổng lồ do hội Curator cung cấp, giúp việc đánh dấu các khám phá mới trở nên dễ dàng hơn bao giờ hết."
 tech_archeology_lab_ancrel: "$tech_archeology_lab$"
 tech_archeology_lab_ancrel_desc: "$tech_archeology_lab_desc$"
