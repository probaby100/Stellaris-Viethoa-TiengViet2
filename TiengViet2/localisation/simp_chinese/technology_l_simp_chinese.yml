 tech_titan_hull_1: "Thân Titan Cải Tiến"
 tech_titan_hull_1_desc: "Tiến bộ trong kỹ thuật đóng tàu sẽ cho phép chúng ta chế tạo những chiếc Titan cứng cáp và bền bỉ hơn."
 tech_titan_hull_2: "Thân Titan Tân Tiến"
 tech_titan_hull_2_desc: "Thế hệ Titan mới nhất đã được tối ưu hóa tính toàn vẹn của cấu trúc và cải tiến các vách ngăn."
