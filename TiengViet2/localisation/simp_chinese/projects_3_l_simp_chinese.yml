l_simp_chinese:
 ####################################
 #Dự Án Đặc Biệt
 ####################################
 ### Sự Kiện Dị Thường
 DERELICT_SHIP_PROJECT: "Tàu Bỏ Hoang"
 DERELICT_SHIP_PROJECT_DESC: "Một con tàu trôi dạt trong không gian, hoàn toàn im lìm không phát ra tín hiệu. Một cuộc kiểm tra kỹ lưỡng hơn có lẽ sẽ giúp làm rõ phi hành đoàn của nó đã gặp phải chuyện gì."
 ODD_STAR_PROJECT: "Ngọn Lửa Trong Lò"
 ODD_STAR_PROJECT_DESC: "Ngôi sao này dường như đang diễn ra phản ứng nhiệt hạch tạo ra Beryllium, một điều lẽ ra là không thể."
 IMPROBABLE_TEAPOT_PROJECT: "Đồ Sứ Khó Tin"
 IMPROBABLE_TEAPOT_PROJECT_DESC: "Một ấm trà bằng gốm sứ đang quay quanh một ngôi sao... chuyện này quả thực quá đỗi hoang đường. Sẽ mất rất nhiều thời gian để tìm hiểu xem nó được hình thành như thế nào. Nào ai biết liệu ta có tìm được câu trả lời hay không, hoặc thậm chí vấn đề này căn bản chẳng có đáp án?"
 AI_ADMIRAL_PROJECT: "Chiến Binh Trên Sa Mạc"
 AI_ADMIRAL_PROJECT_DESC: "Phát hiện một hạm đội cổ đại bị rơi trên hành tinh sa mạc, hệ thống AI trên tàu của chúng vẫn còn hoạt động. Nếu ta không chế ngự nó, tình hình sẽ nhanh chóng tồi tệ đi."
 MINING_GEAR_PROJECT: "Mũi Khoan Lộng Hành"
 MINING_GEAR_PROJECT_DESC: "Một cỗ máy đào bới cổ đại đang miệt mài khoét sâu vào lòng tiểu hành tinh khổng lồ. Nếu ta có thể dừng nó lại trước khi nó bị gạch đá đè nát, có khi ta sẽ mót được vài kiến thức hữu ích về xây dựng."
 ABANDONED_ARRAY_PROJECT: "Hệ Thống Cảm Biến Bị Vứt Xó"
 ABANDONED_ARRAY_PROJECT_DESC: "Một hệ thống cảm biến bị bỏ hoang dường như vẫn đang hoạt động. Nếu ta có thể sửa chữa và tìm hiểu cách nó vận hành, ta có khả năng thu thập được thông tin chi tiết hơn về các hệ sao lân cận."
 ALIEN_RACER_PROJECT: "Trôi Dạt"
 ALIEN_RACER_PROJECT_DESC: "Một phi thuyền ngoài hành tinh đang trôi dạt trong vành đai tiểu hành tinh. Nó hoàn toàn không phản hồi tín hiệu liên lạc. Ta nên điều tra xem rốt cuộc chuyện gì đã xảy ra."
 PSIONIC_HORSES_PROJECT: "Chúa Tể Thảo Nguyên"
 PSIONIC_HORSES_PROJECT_DESC: "Một đàn thú có vú tuyệt đẹp đang thong dong gặm cỏ trên vùng đồng không mông quạnh tươi tốt. Có vẻ chúng hơi cảnh giác khi ta tiến lại gần. Một cuộc nghiên cứu cận cảnh sẽ mang lại nhiều thông tin hơn."
 ROBOT_CLEANERS_PROJECT: "Máy Móc Bị Bỏ Lại"
 ROBOT_CLEANERS_PROJECT_DESC: "Phát hiện một nhà máy kẹt cứng người máy trên một hành tinh xa xôi. Nếu có thể kích hoạt lại bọn chúng, ta có lẽ sẽ lôi ra được bí mật về quê hương của chúng."
 ALIEN_MONSTER_ON_SHIP: "Quái Vật Lên Tàu"
 ALIEN_MONSTER_ON_SHIP_DESC: "[Root.Owner.GetMonsterOnShipDesc]" #Một mô tả tùy chỉnh theo kịch bản cho phép hỗ trợ cho Trí tuệ Máy móc
 TREE_OF_LIFE: "Đại Thụ"
 TREE_OF_LIFE_DESC: "Một cái cây trôi dạt trơ trọi giữa khoảng không vũ trụ vô tận, nhựa của nó đang thu hút đủ loại sinh vật hung dữ ngoài không gian. Ta nên điều tra công dụng của nó."
 MASTERS_WRITINGS_POLITICS: "Dịch Văn Bản Của Dân Định Cư"
 MASTERS_WRITINGS_POLITICS_DESC: "Ta đã tìm thấy một chồng tài liệu, có vẻ là những thứ rất quan trọng đối với một cộng đồng đã bị diệt vong. Dịch được chúng chắc chắn sẽ mang lại cơ hội đào sâu hơn vào lịch sử và văn hóa của họ."
 MASTERS_WRITINGS_PHILOSOPHY: "Dịch Văn Bản Của Nhà Thám Hiểm"
 MASTERS_WRITINGS_PHILOSOPHY_DESC: "Ta tìm thấy vài tài liệu mà một nhà thám hiểm ngoài hành tinh mang theo. Nếu có thể dịch chúng, ta có lẽ sẽ hiểu thêm về chủ nhân trước đây của nó."
 MASTERS_WRITINGS_DIPLOMACY: "Dịch Văn Bản Của Thương Nhân"
 MASTERS_WRITINGS_DIPLOMACY_DESC: "Ta phát hiện vài văn bản trong đống đổ nát của một nơi có vẻ từng là trạm giao thương liên sao. Nếu dịch được đống tài liệu này, ta có thể biết thêm về những kẻ đã xây dựng nên nó."
 MASTERS_WRITINGS_WAR: "Dịch Văn Bản Của Chiến Binh"
 MASTERS_WRITINGS_WAR_DESC: "Ta tìm thấy hài cốt của một nhóm chiến binh tại di tích của một chiến trường bị bỏ hoang từ lâu, cùng với những tài liệu mà họ mang theo hẳn là vô cùng quan trọng đối với họ. Nếu dịch được chúng, ta có thể hiểu cặn kẽ hơn về giống loài này cũng như cuộc chiến mà họ đã trải qua."
 CRYOPOD_FOUND_PROJECT: "Hầm Trú Ẩn Ngầm"
 CRYOPOD_FOUND_PROJECT_DESC: "Ta tìm thấy một công trình nằm sâu dưới lòng núi, nơi này có thể chứa đựng những thông tin hoặc thiết bị vô giá. Xung quanh nó đầy rẫy thú dữ, muốn động vào đó thì trước tiên phải khuất phục lũ dã thú này đã."
 CRYOPOD_OPENING_PROJECT: "Nạy Mở Nó"
 CRYOPOD_OPENING_PROJECT_DESC: "Bên trong hầm trú ẩn mà ta phát hiện có chứa một vật chứa. Nếu muốn biết có thứ gì bên trong, ta cần tìm ra cách tốt nhất để nạy nó ra."
 ANCIENT_OCEAN_SHIP: "Tuần Dương Hạm Bị Nhấn Chìm"
 ANCIENT_OCEAN_SHIP_DESC: "Một tuần dương hạm ngoài hành tinh đang nằm thoi thóp dưới đáy biển [Root.GetName]. Trục vớt nó lên có lẽ sẽ thu hoạch được công nghệ hoặc tài nguyên quý giá."
