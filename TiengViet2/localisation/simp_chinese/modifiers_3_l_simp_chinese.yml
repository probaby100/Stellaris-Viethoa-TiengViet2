 dark_immortal_control: "Sự Hiện Diện Của Bóng Tối Vĩnh Hằng"
 dark_immortal_control_desc: "Hành tinh này đang phải chịu đựng sự đày đọa của thế lực bóng tối. Nỗi bi thương đã nhấn chìm đi sự phồn vinh của nền sản xuất."
 remnants_of_court_of_blossoms: "Tàn Tích Vương Đình Hoa"
 remnants_of_court_of_blossoms_desc: "Hành tinh này đang đâm chồi nảy lộc trên chính đống đổ nát của nơi từng là Vương Đình Hoa."
 happy_anathari: "Tương Lai Thống Nhất"
 happy_anathari_desc: "Kể từ ngày hôm nay, vận mệnh của chúng ta và người Anathari đã hòa làm một. Chúng ta sẽ cùng nhau vun đắp tương lai, khi hành tinh này bừng lên một sức sống mới và bầu trời lại ngập tràn tia hy vọng."
 black_crystal_no_grand_archive: "Hào Quang Hắc Tinh Thể"
 black_crystal_no_grand_archive_desc: "Hắc tinh thể có thể khiến những người xung quanh cảm thấy hạnh phúc."
 black_crystal_engine_speed: "Hắc Tinh Thể Năng Lượng"
 black_crystal_engine_speed_desc: "Hắc tinh thể được cấu tạo từ một loại vật chất có khả năng gia tăng lực đẩy của tàu Ark."
 mysterious_doll: "Bí Ẩn Chưa Giải"
 mysterious_doll_desc: "Các nhà khoa học liên tục tìm đến cổ vật này, vô số kiến giải sâu sắc mà nó mang lại đã thu hút mạnh mẽ sự chú ý của chúng ta."
 happy_giants: "Sân Chơi Của Cự Thú"
 happy_giants_desc: "Mọi người trên tàu Ark §Y[Root.GetName]§! đều bị mê hoặc bởi những con non Tiyanki đang tung tăng nô đùa, mọi người vui vẻ và thư thái hơn trước rất nhiều."
 steris_core_conspiracy_modifier: "Tối Ưu Hóa Hệ Thống"
 steris_core_conspiracy_modifier_desc: "Tàu Ark §Y[Root.GetName]§! giờ đây vận hành nhanh hơn và hiệu quả hơn."
 caeli_core_conspiracy_modifier: "Đổi Mới Tinh Thần"
 caeli_core_conspiracy_modifier_desc: "Mọi người trên tàu Ark §Y[Root.GetName]§! giờ đây cảm thấy thư thái và vui vẻ hơn."
 statue_modifier: "Bức Tượng Bất Thường"
 statue_modifier_desc: "Việc tái định vị vật phẩm tế lễ này đã gây ra biến động trên tàu Ark §Y[Root.GetName]§!. Dù vậy, tính đối xứng siêu nhiên của nó vẫn tỏa ra một sức hút kỳ lạ."
 etherdrake_scales_modifier: "Tri Thức Về Vảy Rồng"
 etherdrake_scales_modifier_desc: "Tri thức chúng ta thu được từ vảy Rồng Ether thu hồi đã cải thiện cơ chế phòng thủ của tàu Ark."
 farms_in_flames_modifier: "Hỏa Thiêu Nông Khu"
 farms_in_flames_modifier_desc: "Nhằm ngăn chặn sự bùng phát của nấm mốc, các khu nông nghiệp đã bị phóng hỏa có chủ đích. Dù đã loại bỏ được mầm bệnh, việc này cũng khiến sản lượng lương thực sụt giảm nghiêm trọng."
 mycelial_intelligence_modifier: "$arkship.1225.name$"
 mycelial_intelligence_modifier_desc: "Mạng lưới sợi nấm xâm lấn trên §Ytàu Ark [Root.GetName]§! đã được cải tạo để tăng cường tái phân phối chất dinh dưỡng, nâng cao đáng kể hiệu suất nông nghiệp và sản lượng lương thực tổng thể."
 funghi_friends_modifier: "Nấm Mốc Là Bạn Tốt"
 funghi_friends_modifier_desc: "Mạng lưới sợi nấm trên §Ytàu Ark [Root.GetName]§! hiện đã phối hợp hoạt động cùng hệ thống nông nghiệp của chúng ta, giúp tăng cường khả năng chống chịu của cây trồng và tối ưu hóa việc phân bổ dinh dưỡng thông qua mối quan hệ cộng sinh độc đáo."
 unknown_resource_demolished: "Cải Tạo Không Gian Tàu Ark"
 unknown_resource_demolished_desc: "Một phân khu chưa được cấp phép trên tàu Ark đã bị dỡ bỏ, không gian được tái quy hoạch và tận dụng, nhờ đó giải phóng diện tích cư trú và cải thiện điều kiện sống."
 wellness_retreat_permitted: "Cấp Phép Khu An Dưỡng"
 wellness_retreat_permitted_desc: "Một khu an dưỡng kín đáo đã được cấp phép mở cửa chính thức, mang đến nơi nghỉ ngơi và hồi phục cho phi hành đoàn nhằm nâng cao phúc lợi của họ."
 arkship_order_restored: "Khôi Phục Trật Tự"
 arkship_order_restored_desc: "Những cư dân không có giấy phép đã bị trục xuất khỏi tàu Ark, trật tự và sự ổn định trên tàu đã được khôi phục."
 arkship_purge_enacted: "Tiến Hành Thanh Lọc"
 arkship_purge_enacted_desc: "Những phần tử bất đồng chính kiến đã bị cưỡng chế trục xuất khỏi tàu Ark. Trật tự đã được khôi phục vững chắc, dù biện pháp cứng rắn này đã để lại bóng ma tâm lý trong lòng phi hành đoàn."
