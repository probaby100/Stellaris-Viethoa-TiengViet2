 fumongus_authoritarian: "Sức Hút Độc Tài"
 rage_sage_soldiers: "Cơn Thịnh Nộ Của Thánh Nhân"
 harmonious_tune: "Khúc Ca Hài Hoà"
 harmonious_tune_desc: "Tất cả vì tập thể. Bản nhạc này dùng để ổn định sự kết nối giữa các ong thợ và tổ ong của chúng ta."
 ####################################
 # Sắc lệnh
 ####################################
 edict_masters_writings_politics: "Lời Dạy Của Bậc Thầy: Con Đường Tốt Đẹp Nhất"
 edict_masters_writings_politics_desc: "Bản dịch từ bài giảng của một triết gia ngoài hành tinh. Nhờ làm theo lý thuyết hiến dâng bản thân để đoàn kết quần chúng của bà, chúng ta có thể đạt được những bước tiến khổng lồ trong xây dựng cơ sở hạ tầng.\n\n“Một quốc gia vĩ đại được xây dựng dựa trên sự hy sinh những nhu cầu sung sướng cá nhân, đòi hỏi tất cả mọi người cùng gánh vác trách nhiệm này.” —— Thi sĩ lang thang Trisha\n\n"
 edict_masters_writings_philosophy: "Lời Dạy Của Bậc Thầy: Tư Duy Triết Học"
 edict_masters_writings_philosophy_desc: "Bản dịch từ bài giảng của một triết gia ngoài hành tinh. Phần này bao gồm nhiều suy ngẫm về ý nghĩa sự tồn tại của sự sống và vũ trụ. Nếu những người cai trị của chúng ta làm theo các lời khuyên này, việc điều hành chính sự sẽ cho thấy tầm nhìn xa trông rộng hơn.\n\n“Ý nghĩa của thế giới nằm ngoài chủ thể, nhưng chúng ta vẫn sẽ không ngừng tìm kiếm. Chúng ta phải đoàn kết lại thì mới có thể khám phá ra cội nguồn của vạn vật.” —— Thi sĩ lang thang Trisha\n\n"
 edict_masters_writings_diplomacy: "Lời Dạy Của Bậc Thầy: Niềm Tin Ngoại Giao"
 edict_masters_writings_diplomacy_desc: "Bản dịch từ bài giảng của một triết gia ngoài hành tinh. Những mẩu chuyện thú vị trong các cuộc đàm phán ngoại giao của bà có thể dùng làm tấm gương sáng cho các hoạt động ngoại giao.\n\n“Lần đầu gặp gỡ những đứa trẻ của các hệ sao khó tránh khỏi sự e sợ, nhưng đây cũng là một niềm hy vọng hiếm có. Hãy đối xử tử tế với láng giềng, và vui mừng vì sự tồn tại của họ —— họ mang đến sự kết thúc cho kỷ nguyên bị cô lập suốt hàng vạn năm giữa không gian lạnh lẽo.” —— Thi sĩ lang thang Trisha\n\n"
 edict_masters_writings_war: "Lời Dạy Của Bậc Thầy: Quốc Gia Chiến Tranh"
 edict_masters_writings_war_desc: "Bản dịch từ bài giảng của một triết gia ngoài hành tinh. Những miêu tả về chiến tranh và góc nhìn độc đáo về chiến lược của bà là giáo trình tuyệt vời cho quân đội.\n\n“Đoàn kết một lòng là vũ khí chiến thắng của chúng ta. Thế nhưng, nền hòa bình kéo dài năm này qua tháng nọ đã làm rạn nứt nội bộ quân đội. Phải đập tan những vết rạn nứt này, dù có phải dùng đến những biện pháp tuyệt đối. Chỉ có phá đi xây lại mới có thể niết bàn trùng sinh.” —— Thi sĩ lang thang Trisha\n\n"
 edict_improved_work_environment: "Cải Thiện Môi Trường Làm Việc"
 edict_improved_work_environment_desc: "Dành thời gian và tài nguyên để cải thiện môi trường làm việc, điều này chắc chắn sẽ làm tăng độ hạnh phúc và năng suất của công nhân.\n\n"
 edict_renewable_energy: "Sáng Kiến Cải Thiện Năng Lượng"
 edict_renewable_energy_desc: "Chúng ta có thể siết chặt hơn nữa việc sử dụng nhiên liệu độc hại và tài nguyên không thể tái tạo, qua đó thúc đẩy nghiên cứu sản xuất năng lượng mới. Việc này sẽ giúp chu trình năng lượng của ta đạt đến mức hoàn hảo, đồng thời tạo ra một môi trường sống an cư lạc nghiệp cho tất cả mọi người.\n\n"
 edict_super_sensors: "Quét Cảm Biến Diện Rộng"
 edict_super_sensors_desc: "Sau khi nghiên cứu công nghệ cảm biến cao cấp, chúng ta đã có đủ thông tin để rót thêm tài nguyên vào việc tăng cường tính năng quét tìm kiếm. Bằng công nghệ này, các kỹ thuật viên của ta sẽ dễ dàng tìm thấy những mục tiêu đặc biệt ở rìa hệ sao hơn.\n\n"
 ####################################
 # Các chỉ số điều chỉnh hành tinh
 ####################################
 acid_jungles: "Rừng Rậm Axit"
 acid_jungles_desc: "Quá trình tiến hóa đã sinh ra những loài thực vật rỉ ra axit, khiến cho việc băng qua rừng hay lập thuộc địa ở đây trở nên vô cùng khó khăn."
 ex_planet: "Từng Là Hành Tinh"
 ex_planet_desc: "Vành đai tiểu hành tinh này là tàn tích của một hành tinh từng có sự sống."
 ship_graveyard: "Nghĩa Địa Tàu Vũ Trụ"
 ship_graveyard_desc: "Rất nhiều tàu vũ trụ đã bỏ mạng tại đây, biến nơi này thành một nghĩa địa phi thuyền; có vô khối vật liệu mà ta có thể dễ dàng thu thập ở chỗ này."
 ai_fleet: "Hạm Đội AI Rơi"
 ai_fleet_desc: "Có một hạm đội bị rơi trên hành tinh này, do trí tuệ nhân tạo điều khiển; đống xác tàu đã mang đến cho ta nguồn dữ liệu kỹ thuật quý giá để nghiên cứu."
 irradiated_wasteland: "Vùng Đất Bị Phóng Xạ"
 irradiated_wasteland_desc: "Hành tinh này đã bị các tia bức xạ bắn phá, khiến phần lớn diện tích không còn thích hợp cho sinh vật sinh sống."
 ancient_one: "Thực Thể Cổ Đại"
 ancient_one_desc: "Một thực thể cổ đại đang cư ngụ sâu dưới đáy biển, nó chính là tồn tại hùng mạnh nhất trên hành tinh này."
 food_rich_planet: "Thực Phẩm Giàu Dinh Dưỡng"
 food_rich_planet_desc: "Hệ thực vật trên hành tinh cung cấp những loại trái cây và dưỡng chất vô cùng bổ dưỡng, giúp ta cải thiện được môi trường sống."
 super_sensor_array: "Hệ Thống Cảm Biến Siêu Cấp"
 super_sensor_array_desc: "Một hệ thống cảm biến mạnh mẽ có thể thăm dò được tình hình xung quanh chi tiết hơn."
 horse_powered_factories_low: "Cưỡng Bức Động Vật Lao Động"
 horse_powered_factories_medium: "Động Vật Bất Mãn Lao Động"
 horse_powered_factories_high: "Động Vật Tự Nguyện Lao Động"
 horse_powered_factories_low_desc: "Thuần hóa động vật bốn chân để giảm nhẹ gánh nặng công việc, dù cho chúng có bị ép buộc đi chăng nữa."
 horse_powered_factories_medium_desc: "Thuần hóa động vật bốn chân để giảm nhẹ gánh nặng công việc, dù cho chúng không can tâm tình nguyện."
 horse_powered_factories_high_desc: "Những loài động vật bốn chân kết minh với chúng ta sẽ giúp san sẻ bớt gánh nặng công việc."
 fallen_robots: "Xác Rô Bốt"
 fallen_robots_desc: "Trên hành tinh có những con rô bốt do các nền văn minh thất lạc chế tạo ra, cung cấp cho chúng ta những dữ liệu kỹ thuật cực kỳ quý giá để nghiên cứu."
 society_animal_life: "Động Vật Hoang Dã Kỳ Lạ"
 society_animal_life_desc: "Những loài động vật hết sức kỳ lạ đang sống trên hành tinh này. Chúng mang đến cơ hội nghiên cứu xã hội học đầy thú vị."
 hostile_animal_life: "Động Vật Hoang Dã Nguy Hiểm"
 hostile_animal_life_desc: "Sinh vật bản địa trên hành tinh này có vẻ không mấy thân thiện với chúng ta."
 shifting_sands: "Cát Lún"
 shifting_sands_desc: "Hành tinh sa mạc này được cấu tạo từ cát gần như ở dạng lỏng, khiến cho việc xây dựng trên đó trở nên cực kỳ khó khăn."
 liquid_sands: "Cát Lỏng"
 liquid_sands_desc: "Hành tinh này bị bao phủ bởi lớp cát gần như ở dạng lỏng, thành phần khoáng chất đặc biệt của nó cung cấp rất nhiều cơ hội để nghiên cứu."
 abandoned_mining: "Cơ Sở Khai Khoáng Bị Bỏ Hoang"
 abandoned_mining_desc: "Một cơ sở khai khoáng cổ đại đang xoay quanh hành tinh này, chứng tỏ nơi đây có thể ẩn chứa nhiều tài nguyên tiềm năng."
 gas_rich_planet: "Mỏ Khí Dồi Dào"
 gas_rich_planet_desc: "Hãy lập thuộc địa trên hành tinh này để khai thác tài nguyên của nó.\n£energy£ §G+50%§!"
 gas_rich_planet_fo_realz: "Khai Thác Khí Vô Tội Vạ"
 gas_rich_planet_fo_realz_desc: "Khai thác tài nguyên thiên nhiên quý hiếm trên hành tinh này sẽ giúp tăng vọt tổng sản lượng năng lượng trong thời gian ngắn."
 gas_responsible_mining: "Khai Thác Khí Hợp Lý"
 gas_responsible_mining_desc: "Tiết kiệm nguồn khí hiếm trên hành tinh này sẽ giúp duy trì hiệu quả sản xuất năng lượng về lâu dài."
 suppressed_opposition: "Trấn Áp Phe Phản Đối"
 suppressed_opposition_desc: "Một phần dân số trên hành tinh này đã bị đàn áp do đứng lên chống lại chính phủ."
 scared_population: "Dân Thường Sợ Hãi"
 scared_population_desc: "Bộ phận dân cư này phải làm việc trong nơm nớp lo sợ, họ kinh hãi rằng những nhà máy ngoài hành tinh sẽ cướp đi thêm nhiều sinh mạng nữa."
 secured_factory: "Nhà Máy Ngoài Hành Tinh An Toàn"
 secured_factory_desc: "Đổ tiền của và công sức vào việc bảo đảm an toàn cho môi trường làm việc ở nhà máy ngoài hành tinh."
 fear_as_control: "Kỷ Luật Sắt"
 fear_as_control_desc: "Tội phạm bị trừng phạt, thôi thúc mọi người hành động."
 fear_as_control_militarist: "$fear_as_control$"
 fear_as_control_militarist_desc: "$fear_as_control_desc$"
 infectious_disease: "Bệnh Truyền Nhiễm"
 infectious_disease_desc: "Một căn bệnh có tính lây lan cực mạnh đã bùng phát, kéo theo những khó khăn mới và đe dọa trực tiếp tới người dân."
 pyramid_wars: "Cuộc Chiến Tín Ngưỡng"
 pyramid_wars_desc: "Do có những góc nhìn khác nhau về bản chất thực sự của những kẻ tự xưng là thánh thần, mâu thuẫn đức tin đã khiến người ta chĩa vũ khí vào nhau."
 syndaw_automated_work: "Quy Trình Tự Động Hoá"
 syndaw_automated_work_desc: "Dù có hợp lý hay không, nỗi sợ mất việc do công nghệ tự động hoá đang lan rộng khắp hành tinh này."
 syndaw_unfriendly_robots: "Căng Thẳng Người - Máy"
 syndaw_unfriendly_robots_desc: "Sự căng thẳng giữa rô bốt và các sinh vật hữu cơ trên hành tinh này đã làm giảm sản lượng £unity£ đoàn kết của chúng ta."
 syndaw_research_malus: "Lỗi Trí Tuệ Nhân Tạo"
 syndaw_research_malus_desc: "Một AI phòng thí nghiệm chuyên về nghiên cứu xã hội đã bị hỏng phần cứng nghiêm trọng, hiện đang được các nhân viên liên quan tiến hành thay thế."
 snake_infestation: "Đại Dịch Rắn"
 snake_infestation_desc: "Rắn! Chỗ nào cũng có rắn! Chúng ta mệt bở hơi tai đối phó với cái đám này, rảnh đâu mà... lo chuyện khác nữa."
 energy_poor: "Cạn Kiệt Năng Lượng"
 energy_poor_desc: "Vốn không muốn làm ngài hoảng, nhưng lũ rắn đang quấn quanh các máy phát điện và thi nhau hút năng lượng."
 mining_equipment_offline: "$d_abandoned_mining_tunnels$"
 mining_equipment_offline_desc: "$snake_infestation_desc$"
 locust_planet_cracked: "Hành Tinh Vỡ Nát"
 locust_planet_cracked_desc: "Hầu hết các dạng sống trên hành tinh này đã bị diệt vong, và nó đang bị xé toạc ra bởi các chấn động năng lượng khổng lồ. Dấu hiệu duy nhất cho thấy từng có sự sống thông minh ở đây là một trạm không gian tàn tạ cùng những tín hiệu lác đác phát ra từ lớp vỏ vỡ nát."
 nascent_locust: "Mầm Mống Bão Côn Trùng"
 nascent_locust_desc: "Trên hành tinh này có một lượng lớn các sinh vật yếu ớt nhưng lại đẻ cực nhanh. Bất cứ ai muốn sống sót trên bề mặt đều phải điều chỉnh lại hạ tầng để chống đỡ những cuộc tấn công bất chợt của các loài côn trùng khổng lồ."
 stratovents: "Miệng Phun Bình Lưu"
 stratovents_desc: "Những khối cấu trúc khoáng chất cao chót vót đang tống đám khí gas cuồn cuộn vào tầng nhiệt."
 stratovent_world_modifier_tourism: "Miệng Phun Bình Lưu Nguyên Dạng"
 stratovent_world_modifier_tourism_desc: "Những miệng phun khí khổng lồ ngoài tầng bình lưu này được giữ nguyên trạng để bọn Tiyanki có thể tha hồ thưởng thức đám khí gas."
 stratovent_world_modifier_tourism_tt: "$biologist_is_vent_researcher_tt$\n$mod_planet_biologists_amenities_produces_add$: §G+300§!"
 stratovent_world_modifier_refining: "Nhà Máy Tinh Chế Tại Miệng Phun"
 stratovent_world_modifier_refining_desc: "Khí xả từ những miệng phun khổng lồ này được thu gom và tinh chế thành loại khí đốt ngoài hành tinh đắt giá."
 stratovent_world_modifier_tourism_boost: "Đài Quan Sát Ở Miệng Phun"
 stratovent_world_modifier_tourism_boost_desc: "Ngành du lịch ngắm miệng phun khí nay đã có những đài quan sát ở tầng cao hơn, chuyên dùng để chiêm ngưỡng cảnh ăn uống của loài Tiyanki hùng vĩ."
 stratovent_world_modifier_tourism_boost_tt: "$stratovent_world_modifier_tourism_tt$"
 stratovent_world_modifier_refining_upg: "Mở Rộng Miệng Phun Bình Lưu"
 stratovent_world_modifier_refining_upg_desc: "Việc kích nổ thành công các miệng thoát mới cho khí ngầm đã giúp tăng vọt sản lượng."
 stratovent_world_modifier_refining_minerals: "Miệng Phun Bị Sập"
 stratovent_world_modifier_refining_minerals_desc: "Dự án mở rộng miệng phun đã gặp một vài trục trặc khiến sản lượng sụt giảm, nhưng bù lại nó để lộ ra một mỏ khoáng sản vô cùng trù phú."
 planet_new_colony_spiritualist_attraction: "$promoted_spiritualist$"
 planet_new_colony_spiritualist_attraction_desc: "$promoted_spiritualist_desc$"
 planet_new_colony_materialist_attraction: "$promoted_materialist$"
 planet_new_colony_materialist_attraction_desc: "$promoted_materialist_desc$"
 planet_new_colony_authoritarian_attraction: "$promoted_authoritarian$"
 planet_new_colony_authoritarian_attraction_desc: "$promoted_authoritarian_desc$"
