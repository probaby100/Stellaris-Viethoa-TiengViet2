 NUM_HYPERLANES: "Mật độ Tuyến đường Siêu không gian"
 pc_ringworld_shielded: "Phân khu Thế giới Vành đai bị Cô lập"
 pc_ringworld_shielded_desc: "Phân khu Thế giới Vành đai này đã bị phong tỏa bởi một loại hàng rào năng lượng không thể xuyên thủng. Hàng rào này ngăn chặn mọi nỗ lực quét từ bên ngoài nhắm vào bề mặt của nó."
 pc_habitat_shielded: "Trạm Cư trú bị Cô lập"
 pc_habitat_shielded_desc: "Trạm Cư trú trên quỹ đạo này đã bị phong tỏa bởi một loại hàng rào năng lượng không thể xuyên thủng. Hàng rào này ngăn chặn mọi nỗ lực quét từ bên ngoài nhắm vào bề mặt của nó."
 FLEETORDER_EXPLORE_BUTTON: "Khám phá Hệ sao"
 planet_destruction.101.name: "Hành tinh Bị Nghiền nát"
 planet_destruction.102.name: "Bắn một quả cho vui"
 planet_destruction.101.desc: "Khi Colossus hoàn thành nhiệm vụ hủy diệt kinh hoàng của nó, sự rung chuyển nhẹ do dư chấn từ việc lớp vỏ hành tinh [From.GetName] vỡ vụn và từ quyển bị phân rã lan đến [From.From.GetName] cũng dần lắng xuống.\n\nThật khó để thấu hiểu sự bi tráng trong cái chết của một hành tinh, nhưng vẻ đẹp chết chóc khi lõi rực lửa của [From.GetName] dần nguội lạnh giữa vũ trụ băng giá là một điều không thể chối cãi."
 planet_destruction.101.a.purifexter: "Tuyệt vời."
 planet_destruction.301.name: "Diệt Sát Neutron"
 planet_destruction.301.nobots.desc: "Sau khi cuộc thanh trừng trên bề mặt [From.GetName] kết thúc, luồng neutron trên [From.From.GetName] dần tan biến. Quá trình quét cho thấy không còn dấu hiệu của sự sống có tri giác; thảm thực vật tuy bị hủy hoại nhưng sẽ dần phục hồi. Sẽ có những kẻ coi hành động xóa sổ hoàn toàn sự sống có tri giác và chỉ giữ lại vật chất vô cơ này là một tội ác chiến tranh tàn bạo.\n\nNhưng chúng ta lại gọi đó là sự hiệu quả."
 planet_destruction.301.bots.desc: "Sau khi cuộc thanh trừng trên bề mặt [From.GetName] kết thúc, luồng neutron trên [From.From.GetName] dần tan biến.\n\nCảm biến âm thanh chỉ truyền về tiếng gió rít và âm thanh của các sinh vật tổng hợp. Toàn bộ sự sống hữu cơ bậc cao đã bị quét sạch."
 planet_destruction.301.infested.desc: "Sau khi hoàn thành cuộc thanh trừng trên bề mặt [From.GetName], luồng neutron trên [From.From.GetName] dần tiêu tán.\n\nQuá trình quét nhanh xác nhận rằng những khối vật chất hữu cơ từng bò lổm ngổm khắp bề mặt hành tinh nay đã hoàn toàn mất đi sức sống, chỉ còn lại những đống đá khô cằn."
 planet_destruction.401.name: "Ép buộc Cải đạo"
 planet_destruction.401.desc: "Tiếng ngân vang của năng lượng tâm linh trên [From.From.GetName] dần mờ đi, và trong khoảnh khắc, vạn vật chìm vào tĩnh lặng. Đám đông trên [From.GetName] há hốc mồm kinh ngạc (nếu họ có miệng và mũi), những tia tâm linh phát ra từ mạng lưới tâm trí của họ, mỗi người đều đắm chìm trong đức tin mãnh liệt và quyền năng của riêng mình.\n\nNếu trước đây họ không hiểu, thì bây giờ họ đã nhận ra: Tất cả chúng ta chỉ là một phần nhỏ bé của một đấng vĩ đại hơn."
 planet_destruction.401.tooltip: "Tất cả £pop£ §HDân số§! mang đặc điểm §Y$trait_mechanical$§!, §Y$trait_machine_unit$§! hoặc §Y$trait_hive_mind$§! đều bị §Rphá hủy§! bởi Cộng hưởng Tâm linh.\n\nTất cả £pop£ §HDân số Sinh học§! còn sống sót chuyển sang ý thức hệ §Y$ethic_spiritualist$§!.\n\nThêm công cụ điều chỉnh §Y$god_rayed$§! cho [This.GetName], duy trì trong §Y10 năm§!:\nSức hấp dẫn của Ý thức hệ Tâm linh: §Y+999%§!."
 planet_destruction.501.name: "Phát tán Đại dịch Nano"
 planet_destruction.501.desc: "[From.From.GetName] đã hoàn tất quá trình triển khai robot nano đồng hóa, số lượng của chúng được tính toán là đủ để cơ khí hóa toàn bộ các sinh vật hữu cơ có trí tuệ đang thống trị [From.GetName].\n\nChúng ta không cần bố trí bất kỳ cảm biến hay thiết bị nào trên [From.From.GetName] để chứng minh thành công của mình, bởi chúng ta biết chắc chắn rằng nó đã thành công. Khi chúng ta hướng ánh nhìn về phía [From.GetName]. Chúng ta đã nhìn thấy chính mình, và cũng thông qua chính mình mà nhìn thấu mọi thứ.\n\nTrên bề mặt [From.GetName], giờ đây chỉ còn lại chính chúng ta."
 planet_destruction.501.tooltip: "Toàn bộ £pop£ §HDân số Hữu cơ§! nhận được đặc điểm §Y$trait_cybernetic$§!."
 planet_destruction.701.name: "Hành tinh đã Bị Nhấn chìm"
 planet_destruction.701.desc: "Khi cột nước trút xuống từ [FromFrom.GetName] tiêu tán, bề mặt của [From.GetName] đã hoàn toàn thay đổi. Từng là những lục địa khô hạn rộng lớn, giờ đây chỉ còn lại một đại dương xanh thẳm lấp lánh ánh sáng chào đón, sẵn sàng để được sinh sống."
 planet_destruction.701.tooltip: "Hành tinh biến thành §Y$pc_ocean$§!.\nNhững dân số không mang đặc điểm §Y$trait_aquatic$§! đều bị tiêu diệt."
 DELUGE_EXHAUSTED_ICE_TITLE: "Nguồn Băng Cạn kiệt"
 DELUGE_EXHAUSTED_ICE_DESC: "Hoạt động §YThiên Hồng Hạo Đãng§! của chúng ta tại §Y[This.GetName]§! đã làm cạn kiệt nguồn băng trong hệ sao $SYSTEM|Y$, do đó §Y$sm_ice_mining_station$§! trong hệ sao đã bị tháo dỡ."
 planet_destruction.801.name: "Hành tinh Bị Đầu độc"
 planet_destruction.801.desc: "Dòng độc chất cuồn cuộn đổ xuống từ [FromFrom.GetName] dần lắng dịu, hệ sinh thái tràn đầy sức sống trên [From.GetName] đã không còn tồn tại, trong một hành tinh ngập ngụa khí độc, giờ đây chỉ còn vài dạng sinh mệnh thưa thớt có thể tiếp tục sinh tồn."
 planet_destruction.610.name: "[outraged_FE.GetName]"
 planet_destruction.610.desc: "[From.GetName] từng là một Thánh địa.\n\n\nCác ngươi không thể hiểu được tội lỗi mà các ngươi vừa gây ra lớn đến nhường nào đâu.\n\n\nNhưng các ngươi sẽ sớm hiểu thôi."
 planet_destruction.610.spiri: "Chúng tôi sẽ chứng minh tính chính thống của mình."
 planet_destruction.610.mater: "Đó chỉ là một hành tinh mà thôi."
 planet_destruction.610.milit: "Đó chỉ là một chiến thuật, không phải là tư thù cá nhân."
 planet_destruction.610.pacif: "Chúng ta cần một biện pháp phòng ngừa."
 planet_destruction.610.autho: "Hành tinh của các ngươi rất tốt, nhưng một giây sau nó sẽ là của ta."
 planet_destruction.610.egali: "Dưới Colossus, mọi sinh linh đều bình đẳng."
 planet_destruction.610.phile: "Chúng tôi vẫn luôn yêu mến các bạn!"
 planet_destruction.610.phobe: "Thánh địa nhỏ bé của các ngươi sẽ chẳng còn lại chút gì đâu."
 planet_destruction.610.gesta: "Một hành tinh thì có gì to tát chứ?"
 planet_destruction.610.devou: "§RHa ha ha!§!"
 planet_destruction.610.termi: "Giống như rác rưởi dữ liệu, đã bị dọn sạch."
 planet_destruction.610.purif: "Tà thuyết dị giáo chỉ có một con đường duy nhất là bị thiêu rụi."
 planet_destruction.615.A: "[From.GetName] như vậy sẽ tốt đẹp hơn."
 planet_destruction.615.spir: "Hãy coi như đó là việc rảy nước thánh vậy."
 action.87.name: "§RMất thuộc địa!§!"
 action.87.desc: "Quyền kiểm soát hành chính của chúng ta đối với §Y[From.GetName]§! đã rơi vào tay §Y[new_planet_owner.GetName]§!, bởi vì họ đã giành được quyền kiểm soát §HCăn cứ Không gian§! của hệ sao §Y[From.GetStarName]§!."
 action.88.name: "Giành được Thuộc địa!"
 action.88.desc: "Chúng ta đã giành được quyền kiểm soát hành chính của §Y[From.GetName]§!, trước đây từng là căn cứ của §Y[former_planet_owner.GetName]§!, giờ đây chúng ta đã nắm quyền kiểm soát §HCăn cứ Không gian§! của hệ sao §Y[From.GetStarName]§!."
 apoc.1.name: "Cổng Không gian Bị bỏ hoang"
 apoc.1.desc: "Chúng ta đã phát hiện một trạm không gian cổ đại nằm ở rìa hệ sao [gateway_system.GetName]. Những tín hiệu không gian con mạnh mẽ còn sót lại cho thấy đây rất có thể là một loại §HCổng Không gian§! nào đó —— trên lý thuyết, nó có thể kết nối với các trạm không gian tương tự tạo thành một mạng lưới, cho phép tàu chiến dịch chuyển tức thời đến các vị trí khác nhau trong thiên hà.\n\nGiả sử nó thực sự là một Cổng Không gian, thì hiện tại nó cũng đã ngừng hoạt động do bị bỏ hoang quá lâu. Tuy nhiên, nếu có thể sửa chữa nó, chủ sở hữu Cổng Không gian sẽ có khả năng kích hoạt các Cổng Không gian khác trong mạng lưới, giúp họ có thể vượt qua những khoảng cách cực lớn chỉ trong vài ngày ngắn ngủi."
 apoc.2.desc: "Chúng ta lại phát hiện thêm một Cổng Không gian bị bỏ hoang nữa trong hệ sao [gateway_system.GetName]. Giống như cái đầu tiên, Cổng Không gian này hiện cũng không thể sử dụng do bị bỏ hoang quá lâu."
 apoc.3.desc: "Chúng ta đã phát hiện một cổng dịch chuyển không gian con cổ đại gần hệ sao §H[gateway_system.GetName]§!. Nó có vẻ là một phần của mạng lưới các trạm không gian tương tự, khi đi vào hoạt động, sẽ cho phép người dùng dịch chuyển gần như tức thời từ một điểm này sang một điểm khác trong thiên hà.\n\nVào một thời điểm nào đó sau khi được xây dựng, kết nối giữa nó và phần còn lại của mạng lưới đã bị cắt đứt. Hiện tại, nó chỉ có thể chỉ ra một điểm đến hợp lệ duy nhất —— một khu vực không gian chưa được khám phá nằm ngoài thiên hà của chúng ta, được các nhà thiên văn học đặt tên là §HCụm L§!. Đáng ngạc nhiên hơn nữa, Cổng Không gian này được chế tạo hoàn toàn bởi một loại §HRobot Nano§! vi mô với thiết kế chưa từng được biết đến.\n\nMặc dù Cổng Không gian vẫn phát ra những tín hiệu năng lượng yếu ớt, nhưng nó đã bị cố tình khóa trong một chu kỳ bảo trì nào đó nhằm ngăn chặn việc kích hoạt. Trừ phi chúng ta có thể tìm cách giải trừ quá trình này, nếu không chúng ta sẽ không thể nào tiến vào Cụm L."
 apoc.5.name: "Lỗ Sâu Tự nhiên"
 apoc.5.desc: "Chúng ta đã phát hiện một hiện tượng không gian con tự nhiên đáng ngờ ở rìa hệ sao §H[wormhole_system.GetName]§!! Không thời gian tại đây đã xuất hiện một khe nứt, từ đó tạo ra một \"§HLỗ Sâu§!\". Theo suy đoán của các [Root.Owner.GetScientistPlural], Lỗ Sâu này có lẽ được kết nối với các Lỗ Sâu khác trong thiên hà thông qua không gian con.\n\nĐiều này đồng nghĩa với việc tàu của chúng ta có khả năng di chuyển từ đầu này sang đầu kia của thiên hà chỉ trong vài ngày, tùy thuộc vào vị trí của Lỗ Sâu đầu ra. Thật không may, Lỗ Sâu này cũng giống như hầu hết các Lỗ Sâu khác, thường xuyên ở trong trạng thái không ổn định. Bất kỳ con tàu nào liều lĩnh tiến lại gần sẽ bị xé nát thành từng mảnh chỉ trong chớp mắt."
 apoc.5.a: "Nếu chúng ta có thể ổn định nó..."
 apoc.10.name: "Tái kích hoạt Cổng Không gian"
 apoc.10.desc.1: "$apoc.10.desc.a$\n\n$apoc.10.desc.b$"
 apoc.10.desc.2: "$apoc.10.desc.a$\n\n$apoc.10.desc.c$"
 apoc.10.desc.a: "Các nhà khoa học của chúng ta đã khôi phục thành công nguồn năng lượng cho Cổng Không gian nằm ở hệ sao [gateway_system.GetName]! Mặc dù thiết bị này đã vô cùng cổ xưa, nhưng nó vẫn có thể tạo ra một tuyến đường không gian con hoàn toàn thông suốt."
 apoc.10.desc.b: "Các tàu thăm dò mà chúng ta gửi đi xác nhận rằng, hành động kích hoạt Cổng Không gian này cũng đồng thời cung cấp năng lượng cho cơ sở thứ hai. Hiện tại, hai Cổng Không gian được kết nối này là hai cơ sở duy nhất mà chúng ta có thể sử dụng, nhưng rất có khả năng sẽ tìm thấy những cơ sở khác đang trong trạng thái ngủ đông ở đâu đó. Trong tương lai, chúng ta thậm chí có thể xây dựng những Cổng Không gian hoàn toàn mới tại các hệ sao đã được chọn."
 apoc.10.desc.c: "Tàu thăm dò mà chúng ta phóng đi xác nhận rằng kết nối giữa Cổng Không gian này và toàn bộ mạng lưới là vô cùng ổn định. Tàu của chúng ta có thể thông qua nó để di chuyển đến các Cổng Không gian đã kích hoạt khác, miễn là chủ sở hữu của Cổng Không gian đó không thù địch hoặc đóng cửa biên giới với chúng ta."
 apoc.10.desc.3: "$apoc.10.desc.d$"
 apoc.10.desc.4: "$apoc.10.desc.d$\n\n$apoc.10.desc.e$"
 apoc.10.desc.d: "Cổng dịch chuyển bị bỏ hoang nằm ở hệ sao §H[gateway_system.GetName]§! đã đột ngột được kích hoạt! Rất có thể một Cổng Không gian ở nơi khác đã khôi phục lại năng lượng cho cổng dịch chuyển này, hiện tại Cổng Không gian này đã hình thành một mạng lưới không gian con ổn định và có lẽ đã sẵn sàng cho việc dịch chuyển."
 apoc.10.desc.e: "Tuy nhiên, chúng ta không thể tiến vào Cổng Không gian, trường lực không gian con xung quanh Cổng Không gian sẽ đẩy lùi bất kỳ con tàu nào đến gần. Trước khi có thể sử dụng Cổng Không gian này, chúng ta phải nghiên cứu cách kích hoạt Cổng Không gian từ phía bên này, có như vậy nó mới cho phép tàu của chúng ta đi qua."
 apoc.10.a: "Bất cứ lúc nào cũng có thể có thứ gì đó chui ra từ đó!"
 apoc.11.name: "Cổng Không gian Đã Xây dựng Xong"
 apoc.11.desc: "Chúng ta đã hoàn thành việc xây dựng Cổng Không gian đầu tiên có thể đưa vào sử dụng tại hệ sao [gateway_system.GetName], đây có thể coi là một chiến thắng vĩ đại của khoa học công nghệ và kỹ thuật! Cổng Không gian đã thiết lập một tuyến đường không gian con ổn định và kết nối thành công với mạng lưới Cổng Không gian khác trong thiên hà."
 apoc.12.desc: "Cổng Không gian mà chúng ta phát hiện trong hệ sao §H[gateway_system.GetName]§! đã được khôi phục nguồn điện. Nó đã thiết lập kết nối với phần còn lại của mạng lưới Cổng Không gian và đang trong trạng thái hoạt động bình thường."
 apoc.13.desc: "Cổng Không gian mới nằm trong hệ sao §H[gateway_system.GetName]§! đã được xây dựng hoàn tất. Nó đã thiết lập kết nối không gian con ổn định với phần còn lại của mạng lưới cổng dịch chuyển và đang hoạt động bình thường."
 apoc.14.name: "Nền móng Cổng Không gian Đã Sẵn sàng"
 apoc.14.desc: "Nền móng xây dựng ngoài không gian sâu được chuẩn bị cho việc xây dựng Cổng Không gian trong hệ sao §H[gateway_system.GetName]§! đã hoàn tất. Ngay khi chuẩn bị đủ các nguồn tài nguyên cần thiết, việc chính thức xây dựng Cổng Không gian có thể bắt đầu bất cứ lúc nào."
 planet_destruction.111.name: "Đường tắt Siêu không gian"
 planet_destruction.111.desc: "Ủy ban Quy hoạch Siêu không gian báo cáo rằng, sau khi hành tinh thứ ba của Hệ Mặt trời bị di dời khỏi giếng trọng lực, một lỗ sâu tự nhiên đã hình thành. Lỗ sâu này có lẽ sẽ dần dần làm giảm bớt tình trạng ách tắc giao thông FTL ở các tuyến đường siêu không gian lân cận."
 planet_destruction.111.a: "Cái hành tinh chết tiệt này, ta chẳng có chút thương xót nào cho nó cả."
 planet_destruction.111.a.tooltip: "Trong §Y[sol_sys.GetName]§! đã hình thành một §H$NATURAL_WORMHOLE_GALACTIC$§!."
 planet_destruction.210.name: "[From.GetName] Bị Cô lập"
 planet_destruction.210.desc: "Tia sáng chói lòa phát ra từ [From.From.GetName] dần mờ đi, và [From.GetName] chìm vào im lặng.\n\nCó lẽ lịch sử sẽ phán xét việc cô lập này, hành động cắt đứt hoàn toàn [From.GetName] khỏi đại vũ trụ bao la, là một hành vi cực đoan và phi lý. Hoặc cũng có thể không. Dù sao đi nữa, từ nay trở đi, hệ sao [From.GetStarName] sẽ có thêm một quả cầu pha lê khổng lồ mang kích cỡ của một hành tinh."
 planet_destruction.210.desc.alt: "Ánh sáng rực rỡ của [From.From.GetName] đã dần phai nhạt, và [From.GetName] đã chìm vào cõi lặng thinh.\n\nSự sống sẽ tiếp diễn trong một thế giới bị phong kín."
 planet_destruction.210.a: "Hãy gõ nhẹ lên lớp kính và xem chúng vùng vẫy."
 planet_destruction.210.b: "Cái ác cần thiết."
 sentinel_station: "Trạm Không gian Sentinel"
 sentinel_station_plural: "Trạm Không gian Sentinel"
 crisis.52.2.a.response: "Nhiều chiến binh Sentinel xuất thân từ quân đội. Chúng tôi đều là những người sống sót từ các hạm đội từng chiến đấu chống lại bọn Prethoryn Scourge. Dù đã từng nếm mùi thất bại, nhưng chúng tôi đã rút ra được những kinh nghiệm và bài học quý báu từ quá khứ, và quyết tâm không để bi kịch lặp lại một lần nữa.\n\nNhư đã từng đề cập trước đây, các thành viên của đội Sentinel đến từ đủ mọi chủng loài trong thiên hà. Niềm hy vọng của chúng tôi được đặt vào một nhóm nhỏ những người sống sót thuộc một Đế chế Sa ngã không còn hiện diện trong hệ sao này —— họ đã viện trợ cho chúng tôi công nghệ bí mật và các hạm đội bị phong ấn."
 crisis.52.new.b.response: "Chúng tôi đã thiết lập trụ sở gần §H[sentinel_system.GetName]§!. Nơi này trước đây là một hố đen chưa được đánh dấu trên bản đồ. Chính §H[sentinel_fallen_empire.GetName]§! đã tiết lộ địa điểm này cho chúng tôi. Họ cũng đã hỗ trợ xây dựng Sentinel Alpha —— cơ sở không gian đầu tiên của chúng tôi, đồng thời cũng là cảng mẹ của hạm đội.\n\nCó thể nói đây là một thành tựu mang tính bước ngoặt, đặc biệt là trong bối cảnh thời gian của chúng tôi đang vô cùng eo hẹp."
 crisis.52.2.new.b.response: "Chúng tôi đã thiết lập trụ sở gần §H[sentinel_system.GetName]§!. Nơi này trước đây là một hố đen chưa được đánh dấu trên bản đồ. Thông qua cơ sở dữ liệu của một Đế chế Sa ngã đã tuyệt diệt, chúng tôi đã khôi phục lại vị trí của hố đen này. Trong cơ sở dữ liệu đó, chúng tôi cũng thu thập được một số bản thiết kế kỹ thuật, và chúng đã phát huy tác dụng trong việc xây dựng Sentinel Alpha. Đây là cơ sở không gian đầu tiên của chúng tôi, đồng thời cũng là cảng mẹ của hạm đội.\n\nCó thể nói đây là một thành tựu mang tính bước ngoặt, đặc biệt là trong bối cảnh thời gian của chúng tôi đang vô cùng eo hẹp."
 sentinel_title: "Tổ chức Sentinel"
 crisis.76.desc: "Trải qua bao gian truân thử thách, thiên hà của chúng ta cuối cùng đã giành được chiến thắng, đánh bại bè lũ Prethoryn Scourge. Đã từng có lúc tôi lo sợ rằng ngày này sẽ không bao giờ đến. Nhưng giờ đây, tôi chỉ còn lại một nhiệm vụ duy nhất phải hoàn thành.\n\nVới tư cách là Đại Đoàn trưởng của Tổ chức Sentinel, tôi xin chính thức tuyên bố giải tán tổ chức này. Mục tiêu duy nhất của chúng tôi là đánh bại bè lũ Prethoryn Scourge. Vì mục tiêu này đã đạt được, nên đã đến lúc chúng tôi phải đường ai nấy đi. Để ngăn chặn việc các tàu chiến hiện có của chúng tôi bị sử dụng sai mục đích, chúng sẽ bị tháo dỡ hoàn toàn.\n\nCầu mong sự kết thúc của thảm họa thiên hà này sẽ đánh dấu sự khởi đầu của một kỷ nguyên hòa bình mới. Đây là Sentinel Một, xin ngắt liên lạc."
 crisis.76.c: "Ngắt liên lạc."
 crisis.81.name: "Hồi kết của Sentinel"
 crisis.81.desc: "Có báo cáo về giao tranh dữ dội gần §H[sentinel_system.GetName]§!. Hệ sao quê hương của tổ chức Sentinel đang bên bờ vực sụp đổ.\n\nChúng tôi nhận được một đoạn liên lạc tầm xa từ §HSentinel Alpha§! —— trạm không gian quân sự được Sentinel dùng làm trụ sở. Hệ sao này đang bị nhiễu tín hiệu nghiêm trọng do hỏa lực vũ khí dày đặc và tàn dư năng lượng."
 crisis.82.desc: "Đây là... đây là Sentinel Alpha. Chúng tôi đang hứng chịu §R###Tín hiệu hỏng###§!... thiệt hại chí mạng. Vỏ trạm đã vỡ, và §R###Tín hiệu hỏng###§!... Chỉ huy trưởng đã hi sinh. Số lượng kẻ thù quá đông!\n\nChúng tôi... xong đời rồi. Đừng bỏ cuộc. Vì tương lai của chúng ta, các bạn tuyệt đối không được đầu hàng. Đừng để nỗ lực của chúng tôi trở nên vô ích! Chúng tôi... chúng tôi... Aaaaaa——§R<Mất tín hiệu>§!"
 crisis.78.desc: "Đây là Sentinel One. Dải ngân hà đang trong thời khắc nguy nan, nhưng tôi vẫn mang đến cho các bạn một vài tin tốt.\n\nThông qua kinh nghiệm rút ra từ những trận chiến kéo dài và quá trình nghiên cứu gian khổ, các đặc vụ của chúng tôi cuối cùng đã tổng hợp được tài liệu giải phẫu cực kỳ chi tiết về sinh vật của Thảm họa Prethoryn Scourge. Ví dụ, các bạn có biết ấu trùng Prethoryn sẽ bốc cháy dữ dội nếu cả túi mật chính và phụ bị đâm thủng cùng lúc không?\n\nChúng tôi sẽ công bố rộng rãi những tài liệu này. Các bạn có thể nhắm vào những điểm yếu mà chúng tôi đã phát hiện để tấn công, giúp phi thuyền của các bạn chiến đấu hiệu quả hơn."
 crisis.78.c: "Tải dữ liệu này lên máy tính ngắm bắn."
 sentinel_data: "Dữ liệu Sentinel"
 sentinel_data_desc: "Tổ chức Sentinel đã cung cấp cho chúng ta tài liệu giải phẫu chi tiết về Prethoryn. Với sự trợ giúp từ những dữ liệu này, chúng ta đã có thể nhận diện được một số điểm yếu trên lớp vỏ ngoài của sinh vật bầy đàn này."
 crisis.121.name: "Phát hiện Prethoryn hoang dã"
 crisis.121.desc: "Sau khi Thảm họa Bầy đàn bị đánh bại, chúng ta đã mất dấu một số cá thể Prethoryn trốn thoát trong lúc hỗn loạn. Không có sự dẫn dắt của Tổ Mẹ trung tâm, phần lớn những con thú vô tri này sẽ tàn lụi và tan biến.\n\nTuy nhiên, các báo cáo chạm trán gần đây xác nhận rằng một bầy lớn Prethoryn hoang dã đã lập tổ mới tại hệ sao §H[feral_prethoryn_system.GetName]§!.\n\nTrong tương lai, rất có thể chúng ta sẽ bắt gặp các tổ bầy đàn hoang dã tại những hệ sao vô chủ từng bị thảm họa càn quét. Dù vậy, chúng khó có khả năng trở thành một mối đe dọa lớn —— những sinh vật hoang dã này rất dễ cắn xé lẫn nhau và không hề có dấu hiệu phát triển trí tuệ để tiến hóa thành thảm họa một lần nữa."
 crisis.121.a: "Phát cảnh báo đi lại."
 crisis.51.2.name: "Sự trỗi dậy của Sentinel"
 sentinel_fleet_gift: "Một phi thuyền Sentinel xuất hiện gần [Root.Capital.GetName] và được giao cho bạn điều khiển."
 pirate.6.desc: "Một nhóm nhỏ cá thể con sở hữu một đột biến gen hiếm gặp, cho phép chúng ngắt một phần kết nối với Tâm trí bầy đàn mà không rơi vào trạng thái ngủ đông. Tuy nhiên, nếu rời quá xa Tâm trí bầy đàn, những cá thể lạc đàn này sẽ chết, vì vậy chúng đã chiếm đóng hệ sao §H[pirate_system.GetName]§! nằm trong lãnh thổ của chúng ta.\n\nChúng định làm hải tặc để tự nuôi sống bản thân, sử dụng một số ít phi thuyền thô sơ để cướp bóc các tuyến đường thương mại không được phòng vệ đi qua hệ sao này."
 pirate.7.desc: "Một nhóm nhỏ các đơn vị bị lỗi đã tách khỏi trung tâm của [Root.GetName] và lẩn trốn vào hệ sao §H[pirate_system.GetName]§! trong lãnh thổ của chúng ta. Những đơn vị này đã hư hỏng không thể phục hồi, và bắt đầu sử dụng các phi thuyền thô sơ để cướp bóc những tuyến đường thương mại không được phòng vệ đi qua hệ sao này nhằm cướp linh kiện và tài nguyên."
 pirate.50.name: "Phát hiện hải tặc!"
 pirate.50.a.desc: "Tuyến đường thương mại của chúng ta tại hệ sao §H[pirate_system.GetName]§! không được bảo vệ tốt, giờ đây gần như đã biến thành nơi ngoài vòng pháp luật. Hệ sao này đang thu hút ngày càng nhiều hải tặc, kẻ buôn lậu và đủ loại tội phạm khác, chúng đang ngang nhiên cướp bóc hàng hóa của chúng ta."
 pirate.50.b.desc: "Tuyến đường thương mại không được phòng vệ đi qua hệ sao §H[pirate_system.GetName]§! đã thu hút sự chú ý của một đám hải tặc. Những tên cướp này đã tập hợp một hạm đội lớn, đánh chặn phần lớn hoạt động giao thương trong hệ sao này."
 pirate.50.c.desc: "Vì tuyến đường thương mại hoàn toàn không được phòng vệ, hệ sao §H[pirate_system.GetName]§! đã thu hút một lượng lớn tội phạm, và sau một cuộc tranh giành quyền lực gần đây, những tên tội phạm này đã đủ tính tổ chức để lập thành một hạm đội hải tặc lớn. Chúng sử dụng hạm đội chắp vá này để điên cuồng cướp bóc các tàu buôn trong hệ sao."
 pirate.50.a: "Bọn chúng phải bị trừng trị."
 pirate.53.name: "Cá thể phản loạn đi cướp bóc"
 pirate.53.desc: "Một nhóm nhỏ cá thể con đã xuất hiện đột biến gen hiếm gặp, cho phép chúng ngắt một phần kết nối với Tâm trí bầy đàn mà không rơi vào trạng thái ngủ đông. Tuy nhiên, nếu rời quá xa Tâm trí bầy đàn, những cá thể lạc đàn này sẽ chết, vì vậy chúng đã chiếm đóng hệ sao §H[pirate_system.GetName]§! trong lãnh thổ của chúng ta.\n\nChúng không chọn hệ sao này một cách tình cờ, mà bởi vì một trong những tuyến đường thương mại ít được phòng vệ nhất của chúng ta đi ngang qua đây. Những cá thể lạc đàn này rõ ràng định làm hải tặc để kiếm sống, sử dụng một số ít phi thuyền thô sơ để cướp bóc tuyến đường thương mại không được bảo vệ đi qua hệ sao này."
 pirate.54.name: "Hải tặc ngoài hành tinh"
 pirate.54.desc: "Một nhóm hải tặc ngoài hành tinh đã xâm nhập và cắm rễ tại hệ sao §H[pirate_system.GetName]§! trong lãnh thổ của chúng ta. Chúng ta có một tuyến đường thương mại không được phòng vệ đi qua hệ sao này, và có vẻ như chúng định cướp bóc tuyến đường này để duy trì hoạt động tội phạm của mình."
 pirate.56.name: "Đơn vị mất kiểm soát"
 pirate.56.desc: "Một nhóm nhỏ các đơn vị bị lỗi đã tách khỏi trí tuệ chủ của [Root.GetName] và lẩn trốn vào hệ sao §H[pirate_system.GetName]§! trong lãnh thổ của chúng ta. Những đơn vị này đã hết thuốc chữa, và bắt đầu sử dụng các phi thuyền thô sơ để cướp bóc tuyến đường thương mại không được bảo vệ đi qua hệ sao này nhằm cướp linh kiện và tài nguyên."
 pirate.57.name: "Hải tặc sinh vật hữu cơ"
 pirate.57.desc: "Một nhóm nhỏ tội phạm là sinh vật hữu cơ đã tìm cách thâm nhập và chiếm đóng hệ sao §H[pirate_system.GetName]§! trong lãnh thổ của chúng ta. Chúng có vẻ định cướp bóc tuyến đường thương mại không được phòng vệ đi qua hệ sao này, có lẽ với tâm lý ảo tưởng thường thấy ở sinh vật hữu cơ, lầm tưởng rằng sự tồn tại của chúng là vô hại và sẽ không khiến chúng ta phải động đến vũ lực."
 leviathans.509.desc: "Theo hiệp định chúng ta đã ký kết ban đầu, thời hạn sử dụng cơ sở dữ liệu của chúng tôi đã kết thúc. Bây giờ các vị định gia hạn thêm mười năm nữa hay không cần thông tin từ cơ sở dữ liệu của chúng tôi nữa?"
 leviathans.509.a: "Chúng tôi muốn gia hạn hiệp định."
 leviathans.509.a.reply: "Rất tốt, các nhà khoa học của các vị có thể tiếp tục sử dụng cơ sở dữ liệu của chúng tôi."
 leviathans.509.e: "Không, lần này thì thôi."
 enclave_mineral_trade_1_xur: "Hiệp định thương mại XuraCorp"
 enclave_mineral_trade_1_xur_desc: "Hiệp định thương mại này sẽ quy định việc trao đổi tài nguyên hàng tháng giữa chúng ta và XuraCorp.\n\n§YBạn có thể chấm dứt hiệp định này bất cứ lúc nào trong giao diện ngoại giao với XuraCorp.§!"
