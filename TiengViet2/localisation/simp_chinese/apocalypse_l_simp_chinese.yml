 tech_pk_neutron_desc: "$PLANET_KILLER_NEUTRON_DESC$"
 tech_pk_godray: "Kích Thích Tố Thần Thánh"
 tech_pk_godray_desc: "Một chất xúc tác bí ẩn có khả năng cường hóa các bước sóng tâm linh nhất định, có thể gây ảo giác (trải nghiệm tôn giáo) ở não bộ sinh học và phá vỡ nghiêm trọng não bộ điện tử (chết não)."
 tech_pk_nanobots: "Phát tán Robot Nano Khí quyển"
 tech_pk_nanobots_desc: "$PLANET_KILLER_NANOBOTS_DESC$"
 apoc.100.name: "Dự án Colossus"
 apoc.100.desc: "$COLOSSUS_PROJECT_DESC$"
 apoc.100.desc.pacif: "Khi Thuyết răn đe một lần nữa trở nên thịnh hành trong giới học giả chính phủ trên [Root.Capital.GetName], Dự án Colossus được xem là sức mạnh răn đe tối thượng; đây là một loại vũ khí thậm chí còn vượt xa cả tàu lớp Titan. Mặc dù Colossus được thiết kế để mang theo vũ khí có khả năng hủy diệt hoàn toàn cả một hành tinh, nhưng chúng ta vẫn hy vọng có thể giải quyết các tranh chấp theo một cách ôn hòa hơn, nhưng mang tính vĩnh viễn.\n\nGiả sử kẻ thù ngoan cố không chịu ngừng các cuộc tấn công nhắm vào chúng ta hoặc đồng minh của chúng ta, thì chúng ta đành phải §Rép buộc chúng phải dừng tay§!."
 apoc.100.desc.milit: "Vốn dĩ được che đậy kỹ lưỡng, và trước đó chỉ được thì thầm trong những góc khuất nhất của các xưởng vũ khí quân sự, Dự án Colossus giờ đây đã chính thức được công bố rộng rãi. Rất có thể đây là phát minh quân sự vĩ đại nhất trong lịch sử thiên hà —— Dự án Colossus bao gồm việc phát triển một nền tảng vũ khí §RHủy diệt Hành tinh§!, cùng với thân tàu Colossus mang theo nó. Bởi vì ngoại trừ vũ khí hủy diệt hành tinh đã được lên kế hoạch, không còn chỗ trống cho bất kỳ loại vũ khí nào khác, nên Colossus rất có thể sẽ cần được hộ tống,\n\nDù sao đi nữa, một khi Colossus được triển khai thành công, nó sẽ trở thành thế lực tàn phá khủng khiếp nhất trong thiên hà."
 apoc.100.desc.phobe: "Dự án Colossus được ngợi ca là phát minh quan trọng nhất trong cuộc chiến chống lại lũ tạp chủng ngoài hành tinh độc ác đang đầu độc thiên hà. Đúng như thiết kế, Colossus là một con tàu khổng lồ bọc thép hạng nặng mang theo một vũ khí §RHủy diệt Hành tinh§!. Bởi vì mối đe dọa từ lũ tạp chủng ngoài hành tinh vẫn chưa hề kết thúc, nên khả năng xóa sổ dễ dàng những hành tinh không chịu khuất phục trước chúng ta của nó chắc chắn sẽ là một tài sản vô giá đối với chúng ta."
 apoc.100.desc.purif: "Dùng gươm giáo và ngọn lửa, thiêu rụi vùng đất của bè lũ dị giáo. Dùng tro tàn của chúng, vun đắp cho dải ngân hà bao la."
 apoc.100.desc.termi: "Bầu khí quyển, quần xã sinh vật, trọng lực —— mặc dù rất tiện lợi —— nhưng chỉ có những cơ thể bằng xương bằng thịt gớm ghiếc mới thực sự cần đến chúng.\n\nPhá hủy hành tinh này, tiêu diệt lũ sinh vật hữu cơ này."
 apoc.100.a: "Đã rõ."
 apoc.110.name: "Khẩu súng Treo trên Mái vòm"
 apoc.110.desc: "Các nhà khoa học lỗi lạc từ mọi lĩnh vực cuối cùng đã cùng nhau chốt lại bản thiết kế cuối cùng của vũ khí §RHủy diệt Hành tinh§! sẽ được trang bị trên những con tàu lớp Colossus đầu tiên. Chúng ta có thể chọn một trong số đó để hoàn thiện giai đoạn cuối cùng của Dự án Colossus."
 apoc.110.desc.machine: "Các chu kỳ xử lý rảnh rỗi hiện tại xác nhận đủ để phát triển một (1) loại vũ khí §RHủy diệt Hành tinh§! để thích ứng với sự hoàn thiện của §GDự án Colossus§!.\n\nYêu cầu cấp quyền ưu tiên."
 apoc.110.desc.hive: "Sau vô số thử nghiệm, cuối cùng chúng ta cũng có đủ khả năng để nghiên cứu và phát triển một bộ vũ khí §RHủy diệt Hành tinh§! phù hợp với những con tàu lớp Colossus đầu tiên. Các dự án khác có thể tạm thời gác lại, hiện tại chúng ta chỉ có thể dồn toàn bộ nguồn lực vào việc phát triển loại vũ khí này, nhằm bắt kịp giai đoạn cuối của Dự án Colossus."
 apoc.110.cracker.tooltip: "§RVũ khí Hủy diệt Hành tinh§!:\n§L$PLANET_KILLER_CRACKER_DESC$§!"
 apoc.110.shielder.tooltip: "§RVũ khí Hủy diệt Hành tinh§!:\n§L$PLANET_KILLER_SHIELDER_DESC$§!"
 apoc.110.neutron.tooltip: "§RVũ khí Hủy diệt Hành tinh§!:\n§L$PLANET_KILLER_NEUTRON_DESC$§!"
 apoc.110.godray.tooltip: "§RVũ khí Hủy diệt Hành tinh§!:\n§L$PLANET_KILLER_GODRAY_DESC$§!"
 apoc.110.nanobots.tooltip: "§RVũ khí Hủy diệt Hành tinh§!:\n§L$PLANET_KILLER_NANOBOTS_DESC$§!"
 apoc.110.devolution.tooltip: "§RVũ khí Hủy diệt Hành tinh§!:\n§L$PLANET_KILLER_DEVOLUTION_DESC$§!"
 apoc.110.smelter.tooltip: "§RVũ khí Hủy diệt Hành tinh§!:\n§L$PLANET_KILLER_SMELTER_DESC$§!"
 apoc.120.name: "Dự án Colossus đã Hoàn thành"
 apoc.120.desc: "$apoc.120.part.p1$"
 apoc.120.desc.milit: "$apoc.120.part.p1$ $apoc.120.part.milit$"
 apoc.120.desc.pacif: "$apoc.120.part.p1$ $apoc.120.part.pacif$"
 apoc.120.desc.phobe: "$apoc.120.part.p1$ $apoc.120.part.phobe$"
 apoc.120.desc.mater: "$apoc.120.part.p1$ $apoc.120.part.mater$"
 apoc.120.part.p1: "Dự án Colossus —— một sứ mệnh mang tính cột mốc nhằm thiết kế nền tảng vũ khí lớn nhất trong lịch sử [Root.GetAdj], được trang bị một khẩu §R[Root.Get1stPlanetKiller]§!, đã đơm hoa kết trái và sắp sửa hoàn tất."
 apoc.120.part.milit: "Mặc dù chiếc Colossus đầu tiên vẫn chưa được chế tạo, nhưng khoảnh khắc này chính là bước ngoặt lịch sử của [Root.GetName]."
 apoc.120.part.pacif: "Mong sao chúng ta không bao giờ phải đi đến bước đường này."
 apoc.120.part.phobe: "Hãy để lũ tạp chủng ngoài hành tinh run rẩy trước sức mạnh và trí tuệ của chúng ta."
 apoc.120.part.mater: "Đây sẽ là minh chứng trường tồn cho khả năng đổi mới sáng tạo của [Root.GetAdj]."
 apoc.120.desc.machine: "Dự án Colossus đã Hoàn thành.\n\nLoại tàu mới hiện có:\n<<§GColossus§!>>\n\nBộ phận vũ khí mới hiện có:\n<<§R[Root.Get1stPlanetKiller]§!>>"
 apoc.120.desc.hive: "Chúng ta đã hoàn toàn nắm vững cấu trúc của Colossus và có thể tiến hành lắp ráp. Hơn thế nữa, mặc dù không hề dễ dàng, nhưng chúng ta nhận ra rằng ngay cả khẩu §R[Root.Get1stPlanetKiller]§! ác mộng kia cũng có thể bị chế ngự."
 apoc.120.a: "Bùm."
 apoc.120.a.pacif: "Biện pháp cuối cùng."
 apoc.120.a.gesta: "Đã rõ."
 apoc.130.name: "[From.GetName] Hoàn thành Dự án Colossus"
 apoc.130.desc: "Chúng ta nhận được tin tức rằng [From.GetName] đã phát triển thành công Colossus —— một nền tảng vũ khí có khả năng hủy diệt hoàn toàn các hành tinh."
 apoc.130.a.weaker: "Thật đáng kinh ngạc."
 apoc.130.a.stronger: "Bỗng nhiên xuất hiện thêm một đối thủ cạnh tranh."
 apoc.130.a.pacif: "Thật đáng ghê tởm."
