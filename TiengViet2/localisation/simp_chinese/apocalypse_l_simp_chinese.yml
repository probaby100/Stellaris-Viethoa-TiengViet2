 action.82.name: "[From.GetName] bị Oanh tạc"
 action.82.desc: "Một hạm đội của §H[From.From.GetName]§! đã tàn sát dã man cư dân trên §H[From.GetName]§!! Sau một trận oanh tạc quỹ đạo quy mô lớn không chút lưu tình, mọi khu định cư trên bề mặt hành tinh đã bị xóa sổ hoàn toàn. [From.GetPlanetMoon] giờ đây đã trở thành một vùng đất hoang tàn đầy rẫy phóng xạ, gần như không thể duy trì sự sống."
 action.82.a: "Tội ác tày trời này phải trả giá bằng máu!"
 action.83.desc: "Quân đoàn của chúng ta báo cáo rằng đã hoàn tất cuộc oanh tạc §H[From.GetName]§!. Toàn bộ các khu định cư đã bị xóa sổ hoàn toàn. [From.GetPlanetMoon] hiện tại đang ngập tràn phóng xạ và chỉ có thể duy trì sự sống ở mức tối thiểu."
 bombed_to_tomb_world: "§Y[From.GetName] nay đã trở thành một Hành tinh Chết chóc hoang vu.§!"
 god_rayed: "Ánh sáng Thần thánh"
 god_rayed_desc: "Tác động của Ánh sáng Thần thánh vẫn còn vương vấn trong bầu khí quyển, tầng đất, cũng như các loài động thực vật nơi đây."
 uneasy_faith: "Đức tin Lung lay"
 uneasy_faith_desc: "Người dân đã phần nào nhận ra rằng đức tin của họ không hoàn toàn xuất phát từ sự thành tâm."
 neutron_bombarded: "Oanh tạc Neutron"
 neutron_bombarded_desc: "Hệ sinh thái của hành tinh này vẫn đang trong quá trình hồi phục sau đòn tàn phá khốc liệt của cuộc Oanh tạc Neutron."
