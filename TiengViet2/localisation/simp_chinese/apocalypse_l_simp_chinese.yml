 end_trade_3: "Điều này sẽ chấm dứt hiệp định thương mại tài nguyên hiện tại giữa chúng ta và Muutagan."
 leviathans.105.e: "Chúng tôi muốn chấm dứt hiệp định thương mại tài nguyên."
 leviathans.105.e.response: "Tuyệt. Chúng tôi sẽ báo ngay cho các tàu chở hàng, chỉ thị họ hủy lệnh và quay về cảng.\n\nNếu đổi ý, hãy báo cho chúng tôi bất cứ lúc nào nhé!"
 leviathans.171.name: "Thương mại năng lượng đã bị hủy"
 leviathans.171.desc: "Do kho dự trữ năng lượng đã cạn kiệt, các giao dịch dùng năng lượng để thanh toán không thể tiếp tục, vì vậy mọi hiệp định liên quan đến năng lượng với các Thương bang đều đã bị hủy."
 leviathans.171.a: "Thật không ổn chút nào."
 enclave_mineral_trade_ended: "Không đủ £energy£ §HNăng lượng§! để duy trì hiệp định giao dịch tài nguyên với các Thương bang."
 leviathans.173.name: "Thương mại khoáng sản đã bị hủy"
 leviathans.173.desc: "Do kho dự trữ khoáng sản đã cạn kiệt, các giao dịch dùng khoáng sản để thanh toán không thể tiếp tục, vì vậy mọi hiệp định liên quan đến khoáng sản với các Thương bang đều đã bị hủy."
 enclave_energy_trade_ended: "Không đủ £energy£ §HNăng lượng§! để duy trì hiệp định giao dịch tài nguyên với các Thương bang."
 leviathans.175.name: "Thương mại thực phẩm đã bị hủy"
 leviathans.175.desc: "Khi kho dự trữ thực phẩm cạn kiệt, giao dịch dùng thực phẩm làm phương tiện thanh toán tự nhiên không thể tiếp tục, vì vậy mọi hiệp định liên quan đến thực phẩm với các Thương bang đều đã bị hủy."
 enclave_food_trade_ended: "Thiếu £food£ §HThực phẩm§!, không thể duy trì hiệp định thương mại với các Thương bang."
 leviathans.111.e: "Chỉ có vậy thôi."
 colossus_victim: "Khủng hoảng tâm lý do Colossus"
 colossus_victim_desc: "Chấn thương tâm lý của người dân toàn quốc do đợt tấn công từ Colossus đã gây ra một cuộc chuyển dịch hệ tư tưởng trên diện rộng."
 decision_make_holy_world: "Hành tinh linh thiêng"
 decision_make_holy_world_desc: "Chúng ta sẽ tìm kiếm một §Y$pc_gaia$§! chưa bị khai phá trong lãnh thổ của mình làm vùng đất thánh. Chừng nào nó chưa bị vấy bẩn bởi kẻ phàm trần và vẫn nằm trong biên giới, hành tinh thiêng liêng bất khả xâm phạm này sẽ cung cấp cho chúng ta: £unity£ §Y$country_base_unity_produces_mult$§!§G+10%§!."
 apoc.200.name: "Ứng cử viên vùng đất thánh"
 apoc.200.desc: "Dưới sự trợ giúp của các chuyên gia thần học, một số nhà tiên tri đã đi đến kết luận —— §Y[holy_target.GetName]§! là một hành tinh xứng đáng nhận được sự sùng bái tột bậc trong hệ sao [holy_target.GetStarName].\n\nSự công nhận chính thức chắc chắn sẽ gia tăng sự tôn kính của công chúng đối với thế giới thần bí này."
 apoc.200.a: "Nguyện cho [holy_target.GetName] được thần linh ưu ái."
 apoc.200.a.tooltip: "Thêm biến đổi §Y$holy_player_planet$§!"
 apoc.201.name: "Không tìm thấy ứng cử viên vùng đất thánh"
 apoc.201.desc: "Các nhà tiên tri hàng đầu của chúng ta đã công bố báo cáo chỉ ra rằng không có thế giới nào trong đế chế của chúng ta là trung tâm tâm linh cả."
 apoc.201.a.tooltip: "Chi phí £influence£ Ảnh hưởng của sắc lệnh đã được hoàn trả."
 holy_player_planet: "Vùng đất thiêng"
 holy_player_planet_desc: "Hành tinh này chưa bị sinh vật có trí tuệ vấy bẩn và được coi là một vùng đất thánh."
 has_holy_player_planet: "Hành tinh được sùng bái"
 has_holy_player_planet_desc: "Chúng ta đã chỉ định một hành tinh chưa bị khai phá trong lãnh thổ làm vùng đất thánh."
 has_world_worship: "$TRIGGER_FAIL$§RChúng ta đã chỉ định một §!§Y$holy_player_planet$§!"
 has_holy_world_candidate: "$TRIGGER_FAIL$§RTrong lãnh thổ không có §YHành tinh Gaia§! chưa được khai phá§!"
 make_holy_world_effect: "Chúng ta sẽ bắt đầu tìm kiếm một hành tinh phù hợp để thánh hóa nó."
 opinion_cracked_my_uninhabited_world: "Đã bắn vỡ hành tinh chưa khai phá của chúng ta"
 opinion_cracked_an_uninhabited_world: "Đã bắn vỡ một hành tinh chưa khai phá"
 opinion_worships_our_holy_world: "Tôn kính vùng đất thánh"
 action.91.name: "Tiền đồn đã được xây lại!"
 action.91.desc: "Chúng ta đã giành lại quyền kiểm soát hệ sao §Y[Root.GetStarName]§!, xây dựng lại §Y$starbase_outpost$§! của mình trên quỹ đạo quanh sao."
 DAILY_PROGRESS: "Tiến độ hàng ngày $VAL|Y$"
 SHIP_DESIGNER_NAME_USED: "§RTên này đã được một bản thiết kế phi thuyền với kích cỡ khác sử dụng§!"
 DESIGN_IS_BUILDING: "§RMột phi thuyền sử dụng thiết kế này đang được chế tạo§!"
 DESIGN_BLOCKED_BY_AUTO_BUILD: "§RKhông thể thiết kế thủ công khi tính năng tự động thiết kế đang bật.§!"
 SHIP_DESIGNER_NAME_USED_BY_ANOTHER_STARBASE: "§RTên thiết kế này hiện đang được sử dụng bởi một Căn cứ sao $NAME|Y$§!"
 opinion_dead_captives: "Hành quyết tù binh"
 vultaum_homeworld: "Hành tinh mẹ Vultaum"
 vultaum_homeworld_desc: "Hành tinh này từng là quê hương của nền văn minh Tiền bối Vultaum. Mặc dù toàn bộ hành tinh đã vỡ vụn và không thể hỗ trợ bất kỳ sự sống nào nữa, chúng ta vẫn có thể tìm thấy những đống đổ nát rộng lớn của thành phố trên bề mặt."
 vultaum_minerals: "Tàn tích cơ sở quỹ đạo"
 vultaum_minerals_desc: "Một cơ sở quỹ đạo khổng lồ của Vultaum đã đâm xuống bề mặt hành tinh này từ hàng chục triệu năm trước, khiến bề mặt hành tinh rải rác những mảnh vỡ và tàn tích."
 vultaum_energy: "Mạng lưới khai khoáng lơ lửng"
 vultaum_energy_desc: "Hành tinh khí khổng lồ này từng hỗ trợ một mạng lưới cơ sở khai khoáng lơ lửng khổng lồ, được người Vultaum sử dụng để chiết xuất Helium-3."
 yuht_homeworld: "Hành tinh mẹ Yuht"
 yuht_homeworld_desc: "Nền văn minh Tiền bối Yuht có nguồn gốc từ hành tinh này. Bề mặt hành tinh đã bị dội bom từ quỹ đạo cày nát, hầu hết các công trình đã trở thành đống đổ nát từ lâu, nhưng vẫn còn một vài cơ sở ngầm có thể nghiên cứu."
 yuht_minerals: "Vành đai tiểu hành tinh giàu tài nguyên"
 yuht_minerals_desc: "Vành đai tiểu hành tinh giàu quặng này từng được người Yuht khai thác ở quy mô lớn, lượng khoáng sản thu thập được ở đây đã hỗ trợ cho sự bành trướng chậm rãi nhưng vững chắc của đế chế giữa các vì sao của họ."
 yuht_energy: "Mảng thu năng lượng mặt trời"
 yuht_energy_desc: "Một số mảng thu thập năng lượng mặt trời cổ đại đã được người Yuht triển khai trên quỹ đạo của hành tinh khí khổng lồ này. Thật khó tin là một vài trong số chúng vẫn còn hoạt động."
 first_league_homeworld: "Hành tinh thủ đô First League"
 first_league_homeworld_desc: "Ngôi mộ quy mô hành tinh này từng là trung tâm hành chính vĩ đại của First League. Giờ đây, hành tinh này đã trở thành vùng đất chết không thể hỗ trợ bất kỳ sự sống nào, nhưng tàn tích của các thành phố bao phủ hoàn toàn bề mặt hành tinh vẫn có thể được nhìn thấy ở khắp mọi nơi."
 first_league_minerals: "Cơ sở khai khoáng bỏ hoang"
 first_league_minerals_desc: "Vành đai tiểu hành tinh này từng rất sầm uất vào thời kỳ hoàng kim của First League. Chúng ta vẫn có thể tìm thấy các cơ sở khai khoáng bỏ hoang trên hàng nghìn tiểu hành tinh tại đây."
 first_league_energy: "Nền tảng bảo trì"
 first_league_energy_desc: "Hành tinh khí khổng lồ này có xây dựng một số nền tảng bảo trì khổng lồ, từng được dùng để sửa chữa tàu chở hàng của đội thương thuyền First League. Một số thiết bị truyền tải năng lượng trên nền tảng vẫn còn hoạt động tốt cho đến ngày nay."
 irassian_homeworld: "Hành tinh mẹ Irassian"
 irassian_homeworld_desc: "Dù hứng chịu nhiều cuộc dội bom từ quỹ đạo, vô số cổ vật còn sót lại trên hành tinh quê hương của người Irassian vẫn là biểu tượng cho nền văn minh phát triển của họ."
 irassian_minerals: "Khu neo đậu cũ"
 irassian_minerals_desc: "Nơi này từng là khu neo đậu khổng lồ của hạm đội không gian Irassian, giờ đã hóa thành một đống tàn tích rải rác trên quỹ đạo của hành tinh; trong đó chứa lượng khoáng sản vô cùng phong phú."
 irassian_energy: "Trạm phát điện"
 irassian_energy_desc: "Trong giai đoạn đầu bành trướng giữa các vì sao của Hiệp ước Irassian, hành tinh khí khổng lồ này là một nơi sản xuất năng lượng quan trọng của người Irassian. Những trạm phát điện lớn trên quỹ đạo hành tinh vẫn còn tồn tại cho đến tận ngày nay."
