 TECH_UNLOCK_COLOSSUS_CONSTRUCTION_TITLE: "§H$UNLOCKS_SHIP_TYPE$:§! Colossus"
 TECH_UNLOCK_COLOSSUS_CONSTRUCTION_DESC: "§HColossus§!\nColossus có kích thước đồ sộ hơn cả Titan, nhưng cấu trúc thân tàu lại không phù hợp cho các trận hải chiến. Nó giống như một trạm quỹ đạo cơ động hơn, chỉ có khả năng thực hiện các đòn tấn công hủy diệt hành tinh một cách triệt để."
 COLOSSUS_PROJECT: "Dự án Colossus"
 COLOSSUS_PROJECT_DESC: "Các [Root.GetScientistPlural] của chúng ta sẽ nghiên cứu và chế tạo ra cấu trúc thân tàu khổng lồ chưa từng có trong lịch sử thiên hà, đồng thời thiết kế một loại vũ khí có khả năng hủy diệt toàn bộ một hành tinh cho nó."
 tech_pk_cracker: "Địa Bạo Thiên Tinh"
