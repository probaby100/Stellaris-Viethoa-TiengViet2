 grand_archive.10010.name: "Hoàn Thành Kế Hoạch Đột Biến Amip Không Gian"
 grand_archive.10010.desc: "Các thử nghiệm đột biến trên §YAmip Không Gian§! đã hoàn tất, mang lại những bào quan mới đầy thú vị: §Y$tech_unique_mutation_space_amoeba$§! có thể được triển khai.\n\nNhững sinh vật cộng sinh này có khả năng hấp thụ năng lượng từ các vật thể xung quanh và truyền lại cho vật chủ, từ đó gia tăng khả năng sống sót và khả năng tái tạo."
 grand_archive.10015.name: "Hoàn Thành Kế Hoạch Đột Biến Tiyanki"
 grand_archive.10015.desc: "Các thử nghiệm đột biến trên §YTiyanki§! đã hoàn tất, mang lại một kết quả vô cùng hấp dẫn: §Y$tech_unique_mutation_tiyanki$§!\n\nChúng ta đã khuếch đại tần số rung động tự nhiên mà loài sinh vật này dùng để giao tiếp với nhau lên mức tối đa có thể duy trì được. Điều này tạo ra một trường sức mạnh có thể điều khiển, giúp củng cố các mô tế bào của những sinh vật khác ở gần đó."
 grand_archive.10020.name: "Hoàn Thành Kế Hoạch Đột Biến Sâu Hư Không"
 grand_archive.10020.desc: "Các thử nghiệm đột biến trên §YSâu Hư Không§! đã hoàn tất, mang lại những đột biến chu kỳ sinh sản đầy thú vị: §Y$tech_unique_mutation_voidworm$§!\n\nChúng ta đã có thể gia tăng khả năng sinh sản của các u nang ký sinh mà sinh vật này sử dụng để ném bom các hành tinh vật chủ. Kết quả là sản lượng nhộng sinh ra tăng lên đáng kể."
 grand_archive.10025.name: "Hoàn Thành Kế Hoạch Đột Biến Quái Thạch"
 grand_archive.10025.desc: "Các thử nghiệm đột biến trên §YQuái Thạch§! đã hoàn tất, mang lại một kết quả vô cùng hấp dẫn: §Y$tech_unique_mutation_cutholoid$§!\n\nChúng ta đã tìm ra phương pháp biến đổi hệ tiêu hóa khổng lồ của nó thành một loại vũ khí có khả năng bắn ra những viên đạn có vận tốc ban đầu lớn và tầm bắn xa. Thật không may, sự biến đổi sinh học đáng kể này lại khiến chúng mất đi khả năng nuốt chửng phi thuyền đối phương."
 grand_archive.10030.name: "Hoàn Thành Kế Hoạch Đột Biến Thực Thể Pha Lê"
 grand_archive.10030.desc: "Các thử nghiệm đột biến trên §YThực Thể Pha Lê§! đã hoàn tất, mang lại những kết quả vô cùng hấp dẫn: §Y$tech_unique_mutation_crystalline_entity$§!\n\nThông qua việc điều chỉnh bộ gen pha lê của chúng, mỗi sinh vật khi chịu sát thương chí mạng sẽ tự động phân tách thành hai cá thể độc lập. Điều này sẽ gia tăng đáng kể khả năng chiến đấu của chúng."
 grand_archive.10030.a: "$FASCINATING$"
 leviathan_unique_mutation_project_unlock_name: "Kế Hoạch Đột Biến [FromFromFrom.GetShipSizeName]"
 leviathan_unique_mutation_project_unlock_desc: "Chúng ta đã lấy được vật chất di truyền của sinh vật [FromFromFrom.GetShipSizeName] từ hệ sao [FromFrom.solar_system.GetName] nơi sinh vật này trú ngụ.\n\nMặc dù hiện tại chúng ta chưa thể nhân bản sinh vật này, nhưng chúng ta vẫn có thể chắt lọc được những kiến thức vô giá từ các đặc tính sinh học độc đáo của nó."
 grand_archive.10055.name: "$leviathan_unique_mutation_project_unlock_name$"
 grand_archive.10055.desc: "$leviathan_unique_mutation_project_unlock_desc$"
 grand_archive.10060.name: "Hoàn Thành Kế Hoạch Đột Biến Tiyanki Ana"
 grand_archive.10060.desc: "Thí nghiệm đột biến sử dụng vật chất di truyền của $NAME_Elderly_Tiyanki$ đã hoàn tất, mang lại một kết quả vô cùng hấp dẫn: §H$restorative_enzymes$§!\n\nEnzyme phục hồi tồn tại trong vật chất di truyền của Tiyanki Ana có thể được sao chép trong các tuyến tương tự của các sinh vật khác. Nhờ đó, tổ chức cấu trúc của chúng sẽ được chuyển đổi thành vật liệu tái tạo, tỏ ra vô cùng hữu ích trong các đội hình phòng thủ chặt chẽ khi xảy ra cháy nổ."
 grand_archive.10075.name: "$leviathan_unique_mutation_project_unlock_name$"
 grand_archive.10075.desc: "$leviathan_unique_mutation_project_unlock_desc$"
 grand_archive.10080.name: "Hoàn Thành Kế Hoạch Đột Biến Hư Không Sinh Nghiệt"
 grand_archive.10080.desc: "Thí nghiệm đột biến sử dụng vật chất di truyền của $NAME_Voidspawn$ đã hoàn tất, mang lại một phát hiện vô cùng hấp dẫn: §H$starborne_biology$§!\n\nCác mô tế bào của những sinh vật này có phản ứng mãnh liệt với ánh sáng của các vì sao, có thể kích thích sự phát triển bên trong cơ thể của các sinh vật khác. Quá trình này đòi hỏi một lượng năng lượng nhỏ để duy trì, nhưng khi ở gần những ngôi sao sáng rực rỡ nhất, tốc độ tăng trưởng của chúng sẽ được đẩy nhanh đáng kể."
