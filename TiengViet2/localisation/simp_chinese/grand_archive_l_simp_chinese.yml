 grand_archive.5015.name: "Thành Lập Bảo Tàng Trân Bảo"
 grand_archive.5015.desc: "§Y$celestial_chart$§! mang đến một kho lưu trữ thông tin thẩm định vô giá, giúp chúng ta khai thác tối đa giá trị từ những kho báu tìm được. Chúng ta nên xây dựng một §YBảo Tàng Trân Bảo§! trên một trong các hành tinh của mình, chuyên dùng để phân loại, phục chế và bảo quản những bảo vật tinh xảo. Căn cứ vào năng lực hậu cần hiện tại, các hành tinh sau đây rất phù hợp để xây dựng cơ sở mới này."
 grand_archive.5015.a: "Xây dựng một $d_treasure_planet$ tại §Y[event_target:treasure_planet_candidate_1.GetName]§!."
 grand_archive.5015.b: "Xây dựng một $d_treasure_planet$ tại §Y[event_target:treasure_planet_candidate_2.GetName]§!."
