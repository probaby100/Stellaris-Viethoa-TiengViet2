 space_amoeba_UNIQUE_MUTATION_PROJECT: "Kế Hoạch Đột Biến Amip Không Gian"
 space_amoeba_UNIQUE_MUTATION_PROJECT_DESC: "Trong lúc huấn luyện các sinh vật nhân bản mới, một con Amip Không Gian bị thương đã sử dụng một kỹ năng mới lạ để đánh bại đối thủ. Roi của Amip có thể hút chất dinh dưỡng và vật chất từ lớp phòng ngự tự nhiên của đồng đội huấn luyện, dùng chúng để vá những lỗ thủng trên áo giáp của chính nó và khôi phục khả năng chiến đấu.\n\nViệc nghiên cứu sâu hơn về hiện tượng này có thể hé lộ một yếu tố mới trong sinh học của Amip Không Gian, từ đó có thể cường hóa nó để phát triển thành một dạng đột biến đặc thù cho loài này."
 tiyanki_UNIQUE_MUTATION_PROJECT: "Kế Hoạch Đột Biến Tiyanki"
 tiyanki_UNIQUE_MUTATION_PROJECT_DESC: "Gần đây, chúng ta quan sát thấy một hạm đội Tiyanki nhân bản đang giao tiếp với nhau bằng cách liên tục phát ra những tiếng kêu phức tạp. Những âm thanh gần như không thể nghe thấy này dường như mang lại sự an ủi và bình yên cho tất cả các sinh vật khác gần đó.\n\nViệc nghiên cứu sâu hơn về hiện tượng này có thể hé lộ một yếu tố mới trong sinh học của Tiyanki, từ đó có thể cường hóa nó để phát triển thành một dạng đột biến đặc thù cho loài này."
 voidworm_UNIQUE_MUTATION_PROJECT: "Kế Hoạch Đột Biến Sâu Hư Không"
 voidworm_UNIQUE_MUTATION_PROJECT_DESC: "Chúng ta nhận thấy một số Sâu Hư Không khi trưởng thành sẽ xuất hiện những khối u nhỏ dạng nang. Quan sát thêm cho thấy, những cá thể mang theo những bọng nước xấu xí này thường có khả năng sinh sản vượt trội hơn so với đồng loại.\n\nViệc nghiên cứu sâu hơn về hiện tượng này có thể hé lộ một yếu tố mới trong sinh học của Sâu Hư Không, từ đó có thể cường hóa nó để phát triển thành một dạng đột biến đặc thù cho loài này."
 cutholoid_UNIQUE_MUTATION_PROJECT: "Kế Hoạch Đột Biến Quái Thạch"
 cutholoid_UNIQUE_MUTATION_PROJECT_DESC: "Do bị cho ăn quá mức, chúng ta đã ghi nhận được cảnh một con Quái Thạch nhân bản nôn mửa dữ dội. Dịch tiêu hóa trào ra từ dạ dày của nó hoạt động như một loại đạn cô đặc có sức sát thương cực cao, ngay cả khi đã rời khỏi cơ thể sinh vật một thời gian dài, nó vẫn giữ được tính phóng xạ.\n\nViệc nghiên cứu sâu hơn về hiện tượng này đã hé lộ một yếu tố mới trong sinh lý của Quái Thạch, có thể được dùng để tăng cường quá trình đột biến đặc thù cho loài này."
 crystalline_entity_UNIQUE_MUTATION_PROJECT: "Kế Hoạch Đột Biến Thực Thể Pha Lê"
 crystalline_entity_UNIQUE_MUTATION_PROJECT_DESC: "Trong quá trình thử nghiệm thực chiến, một số Thực Thể Pha Lê của chúng ta sau khi bị tiêu diệt đã phân tách hoàn hảo thành hai nửa. Những mảnh vỡ này vẫn duy trì được các dấu hiệu sinh tồn quan trọng và tiếp tục tồn tại thêm một thời gian nữa."
 tiyanki_matriarch_UNIQUE_MUTATION_PROJECT: "Kế Hoạch Đột Biến $NAME_Elderly_Tiyanki$"
 tiyanki_matriarch_UNIQUE_MUTATION_PROJECT_DESC: "Vật chất di truyền mà chúng ta trích xuất từ $NAME_Elderly_Tiyanki$ đã mang đến cho chúng ta một số góc nhìn độc đáo, mở đường cho một dự án đột biến thử nghiệm có thể áp dụng cho bất kỳ loại thú không gian nào."
 voidspawn_UNIQUE_MUTATION_PROJECT: "Kế Hoạch Đột Biến Hư Không Sinh Nghiệt"
 voidspawn_UNIQUE_MUTATION_PROJECT_DESC: "Vật chất di truyền mà chúng ta trích xuất từ $NAME_Voidspawn$ đã mang đến cho chúng ta một số góc nhìn độc đáo, mở đường cho một dự án đột biến thử nghiệm có thể áp dụng cho bất kỳ loại thú không gian nào."
 unique_mutation_project_unlock_desc: "Công cuộc nhân bản [From.GetShipCategoryName] của chúng ta đã đạt được những bước đột phá về mặt di truyền. Bằng cách kết hợp cấu trúc giải phẫu độc đáo của những sinh vật này với chuyên môn về thao túng gen, chúng ta có thể tạo ra một biến thể độc nhất vô nhị."
