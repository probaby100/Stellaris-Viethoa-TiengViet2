 grand_archive.1002.name: "Muôn loài giữa muôn Vì sao"
 grand_archive.1002.desc.default: "Vũ trụ này tràn ngập sự sống. Chúng ta đã phát hiện ra [from.GetSpaceFaunaNamePlural], nhưng ngoài kia còn gì khác nữa?\n\nMối liên kết khăng khít của chúng ta với muôn loài dã thú trên [capital_scope.GetName] có thể không còn phù hợp ở quy mô thiên hà. Khoảng không vũ trụ bao la là cả một hệ sinh thái hoàn toàn mới, và giờ đây chúng ta đang đứng trước ngã rẽ.\n\nNhững sinh vật này có ý nghĩa gì với chúng ta?\n\nDù lựa chọn của chúng ta là gì, hệ quả của nó sẽ sớm hiển hiện trong tương lai."
 grand_archive.1002.desc.homicidal: "Vũ trụ này hẳn là tràn ngập sự sống - và chúng ta có quyền diệt trừ hoặc lợi dụng chúng. Chúng ta đã phát hiện ra [from.GetSpaceFaunaNamePlural] và đang khao khát săn lùng thêm. Trở thành con mồi non mềm hay bầy súc vật nai lưng ra làm, quyết định là ở chúng ta."
 grand_archive.1002.a: "Những mẫu vật để trưng bày."
 grand_archive.1002.b: "Lũ gia súc đem lại lợi nhuận."
 grand_archive.1002.c: "Những sinh vật đáng được bảo tồn."
 grand_archive.1002.d: "Con mồi mới vào tầm ngắm."
 grand_archive.1002.d.purifier: "Vật liệu xây nên tháp xác đẫm máu."
 grand_archive.1002.e: "Ý thức chờ được đồng hóa."
 grand_archive.1002.f: "Những bạn đồng hành cộng sinh."
 grand_archive.1002.g: "Thức ăn dâng tận miệng."
 untamed_wilds: "Hoang dã Nguyên sơ"
 untamed_wilds_desc: "Một khu bảo tồn trải dài mênh mông, nơi các loài dã thú sinh trưởng mạnh mẽ, cung cấp nguồn dinh dưỡng bền vững cho sinh vật bản địa."
 grand_archive.1010.desc: "Thuộc địa của chúng ta trên [Root.GetName] đã học được cách tôn trọng ranh giới lãnh thổ tự nhiên của lũ §YThú khổng lồ§! bản địa.\n\nTheo đà mở rộng biên giới và khai phá đất đai, những con thú khổng lồ này sẽ tiếp tục mang lại nhiều lợi ích cho thuộc địa của chúng ta."
 grand_archive.1010.a: "Những [owner.GetWranglerJobNamePlural] của chúng ta sẽ làm tốt việc này."
