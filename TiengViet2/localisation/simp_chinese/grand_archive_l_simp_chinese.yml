 #Sự cân nhắc của các phe cuồng sát #
 #Fanatic Purifiers
 grand_archive.4135.name: "Đồ Trang Sức Của Kẻ Hạ Đẳng"
 grand_archive.4135.desc: "Khi chúng ta tiếp tục thanh tẩy bọn cặn bã ngoại lai bẩn thỉu trên hành tinh này, bộ sưu tập chiến lợi phẩm [GetCollectionRewardCategory] của chúng ta ngày một chất đống.\n\nHy vọng rằng những vật trưng bày này sẽ trở thành mảnh tàn dư của cái thiên hà ô uế này, khích lệ chúng ta tiến xa hơn trong việc thực hiện lời thề của mình."
 grand_archive.4135.desc.geology: "$grand_archive.4135.desc$"
 grand_archive.4135.desc.aesthetic: "$grand_archive.4135.desc$"
 grand_archive.4135.a: "Vì [this.GetName]!"
 grand_archive.4140.name: "Tích Cóp Trân Bảo"
 grand_archive.4140.desc.geology: "Chúng ta tiếp tục thu thập các vật phẩm [GetCollectionRewardCategory], những kỳ trân dị bảo và các món đồ kỳ quặc từ hệ sao dơ bẩn này.\n\nHãy dành chút thời gian để thưởng thức chiến lợi phẩm của mình, nhưng phải nhớ rằng ngoài kia vẫn còn vô số thứ đang chờ chúng ta đoạt lấy."
 grand_archive.4140.desc.aesthetic: "Chúng ta vẫn tiếp tục thu thập các món đồ trang sức [GetCollectionRewardCategory], những tàn tích ô uế do các dạng sống hạ đẳng gieo rắc.\n\nMột khi tất cả bọn ngoại lai đáng tởm bị quét sạch khỏi các vì sao, những đồ vật này sẽ là lời nhắc nhở về bản chất ti tiện của chúng."
 grand_archive.4140.a: "Thiên hà này phải được thanh tẩy."
 grand_archive.4145.name: "Kho Đầy Chiến Lợi Phẩm"
 grand_archive.4145.desc.geology: "Chúng ta đã chất đầy kho bằng các vật phẩm [GetCollectionRewardCategory], chúng chính là phần máu thịt cổ xưa của thiên hà này.\n\nBộ sưu tập đồ sộ này chính là minh chứng ghi lại sự hủy diệt mà chúng ta đã mang đến. Hãy để tất cả chiêm ngưỡng chiến thắng của chúng ta."
 grand_archive.4145.desc.aesthetic: "Chúng ta đã nhồi nhét kho tàng bằng hàng loạt kỳ vật [GetCollectionRewardCategory], một mớ đồ trang trí vô nghĩa của bọn ngoại lai.\n\nNhìn vào bộ sưu tập khổng lồ này, chúng ta không khỏi cười nhạo lũ sinh vật hạ đẳng thảm hại kia. Thử nghĩ mà xem, một khi chúng bị tiêu diệt, những tủ trưng bày này sẽ là dấu tích duy nhất còn sót lại của chúng."
 grand_archive.4145.a: "Cạn ly vì cái chết!"
 #Devouring Swarm
 grand_archive.4136.name: "Món Tráng Miệng Đưa Vào Kho"
 grand_archive.4136.desc: "Cơn đói không hề nguôi ngoai. Trên chặng đường nuốt chửng của chúng ta, số lượng kỳ vật [GetCollectionRewardCategory] thu được không ngừng tăng lên.\n\nMong rằng những hiện vật này sẽ là ký ức cuối cùng về những thiên hà mà chúng ta đã xé xác."
 grand_archive.4136.desc.geology: "$grand_archive.4136.desc$"
 grand_archive.4136.desc.aesthetic: "$grand_archive.4136.desc$"
 grand_archive.4136.a: "Cơn đói vô tận."
 grand_archive.4141.name: "$grand_archive.4136.name$"
 grand_archive.4141.desc.common: "Mỗi khi thưởng thức bữa ăn, những vật phẩm này sẽ gợi nhắc lại những đại tiệc đã bị chúng ta ngấu nghiến không biết bao nhiêu lần."
 grand_archive.4141.desc.geology: "Chúng ta lại tiếp tục thu thập các mẫu vật [GetCollectionRewardCategory], chính là phần máu thịt cổ xưa của thiên hà này.\n\n$grand_archive.4141.desc.common$"
 grand_archive.4141.desc.aesthetic: "Chúng ta vẫn tiếp tục thu thập những món đồ lưu niệm [GetCollectionRewardCategory], các món đồ cổ quái từng được lũ sinh vật hạ đẳng nâng niu.\n\n$grand_archive.4141.desc.common$"
 grand_archive.4141.a: "Bữa tiệc vẫn tiếp diễn."
 grand_archive.4146.name: "Ký Ức Đại Tiệc"
 grand_archive.4146.desc: "Chúng ta đã thỏa sức ăn uống no say tại thiên hà này, nhét đầy kho chứa bằng hàng tá kỳ trân dị bảo [GetCollectionRewardCategory].\n\nBộ sưu tập to lớn này chỉ làm khơi gợi thêm cơn khát máu không bao giờ thỏa mãn. Sau khi thiên hà này bị nuốt trọn hoàn toàn, chúng ta sẽ vừa ngắm nhìn những thứ này, vừa nhấm nháp lại ký ức về bữa tiệc."
 grand_archive.4146.desc.geology: "$grand_archive.4146.desc$"
 grand_archive.4146.desc.aesthetic: "$grand_archive.4146.desc$"
 grand_archive.4146.a: "Thơm ngon."
 #Determined Exterminators
 grand_archive.4137.name: "Vật Trang Trí Giá Trị"
 grand_archive.4137.desc: "Chúng ta đã gom nhặt một lô vật phẩm [GetCollectionRewardCategory], những thứ mà các sinh vật hữu cơ coi là cổ vật độc đáo mang giá trị.\n\nDưới sự giám sát của chúng ta, những đồ vật này sẽ vẫn trường tồn kể cả khi sự sống hữu cơ đã tuyệt diệt khỏi thiên hà từ rất lâu về sau."
 grand_archive.4137.desc.geology: "$grand_archive.4137.desc$"
 grand_archive.4137.desc.aesthetic: "$grand_archive.4137.desc$"
 grand_archive.4137.a: "Sự tò mò vô hại."
 grand_archive.4142.name: "Kỳ Vật Trân Tàng"
 grand_archive.4142.desc: "Chúng ta vừa thu thập chiến lợi phẩm [GetCollectionRewardCategory], vừa xóa sổ mọi vết nhơ của sự sống hữu cơ trong thiên hà này.\n\nNhững vật phẩm này sẽ là lời nhắc nhở trong các giao thức tuyệt diệt tương lai rằng, chúng ta đã tận mắt chứng kiến sự phi lý trí của bọn hữu cơ."
 grand_archive.4142.desc.geology: "$grand_archive.4142.desc$"
 grand_archive.4142.desc.aesthetic: "$grand_archive.4142.desc$"
 grand_archive.4142.a: "Sắp xếp lại Giao thức."
 grand_archive.4147.name: "Không Gian Bộ Nhớ Đã Đầy"
 grand_archive.4147.desc: "Cùng với tiến trình thanh tẩy thiên hà, dung lượng bộ nhớ dùng để lưu trữ các loài [GetCollectionRewardCategory] đã đạt mức giới hạn.\n\nNhững bộ sưu tập này cung cấp dữ liệu phân tích về các loại đồ vật mà bọn hữu cơ có xu hướng nâng niu. Điều này sẽ hỗ trợ cho mục tiêu tiêu diệt chúng triệt để hơn, đồng thời đóng vai trò như một mốc tham chiếu lịch sử cho cái thiên hà bị nhiễm trùng này."
 grand_archive.4147.desc.geology: "$grand_archive.4147.desc$"
 grand_archive.4147.desc.aesthetic: "$grand_archive.4147.desc$"
 grand_archive.4147.a: "Bọn sinh vật hữu cơ thật ngu xuẩn."
