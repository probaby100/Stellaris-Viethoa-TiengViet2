 tr_domestication_containment_protocols: "Giao Thức Giam Giữ"
 tr_domestication_containment_protocols_delayed: "Khi giam giữ và vận chuyển các sinh vật khổng lồ, chúng luôn có nguy cơ bị thương hoặc tự làm hại mình. Sử dụng khí an thần và giao thức giam giữ phù hợp có thể giảm thiểu vấn đề này."
 tr_domestication_containment_protocols_tt: "Tăng xác suất bắt được §YThú Không Gian§! quý hiếm."
 tr_domestication_bio_repurposing: "Tái Sử Dụng Sinh Học"
 tr_domestication_bio_repurposing_delayed: "Không lãng phí bất cứ thứ gì."
 tr_domestication_bio_repurposing_blocker_tt: "Thu được §G$@bio_repurposing_blocker_clear_food|0$§!$r_food$ khi dọn dẹp £blocker£§YChướng Ngại Vật Hữu Cơ§!"
 tr_domestication_bio_repurposing_tt: "Bầy §YThú Không Gian§! của ta bị đánh bại sẽ để lại mảnh vỡ để nghiên cứu và thu hồi một phần chi phí. (§G10%§!)\n$tr_domestication_bio_repurposing_blocker_tt$"
 tr_domestication_bio_repurposing_reanimator_tt: "$tr_domestication_bio_repurposing_blocker_tt$"
 tr_domestication_astrozoology: "Động Vật Học Không Gian"
 tr_domestication_astrozoology_delayed: "Mỗi loài động vật trong không gian đều có những đặc điểm riêng biệt, với phương thức sinh sản và nhu cầu dinh dưỡng khác nhau. Để khai thác tối đa tiềm năng của chúng trong môi trường biệt lập đòi hỏi sự tập trung cao độ."
 tr_domestication_astrozoology_tt: "Khi bắt hoặc lai tạo Thú Không Gian: $NEW_LINE$$t$—Tài nguyên thu được khi giết mổ: §G200%§!"
 tr_domestication_metabolic_regulation: "Điều Hòa Chuyển Hóa"
 tr_domestication_metabolic_regulation_delayed: "Chúng ta có thể kiểm soát nhân tạo quá trình trưởng thành của các loài bị giam giữ bằng cách điều chỉnh các loại enzyme và protein quan trọng ảnh hưởng đến quá trình trao đổi chất của từng cá thể."
 tr_domestication_metabolic_regulation_tt: "Mở khóa chính sách §Y$policy_metabolic_regulation$§!"
 tr_domestication_metabolic_regulation_machine_tt: "$tr_domestication_metabolic_regulation_tt$"
 tr_domestication_killer_instinct: "Bản Năng Sát Thủ"
 tr_domestication_killer_instinct_delayed: "Những sinh vật sống sót trong không gian sâu thẳm phải dựa vào chính mình để tự bảo vệ, nếu không giống loài của chúng sẽ tuyệt diệt."
 tr_domestication_killer_instinct_homicidal_delayed: "Chỉ những sinh vật máu lạnh và tàn nhẫn nhất mới xứng đáng phục vụ chúng ta."
