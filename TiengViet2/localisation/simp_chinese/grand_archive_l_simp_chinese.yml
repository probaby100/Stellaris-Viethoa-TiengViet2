 r_the_modularium: "Lò Tinh Luyện Mô Đun"
 r_the_modularium_desc: "Một hệ thống tinh luyện dạng mô-đun có khả năng tự động sản xuất các tài nguyên giá trị với tốc độ cấp số nhân, nhưng cần cung cấp lượng năng lượng khổng lồ để hoạt động."
 the_modularium_active_effect_tt: "Nhân đôi lượng tài nguyên do Lò Tinh Luyện Mô Đun tạo ra, đồng thời nhân đôi chi phí của chuyến lưu diễn triển lãm tiếp theo."
 r_flowmetal_alloy: "Hợp Kim Kim Loại Chảy"
 r_flowmetal_alloy_desc: "Loại vật liệu có khả năng tự nhân bản này giúp cường hóa liên kết hóa học của bất kỳ kim loại nào nó tiếp xúc. Đưa Kim Loại Chảy vào quy trình lắp ráp có thể cải thiện mạnh mẽ hiệu suất sản xuất các cỗ máy khổng lồ."
 flowmetal_alloy_active_effect_tt: "Tạo ra §G300§! §Y£pop£dân số Người Máy§! tại thủ đô của bạn."
 r_crystallinus_diffuser: "Máy Phun Tinh Thể"
 r_crystallinus_diffuser_desc: "Một thiết bị có khả năng chuyển hóa pha lê tổng hợp thành một loại thuốc cường hóa hiệu suất cực mạnh. Hóa chất do nó sinh ra ở dạng tinh khiết nhất có tính bay hơi sinh học, và có nguy cơ gây suy đa tạng cho một số ít người sử dụng."
 crystallinus_diffuser_active_effect_tt: "Năng suất của dân số hữu cơ trong đế chế sẽ tăng 100% trong vòng 10 năm tới. Tuy nhiên, 20% dân số sẽ thiệt mạng sau đó."
 crystallinus_diffuser_machine_empire_active_effect_tt: "§G+100§! $r_energy$, kéo dài 10 năm"
 relic_crystallinus_diffuser_opinon: "Đánh giá từ các đế chế §Yhữu cơ§! §G+25§!"
 triggered_opinion_relic_crystallinus_diffuser: "$r_crystallinus_diffuser$"
 crystallinus_diffuser_modifier: "Triển lãm lưu động $r_crystallinus_diffuser$"
 r_everchanging_stone: "Đá Biến Ảo"
 r_everchanging_stone_desc: "Một viên đá quý được chế tác kỹ thuật, có thể đổi màu và thành phần hóa học tùy theo môi trường xung quanh. Khi đặt cạnh bất kỳ vật thể nào, nó sẽ bắt chước các nguyên tố cấu thành vật liệu đó, giúp chúng ta hiểu rõ hơn về cấu trúc phân tử của vật thể."
 everchanging_stone_modifier: "Triển lãm lưu động $r_everchanging_stone$"
 everchanging_stone_modifier_tt: "Mỗi ['concept_specimen'] được trưng bày trong $EXHIBITION_XENO_GEOLOGY$ sẽ tăng sản lượng của hai hạng mục lớn còn lại thêm §G+$@everchanging_stone_modifier|0%$§!."
 r_pulsestone: "Đá Xung Nhịp"
 r_pulsestone_desc: "Một viên đá có tính phóng xạ cực mạnh, phát ra những luồng sóng từ trường nguy hiểm. Nó mang tiềm năng thay đổi hoàn toàn cách chúng ta thao túng trường lực, nhưng nguồn năng lượng nó tỏa ra lại gần như không thể kiểm soát."
 pulsestone_modifier: "$r_pulsestone$"
 mod_scientist_lifespan_add: "Tuổi thọ Nhà Khoa Học"
 r_gavel_of_the_tribunal: "Búa Phán Xét"
 r_gavel_of_the_tribunal_desc: "Trên cán búa này khắc tên của ba nhà thông thái cổ đại từng cai trị một đế chế thiên hà nay đã lụi tàn. Dù nó quá khổ so với bất kỳ ai trong chúng ta, nhưng chỉ riêng sự tồn tại của nó cũng đủ gieo rắc nỗi kinh sợ."
 gavel_of_the_tribunal_galcom: "$r_gavel_of_the_tribunal$"
 gavel_of_the_tribunal_galcom_tt: "Trọng lượng ngoại giao £diplo_weight£§G+$@gavel_of_the_tribunal_galcom_diplo_weight|0%$§!, cho đến khi §Ynghị quyết§! tiếp theo được thông qua."
 gavel_of_the_tribunal_no_galcom: "$r_gavel_of_the_tribunal$"
 r_celestial_resonator: "Bộ Phóng Âm Thiên Thể"
 r_celestial_resonator_desc: "Một cỗ máy kỳ lạ có khả năng tạo ra một buổi trình diễn ánh sáng hoành tráng đến kinh ngạc, và sức mạnh của nó sẽ càng được khuếch đại khi đặt gần các mẫu vật."
 celestial_resonator_tt: "Mỗi ['concept_specimen'] được đem ra trưng bày sẽ tạo ra 10 $r_unity$"
 celestial_resonator_triumph_tt: "Mỗi ['concept_specimen'] được trưng bày sẽ mang lại §G+$@celestial_resonator_happiness|0%$§! £happiness£§YHạnh Phúc§! và §G+$@celestial_resonator_diplo_weight|0%$§! £diplo_weight£§YTrọng Lượng Ngoại Giao§!"
 celestial_resonator_modifier: "$r_celestial_resonator$"
 r_entangled_relay: "Trạm Trung Chuyển Rối Lượng Tử"
 r_entangled_relay_desc: "Cổ vật này có thể kết nối các mạng lưới truyền tin xa xôi thông qua hiện tượng rối lượng tử, qua đó tạo ra một hệ thống liên lạc xuyên thiên hà không độ trễ."
 entangled_relay_modifier: "$r_entangled_relay$"
 r_prototype_vir_core: "Lõi VIR Thử Nghiệm"
 r_prototype_vir_core_desc: "Một trí tuệ nhân tạo độc lập được tối ưu riêng cho mảng giáo dục và chỉ dẫn, có thể hỗ trợ trong mọi tình huống. Nó chuyên giải thích các khái niệm phức tạp một cách dễ hiểu, đồng thời trình bày thông tin một cách rành mạch để người dùng có thể đưa ra những quyết sách sáng suốt."
 prototype_vir_core_modifier: "$r_prototype_vir_core$"
 r_propagandosphere: "Quả Cầu Tuyên Truyền"
 r_propagandosphere_desc: "Quả cầu toàn ảnh này chứa cả một kho lưu trữ phim tuyên truyền của một nền văn minh đã diệt vong. Những bộ phim này có nội dung vô cùng sáng tạo và lôi cuốn, hoàn toàn có thể biên tập lại theo hình ảnh của chúng ta để làm công cụ cổ vũ tinh thần cho quân đội và nhân dân."
 r_executus_compendium: "Tóm Lược Chấp Hành"
 r_executus_compendium_desc: "Hội đồng của một nền văn minh cổ đại đã để lại lượng lớn ghi chép được niêm phong trong một khoang cứu sinh. Bên trong chứa hàng nghìn tỷ trang tài liệu chi tiết ghi chép lại các phương pháp tối ưu hóa bộ máy quan liêu và những công cụ tổ chức đầy sáng tạo. Rất nhiều cải tiến trong số đó có thể được áp dụng trực tiếp vào quy trình quản lý chính phủ của chính chúng ta."
 executus_compendium_triumph_tt: "Khởi động một Nghị Sự với chi phí bằng 10% phí khởi động sớm. (Chi phí tối thiểu £unity£3000)"
 r_the_pattern_maker: "Máy Tạo Mẫu"
 r_the_pattern_maker_desc: "Cỗ máy tính cổ đại này sở hữu năng lực vô song trong việc giám sát quỹ đạo động và dự đoán hành vi của các vật thể như tàu địch. Các mẫu dữ liệu do thuật toán dự báo của nó tạo ra sâu sắc và phức tạp tựa như bản thiết kế của một kiến trúc sư bậc thầy. Nếu được cung cấp đủ năng lượng và vật liệu, nó có thể chế tạo ra một tàu do thám chuyên dụng được trang bị hệ thống cảm biến siêu nhạy."
 r_the_pattern_maker_effect_tt: "Chế tạo một tàu do thám lớp §YMáy Dạo Bước Mô Hình§!\n—Tốc độ cực cao và tầm dò tìm siêu không gian cực lớn"
 NAME_Patternwalker: "Máy Dạo Bước Mô Hình"
 NAME_Patternwalker_Cloak: "$NAME_Patternwalker$"
 SENSOR_PATTERNWALKER: "Cảm Biến Mô Hình Tiên Kiến"
 r_vaporous_mega_orchid: "Đại Phong Lan Phun Sương"
 r_vaporous_mega_orchid_desc: "Giống phong lan khổng lồ này cứ 50 năm mới nở hoa một lần. Hương thơm của nó đã được chứng minh là có tác dụng an thần, có thể tạm thời phong tỏa các khớp thần kinh liên quan đến hành vi hung hăng và sự nghi ngờ trong não bộ."
 r_vaporous_mega_orchid_effect_tt: "Tăng §G+$@vaporous_mega_orchid_opinion|0$§! £opinion£đánh giá từ mọi đế chế không cuồng sát, không thất thủ và không phải máy móc trong vòng §Y$@vaporous_mega_orchid_opinion_duration_years|0$§! năm."
 opinion_vaporous_mega_orchid: "$r_vaporous_mega_orchid$"
 r_tiyanki_matriarch_nerve_core: "Lõi Thần Kinh Tiyanki Ana"
 r_tiyanki_matriarch_nerve_core_desc: "Chất xám của con cá voi không gian cổ đại này được mã hóa bằng tế bào thần kinh, lưu trữ dữ liệu tiến hóa qua vô số thế kỷ. Bằng cách giải mã mạng lưới này, chúng ta có thể tìm ra điểm yếu của những loài dã thú khổng lồ khác, cũng như khám phá bí mật đằng sau cách chúng sinh tồn."
 tiyanki_matriarch_nerve_core: "$r_tiyanki_matriarch_nerve_core$"
 celestial_chart: "Họa Đồ Tinh Tú"
 r_celestial_chart_0: "Khoang Quỹ Đạo Bí Ẩn"
 r_celestial_chart_0_desc: "Một khoang vũ trụ kỳ lạ đã bay quanh quỹ đạo hành tinh mẹ của chúng ta hàng ngàn năm. Chúng ta vẫn chưa biết bên trong nó ẩn chứa thông tin gì."
 r_celestial_chart_1: "$celestial_chart$"
 r_celestial_chart_1_desc: "Một góc của tấm bản đồ vĩ đại được tìm thấy trong một khoang cứu sinh cổ xưa."
 r_celestial_chart_2: "$celestial_chart$"
 r_celestial_chart_2_desc: "Bản đồ hoàn thiện một phần được tìm thấy trong khoang cứu sinh cổ xưa."
 r_celestial_chart_3: "$celestial_chart$"
 r_celestial_chart_3_desc: "Bản đồ gần như hoàn chỉnh được tìm thấy trong khoang cứu sinh cổ xưa."
 r_celestial_chart_4: "$celestial_chart$"
 r_celestial_chart_4_desc: "Một cơ sở dữ liệu tinh đồ đồ sộ do hải tặc huyền thoại $NAME_CaptainNess$ vẽ ra."
 r_celestial_chart_4_effect_tt: "Xây dựng một ['concept_treasure_vault'] tại một trong những thuộc địa của chúng ta."
 celestial_chart_upgraded_tt: "§Y$celestial_chart$§! đã được cập nhật thêm thông tin mới."
 r_mutated_voidworm_nest: "Tổ Sâu Hư Không Đột Biến"
 r_mutated_voidworm_nest_desc: "Một cái tổ của Sâu Hư Không đột biến, chúng đã tiến hóa khả năng sinh sản mà không cần phải lây nhiễm ký sinh. Một vài cá thể bên trong có thể trưởng thành hoàn toàn chỉ trong vài ngày."
 r_mutated_voidworm_nest_effect_tt: "Tạo ra một hạm đội $NAME_Frenzied_Voidworms$ trưởng thành tại hệ sao thủ đô."
 ######################################
 #Bộ Sưu Tập - Tương Tác Curator #
 ######################################
 CURATORS_DESIGNATION: "Chúng tôi"
 DEAD_CURATORS_DESIGNATION: "Là những người sống sót cuối cùng của hội, chúng tôi"
 grand_archive.4121.name: "$leviathans.500.name$"
 grand_archive.4121.desc.common: "Biết được các bạn đã xây dựng một §Y$grand_archive$§! có thể đón tiếp lượng lớn khách tham quan, chúng tôi thấy rằng chia sẻ lịch sử thiên hà với những ai khao khát tri thức là một sáng kiến rất đáng khen ngợi. Chúng ta có chung một chí hướng.\n\nChúng tôi hy vọng có thể giúp đỡ các bạn hiện thực hóa mục tiêu này."
 grand_archive.4121.desc.default: "Chúng tôi $grand_archive.4121.desc.common$ sẽ tiếp tục làm phong phú thêm §YBộ sưu tập§! của bạn, chúng tôi sẽ dốc hết sức mình để hỗ trợ."
 grand_archive.4121.desc.dead: "Những người sống sót của hội chúng tôi $grand_archive.4121.desc.common$ Dù chúng tôi đã tan đàn xẻ nghé, nhưng chúng tôi vẫn sẽ dùng chút tàn lực cuối cùng để giúp các bạn mở rộng §YBộ sưu tập§!."
 leviathans.4100.desc: "Tất nhiên rồi!\n\nChúng tôi đều chứng kiến sự nỗ lực của các bạn. Dựa trên §YBộ sưu tập§! hiện tại của bạn, chúng tôi có thể mang đến những sự hỗ trợ sau đây như một lời động viên."
 leviathans.4100.a: "Hãy trò chuyện với chúng tôi"
 leviathans.4100.a.aesthetic_wonder: "$leviathans.4100.a$ §Y$EXHIBITION_AESTHETIC_WONDERS$§!"
 leviathans.4100.a.historical_item: "$leviathans.4100.a$ §Y$EXHIBITION_GALACTIC_HISTORY$§!"
 leviathans.4100.a.xeno_geology: "$leviathans.4100.a$ §Y$EXHIBITION_XENO_GEOLOGY$§!"
 leviathans.4100.tooltip.no_pending_reward: "Bạn phải mở rộng bộ sưu tập để nhận thêm hỗ trợ từ Curator."
 leviathans.4100.tooltip.no_reward: "Bạn đã nhận được mọi sự hỗ trợ có thể về"
 leviathans.4100.tooltip.no_reward.aesthetic_wonder: "$leviathans.4100.tooltip.no_reward$ $EXHIBITION_AESTHETIC_WONDERS$"
 leviathans.4100.tooltip.no_reward.historical_item: "$leviathans.4100.tooltip.no_reward$ $EXHIBITION_GALACTIC_HISTORY$"
 leviathans.4100.tooltip.no_reward.xeno_geology: "$leviathans.4100.tooltip.no_reward$ $EXHIBITION_XENO_GEOLOGY$"
 leviathans.4105.desc: "Không vấn đề gì.\n\nCác bạn muốn biết thêm về lĩnh vực nào?"
 leviathans.4105.a: "Chúng tôi rất hứng thú với sự hướng dẫn của các bạn trong một lĩnh vực cụ thể."
 leviathans.4105.b.common: "Chúng tôi muốn mua"
 leviathans.4105.b.aesthetic_wonder: "$leviathans.4105.b.common$ bản thiết kế của một bảo tàng §Y$EXHIBITION_AESTHETIC_WONDERS$§!."
 leviathans.4105.b.historical_item: "$leviathans.4105.b.common$ bản thiết kế của một bảo tàng §Y$EXHIBITION_GALACTIC_HISTORY$§!."
 leviathans.4105.b.xeno_geology: "$leviathans.4105.b.common$ bản thiết kế của một bảo tàng §Y$EXHIBITION_XENO_GEOLOGY$§!."
 leviathans.4105.c: "Chúng tôi muốn mua một §YDi Tích§!."
 leviathans.506.g: "Các bạn còn có thể giúp gì cho §YBộ Sưu Tập§! của chúng tôi?"
 leviathans.4110.desc: "Chúng tôi chỉ có thể cử chuyên gia đến một lĩnh vực duy nhất. Biển sao bao la mà nhân lực của chúng tôi lại có hạn.\n\nCác bạn cần được hỗ trợ về mảng nào?"
 leviathans.4111.desc: "$leviathans.4110.desc$"
 leviathans.4112.desc: "$leviathans.4110.desc$"
 leviathans.4115.desc: "Đúng vậy. Chúng tôi sẽ ủy thác cho các bạn một món đồ trong bộ sưu tập cá nhân của mình.\n\nĐây là một thứ vô cùng quan trọng đối với chúng tôi, hy vọng có thể nhận được sự đền đáp xứng đáng."
 leviathans.4116.desc: "$leviathans.4115.desc$"
 leviathans.4117.desc: "$leviathans.4115.desc$"
