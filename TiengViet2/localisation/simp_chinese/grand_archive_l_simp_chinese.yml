 VOIDWORMS_PROJECT: "Nghiên Cứu Sâu Hư Không"
 VOIDWORMS_PROJECT_DESC: "Đặc tính sinh học và mô hình sinh sản của Sâu Hư Không rất đáng để nghiên cứu sâu hơn."
 tech_voidworm_immunity: "Miễn Dịch Sâu Hư Không"
 tech_voidworm_immunity_desc: "Chúng ta có thể phát triển ra các loại thuốc đặc trị bệnh nhiễm trùng ký sinh của Sâu Hư Không. Mọi thuộc địa sẽ được miễn nhiễm với phương pháp oanh tạc bằng bào tử mà chúng hiện đang sử dụng."
 tech_voidworm_immunity_effect: "Thuộc địa không bị ảnh hưởng bởi những đợt oanh tạc của Sâu Hư Không.\n$mod_damage_vs_country_type_voidworms_mult$: §G+$@vaccine_damage_vs_country_type_voidworms_mult|0%$§!"
 tech_voidworm_immunity_effect_during_situation: "§RTrong thời kỳ Đại Dịch Sâu Hư Không, miễn dịch oanh tạc quỹ đạo không có tác dụng.§!\n$mod_damage_vs_country_type_voidworms_mult$: §G+$@vaccine_damage_vs_country_type_voidworms_mult|0%$§!\nTiến trình cục diện §Y$situation_voidworm_plague$§! tăng §G+$@vaccine_situation_advancement|0$§!"
 voidworm_nest: "Tổ Sâu Hư Không"
 voidworm_nest_plural: "Tổ Sâu Hư Không"
 voidworm_broken_nest: "Tổ Sâu Hư Không Bị Phá Hủy"
 voidworm_broken_nest_desc: "Di tích một cái tổ từng được Sâu Hư Không sử dụng để nuôi nấng và che chở cho ấu trùng."
