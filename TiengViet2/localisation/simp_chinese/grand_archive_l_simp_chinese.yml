 starborne_biology: "Sinh Lý Sinh Ra Từ Các Vì Sao"
 starborne_biology_desc: "Nguồn năng lượng chính của các sinh vật khổng lồ trong không gian sâu thẳm đến từ sức mạnh của ánh sao. Càng ở gần những ngôi sao sáng rực rỡ, tốc độ phát triển của chúng càng nhanh."
