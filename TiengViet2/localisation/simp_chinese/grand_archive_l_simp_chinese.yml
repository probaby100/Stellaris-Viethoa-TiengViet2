 mod_gravity_snare_cooldown_mult: "Hồi chiêu Bẫy Trọng lực"
 MOD_GRAVITY_SNARE_COST_MULT: "Chi phí Bẫy Trọng lực"
 MOD_SPACE_FAUNA_CULLING_REWARD_MULT: "Tài nguyên thu được khi mổ thịt"
 grand_archive.7210.name: "Bẫy Trọng lực"
 grand_archive.7210.desc.common: "Với việc phát hiện ra §Y$tech_gravity_wells$§! gần đây, tàu khoa học [root.GetAdjective] hiện có thể phóng $gravity_snare_plural$."
 grand_archive.7210.desc.vivarium: "Những vật thể bay phi sát thương này có thể bắt sống và chở Bầy thú Vũ trụ về §YKhu Sinh thái§! của chúng ta một cách an toàn, để chúng tiếp tục sinh sôi nảy nở.\n\nMổ thịt những sinh vật này sẽ giúp thu hoạch §Y$genetic_material$§! để nhân bản cũng như các loại tài nguyên khác."
 grand_archive.7210.desc.no_vivarium: "Những vật thể bay phi sát thương này có thể bắt và chở Bầy thú Vũ trụ về để nghiên cứu và giải phẫu an toàn, qua đó thu hoạch §Y$genetic_material$§! và các tài nguyên khác.\n\nNếu muốn chăn nuôi và nhân giống những sinh vật này, chúng ta cần lập một §YKhu Sinh thái§!. Việc này có thể thực hiện bằng cách xây §Y$grand_archive$§! hoặc dựng công trình §Y[GetHatcheryPlural]§! trên căn cứ sao."
 grand_archive.7220.name: "Prethoryn Hung hãn"
 grand_archive.7220.desc: "Các §Y$gravity_snare_plural$§! của chúng ta không thể bám theo và thu giữ §Y$NAME_Prethoryn_Scourge$§! một cách chính xác. Dựa vào kiểu di chuyển, chúng tôi nghi ngờ loài này bị một ý thức bậc cao nào đó điều khiển chứ không thực sự là những cá thể độc lập.\n\nCố gắng nhốt một sinh vật này vào khu sinh thái sẽ đe dọa các loài khác, thậm chí là toàn bộ [this.GetName].\n\nChúng ta đã đình chỉ vô thời hạn mọi nỗ lực săn bắt loài sinh vật này."
 grand_archive.7220.a: "Hãy cẩn trọng."
