 collection_stage_2_reward_aesthetic_wonder_tt: "Mở khóa ['concept_aesthetic_wonders_holomuseum']."
 collection_stage_2_reward_historical_item_tt: "Mở khóa ['concept_galactic_history_holomuseum']."
