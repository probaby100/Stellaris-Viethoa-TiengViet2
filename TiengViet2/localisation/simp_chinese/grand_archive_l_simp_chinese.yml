 nutrient_rationing: "Khẩu Phần Dinh Dưỡng"
 nutrient_rationing_desc: "Việc hạn chế chế độ ăn của bầy thú không gian sẽ kìm hãm tốc độ sinh trưởng của chúng, đồng thời cho phép chúng ta phân bổ số tài nguyên này sang những lĩnh vực khác.\n\nThú không gian được nhân bản vô tính sẽ không phát triển nữa."
