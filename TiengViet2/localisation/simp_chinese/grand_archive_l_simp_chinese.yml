 concept_space_fauna_ship_component_desc: "Bộ phận Tàu Thú Không Gian thu được thông qua việc nghiên cứu các dự án đặc biệt về nhiều loài thú không gian khác nhau. Khi được xem như một §Hđột biến§! của thú không gian, tất cả các buff đều có tác dụng như nhau. Bao gồm nhưng không giới hạn ở các bộ phận sau:\n—§H$SPACE_WHALE_WEAPON_1$§!\n—§H$AMOEBA_STRIKE_CRAFT$§!"
