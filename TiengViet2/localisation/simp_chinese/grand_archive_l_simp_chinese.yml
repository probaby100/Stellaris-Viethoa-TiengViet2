 FEDERATION_VIEW_CREATURE_DESIGNER: "Thú Không Gian Liên Bang"
 FEDERATION_VIEW_CREATURE_DESIGNER_BUTTON_DESC: "§GMở §HTrình thiết kế Thú Không Gian§! của Hạm đội Liên bang!§!"
 FEDERATION_VIEW_CREATURE_DESIGNER_BUTTON_PRESIDENT_NOT_OUR_LEADER: "§RChúng ta không phải là Chủ tịch Liên bang§!"
 FEDERATION_VIEW_CREATURE_DESIGNER_BUTTON_CANNOT_USE_MUTATIONS: "§RChỉ có Quốc gia Lãnh đạo Liên bang mới có quyền thiết kế đột biến cho thú không gian. Trong Liên bang phải có ít nhất một thành viên sở hữu công nghệ §YNhan Giống Nhân Tạo§!.§!"
 FEDERATION_CREATURE_FLEET_DESC: "§HHạm đội Liên bang§! là các hạm đội đặc biệt nằm dưới quyền điều động của Chủ tịch Liên bang. Chúng được tùy chỉnh trong §H$CREATURE_DESIGNER$ Liên bang§!, sử dụng công nghệ tối tân nhất từ tất cả các quốc gia thành viên. Hạm đội Liên bang không tiêu tốn phí bảo trì, nhưng tổng số lượng không được vượt quá §HSức Chứa Hải Quân Liên Bang§!, mỗi thành viên phải đóng góp ít nhất §Y$PERC|0%$§! §HSức Chứa Hải Quân§! của mình. Nếu quy mô của hạm đội thú không gian vượt quá §HSức Chứa Hải Quân Liên Bang§!, lượng sinh vật dư ra sẽ được chia cho Quốc gia Chủ tịch Liên bang."
