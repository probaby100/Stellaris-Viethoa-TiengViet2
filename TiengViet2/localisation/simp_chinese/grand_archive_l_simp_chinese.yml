 pirate.1.desc.black_needle: "Rất có thể §Y$NAME_BlackNeedle$§! đang khuyến khích hành vi bất hợp pháp này, thậm chí có thể đang hậu thuẫn cho những tên tư thương cơ hội này."
 pirate.2.k: "Lũ trộm cắp vặt vãnh!"
 pirate.25.desc.black_needle: "Bên cạnh đó, chúng ta còn phát hiện một lô tài sản giá trị thuộc về các cựu thành viên của §Y$NAME_BlackNeedle$§!."
 #Events
 grand_archive.8000.name: "Khoang Cứu Sinh Cổ Đại"
 grand_archive.8000.desc: "Chúng ta vừa có những phát hiện mới về khoang cứu sinh cổ đại được tìm thấy tại [this.GetHomeWorldName]. Nhờ vào những nỗ lực không mệt mỏi của các [this.GetScientistPlural], lớp mã hóa kỹ thuật số cuối cùng sắp được phá giải, giải mã tấm bản đồ đã làm chúng ta tò mò bấy lâu nay."
 grand_archive.8000.a: "Rốt cuộc bên trong có những gì?"
 TREASURE_HUNTERS_ANCIENT_CAPSULE_PROJECT: "Phân Tích Khoang Cứu Sinh Cổ Đại"
 TREASURE_HUNTERS_ANCIENT_CAPSULE_PROJECT_DESC: "Chúng ta đã tiến hành phân tích sơ bộ hải đồ bên trong khoang quỹ đạo, và phát hiện ra vị trí của nhiều thiên thể không nằm trong hệ sao mẹ của ta. Sẽ cần thêm một khoảng thời gian nữa để trích xuất được tọa độ chính xác."
 grand_archive.8005.name: "Hoàn Tất Phân Tích Khoang Cứu Sinh Cổ Đại"
 grand_archive.8005.desc: "Bản đồ sao này không hề hoàn chỉnh!\n\nDữ liệu trong khoang quỹ đạo bị phân mảnh tơi tả, mỗi chỗ trống lộ rõ tựa như một mảnh ghép còn thiếu của bức tranh. Dù vậy, nó vẫn tiết lộ tọa độ của một hệ sao chưa từng được biết đến, tuy nhiên lại không cung cấp bất kỳ thông tin chi tiết nào về những thứ đang chờ đợi chúng ta ở đó.\n\nHải đồ này còn làm nổi bật một loạt các điểm đột phá để thực hiện du hành không gian siêu tốc đến điểm đích kia."
 grand_archive.8005.a.lom: "Toàn đội vào vị trí!"
 grand_archive.8015.name: "Họa Đồ Tinh Tú"
 grand_archive.8015.desc.common: "Hạm đội của chúng ta đã sẵn sàng khởi hành, chuẩn bị bước vào chặng đường tiếp theo trong hành trình của nền văn minh."
 grand_archive.8015.desc.default: "Dân cư của [this.GetHomeWorldName] đang say sưa với tấm bản đồ sao mới được giải mã gần đây. Mọi người gọi nó là \"§Y$celestial_chart$§!\", nhưng hiện tại nó mang đến nhiều câu hỏi hơn là lời giải đáp. Nó đến từ đâu? Ai là người vẽ ra nó và với mục đích gì? Và có lẽ quan trọng nhất là - liệu nó có dẫn chúng ta vào một cái bẫy hay không?\n\n$grand_archive.8015.desc.common$"
 grand_archive.8015.desc.gestalt: "Tấm bản đồ sao được tìm thấy trong khoang cứu sinh đã thu hút sự chú ý của toàn xã hội. Giờ đây người ta đã chứng minh được nó chỉ là phần nổi của tảng băng chìm so với toàn bộ tấm bản đồ, chưa rõ nó sẽ dẫn chúng ta đi về đâu và tìm thấy thứ gì. Chúng ta quyết tâm hoàn thành \"§Y$celestial_chart$§!\" này.\n\n$grand_archive.8015.desc.common$"
 grand_archive.8015.a.default: "Bắt đầu thám hiểm!"
 grand_archive.8015.a.lom: "Tháo neo!"
 grand_archive.8020.name: "Cuộc Chạm Trán Bất Ngờ"
 grand_archive.8020.desc: "Chúng ta đụng độ một hạm đội vũ trang hùng hậu treo lá cờ không rõ lai lịch. Dù xếp đội hình ngay ngắn, thiết kế tàu của chúng lại là một mớ hỗn độn. Rất nhiều con tàu được trang bị bệ phóng động năng nối với những sợi cáp lớn được gắn móc thép carbon và lao móc. Ngoài ra, ngay giữa đội hình là một toán xe vận tải bọc thép. Ta chỉ có thể đoán rằng hạm đội này được điều khiển bởi một lũ hải tặc hoặc lính đánh thuê.\n\nChúng ta đã nhận được tín hiệu từ con tàu chỉ huy của chúng."
 grand_archive.8020.a.lom: "Thế thì nói chuyện thử xem..."
 grand_archive.8025.name: "$NAME_CaptainHoo$ của $NAME_BlackNeedle$"
 grand_archive.8025.desc: "§HThủ lĩnh của lũ ngoài vòng pháp luật này tỏ vẻ kiêu ngạo và lạnh lùng, làm bộ như không thèm để tâm. Hắn nhìn xuống chiếc mỏ của mình khi nói chuyện, từ chối giao tiếp bằng mắt với chúng ta, như thể ta không xứng đáng để hắn bận tâm. Hắn làm những động tác hài hước một cách vô ý với bộ lông vũ của mình.§!\n\nCác người đã chọc giận §Y$NAME_BlackNeedle$§!, các người rắc rối to rồi!\n\nChúng ta nghe phong thanh rằng cái xã hội nhỏ bé mới nổi của các người đang định khám phá hệ sao này. Tình cờ thế nào các người lại nhặt được một tấm bản đồ sao rõ ràng là thuộc về chúng ta. Giao nó ra đây, nếu không đừng trách chúng ta không khách khí."
 grand_archive.8025.a: "Ngươi là ai?"
 grand_archive.8025.a.reply: "Ta chính là Hoo! Tên đầy đủ của ta là Grimahoo Xemendehoo, nhưng các ngươi cũng có thể gọi ta là §Y$NAME_CaptainHoo$§!, chính là thuyền trưởng của tàu Ngọn Gió Bạc, đồng thời là thuyền phó thứ hai dưới trướng ngài Cướp biển §Y$NAME_BlackNeedle$§! vĩ đại. Hàng ngàn năm qua, đôi cánh của chúng ta đã cắm sâu vào mọi hoạt động buôn bán phi pháp, còn ta chỉ là một sợi tơ bạc mỏng manh trên bức thảm hoa lệ của chúng ta mà thôi.\n\nCác ngươi tốt nhất là nên nhớ tên ta, bởi vì ta đang mong đợi một khoản tiền thưởng kếch xù sau khi giao lại tấm bản đồ đó cho vị thủ lĩnh vô song của chúng ta đấy."
 grand_archive.8025.b: "Các ngươi có manh mối gì về bản đồ sao này?"
 grand_archive.8025.b.reply: "Một tay môi giới tài ba nhưng hét giá trên trời đã tiết lộ cho chúng ta biết, các người dạo gần đây đã tình cờ tìm thấy một cái khoang cứu sinh kỳ lạ... bên trong đó có lẽ chứa vị trí của một hệ sao ẩn mà chúng ta đang rất quan tâm.\n\nTất nhiên, chúng ta cũng sở hữu một phần của tấm bản đồ đó, nhưng nếu không ghép với phần mà các người đang giữ thì nó hoàn toàn vô dụng. Thật chẳng hiểu nổi tại sao §Y$NAME_CaptainNess$§! lại giao chìa khóa kho báu của bà ta cho các người, nhưng chúng ta có trách nhiệm phải giúp các người bảo quản nó cẩn thận."
 grand_archive.8025.c: "Tại sao các ngươi lại muốn tấm bản đồ sao này đến vậy?"
 grand_archive.8025.c.reply: "Các người ngu thật hay giả vờ đấy? [this.GetCaptainHooSnarkyInsult] Chắc ta phải nhai mớm cho các người từng chữ một mất.\n\nBản đồ sao có tác dụng như một hệ thống chỉ đường tới một điểm đến cụ thể. Chúng ta muốn đến đó để lấy lại kho báu §Y$NAME_CaptainNess$§! đã bị thất lạc từ lâu."
 grand_archive.8025.d: "$NAME_CaptainNess$ là ai?"
 grand_archive.8025.d.reply: "Trời, ta còn tưởng các người biết rõ hơn chứ. Bà ta chính là người vẽ ra tấm bản đồ sao này. Có lẽ bà ta thấy chủng tộc các người đủ ngu ngốc để có thể gửi gắm đấy, bà ta vốn là kiểu người hay sợ hãi vớ vẩn mà.\n\nNhưng dù sao chuyện đó cũng chẳng liên quan gì đến các người. Giao thông tin ra đây rồi để chúng ta đi."
 grand_archive.8025.e: "Chúng ta sẽ không giao bản đồ sao ra đâu."
 grand_archive.8025.e.reply: "Nghĩ cũng thấy vậy. Thế thì chuẩn bị xuống địa ngục đi.\n\nĐoạt lấy nó cho ta!"
 grand_archive.8025.f.lom: "Có giỏi thì tới mà lấy, đồ ngốc!"
 CAPTAIN_HOO_INSULT_MACHINE: "Ta còn tưởng trí tuệ máy móc thì ít nhiều cũng phải dính dáng đến hai chữ \"trí tuệ\" chứ, xem ra ta lầm to rồi."
 CAPTAIN_HOO_INSULT_HIVE: "Người ta hay nói tập hợp trí tuệ số đông, ta thấy cái \"số đông\" của các ngươi cũng chẳng \"trí tuệ\" ra được cái gì hồn."
 CAPTAIN_HOO_INSULT_HUM: "Đám vượn trần trụi to xác các người lúc khởi hành du lịch vũ trụ đã quên mang theo não à."
 CAPTAIN_HOO_INSULT_MAM: "Đám dã thú ngu ngốc các người so với trí tuệ và sự tao nhã của vị thủ lĩnh vĩ đại của chúng ta đúng là một trời một vực."
 CAPTAIN_HOO_INSULT_REP: "Dù sao ta cũng chẳng trông mong gì lũ thằn lằn bốn chân các người hiểu được mấy khái niệm cơ bản này."
 CAPTAIN_HOO_INSULT_AVI: "Có thể hồi tổ tiên các người mổ cây đã làm chấn động hỏng mất não rồi cũng nên."
 CAPTAIN_HOO_INSULT_ART: "Cái bộ xương ngoài của các người ngay từ đầu đã quên không bọc luôn cả khả năng tư duy phản biện vào nên ta cũng chẳng lấy làm lạ."
 CAPTAIN_HOO_INSULT_MOL: "Nghe đồn loài ốc sên không có não, gặp các người xong thì ta biết đó là sự thật rồi."
 CAPTAIN_HOO_INSULT_FUN: "Nhìn các người giống như một nhúm bào tử đến cả việc mọc nấm cũng chả làm nên hồn."
 CAPTAIN_HOO_INSULT_PLANT: "Nhìn các người xong ta càng hiểu rõ tại sao thực vật trên các hành tinh khác không thể phát triển được trí khôn."
 CAPTAIN_HOO_INSULT_LITHOID: "Các người đúng là ngu như cục đá."
 CAPTAIN_HOO_INSULT_NECROID: "Lúc sống lại chắc các người đánh rơi mất chỉ số thông minh rồi."
 CAPTAIN_HOO_INSULT_AQUATIC: "Cái não cá của các người rời khỏi nước là tắc thở luôn rồi đúng không."
 CAPTAIN_HOO_INSULT_TOX: "Não các người bị bùn chui vào rồi à?"
 CAPTAIN_HOO_INSULT_ROBOT: "Xem ra ma trận nhân cách đã ngốn hết sạch công suất tính toán của các người rồi."
 CAPTAIN_HOO_INSULT_DEFAULT: "Cái thảm họa về mặt trí tuệ của giống loài các người cũng thê thảm y như vẻ bề ngoài của các người vậy."
 grand_archive.8045.name: "$grand_archive.8025.name$"
 grand_archive.8045.desc: "Ngươi sỉ nhục ta thì không nói làm gì, đằng này ngươi còn dám sỉ nhục §Y$NAME_BlackNeedle$§!! Không thể nhẫn nhịn được, một chút cũng không thể nhẫn nhịn!\n\nThái độ bất hợp tác của các người chúng ta sẽ ghi nhớ. $NAME_BlackNeedle$ sẽ dùng mọi thủ đoạn để bắt các người phải trả giá. Trong cơn thịnh nộ, chúng ta có thể dễ dàng nghiền nát cái nền văn minh sơ khai bé nhỏ của các người.\n\nNếu không giao nộp tấm bản đồ sao, chúng ta quyết không bỏ qua! Hôm nay tạm tha cho các người một mạng!"
 grand_archive.8045.a.lom: "Lần sau bớt nói nhảm đi, nhào vô!"
 TREASURE_HUNTERS_CHART_PIECE_2_PROJECT: "Hành Tinh Vỡ Nát Làm Tám Mảnh"
 TREASURE_HUNTERS_CHART_PIECE_2_PROJECT_DESC: "§H$celestial_chart$§! đã dẫn chúng ta đến một hành tinh bị nghiền nát. Chúng ta đã phát hiện ra một đường hầm nhân tạo khoan sâu vào mảng kiến tạo lớn nhất của hành tinh này. Tin chắc rằng mảnh tiếp theo của tấm bản đồ sao đang được giấu bên trong, nhưng cần phải cẩn thận đào bới mới có thể lấy được.\n\nCó thể sử dụng tàu công trình để chế tạo các thiết bị cần thiết nhằm khai quật mảnh bản đồ sao này."
 grand_archive.8055.name: "Khai Quật Thành Công"
 grand_archive.8055.desc: "Chúng ta đã lấy ra được một khoang cứu sinh cùng một số khoáng thạch từ những mảnh vỡ trôi nổi của hành tinh. Mở ra, chúng ta tìm thấy một mảnh vỡ khác của §Y$celestial_chart$§!, cùng với một số cổ vật độc đáo. Ngoài ra, chúng ta còn phát hiện một mẩu giấy ghi chú, được viết bằng nhiều loại ngôn ngữ để dễ dàng dịch thuật.\n\n“Đây là tàn tích cuối cùng của $NAME_Soropegma$, hành tinh mẹ của người Yter. Người Yter từng là một chủng tộc phi thực thể, đã bị diệt vong sau một tai nạn thảm khốc. Chúng ta đã không lường trước được hậu quả sắp ập đến, và vô tình kích hoạt sức mạnh hủy diệt của siêu vũ khí bị đánh cắp. Xin hãy bảo vệ và tôn trọng ký ức về họ.”"
 TREASURE_HUNTERS_ANCIENT_CAPSULE_2_PROJECT: "Giải Mã Mảnh Vỡ Bản Đồ Sao"
 TREASURE_HUNTERS_ANCIENT_CAPSULE_2_PROJECT_DESC: "Sau khi khai quật được khoang cứu sinh từ đống đổ nát của hành tinh vỡ, chúng ta cần giải mã dữ liệu điều hướng bên trong. Quá trình này đòi hỏi phải đối chiếu chéo với cơ sở dữ liệu hải đồ của chúng ta, đồng thời so sánh các thiên thể được đánh dấu với các hệ sao đã biết."
 grand_archive.8060.name: "Đã Giải Mã Tinh Đồ"
 grand_archive.8060.desc: "Sau khi xuyên phá vô số lớp mã hóa, bộ dữ liệu mới này đã được tích hợp hoàn hảo vào §Y$celestial_chart$§!. Khi những mảnh vỡ được ráp lại với nhau, một hệ sao hoàn toàn mới hiện ra trước mắt. Bước tiếp theo trong hành trình của chúng ta đã ở ngay trước mắt, ta nên cẩn thận tiến vào khám phá khu vực không gian chưa từng được lập bản đồ này."
 grand_archive.8075.name: "Đại Lưu Trữ"
 grand_archive.8075.desc: "Sau khi thu được §Y[This.GetLastAcquiredSpecimenName]§!, các nhà khoa học của chúng ta cho rằng nó xứng đáng có được một vị trí trong khu vực trưng bày công cộng của §Y$grand_archive$§!. Công trình kiến trúc này sẽ là nơi lưu giữ bộ sưu tập hiện vật quý hiếm ngày càng đồ sộ của chúng ta, và chính những hiện vật này sẽ mang lại nguồn lợi vô giá về mặt văn hóa và khoa học. Chúng ta sẽ khởi động một khoản đầu tư thiên thần để nghiên cứu và phát triển công nghệ bảo quản và trưng bày các mẫu vật mỏng manh và đa dạng của thiên hà.\n\nNgoài ra, chúng ta còn tìm thấy một bản thiết kế nằm cạnh cổ vật Yter, trong đó có một bản phác thảo tủ trưng bày tiên tiến, được trang bị công nghệ giám sát môi trường đột phá. Việc phát triển thêm ý tưởng này sẽ nâng cao năng lực bảo quản tổng thể của bộ lưu trữ."
 grand_archive.8076.name: "Mẫu Vật Yter"
 grand_archive.8076.desc: "Những di vật cuối cùng của nền văn minh Yter đã mất xứng đáng được đem ra trưng bày riêng biệt.\n\nMay mắn thay, trong một bản thiết kế được tìm thấy nằm ngay cạnh cổ vật Yter có bao gồm bản phác thảo của một tủ trưng bày tiên tiến, được trang备công nghệ giám sát môi trường đột phá. Việc phát triển thêm ý tưởng này sẽ nâng cao năng lực bảo quản tổng thể của bộ lưu trữ."
 grand_archive.8076.a: "Cơ hội tốt."
 TREASURE_HUNTERS_EXHIBITION_PROJECT: "Bản Thiết Kế Tăng Cường Triển Lãm"
 TREASURE_HUNTERS_EXHIBITION_PROJECT_DESC: "Bên cạnh các mẫu vật Yter, chúng ta còn tìm thấy một bản thiết kế tinh vi về một tủ trưng bày tiên tiến dùng để bảo quản các mẫu vật.\n\nViệc nghiên cứu các công nghệ được sử dụng trong bản thiết kế này có thể sẽ mang lại lợi ích cho công tác bảo tồn và triển lãm trong tương lai."
 TREASURE_HUNTERS_EXHIBITION_PROJECT_TOOLTIP: "Sử dụng §Ytàu công trình§! để xây dựng một §YĐại Lưu Trữ§! quanh quỹ đạo của một hành tinh có §H£pop£Dân Số§! đạt 2.5K trở lên.\nYêu cầu: §H£society_research£$tech_galactic_archivism$§!."
 grand_archive.8080.name: "Tăng Cường Triển Lãm"
 grand_archive.8080.desc: "Sau khi phân tích kỹ lưỡng bản thiết kế của người Yter, chúng ta đã chế tạo ra một khoang lưu trữ tiên tiến với độ chính xác theo dõi môi trường đạt đến cấp độ nguyên tử. Nhờ đó, người quản lý có thể giám sát chi tiết tình trạng môi trường của các mẫu vật Yter quý giá, và phát hiện kịp thời mọi dấu hiệu hư hỏng tiềm ẩn. Nó sẽ luôn giữ được tình trạng nguyên vẹn như ban đầu.\n\nChúng ta có thể áp dụng các công nghệ này để cải thiện hơn nữa điều kiện lưu trữ cho tất cả các hiện vật trong bộ sưu tập của chúng ta."
 TREASURE_HUNTERS_BUILD_GRAND_ARCHIVE: "Xây Dựng Đại Lưu Trữ"
 TREASURE_HUNTERS_BUILD_GRAND_ARCHIVE_DESC: "Trong hành trình khám phá vũ trụ, chúng ta đã thu thập được vô số những hiện vật và kỳ quan văn hóa độc đáo. Những mẫu vật này sẽ là nguồn cảm hứng cho người dân, đưa buổi triển lãm của chúng ta trở thành nơi đầu tiên trưng bày và bảo tồn toàn bộ tri thức của thiên hà.\n\nViệc xây dựng một §H$grand_archive$§! chính là để phục vụ cho mục đích này."
 grand_archive.8090.name: "Xây Dựng Đại Lưu Trữ"
 grand_archive.8090.desc: "Lễ khánh thành §Y$grand_archive$§! tại [fromfrom.GetName] là một ngày đáng để toàn thể [this.GetName] ăn mừng. Buổi triển lãm những bảo vật đến từ khắp thiên hà này không chỉ truyền cảm hứng cho tinh thần khám phá của mọi người, mà còn thôi thúc chúng ta rút ra những bài học từ quá khứ."
 d_black_needle_base: "Căn Cứ Hắc Châm Ẩn Giấu"
 d_black_needle_base_desc: "Một căn cứ bí mật được Hải tặc Hắc Châm sử dụng để thực hiện nhiều hoạt động phi pháp và cất giấu chiến lợi phẩm."
 d_abandoned_black_needle_base: "Căn Cứ Hắc Châm Bị Bỏ Hoang"
 d_abandoned_black_needle_base_desc: "Căn cứ này từng được Hải tặc Hắc Châm sử dụng như một tiền đồn và nơi ẩn náu của những tội phạm bị truy nã cũng như đồ ăn cắp."
 d_abandoned_black_needle_base_naval_cap: "Sức chứa hải quân do lính gác đóng góp: §G+$@abandoned_black_needle_base_naval_cap_from_soldier_job|0$§!"
 d_abandoned_black_needle_base_naval_cap_short: "£mod_country_naval_cap_add£ do vị trí £job_soldier£ cung cấp: §G+$@abandoned_black_needle_base_naval_cap_from_soldier_job|0$§!"
 black_needle_base_system_poi: "Đi Theo Bản Đồ Sao"
 black_needle_base_system_poi_desc: "§H$celestial_chart$§! đã tiết lộ một hệ sao ẩn giấu, [Prev.GetName]. Chúng ta phải tiến về phía đó và khám phá những gì đang chờ đợi."
 grand_archive.8100.name: "Phát Hiện Sào Huyệt Hải Tặc"
 grand_archive.8100.desc: "Chúng ta đã phát hiện một căn cứ ngầm bí mật có dấu ấn §YHắc Châm§! tại [From.GetName]. Chúng ta tin rằng đây là một căn cứ tiền đồn của tập đoàn hải tặc, hoạt động độc lập với các hoạt động khác của chúng. Mảnh tiếp theo của §Y$celestial_chart$§! chắc chắn được cất giữ ở đây, rất có thể cùng với nhiều của cải và đồ trang sức khác.\n\nChúng ta có thể dễ dàng dội bom căn cứ này từ quỹ đạo, nhưng làm vậy có thể cho bọn Hắc Châm đủ thời gian để gọi viện binh. Mặt khác, việc triển khai quân đội mặt đất chớp nhoáng sẽ giúp đánh chiếm căn cứ nhanh hơn, khiến chúng không kịp trở tay.\n\nMột cách tiếp cận bí mật hơn là xâm nhập vào hệ thống máy tính của căn cứ, táo bạo cướp đi thẳng thừng mảnh ghép của $celestial_chart$ đó."
 grand_archive.8100.a: "Có rất nhiều điều cần phải cân nhắc."
 COLONIZATION_IMPOSSIBLE_DEFENDED_PLANET: "$TRIGGER_FAIL$§RHành tinh này được phòng thủ nghiêm ngặt và không thể thuộc địa hóa.§!"
 BLACK_NEEDLE_BASE_BOMBARD: "Dội Bom Căn Cứ Hắc Châm"
 BLACK_NEEDLE_BASE_BOMBARD_DESC: "Căn cứ ngầm tại [This.GetName] có khả năng chống chịu oanh tạc từ quỹ đạo rất mạnh, nhưng chỉ cần đủ thời gian và hỏa lực, hạm đội của chúng ta hoàn toàn có thể san phẳng nó. Sau khi căn cứ bị phá hủy, chúng ta có thể lục soát đống đổ nát để thu hồi mảnh §H$celestial_chart$§! và các vật phẩm giá trị khác.\n\nTuy nhiên, các cố vấn chiến thuật cảnh báo rằng hành động này có thể cho bọn Hắc Châm đủ thời gian để gọi quân tiếp viện."
 BLACK_NEEDLE_BASE_BOMBARD_REINFORCEMENTS_KILLED: "$BLACK_NEEDLE_BASE_BOMBARD$"
 BLACK_NEEDLE_BASE_BOMBARD_REINFORCEMENTS_KILLED_DESC: "$BLACK_NEEDLE_BASE_BOMBARD_DESC$"
 grand_archive.8103.name: "Sự Phản Công Của Hắc Châm"
 grand_archive.8103.desc: "Không nằm ngoài dự đoán, Hắc Châm đã cử một hạm đội đến để bảo vệ căn cứ của chúng tại [FromFrom.GetName].\n\nChúng ta cần phải tiêu diệt những con tàu này mới có thể hạ gục [FromFrom.System.GetName]."
 grand_archive.8105.name: "Tàn Tích Đổ Nát"
 grand_archive.8105.desc: "Dưới trận mưa bom bão đạn dữ dội từ quỹ đạo, căn cứ hải tặc cuối cùng đã bị san phẳng thành bình địa cùng với tất cả những kẻ trú ngụ trong đó. Mọi mối đe dọa đã bị loại trừ, giờ đây chúng ta có thể phái một sĩ quan khoa học đi khám phá khu tàn tích của căn cứ và khai quật mảnh ghép tiếp theo của §Y$celestial_chart$§!."
 grand_archive.8105.a.custom_tooltip: "Căn cứ Hắc Châm đã bị tiêu diệt. §Y[FromFrom.GetName]§! hiện có thể tự do khám phá."
 grand_archive.8105.a.lom: "Hôi của thôi!"
 project_type_research: "$RESEARCH$"
 project_type_bombardment: "Dội bom"
 BLACK_NEEDLE_BASE_DEPLOY_ARMIES: "Đột Kích Căn Cứ Hắc Châm"
 BLACK_NEEDLE_BASE_DEPLOY_ARMIES_DESC: "Căn cứ ngầm tại [FromFrom.GetName] được bảo vệ bởi một lượng lớn quân đội và máy bay không người lái an ninh. Việc triển khai quân đội trên bề mặt hành tinh sẽ cho phép chúng ta nhanh chóng chiếm lĩnh căn cứ, khiến lực lượng §YHắc Châm§! gần như không có cơ hội phản kháng.\n\nKhi đã kiểm soát được căn cứ, chúng ta có thể khai quật khoang chứa bản đồ sao và bất kỳ món của cải bất chính nào khác mà bọn hải tặc đã tích cóp."
 grand_archive.8110.name: "Quân Thủ Thành Đầu Hàng"
 grand_archive.8110.desc: "Lực lượng mặt đất của ta đã đánh chiếm thành công căn cứ §YHắc Châm§!, hiện đang dọn dẹp các công trình kiến trúc và tài nguyên xung quanh. Mọi mối đe dọa đã bị loại trừ, chúng ta có thể phái một nhà khoa học đi khai quật mảnh ghép tiếp theo của §Y$celestial_chart$§!."
 grand_archive.8110.a.custom_tooltip: "Thế lực mặt đất của Hắc Châm đã bị càn quét. §Y[FromFromFrom.GetName]§! hiện có thể tự do khám phá."
 grand_archive.8110.a.lom: "Đến lúc chia chác chiến lợi phẩm rồi."
 BLACK_NEEDLE_BASE_HACK: "Xâm Nhập Căn Cứ Hải Tặc"
 BLACK_NEEDLE_BASE_HACK_DESC: "Việc bọn hải tặc quá phụ thuộc vào công nghệ ăn cắp và chắp vá đã khiến căn cứ của chúng dễ bị xâm nhập. Có thể lệnh cho một con tàu khoa học xâm nhập vào mạng lưới của [FromFrom.GetName] từ quỹ đạo, ngụy trang thành một tàu vận tải của §YHắc Châm§!, và viện cớ lệnh của Thuyền trưởng Hoo để thuyết phục chúng giao nộp khoang chứa bản đồ sao, tránh tình trạng đổ máu không cần thiết."
 grand_archive.8115.name: "Đột Nhập Thành Công"
 grand_archive.8115.desc.1: "Sau nhiều tháng chuẩn bị, nhà khoa học [Leader.GetName] đã thâm nhập thành công vào mạng lưới liên lạc và ngụy trang thành một phi thuyền của §YHắc Châm§!. Bằng mệnh lệnh giả mạo của Thuyền trưởng Hoo, [Leader.GetHeShe] đã lừa đội ngũ vận hành căn cứ chuẩn bị thực hiện quy trình chuyển đổi khẩn cấp giữa các vì sao cho khoang chứa bản đồ sao."
 grand_archive.8115.desc.slippery: "Nhà khoa học [Leader.GetName] đã cho hạ cánh phi thuyền ở một vị trí hoàn hảo, để có thể nhanh chóng rút lui trong trường hợp thân phận bị bại lộ."
 grand_archive.8115.desc.charismatic: "Với sức hút của mình, nhà khoa học [Leader.GetName] đã có thể khéo léo lảng tránh những câu hỏi hóc búa."
 grand_archive.8115.desc.psionic_organic: "Chỉ với một cái phẩy tay nhẹ, nhà khoa học [Leader.GetName] đã thao túng tâm trí của lính gác, xua tan mọi nghi ngờ."
 grand_archive.8115.desc.psionic_machine: "Thông qua áp lực tinh thần, [Leader.GetName] đã dễ dàng thao túng tâm trí của lính gác, xua tan mọi nghi ngờ."
 grand_archive.8115.desc.2: "Chúng ta đã lấy được khoang chứa thành công, không một ai thương vong. Bọn hải tặc vẫn chưa nhận ra rằng chúng đã bị lừa."
 grand_archive.8115.a: "$EXCELLENT$"
 grand_archive.8120.name: "Bắt Quả Tang"
 grand_archive.8120.desc: "Thật không may, trong lúc chúng ta đang bốc xếp khoang chứa lên phi thuyền, một tên lính gác đã phát hiện ra kế hoạch của chúng ta. Sự cố này đã dẫn đến một cuộc đấu súng chớp nhoáng, chúng ta buộc phải ôm theo món hàng quý giá tháo chạy khỏi hiện trường. Khoang chứa đã được lấy ra thành công, nhưng nhà khoa học [Leader.GetName] đã thiệt mạng trong vụ đọ súng."
 grand_archive.8120.a: "$TERRIBLE$"
 grand_archive.8125.name: "Căn Cứ Hải Tặc Bị Bỏ Hoang"
 grand_archive.8125.common: "Do những lỗ hổng này bị phơi bày, bọn hải tặc đã quyết định từ bỏ căn cứ của chúng trên [FromFromFromFrom.GetName], lập tức sơ tán và bảo vệ những tài sản giá trị khác được cất giữ ở đó. Vệ tinh có thể sinh sống này hiện không có người ở và có thể được thuộc địa hóa."
 grand_archive.8125.desc.alive: "Cuối cùng bọn §YHắc Châm§! cũng nhận ra chúng đã bị lừa, và phát hiện ra những lỗ hổng trong mạng lưới an ninh khép kín của mình.\n\n$grand_archive.8125.common$"
 grand_archive.8125.desc.dead: "Sau khi chúng ta thoát hiểm trong gang tấc khỏi thành trì của §YHắc Châm§!, hành động xâm nhập của ta đã hoàn toàn bị phơi bày.\n\n$grand_archive.8125.common$"
 grand_archive.8125.a: "Một quyết định hợp lý."
 grand_archive.8125.a.custom_tooltip: "Quân đội trên §Y[FromFromFromFrom.GetName]§! đã rời khỏi hành tinh. Hiện tại có thể tiến hành thuộc địa hóa."
 grand_archive.8130.name: "Cướp Bóc Căn Cứ Hắc Châm"
 grand_archive.8130.desc.common: "Trong nhà an toàn có lưu trữ đủ loại tài sản giá trị, cũng như các kỷ vật liên quan đến lịch sử của tổ chức hải tặc này. Chúng ta đã tìm thấy khoang chứa bản đồ sao nằm lẫn trong những tác phẩm nghệ thuật bị đánh cắp, trang sức cá nhân và ví kỹ thuật số mã hóa.\n\nChúng ta nghi ngờ rằng hầu hết số của cải ăn trộm ở đây về cơ bản là rất khó để tẩu tán. Những tác phẩm nghệ thuật thì vừa nhìn đã biết ngay, đồ trang sức thì cần phải nung chảy thành mảnh vụn, và các giao dịch bằng ví kỹ thuật số thường có thể bị truy dấu. Trong số những chủ nhân ban đầu của những món đồ này, một số có thể đã qua đời, nhưng số khác vẫn đang ráo riết tìm kiếm lại tài sản bị đánh cắp của họ."
 grand_archive.8130.desc.bombarded: "Chúng ta đã tìm thấy một kho tiền dưới lòng đất trong đống đổ nát của căn cứ §YHắc Châm§!, mở ra thì phát hiện một kho báu cỡ nhỏ cất giấu của cải phi pháp của chúng.\n\n$grand_archive.8130.desc.common$"
 grand_archive.8130.desc.landed: "Chúng ta đã khám phá căn cứ §YHắc Châm§! đổ nát và tìm thấy bản thiết kế của cơ sở này, qua đó phát hiện sự tồn tại của một kho tiền ngầm. Chúng ta đã dùng thang máy bảo trì để đi sâu xuống lòng đất, sau khi nhập mã truy cập, chúng ta đã phát hiện ra một kho báu cỡ nhỏ cất giữ của cải phi pháp của chúng.\n\n$grand_archive.8130.desc.common$"
 grand_archive.8130.a: "Cố gắng trả lại những món đồ bị đánh cắp."
 grand_archive.8130.b: "Bán hết tất cả."
 grand_archive.8130.c.default: "Giữ lại chiến lợi phẩm."
 grand_archive.8130.c.lom: "Ai tìm thấy thì người đó được."
 black_needle_base_sold_stolen_items: "Bán của cải ăn trộm trong căn cứ Hắc Châm"
 opinion_black_needle_base_repatriate_stolen_items: "Đã hoàn trả tài sản bị đánh cắp"
 opinion_black_needle_base_repatriate_stolen_items_tt: "Mọi đế chế không phải thể chế diệt chủng và không có chiến tranh với chúng ta sẽ tăng §G+$@opinion_black_needle_base_repatriate_stolen_items_value|0$§!£opinion£ đánh giá"
 DECODE_THIRD_MAP_PIECE: "Giải Mã Mảnh Vỡ Tinh Đồ"
 DECODE_THIRD_MAP_PIECE_DESC: "Chúng ta đã lấy được khoang chứa bản đồ sao từ căn cứ §YHắc Châm§!, nhiệm vụ tiếp theo là giải mã dữ liệu bên trong và tích hợp thông tin mới vào §H$celestial_chart$§!."
 grand_archive.8135.name: "Đã Giải Mã Tinh Đồ"
 grand_archive.8135.desc: "Chúng ta đã chọc thủng thành công lớp mã hóa kỹ thuật số và tích hợp thông tin mới vào §Y$celestial_chart$§!. Lần này, nó lại dẫn chúng ta đến một điểm đến khác đáng để khám phá, và giờ đây bản đồ sao gần như đã hoàn chỉnh. Chúng ta tin rằng chỉ còn lại mảnh ghép cuối cùng, và lạc quan một cách thận trọng rằng cuộc hành trình của chúng ta sắp đi đến hồi kết.\n\nTrong lúc giải mã dữ liệu định vị, chúng ta cũng nhận thấy rằng lớp vỏ ngoài nguyên vẹn của khoang chứa rất đáng để nghiên cứu. Độ bền và khả năng chịu lực của vật liệu chứa này thật sự đáng kinh ngạc; khả năng sao chép được loại vật liệu này sẽ mở ra rất nhiều cơ hội tiềm năng cho các nghiên cứu trong tương lai."
 grand_archive.8135.a: "$GOOD$"
 d_hive_dwelling: "Khu Định Cư Ý Thức Tổ Ong"
 d_hive_dwelling_desc: "Một khu định cư hẻo lánh bị chiếm đóng bởi ý thức tập thể Smeegibb, cựu thuyền viên của Thuyền trưởng Ness."
 d_ruined_hive_dwelling: "Phế Tích Khu Định Cư Ý Thức Tổ Ong"
 d_ruined_hive_dwelling_desc: "Một khu định cư hẻo lánh từng bị chiếm đóng bởi ý thức tập thể Smeegibb, cựu thuyền viên của Thuyền trưởng Ness, hiện đã bị cướp phá."
 COLONIZATION_IMPOSSIBLE_SMEEGIBB_PLANET: "§RHành tinh này thuộc về $NAME_Smeegibb$.§!"
 grand_archive.8200.name: "Khu Định Cư Bí Mật"
 grand_archive.8200.desc.common_1: "Chúng ta đã phát hiện ra một khu định cư nhỏ bé tại [FROM.GetName], với dân số chưa tới một nghìn người, cư dân là một loài nhuyễn thể có tri giác. Phân tích sinh học sơ bộ về loài này cho thấy chúng có khả năng giao tiếp qua các điểm nối khớp thần kinh á không gian, báo hiệu sự tồn tại của một ý thức tổ ong. Ngoài khu trại hẻo lánh này, hành tinh không còn bất kỳ dấu hiệu của sự sống thông minh nào khác."
 grand_archive.8200.desc.common_2: "Tại sao §Y$celestial_chart$§! lại dẫn chúng ta đến đây vẫn còn là một ẩn số, cần phải điều tra thêm."
 grand_archive.8200.desc: "$grand_archive.8200.desc.common_1$\n\n$grand_archive.8200.desc.common_2$"
 grand_archive.8200.desc.alt: "$grand_archive.8200.desc.common_1$\n\nCó lẽ sinh vật này sẽ cung cấp thêm manh mối về \"§Y$NAME_CaptainNess$§!\" mà chúng ta từng nghe qua.\n\n$grand_archive.8200.desc.common_2$"
 grand_archive.8205.desc.common_1: "§HĐây là một nút ý thức tổ ong ẩn náu tại hệ sao [FROM.GetName], $NAME_Smeegibb$ ngọ nguậy một cách bất an. Vì đã quen với sự phục tùng, chúng thường cúi gằm mặt xuống mỗi khi bị bắt chuyện.§!"
 grand_archive.8205.desc.common_2: "Chúng tôi là $NAME_Smeegibb$. Thật tò mò làm sao các vị lại tìm ra chúng tôi. Hệ sao này đã ẩn mình khỏi tầm mắt thiên hà hàng ngàn năm nay.\n\nChỉ có §YThuyền trưởng§! mới biết đến nơi này. Các vị đang tìm kiếm thứ gì?"
 grand_archive.8205.desc.default: "$grand_archive.8205.desc.common_1$\n\nSmarak! Đã lâu lắm rồi chúng tôi mới được trò chuyện với một giống loài chung một ý chí.\n\n$grand_archive.8205.desc.common_2$"
 grand_archive.8205.desc.gestalt: "$grand_archive.8205.desc.common_1$\n\nSmarak! Đã lâu lắm rồi chúng tôi mới được trò chuyện với một giống loài ý thức tập thể khác.\n\n$grand_archive.8205.desc.common_2$"
 grand_archive.8205.a: "Nơi này là đâu?"
 grand_archive.8205.a.reply: "Smarak! Hành tinh này là nhà của chúng tôi, chúng tôi sống trong sự an toàn, lánh xa bạo lực của thiên hà. Trước kia, chúng tôi cũng từng nhúng chàm. Giết chóc, tội ác, cướp biển - chẳng việc gì chúng tôi chưa làm qua. Nhưng giờ thì không còn thế nữa, chúng tôi chỉ chăm lo cho những trang trại thủy canh của mình.\n\nTrước khi làm cướp biển, chúng tôi là những người tị nạn, chẳng ai thèm cưu mang, ngoại trừ §YThuyền trưởng§!. Bà ấy đã cứu vớt chúng tôi khỏi số phận bi thảm, và cho phép chúng tôi gia nhập hạm đội của mình. Thuyền trưởng đã ban cho chúng tôi một cái tên mới, đổi lại, chúng tôi chịu trách nhiệm chăm sóc cho phi thuyền.\n\nChúng tôi lo từ việc dọn dẹp, nấu nướng, đạn dược, trồng trọt cho đến quản lý hàng hóa. Chúng tôi làm việc cật lực. Sau đó, chúng tôi gia nhập đội đột kích đổ bộ. Bảo vệ Thuyền trưởng mỗi khi bà ấy đánh cắp kho báu hay cướp bóc. Tuyệt đối không được phản bội Thuyền trưởng. Chúng tôi mãi mãi trung thành."
 grand_archive.8205.b: "Ngươi biết gì về §Y$celestial_chart$§!?"
 grand_archive.8205.b.reply: "Smarak! Chúng tôi chẳng biết gì về bản đồ điều hướng cả, chúng tôi chỉ quanh quẩn trong phòng của mình thôi. Nếu §YThuyền trưởng§! đã vẽ ra một tấm bản đồ dẫn các vị đến đây, chắc hẳn bà ấy phải có lý do riêng... có thể bà ấy muốn giúp đỡ, hoặc hãm hại chúng tôi. Chúng tôi chẳng bao giờ lường trước được. Thuyền trưởng mưu mô xảo quyệt lắm.\n\nThỉnh thoảng bà ấy có gửi tin nhắn cho chúng tôi. Thuyền trưởng đã tặng chúng tôi một bức tượng khổng lồ tạc hình một phân nhánh mà bà ấy yêu thích nhất, đó là $NAME_Smeegibb$ từng được bà ấy cứu mạng và luôn được bà ấy khắc ghi. Bức tượng trông rất bề thế, nhưng chúng tôi không hiểu vì sao bà ấy lại tặng nó. Có lẽ bà ấy muốn nói lời xin lỗi, nhưng lại chẳng để lại dòng nhắn nhủ nào."
 grand_archive.8205.c: "Kể cho chúng ta nghe thêm về §YThuyền trưởng§! đi."
 grand_archive.8205.c.reply: "Smarak! Trước đây, §YThuyền trưởng§! đã cứu mạng chúng tôi. Trước đây, bà ấy là người thầy và người dẫn đường của chúng tôi. Bà ấy đã dạy chúng tôi cách chăm sóc cho con tàu. Bà ấy nói: \"$NAME_Smeegibb$, làm sĩ quan hậu cần, thợ máy và cu li - các ngươi rất có giá trị.\"\n\nThuyền trưởng luôn tuân thủ hai phương châm: \"Của cải là tự do\" và \"Sự sống nằm ở di sản\". Chúng tôi cùng nhau săn lùng những kẻ bần cùng lẫn những kẻ lắm tiền nhiều của. Chúng tôi cướp đoạt những gì mình muốn từ cái thiên hà bạo lực này.\n\nNhưng rồi Thuyền trưởng ngày càng trở nên tham lam và liều lĩnh. Bà ấy sẵn sàng hy sinh thuyền viên, hoặc phản bội họ để đổi lấy tiền thưởng. Thuyền trưởng đã mất tất cả, ngoại trừ $NAME_Smeegibb$. Chúng tôi mãi mãi trung thành.\n\nBà ấy đã cho chúng tôi thấy rõ bạo lực của thiên hà. Giờ đây, chúng tôi chỉ muốn lánh xa nó."
 grand_archive.8205.d: "Vì sao tinh đồ lại dẫn chúng ta đến đây?"
 grand_archive.8205.d.reply: "Smarak! Chúng tôi không rõ vì sao §YThuyền trưởng§! lại dẫn các vị đến đây. Bà ấy chẳng hé răng nửa lời với chúng tôi.\n\nNhưng chúng tôi có một suy đoán. Có một nơi mà §YThuyền trưởng§! và chúng tôi từng cùng nhau lẩn trốn sự truy sát của bọn thợ săn tiền thưởng. Một nơi an toàn. Biết đâu các vị sẽ tìm thấy thứ gì đó ở đấy."
 grand_archive.8210.name: "Tìm Ra Nhà An Toàn"
 grand_archive.8210.desc: "Sinh vật mà chúng ta gặp ở [from.GetName], $NAME_Smeegibb$, đã tiết lộ tọa độ của một nhà an toàn bị bỏ hoang, nơi mà chúng và §Y$NAME_CaptainNess$§! từng trú ẩn. Việc điều tra địa điểm này có thể dẫn chúng ta đến phần tiếp theo của §Y$celestial_chart$§!, hoặc ít nhất là một manh mối để đi đúng hướng."
 grand_archive.8210.a: "Bắt đầu khai quật."
 smeegibb_digsite_poi: "Khám phá Nhà an toàn"
 smeegibb_digsite_poi_desc: "Di chỉ khảo cổ này có thể là chìa khóa dẫn đến mảnh §H$celestial_chart$§! tiếp theo. Để tiếp tục tìm kiếm $TREASURE_TROVE$ bị thất lạc của §H$NAME_CaptainNess$§!, chúng ta bắt buộc phải tiến hành điều tra nhà an toàn bị bỏ hoang này."
 NAME_Bemat_cruiser_inax_01: "Hebe"
 #Treasure Hunters Origin - Smeegibb
 smeegibb_digsite: "Tàn tích Nhà An Toàn"
 smeegibb_digsite_desc: "Trên vùng đất hoang vu băng giá của [fromfrom.planet.GetName], chúng ta đã phát hiện một nơi trú ẩn đúc sẵn cỡ nhỏ, bên trong có trang bị hệ thống duy trì sự sống đang trong trạng thái ngủ đông và khu vực sinh hoạt. Trải qua hàng ngàn năm hứng chịu những trận bão tuyết, chúng đã bị phong hóa nghiêm trọng và bị vùi lấp một phần."
 grand_archive.8220.name: "Nhật Ký Thuyền Trưởng"
 grand_archive.8220.desc: "Cấu trúc được khai quật cho thấy dấu hiệu của việc được sử dụng trong một thời gian dài. Nó từng sở hữu đầy đủ các tiện nghi cơ bản. Khắp nơi trong tòa nhà rải rác những món đồ trang sức và những thứ kỳ lạ. Lẫn trong đống giấy tờ lộn xộn, chúng ta tìm thấy những mục nhật ký do chính tay §Y$NAME_CaptainNess$§! viết.\n\n§LChúng ta đã tiếp cận và cướp thành công một con tàu chở kho báu khác của đám Pelican, nhưng lần này chúng đã có sự chuẩn bị. Thiệt hại phụ cao hơn tôi nghĩ, nhưng chúng ta từng giải quyết những tình huống còn tồi tệ hơn thế này nhiều. Thu hoạch khá khẩm đấy, nhưng viên ngọc Tapioca vẫn bặt vô âm tín. Đen đủi thay, giờ đám Pelican lại tăng mức tiền thưởng lên, và cả Liên bang cũng đã nhúng tay vào. Tình hình hiện tại hơi căng thẳng rồi đây. Có lẽ cần phải lánh đi một thời gian.§!"
 grand_archive.8220.a: "Tiếp tục tìm kiếm."
 grand_archive.8225.name: "Giết Thời Gian"
 grand_archive.8225.desc: "Quá trình khai quật phần dưới của cấu trúc đã phát hiện ra một lượng nhỏ tài sản có giá trị và các hệ thống vệ sinh cơ bản. Thật không may, sau khi rà soát kỹ lưỡng toàn bộ khu vực, chúng ta vẫn không thể tìm thấy bất kỳ dấu vết nào của mảnh §Y$celestial_chart$§!.\n\nChúng ta đã thu thập thêm được nhiều sổ ghi chép và tài liệu, nuôi hy vọng có thể tìm ra manh mối từ những dòng nhật ký rời rạc của §Y$NAME_CaptainNess$§!.\n\n§LThời gian trôi qua bớt lê thê hơn khi có những người bạn đồng hành như $NAME_Smeegibb$, nhưng liệu có đáng để chia sẻ vinh quang không? Tất nhiên, hợp tác với một ý thức tổ ong mang lại giá trị to lớn không thể tưởng tượng nổi. Đổi lấy quyền sử dụng hàng trăm cá thể phụ chỉ bằng một phần lợi nhuận? Quả là một món hời! Nhưng biết đâu những gì chúng làm lại làm lu mờ đi những thành tựu của chính tôi...? Tôi không chắc mình có thể chấp nhận được ý nghĩ phải san sẻ di sản của mình. Tôi cần phải suy nghĩ kỹ hơn về vấn đề này.§!"
 grand_archive.8225.a: "$grand_archive.8220.a$"
 grand_archive.8230.name: "Vật Chứng"
 grand_archive.8230.desc: "Trong một đường ống thông gió, chúng ta đã tìm thấy cuốn nhật ký cuối cùng của §Y$NAME_CaptainNess$§!.\n\n§LTôi không muốn được người đời nhớ đến theo cách này. $NAME_Smeegibb$ luôn là một người bạn đồng hành trung thành, nhưng đừng nói rằng tôi cần chúng. Tôi có thể một thân một mình chinh phục thiên hà. Tôi sẽ để lại dấu ấn của riêng mình, và vinh quang sẽ thuộc về tôi. Cùng với của cải nữa.\n\nTự nhắc nhở bản thân: Tốt nhất là nên gửi cho $NAME_Smeegibb$ một món đồ gì đó để làm kỷ niệm.§!\n\nĐó là tất cả những gì chúng ta có thể tìm thấy. Không còn bất kỳ manh mối nào khác về Thuyền trưởng hay §Y$celestial_chart$§!.\n\nCó lẽ trong món quà dành cho $NAME_Smeegibb$ có chứa manh mối về tung tích của mảnh ghép cuối cùng. Chúng ta phải kết nối lại với chúng."
 grand_archive.8230.a: "Dọn dẹp xong di chỉ."
 grand_archive.8236.name: "$NAME_Smeegibb$ Mất Tích"
 grand_archive.8236.desc.default: "$smeegibb_shelter_system_2_poi_desc$"
 grand_archive.8236.desc.xenophile: "$smeegibb_shelter_system_2_poi_desc$\n\nTôi mong rằng những người bạn mới quen của chúng ta vẫn bình an vô sự."
 grand_archive.8236.a: "Đi tới [smeegibb_system.GetName]"
 grand_archive.8241.name: "$NAME_BlackNeedle$ Ngóc Đầu Dậy"
 grand_archive.8241.desc: "Một hạm đội khổng lồ mang cờ hiệu của tổ chức cướp biển §Y$NAME_BlackNeedle$§! đang hoạt động trên quỹ đạo của [smeegibb_shelter.GetName]. Chúng ta tin rằng lũ cướp biển này đã luôn bám theo hành tung của chúng ta, và chúng đã san phẳng nơi ở của tập thể mang tên $NAME_Smeegibb$. Chắc chắn chúng vẫn đang tìm kiếm mảnh tiếp theo của §Y$celestial_chart$§!.\n\nKhông phát hiện bất kỳ dấu hiệu của sự sống thông minh nào trên hành tinh này.\n\nChúng ta đang nhận được tín hiệu từ kỳ hạm của chúng."
 grand_archive.8245.name: "$NAME_CaptainInax$ của $NAME_BlackNeedle$"
 grand_archive.8245.desc.inax.1: "§HCon động vật chân đốt này ưỡn ngực tự hào, đôi mắt kép lóe lên thứ ánh sáng chói lọi. Dáng vẻ nghiêm nghị của nó trái ngược hoàn toàn với bộ phận miệng đang cử động bất an, phát ra những tiếng lách cách không đều đặn và run lên vì phấn khích.§!\n\nThế là, cuối cùng chúng ta cũng chạm mặt nhau. Đám sinh vật giáp mềm các ngươi làm thế nào mà đánh bại được §YThuyền... Thuyền... Thuyền trưởng Hoo§! vậy!? Dù có là một lão già lẩm cẩm thì lão ta cũng dư sức bóp nát cái hạm đội thảm hại của các ngươi cơ mà. Các ngươi sẽ phải trả giá cho"
 grand_archive.8245.desc.inax.2: "Cảm... Cảm... Cảm ơn các ngươi đã dẫn đường tới đây, §Y$NAME_SilverQuill$§! đã lùng sục lũ $NAME_Smeegibb$ khốn khổ kia hơn cả trăm chu kỳ rồi. Giải quyết xong mối tư thù truyền kiếp của hắn đồng nghĩa với việc ta sẽ ôm trọn khoản tiền thưởng béo bở... sau khi xử lý xong các ngươi."
 grand_archive.8245.desc.ransacked: "$grand_archive.8245.desc.inax.1$ vì đã làm... làm... làm hỏng căn cứ của chúng ta tại [black_needle_base.GetName].\n\n$grand_archive.8245.desc.inax.2$"
 grand_archive.8245.desc.stolen: "$grand_archive.8245.desc.inax.1$ vì đã lén... lén... lén lút trộm cắp của §YHắc Châm§!.\n\n$grand_archive.8245.desc.inax.2$"
 grand_archive.8245.a: "Ngươi là ai?"
 grand_archive.8245.a.reply: "Các người có... có... có thể gọi ta là Inax, Thiếu tướng của §YHắc... Hắc... Hắc Châm§!.\n\nĐược chết dưới tay ta là một cái chết quá tốt đẹp đối với các người rồi, khôn hồn thì nộp mạng ra đây.\n\nTa sẽ... sẽ... sẽ cho các người đi trước một bước, coi như là ân huệ cuối cùng."
 grand_archive.8245.b: "Ngươi đã giết $NAME_Smeegibb$..."
 grand_archive.8245.b.reply.common: "Chuyện cỏn con ấy mà. Ta đã dùng máu xanh của lũ sên... sên... sên nhỏ đó để sơn lại mấy cái lều của chúng. Không có hạm đội cũng chẳng có vũ khí —— sớm muộn gì cũng bị tiêu... tiêu... tiêu diệt thôi. Đã bị §YHắc... Hắc... Hắc Châm§! nhắm trúng thì không ai sống sót nổi đâu.\n\nĐó là người quen của các người à? Thật kỳ... kỳ... kỳ lạ. Đừng lo, các người sẽ sớm được đoàn tụ với chúng thôi. Nhân danh §Y$NAME_SilverQuill$§!, chúng ta sẽ đoạt lấy bản đồ sao từ "
 grand_archive.8245.b.reply.default: "$grand_archive.8245.b.reply.common$những mảnh... mảnh... mảnh xác chết co giật của các người."
 grand_archive.8245.b.reply.robot: "$grand_archive.8245.b.reply.common$những cái lon... lon... lon sắt vụn tàn tạ của các người."
 grand_archive.8245.c: "$NAME_SilverQuill$ là ai?"
 grand_archive.8245.c.reply: "§Y$NAME_SilverQuill$§! là ai à? Thật là một câu hỏi... hỏi... hỏi hay. Người sáng lập huyền thoại của chúng ta, người nắm quyền vạch ra mọi chiến lược. Ngài ấy đã biến §YHắc... Hắc... Hắc Châm§! từ một con tàu đơn độc thành một đế chế tội phạm lẫy lừng khắp thiên hà.\n\nHắc... Hắc... Hắc Châm sẽ trường tồn để ca... ca... ca tụng những chiến công hiển hách của ngài ấy, và cái chết của các người sẽ là nốt nhạc tiếp theo trong bản trường ca này."
 grand_archive.8245.d: "Ngươi cần $celestial_chart$ để làm gì?"
 grand_archive.8245.d.reply: "Lẽ nào các người không biết mình đang nắm giữ thứ gì sao? Đây chính là bản đồ dẫn đến kho báu của §YThuyền... Thuyền... Thuyền trưởng Ness§!! Từng viên... viên... viên đá quý mà mụ ta tích cóp cả đời đều ở đó.\n\nKhối tài sản đó thuộc về chúng ta. Một khi có được nó, tên tuổi của chúng ta sẽ được lưu danh sử sách. Mọi hệ sao đều sẽ phải khiếp sợ §YHắc... Hắc... Hắc Châm§!... và chương đầu tiên của bản sử thi này sẽ thuộc về các người. Chúng ta đã đủ hào phóng chưa?"
 grand_archive.8245.e: "Chúng ta sẽ không dễ dàng bỏ cuộc đâu."
 grand_archive.8245.e.reply: "Vậy thì hãy cất vang khúc chiến ca đi! Ta sẽ biến xác của đám [this.species.GetRemnantNamePlural] các người thành chiến lợi phẩm, dâng lên cho Chỉ... Chỉ huy của ta."
 grand_archive.8265.name: "$grand_archive.8245.name$"
 grand_archive.8265.desc: "Một trận chiến khó quên! Các người không hề yếu đuối như vẻ bề ngoài. Chúng ta đã hai lần đánh giá thấp các người, nhưng sẽ không có lần thứ ba đâu. Lần tới gặp lại, §YHắc... Hắc Châm§! sẽ không nương tay nữa.\n\nĐừng coi đây là một lời cảnh báo, đây là bản án tử hình dành cho các người."
 grand_archive.8265.a.scared: "Thật đáng lo ngại..."
 grand_archive.8265.a.homicidal: "Cứ phóng ngựa qua đây."
 grand_archive.8265.a.gestalt: "Ngắt kết nối."
 gateway_to_ness_treasure_system_poi: "Đi Theo Bản Đồ Sao"
 gateway_to_ness_treasure_system_poi_desc: "§H$celestial_chart$§! đã được ghép lại hoàn chỉnh. Nó hé lộ hệ sao ẩn giấu cuối cùng, [Prev.GetName]. Chuyến thám hiểm dài đằng đẵng của chúng ta sắp đi đến hồi kết - hãy tiến về đó và khám phá những gì đang chờ đợi!"
 TREASURE_HUNTERS_CHART_PIECE_3_PROJECT: "Khoang Chứa Được Cất Giấu"
 TREASURE_HUNTERS_CHART_PIECE_3_PROJECT_DESC: "Dựa theo những gì đã thu thập được, chúng ta tin rằng phần tiếp theo của §H$celestial_chart$§! đang được cất giấu trong tàn tích của khu định cư tại [this.GetName].\n\nXét đến độ bền chắc của những khoang chứa trước đó, có thể cho rằng nó đã sống sót qua trận dội bom gần đây."
 grand_archive.8270.name: "Bí Mật Của Bức Tượng"
 grand_archive.8270.desc: "Quá trình tìm kiếm mảnh vỡ thứ tư của §Y$celestial_chart$§! tại [from.GetName] đã kết thúc viên mãn. Chúng ta tìm thấy một khoang chứa được khảm vào một bức tượng đá, mô phỏng lại hình ảnh một cá thể phụ của tập thể $NAME_Smeegibb$ nay đã tuyệt chủng. Trên bức tượng có khắc dòng chữ:\n\n§L\"Dành tặng thuyền viên trung thành của tôi: Đây là lời cảm ơn tôi gửi đến bạn. Chúc bạn có một khoảng thời gian tĩnh lặng và bình yên dài lâu.\"§!\n\nMột khi mảnh ghép cuối cùng này được giải mã, chúng ta có thể tiếp tục hành trình truy tìm kho báu của §Y$NAME_CaptainNess$§!."
 TREASURE_HUNTERS_ANCIENT_CAPSULE_4_PROJECT: "Mảnh Vỡ Bản Đồ Cuối Cùng"
 TREASURE_HUNTERS_ANCIENT_CAPSULE_4_PROJECT_DESC: "Sau khi khai quật được khoang chứa từ tàn tích của khu định cư $NAME_Smeegibb$, phần việc còn lại là giải mã dữ liệu bên trong và hoàn thiện §H$celestial_chart$§!. Chẳng bao lâu nữa, chúng ta sẽ biết được thứ gì đang chờ đợi ở điểm tận cùng theo dấu vết của §H$NAME_CaptainNess$§!."
 grand_archive.8280.name: "Bản Đồ Hoàn Chỉnh"
 grand_archive.8280.desc: "Sau khi được giải mã, đoạn dữ liệu mới đã lấp đầy những mảnh ghép còn thiếu của §Y$celestial_chart$§!. Các điểm sáng lấp lánh trên từng nút giao, biểu thị cho các điểm dừng chân mà chúng ta đã khám phá dọc đường. Sau đó, bốn điểm sáng đồng loạt lóe lên, hé lộ vị trí của một hệ sao bí mật khác.\n\nViệc bổ sung khối dữ liệu cuối cùng cũng đã kích hoạt thêm các tính năng ẩn. §YBản đồ điều hướng§! này không đơn thuần chỉ là một bản đồ; nó còn chứa đựng vô số thông tin về những kho báu thất lạc và các báu vật phi pháp được §Y$NAME_CaptainNess$§! thu thập trên khắp thiên hà. Tuy một số dữ liệu có thể đã lỗi thời, nhưng thiết bị này vẫn có khả năng quét và phát hiện các kho báu ẩn giấu trong tất cả các hệ sao của chúng ta một cách cực kỳ hiệu quả.\n\nHơn nữa, §YTinh Đồ§! còn lưu trữ những thông tin thẩm định vô giá về từng món báu vật mà nữ thuyền trưởng này tìm thấy trong suốt sự nghiệp của mình. Những ghi chép chi tiết này hướng dẫn cách nhận biết, định giá và chào hàng các vật phẩm giá trị cao cho những người mua tiềm năng nhằm tối đa hóa lợi nhuận. Việc kích hoạt lại thiết bị sẽ mở khóa các bản thiết kế độc quyền về các hầm chứa kho báu, cho phép các thuộc địa của chúng ta tận dụng sự nhạy bén vô song của thuyền trưởng để gia tăng giá trị cho bộ sưu tập của mình."
 grand_archive.8280.a.lom: "Vô giá."
 grand_archive.8285.name: "Đi Theo Bản Đồ Sao"
 grand_archive.8285.desc: "Việc hoàn thành §Y$celestial_chart$§! là một cột mốc lịch sử đối với [this.GetName]. Khi tất cả những bí ẩn được phơi bày, chúng ta được dẫn lối đến một đích đến không thể chối từ: hệ sao [gateway_to_ness_treasure_system.GetName].\n\nSau khi vượt qua vô vàn gian nan thử thách, chúng ta chỉ còn cách vạch đích một bước chân. Câu hỏi duy nhất còn lại là: Đằng sau §YTinh Đồ§! đó ẩn giấu điều gì?\n\nKhông ai có thể đảm bảo thành công, nhưng chúng ta quyết không để kẻ khác nẫng tay trên. Hãy dũng cảm tiến lên và kết thúc chuyến phiêu lưu này!"
 grand_archive.8285.a.default: "Tiếp tục tiến bước."
 grand_archive.8285.a.lom: "Tiến lên, Yoho!"
 councilor_head_treasure_hunter: "Kỳ Binh Đoạt Bảo Trưởng"
 councilor_head_treasure_hunter_female: "$councilor_head_treasure_hunter$"
 councilor_head_treasure_hunter_desc: "Kỳ Binh Đoạt Bảo Trưởng cẩn thận phân tích §Y$celestial_chart$§!, truy dấu những kho báu ẩn giấu và định giá các cổ vật quý hiếm."
 councilor_corporate_head_treasure_hunter: "$councilor_head_treasure_hunter$"
 councilor_corporate_head_treasure_hunter_female: "$councilor_head_treasure_hunter$"
 councilor_corporate_head_treasure_hunter_desc: "$councilor_head_treasure_hunter_desc$"
 prospect_of_treasure_modifier: "Thăm Dò Kho Báu"
 prospect_of_treasure_modifier_tt: "Nhận §G+$@prospect_of_treasure_treasure_trove_reward|0%$§! $mod_treasure_trove_reward_mult$, §G+$@prospect_of_treasure_treasure_gatherers_produces|0%$§! $mod_planet_treasure_gatherers_produces_mult$, đồng thời mỗi cấp $ruler$ cấp §G+$@prospect_of_treasure_energy_produces|0$§! $mod_country_base_energy_produces_add$:\n\n"
 grand_archive.8290.name: "Sơ Lược Kho Báu"
 grand_archive.8290.desc.chart: "Cùng với việc thành lập Bảo Tàng Trân Bảo tại [from.GetName], chúng ta tin rằng §Y$celestial_chart$§! sở hữu tiềm năng đóng góp to lớn cho nền kinh tế của chúng ta."
 grand_archive.8290.desc.trove: "Thông qua việc liên tục phân bổ các nguồn tài nguyên thu được từ $TREASURE_TROVE$ tại [from.GetName], chúng ta ngày càng nhận thức rõ ràng rằng §Y$celestial_chart$§! có tiềm năng thúc đẩy nền kinh tế của chúng ta phát triển mạnh mẽ."
 grand_archive.8290.desc.default: "Để khai thác tối đa tiềm năng của §YTinh Đồ§!, chúng ta đã thiết lập một chức vụ Nội các mới, chuyên trách chỉ đạo các hoạt động khám phá và thu thập kho báu."
 grand_archive.8290.desc.gestalt: "Nhằm tận dụng triệt để những lợi ích từ §YTinh Đồ§!, chúng ta đã tiến hành phân bổ thêm nguồn lực cho các hoạt động tìm kiếm và thu thập kho báu."
 grand_archive.8290.desc.chart.default: "$grand_archive.8290.desc.chart$\n\n$grand_archive.8290.desc.default$"
 grand_archive.8290.desc.chart.gestalt: "$grand_archive.8290.desc.chart$\n\n$grand_archive.8290.desc.gestalt$"
 grand_archive.8290.desc.trove.default: "$grand_archive.8290.desc.trove$\n\n$grand_archive.8290.desc.default$"
 grand_archive.8290.desc.trove.gestalt: "$grand_archive.8290.desc.trove$\n\n$grand_archive.8290.desc.gestalt$"
 grand_archive.8290.tt: "\n§ECho phép mở khóa chức vụ Nội các:§!\n§H$t$$councilor_head_treasure_hunter$§!\n$tt$$COUNCIL_POSITION_MODIFIER_BASE$\n$ttt$$mod_treasure_trove_reward_mult$: §G+$@councilor_head_treasure_hunter_treasure_trove_reward|0%$§!\n$ttt$$mod_planet_treasure_gatherers_produces_mult$: §G+$@councilor_head_treasure_hunter_treasure_gatherers_produces|0%$§!\n$ttt$$mod_country_base_energy_produces_add$: §G+$@councilor_head_treasure_hunter_energy_produces|0$§!\n$COUNCIL_POSITION_AVAILABLE_FOR$$t$$scientist_with_icon$ $commander_with_icon$"
 grand_archive.8300.name: "Cổng Sao Bị Bọ Tràn Ngập"
 grand_archive.8300.desc.common: "Đây chắc chắn là Cổng Sao dẫn đến kho báu mà chúng ta hằng mơ ước."
 grand_archive.8300.desc.did_encounter_voidworms: "Bản đồ đã dẫn chúng ta đến một Hố Đen chưa từng được khám phá, và một hệ sao đang bị loài $NAME_Voidworms$ ký sinh. Bọn chúng lấy một Cổng Sao bỏ hoang gần đó làm tổ, những con khổng lồ nhất thì bay lượn vòng quanh cấu trúc hoang tàn này tựa như những kẻ canh gác.\n\n$grand_archive.8300.desc.common$ Nếu muốn đi đến cuối con đường, chúng ta bắt buộc phải tiêu diệt sạch lũ $NAME_Voidworms$ và khôi phục lại Cổng Sao."
 grand_archive.8300.desc.didnt_encounter_voidworms: "Bản đồ đã dẫn chúng ta đến một Hố Đen chưa từng được khám phá, cùng với một hệ sao nhung nhúc những sinh vật kỳ dị. Những sinh vật này tập trung quanh một Cổng Sao bỏ hoang, trong đó con lớn nhất bay lượn vòng quanh cấu trúc hoang tàn này như thể đã biến nơi đây thành lãnh địa của mình.\n\nCơ sở dữ liệu của chúng ta về Thú Không Gian không hề có thông tin về loài sinh vật khổng lồ hình giun này. Hiện chúng ta đang nỗ lực thiết lập liên lạc. $grand_archive.8300.desc.common$ Nếu muốn đi đến cuối hành trình, chúng ta phải giải quyết lũ sinh vật này và khôi phục lại Cổng Sao."
 grand_archive.8300.a: "Không ai có thể ngáng đường chúng ta."
 grand_archive.8300.a.pacifist: "Nếu không còn cách nào khác."
 grand_archive.8300.a.lom: "Cho chúng một loạt đạn sườn đi!"
 GATEWAY_VOIDWORMS_KILL_PROJECT: "$grand_archive.8300.name$"
 GATEWAY_VOIDWORMS_KILL_PROJECT_DESC: "Theo sự dẫn dắt của §H$celestial_chart$§!, chúng ta đã tìm thấy một §HCổng Sao§! bị bọ ký sinh trong hệ sao [this.solar_system.GetName]. Cần phải giải quyết bầy sinh vật này trước mới có thể kích hoạt lại Cổng Sao và xem có gì ở đầu bên kia."
 GATEWAY_VOIDWORMS_KILL_PROJECT_TT: "§RTiêu diệt sinh vật tại [this.solar_system.GetName]§!"
 GATEWAY_VOIDWORMS_DEBRIS_PROJECT: "Xác $NAME_Voidworms$"
 GATEWAY_VOIDWORMS_DEBRIS_PROJECT_DESC: "Xác của những con Sâu Hư Không tại hệ sao [this.solar_system.GetName] hiển thị những tín hiệu bất thường. Cảm biến dường như dò thấy dấu hiệu sự sống bên trong một con Sâu Ba Đầu đang thoi thóp. Chúng ta nên cử Tàu Khoa Học đến điều tra kỹ hơn."
 grand_archive.8310.name: "Trứng Sâu Hư Không"
 grand_archive.8310.desc.did_encounter_voidworms: "Chúng ta tìm thấy một bầy ấu trùng vừa mới nở bên trong xác một con Sâu Hư Không. Dù đồng loại của chúng vừa bị tàn sát, lũ ấu trùng này vẫn bơi lại gần tàu của chúng ta và trôi nổi cạnh hạm đội như muốn tỏ ý cầu xin.\n\n$grand_archive.8310.desc.common$"
 grand_archive.8310.desc.didnt_encounter_voidworms: "Chúng ta tìm thấy một ổ ấu trùng bên trong tàn tích của sinh vật hình rắn. Bất chấp những mất mát mà đồng loại của chúng phải gánh chịu, lũ ấu trùng này vẫn bơi lại gần tàu của chúng ta và trôi nổi cạnh hạm đội như muốn tỏ ý quy phục.\n\n$grand_archive.8310.desc.common$"
 grand_archive.8310.desc.common: "Nếu muốn, chúng ta có thể lợi dụng sự bám víu bản năng này của chúng đối với chúng ta: một khi trưởng thành, bầy sinh vật không gian này sẽ trở thành một hạm đội hữu cơ mạnh mẽ dưới quyền kiểm soát của chúng ta."
 grand_archive.8310.a: "Một phát hiện tuyệt vời."
 grand_archive.8310.a.tt: "Chúng ta sẽ nhận được một hạm đội gồm §Y$@gateway_voidworm_nymph_reward_count|0$§! §2$epic$§! $voidworms_small_plural$."
 grand_archive.8310.b: "Cũng chỉ là con mồi mà thôi."
 grand_archive.8315.name: "Nghiên Cứu Công Nghệ Cổng Sao"
 grand_archive.8315.desc: "Cổng Sao tại [FromFromFrom.System.GetName] đang trong trạng thái ngủ đông. Khi tiếp cận công trình cổ đại này, §Y$celestial_chart$§! đã cung cấp một loạt kiến thức về thứ công nghệ đã thất truyền này. Việc thấu hiểu phương thức giao thông cổ đại này có thể sẽ hữu ích cho những chuyến phiêu lưu khác."
 RESEARCH_GATEWAY_ACTIVATION_PROJECT: "$grand_archive.8315.name$"
 RESEARCH_GATEWAY_ACTIVATION_PROJECT_DESC: "$grand_archive.8315.desc$"
 RESEARCH_GATEWAY_ACTIVATION_PROJECT_TT: "Nghiên cứu công nghệ £physics£§Y$tech_gateway_activation$§!"
 grand_archive.8325.name: "Kích Hoạt Cổng Sao"
 grand_archive.8325.desc.common: "Một khi chúng ta thiết lập lại liên kết giữa các hệ sao, bản đồ sẽ kết thúc tại đây. Bí mật được giấu kín trong bản đồ sao này sẽ sớm được phơi bày."
 grand_archive.8325.desc.tech: "Sau khi hoàn thành các nghiên cứu công nghệ cần thiết, giờ đây chúng ta đã có thể khởi động lại Cổng Sao cổ đại nằm tại [gateway_to_ness_treasure_system.GetName].\n\n$grand_archive.8325.desc.common$"
 grand_archive.8325.desc.kill.known: "Đám sinh vật đó đã được dọn dẹp sạch sẽ, giờ chỉ còn mỗi việc khởi động lại Cổng Sao cổ đại nằm tại [gateway_to_ness_treasure_system.GetName] nữa thôi.\n\n$grand_archive.8325.desc.common$"
 grand_archive.8325.desc.kill.unknown: "$NAME_Voidworms$ đã được dọn dẹp sạch sẽ, giờ chỉ còn mỗi việc khởi động lại Cổng Sao cổ đại nằm tại [gateway_to_ness_treasure_system.GetName] nữa thôi.\n\n$grand_archive.8325.desc.common$"
 ACTIVATE_GATEWAY_PROJECT: "$grand_archive.8325.name$"
 ACTIVATE_GATEWAY_PROJECT_DESC: "Là điểm đến cuối cùng trên §H$celestial_chart$§!, §HCổng Sao§! đang ngủ đông trong hệ sao [this.solar_system.GetName] rất có thể là cánh cổng dẫn đến một nơi vô cùng trọng yếu."
 ACTIVATE_GATEWAY_PROJECT_TT: "§HKích Hoạt Cổng Sao§!"
 grand_archive.8400.name: "Kho Báu Đây Rồi, Yoho!"
 grand_archive.8400.desc: "Sau khi kích hoạt Cổng Sao ở điểm cuối của con đường trên §Y$celestial_chart$§!, chúng ta đã phát hiện ra hệ sao [ness_treasure_system.GetName]. Sự phân bố của các thiên thể hoàn toàn trùng khớp với bản phác thảo mà chúng ta tìm thấy trong nhật ký hàng hải của §Y$NAME_CaptainNess$§!.\n\nChuyến hành trình dài đằng đẵng của chúng ta sắp khép lại."
 grand_archive.8400.a: "Tiếp tục tiến lên."
 ness_treasure_system_poi: "Băng qua Cổng Sao ở [from.solar_system.GetName]"
 ness_treasure_system_poi_desc: "Chúng ta đã đi đến cuối con đường do §H$celestial_chart$§! vạch ra, đánh bại hải tặc và quái vật trên suốt dọc đường. Giờ đây, cánh cổng dẫn sang bờ bên kia đã mở ra, phần còn lại là khám phá những gì nằm ở đầu bên kia của Cổng Sao."
 #Megastructure
 gateway_ness_ruined: "$gateway_ruined$"
 gateway_ness_ruined_DESC: "$gateway_ruined_DESC$"
 gateway_ness_ruined_MEGASTRUCTURE_DETAILS: "$gateway_ruined_MEGASTRUCTURE_DETAILS$"
 gateway_ness_restored: "$gateway_final$"
 gateway_ness_restored_DESC: "$gateway_final_DESC$"
 gateway_ness_restored_MEGASTRUCTURE_DETAILS: "$gateway_final_MEGASTRUCTURE_DETAILS$"
 NESS_GRAND_ARCHIVE: "Kho Báu của $NAME_CaptainNess$"
 NESS_GRAND_ARCHIVE_HOARDED: "$NESS_GRAND_ARCHIVE$"
 grand_archive.8405.name: "Phục Kích!"
 grand_archive.8405.desc: "Chúng ta đã bị theo dõi.\n\nGiờ đây, chúng ta đang phải đối mặt với một hạm đội §Y$NAME_BlackNeedle$§! hùng hậu tại [ness_treasure_system.GetName]. So với lần chạm trán trước, quy mô lực lượng của chúng đã tăng lên đáng kể, bao gồm cả những tàu chiến hết đát và những tàu dân sự được cải tạo bằng vũ khí tối tân. Có vẻ như chúng đã huy động phần lớn lực lượng dự bị cho cuộc đối đầu này. Nằm ngay giữa đội hình là kỳ hạm của chúng, một chiến hạm khổng lồ lớp $titan$.\n\nMặc dù đội hình của chúng đã sẵn sàng chiến đấu, nhưng hầu hết các tàu vẫn chưa nạp đạn. Có vẻ như chúng đang muốn đàm phán.\n\nChúng ta đang nhận được tín hiệu liên lạc từ kỳ hạm."
 grand_archive.8405.a.lom: "Vậy thì đàm phán."
 grand_archive.8410.name: "$NAME_CobaltQuill$, Thuyền Trưởng của $NAME_BlackNeedle$"
 grand_archive.8410.desc: "§HMặc dù sở hữu vóc dáng nhỏ bé, nhưng tên thuyền trưởng hải tặc này lại tỏa ra uy thế bức người. Ánh mắt hắn đầy toan tính, quan sát và đánh giá chúng ta cẩn thận như thể đang giải một phương trình phức tạp.§!\n\nCuối cùng cũng gặp mặt. Tôi là $NAME_CobaltQuill$, Thuyền trưởng của §Y$NAME_BlackNeedle$§!, niềm tự hào của gia tộc, hậu duệ của người sáng lập $NAME_SilverQuill$, xin gửi lời chào đến các vị! Các vị đã làm cái gai trong mắt chúng tôi bao năm nay — nhưng tôi là một người biết lý lẽ. Tôi mang đến một lời đề nghị.\n\nChúng tôi sẽ trả một khoản tiền thưởng kếch xù cho tấm bản đồ sao hoàn chỉnh của các vị, đồng thời tha chết cho cái mạng nhỏ bé của các vị để các vị rời đi.\n\nNếu các vị từ chối, chúng tôi sẽ không còn cách nào khác ngoài việc dùng vũ lực đoạt lấy thứ mình muốn. Lực lượng hải quân của chúng tôi vượt trội hơn hẳn, và chúng tôi cũng đã cài người vào một số cứ điểm trọng yếu trong Đế chế của các vị. Chỉ cần tôi ra lệnh một tiếng, các vị sẽ sụp đổ hoàn toàn."
 grand_archive.8410.a: "Ngươi sẽ đưa ra cái giá nào?"
 grand_archive.8410.a.reply: "Bất chấp bao rắc rối mà các vị đã gây ra, tôi vẫn sẵn sàng trả một khoản tiền thưởng khổng lồ để đổi lấy di vật hoàn chỉnh của §Y$NAME_CaptainNess$§!.\n\nNếu chấp nhận lời đề nghị hào phóng này, tôi sẽ xí xóa hết mọi lỗi lầm trong quá khứ của các vị. Giữa chúng ta không cần thiết phải tiếp tục cuộc xung đột này. Hoặc leo thang nó..."
 grand_archive.8410.b: "Ngươi đang đe dọa chúng ta đấy à..."
 grand_archive.8410.b.reply.common_1: "Tôi nắm rõ mọi ngóc ngách của [this.GetName]. Chuỗi cung ứng, vị trí kho chứa tài nguyên, sự phân bố của các Căn Cứ Sao, mọi thứ đều nằm gọn trong lòng bàn tay tôi."
 grand_archive.8410.b.reply.common_2: "Người của tôi đã nghiên cứu rất kỹ lưỡng, tôi biết chính xác cách để làm sụp đổ đế chế của các vị. Tôi sẽ khiến các hành tinh của các vị lâm vào cảnh chết đói, đánh cắp nhu yếu phẩm và phá hủy tất cả những gì còn lại. Đương nhiên, quyết định nằm ở chỗ các vị có chịu giao thứ tôi cần hay không..."
 grand_archive.8410.b.reply.default: "$grand_archive.8410.b.reply.common_1$\n\nTôi vẫn luôn để mắt đến từng cá nhân đáng tin cậy trong bộ máy lãnh đạo của các vị, cũng như những người thân yêu của họ...\n\n$grand_archive.8410.b.reply.common_2$"
 grand_archive.8410.b.reply.hive_mind: "$grand_archive.8410.b.reply.common_1$\n\nTôi đang theo dõi mọi nút chính trong ý thức tập thể của các vị, và sẽ nhận được thông báo mỗi khi có nút mới được tạo ra.\n\n$grand_archive.8410.b.reply.common_2$"
 grand_archive.8410.b.reply.machine: "$grand_archive.8410.b.reply.common_1$\n\nTôi đã xâm nhập vào ma trận định vị của các vị, có thể theo dõi vị trí của mọi nút mạng trọng yếu trong mạng lưới của các vị.\n\n$grand_archive.8410.b.reply.common_2$"
 grand_archive.8410.c: "Tại sao ngươi lại phải tốn công đàm phán với chúng ta?"
 grand_archive.8410.c.reply: "Một chiến dịch phá hoại quy mô lớn thế này đâu có rẻ. Chi phí bảo trì tàu, trả lương, đút lót, mấy thứ này tốn kém lắm, vung tay quá trán thì sao mà giàu nổi. Sức tàn phá đang chờ đợi các người là cực kỳ khủng khiếp, chỉ cần nhấn một cái nút là xong, nhưng đổi lại cái giá phải trả cũng không hề nhỏ.\n\nTiền mồ hôi nước mắt của tôi còn nhiều chỗ tốt hơn để xài. Thôi nào, hãy tránh để phải đổ máu vô ích. Cầm lấy khoản tiền từ trên trời rơi xuống này rồi biến khỏi đây đi, cứ để việc cướp bóc lại cho dân chuyên nghiệp."
 grand_archive.8410.d: "Chuyện này không chỉ vì tiền thôi đâu, đúng không?"
 grand_archive.8410.d.reply: "Năm ngàn năm trước, tổ tiên của tôi, ngài $NAME_SilverQuill$ vĩ đại, từng là thuyền phó của $NAME_CaptainNess$. Ngài ấy đã trung thành phục vụ mụ ta nhiều năm liền, nhưng cuối cùng thì nhận lại được gì?\n\nSự phản bội!\n\nMụ ta đã giao nộp ngài ấy cho chính quyền để độc chiếm khoản tiền thưởng! Đương nhiên, chẳng có nhà tù nào có thể giam giữ được $NAME_SilverQuill$ quyền năng.\n\nSau một cuộc tẩu thoát ngoạn mục, ngài ấy đã rũ bùn đứng lên, rèn giũa đám tàn quân tạp nham của mình thành một tổ chức §Y$NAME_BlackNeedle$§! huyền thoại đang đứng trước mặt các vị ngày hôm nay. Ngài ấy đã thề sẽ trả thù kẻ đã phản bội mình, dành cả phần đời còn lại để cướp đoạt kho báu của mụ ta, và dùng chính thành công của mình để chôn vùi danh tiếng của mụ.\n\nTôi chỉ đang hoàn thành di nguyện của ngài ấy thôi. Tấm bản đồ sao này chính là chìa khóa để đoạt lại những gì thuộc về chúng tôi.\n\nGiờ thì giao nó ra đây."
 grand_archive.8415.name: "Một Lời Đề Nghị Táo Bạo"
 grand_archive.8415.desc: "Thủ lĩnh của §Y$NAME_BlackNeedle$§! đã đưa ra một lời đề nghị: chúng sẵn sàng trả một khoản tiền thưởng khổng lồ để đổi lấy §Y$celestial_chart$§!. Nếu chấp nhận giao dịch này, đồng nghĩa với việc chúng ta tự tay dâng chìa khóa kho báu của §Y$NAME_CaptainNess$§! cho chúng.\n\nTừ chối lời đề nghị sẽ chuốc lấy cơn thịnh nộ của bọn chúng. Vẫn chưa rõ mức độ xâm nhập của lũ hải tặc này vào cơ cấu quân sự của chúng ta sâu đến đâu, nhưng chúng đe dọa sẽ phá hủy [this.GetName] từ bên trong. Việc những lời đe dọa này chỉ là hư trương thanh thế hay là thật vẫn còn phải chờ xem."
 grand_archive.8415.a: "Từ chối lời đề nghị của chúng."
 grand_archive.8415.b: "Bán §Y$celestial_chart$§!."
 grand_archive.8415.b.effect_tt: "Mất đi §Y$celestial_chart$§!\nNhận được §G+$@max_credit_mult|0%$§! $r_energy$ tối đa của bạn\nNhận được một con tàu từ §Y$NAME_BlackNeedle$§!"
 grand_archive.8500.name: "Chốt Giao Dịch"
 grand_archive.8500.desc: "Chúng ta đã giao nộp §Y$celestial_chart$§! để đổi lấy một khoản $MONEY$ kếch xù cùng một chiến hạm phi thường mang tên §YMắt Kim§!. Cuộc tranh chấp giữa chúng ta và §Y$NAME_BlackNeedle$§! có thể coi như đã được giải quyết êm đẹp.\n\nChúng ta đã tránh được một cuộc đụng độ quy mô lớn với toàn bộ hạm đội của chúng, đồng thời ngăn chặn được âm mưu phá hoại lan rộng khắp thiên hà.\n\nTốt nhất là cứ để lũ hải tặc tiếp tục làm trò hải tặc của chúng."
 grand_archive.8500.a: "Mọi chuyện giữa chúng ta kết thúc tại đây."
 grand_archive.8500.a.tt: "Tất cả tàu thuyền sẽ bị đẩy ra khỏi hệ sao có $TREASURE_TROVE$."
 HOARD_LOOTED_BY_PIRATES: "Cấu trúc này đã bị bọn hải tặc cướp sạch, bên trong chẳng còn món đồ nào có giá trị"
 grand_archive.8505.name: "Cố Ý Phá Hoại!"
 grand_archive.8505.desc: "§Y$NAME_BlackNeedle$§! đã phát động một cuộc tấn công toàn diện, gieo rắc sự hỗn loạn khắp các hệ sao của chúng ta. Các dây chuyền sản xuất bị đình trệ, máy phát điện bốc cháy, và các cơ sở hạ tầng hành chính trọng yếu buộc phải ngừng hoạt động. Hàng hóa không cánh mà bay, dữ liệu của các trạm nghiên cứu bị xóa sạch, các khu mỏ sập với tốc độ nhanh gấp 5 lần bình thường.\n\nCuộc phá hoại diễn ra trên diện rộng này là kết quả của một kế hoạch thâm độc được phối hợp bởi hàng ngàn kẻ có ý đồ xấu. Một mạng lưới những kẻ phá hoại khổng lồ đang ẩn náu trong các thuộc địa của chúng ta, và chúng dường như luôn đi trước chúng ta một bước."
 grand_archive.8505.a: "Báo động đỏ!"
 situation_sabotage: "Kẻ Phá Hoại Của Hắc Châm"
 situation_sabotage_type: "$situation_sabotage$"
 situation_sabotage_desc: "Một lượng lớn những kẻ phá hoại của §Y$NAME_BlackNeedle$§! đang ẩn náu trong các thuộc địa của chúng ta, gây ra sự tàn phá trên diện rộng khắp [owner.GetName]. Trừ phi chúng ta tiêu diệt lũ phá hoại này, nếu không sự phá hoại sẽ tiếp diễn cho đến khi chuỗi cung ứng của chúng ta hoàn toàn sụp đổ."
 situation_sabotage_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 approach_sabotage_do_nothing: "Khoanh tay đứng nhìn"
 approach_sabotage_do_nothing_tt: "Hiện tại chúng ta sẽ không áp dụng bất kỳ biện pháp đặc biệt nào."
 approach_sabotage_purge: "Thanh Trừng Kẻ Phá Hoại"
 approach_sabotage_purge_tt: "Việc thanh lọc các đặc vụ ngầm trà trộn vào hàng ngũ của chúng ta chắc chắn sẽ gây ra những thiệt hại phụ không thể tránh khỏi."
 approach_sabotage_mitigate: "Giảm Thiểu Thiệt Hại"
 approach_sabotage_mitigate_tt: "Chúng ta có thể thực hiện các biện pháp tái thiết cơ sở hạ tầng, hy vọng thông qua cuộc chiến tiêu hao này để chống lại các đợt tấn công phá hoại."
 finisher_effects_sabotage: "Chúng ta sẽ thanh trừng lũ phá hoại Hắc Châm và ngăn chặn chúng tăng viện cho lực lượng đang phong tỏa kho báu của Thuyền trưởng Ness."
 finisher_effects_sabotage_fail: "Cơ sở hạ tầng của chúng ta sẽ phải hứng chịu những tổn thất không thể khắc phục, và Hắc Châm sẽ tăng cường phong tỏa kho báu của Thuyền trưởng Ness."
 grand_archive.8520.name: "Mạng Lưới Phá Hoại Lộ Diện"
 grand_archive.8520.desc.common: "Chúng ta đã đánh chặn được các tần số liên lạc bí mật mà §Y$NAME_BlackNeedle$§! sử dụng tại các thuộc địa của chúng ta. Sau khi giải mã các tin nhắn, chúng ta đã có thể xác định danh tính của mọi kẻ phản bội và phá hoại đang trà trộn trong hàng ngũ của mình."
 grand_archive.8520.desc.machine: "$grand_archive.8520.desc.common$\n\nĐặc vụ của chúng đã liên tục âm thầm phát tán mã độc vào hệ điều hành của chúng ta, tạo ra một đội quân ngầm gồm những đơn vị nổi loạn ẩn nấp khắp mọi nơi trong mạng lưới của chúng ta.\n\nChương trình tái lập trình thâm độc này đã tiến xa đến mức làm tha hóa một trong những nút độc lập quan trọng nhất tại [root.GetName], §Y[traitor_leader.GetClass] [traitor_leader.GetName]§!."
 grand_archive.8520.desc.hive: "$grand_archive.8520.desc.common$\n\nĐặc vụ của chúng đã liên tục phát tán pheromone phân ly tại các nơi cư trú, khiến cho rất nhiều ong thợ của chúng ta bắt đầu có những biểu hiện sai lệch tiềm tàng. Sau khi bị mê hoặc, lũ hải tặc đã điều hướng những ong thợ này đến phòng của các đặc vụ ngầm, và hiện tại chúng đang ra sức phá hoại cơ sở hạ tầng của chúng ta.\n\nKế hoạch đồ sộ này đã tiến xa đến mức làm tha hóa một trong những nút độc lập quan trọng nhất tại [root.GetName], §Y[traitor_leader.GetClass] [traitor_leader.GetName]§!."
 grand_archive.8520.desc.default: "$grand_archive.8520.desc.common$\n\nChúng ta vừa phát hiện ra rằng bọn đặc vụ của chúng đã âm thầm tuyển mộ những công dân bất mãn trong suốt nhiều năm qua để chuẩn bị cho cuộc tấn công quy mô lớn này. Chúng đã lợi dụng các mạng lưới điệp viên ngầm và vô số người cung cấp thông tin luôn chực chờ phản bội chúng ta.\n\nMột trong những kẻ phản bội đã bị vạch mặt, không ai khác chính là §Y[traitor_leader.GetClass] [traitor_leader.GetName]§!, sự hiện diện của hắn tạo ra một nguy cơ an ninh cực kỳ nghiêm trọng. Chúng ta phải xử lý kẻ âm mưu này nhưng vẫn phải duy trì được mức độ ổn định nhất định. Nếu để dân chúng biết được mức độ thối nát này, hậu quả đối với chính phủ sẽ vô cùng thảm khốc."
 grand_archive.8520.a.default: "Hành quyết kẻ phản bội."
 grand_archive.8520.a.machine: "Vô hiệu hóa các đơn vị bị tha hóa."
 grand_archive.8520.a.hive: "Tiêu diệt những ong thợ có dấu hiệu bất thường."
 grand_archive.8520.a.tt: "Mỗi hành tinh có người ở sẽ có §R100§! £pop§HDân Số§! bị tiêu diệt."
 grand_archive.8520.b.default: "Tiến hành tái giáo dục cho kẻ phản bội."
 grand_archive.8520.b.machine: "Tiến hành tái lập trình cho các đơn vị bị tha hóa."
 grand_archive.8520.b.hive: "Tái đồng hóa những ong thợ có dấu hiệu bất thường."
 grand_archive.8520.c: "Công khai danh tính kẻ phản bội."
 grand_archive.8525.name.default: "Kẻ Phản Bội Bị Hành Quyết"
 grand_archive.8525.name.hive: "Kẻ Bất Thường Bị Tiêu Diệt"
 grand_archive.8525.name.machine: "Đơn Vị Bị Đình Chỉ"
 grand_archive.8525.desc.common: "Ngay sau khi phát hiện ra [traitor_leader.GetHisHer] đã thề trung thành với băng hải tặc §Y$NAME_BlackNeedle$§!"
 grand_archive.8525.desc.default: "$grand_archive.8525.desc.common$, [traitor_leader.GetName] đã bị xử tử.\n\nChi tiết cụ thể về cái chết của [traitor_leader.GetHisHer] vẫn chưa được tiết lộ ra bên ngoài."
 grand_archive.8525.desc.hive: "$grand_archive.8525.desc.common$, [traitor_leader.GetName] đã bị tiêu diệt."
 grand_archive.8525.desc.machine: "$grand_archive.8525.desc.common$, [traitor_leader.GetName] đã bị xử tử."
 grand_archive.8525.a: "Biện pháp tất yếu."
 grand_archive.8530.name.default: "Tái Giáo Dục Kẻ Phản Bội"
 grand_archive.8530.name.hive: "Tái Giáo Dục Kẻ Bất Thường"
 grand_archive.8530.name.machine: "Tái Lập Trình Đơn Vị"
 grand_archive.8530.desc.default: "$grand_archive.8525.desc.common$, [traitor_leader.GetName] đã được giáo huấn triệt để.\n\nTuy nhiên, quá trình tái giáo dục này đã để lại một di chứng tiêu cực lâu dài cho [traitor_leader.GetName]."
 grand_archive.8530.desc.hive: "$grand_archive.8525.desc.common$, [traitor_leader.GetName] đã được giáo huấn triệt để.\n\nTuy nhiên, quá trình tái đồng hóa này đã để lại một ấn tượng tiêu cực khó phai trong tâm trí [traitor_leader.GetName]."
 grand_archive.8530.desc.machine: "$grand_archive.8525.desc.common$, [traitor_leader.GetName] đã được tái lập trình hoàn chỉnh.\n\nTuy nhiên, quá trình định hình lại này đã để lại một ấn tượng tiêu cực khó phai trong hệ thống của [traitor_leader.GetName]."
 grand_archive.8530.a.tt: "[traitor_leader.GetName] nhận được 2 đặc điểm tiêu cực"
 grand_archive.8535.name: "Phát Hiện [traitor_leader.GetName] Đã Chết"
 grand_archive.8535.desc: "$grand_archive.8525.desc.common$, những công dân phẫn nộ của [root.GetName] đã tập hợp lại biểu tình. Đám đông giận dữ đã xông thẳng vào nhà của [traitor_leader.GetHisHer]. Lát sau, người ta tuyên bố [traitor_leader.GetHeSheCap] đã chết ngay tại hiện trường."
 grand_archive.8536.name: "Kẻ Phản Bội Chuộc Tội"
 grand_archive.8536.desc: "$grand_archive.8525.desc.common$, [traitor_leader.GetHeShe] đã ra thông cáo báo chí, bày tỏ sự ăn năn hối hận tột cùng về hành vi của [traitor_leader.GetHisHer]. Cú sốc này dường như đã ảnh hưởng lâu dài đến năng lực lãnh đạo của [traitor_leader.GetHisHer].\n\nBất chấp mọi lỗi lầm trong quá khứ, người dân [root.GetName] dường như vẫn sẵn lòng tha thứ cho [traitor_leader.GetName]."
 grand_archive.8536.a: "Một tín hiệu đáng mừng."
 grand_archive.8536.a.tt: "[traitor_leader.GetName] nhận được 1 đặc điểm tiêu cực"
 grand_archive.8545.name: "Cơ Sở Hạ Tầng Sụp Đổ"
 grand_archive.8545.desc: "Đáng buồn thay, chúng ta đã không thể ngăn chặn được chiến dịch phá hoại của §Y$NAME_BlackNeedle$§!. Lũ phá hoại của chúng đã phá hủy hoàn toàn hệ thống hậu cần của chúng ta, việc khôi phục chuỗi cung ứng sẽ phải mất nhiều năm trời. Quy mô tha hóa mà chúng gieo rắc trong các hệ sao của chúng ta là quá lớn để có thể xoa dịu được.\n\nTuy nhiên, điều đó sẽ không cản bước chúng ta tiến tới chiếm lấy §Y$NESS_GRAND_ARCHIVE$§! nhân danh chúng ta. Việc chúng ta cần làm lúc này chỉ là đánh bại lũ hải tặc trong một trận chiến, và kho báu sẽ thuộc về chúng ta."
 grand_archive.8545.a: "Trận chiến vẫn chưa kết thúc."
 grand_archive.8550.name: "Cao Tay Hơn, Bọn Trộm Lực Bất Tòng Tâm"
 grand_archive.8550.desc: "Dù §Y$NAME_BlackNeedle$§! đã vắt óc nghĩ kế phá hoại cơ sở hạ tầng của chúng ta, chúng ta vẫn kịp thời phục hồi và ổn định lại tình hình. Các đặc vụ của chúng đã bị tóm gọn, việc còn lại chỉ là đụng độ với hạm đội mà chúng đang tập kết tại [hoard_system.GetName], và đoạt lấy §Y$NESS_GRAND_ARCHIVE$§! dưới danh nghĩa [root.GetName]."
 grand_archive.8550.a: "Cứ làm như vậy đi."
 grand_archive.8555.name: "$NAME_BlackNeedle$ Bị Đánh Bại"
 grand_archive.8555.desc: "Lực lượng của §Y$NAME_BlackNeedle$§! hoàn toàn không có cửa so bì với đội quân hùng hậu của chúng ta. Hạm đội mà chúng tập kết đã bị đánh tan tác, không còn khả năng hỗ trợ cho các chiến dịch phá hoại trong hệ sao của chúng ta nữa. Giờ đây, chúng ta đã có thể chiếm lấy §Y$NESS_GRAND_ARCHIVE$§! dưới danh nghĩa [root.GetName]."
 grand_archive.8555.a: "Lấy trứng chọi đá."
 grand_archive.8555.a.lom: "Đám vịt trên cạn đáng thương."
 TREASURE_HUNTERS_BLACK_NEEDLE_PROJECT: "Trận Chiến Sống Còn Của $NAME_BlackNeedle$"
 TREASURE_HUNTERS_BLACK_NEEDLE_PROJECT_DESC: "Sau khi tiến hành cuộc tấn công phá hoại trên diện rộng vào các hệ sao của [root.GetName], $NAME_BlackNeedle$ vẫn đang tiếp tục duy trì vòng phong tỏa xung quanh §H$NESS_GRAND_ARCHIVE$§!. Chúng đã vắt kiệt phần lớn tài nguyên của mình và hiện đang trong tình trạng cực kỳ dễ tổn thương. Nếu chúng ta đánh bại chúng tại đây, toàn bộ tổ chức của chúng chắc chắn sẽ sụp đổ, mở đường cho chúng ta tự do chiếm lấy kho báu."
 TREASURE_HUNTERS_BLACK_NEEDLE_PROJECT_TOOLTIP: "§RĐánh bại hải tặc $NAME_BlackNeedle$ tại [solar_system.GetName].§!"
 grand_archive.8560.name: "$grand_archive.8410.name$"
 grand_archive.8560.desc: "Lũ ranh con của Ness... Thật nực cười.\n\nLà mụ ta đã chọn các người - các người có biết không?\n\nCó hàng trăm giống loài để mụ ta lựa chọn... thế mà mụ lại chọn các người. Có lẽ mụ nhìn thấy ở các người một nét đặc biệt nào đó, hoặc có lẽ đây chỉ là một sự tình cờ thuần túy. Dù là gì đi nữa, chúng ta cũng đã đi đến bước đường này.\n\nCác người đã thắng... ít nhất là vào lúc này. Đừng coi nhẹ chiến thắng này. Các người đã chuốc lấy một kẻ thù vô cùng đáng sợ - chúng ta, §Y$NAME_BlackNeedle$§!. Chúng ta sẽ không bao giờ tha thứ, và cũng sẽ chẳng bao giờ quên.\n\nGiống như tổ tiên của mình, chúng ta sẽ kiên trì bám trụ. Chúng ta sẽ từ từ gây dựng lại mọi thứ đã mất. Dù phải mất một ngàn năm, hay một triệu năm đi chăng nữa - chúng ta nhất định sẽ quay lại, và đoạt lại tất cả những gì các người đã cướp khỏi tay chúng ta.\n\n$NAME_BlackNeedle$ sẽ trường tồn bất diệt! Mãi mãi!"
 grand_archive.8560.a: "Chỉ có thời gian mới trả lời được."
 grand_archive.8560.a.lom: "Cút xéo đi."
 CAPTAIN_NESS_HOARD_PROJECT: "Kho Báu Của Thuyền Trưởng Ness"
 CAPTAIN_NESS_HOARD_PROJECT_DESC: "§H$NESS_GRAND_ARCHIVE$§! đã ở ngay trước mắt.\n\nTuy bề ngoài trông có vẻ hoang vắng, nhưng nhiều hệ thống của tòa nhà vẫn đang hoạt động. Nhớ lại tính cách huyền thoại của §H$NAME_CaptainNess$§!, chúng ta nên đề phòng những hệ thống an ninh bất ngờ.\n\nLối vào duy nhất của kho báu này là một khe cắm ở cửa sập trung tâm. Chúng ta có thể cắm §H$celestial_chart$§! vào đây để mở khóa cơ sở bí ẩn này."
 grand_archive.8565.name: "Kho Báu của $NAME_CaptainNess$"
 grand_archive.8565.desc: "§Y$celestial_chart$§! là chìa khóa, còn kho báu là ổ khóa. Chúng ta cắm nó vào cửa sập chính của siêu cấu trúc.\n\nBản đồ sao kích hoạt, một tia sáng đơn lẻ chạy dọc theo bên trong, chỉ thẳng đến mọi ngôi sao mà chúng ta đã đi qua trong chuyến hành trình. Cỗ máy cổ đại kêu răng rắc, và chúng ta nhanh chóng bước vào bên trong.\n\nNhững kho báu khó tin từ cả ngàn thế giới chất thành đống trên sàn nhà và tường. Những bức tượng tinh xảo được đặt cạnh những món vũ khí tấn công đúc bằng kim loại quý. Đồ trang sức tuyệt đẹp treo lủng lẳng trên đuôi của các hóa石cổ đại, những cỗ máy phức tạp chất thành đống lộn xộn.\n\nTiếng bước chân kim loại vang lên từ lối đi trung tâm. Một cỗ máy hình người chứa đầy chất lỏng giơ hai tay đầu hàng, từ từ tiến về phía chúng ta. Mạch giọng nói của nó kêu lách tách rồi khởi động:\n\n§L\"Vậy là... cuối cùng các người cũng tìm thấy bản đồ sao của ta. Thông minh lắm.\"§!"
 grand_archive.8565.a: "Mở kênh liên lạc."
 grand_archive.8565.a.lom: "Yoho, Thuyền trưởng!"
 grand_archive.8570.desc: "§HMặc dù cơ thể máy móc hạn chế khả năng biểu cảm, nhưng cỗ máy mang tên Thuyền trưởng Ness vẫn đang nhìn chúng ta bằng ánh mắt tự mãn. Thân hình kim loại của bà ta không hề có dấu vết hao mòn, cứ như vừa mới được lắp ráp vậy. Giọng điệu của bà ta vừa kiên nhẫn vừa trịch thượng, như thể đang nói chuyện với kẻ bề dưới.§!\n\nTa nghĩ mình nên tự giới thiệu, dù có lẽ các người đã đoán ra ta là ai rồi.\n\nTa là Sanda Ness, hay ít nhất trước đây là vậy. Từng là \"Nữ hoàng Hải tặc của Biển Sao\", giờ thì làm chủ của đống bu lông ốc vít lạnh lẽo này.\n\n§HCỗ máy khựng lại một chút, quan sát hình dạng của chúng ta.§!\n\nĐã lâu lắm rồi ta không thấy sinh vật nào giống các người. Có vẻ như lũ nguyên thủy các người đã trưởng thành rồi đấy!\n\nPhải nói rằng, việc các người có thể tới được đây khiến ta vô cùng kinh ngạc."
 grand_archive.8570.a: "Ngươi sống sót bằng cách nào?"
 grand_archive.8570.a.reply_fallen_empire: "Bất tử đâu có rẻ. Ta đã phải chi vài triệu tín dụng năng lượng để nhờ các nhà khoa học của [fallen_empire.GetRealName] giúp ta chuyển đổi ý thức mà không đánh động tới ai. Bọn họ làm khá tốt đấy chứ, có điều giờ ta không còn nhảy nhót điệu nghệ như xưa nữa.\n\n$grand_archive.8570.a.reply$"
 grand_archive.8570.a.reply_curator: "Bất tử đâu có rẻ. Ta đã phải chi vài triệu tín dụng năng lượng để nhờ các nhà khoa học của $NAME_Curator_Order$ giúp ta chuyển đổi ý thức mà không đánh động tới ai. Bọn họ làm khá tốt đấy chứ, có điều giờ ta không còn nhảy nhót điệu nghệ như xưa nữa.\n\n$grand_archive.8570.a.reply$"
 grand_archive.8570.a.reply: "§HCỗ máy kích hoạt một bảng điều khiển, để lộ ra một căn phòng bí mật giấu sau bức tường. Trong một kén ngủ đông cổ đại, hài cốt của một sinh vật hữu cơ đang nằm im lìm.§!\n\nTa ở đây. Chỉ là một món đồ trang trí vô dụng, nhưng ta có chút hoài niệm. Nhìn ta đẹp đấy chứ, đúng không?\n\nSau khi đảm bảo mọi thứ đã sẵn sàng, ta khóa chặt kho báu này lại rồi chìm vào giấc ngủ suốt hàng ngàn năm. Chuyện tiếp theo là các người mở cửa, và giờ chúng ta đang đứng đây nói chuyện. Cứ như thể mới hôm qua ta vừa ngả lưng chợp mắt vậy..."
 grand_archive.8570.b: "Chỗ kho báu này ngươi lấy từ đâu?"
 grand_archive.8570.b.reply: "Đa phần là ăn cắp, hoặc dùng của cải phi pháp khác để đổi lấy. Ta từng ăn cắp đồ của tất cả những kẻ máu mặt nhất trong Biển Sao. Tàu chở hàng, siêu vũ khí, thích gì ta cướp nấy. Logic của ta là, nếu ta có thể dễ dàng lấy đồ từ tay các người, điều đó chứng tỏ các người chẳng quan tâm, cũng không xứng đáng có được nó.\n\nĐôi khi mọi việc trở nên... rất tồi tệ. Các người đã thấy những gì xảy ra với người Yter rồi đấy. Chuyện đó đã làm ta sáng mắt ra.\n\nCứ vui chơi cho đến khi không còn vui nữa..."
 grand_archive.8570.c: "Tại sao lại chọn chúng ta?"
 grand_archive.8570.c.reply: "Nếu ta nói là do ta cô đơn, các người có tin không?\n\n§HMạch giọng nói của cỗ máy phát ra những tiếng lạch cạch, có lẽ đó là cách nó cười.§!\n\nTa có cả một núi của cải này, nhưng để làm gì? Cuối cùng nó mang lại cho ta thứ gì? Ta nhận ra thứ mình muốn không phải là của cải, mà là một di sản. Thế nhưng, di sản không phải thứ có thể ăn cắp được - vậy làm sao để tạo ra nó?\n\nThế là ta vạch ra kế hoạch này. Ta tìm một vài giống loài nguyên thủy có tiềm năng nhất, rồi rải kho báu của ta khắp thế giới của họ - và tất nhiên là cả bản đồ nữa. Kẻ đầu tiên ghép được bản đồ kho báu của ta sẽ vượt qua thử thách, và đủ tư cách để kế thừa cơ nghiệp cả đời của ta. Thế là... chúng ta gặp nhau ở đây.\n\nBiết đâu giống loài của các người sẽ làm được điều mà ta không thể, và sử dụng hiệu quả tất cả những thứ này."
 grand_archive.8570.d: "Tại sao lại vứt bỏ tất cả?"
 grand_archive.8570.d.reply: "Ta đã nói với các người rồi, ta muốn truyền lại ngọn đuốc. Ta không giỏi tiêu tiền, chỉ giỏi kiếm tiền thôi.\n\nNhưng mà, ta không thể giao tiền bừa bãi cho bất cứ ai được. Bọn họ phải đủ thông minh mới đến được đây; một đội ngũ mà ta có thể tự hào. Một đội ngũ mà ta có thể chia sẻ câu chuyện của mình..."
 grand_archive.8570.e: "Câu chuyện gì của ngươi?"
 grand_archive.8570.e.reply: "Thôi được, nếu các người đã thành tâm muốn biết...\n\n§HCỗ máy kích hoạt một bảng điều khiển, một loạt hồ sơ kỹ thuật số được phóng lên tường.§!\n\nToàn bộ kho báu này chính là cuốn tự truyện của ta. Ta đã bỏ ra một khoản tiền lớn để thuê một đội ngũ nhà văn, ghi lại tất cả những khoảnh khắc đáng nhớ trong cuộc đời ta. Ta nghĩ họ đã làm khá tốt đấy chứ.\n\n§HHình ảnh chuyển sang cảnh quay buồng lái của một con tàu hải tặc, hình thể sinh học của Thuyền trưởng Ness đang đứng chỉ huy. Mạch giọng nói của cỗ máy phát ra một tiếng lách tách ngắn; đó là một tiếng thở dài.§!\n\nTa từng là tên hải tặc đáng sợ nhất trong thiên hà. Ta đã khiến các tập đoàn lớn phá sản, tống tiền các hành tinh, và san phẳng toàn bộ đế chế. Bất kỳ kẻ nào ngu ngốc đến mức dám chống lại ta, hoặc là bị [root.GetSpeciesOrganName] của ta đâm xuyên qua, hoặc là bị đem bán lấy tiền thưởng. Tiền truy nã của ta ư? Cao chót vót."
 grand_archive.8570.f: "Kể tiếp đi."
 grand_archive.8570.f.reply: "§HCác đoạn phim kỹ thuật số ghi lại các vụ cướp bóc, trộm cắp và tẩu thoát ngoạn mục đang được chiếu trên màn hình, đi kèm với đó là bản nhạc nền hùng tráng.§!\n\nLúc đầu, ta cẩn thận lựa chọn mục tiêu, tự tìm lý do chính đáng cho hành động của mình, cho rằng bọn chúng đáng bị như vậy. Mỗi phi vụ đều kịch tính hơn vụ trước. Nó như một vòng lặp: lên kế hoạch, bôi nhọ, cướp bóc, rồi ăn mừng. Khổ nỗi, việc tìm kiếm những mục tiêu \"xấu\" tốn quá nhiều thời gian. Ta cần phải mở rộng tầm nhìn.\n\nCuối cùng, hễ thích thứ gì là ta cứ thế mà lấy. Ta thích nhìn thấy những con số tăng lên, giá trị chiến lợi phẩm và cả kho báu của ta. Ta đã để lại dấu ấn của mình trên thế giới này, ta sẽ không bao giờ bị lãng quên. Mọi thứ khác đều không quan trọng."
 grand_archive.8570.g: "Thế điều gì đã làm ngươi thay đổi?"
 grand_archive.8570.g.reply: "§HQuê hương của người Yter đã trở thành một đống đổ nát.§!\n\nRồi sau đó, sự cố Yter xảy ra... Các người đã thấy rồi chứ? Ta vẫn còn nhớ như in tiếng khóc than vang lên từ radio, đó là khoảnh khắc sự sống của họ dần lụi tàn. Mọi chuyện đã đi quá xa. Đã đến lúc phải thay đổi.\n\nTrong suốt sự nghiệp của mình, ta đã phát hiện ra một quy luật: lịch sử sẽ phai mờ, những bài học sẽ bị lãng quên, và sẽ luôn có những kẻ mới đến thế chỗ của ngươi. Ta chỉ muốn được tự mình chọn người kế vị.\n\nVà người đó chính là các người. [root.GetSpeciesNamePlural] các người đã vượt qua thử thách. Chuyện gì sẽ xảy ra tiếp theo, tất cả đều phụ thuộc vào các người."
 grand_archive.8575.name: "Của Cải Vô Giá"
 grand_archive.8575.desc.default: "§Y$NESS_GRAND_ARCHIVE$§! ẩn chứa khối lượng của cải khổng lồ không thể đong đếm. Tuy nhiên, chúng ta cần phải cân nhắc kỹ lưỡng hậu quả nếu chúng ta chiếm đoạt nó làm của riêng.\n\nTừng đồng tín dụng trong kho báu của bà ta đều là tiền phi pháp. Việc nắm giữ số tài nguyên này đồng nghĩa với việc chúng ta dung túng cho những hành vi phạm pháp tày trời của $NAME_CaptainNess$ chỉ vì lòng tham vật chất.\n\nMặc dù vậy, phần lớn những nạn nhân bị $NAME_CaptainNess$ hãm hại đã khuất bóng từ lâu. Việc chiếm lấy số của cải này sẽ không tạo ra thêm bất kỳ nạn nhân nào nữa. Hơn nữa, việc chúng ta tiêu diệt §Y$NAME_BlackNeedle$§! đã góp phần làm cho thiên hà an toàn hơn. Sau khi trải qua một cuộc hành trình dài đầy rẫy hiểm nguy, chúng ta hoàn toàn xứng đáng nhận được phần thưởng hậu hĩnh này.\n\nChúng ta phải đưa ra quyết định về cách xử lý nó."
 grand_archive.8575.desc.lom: "§Y$NESS_GRAND_ARCHIVE$§! chính là kho báu tuyệt đỉnh, và chúng ta vô cùng háo hức muốn chiếm lấy chiến lợi phẩm của nó.\n\nĐây là phần thưởng xứng đáng cho việc tiêu diệt §Y$NAME_BlackNeedle$§! - vinh quang cho [this.GetName]!\n\nHãy càn quét sạch sẽ hầm chứa này. Tất cả [This.Species.GetHandNamePlural] sẵn sàng vào vị trí!"
 grand_archive.8575.a.default: "Tuyên bố sở hữu nhân danh chúng ta."
 grand_archive.8575.a.lom: "Chiếm lấy chiến lợi phẩm mà chúng ta đã phải đổ mồ hôi sôi nước mắt mới giành được."
 grand_archive.8575.b: "Trao trả lại những món đồ có thể truy xuất nguồn gốc cho chủ nhân hợp pháp của chúng."
 grand_archive.8575.c: "Chia sẻ số của cải này cho toàn cõi thiên hà."
 grand_archive.8580.name: "Ân Nhân Của Chúng Ta"
 grand_archive.8580.desc.1: "§HCỗ máy giờ đây được gọi là §Y$NAME_CaptainNess$§! tỏ ra ấn tượng với tốc độ mà chúng ta vét sạch kho báu của bà ta.§!\n\nLấy đi, các người xứng đáng có được nó. Số của cải này được đánh đổi bằng máu và nước mắt. Đừng tiêu xài phung phí ở một chỗ đấy nhé."
 grand_archive.8580.desc.2: "§HCỗ máy giờ đây được gọi là §Y$NAME_CaptainNess$§! cảm thấy khó chịu khi biết chúng ta định trả lại số kho báu mà bà ta đã cất công gom góp.§!\n\nThật đáng thất vọng. Vậy ra một tên thừa kế đời thứ mười lăm ất ơ nào đó sẽ ôm trọn đống nữ trang cũ kỹ của tổ tiên chúng. Thôi được, hy vọng các người sẽ dùng phần còn lại vào những việc có ích hơn. Mặc dù gần đây các người có làm vài chuyện ngớ ngẩn, nhưng ta tin các người sẽ xử lý ổn thỏa việc này."
 grand_archive.8580.desc.3: "§HCỗ máy giờ đây được gọi là §Y$NAME_CaptainNess$§! vô cùng ghê tởm khi biết chúng ta định đem phân phát toàn bộ gia tài của bà ta.§!\n\nKế hoạch của các người là vậy sao? Phát miễn phí cho tất cả mọi người? Bọn chúng đã làm được gì mà xứng đáng nhận được chứ? Thật là lãng phí!\n\nTa đã từng đặt nhiều kỳ vọng vào các người... ít ra hãy để ta chỉ huy một vài hạm đội của các người, cho ta cơ hội nếm trải lại cuộc đời hải tặc khi xưa."
 grand_archive.8580.desc.default: "§HVấn đề bây giờ là làm sao xử lý $NAME_CaptainNess$. Với tư cách là một phi công lão luyện, bà ta đã từng vào sinh ra tử trong vô vàn tình huống hiểm nghèo, và chắc chắn sẽ là một người chỉ huy xuất sắc cho quân đội của chúng ta. Hoặc bà ta cũng có thể đảm nhận một vị trí an toàn hơn trong hàng ngũ của chúng ta, chuyên đào tạo thế hệ phi công tiếp theo.§!"
 grand_archive.8580.desc.no_lom: "§HHoặc là chúng ta tống giam bà ta, để chứng minh cho mọi công dân thấy rằng lưới trời lồng lộng thưa mà khó lọt. Bà ta sẽ có dư dả thời gian để ngẫm lại những tội ác của mình.§!"
 grand_archive.8580.desc.gestalt: "§HQuyết định duy nhất còn lại là xử lý $NAME_CaptainNess$ ra sao. Là một bộ óc độc lập và quyền lực, bà ta có thể trở thành một vị chỉ huy độc nhất vô nhị, mang đến những chiến lược sáng tạo và bất ngờ. Hoặc chúng ta có thể hòa trộn những kinh nghiệm chiến đấu phong phú của bà ta vào trí tuệ tập thể, và dùng nó để nâng cao hơn nữa nhận thức của chúng ta về chiến tranh.\n\nHoặc đơn giản là tống giam bà ta, như một lời răn đe rằng [this.GetName] tuyệt đối không dung thứ cho sự phản bội và tội ác.§!"
 grand_archive.8580.a: "Chúng ta có thể để ngươi làm Chỉ huy hạm đội."
 grand_archive.8580.a.tt: "Nhận được một §YChỉ huy Hạm đội Bất tử§! cấp 10"
 grand_archive.8580.b: "§YChúng ta sẽ hợp nhất tri thức của ngươi vào ý thức của mình.§!"
 grand_archive.8580.c: "§YGiúp chúng ta huấn luyện phi công mới.§!"
 grand_archive.8580.d: "§RNgươi cứ bóc lịch trong tù đi.§!"
 grand_archive.8585.desc: "Thế là xong?\n\nCác người định vứt bỏ ta sao?\n\nThật đáng thất vọng... Ta nghĩ mình nên rời đi thì hơn.\n\nChúc may mắn nhé, ta nghĩ vậy."
 grand_archive.8585.a: "Chúng ta không nợ nần gì ngươi cả."
 grand_archive.8590.desc: "Đồ ngốc nghếch rỗng tuếch! Ta cho các người cả thế giới, các người lại chỉ đáp lại ta bằng một chiếc còng mới? Các người không xứng đáng nhận được những gì ta ban cho! Các người thậm chí còn không đáng xách dép cho ta!\n\nNguyền rủa các người sẽ để lại một vết nhơ vĩnh viễn trên [this.GetName]!\n\nCầu cho lũ [this.species.GetRemnantNamePlural] các người héo mòn trong Hư Không, và tên tuổi của các người sẽ chìm vào quên lãng."
 grand_archive.8590.a: "Lưới trời lồng lộng, tuy thưa mà khó lọt."
 grand_archive.8595.name: "$NAME_CaptainNess$ Bị Vô Hiệu Hóa"
 grand_archive.8595.desc: "Người ta phát hiện ra tù nhân máy mang tên §Y$NAME_CaptainNess$§! đã ngừng hoạt động trong buồng giam. Chúng ta tin rằng bà ta đã cố ý gây ra sự cố đoản mạch nghiêm trọng, làm sập các hệ thống trọng yếu và xóa sạch mọi dữ liệu được lưu trữ từ ý thức đã chuyển giao của mình. Trên vách buồng giam có để lại một dòng tin nhắn được viết ngoệch ngoạc:\n\n§LĐồng quy vu tận cùng các người...§!"
 grand_archive.8595.a: "Đáng đời."
 grand_archive.8600.name: "Nơi Chân Cầu Vồng"
 grand_archive.8600.desc.common: "Bây giờ là lúc tự tay kiến tạo nên vận mệnh của chính mình. Không còn tinh đồ nào để nương theo nữa, những vì sao sẽ là kim chỉ nam dẫn lối cho chúng ta.\n\nChúng ta sẽ đạt được những thành tựu gì? Hậu thế sẽ nhớ đến chúng ta như thế nào?"
 grand_archive.8600.desc.default: "Chuyến phiêu lưu đã đến hồi kết. Nhiệm vụ tìm kiếm kho báu của §HThuyền trưởng Ness§! đã hoàn thành.\n\n$grand_archive.8600.desc.common$\n\nĐây mới là điểm bắt đầu thực sự cho câu chuyện của [this.GetName]."
 grand_archive.8600.desc.lom: "Sẽ có biết bao câu chuyện được thêu dệt về chuyến phiêu lưu này! Chúng ta đã tìm ra kho báu giấu kín của Thuyền trưởng Ness, và không một ai có thể ngáng đường chúng ta.\n\n$grand_archive.8600.desc.common$\n\nHãy giương cao ngọn cờ của [this.GetName], bây giờ câu chuyện của chúng ta mới thực sự bắt đầu!"
 grand_archive.8600.a.default: "Tiến lên!"
 grand_archive.8600.a.lom: "Yohoho!"
 valuable_insight: "Góc Nhìn Giá Trị"
 grand_archive.9960.name: "$tech_alien_cloning$"
 grand_archive.9960.desc: "Chúng ta đã bắt được những bầy thú không gian hoang dã đầu tiên tại [from.solar_system.GetName]. Chúng ta tin rằng chỉ cần đầu tư đủ nguồn lực khoa học, việc nhân bản thêm nhiều sinh vật như thế này là hoàn toàn khả thi."
 grand_archive.9960.a: "$valuable_insight$"
 grand_archive.9970.name: "Tiềm Năng Đột Biến"
 grand_archive.9970.desc: "Đã nhân bản thành công lứa thú không gian đầu tiên tại [from.solar_system.GetName].\n\nNghiên cứu chuyên sâu của chúng ta về sinh học ngoại lai chỉ ra rằng, nếu muốn, chúng ta có thể cường hóa hơn nữa các đặc điểm sinh lý của những sinh vật này. Điều này sẽ cho phép chúng ta trang bị các bộ phận chiến đấu chuyên dụng cho hạm đội sinh học của mình."
 grand_archive.9970.a: "$valuable_insight$"
 opinion_return_traceable_items_tier_1: "Nhà Từ Thiện Thiên Hà"
 opinion_return_traceable_items_tier_1_tt: "§G+$@opinion_return_traceable_items_tier_1_value|0$§!£opinion£ đối với tất cả các đế chế không cuồng sát chưa giao chiến với chúng ta."
 opinion_return_traceable_items_tier_2: "$opinion_return_traceable_items_tier_1$"
 opinion_return_traceable_items_tier_2_tt: "§G+$@opinion_return_traceable_items_tier_2_value|0$§!£opinion£ đối với tất cả các đế chế không cuồng sát chưa giao chiến với chúng ta."
 wealth_distribute_favor_tier_1_tt: "Nhận được §Y1§! ủng hộ ngoại giao từ mỗi đế chế."
 wealth_distribute_favor_tier_2_tt: "Nhận được §Y2§! ủng hộ ngoại giao từ mỗi đế chế."
 leader_trait_pirate_queen: "Nữ Hoàng Hải Tặc"
 leader_trait_pirate_queen_desc: "Những năm tháng đắm mình trong mưu mô xảo quyệt và những chuyến phiêu lưu kỳ lạ đã nhào nặn nên một nhà lãnh đạo không bao giờ chấp nhận ra về tay trắng."
 captain_ness_leader_desc: "Ý thức của một nữ hoàng hải tặc cổ đại vẫn đang tiếp tục tồn tại bên trong một cơ thể cơ khí. Bà ta đã từng gieo rắc kho báu ở vô số hành tinh."
 captain_ness_leader_catch_phrase: "Hãy cùng nhau kề vai sát cánh, dệt nên những truyền thuyết vang danh muôn đời."
