 ###################
 TREASURE_TROVE: "Kho Báu Trân Châu"
 TREASURE_TROVE_DESC: "Đã dò thấy một §Y$TREASURE_TROVE$§! bị thất lạc từ lâu của một tên cướp biển ở đâu đó bên trong [this.GetName]. Không ai biết chính xác bên trong giấu bao nhiêu của cải..."
 treasure_troves_chain_title: "Kho Báu Trân Châu"
 treasure_troves_chain_desc: "Nhiều thế hệ cướp biển trong thiên hà đã cất giấu những món hời bất chính của chúng vào trong những kho báu được ngụy trang tinh vi. Nhiều kho báu bí mật đã bị bỏ hoang hoặc bị cho là đã thất lạc, nhưng giờ đây chúng là vật trong túi của chúng ta."
 mod_treasure_trove_reward_mult: "Phần Thưởng Kho Báu Trân Châu"
 grand_archive.6010.name: "Phát Hiện $TREASURE_TROVE$"
 grand_archive.6010.desc: "Chúng ta đã bắt được một tín hiệu yếu ớt từ bên trong [event_target:treasure_trove_planet.GetName]. Dựa trên kết quả giải mã sơ bộ, chúng ta tin rằng đây là một §Y$TREASURE_TROVE$§! bị thất lạc từ lâu của cướp biển.\n\nMặc dù sẽ tốn không ít công sức, nhưng chúng ta tin rằng mình có thể khai quật được những bí mật ẩn chứa bên trong."
 grand_archive.6010.a: "Tìm vị trí của nó."
 grand_archive.6015.name: "Thu Hồi Kho Báu"
 grand_archive.6015.common.1: "Sau khi cẩn thận vô hiệu hóa hệ thống vũ trang của §Y$TREASURE_TROVE$§! do bọn cướp biển giấu tại [event_target:treasure_trove_planet.GetName]"
 grand_archive.6015.desc: "$grand_archive.6015.common.1$, chúng ta đã tìm thấy một rương tài nguyên vô giá.\n\nChúng ta sẽ tận dụng tốt món hời ngoài dự kiến này."
 grand_archive.6015.desc.specimen: "$grand_archive.6015.common.1$, chúng ta đã tìm thấy một cổ vật hải tặc bên trong một hộp chứa niêm phong. Mảnh ghép lịch sử hải tặc này sẽ được bổ sung vào bộ sưu tập của chúng ta."
 grand_archive.6015.desc.specimen_extra: "Ngoài ra, chúng ta còn tìm thấy một cổ vật hải tặc bên trong §Y$TREASURE_TROVE$§! khổng lồ. Bằng cách phục chế cẩn thận, mảnh ghép lịch sử hải tặc này sẽ được bổ sung vào bộ sưu tập của chúng ta."
 grand_archive.6015.desc.pirate_ship: "Sau khi cẩn thận bẻ khóa §Y$TREASURE_TROVE$§! bị thất lạc, chúng ta phát hiện ra những chỉ dẫn mờ nhạt hướng đến một địa điểm trên hành tinh bên dưới. Tại đó, chúng ta lại phát hiện ra một chiến hạm hải tặc đáng kinh ngạc được bảo vệ bởi một mảng chống dò tìm.\n\nCon tàu này có tên là [treasure_trove_pirate_ship.GetName], và hiện đã được bổ sung vào quân đội của chúng ta."
 grand_archive.6015.desc.tech: "$grand_archive.6015.common.1$, chúng ta đã phát hiện ra một cơ sở dữ liệu chứa những luận văn nghiên cứu quý giá.\n\nChưa rõ nguồn gốc của chúng, nhưng chúng ta có thể tận dụng tốt những luận văn này."
 grand_archive.6015.a: "$GOOD$"
 treasure_trove_specimen_tt: "$t$Lấy lại một ['concept_specimen']."
 treasure_trove_pirate_ship_tt: "$t$Lấy lại một tàu cướp biển quân sự."
