 wildlife_ranch: "Trại thú hoang dã"
 wildlife_ranch_desc: "Chúng ta sống hòa hợp với các sinh vật bản địa, nỗ lực hết sức để bảo vệ môi trường sống của chúng và thúc đẩy sự phát triển bền vững của loài."
 wildlife_ranch_2: "Khu vực thú hoang dã"
 wildlife_ranch_2_desc: "Quản lý hệ sinh thái một cách bài bản đã cải thiện điều kiện sống cho các loài bản địa và thúc đẩy ngành chăn nuôi phát triển."
 wildlife_ranch_3: "Trung tâm thú hoang dã"
 wildlife_ranch_3_desc: "Đây là một cơ sở rộng lớn nơi động vật có thể tự do đi lại. Để tối đa hóa chất lượng tài nguyên mà chúng cung cấp, nơi đây mang đến một môi trường sống tiện nghi và xa hoa."
 hunting_grounds: "Bãi săn bắn"
 hunting_grounds_desc: "Đây là trung tâm huấn luyện để làm chủ các kỹ năng săn bắn đa dạng. Từ vũ khí năng lượng hiện đại đến các khí tài võ thuật truyền thống, chỉ có sự linh hoạt và kỹ năng vô song mới có thể chiến thắng những con mồi đáng sợ và biến chúng thành chiến tích."
 hunting_grounds_2: "Vùng săn bắn"
 hunting_grounds_2_desc: "Một cơ sở huấn luyện và giám sát cung cấp điều kiện tối ưu cho các loài thú trong bãi săn. Công nghệ tầm nhiệt giúp nhận diện những dấu vết mới nhất của động vật và tìm ra những con mồi thượng hạng."
 hunting_grounds_3: "Trung tâm săn bắn"
 hunting_grounds_3_desc: "Đây là khu vực rộng lớn hỗ trợ các đội săn quy mô hành tinh. Nơi đây được trang bị vũ khí và thiết bị theo dõi chất lượng cao nhất, thợ săn được đào tạo chuyên sâu để tối đa hóa số lượng và chất lượng con mồi hạ được."
 wildlife_sanctuary: "Khu bảo tồn thú hoang"
 wildlife_sanctuary_desc: "Đây là một khu vực được bảo vệ, nơi động vật hoang dã được nghiên cứu trong môi trường sống tự nhiên. Có các biện pháp đảm bảo để ngăn chặn sự mất ổn định quần thể hoặc dịch bệnh tràn lan. Nghiên cứu những sinh vật này bản thân nó là một công trình học thuật giá trị, nhưng quan trọng nhất, nó giúp chúng ta hiểu thêm về bản chất của chính mình."
 wildlife_sanctuary_2: "Khu bảo tồn tiên tiến"
 wildlife_sanctuary_2_desc: "Các sinh vật ở đây nhận được sự chăm sóc cá nhân hóa, đáp ứng nhu cầu ăn uống và y tế độc đáo của chúng trong khi giảm thiểu tối đa sự can thiệp vào môi trường tự nhiên. Các hệ sinh thái chuyên biệt cho phép nhân giống và tái nhập các loài đang gặp nguy hiểm."
 wildlife_sanctuary_3: "Trung tâm bảo tồn"
 wildlife_sanctuary_3_desc: "Động vật ở đây được giám sát và chăm sóc bởi hệ thống cơ sở hạ tầng tinh vi đến mức gần như không thể nhận ra sự hiện diện của nó. Các nhà nghiên cứu bị cấm can thiệp vào hành vi tự nhiên của đối tượng, từ đó đảm bảo thu thập được dữ liệu khoa học chất lượng cao nhất."
 primal_arena: "Đấu trường hoang dã"
 primal_arena_desc: "Một đấu trường nơi những chiến binh mạnh mẽ nhất của chúng ta chiến đấu với những con thú dữ theo cách nguyên thủy. Không gì giải trí phấn khích hơn việc xem một anh hùng chiến thắng dã thú, hoặc hy sinh anh dũng trên chiến trường."
 primal_arena_2: "Sân huấn thú hoang"
 primal_arena_2_desc: "Trong sân vận động khổng lồ này, các đàn thú dưới sự hướng dẫn của những người huấn luyện dày dạn, đang rèn luyện kỹ năng tấn công của mình. Các đấu thú sĩ không còn có thể chỉ dựa vào sức mạnh cơ bắp để khống chế con mồi: họ phải thông minh hơn cả những người huấn luyện thú để có thể sống sót."
 primal_arena_3: "Đại đấu trường hoang dã"
 primal_arena_3_desc: "Một đấu trường gây kinh ngạc, được thiết kế chuyên dụng để tổ chức những trận săn thú sử thi. Mỗi trận đấu cần nhiều tuần chuẩn bị và có sức chứa hàng triệu khán giả."
 symbiosis_nexus: "Nút thắt cộng sinh"
 symbiosis_nexus_desc: "Một khu bảo tồn tự nhiên nơi những người bạn hoang dã có thể gia nhập vào đại gia đình của chúng ta. Mỗi sinh vật đều đóng góp những giá trị độc đáo vào mạng lưới tâm trí chung."
 symbiosis_nexus_2: "Vùng cộng sinh"
 symbiosis_nexus_2_desc: "Một khu dự trữ trung tâm dùng để nhóm các người bạn hoang dã của chúng ta thành các quần thể nhỏ tự duy trì. Phối hợp năng lực tinh thần thấp hơn của chúng để cung cấp sự ổn định tư duy cho mạng lưới tư duy lớn hơn."
 symbiosis_nexus_3: "Trung tâm cộng sinh"
 symbiosis_nexus_3_desc: "Một trục trung tâm rộng lớn, được thiết kế để hội tụ tâm trí của mọi sinh vật, cung cấp năng lượng cho ý thức tập thể của chúng ta."
 edict_space_fauna_exhibition: "Triển lãm quái thú không gian"
 space_fauna_exhibition: "$edict_space_fauna_exhibition$"
 edict_space_fauna_exhibition_desc: "Các chủ trang trại từ khắp các hành tinh trong thiên hà sẽ trưng bày những vật nuôi quý giá của họ và tranh tài cho giải thưởng \"Trình diễn xuất sắc nhất\" đầy khao khát."
 edict_beasts_burden: "Kiếp súc nô"
 beasts_burden: "$edict_beasts_burden$"
 edict_beasts_burden_desc: "Những con vật bền bỉ nhất của chúng ta nên gánh vác những công việc nặng nhọc nhất."
 edict_creature_welfare: "Phúc lợi sinh vật"
 creature_welfare: "$edict_creature_welfare$"
 edict_creature_welfare_desc: "Chúng ta có trách nhiệm đảm bảo những sinh vật mình chăm sóc có chất lượng cuộc sống tốt nhất."
 edict_crack_the_whip: "Vung roi răn đe"
 crack_the_whip: "$edict_crack_the_whip$"
 edict_crack_the_whip_desc: "Bất kể giống loài, mọi sinh vật đều phản ứng tương tự với nỗi đau. Điểm mấu chốt là học cách gây ra nỗi đau đúng cách."
 edict_exotic_network: "Mạng lưới thần kinh ngoại lai"
 exotic_network: "$edict_exotic_network$"
 edict_exotic_network_desc: "Các dạng sống hữu cơ thấp kém mà chúng ta quản lý có năng lực tư duy đủ để cung cấp băng thông cho các tính toán phức tạp hơn."
 edict_defensive_instincts: "Bản năng tự vệ"
 defensive_instincts: "$edict_defensive_instincts$"
 edict_defensive_instincts_desc: "Chúng ta là một, hãy để bản năng của chúng ta hòa quyện vào nhau giữa hư không lạnh lẽo này."
 edict_biological_overdrive: "Quá tải sinh học"
 biological_overdrive: "$edict_biological_overdrive$"
 edict_biological_overdrive_desc: "Thông qua việc lắp đặt các thụ thể thần kinh não phù hợp, chúng ta có thể ép các sinh vật bậc thấp tới giới hạn của chúng."
 grand_archive.1060.name: "Xác thối của [from.GetSpaceFaunaName]"
 grand_archive.1060.desc: "Sau khi thiết lập mối liên kết với [from.GetSpaceFaunaNamePlural], chúng ta đã tìm thấy một cái xác đang phân hủy của loài này tại [fromfrom.GetName]. Những phần còn lại đã trở nên khô khốc và đông cứng sau thời gian dài tiếp xúc với không gian.\n\nChúng tôi suy đoán rằng cái xác này là yếu tố chính thu hút các thành viên khác của loài; có lẽ họ vẫn đang tìm kiếm thành viên mất tích trong [from.GetSpaceFaunaGroup] của mình. Đây là một cơ hội hiếm có để nghiên cứu các đặc tính sinh học của [from.GetSpaceFaunaName] chết một cách tự nhiên trong hư không."
 TIYANKI_GROUP_NAME: "Đàn cá voi"
 SPACE_AMOEBA_GROUP_NAME: "Bầy Sâu"
 CRYSTAL_GROUP_NAME: "Bầy Tinh Thể"
 VOIDWORM_GROUP_NAME: "Bầy Sâu"
 CUTHOLOID_GROUP_NAME: "Quần Thể"
 voidworm_carcass_01_object: "Xác Sâu Hư Không"
 carcass_01_object: "Xác Thú Không Gian"
 CARRION_DEBRIS_PROJECT: "Giải Phẫu [met_critter.GetSpaceFaunaName]"
 CARRION_DEBRIS_PROJECT_DESC: "Phát hiện một xác [met_critter.GetSpaceFaunaName] tại [contact_system.GetName]. Việc nghiên cứu xác của sinh vật hoang dã này sẽ giúp chúng ta hiểu sâu hơn về các loài sinh vật không gian."
 grand_archive.1065.name: "Hoàn Tất Giải Phẫu"
 grand_archive.1065.desc: "Quá trình khám nghiệm xác [met_critter.GetSpaceFaunaName] tại [contact_system.GetName] đã hoàn tất. Chúng tôi đã trích xuất được một mẫu sinh học còn nguyên vẹn từ cái xác, mang lại một góc nhìn độc đáo về cấu trúc sinh lý của chúng."
 grand_archive.1065.specimen_tt: "['concept_specimen'] §MSử Thi§! Đặc Trưng Của Bầy Thú"
 NAME_BoneShip: "Tàu Xương"
 NAME_BoneShip_desc: "Con tàu này được trang trí bằng xúc tu của Tiyanki trưởng thành, những hàng răng của Sâu Hư Không, và hộp sọ của một sinh vật mà chúng ta chưa từng thấy. Nó được trang bị đủ loại vũ khí tinh vi và trông đầy sát khí."
 grand_archive.1069.name: "$NAME_BoneShip$"
 grand_archive.1069.desc: "Chúng ta đã liên lạc với một con tàu vũ trụ được độ chế kỳ lạ đến từ [from.GetName]. $NAME_BoneShip_desc$\n\nSau khi ngây thơ chấp nhận lời mời đàm phán của chúng ta, viên phi công đã ngay lập tức bị [GetExecuted]. Chúng ta đã chiếm đoạt con tàu quái dị của hắn và sung vào đội hình quân sự. Chúng ta cũng tìm thấy một cuốn cẩm nang công cụ thợ săn hữu ích trong đồ đạc cá nhân của hắn."
 grand_archive.1069.a: "Món quà chào mừng."
 EXECUTED: "xử tử"
 DEVOURED: "ăn thịt"
 grand_archive.1070.name: "$NAME_BoneShip$"
 grand_archive.1070.desc: "Chúng ta nhận được liên lạc từ một con tàu vũ trụ được độ chế kỳ lạ đến từ [from.GetName]. $NAME_BoneShip_desc$\n\nHọ đang phát tín hiệu chào trên mọi tần số."
 grand_archive.1070.a: "Mở kênh liên lạc."
 NAME_PrimalHunter: "Seris Kohar"
 primal_hunter_desc: "Một thợ săn lão luyện lang thang khắp thiên hà để tìm kiếm những con mồi lớn."
 primal_hunter_catchphrase: "§L\"Tôi muốn tìm chiến lợi phẩm tiếp theo cho bộ sưu tập của mình.\"§!"
 grand_archive.1075.name: "$grand_archive.1070.name$"
 grand_archive.1075.desc: "§HGiọng trầm của Seris khô khốc và khàn khàn, như thể đã nhiều tuần không nói chuyện. Người này nói năng thẳng thắn, giữ ánh mắt bình tĩnh, vừa tỏ vẻ tôn trọng, vừa mang lại chút cảm giác uy hiếp.§!\n\nLà một nhà sưu tập con mồi, để làm tôi ấn tượng không dễ đâu. Các người làm được rồi đấy.\n\nTôi sẵn lòng gia nhập đội đi săn của các người, nhưng với điều kiện sự hợp tác của chúng ta phải dựa trên sự đôi bên cùng có lợi và học hỏi lẫn nhau."
 grand_archive.1075.a: "Ngươi là ai?"
 grand_archive.1075.a.reply: "Tôi là $NAME_PrimalHunter$, tôi đã đi săn ở những hệ sao này nhiều năm rồi. Tôi đang tìm kiếm con mồi mới, và người của các vị có vẻ là những người theo dấu tài năng.\n\nĐộng cơ của tôi rất đơn giản: Khoái cảm của việc đi săn."
 grand_archive.1075.b: "Cái hộp sọ trên tàu của ngươi là gì vậy?"
 grand_archive.1075.b.reply: "Đó là con cuối cùng của loài đó, nó đã chống trả rất quyết liệt."
 grand_archive.1075.c: "Ngươi đã quan sát chúng ta bao lâu rồi?"
 grand_archive.1075.c.reply: "Rõ ràng là người của các vị còn nhiều điều phải học hỏi.\n\nMột thợ săn giỏi có thể rình rập con mồi trong một thời gian dài. Sự chí mạng thực sự đòi hỏi phải tàng hình trước khi nổ súng. Thời gian tôi ẩn mình trong bóng tối không quan trọng, quan trọng là tôi chọn thời điểm nào để lộ diện."
 grand_archive.1075.d: "Tại sao lại muốn gia nhập với chúng ta?"
 grand_archive.1075.d.reply: "Tôi không tìm kiếm sự cạnh tranh trên bãi săn. Mặc dù không thích chia sẻ lãnh thổ, nhưng tôi thà chiến đấu sát cánh cùng thợ săn của các vị, còn hơn là đánh nhau sống chết vì cùng một con mồi.\n\nDù các vị theo dấu thứ gì, tôi cũng sẽ giết nó."
 grand_archive.1075.hire: "Chiêu mộ"
 grand_archive.1075.hire_tt: "§Y$NAME_PrimalHunter$§! gia nhập đế chế của chúng ta với tư cách là một §HLãnh đạo§!."
 grand_archive.1075.dismiss: "Bỏ qua"
 grand_archive.1080.name: "Nhà Sinh vật học Ngoại lai Lang thang"
 grand_archive.1080.desc: "Một con tàu nghiên cứu liên sao độc lập đã liên lạc với căn cứ sao của chúng ta tại [from.GetName]. Con tàu này được trang bị một loạt thiết bị bắt giữ và công cụ phân tích, chuyên dùng để bắt và nghiên cứu sinh vật không gian.\n\nHọ đang phát tín hiệu chào trên mọi tần số."
 grand_archive.1080.a: "Mở kênh liên lạc."
 NAME_PrimalRancher: "Ruk Chabluk"
 primal_rancher_desc: "Cô là một nhà sinh vật học ngoại lai đam mê khảo sát thực địa, từng nghiên cứu vô số loài sinh vật không gian."
 primal_rancher_catchphrase: "§L\"Sinh vật nào cũng có một câu chuyện để kể, và tôi là một người nghe nhiệt tình!\"§!"
 grand_archive.1085.desc: "§HĐôi mắt của Ruk chớp liên tục, dán chặt vào một thiết bị cầm tay nhỏ gọn, ánh mắt tò mò và phân tích của cô thật ấn tượng. Ngay cả khi đang chào chúng ta, cô dường như vẫn đang ghi chép. Dù vậy, thái độ của cô vẫn thân thiện và chuyên nghiệp, chỉ hơi có chút xa cách.§!\n\nTôi nhận ra đam mê của mình với sinh vật không gian không phải là cá biệt. Tôi đã tìm hiểu các nghiên cứu mà [root.GetName] đang tiến hành, chúng thực sự rất truyền cảm hứng. Tôi vô cùng hy vọng được gia nhập bộ phận khoa học của các vị, để đóng góp sức mình cho những nỗ lực này. Tất nhiên, nếu các vị sẵn lòng."
 grand_archive.1085.a: "Cô là ai?"
 grand_archive.1085.a.reply: "Xin lỗi, tôi hơi nóng vội.\n\nTôi tên là Ruk, một nghiên cứu viên thực địa chuyên về các bầy thú không gian. Tôi và nhóm của mình thu thập dữ liệu về mô hình di cư, cấu trúc cơ thể và sự đa dạng sinh học trong thiên hà.\n\nTừ nhỏ tôi đã thích động vật. Đi đâu tôi cũng mang theo thú cưng Fufu của mình."
 grand_archive.1085.b: "Fufu?"
 grand_archive.1085.b.reply: "Người bạn nhỏ tôi yêu nhất trong cả thiên hà!\n\nTôi định cho nó lên màn hình, nhưng nó đang ngủ mất rồi. Ở hành tinh quê hương tôi, chúng tôi nuôi loài sinh vật này làm thú cưng, tôi đã nhận nuôi nó trong lần về thăm nhà gần nhất. Đáng yêu lắm: nghe tiếng móng guốc nhỏ lạch cạch trên sàn kim loại, dáng vẻ nó gặm lông vũ của tôi, và cả chỏm lông giữa hai con mắt nhỏ nữa. Tôi tin là nó cũng sẽ khiến các vị mê mẩn, khi... nếu chúng ta bắt đầu làm việc cùng nhau."
 grand_archive.1085.c: "Cô tìm thấy chúng tôi bằng cách nào?"
 grand_archive.1085.c.reply: "Một mẫu vật mà chúng tôi theo dõi có hành vi bất thường, nên chúng tôi đã lần theo dấu vết của nó. Tại đó, chúng tôi phát hiện đội nghiên cứu của các vị đang tương tác với đối tượng nghiên cứu của chúng tôi. Sự chăm sóc tỉ mỉ của các vị dành cho những sinh vật này thể hiện sự tôn trọng thực sự đối với sự sống trong không gian, điều này đã thôi thúc tôi tìm hiểu về nghiên cứu của các vị, và nó đã gây ấn tượng sâu sắc cho tôi. Tôi luôn tìm kiếm những người đồng nghiệp có cùng chí hướng."
 grand_archive.1085.d: "Tại sao lại muốn gia nhập với chúng tôi?"
 grand_archive.1085.d.reply: "Thành thật mà nói, làm nghiên cứu khoa học tự do không mang lại thu nhập ổn định. Tôi tin tưởng vững chắc vào công việc của mình, nhưng dành cả đời để tìm kiếm tài trợ sẽ ngốn quá nhiều thời gian, khiến tôi không thể tập trung vào phần cốt lõi của khoa học.\n\nGia nhập [root.GetName], tôi sẽ có thể dành toàn bộ thời gian cho lĩnh vực mình giỏi nhất: nghiên cứu sự sống không gian. Tôi sẽ có thêm nhiều tài nguyên, và có thể hợp tác với các nhóm khoa học hiện có của quốc gia các vị để cùng nhau đạt được mục tiêu."
 grand_archive.1085.hire: "Chiêu mộ"
 grand_archive.1085.hire_tt: "§Y$NAME_PrimalRancher$§! gia nhập đế chế của chúng ta với tư cách là một §HLãnh đạo§!."
 grand_archive.1085.dismiss: "Bỏ qua"
 grand_archive.1100.name: "Tiếng Rít Của Quái Thú"
 grand_archive.1100.desc: "Chúng ta phát hiện một lượng lớn sóng điện từ kỳ lạ phát ra từ một vùng không gian chưa biết.\n\nPhân tích sơ bộ cho thấy những sóng này giống với tín hiệu giao tiếp của §YSâu Hư Không§!, nhưng bất thường hơn và có biên độ cao hơn nhiều. Chúng ta sẽ tiến hành điều tra thêm về hiện tượng này."
 grand_archive.1100.a: "Đáng lo ngại đấy."
 grand_archive.1105.name: "Sâu Hư Không Gào Thét"
 grand_archive.1105.desc: "Chúng ta đã xác định được nguồn gốc của những tiếng gào thét như dã thú này: một hệ sao ẩn nấp, chứa đầy §YSâu Hư Không§!, nằm ngay gần [frenzied_voidworms_target.solar_system.GetName].\n\nSâu Hư Không ở hệ sao này rất khác với những con chúng ta từng chạm trán. Những sinh vật này đã bị đột biến; thay vì tạo thành dạng ba đầu, các cá thể trưởng thành đơn lẻ đang thực hiện những hành vi mà chỉ có thể miêu tả là một cuộc giao phối điên cuồng.\n\nĐiều này rất đáng báo động: hành vi phi ký sinh này có nghĩa là bầy sâu này có thể tự sinh sản độc lập mà không cần đến vật chủ hành tinh."
 grand_archive.1105.desc_no_homicidal: "\nNếu để loài đột biến này lan tràn mất kiểm soát, nó có thể phá hủy hoàn toàn sự cân bằng của hệ sinh thái thiên hà. Dựa trên mức độ hung hăng ngày càng tăng, chúng tôi tin rằng những sinh vật này đang chuẩn bị tiến công [frenzied_voidworms_target.GetName]."
 grand_archive.1105.desc_2: "\nChúng ta phải chuẩn bị sẵn sàng tuyến phòng thủ của mình."
 grand_archive.1105.a: "Báo động đỏ!"
 situation_frenzied_voidworms: "Sâu Hư Không Cuồng Loạn"
 situation_frenzied_voidworms_type: "$situation_frenzied_voidworms$"
 situation_frenzied_voidworms_desc: "Chúng ta đã phát hiện một tổ Sâu Hư Không khổng lồ, rõ ràng là đã bị đột biến. Chúng có xu hướng tấn công rất cao và dường như có khả năng sinh sản không qua ký sinh.\n\nSự hiện diện của chúng ta có vẻ đã chọc giận cái tổ của chúng. Chúng ta phải hành động thật cẩn thận.\n\n[GetVoidwormsHostility]"
 situation_frenzied_voidworms_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 finisher_effects_frenzied_voidworms: "Bầy Sâu Hư Không hung hăng có thể sẽ tấn công thủ đô của chúng ta."
 approach_frenzied_voidworms_do_nothing: "Án binh bất động"
 approach_frenzied_voidworms_do_nothing_tt: "Hiện tại chúng ta sẽ không thực hiện hành động đặc biệt nào."
 approach_frenzied_voidworms_hide_presence: "Che giấu sự hiện diện"
 approach_frenzied_voidworms_hide_presence_tt: "Mọi hoạt động xây dựng trong các hệ sao của chúng ta nằm gần hệ sao quê hương của chúng nhất sẽ bị đình chỉ."
 approach_frenzied_voidworms_stir_nests: "Kích động tổ sâu"
 approach_frenzied_voidworms_stir_nests_tt: "Chọc giận những sinh vật này sẽ khoét sâu thêm sự thù địch của chúng đối với chúng ta."
 approach_frenzied_voidworms_feed_nests: "Nuôi dưỡng tổ sâu"
 approach_frenzied_voidworms_feed_nests_tt: "Nếu chúng ta có thể làm giảm bớt tính hung hăng của chúng đến mức vừa đủ, thì có khả năng sẽ lấy được lòng tin của chúng."
 #Chuỗi cho kịch bản kích hoạt GetVoidwormsHostility
 voidworms_hostility_hostile: "Sâu Hư Không đột biến đang biểu hiện §Pmức độ hung hăng cực cao§!."
 voidworms_hostility_neutral: "Sâu Hư Không đột biến đang biểu hiện §Smột mức độ hung hăng nhất định§!."
 voidworms_hostility_pacified: "Sâu Hư Không đột biến đang tỏ ra §Bngoan ngoãn§!."
 hide_presence_modifier: "$approach_frenzied_voidworms_hide_presence$"
 hide_presence_starbase_modifier: "$approach_frenzied_voidworms_hide_presence$"
 frenzied_voidworms_killed.desc.common: "Chúng ta đã giữ lại cái tổ lớn nhất của bọn sinh vật đột biến kỳ lạ này. Dưới sự kiểm soát của mình, chúng ta có thể lai tạo thêm giống sinh vật độc đáo này mà không phải lo sợ chúng lây lan mất kiểm soát khắp thiên hà."
 grand_archive.1165.name: "Sâu Hư Không Đột Biến Bị Tiêu Diệt"
 grand_archive.1165.desc.common: "Không muốn ngồi chờ một cuộc tấn công sớm muộn gì cũng tới, chúng ta đã phát động thành công một chiến dịch quân sự nhắm vào bầy Sâu Hư Không đột biến ngay tại hệ sao quê nhà của chúng. Mối đe dọa từ những sinh vật này sẽ không còn bao trùm lấy [frenzied_voidworms_target.GetName] nữa, sự an toàn của hành tinh chúng ta"
 grand_archive.1165.desc.default: "$grand_archive.1165.desc.common$ cùng sự cân bằng sinh thái của cả thiên hà đã được đảm bảo.\n\n$frenzied_voidworms_killed.desc.common$"
 grand_archive.1165.desc.homicidal: "$grand_archive.1165.desc.common$ đã được đảm bảo.\n\n$frenzied_voidworms_killed.desc.common$"
 grand_archive.1165.a: "Một chiến thắng."
 grand_archive.1170.name: "Sâu Hư Không Đột Biến Bị Nhổ Cỏ Tận Gốc"
 grand_archive.1170.desc.common: "Sâu Hư Không đột biến đã bị quét sạch. Mối đe dọa từ những sinh vật này sẽ không còn bao trùm lấy [frenzied_voidworms_target.GetName] nữa, sự an toàn của hành tinh chúng ta"
 grand_archive.1170.desc.default: "$grand_archive.1170.desc.common$ cùng sự cân bằng sinh thái của cả thiên hà đã được đảm bảo.\n\n$frenzied_voidworms_killed.desc.common$"
 grand_archive.1170.desc.homicidal: "$grand_archive.1170.desc.common$ đã được đảm bảo.\n\n$frenzied_voidworms_killed.desc.common$"
 grand_archive.1170.a: "$grand_archive.1165.a$"
 grand_archive.1180.name: "Phát Hiện Sâu Hư Không Đột Biến"
 grand_archive.1180.desc: "Sau khi tiêu diệt một ổ Sâu Hư Không gần hang ổ của chúng, chúng ta phát hiện những sinh vật này đã trải qua một dạng đột biến độc đáo.\n\nChúng dường như có khả năng sinh sản không cần ký sinh, và luôn trong trạng thái cực kỳ hung hăng, điều này giải thích cho sức mạnh và độ dẻo dai phi tự nhiên của chúng.\n\nMay mắn thay, chúng ta đã giữ lại được một cái tổ của chúng làm chiến lợi phẩm. Dưới sự kiểm soát của mình, chúng ta có thể lai tạo thêm giống sinh vật độc đáo này mà không phải đối mặt với rủi ro chúng lan tràn mất kiểm soát khắp thiên hà."
 grand_archive.1180.a: "Bất ngờ đấy, nhưng rất hoan nghênh."
 grand_archive.1185.name: "Sâu Hư Không Tuyệt Diệt"
 grand_archive.1185.desc: "Chúng ta vừa nhận được tin báo rằng bầy Sâu Hư Không đột biến đe dọa các thuộc địa của chúng ta đã bị tiêu diệt.\n\nĐây là một kết quả bất ngờ nhưng đầy nhẹ nhõm. Chúng ta có thể an tâm rằng những sinh vật này sẽ không bao giờ còn là mối đe dọa đối với hệ sao của chúng ta nữa."
 grand_archive.1185.a: "Thiên hà đã an toàn hơn."
 grand_archive.1200.name: "Sâu Hư Không Xâm Phạm"
 grand_archive.1200.desc: "Bầy Sâu Hư Không cuồng loạn đang tấn công [frenzied_voidworms_target.solar_system.GetName]!\n\nSự hung hãn của chúng đã đạt đến đỉnh điểm, và hiện tại bầy đàn chính của chúng đang lao thẳng về phía [frenzied_voidworms_target.GetName].\n\nChúng tôi e rằng chúng sẽ không để lại bất kỳ người sống sót nào."
 grand_archive.1200.a: "Chuẩn bị phòng thủ."
 grand_archive.1205.name: "Cái Giá Đau Đớn Nhất"
 grand_archive.1205.desc_common: "Dù chúng ta đã nỗ lực hết sức, bầy Sâu Hư Không đột biến vẫn phá hủy hoàn toàn [this.GetName]. Đợt oanh tạc quỹ đạo của những sinh vật điên cuồng này quá dữ dội, khiến lõi hành tinh đứt gãy và cả tinh cầu cuối cùng vỡ vụn thành từng mảnh. Không một ai sống sót.\n\nChúng đã rút về tổ, không còn tỏ ra tức giận trước sự hiện diện của chúng ta nữa. Hy vọng chúng sẽ cứ nằm yên ở đó."
 grand_archive.1205.desc.default: "$grand_archive.1205.desc_common$\n\nĐứng trước thảm kịch này, chúng ta không có lựa chọn nào khác ngoài việc tiến lên phía trước, và rút ra bài học từ những sai lầm."
 grand_archive.1205.desc.gestalt: "$grand_archive.1205.desc_common$\n\nSự sụp đổ của một khu nậu là đòn giáng mạnh vào [event_target:victim_country.GetName], nhưng chúng ta phải học cách chấp nhận."
 grand_archive.1205.a: "Đã đến lúc tái thiết."
 grand_archive.1210.name: "Sâu Hư Không Đột Biến Bị Nhổ Cỏ Tận Gốc"
 grand_archive.1210.desc: "Bầy Sâu Hư Không đột biến được phát hiện tại [From.GetName] đã bị diệt trừ. Sự hủy diệt của [avenged_homeworld.GetName] đã được báo thù.\n\nChúng ta đã giữ lại được cái tổ lớn nhất của bọn sinh vật đột biến lạ lùng này. Dưới sự kiểm soát của mình, chúng ta có thể lai tạo thêm giống sinh vật độc đáo này mà không phải đối mặt với rủi ro chúng lan tràn mất kiểm soát khắp thiên hà.\n\nBằng cách này, di sản của thế giới mà ta từng đánh mất vẫn có thể được truyền lại."
 grand_archive.1210.a: "$grand_archive.1165.a$"
 grand_archive.1220.name: "Sâu Hư Không Được Xoa Dịu"
 grand_archive.1220.desc.common: "Thông qua việc bơm trực tiếp một lượng lớn khoáng thạch vào tổ Sâu Hư Không đột biến ở [frenzied_home_system.GetName], chúng ta đã thiết lập thành công mối liên kết với chúng. Mối đe dọa từ những sinh vật này sẽ không còn bao trùm lấy [frenzied_voidworms_target.GetName] nữa. Sự an toàn của hành tinh chúng ta"
 grand_archive.1220.desc.common_2: "Những chuyên gia chăn nuôi lão luyện nhất của chúng ta đã làm việc cật lực để quản lý bầy dã thú này, và giờ đây chúng dường như đã sẵn sàng hợp tác cùng ta.\n\nChúng ta đã thu nhận một trong những cái tổ lớn nhất của chúng. Có nó, chúng ta có thể lai tạo thêm nhiều con Sâu Hư Không đột biến mà nếu không sẽ chỉ là thú hoang ngoài tự nhiên."
 grand_archive.1220.desc.default: "$grand_archive.1220.desc.common$ cùng sự cân bằng sinh thái của cả thiên hà đã được đảm bảo.\n\n$grand_archive.1220.desc.common_2$"
 grand_archive.1220.desc.homicidal: "$grand_archive.1220.desc.common$ đã được đảm bảo.\n\n$grand_archive.1220.desc.common_2$"
 grand_archive.1220.a: "Một sự bổ sung đáng hoan nghênh cho hạm đội."
 grand_archive.1220.tt: "Tất cả các hạm đội Sâu Hư Không cuồng loạn sẽ được đặt dưới sự kiểm soát của đế chế của bạn"
 grand_archive.7010.name: "Đã Phát Triển Mồi Nhử Hư Không"
 grand_archive.7010.desc.common: "Khả năng am hiểu về sinh vật hữu cơ không gian đã giúp chúng ta chế tạo thành công một thứ được gọi là §YMồi Nhử Hư Không§!."
 grand_archive.7010.desc: "$grand_archive.7010.desc.common$\n\nNhững công trình căn cứ sao này phải được xây dựng ở hệ sao bản địa của mỗi loại thú không gian tương ứng. Sau khi hoàn thành, chúng sẽ định kỳ thu hút bầy sinh vật đó tập hợp về căn cứ sao như những hạm đội thực thụ.\n\nChúng ta nên thận trọng, bởi vì một số loại sinh vật có thể sẽ trở nên hung hãn."
 grand_archive.7010.desc.primal_calling: "$grand_archive.7010.desc.common$\n\nCác thiết bị này được thiết kế để vẫy gọi sinh vật hoang dã trong không gian, thu hút các dạng sống hữu cơ đang nương náu ngoài khoảng không. Chúng ta không rõ nó sẽ dụ thứ gì tới, nhưng tần số chúng ta đang phát đi lúc này đang nhận lại những phản hồi có tính chu kỳ và đối xứng.\n\nCó thứ gì đó đang nhắm thẳng về phía chúng ta."
 grand_archive.7020.name: "Bài Ca Cá Voi"
 grand_archive.7020.desc: "§YMồi Nhử Hư Không§! mà ta phát triển trước đây đã thu hút được một đàn cá voi không gian đến từ các hệ sao khác, những hệ sao này tương tự như [This.Capital.System.GetName], đều có chứa các §YHành Tinh Khí Khổng Lồ§!.\n\nCó vẻ như thiết bị của chúng ta phải được xây dựng trong những môi trường này mới có thể hoạt động bình thường. Nếu chúng ta phát hiện những loài sinh vật hoang dã khác, chúng ta hẳn cũng có thể xây dựng Mồi Nhử Hư Không ngay gần môi trường sống tự nhiên của chúng."
 ### Thợ Săn Kho Báu
 origin_treasure_hunters: "Thợ Săn Kho Báu"
 origin_treasure_hunters_desc: "Mang trong mình khao khát phiêu lưu, nền văn minh này đã sẵn sàng bước vào chuyến thám hiểm vĩ đại và đầy thử thách nhất. Chỉ với một tấm bản đồ bí ẩn trên tay, họ đang vươn ra các vì sao, dấn thân vào cuộc tranh đoạt kho báu hải tặc trong truyền thuyết."
 origin_tooltip_treasure_hunters_effects: "—Khởi đầu với một ['r_celestial_chart_0_desc', $celestial_chart$] chưa kích hoạt\n—Mỗi lãnh đạo được chiêu mộ đều có một đặc điểm cường hóa ['concept_adventurous_spirit_trait']$NEW_LINE$—Đặc điểm Lãnh đạo:$TABBED_NEW_LINE$—['leader_trait:leader_trait_buccaneer']$TABBED_NEW_LINE$—['leader_trait:leader_trait_trailblazer']$TABBED_NEW_LINE$—['leader_trait:leader_trait_treasure_hoarder']"
 START_SCREEN_TREASURE_HUNTERS: "Bản chất nền văn minh của chúng ta nằm ở khao khát khám phá và phiêu lưu.\n\nTìm ra những kho báu bị đánh mất, khám phá những di tích cổ xưa, khai quật những cổ vật vượt qua cả thời đại của chúng ta; những sự kiện này dệt nên những câu chuyện vang danh nhất và là nguồn cảm hứng truyền đời cho toàn xã hội.\n\nVậy thì, khi chúng ta chập chững bước những bước đầu tiên ra ngoài vũ trụ, tiếng gọi phiêu lưu vang lên là do trùng hợp hay là định mệnh? Một khoang cứu sinh không gian bí ẩn, không rõ nguồn gốc đã được phát hiện đang xoay quanh hành tinh chúng ta. Bên trong đó là một tấm bản đồ sao được mã hóa chỉ thẳng vào những vì tinh tú.\n\nSau nhiều năm nỗ lực, cuối cùng chúng ta cũng nắm giữ công nghệ để giải mã tấm bản đồ sao này và vạch ra đường bay. Khi tiến về phía bến bờ thiên hà, chúng ta đoàn kết một lòng, quyết tâm dấn thân vào chuyến thám hiểm vĩ đại nhất, cam go nhất trong lịch sử."
 d_treasure_planet: "Bảo Tàng Trân Bảo"
 d_treasure_planet_desc: "Một kho lưu trữ an toàn, chuyên dùng để phân loại, phục chế và bảo quản các đồ vật quý giá."
 concept_treasure_vault: "$d_treasure_planet$"
 concept_treasure_vault_desc: "$d_treasure_planet_desc$"
 job_treasure_gatherer: "Giám Đốc Bảo Tàng"
 job_treasure_gatherer_plural: "Giám Đốc Bảo Tàng"
 job_treasure_gatherer_desc: "Họ được đào tạo bài bản để thẩm định vô số các loại hàng hóa quý hiếm, có thể chiết xuất ra những thứ giá trị nhất từ những kho báu được tìm thấy trên khắp thiên hà."
