 grand_archive.4510.name: "$grand_archive$ tại [fromfrom.GetName] Đã Bị Phá Hủy"
 grand_archive.4510.desc.common: "Chúng ta đã phá hủy $grand_archive$ thuộc sở hữu của [from.GetName] nằm tại [fromfrom.GetName]"
 grand_archive.4510.stolen: "Chúng ta có thể lấy lại một số mẫu vật giá trị từ bên trong."
 grand_archive.4510.ancrel: "Chúng ta có thể thu được một lượng nhỏ $r_minor_artifacts$ từ đống đổ nát của nó."
 grand_archive.4510.nothing: "Đáng tiếc là bên trong không chứa thứ gì quý giá cả."
 grand_archive.4510.freed: "Ngoài ra, có vẻ như chúng ta cũng đã vô tình thả tự do cho một số thú không gian đang bị nhốt trong khu sinh thái. Rất có khả năng chúng sẽ tỏ ra hoảng loạn và trở nên cực kỳ hung hãn do vừa mới sổ lồng."
