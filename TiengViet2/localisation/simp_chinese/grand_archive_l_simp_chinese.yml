 MESSAGE_SPACE_CRITTER_CAPTURE_FAILURE_TITLE: "Bắt hụt"
 MESSAGE_SPACE_CRITTER_CAPTURE_FAILURE_DESC: "Chiến dịch vây bắt tại hệ sao $SYSTEM|Y$ đã thất bại. Chúng ta đã mất chiếc $gravity_snare$ do $SHIP_NAME|Y$ phóng ra."
