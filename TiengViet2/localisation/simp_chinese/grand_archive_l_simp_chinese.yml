 grand_archive.2053.name: "Sâu Hư Không Đã Bị Thanh Trừng"
 grand_archive.2053.desc: "Hệ sao quê hương cuối cùng của Sâu Hư Không đã bị hủy diệt, loài của chúng cũng đã tuyệt chủng.\n\nChúng ta không còn phải lo lắng về những đợt tấn công ký sinh của chúng nữa."
 grand_archive.2054.name: "Hang Ổ Sâu Hư Không Bị Phá Hủy"
 grand_archive.2054.desc: "Chúng ta đã nhổ rễ một hệ sao mẹ của Sâu Hư Không.\n\nChúng sẽ không bao giờ có thể sử dụng những bãi đẻ trứng này để nuôi nấng ấu trùng được nữa."
