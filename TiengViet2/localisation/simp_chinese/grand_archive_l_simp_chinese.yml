 ################################
 #Bộ Sưu Tập - Phần Thưởng Giai Đoạn 3 #
 ################################
 grand_archive.4105.desc.3.common: "Mức độ sẵn sàng mạo hiểm vì công việc bảo tồn của các bạn là không gì sánh bằng. Chúng tôi muốn ủy thác một vật phẩm vô cùng đặc biệt cho các bạn bảo quản. [GetStage3Description]"
 grand_archive.4105.desc.3.common_2: "Tất nhiên, với một vật phẩm giá trị nhường này, cũng cần các bạn phải quyên góp một khoản tương xứng để..."
 CURATORS_STAGE_3_DESC: "Các bạn có thể chọn một vật phẩm mạnh mẽ từ bộ sưu tập quý giá nhất của chúng tôi. Chúng tôi tin chắc rằng nó sẽ được cất giữ cẩn thận.\n\n$grand_archive.4105.desc.3.common_2$"
 DEAD_CURATORS_STAGE_3_DESC: "Những món đồ mạnh mẽ này được giấu tại nhiều nhà kho bí mật rải rác khắp thiên hà, nhờ vậy mà chúng đã thoát khỏi thảm cảnh trạm không gian của chúng tôi bị phá hủy.\n\n$grand_archive.4105.desc.3.common_2$ Chúng tôi không thể cứ nói mồm mà mong xây lại được nhà."
 grand_archive.4105.desc.3.xeno_geology: "$grand_archive.4105.desc.common.xeno_geology$\n\n$grand_archive.4105.desc.3.common$"
 grand_archive.4105.desc.3.aesthetic_wonder: "$grand_archive.4105.desc.common.aesthetic_wonder$\n\n$grand_archive.4105.desc.3.common$"
 grand_archive.4105.desc.3.historical_item: "$grand_archive.4105.desc.common.historical_item$\n\n$grand_archive.4105.desc.3.common$"
 grand_archive.4105.desc.3.no_relic.common: "Thông thường, chúng tôi sẽ giao phó một trong những cổ vật quý giá nhất của mình cho các bạn bảo quản, nhưng tiếc là có người khác trong thiên hà đã nhanh tay hơn.\n\nNhư một niềm an ủi, các bạn cũng có thể chọn lấy một trong những vật dụng này."
 grand_archive.4105.desc.3.no_relic.xeno_geology: "Sự tận hiến của các bạn trong việc bảo tồn §YĐịa Chất Ngoại Lai§! là không gì sánh bằng.\n\n$grand_archive.4105.desc.3.no_relic.common$"
 grand_archive.4105.desc.3.no_relic.aesthetic_wonder: "Sự tận hiến của các bạn trong việc bảo tồn §YKỳ Quan Thẩm Mỹ§! là không gì sánh bằng.\n\n$grand_archive.4105.desc.3.no_relic.common$"
 grand_archive.4105.desc.3.no_relic.historical_item: "Sự tận hiến của các bạn trong việc bảo tồn §YLịch Sử Thiên Hà§! là không gì sánh bằng.\n\n$grand_archive.4105.desc.3.no_relic.common$"
 grand_archive.4105.3.no_relic.resources: "Nhận món quà."
