 voidworms_hunting_buff_desc: "Thịt Sâu Hư Không rất giàu dinh dưỡng, có thể thu hoạch sau mỗi trận chiến, mỗi hạm đội bị tiêu diệt mang lại §G$@voidworms_hunting_buff_food_reward|0$§! £food£."
