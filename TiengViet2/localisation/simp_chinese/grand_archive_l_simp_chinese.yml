 grand_archive.4515.name: "Tổn thất $grand_archive$"
 grand_archive.4515.desc.common_1: "$grand_archive$ của chúng ta đặt tại [fromfrom.GetName] đã bị [from.GetName] phá hủy."
 grand_archive.4515.desc.common_2: "Chúng ta cần xây dựng lại một $grand_archive$ tại một hệ sao khác để có thể tiếp tục tổ chức triển lãm mẫu vật."
 grand_archive.4515.stolen: "Thật không may, chúng ta đã không thể thu hồi được một số mẫu vật giá trị cao."
 grand_archive.4515.freed: "Một phần bầy thú không gian mà chúng ta giam giữ đã sổng chuồng trở về tự nhiên, phần lớn chúng đang trong tình trạng hoảng loạn và cực kỳ hung hãn."
 grand_archive.4515.desc.stolen_freed: "$grand_archive.4515.desc.common_1$\n\n$grand_archive.4515.stolen$\n$grand_archive.4515.freed$\n\n$grand_archive.4515.desc.common_2$"
