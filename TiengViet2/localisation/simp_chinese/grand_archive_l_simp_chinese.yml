 grand_archive.4555.name: "$grand_archive$ Đã Bị Tháo Dỡ"
 grand_archive.4555.desc: "$grand_archive$ thuộc sở hữu của [from.GetName] nằm tại [fromfrom.GetName] đã bị tháo dỡ sau khi chúng ta chiếm quyền kiểm soát hệ sao này.\n\nKhoảng không gian mà nó chiếm đóng giờ đây đã được hoàn trả lại hiện trạng ban đầu."
 grand_archive.4560.name: "$grand_archive.4555.name$"
 grand_archive.4560.desc.common_1: "Sau khi chúng ta từ bỏ [from.GetName], $grand_archive$ được xây dựng tại hệ sao này cũng đã bị tháo dỡ theo."
 grand_archive.4560.desc.common_2: "Chúng ta có thể tái chế lại phần lớn số hợp kim được dùng để xây dựng. Nếu muốn tiếp tục tổ chức triển lãm, chúng ta buộc phải xây lại hoàn toàn công trình này ở một hệ sao khác."
 grand_archive.4560.desc.specimen: "Toàn bộ mẫu vật đã được thu hồi và cất giữ an toàn, nằm chờ $grand_archive$ mới được hoàn thành."
 grand_archive.4560.desc.fauna: "Tất cả thú không gian đã bị đem đi giết mổ và chuyển hóa thành tài nguyên cơ bản."
 grand_archive.4560.desc.specimen_fauna: "$grand_archive.4560.desc.common_1$\n\n$grand_archive.4560.desc.specimen$\n$grand_archive.4560.desc.fauna$\n\n$grand_archive.4560.desc.common_2$"
 grand_archive.4560.desc.specimen_nofauna: "$grand_archive.4560.desc.common_1$\n\n$grand_archive.4560.desc.specimen$\n\n$grand_archive.4560.desc.common_2$"
 grand_archive.4560.desc.nospecimen_fauna: "$grand_archive.4560.desc.common_1$\n\n$grand_archive.4560.desc.fauna$\n\n$grand_archive.4560.desc.common_2$"
 grand_archive.4560.desc.none: "$grand_archive.4560.desc.common_1$\n\n$grand_archive.4560.desc.common_2$"
 grand_archive.4580.name: "Kế Hoạch Tái Định Cư Khu Sinh Thái"
 grand_archive.4580.desc: "$grand_archive$ mới đã được khánh thành tại [from.GetName], mang đến cơ hội để chúng ta gây dựng lại hầu hết những gì đã mất mát trong khu sinh thái.\n\nCác mẫu vật chất di truyền mà chúng ta trích xuất từ các loài thú không gian được nuôi dưỡng trước đây đều được bảo quản cẩn thận, chỉ cần cung cấp đủ tài nguyên là chúng ta có thể nhân bản ra những ấu trùng mới."
 grand_archive.4580.a: "Không, chúng ta cần chỗ tài nguyên này."
 grand_archive.4580.b: "Nhân bản lứa thú không gian mới."
