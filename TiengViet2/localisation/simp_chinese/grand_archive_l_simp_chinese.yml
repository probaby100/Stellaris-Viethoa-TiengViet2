 ### Tiếng gọi Hoang dã
 origin_primal_calling: "Tiếng gọi Hoang dã"
 origin_primal_calling_desc: "Cỏ cây xào xạc, đêm đen tựa tiếng gầm thét. Ý chí người thợ săn sắt đá như ánh sao lạnh lẽo.\n\nNền văn minh này có một mối liên kết nguyên thủy với chốn hoang dã. Họ tự coi mình là những người chăn dắt muôn vàn loài dã thú nguy hiểm tại quê nhà, và giờ đây họ đang hướng mắt lên bầu trời. Nhờ tài quản lý và chăn nuôi khéo léo, mối liên kết của họ với các loài thú đã định hình theo dòng tư tưởng của mình. Vẫn chưa rõ liệu sự gắn kết này sẽ phát triển ra sao ở cấp độ thiên hà."
 origin_tooltip_primal_calling_effects: "—$HOMEWORLD$$TABBED_NEW_LINE$—$PLANETARY_MODIFIERS$['concept_untamed_wilds_mod']\n—Các hệ sao quanh $HOME_SYSTEM$ có §YBầy thú Vũ trụ§!\n—$AVAILABLE_BUILDINGS$['concept_wildlife_ranch', £building£$wildlife_ranch$]\n—Có thể chọn ['concept_primal_calling_stance'] đặc biệt khi Chạm trán Lần đầu với §YBầy thú Vũ trụ§!\n—$ADDITIONAL_TECHNOLOGIES_STRING$['technology:tech_genome_mapping', £society_research£$tech_genome_mapping$]\n—$GUARANTEED_RESEARCH_OPTION_STRING$['technology:tech_alien_life_studies', £society£$tech_alien_life_studies$]\n—Sau khi Chạm trán Lần đầu với Bầy thú Vũ trụ sẽ có Manh mối về ['technology:tech_gravity_wells', £physics_research£$tech_gravity_wells$]\n—Sau khi bắt Bầy thú Vũ trụ sẽ có Manh mối về ['technology:tech_alien_cloning', £society_research£$tech_alien_cloning$]\n—Sau khi nhân bản Bầy thú Vũ trụ sẽ có Manh mối về ['technology:tech_controlled_mutations', £society_research£$tech_controlled_mutations$]."
 START_SCREEN_PRIMAL_CALLING: "Dù công nghệ phát triển như vũ bão, chúng ta vẫn gắn bó mật thiết với muôn loài dã thú trên hành tinh của mình. Xuyên suốt quá trình tiến hóa, chúng vừa là thầy vừa là bạn, còn chúng ta là những người chăm sóc tận tụy. Chúng ta không đòi hỏi quá mức hay tham lam vô độ, và luôn trân trọng sự hy sinh của chúng.\n\nTrong khoảng không vô tận của vũ trụ, rất có thể chúng ta sẽ lại bắt gặp những loài dã thú khác. Nếu vậy, chúng ta cũng sẽ đối xử với chúng bằng sự tôn trọng như những loài ở quê nhà. Hẳn chúng cũng sẽ biết rõ vị trí của mình như chúng ta vậy, để từ đó cùng nhau sát cánh vươn tới sức mạnh tối thượng.\n\nMột khát khao nguyên thủy đang bùng cháy trong thâm tâm chúng ta. Dù ngoài kia có thứ gì đi nữa, chúng ta cũng sẽ hiên ngang đối mặt."
 leader_trait_trophy_hunter: "Thợ săn Chiến lợi phẩm"
 leader_trait_trophy_hunter_desc: "Từng trải và dạn dày sương gió, vị chỉ huy này có một sự thấu hiểu lạ thường về Bầy thú Vũ trụ. Chìa khóa cho một chuyến đi săn thành công là biết mình biết ta, và tất nhiên, chỉ có phát súng hoàn hảo mới mang về được chiến lợi phẩm hoàn hảo."
 leader_trait_gifted_trapper: "Bậc thầy Bẫy rập"
 leader_trait_gifted_trapper_desc: "Nhà nghiên cứu tài ba này hết sức cẩn thận khi bắt sống và vận chuyển mẫu vật. Cam kết đảm bảo phúc lợi cho sinh vật của nhà lãnh đạo này đã truyền cảm hứng cho những người khác không ngừng nâng cao tiêu chuẩn học thuật trong mọi ngành nghề."
 leader_trait_void_hunter: "Thợ săn Hư không"
 leader_trait_void_hunter_desc: "Một thợ săn kỳ cựu chuyên săn thú lớn. Họ tiếp cận con mồi đầy kiên nhẫn và ra đòn vô cùng chuẩn xác."
 leader_trait_void_hunter_2: "$leader_trait_void_hunter$ II"
 leader_trait_void_hunter_2_desc: "$leader_trait_void_hunter_desc$"
 leader_trait_void_tracker: "Kẻ dò dấu Hư không"
 leader_trait_void_tracker_desc: "Nhà lãnh đạo này có một thiên phú không ai sánh kịp trong việc đánh bắt Bầy thú Vũ trụ một cách an toàn và hiệu quả."
 leader_trait_void_tracker_2: "$leader_trait_void_tracker$ II"
 leader_trait_void_tracker_2_desc: "$leader_trait_void_tracker_desc$"
 # Chạm trán Lần đầu
 first_contact_critters.15.desc.primal_calling: "Đáng chú ý là, mỗi bầy §HTiyanki§! đều xoay quanh chế độ mẫu hệ, đứng đầu là một con cái. Các con cái được ưu tiên mọi nguồn thức ăn để có thể sản sinh vật chất mẹ dạng khí cho con non và dẫn dắt cả bầy di cư. Do đó, những con đực thường nhịn ăn lúc thiếu thốn, thôi thúc chúng đi kiếm thêm thức ăn trong khi cả bầy nghỉ ngơi."
 first_contact_critters.25.desc.primal_calling: "Ngoại trừ những cá thể trẻ nhất, tất cả các con khác đều mang theo những sinh vật gần như độc lập do chúng điều khiển thông qua dịch tiết pha trộn RNA. Những 'tiêm mao' này có thể tung ra những đòn tấn công phối hợp phức tạp, nên dù trông có vẻ kém thông minh, §H'Amip Không gian'§! thực sự là những tay săn mồi sành sỏi của tự nhiên."
 first_contact_critters.35.desc.primal_calling: "Dường như những sinh vật này giao tiếp với nhau bằng cách thay đổi sắc độ của ánh sáng khúc xạ. Mặc dù phương thức này rất có tiềm năng để truyền đạt những thông điệp phức tạp, các dạng sống bán trí tuệ này lại chỉ dùng nó một cách cơ bản nhất. Việc thay đổi màu sắc có thể dùng để thể hiện địa vị xã hội, sự hung hăng, hay thậm chí là tình trạng sinh sản."
 grand_archive.2005.desc.primal_calling: "Những loài ký sinh này bẩm sinh không thể tự sinh sản, phải sống bám vào vật chủ trên hành tinh để hút dưỡng chất. Để §H'Giun Hư không'§! tiết ra hormone thiết yếu cho sự phát triển của giun ba đầu, chúng phải vơ vét đủ lượng hữu cơ từ các hành tinh có sự sống. Vì là sinh vật lưỡng tính, tiêu chí chọn bạn tình của chúng chủ yếu xoay quanh các đặc điểm thể chất bù trừ lẫn nhau và có kích thước tương đồng."
 grand_archive.2900.desc.primal_calling: "Chúng tôi cho rằng những sinh vật này lựa chọn tiểu hành tinh để làm tổ dựa trên kích thước và thành phần khoáng vật của chúng. Mặc dù mẫu vật đầu tiên chúng ta gặp có đặc tính sinh học ưa thích [GetCommonMineral], nhưng khả năng cao mỗi cá thể sẽ dần tiến hóa để thích nghi với môi trường hiện tại của chúng theo thời gian. Hình ảnh quét cho thấy dấu vết của kim loại này trải khắp tiểu hành tinh chủ, cũng như bên trong hệ thần kinh và đường tiêu hóa của chính §H'Thú đá'§!."
