 #Khủng hoảng đại dịch Sâu Hư Không #
 ###########################
 production_surge_modifier: "Sản Xuất Tăng Vọt"
 public_distrust_modifier: "Niềm Tin Sụp Đổ"
 test_subject_unwilling_modifier: "Đối Tượng Thử Nghiệm"
 test_subject_volunteer_modifier: "$test_subject_unwilling_modifier$"
 test_subject_gestalt_modifier: "$test_subject_unwilling_modifier$"
 grand_archive.2310.name: "Đại Dịch Sâu Hư Không"
 grand_archive.2310.desc.default: "Số lượng $NAME_Voidworms$ trong thiên hà đã đạt tới ngưỡng tới hạn, tập tính của chúng đang thay đổi rõ rệt.\n\nGiai đoạn trong vòng đời từng cho phép các giống loài vật chủ có thời gian sinh sôi nay đã bị phá vỡ, chúng dường như chẳng còn bận tâm xem những bãi đẻ trứng này có thể duy trì sự bền vững hay không nữa.\n\nTất cả thuộc địa của chúng ta đều đã được đặt trong trạng thái báo động đỏ. Bất cứ khi nào phát hiện $NAME_Voidworms$ ở bất kỳ hệ sao nào, đều phải đối phó bằng sự thận trọng tột độ.\n\nMột cơn cuồng nộ sinh sản trên quy mô toàn thiên hà đang ập đến với chúng ta."
 grand_archive.2310.desc.tech: "$grand_archive.2310.desc.default$\n\nKhả năng miễn dịch mà chúng ta thiết lập trước đây nhằm chống lại bọn ký sinh trùng này nay đã không còn hiệu quả như trước. Chúng ta cần bắt tay vào nghiên cứu lại từ đầu."
 grand_archive.2310.desc.nocontact: "Khắp thiên hà đang lan truyền điên cuồng một tin đồn đáng lo ngại: Một đàn thú không gian chưa từng được biết tới mang tên \"Sâu Hư Không\" đang sinh sôi nảy nở với tốc độ chóng mặt. Người ta đồn rằng, đối với những hệ sao có hệ thống phòng thủ kém hoàn thiện, những sinh vật này là một mối hiểm họa khổng lồ. Tất cả các thuộc địa của chúng ta hiện đã được đặt trong tình trạng cảnh giác cao nhất."
 grand_archive.2310.a: "$DISTURBING$$DOTDOTDOT$"
 situation_voidworm_plague: "Đại Dịch Sâu Hư Không"
 situation_voidworm_plague_type: "$situation_voidworm_plague$"
 situation_voidworm_plague_desc: "Đại dịch $NAME_Voidworms$ đang hoành hành.\n\nNhững sinh vật này không còn xem các hành tinh vật chủ như một bãi chăn nuôi sinh sản nữa. Chúng ta phải tiêu diệt chúng, nếu không các thuộc địa của chúng ta sẽ gặp nguy hiểm.\n\n§YMỗi con Sâu Hư Không bị tiêu diệt đều sẽ đẩy nhanh tiến trình của cục diện.§!"
 situation_voidworm_plague_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 finisher_effects_voidworm_plague: "Thuộc địa của bạn sẽ không còn bị ảnh hưởng bởi những trận oanh tạc của Sâu Hư Không nữa."
 approach_voidworm_plague_do_nothing: "Án binh bất động"
 approach_voidworm_plague_do_nothing_tt: "Hiện tại chúng ta sẽ không thực hiện hành động đặc biệt nào."
 approach_voidworm_plague_support_fleets: "Bảo Đảm Hạm Đội"
 approach_voidworm_plague_support_fleets_tt: "Để chống lại hiểm họa từ Sâu Hư Không, chúng ta có thể hy sinh một phần nhỏ chất lượng cuộc sống để hỗ trợ cho các hạm đội quân sự của mình.\n$SITUATION_MONTHLY_CHANGE$ cục diện: §G+0.5§!"
 approach_voidworm_plague_purge_infected_pops: "Thanh Trừng Người Nhiễm"
 approach_voidworm_plague_purge_infected_pops_tt: "Các thuộc địa bị $NAME_Voidworms$ oanh tạc sẽ không sinh ra những con $NAME_Voidworms$ mới.\n$SITUATION_MONTHLY_CHANGE$ cục diện: §G+0.7§!"
 approach_voidworm_plague_search_for_cure: "Tìm Kiếm Phương Pháp Chữa Trị"
 approach_voidworm_plague_search_for_cure_tt: "Nếu chúng ta có thể phá vỡ vòng đời sinh học của chúng, $NAME_Voidworms$ sẽ không thể tiếp tục sinh sôi trong thiên hà này nữa.\n$SITUATION_MONTHLY_CHANGE$ cục diện: §G+1.0§!"
 change_approach_will_temporarily_lock: "§SÁp dụng phương án đối phó này sẽ khóa các phương án khác trong vòng §Y$@voidworm_plague_approach_cooldown_years|0$ năm§!.§!"
 too_early_to_change_approach: "§SVẫn còn quá sớm để tiếp tục thay đổi phương án đối phó với cục diện này.§!"
 voidworm_crisis_eradicate_chain_title: "Tận Diệt $NAME_Voidworms$"
 voidworm_crisis_eradicate_chain_desc: "Số lượng Sâu Hư Không trong thiên hà đã đạt tới mức không thể chống đỡ nổi, chúng ta bắt buộc phải tiêu diệt chúng hoàn toàn.\n\nChúng ta đã tìm ra tất cả những §YTổ Sâu Hư Không§! còn sót lại, phải phá hủy chúng bằng mọi giá."
 voidworm_system_poi_title: "Phá Hủy [prev.GetName]"
 voidworm_system_poi_desc: "Đã dò thấy §YTổ Sâu Hư Không§! tại hệ sao này.\n\nPhá hủy chúng có thể ngăn chặn lũ ký sinh trùng này sinh ra thêm."
 #Sự Kiện Ngẫu Nhiên Khủng Hoảng Đại Dịch Sâu Hư Không #
 grand_archive.2400.name: "Linh Kiện Dư Thừa"
 grand_archive.2400.desc: "Trong quá trình chống lại $NAME_Voidworms$, nhờ vào việc cải tiến các giao thức bảo trì và tăng cường hỗ trợ hạm đội, chúng ta đã thu được một lượng lớn linh kiện phụ trội ngoài dự kiến. Chúng ta có cơ hội sử dụng những vật liệu này để đẩy mạnh năng lực sản xuất ngắn hạn cho các hạm đội mới."
 grand_archive.2400.a: "Đổ vào các nguồn viện binh tiếp theo."
 grand_archive.2400.b: "Dùng làm linh kiện dự phòng để bảo trì."
 grand_archive.2405.name: "Kêu Gọi Nhập Ngũ"
 grand_archive.2405.desc.default: "Những nỗ lực phòng vệ bền bỉ của chúng ta trước mối đe dọa từ Sâu Hư Không đã khơi dậy nguồn cảm hứng cho một thế hệ chỉ huy mới. Những công dân lão luyện của [this.GetName] đã quyết định cống hiến tài năng của mình nhằm xóa sổ mối hiểm họa mang tầm vóc thiên hà này."
 grand_archive.2405.desc.gestalt: "Công tác chuẩn bị ứng phó liên tục của chúng ta trước mối đe dọa từ Sâu Hư Không đã cho phép sản xuất thêm các nút Lãnh đạo cấp Chỉ huy. Nhờ việc tăng cường hỗ trợ cho các hạm đội, những nút chiến đấu này sẽ nhận được nhiều tài nguyên hơn, giúp chúng nhanh chóng hòa nhập vào hoạt động quân sự của chúng ta."
 grand_archive.2405.a: "Thật ấm lòng."
 grand_archive.2405.tt: "Làm mới §H$RECRUITABLE_LEADERS$§!, đồng thời bổ sung thêm 3 §HChỉ Huy§!, mỗi chỉ huy được tăng thêm một cấp."
 grand_archive.2410.name: "Phát Minh Mới Nơi Tiền Tuyến"
 grand_archive.2410.desc.default: "Các kỹ sư đóng quân tại [random_shipyard.GetName] đã phát triển thành công bản thiết kế ý tưởng phòng thủ hạm tàu mới. Trong một lần bảo trì định kỳ sau trận chiến chống lại Sâu Hư Không, [random_shipyard.leader.GetHeSheCap] đã nảy ra một sáng kiến rực rỡ, phát minh ra một loại mô-đun mới giúp củng cố độ bền chắc cho con tàu. Sau khi đệ trình ý tưởng lên bộ phận nghiên cứu, chúng ta nhận định rằng phát minh này sở hữu tiềm năng vô cùng to lớn."
 grand_archive.2410.desc.gestalt: "[root.GetIndividualName] bảo trì tại [random_shipyard.GetName] đã khơi nguồn cho những luận điểm nghiên cứu mới mẻ, hứa hẹn sẽ cải thiện hệ thống phòng thủ hạm tàu. Trong một sai sót khi tiến hành bảo dưỡng định kỳ, [root.GetIndividualName] này đã vô tình kết hợp những loại vật liệu và phương pháp dị thường để tạo ra một loại mô-đun bảo vệ mới. Sau khi đánh giá tiềm năng nghiên cứu, khám phá tình cờ này hoàn toàn có thể đem lại sức mạnh to lớn nếu được tinh chỉnh đúng cách."
 grand_archive.2420.name: "[infected_leader.GetName] Bị Lây Nhiễm"
 grand_archive.2420.desc: "Trong lúc làm nhiệm vụ, [infected_leader.GetName] đã nhiễm phải bào tử Sâu Hư Không còn hoạt tính. Một con nhộng mới sẽ sớm nở ra và phá hủy vật chủ của chúng.\n\nĐó có thể sẽ là một cuộc chiến vô vọng, nhưng các bác sĩ phẫu thuật cho rằng vẫn còn cơ hội để gắp con ấu trùng ra ngoài trước khi nó hoàn toàn hợp nhất vào hệ thần kinh của [infected_leader.GetHisHer]. Đây là một ca phẫu thuật tiềm ẩn vô vàn rủi ro, nhưng bản thân [infected_leader.GetName] có vẻ như sẵn sàng để chúng ta đánh cược một lần."
 grand_archive.2420.a: "Xóa sổ người này."
 grand_archive.2420.b: "Gắp ấu trùng ra."
 grand_archive.2425.name: "Lỗ Hổng Vùng Cách Ly"
 grand_archive.2425.desc.common: "Một nhóm nhỏ [infected_planet_pop.species.GetName] bị nhiễm bệnh đã trốn thoát khỏi chiến dịch thanh trừng tại [infected_planet.GetName], và chạy tứ tán khắp hệ sao của chúng ta. Nếu không kiểm soát kịp thời, việc này sẽ khiến mầm bệnh Sâu Hư Không lây lan ra toàn cõi [this.GetName]."
 grand_archive.2425.desc.default: "$grand_archive.2425.desc.common$ Phải xử lý những kẻ đào tẩu này càng nhanh càng tốt trước khi chúng kịp đe dọa đến mạng sống của tất cả chúng ta."
 grand_archive.2425.desc.rogue: "$grand_archive.2425.desc.common$ Phải xử lý những kẻ đào tẩu này càng nhanh càng tốt trước khi chúng kịp đe dọa đến những kiện sinh vật trang trí khác của chúng ta."
 grand_archive.2425.desc.gestalt: "$grand_archive.2425.desc.common$ Phải xử lý những kẻ đào tẩu này càng nhanh càng tốt trước khi chúng kịp đe dọa đến ý thức tổ ong vĩ đại của chúng ta."
 grand_archive.2425.desc.robot: "Các mẫu động thực vật bị lây nhiễm được mang về để phân tích đã vô tình bị xử lý nhầm thành thực phẩm thông thường. Bởi sai sót này, một lượng lớn chất hữu cơ đã bị nhiễm ký sinh trùng Sâu Hư Không, bắt buộc phải mang đi tiêu hủy ngay."
 grand_archive.2425.a.default: "Truy lùng chúng."
 grand_archive.2425.a.default.tt: "-1 dân số sinh vật hữu cơ tại mọi thuộc địa do ta sở hữu"
 grand_archive.2425.a.robot: "Thiêu rụi nguồn cung lương thực."
 grand_archive.2425.a.robot.tt: "Tất cả các hành tinh chưa lây nhiễm phải chịu $@infected_devastation|0$ độ tàn phá"
 grand_archive.2425.b: "Tĩnh quan kỳ biến."
 grand_archive.2425.b.tt: "Sẽ có thêm nhiều nhộng Sâu Hư Không xuất hiện quanh các thuộc địa của chúng ta!"
 grand_archive.2430.name: "Lơ Là Trách Nhiệm"
 grand_archive.2430.desc: "Mặc dù việc thanh trừng những người bị lây nhiễm được coi là nước đi sáng suốt nhất, song rất nhiều quân nhân lại ngần ngại trong việc thi hành mệnh lệnh. Bất chấp hiểm họa tàn khốc mà ký sinh trùng Sâu Hư Không mang lại, vô số binh sĩ vẫn không đành lòng trừ khử đồng bào của mình, dù là vì lợi ích to lớn hơn.\n\nBắt buộc phải áp dụng các biện pháp quyết liệt nhằm ngăn chặn mầm bệnh Sâu Hư Không lan rộng tại các thuộc địa của chúng ta. Chúng ta có thể thử tự động hóa một vài khâu trong quy trình thanh trừng, từ đó làm giảm sự phụ thuộc vào binh sĩ. Hoặc ta có thể phát động một chiến dịch tuyên truyền ngắn hạn nhằm cổ xúy cho những tiêu chuẩn đạo đức đằng sau hoạt động thanh trừng này, và nhấn mạnh một lần nữa về sự cấp thiết của nó."
 grand_archive.2430.a: "Tự động hóa quy trình thanh trừng."
 grand_archive.2430.b: "Tăng cường định hướng dư luận công chúng."
 grand_archive.2440.name: "Đột Phá Song Song"
 grand_archive.2440.desc: "Hành trình tìm kiếm phương thuốc chữa trị Đại dịch Sâu Hư Không của chúng ta cũng đã thúc đẩy sự tiến bộ song song ở các lĩnh vực nghiên cứu sinh học khác. Mặc dù mối bận tâm hàng đầu lúc này vẫn là lũ ký sinh trùng kia, nhưng bước tiến mới mẻ này sẽ mở ra những tiềm năng bất tận cho các nghiên cứu trong tương lai."
 grand_archive.2445.name: "Thử Nghiệm Giai Đoạn Đầu"
 grand_archive.2445.desc.common: "Sự thấu hiểu của chúng ta về Đại dịch Sâu Hư Không đang dần hoàn thiện, và chúng ta cũng đã tìm ra được nền tảng cho một phương pháp chữa trị."
 grand_archive.2445.desc.default: "$grand_archive.2445.desc.common$ Tuy nhiên, nếu có thể tiến hành thử nghiệm sinh thể từ sớm trên những người tham gia [owner_main_species.GetAdj], tiến độ nghiên cứu của chúng ta sẽ được đẩy nhanh hơn rất nhiều.\n\nGạt bỏ những rào cản đạo đức sang một bên, vì đại cục, lách luật một vài điều khoản an toàn có lẽ cũng là một quyết sách khôn ngoan."
 grand_archive.2445.desc.gestalt: "$grand_archive.2445.desc.common$ Tuy nhiên, quy trình thử nghiệm lại vô cùng mất thời gian, nguyên do chính nằm ở chỗ cần phải liên tục cung cấp những [root.GetIndividualNamePlural] chưa được phân công để làm đối tượng thử nghiệm. Nếu [root.GetIndividualNamePlural] có thể dễ dàng được phân công lại thành đối tượng thử nghiệm, thì tốc độ phát triển phương pháp chữa trị sẽ nhanh hơn rất nhiều.\n\nMặc dù vậy, phương án này sẽ gây ra những hậu quả khác cho toàn thể quần thể tổ ong, những [root.GetIndividualNamePlural] bị điều chuyển sẽ để lại lỗ hổng trong vai trò cũ, gây ra tình trạng hỗn loạn."
 grand_archive.2445.a.default: "Tiến hành thử nghiệm lên những [owner_main_species.GetNamePlural] không hề hay biết."
 grand_archive.2445.a.gestalt: "Ưu tiên thử nghiệm."
 grand_archive.2445.b.default: "Chỉ tiến hành thử nghiệm trên những người tình nguyện."
 grand_archive.2445.b.gestalt: "Tiếp tục thử nghiệm như bình thường."
 grand_archive.2445.c: "Không thể tiến hành những thử nghiệm phi đạo đức."
 grand_archive.2450.name: "Tuyến Sâu Hư Không"
 grand_archive.2450.desc: "Chúng ta đã phát hiện ra một quy luật trong chu kỳ sinh sản của Sâu Hư Không, điều này có thể sẽ đem lại một bước ngoặt mang tính đột phá trong việc tổng hợp ra loại thuốc đặc trị Đại dịch Sâu Hư Không.\n\nĐể xác thực giả thuyết này, cần phải thu thập mẫu tuyến sinh dục từ một con $voidworms_titan$ hoang dã để tiến hành phân tích. Quan trọng hơn cả là, con $voidworms_titan$ này bắt buộc phải bị tiêu diệt ngay trong quá trình nó oanh tạc các hành tinh, có như vậy thì các giao tử sinh dục mới giữ được hoạt tính."
 grand_archive.2450.a: "Chúng ta không có thời gian."
 grand_archive.2450.b: "Đảm bảo rằng phải lấy được cái tuyến đó."
 VOIDWORM_GLANDS_PROJECT: "Tuyến Sinh Dục Sâu Ba Đầu"
 VOIDWORM_GLANDS_PROJECT_DESC: "Chúng ta đã đạt được những bước tiến mang tính đột phá trong việc tìm kiếm phương pháp chữa trị Đại dịch Sâu Hư Không. Thứ duy nhất chúng ta còn thiếu chính là tuyến sinh dục của một con Sâu Hư Không Ba Đầu trong giai đoạn sinh sản đang hoạt động."
 VOIDWORM_GLANDS_PROJECT_TOOLTIP: "§RThu thập xác của một con Sâu Hư Không Ba Đầu đang trong quá trình oanh tạc một hành tinh.§!"
 VOIDWORM_TITAN_DEBRIS_PROJECT: "Xác $NAME_Voidworms_Troika$"
 VOIDWORM_TITAN_DEBRIS_PROJECT_DESC: "Xác của con Sâu Hư Không Ba Đầu này có thể thu hoạch được những tuyến sinh dục đang trong độ sinh sản của nó.\n\nNhững bộ phận này sẽ mở rộng đáng kể vốn hiểu biết sinh học của chúng ta về loài sinh vật này, và giúp ta hoàn toàn quét sạch Đại dịch Sâu Hư Không."
 grand_archive.2455.name: "Thu Hồi Tuyến Sinh Dục"
 grand_archive.2455.desc: "Tuyến sinh dục thu được từ một con Sâu Hư Không có khả năng sinh sản trong trạng thái \"Sâu Ba Đầu\" đã hé lộ những thông tin mới về chu kỳ sinh sản của loài sinh vật này.\n\nMỗi một con Sâu Hư Không khi quấn lấy nhau để giao phối sẽ phân phối đồng đều các vật chất di truyền, trên thực tế chúng đã hình thành nên một cá thể hữu cơ hoàn toàn mới, bị giam cầm trong nghi thức giao phối cho tới tận lúc chết.\n\nChúng ta hoàn toàn có thể lợi dụng những quá trình thể hiện tính di truyền kéo dài này để đánh lại chính chúng."
 grand_archive.2500.name: "Phát Hiện Phương Pháp Chữa Trị"
 grand_archive.2500.desc.default: "Cuối cùng thì chúng ta cũng đã bào chế ra phương pháp đặc trị tận gốc bệnh lây nhiễm ký sinh Sâu Hư Không. Kể từ nay về sau, các thuộc địa của chúng ta sẽ không còn phải lo âu về những đợt tập kích bằng bào tử kinh hoàng kia nữa, sự hiện diện của lũ bọ này trong thiên hà cũng không còn là vấn đề khiến ta phải bận tâm."
 grand_archive.2500.desc.tech: "$grand_archive.2500.desc.default$\n\nChúng ta hoàn toàn vững tin rằng, lần này, phương pháp chữa trị mà chúng ta tạo ra đã đủ khả năng phòng vệ trước bất kỳ đột biến sinh học nào của chúng trong tương lai."
 #########################################
 #Tiêu Điểm Thiên Hà Về Khủng Hoảng Đại Dịch Sâu Hư Không #
 #########################################
 resolution_galactic_focus_crisis_voidworm_plague: "Tiêu Điểm: Đại Dịch Sâu Hư Không"
 resolution_galactic_focus_crisis_voidworm_plague_desc: "Ký sinh trùng hư không đang đe dọa toàn cõi thiên hà. Nếu chúng ta không đồng tâm hiệp lực để ngăn chặn, chúng sẽ nuốt chửng tất cả. Chúng ta cần phải xem việc đối phó với thảm họa này là ưu tiên hàng đầu của cả thiên hà."
 resolution_galactic_focus_crisis_voidworm_plague_effect_success: "$resolution_galactic_focus_crisis_effect_success$"
 galactic_focus_crisis_voidworm_plague: "Đánh Bại Đại Dịch Sâu Hư Không"
 galactic_focus_crisis_voidworm_plague_desc: "Đại dịch Sâu Hư Không đang đe dọa toàn cõi thiên hà. Chúng ta phải chung tay sát cánh để chiến thắng mối đe dọa từ bọn ký sinh trùng này."
 gal_com_crisis_voidworm_pop_victims: "Sâu Hư Không đã gây ra những tổn thất nặng nề cho cư dân trong lãnh thổ."
 ##############
