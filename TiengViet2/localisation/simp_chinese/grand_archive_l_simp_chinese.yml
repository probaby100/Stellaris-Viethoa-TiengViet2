 GRAVITY_SNARE_STANDARD: "$gravity_snare$"
 GRAVITY_SNARE_STANDARD_TOOLTIP: "Bẫy Trọng lực duy trì một vụ bùng nổ trọng lực lượng tử cục bộ, ngăn chặn mọi vật thể không có khả năng di chuyển siêu quang tốc trốn thoát. Lực này có thể kéo dài để bắt sống §YBầy thú Vũ trụ§! và đưa chúng về hệ sao của chúng ta để phân tích thêm."
