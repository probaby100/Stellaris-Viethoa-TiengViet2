 pc_cutholoid: "$pc_asteroid$"
 pc_cutholoid_desc: "$pc_asteroid_desc$"
 resolution_cutholoid_eradication: "Tận Diệt $cutholoids$"
 resolution_cutholoid_eradication_desc: "Không thể dung thứ cho giống loài Quái Thạch chuyên nuốt chửng phi thuyền tồn tại trong những hệ sao văn minh. Bắt buộc phải diệt trừ những sinh vật này bằng mọi giá."
 resolution_cutholoid_eradication_tooltip: "Bất kỳ quốc gia nào có §Y$cutholoids_plural$§! sinh sống trong lãnh thổ đều sẽ bị coi là §Rvi phạm luật thiên hà§!, cho đến khi những sinh vật này bị tiêu diệt hoàn toàn."
 resolution_repeal_cutholoid_eradication: "§RBãi bỏ $resolution_cutholoid_eradication$§!"
 resolution_repeal_cutholoid_eradication_desc: "[global_event_country.GetGalCommunityOrGalImperium] sinh ra không phải là để mù quáng bắt ép phải tận diệt giống loài Quái Thạch."
 resolution_repeal_cutholoid_eradication_effect_success: "Bãi bỏ §Y$resolution_cutholoid_eradication$§!."
 fcsum_cutholoids_1: "$fcsum_critters_1$"
 further_fc_cutholoids_completed: "$further_fc_amoebas_completed$"
 grand_archive.3103.name: "$resolution_cutholoid_eradication$"
 grand_archive.3103.desc: "[global_event_country.GetGalCommunityOrGalImperium] đã ra tuyên bố, tất cả Quái Thạch không còn được phép tiến vào các hệ sao của quốc gia thành viên nữa.\n\nCho đến khi chúng bị tiêu diệt hoặc tự động rời khỏi không phận của chúng ta, [Root.GetName] sẽ bị coi là §Rvi phạm luật thiên hà§!."
 grand_archive.3105.name: "$cutholoids_plural$ Trong Không Phận [this.GetSpeciesName]"
 grand_archive.3105.desc: "Đã phát hiện một con Quái Thạch tại hệ sao [from.GetName]. Sau khi [global_event_country.GetGalCommunityOrGalImperium] xếp nó vào danh sách dã thú nguy hiểm, các quốc gia thành viên có nghĩa vụ pháp lý phải ngay lập tức tiêu diệt tất cả Quái Thạch nằm trong đường biên giới của mình.\n\n[Root.GetName] sẽ bị coi là §Rvi phạm luật thiên hà§!, cho đến khi con Quái Thạch rời khỏi hệ sao của chúng ta hoặc bị tiêu diệt."
 grand_archive.3107.desc: "Quái Thạch vẫn luôn tồn tại trong hệ sao [invaded_system.GetName] của chúng ta, khiến chúng ta §Rvi phạm nghiêm trọng luật thiên hà§! liên quan đến nghị quyết $resolution_cutholoid_eradication$. Điều này đã khiến [global_event_country.GetGalCommunityOrGalImperium] cho phép các thành viên bỏ phiếu áp đặt lệnh trừng phạt lên [Root.GetName]."
 grand_archive.3011.name: "Tàu Khoa Học Mất Tích"
 grand_archive.3011.desc: "Một trong số các Tàu Khoa học của chúng ta đã mất liên lạc khi đang khảo sát một tiểu hành tinh kỳ lạ tại [cutholoid_under_radar.solar_system.GetName].\n\nChúng ta đã bắt được những tín hiệu cầu cứu yếu ớt tại vị trí mất tích cuối cùng của họ, nếu muốn tìm lại con tàu mất tích này thì sẽ cần phải tiến hành thêm các cuộc điều tra."
 grand_archive.3011.a: "Tệ quá."
 grand_archive.3012.name: "Phát Hiện Thực Thể Tiểu Hành Tinh"
 grand_archive.3012.desc: "Trong quá trình thám hiểm định kỳ tại §H[from.solar_system.GetName]§!, chúng ta đã phát hiện ra một sinh vật có hình dạng tiểu hành tinh kỳ lạ khác.\n\nChúng ta nên tránh để §HTàu Khoa học§! lại gần hệ sao này, cho đến khi thu thập thêm được nhiều kiến thức hơn về cái vật thể đầy rẫy hiểm nguy này."
 grand_archive.3012.a: "Tiếp tục điều tra."
 grand_archive.3016.name: "Bất Ngờ Đầy Khó Chịu"
 grand_archive.3016.desc.default: "Tiểu hành tinh tại [fromfrom.GetName] hóa ra chỉ là một lớp vỏ bọc cho sinh vật hữu cơ khổng lồ đang ẩn náu bên trong.\n\nChúng ta đã tiêu diệt thành công con quái vật và tìm lại được [this.GetName]. Từ nay trở đi phải hết sức cẩn thận khi thăm dò các tiểu hành tinh mới được.\n\nCó thể vẫn còn vô số những sinh vật đồng loại khác đang rình rập ngoài kia, chờ chực những con mồi bất cẩn."
 grand_archive.3016.desc.leader_killed: "$grand_archive.3016.desc.default$ Thật không may, [leader.GetName] đã phải gánh chịu những tổn thương không thể cứu chữa."
 grand_archive.3018.name: "Thoát Khỏi Miệng Thú"
 grand_archive.3018.desc: "Tàu Khoa học mất tích của chúng ta tại §H[current_system.GetName]§! đã quay về!\n\nBáo cáo do §H[leader.GetName]§! gửi về cho biết, họ đã bị một thực thể không gian ngụy trang dưới dạng tiểu hành tinh nuốt chửng, và may mắn được nhả ra vào đúng thời khắc thân tàu sắp sửa đạt tới giới hạn chịu đựng. Dường như có một thứ gì đó khác đã làm con quái thú này giật mình nên chúng ta mới có thể may mắn trốn thoát.\n\nTrước khi có thêm những hiểu biết mới, việc khám phá vành đai tiểu hành tinh này cần phải hết sức cẩn trọng."
 grand_archive.3018.a: "Thật may mắn."
 grand_archive.3020.name: "Tàu Khoa Học Tổn Thất"
 grand_archive.3020.desc: "Đường truyền tín hiệu cấp cứu của [from.GetName] đã bị cắt đứt đột ngột. Chúng ta đành phải chấp nhận một sự thật rằng Tàu Khoa học [from.GetName] đã mãi mãi rời xa chúng ta."
 alert_mia_fleet_eaten_title: "$alert_mia_title$"
 alert_mia_fleet_eaten_instant: "Một trong số các Tàu Khoa học của chúng ta đã mất liên lạc khi đang khảo sát một tiểu hành tinh. Chúng ta đã bắt được những tín hiệu cầu cứu yếu ớt tại vị trí mất tích cuối cùng của họ."
 cutholoid_discovered_chain_title: "Giải Cứu [this.GetName]"
 cutholoid_discovered_chain_desc: "Chúng ta đã mất liên lạc với [this.GetName], một Tàu Khoa học ở [cutholoid_under_radar.solar_system.GetName].\n\nBáo cáo cuối cùng cho biết họ đang tiến hành điều tra một tiểu hành tinh gần đó, [cutholoid_under_radar.GetName].\n\nKhuyến cáo nên hành sự thận trọng khi đến gần hệ sao này."
 HIDDEN_CUTHOLOID_ATTACK_PROJECT: "Phá Hủy Tiểu Hành Tinh"
 HIDDEN_CUTHOLOID_ATTACK_PROJECT_DESC: "Đừng để vẻ bề ngoài của tiểu hành tinh [cutholoid_under_radar.GetName] đánh lừa. Chúng ta cần điều động một hạm đội với quy mô vừa phải để đi giải cứu Tàu Khoa học [this.GetName] trước khi nó rời xa chúng ta mãi mãi."
 HIDDEN_CUTHOLOID_CAPTURE_PROJECT: "Bắt Giữ Tiểu Hành Tinh"
 HIDDEN_CUTHOLOID_CAPTURE_PROJECT_DESC: "Đừng để vẻ bề ngoài của tiểu hành tinh [cutholoid_under_radar.GetName] đánh lừa. Chúng ta đã có được công nghệ phù hợp, có thể tóm gọn cả tiểu hành tinh này và giải cứu [this.GetName] một cách dễ dàng trước khi nó mãi mãi rời xa chúng ta."
 grand_archive.2800.name: "Tiểu Hành Tinh Giả Mạo"
 grand_archive.2800.desc: "Tiểu hành tinh bất thường mà chúng ta phát hiện ở §H[This.System.GetName]§! dường như là một vật thể sống. Việc tiến sát vào quỹ đạo của những vật thể này là cực kỳ nguy hiểm, trước khi chúng ta nắm rõ thêm thông tin về nó, khuyến cáo các Tàu Khoa học nên ngay lập tức rời xa hệ sao đang chịu ảnh hưởng."
 grand_archive.2800.a: "Tiếp tục điều tra."
 grand_archive.2900.name: "Quái Thạch"
 grand_archive.2900.desc: "Chúng ta đã phát hiện ra một giống loài sinh vật không gian ẩn mình bên trong lớp vỏ tiểu hành tinh, và đặt tên cho chúng là §HQuái Thạch§!. Chúng là loài thú săn mồi rình rập, có thể mai phục trong nhiều năm ròng rã chỉ để tung ra một đòn chí mạng kết liễu con mồi. Chúng cực kỳ nguy hiểm, có thể nuốt chửng cả một con tàu vũ trụ, vậy nên hãy đặc biệt cẩn trọng khi thám hiểm những vành đai tiểu hành tinh chưa được khảo sát.\n\nTin tốt là, số lượng của chúng vô cùng thưa thớt, và quá trình sinh sản vô tính của chúng có thể phải mất tới hàng trăm năm."
 grand_archive.2900.a: "Chúng ta nên đi sâu vào nghiên cứu những sinh vật này."
 grand_archive.2900.b: "Dã thú rình rập sao. Tiêu diệt tất cả."
 grand_archive.2900.b.homicidal: "Kẻ đi săn cũng có thể trở thành con mồi."
 grand_archive.2905.name: "Lớp Vỏ Quái Thạch"
 grand_archive.2905.desc: "Lớp vỏ của Quái Thạch không đơn thuần chỉ là khoáng vật, mà còn được gia cố bằng vô vàn các sợi sinh học. Những sợi này không ngừng sinh trưởng, và ước tính lượng sinh khối cấu thành nên lớp vỏ này chiếm tới hơn một nửa.\n\nKhi những con Quái Thạch phát triển vượt quá kích thước của tiểu hành tinh, chúng sẽ đi tìm kiếm một mái nhà mới và bắt đầu lại từ đầu quá trình dung hợp. Mặc dù chúng có ý thức lãnh thổ rất mạnh, song trên quỹ đạo của những ứng cử viên lớp vỏ xuất sắc nhất cũng sẽ xuất hiện nhiều con Quái Thạch tập trung lại, con lớn nhất trong số đó sẽ được làm chủ tiểu hành tinh mới này, trong khi các cá thể còn lại sẽ sắp xếp theo kích thước, và hòa bình trao đổi lớp vỏ cho nhau. Cứ như vậy, những tiểu hành tinh mà chúng cư ngụ thường sẽ được truyền tay nhau hàng chục lần.\n\nKết quả cuối cùng là, chính những tiểu hành tinh nhỏ nhất lại sở hữu lượng cường hóa sinh học cao nhất nhờ vào tần suất trao đổi liên tục. Những mẫu vật này mang một giá trị khoa học vô cùng to lớn."
 grand_archive.2905.a: "Cường hóa đàn thú không gian của chúng ta."
 grand_archive.2905.b: "Nâng cấp các hạm tàu của chúng ta."
