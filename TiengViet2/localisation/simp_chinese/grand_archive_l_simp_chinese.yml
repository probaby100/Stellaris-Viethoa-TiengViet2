 voidworm_scaling_difficulty_cadet: "$voidworm_scaling$"
 voidworms_crisis_growth_modifier: "Khủng Hoảng Sâu Hư Không Tăng Trưởng Nhanh"
 voidworms_at_home_modifier: "Cường Hóa $NAME_Voidworms$"
 voidworms_post_crisis_modifier: "$voidworm_crisis_eradicate_chain_title$"
 frenzied_voidworms_at_home_modifier: "Cường Hóa $NAME_Frenzied_Voidworms$"
 frenzied_voidworms_enraged_modifier: "$NAME_Frenzied_Voidworms$ Nổi Điên"
 frenzied_voidworms_pacified_modifier: "$NAME_Frenzied_Voidworms$ Được Xoa Dịu"
 resolution_voidworm_eradication: "Diệt Trừ Sâu Hư Không"
 resolution_voidworm_eradication_desc: "Bản chất ký sinh của Sâu Hư Không là một thảm họa cho thiên hà, đe dọa trực tiếp đến các thế giới có cư dân sinh sống. Vòng đời tự nhiên của chúng phá vỡ sự cân bằng của hệ sinh thái thiên hà, chúng cần phải bị tận diệt."
 resolution_voidworm_eradication_tooltip: "Bất kỳ quốc gia nào có §Y$NAME_Voidworms$§! sinh sống trong lãnh thổ đều sẽ bị coi là §Rvi phạm luật thiên hà§!, cho đến khi những sinh vật này tự ý rời đi hoặc bị tiêu diệt hoàn toàn."
 resolution_repeal_voidworm_eradication: "§RBãi bỏ $resolution_voidworm_eradication$§!"
 resolution_repeal_voidworm_eradication_desc: "[global_event_country.GetGalCommunityOrGalImperium] không có quyền tiêu diệt giống loài Sâu Hư Không."
 resolution_repeal_voidworm_eradication_effect_success: "Bãi bỏ §Y$resolution_voidworm_eradication$§!."
 grand_archive.2103.name: "$resolution_voidworm_eradication$"
 grand_archive.2103.desc: "[global_event_country.GetGalCommunityOrGalImperium] đã ra tuyên bố, không một con Sâu Hư Không nào được phép tiến vào các hệ sao của quốc gia thành viên nữa.\n\nCho đến khi chúng bị tiêu diệt hoặc tự động rời khỏi không phận của chúng ta, [this.GetName] sẽ bị coi là §Rvi phạm luật thiên hà§!."
 grand_archive.2105.name: "$NAME_Voidworms$ Trong Lãnh Thổ [this.GetSpeciesName]"
 grand_archive.2105.desc: "Một hạm đội Sâu Hư Không đã tiến vào không gian của chúng ta tại hệ sao [from.GetName]. Với tư cách là một thành viên của [global_event_country.GetGalCommunityOrGalImperium], chúng ta có nghĩa vụ pháp lý phải tiêu diệt ngay lập tức bất kỳ con Sâu Hư Không nào ở trong biên giới của mình.\n\n[this.GetName] sẽ bị coi là §Rvi phạm luật thiên hà§!, cho đến khi Sâu Hư Không rời khỏi không gian của chúng ta hoặc bị tiêu diệt."
 grand_archive.2107.desc: "Sâu Hư Không vẫn luôn tồn tại trong hệ sao [invaded_system.GetName] của chúng ta, khiến chúng ta §Rvi phạm nghiêm trọng luật thiên hà§! liên quan đến nghị quyết $resolution_voidworm_eradication$. Điều này đã khiến [global_event_country.GetGalCommunityOrGalImperium] cho phép các thành viên bỏ phiếu áp đặt lệnh trừng phạt lên [this.GetName]."
 bombardment_damage_moderate: "§YTrung Bình§!"
 bombardment_damage_massive: "§RKhổng Lồ§!"
 bombardment_voidworm_invasion_desc_common: "$bombardment_voidworm_invasion$ sẽ tiêu diệt dân chúng, tạo ra những ấu trùng Sâu Hư Không mới.\n—Gây sát thương §YTrung Bình§! cho §YQuân Đội§!\n—Gây [GetVoidwormFleetBombardmentDamageIntensity] sát thương cho §YHành Tinh§!, cho đến khi đạt mức tàn phá §Y25%§!\n—Gây sát thương §YTrung Bình§! cho §YDân Số§!"
 bombardment_voidworm_invasion: "Bào Tử Sâu Hư Không"
 bombardment_voidworm_invasion_desc: "$bombardment_voidworm_invasion_desc_common$\n—§RKhông§! tiêu diệt §Y$MIN_POPS$§!£pop£ §Hdân số§! cuối cùng"
 bombardment_voidworm_invasion_crisis: "$bombardment_voidworm_invasion$ (Thiên Tai)"
 bombardment_voidworm_invasion_crisis_desc: "$bombardment_voidworm_invasion_desc_common$"
 bombardment_frenzied_voidworm_invasion: "$bombardment_voidworm_invasion$ Đột Biến"
 bombardment_frenzied_voidworm_invasion_desc: "—Hành tinh bị phá hủy sẽ biến thành §Y$pc_shattered$§!"
 alert_space_fauna_bombardment_title: "Sâu Hư Không đang oanh tạc thuộc địa của chúng ta!"
 alert_space_fauna_bombardment_instant: "Thuộc địa của chúng ta đang phải gánh chịu những đợt oanh tạc từ bầy ký sinh trùng liên sao!\nChúng mang theo một lượng bào tử hữu hạn, chuẩn bị lây lan khắp thuộc địa đông đúc này, và sẽ nhanh chóng rời đi."
 ALERT_SPACE_FAUNA_BOMBARDMENT_DETAIL: "$PLANET_NAME|Y$ tại $SYSTEM_NAME|Y$. Số dân còn lại chờ bị tiêu thụ: §Y$POPS_TO_KILL$§!."
 grand_archive.2195.name: "Ký Sinh Trùng Liên Sao"
 grand_archive.2195.desc.common_1: "[from.GetName] đang bị tấn công.\n\nMột bầy lớn Sâu Hư Không đang ở trên quỹ đạo thuộc địa, oanh tạc bằng những u nang ký sinh."
 grand_archive.2195.desc.common_2: "Phân tích sinh học cho thấy, mỗi tổ Sâu Hư Không chỉ sở hữu một lượng u nang có hạn, rất có thể chúng sẽ rời đi khi cạn kiệt u nang. Nhưng trước đó, chúng ta sẽ phải gánh chịu thiệt hại nhân mạng cực kỳ nặng nề."
 grand_archive.2195.desc.default: "$grand_archive.2195.desc.common_1$\n\nMỗi u nang chứa một bào tử kịch độc, cực kỳ nguy hiểm với thực dân của chúng ta cũng như mọi sinh vật sống. Một khi bị nuốt vào, nó sẽ nhanh chóng phát triển thành một con nhộng, và sẽ bạo lực xé rách cơ thể vật chủ để chui ra, phá hủy vật chủ hoàn toàn. Trong cơ thể những con nhộng này có một túi khí nén, cho phép chúng nổi lên tầng thượng quyển, nơi chúng sẽ đẩy bản thân theo bản năng tới những điểm đến đã được định sẵn.\n\n$grand_archive.2195.desc.common_2$"
 grand_archive.2195.desc.rocks: "$grand_archive.2195.desc.common_1$\n\nMỗi u nang chứa một bào tử kịch độc, cực kỳ nguy hiểm với tất cả hệ động vật bản địa. Một khi bị nuốt vào, nó sẽ nhanh chóng phát triển thành một con nhộng, và sẽ bạo lực xé rách cơ thể vật chủ để chui ra, phá hủy vật chủ hoàn toàn. Những con nhộng này thường ăn tiểu hành tinh để hấp thu những kim loại quý giá, nhưng chúng cũng sẽ nhân cơ hội ăn thịt những [this.GetColonistPlural] yếu ớt của chúng ta. Mỗi ấu trùng đều có một túi khí nén bên trong, cho phép chúng nổi lên tầng thượng quyển, và đẩy bản thân theo bản năng tới những điểm đến đã được định sẵn.\n\n$grand_archive.2195.desc.common_2$"
 grand_archive.2195.a: "Thật bất an."
 grand_archive.2195.a.homicidal: "Chúng sẽ phải diệt vong."
 ap_galactic_contender_voidworms_tt: "$MOD_DIPLO_WEIGHT_MULT$: §G+20%§!\n$mod_damage_vs_country_type_fallen_empire_mult$: §G+$@ap_galactic_contender_dmg_mult|0%$§!\n$mod_damage_vs_country_type_awakened_fallen_empire_mult$: §G+$@ap_galactic_contender_dmg_mult|0%$§!\n$mod_damage_vs_country_type_gate_builders_mult$: §G+$@ap_galactic_contender_dmg_mult|0%$§!\n$mod_damage_vs_country_type_voidworms_mult$: §G+$@ap_galactic_contender_dmg_mult|0%$§!"
