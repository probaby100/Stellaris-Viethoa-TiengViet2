 grand_archive.6025.desc: "Trong quá trình chúng ta tìm kiếm §Y$TREASURE_TROVE$§! tại [from.GetName], [fromfromfrom.Leader.GetName] đã bị phục kích bởi một hạm đội cướp biển!\n\nLũ thảo khấu ngoài vòng pháp luật này không biết bằng cách nào đã phát hiện ra hành tung của chúng ta, và đang định nẫng tay trên những bảo vật này. Nếu muốn giành được những kho báu này, chúng ta phải đánh bại hạm đội của chúng trước khi chúng kịp cướp đi."
 grand_archive.6025.a: "Chuẩn bị giao chiến."
 TREASURE_TROVE_PIRATES: "Đánh Bại $NAME_Treasure_Trove_Pirate_Ship$"
 TREASURE_TROVE_PIRATES_DESC: "Có một hạm đội cướp biển đang bám theo §Y$TREASURE_TROVE$§! của [this.GetName]!"
 TREASURE_TROVE_EVENT_TOOLTIP: "§RChúng ta phải đánh bại bọn cơ hội này trước khi chúng cướp đi những tài nguyên giá trị cao.§!"
 grand_archive.6031.name: "Đánh Bại Cướp Biển"
 grand_archive.6031.desc: "Sau khi đánh tan bọn cướp biển cơ hội, chúng ta có thể tự do chiếm lấy kho báu của [event_target:treasure_trove_planet.GetName]."
 grand_archive.6031.a: "Đây là những gì chúng ta xứng đáng nhận được."
 grand_archive.6035.name: "Mất Kho Báu Trân Châu"
 grand_archive.6035.desc: "Bọn cướp biển cơ hội đã cướp đi §Y$TREASURE_TROVE$§! của [event_target:treasure_trove_planet.GetName].\n\nBây giờ chẳng còn gì đáng để nhắc tới nữa."
 grand_archive.6035.a: "Đành vậy thôi."
