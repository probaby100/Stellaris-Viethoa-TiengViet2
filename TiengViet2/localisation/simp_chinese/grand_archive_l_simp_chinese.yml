 tr_archivism_expert_negociation: "Chuyên Gia Đàm Phán"
 tr_archivism_expert_negociation_delayed: "Biết được ai là nhà sưu tập phù hợp nhất là chìa khóa để tìm được mái nhà ưng ý cho một món đồ có giá trị cao nhất định."
