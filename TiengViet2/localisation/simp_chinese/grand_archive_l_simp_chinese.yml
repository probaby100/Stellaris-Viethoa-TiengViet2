 #Đặc Điểm Lãnh Đạo #
 #################
 leader_trait_buccaneer: "Cướp Biển"
 leader_trait_buccaneer_desc: "Là một bậc thầy trục vớt trên chiến trường, lãnh đạo này có thể vắt kiệt từng giọt giá trị từ những xác tàu bị hư hại nặng nề nhất."
 leader_trait_trailblazer: "Người Mở Đường"
 leader_trait_trailblazer_desc: "Bị thu hút bởi những viễn cảnh tươi đẹp nơi biên ải thiên hà, lãnh đạo này mong muốn vẽ nên hải đồ của những nơi xa xôi nhất trong không gian."
 leader_trait_treasure_hoarder: "Kỳ Binh Đoạt Bảo"
 leader_trait_treasure_hoarder_desc: "Không một khoản tiền thưởng nào có thể thỏa mãn được tham vọng của lãnh đạo này. Tích lũy tài nguyên quý giá là động lực hàng đầu của họ."
 mod_enemy_ship_destroyed_energy_add: "$r_energy$ nhận được khi phá hủy tàu đế quốc địch"
 mod_deposit_increase_on_survey_chance_mult: "Khi hoàn thành khảo sát:\n$t$Có xác suất tăng quy mô mỏ tài nguyên"
