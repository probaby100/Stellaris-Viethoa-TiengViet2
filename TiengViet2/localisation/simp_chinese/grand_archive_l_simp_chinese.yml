 tech_thrusters_bio_integration_desc: "Động cơ nhân tạo có thể được cấy ghép vào các sinh vật không gian, miễn là giải quyết được bài toán về cung cấp năng lượng và kết nối với trung tâm điều khiển thần kinh."
 tech_thrusters_bio_integration_effect: "§HTính Năng Mở Khóa:§! Nâng Cấp Động Cơ Thú Không Gian"
 tech_hyper_drive_bio_integration: "Tích Hợp Động Cơ Không Gian Siêu Tốc Sinh Học"
 tech_hyper_drive_bio_integration_desc: "Mặc dù việc băng qua các tuyến đường siêu không gian có thể mang lại nhiều rủi ro cho sinh vật sống giữa các vì sao, nhưng chúng ta hoàn toàn có thể nâng cao khả năng sống sót của chúng."
 tech_hyper_drive_bio_integration_effect: "§HTính Năng Mở Khóa:§! Nâng Cấp Động Cơ Không Gian Siêu Tốc Thú Không Gian"
 tech_sensors_bio_integration: "Tích Hợp Cảm Biến Sinh Học"
 tech_sensors_bio_integration_desc: "Áp dụng công nghệ hiện tại, chúng ta có thể cường hóa các cơ quan cảm giác đa dạng của sinh vật không gian mà ít gây tổn hại nhất đến cơ thể chúng."
 tech_sensors_bio_integration_effect: "§HTính Năng Mở Khóa:§! Nâng Cấp Cảm Biến Thú Không Gian"
 tech_combat_computers_bio_integration: "Tích Hợp Máy Tính Chiến Đấu Sinh Học"
 tech_combat_computers_bio_integration_desc: "Chúng ta có thể phát triển các loại chip thần kinh chuyên dụng nhằm định hướng hành vi của thú không gian trong các trận chiến hạm đội quy mô lớn."
 tech_combat_computers_bio_integration_effect: "§HTính Năng Mở Khóa:§! Nâng Cấp Máy Tính Chiến Đấu Thú Không Gian"
