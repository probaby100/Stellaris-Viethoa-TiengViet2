 ###########################
 #Mô Tả Thú Không Gian #
 ###########################
 space_amoeba_desc: "Amip Không Gian là một loài săn mồi đơn độc, tấn công mọi thứ mà chúng chạm trán. Chúng phụ thuộc vào những đứa con chưa phát triển hoàn thiện được gọi là \"roi\" để rượt đuổi con mồi một cách cực kỳ hiệu quả."
 tiyanki_desc: "Tiyanki, hay còn được biết đến với tên gọi \"Cá Voi Không Gian\", đa phần là những sinh vật hiền lành chuyên hút khí quyển. Loài này có tính bầy đàn rất cao, các bầy hoang dã thường được tổ chức theo hệ thống cấp bậc nghiêm ngặt."
 voidworm_desc: "Sâu Hư Không là một loài ký sinh. Để duy trì nòi giống, chúng phải thả bào tử của mình xuống một thế giới có thể sinh sống với lượng sinh khối vừa đủ. Những cá thể trưởng thành sẽ tập hợp lại thành dạng \"Sâu Ba Đầu\" và xây tổ gần lỗ đen để che chở và nuôi dưỡng con non."
 cutholoid_desc: "Quái Thạch là một loại sinh vật hữu cơ khổng lồ cư trú bên trong các tiểu hành tinh, sử dụng lớp vỏ đất đá đó như một tấm khiên bảo vệ cho cơ thể mềm yếu của mình. Sinh vật này sẽ nuốt chửng con mồi, sau đó từ từ phân hủy chúng bằng một loại dịch tiêu hóa có tính phóng xạ cao."
 crystalline_entity_desc: "Thực Thể Pha Lê là một dạng sống silicat độc nhất vô nhị, có khả năng di chuyển tự do trong không gian. Màu sắc của mỗi thực thể không phụ thuộc vào tuổi thọ, mà phản ánh điện tích tiềm ẩn bên trong chúng."
 wild_tiyanki_ox_modifier: "Tiyanki Đực Hoang Dã"
 fauna_disengagement_modifier: "Thú Không Gian Rút Lui"
