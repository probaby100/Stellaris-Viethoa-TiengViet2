 MESSAGE_CAPTURED_SPACE_CRITTER_RETURNED_DESC_CULLED: "\n\nNhững bầy thú vũ trụ bắt được sau đây sẽ bị mổ lấy tài nguyên:\n$CULLED_LIST$"
