 grand_archive.4105.name: "$leviathans.500.name$"
 grand_archive.4105.desc.common.aesthetic_wonder: "[GetCuratorsDesignation] đã để ý đến những nỗ lực tận tụy của các bạn trong việc thu thập và bảo quản các mẫu vật §Y$EXHIBITION_AESTHETIC_WONDERS$§!. Thiên hà chưa bao giờ thiếu đi cái đẹp, chỉ là thiếu đi những đôi mắt biết thưởng thức mà thôi."
 grand_archive.4105.desc.common.historical_item: "[GetCuratorsDesignation] đã để ý đến những nỗ lực tận tụy của các bạn trong việc thu thập và bảo quản các mẫu vật §Y$EXHIBITION_GALACTIC_HISTORY$§!. Các bạn đã giúp những chủ nhân cũ của các cổ vật này được bất tử thông qua việc lưu giữ chúng."
 grand_archive.4105.desc.common.xeno_geology: "[GetCuratorsDesignation] đã để ý đến những nỗ lực tận tụy của các bạn trong việc thu thập và bảo quản các mẫu vật §Y$EXHIBITION_XENO_GEOLOGY$§!. Một hòn đá cũng là một thế giới, một tinh thể cũng là một dải ngân hà."
 grand_archive.4105.desc.1.common: "[GetStage1Description]\n\nMong rằng nó sẽ trở thành động lực để các bạn tiếp tục sự nghiệp vĩ đại này."
 CURATORS_STAGE_1_DESC: "Bộ sưu tập sơ bộ của các bạn rất đáng nể, chúng tôi sẵn lòng được phục vụ. Vì công cuộc bảo tồn thiên hà, chúng tôi sẽ cử một chuyên gia đến hỗ trợ lĩnh vực mà các bạn chọn."
 DEAD_CURATORS_STAGE_1_DESC: "Dù hội của chúng tôi đã tan tác bầy chim muông, nhưng chúng tôi vẫn sẵn sàng giúp đỡ các bạn vì nỗ lực bảo tồn thiên hà. Chúng tôi sẽ hỗ trợ lĩnh vực mà các bạn chọn."
 grand_archive.4105.desc.1.xeno_geology: "$grand_archive.4105.desc.common.xeno_geology$\n\n$grand_archive.4105.desc.1.common$"
 grand_archive.4105.desc.1.aesthetic_wonder: "$grand_archive.4105.desc.common.aesthetic_wonder$\n\n$grand_archive.4105.desc.1.common$"
 grand_archive.4105.desc.1.historical_item: "$grand_archive.4105.desc.common.historical_item$\n\n$grand_archive.4105.desc.1.common$"
 grand_archive.4105.1.mineral_insight: "Giúp chúng tôi khai phá các thuộc địa."
 grand_archive.4105.1.void_mining: "Giúp chúng tôi khai phá các vì sao."
 grand_archive.4105.1.cultural_enrichment: "Giúp chúng tôi chia sẻ sự huy hoàng của chúng."
 grand_archive.4105.1.auctioneering_curation: "Giúp chúng tôi tìm một mái nhà phù hợp cho các mẫu vật này."
 grand_archive.4105.1.historical_insight: "Dẫn đường để chúng tôi khám phá thêm nhiều điều chưa biết."
 grand_archive.4105.1.lessons_from_the_past: "Truyền dạy cho các lãnh đạo của chúng tôi trí tuệ từ quá khứ."
 grand_archive.4105.1.no: "Tạm thời không cần."
