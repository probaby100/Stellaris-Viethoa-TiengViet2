 tech_gravity_snare_capacity_1: "Cường hóa Điểm kỳ dị Siêu nhỏ"
 tech_gravity_snare_capacity_1_desc: "$tech_gravity_snare_capacity_desc$"
 tech_gravity_snare_capacity_2: "Tối ưu hóa Thao túng Trọng lực"
 tech_gravity_snare_capacity_2_desc: "$tech_gravity_snare_capacity_desc$"
 tech_gravity_snare_capacity_3: "Cải tiến Hệ thống Nhốt giữ"
 tech_gravity_snare_capacity_3_desc: "$tech_gravity_snare_capacity_desc$"
 gateway_snare_capacity: "Sức chứa Bẫy Trọng lực"
 gateway_gravity_snare_capacity: "§HĐịnh hướng Sức chứa Bẫy Trọng lực§!\n§ECông nghệ này sẽ tiếp tục thúc đẩy năng lực bắt giữ của Bẫy Trọng lực.§!"
 tech_alien_cloning: "Nhân giống Nhân tạo"
 tech_alien_cloning_beastmasters: "$tech_alien_cloning$"
 tech_alien_cloning_desc: "Trong một môi trường được kiểm soát chặt chẽ, chúng ta có thể ấp nở $genetic_material$ thu thập từ việc mổ thịt Bầy thú Vũ trụ, từ đó tạo ra những lứa thú mới để phục vụ dưới trướng chúng ta."
 feature_alien_cloning_unlocked: "Chính sách §Y$policy_space_fauna_growth$§!"
 feature_alien_cloning_unlocked_desc: "$policy_space_fauna_growth_desc$"
 tech_alien_cloning_tt: "§HMở khóa:§! Nhân bản Bầy thú Vũ trụ cỡ Tàu Hộ tống"
 tech_improved_incubators: "Cải tiến Máy ấp"
 tech_improved_incubators_beastmasters: "$tech_improved_incubators$"
 tech_improved_incubators_desc: "Chúng ta có thể cải tiến quy trình nhân giống nhân tạo tại các lò ấp, đẩy nhanh giai đoạn phát triển ban đầu để tạo ra những bản sao trưởng thành hơn."
 tech_improved_incubators_tt: "§HMở khóa:§! Nhân bản Bầy thú Vũ trụ cỡ Tàu Khu trục"
 tech_improved_incubators_tt_desc: "Giờ đây lò ấp có thể nhân bản những §YBầy thú Vũ trụ§! lớn hơn, to ngang ngửa tàu khu trục truyền thống."
 tech_metabolic_gases: "Khí Trao đổi chất"
 tech_metabolic_gases_beastmasters: "$tech_metabolic_gases$"
 tech_metabolic_gases_desc: "Việc tối ưu hóa khí trao đổi chất trong lò ấp có thể giúp thúc ép các loài sinh trưởng mạnh hơn trước khi chúng ra đời."
 tech_metabolic_gases_tt: "§HMở khóa:§! Nhân bản Bầy thú Vũ trụ cỡ Thiết giáp hạm"
 tech_metabolic_gases_tt_desc: "Giờ đây lò ấp có thể nhân bản Tàu Bầy thú Vũ trụ ở mọi giai đoạn phát triển hay mọi kích thước."
 BOARDING_CABLES: "Cáp Đổ bộ"
 BOARDING_CABLES_MODULES: "$BOARDING_CABLES$"
 BOARDING_CABLES_TOOLTIP: "Có xác suất nhỏ cướp được tàu địch hoặc bắt sống chỉ huy để đòi tiền chuộc."
 BOARDING_CABLES_DESC: "$BOARDING_CABLES_TOOLTIP$"
 tech_boarding_cables: "$BOARDING_CABLES$"
 tech_boarding_cables_desc: "Dùng pháo nòng nhỏ cải tiến để bắn các móc neo nối liền bằng cáp sợi carbon đàn hồi, cực kỳ lý tưởng để ghim chặt tàu địch và thực hiện chiến dịch đổ bộ đánh giáp lá cà."
 tech_controlled_mutations: "Đột biến Có kiểm soát"
 tech_controlled_mutations_desc: "Chúng ta có thể cải thiện hiệu suất của Tàu Bầy thú Vũ trụ thông qua chỉnh sửa bộ gen, đồng thời cho phép tích hợp các công nghệ nhân tạo vào sinh khối của chúng."
 tech_controlled_mutations_2: "Đột biến Có kiểm soát Tiên tiến"
 tech_controlled_mutations_2_desc: "Chúng ta có thể tiến xa hơn nữa. Thao tác nâng cao trên bộ gen của Bầy thú Vũ trụ cho phép tích hợp nhiều linh kiện chuyên dụng đa dạng hơn."
