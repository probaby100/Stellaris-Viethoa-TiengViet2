 tech_galactic_archivism: "Lưu trữ Thiên hà"
 tech_galactic_archivism_desc: "Sắp xếp lại lịch sử thiên hà, lấy chuyện xưa làm bài học nay. Việc xây dựng một thư khố đồ sộ nhất là hoàn toàn hợp lý."
 tech_gravity_wells: "Giếng Trọng lực"
 tech_gravity_wells_desc: "Khối lượng lượng tử đậm đặc được cục bộ hóa có thể dùng để tạo ra một vụ bùng nổ trọng lực tức thời. Nếu thao tác chuẩn xác, theo lý thuyết, lực hút này có thể bắt giữ và khống chế sinh vật ở mọi kích cỡ mà không làm chúng bị thương."
 tech_containment_vessel: "Giao thức Nhốt giữ của Giám tuyển"
 tech_containment_vessel_desc: "Số lượng §YBầy thú Vũ trụ§! bắt được bằng Bẫy Trọng lực tăng gấp đôi."
 TECH_UNLOCK_CONTAINMENT_VESSEL_TITLE: "$TECH_UNLOCK_COMPONENT_LINE$$tech_containment_vessel$"
 TECH_UNLOCK_CONTAINMENT_VESSEL_DESC: "$tech_containment_vessel_desc$"
 tech_asteroidal_carapace: "Mai Tiểu hành tinh"
 tech_asteroidal_carapace_desc: "Lớp vỏ của loài thú cư ngụ trong đá không chỉ là khoáng chất, mà còn được gia cố bằng sợi sinh học. Chúng ta có thể dùng kỹ thuật luyện kim tiên tiến để tái tạo nhân tạo quy trình này."
