 #Event chain
 treasure_hunters_origin_story_chain_title: "Lần theo Tinh Đồ Bí Ẩn"
 treasure_hunters_origin_story_chain_desc: "Chúng ta đã tìm thấy một tấm bản đồ sao kỳ bí và quyết định dấn thân vào chuyến phiêu lưu vĩ đại nhất. Chẳng ai biết được bí mật gì đang chôn giấu ở điểm tận cùng của §H$celestial_chart$§!, và cả những hiểm nguy nào đang rình rập trên chặng đường sắp tới."
 treasure_hunters_hidden_system_1_poi: "Tìm kiếm [prev.GetName]"
 treasure_hunters_hidden_system_1_poi_desc: "Bản đồ sao được tìm thấy trong khoang quỹ đạo cổ đại đã chỉ ra một hệ sao ẩn, [prev.GetName]. Để tìm hiểu thêm, chúng ta phải tự mình đến đó."
 treasure_hunters_explore_system_1_poi: "Khảo sát [treasure_hunters_hidden_system_1.GetName]"
 treasure_hunters_explore_system_1_poi_desc: "Giờ đây khi hạm đội của §Y$NAME_BlackNeedle$§! đã bị đánh bại, chúng ta có thể tiếp tục công cuộc tìm kiếm của mình. §H$celestial_chart$§! đã dẫn chúng ta đến hệ sao này, và ta chỉ có thể giả định rằng mảnh tiếp theo của tấm bản đồ sao đang được giấu ở đây."
 black_needle_fleet_poi: "Hạm Đội Hắc Châm"
 black_needle_fleet_poi_desc: "Chúng ta đã bị phục kích bởi một hạm đội cướp biển được tổ chức cực kỳ bài bản và kỷ luật tại hệ sao [from.GetName]. Bọn chúng mưu toan đánh cắp §H$celestial_chart$§! của ta, và dường như đã phục sẵn chờ ta đến."
 smeegibb_shelter_system_1_poi: "Tìm kiếm [prev.GetName]"
 smeegibb_shelter_system_1_poi_desc: "§H$celestial_chart$§! lại hé lộ thêm một hệ sao ẩn mới, [prev.GetName]. Chúng ta phải tiến về đó và khám phá những gì đang chờ đợi."
 smeegibb_shelter_system_2_poi: "Đi tới [smeegibb_system.GetName]"
 smeegibb_shelter_system_2_poi_desc: "Chúng ta không thể nối lại liên lạc với $NAME_Smeegibb$. Vì đây là manh mối duy nhất để lấy được mảnh tiếp theo của §H$celestial_chart$§!, ta nên quay lại [smeegibb_system.GetName] để kiểm tra tình hình. Vẫn chưa rõ nguyên nhân khiến đường truyền liên lạc bị cắt đứt đột ngột."
 black_needle_fleet_2_poi: "Đánh bại $NAME_CaptainInax$"
 black_needle_fleet_2_poi_desc: "§Y$NAME_BlackNeedle$§! một lần nữa bám theo chúng ta, giết chết người liên lạc của chúng ta là $NAME_Smeegibb$ và phong tỏa hệ sao [from.GetName]. Chúng ta tin rằng mảnh thứ tư của §H$celestial_chart$§! được cất giấu đâu đó trên bề mặt của [smeegibb_shelter.GetName].\n\nChúng ta phải tiêu diệt hạm đội của kẻ thù để tiếp tục việc tìm kiếm."
