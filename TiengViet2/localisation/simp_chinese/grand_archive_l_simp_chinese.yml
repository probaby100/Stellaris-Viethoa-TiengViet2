 growth_accelerant: "Thuốc Tăng Trưởng"
 growth_accelerant_desc: "Tổng hợp các hormone tăng trưởng tự nhiên mà thú không gian tiết ra có thể kích thích cơn thèm ăn mãnh liệt của chúng."
 policy_exhibition_focus: "Trọng Tâm Triển Lãm"
 policy_exhibition_focus_desc: "Các Kho Lưu Trữ Vĩ Đại được quy hoạch tỉ mỉ có thể chú trọng trưng bày vào những danh mục cụ thể, qua đó làm nổi bật chủ đề bao trùm của toàn bộ buổi triển lãm.\n"
 galactic_history_focus: "Chú trọng $EXHIBITION_GALACTIC_HISTORY$"
 galactic_history_focus_desc: "Lấy xưa làm gương, soi rọi tương lai.\n\n"
 aesthetic_wonders_focus: "Chú trọng $EXHIBITION_AESTHETIC_WONDERS$"
 aesthetic_wonders_focus_desc: "Cái đẹp không có quy chuẩn chung cho toàn thiên hà, nhưng mọi người đều có quyền thưởng thức cái đẹp.\n\n"
 xenogeology_focus: "Chú trọng $EXHIBITION_XENO_GEOLOGY$"
 xenogeology_focus_desc: "Đây không phải là một đống đá vụn —— đây là buổi trưng bày các khoáng thạch tinh xảo.\n\n"
 no_focus: "Đồng đều các loại"
 no_focus_desc: "Chúng ta sẽ không thiên vị bất kỳ một danh mục mẫu vật nào."
