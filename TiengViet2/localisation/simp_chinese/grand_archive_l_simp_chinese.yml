 LEADER_EXECUTED: "$CLASS|H$ $LEADER|Y$ đã bị xử tử ngay lập tức."
 grand_archive.9005.name: "[fromfrom.GetName] Bị Bắt Giữ"
 grand_archive.9005.desc: "§H[fromfrom.GetClass]§! §Y[fromfrom.GetName]§! của chúng ta đã bị [from.GetName] bắt giữ trong trận chiến tại [fromfromfrom.GetName]. Bọn chúng yêu cầu chúng ta phải trả tiền chuộc để đổi lấy mạng sống của [fromfrom.GetHisHer]."
 grand_archive.9005.desc.second: "Như đã thông báo trước đó, chỉ huy [fromfrom.GetName] của chúng ta đã bị [from.GetName] bắt giữ. Bọn chúng đồng ý nhận tiền chuộc để đảm bảo tính mạng cho [fromfrom.GetHisHer]."
 grand_archive.9005.a: "Chi trả tiền chuộc."
 grand_archive.9005.a.tt: "[fromfrom.GetName] sẽ được trả tự do và quay về hàng ngũ của chúng ta."
 grand_archive.9005.b: "Chúng ta sẽ xem xét kỹ lưỡng chuyện này."
 grand_archive.9005.c: "Chúng ta sẽ không nhả ra dù chỉ một đồng."
 grand_archive.9010.name: "Sa Chân Vào Chốn Không Lối Thoát"
 grand_archive.9010.desc: "Do [from.GetName] từ chối trả tiền chuộc cho [fromfrom.GetHisHer], nên chỉ huy địch là [fromfrom.GetName] hiện vẫn đang nằm trong tay chúng ta. Định đoạt số phận của [fromfrom.GetHisHer] ra sao đây?"
 grand_archive.9010.a: "Xử tử công khai."
 grand_archive.9010.b: "Trả tự do cho tù nhân tại [this.GetHomeWorldName]."
 grand_archive.9010.c: "Tiếp tục giam giữ."
 MESSAGE_LEADER_CAPTURED_TITLE: "Chỉ Huy Địch Bị Bắt Giữ"
 MESSAGE_LEADER_CAPTURED_DESC: "Chúng ta đã bắt sống được một chỉ huy địch trong trận chiến. Chúng ta đã liên hệ với $COUNTRY$, yêu cầu họ nộp tiền chuộc để đổi lấy sự trở về an toàn của kẻ này."
 MESSAGE_LEADER_RANSOM_PAID_TITLE: "Tiền Chuộc Đã Được Thanh Toán"
 MESSAGE_LEADER_RANSOM_PAID_DESC: "Chúng ta đã nhận được khoản tiền chuộc từ [this.GetName] để đảm bảo chỉ huy [fromfrom.GetName] của họ được trở về an toàn."
 alert_mia_ship_stolen_title: "Phi Thuyền Địch Bị Cướp"
 alert_mia_ship_stolen_instant: "Chúng ta đã cướp được một con tàu của địch. Nó đang trên đường trở về thủ đô và sẽ sớm được đưa vào sử dụng."
 DEBRIS_BIO_REPURPOSING_DESC: "Xác của bầy thú không gian đang phân hủy sau cuộc xung đột tại hệ sao $SYSTEM|Y$. Chúng ta có thể thu hồi $FLEET_SIZE$ sinh khối từ những cái xác này."
