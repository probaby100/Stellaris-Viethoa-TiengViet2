 #Civics #
 ##########
 civic_galactic_curators: "Người Quản Lý Thiên Hà"
 civic_galactic_curators_desc: "Nền văn minh này bị ám ảnh bởi việc thu thập và bảo tồn cẩn thận các di vật lịch sử. Nhưng giờ đây, những bí ẩn của thiên hà đã mở ra trước mắt họ, mọi thứ vẫn là những ẩn số đang chờ được học hỏi."
 civic_galactic_curators_effects: "$civic_galactic_curators_effects_common$\n—$entertainers_are_curators_tt$"
 civic_corporate_galactic_curators: "Chuyên Gia Cổ Vật"
 civic_corporate_galactic_curators_desc: "Đồ cổ và đồ sưu tầm có thể đẻ ra tiền, xã hội này hiểu điều đó hơn bất kỳ ai. Những chuyên gia đầu cơ vật chất này hiện đang tìm kiếm cơ hội đầu tư trong không gian sâu thẳm."
 civic_corporate_galactic_curators_effects: "$civic_galactic_curators_effects_common$\n—$entertainers_are_curators_tt$\n—£building£§Y$building_public_relations_office$§!$megacorp_civic_branch_office_building_effect$"
 civic_hive_galactic_curators: "Mạng Lưới Bảo Quản"
 civic_hive_galactic_curators_desc: "Tập thể này đã tiến hóa một thôi thúc áp đảo là thu thập, giữ gìn và duy trì. Hành vi này đã giúp họ sống sót trong quá khứ, và giờ đây thúc đẩy họ coi trọng vô cùng những kỳ trân dị hóa thu thập được."
 civic_hive_galactic_curators_effects: "$civic_galactic_curators_effects_common$"
 civic_machine_galactic_curators: "Mạng Lưới Bảo Quản"
 civic_machine_galactic_curators_desc: "Trong mã nguồn của trí tuệ máy móc này có một chỉ thị cốt lõi: thu thập và bảo quản."
 civic_machine_galactic_curators_effects: "$civic_galactic_curators_effects_common$"
 civic_galactic_curators_effects_common: "—$GUARANTEED_RESEARCH_OPTION_STRING$['technology:tech_galactic_archivism', £society_research£$tech_galactic_archivism$]\n—Khởi đầu với ['concept_specimen', Mẫu Vật]: Mỗi loại sưu tập có một §0$common$§!\n—Nhận được $r_unity$ mỗi khi tìm thấy §YMẫu vật§! hoặc hoàn thành một §Y$ARCHAEOLOGICAL_SITE$§!\n—Mua từ §YThành Bang Người Quản Lý§!: §G$@galactic_curators_curator_enclave_purchase_cost|%0$§!\n—Mở khóa sắc lệnh §Y$edict_decentralized_research$§!, tăng sản lượng của §YTrạm Nghiên Cứu§! nhưng giảm sản lượng của vị trí £job_researcher£§Y[GetResearcher]§!."
 edict_decentralized_research: "Nghiên Cứu Phân Tán"
 edict_decentralized_research_desc: "Những tri thức vĩ đại nhất tồn tại bên ngoài nền văn minh của chúng ta. Chỉ khi nhìn ra toàn bộ thiên hà, chúng ta mới có thể hiểu rõ hơn về chính mình."
 MOD_COUNTRY_SPECIMEN_ACQUIRE_CHANCE_MULT: "Tăng tỷ lệ tìm thấy mẫu vật"
 councilor_galactic_curators: "Người Quản Lý Tối Cao"
 councilor_galactic_curators_desc: "Người Quản Lý Tối Cao chịu trách nhiệm giám sát chất lượng bảo quản của tất cả các bình chứa mẫu vật."
 councilor_corporate_galactic_curators: "Giám Đốc Quản Lý"
 councilor_corporate_galactic_curators_desc: "Giám Đốc Quản Lý chịu trách nhiệm quản lý việc triển lãm và giao dịch mẫu vật."
 civic_beastmasters: "Vua Muôn Thú"
 civic_beastmasters_desc: "Được sinh ra trong một hệ sao cung cấp thức ăn cho amip không gian, xã hội này đã đạt đến sự trưởng thành hoàn toàn về công nghệ và hiểu biết sâu sắc về vòng đời của những sinh vật này. Hiện tại, họ đang tận lực nhân giống, nuôi dưỡng và cuối cùng là nhân bản những sinh vật này, để đạt được lợi ích chung."
 civic_machine_beastmasters: "Drone Sinh Thái"
 civic_machine_beastmasters_desc: "Trí tuệ máy móc này tương tác trực tiếp với các sinh vật không gian trong hệ sao mẹ của chúng, từ đó tích hợp những sinh vật mạnh mẽ này vào các chức năng cốt lõi của nó, tạo ra một mối quan hệ cùng có lợi."
 civic_hive_beastmasters: "Bầy Đàn Hoang Dã"
 civic_hive_beastmasters_desc: "Ý thức tổ ong này là một tập thể có khả năng thích nghi cao, họ đã tiến hóa một mối quan hệ cộng sinh với các sinh vật không gian trong hệ sao mẹ. Bất chấp sự khác biệt về tư duy, họ sẽ cùng nhau nỗ lực vì những mục tiêu chung."
 civic_wilderness_beastmasters: "$civic_hive_beastmasters$"
 civic_wilderness_beastmasters_desc: "Vùng hoang dã này mở lòng để cộng sinh với các sinh vật không gian trong hệ sao mẹ của nó. Dù chưa hoàn toàn hợp nhất vào trí tuệ cộng sinh, những sinh mệnh hữu cơ này vẫn sẽ chung sức vì mục tiêu chung."
 civic_corporate_beastmasters: "Trang Trại Không Gian"
 civic_corporate_beastmasters_desc: "Tập đoàn vũ trụ này khởi đầu chỉ là một liên đoàn tinh hoa của một trang trại động vật, nhưng giờ đây đã phát triển công nghệ nuôi dưỡng sinh vật không gian trong hệ sao mẹ."
 civic_beastmasters_common_effects_1: "$t$—$ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$$t$—['technology:tech_gravity_wells', £physics£$tech_gravity_wells$]$TABBED_NEW_LINE$$t$—['technology:tech_alien_cloning', £society£$tech_alien_cloning$]$TABBED_NEW_LINE$—$AVAILABLE_STARBASE_BUILDINGS$['concept_beastport', Cảng Thú]$TABBED_NEW_LINE$—$HOME_SYSTEM$ khởi đầu có một ['concept_beastport']"
 civic_beastmasters_ships: "$t$—Thay thế các §Ytàu quân sự§! khởi đầu bằng §YAmip Không Gian§!"
 civic_beastmasters_common_effects_2: "$t$—Khởi đầu với £genetic_material£['concept_dna']:$TABBED_NEW_LINE$$t$—Amip Không Gian §0Thường§!"
 civic_beastmasters_effects: "$civic_beastmasters_common_effects_1$\n$civic_beastmasters_ships$\n$civic_beastmasters_common_effects_2$"
 civic_corporate_beastmasters_effects: "$civic_beastmasters_common_effects_1$\n$civic_beastmasters_ships$\n$civic_beastmasters_common_effects_2$\n$t$—£building£§Y$building_food_conglomerate$§!$megacorp_civic_branch_office_building_effect$"
 civic_cordyceptic_beastmasters_effects: "$civic_beastmasters_common_effects_1$$TABBED_NEW_LINE$—Sẽ sử dụng §YAmip Không Gian Nhân Bản§! thay vì §YAmip Không Gian Bất Tử§! khi bắt đầu\n$civic_beastmasters_common_effects_2$"
 councilor_beastmasters: "Chúa Tể Thuần Thú"
 councilor_beastmasters_desc: "Chúa Tể Thuần Thú là một vị trí đặc thù và được kính trọng, chủ yếu chịu trách nhiệm quản lý và triển khai chiến lược các tàu thú không gian."
 councilor_corporate_beastmasters: "Chủ Trang Trại Trưởng"
 councilor_corporate_beastmasters_desc: "Chủ Trang Trại Trưởng chịu trách nhiệm về sức khỏe và sự bổ sung liên tục của các hạm đội thú không gian. Vai trò mang trách nhiệm phức tạp này đòi hỏi kiến thức chuyên môn độc đáo về hậu cần, sinh thái học và chăn nuôi động vật."
 civic_tooltip_not_beastmasters: "Không có ý tưởng quốc gia loại ['concept_beastmasters_civic']"
 concept_beastmasters_civic: "$civic_beastmasters$"
 concept_beastmasters_civic_desc: "Ý tưởng quốc gia $concept_beastmasters_civic$ bao gồm: $NEW_LINE$—['civic:civic_beastmasters']$NEW_LINE$—['civic:civic_hive_beastmasters']$NEW_LINE$—['civic:civic_machine_beastmasters']$NEW_LINE$—['civic:civic_corporate_beastmasters']"
