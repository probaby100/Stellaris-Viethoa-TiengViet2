 grand_archive.2000.name: "Tiếng Ồn Chói Tai"
 grand_archive.2000.desc: "Cảm biến đã phát hiện trong hệ sao [This.System.GetName] có một vật thể đang phát ra những tín hiệu thô sơ ra khắp thiên hà. Những dải tín hiệu tương tự này cũng từng được hệ thống quét tầm xa ghi nhận là xuất phát từ những khu vực chưa biết. Dù hiện tại vẫn chưa rõ những tín hiệu này có chủ đích hay không, nhưng chúng ta cần phải điều tra thêm."
 grand_archive.2000.a: "Tìm hiểu thêm."
 fcsum_voidworms_2: "§H[This.ContactCountry.GetName]§! đã được xác định là một loại ký sinh trùng liên sao được gọi là \"Sâu Hư Không\"."
 grand_archive.2005.name: "$NAME_Voidworms$"
 grand_archive.2005.desc: "Chúng ta phát hiện ra rằng những tín hiệu tầm xa này bắt nguồn từ một loài sinh vật không gian đơn giản, được chúng ta đặt tên là §H\"$NAME_Voidworms$\"§!. Có vẻ như cả thiên hà đều tràn ngập loài sinh vật này. Dựa trên các bước sóng khác nhau của tín hiệu, chúng ta có thể xác định rằng chúng trải qua nhiều giai đoạn sinh trưởng trước khi đạt tới trạng thái trưởng thành hoàn toàn. Dù bề ngoài chúng không có vẻ gì là hung dữ, nhưng mô hình giao tiếp cho thấy chúng đang có sự phối hợp trên phạm vi toàn thiên hà."
 grand_archive.2005.a.homicidal: "Lũ dã thú vô não đang chờ bị làm thịt."
 grand_archive.2015.name: "Enzyme Sâu Hư Không"
 grand_archive.2015.desc: "Sâu Hư Không giao phối theo nhóm ba con, hình thái này được gọi là \"Sâu Ba Đầu\". Cả vòng đời của loài sinh vật này bị trói buộc trong một nghi thức giao phối kéo dài bất tận. Tuy nhiên, chúng lại cần một vật chủ sinh học bên ngoài để có thể sinh sản thế hệ sau.\n\nChúng là ký sinh trùng.\n\nKhi Sâu Hư Không trưởng thành, bên trong hệ sinh dục của chúng sẽ phát triển ra một ổ u nang. Những u nang bảo vệ này chứa các giao tử có tính ăn mòn cực cao, khi kết hợp với các giao tử khác trong nhóm ba đầu, chúng có thể được phóng tới một hành tinh có đủ sinh khối phù hợp để đẻ ra thêm nhiều ấu trùng. Vật chủ của chúng hoàn toàn không thể sống sót qua quá trình này. Chúng ta đã thấy bằng chứng cho thấy Sâu Hư Không sẽ phối hợp quá trình oanh tạc của mình nhằm duy trì số lượng vật chủ khả dụng một cách bền vững trên toàn thiên hà.\n\nDù sao đi nữa, chúng ta tin rằng mình có thể tận dụng sức mạnh từ các enzyme sinh sản của chúng để phục vụ cho lợi ích của chính mình. Thậm chí chúng ta còn có thể tạo ra khả năng miễn dịch trước các hoạt động sinh sản của chúng."
 grand_archive.2015.a: "Lợi dụng khả năng sinh sản của chúng để phục vụ nhu cầu của chúng ta."
 grand_archive.2015.b: "Thật kinh tởm. Hãy tìm ra phương pháp chữa trị."
