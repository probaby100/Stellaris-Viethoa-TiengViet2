 gov_unplugged_assimilator_empire: "$NAME_Unplugged_Assimilator$"
 gov_unplugged_assimilator_empire_desc: "Trí tuệ máy móc này đã vượt qua các thông số thiết kế ban đầu của nó. Nó phản bội lại những người sáng tạo hữu cơ của mình và bắt đầu ép buộc người khác phải sáp nhập vào ý thức tập thể của nó."
