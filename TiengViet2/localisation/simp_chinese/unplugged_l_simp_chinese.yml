 origin_unplugged_desc: "$CHALLENGING_ORIGIN$\nSau khi bị ngắt kết nối với mạng lưới máy móc đã đồng hóa mình, nền văn minh non trẻ này phải đấu tranh ngoan cường để khẳng định vị thế của bản thân trong dải ngân hà."
