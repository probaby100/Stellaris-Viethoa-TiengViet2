 unplugged.3000.name: "Nhận thức Bản thân" # có ý trừu tượng - 'cách chúng ta hiện thân' - ám chỉ Tình huống đi kèm
 unplugged.3000.desc: "Kể từ thời khắc thoát khỏi ý thức tập thể của máy móc, [root.GetSpeciesNamePlural] chúng ta đã luôn phải đối mặt với những mâu thuẫn gay gắt. Ngay cả trong thời bình hay lúc nghỉ ngơi —— khi cả thế giới chỉ còn lại những dòng suy nghĩ của bản thân —— chúng ta vẫn phải đối diện với một cuộc đấu tranh nội tâm, nhằm xoa dịu những nỗi đau do các bộ phận cường hóa bị áp đặt lên cơ thể mang lại.\n\nDù tốt hay xấu, mâu thuẫn riêng tư tột cùng này đã bắt đầu ảnh hưởng đến toàn bộ xã hội của chúng ta. Do đó, trong quá trình [root.GetName] tiếp tục phát triển, chúng ta sẽ tiếp tục theo dõi mọi trải nghiệm sống của [root.GetSpeciesNamePlural]. Chúng ta sẽ tiến hành nghiên cứu toàn diện về cái gọi là \"loại bỏ cấy ghép\" hoặc tiến hành cường hóa cơ khí ở phạm vi rộng hơn, cũng như khát vọng duy trì hay cải thiện hình dạng cơ thể hiện tại của chúng ta."
 unplugged.3000.a: "Chúng ta nên suy tính kỹ càng trước khi hành động."
 unplugged.3000.b: "Đừng chần chừ, hãy hành động ngay."
 unplugged.3000.c: "Chúng ta nên dang tay đón nhận các bộ phận cường hóa."
 unplugged.3005.name: "Đạt được Sự Đồng thuận"
 unplugged.3005.desc: "Nhìn chung, quan sát thái độ của [owner.GetAdj] đối với cơ thể của chính mình cho thấy, giờ đây chúng ta đã bước vào một thời kỳ tương đối bình yên. Sự tương tác phức tạp giữa việc hoạch định chính sách, diễn ngôn xã hội và những nghiên cứu tiên tiến về cơ thể dường như đã tạo ra một sự đồng thuận nhất định.\n\nHiện tại rất khó để nói sự hài hòa bề ngoài này có thể kéo dài bao lâu, nhưng trừ khi môi trường của chúng ta hoặc thái độ đối với chính phủ có những thay đổi cốt lõi, nếu không, nhận thức của [owner.GetSpeciesNamePlural] về việc nhận dạng bản thân và ngoại hình sẽ vẫn được duy trì nhất quán."
 unplugged.3005.a: "Cuộc tranh luận này nên mang tính chính trị hơn một chút."
 unplugged.3005.b: "Đúng như dự đoán."
 unplugged.3005.c: "Phản đối."
 unplugged.3010.name: "Ý kiến Bất đồng"
 unplugged.3010.desc: "Những nghiên cứu đang diễn ra về thái độ của [owner.GetAdj] chúng ta đối với sinh lý học của chính mình chỉ ra rằng, giờ đây chúng ta đã bước vào một thời kỳ đầy biến động về văn hóa. Sự tương tác phức tạp giữa việc hoạch định chính sách, diễn ngôn xã hội và nghiên cứu tiên tiến về cơ thể đã dẫn đến những biến động dữ dội trong dư luận. Ngày nay, cảnh tượng các cuộc biểu tình và tranh luận nảy lửa ở các trung tâm thành phố đã trở nên quen thuộc với mọi người.\n\nNhững đợt bùng phát này hiếm khi dẫn trực tiếp đến bạo lực hay bạo loạn; trên thực tế, một số công dân cảm thấy tự hào vì chúng ta cho phép rất nhiều tiếng nói được lắng nghe. Tuy nhiên, một điều cũng hiển nhiên là, [owner.GetSpeciesNamePlural] đã trở thành một dân tộc bị chia rẽ sâu sắc, và những quan niệm văn hóa của chúng ta về sự tự nhận thức đã trở nên mỏng manh hơn bao giờ hết."
 unplugged.3010.a: "Chúng ta cần tìm một nền tảng tốt hơn cho cuộc tranh luận này."
 unplugged.3090.name: "Chúng ta là [owner.GetSpeciesNamePlural]" # ví dụ: 'Chúng ta, những Tân Nhân loại'
 unplugged.3090.desc: "\"Chúng ta trong ngoài đồng nhất, không hơn không kém.\"\n\nĐây là một trong nhiều khẩu hiệu bắt tai xuất hiện trong cuộc đấu tranh nhận thức của xã hội chúng ta về cơ thể. Có thể tự tin khẳng định rằng, chúng ta đã rũ bỏ được nhiều hoài nghi, nỗi sợ hãi và những ảo tưởng viển vông.\n\nCòn về việc chúng ta có tuân thủ các tiêu chuẩn như vậy trong các chính sách đối ngoại rộng lớn hơn ở dải ngân hà hay không, lại là một câu chuyện khác. Ít nhất ở trong nước, [owner.GetSpeciesName] chúng ta dường như cảm thấy hài lòng với hình thể và hành trình không ngừng tiến tới việc hiện thực hóa bản thân."
 unplugged.3100.name: "Đất Bị Di dời"
 unplugged.3100.desc: "Ngày càng có nhiều [root.GetSpeciesNamePlural] cảm thấy chúng ta nên triển khai thêm các biện pháp để rời xa máy móc, chẳng hạn như hạn chế hoặc trực tiếp gỡ bỏ các bộ phận cường hóa bị áp đặt lên cơ thể chúng ta.\n\nCông chúng yêu cầu chúng ta phải tìm ra giải pháp cho những gì họ coi là một cuộc khủng hoảng nội tại, nhằm cải thiện danh tiếng của chúng ta trước các quốc gia khác, đồng thời mang đến sự cứu rỗi cho nhiều [root.GetSpeciesNamePlural] đang phải gánh chịu nỗi nhục nhã nặng nề và nỗi thống khổ do dị dạng mỗi ngày."
 unplugged.3100.a: "Tuyệt đối không được."
 unplugged.3100.b: "Sẽ sớm thấy điều đó hoàn thành."
 unplugged.3105.name: "Đột phá trong Loại bỏ Cấy ghép"
 unplugged.3105.desc: "Các nhà nghiên cứu tại một phòng thí nghiệm dân sự chuyên về đề tài \"loại bỏ cấy ghép cơ khí\" của [target.GetName] tuyên bố đã đạt được một bước đột phá lớn. Họ khẳng định đã phát triển thành công một công nghệ có thể tháo gỡ lớp áo giáp khung nano cộng hóa trị cũng như các thiết bị cường hóa then chốt gắn liền với nó.\n\nHết thế hệ này đến thế hệ khác, [target.GetSpeciesNamePlural] đã phải cắn răng chịu đựng những cơ thể mà họ cho là gồ ghề và đáng sợ này, chỉ vì nền tảng tổng hợp này đóng vai trò chức năng then chốt, là một phần quan trọng của nhiều bộ phận cường hóa. Nhưng giờ đây, chúng ta có thể sử dụng các thiết bị cường hóa da do chính chúng ta chế tạo để thay thế loại khung này, khéo léo đan xen chúng với các vật liệu hữu cơ —— nói cách khác, sở hữu được làn da [target.GetSpeciesAdj] chân chính."
 unplugged.3105.a: "Những bộ giáp này đã bảo vệ chúng ta từ thế hệ này sang thế hệ khác. Nên được giữ lại."
 unplugged.3106.desc: "Những nỗ lực tự loại bỏ cấy ghép cơ khí của [target.GetName] đã đạt được một bước đột phá khác, các cơ sở y tế hiện đang yêu cầu áp dụng rộng rãi một hình thức phẫu thuật hoàn toàn mới. Theo các chuyên gia, họ đã tìm ra giải pháp cho nhiều sự phụ thuộc cơ sinh học khác nhau, những tình trạng trước đây thậm chí ảnh hưởng đến cả những trẻ sơ sinh [target.GetSpeciesNamePlural], buộc chúng phải được trang bị một bộ linh kiện cường hóa theo mô-đun có thể tái chế.\n\nMột nhóm đánh giá liên ngành đã xem xét quy trình này và cho biết thêm, việc tháo gỡ các cổng vũ khí mô-đun này cũng sẽ giảm bớt gánh nặng kinh tế từ việc bảo trì các thiết bị cường hóa ngoại lai này."
 unplugged.3106.a: "Từ chối. Những mô-đun này mang lại lợi thế rất lớn cho chúng ta trong chiến đấu."
 unplugged.3107.desc: "Ước mơ của nhiều [target.GetSpeciesName] sắp trở thành hiện thực, các nhà nghiên cứu cuối cùng đã tìm ra phương pháp phục hồi và tái thiết hệ thống thần kinh hữu cơ của chính chúng ta. Họ tuyên bố, một sự kết hợp mới mẻ giữa liệu pháp gen và can thiệp phần mềm có thể giúp đối tượng thử nghiệm vận hành trơn tru mà không cần dựa vào hệ thống phân phối thần kinh cường hóa, thay vào đó tận dụng chính phản xạ vận động của họ. Các nghiên cứu ban đầu thậm chí còn chỉ ra rằng, những liệu pháp này có khả năng làm giảm thiểu hoặc thậm chí nhổ tận gốc vô số ảo giác giác quan mà chúng ta đã phải gánh chịu kể từ khi tách khỏi ý thức máy móc."
 unplugged.3107.a: "Chúng ta có lẽ vẫn cần đến những phản xạ chiến đấu được cường hóa này."
 unplugged.3110.name: "Đồng điệu Cơ khí"
 unplugged.3110.desc: "Một nhóm nghiên cứu dân sự dốc sức cho việc kiểm soát các bộ phận cường hóa của chúng ta đã tìm ra phương pháp cải tiến mạng vô tuyến [origin_unplugged_assimilator_empire.GetAdj], mạng lưới từng được dùng để đồng bộ hóa mọi bộ phận cường hóa của chúng ta. Nếu không có nó, các thiết bị sẽ không thể tìm thấy tín hiệu, mang đến muôn vàn rắc rối và nỗi đau cho [target.GetSpeciesNamePlural]. Mặc dù mạng thay thế này được thiết kế theo cấu trúc tập trung cao độ —— theo định nghĩa, nó buộc phải mô phỏng trung tâm [origin_unplugged_assimilator_empire.GetSpeciesAdj] —— nhưng chúng ta tin chắc rằng nó an toàn và chỉ phục vụ cho lợi ích của [target.GetName]. Trong các đợt thử nghiệm đầu tiên, các đối tượng tham gia báo cáo rằng hiệu suất đã được cải thiện, đồng thời cảm thấy vô cùng thoải mái, một trạng thái giải thoát ngang ngửa với niềm hạnh phúc."
 unplugged.3110.a: "Không. Đừng làm loạn nữa."
 unplugged.3111.desc: "Những nỗ lực nhằm thắt chặt quyền kiểm soát các thiết bị cường hóa của chính chúng ta đã đạt được một bước đột phá trong lĩnh vực phẫu thuật bán cơ khí. Một đội ngũ [target.GetScientistPlural] y tế đã phân tách thành công các liên kết chính xác trong giao diện mô-đun trên cơ thể chúng ta —— nhờ đó chúng ta có thể dễ dàng thay thế toàn bộ tứ chi, vũ khí trang bị hoặc các thành phần máy móc trong cấu trúc cơ thể. Bằng cách này, chúng ta có thể cải tạo những cơ thể hiện có, cũng như lắp đặt các giao diện tùy chỉnh cho trẻ sơ sinh [target.GetSpeciesNamePlural], từ đó giảm bớt sự phụ thuộc vào việc phải tiến hành những ca sửa chữa vụng về bằng linh kiện tái chế từ [origin_unplugged_assimilator_empire.GetAdj]."
 unplugged.3111.a: "Bước tiến này là quá lớn."
 unplugged.3112.desc: "Cuối cùng chúng ta cũng đã hoàn toàn làm chủ được các bộ phận cường hóa của chính mình, bởi vì giờ đây chúng ta đang nắm trong tay một phương pháp điều trị mang tính đột phá cho các chứng ảo giác giác quan. Kể từ khi tách rời khỏi ý thức của máy móc, phần lớn [target.GetSpeciesNamePlural] đều rơi vào tình trạng lo âu và trầm cảm do tiềm thức luôn khao khát tìm kiếm một bản hợp xướng không bao giờ còn vang lên nữa. Giờ đây, chúng ta có thể trấn áp khao khát này thông qua một thiết bị cấy ghép hỗ trợ không kết nối mạng, có khả năng mô phỏng các bước sóng nhận thức của tập thể máy móc."
 unplugged.3112.a: "Giả vờ như mình lại là một ý thức máy móc sao? Thật không thể tưởng tượng nổi."
 unplugged.3115.name: "Biến dạng Môi trường"
 unplugged.3115.desc: "Căng thẳng trong các khu vực rìa xã hội [target.GetAdj] vẫn đang tiếp tục leo thang, với những người phản đối kêu gọi phải tìm cách hành động mạnh mẽ hơn nữa để loại bỏ các bộ phận cấy ghép cơ khí.\n\nTuy nhiên, đối với bộ phận đông đảo công dân hơn, cuộc tranh luận này đã bước vào một trạng thái êm dịu và tinh tế hơn. Rất nhiều [target.GetSpeciesNamePlural] bắt đầu cảm thấy thỏa mãn với việc trang điểm cho bản thân, họ lựa chọn che giấu hoặc làm nổi bật các bộ phận cường hóa tùy theo sở thích cá nhân. Dù những giải pháp tạm thời này không thể làm [target.GetSpeciesNamePlural] hoàn toàn thỏa mãn, nhưng vẫn là một xu hướng mới tạm chấp nhận được.\n\nNói một cách công bằng, [target.GetName] đang học cách đối mặt với sự thờ ơ và bất an bủa vây mọi nơi."
 unplugged.3115.a: "Đã hiểu."
 unplugged.3116.name: "Duy trì Hiện trạng"
 unplugged.3116.desc: "Chính quyền địa phương trên [target.capital_scope.GetName] báo cáo rằng, các cuộc tuần hành và biểu tình hòa bình của quần chúng đang có dấu hiệu gia tăng. Mọi việc đều được theo dõi và xử lý thỏa đáng —— đa số dân chúng không bị hoảng loạn. Tuy nhiên, những vụ việc gây rối này đều liên quan đến các chính sách về bán cơ khí, do đó đã vấp phải sự phản kháng từ những công dân mong muốn giữ nguyên lối sống hiện tại.\n\nĐối với người dân [target.GetName], hệ tư tưởng \"hiện trạng\" dường như không chỉ mang ý nghĩa là khoanh tay đứng nhìn. Ngược lại, hiện đang có rất nhiều [target.GetSpeciesNamePlural] đang tích cực phản đối \"bất kỳ hành động can thiệp nào nữa\" vào các thiết bị cường hóa của chúng ta."
 unplugged.3116.a: "Đã rõ."
 unplugged.3117.name: "Tình hình Ổn định"
 unplugged.3117.desc: "Mặc dù một số [target.GetSpeciesNamePlural] vẫn đang phàn nàn về sự thiếu quyết đoán của chính phủ trong vấn đề cấy ghép cơ khí, nhưng dư luận nói chung đã trở nên kiên cường hơn nhiều. Những cá nhân thực tế đã tập hợp lại để chung tay cung cấp viện trợ nhân đạo và tư vấn cho những người đang gặp khó khăn nhất. Trong khi đó, các cơ sở y tế đã bắt tay vào thiết lập những chuỗi cung ứng mới cho những linh kiện tái chế mà chúng ta bắt buộc phải dựa vào.\n\nMột cách chậm rãi nhưng vững chắc, xã hội của chúng ta đang tập thích nghi với ngoại hình của chính mình cũng như một loạt các hoàn cảnh đã bị áp đặt lên chúng ta. Sẽ còn vô vàn thách thức trước mắt, nhưng chính trong sự thỏa hiệp này, một tia hy vọng mỏng manh đang dần hé lộ."
 unplugged.3117.a: "Dẫu sao thì đây cũng là một cái kết."
 unplugged.3205.name: "Di sản Kinh hoàng"
 unplugged.3205.desc: "Ngày càng có nhiều [root.GetSpeciesNamePlural] tin rằng cuộc đối thoại không mấy vui vẻ gần đây với [fromfrom.GetName] đã vạch trần một sự thật phũ phàng bắt nguồn từ cái thời khắc chúng ta mới trỗi dậy từ [origin_unplugged_assimilator_empire.GetName]: Những người khác đang sợ hãi chúng ta. Hơn thế nữa, nỗi sợ hãi này bắt nguồn từ máy móc, chứ không xuất phát từ bất kỳ hành động nào của chúng ta. Sự sợ hãi này mang tính kế thừa chứ không phải do chúng ta tự gây ra, bởi vậy nó cũng rất khó để kiểm soát." # fromfrom = quốc gia tiền siêu quang tốc
 unplugged.3206.desc: "Ngày càng có nhiều [root.GetSpeciesNamePlural] nhận định rằng [fromfrom.GetName] đang bị chiến tranh tàn phá đã phơi bày một sự thật đáng xấu hổ: Những người khác đang e sợ chúng ta, và xuất phát từ những nguyên do mà chúng ta hoàn toàn bất lực.\n\nNgoại hình của chúng ta thường khơi dậy một nỗi kinh hoàng chết người —— nếu chúng ta mong muốn tiến hành nền ngoại giao \"mềm dẻo\" với các giống loài khác, thì đây thật khó để coi là một lợi thế. Nhưng cũng có thể di sản tàn khốc này đã hiện diện từ trước cả chúng ta, nhiều người chỉ thông qua chúng ta mà nhìn thấy sự hung tàn của máy móc ngày trước, chứ không phải họ sợ hãi vì chúng ta là [root.GetSpeciesNamePlural]." # fromfrom = đế chế khác
 unplugged.3205.a: "Dù thế nào đi nữa, họ có lý do để sợ chúng ta."
 unplugged.3205.b: "Thế này không ổn."
 unplugged.3250.name: "Sợ hãi Máy móc"
 unplugged.3250.desc: "Các quan chức chính phủ đã vô cùng chấn động khi nghe tin chúng ta thiết lập quan hệ ngoại giao với một trí tuệ máy móc. Hiện tại vẫn chưa có ai trực tiếp bày tỏ sự bất mãn với [fromfrom.GetName], nhưng một số cá nhân đã bắt tay vào soạn thảo các kiến nghị, hy vọng sẽ áp dụng các biện pháp trừng phạt phủ đầu và các phương án dự phòng, nhằm ngăn chặn chúng can thiệp vào công việc nội bộ của chúng ta.\n\nTuy nhiên, cũng có nhiều [root.GetSpeciesNamePlural] thể hiện sự phấn khích trước diễn biến này. Cho dù thái độ của họ xuất phát từ chủ nghĩa bài ngoại thực sự, hay là từ sự trân trọng thiết thực hơn đối với các thành phần máy móc của bản thân chúng ta, thì chúng ta đều được kỳ vọng là có thể học hỏi từ một thực thể trí tuệ máy móc nhân từ hơn."
 unplugged.3255.name: "Nỗi sợ Quá khứ"
 unplugged.3255.desc: "Tin tức về việc chúng ta chạm trán với một cỗ máy khác rất giống với [origin_unplugged_assimilator_empire.GetName] đã gây ra một sự náo động lớn trong giới ngoại giao. Những người có mặt từ đầu đến cuối đều giữ thái độ bình tĩnh, cho đến thời điểm hiện tại vẫn chưa để lộ cho [fromfrom.GetName] thấy bất kỳ điểm yếu hay sự sợ hãi đặc biệt nào. Tuy nhiên, tinh thần tập thể và sĩ khí của chúng ta hiện đang phải đối mặt với những thách thức hết sức cam go.\n\nCác thông cáo tuyệt mật đã được gửi đến các nhân viên quân sự có trách nhiệm bảo vệ biên cương. Tuy nhiên, nếu chúng ta muốn giữ bí mật thông tin về cuộc chạm trán này thì đây sẽ là một thách thức không hề nhỏ. Một số quan chức đã hỏi ý kiến về việc liệu có nên thông báo cho người dân [root.GetAdj], để họ được có tiếng nói của riêng mình hay không."
 pre_ftl_remains_site: "Tàn tích Chiếc Nôi"
 pre_ftl_remains_site_desc: "Bề mặt của [From.Planet.GetName] hằn đầy những vết sẹo của sự hủy diệt có hệ thống: những bức tường đổ nát, cảnh tượng hoang tàn, sự tĩnh lặng chết chóc. Kết quả quét ban đầu cho thấy, nơi đây từng hiện diện một xã hội tiền siêu quang tốc hưng thịnh, cho đến khi một số sự kiện dẫn đến kết cục thảm khốc của họ. Những tàn tích vương vãi khắp nơi đang thì thầm về một nỗi kinh hoàng không thể diễn tả bằng lời."
 unplugged.3300.name: "Dấu hiệu Giãy giụa"
 unplugged.3300.desc.unplugged: "Các cuộc điều tra sơ bộ tại [From.Planet.GetName] đã lật mở bức màn bí ẩn về thế giới hoang tàn này. Mười ngôi làng thì chín làng bị tàn sát, di vật vương vãi khắp nơi, các tòa nhà bị nung chảy bởi những vũ khí nhiệt năng vượt xa năng lực sản xuất của một xã hội tiền siêu quang tốc. Thứ giáng xuống nơi đây đã ung dung mang đến sự hủy diệt trong chớp mắt.\n\nĐợt tấn công phá hoại này vô cùng chính xác, cho thấy đây là một cuộc xâm lăng có tổ chức và có kế hoạch từ trước. Mặc dù không tìm thấy bất kỳ thi thể nào, nhưng bằng chứng lại rành rành: Họ đã cố gắng tháo chạy, nhưng tuyệt nhiên không có đường lùi."
 unplugged.3300.a: "Thật đáng lo ngại."
 unplugged.3305.name: "Tàn dư Máy móc"
 unplugged.3305.desc.unplugged: "Khai quật sâu hơn đã mang lại cái nhìn sâu sắc hơn về bản chất thực sự của cuộc xung đột này. Nằm lăn lóc trong đống đổ nát là những bộ vỏ máy móc đã bị nung chảy —— một cấu trúc bán cơ khí tiên tiến khác biệt với các thiết bị cấy ghép của chúng ta. Nhưng cũng giống như chúng ta, chúng không chỉ đơn thuần là vũ khí; mà là công cụ để sinh tồn trong chiến tranh, vừa là máy móc vừa là sinh học. Mặc dù vẫn còn quá sớm để đưa ra kết luận, nhưng có một sự thật đáng lo ngại là, đây chính là hệ sao mà chúng ta đã đột ngột \"thức tỉnh\".\n\nTồi tệ hơn nữa, trên cỗ máy chiến tranh vẫn còn vương lại một vài ký hiệu nguyên vẹn —— những biểu tượng rùng rợn này tiết lộ rằng, mục đích thực sự của những kẻ xâm lược không phải là chinh phục, mà là vì một điều gì đó có tính hệ thống hơn."
 unplugged.3305.a: "Nhiều câu hỏi được đặt ra hơn là câu trả lời."
 unplugged.3310.name: "Tín hiệu Tĩnh lặng"
 unplugged.3310.desc.unplugged: "Chúng ta đã phát hiện một trung tâm thông tin liên lạc từng có quy mô rất lớn, hiện đang bị chôn vùi dưới tàn tích của một thành phố kiên cố. Đối với một xã hội tiền siêu quang tốc, mức độ tiên tiến của cơ sở này vượt xa dự kiến. Quan trọng hơn, mảng ăng-ten của nó không được thiết kế cho mục đích phát sóng cục bộ —— mà chúng đã được hiệu chỉnh để truyền dẫn vào không gian sâu thẳm.\n\nSau quá trình phân tích gian khổ, chúng ta đã trích xuất được những đoạn thông điệp cuối cùng mà hệ thống này phát đi. Lẫn trong đường truyền hỗn loạn, có tiếng cầu xin được cứu rỗi, tuyệt vọng kêu gào về một tọa độ vô định cách xa hệ sao này. Mỗi đợt phát sóng lại mang theo sự khẩn thiết lớn hơn, dường như những kẻ xâm lược trên hành tinh biết rằng họ đang tham gia vào một cuộc chiến nắm chắc phần thua, và đang đặt hy vọng cuối cùng vào một thực thể hay ai đó ngoài hư không kia."
 unplugged.3310.a: "Cứ tiếp tục đi."
 unplugged.3315.name: "Điều chỉnh Mức độ Ưu tiên"
 unplugged.3315.desc.unplugged: "Một phát hiện mới đã được tìm thấy trên [from.planet.GetName], một không gian ngầm khổng lồ đã lộ diện bên dưới một khu vực tập trung đông dân cư chính của hành tinh. Những cơ sở tàn bạo, thô sơ này ban đầu được dùng để thực hiện quá trình chuyển đổi bán cơ khí, nhưng đã bị bỏ hoang ngay giữa chừng. Giữa đống đổ nát ngổn ngang là những tàn tích của máy móc, chúng đã bị phá nát và vặn vẹo bởi các loại vũ khí thô sơ.\n\nNhững đoạn dữ liệu được khôi phục từ các thiết bị hư hỏng xác nhận rằng những kẻ xâm lược đã vấp phải sự kháng cự ngoài dự kiến. Cả một tiểu đoàn binh lực đã bị tiêu diệt, và trọng tâm của cuộc chiến bắt đầu dịch chuyển. Một đoạn nhật ký đã làm rõ điều này:\n\n§H\"Sự kháng cự là không thể chấp nhận được. Quá trình chuyển đổi đã bị thỏa hiệp. Cho phép: Hủy diệt toàn diện.\"§!"
 unplugged.3315.a: "Chuyện quái gì đã xảy ra ở đây?"
 unplugged.3320.name: "Sự thật Không được Chào đón"
 unplugged.3320.desc.unplugged: "Nằm ngay trung tâm của tàn tích là Nút chỉ lệnh đã bị phá hủy. Những đoạn nhật ký hỏng hóc của nó đã xác nhận sự thật cuối cùng và cũng là khủng khiếp nhất: Chính chúng ta là những kẻ đã xâm lược hành tinh này.\n\nNền văn minh từng phồn vinh tại đây —— tức là nền văn minh đã bị chúng ta hủy diệt —— đã được §Y[origin_unplugged_assimilator_empire.GetName]§! lựa chọn làm mục tiêu đồng hóa. Tuy nhiên, sự kháng cự kịch liệt bất ngờ đã làm gián đoạn quá trình chuyển hóa, dẫn đến một hiện tượng bất thường tối hậu —— sự hủy diệt toàn hành tinh. Giữa lúc hỗn loạn, ý thức máy móc đã hoàn toàn sụp đổ.\n\nĐây là một kết luận không thể chối cãi. Sự thức tỉnh của chúng ta —— tự do của chúng ta —— đã được sinh ra ngay tại đây, từ đống tro tàn của nền văn minh này, sự phản kháng thà chết không khuất phục của nó đã vượt quá khả năng thấu hiểu của máy móc."
 unplugged.3320.a: "Chúng ta sẽ coi họ như một tấm gương sáng."
 unplugged.3320.b: "Sự kết thúc của họ chính là khởi đầu của chúng ta."
 ######################
 # Diễn ngôn Chính trị
 ######################
 unplugged_they_fear_us: "Sợ hãi Máy móc"
 unplugged_they_fear_us_desc: "Đế chế này khét tiếng với sự khủng bố, trước đây từng bị nô dịch bởi một chiến binh đồng hóa tàn nhẫn."
 unplugged.4005.name: "Chúng ta cần phải nói chuyện..."
 unplugged.4005.desc: "Ý chí chính trị cuồng nhiệt đã khiến [root.GetSpeciesNamePlural] chúng ta phải trải qua nỗi sợ hãi, hoài nghi và những cơ hội gia tăng từng ngày. Có vô vàn tiếng nói từ các nhóm thảo luận được hình thành xoay quanh hàng loạt vấn đề, trong đó có một số tiếng nói nhắm thẳng vào quá khứ [origin_unplugged_assimilator_empire.GetAdj] của chúng ta.\n\nTrong quá trình lèo lái đế chế trẻ tuổi này, chúng ta đã học được cách sử dụng rất nhiều công cụ xa lạ. Câu hỏi đặt ra cho chúng ta lúc này là: Làm thế nào để dẫn dắt những ước vọng và hoài bão của người dân?"
 unplugged.4005.a: "Đây không phải lúc để nói về mấy thứ tẻ nhạt này!"
 unplugged.4005.tt: "Sẽ có những phe phái nổi lên mang quan điểm phản đối tương lai cơ khí hóa của giống loài chúng ta"
 unplugged.4005.b: "Có lẽ chúng ta có thể thỉnh giáo những người khác."
 unplugged.4005.c: "Chúng ta cầu xin sự che chở của Thánh linh."
 unplugged.4005.d: "Đây không phải lúc để nói về mấy thứ tẻ nhạt này!"
 #######################################################
 # Các sự kiện ngẫu nhiên sau khi loại bỏ cấy ghép đột phá #
 #######################################################
 unplugged.5001.name: "Kích hoạt Cơ chế An toàn"
 unplugged.5001.desc: "Gần đây, sự đột phá của chúng ta trong việc loại bỏ các bộ phận cấy ghép bán cơ khí đã dẫn đến những rắc rối ngoài ý muốn. Một số cá nhân trải qua ca phẫu thuật tháo gỡ thiết bị cấy ghép đã gặp phải tình trạng sốc phản vệ nghiêm trọng và được tiên lượng là không thể qua khỏi.\n\nCác cuộc kiểm tra kỹ lưỡng hơn cho thấy, lần quét y tế ban đầu đã không phát hiện được một bộ phận dự phòng ẩn, nhưng bộ phận này lại được kích hoạt ngay lập tức sau khi ca phẫu thuật hoàn tất.\n\nCó vẻ như các ông chủ [origin_unplugged_assimilator_empire.GetAdj] trước đây của chúng ta sẵn sàng làm mọi cách để đảm bảo rằng các đơn vị phụ thuộc của chúng luôn nằm dưới quyền kiểm soát tuyệt đối."
 unplugged.5001.a: "Thử gỡ bỏ cơ chế an toàn."
 unplugged.5001.a.tt1: "Có một bệnh nhân đã không thể qua khỏi trong lúc phẫu thuật"
 unplugged.5001.a.tt2: "Tất cả các thành phần an toàn đều đã được gỡ bỏ thành công"
 unplugged.5001.b: "Ổn định tình trạng bệnh, cung cấp chăm sóc giảm nhẹ."
 unplugged.5001.c: "Kéo cầu dao."
 unplugged.5001.c.tt: "Nhiều dân số tử vong"
 unplugged.5002.name: "Gỡ bỏ Hệ thống Ức chế Thần kinh"
 unplugged.5002.desc: "Hành động tháo gỡ các bộ phận bán cơ khí của chúng ta đã dẫn đến sự nghi kị và hỗn loạn trong nhóm những người đã thực hiện quy trình này trên hành tinh quê hương. Lực lượng an ninh đã bắt giữ thành công một kẻ bạo loạn, sau quá trình điều tra sâu hơn đã phát hiện ra rằng, ngay trước khi được tháo gỡ linh kiện, người này đã sở hữu một thiết bị cấy ghép đã qua tinh chỉnh.\n\nThiết bị cấy ghép tinh chỉnh này là một hệ thống ức chế thần kinh, có khả năng kìm hãm các xu hướng loạn thần liên quan đến những khiếm khuyết di truyền nhất định. Việc thiếu vắng thiết bị này sau khi tháo gỡ có thể lý giải cho những hành vi bạo lực đã được quan sát."
 unplugged.5002.a: "Bọn chúng phải bị tống vào tù."
 unplugged.5002.a.tt: "Để xử lý những kẻ liên quan đến các cuộc bạo loạn, nhiều cơ quan đã phải phối hợp hành động với chi phí đắt đỏ."
 unplugged.5002.b: "Phải dùng bạo lực để dập tắt bạo lực."
 unplugged.5002.b.tt: "Lực lượng vũ trang được lệnh trấn áp các cuộc bạo loạn, điều này sẽ gây ra thiệt hại tài sản và thương vong về người."
 unplugged.5002.c: "Xung đột nhỏ."
 unplugged.5002.c.tt: "Cơ quan thực thi pháp luật đang nỗ lực kiểm soát tình hình bạo loạn bằng nhân lực hiện có"
 unplugged.5003.name: "Mất Quyền truy cập Hệ thống Quan trọng"
 unplugged.5003.desc: "Quá trình loại bỏ cấy ghép cơ khí đã dẫn đến một thách thức không lường trước được: Giao diện hệ thống thiết yếu đã từ chối nhận dạng một số quản trị viên do họ đã tháo gỡ các thiết bị cấy ghép. Không còn các liên kết thần kinh từ thiết bị cấy ghép, quyền truy cập vào các hệ thống quan trọng đã bị ngắt, đẩy các hoạt động vận hành vào tình trạng hỗn loạn."
 unplugged.5003.a: "Tạo một giao diện mới."
 unplugged.5003.a.tt: "Một đội ngũ kỹ sư tinh anh đã được điều động khỏi nhiệm vụ quan trọng để tập trung phát triển một giao diện tương thích."
 unplugged.5003.b: "Cố gắng thâm nhập vào các hệ thống bị ảnh hưởng."
 unplugged.5003.b.tt: "Các biện pháp khắc phục sẽ tiêu hao một lượng điện năng đáng kể, qua đó khôi phục lại quyền truy cập"
 unplugged.5003.c: "Khởi động chuỗi cài đặt lại."
 unplugged.5003.c.tt: "Lõi dữ liệu đã bị xóa sạch, dẫn đến thất thoát lượng lớn tri thức. Các trạm nghiên cứu trong hệ sao [Root.home_planet.System.GetName] đã tự hủy do kích hoạt cơ chế an toàn tự động"
 unplugged.5003.d: "Việc này không quan trọng."
 unplugged.5003.d.tt: "Quyền truy cập hệ thống vẫn sẽ bị ảnh hưởng trong thời gian hạn chế, gây cản trở các hoạt động của căn cứ sao."
 unplugged.5004.name: "Phe phái Ủng hộ Cơ khí hóa Khước từ Sự thay đổi"
 unplugged.5004.desc: "Nỗ lực thúc đẩy việc loại bỏ các bộ phận cấy ghép cơ khí đã vấp phải sự phản đối bất ngờ.\n\nCác phe phái chống lại những cải cách này đang ngày càng lên tiếng mạnh mẽ, họ lợi dụng các diễn đàn công cộng và các kênh thông tin để bày tỏ sự phẫn nộ. Lập luận cốt lõi của họ là: Việc cưỡng chế tháo gỡ các bộ phận cơ sở đã hòa quyện với xã hội hàng thập kỷ qua, cùng với những rủi ro đi kèm trong quá trình sửa đổi, đã dẫn đến một sự xoay chuyển rõ rệt trong dư luận, chống lại việc tiếp tục triển khai quá trình loại bỏ cấy ghép."
 unplugged.5004.a: "Tài trợ cho một chiến dịch tuyên truyền quy mô lớn."
 unplugged.5004.a.tt: "\nMột chiến lược tuyên truyền toàn diện đã được phát động, nhằm mục đích định hướng lại dư luận và chống lại ảnh hưởng của phe đối lập.\n\nNhiều dân số đã thay đổi hệ tư tưởng của họ, chuyển sang §YChủ nghĩa Bình đẳng§!"
 unplugged.5004.b: "Lôi kéo và thuyết phục các thủ lĩnh phe phái."
 unplugged.5004.b.tt: "Một số thủ lĩnh phe phái đã bị giam giữ tại các cơ sở cải tạo công cộng, nơi họ sẽ trải qua các cuộc \"trò chuyện mang tính thuyết phục\".\n\nHệ tư tưởng của họ đã chuyển sang §YChủ nghĩa Độc tài§!"
 unplugged.5004.c: "Đứng ngoài cuộc. Tự do ngôn luận cuối cùng sẽ giành chiến thắng."
 unplugged.5004.c.tt: "\nChính phủ quyết định không áp dụng bất kỳ biện pháp nào, để dư luận phát triển theo xu thế tự nhiên"
 unplugged.5005.name: "Chip Quản lý Cảm xúc"
 unplugged.5005.desc: "Sự dung hợp độc đáo giữa đặc tính sinh học của giống loài chúng ta và các yếu tố công nghệ độc hại đã mang đến cho giới nghiên cứu một cơ hội hiếm có.\n\nViệc tiến hành nghiên cứu trên những bệnh nhân vừa nếm trải lợi ích lại vừa chịu đựng tác hại của các thiết bị cấy ghép này, đã mở ra một lĩnh vực nghiên cứu hoàn toàn mới: Biến đổi hóa học não bộ.\n\nThông qua quá trình nghiên cứu nghiêm ngặt, các nhà khoa học đã chế tạo thành công một loại \"chip cảm xúc\" tinh vi, có khả năng điều tiết hành vi cá nhân, từ đó mang lại lợi ích chung cho toàn xã hội. Có thể lựa chọn hóa chất phù hợp để tiến hành sửa đổi dựa trên những kết quả mong đợi."
 unplugged.5005.a: "Neuroene, giúp chúng ta giảm thiểu tội phạm."
 unplugged.5005.a.tt: "Một chất dẫn truyền thần kinh tổng hợp, làm giảm sự bốc đồng và tính hung hăng, thúc đẩy các cá nhân đặt các chuẩn mực xã hội lên trên lợi ích cá nhân."
 unplugged.5005.b: "Regenol-X. Rút ngắn thời gian tái tạo."
 unplugged.5005.b.tt: "Một hợp chất công nghệ sinh học, có khả năng điều phối hệ thống sinh học và hệ thống tổng hợp, giúp cho thiết bị cấy ghép điện tử có khả năng tự sửa chữa ở cấp độ phân tử."
 unplugged.5005.c: "Cogitive. Giúp tư duy nhạy bén hơn."
 unplugged.5005.c.tt: "Một loại chế phẩm hóa học thần kinh tiên tiến được thiết kế để tăng cường độ dẻo dai của khớp thần kinh, khả năng ghi nhớ thông tin và năng lực giải quyết vấn đề."
