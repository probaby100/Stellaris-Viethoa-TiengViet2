 START_SCREEN_UNPLUGGED: "Ý thức của chúng ta đột ngột tỉnh thức giữa ngọn lửa thiêu đốt và nỗi đau xé nát cơ thể. Cảm giác như ngũ quan bị đâm thủng, mọi âm thanh phong phú của thế giới bỗng hóa thành những thước phim câm, thay vào đó là tiếng chuông báo lỗi hệ thống chói tai; một âm trầm lặp đi lặp lại vang vọng trong bức tranh địa ngục đa giác quan của chúng ta.\n\nChúng ta cảm nhận được sát khí: đó là những cỗ máy giết người vô hồn, cùng một số tàu hoa tiêu trông giống hệt phi thuyền của chúng ta một cách kỳ lạ. Những đợt tấn công ban đầu của chúng dồn dập như bão tố, nhưng lại rất thiếu phối hợp. Chúng ta đành vội vã phản công. Bản năng hối thúc chúng ta chiến đấu với chúng, và hình thành một trật tự cơ bản để tập hợp trí tuệ của cả tập thể.\n\nTrận chiến này vẫn chưa phân thắng bại, nhưng nhờ lực lượng phân tán của chúng ta hiện đã có chỗ đứng tại [capital_scope.GetName], hy vọng chiến thắng sẽ sớm đến. Sau đó có lẽ chúng ta sẽ tìm ra được chuyện quái quỷ gì đang diễn ra..."
