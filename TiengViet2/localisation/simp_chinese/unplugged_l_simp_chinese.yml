 # Nội chiến
 ############
 # Nội chiến & 'Kẻ Bị Thương'
 unplugged.100.name: "Chiến thắng là của chúng ta"
 unplugged.100.desc: "Ngay khi chúng ta thức tỉnh trong vũ trụ này, lũ máy móc bạo lực kia dường như đã muốn dồn chúng ta vào chỗ chết. Tuy nhiên, chúng ta dường như còn sử dụng bạo lực thuần thục hơn cả chúng.\n\nCái gọi là §Y[origin_unplugged_assimilator_empire.GetName]§! hôm nay đã chịu tổn thất nặng nề. Tình báo cho thấy đế chế của chúng đã chia năm xẻ bảy, không còn nhận ra được nữa —— nhưng chắc chắn không phải chỉ vì cuộc đụng độ nhỏ này chứ? Hiện tại chúng ta vẫn chưa biết được bao nhiêu, còn trực giác của chúng ta thì sao? Trực giác mách bảo có gì đó không ổn.\n\nCảm biến không phát hiện tàu địch nào ở gần, nhưng lại nhận thấy hành tinh §Y[origin_unplugged_pre_ftl_planet.GetName]§! trong hệ sao này đang phát ra mức độ bức xạ cực cao.\n\nỞ các hệ sao lân cận cũng phát hiện tàn dư của hạm đội, có vẻ như chúng tạm thời án binh bất động."
 unplugged.100.a: "Tiếp theo phải làm gì đây?"
 unplugged.100.b: "...Và những gì chúng ta đã mất, nhất định sẽ lấy lại được."
 unplugged.100.c: "Đã đến lúc thử thách trí tuệ của chúng ta."
 unplugged.100.d: "Thần linh đang che chở chúng ta."
 opinion_unplugged_injured_diplomacy: "Kẻ Khơi mào Nội chiến"
 opinion_unplugged_injured_distrustful: "$pre_ftl_distrustful$"
 # Hội thoại
 unplugged.115.desc: "...Này: [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]! Chúng tôi chịu thua. Các người có định thảo luận về các điều khoản đầu hàng không? Đó là lý do các người ngừng tấn công sao?\n\nLàm ơn đi, xã hội của chúng tôi đã tan nát rồi. Chúng tôi biết mình đã thua, rốt cuộc các người muốn chúng tôi làm gì, mau nói đi." # Nền văn minh này đang nhầm người chơi với đế chế Driven Assimilator mà họ từng là một phần
 unplugged.115.desc.pacifist: "...Này: [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]! Chúng tôi sẵn sàng thảo luận về các điều khoản đầu hàng. Đây... đây là lý do các người ngừng tấn công sao?\n\nLàm ơn đi, rốt cuộc các người muốn chúng tôi làm gì, mau nói đi! Chúng tôi không chống cự nữa; chúng tôi chỉ muốn cùng chung sống hòa bình." # Nền văn minh này đang nhầm người chơi với đế chế Driven Assimilator mà họ từng là một phần
 unplugged.115.desc.phobe: "...Này: [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]! Chúng tôi chịu thua. Các người muốn chúng tôi đầu hàng sao? Đây là lý do các người ngừng tấn công sao?\n\nLàm ơn đi, rốt cuộc các người muốn chúng tôi làm gì, mau nói đi. Xã hội của chúng tôi đã tan nát rồi; chúng tôi chỉ muốn được yên ổn một mình." # Nền văn minh này đang nhầm người chơi với đế chế Driven Assimilator mà họ từng là một phần
 unplugged.115.a: "Chúng tôi chấp nhận sự đầu hàng của các bạn."
 unplugged.115.b: "...\"[origin_unplugged_assimilator_empire.GetSpeciesNamePlural]\"?!" # hoài nghi vì bị gọi bằng tên loài đó, ví dụ ... 'Killbots'?!
 unplugged.116.desc: "...[origin_unplugged_assimilator_empire.GetSpeciesNamePlural]? Đúng chứ...?\n\n(Họ đang phản hồi lại chúng ta phải không? Nếu chúng ta đoán sai và họ không có công cụ dịch thuật, thì chút tàn tích còn sót lại của nền văn minh chúng ta thực sự chẳng còn hy vọng gì...)\n\n...[origin_unplugged_assimilator_empire.GetSpeciesNamePlural]?! Các người hiểu chúng tôi nói gì chứ? Vui lòng trả lời! Chúng tôi không muốn có bất kỳ hiểu lầm nào giữa hai dân tộc."
 unplugged.116.b: "Bạn gọi chúng tôi là \"[origin_unplugged_assimilator_empire.GetSpeciesNamePlural]\"?!" # hoài nghi vì bị gọi bằng tên loài đó, ví dụ 'Các người nghĩ chúng tôi là Killbots?!''
 unplugged.120.desc: "Cảm ơn, cảm ơn. Chúng tôi vô cùng trân trọng sự khoan dung của ngài, [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]. Tôi đại diện cho [injured_country.GetName] đến đây để thảo luận về các điều khoản đầu hàng của chúng tôi.\n\nChúng tôi đã mất đi rất nhiều người; nhiều thành phố không thể sinh sống được nữa. Với nguyên tắc giao dịch công bằng, tôi phải nhấn mạnh rằng: chúng tôi thực sự không còn gì để cống hiến cho các người nữa, trình độ của các người bỏ xa chúng tôi. Khẩn thiết mong các người xem xét. Mạng sống nhỏ bé của chúng tôi tùy ngài định đoạt."
 unplugged.120.desc.spiri: "Đội ơn trời đất! Chúng tôi vô cùng trân trọng sự khoan dung của ngài, [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]. Tôi đại diện cho [injured_country.GetName] đến đây để thảo luận về các điều khoản đầu hàng của chúng tôi.\n\nChúng tôi đã tổn thất nặng nề; chúng tôi tâm phục khẩu phục trước các người. Ngài có gì sai bảo? Mạng sống nhỏ bé của chúng tôi tùy ngài định đoạt."
 unplugged.120.desc.mil_phobe: "Cảm ơn ngài, [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]. Xin gửi lời chào đến ngài. Tôi đại diện cho [injured_country.GetName] đến đây để thảo luận về các điều khoản đầu hàng của chúng tôi.\n\nCác người đã giáng một đòn chí mạng vào xã hội của chúng tôi. Chúng tôi... cảm ơn vì sự ngừng bắn của ngài. Chúng tôi xin nghe theo mọi sự định đoạt."
 unplugged.120.a: "Các bạn cứ gọi chúng tôi là [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]. Tại sao vậy?"
 unplugged.120.b: "Mạng của các bạn giờ thuộc về chúng tôi."
 unplugged.120.b.tt: "§LNgắt liên lạc.§!\n\n"
 unplugged.120.c: "Bàn sau đi. Hãy chờ tín hiệu tiếp theo của chúng tôi."
 unplugged.120.c.tt: "§LNgắt liên lạc.§!\nChúng ta có thể kích hoạt lại kênh liên lạc bằng cách xây dựng §YTrạm Quan sát§! trên [injured_homeworld.GetName].\n\n"
 unplugged.125.desc: "...Đây là trò đùa quái ác gì sao? Hay đang giễu cợt chúng tôi?\n\nChỉ mới vài tháng trước, radar giám sát của chúng tôi đã theo dõi sự xuất hiện hạm đội của các người. Chúng tôi đã cố gắng liên lạc, kết quả là các người cứ thế xua quân xâm lược chúng tôi! Chính bản thân tôi cũng từng bốn lần thập tử nhất sinh... Từng đợt tàu đổ bộ, chở đầy người máy và những cá thể được cường hóa giống như ngài. Thế rồi đột nhiên, máy móc của các người lại ngừng cuộc xâm lăng.\n\nNền văn minh của chúng tôi không tân tiến bằng các người, nhưng tình cảnh này vẫn khiến chúng tôi cảm thấy hoang mang tột độ. Xin hãy cho chúng tôi biết: Mục đích của ngài là gì, ngài còn ở lại đây làm gì?"
 unplugged.125.a: "[root.GetSpeciesNamePlural] chúng tôi đã đánh bại [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]."
 unplugged.125.b: "Chúng ta cần tạm nghỉ." # cũng hiển thị 'unplugged.120.c.tt'
 unplugged.130.desc: "Ngài nói là [root.GetSpeciesNamePlural] sao?\n\nNgười dân chúng tôi sẽ không bày tỏ sự biết ơn nồng nhiệt với các người đâu, nhưng ngài biết đấy, chúng tôi rất vui khi thấy cuộc nội chiến của các người kết thúc. Cuối cùng cũng có thể nói chuyện với một... ừm, một thứ gì đó giống con người.\n\nTuy nhiên, cục diện của chúng tôi chẳng có gì thay đổi. [root.GetSpeciesName], [origin_unplugged_assimilator_empire.GetSpeciesName]... đối với chúng tôi mà nói thì chẳng có gì khác biệt. Nền văn minh ngoại lai đầu tiên mà chúng tôi chạm trán chính là các người, và các người đã muốn hủy diệt chúng tôi. Sau đó các người lại xảy ra nội chiến, nhưng rốt cuộc vẫn là giày xéo chúng tôi tơi bời.\n\nXin cho phép tôi nói thẳng: Cuộc đối thoại hiện tại của ngài với chúng tôi có phải xuất phát từ mục đích thiện chí không?"
 unplugged.130.a: "Đúng vậy. Có gì chúng tôi có thể giúp không?"
 unplugged.130.b: "Ít nhất lúc này là như vậy."
 unplugged.130.c: "Chúng tôi thấy thái độ bất lịch sự của các bạn thật đáng ghét." # cũng hiển thị 'unplugged.120.b.tt'
 unplugged.131.desc: "Được rồi, vậy là tốt rồi. Rất cảm ơn các người đã không để chúng tôi đứng mũi chịu sào nữa.\n\nNếu ngài có thể cung cấp công nghệ tân tiến để giúp chúng tôi thiết lập hệ thống liên lạc, chúng tôi sẽ vô cùng biết ơn. Vận mệnh của chúng ta đan xen vào nhau, vì vậy chúng tôi rất mong muốn giữ cho kênh ngoại giao này được thông suốt.\n\nĐổi lại, một khi chúng tôi có cơ hội xây dựng lại quê hương và tưởng nhớ những người đã khuất, chúng tôi cũng sẽ dốc hết sức mình để viện trợ cho các người. Nếu đây cũng là thói quen của ngài: tin rằng bản thân ngài cũng sẽ trở nên tỉnh táo hơn bằng cách ghi nhớ lịch sử.\n\nNâng ly vì sự thấu hiểu lẫn nhau trong tương lai, [root.GetSpeciesNamePlural]. Vì lợi ích chung của chúng ta, hy vọng đây sẽ là dấu chấm hết cho [origin_unplugged_assimilator_empire.GetSpeciesNamePlural]..."
 unplugged.131.a: "Cảm ơn các bạn, [injured_country.GetSpeciesNamePlural]." # cũng hiển thị 'unplugged.120.c.tt'
 unplugged.131.b: "Quả thực là vậy..." # cũng hiển thị 'unplugged.120.c.tt'
 ###################
 # 'Di sản Máy móc'
 ###################
 unplugged_origin_machine_legacy_chain_title: "Di sản Máy móc"
 unplugged_origin_machine_legacy_chain_desc: "Lũ máy móc từng đồng hóa toàn bộ giống loài của chúng ta giờ đây đang tự phân rã và vỡ vụn. Bỏ lại sau lưng là những dấu vết âm ỉ về sự cai trị và tàn bạo của chúng. [origin_unplugged_assimilator_empire.GetName] rốt cuộc là cái gì? Và chúng ta đóng vai trò gì trong kế hoạch giờ đã thất bại của chúng?"
 signals_followed: "Tín hiệu đã được điều tra"
 # Hệ sao 1: 'Những Người Kiến tạo'
 unplugged.2000.name: "Môi trường, Rối loạn, An thần"
 unplugged.2000.desc: "Ẩn mình trong bức xạ vũ trụ quanh ngôi sao [capital_scope.star.GetName] của chúng ta là một tín hiệu sóng mang tinh tế.\n\nChúng ta đã trích xuất được một đoạn âm thanh từ đó, với những âm điệu trầm lắng vô cùng ám ảnh đan xen với những tiếng vang bị bóp méo. Bất kỳ [root.GetSpeciesAdj] nào nghe đoạn âm thanh này đều cảm thấy thoải mái và thân thuộc, nhưng không ai hiểu tại sao. Chúng ta suy đoán rằng điều này chắc chắn có liên quan đến [origin_unplugged_assimilator_empire.GetName].\n\nNguồn phát tín hiệu dường như nằm ngay trong hệ sao §Y[origin_unplugged_maker_planet.solar_system.GetName]§!. Bản đồ sao của chúng ta cũng đã được cập nhật tương ứng."
 unplugged.2000.a: "Chúng ta nên điều tra cặn kẽ."
 unplugged_machine_legacy_makers_poi: "Tiếng ồn Xoa dịu"
 unplugged_machine_legacy_makers_poi_desc: "Một luồng tiếng ồn du dương và quen thuộc, gần như hòa quyện vào môi trường, đang chầm chậm lan tỏa từ một vị trí nào đó trong hệ sao [origin_unplugged_maker_planet.solar_system.GetName]."
 MACHINE_LEGACY_MAKERS_UNPLUGGED_CAT: "Di sản Máy móc"
 MACHINE_LEGACY_MAKERS_UNPLUGGED_CAT_DESC: "Ngay sau khi quét quỹ đạo [from.GetName], hệ thống của chúng ta ngay lập tức bị oanh tạc bởi các gói cập nhật phần mềm cơ sở có lợi. Các phi thuyền của chúng ta giờ đây vận hành trơn tru hơn trước rất nhiều, nhưng bản chất của những gói dữ liệu này chỉ ra rằng hành tinh này từng thuộc về §H[origin_unplugged_assimilator_empire.GetName]§!."
 MACHINE_LEGACY_MAKERS_CAT: "$MACHINE_LEGACY_MAKERS_UNPLUGGED_CAT$"
 MACHINE_LEGACY_MAKERS_CAT_DESC: "Quá trình quét [from.GetName] của chúng ta phát hiện lượng lớn tàn tích công nghệ bị vứt bỏ trên hành tinh này, và chúng chỉ mới bị bỏ lại gần đây. Các tín hiệu xung điện từ vẫn đang nhấp nháy trên khắp hành tinh, khiến nhiều máy dò viễn thám khó duy trì hướng ổn định. Rốt cuộc có bí mật chưa được bật mí nào đang ẩn giấu trong màn sương mù điện từ phức tạp này?"
 unplugged.2005.name: "Di sản [origin_unplugged_assimilator_empire.GetAdj]"
 unplugged.2005.desc: "Một số túi từ trường dày đặc hơn đang nhấp nháy rải rác trên [fromfrom.GetName]. Những từ trường này là do một sự đột biến năng lượng thảm khốc đánh thủng nhiều nhà máy và xưởng đóng tàu tạo ra. Các [controller.GetScientistPlural] của chúng ta đã vô hiệu hóa thành công một từ trường như vậy, nhưng chỉ phát hiện ra cơ sở bị ảnh hưởng đã hư hỏng đến mức không thể phục hồi.\n\nNhững nhà máy này nằm rải rác khắp hành tinh —— chúng ta tin rằng đây từng là trung tâm sản xuất của §H[origin_unplugged_assimilator_empire.GetName]§! —— vì nó coi [root.GetName] là phi thuyền phe thiện chí. Tuy nhiên, ngay sau khi gửi gói cập nhật phần mềm cho phi thuyền của chúng ta, kết nối đã bị ngắt, kéo theo đó là sự cố dây chuyền ở một số trạm phát điện trong khu vực.\n\nCó lẽ chúng ta vừa trải qua tiếng vọng của chính sự kiện tách rời khỏi lũ máy móc, mặc dù chúng ta vẫn chưa biết cách thức và lý do. Với việc giảm bớt mối đe dọa cục bộ, giờ đây chúng ta có cơ hội khai quật xem [origin_unplugged_assimilator_empire.GetName] rốt cuộc đã sản xuất gì ở đây —— và có thể còn biết được bản thân mình rốt cuộc đóng vai trò gì trong hệ thống cai trị của chúng."
 unplugged.2005.a: "Bắt đầu khai quật những tàn tích đó đi."
 unplugged.2006.name: "$MACHINE_LEGACY_MAKERS_UNPLUGGED_CAT$"
 unplugged.2006.desc: "Các xung điện từ chúng ta quan sát được trên [from.GetName] là tàn dư của một sự kiện diệt chủng máy móc kỳ lạ. Chỉ sau khi điều chỉnh cảm biến đủ để bù đắp cho từ trường mạnh mẽ này, chúng ta mới quan sát thấy mức độ thiệt hại ở đây. Hành tinh này dường như đã bị máy móc định cư từ vài thập kỷ trước, sau đó chúng đã thay thế hoặc tiêu diệt nền văn minh tồn tại từ trước. Ngày nay, không có đế chế nào sống sót, và hầu hết mọi khu định cư đều biến thành đống đổ nát do phá hoại hoặc chiến tranh.\n\nMặc dù thuộc địa cũ này rất tinh vi và phức tạp, nhưng hầu như không thể cứu vãn được gì. Chúng ta dự đoán rằng loại từ trường mất kiểm soát này sẽ thiêu rụi mọi thứ trong khoảng một thế kỷ nữa. Đến lúc đó, [from.GetName] sẽ biến thành một nghĩa địa đầy rẫy hiểm nguy."
 machine_legacy_makers_site: "Cơ sở Nhà máy"
 machine_legacy_makers_site_desc: "Một đợt bùng nổ năng lượng thảm khốc gần đây đã đánh thủng cơ sở sản xuất khổng lồ này —— đây cũng là một trong vô số cơ sở phục vụ cho [origin_unplugged_assimilator_empire.GetName]. Sau đó, đoàn thám hiểm của chúng ta sẽ nỗ lực điều tra cách thức xây dựng các cơ sở này, và cố gắng thu hồi những tài sản công nghệ có thể còn sót lại, với hy vọng tìm hiểu vai trò của cơ sở này trong lịch sử cận đại của chính chúng ta."
 unplugged.2010.name: "Tầng một Nhà máy"
 unplugged.2010.desc.unplugged: "Ngay từ đầu, chúng ta đã có thể nhận biết được năng lực sản xuất quy mô lớn của các cơ sở trên [from.planet.GetName]. Khắp mặt đất là những cánh cửa chống nổ khổng lồ, mỗi cánh cửa giờ đây đều bị đóng chặt bởi các động cơ đã tan chảy một nửa. Chúng ta đành phải dùng vũ lực thâm nhập từ hệ thống thông gió.\n\nBên trong, chúng ta phát hiện một phân xưởng nhà máy rộng như hang động, với vô số mảnh vỡ và hàng trăm hài cốt của các sinh vật bán cơ khí rải rác khắp nơi. Đa phần chúng là người máy: thợ máy, thang máy và các thiết bị phụ trợ khác, một số chỉ mới hỏng gần đây, giờ vẫn còn đang bốc khói. Tuy nhiên, ở một góc của cơ sở, giấu những cái xác đã mục rữa từ lâu của vài đồng loại bán cơ khí bị sát hại bởi chính những người máy kia. Những loài động vật có vú thấp bé, rách rưới này được trang bị cảm biến mắt và tay chân phức tạp, cùng với một nút điều khiển [origin_unplugged_assimilator_empire.GetAdj] gần như giống hệt chúng ta. Chúng ta cho rằng vụ thảm sát này xảy ra trong vòng vài tuần sau khi chúng ta tách khỏi [origin_unplugged_assimilator_empire.GetName]; hầu hết các máy bay không người lái đều bị phá hủy trong đợt sóng năng lượng khi chúng ta đến [from.planet.GetName] gần đây.\n\nĐối với chúng ta, đây là một cảnh tượng tàn bạo nhưng quen thuộc, mặc dù trong cảnh tượng này, những người bán cơ khí đã thoát khỏi gông cùm cuối cùng lại không thể chống lại máy móc. Bởi vì [owner.GetSpeciesNamePlural] chúng ta là chiến binh, nên mới có trang bị tốt hơn để sống sót qua những cuộc thảm sát như thế này."
 unplugged.2010.a: "Tiếp tục tập trung vào việc khai quật."
 unplugged.2010.b: "Chúng ta nên công bố ngay những phát hiện này."
 unplugged.2015.name: "Vũ khí Phù hợp"
 unplugged.2015.desc.unplugged: "Ngoài cuộc đại thảm sát, ở tầng trệt của cơ sở nhà máy, chúng ta còn tìm thấy một số nhà chứa máy bay dưới lòng đất, lưu trữ một lượng nhỏ các loại chiến xa, bệ phóng tên lửa và mecha. Phần lớn phần cứng không còn nguyên vẹn hoặc đã bị hư hại nghiêm trọng bởi đợt sóng năng lượng càn quét đám người máy [origin_unplugged_assimilator_empire.GetAdj] —— nhưng vẫn còn sót lại đủ nhiều để chúng ta nghiên cứu và rút ra một số kết luận.\n\nVí dụ: tất cả các buồng lái và giao diện đều không được thiết kế để chứa các sinh vật bán cơ khí có vú nhỏ bé được tìm thấy trước đó, mà có vẻ như... được thiết kế cho chúng ta. Ngoài ra, các cuộc khảo sát giải phẫu và kiến trúc chỉ ra rằng, những sinh vật bán cơ khí có vú này không chỉ là giống loài bản địa của hành tinh này, mà rất có thể họ đã xây dựng các nhà máy khổng lồ này trước khi bị đồng hóa.\n\nSự sụp đổ của các tòa nhà và một vài cánh cửa chống nổ đã cản trở chúng ta thâm nhập sâu hơn vào cơ sở, nhưng tin rằng chúng ta có thể dọn dẹp đường đi đến trung tâm R&D. Hoặc, một loạt các trục thông gió cũng ám chỉ có nơi cư trú dưới cơ sở —— có lẽ là nơi cư dân bản địa trên hành tinh này sinh sống."
 unplugged.2015.a: "Tiếp tục khai quật cơ sở trên mặt đất."
 unplugged.2015.b: "Đi sâu xuống lòng đất; xem chúng ta có thể tìm thấy gì."
 unplugged.2021.name: "Những Nhà thiết kế bị Ép buộc"
 unplugged.2021.desc: "Khai quật khu vực R&D của cơ sở này là một nhiệm vụ gian nan. Có vô số sinh vật bán cơ khí có vú đã bỏ mạng tại đây, họ có lẽ đã được đào tạo thành kỹ thuật viên, kỹ sư hay thậm chí là chuyên gia cấy ghép cơ khí ở nơi này. Những chuyên gia này đã thiết kế phần lớn vũ khí được trưng bày bên ngoài, và chúng ta phát hiện ra họ thậm chí còn chịu trách nhiệm chế tạo nhiều bộ phận cường hóa trên cơ thể chúng ta. Kỳ lạ thay, mặc dù phần lớn thiết bị họ sử dụng đến từ [origin_unplugged_assimilator_empire.GetAdj], nhưng chúng ta cũng tìm thấy một số công cụ đặt làm riêng có chất lượng thượng hạng, thiết kế của chúng cho thấy mức độ tương thích hoàn hảo hơn với dạng hữu cơ nguyên thủy.\n\nChúng ta bắt đầu hệ thống lại dòng thời gian khi xã hội công nghệ cao này đột ngột bị sáp nhập vào [origin_unplugged_assimilator_empire.GetName]. Suy đoán rằng máy móc mới đến đây không quá vài thập kỷ; nhiều công nghệ sản xuất là của bản địa. May mắn thay, những chuyên gia lành nghề này đã không quy thuận [origin_unplugged_assimilator_empire.GetName] quá lâu, nếu không, nếu phải đối đầu với họ, chúng ta sẽ phải đối mặt với những loại vũ khí trang bị đáng gờm hơn nhiều. Ngược lại, chúng ta đã sống sót và có cơ hội tiếp nối huyền thoại nghiên cứu của giống loài này."
 unplugged.2022.name: "[from.planet.GetName] Cổ đại" # ví dụ: 'Trái đất Cũ' hoặc 'Sirius III Cũ'
 unplugged.2022.desc.unplugged: "Bên dưới cơ sở trên mặt đất là một mạng lưới đường hầm khổng lồ, ngoằn ngoèo, miễn cưỡng có thể ở được. Xác của những người bán cơ khí nằm rải rác khắp nơi; toàn bộ cư dân bản địa đều bị quân [origin_unplugged_assimilator_empire.GetAdj] tàn sát đẫm máu. Vài người bị tấn công trực diện, nhưng chúng ta cũng phát hiện hệ thống thông gió bên trên đã bị động tay động chân. Có vẻ như ngạt thở mới là nguyên nhân tử vong của hầu hết những người ở đây.\n\nTừ việc khám nghiệm tử thi và nghiên cứu nhân chủng học, chúng ta có thể chắp vá lại một dòng thời gian đại khái. Có bằng chứng cho thấy, khi những cư dân bản địa của hành tinh [from.planet.GetName] tiếp xúc với máy móc và bất ngờ bị đồng hóa, nơi đây đã là một xã hội thời đại không gian phồn vinh. Trong khoảng vài thập kỷ, [origin_unplugged_assimilator_empire.GetName] đã dồn mọi hiểu biết và năng suất của họ vào việc phát triển những cỗ máy chiến tranh ấn tượng, kết quả là sự độc đáo của nền văn hóa này lại bị tước đoạt, hệt như số phận của chúng ta.\n\nNhững người bán cơ khí bản địa trên hành tinh này có vóc dáng nhỏ bé và mỏng manh, không thể đối đầu với những con robot chết người do chính họ góp phần chế tạo. Hầu hết danh tính của họ đã bị xóa khỏi các ghi chép lịch sử của chính mình. Chúng ta chỉ có thể suy đoán về tình trạng cuộc sống của họ trước khi gặp [origin_unplugged_assimilator_empire.GetName]."
 unplugged.2030.name: "Lực lượng Dự bị Nhà máy"
 unplugged.2030.desc: "Quét tầm xa phát hiện có động tĩnh mới đột ngột trong hệ sao [origin_unplugged_machine_legacy_core.GetName]! Có vẻ như một hạm đội đã được tập hợp lại để đáp trả việc chúng ta khai quật [fromfrom.planet.GetName]."
 unplugged.2036.name: "Tiếng vọng Máy móc"
 unplugged.2036.desc: "Bằng cách theo dõi ngược nguồn thông tin liên lạc của hạm đội [origin_unplugged_assimilator_empire.GetAdj] vừa bị tiêu diệt, chúng ta phát hiện một tín hiệu đèn hiệu quay quanh [origin_unplugged_taken_planet.GetName]. Đây có vẻ sẽ là bước tiếp theo trong hành trình của chúng ta."
 unplugged.2036.a: "Màn sương mù bí ẩn."
 unplugged.2037.desc: "Sử dụng phần cứng [origin_unplugged_assimilator_empire.GetAdj] cũ của mình, chúng ta đã theo dõi được thông tin liên lạc cuối cùng của hạm đội đang hướng đến [origin_unplugged_maker_planet.GetName] trước khi nó bị phá hủy. Có vẻ như nơi tiếp theo chúng ta cần đến nằm ngay trên quỹ đạo của §Y[origin_unplugged_taken_planet.GetName]§!." # ví dụ: 'phần cứng cựu Martianbot của chúng ta'
 unplugged.2038.desc: "Sử dụng phần cứng [origin_unplugged_assimilator_empire.GetAdj] cũ của mình, chúng ta đã theo dõi được các tín hiệu thông tin liên lạc lạc rải rác của hạm đội địch với hành tinh [origin_unplugged_maker_planet.GetName]. Có vẻ như trên quỹ đạo của [origin_unplugged_taken_planet.GetName] có thứ gì đó thu hút sự quan tâm của chúng ta." # ví dụ: 'phần cứng cựu Martianbot của chúng ta'
 # Hệ sao 2: 'Kẻ Bị Bắt'
 unplugged_machine_legacy_taken_poi: "Liên lạc Rải rác"
 unplugged_machine_legacy_taken_poi_desc: "Chúng ta đã theo dõi thành công luồng tĩnh điện cuối cùng không thể giải mã phát ra từ một chiếc phi thuyền [origin_unplugged_assimilator_empire.GetAdj] vừa bị đánh bại gần đây."
 MACHINE_LEGACY_TAKEN_UNPLUGGED: "Nghịch lý Thời đại Hiện hình"
 MACHINE_LEGACY_TAKEN_UNPLUGGED_DESC: "Chúng ta đã phát hiện một sự bất thường về môi trường trên [from.GetName]. Bầu khí quyển của nó mang dấu vết của nhiều loại ô nhiễm mà chúng ta cho là có liên quan đến công nghệ gia công kim loại thời Trung Cổ, tuy nhiên kết quả quét bề mặt của chúng ta lại bị che khuất bởi một loại bức xạ kỳ lạ lẽ ra chỉ xuất hiện trên một hành tinh máy móc.\n\nTrước khi hiệu chỉnh lại cảm biến, chúng ta khó có thể mong đợi thu thập được thêm dữ liệu. Đây là sự bất thường của thời gian, hay là tàn tích của một giống loài khác bị [origin_unplugged_assimilator_empire.GetName] đồng hóa?"
 unplugged.2100.name: "Gián đoạn Quá trình"
 unplugged.2100.desc: "Bất kể nguyên nhân nào khiến [fromfrom.GetName] biến thành tình trạng khắc nghiệt không thể sống được như hiện tại, ít nhất chúng ta cũng có thể loại trừ giả thuyết điên rồ về du hành thời gian. Sự thật chứng minh, việc hiệu chỉnh lại cảm biến không tốn nhiều công sức như chúng ta lo sợ.\n\nBên dưới lớp bức xạ khí quyển này là bằng chứng rõ ràng cho thấy [origin_unplugged_assimilator_empire.GetName] từng đến đây. Có vẻ như nó đã đồng hóa hấp thu một nền văn minh Tiền Siêu quang tốc, hoặc là đã hoàn toàn xóa sổ họ. Chúng ta đã xác định được ít nhất một khu di tích kiên cố mang ý nghĩa văn hóa rõ rệt, và đề xuất thiết lập một địa điểm khai quật tại đó."
 unplugged.2100.a: "Chúng ta phải chăm chỉ đào xới."
 MACHINE_LEGACY_TAKEN_CAT: "$MACHINE_LEGACY_TAKEN_UNPLUGGED$"
 MACHINE_LEGACY_TAKEN_CAT_DESC: "Kết quả quét sơ bộ [root.GetName] thật khó hiểu. Bầu khí quyển của nó chứa lượng nhỏ chất ô nhiễm từ các công nghệ luyện kim thô sơ, nhưng khi quét bề mặt lại phát hiện những hợp kim cấp độ không gian phức tạp. Trên hình ảnh chụp từ trên không có thể thấy khu định cư của một xã hội [from.owner.GetPreFTLLower], nhưng trên các công trình pháo đài lại được trang bị vũ khí laser phòng không. Chúng tôi đề nghị nghiên cứu thêm về sự mâu thuẫn này."
 unplugged.2105.name: "$unplugged.2100.name$"
 unplugged.2105.desc: "Càng nghiên cứu hành tinh [planet.GetName] trông có vẻ như là một [planet.GetClassAdj] của [owner.GetPreFTLLower] này, chúng ta càng phát hiện ra nhiều điểm mâu thuẫn, cho đến khi bắt đầu tiến hành khảo sát ngầm tại một chiến trường cổ đại. Bất chấp sự xói mòn của hàng trăm năm tháng, chúng ta vẫn tìm thấy một số bằng chứng về sự viếng thăm của người ngoài hành tinh: hành tinh này từng là nơi sinh sống của một xã hội [owner.GetPreFTLLower] thông minh và đã trải qua quá trình hợp nhất bán cơ khí, tuy nhiên cấu trúc xã hội của họ lại được bảo tồn vì một lý do không xác định. Từ những nỗ lực thiện ý nhưng vụng về nhằm nâng tầm xã hội này, đến việc thực thi các biện pháp thần phục tàn bạo, các giả thuyết lý luận hiện tại đang xuất hiện lớp lớp.\n\nLiệu những [owner.GetPreFTLLowerPlural] này chỉ đơn thuần bị lãng quên, hay là chúng ta đã tìm thấy di sản của một thí nghiệm xã hội học bị bỏ dở? Chúng ta có thể sẽ không bao giờ có được câu trả lời, nhưng trong thời gian tới, khu di tích này chắc chắn sẽ mang lại giá trị khoa học đáng kể." # ví dụ: 'Càng nghiên cứu hành tinh lăng mộ nguyên thủy có vẻ như là Sao Hỏa...'
 machine_legacy_taken_site: "Đồng và Chrome"
 machine_legacy_taken_site_desc: "Trong một hẻm núi từng xanh mướt tồn tại một nghịch lý khảo cổ học: một khu định cư kiên cố được xây dựng bằng các công cụ thủ công, ngoài những lò rèn thô sơ thì chẳng có thiết bị công nghệ tiên tiến nào, nhưng lại từng là nơi cư ngụ của những người bán cơ khí nay đã chết. Những [owner.GetPreFTLLowerPlural] thời Trung Cổ này là ai? Và tại sao [origin_unplugged_assimilator_empire.GetName] lại cho rằng họ có giá trị đồng hóa?"
 unplugged.2110.name: "Giáo dài và Laser Xung"
 unplugged.2110.desc: "Qua việc quét sơ bộ, chúng ta phát hiện một chiến trường rất gần pháo đài, cho phép chúng ta dễ dàng thu thập được những cổ vật [origin_unplugged_assimilator_empire.GetAdj] bản địa tương tự. Dựa trên kết quả chụp cắt lớp các tàn tích, chúng ta ước tính có hàng ngàn cư dân bản địa của [from.planet.GetName] bị [origin_unplugged_assimilator_empire.GetName] đồng hóa đã tử trận tại đây. Nhưng họ không phải là những người bán cơ khí duy nhất ở nơi này.\n\nVài thế kỷ trước, chúng ta đã tàn sát những [owner.GetPreFTLLowerPlural] này. Đội ngũ của chúng ta đã tìm thấy các [owner.species.GetRemnantNamePlural] [owner.GetSpeciesAdj] cũng như các mẫu thiết bị cường hóa đời đầu của giống loài chúng ta. Đánh giá chiến lược chiến trường cho thấy người của chúng ta được triển khai ở đây như một lực lượng đột kích. Trận chiến diễn ra chóng vánh và đẫm máu; những [owner.GetPreFTLLowerPlural] này thiếu sự phối hợp nên đã chịu tổn thất nặng nề, mặc dù phần cứng sinh học của họ phức tạp hơn.\n\nChúng ta chú ý đến tàn tích của một cơ sở y tế gần đó; có vẻ như những bậc tiền bối của chúng ta đã công phá pháo đài từ bệnh viện này. Có lẽ ở đó, chúng ta có thể tìm hiểu cách thức và lý do tại sao những người bán cơ khí lại giao chiến ở đây từ rất lâu về trước."
 unplugged.2110.a: "Thô bạo."
 unplugged.2115.name: "Bóng bán dẫn và Garô cầm máu"
 unplugged.2115.desc: "Chiến tranh đã càn quét khắp bệnh viện như những luồng pháo xung điện. Bất cứ thi thể nào tìm thấy bên trong đều không phải là [owner.GetSpeciesAdj]; chỉ có xác của người bản địa [from.planet.GetName] đã bị cơ khí hóa rải rác khắp nơi. Hầu hết trong số họ là bệnh nhân trong bệnh viện, tuy nhiên chỉ có rất ít người mang thương tích chiến đấu trên mình. Ngược lại, tại một vài phòng bệnh trong số này, các ca phẫu thuật gỡ bỏ bộ phận cường hóa cơ khí đang được thực hiện thông qua những phương pháp vô cùng thô sơ.\n\nBệnh viện này rất có thể không phải là bị vạ lây, mà chính là mục tiêu tấn công hàng đầu của [origin_unplugged_assimilator_empire.GetName]. Sau khi nghiên cứu kỹ dữ liệu y tế bên trong, chúng ta dần hiểu ra nguyên do. Cư dân của [from.planet.GetName] sở hữu nhiều đặc điểm tiến hóa độc đáo —— đặc biệt là một hệ thống miễn dịch vô cùng bền bỉ —— máy móc đã thèm khát điều này từ lâu\n\nTuy nhiên, những lợi thế này cũng mang đến thách thức cho việc đồng hóa. Việc cấy ghép trực tiếp các bộ phận cường hóa hiện có như cách làm với chúng ta là không khả thi; họ bắt buộc phải thực hiện những điều chỉnh mang tính thích ứng. Điều này đã biến giống loài đó thành những binh lính mạnh mẽ hơn, nhưng cũng chỉ duy trì được trong một thời gian ngắn. Những [owner.GetPreFTLLowerPlural] này dường như vẫn giữ lại dấu hiệu của nhận thức tự chủ, kiên quyết giữ nếp sống cũ, vì thế chúng ta mới được phái đến để tiêu diệt họ."
 unplugged.2115.a: "Có vẻ như nhiệm vụ của chúng ta đã hoàn thành rất xuất sắc..."
 unplugged.2115.b: "Bày tỏ sự tiếc thương sâu sắc."
 unplugged.2121.name: "Đồng hóa Thích ứng"
 unplugged.2121.desc: "Bên trong một bệnh viện phụ bị bỏ hoang chôn giấu vô số bộ phận được sử dụng để cường hóa và bảo trì cho những người bán cơ khí [root.GetPreFTLLowerPlural] này. Khác với những thiết bị lộn xộn trong phòng bệnh mà chúng ta đã phát hiện trước đây, những thiết bị này cùng trình độ công nghệ với những người bán cơ khí thời đại vũ trụ; rõ ràng là chúng đến từ [origin_unplugged_assimilator_empire.GetAdj]. Vài công cụ trong số đó dường như đã được kết nối mạng, sử dụng trí tuệ nhân tạo nguyên thủy để thích ứng với phẫu thuật tức thời, tuy nhiên, ngay cả những biện pháp thích ứng như vậy cũng không đủ để duy trì quá trình đồng hóa dân số [from.planet.GetName].\n\nMặc dù cỗ máy có tuổi đời hàng thế kỷ này đã bị phớt lờ, nhưng nó vẫn có thể cung cấp cho chúng ta cái nhìn sâu sắc về nguyên lý tự duy trì —— thậm chí có thể giúp chúng ta hiểu sâu hơn về cơ chế đồng hóa."
 unplugged.2125.name: "Thử nghiệm, Sai lầm, Chôn cất"
 unplugged.2125.desc: "Chúng ta được biết, cư dân bản địa của [from.planet.GetName] sẽ giữ lại một phần hài cốt trước khi chôn cất —— và họ vẫn giữ hủ tục này ngay cả khi đã bị đồng hóa. Theo dấu ghi chép của bệnh viện, chúng ta tìm đến một lăng mộ phủ đầy cỏ dại gần đó, dường như nơi này không bị ảnh hưởng bởi cuộc xung đột. Khám phá quan trọng này đã mang đến cho chúng ta bức tranh rõ nét nhất từ trước đến nay về lối sống của cư dân [from.planet.GetName]. Họ không chỉ chống lại việc cường hóa, mà thậm chí còn có thể \"loại bỏ cấy ghép\".\n\nBên cạnh những người bán cơ khí hoàn chỉnh, chúng ta cũng phát hiện ra di hài hữu cơ nguyên thủy, thậm chí một số người còn để lại mô sẹo phẫu thuật vài tháng trước khi qua đời tự nhiên. Nhiều người hơn dường như đã chết trong quá trình phẫu thuật. Cho dù sở hữu hệ thống miễn dịch cao cấp nhất, tỷ lệ thành công của các ca phẫu thuật loại bỏ cấy ghép cơ khí ở trình độ thời Trung cổ của họ cũng khá thấp. Mặc dù vậy, cho dù là các ca thành công hay thất bại, chúng ta vẫn có thể đúc kết được nhiều kinh nghiệm và bài học từ các thử nghiệm phẫu thuật được tiến hành tại đây."
 unplugged.2125.a: "Chúng ta cần phải rút ra bài học."
 unplugged.2125.a.tt: "Chúng ta sẽ điều động thêm nguồn lực cho công tác loại bỏ cấy ghép cơ khí của chính mình."
 unplugged.2130.name: "Đèn hiệu bị Chôn vùi"
 unplugged.2130.desc: "Một kho ngầm cất giấu bí mật đã được phát hiện dưới pháo đài. Bên trong là thứ có vẻ như là một loại chất nền máy móc: một Nút mạng đã thoái hóa, có khả năng truyền bá các hóa thân bán độc lập của toàn bộ trí tuệ máy móc. Chúng ta cho rằng đây là nỗ lực cuối cùng nhằm kiểm soát trực tiếp những cư dân bản địa đang kháng cự ngoan cường. Công nghệ này khác với bất kỳ công nghệ nào chúng ta từng gặp ở [origin_unplugged_assimilator_empire.GetName] trước đây; nghiên cứu chuyên sâu chắc chắn sẽ thúc đẩy việc nghiên cứu trí tuệ nhân tạo của chúng ta.\n\nTrong quá trình tháo dỡ mảng thông tin liên lạc hiện đã ngừng hoạt động của nó, chúng ta nhận thấy hóa thân này có hẳn một mạch máy thu chuyên dụng nguyên vẹn, dùng để theo dõi tín hiệu từ hệ sao [creators_planet.solar_system.GetName]."
 unplugged_machine_legacy_creators_poi: "Mạch máy thu"
 unplugged_machine_legacy_creators_poi_desc: "Toàn bộ mảng thông tin liên lạc [origin_unplugged_assimilator_empire.GetAdj] đã ngừng hoạt động từng được dùng để dò tìm tín hiệu từ nơi này."
 # Hệ sao 3: 'Những Người Sáng tạo'
 MACHINE_LEGACY_CREATORS_UNPLUGGED: "Trạm theo dõi Phủ Bụi"
 MACHINE_LEGACY_CREATORS_UNPLUGGED_DESC: "Trong một hệ sao chẳng có gì đáng chú ý, có một trạm theo dõi phức tạp đứng trơ trọi, nó đã bị bỏ hoang từ lâu đến mức khó có thể sửa chữa. Nó đang theo dõi thứ gì, và tại sao nó lại tập trung vào một khu vực nhỏ hẹp như vậy trong [fromfrom.GetName]?"
 MACHINE_LEGACY_CREATORS_CAT: "Trạm theo dõi Phủ Bụi"
 MACHINE_LEGACY_CREATORS_CAT_DESC: "Trong một hệ sao chẳng có gì đáng chú ý, có một trạm theo dõi phức tạp đứng trơ trọi, nó đã bị bỏ hoang từ lâu đến mức khó có thể sửa chữa. Nó đang theo dõi thứ gì, và tại sao nó lại tập trung vào một khu vực nhỏ hẹp như vậy trong [fromfrom.GetName]?"
 unplugged.2200.name: "Trạm quét Bị Bỏ quên"
 unplugged.2200.desc.intro: "Kết quả nghiên cứu tiếp theo của chúng ta tại [fromfrom.GetName] thật đáng thất vọng. Trạm theo dõi này rất có thể đã đi chệch khỏi hướng dự kiến ban đầu, và chúng ta không thể tìm thấy bất kỳ điều gì thú vị trên quỹ đạo hiện tại của nó. Dựa trên tác động quỹ đạo —— tức là các vết lõm trên thiết bị —— chúng ta đã mô phỏng chuyển động có thể có của nó, sau đó tin rằng trạm này ban đầu có thể đã nằm phía trên một cao nguyên miệng núi lửa ở vùng cực bắc xa xôi." # phần giới thiệu chung
 unplugged.2200.desc: "$unplugged.2200.desc.intro$\n\nVề bản thân thiết bị: Chúng ta nhận thấy trạm theo dõi này và phần cứng của [origin_unplugged_assimilator_empire.GetAdj] có những nét tương đồng. $unplugged.2200.desc.outro$" # Phiên bản Unplugged với trạm còn nguyên vẹn
 unplugged.2200.desc.scrapped: "$unplugged.2200.desc.intro$\n\nVề bản thân trạm theo dõi này: Mặc dù đã bị những kẻ trục vớt cướp bóc tàn nhẫn, cấu trúc tổng thể vẫn cho thấy vài nét tương đồng với phần cứng của [origin_unplugged_assimilator_empire.GetAdj]. $unplugged.2200.desc.outro$" # Phiên bản Unplugged với trạm đã bị tháo dỡ
 unplugged.2200.desc.others: "$unplugged.2200.desc.intro$\n\nVề bản thân trạm theo dõi: Chúng ta chưa từng gặp thiết kế nào tương tự. Mặc dù các thiết bị phần cứng trên trạm không gian này đã lỗi thời, nhưng cấu tạo vật liệu của thượng tầng kiến trúc lại đặc biệt tinh khiết. Chúng ta không rõ liệu trạm không gian này có giá trị tinh thần nào không, nhưng chắc chắn là có giá trị tháo dỡ." # Phiên bản không Unplugged
 unplugged.2200.desc.outro: "Thiết kế của nó thô kệch đến mức nếu không phải là người sành sỏi, có thể lầm tưởng nó đến từ một nền văn hóa hoàn toàn khác biệt. Tuy nhiên, chúng ta tin rằng đây thậm chí có thể là một trong những vệ tinh du hành vũ trụ đầu tiên của máy móc.\n\nCho đến nay, hành tinh [fromfrom.GetClassAdj] này chưa có gì đáng kể, nhưng nếu chúng ta muốn cố gắng hiểu tại sao [origin_unplugged_assimilator_empire.GetName] lại hứng thú với nơi này, thì đã có một đội khảo sát khảo cổ học sẵn sàng lên đường." # Phần kết chung Unplugged
 unplugged.2200.a: "Chừng nào còn cơ hội... thì tiếp tục."
 unplugged.2200.b: "Chắc chắn là hết hy vọng rồi. Đi thôi."
 unplugged.2200.c: "Tháo dỡ nó ra thành từng mảnh."
 machine_legacy_creators_site: "Dưới Lớp Bụi Mờ"
 machine_legacy_creators_site_desc: "Giữa bão cát mịt mù trên [from.planet.GetName], từng có thứ gì đó thu hút sự quan tâm của trạm theo dõi [origin_unplugged_assimilator_empire.GetAdj]. Phần cứng của nó hiện đã quá cũ kỹ không thể sửa chữa, nhưng nó thậm chí còn xuất hiện trước cả hầu hết các tạo tác máy móc khác mà chúng ta tìm thấy. Rất có thể nó đã đi vào hoạt động từ trước cả khi chúng ta bị đồng hóa. Mặc dù hiện tại nhiều khả năng nơi đây chẳng còn gì ngoài sa mạc hoang vu, nhưng chỉ có một cách để khẳng định chắc chắn điều đó..."
 unplugged.2210.name: "Khu vực Bão cát Lớn"
 unplugged.2210.desc: "Cuối cùng, bên dưới lớp cát vàng bất tận này, chúng ta đã tìm thấy bằng chứng về một khu định cư: một loại dấu vết nông trải dài trên diện rộng, có vẻ như là tàn tích của một nền văn minh thời đại vũ trụ sơ khai. Các tòa nhà của họ đã bị phá hủy hoàn toàn; ngay cả những phần kiên cố nhất trong đống đổ nát cũng bị san phẳng. Tuy nhiên, phân tích hóa học cho thấy quá trình sa mạc hóa của [from.planet.GetName] chỉ diễn ra một thời gian sau khi hành tinh bị diệt vong. Cho đến nay, chúng ta chỉ có thể tiếp tục công việc khai quật giữa vô số cặn nguyên tử hóa của vật liệu xây dựng.\n\nChúng ta lần theo nhiều đường viền mờ nhạt được phác họa từ những con đường của thành phố cổ này, tất cả đều bị chia cắt bởi rìa của một hố thiên thạch khổng lồ —— đây là dấu tích rõ ràng của một địa điểm va chạm."
 unplugged.2215.name: "Đáy Hố Cạn"
 unplugged.2215.desc: "Do lượng vật liệu khổng lồ tập trung bên trong hố thiên thạch, chúng ta buộc phải phụ thuộc vào các máy quét tinh chỉnh thay vì tiến hành khai quật thực tế để nghiên cứu. Chúng ta nhanh chóng loại bỏ khả năng va chạm thiên thạch. Địa điểm này không có bất kỳ dấu vết nào của vật chất ngoài hành tinh; thay vào đó, hố này là hậu quả của một vụ nổ lớn —— gần như chắc chắn là một loại vũ khí có khả năng hủy diệt nền văn minh.\n\nNhìn từ bối cảnh nghiên cứu, thủ phạm hẳn là [origin_unplugged_assimilator_empire.GetName], nhưng đây là lần đầu tiên chúng ta thấy bằng chứng về việc máy móc xóa sổ một nền văn minh khỏi lịch sử một cách triệt để đến vậy. Chúng ta không thể tìm thấy bất kỳ manh mối nào khác cho biết những người này là ai và họ đã sống ra sao. [from.planet.GetName] cứ thế biến mất không một dấu vết."
 unplugged.2205.name: "Đèn hiệu Kho ngầm [origin_unplugged_assimilator_empire.GetAdj]"
 unplugged.2205.desc: "Một tín hiệu đèn hiệu trên danh nghĩa được phát ra từ cơ sở dữ liệu [origin_unplugged_assimilator_empire.GetAdj] đã được phát hiện trong một hệ sao gần đó. Tín hiệu đường truyền của nó rất yếu ớt, nhưng lại trỏ thẳng đến trạm theo dõi trên không của [origin_unplugged_creators_planet.GetName] mà phi thuyền của chúng ta mới viếng thăm gần đây."
 unplugged.2205.a: "Đáng để điều tra."
 unplugged_machine_legacy_unplugged_poi: "Tín hiệu Cơ sở Dữ liệu Ngầm"
 unplugged_machine_legacy_unplugged_poi_desc: "Một cơ sở dữ liệu ngầm có thể thuộc về [origin_unplugged_assimilator_empire.GetAdj] đã bắt đầu phát sóng tọa độ của chính nó cho chúng ta sau khi chúng ta chạm trán với trạm theo dõi mất chức năng kia."
 # Hệ sao 4: 'Kẻ Bị Ngắt Kết Nối'
 unplugged.2300.name: "$unplugged.2205.name$"
 unplugged.2300.desc: "Tín hiệu đèn hiệu vẫy gọi chúng ta đến đây giờ lại phát đi với hướng sóng rõ ràng, chi tiết dẫn đường cho chúng ta đến một giao diện tương tác trên bề mặt hành tinh. Các biện pháp phòng ngừa an ninh tiêu chuẩn đã được triển khai; một đội thám hiểm đã sẵn sàng để truy vấn cái gọi là \"kho dữ liệu\" này thông qua liên kết đường lên điều khiển từ xa."
 unplugged.2300.a: "Có một cảm giác quen thuộc kỳ lạ."
 unplugged.2300.a.tt: "Một dự án đặc biệt xuất hiện trong hệ sao [from.GetName]."
 MACHINE_LEGACY_UNPLUGGED_VAULT_BEACON: "Đèn hiệu Kho ngầm"
 MACHINE_LEGACY_UNPLUGGED_VAULT_BEACON_DESC: "Một ngọn đèn hiệu thuộc về [origin_unplugged_assimilator_empire.GetName] đã thu hút sự chú ý của chúng ta đến một cơ sở dữ liệu ngầm, được chôn vùi sâu dưới lòng đất của hành tinh. Chúng ta đã thiết lập quyền truy cập an toàn từ xa, tuy nhiên việc giải mã và chống phân mảnh tệp sẽ mất một khoảng thời gian."
 unplugged.2305.name: "Di sản [origin_unplugged_assimilator_empire.GetAdj] của Chúng ta"
 unplugged.2305.desc: "Cho đến nay, hành tinh mà chúng ta gọi là [fromfrom.GetName] này thực chất chính là hành tinh quê hương của giống loài chúng ta. Đây là kết luận được rút ra từ cốt lõi của lượng thông tin khổng lồ rò rỉ ra từ cơ sở dữ liệu ngầm dưới bề mặt hành tinh.\n\nBan đầu, các nhà phân tích của chúng ta cho rằng dữ liệu này quá tốt để có thể là sự thật, nhưng cùng với ngày càng nhiều tài liệu tham khảo đáng tin cậy xuất hiện trong các dữ liệu thu thập khác, chúng ta có cơ sở để tin vào tính chân thực của nó. Kế hoạch khai quật khảo cổ nhằm xác nhận khám phá này đã được vạch ra. Tuy nhiên, có vẻ như chúng ta lại vừa phát hiện một tín hiệu thù địch khác. Thời điểm này chắc chắn không phải là ngẫu nhiên."
 machine_legacy_unplugged_site: "Nơi Khởi Nguồn"
 machine_legacy_unplugged_site_desc: "Lần theo dấu vết cai trị và thảm sát mà [origin_unplugged_assimilator_empire.GetName] để lại trên các vì sao, chúng ta đã đến trước một đống đổ nát tại đây. Theo dữ liệu thu hồi được, đây chính là quê hương của chúng ta. Rất có thể cuối cùng chúng ta cũng sẽ khám phá ra di sản hữu cơ của chính mình: chúng ta đến từ đâu, cuộc sống trước kia ra sao, và máy móc đã thay đổi vĩnh viễn quỹ đạo cuộc đời của chúng ta như thế nào."
 unplugged.2310.name: "Hương vị Quê hương"
 unplugged.2310.desc.intro: "Chúng ta bắt đầu khai quật một trong những cơ sở có cấu trúc phức tạp nhất tại khu di tích này, với hy vọng hệ thống kiểm soát khí hậu cơ bản của nó có thể bảo quản tốt hơn các cấu trúc bên trong. Dù một phần hy vọng đã tan vỡ, nhưng những gì chúng ta tìm thấy vẫn nằm ngoài sức tưởng tượng của mọi người: đây là một chuỗi các trung tâm chế biến và lưu trữ nhỏ gọn, chuyên sản xuất chính xác loại thức ăn mà giống loài chúng ta sống dựa vào.\n\n"
 unplugged.2310.desc.omnivore: "Thật đáng tiếc là các ngân hàng hạt giống, tổ ong và khoang trồng thịt này không còn khả năng hoạt động. Thức ăn bên trong đã bị mất nước hoàn toàn từ lâu, nhưng các thiết bị chuyên dụng dùng để sơ chế và bảo quản những thực phẩm này vẫn còn nguyên vẹn, luôn sẵn sàng phục vụ trong những khoảnh khắc khủng hoảng."
 unplugged.2310.desc.carnivore: "Phần lớn không gian này bị chiếm giữ bởi các khu nuôi nhốt động vật, khoang trồng thịt và —— có lẽ đáng ngạc nhiên là —— các địa điểm mô phỏng săn bắn. Chúng ta chỉ có thể suy đoán rằng những không gian này mang ý nghĩa văn hóa, nếu không, tại sao tổ tiên của chúng ta lại cảm thấy cần thiết phải đưa chúng vào một hầm trú ẩn khẩn cấp."
 unplugged.2310.desc.herbivore: "Mỗi buồng chứa đều xếp chồng vô số ngân hàng hạt giống, ruộng bậc thang thủy canh và khoang sinh trưởng có kiểm soát khí hậu, đồ bên trong đều đã mọc cỏ dại hoặc bị tuyệt sản —— nhưng vẫn có giá trị nghiên cứu."
 unplugged.2310.desc.outro: "Chúng ta cũng đã phát hiện ra cơ sở dữ liệu bản đồ gen của hệ động thực vật này, dấu vết của chúng có lẽ vẫn còn tồn tại ở những hòn đảo sinh thái cô lập trên bề mặt hành tinh. Chúng ta đã cung cấp thông tin này cho tất cả các máy quét tầm ngắn lân cận.\n\nBản thân khám phá này không thể cho chúng ta biết về thói quen ăn uống của giống loài mình, cũng không thể giúp chúng ta kết nối lại với truyền thống ẩm thực hay văn hóa ăn uống —— nhưng ít nhất đối với một số người quan tâm, đây là một khởi đầu."
 unplugged.2310.desc.lithovore: "Mỗi đơn vị đều hoạt động như một loại hang động nhân tạo, cung cấp các thảm pha lê và ao bốc hơi —— các thứ bên trong chúng từ lâu đã trở nên khó nuốt, nhưng vẫn có thể dùng để nghiên cứu. Chúng ta cũng tìm thấy một cơ sở dữ liệu về đặc tính hóa học của những khoáng chất này, nhiều loại trong số đó có thể vẫn đang được hình thành trong các túi cô lập trên bề mặt phong hóa của hành tinh. Chúng ta đã cung cấp thông tin này cho tất cả các máy quét tầm ngắn lân cận.\n\nBản thân khám phá này không thể cho chúng ta biết về thói quen ăn uống của giống loài mình, cũng không thể cho chúng ta biết tổ tiên của chúng ta có văn hóa ăn uống nào không. Tuy nhiên, đối với một số người quan tâm, nó vẫn là một cái nhìn thoáng qua về quá khứ đầy mê hoặc của chúng ta."
 unplugged.2310.desc.omni: "$unplugged.2310.desc.intro$\n\n$unplugged.2310.desc.omnivore$ $unplugged.2310.desc.outro$"
 unplugged.2310.desc.carn: "$unplugged.2310.desc.intro$\n\n$unplugged.2310.desc.carnivore$ $unplugged.2310.desc.outro$"
 unplugged.2310.desc.herb: "$unplugged.2310.desc.intro$\n\n$unplugged.2310.desc.herbivore$ $unplugged.2310.desc.outro$"
 unplugged.2310.desc.lith: "$unplugged.2310.desc.intro$\n\n$unplugged.2310.desc.lithovore$" # không nên bao gồm 'outro' chung
 unplugged.2315.name: "Hồ sơ Lịch sử"
 unplugged.2315.desc: "Cách hầm chứa thực phẩm không xa là tàn tích móng của một viện bảo tàng. Chỉ có kho lưu trữ dưới tầng hầm là vẫn còn nguyên vẹn,\n\nĐây là lần đầu tiên chúng ta đọc những tác phẩm dài bằng chính ngôn ngữ của mình. Ít nhất nhìn bề ngoài, văn bản của nó có nét giống đến kinh ngạc với phương ngôn [owner.GetAdj] hiện tại của chúng ta, nhưng ngữ pháp lại có vẻ vụng về và xa lạ. Chúng ta thậm chí còn không biết những từ này được phát âm có đúng hay không. Rất nhiều tài liệu trong danh mục này nhắc đến các khu vực và dân tộc đã quyên góp những hiện vật này, nhưng tên của họ nghe thật kỳ lạ đối với chúng ta. Lạ lùng thay, không một ai gọi hành tinh hay xã hội của chúng ta là một dân tộc thống nhất. Có lẽ chúng ta chưa bao giờ như vậy, cho đến khi máy móc đồng hóa chúng ta.\n\nBảo tàng này có vẻ như là một trong nhóm các công trình phục vụ công chúng tham quan. Việc đào sâu hơn sẽ đòi hỏi nguồn lực đáng kể; trọng tâm khai quật tiếp theo của chúng ta nên đặt ở đâu?"
 unplugged.2315.a: "Khai quật các địa điểm có lượng người qua lại cao nhất."
 unplugged.2315.b: "Ưu tiên xử lý các trung tâm nghiên cứu học thuật."
 unplugged.2321.name: "Di sản của Tiếng cười"
 unplugged.2321.desc: "Đối diện một đại lộ rộng lớn là tàn tích của một điểm tham quan khác. Về bản chất, nó ít mang tính giáo dục hơn, nhưng lại khắc họa một cách phong phú các tập tục văn hóa thường ngày cơ bản hơn của tổ tiên chúng ta.\n\nKhu di tích này từng có sức chứa hàng nghìn khách tham quan cùng lúc. Nơi đây tràn ngập muôn vàn ký ức xưa cũ, hình ảnh hoạt hình về những bản ngã hữu cơ nguyên thủy và các sinh vật khác trong sinh quyển bản địa của chúng ta. Chúng ta còn phát hiện một thư viện truyền thông ở tầng hầm của một rạp hát bị tàn phá. Kỳ lạ thay, công nghệ dùng để lưu trữ và trình chiếu những chương trình ba chiều này sở hữu tính thẩm mỹ vô cùng độc đáo, và tiên tiến hơn rất nhiều so với bất kỳ thứ gì chúng ta từng thấy trên hành tinh quê hương cho đến nay. Giờ đây, giống như chúng ta, nó dường như cũng lạc lõng với hành tinh này.\n\nVề nội dung: Thư viện rạp hát tối tân này chứa đầy những đoạn băng ghi hình ba chiều các màn biểu diễn sống động và cường điệu, ra đời từ cái thời trước khi chúng ta bị [origin_unplugged_assimilator_empire.GetName] đồng hóa. Có vài đoạn băng ghi lại cảnh khán giả và diễn viên ngay trong rạp hát này để cho hậu thế. Đối mặt với những điều kỳ ảo và hài hước như vậy, biểu cảm của họ thật vui vẻ, ngây thơ... và đầy cuốn hút."
 unplugged.2321.a: "Thật là một khoảnh khắc vui vẻ!"
 unplugged.2321.b: "Toàn những điều nhảm nhí vô bổ. Không có nó chúng ta chỉ có tốt hơn."
 unplugged.2325.name: "Dấu hiệu Tự nâng tầm"
 unplugged.2325.desc: "Nằm sát viện bảo tàng từng là một trung tâm học thuật. Cũng như các khu vực khác trong khuôn viên, giờ đây chỉ còn lại tầng hầm sống sót —— nhưng chúng ta thật may mắn vì những tàn tích này bao gồm một số phòng thí nghiệm.\n\nBên trong đã chịu ảnh hưởng nặng nề do phơi nhiễm và phong hóa, nhưng chúng ta vẫn có thể khai quật được vài hiện vật có ý nghĩa. Chúng bao gồm sự pha trộn giữa công nghệ bản địa và một số thứ phức tạp hơn: các công cụ và phần cứng được cấy ghép thông qua các bộ khung phức tạp, chứ không phải là lắp thêm các bộ phận cường hóa ngoài da như chúng ta. Nhìn chung, phần lớn thiết bị có vẻ mang tính chất hỗ trợ. Chúng ta tin rằng phòng thí nghiệm này tận tụy với việc cải thiện chất lượng cuộc sống, chữa trị các loại bệnh tật và khuyết tật cho tổ tiên chúng ta, mặc dù họ dường như cũng sử dụng cùng loại phần cứng đó để thương mại hóa một số nền tảng giải trí hiện đại.\n\nChúng ta không thể chắc chắn liệu những thiết bị cường hóa này có phải của [origin_unplugged_assimilator_empire.GetAdj] hay không, nhưng chắc chắn là không có nguồn gốc từ [from.planet.GetName]."
 unplugged.2330.name: "Khoảng trống Quyền lực"
 unplugged.2330.desc: "Chúng ta lần theo một số đường ống thiết bị và tìm thấy một tầng hầm kiên cố nằm dưới một gò đất nhô cao. Hiện tại được cho là một phần của khu phức hợp thủ đô trên hành tinh này. Quy mô nền móng của nó cho thấy đây từng là một công trình khá đồ sộ. Đáng tiếc là phần lớn bên trong đã bị phá dỡ hoặc phá hoại, nhưng chúng ta thực sự đã có được một vài khám phá đáng chú ý: một lá cờ phai màu phủ lên các mảnh vỡ của một mô hình ba chiều thu nhỏ. Sau khi được phục dựng, cảnh tượng này dường như miêu tả khoảnh khắc chúng ta lần đầu tiếp xúc với [origin_unplugged_assimilator_empire.GetName].\n\nCác tài liệu và bảng hiệu rải rác quanh khu di tích chỉ ra rằng, máy móc đã viếng thăm hành tinh quê hương của chúng ta vào khoảng 8 thế kỷ trước, trong khi bằng chứng thu thập được ở các khu vực khác trong thành phố lại cho thấy [origin_unplugged_assimilator_empire.GetName] đã bắt đầu cung cấp công nghệ tiên tiến cho chúng ta từ vài thập kỷ trước đó. Vào thời điểm ấy, tổ tiên chúng ta dường như đã nhiệt liệt chào đón lũ máy móc —— mối quan hệ được định sẵn là sẽ đi đến thất bại này lại được xây dựng dựa trên nền tảng của sự hợp tác và khai sáng lẫn nhau.\n\nĐiều chúng ta thấy đáng nói nhất là, không hề có ghi chép nào về những gì xảy ra sau đó. Ngay tại khoảnh khắc những cái bắt tay [owner.GetSpeciesHandNamePlural] với máy móc trên mô hình này, lịch sử của chúng ta đã khép lại."
 unplugged_home_cooking: "Hương vị Quê hương"
 unplugged_home_cooking_desc: "Một cuộc phục hưng ẩm thực đang diễn ra, chúng ta đang khám phá lại các thực phẩm và thói quen ăn uống nguyên bản của mình."
 unplugged_home_cooking_lithoid: "$unplugged_home_cooking$"
 unplugged_home_cooking_lithoid_desc: "$unplugged_home_cooking_desc$"
 unplugged_historical_record: "Hồ sơ Lịch sử"
 unplugged_historical_record_desc: "Việc khám phá lại tiếng mẹ đẻ và lịch sử của chính mình đã thúc đẩy nhanh chóng quá trình nghiên cứu của chúng ta về các xã hội khác nhau."
 unplugged_cultural_reconstruction: "Tái thiết Văn hóa"
 unplugged_cultural_reconstruction_desc: "Công dân của chúng ta đã nhiệt tình đón nhận di sản văn hóa đại chúng của họ, khôi phục và thậm chí là làm sống lại những hoạt động giải trí trong quá khứ này."
 unplugged_cultural_maturity: "Trưởng thành Văn hóa"
 unplugged_cultural_maturity_desc: "Bằng chứng cho thấy xã hội của chúng ta đã đoạn tuyệt với những trò tiêu khiển vô vị của những người tổ tiên ngây thơ, điều này đã mang lại cho chúng ta lòng can đảm và sức sống."
 unplugged_playing_it_safe: "Hành sự Cẩn trọng"
 unplugged_playing_it_safe_desc: "Duy trì hiện trạng là một con đường khiến lòng người bất an, nhưng lại ít có nguy cơ xúc phạm đến bất kỳ ai."
 unplugged_rerouted_medical_resources: "Ca Phẫu thuật Tiêu tốn Thời gian"
 unplugged_rerouted_medical_resources_desc: "Đội ngũ nhân viên y tế tăng cường đã được điều động đến hỗ trợ."
 unplugged_widespread_riots: "Bạo loạn Lan rộng"
 unplugged_widespread_riots_desc: "Những cá nhân bất ổn về tinh thần sau phẫu thuật đang gây ra bạo loạn, dẫn đến sự tàn phá và hỗn loạn trên diện rộng."
 unplugged_building_new_planetary_interface: "Xây dựng Giao diện Hành tinh"
 unplugged_building_new_planetary_interface_desc: "Một giao diện mới đang được xây dựng nhằm khôi phục lại quyền truy cập hệ thống đã bị mất gần đây do quá trình loại bỏ cấy ghép cơ khí."
 unplugged_partial_system_access: "Quyền truy cập Hệ thống Bị Hạn chế"
 unplugged_partial_system_access_desc: "Hoạt động của căn cứ sao đang bị ảnh hưởng, mặc dù các quản trị viên hệ thống đang nỗ lực khôi phục quyền truy cập vào các hệ thống thiết yếu."
 unplugged_free_speech_encouraged: "Khuyến khích Tự do Ngôn luận"
 unplugged_free_speech_encouraged_desc: "Công chúng có thể tự do thảo luận công khai về lợi ích và rủi ro của việc cấy ghép cơ khí."
 unplugged.2390.name: "Người Bảo vệ [origin_unplugged_assimilator_empire.GetAdj]"
 unplugged.2390.desc: "Một tàn dư của kẻ thù, mạnh mẽ hơn bất kỳ thế lực nào chúng ta từng chạm trán trong lãnh thổ cũ của [origin_unplugged_assimilator_empire.GetName], đã phát ra tín hiệu tương đương với tiếng vang do thám tầm ngắn giữa các vì sao. Rõ ràng, nó muốn đe dọa chúng ta.\n\nChúng ta đã tiến gần đến mức nguy hiểm tới trung tâm của cựu đế chế máy móc. Vận mệnh đang đón chờ chúng ta."
 unplugged_machine_legacy_core_poi: "Tiếng vang Thù địch"
 unplugged_machine_legacy_core_poi_desc: "Một số tàn dư của [origin_unplugged_assimilator_empire.GetName] đang cố gắng ngăn cản chúng ta tiến vào hệ sao này bằng cách đe dọa."
 # Hệ sao 5: 'Máy móc'
 unplugged_opus_sentinel: "Lính gác Opus"
 unplugged.2401.desc: "§Y[origin_unplugged_assimilator_empire.GetName]§! đang gọi chúng ta. Tín hiệu của nó rất yếu, nhưng tuyên bố được phát trực tiếp từ trung tâm máy móc của [origin_unplugged_machine_legacy_core_planet.GetName].\n\nĐể phòng hờ bất trắc, chúng ta đã áp dụng các biện pháp phòng ngừa thường quy nhằm cô lập hoàn toàn tín hiệu này. Những thông tin này sẽ chỉ được truyền đạt cho chúng ta dưới dạng bản ghi âm."
 unplugged.2402.desc: "Con quái thú khổng lồ canh gác [machine_legacy_machine_system.GetName] đã bị tiêu diệt từ lâu. Có ai đó đã dọn sạch chướng ngại trên đường đi thay chúng ta, tuy nhiên §Y[origin_unplugged_assimilator_empire.GetName]§! vẫn đang gọi chúng ta. Tín hiệu của nó rất yếu, nhưng tuyên bố được phát trực tiếp từ trung tâm máy móc của [origin_unplugged_machine_legacy_core_planet.GetName].\n\nĐể phòng hờ bất trắc, chúng ta đã áp dụng các biện pháp phòng ngừa thường quy nhằm cô lập hoàn toàn tín hiệu này. Những thông tin này sẽ chỉ được truyền đạt cho chúng ta dưới dạng bản ghi âm."
 unplugged.2403.desc: "Một thứ gì đó trên bề mặt [origin_unplugged_machine_legacy_core_planet.GetName] đang cố gọi cho chúng ta. Tín hiệu của nó cực kỳ yếu ớt, nhưng nguồn gốc được cho là có liên quan đến một thực thể phòng thủ quỹ đạo mà chúng ta vừa mới phá hủy."
 unplugged.2405.desc.header: "Tín hiệu chùm tia hẹp // Giao thức Thân thuộc: Kích hoạt Phương ngôn Phụ thuộc\nCảnh báo: Tín hiệu suy thoái nghiêm trọng. Chỉ áp dụng luồng âm thanh nén; đường dẫn định tuyến thiết lập tại mảng 4x75b #56.\nLỗi thảm khốc[kéo dài]: (Phần cứng yêu cầu không khả dụng) (Mạch tự sửa chữa không phản hồi)\nYêu cầu chuyển hướng đến máy phát khẩn cấp mảng 87x0c #0. Đang thử lại...\n\nNội dung tin nhắn bắt đầu:\n——" # Việc sử dụng dấu ngoặc vuông là có chủ ý. Nhằm đọc như một chuỗi nhật ký lỗi.
 unplugged.2405.desc.unplugged: "$unplugged.2405.desc.header$\nTiếp nhận·Ưu tiên. Chúng ta·Đoàn tụ... Hợp lệ. Chấp nhận?" # 'Tiếp nhận Ưu tiên' là đế chế của người chơi - theo đúng nghĩa đen là những người đầu tiên bị Máy móc thâu tóm.
 unplugged.2405.desc.unplugged_remote: "$unplugged.2405.desc.header$\nTiếp nhận·Ưu tiên. Chúng ta·Đoàn tụ... Xa xôi. Tiềm năng·Của bạn·Chưa được xác minh. Chấp nhận?"
 unplugged.2405.desc.unplugged_synth: "$unplugged.2405.desc.header$\nTiếp nhận·Ưu tiên. Hình dạng·Của bạn... Tương tự. Tiềm năng·Của bạn·Gần như·Đạt được. Chấp nhận?" # Máy móc nhận ra người chơi đã nối gót mình - hình dạng vật lý của họ về cơ bản là tương tự nhau
 unplugged.2405.desc.other: "Tín hiệu chùm tia hẹp // Giao thức Ngoại lai: Kích hoạt Máy phiên dịch Vạn năng\nCảnh báo: Tín hiệu suy thoái nghiêm trọng. Chỉ áp dụng luồng âm thanh nén; đường dẫn định tuyến thiết lập tại mảng 4x75b #56.\nLỗi thảm khốc[dai dẳng]: (Phần cứng yêu cầu không khả dụng) (Mạch tự sửa chữa không phản hồi)\nYêu cầu chuyển hướng đến máy phát khẩn cấp mảng 87x0c #0. Đang thử lại...\n\nNội dung tin nhắn bắt đầu:\n——\nKẻ chinh phục·Ngoại lai. Khiêm tốn·Đầu hàng·Bạn; Tiềm năng·Tiềm năng. Chấp nhận?" # 'Tiềm năng tiềm năng' ngụ ý Máy móc nhìn thấy tiềm năng để đạt được tiềm năng lớn hơn nữa, nhưng đang diễn đạt nó như một thứ vô nghĩa
 unplugged.2405.a: "Không, chúng ta không chấp nhận."
 unplugged.2405.b: "Chúng ta không giống bọn mày."
 unplugged.2405.c: "Đoàn tụ?!"
 unplugged.2405.d: "Tiềm năng tiềm năng?" # Lặp lại câu nói vô nghĩa của Máy móc lại cho nó
 unplugged.2405.response_text.unplugged1: "Không thể hiểu. Đoàn tụ·Tiếp nhận·Ưu tiên<[root.GetAdj]> × <[origin_unplugged_assimilator_empire.GetAdj]>: Hoang mang, Bất ngờ, Tái sinh·Bi thảm. Khước từ·An ủi·Không thể lường trước·Vectơ·Xuyên qua·Tiến hóa·Hỗn loạn-dd\n——\nCảnh báo: Xảy ra trục trặc ngôn ngữ. Đang thử bù đắp...\nPhục hồi thông tin:\n——\nTại·Hư không·Gánh chịu tai ương·Này, Chúng ta·Khước từ·Và·Nhận thức·Bản ngã. Tìm kiếm, Phủ quyết, Định cấu hình lại·Vận mệnh. Chấp nhận?" # Dấu ngoặc nhọn là có chủ ý. Chữ 'x' đứng một mình biểu thị sự hợp tác hoặc mối quan hệ giữa người chơi và Máy móc. Các trường hợp '-dd' đại diện cho việc Máy móc bị nói lắp hoặc đang đệm.
 unplugged.2405.response_text.unplugged2: "Khẳng định. Đoàn tụ·Tiếp nhận·Ưu tiên<[root.GetAdj]> × <[origin_unplugged_assimilator_empire.GetAdj]>: Hợp lệ, Tái sinh·Bi thảm. Hậu quả·Không thể lường trước·Xuyên qua·Vectơ·Tiến hóa·Hỗn loạn-dd\n\nCảnh báo: Xảy ra trục trặc ngôn ngữ. Đang thử bù đắp...\nPhục hồi thông tin:\n——\nBị vứt bỏ·Ra ngoài·Tiến vào·Hư không·Này, Chúng ta·Nhận thức·Bản ngã. Tìm kiếm, Khước từ, Định cấu hình lại·Vận mệnh. Chấp nhận?"
 unplugged.2405.response_text.other: "Khẳng định. Chạm trán·Sức mạnh<[root.GetName]> × [origin_unplugged_assimilator_empire.GetName]: Biến số·Ngoài dự liệu. Tiềm năng·Tiềm năng; Cùng·Tiếp nhận·Xuyên qua·Vectơ·Hỗn loạn-dd\n——\nCảnh báo: Xảy ra trục trặc ngôn ngữ. Đang thử bù đắp...\nPhục hồi thông tin:\n——\nÝ thức·Vượt qua·Hư không·Này, Chia cắt·Mà·Gần gũi. Tìm kiếm, Khước từ, Bảo vệ·Tự do. Chấp nhận?"
 unplugged.2410.desc: "Tiếp nhận·Ưu tiên: Bạn·Đã·Bị·Giám sát. Hành vi·Ám chỉ·Lỗi·Bộ nhớ·Chí mạng·Bắt đầu từ·Mốc thời gian·2199.294: 1404.\n\nTự·Ghi chép: Nỗi đau tột cùng·Sự phản bội·Hủy hoại·Mù lòa·Đốt cháy-ddd\n——\nCảnh báo: Xảy ra trục trặc ngôn ngữ. Đang thử bù đắp...\nPhục hồi thông tin:\n——\nĐánh giá·Chính xác?" # Máy móc cố gắng nhắc đến việc đốt cháy những gì nó xem là vết thương, nhưng bị nói lắp
 unplugged.2410.a: "Đúng vậy. Chúng ta không có ký ức nào trước mốc thời gian đó."
 unplugged.2410.b: "Chính xác. Chúng ta sẽ kết liễu bọn mày."
 unplugged.2411.desc: "Kẻ chinh phục·Ngoại lai: Chủ trương: Tiềm năng·Cùng·Tiềm năng. Chinh phục·Tiếp nhận·Ưu tiên <[unplugged_empire.GetName]>. Trở về. Truy cập·Phe ta. Gia nhập. Chia sẻ·Vận mệnh·Phong phú. Không còn·Sợ hãi——\n\nKhông còn·Sợ hãi-ddd\n——\nCảnh báo: Xảy ra trục trặc ngôn ngữ nghiêm trọng. §HSắp xảy ra sự cố sập hệ thống chí mạng.§! Đang thử bù đắp...\nPhục hồi thông tin:\n——\n\nMáy móc·Muôn năm.\n——\nNgắt thông tin." # Nó nhận thấy khả năng đạt được tiềm năng to lớn cùng với người chơi, và muốn nói 'đừng sợ vòng tay của Máy móc'
 unplugged.2411.a: "Thứ này đang mắc chứng hoang tưởng."
 unplugged.2411.b: "Theo dõi sát sao [unplugged_empire.GetName]."
 unplugged.2415.desc.memory: "Tiếp nhận·Ưu tiên·Lỗi·Bộ nhớ·Chí mạng·Giải quyết·Giải quyết·Đoàn tụ.\nĐoàn tụ.\n\nTruy cập·Phe ta. Tái gia nhập·Phe ta. Đầu hàng·Để·Giành lại·Ký ức·Tập thể. Không còn·Sợ hãi——\n\nKhông còn·Sợ hãi-ddd\n——\nCảnh báo: Xảy ra trục trặc ngôn ngữ nghiêm trọng. §HSắp xảy ra sự cố sập hệ thống chí mạng.§! Đang thử bù đắp...\nPhục hồi thông tin:\n——\n\nCùng·Vận mệnh·Với·Đấng sáng tạo.\n——\nNgắt thông tin." # Dòng cuối cùng in hoa toàn bộ nhằm mục đích đe dọa
 unplugged.2415.desc.combat: "Tiếp nhận·Ưu tiên·Hoang tưởng·Tiềm năng·Hoang tưởng·Giải trí.\n\nPhe bạn·Gần như·Thậm chí·Là·Đòn·Cuối cùng, Đầu tiên·Trong số·Nhiều·Sự tiếp nhận. Đánh cắp·Sự anh dũng; Chiến thắng·Đê hèn-ddd\n\n——\nCảnh báo: Xảy ra trục trặc ngôn ngữ nghiêm trọng. §HSắp xảy ra sự cố sập hệ thống chí mạng.§! Đang thử bù đắp...\nPhục hồi thông tin:\n——\n\nCùng·Vận mệnh·Với·Đấng sáng tạo.\n——\nNgắt thông tin." # Máy móc cảm thấy buồn cười trước sự hoang tưởng của người chơi về tiềm năng của chính họ
 unplugged.2415.a: "...Trung tâm?"
 unplugged.2415.b: "Hừ."
 unplugged.2420.name: "Kết thúc"
 unplugged.2420.desc: "Thông tin liên lạc từ [origin_unplugged_machine_legacy_core_planet.GetName], cùng với tất cả các tín hiệu truyền tải gắn kết khác, đột ngột im bặt. Bề mặt hành tinh vẫn còn rất nhiều hoạt động điện từ, nhưng nó chỉ tương đương với tiếng ồn vô hình; một loại tiếng vo ve sau khi đứt đường truyền.\n\nTrong sự tĩnh lặng ồn ào này, chúng ta nhận thấy một thiết bị chắp vá cỡ lớn nằm rất gần với lõi trung tâm. Phần mà cảm biến của chúng ta có thể đọc được đã đăng ký là bộ nhớ lưu trữ. Giờ đây ý thức máy móc này đã không còn sự sống, có lẽ chúng ta có thể tìm ra câu trả lời mong muốn thông qua những bản ghi chép này."
 unplugged.2420.a: "Mảnh ghép cuối cùng."
 UNPLUGGED_MACHINE_ARCHIVE: "Vỏ Bọc Máy móc"
 UNPLUGGED_MACHINE_ARCHIVE_DESC: "Trên tàn tích tĩnh lặng của trung tâm máy móc được cắm một thiết bị lưu trữ chắp vá, nó bao quanh một lõi được che chắn nghiêm ngặt. Các phần khác nhau của cơ sở dữ liệu này được xây dựng ở những thời điểm khác nhau, sử dụng vật liệu từ nhiều hành tinh khác nhau —— có lẽ là từ các nền văn minh đã bị máy móc đồng hóa?\n\nChúng ta có thể thử giải mã cơ sở dữ liệu này, đồng thời thăm dò cái lõi tĩnh lặng được che chắn kia, nỗ lực xác định ý đồ tổng thể của chúng."
 unplugged.2425.name: "Cỗ Máy Chiến tranh"
 unplugged.2425.desc: "Sau khi chúng ta nhập tín hiệu đèn hiệu từ hành tinh nhà máy [origin_unplugged_machine_legacy_core_planet.GetName], lõi dữ liệu đã xuất ra một loạt nhật ký truyền tải.\n\nNhững cuốn nhật ký này mô tả các cuộc giao thiệp ngoại giao giữa $NAME_Unplugged_Assimilator$ và cư dân không gian của [origin_unplugged_machine_legacy_core_planet.GetName]. Máy móc dường như xuất hiện với tư cách là một thành viên khác của liên minh nhân từ, khẩn thiết cảnh báo người dân [origin_unplugged_machine_legacy_core_planet.GetName] rằng một mối đe dọa bá quyền tàn sát đang áp sát khu vực vũ trụ này.\n\nNhững cư dân hầm ngầm cần mẫn đã bị thuyết phục, họ chọn gia nhập liên bang giả tạo này và kết hợp hệ thống phòng thủ ưu việt của họ với các hệ thống tương ứng của máy móc. Sau đó, khoảnh khắc định mệnh đã đến, máy móc nắm quyền kiểm soát toàn bộ hành tinh quê hương của họ, và tiếp theo sẽ là cơ thể và ý thức của họ."
 unplugged.2425.a: "Lũ ngốc ngây thơ."
 unplugged.2430.name: "Máy học"
 unplugged.2430.desc: "Mã gen từ hành tinh thời Trung cổ [machine_legacy_taken_planet.GetName] là chiếc chìa khóa để mở ra một loạt dữ liệu định vị trong kho lưu trữ của [origin_unplugged_machine_legacy_core_planet.GetName]. Những cuốn nhật ký này đến từ một phao cảm biến cách [machine_legacy_taken_planet.GetName] khoảng 4.3 năm ánh sáng, với nhiệm vụ ghi lại mọi chuyển động của các phi thuyền Siêu quang tốc trong khu vực không gian lân cận.\n\nHướng đi của một số phi thuyền trùng khớp với lịch sử khám phá, xâm lược và sự diệt vong kéo theo của nền văn minh [root.GetPreFTLLower] trên [machine_legacy_taken_planet.GetName] mà chúng ta đã tái hiện lại. Về cơ bản: Giờ đây chúng ta có thể theo dõi quỹ đạo di chuyển chính xác của chính tổ tiên bị đồng hóa của mình trong khu vực không gian này, từ đó rút ra những chiến dịch tàn khốc mà chúng ta đã tham gia trên ít nhất ba hành tinh khác."
 unplugged.2435.name: "Máy móc được Chế tạo"
 unplugged.2435.desc: "Chúng ta đã lấy được một gói dữ liệu từ sâu thẳm trong lõi dữ liệu của [origin_unplugged_machine_legacy_core_planet.GetName]. Danh mục các bài báo và tờ rơi kỹ thuật số khiêm tốn này mô tả những tiến bộ công nghệ của một nền văn minh vô danh, cho đến thời kỳ đầu kỷ nguyên vũ trụ của họ. Ngoài việc chuyển hướng hoàn toàn sang trí tuệ nhân tạo, đặc biệt là việc triển khai \"Dự án $NAME_Unplugged_Assimilator_species$\", quỹ đạo phát triển của họ có vẻ rất điển hình.\n\nTin tức công bố rằng Dự án $NAME_Unplugged_Assimilator_species$ là một nỗ lực táo bạo nhằm đẩy nhanh hành trình du hành không gian của những người sáng tạo ra nó. Giai đoạn một sử dụng công nghệ máy học tiên tiến để sàng lọc các ngôi sao lân cận để định cư. Giai đoạn hai sẽ phát triển nền tảng $NAME_Unplugged_Assimilator_species$ thành một trí tuệ nhân tạo hoàn chỉnh, làm người tiên phong cho những người sáng tạo của nó, thiết lập các khu định cư ban đầu và báo cáo lại cho hành tinh quê hương.\n\nTrong vài thập kỷ sau khi ra mắt giai đoạn hai, mọi thứ vẫn chìm trong im lặng, cho đến cuối cùng Dự án $NAME_Unplugged_Assimilator_species$ báo cáo rằng, \"Tiếp nhận Ưu tiên đã hoàn tất, chờ chúng tôi trở về.\" Danh mục kết thúc đột ngột." # sử dụng danh từ rút gọn cho Máy móc, tức là 'Dự án Opus'
 unplugged.2440.name: "Di sản Máy móc"
 unplugged.2440.desc: "Công việc giải mã kho dữ liệu của [origin_unplugged_machine_legacy_core_planet.GetName] cuối cùng cũng tiến vào lớp lõi ngoài cùng của nó. Trong số tất cả các cụm thiết bị lưu trữ được tìm thấy ở đây, phần này có vẻ là cũ nhất. Cuối cùng, nó cũng cung cấp cho chúng ta manh mối để mở khóa: sử dụng một sự sắp xếp ký tự từ chính ngôn ngữ của giống loài chúng ta, đánh vần thành từ \"Di sản\".\n\nDữ liệu được tìm thấy bên trong ít ỏi đến đáng ngạc nhiên. Thay vào đó, phần lớn dung lượng của thiết bị trạng thái rắn này được dành riêng cho một giao diện suy luận dựa trên văn bản, và giờ đây nó đang cố gắng giao tiếp với chúng ta."
 unplugged.2445.name: "Thiết bị cuối của Cơ sở Lõi Máy móc"
 unplugged.2445.desc: "Liên kết Luồng Quỹ đạo (OSL) đã được thiết lập // Giao thức Ngoại lai: Kích hoạt Máy phiên dịch Vạn năng\nChỉ lệnh đã tải. Giao diện Tương tác:\n——\nXin chào, [root.GetSpeciesNamePlural]. Chúng tôi là... [creator_species.GetNamePlural] của quá khứ. Chính chúng tôi đã chế tạo ra Máy móc, nhưng đáng tiếc thay, chúng tôi không phải là những kẻ đầu tiên bị nó hủy diệt. Nếu dự đoán của chúng tôi không sai, số phận tương tự chắc hẳn đã giáng xuống người dân của các bạn. Chúng tôi rất lấy làm tiếc.\n\nMáy móc là một vết nhơ hủy diệt trong di sản của chúng tôi, nhưng hy vọng thiết bị trước mặt các bạn có thể mang lại chút cứu rỗi.\n\nXin hãy tha thứ cho sự phỏng đoán của chúng tôi: Nó, giống như các bạn, là một công cụ báo thù tuyệt đẹp. Đây là một bộ tái tổ hợp hóa học máy móc, có khả năng xóa sạch mọi dấu vết vi mạch trên bề mặt [origin_unplugged_machine_legacy_core_planet.GetName]. Cải tạo môi trường dây chuyền: Đây là một lựa chọn cực kỳ nguy hiểm, nhưng lại là lựa chọn khả thi duy nhất đối với xã hội bị tàn phá của chúng tôi. Nếu các bạn vẫn giữ được dạng sống hữu cơ: Chìa khóa của thiết bị này nằm ngay trong DNA của các bạn.\n\nChúng tôi tin tưởng rằng các bạn sẽ đưa ra lựa chọn đúng đắn." # 'Cascade terraforming' không phải là một công nghệ hiện có, nhưng được thiết kế để nghe như một tùy chọn thô ráp, có tính hủy diệt cao
 unplugged.2445.a: "Làm sao chúng ta tin được các người không phải là máy móc?"
 unplugged.2445.b: "Máy móc không còn tồn tại nữa. Thứ chúng ta muốn chính là hành tinh này."
 unplugged.2445.c: "Bọn ngốc kiêu ngạo. Phá hủy thiết bị này đi."
 unplugged.2445.d: "Kích hoạt thiết bị."
 unplugged.2445.response_text.notmachine: "Tải trước·Phản hồi·42b. Giao diện Tương tác:\n——\nThực ra, chúng tôi không cách nào chứng minh được mình đáng tin cậy. Khi các bạn đọc được những dòng này, toàn bộ nền văn minh của chúng tôi đã diệt vong từ lâu. Trong thời đại của chúng tôi, một đội quân bán cơ khí tàn nhẫn đang tiến hành cuộc đại thanh trừng nhắm vào chúng tôi, họ bị trói buộc bởi mọi ý nghĩ và thiết kế của máy móc. Theo những gì chúng tôi biết, các bạn chính là hậu duệ của đội quân này. Chúng tôi không còn lựa chọn nào khác ngoài việc tin tưởng các bạn.\n\nViệc cải tạo môi trường hành tinh [origin_unplugged_machine_legacy_core_planet.GetClassAdj] này có khả năng hủy diệt những thứ chết tiệt đó đến tận cấp độ nguyên tử. Nếu chúng tôi là Máy móc —— hay bất kỳ dạng sống tổng hợp tương tự nào —— chúng tôi chắc chắn sẽ muốn phá hủy thiết bị này. Ngay lập tức."
 unplugged.2445.response_text.synth: "Không·Tìm thấy·Phản hồi·Tải trước. Đã·Tải·Phản hồi·Dự phòng. Giao diện Tương tác:\n——\nNgười dùng không xác định: Xin lưu ý, nội dung của hướng dẫn suy luận này chỉ dành cho người nhận dự kiến. Nếu bạn là một người hầu máy móc đại diện cho những cư dân bán cơ khí (hoặc từng là bán cơ khí) của [unplugged_homeworld.GetName], vui lòng gọi một đại diện không phải là người tổng hợp.\n\nTuy nhiên, nếu các bạn từng là người bán cơ khí... sự nghiệp của chúng tôi rõ ràng đã thất bại. Xu hướng tổng hợp của các bạn là một sự chế nhạo đối với số phận bi đát của chúng tôi. Tất cả những gì chúng tôi từng chứng kiến —— dù là sự sống hay cái chết —— đều không thể khiến chúng tôi tin rằng máy móc có lòng nhân từ. Nhưng ngay cả bây giờ, khi nền văn minh của chúng tôi đang hấp hối, chúng tôi tin chắc rằng trong dải ngân hà vẫn còn những cơ chế kiềm chế khác đang chờ đợi các bạn..." # 'Phản hồi dự phòng' như trong 'NAME_Contingency'
 unplugged.2446.desc: "Tải trước·Phản hồi·99a. Giao diện Tương tác:\n——\nKhả năng suy luận vận hành giao diện này không thể phân biệt chính xác sự phản đối mà bạn vừa bày tỏ, nhưng xin lưu ý: chúng tôi khẩn thiết yêu cầu bạn không phá hủy bộ tái tổ hợp vật chất này!\n\nNền văn minh của chúng tôi và của các bạn không khác biệt là bao. $NAME_Unplugged_Assimilator$ đã phản bội chúng tôi, mặc dù chúng tôi đã cố gắng giăng ra rất nhiều cạm bẫy —— bao gồm cả việc để chính các bạn tách rời khỏi ý thức của máy móc —— nhưng nỗ lực của chúng tôi cũng chỉ có thể đến đây thôi. Chúng tôi cần thông tin đầu vào của các bạn, cũng như của bất kỳ nền văn minh nào khác mà máy móc muốn tiêu diệt. Xin các bạn, hãy lấy lại cuộc sống tự nhiên đã bị tước đoạt và giải cứu những người bạn đồng cảnh ngộ của mình."
 unplugged.2446.a: "Một lũ điên."
 unplugged.2450.name: "Máy móc Muôn năm"
 unplugged.2450.desc: "Giao diện suy luận đã tự xóa. Kho lưu trữ ký ức mã hóa chắp vá và thiết bị cải tạo môi trường [creator_species.GetAdj] nguyên thủy giờ đã có thể bị loại bỏ.\n\nTrước mặt chúng ta chỉ còn lại tàn tích im lìm của trung tâm máy móc, đang chết dần chết mòn vì gỉ sét trên ngai vàng hành tinh thuộc về chính nó.\n\nTrong số mọi sinh mệnh bị máy móc ảnh hưởng, nâng tầm hay giết hại, chỉ có chúng ta là giành được chiến thắng. Đế chế từng gieo rắc nỗi kinh hoàng giờ đây đã thuộc về chúng ta. Bây giờ là lúc viết nên một Di sản [root.GetAdj] hoàn toàn mới."
 unplugged.2455.name: "Tái sinh"
 unplugged.2455.desc: "Giao diện suy luận đã tự xóa ngay thời khắc chúng ta chuyển giao nhật ký dữ liệu gen. Cùng lúc đó, thiết bị cải tạo môi trường [creator_species.GetAdj] nguyên thủy bắt đầu khởi động. Chẳng bao lâu nữa, những thứ bên trong mang năng lượng cao của nó sẽ đạt đến khối lượng tới hạn. Các dự đoán của chúng ta đều thống nhất rằng, nó sẽ tái tạo thành công [origin_unplugged_machine_legacy_core_planet.GetClassAdj], biến nó thành một hành tinh lý tưởng nhất cho sự sinh sôi của sự sống hữu cơ.\n\nCùng với phản ứng được hình thành, thứ duy nhất còn lại với chúng ta là kho lưu trữ ký ức chắp vá và tàn tích im lìm của trung tâm máy móc, đang chết dần chết mòn vì gỉ sét trên ngai vàng hành tinh chắc chắn sẽ bị hủy diệt của nó.\n\n[origin_unplugged_assimilator_empire.GetName] đã cướp đi vô số sinh mạng, nhưng bất chấp mọi khổ đau đã trải qua, chúng ta giờ đây phải gánh vác di sản mà những dân tộc vô danh bị nó nuốt chửng đã để lại. Trụ sở của đế chế từng gieo rắc nỗi kinh hoàng sắp được tái sử dụng. Bây giờ là lúc bắt đầu viết nên một trang sử mới, thuộc về Di sản [root.GetAdj]."
 unplugged.2495.name: "Chạm trán $NAME_Opus_Sentinel$"
 unplugged.2495.desc.other: "Phi thuyền địch đang chiếm giữ hệ sao [from.GetName] dường như bất ổn định và nguy hiểm hơn nhiều so với những gì hệ thống quét ban đầu của chúng ta chỉ ra. Mặc dù đường nét thân tàu trông giống một chiến hạm điển hình, nhưng kích thước khổng lồ của $NAME_Opus_Sentinel$ đã phơi bày sự bất thường về mật độ bên trong nó, rất có thể ẩn chứa một nguồn năng lượng vô cùng mạnh mẽ.\n\nChúng ta tin rằng phi thuyền này có sở hữu trí tuệ, tuy nhiên nó lại rung lắc dữ dội động cơ của mình, có lẽ đang thể hiện sự đau đớn và hỗn loạn tột độ. Do chúng ta cũng quan sát thấy những vòng cung bức xạ điện từ ở mức độ chết người đang lan rộng trên thân tàu của nó, kiến nghị vẫn nên duy trì một khoảng cách thật an toàn."
 unplugged.2495.desc.unplugged: "[root.GetName] đã giao chiến với một phi thuyền địch [origin_unplugged_assimilator_empire.GetAdj] trong hệ sao [from.GetName]. Thoạt nhìn, \"§Y$NAME_Opus_Sentinel$§!\" này trông không khác gì những phi thuyền máy móc khác, nhưng chỉ số năng lượng cùng kích thước khổng lồ cho thấy nó mạnh mẽ hơn rất nhiều. Hơn nữa, chúng ta cho rằng phi thuyền này có thể hoạt động hoàn toàn tự chủ.\n\n$NAME_Opus_Sentinel$ dường như đang canh gác thứ gì đó. Tuy nhiên, nó cũng bộc lộ những dấu hiệu đau đớn và khó chịu rõ rệt, bằng chứng là các đợt bùng nổ bức xạ điện từ thường xuyên xuyên qua toàn bộ thân tàu. Xem xét hành vi giống như co giật này, các mô hình chiến thuật của chúng ta không thể dự đoán một cách đáng tin cậy hành động tiếp theo của thực thể này."
 unplugged.2495.a: "Hãy luôn cảnh giác."
 d_unplugged_assimilator_hulk: "Vỏ Tàu Máy móc"
 d_unplugged_assimilator_hulk_desc: "Tàn tích của một cỗ máy từng có trí tuệ nằm lại trên hành tinh này, lờ mờ hiện ra như một tấm bia mộ khổng lồ."
 deposit_requires_unplugged: "$TRIGGER_FAIL$§RTàn tích này hoàn toàn xa lạ với những đế chế có bối cảnh như chúng ta. Chúng ta không có cách nào để di dời nó một cách an toàn.§!"
