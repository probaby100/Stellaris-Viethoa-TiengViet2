 origin_unplugged_starting_system_init_DESC: "Đây sẽ là hệ sao khởi đầu khi chọn nguồn gốc $origin_unplugged$.\n\n$system_initializer_DESC$"
 sol_system_unplugged_initializer_NAME: "$origin_unplugged$ (Hệ Mặt Trời)"
 sol_system_unplugged_initializer_DESC: "Hệ sao khởi đầu tùy chọn cho loài Người khi chọn nguồn gốc $origin_unplugged$."
 unplugged_injured_star_name: "Yass-Quakad"
 unplugged_injured_homeworld_name: "Inchyascot"
 unplugged_battlefield: "Thu dọn Chiến trường"
 unplugged_battlefield_desc: "Sau cuộc diệt chủng tàn bạo, xác của các người bán cơ khí và máy móc rải rác khắp hành tinh. Những cá thể khỏe mạnh còn sót lại và những người bị thương còn khả năng di chuyển đang dọn dẹp chiến trường, dùng các bộ phận từ xác chết để nâng cấp cơ thể."
 # Đặc điểm Loài Đặc hữu
 trait_unplugged_cybernetic_positives_3: "Đặc nhiệm Bán cơ khí"
 trait_unplugged_cybernetic_positives_3_desc: "$trait_unplugged_cybernetic_positives_desc$"
 trait_unplugged_cybernetic_positives_desc: "Việc thay thế toàn bộ tay chân và khung nano bán cơ khí đảm bảo những sinh vật này có thể tiến hành chiến tranh với hiệu suất tàn nhẫn. Để đạt được điều này, họ đã phải hy sinh một số chức năng cơ thể phi quân sự."
 trait_unplugged_cybernetic_positives_3_tt: "Mức độ Hạnh phúc trong thời gian chiến tranh và khủng hoảng: §G+30%§!\n$t$—§H$commander_plural_with_icon$§! cung cấp Tốc độ Bắn của Tàu: §G+20%§!"
 trait_unplugged_cybernetic_positives_2: "Đội Đột kích Bán cơ khí"
 trait_unplugged_cybernetic_positives_2_desc: "Những sinh vật bán cơ khí này được hưởng lợi từ các phương án triển khai tải trọng đồng bộ. Các bộ phận cường hóa có thể thay thế chiếm chỗ của lớp giáp được tích hợp chặt chẽ vào cơ thể, cho phép họ đảm nhận một số ít chức năng phi quân sự."
 trait_unplugged_cybernetic_positives_2_tt: "§Y$commander_plural_with_icon$§! cung cấp Tốc độ Bắn của Tàu: §G+10%§!"
 trait_unplugged_cybernetic_positives_1: "Binh lính Bán cơ khí"
 trait_unplugged_cybernetic_positives_1_desc: "Giác quan, tuyến nội tiết và dây thần kinh vận động của những sinh vật bán cơ khí này đã được tăng cường cẩn thận, đảm bảo khả năng chiến đấu dũng mãnh, đồng thời chỉ ảnh hưởng nhẹ đến khả năng sinh sản."
 trait_unplugged_cybernetic_positives_1_tt: "§Y$commander_plural_with_icon$§! cung cấp Tốc độ Bắn của Tàu: §G+5%§!"
 trait_unplugged_cybernetic_negatives_3: "Mất mạng"
 trait_unplugged_cybernetic_negatives_3_desc: "$trait_unplugged_cybernetic_negatives_desc$"
 trait_unplugged_cybernetic_negatives_desc: "Một số thiết bị tăng cường của các sinh vật bán cơ khí này phụ thuộc vào mạng lưới chiến trường đã bị bỏ hoang, khiến họ phải chịu áp lực và sự khó chịu tột độ."
 trait_unplugged_cybernetic_negatives_3_tt: "Mức độ Hạnh phúc ngoài thời gian chiến tranh và khủng hoảng: §R-10%§!"
 trait_unplugged_cybernetic_negatives_2: "Đứt mạng"
 trait_unplugged_cybernetic_negatives_2_desc: "Sự không tương thích của các bộ phận cường hóa quân sự áp đặt lên những sinh vật bán cơ khí này đã làm giảm đáng kể chất lượng cuộc sống của họ, đồng thời làm tăng nhu cầu thể chất trong thời gian phục hồi."
 trait_unplugged_cybernetic_negatives_1: "Trục trặc"
 trait_unplugged_cybernetic_negatives_1_desc: "Những ảo giác thính giác và các tiếng vọng giác quan khác sinh ra từ ý thức máy móc trước đây vẫn đang ám ảnh những sinh vật bán cơ khí này, khiến họ phải chịu đựng chứng trầm cảm và lo âu nghiêm trọng."
 trait_unplugged_decyberized: "Loại bỏ Cấy ghép"
 trait_unplugged_decyberized_desc: "Những người từng là sinh vật bán cơ khí này đã vứt bỏ các bộ phận cường hóa từng bị ép buộc gắn lên người họ, khôi phục lại nhiều thuộc tính di truyền hữu cơ của giống loài."
 trait_unplugged_neurocalmed: "An thần Thần kinh"
 trait_unplugged_neurocalmed_desc: "Mức độ neuroene của những sinh vật bán cơ khí này đã được điều chỉnh giảm, làm giảm bớt sự bốc đồng và hung hăng, thúc đẩy các cá nhân từ bỏ lợi ích cá nhân để tuân thủ các chuẩn mực xã hội."
 trait_unplugged_neurosavant: "Chuyên gia Thần kinh"
 trait_unplugged_neurosavant_desc: "Chỉ số tăng cường nhận thức của những sinh vật bán cơ khí này đã được điều chỉnh tăng, giúp tăng cường độ dẻo dai của khớp thần kinh, khả năng lưu giữ thông tin và khả năng giải quyết vấn đề."
 trait_unplugged_regenoptimized: "Tối ưu hóa Tái tạo"
 trait_unplugged_regenoptimized_desc: "Mức độ regenol-X của những sinh vật bán cơ khí này đã được điều chỉnh tăng, giúp hệ thống sinh học và hệ thống cấy ghép hoạt động đồng bộ, cho phép các bộ phận cấy ghép tự sửa chữa ở cấp độ phân tử."
 # Đặc điểm Lãnh đạo Đặc hữu (chỉ 'tích cực')
 leader_trait_unplugged_cybernetic_positives: "[triggered_unplugged_leader_name]"
 leader_trait_unplugged_cybernetic_positives_desc: "[triggered_unplugged_leader_desc]"
 leader_trait_unplugged_cybernetic_positives_3: "Đặc nhiệm Bán cơ khí"
 leader_trait_unplugged_cybernetic_positives_3_desc: "Vị lãnh đạo này đã triển khai một số chức năng cốt lõi của cơ thể vào phần cứng ưu tiên ý thức chiến đấu."
 leader_trait_unplugged_cybernetic_positives_2: "Đội Đột kích Bán cơ khí"
 leader_trait_unplugged_cybernetic_positives_2_desc: "Vị lãnh đạo này có khả năng tích hợp trực tiếp và mượt mà với các hệ thống quân sự lẫn dân sự, nhưng phải trả một cái giá quá đắt về mặt giác quan hữu cơ."
 leader_trait_unplugged_cybernetic_positives_1: "Binh lính Bán cơ khí"
 leader_trait_unplugged_cybernetic_positives_1_desc: "Việc tăng cường đáng kể các giác quan và hệ thống miễn dịch đã kéo dài tuổi thọ và độ tin cậy của vị lãnh đạo này, trong khi chức năng sinh sản chỉ bị suy giảm nhẹ."
