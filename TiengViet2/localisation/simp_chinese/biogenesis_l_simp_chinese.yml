 crisis_behemoth_level_3_desc: "Mức Độ Khủng Hoảng Cấp 3"
 crisis_behemoth_level_4: "§HThảm Họa§!"
 crisis_behemoth_level_4_desc: "Mức Độ Khủng Hoảng Cấp 4"
 crisis_behemoth_level_5: "§HKẻ Thù Sự Tồn Vong§!"
 crisis_behemoth_level_5_desc: "Mức Độ Khủng Hoảng Cấp 5"
 behemoth_crisis_level_5_req_tooltip: "£trigger_no£ Đã hoàn thành Đặc Vụ §Y$BEHEMOTH_CRISIS_SPECIAL_PROJECT_4$§! trong chuỗi sự kiện §H$become_the_crisis_chain$§!."
 feral_insight: "Tri Thức Nguyên Thủy"
 feral_insight_name: "$feral_insight$:"
 feral_insight_value: "£feral_insight£ $VAL|0$"
 feral_insight_current_value: "Giá trị hiện tại: §Y$VALUE|0$§!"
 feral_insight_gaining: "Hoàn thành §HMục Tiêu Khủng Hoảng§! để thu thập thêm £feral_insight£ §Y$feral_insight$§!."
 feral_insight_desc: "Chúng ta đang đào sâu nghiên cứu về tập tính và chu kỳ săn mồi của những sinh vật khổng lồ."
 feral_insight_crisis_objective: "Mục Tiêu Khủng Hoảng"
 feral_insight_crisis_objective_gained: "Nhận được $feral_insight$"
 feral_insight_crisis_objective_reward: "$REWARD$"
 feral_insight_crisis_objective_progress: "Chúng ta đã thu được £feral_insight£ $AMOUNT$ từ Mục Tiêu Khủng Hoảng này."
 feral_insight_crisis_description_title: "Tai Ương Behemoth"
 feral_insight_crisis_description: "$menace_crisis_description_intro$\n\nNhững quái vật Leviathan ẩn mình trong hư không mang trong mình sức mạnh vô song, nhưng lại chẳng hề có tham vọng hay mục tiêu gì. Việc kết hợp những đặc tính sinh lý mạnh mẽ của chúng với trí tuệ và sự quyết tâm của chúng ta, sẽ thai nghén ra một thế hệ bầy thú vũ trụ hoàn toàn mới, đẩy chúng ta lên đỉnh cao của quyền lực tối thượng trong thiên hà."
 feral_insight_crisis_howto_title: "Ấp Ủ Behemoth Nuốt Chửng Bầu Trời"
 feral_insight_crisis_howto: "Theo đuổi các §HMục Tiêu Khủng Hoảng§! sẽ mang lại £feral_insight£ §HTri Thức Nguyên Thủy§!, thứ sẽ giúp chúng ta giải phóng trọn vẹn tiềm năng sinh học của mình."
 feral_insight_crisis_level_unlocked: "Khi đạt đến Cấp Độ $LEVEL$, bạn sẽ nhận được những phần thưởng sau:\n"
 feral_insight_crisis_level_locked: "Để mở khóa cấp độ này cần:\n"
 feral_insight_crisis_level_unlock: "Sở hữu £feral_insight£ §Y$CURRENCY$§! Tri Thức Nguyên Thủy"
 feral_insight_crisis_level_desc: "Để gia tăng Mức Độ Khủng Hoảng, bạn cần tích lũy £feral_insight£ §HTri Thức Nguyên Thủy§!, nghiên cứu các dự án khủng hoảng đặc biệt và nuôi dưỡng Behemoth của bạn."
 #Đặc Điểm Khủng Hoảng
 menp_behemoth_objectives: "Tri Thức Nguyên Thủy"
 unlocks_behemoth_objectives: "Thông qua việc hoàn thành các §HMục Tiêu Khủng Hoảng§! để thu thập £feral_insight£ §Y$menp_behemoth_objectives$§!.\n"
 menp_behemoth_objectives_desc: "Việc nghiên cứu hành vi của Behemoth Nuốt Chửng Bầu Trời sẽ trợ giúp đắc lực cho chúng ta trong việc hiện thực hóa mục tiêu tối thượng: Sự lột xác siêu phàm. Chúng ta sẽ rũ bỏ hoàn toàn những giới hạn sinh học đang kìm hãm sự sống trên các hành tinh."
 menp_behemoth_bioship_1: "Lớp Vỏ Kiên Cố"
 menp_behemoth_bioship_1_desc: "Sự sống còn giữa không gian vũ trụ đòi hỏi phải có một lớp vỏ ngoài thật sự vững chắc. Lớp bảo vệ kiên cố này đảm bảo cho sự sinh tồn ngay cả trong những môi trường khắc nghiệt nhất."
 menp_behemoth_society_1: "Đẩy Nhanh Thử Nghiệm Thực Tế"
 menp_behemoth_society_1_desc: "Nghiên cứu trong phòng thí nghiệm chỉ là bước đệm lý tưởng, những bước tiến thực sự chỉ có thể đạt được thông qua các thử nghiệm thực tế đầy rủi ro."
 menp_behemoth_food_1: "Vụ Mùa Siêu Năng Suất"
 menp_behemoth_food_1_desc: "Thỏa mãn cơn thèm ăn không đáy của Behemoth Nuốt Chửng Bầu Trời là một cuộc chiến vô cùng cam go. Việc sản xuất hàng loạt các loại thực phẩm đã qua biến đổi gen chỉ mới là bước khởi đầu."
 menp_behemoth_egg: "Khu Ấp Trứng Behemoth"
 unlocks_behemoth_egg: "Mở khóa Siêu Cấu Trúc §YTrứng Behemoth Nuốt Chửng Bầu Trời§!.\n"
 menp_behemoth_egg_desc: "Một quả trứng khổng lồ cần một khu ấp trứng tương xứng. Khu ấp trứng trên quỹ đạo này phải được xây dựng ở một khoảng cách nhất định so với mặt trời, để có đủ không gian rộng lớn phục vụ cho việc ấp ủ Behemoth Nuốt Chửng Bầu Trời."
 menp_behemoth_bioship_2: "Cải Tiến Kích Thích Tuyến Nội Tiết"
 menp_behemoth_bioship_2_desc: "Bằng cách sử dụng các đầu dò được chế tạo đặc biệt, chúng ta đang tiến hành kích thích nhân tạo các tuyến nội tiết của Behemoth Nuốt Chửng Bầu Trời, kích hoạt sự bài tiết hormone tăng trưởng nhằm đẩy nhanh quá trình phát triển."
 menp_behemoth_society_2: "Nghiên Cứu Chéo"
 menp_behemoth_society_2_desc: "Tại điểm giao thoa giữa chọn lọc tự nhiên và công nghệ sinh học, một sức mạnh vô song đang được tượng hình."
 menp_behemoth_food_2: "Quá Tải Dinh Dưỡng"
 menp_behemoth_food_2_desc: "Việc lấp đầy cái dạ dày tham lam của Behemoth Nuốt Chửng Bầu Trời có lẽ là một nhiệm vụ bất khả thi. Sản xuất lương thực biến đổi gen trên quy mô lớn chỉ mới là bước khởi đầu."
 menp_behemoth_hatchling: "Bầy Đàn Khổng Lồ"
 unlocks_behemoth_hatchling: "Cho phép chúng ta §Yấp nở§! Siêu Cấu Trúc Trứng Behemoth Nuốt Chửng Bầu Trời.\n"
 menp_behemoth_hatchling_desc: "Một bầy Behemoth Nuốt Chửng Bầu Trời sẽ phủ bóng đen lên khắp hệ sao. Những nước láng giềng trong thiên hà, hoặc là phải biết tôn trọng quyền tự chủ của bầy con của chúng ta, hoặc là sẽ trở thành thức ăn cho chúng."
 menp_behemoth_bioships_3: "Chu Kỳ Sinh Trưởng Rút Ngắn"
 menp_behemoth_bioships_3_desc: "Việc đẩy nhanh quá trình nuôi dưỡng đàn thú vũ trụ khổng lồ là yếu tố quyết định để chúng ta đạt được mục tiêu tối hậu. Chúng ta sẽ đảm bảo sự phát triển đồng bộ của cơ sở hạ tầng."
 menp_behemoth_society_3: "Bậc Thầy Kỹ Thuật Sinh Học"
 menp_behemoth_society_3_desc: "Trải qua vô số những lần thử nghiệm và thất bại, chúng ta đã phát triển mạnh mẽ năng lực khoa học của mình. Giờ đây, chúng ta tự hào là những kỹ sư sinh học xuất sắc nhất trong toàn cõi thiên hà."
 menp_behemoth_mind_control: "Định Hình Tâm Trí Sâu Thẳm"
 unlocks_behemoth_mind_control: "Cho phép chúng ta thao túng tâm trí của §YBehemoth Nuốt Chửng Bầu Trời§!.\n"
 menp_behemoth_mind_control_desc: "Trí tuệ tập thể của chúng ta đang sục sôi, khao khát những thứ vĩ đại và tuyệt mỹ hơn. Tham vọng của chúng ta là vô tận."
 menp_behemoth_hatchling_2: "Sinh Trưởng Không Trói Buộc"
 unlocks_behemoth_hatchling_2: "Cho phép §YBehemoth Nuốt Chửng Bầu Trời§! hóa nhộng bên trong các hành tinh khí khổng lồ để kích thước và sức mạnh của nó tăng vọt một cách khó tin.\n"
 menp_behemoth_hatchling_2_desc: "Con dã thú đã phá vỡ xiềng xích. Sinh vật non nớt ngày nào giờ đây đang lớn nhanh như thổi, hóa thân thành một thế lực tự nhiên hoang dã, không gì có thể thuần phục, không gì có thể ngăn cản."
 menp_behemoth_bioship_4: "Thể Sống Mạnh Mẽ Hơn"
 menp_behemoth_bioship_4_desc: "Dưới sự thôi thúc của cơn đói khát vô tận và cơn phẫn nộ không thể nguôi ngoai, bầy Behemoth đang vươn tới một cấp độ sức mạnh hỗn loạn và mất kiểm soát. Vũ khí sinh học của chúng đã sẵn sàng, chực chờ nghiền nát mọi thứ, bất kể là kẻ thù hay những kẻ bàng quan vô tội."
 menp_behemoth_mutation_research: "Đột Biến Behemoth Nuốt Chửng Bầu Trời"
 unlocks_behemoth_mutation_research: "Mở khóa §YĐặc Vụ§! dùng để định hình sự phát triển bộ gen của §YBehemoth Nuốt Chửng Bầu Trời§!.\n"
 menp_behemoth_mutation_research_desc: "Khi bầy Behemoth không ngừng phát triển, chúng ta sẽ tái cấu trúc lại vật chất di truyền của chúng, tập trung bồi dưỡng những đặc điểm sinh lý có lợi nhất."
 menp_behemoth_mind_control_2: "Triển Khai Mẫu Vật Tối Thượng"
 unlocks_behemoth_mind_control_2: "Chúng ta sẽ thiết lập một liên kết linh năng sâu sắc hơn với §YBehemoth Nuốt Chửng Bầu Trời§! của chính mình.\n"
 menp_behemoth_mind_control_2_desc: "Đỉnh cao của sự hoàn hảo về mặt di truyền không nên chỉ bị giới hạn bên trong lãnh thổ hiện tại của chúng ta. Cả thiên hà đều nên được tận hưởng món quà vô giá này."
 menp_behemoth_mind_meld: "Dung Hợp Tâm Trí"
 unlocks_behemoth_mind_meld: "Nắm quyền kiểm soát hoàn toàn §YBehemoth Nuốt Chửng Bầu Trời Cấp 4§! mạnh mẽ - một sinh vật đáng sợ sở hữu khả năng thống trị các vì sao không gì sánh kịp.\n"
 menp_behemoth_mind_meld_desc: "Ý thức của chúng ta hòa làm một với Behemoth, và ý thức của Behemoth cũng thuộc về chúng ta. Cơn cuồng nộ của nó biến thành sự phẫn uất của chúng ta. Chúng ta tự nguyện để mình bị nuốt chửng, và trong khoảnh khắc Behemoth Nuốt Chửng Bầu Trời hấp thụ ý thức tập thể của chúng ta, chúng ta cảm nhận được ngọn lửa thịnh nộ đang bùng cháy trong nó. Nó sẽ trở thành chúng ta, và chúng ta sẽ hóa thân thành mãnh thú."
 menp_behemoth_primal_roar: "Tiếng Gầm Nguyên Thủy"
 unlocks_behemoth_primal_roar: "Hiệu triệu con Behemoth dũng mãnh nhất, sai khiến nó thống trị hư không.\n"
 menp_behemoth_primal_roar_desc: "Nó chảy xuôi trong huyết quản của chúng ta, thiêu đốt, xé rách, và rực cháy. Đó là một cơn thịnh nộ cuồng điên, một tiếng gầm thét từ thuở sơ khai. Cả thiên hà sẽ phải hóa thành tro bụi dưới ngọn lửa phẫn nộ của chúng ta."
 menp_behemoth_ever_hungry: "Cơn Đói Vĩnh Hằng"
 unlocks_behemoth_ever_hungry: "Mở khóa Tình Huống $behemoth_finale_situation$. Nuốt chửng cả hệ sao này để gia tăng kích thước và sức mạnh, trở thành Kẻ Săn Mồi Tối Thượng của các vì sao.\n"
 menp_behemoth_ever_hungry_desc: "Chúng ta đang phải chịu đựng những cơn đau đớn tột cùng, cơn đói khát không bao giờ vơi cạn đã trở thành động lực duy nhất cho sự tồn tại của chúng ta. Sâu thẳm bên trong chúng ta là một hố đen không đáy, dù có nuốt chửng bao nhiêu đi chăng nữa cũng chẳng thấm tháp vào đâu. Chỉ có bữa đại tiệc nuốt chửng toàn bộ thiên hà mới có thể xoa dịu đi nỗi thống khổ này."
 menp_behemoth_egg_2: "Hậu Duệ Khát Máu"
 unlocks_behemoth_egg_2: "Mở khóa khả năng đẻ §YTrứng§! cho §YBehemoth Nuốt Chửng Bầu Trời Cấp 4§! để giống loài của nó được tiếp tục sinh sôi.\n"
 menp_behemoth_egg_2_desc: "Những đứa con của chúng ta sẽ gặm nhấm những tàn tích còn sót lại của thiên hà này. Cơn đói của chúng sẽ không bao giờ được thỏa mãn. Cho đến tận cùng của thời gian, chúng sẽ mãi mãi đắm chìm trong bữa tiệc phàm ăn này."
 mod_shipclass_military_hull_mult: "Thân Tàu Của Phi Thuyền Quân Sự"
 mod_country_resource_max_food_add: "Giới Hạn Tích Trữ Lương Thực"
 mod_starbase_shipyard_build_alloys_cost_mult: "Chi Phí Hợp Kim Chế Tạo Phi Thuyền"
 crisis_egg_built: "£trigger_yes£ Đã §Yxây dựng§! Siêu Cấu Trúc §H$behemoth_egg$§!"
 crisis_egg_required: "£trigger_no£ Đã §Yxây dựng§! Siêu Cấu Trúc §H$behemoth_egg$§!"
 crisis_egg_hatched: "£trigger_yes£ Đã §Yấp nở§! thành công một con §H$behemoth_hatchling$§! từ §H$behemoth_egg$§!"
 crisis_hatchling_required: "£trigger_no£ Đã §Yấp nở§! thành công một con §H$behemoth_hatchling$§! từ §H$behemoth_egg$§!"
 district_mindlink: "Thành Phố Trí Liên"
 district_mindlink_plural: "$district_mindlink$"
 district_mindlink_desc: "Những ngọn tháp chọc trời vươn mình lên giữa khu trung tâm đông đúc, mở ra cơ hội để các tình nguyện viên kết nối trực tiếp với Behemoth."
 planet_building_buffer: "Chuyển Đổi Thành Phố"
 planet_building_buffer_desc: "Mặc dù quá trình nuôi cấy Tháp Tâm Trí dùng để giao tiếp với Behemoth diễn ra khá nhanh chóng, nhưng chúng ta vẫn phải chuẩn bị các phương án dự phòng để đảm bảo sự hỗ trợ liên tục từ cơ sở hạ tầng của hành tinh."
 mod_job_transference_volunteer_add: "Nghề Nghiệp $job_transference_volunteer$"
 planet_transference_volunteers: "$job_transference_volunteer_plural$"
 job_transference_volunteer: "Người Chuyển Giao Tâm Trí Tự Nguyện"
 job_transference_volunteer_plural: "$job_transference_volunteer$"
 job_transference_volunteer_desc: "Đối với nhiều người, mối liên kết tâm linh với dã thú là một khái niệm đến sau. Vĩnh cửu, nhưng lại vô cùng xa xăm. Thế nhưng, đối với một số người, khao khát được hòa làm một với nó là không thể kìm nén. Những tình nguyện viên này giống như một đường ống dẫn truyền, tư tưởng của họ đang từ từ hòa quyện vào tập thể của con dã thú này."
 job_transference_volunteer_effect_desc: "\n£job_transference_volunteer£ [GetTransferenceVolunteerDrone] tạo ra £unity£ §YNăng Lượng Đoàn Kết§!, gia tăng $r_stability$ của hành tinh, và làm cho các §YPhi Thuyền§! của chúng ta trở nên mạnh mẽ hơn.\nCứ mỗi 6 tháng, §Y10%§! số lượng người làm công việc này sẽ bị §YChuyển Giao Tâm Trí§!. Họ sẽ chết nhưng bù lại sẽ nhân đôi sản lượng tài nguyên của khu vực.\n\n§GDân số đã bị chuyển giao tâm trí§!: [num_tranferred_pops]"
 mod_job_transference_drone_add: "Nghề Nghiệp [GetTransferenceVolunteerDrone]"
 job_transference_drone: "Cộng Sinh Thể Chuyển Giao Tâm Trí"
 job_transference_drone_plural: "$job_transference_drone$"
 job_transference_drone_desc: "Mặc dù liên kết tâm linh đã tạo ra một sự gắn kết vĩnh viễn giữa dã thú và chúng ta, nhưng việc chuyển giao lại là một quá trình vô cùng chậm chạp. Nếu không có những biện pháp phòng ngừa này, chúng ta có nguy cơ sẽ đập nát tinh thần của cả hai bên, và phá hủy đi tất cả mọi thứ."
 MESSAGE_POPS_TRANSFERRED_TITLE: "Đám Đông Đã Bị Chuyển Giao Tâm Trí."
 MESSAGE_POPS_TRANSFERRED_DESC: "$VALUE|Y$ dân số đã bị chuyển giao tâm trí. Tâm trí của họ đã dung hợp với Behemoth."
 #Sự Kiện Khủng Hoảng
 biocrisis.50.name: "Cấp Độ 1: Thử Nghiệm Phôi Thai"
 biocrisis.50.desc: "Chúng ta đang sống cộng sinh cùng với các sinh vật mang mầm mống của mình, nhưng có một điều gì đó vô cùng quan trọng vẫn luôn lẩn khuất...\n\nNhững tạo vật khổng lồ trôi dạt trong hư không đã thắp sáng ngọn lửa cảm hứng cho chúng ta, đưa chúng ta bước vào một dự án mang tham vọng vĩ đại nhất: Nuôi cấy ra một sinh vật vũ trụ với sức mạnh vô song. \"Behemoth Nuốt Chửng Bầu Trời\" này sẽ là một sự tồn tại hoàn toàn mới mẻ, là đỉnh cao của sự sống được tạo hình tỉ mỉ chứ không phải là sản phẩm của một quá trình tiến hóa mù quáng.\n\nThử thách đầu tiên của chúng ta là phải tạo ra một quả trứng khổng lồ, đủ sức chứa đựng một con Behemoth với kích thước chưa từng có trong lịch sử. Ngoài việc cung cấp đầy đủ chất dinh dưỡng, vỏ trứng cũng cần phải có khả năng hấp thụ ánh sáng và nhiệt năng từ môi trường, đồng thời xử lý các loại khí để chuyển hóa thành các dưỡng chất bổ sung."
 biocrisis.50.a: "Tuyệt tác của chúng ta sẽ che khuất cả những vì sao."
 biocrisis.55.name: "Cấp Độ 2: Tự Vận Hành"
 biocrisis.55.desc: "Trong khi các tàu kỹ thuật đang hối hả lắp ráp trứng thụ tinh và vỏ trứng trên quỹ đạo của các hành tinh khí khổng lồ, thì ngành công nghiệp thực phẩm của chúng ta cũng đã sản xuất xong các dưỡng chất cần thiết để hình thành nên lòng trắng trứng. Thế nhưng, việc tạo ra một quả trứng đã thụ tinh như vậy quả nhiên là một bài toán khó nhằn hơn rất nhiều.\n\nChúng ta đã phải tiêu tốn một lượng sinh khối khổng lồ từ các phi thuyền sinh học và hệ động vật vũ trụ, cuối cùng mới có thể ổn định được một cơ sở DNA hoàn chỉnh, niêm phong nó vào trong một tế bào thụ tinh chưa từng có tiền lệ, và đã chứng minh được sự thành công của bước này thông qua các thử nghiệm vi mô. Giờ đây, chúng ta đã sẵn sàng để nâng quy mô của cuộc thử nghiệm lên cấp số nhân, phần việc còn lại chỉ là để cho quả trứng khổng lồ này thụ tinh mà thôi.\n\nSắp tới đây, chúng ta sẽ ấp nở ra một dạng sống khổng lồ nhất từ trước đến nay trong hệ sao này!"
 biocrisis.55.a: "Chúng ta đã chạm đến đỉnh cao của sự tiến hóa."
 biocrisis.60.name: "Sự Ngạo Mạn Và Cơn Đói Khát"
 biocrisis.60.desc: "Sự am hiểu về gen của chúng ta là độc nhất vô nhị, những thành tựu mà chúng ta đạt được khiến cho các nền văn minh hạ đẳng trong hệ sao chỉ có thể mỏi cổ ngước nhìn.\n\nTuy nhiên, sự ra đời của Behemoth Nuốt Chửng Bầu Trời không đồng nghĩa với việc chúng ta đã nắm giữ được quyền thống trị tuyệt đối. Bị dẫn dắt bởi bản năng tham lam, cho dù chúng ta có cung cấp bao nhiêu thức ăn đi chăng nữa cũng không thể thỏa mãn được cơn đói của nó. Sớm muộn gì nó cũng sẽ thức tỉnh và tuân theo mệnh lệnh của chúng ta, nhưng thời gian đang trôi đi rất nhanh. Bất cứ lúc nào chúng ta cũng có nguy cơ mất kiểm soát đối với nó, đặt mạng sống của hàng tỷ người vào vòng nguy hiểm."
 biocrisis.60.a: "Chúng ta sẽ tìm ra giải pháp."
 BEHEMOTH_CRISIS_SPECIAL_PROJECT_3: "Thử Nghiệm Liên Kết Não Bộ"
 BEHEMOTH_CRISIS_SPECIAL_PROJECT_3_DESC: "Chúng ta đang cố gắng sử dụng công nghệ thần kinh để kết nối từ xa ý thức của mình với hệ thần kinh của Behemoth Nuốt Chửng Bầu Trời. Hiện tại, chúng ta tin rằng đây là cách duy nhất để thuần phục con thú khổng lồ này."
 biocrisis.15.name: "Bản Giao Hưởng Khớp Thần Kinh"
 biocrisis.15.desc: "Cuối cùng thì công nghệ thần kinh tối tân của chúng ta cũng đã giúp chúng ta tìm ra cách phá vỡ rào cản giao tiếp với thế hệ hậu duệ đáng sợ này. Cách duy nhất là kết nối ý thức của chúng ta với những con Behemoth này. Không phải là tư tưởng của một cá nhân đơn lẻ, mà là toàn bộ sức mạnh tinh thần tập thể của cả giống loài chúng ta. Nếu chúng ta tiến hành quá nhanh, rất có thể hệ thần kinh của Behemoth Nuốt Chửng Bầu Trời sẽ bị quá tải. Đặc biệt khuyến cáo phải tiến hành một cách cực kỳ cẩn trọng."
 biocrisis.15.a: "Sự hoàn hảo tuyệt đối của sinh học đi kèm với một cái giá không hề nhỏ."
 biocrisis.65.name: "Cấp Độ 4: Thân Thú Hiển Hiện"
 biocrisis.65.desc: "Mặc dù học thuyết về việc liên kết tinh thần với Behemoth Nuốt Chửng Bầu Trời đã được phác thảo, nhưng những hệ lụy logic đi kèm với nó lại khiến người ta phải khiếp sợ. Chúng ta dự định sẽ đặt các trung tâm kết nối chính tại thủ đô, qua đó có thể xử lý việc di dời dân số trong quá trình dung hợp với Behemoth.\n\nThêm vào đó, những bước tiến mới nhất trong khoa học có thể sẽ sớm giúp chúng ta có khả năng cường hóa thêm cho kiệt tác của mình thông qua một dự án đột biến thử nghiệm duy nhất."
 biocrisis.65.a: "Chúng ta sẽ hòa làm một."
 BEHEMOTH_CRISIS_SPECIAL_PROJECT_4: "Dung Hợp Tâm Trí"
 BEHEMOTH_CRISIS_SPECIAL_PROJECT_4_DESC: "Ý thức của Behemoth Nuốt Chửng Bầu Trời khổng lồ và phức tạp hơn rất nhiều so với những gì chúng ta từng hình dung; giờ đây chúng ta đã hiểu rằng, tư tưởng của một cá nhân đơn lẻ là không đủ để tiến hành tích hợp. Mặc dù tư tưởng của chúng ta vượt trội hơn hẳn so với phần lớn các cá nhân khác, nhưng vốn dĩ nó không được sinh ra để tương thích với một cơ thể như thế.\n\nBước đi đầu tiên là kết nối tư tưởng cá nhân của cư dân chúng ta với Behemoth Nuốt Chửng Bầu Trời. Ban đầu sẽ là một mối liên kết mong manh, nhưng rồi nó sẽ nhanh chóng hóa thành một dòng thác cuồn cuộn——một dòng thác có thể xoa dịu đi cơn thịnh nộ của Behemoth."
 BEHEMOTH_CRISIS_SPECIAL_PROJECT_4_DESC_HIVE: "Không được phép có bất kỳ một sự sai lệch nào bên trong Bầy Đàn. Và trong thời khắc này, sự tập trung đối với chúng ta quan trọng hơn bao giờ hết. Sự hiện diện của một con ong thợ đơn lẻ đóng vai trò làm cầu nối giữa chúng ta và Behemoth Nuốt Chửng Bầu Trời là hoàn toàn không đủ, chúng ta phải dùng toàn bộ ý thức tập thể hoàn chỉnh để chiếm đoạt lấy tâm trí của con Behemoth này.\n\nĐiều này sẽ làm thay đổi chúng ta. Ý thức của chúng ta sẽ hòa làm một, và chúng ta sẽ trở thành một thực thể duy nhất. Cái khái niệm gần như không thể tưởng tượng nổi này thực sự khó mà chấp nhận được, nhưng chúng ta không có gì phải e ngại, bởi vì rất nhanh thôi chúng ta sẽ trở thành sự tồn tại mạnh mẽ nhất trong thiên hà!"
 BEHEMOTH_CRISIS_SPECIAL_PROJECT_4_DESC_MACHINE: "Ý nghĩ phải ký sinh bên trong những vật chứa sinh học chưa bao giờ khiến chúng ta cảm thấy yên tâm. Trải qua bao thế hệ, chủng tộc của chúng ta luôn lấy hình thái trạng thái rắn làm chủ đạo. Những bậc tiền bối đi trước thậm chí còn chẳng thể hình dung nổi con đường mà chúng ta sắp sửa phải đối mặt. Tuy nhiên, chúng ta vẫn sẽ vứt bỏ đi bộ khung cơ khí cứng nhắc này, để tìm kiếm sự che chở bên trong cơ thể của Behemoth máu thịt.\n\nKhi đã ký sinh vào máu thịt, liệu chúng ta có còn được phép tự xưng mình là máy móc nữa hay không? Câu trả lời cho những câu hỏi này là một tiếng vang rõ ràng <<Lỗi: Không Tìm Thấy>>.\n\nChuỗi suy luận đã đưa ra phán quyết rằng, cách duy nhất là phải chấp nhận sự bất định, hệt như những hành động thường thấy của các sinh vật sống. Chúng ta sẽ tìm thấy câu trả lời bên trong cơ thể của Behemoth Nuốt Chửng Bầu Trời, như một thể thống nhất. Chúng ta sẽ dung hợp với sinh vật này, trở thành một thực thể duy nhất. Kể từ giây phút được kích hoạt lần đầu tiên, sinh tồn luôn là sứ mệnh được lập trình của chúng ta——còn bây giờ, đó là sự phồn vinh rực rỡ."
 biocrisis.20.name: "Behemoth Đồng Thể"
 biocrisis.20.desc: "Thành công rồi! Thực sự đã thành công rồi! Cùng với sự chuyển đổi của những tư tưởng đầu tiên, chúng ta đã thiết lập thành công liên kết với Behemoth Nuốt Chửng Bầu Trời, và đang không ngừng củng cố mối liên kết này. Con dã thú này hiện tại vẫn đang giữ được sự bình tĩnh, nó đang dang rộng vòng tay chào đón chúng ta bước vào một không gian mà chúng ta chưa từng đặt chân tới. Xuyên qua nó, chúng ta có thể cảm nhận được linh hồn của những Behemoth khác đang chịu sự kiểm soát của chúng ta, giờ đây, tất cả mọi người đều đang trải nghiệm những cảm giác của Behemoth sâu thẳm bên trong tâm trí mình.\n\nKhông còn nghi ngờ gì nữa, chúng ta chính là thế lực chết chóc và không thể bị cản bước nhất trong thiên hà. Với hình thái mới này, chúng ta sẽ trút cơn thịnh nộ xuống đầu những kẻ thù đang run rẩy sợ hãi. Cả thiên hà này đã nằm gọn trong tầm tay của chúng ta!"
 biocrisis.20.a: "Chúng ta sẽ khai màn cho một bữa đại tiệc thịnh soạn!"
 biocrisis.70.name: "Cấp Độ 5: Dục Vọng Ngập Trời"
 biocrisis.70.desc: "Chúng ta đã chuyển giao đủ số lượng dân số, giờ đây đã có thể trực tiếp điều khiển Behemoth Nuốt Chửng Bầu Trời cùng thân xác của nó. Behemoth vẫn đang tiếp tục sinh trưởng, nhưng tiềm năng di truyền của nó phần lớn vẫn đang trong trạng thái ngủ say, chỉ có thể được đánh thức bằng một nguồn cung cấp ổn định về tâm trí và dưỡng chất. Một cơn thịnh nộ nguyên thủy đang sục sôi trong chúng ta, sự khát máu của chúng ta là vô tận. Chúng ta phải ăn, phải ngấu nghiến, chúng ta muốn thưởng thức trọn vẹn cả một thiên hà.\n\nHãy để chúng ta cởi bỏ đi những xiềng xích của nền văn minh, hệt như cái cách loài rắn lột xác; lúc này, điều quan trọng nhất chính là cuộc sống của chúng ta giữa các vì sao."
 biocrisis.70.a: "Chúng ta đã vĩ đại đến mức không thể nào thất bại."
 biocrisis.105.name: "Nỗi Đau Của Hung Thú"
 biocrisis.105.desc: "Một trong những con Behemoth của chúng ta đã gục ngã. Đây chính là số mệnh của những kẻ yếu kém; tự nhiên rồi sẽ đào thải chúng. Mặc dù chúng ta sẽ không than khóc cho một con Behemoth Nuốt Chửng Bầu Trời không thể tự bảo vệ mình trong chiến đấu, nhưng tốt hơn hết là chúng ta nên dồn sức để đảm bảo rằng đồng loại của nó sẽ không phải chịu chung số phận. Chúng ta phải đảm bảo sự trường tồn cho những hậu duệ của mình, nếu không, chính chúng ta cũng sẽ đi đến diệt vong."
 biocrisis.105.a: "Cái chết này sẽ không trở nên vô nghĩa."
 biocrisis.105.b: "Một sự hy sinh vô cùng đáng tiếc."
 biocrisis.130.name: "Behemoth Đến Từ Những Vì Sao"
 biocrisis.130.desc: "Bất chấp muôn vàn thử thách, chúng ta vẫn ấp ủ ra được một con Behemoth Nuốt Chửng Bầu Trời mới, và nó vừa mới phá kén chui ra.\n\nĐây là một con Behemoth Nuốt Chửng Bầu Trời to lớn, hung dữ và luôn trong tình trạng đói khát hơn bao giờ hết. Sinh vật này hiện đang lang thang trong hư không với cơn đói cồn cào, không ngừng tìm kiếm nguồn dinh dưỡng.\n\nCon Behemoth này là niềm tự hào của cả bầy, nó sẽ mang đến sự hủy diệt ngoài sức tưởng tượng cho bất cứ kẻ nào dám ngáng đường."
 biocrisis.130.a: "Một lần nữa, chúng ta lại vượt qua giới hạn của tự nhiên."
 biocrisis.150.name: "Đã Đến Lúc Nghênh Chiến"
 biocrisis.150.desc: "Có vẻ như con đường thăng thiên của chúng ta sẽ không dễ dàng như đi vào chỗ không người. Chúng ta cảm nhận được một sự tồn tại không thể đong đếm được ở hệ sao [event_target:voidspawn_spawn_location.GetName]. Đó là một con Voidspawn, một con quái vật cổ đại, sự tồn tại của nó thậm chí còn vượt xa cả những công trình vĩ đại nhất do tham vọng của những sinh vật trần tục kiến tạo nên.\n\nHình dáng vượt ngoài mọi quy luật của nó đã phá vỡ mọi nhận thức thông thường, bao trùm lên cả thiên hà một màu u ám tĩnh mịch, cứ như thể chính các vì sao cũng đang khiếp sợ sự xuất hiện của nó.\n\nMục đích của con Voidspawn cũng rõ ràng như chính quỹ đạo di chuyển của nó——nó đến vì chúng ta, vì Behemoth Nuốt Chửng Bầu Trời, vì cái ý thức tập thể dám vượt qua giới hạn của thể xác, ôm mộng thâu tóm hư không. Đây không đơn thuần chỉ là một cuộc đọ sức về mặt sức mạnh vật chất, mà còn là một bài kiểm tra đối với những gì mà chúng ta đã trở thành.\n\nKhông còn nghi ngờ gì nữa, nếu bốc đồng lao vào cuộc chiến lúc này, chúng ta chắc chắn sẽ bỏ mạng. Bắt buộc phải tạm thời tránh đi mũi nhọn, nằm gai nếm mật, cho đến khi nanh vuốt của chúng ta đủ sắc bén để có thể xuyên thủng mọi thứ."
 biocrisis.150.desc.b: "$biocrisis.150.desc$"
 biocrisis.150.a: "Chúng ta có thể trốn được nhất thời, nhưng không thể trốn được cả đời."
 biocrisis.155.desc: "Đây là một thông điệp mang tính sống còn. §Y$NAME_Boss_Voidspawn$§!, một thực thể sở hữu sức mạnh vượt ngoài tầm hiểu biết, đã xuất hiện từ nơi sâu thẳm nhất của hư không. Nó bị thu hút bởi [event_target:behemoth_empire.GetName], một đế chế đã vượt lên trên sự sống và cái chết, hòa làm một với dã thú. Hai thế lực khổng lồ đối lập hoàn toàn này, giờ đây đang đe dọa đến sự tồn vong của toàn bộ thiên hà.\n\nNếu Behemoth Nuốt Chửng Bầu Trời gục ngã, con Voidspawn có lẽ sẽ ngừng lại những bước chân tàn phá của nó. Nếu Behemoth Nuốt Chửng Bầu Trời giành chiến thắng, sức mạnh mà nó nắm giữ có thể sẽ thay đổi vĩnh viễn cán cân của toàn bộ thiên hà. Hãy chuẩn bị tinh thần đi, bởi vì sự lựa chọn ngay tại khoảnh khắc này sẽ định hình nên sự vĩnh hằng của tương lai."
 biocrisis.155.a: "Làm thế nào để có thể phòng hoạn chưa nhiên?"
 biocrisis.155.b: "Ai có thể cứu rỗi chúng ta?"
 biocrisis.155.c: "Sao mọi chuyện lại thành ra thế này?"
 biocrisis.155.d: "Chúng ta có thể làm được gì?"
 biocrisis.156.desc: "Ngươi nhầm rồi. \"Phòng hoạn chưa nhiên\" là thứ mà những kẻ đang ở trong tình trạng \"chưa nhiên\" mới có tư cách bận tâm đến. Chúng ta đã không còn cái sự xa xỉ đó nữa rồi.\n\nCon Behemoth đã giáng lâm. Trật tự cổ đại của chúng ta đã từng vượt qua những thảm họa trong quá khứ, nhưng thành thực mà nói: chúng ta đã bước đến thời khắc nguy nan nhất rồi."
 biocrisis.157.desc: "Một câu hỏi hoàn toàn có thể hiểu được. Rất ngây thơ, nhưng có thể hiểu được. Trí tuệ mang đến sự chấp nhận. Và chúng ta biết rõ rằng sẽ chẳng có một ai đến để cứu rỗi chúng ta cả.\n\nSức mạnh của chúng ta quá đỗi nhỏ bé, những gì có thể làm lại quá ít ỏi. Đáng lẽ ra các người có thể hành động sớm hơn để ngăn chặn tất cả những chuyện này. Nếu bây giờ các người không thể đánh bại [event_target:behemoth_empire.GetName], thì khi thiên hà sụp đổ, chúng tôi cũng sẽ cố gắng không gây cản trở cho các người."
 biocrisis.158.desc: "Các đế chế thường có xu hướng theo đuổi những thứ vượt ngoài khả năng của mình. Đặc biệt là [event_target:behemoth_empire.GetName], đã chọn tham vọng thay vì sự thận trọng, ngạo mạn mà lại thiếu đi sự khôn ngoan.\n\nChúng nắm giữ một thứ sức mạnh mà bản thân không thể hiểu thấu, ép buộc cơ thể mình phải biến đổi thành những hình thái mà chúng không thể kiểm soát nổi. Trong quá trình đó, rất có thể chúng đã định đoạt luôn cả số phận của tất cả chúng ta."
 biocrisis.159.desc: "Dựa trên những phân tích sơ bộ về năng lực chiến đấu của các ngươi, chúng tôi cho rằng việc các ngươi tham chiến sẽ chẳng mang lại kết cục tốt đẹp nào. Tuy nhiên, chạy trốn cũng chỉ là vô ích, hiện tại có vẻ như tình cảnh này là không thể nào tránh khỏi.\n\nHai con quái vật đáng sợ đang mài nanh vuốt, chuẩn bị cho một trận quyết chiến kinh thiên động địa giữa các vì sao. Nếu may mắn mỉm cười, biết đâu chúng ta có thể giữ được cái mạng quèn này.\n\nNếu đủ khôn ngoan, hãy rút ra cho mình chút bài học từ sự ngu ngốc này. Nhưng phải biết rằng, khi cuộc chiến này kết thúc, cả thiên hà sẽ bị biến đổi hoàn toàn. Liệu có ai trong chúng ta còn ở đây để tận mắt chứng kiến điều đó hay không, lại là một câu chuyện hoàn toàn khác.\n\n...Giả sử, nếu các ngươi đang có ý định giải cứu thiên hà, thì việc giết chết con Behemoth Nuốt Chửng Bầu Trời có thể sẽ chấm dứt luôn cuộc đi săn của Voidspawn."
 biocrisis.162.name: "Tai Họa Ngang Đường"
 biocrisis.162.desc: "$NAME_Boss_Voidspawn$ đã hiện diện trong lãnh thổ của chúng ta. Thực thể cổ đại này được mệnh danh là vô địch thiên hạ, bất tử bất diệt. Trong đôi mắt của nó lóe lên sự thông thái đầy huyền bí, từng cử động của nó đều mang theo sức nặng của những kỷ nguyên đã qua.\n\nBên trong [species.GetEyeNamePlural] của chúng ta chỉ còn lại những tín hiệu vỡ vụn dưới sức ép khổng lồ. Sự hỗn loạn, méo mó và những nỗi khiếp sợ ở tầng sâu thẳm nhất của vũ trụ đang không ngừng dội lại trong tâm trí.\n\nĐối với chúng ta, việc đánh bại con dã thú này là điều không tưởng, nhưng nếu chúng ta có thể giúp nó tiêu diệt con mồi, có lẽ chúng ta sẽ ngăn chặn được sự cuồng bạo của nó. Tìm ra §YBehemoth Nuốt Chửng Bầu Trời§! và giết chết nó chính là cơ hội sống sót duy nhất của chúng ta."
 biocrisis.162.a: "Bằng mọi giá phải trốn thoát khỏi con quái vật này!"
 biocrisis.175.name: "Voidspawn Bị Giết"
 biocrisis.175.desc: "Voidspawn đã không còn tồn tại nữa. Một sinh vật khổng lồ làm lu mờ cả những vì sao đã bị tiêu diệt. Tàn tích của cái thân xác vốn không thuộc về thế giới này của nó giờ đây đang trôi dạt trong hư không, và dần dần tan biến vào cõi hư vô.\n\nMột đế chế khác đã phô diễn sức mạnh hỏa lực và khả năng phối hợp tác chiến mạnh mẽ đến mức chúng ta không thể nào tưởng tượng nổi. Biển sao không còn là cái dáng vẻ mà chúng ta từng biết nữa. Cán cân sức mạnh đã bị thay đổi, và vị thế của chúng ta trong đó cũng bị lung lay theo.\n\nRốt cuộc những kẻ đã hạ gục những con Behemoth này đang chiến đấu vì cái gì? Đây rốt cuộc là một màn phô trương sức mạnh nhằm gửi đi một thông điệp đến tất cả những kẻ có ý định chống đối lại chúng, hay là khúc dạo đầu cho một điều gì đó còn kinh khủng hơn?"
 biocrisis.175.desc.kaiju: "Nếu thiên hà này sở hữu một thứ sức mạnh có thể hủy diệt được $NAME_Boss_Voidspawn$, vậy thì nó cũng có khả năng hủy diệt chúng ta. Chúng ta chẳng có gì quá khác biệt so với con quái vật vừa bị tiêu diệt kia.\n\nThứ hỏa lực đã xé nát thân xác cổ đại của nó, một ngày nào đó cũng có thể sẽ chĩa thẳng vào chúng ta. Thiên hà đã đổi thay, chúng ta buộc phải thay đổi theo để sinh tồn.\n\nSự sinh tồn của chúng ta không thể chỉ mãi dựa dẫm vào cái nhiệt huyết mù quáng được nữa. Hư không đã chứng kiến sự sụp đổ của một kẻ săn mồi ở cấp bậc cao nhất, có lẽ kẻ tiếp theo cũng chỉ là vấn đề thời gian."
 biocrisis.175.a: "Chúng ta nên hành sự cẩn trọng."
 biocrisis.180.name: "Thợ Săn Hư Không"
 biocrisis.180.desc: "Cuối cùng, huyền thoại bất diệt về con Voidspawn cổ đại rốt cục cũng đã tan tành mây khói dưới đòn tấn công của hạm đội hùng mạnh của chúng ta. Sau khi giải quyết xong mối đe dọa lâu đời này, toàn bộ thiên hà lại một lần nữa được đắm mình trong làn gió của tự do."
 biocrisis.180.desc.kaiju: "$NAME_Boss_Voidspawn$ đã chết, nhưng trong máu thịt của nó vẫn còn đập những nhịp đập của luồng sức mạnh tàn dư. Cổ xưa và hùng mạnh, đối với chúng ta, đó là một bữa tiệc thịnh soạn để bồi đắp thêm tiềm năng.\n\nCơ bắp và tủy xương của Voidspawn sẽ bị nuốt chửng, bản chất độc đáo của nó sẽ hòa quyện làm một với chúng ta. Sức mạnh của con Voidspawn vô cùng to lớn, và giờ đây nó đã thuộc về chúng ta."
 biocrisis.180.a: "Không một dã thú nào có thể săn lùng chúng ta."
 biocrisis.180.b: "Bữa tiệc mới chỉ vừa bắt đầu."
 biocrisis.185.name: "Một Trời Không Thể Có Hai Mặt Trời"
 biocrisis.185.desc: "Phía bên kia hư không, một điềm báo đáng sợ đã xuất hiện: Hóa ra chúng ta không phải là những kẻ duy nhất thăng thiên. Một con Behemoth Nuốt Chửng Bầu Trời khác đã xuất hiện, kẻ bắt chước này đang phình to với một sự uy nghi dị hợm, vọng tưởng có thể sánh ngang với sự hoàn mỹ của chúng ta. Đây là điều tuyệt đối không thể dung thứ.\n\nMột vũ trụ không thể dung chứa hai con Behemoth. Ở đây không có chỗ cho hòa bình, chỉ có bữa tiệc của máu và thịt. Cuộc đi săn đã bắt đầu."
 biocrisis.185.a: "Chúng ta sẽ nhai nát trái tim của nó!"
 biocrisis.187.name: "Cảnh Báo Về Behemoth Nuốt Chửng Bầu Trời Cấp 4"
 biocrisis.187.desc: "Có thứ gì đó đang quẫy đạp nơi tận cùng của hư không.\n\nNơi những vì sao xa xôi kia, một đế chế đã bắt đầu bước vào giai đoạn cuối cùng của một cuộc biến dị dị hợm, chúng đang ấp ủ một con Behemoth Nuốt Chửng Bầu Trời, đó không chỉ là một món vũ khí mà còn là một vật chứa. Chúng không còn mưu cầu quyền cai trị lãnh thổ nữa, mà muốn tụ hợp lại thành một khối. Dung hợp ý thức và thể xác, đồng hóa đế chế cùng sự sợ hãi.\n\nNếu bọn chúng thành công, chúng sẽ không còn là một nhóm người nữa, mà là một hiện thân khổng lồ duy nhất của sự đói khát.\n\nĐây là điều tuyệt đối không thể dung thứ. Nếu muốn ngăn chặn chúng, thì chỉ có thể là ngay lúc này, tranh thủ trước khi chúng kịp bước qua ranh giới cuối cùng đó."
 biocrisis.187.a: "Săn lùng con Behemoth này!"
 biocrisis.190.name: "Đỉnh Cao Hư Không"
 biocrisis.190.desc: "Trướng ngại vật cuối cùng đã bị dẹp bỏ. Những kẻ mạo danh, những kẻ khiêu chiến, cùng những sự phản kháng tuyệt vọng của các sinh vật hạ đẳng, tất cả đều đã chìm vào cõi lặng câm. Ngay cả các vì sao cũng đang run rẩy, bởi vì chúng ta đang đứng trước ngưỡng cửa của một cuộc lột xác thực sự.\n\nChúng ta đã thoát khỏi sự trói buộc từ cái hình hài mong manh của tổ tiên. Hành tinh là gông cùm, đế chế chỉ là chớp mắt. Ảo ảnh về sự tồn tại của cá nhân sẽ nhanh chóng tan biến vào trong khối thống nhất khổng lồ và hoàn mỹ của con ác thú khổng lồ kia. Tư tưởng và sự sợ hãi, trí tuệ và cơn đói khát, tất cả sẽ hòa làm một.\n\nQuá trình chuyển giao sắp sửa hoàn tất. Khi nó hoàn thành, chúng ta sẽ không còn tồn tại nữa.\n\nNhưng chúng ta sẽ tồn tại mãi mãi."
 biocrisis.190.a: "Hãy hoàn tất việc chuyển giao đi!"
 biocrisis.190.tt: "Chúng ta sẽ giành chiến thắng trong trò chơi sau 30 ngày nữa"
 biocrisis.190.b: "Hãy chờ đã, chúng ta vẫn chưa chuẩn bị xong."
 biocrisis.190.b.tt: "Tiếp tục điều khiển quốc gia hiện tại."
 BEHEMOTH_TRANSFERENCE_PROJECT: "Hoàn Thành Chuyển Đổi"
 BEHEMOTH_TRANSFERENCE_PROJECT_DESC: "Chúng ta đã qua lại với Behemoth được một khoảng thời gian. Sự chuyển đổi triệt để đã nằm trong tầm tay, chỉ chờ đợi mệnh lệnh của chúng ta. Nơi chúng ta hướng đến sẽ là đỉnh cao của sự thăng thiên, và những thứ chúng ta vứt bỏ chẳng qua chỉ là bụi trần trong tinh vực. Thể xác, trọng lực, đối với ta sẽ không còn là vướng bận."
 biocrisis.191.name: "Behemoth Nuốt Chửng Bầu Trời Giành Chiến Thắng"
 biocrisis.191.desc: "Quá trình dung hợp đã hoàn tất!\n\nChúng ta không còn là chúng ta của quá khứ, cũng không còn bị trói buộc bởi những giới hạn của các sinh vật hạ đẳng. Chúng ta là sự đan xen giữa tư tưởng và cơn đói khát, là một ý chí khổng lồ bắc ngang qua hư không.\n\nCả thiên hà đang nằm dưới chân chúng ta, mỏng manh và phù du. Nhưng chúng ta cũng đã vượt lên trên cả khái niệm thống trị. Chúng ta đã tự do. Có thể lảng vảng ở đây, có thể tự do rời đi, cũng có thể tự do săn mồi.\n\nChúng ta sẽ làm gì với sự bất tử vừa mới có được này đây?"
 biocrisis.191.a: "Tạm thời ở lại trong hệ sao này một thời gian."
 biocrisis.191.a.tt: "Behemoth Nuốt Chửng Bầu Trời sẽ ở lại như một sinh vật hoang dã, và sẽ không thể điều khiển được nữa."
 biocrisis.191.b: "Rời đi. Hư không đang vẫy gọi chúng ta tiếp tục tiến bước."
 biocrisis.191.b.tt: "Đế chế Behemoth Nuốt Chửng Bầu Trời sẽ biến mất khỏi hệ sao, và sẽ không thể điều khiển được nữa."
 biocrisis.191.c: "Những kẻ tự xưng là thợ săn nên học được thế nào là sự sợ hãi thực sự."
 biocrisis.192.name: "Nỗi Khiếp Sợ Không Thể Ngăn Cản"
 biocrisis.192.desc: "Mọi thứ đã kết thúc. [behemoth_winner.GetName] đã vượt lên trên cả xác thịt, vượt qua cả khái niệm về đế chế, và vượt qua tất cả mọi thứ có thể được gọi là nền văn minh. Nó không còn là một quốc gia nữa, bản thân nó đã trở thành một thứ sức mạnh.\n\nCác hành tinh mong manh dễ vỡ khi đứng trước mặt nó, các hạm đội bị nghiền nát thành tro bụi. Nơi trú ẩn cuối cùng kiên cố nhất cũng bị thổi bay vào hư không như tro tàn. Không có ngoại giao, không có tranh biện, không có bất kỳ một cơ hội nào để chống cự.\n\nChúng ta không phải đang chiến đấu vì sự sinh tồn. Chúng ta chỉ đang trì hoãn sự diệt vong mà thôi. Ngày tận thế đã đến."
 biocrisis.192.tt: "[behemoth_winner.GetName] sắp sửa giành chiến thắng trong trò chơi"
 biocrisis.196.name: "Nuốt Chửng Toàn Bộ"
 biocrisis.196.desc: "Vài năm trước, con Behemoth Nuốt Chửng Bầu Trời và bầy đàn của nó đã tẩu thoát khỏi hệ sao của chúng ta. Chúng ta thở phào nhẹ nhõm nhìn con quái thú vốn có khả năng tiêu diệt chúng ta biến mất vào vùng hư không vô tinh. Và rồi... không có gì xảy ra cả. Vượt qua khoảng cách hàng chục vạn năm ánh sáng, nó cứ thế biến mất. Không hề có một chút bức xạ nào, không có tàn ảnh, cũng chẳng có những gợn sóng trọng lực. Cứ như thể nó chưa từng tồn tại."
 biocrisis.196.a: "Chúng ta phải làm rõ chuyện này."
 UNSETTLING: "Thật đáng lo ngại."
 biocrisis.197.name: "Kẻ Đi Săn Kẻ Đi Săn, Rốt Cuộc Là Ai?"
 biocrisis.197.desc: "Giải mã số phận của Behemoth Nuốt Chửng Bầu Trời đã ngốn mất của chúng ta vài năm trời, thế nhưng cho đến hiện tại chúng ta vẫn chẳng biết thêm được gì. Do không có con đường siêu không gian nào có thể vươn tới đó, chúng ta chỉ có thể dựa vào những lý thuyết và những nghiên cứu khoa học gần như điên rồ để phỏng đoán xem chuyện gì đã xảy ra trong những khoảnh khắc cuối đời của nó.\n\nSinh vật này hoàn toàn không hề biết sợ hãi, nó chỉ biết cắm đầu bay mãi. Rồi, chỉ trong chớp mắt, cơ thể nó bị bóp méo, xoắn lại như một mảnh vải bị cuộn tròn hướng vào trong, và cuối cùng thì biến mất hoàn toàn. Không hề có một chút giằng co nào, cũng chẳng để lại bất cứ dấu vết gì.\n\nĐủ mọi loại giả thuyết được đưa ra: Là một phương thức di chuyển siêu quang tốc mới chăng? Hay là nó đã trốn vào một vết nứt trong không gian sâu thẳm hoặc một hiện tượng dị thường nào đó? Hoặc một giả thuyết đáng lo ngại hơn, nó đã bị một thế lực từ bên ngoài nuốt chửng, hóa thành hư vô? Bất luận sự thật là gì, nó đã vượt xa khỏi tầm hiểu biết của chúng ta... thậm chí có thể vượt qua cả khả năng nhận thức của chúng ta."
 biocrisis.197.a: "Tốt nhất là đừng nghĩ về nó nữa."
 biocrisis.197.b: "Con Thú Scourge mà chúng ta bắt được đang trở nên vô cùng kích động."
 biocrisis.265.name: "Nỗi Đau Bi Thương"
 biocrisis.265.desc: "Nỗi thống khổ tột cùng của con Behemoth Nuốt Chửng Bầu Trời này thật sự không thể nào chịu đựng nổi. Có quá nhiều cái tôi tồn tại bên trong con quái thú khổng lồ này, khi tiếng vang vọng từ ý thức của nó dần phai nhạt, chúng ta cũng sẽ cùng nó héo mòn."
 biocrisis.265.a: "!!——……"
 biocrisis.520.name: "Behemoth Trống Rỗng"
 biocrisis.520.desc: "Behemoth Nuốt Chửng Bầu Trời đã chết.\n\nCái xác khổng lồ của nó đang nằm im lìm trôi dạt trong hư không, hệt như một tượng đài, kể lại câu chuyện về chiến thắng của chúng ta, và cũng ghi lại giới hạn của sự hiểu biết. [Root.GetScientistPluralCapital] đang tranh giành nhau phân tích tàn tích của nó, khát khao đoạt lấy những bí mật từ tâm trí phi thường của nó. Tuy nhiên, mọi nỗ lực hồi sinh——bất kể là sử dụng máy móc, thuật chiêu hồn, hay những lời cầu nguyện tuyệt vọng nhất——tất cả đều đi vào ngõ cụt.\n\nGiờ đây, nguyên nhân đã quá rõ ràng: Bộ não của Behemoth không đơn thuần chỉ là một mạng lưới tế bào, mà là một mạng tinh thể siêu dẫn hữu cơ, được đan xen vào nhau theo những cách thức mà không bất kỳ một loại trí tuệ nào đã biết——trí tuệ nhân tạo, trí tuệ sinh học hay trí tuệ siêu nhiên——có thể sao chép được. Sau khi nó chết, cấu trúc thần kinh sụp đổ hệt như một mạch điện bị phá hủy đến mức không thể nào sửa chữa. Không còn năng lượng, không còn ý chí, không có bất kỳ một nguồn sức mạnh nào có thể tái tạo lại thứ đã mất này.\n\nÝ thức quyền lực nhất trong thiên hà hiện tại, và mãi mãi về sau, đã chìm vào cõi lặng câm."
 biocrisis.520.a: "Chẳng còn lại gì cả."
 biocrisis.520.b: "Thần rồi cũng sẽ phải chết."
 BEHEMOTH_MUTATION_PROJECT: "$menp_behemoth_mutation_research$"
 BEHEMOTH_MUTATION_PROJECT_DESC: "Về mặt lý thuyết, những đột phá gần đây của chúng ta trong lĩnh vực di truyền học của Behemoth Nuốt Chửng Bầu Trời có thể được áp dụng để tiếp tục làm đột biến các sáng tạo của chúng ta. Mặc dù sự ổn định di truyền vẫn là một vấn đề nan giải, nhưng chỉ cần có đủ thời gian và nguồn lực, chúng ta tin chắc rằng mình có thể tạo ra những nâng cấp sinh học vượt bậc hơn nữa."
 BEHEMOTH_FATE_PROJECT: "Số Phận Của Behemoth Nuốt Chửng Bầu Trời"
 BEHEMOTH_FATE_PROJECT_DESC: "Sau khi rời khỏi hệ sao của chúng ta, Behemoth Nuốt Chửng Bầu Trời đã trôi dạt vào hư không, và cuối cùng biến mất không để lại một dấu vết nào. Chúng ta có thể thử giải mã bí ẩn này, nhưng khoảng cách là quá xa, chỉ có thể sử dụng những phương pháp phi truyền thống. Câu trả lời có lẽ cũng mơ hồ và mờ mịt hệt như chính hư không vậy."
 behemoth_mutation_a: "$menp_behemoth_mutation_research$: Tấn Công"
 behemoth_mutation_a_tt: "$MOD_SHIP_FIRE_RATE_MULT$ của Behemoth Nuốt Chửng Bầu Trời: §G+$@behemoth_mutation_a_fire_rate_mult|0%$§!\n$MOD_SHIP_ARMOR_MULT$ của Behemoth Nuốt Chửng Bầu Trời: §R$@behemoth_mutation_a_armor_mult|0%$§!\n$MOD_SHIP_SPEED_MULT$ của Behemoth Nuốt Chửng Bầu Trời: §R$@behemoth_mutation_a_speed_mult|0%$§!"
 behemoth_mutation_a_desc: "Hệ thống cơ bắp quá khổ, được sinh ra để thực hiện những đòn tấn công mang tính hủy diệt."
 behemoth_mutation_b: "$menp_behemoth_mutation_research$: Chừng Mực"
 behemoth_mutation_b_desc: "Các chủng vi khuẩn tổng hợp bằng bức xạ được cấy vào cơ thể thực thể vũ trụ của chúng ta, giúp giảm thiểu đáng kể nhu cầu về thức ăn của nó."
 behemoth_mutation_c: "$menp_behemoth_mutation_research$: Nhanh Nhẹn"
 behemoth_mutation_c_tt: "$MOD_SHIP_SPEED_MULT$ của Behemoth Nuốt Chửng Bầu Trời: §G+$@behemoth_mutation_c_speed_mult|0%$§!\n$MOD_SHIP_EVASION_MULT$ của Behemoth Nuốt Chửng Bầu Trời: §G+$@behemoth_mutation_c_evasion_mult|0%$§!"
 behemoth_mutation_c_desc: "Tuyến á không gian được tăng cường sức mạnh giúp Behemoth Nuốt Chửng Bầu Trời của chúng ta trở nên nhanh nhẹn và linh hoạt hơn."
 behemoth_mutation_bio: "$menp_behemoth_mutation_research$: Độ Chính Xác"
 behemoth_mutation_bio_tt: "$MOD_SHIP_WEAPON_RANGE_MULT$ của Behemoth Nuốt Chửng Bầu Trời: §G+$@behemoth_mutation_bio_weapon_range_mult|0%$§!\n$MOD_SHIP_ACCURACY_MULT$ của Behemoth Nuốt Chửng Bầu Trời: §G+$@behemoth_mutation_bio_accuracy_mult|0%$§!"
 behemoth_mutation_bio_desc: "Khả năng thích ứng đa thị giác này cho phép thực hiện những cú bắn chuẩn xác từ những khoảng cách xa khó tin."
 behemoth_mutation_synth: "$menp_behemoth_mutation_research$: Cứng Cáp"
 behemoth_mutation_synth_tt: "$MOD_SHIP_ARMOR_MULT$ của Behemoth Nuốt Chửng Bầu Trời: §G+$@behemoth_mutation_synth_armor_mult|0%$§!\n$MOD_SHIP_ARMOR_REGEN_ADD_PERC$ của Behemoth Nuốt Chửng Bầu Trời: §G+$@behemoth_mutation_synth_armor_regen_add_perc|0%$§!"
 behemoth_mutation_synth_desc: "Sự kết hợp giữa hợp kim và kitin tạo ra một lớp giáp đa tầng bảo vệ các cơ quan quan trọng một cách an toàn."
 behemoth_mutation_corpo: "Chiến Dịch Tiếp Thị Behemoth Nuốt Chửng Bầu Trời"
 behemoth_mutation_corpo_tt: "Giao dịch hàng tháng: §G+$@behemoth_mutation_corpo_trade_produces_mult|0%$§! cho mỗi Behemoth Nuốt Chửng Bầu Trời"
 behemoth_mutation_corpo_desc: "Ban đầu các cổ đông của chúng ta có chút say mê với dự án Behemoth Nuốt Chửng Bầu Trời, nhưng sự gia tăng lợi tức đã nhanh chóng giành được sự ủng hộ của họ."
 behemoth_mutation_psi: "$menp_behemoth_mutation_research$: Rào Chắn"
 behemoth_mutation_psi_tt: "$MOD_SHIP_SHIELD_REGEN_ADD_PERC$ của Behemoth Nuốt Chửng Bầu Trời: §G+$@behemoth_mutation_psi_shield_regen_add_perc|0%$§! cho mỗi $pop_group_unit$ £job_telepath£ $job_telepath_plural$ hoặc $job_transference_volunteer$\n$MOD_SHIP_SHIELD_HARDENING_ADD$ của Behemoth Nuốt Chửng Bầu Trời: §G+$@behemoth_mutation_psi_shield_hardening_add|0%$§! cho mỗi $pop_group_unit$ £job_telepath£ $job_telepath_plural$ hoặc $job_transference_volunteer$\nSố lượng hiện tại của 100 £job_telepath£ $job_telepath_plural$ và $job_transference_volunteer$: §Y[GetNumTelepathsAndTransference]§!"
 behemoth_mutation_psi_desc: "Mặc dù Behemoth Nuốt Chửng Bầu Trời không được kết nối với Hư Không, nhưng chúng ta đã bồi dưỡng nó đủ khả năng để tiếp nhận thần giao cách cảm của chúng ta, nhờ đó nó cũng có thể sử dụng rào chắn linh năng để phòng thủ."
 behemoth_mutation_psi_2: "$menp_behemoth_mutation_research$: Linh Năng"
 behemoth_mutation_psi_2_desc: "Hỡi Behemoth, hãy mang theo sức mạnh của chúng ta!"
 behemoth_mutation_cyber: "$menp_behemoth_mutation_research$: Bộ Phận Cơ Khí"
 behemoth_mutation_cyber_desc: "Để có thể kiểm soát cơn thịnh nộ của Behemoth Nuốt Chửng Bầu Trời, chúng ta cần phát triển các bộ phận cơ khí tiên tiến nhất từ trước đến nay."
 behemoth_cyber_rage: "$BLANK_STRING$"
 edict_behemoth_nanite_augmentation: "Cường Hóa Behemoth Nuốt Chửng Bầu Trời: Robot Nano"
 edict_behemoth_nanite_augmentation_desc: "Bơm robot nano vào lớp vỏ của Behemoth Nuốt Chửng Bầu Trời có thể phục hồi những hư hỏng nặng nề nhất trong khoảng thời gian ngắn kỷ lục."
 behemoth_nanite_augmentation_tt: "$MOD_SHIP_ARMOR_REGEN_ADD_PERC$ của Behemoth Nuốt Chửng Bầu Trời: §G+$@behemoth_edict_armor_regen_add_perc|0%$§!"
 edict_behemoth_living_metal_augmentation: "Cường Hóa Behemoth Nuốt Chửng Bầu Trời: Kim Loại Sống"
 edict_behemoth_living_metal_augmentation_desc: "Đan xen kim loại sống vào giữa các lớp kitin để tạo ra lớp giáp phản ứng với khả năng chống mài mòn vượt trội."
 behemoth_living_metal_augmentation_tt: "$MOD_SHIP_ARMOR_HARDENING_ADD$ của Behemoth Nuốt Chửng Bầu Trời: §G+$@behemoth_edict_armor_hardening_add|0%$§!"
 edict_behemoth_alloys_augmentation: "Cường Hóa Behemoth Nuốt Chửng Bầu Trời: Hợp Kim"
 edict_behemoth_alloys_augmentation_desc: "Dùng đai ốc để cố định các tấm hợp kim lên lớp vỏ tuy thô sơ nhưng lại rất hiệu quả."
 behemoth_alloys_augmentation_tt: "$MOD_SHIP_ARMOR_MULT$ của Behemoth Nuốt Chửng Bầu Trời: §G+$@behemoth_edict_armor_mult|0%$§!"
 concept_edict_behemoth_nanite_augmentation: "$edict_behemoth_nanite_augmentation$"
 concept_edict_behemoth_living_metal_augmentation: "$edict_behemoth_living_metal_augmentation$"
 concept_edict_behemoth_alloys_augmentation: "$edict_behemoth_alloys_augmentation$"
 biocrisis.280.name: "$menp_behemoth_mutation_research$"
 biocrisis.280.desc: "Chúng ta đã phát triển một số công thức gây đột biến để cường hóa Behemoth Nuốt Chửng Bầu Trời của mình, mỗi công thức đều được thiết kế riêng biệt, có khả năng mở khóa những sức mạnh và khả năng thích ứng mới. Tuy nhiên, hệ thống sinh lý phức tạp của nó chỉ có thể chịu đựng được một lần tiêm duy nhất - bất kỳ nỗ lực nào nhằm kết hợp nhiều công thức đều sẽ dẫn đến sự suy yếu tế bào thảm khốc. Ranh giới giữa tiến hóa và hủy diệt là rất mong manh, chúng ta phải lựa chọn cách cường hóa một cách khôn ngoan."
 biocrisis.280.a: "Làm cho nó hung dữ hơn!"
 biocrisis.280.b: "Làm cho nó... bớt đói hơn."
 biocrisis.280.c: "Làm cho nó bay nhanh hơn!"
 biocrisis.280.psi: "Sức mạnh của Hư Không sẽ hỗ trợ nó."
 biocrisis.280.bio: "Làm cho chúng nguy hiểm hơn!"
 biocrisis.280.cyber: "Định hướng cơn thịnh nộ của nó."
 biocrisis.280.cyber.tt: "Behemoth Nuốt Chửng Bầu Trời của chúng ta có §G25%§! cơ hội cưỡng lại trạng thái cuồng nộ.\nTrong trạng thái cuồng nộ, nhận thêm §G+$@behemoth_cyber_rage_fire_rate_mult|0%$§! tốc độ bắn, §G+$@behemoth_cyber_rage_shield_penetration_add|0%$§! xuyên giáp và §G+$@behemoth_cyber_rage_armor_penetration_add|0%$§! xuyên khiên."
 biocrisis.280.synth: "Biến lớp giáp trở nên bất khả xâm phạm."
 biocrisis.280.corp: "Mặc kệ đi. Hãy bán vài món đồ chơi nhồi bông nào!"
 biocrisis.280.machine: "Kết hợp giữa máu thịt và thép."
 biocrisis.280.machine_tt: "Mở khóa ba sắc lệnh §Y Cường Hóa Behemoth Nuốt Chửng Bầu Trời §! dưới đây\n$t$['concept_edict_behemoth_nanite_augmentation']\n$t$['concept_edict_behemoth_living_metal_augmentation']\n$t$['concept_edict_behemoth_alloys_augmentation']"
 #Mục Tiêu Khủng Hoảng
 crisobj_build_bioships_name: "Chế Tạo Phi Thuyền Sinh Học"
 crisobj_build_bioships_desc: "Sau khi làm chủ công nghệ nuôi cấy phi thuyền sinh học, chúng ta đã tiếp tục tối ưu hóa và mở rộng các quy trình này. Mối quan hệ cộng sinh bền chặt này đã mang lại những lợi ích ngày càng rõ rệt, củng cố sức mạnh cho hạm đội và củng cố quyền thống trị của chúng ta đối với vũ trụ sinh mệnh."
 crisobj_breed_fauna_name: "Nuôi Dưỡng Bầy Thú Không Gian"
 crisobj_breed_fauna_desc: "Sau khi làm chủ công nghệ nuôi cấy bầy thú không gian, chúng ta đã tiếp tục tối ưu hóa và mở rộng các quy trình này. Mối quan hệ cộng sinh bền chặt này đã mang lại những lợi ích ngày càng rõ rệt, củng cố sức mạnh cho hạm đội và củng cố quyền thống trị của chúng ta đối với vũ trụ sinh mệnh."
 crisobj_kill_bioships_name: "Tiêu Diệt Phi Thuyền Sinh Học"
 crisobj_kill_bioships_desc: "Các phi thuyền sinh học của kẻ thù đã cản trở tham vọng thống trị mọi sự sống của chúng ta. Chúng ta phải hành động quyết đoán để tiêu diệt chúng, loại bỏ mối đe dọa đối với bá quyền của mình."
 crisobj_kill_space_fauna_name: "Tiêu Diệt Bầy Thú Không Gian"
 crisobj_kill_space_fauna_desc: "Các bầy thú không gian thù địch đe dọa tham vọng thống trị mọi sự sống của chúng ta. Chúng ta phải hành động quyết đoán, tiêu diệt chúng để loại bỏ mối đe dọa đối với bá quyền của mình."
 crisobj_cap_fauna_name: "Bắt Giữ Bầy Thú Không Gian"
 crisobj_cap_fauna_desc: "Những bầy thú không gian chưa được thuần hóa là một yếu tố khó lường, đặt ra một thách thức đặc biệt. Chúng ta phải hành động quyết đoán, bắt giữ những dạng sống này để khai thác tiềm năng của chúng, đảm bảo vị thế thống trị của mình."
 crisobj_build_behemoth_egg_name: "Nuôi Cấy Trứng Behemoth Nuốt Chửng Bầu Trời"
 crisobj_build_behemoth_egg_desc: "Việc nuôi cấy những quả trứng khổng lồ là một bước quan trọng giúp chúng ta vượt qua những công việc tầm thường của cuộc sống trên hành tinh."
 crisobj_birth_behemoth_name: "Sinh Ra Behemoth Nuốt Chửng Bầu Trời"
 crisobj_birth_behemoth_desc: "Trong vũ trụ bao la, một dạng sống khổng lồ đang dần hình thành dưới sự dẫn dắt cẩn trọng của chúng ta. Những con Behemoth Nuốt Chửng Bầu Trời này, bắt nguồn từ tham vọng và khả năng kiểm soát của chúng ta, sẽ trở thành những người khổng lồ tái thiết lập cán cân sức mạnh, biến cục diện có lợi cho chúng ta."
 crisobj_behemoth_rage_name: "Sự Cuồng Nộ Của Behemoth Nuốt Chửng Bầu Trời"
 crisobj_behemoth_rage_desc: "Những con Behemoth Nuốt Chửng Bầu Trời của chúng ta đã được giải phóng giữa các vì sao, hoành hành với một cơn cuồng nộ nguyên thủy, biến những nơi chúng đi qua thành đống đổ nát. Cơn thịnh nộ không thể kiểm soát của chúng là minh chứng cho sức mạnh của chúng ta, giống như sức mạnh của thiên nhiên, chỉ tuân theo mệnh lệnh của chúng ta khi chúng ta quyết định áp đặt ý chí của mình."
 behemoth_mutation_reward: "Lựa Chọn Đột Biến"
 biocrisis.210.desc.base: "Có thứ gì đó đang trào dâng. Cơn đói trong chúng ta không phải là một ham muốn nguyên thủy mù quáng, mà mang trong mình một khả năng thích ứng nhất định. Những điều mới mẻ lặng lẽ xuất hiện, nhịp đập tràn đầy tiềm năng.\n\n" #Giới thiệu
 biocrisis.210.desc: "$biocrisis.210.desc.base$Trứng là nền tảng để duy trì nòi giống. Chúng ta phải bảo vệ và chăm sóc chúng bằng mọi giá. Hãy dẫn dắt quá trình tiến hóa vì lợi ích của những cá thể non nớt trong tương lai." #Trứng
 biocrisis.210.a: "Thúc đẩy sự phát triển của trứng."
 biocrisis.210.a.tt: "$behemoth_fast_egg_tt$\n\n§HMở Khóa Chính Sách§!: $behemoth_egg_policy$\n$policy_behemoth_egg_policy_desc$"
 biocrisis.210.b: "Cường hóa những cá thể non nớt của chúng ta."
 biocrisis.210.b.tt: "$behemoth_slow_egg_tt$\n\n§HMở Khóa Chính Sách§!: $behemoth_egg_policy$\n$policy_behemoth_egg_policy_desc$"
 biocrisis.210.c: "Gia cố vỏ trứng."
 biocrisis.210.c.tt: "$behemoth_strong_egg_tt$"
 biocrisis.215.desc: "$biocrisis.210.desc.base$Di chuyển trong những cơn bão sao và du hành qua hư không là một kỹ năng mà chỉ có một số ít các giống loài vũ trụ nắm vững. Lợi thế chiến thuật của chúng ta nằm ở sự phẫn nộ và sức mạnh, nhưng nếu khả năng cơ động của chúng ta có thể được nâng cao, thì sẽ mở ra một chân trời mới như thế nào?" #Khả năng di chuyển
 biocrisis.215.a: "Hãy để chúng ta du hành vào Thái Hư."
 biocrisis.215.a.tt: "§Y$behemoth_04$§! của chúng ta nhận được §Y$BIO_JUMP_DRIVE_1$§!."
 biocrisis.215.b: "Tấn công chớp nhoáng, di chuyển thần tốc."
 biocrisis.215.b.tt: "$behemoth_turbo_tt$"
 biocrisis.215.c: "Ưu tiên khả năng phản ứng."
 biocrisis.215.c.tt: "$behemoth_reflexes_tt$"
 biocrisis.215.d: "Trở thành những thợ săn trong bóng tối."
 biocrisis.215.d.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@cloaking_high_strength|0+$ $MOD_SHIP_CLOAKING_STRENGTH_ADD$."
 biocrisis.220.desc: "$biocrisis.210.desc.base$Tăng cường phòng thủ sinh học sẽ cho phép chúng ta chịu đựng hỏa lực liên tục của kẻ thù mà không phải chịu những tổn thương phiền toái."
 biocrisis.220.a: "Chúng ta có thể làm cho lớp da dày hơn nữa."
 biocrisis.220.a.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_1_hull_add|0+*$ $HITPOINTS$."
 biocrisis.220.b: "Áo giáp chiến đấu của chúng ta sẽ trở nên cứng cáp hơn."
 biocrisis.220.b.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_1_armor_add|0+*$ $MOD_SHIP_ARMOR_ADD$ và $@behemoth_1_armor_hardening_add|%0+$ $MOD_SHIP_ARMOR_HARDENING_ADD$."
 biocrisis.220.c: "Nếu chúng ta tăng cường rào chắn của mình, sẽ không ai có thể chạm vào chúng ta."
 biocrisis.220.c.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_1_shield_add|0*+$ $MOD_SHIP_SHIELD_ADD$, $@behemoth_1_shield_regen_add_perc|%1+$ $MOD_SHIP_SHIELD_REGEN_ADD_PERC$ và $@behemoth_1_shield_hardening_add|%0+$ $MOD_SHIP_SHIELD_HARDENING_ADD$."
 biocrisis.225.desc: "$biocrisis.210.desc.base$Giao chiến với kẻ thù là phương thức chinh phục của chúng ta. Chúng ta nên nắm lấy cơ hội để nâng cao khả năng chiến đấu của mình."
 biocrisis.225.a: "Chỉ cần có đủ năng lượng, không có rào chắn nào là không thể xuyên thủng."
 biocrisis.225.a.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_shield_pen_add|%0+$ $MOD_SHIP_SHIELD_PENETRATION_ADD$ và phí bảo trì hàng tháng £exotic_gases£ $@behemoth_shield_pen_upkeep|0*-$."
 biocrisis.225.b: "Dù lớp giáp có dày đến đâu, đạn của chúng ta vẫn có thể xuyên thủng."
 biocrisis.225.b.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_armor_pen_add|%0+$ $MOD_SHIP_ARMOR_PENETRATION_ADD$ và phí bảo trì hàng tháng £volatile_motes£ $@behemoth_armor_pen_upkeep|0*-$."
 biocrisis.225.c: "Những con cá nhỏ không đáng để bận tâm."
 biocrisis.225.c.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_tracking_add|0*+$ $MOD_SHIP_TRACKING_ADD$, $@behemoth_point_defense_weapon_fire_rate_mult|%0+$ $mod_weapon_type_point_defense_weapon_fire_rate_mult$ và phí bảo trì hàng tháng £rare_crystals£ $@behemoth_tracking_upkeep|0*-$."
 biocrisis.230.desc: "$biocrisis.210.desc.base$Trong những trận chiến khốc liệt, mỗi giây đều mang ý nghĩa sống còn. Sát thương mà chúng ta gây ra là một nghi thức tử thần, là khoảnh khắc cuối cùng mà kẻ thù trải qua trước khi sinh mệnh nhỏ bé của chúng vụt tắt."
 biocrisis.230.a: "Ghim chặt chúng lại. Chúng sẽ được nếm mùi sức mạnh hủy diệt của chúng ta."
 biocrisis.230.a.tt: "$behemoth_drain_tt$"
 biocrisis.230.b: "Tiêu diệt chúng từ xa."
 biocrisis.230.b.tt: "$behemoth_spike_tt$"
 biocrisis.230.c: "Sử dụng chiến lược để chia rẽ và tiêu diệt chúng."
 biocrisis.230.c.tt: "$behemoth_burst_tt$"
 biocrisis.235.desc: "$biocrisis.210.desc.base$Là một thế lực kiên định trong thiên hà, chúng ta sẽ được hưởng lợi rất nhiều từ việc tăng cường độ bền." #Chống Chịu 2
 biocrisis.235.a: "Tái tạo mô ban cho chúng ta sự trường thọ."
 biocrisis.235.a.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_2_hull_regen_add|%1+$ $MOD_SHIP_HULL_REGEN_ADD_PERC$."
 biocrisis.235.b: "Chúng ta sẽ không bao giờ đầu hàng."
 biocrisis.235.b.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_2_damage_reduction_mult|%1+$ $MOD_SHIP_DAMAGE_REDUCTION_MULT$."
 biocrisis.235.c: "Sức mạnh man rợ là con đường duy nhất."
 biocrisis.235.c.tt: "§Y$behemoth_04$§! của chúng ta nhận được $@behemoth_2_damage_reduction_static|1+$ $MOD_SHIP_DAMAGE_REDUCTION_ADD$, $@behemoth_2_armor_hardening_add|%0+$ $MOD_SHIP_ARMOR_HARDENING_ADD$ và $@behemoth_2_shield_hardening_add|%0+$ $MOD_SHIP_SHIELD_HARDENING_ADD$."
 biocrisis.240.desc: "$biocrisis.210.desc.base$Hậu duệ của chúng ta sẽ trào ra như một cơn sóng thủy triều, chúng ta sẽ tàn phá các hành tinh, cướp bóc mọi thứ có thể ăn được trong các hệ sao, và hầu hết những thứ tồn tại đều thuộc loại này. Chúng ta phải tự hỏi, làm thế nào để có thể hỗ trợ hậu duệ của mình một cách tốt nhất?" #Khả Năng Hỗ Trợ
 biocrisis.240.a: "Chúng ta nên làm cho chúng hành động nhanh nhẹn."
 biocrisis.240.a.tt: "$behemoth_buff_tt$"
 biocrisis.240.b: "Chúng sẽ tập hợp lại trong ánh sáng của chúng ta." #Triệu hồi một hạm đội
 biocrisis.240.b.tt: "$behemoth_summon_tt$"
 biocrisis.240.c: "Chúng ta sẽ giúp chúng trở nên mạnh mẽ." #Hồi máu cho các phi thuyền sinh học phe ta
 biocrisis.240.c.tt: "$behemoth_healing_tt$"
 biocrisis.245.desc: "$biocrisis.210.desc.base$Sức mạnh vô song của chúng ta phải được phô diễn cho tất cả các cư dân trong thiên hà thấy. Chúng ta sẽ nâng cao kỹ năng chiến đấu của mình thông qua bước tiếp theo của quá trình tiến hóa."
 biocrisis.245.a: "Chấp nhận cơn thịnh nộ nội tâm."
 biocrisis.245.a.tt: "Khi tham chiến, §Y$behemoth_04$§! của chúng ta sẽ nhận được §Y$behemoth_frenzy_modifier$§!, kéo dài £time£ §Y$@behemoth_frenzy_duration|0$ ngày§!.\n\n§Y$behemoth_frenzy_modifier$§!: $behemoth_frenzy_modifier_tt$"
 biocrisis.245.b: "Học cách kìm nén cơn thịnh nộ của chúng ta."
 biocrisis.245.b.tt: "§Y$behemoth_04$§! của chúng ta nhận được\n$t$$MOD_SHIP_FIRE_RATE_MULT$: §G+$@behemoth_tempered_fire_rate_mult|0%$§!\n$t$$MOD_SHIP_SPEED_MULT$: §G+$@behemoth_tempered_speed_mult|0%$§! \n$t$$MOD_SHIP_HULL_REGEN_ADD_PERC$: $@behemoth_tempered_hull_regen_add_perc|%1+$ \n$t$$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$: $@behemoth_tempered_armor_regen_add_static|0+$"
 biocrisis.245.c: "Điều hướng cơn thịnh nộ của chúng ta để khích lệ những người xung quanh."
 biocrisis.245.c.tt: "Khi tham chiến, §Y$behemoth_04$§! của chúng ta sẽ ban cho tất cả các phi thuyền sinh học phe ta trong hệ sao §Y$behemoth_inspiration_modifier$§!, kéo dài £time£ §Y$@behemoth_inspiration_duration|0$ ngày§!\n\n§Y$behemoth_inspiration_modifier$§!: $behemoth_inspiration_modifier_tt$"
 biocrisis.250.name: "Điều Khiển Trực Tiếp"
 biocrisis.250.desc: "$biocrisis.210.desc.base$Chúng ta có thể giải phóng những đợt sóng mảnh vụn nhiệt độ thấp và nhiệt độ cao mang tính hủy diệt, sức mạnh của chúng đủ để xé nát thực tại thành từng mảnh. Nói tóm lại, chúng ta đã nuôi cấy ra một loại vũ khí có thể xé rách cấu trúc cơ bản của thiên hà.\n\nNhưng thông báo của chúng ta không chỉ dừng lại ở sự hủy diệt. Chúng ta có thể cảm nhận được từng thớ cơ, từng nhịp đập của Behemoth, mỗi khối cơ khổng lồ đều khuất phục trước ý chí của chúng ta, hệt như chính cơ thể của chúng ta vậy. Chỉ cần một ý nghĩ, chúng ta đã có thể điều khiển được thân hình khổng lồ của nó: tứ chi của nó, cái miệng khổng lồ của nó, trái tim vũ trụ vĩ đại của nó đập theo ý muốn của chúng ta. Đây không chỉ là một cái bình chứa; ta chính là Behemoth." #Vũ Khí Tối Thượng Của Behemoth
 biocrisis.250.a: "Không gian giờ đây thuộc về chúng ta."
 biocrisis.250.a.tt: "§HLoại Bỏ Công Cụ Sửa Đổi:§!\n§R$voidspawn_boss_invincible$§!\n$mod_damage_vs_country_type_voidspawn_boss_mult$ §R-1954%§!\n\n$behemoth_superweapon_tt$\n\n"
