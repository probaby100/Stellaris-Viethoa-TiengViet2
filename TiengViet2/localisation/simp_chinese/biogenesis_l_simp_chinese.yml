 death_world: "Hành Tinh Tử Thần"
 death_world_desc: "Dù trên lý thuyết thì hành tinh này hoàn toàn có thể sinh sống được, nhưng thực tế việc định cư ở đây chẳng khác nào một cơn ác mộng. Bất kỳ loài sinh vật hoang dã bản địa nào, dù là động vật hay thực vật, thậm chí là một sinh vật nhỏ bé không đáng chú ý, trên thực tế đều nguy hiểm chết người hơn cả những loài thú săn mồi đáng sợ nhất trên thế giới quê hương của chúng ta."
 d_lethal_ecosphere_blocker: "£blocker£ Sinh Quyển Chết Người"
 d_lethal_ecosphere_blocker_desc: "Những vật mẫu và tiêu bản bị bỏ lại từ những mảnh vỡ của chiến tranh không ngừng tham gia vào quá trình chọn lọc phi tự nhiên đẫm máu. Sân tập luyện cực kỳ nguy hiểm này rõ ràng là chí mạng đối với hầu hết các binh sĩ, nhưng những kẻ may mắn sống sót chắc chắn sẽ lột xác thành những cỗ máy giết người máu lạnh."
