 pop_effects_from_purity_header: "Hiệu ứng của ['concept_genetic_purity'] lên £pop£dân số:"
 leaders_gain_genetic_purity_trait: "£leader£Lãnh đạo hữu cơ nhận được đặc điểm §Y$trait_leader_genetic_purist$§!"
 genetic_purist_effects_header: "Hiệu ứng của ['concept_genetic_purity'] lên £leader£§Y$trait_leader_genetic_purist$§!:"
 authority_grants_genetic_purist_tt: "$leaders_gain_genetic_purity_trait$$NEW_LINE$$genetic_purist_effects_header$"
 concept_genetic_purity: "Sự hoàn hảo về gen của loài"
 concept_genetic_purity_desc: "Các chính phủ đã áp dụng ['tradition_category:tradition_purity'] sẽ áp dụng các hiệu ứng và sửa đổi tỷ lệ thuận lên £pop£§Hdân số hữu cơ§! và £leader£§Hlãnh đạo§!.$TABBED_NEW_LINE$—Tăng lên cùng với số điểm đặc điểm được sử dụng cho các đặc điểm §Ycó lợi§! của loài.$TABBED_NEW_LINE$—Giảm xuống cùng với số điểm đặc điểm được sử dụng cho các đặc điểm §Rbất lợi§! của loài."
 trait_leader_genetic_purist: "Người theo chủ nghĩa thuần khiết di truyền"
 trait_leader_genetic_purist_desc: "Công việc của nhà lãnh đạo này được hướng dẫn bởi một quan điểm không thể lay chuyển về sự thuần khiết di truyền, không dung thứ cho bất kỳ sự không hoàn hảo nào."
 auth_bio_democratic_purity: "Quyền tự trị kiểu hình"
 auth_bio_democratic_purity_tt: "$pop_effects_from_purity_header$$TABBED_NEW_LINE$—£mod_pop_happiness£$MOD_POP_HAPPINESS$: $plus_minus_icon$§Y$@purity_traits_happiness|1%$§!$DOUBLE_NEW_LINE$$authority_grants_genetic_purist_tt$$TABBED_NEW_LINE$—$mod_leaders_upkeep_mult$$minus_plus_icon$§Y2.5%§!$TABBED_NEW_LINE$—$MOD_LEADER_SPECIES_EXP_GAIN$$plus_minus_icon$§Y2.5%§!"
 auth_bio_democratic_purity_desc: "Quyền tự quyết về cơ thể là một quyền lợi. Nhà nước trao quyền cho các cá nhân sửa đổi cơ thể theo ý muốn của họ. Cơ thể là bức tranh vẽ cuối cùng, giới hạn duy nhất là trí tưởng tượng."
 auth_bio_oligarchic_purity: "Hệ thống cấp bậc ưu sinh"
 auth_bio_oligarchic_purity_tt: "$eugenic_political_power_effects$"
 auth_bio_oligarchic_purity_desc: "Quyền lực tuyệt đối phải được giao phó cho những người tinh hoa đã được định sẵn về mặt di truyền, họ là những công bộc thuần khiết nhất, có năng lực nhất đối với vận mệnh của nền văn minh này. Dưới quyền họ, mọi công dân đều đảm nhận một vị trí được thiết kế riêng cho tiềm năng di truyền của họ. Chỉ có ý nghĩa cuộc sống được định sẵn của mỗi người mới có thể mang lại sự thỏa mãn, chứ không phải tham vọng."
 eugenic_political_power_effects: "$pop_effects_from_purity_header$$TABBED_NEW_LINE$—$MOD_POP_BONUS_WORKFORCE_MULT$: $plus_minus_icon$§Y$@purity_traits_bonus_workforce_mult|2%$§!$DOUBLE_NEW_LINE$$authority_grants_genetic_purist_tt$$TABBED_NEW_LINE$—$MOD_COUNCIL_AGENDA_PROGRESS_SPEED$: $plus_minus_icon$§Y$@purity_traits_council_speed|Y1%$§!"
 auth_bio_dictatorial_purity: "Hệ thống tư pháp axit nucleic"
 auth_bio_dictatorial_purity_tt: "$pop_effects_from_purity_header$$TABBED_NEW_LINE$Mỗi $pop_group_unit$£pop£dân số tạo ra £society£Nghiên cứu Xã hội học: $plus_minus_icon$§Y$@purity_traits_resource$§!$DOUBLE_NEW_LINE$$authority_grants_genetic_purist_tt$$TABBED_NEW_LINE$—$MOD_PLANET_CRIME_ADD$ của hành tinh: $minus_plus_icon$§Y5.0§!$TABBED_NEW_LINE$—$MOD_PLANET_CRIME_ADD$ của phân khu: $minus_plus_icon$§Y2.5§!$TABBED_NEW_LINE$—$MOD_PLANET_STABILITY_ADD$ của hành tinh: $plus_minus_icon$§Y5.0§!$TABBED_NEW_LINE$—$MOD_PLANET_STABILITY_ADD$ của phân khu: $plus_minus_icon$§Y2.5§!"
 auth_bio_dictatorial_purity_desc: "Chính phủ này sử dụng dữ liệu di truyền và sinh trắc học như một công cụ tư pháp phủ đầu, xem xét cẩn thận mã di truyền của mọi công dân để tìm kiếm khuynh hướng phạm tội. Bằng cách can thiệp trước khi các hành vi vi phạm xảy ra, sự giám sát tỉ mỉ này đảm bảo trật tự. Công lý thực sự không phải là chờ đợi thụ động, mà là chuẩn bị trước, và chỉ bằng cách loại bỏ tội phạm tận gốc rễ thì mới có thể bảo vệ xã hội."
 auth_bio_imperial_purity: "Lãnh địa sinh học"
 auth_bio_imperial_purity_tt: "Hiệu ứng của ['concept_genetic_purity'] lên £leader£§Y$imperial_ruler$§! và §YNgười thừa kế§!:$TABBED_NEW_LINE$—$MOD_LEADER_SKILL_ADD$: $plus_minus_icon$§Y$@purity_traits_imperial_level|2$§!$DOUBLE_NEW_LINE$£leader£Lãnh đạo của chúng ta có §Ycùng loài với [Ruler.GetTitle]§! nhận được đặc điểm §Y$imperial_bloodline$§!\n£leader£Hiệu ứng của ['concept_genetic_purity'] lên §YDòng máu Đế quốc§!:$TABBED_NEW_LINE$—$MOD_LEADER_LIFESPAN_MULT$: $plus_minus_icon$§Y$@purity_traits_imperial_bloodline|1%$§!$TABBED_NEW_LINE$—$MOD_LEADER_SPECIES_EXP_GAIN$: $plus_minus_icon$§Y$@purity_traits_imperial_bloodline|1%$§!"
 auth_bio_imperial_purity_desc: "Là những người bảo vệ sự xuất sắc về mặt di truyền, chế độ này đã kéo dài tuổi thọ của các nhà lãnh đạo trong khi không mệt mỏi theo đuổi sự hoàn hảo của cuộc sống. Sự thịnh vượng của xã hội bắt nguồn từ việc bảo tồn và nhân giống những gen tốt nhất, mở ra một tương lai tối cao. Việc quản lý nghiêm ngặt vốn gen đảm bảo tốc độ tiến bộ, với sự trường sinh và hoàn hảo là món quà cuối cùng."
 auth_bio_corporate_purity: "Tập đoàn Nội tạng"
 auth_bio_corporate_purity_tt: "$organic_leaders_have_trade_upkeep$\n\n$pop_effects_from_purity_header$$TABBED_NEW_LINE$—Mỗi $pop_group_unit$£pop£dân số tạo ra $r_trade$Giá trị thương mại: $plus_minus_icon$§Y$@purity_traits_resource$§!$DOUBLE_NEW_LINE$"
 auth_bio_corporate_purity_desc: "Siêu tập đoàn này đã đẩy việc thương mại hóa cuộc sống đến mức tối đa, nuôi cấy nội tạng vì mục đích lợi nhuận. Nội tạng cao cấp có thể bán được giá trên trời trên thị trường, trong khi \"tài sản dư thừa\" thường chảy vào chợ đen. Các nhà môi giới bí ẩn và bác sĩ phẫu thuật ngầm phát triển mạnh mẽ, phục vụ những người mua khao khát và đảm bảo mọi tài sản đều được sử dụng hết."
 # Nhân bản
 auth_bio_democratic_cloning: "Đa nguyên hài hòa"
 auth_bio_democratic_cloning_tt: "$ENABLES_BACKUP_CLONES$\nChi phí duy trì §Y$leader_trait_backup_clone_default$§!: §G$@cordant_multiplicity_clone_upkeep|0%$§!\n§Y$leader_trait_backup_clone_default_plural$§! phải chịu sự ['concept_clone_leader_degradation', Xuống cấp] và không thể có §Y$leader_trait_has_backup_clone_plural$§!"
 auth_bio_democratic_cloning_desc: "Chế độ này coi công nghệ nhân bản là minh chứng cho sự bình đẳng và tiến bộ. Các bản sao đứng cạnh những người sinh ra tự nhiên, giọng nói của họ đều được coi trọng như nhau. Ý chí chung được làm phong phú thêm nhờ sự đa dạng của mọi quan điểm, cho dù họ có phải là bản sao hay không."
 auth_bio_oligarchic_cloning: "Nhiếp chính sao chép"
 auth_bio_oligarchic_cloning_tt: "$ENABLES_BACKUP_CLONES$\nĐặc điểm §Y$leader_trait_has_backup_clone$§! cung cấp thêm hiệu ứng cho các quan chức hội đồng\n§Y$leader_trait_backup_clone_default_plural$§! phải chịu sự ['concept_clone_leader_degradation', Xuống cấp] trong thời gian phục vụ trong hội đồng.\n"
 auth_bio_oligarchic_cloning_desc: "Xã hội này đảm bảo sự thống trị vĩnh viễn của tầng lớp tinh hoa bằng cách neo giữ quyền lực trong dòng máu bất tử của những bản sao ưu tú. Công nghệ nhân bản không chỉ bảo tồn di sản di truyền của họ mà còn hoàn thiện nó, cho phép lãnh đạo liên tục. Mỗi vị trí quan trọng đều do một phiên bản cải tiến của cùng một dòng máu cao quý nắm giữ, củng cố sự cai trị của họ qua nhiều thế hệ."
 auth_bio_dictatorial_cloning: "Phục tùng đồng nhất"
 auth_bio_dictatorial_cloning_tt: "$ENABLES_BACKUP_CLONES$\n$AVAILABLE_POLICIES$§Y$policy_homogenous_class$§!"
 auth_bio_dictatorial_cloning_desc: "Lòng trung thành tuyệt đối được đảm bảo thông qua sàng lọc di truyền nghiêm ngặt, chỉ những cá nhân có tính phục tùng bẩm sinh mạnh mẽ mới được chọn làm nguồn nhân bản. Điều này tạo ra một xã hội tự duy trì, nơi sự nổi loạn không chỉ là không thể mà còn hoàn toàn không khả thi về mặt sinh học, đảm bảo sự hài hòa vĩnh viễn thông qua chính thiết kế cấu trúc di truyền của công dân."
 auth_bio_imperial_cloning: "Kế vị cha truyền con nối"
 auth_bio_imperial_cloning_tt: "$ENABLES_BACKUP_CLONES$\nHiệu ứng hình phạt của đặc điểm §Y$leader_trait_backup_clone_imperial$§! sẽ không tăng"
 auth_bio_imperial_cloning_desc: "Quyền uy thiêng liêng không thể chối cãi của nhà trị vì được duy trì thông qua việc nhân bản, mỗi thế hệ của vị vua vĩ đại đều thừa hưởng trí tuệ và vinh quang của thế hệ trước. Sự tiếp nối liền mạch của giới lãnh đạo này đảm bảo sự tiến bộ vĩnh viễn của xã hội, duy trì một thời kỳ hoàng kim vĩnh cửu dưới sự cai trị sáng suốt của họ."
 auth_bio_corporate_cloning: "Hiệp hội sao chép"
 auth_bio_corporate_cloning_tt: "$organic_leaders_have_trade_upkeep$\n$ENABLES_BACKUP_CLONES$\n£building£['building:building_clone_vats'] tạo ra $mod_planet_jobs_trade_produces_mult$: §G+$@replicatory_association_trade_mult|0%$§!\n£building£§Y$building_clone_vats$§! tạo ra £mod_planet_amenities_add£Tiện nghi hành tinh: §G+$@replicatory_association_amenities_add|0$§!\n$AVAILABLE_POLICIES$§Y$policy_replicatory_association_insurance$§!"
 auth_bio_corporate_cloning_desc: "Sự tiện lợi và thoải mái vô song luôn trong tầm tay. Chuẩn bị một bản sao cho chính bạn trong trường hợp khẩn cấp, hoặc tùy chỉnh một bản sao cho người thân đã qua đời. Siêu tập đoàn này hứa hẹn độ chính xác lên đến 93% cho mỗi lần sao chép, kết hợp hoàn hảo công nghệ tiên tiến với sự an ủi của việc sao chép chính xác."
 AUTHORITY_HAS_CLONE: "$t$Khi §YNhà trị vì qua đời§!, một §Y$leader_trait_backup_clone_imperial$§! sẽ trở thành Nhà trị vì mới.$TABBED_NEW_LINE$['concept_clone_leader_degradation', Sự xuống cấp] của §H$leader_trait_backup_clone_imperial_plural$§! giảm xuống."
 policy_replicatory_association_insurance: "Bảo hiểm bản sao"
 policy_replicatory_association_insurance_desc: "Là một phần của gói thù lao, các thành viên hội đồng quản trị và những nhân sự chủ chốt được lựa chọn khác sẽ được ưu tiên tiếp cận dịch vụ nhân bản."
