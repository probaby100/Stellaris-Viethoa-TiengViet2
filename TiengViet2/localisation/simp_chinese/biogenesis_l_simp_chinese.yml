 incubating_behemoth_modifier_desc: "Một quá trình lột xác vĩ đại đang diễn ra."
 voidspawn_boss_invincible: "Vua Thú Bất Khuất"
 voidspawn_boss_invincible_desc: "Tương truyền rằng, Voidspawn trưởng thành chưa từng nếm mùi thất bại. Cách hiệu quả nhất để ngăn cản nó là nhắm vào con mồi của nó."
