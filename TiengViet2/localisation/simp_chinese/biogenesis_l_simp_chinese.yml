 RT_INCOMPLETE_OVERMIND: "Tâm Trí Chủ Chốt Khuyết Thiếu"
 gov_war_splinter: "Phân Nhánh Chiến Tranh"
 gov_war_splinter_desc: "Bản năng hiếu chiến này từng là một trong vô vàn những xung động ý thức bên trong tổ ấm. Giờ đây, nó đang mưu đồ thiết lập quyền thống trị lên các phân nhánh khác, nhưng đồng thời cũng phải oằn mình chống chọi với những cuộc nội chiến diễn ra ngay trong nội bộ của chính mình."
 gov_growth_splinter: "Phân Nhánh Tăng Trưởng"
 gov_growth_splinter_desc: "Đây là dục vọng tiến hóa và khao khát thay đổi của một tổ ấm đã sụp đổ. Phân nhánh này tập trung toàn lực vào việc tự đổi mới không ngừng, đến mức chẳng màng để tâm đến việc khôi phục quyền kiểm soát đối với các phân nhánh khác."
 gov_control_splinter: "Phân Nhánh Kiểm Soát"
 gov_control_splinter_desc: "Một sự ám ảnh mãnh liệt về việc kìm hãm sự bất thường và thúc đẩy sự thống nhất đã chi phối hoàn toàn phân nhánh này. Nó khao khát đến cháy bỏng việc thao túng các mảnh vỡ khác, nhưng sự hỗn loạn tất yếu của vũ trụ chúng ta khiến nó luôn bị xao nhãng."
 gov_fused_ascendancy: "Sự Thăng Thiên Hợp Nhất"
 gov_fused_ascendancy_desc: "Gương vỡ lại lành, những vết thương chia cắt không trở thành điểm yếu của Đế Chế Thức Tỉnh này, mà ngược lại, đã ban cho chúng một sinh khí mới tràn đầy mạnh mẽ. Ý thức bầy đàn của quá khứ đã bị chôn vùi vào dĩ vãng, ý thức bầy đàn của hiện tại sẽ ngự trị sự vĩnh hằng."
 civic_fragmented_command: "Mệnh Lệnh Chắp Vá"
 civic_fragmented_command_desc: "Đế Chế Thức Tỉnh này chỉ là phần nổi của tảng băng trôi so với tổng thể vĩ đại trong quá khứ, chúng đang khuyết thiếu những mảnh ghép cốt lõi cần thiết để cai trị một đế chế vươn tầm giữa các vì sao."
 civic_hyper_aggressive_drones: "Ong Thợ Siêu Hung Hãn"
 civic_hyper_aggressive_drones_desc: "Lũ ong thợ của Đế Chế Thức Tỉnh này cứ mãi lao vào những cuộc tàn sát lẫn nhau không hồi kết, dẫn đến sự thiếu hụt tài nguyên trầm trọng."
 civic_unstable_drones: "Ong Thợ Bất Ổn"
 civic_unstable_drones_desc: "Lũ ong thợ của Đế Chế Thức Tỉnh này đang bị ép buộc phải tiến hóa liên tục. Chúng gần như chẳng có lấy một bộ phận cơ thể nào phù hợp để thực hiện công việc được giao phó."
 civic_stunted_drones: "Ong Thợ Thiếu Tự Chủ"
 civic_stunted_drones_desc: "Lũ ong thợ của Đế Chế Thức Tỉnh này bị kiểm soát gắt gao đến từng chi tiết nhỏ nhất, thậm chí dù xưởng có bốc cháy thì cũng không một yếu tố nào có thể khiến chúng rời mắt khỏi nhiệm vụ hiện tại dù chỉ là một khoảnh khắc."
 civic_restored_mind: "Tâm Trí Phục Hồi"
 civic_restored_mind_desc: "Một ý thức cổ xưa cuối cùng đã được hàn gắn trọn vẹn, giờ đây đang được dẫn dắt bởi những trực giác hiện đại nhất."
 civic_ancient_memories_of_war: "Ký Ức Chiến Tranh Cổ Đại"
 civic_ancient_memories_of_war_desc: "Đế Chế Thức Tỉnh này đang hồi sinh những trận pháp cổ xưa đã chìm vào quên lãng trở lại với vũ đài ngân hà. Hạm đội của chúng sẽ nhấn chìm vô vàn vì sao."
 civic_ancient_memories_of_growth: "Ký Ức Tăng Trưởng Cổ Đại"
 civic_ancient_memories_of_growth_desc: "Đế Chế Thức Tỉnh này đang ứng dụng những con đường thăng thiên và sự phồn vinh đã thất truyền từ lâu. Số lượng cá thể con của chúng còn nhiều hơn cả những vì sao trên bầu trời."
 civic_ancient_memories_of_control: "Ký Ức Kiểm Soát Cổ Đại"
 civic_ancient_memories_of_control_desc: "Đế Chế Thức Tỉnh này một lần nữa áp dụng những thể chế quyền lực đã rơi vào dĩ vãng. Quyền lực của chúng sẽ vươn dài tới vô số các vì sao."
