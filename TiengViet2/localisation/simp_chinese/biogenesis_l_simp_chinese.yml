 #Chuỗi Sự Kiện Cuộc Vây Hãm Thành Trì
 bio.2005.name: "Sự Dao Động Bất Thường"
 bio.2005.desc: "Các $job_skywatcher_plural$ vừa báo cáo một diễn biến đáng lo ngại.\n\nGần đây, một sự dao động cực kỳ yếu ớt nhưng rõ ràng đã được phát hiện từ cánh cổng dịch chuyển ở §Y[Root.Capital.System.GetName]§!. Trong quá khứ, những nhiễu loạn tương tự luôn là điềm báo cho một làn sóng tấn công ồ ạt từ các phi thuyền sinh học của kẻ thù.\n\nNếu dữ liệu này chính xác, chúng ta có thể khẳng định đợt tấn công tiếp theo sẽ ập đến trong vòng vài tháng tới. Một lần nữa, sinh mệnh của người dân lại được trao trọn vào tay những người bảo vệ của chúng ta."
 abandoned_hatchery_chain_1: "Kẻ Địch Đã Đến Cửa"
 abandoned_hatchery_chain_1_title: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_1_desc: "Lũ [GetInvadersLower] đã liên tục tấn công chúng ta trong suốt nhiều thập kỷ qua. $starbase_deep_space_citadel_1$ của chúng ta là phòng tuyến đầu tiên, nhưng chỉ khi giải mã được bí ẩn về những kẻ thù này thì chúng ta mới thực sự có được sự an toàn.\n\nMỗi một khám phá sẽ đưa chúng ta tiến gần hơn đến mục tiêu cuối cùng, rồi một ngày nào đó chúng ta sẽ có thể phát động một cuộc phản công, chấm dứt cuộc bao vây dai dẳng này."
 bio.2015.name: "Xác Chết Kẻ Thù"
 bio.2015.desc: "Tàn tích của hạm đội sinh học mà chúng ta vừa tiêu diệt đang trôi dạt một cách rùng rợn trong §Y[Root.Capital.System.GetName]§!. Mặc dù chúng gần như đã bị thiêu rụi thành những cục than đen thui biến dạng, nhưng phần lớn chất hữu cơ vẫn còn nguyên vẹn, mang đến một cơ hội nghiên cứu vô giá.\n\nThông qua phân tích kỹ lưỡng, có lẽ chúng ta sẽ hé mở được những bí ẩn về cấu trúc kỳ lạ của chúng - và biết đâu, chúng ta còn tìm hiểu thêm được về cánh cổng dịch chuyển bí ẩn nơi chúng xuất hiện."
 PROJECT_HATCHERY_SHIP_REMAINS: "Nghiên Cứu Tàn Tích Phi Thuyền Sinh Học"
 PROJECT_HATCHERY_SHIP_REMAINS_DESC: "Những tàn tích còn sót lại từ hạm đội của lũ [GetInvadersLower] mang đến một cơ hội nghiên cứu hiếm có. Chúng ta có thể học hỏi được rất nhiều điều hữu ích cho việc sinh tồn."
 bio.2015.a: "Cuối cùng cũng có bước đột phá."
 bio.2020.name: "Phân Tích Kẻ Thù Hoàn Tất"
 bio.2020.desc: "Sau quá trình nghiên cứu miệt mài những tàn tích còn lại trong §Y[Root.Capital.System.GetName]§!, các [Root.GetScientistPlural] của chúng ta tin rằng họ đã tìm ra chiếc chìa khóa để giải mã cánh cổng dịch chuyển sừng sững ở rìa hệ sao của chúng ta.\n\nNằm sâu bên trong cơ thể của những sinh vật này, họ phát hiện ra một loại mô hữu cơ - dường như cộng hưởng với những dao động của cánh cổng dịch chuyển. Bằng cách đảo ngược kỹ thuật thiết kế dựa trên tần số đó, chúng ta có thể tự mình đi qua vết nứt bí ẩn này.\n\nHiện tại vẫn cần tiến hành thêm các nghiên cứu, nhưng cơ hội để chúng ta phản công đang đến gần hơn bao giờ hết."
 abandoned_hatchery_chain_2: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_2_title: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_2_desc: "Chúng ta lại tiến thêm một bước trong việc làm sáng tỏ bí ẩn về cánh cổng dịch chuyển. Dù vẫn chưa thể đi qua nó, nhưng giờ đây chúng ta đã có được những hiểu biết cần thiết để phát triển công nghệ thiết yếu.\n\nĐể có thể phản kháng lại những kẻ thù này, chúng ta cần phải có §Y$tech_wormhole_stabilization$§!."
 bio.2025.name: "Sào Huyệt Của Kẻ Thù"
 bio.2025.desc: "Nhờ vào những bước đột phá gần đây trong lĩnh vực §Y$tech_wormhole_stabilization$§!, giờ đây chúng ta đã có thể nhìn thoáng qua hệ sao §Y[event_target:starlit_sealed_system.GetName]§!.\n\nMột hạm đội sinh học hung hãn cùng một căn cứ sao được trang bị phòng thủ kiên cố đang chờ đón chúng ta ở đầu bên kia. Khuyến cáo nên hành động vô cùng cẩn trọng.\n\nChúng ta đã tìm thấy sào huyệt của kẻ thù."
 abandoned_hatchery_chain_3: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_3_title: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_3_desc: "Chúng ta đã phát hiện ra sào huyệt của kẻ thù, nhưng để phơi bày những bí mật của chúng, chúng ta sẽ phải đối mặt trực diện với hàng phòng thủ của chúng.\n\nĐây sẽ là một trận chiến vô cùng khốc liệt, nhưng sau khi giành chiến thắng, chúng ta sẽ có thể khám phá hệ sao §Y[event_target:starlit_sealed_system.GetName]§!."
 bio.2027.name: "Bình Minh Của Sự Sợ Hãi"
 bio.2027.desc: "Hạm đội cố thủ tại §Y[starlit_sealed_system.GetName]§! đã bị tiêu diệt. Ngay trước thời khắc kết thúc, chúng ta đã thu được một tín hiệu yếu ớt phát ra từ căn cứ sao của hệ sao, và hiện tại chúng ta mới chỉ dịch được một thông điệp duy nhất:\n\n§H\"—Mất liên lạc toàn bộ! Đây là những phi thuyền do chính chúng tự sản xuất! Dù các người là ai, xin hãy cứu lấy chúng tôi!\"§!\n\nNgay sau đó, mọi liên lạc đều bị cắt đứt. Nếu đây thực sự là một chiến thắng, thì khu vực tập kết của kẻ thù đã bị chúng ta giáng một đòn chiến lược chí mạng. Có lẽ, nếu có một $starbase_deep_space_citadel_1$ tắm mình trong ánh sáng của §Y[starlit_sealed_system.GetName]§!, thì sẽ không bao giờ có những kẻ thù như vậy đe dọa đến nền văn minh của chúng ta nữa."
 bio.2027.a: "Cuối cùng thì cuộc vây hãm cũng đã kết thúc."
 citadel_siege_lifted: "Cuộc Vây Hãm Đã Kết Thúc"
 citadel_siege_lifted_desc: "Những người bảo vệ quả cảm của chúng ta đã đánh bại lũ [GetInvadersLower]; cuộc vây hãm dai dẳng mà chúng ta phải chịu đựng cuối cùng cũng đã kết thúc."
 citadel_siege_lifted_machine: "$citadel_siege_lifted$"
 citadel_siege_lifted_machine_desc: "$citadel_siege_lifted_desc$"
 abandoned_hatchery_chain_4: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_4_title: "$abandoned_hatchery_chain_1$"
 abandoned_hatchery_chain_4_desc: "Lũ [GetInvadersLower] bên trong hệ sao §Y[starlit_sealed_system.GetName]§! đã bị quét sạch, nhưng tình hình ở đây lại hoàn toàn khác xa so với những gì chúng ta dự tính.\n\nNhững kẻ thù từng tàn phá vùng đất của chúng ta giờ đây chỉ còn lại một hành tinh tàn tạ."
 PROJECT_BIOMECHANICAL_WORLD: "Cội Nguồn Của Kẻ Thù Cũ"
 PROJECT_BIOMECHANICAL_WORLD_DESC: "Hệ sao quê hương của lũ [GetInvadersLower]; chúng là ai? Rốt cuộc chúng có mưu đồ gì với chúng ta?"
 bio.2030.name: "Dịch Bệnh Sinh Cơ Học"
 bio.2030.desc: "§Y[event_target:biomechanical_world_target.GetName]§! giống như một nghĩa địa lộ thiên.\n\nGiống loài thống trị trên hành tinh này đã hoàn toàn bị tàn phá bởi một dạng sống hung hãn kỳ lạ. Những cuộc điều tra sâu hơn cho thấy, chúng không phải là sinh vật hữu cơ tự nhiên, mà là một dạng máy móc sinh học, và chúng không được chế tạo, mà được \"nuôi cấy\" ra.\n\nChẳng lẽ những kẻ thiết kế ra những sinh vật này đã bị chính những tạo vật của mình quay lưng cắn trả? Liệu có phải những kẻ thù của chúng ta hoàn toàn không ý thức được hành động của chúng, hay thậm chí còn chẳng hề biết đến sự tồn tại của chúng ta?\n\nChỉ có một điều chắc chắn: Dù họ đã áp dụng bất kỳ biện pháp nào để kiểm soát dịch bệnh này, nó cũng đã dẫn đến sự hủy diệt của chính họ, cũng như những thứ quái thai tự động mà họ tạo ra."
 bio.2030.a: "Vậy ra chúng ta không phải là những nạn nhân duy nhất..."
 smarter_hatchery: "Hạm Đội Cải Tiến"
 smarter_hatchery_desc: "Chúng đang học hỏi... đang thích nghi... chúng sắp ập đến rồi."
 bio.2030.tt: "\n§EMở khóa Ghế Nội Các:§!\n§H$t$$councilor_warden_of_the_citadel$§!\n$tt$$COUNCIL_POSITION_MODIFIER_BASE$\n$ttt$$MOD_SHIP_FRIENDLY_TERRITORY_ARMOR_MULT$: §G+1%§!\n$ttt$$mod_shipsize_starbase_deep_space_citadel_1_hull_mult$: §G+2%§!\n$ttt$$mod_starbases_upkeep_mult$: §G-5%§!\n$COUNCIL_POSITION_AVAILABLE_FOR$$t$$commander_with_icon$"
 councilor_warden_of_the_citadel: "Người Bảo Vệ Thánh Trì"
 councilor_warden_of_the_citadel_desc: "$TITLE$ là người bảo vệ kiên định của chúng ta, gánh vác trọng trách củng cố phòng thủ, giám sát các công tác chuẩn bị quân sự và đảm bảo nền văn minh của chúng ta luôn đứng vững trước mọi mối đe dọa."
 mod_shipsize_starbase_deep_space_citadel_1_hull_mult: "Lượng máu $HITPOINTS$ của $starbase_deep_space_citadel_1$"
 mod_shipsize_starbase_deep_space_citadel_2_hull_mult: "Lượng máu $HITPOINTS$ của $starbase_deep_space_citadel_2$"
 mod_shipsize_starbase_deep_space_citadel_3_hull_mult: "Lượng máu $HITPOINTS$ của $starbase_deep_space_citadel_3$"
 siege_node: "Nút Thắt Vây Hãm"
 siege_node_desc: "Chúng ta đã học hỏi. Chúng ta đã thích nghi. Tuyến phòng thủ của chúng ta sẽ không bao giờ sụp đổ."
 bio.2036.name: "Chúng Đang Học Hỏi"
 bio.2036.desc: "Trong quá trình quan sát các cuộc tấn công của phi thuyền sinh học, chúng ta đã phát hiện ra một xu hướng vô cùng đáng lo ngại. Mỗi một đợt tấn công đều thể hiện mức độ phối hợp cao hơn, các chiến thuật thích ứng linh hoạt hơn và sự thăm dò có hệ thống hơn vào hệ thống phòng thủ của chúng ta. Nhật ký cảm biến đã ghi nhận những thay đổi về tín hiệu năng lượng và sự điều chỉnh về mức độ ưu tiên tấn công, đây chính là những bằng chứng cho thấy sự tiến hóa trong chiến lược của chúng.\n\nNhững sinh vật này, bất kể là do bản năng hay trí tuệ bầy đàn, đang ngày càng trở nên đáng sợ hơn. Nếu tình trạng này tiếp diễn, đợt tấn công tiếp theo sẽ càng khó chống đỡ hơn."
 bio.2036.a: "Hãy cầu nguyện cho quân phòng thủ."
 bio.2036.b: "Tăng cường sức mạnh cho quân phòng thủ."
 bio.2036.tt: "Với mỗi đợt tấn công tiếp theo, sức mạnh của các hạm đội tiến đến thông qua §Y$STARLIT_WORMHOLE_GALACTIC$§! sẽ ngày một gia tăng."
 bio.2040.name: "Kẻ Thù Gục Ngã"
 bio.2040.desc: "Dữ liệu từ xa được thu thập từ đầu bên kia của cổng dịch chuyển đã tiết lộ một diễn biến quan trọng tại §Y[event_target:starlit_sealed_system.GetName]§!: Cả các phi thuyền sinh học lẫn lò ấp của chúng đều đã bị một thế lực bí ẩn phá hủy hoàn toàn.\n\nMặc dù việc lũ [GetInvadersLower] bị diệt vong mang lại niềm vui khôn xiết, nhưng chúng ta cũng không thể phớt lờ nguy cơ một thế lực khác có thể thâu tóm hệ sao [event_target:starlit_sealed_system.GetName] vào một ngày nào đó.\n\nChúng ta cần phải đẩy nhanh tiến độ để đảm bảo rằng vị trí chiến lược này không rơi vào tay của một kẻ thù khác."
 bio.2040.a: "Là bạn... hay là thù?"
