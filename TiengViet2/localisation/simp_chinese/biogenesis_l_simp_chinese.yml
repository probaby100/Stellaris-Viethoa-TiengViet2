 ### CÁC QUAN ĐIỂM QUỐC GIA MỚI ###
 civic_genetic_identification: "Nhận Diện Di Truyền"
 civic_genetic_identification_desc: "Xã hội này quy định mọi công dân phải được lưu trữ thông tin vào kho dữ liệu gen ngay từ khi sinh ra, và dữ liệu này sẽ được áp dụng trong mọi cấp bậc quản lý hành chính."
 civic_corporate_genetic_identification: "Bảo Mật Trình Tự Gen"
 civic_corporate_genetic_identification_desc: "Trình tự gen của từng khách hàng và nhân viên đều được lưu trữ trong một cơ sở dữ liệu thu phí và cho phép công chúng truy cập. Các cơ quan thực thi pháp luật phụ thuộc rất nhiều vào dịch vụ này, họ có thể nhận diện bọn tội phạm chỉ từ những manh mối nhỏ nhoi nhất."
 civic_corporate_genetic_identification_effects: "—£building£ §Y$building_private_security$§! $megacorp_civic_branch_office_building_effect$"
 councilor_genetic_identification: "Quản Lý Kho Dữ Liệu Gen"
 councilor_genetic_identification_desc: "$TITLE$ chịu trách nhiệm duy trì và bảo vệ cơ sở dữ liệu gen, nhằm đảm bảo hệ thống quan liêu hoạt động trơn tru và hiệu quả."
 councilor_corporate_genetic_identification: "Môi Giới Trình Tự Gen"
 councilor_corporate_genetic_identification_desc: "$TITLE$ phụ trách đánh giá các yêu cầu truy cập và kế hoạch thương mại hóa, có khả năng tra cứu thông tin nhận diện gen của bất kỳ cá nhân nào được yêu cầu."
 civic_crowdsourcing: "Cộng Đồng Sáng Tạo"
 civic_crowdsourcing_desc: "Xã hội này nhận thức được rằng nguồn cảm hứng cá nhân mới chính là cội nguồn đích thực của sự sáng tạo. Bằng sáng chế mã nguồn mở, tư duy cởi mở, tinh thần hợp tác tự nguyện và những phần thưởng cho sự đổi mới đã dọn đường cho những bước tiến xa hơn."
 civic_crowdsourcing_effects: "$t$—Phe phái sẽ tạo ra $r_research$ thay vì $r_unity$$TABBED_NEW_LINE$—Phe phái sẽ xuất hiện trong đế chế ngay sau khi trò chơi bắt đầu một thời gian ngắn"
 civic_corporate_crowdsourcing: "Nghiên Cứu Và Phát Triển Phân Tán"
 civic_corporate_crowdsourcing_desc: "Những cuộc thi sáng tạo định kỳ giữa các bộ phận đóng vai trò như một chất xúc tác, thúc đẩy mạnh mẽ các sáng kiến R&D của doanh nghiệp này."
 civic_corporate_crowdsourcing_effects: "$civic_crowdsourcing_effects$$TABBED_NEW_LINE$—£building£ §Y$building_private_research_initiative$§! $megacorp_civic_branch_office_building_effect$"
 civic_tooltip_not_crowdsourcing: "Không thuộc nhóm Quan Điểm Quốc Gia ['concept_crowdsourcing_civics']"
 concept_crowdsourcing_civics: "Cộng Đồng Sáng Tạo"
 concept_crowdsourcing_civics_desc: "Nhóm Quan Điểm Quốc Gia $concept_crowdsourcing_civics$ bao gồm: $NEW_LINE$—['civic:civic_crowdsourcing']$NEW_LINE$—['civic:civic_corporate_crowdsourcing']"
 councilor_crowdsourcing: "Điều Phối Viên Sáng Tạo"
 councilor_crowdsourcing_desc: "$TITLE$ chịu trách nhiệm giám sát việc sử dụng bằng sáng chế một cách công bằng, và thiết lập các chính sách khuyến khích nghiên cứu sao cho phù hợp với định hướng công nghệ của chính phủ."
 councilor_corporate_crowdsourcing: "Trọng Tài Ý Tưởng"
 councilor_corporate_crowdsourcing_desc: "Không phải dự án nào cũng xứng đáng để đầu tư, và $TITLE$ sẽ là người đưa ra đánh giá xem liệu chúng có tiềm năng để thương mại hóa hay không."
 civic_civil_education: "Giáo Dục Công Dân"
 civic_civil_education_desc: "Trong đế chế này, giáo dục đóng vai trò quan trọng hơn cả việc thực thi pháp luật. Thông qua sự chuẩn bị kỹ lưỡng và các chương trình giảng dạy nghiêm ngặt, họ đảm bảo mọi người đều có cơ hội học tập. Xét cho cùng, nếu dân không được dạy dỗ đàng hoàng, đó là lỗi của người làm thầy."
 civic_civil_education_effects: "$t$—Thay thế toàn bộ £job_enforcer£ ['concept_enforcer'] bằng £job_educator£ ['concept_educator']$TABBED_NEW_LINE$—Thay thế £building£ ['building:building_precinct_house'] bằng £building£ ['building:building_state_academy']"
 councilor_head_of_education: "Bộ Trưởng Giáo Dục"
 councilor_head_of_education_desc: "Sứ mệnh của $TITLE$ là trang bị cho mỗi công dân những kiến thức cần thiết, không chỉ để họ hoàn thành tốt công việc chuyên môn, mà còn để họ tự tin làm chủ được sự phức tạp của chính cuộc sống này. Một nền giáo dục tốt là nền tảng cho sự thịnh vượng của xã hội."
 educator: "$job_educator$"
 job_educator: "Nhà Giáo Dục"
 job_educator_plural: "Các Nhà Giáo Dục"
 job_educator_desc: "Những chiến binh tri thức không mệt mỏi này đang ngày đêm bồi dưỡng thế hệ trẻ, đảm bảo rằng mỗi một công dân đều được trang bị đầy đủ hành trang để đóng góp những giá trị không thể thay thế cho thiên hà."
 job_educator_effect_desc: "£job_educator£ $job_educator_plural$ sẽ chuyển đổi $r_consumer_goods$ thành $r_unity$, làm giảm £crime£ §Y$PLANET_CRIME_TITLE$§!, gia tăng sức hút của §YTư Tưởng Chủ Đạo§!, đồng thời tạo ra £defense_army£ §YLực Lượng Phòng Thủ§!"
 mod_job_educator_add: "Nghề Nghiệp $job_educator$"
 building_state_academy: "Học Viện Quốc Gia"
 building_state_academy_desc: "Nơi đây chịu trách nhiệm giảng dạy mọi kiến thức nền tảng cần thiết để xây dựng một xã hội lành mạnh."
 concept_state_academy: "$building_state_academy$"
 concept_state_academy_desc: "Nghề Nghiệp $job_educator$: §G+200§!\n\n$job_educator_effect_desc$\n$h_line$§L$building_state_academy_desc$§!"
 building_center_of_guidance: "Trung Tâm Chỉ Đạo"
 building_center_of_guidance_desc: "Bao quát mọi khía cạnh của đời sống xã hội. Tại khu phức hợp giáo dục và đào tạo đồ sộ này, bất cứ sự sai lệch nào cũng có thể được uốn nắn và sửa chữa."
 mod_planet_jobs_citizen_produces_mult: "Sản Lượng Tài Nguyên Của Dân Số Có Quyền Công Dân Đầy Đủ"
 civic_hive_familiar_face: "Người Trong Gương"
 civic_hive_familiar_face_desc: "Hợp tác, chứ không phải là đối đầu. Tâm trí bầy đàn này đã tiến hóa ra các ong thợ ngoại giao, có khả năng bắt chước ngoại hình và phong thái của người đối diện."
 civic_wilderness_familiar_face: "$civic_hive_familiar_face$"
 civic_wilderness_familiar_face_desc: "Vùng hoang dã này đã tiến hóa ra những hiện thân ngoại giao, có khả năng bắt chước ngoại hình và phong thái của người đối diện."
 civic_hive_familiar_face_effects: "Đặc phái viên và quan chức hành chính sẽ biến đổi ngoại hình cho giống với đế chế mục tiêu mà họ được phân công đến.\n§YĐộ Tin Cậy§! cần thiết để thực hiện các §YHành Động Ngoại Giao§!: §G-50%§!"
 #Quan Điểm Quốc Gia Cho Phi Thuyền Sinh Học
 civic_hive_shared_genetics: "Chia Sẻ Bộ Gen"
 civic_hive_shared_genetics_desc: "Bộ gen đột biến của bầy đàn này được tận dụng làm nền tảng để nuôi cấy các phi thuyền sinh học, hạm đội của chúng được liên kết chặt chẽ với những ong thợ, khai thác sức mạnh từ chính sự độc nhất vô nhị của giống loài."
 civic_wilderness_shared_genetics: "$civic_hive_shared_genetics$"
 civic_wilderness_shared_genetics_desc: "Một bộ gen đột biến trong vùng hoang dã này được tận dụng làm nền tảng để nuôi cấy các phi thuyền sinh học, hạm đội của chúng được liên kết chặt chẽ với những cộng sinh thể, khai thác sức mạnh từ chính sự độc nhất vô nhị của giống loài."
 civic_hive_shared_genetics_effects: "—Mỗi đặc điểm §GTích Cực§! của giống loài chính: §G+2.5%§! Điểm Chịu Đựng của Thân Tàu, §R+0.5%§! Phí Bảo Trì.\n—Mỗi đặc điểm §RTiêu Cực§! của giống loài chính: §G+1.5%§! Tốc Độ Bắn của Phi Thuyền, §R+0.5%§! Phí Bảo Trì."
 shared_genetics_fire_rate: "$civic_hive_shared_genetics$: Tốc Độ Bắn"
 shared_genetics_fire_rate_desc: "Bị kích thích bởi một sự pha trộn hoàn hảo giữa các hoóc-môn và lòng oán hận, trung khu tấn công của phi thuyền đã rơi vào trạng thái kích động quá mức."
 shared_genetics_hull: "$civic_hive_shared_genetics$: Thân Tàu"
 shared_genetics_hull_desc: "Hệ thống cơ bắp và cấu trúc xương của các phi thuyền của chúng ta đã được cường hóa nhờ vào sự ưu việt trong bộ gen của giống loài."
 civic_hive_aerospace_adaptation: "Thích Nghi Không Gian Vũ Trụ"
 civic_hive_aerospace_adaptation_desc: "Các phi thuyền sinh học của tập thể này đặc biệt xuất sắc trong việc di chuyển xuyên qua bầu khí quyển, có khả năng thực hiện các nhiệm vụ hỗ trợ trên không tầm gần hoặc đóng vai trò hậu cần trên hành tinh."
 civic_hive_aerospace_adaptation_effects: "—Phí bảo trì của §YPhi Thuyền Sinh Học§! khi đang trên quỹ đạo của các thuộc địa §GThân Thiện§! sẽ giảm §G-50%§!.\n—Các thuộc địa §GThân Thiện§! có §YPhi Thuyền Sinh Học§! trên quỹ đạo sẽ nhận được các buff gia tăng §YTốc Độ Xây Dựng§!, §YTiện Nghi§!, §YTốc Độ Dọn Dẹp Chướng Ngại Vật§! và tiềm năng §YSản Lượng Nghề Nghiệp§!, tùy thuộc vào quy mô của hạm đội.\n—Phí bảo trì của §YPhi Thuyền Sinh Học§! khi đang trên quỹ đạo của các thuộc địa §RThù Địch§! sẽ giảm §G-85%§!."
 aa_ship_upkeep_friendly: "$civic_hive_aerospace_adaptation$"
 aa_ship_upkeep_bombing: "$civic_hive_aerospace_adaptation$"
 aa_ship_planet_support_1: "$civic_hive_aerospace_adaptation$"
 aa_ship_planet_support_1_desc: "Các phi thuyền sinh học hoạt động trên quỹ đạo của hành tinh này thường xuyên di chuyển ra vào bầu khí quyển để làm tổ, kiếm ăn và hỗ trợ các ong thợ trên mặt đất."
 aa_ship_planet_support_2: "$civic_hive_aerospace_adaptation$"
 aa_ship_planet_support_2_desc: "$aa_ship_planet_support_1_desc:$"
 aa_ship_planet_support_3: "$civic_hive_aerospace_adaptation$"
 aa_ship_planet_support_3_desc: "$aa_ship_planet_support_1_desc:$"
 aa_ship_planet_support_4: "$civic_hive_aerospace_adaptation$"
 aa_ship_planet_support_4_desc: "$aa_ship_planet_support_1_desc:$"
 civic_machine_stalwart_network: "Mạng Lưới Kiên Cường"
 civic_machine_stalwart_network_desc: "Trí tuệ máy móc này chuyên tâm nghiên cứu các quy trình quân sự mang tính phòng thủ, kết hợp nhuần nhuyễn giữa chiến thuật phòng ngự chủ động và chiến tranh du kích."
 defensive_stations_tracking_add: "$t$—Khả Năng Theo Dõi Của Juggernaut và Trạm Phòng Thủ"
 defensive_stations_tracking_add_tt: "$defensive_stations_tracking_add$: $VARIABLE|0=+$"
 defensive_stations_weapon_range_mult: "Tầm Bắn Vũ Khí Của Căn Cứ Sao Và Trạm Phòng Thủ"
 defensive_stations_weapon_range_mult_tt: "$defensive_stations_weapon_range_mult$: $VARIABLE|1%=+$"
 #Kẻ Trộm Thể Xác
 civic_hive_bodysnatcher: "Ký Sinh Thú"
 civic_hive_bodysnatcher_desc: "Bản chất bên trong mới thực sự là yếu tố quyết định. Bầy đàn này cực kỳ tinh thông nghệ thuật xâm nhập, có khả năng kiểm soát thể xác của những sinh vật hữu cơ xấu số. Cùng với việc đội quân bù nhìn ngày một đông đảo, các nền văn minh vật chủ rốt cuộc cũng sẽ bị thâu tóm bởi ý thức tập thể của bầy đàn này."
 civic_hive_bodysnatcher_effects: "Khởi đầu trò chơi với §Y1000§! £pop£ dân số đã được đồng hóa, cùng khả năng §YĐồng Hóa§! các dân số hữu cơ vào trong bầy đàn.\nMở khóa nhiệm vụ tình báo ['concept_operation_bodysnatcher_prepare_invasion'].\nNhận được thêm £pop£ dân số từ nhiệm vụ tình báo ['concept_operation_smuggle_pops']."
 civic_hive_bodysnatcher_secondary_species: "Kẻ Chiếm Đoạt"
 NAME_Bodysnatchers: "Kẻ Trộm Thể Xác"
 operation_bodysnatcher_prepare_invasion: "Chuẩn Bị Xâm Lược"
 operation_bodysnatcher_prepare_invasion_desc: "Tâm trí của những kẻ hàng xóm xung quanh ta quả thực quá đỗi phong phú và đa dạng. Chỉ cần gửi đến những thân xác đã được hợp nhất với ý thức của ta, chúng ta có thể dễ dàng thâu tóm chúng làm của riêng."
 operation_bodysnatcher_prepare_invasion_on_success: "$IF_SUCCESSFUL|E$\nChúng ta sẽ nhận được sự hậu thuẫn từ nội gián sau khi tuyên chiến với §Y[Target.GetName]§!."
 operation_invasion_prepared: "$TRIGGER_FAIL$§RChúng ta đã chuẩn bị sẵn sàng cho cuộc xâm lược quốc gia này. Sẽ được kích hoạt bằng một lời tuyên chiến.§!"
 operation_invasion_impossible: "$TRIGGER_FAIL$§RQuốc gia này đã phòng bị quá cẩn mật trước những nỗ lực xâm nhập, chúng ta không thể nào khởi động chiến dịch này được!§!"
 concept_operation_bodysnatcher_prepare_invasion: "$operation_bodysnatcher_prepare_invasion$"
 concept_operation_bodysnatcher_prepare_invasion_desc: "Một chiến dịch nhằm đồng hóa dân số của giống loài mục tiêu để xâm nhập vào đế chế của chúng, chuẩn bị cho những hành động phá hoại trên quy mô lớn khi chiến tranh nổ ra."
 bio.800.name: "Nhiệm Vụ Mới"
 bio.800.desc: "Trước khi thực thi kế hoạch vĩ đại của mình, chúng ta cần phải cắm chốt những thân xác đã được thâm nhập vào các vị trí trọng yếu mang tính chiến lược. Các thông tin tình báo thu thập được trước đây cho thấy những ngôi sao thiếu hụt nhân lực và các hành tinh có hệ thống phòng thủ lỏng lẻo sẽ là những mục tiêu hàng đầu. Chúng ta sẽ sớm bắt tay vào việc."
 bio.805.name: "Bổ Sung Nhân Lực"
 bio.805.desc: "Công việc vẫn đang tiến triển hết sức thuận lợi, người của chúng ta đã tìm thấy thêm nhiều vật chủ, sự can dự của chúng ta vào các vấn đề nội bộ của [Target.GetName] ngày càng được củng cố. Rất nhanh thôi, những cá thể con của chúng ta sẽ có thể chứa đựng bất kỳ trí tò mò nào."
 bio.810.name: "Lối Mở Mới"
 bio.810.desc: "Những cá thể [Target.GetSpeciesName] mà chúng ta không thể thay thế đã bị bứng khỏi vị trí của họ, tạo ra vô số khoảng trống trong cấu trúc quyền lực tại §Y[Target.GetName]§!. Những con rối của chúng ta đã sẵn sàng mở toang những cánh cửa dẫn đến cuộc thâm nhập toàn diện, việc duy nhất cần làm lúc này là tiếp tục triển khai kế hoạch."
 bio.815.name: "Lực Lượng Mới"
 bio.815.desc: "§Y[From.Target.GetName]§! giờ đây đã hoàn toàn bất lực. Bọn chúng đã sẵn sàng bị xâm chiếm, chúng ta chỉ cần quyết định xem sẽ tung ra bao nhiêu kẻ mạo danh để lún sâu hơn nữa vào đế chế của bọn chúng. Chẳng mấy chốc, mọi thứ sẽ thuộc về [Owner.GetAdj]."
 bio.815.tt: "Chúng ta không có đủ lượng dân số của giống loài mục tiêu để thực hiện chiến dịch này."
 bio.815.a: "Chúng ta đã tung ra tất cả những gì có thể."
 bio.815.b: "Đảm bảo những tiền đồn của bọn chúng sẽ rơi vào tay chúng ta."
 bio.815.b.tt: "Cử đi §Y100§! £pop£ §HDân Số§!.\n$bio.815.reminder$"
 bio.815.c: "Chuẩn bị xâm lược các hành tinh của bọn chúng."
 bio.815.c.tt: "Cử đi §Y300§! £pop£ §HDân Số§!.\n$bio.815.reminder$"
 bio.815.d: "Thâm nhập vào pháo đài của bọn chúng!"
 bio.815.d.tt: "Cử đi §Y500§! £pop£ §HDân Số§!.\n$bio.815.reminder$"
 bio.815.e: "Chiếm lấy tất cả!"
 bio.815.e.tt: "Cử đi §Y2k§! £pop£ §HDân Số§!.\n$bio.815.reminder$"
 bio.815.reminder: "Trong vòng §G10§! năm tới, cuộc chiến tiếp theo do chúng ta phát động nhắm vào §Y[From.Target.GetName]§!, hoặc do chúng phát động nhắm vào chúng ta, sẽ tận dụng triệt để những nội gián đã được chuẩn bị sẵn sàng này."
 bio.825.name: "Sự Xâm Lăng Của Những Kẻ [From.GetSpeciesNamePlural]"
 bio.825.desc.small: "Lũ [From.GetName] đê tiện đã thâm nhập vào đế chế của chúng ta. Các trạm không gian của chúng ta đã phản bội, và bọn chúng đang tiến hành xâm chiếm các thuộc địa của chúng ta. Chúng ta phải tiêu diệt sạch lũ mạo danh này!"
 bio.825.desc.large: "Ban đầu, chúng ta cứ tưởng đó chỉ là một sự cố trục trặc nào đó. Một nửa mạng lưới liên lạc của chúng ta đã bị tê liệt hoàn toàn.\n\nNhưng không, lũ [From.GetName] xảo quyệt đã âm thầm thay thế các nhân sự chủ chốt trên khắp các khu vực trong không gian. Đế chế của chúng ta đang vỡ vụn, các thuộc địa đang bị xâm chiếm.\n\nĐừng tin bất kỳ ai!"
 #Hoạt Động Buôn Lậu Dân Số
 operation_smuggle_pops: "Buôn Lậu Dân Số"
 operation_smuggle_pops_desc: "Các đặc vụ của chúng ta sẽ tiến hành một cuộc thâm nhập quy mô lớn nhắm vào những nhóm người bị cô lập bên trong [target.GetName]."
 operation_smuggle_pops_on_success: "$IF_SUCCESSFUL|E$\nDi cư một lượng £pops£ dân số sang đế chế của bạn."
 smuggle_pops_also_fanatic_egalitarians: "$TRIGGER_FAIL$§R[Target.GetName] cũng theo Chủ Nghĩa Bình Đẳng Cực Đoan, người dân của họ vốn dĩ đã được tự do rồi.§!"
 smuggle_pops_not_enough_pops: "$TRIGGER_FAIL$§R[Target.GetName] không có đủ £pops£ để chúng ta đánh cắp§!"
 mod_operation_smuggle_pops_difficulty_add: "Độ Khó Của Nhiệm Vụ $operation_smuggle_pops$"
 concept_operation_smuggle_pops: "$operation_smuggle_pops$"
 concept_operation_smuggle_pops_desc: "Nhiệm vụ bắt cóc dân số từ một quốc gia mục tiêu."
 bio.900.name: "Săn Lùng Nhân Tài"
 bio.900.desc: "Các đặc vụ của chúng ta đã thiết lập hàng loạt vỏ bọc và nơi trú ẩn an toàn để giám sát chặt chẽ dân số trên [target.GetName]. Những người có tư tưởng bất đồng, những kẻ sống cô độc, hay những nhân tài có kỹ năng cao sẽ được đánh giá và đánh dấu, chờ ngày chúng ta ra tay đoạt lấy."
 bio.905.name: "Chiến Dịch Bí Mật"
 bio.905.desc: "Đặc vụ của chúng ta đã bắt đầu vây bắt các mục tiêu và che giấu họ tại những địa điểm bí mật. Mỗi khi có một cuộc đột kích thành công, chúng ta sẽ dựng lên một vài sự cố nhằm đánh lạc hướng chính quyền địa phương, che đậy mọi dấu vết của chúng ta."
 bio.910.name: "Tàu Trung Chuyển"
 bio.910.desc: "Chiến dịch đã bước vào giai đoạn quyết định, chúng ta buộc phải bí mật vận chuyển số người đã vây bắt được lên không gian quỹ đạo. Kế hoạch hiện tại là đồng loạt tiến hành sơ tán tại tất cả các cơ sở, nhằm khiến lực lượng an ninh của chúng bị quá tải và không kịp trở tay."
 bio.915.name: "Chuyến Hàng Buôn Lậu"
 bio.915.desc: "Chúng ta đã vận chuyển thành công vô số mục tiêu, nhưng chiến dịch cũng gặp phải không ít chông gai, rất nhiều con tàu chở đầy những cá nhân hữu ích đã bị bỏ lại phía sau."
 bio.915.desc.detected: "$bio.915.desc$\n\nMột cuộc di dân khổng lồ đến mức này tuyệt đối không thể nào không bị phát giác."
 bio.915.desc.cosmogenesis: "Chúng ta đã tóm gọn thành công vô số mục tiêu, và hiện tại chúng đang trên đường được đưa tới cỗ máy ngưng tụ. Nhưng chiến dịch cũng gặp phải không ít chông gai, rất nhiều con tàu chở đầy những cá nhân hữu ích đã bị bỏ lại phía sau."
 bio.915.desc.cosmogenesis.detected: "$bio.915.desc.cosmogenesis$\n\nMột cuộc di dân khổng lồ đến mức này tuyệt đối không thể nào không bị phát giác."
 bio.915.a: "Chúng ta đã cố gắng hết sức có thể rồi."
 bio.915.b: "Hãy tập trung vào việc giải phóng những [Root.GetSpeciesNamePlural] khác."
 bio.915.c: "Chúng ta cần phải kiếm thêm nhiều hơn nữa!"
 bio.915.d: "Tuyệt đối không để lại bất kỳ một người [GetSpeciesName] nào."
 bio.915.tt: "Đánh cắp những £pop£ §HDân Số§! không được ai để mắt tới và đưa họ đến một hành tinh phù hợp."
 bio.915.asset.tt: "$bio.915.tt$\nThậm chí nếu trước đó §Y[From.Target.GetName]§! chưa hề chú ý đến chúng ta, thì §Rchắc chắn bây giờ bọn chúng đã phát giác ra rồi.§!"
 MESSAGE_POPS_SMUGGLED_TITLE: "Dân Số Bị Đánh Cắp"
 MESSAGE_POPS_SMUGGLED_DESC: "Lũ $COUNTRY|Y$ xảo trá đã xâm nhập biên giới của chúng ta và bắt cóc người dân của chúng ta!"
 opinion_smuggled_pops: "Bọn chúng đang ăn cắp dân số của chúng ta!"
 #Ong Thợ Bị Ngắt Kết Nối #
 disconnected_drones_name: "$policy_disconnected_drones$"
 policy_disconnected_drones: "Ong Thợ Bị Ngắt Kết Nối"
 policy_disconnected_drones_desc: "Chúng ta có thể tự mình quyết định xem liệu có cho phép những cá thể con bị cắt đứt liên kết với ý thức trung tâm được phép sinh tồn trên các thuộc địa của chúng ta hay không."
 disconnected_drones_sustain: "Duy Trì"
 disconnected_drones_sustain_name: "Duy Trì Ong Thợ Bị Ngắt Kết Nối"
 disconnected_drones_sustain_desc: "Dù đã bị tách khỏi ý thức tập thể, những ong thợ này vẫn đang cố gắng duy trì sự sống.\n\n§EMở khóa §YLoại Quyền Công Dân§! cho Ong Thợ Bị Ngắt Kết Nối§!"
 disconnected_drones_purge: "Thanh Trừng"
 disconnected_drones_purge_name: "Thanh Trừng Ong Thợ Bị Ngắt Kết Nối"
 disconnected_drones_purge_desc: "Quyền lợi của những sinh vật có trí tuệ hoàn toàn không được áp dụng cho những sinh vật vô tri này. Không có sự kiểm soát từ ý thức trung tâm, những con ong thợ này chỉ là một đám thú hoang, và những con thú cản đường thì đáng bị kết liễu.\n\n§ETất cả các ong thợ sinh sống trên các thuộc địa của chúng ta sẽ bị §Rthanh trừng§!.§!"
 disconnected_drones_purged_citizenship: "$TRIGGER_FAIL$Ong Thợ Bị Ngắt Kết Nối sẽ bị đế chế của chúng ta thanh trừng."
