 auth_mutation_habitability_tt: "Loài hữu cơ có thể đạt mức độ thích nghi lên đến §G175%§!"
 auth_bio_democratic_mutation: "Tự do đa dạng sinh học"
 auth_bio_democratic_mutation_desc: "Xã hội này tuân thủ một nguyên lý: cơ thể của một cá nhân giống như một nơi tôn nghiêm, được cai trị bởi chính họ, phải chịu sự thiết kế và kiểm soát. Trong khuôn khổ tự do không kiềm chế và hỗ trợ kiên định, công dân có được sức mạnh để hiện thực hóa tiềm năng độc đáo của họ, cho phép họ định hình bản thân và tương lai theo ý muốn."
 auth_bio_oligarchic_mutation: "Thống trị xúc tác"
 auth_bio_oligarchic_mutation_desc: "Quyền lực tập trung vào một tầng lớp tinh hoa có đột biến di truyền vượt trội, mang lại cho họ quyền uy vô song. Họ vượt ra ngoài luật lệ thông thường, sử dụng khả năng của mình để bảo vệ và hướng dẫn xã hội, áp dụng mọi biện pháp cần thiết để đảm bảo sự tồn tại và thịnh vượng của xã hội."
 auth_bio_dictatorial_mutation: "Ủy quyền lai tạo"
 auth_bio_dictatorial_mutation_desc: "Xã hội này tôn vinh đột biến di truyền là nền tảng của sự tiến bộ. Những người hài lòng với hình dạng tự nhiên của họ sẽ phải đối mặt với việc bị giam cầm hoặc hành quyết ngay lập tức, đảm bảo rằng chỉ những người có gen ưu việt mới có thể đóng góp vào quá trình theo đuổi sự hoàn hảo không ngừng nghỉ của loài người."
 auth_bio_dictatorial_mutation_tt: "\n£crime£Tội phạm giảm bởi [enforcer.GetIcon][enforcer.GetName] §G-5§!\n$auth_mutation_habitability_tt$"
 auth_bio_imperial_mutation: "Bá quyền di truyền"
 auth_bio_imperial_mutation_desc: "Đế chế này nắm lấy sức mạnh khó lường của những đột biến ngẫu nhiên, khai thác tiềm năng vô tận để nuôi dưỡng sự đổi mới và khả năng mà các phương pháp truyền thống không bao giờ có thể đạt tới. Trong cuộc đua giành quyền tối cao, sự hỗn loạn của đột biến trở thành lợi thế lớn nhất của họ, đẩy họ hướng tới sự thống trị tối cao vô song."
 auth_bio_corporate_mutation: "Cho vay nặng lãi nội tạng"
 auth_bio_corporate_mutation_desc: "Theo hệ thống này, việc tài trợ cho các cơ quan và bộ phận cơ thể được cung cấp cho mọi người thông qua các kế hoạch thanh toán linh hoạt. Trong trường hợp nợ đọng, các cơ quan sẽ bị thu hồi ngay lập tức hoặc tài sản thế chấp đã thỏa thuận sẽ bị tịch thu. Hệ thống này đảm bảo một chu kỳ cung và cầu ổn định, nơi mọi bộ phận cơ thể đều vừa là hàng hóa vừa là hợp đồng."
 auth_bio_corporate_mutation_tt: "$organic_leaders_have_trade_upkeep$\n$r_trade$ từ ['trait:trait_spare_organs'] mỗi $pop_group_unit$ £pop£dân số: §G+0.5§!\n$auth_mutation_habitability_tt$"
 auth_bio_democratic_evopred: "Tuyển cử di truyền"
 auth_bio_democratic_evopred_desc: "Dù khó quản lý, xã hội này đã kiểm soát một phần bộ gen có tính dẻo. Mọi người sẽ quyết định cách biểu hiện những đột biến của chính họ."
 auth_bio_democratic_evopred_tt: "$auth_bio_evopred_tt$\nThêm ['concept_genetic_electorate_effect', hiệu ứng] vào ['trait:trait_malleable_genes'] dựa trên ['concept_faction'] mạnh nhất\nTiến độ ['concept_adaptive_evolution'] từ các §Yloài§! ngoại lai làm nô lệ hoặc có mức sống tốt hơn: §G+100%§!"
 auth_bio_oligarchic_evopred: "Quý tộc sinh học"
 auth_bio_oligarchic_evopred_desc: "Trong xã hội này, thời gian đã bị chinh phục. Thông qua việc lựa chọn cẩn thận những nguồn dự trữ gen nguyên thủy nhất, tầng lớp cai trị đã đạt được sự bất tử. Tuy nhiên, một sai lầm nhỏ cũng có thể đồng nghĩa với việc đánh mất sự vĩnh cửu. Đối với những người thấp kém hơn, tham vọng và tiến hóa là hai mặt của cùng một đồng tiền..."
 auth_bio_oligarchic_evopred_tt: "$auth_bio_evopred_tt$\nQuan chức hội đồng là §Ybất tử§!"
 auth_bio_dictatorial_evopred: "Lãnh địa cai trị đỉnh cao"
 auth_bio_dictatorial_evopred_desc: "Một nền văn minh được định hình bởi sự tiến hóa liên tục, được cai trị bởi một ý chí đỉnh cao. Không có nghị viện hay hiến pháp nào có thể che khuất ý chí tối cao của người cai trị. Tại đây, mọi chiến thắng về mặt di truyền đều thúc đẩy sự thăng tiến của ngai vàng."
 auth_bio_dictatorial_evopred_tt: "$auth_bio_evopred_tt$\nĐặc điểm Nhà trị vì: ['leader_trait:trait_ruler_apex_predator']"
 apex_predator_male: "$trait_ruler_apex_predator$"
 apex_predator_female: "$trait_ruler_apex_predator$"
 auth_bio_imperial_evopred: "Vương triều bất tử"
 auth_bio_imperial_evopred_desc: "Tại $auth_bio_imperial_evopred$, người chết không được yên nghỉ, mà bị hấp thụ. Mỗi thế hệ sẽ nuôi dưỡng thế hệ tiếp theo, phần còn lại của những nhà lãnh đạo đã khuất sẽ duy trì sự cai trị bất tử của đế chế. Phục vụ là hy sinh, và tất cả thần dân sẽ kế thừa di sản của tổ tiên qua cái chết."
 eternal_ancestor_male: "$eternal_ancestor_female$"
 eternal_ancestor_female: "Tổ tiên vĩnh hằng"
 auth_bio_imperial_evopred_tt: "$auth_bio_evopred_tt$\nCho phép Nhà trị vì hấp thụ những nhà lãnh đạo vĩ đại đã qua đời."
 auth_bio_corporate_evopred: "Tập đoàn ăn thịt sinh học nhà nước" #Galactic Limited Incorporated
 auth_bio_corporate_evopred_desc: "Tập đoàn ăn thịt sinh học nhà nước phát triển mạnh cả về mặt di truyền và kinh tế thông qua sự thích nghi. Với mỗi bộ gen mới được thêm vào danh mục đầu tư của công ty, siêu tập đoàn này tiếp tục củng cố vị thế trên thị trường, tùy chỉnh các sản phẩm và đàm phán dựa trên các đặc tính sinh học độc đáo của từng loài. Rốt cuộc, hiểu được bản chất của khách hàng khiến việc chốt thỏa thuận gần như... trở thành bản năng."
 auth_bio_corporate_evopred_tt: "$auth_bio_evopred_tt$\n$organic_leaders_have_trade_upkeep$\nMỗi đặc điểm loài giúp tăng hiệu quả của hiệp định thương mại: §G+1%§!\nTiến độ ['concept_adaptive_evolution'] từ §YHiệp định thương mại§! tăng §G+100%§!"
 auth_bio_hive_mind_evopred: "Ý thức Chimera"
 auth_bio_hive_mind_evopred_desc: "Tâm trí Bầy đàn này đã mệt mỏi với sự tự nhân lên đơn thuần. Mỗi thuộc địa mới trở thành một tấm thảm sống, điểm xuyết bằng những cảnh quan luôn thay đổi và sự dung hợp xác thịt. Sinh vật và hành tinh trở thành một, ranh giới tan biến trong Ý thức Chimera."
 auth_bio_hive_mind_evopred_tt: "$auth_bio_evopred_tt$\nTự động biến đổi môi trường thuộc địa thành §YHành tinh Bầy đàn§!\nThanh lọc người ngoài hành tinh; Tiến độ ['concept_adaptive_evolution'] từ §Yloài§! ngoại lai: §G+100%§!"
 auth_bio_evopred_tt: "$EMPIRE_SIZE$ từ dân số giảm bởi mỗi đặc điểm loài: §G-1%§!\n$auth_mutation_habitability_tt$"
 # Quyền lực Cấp cao Bầy đàn
 auth_bio_hive_purity: "Mô hình Thanh lọc"
 auth_bio_hive_purity_desc: "Bầy đàn này phát triển mạnh nhờ duy trì sự thuần khiết về gen, đảm bảo mỗi cá thể thợ đều tuân thủ nghiêm ngặt một khuôn mẫu sinh học lý tưởng. Việc thao tác di truyền chính xác giúp tăng cường sự thống nhất chung, củng cố sức mạnh bầy đàn, tạo ra một thế lực không thể ngăn cản được mài giũa để đạt hiệu quả và sự sống còn."
 auth_bio_hive_purity_tt: "$pop_effects_from_purity_header$$TABBED_NEW_LINE$—£unity£$unity$ từ mỗi $pop_group_unit$ £pop£dân số: $plus_minus_icon$§Y$@purity_traits_resource$§!$DOUBLE_NEW_LINE$"
 auth_bio_hive_cloning: "Bầy đàn Sao chép Du mục"
 auth_bio_hive_cloning_desc: "Công nghệ nhân bản tiên tiến thúc đẩy bầy đàn gồm những tạo vật tàn nhẫn, nhất quán cao về mặt di truyền này, mỗi cá thể phụ đều sở hữu hiệu quả và tính nhất quán hoàn hảo. Tuân theo một mệnh lệnh sinh sản bẩm sinh, bầy đàn này sẽ che khuất cả những vì sao."
 auth_bio_hive_cloning_tt: "$ENABLES_BACKUP_CLONES$\n£society£['technology:tech_node_culling_1'] làm giảm ['concept_clone_leader_degradation', Sự xuống cấp của Bản sao]"
 tech_node_culling_1_cloning: "$tech_node_culling_1$"
 tech_node_culling_1_cloning_desc: "$tech_node_culling_1_desc$"
 REDUCED_CLONE_DEGRADATION_TITLE: "§HTính năng mở khóa:§! Giảm sự xuống cấp của bản sao"
 REDUCED_CLONE_DEGRADATION_DESC: "§Y$leader_trait_backup_clone_default_plural$§! bị giảm ['concept_clone_leader_degradation', Sự xuống cấp]"
 auth_bio_hive_mutation: "Lãnh địa Thích nghi"
 auth_bio_hive_mutation_desc: "Những cá thể thợ siêu thích nghi của bầy đàn này tạo thành một lực lượng tiến hóa động liên tục, sử dụng các đột biến liên tục để vượt qua các thách thức về môi trường và chiến thuật. Mỗi sự thích nghi đều củng cố sức mạnh tập thể, đảm bảo rằng Tâm trí Bầy đàn có thể phát triển mạnh mẽ trong mọi điều kiện với tính linh hoạt và khả năng phục hồi vô song."
