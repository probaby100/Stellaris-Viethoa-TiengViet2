 SPECIES_TRAIT_CATEGORY_HEADER: "§HDanh Mục Đặc Điểm§!\nĐặc điểm này thuộc danh mục sau:"
 SPECIES_TRAIT_HUMANOID: "['concept_humanoid_phenotype_traits']"
 SPECIES_TRAIT_MAMMALIAN: "['concept_mammalian_phenotype_traits']"
 SPECIES_TRAIT_REPTILIAN: "['concept_reptilian_phenotype_traits']"
 SPECIES_TRAIT_ARTHROPOID: "['concept_arthropoid_phenotype_traits']"
 SPECIES_TRAIT_AVIAN: "['concept_avian_phenotype_traits']"
 SPECIES_TRAIT_MOLLUSCOID: "['concept_molluscoid_phenotype_traits']"
 SPECIES_TRAIT_PLANTOID: "['concept_plantoid_phenotype_traits']"
 SPECIES_TRAIT_FUNGOID: "['concept_fungoid_phenotype_traits']"
 SPECIES_TRAIT_LITHOID: "['concept_lithoid_phenotype_traits']"
 SPECIES_TRAIT_NECROID: "['concept_necroid_phenotype_traits']"
 SPECIES_TRAIT_AQUATIC: "['concept_aquatic_phenotype_traits']"
 SPECIES_TRAIT_TOXOID: "['concept_toxoid_phenotype_traits']"
 SPECIES_TRAIT_INFERNAL: "['concept_infernal_phenotype_traits']"
 SPECIES_TRAIT_VOCATIONAL: "['concept_vocational_traits']"
 SPECIES_TRAIT_OVERTUNED: "['concept_overtuned_traits']"
 SPECIES_TRAIT_FLEETING_EXCELLENCE: "['concept_fleeting_excellence_traits']"
 SPECIES_TRAIT_CYBORG: "['concept_cybernetic_traits']"
 SPECIES_TRAIT_UNIVERSAL_AUGMENTATIONS: "['concept_universal_augmentations_traits']"
 SPECIES_TRAIT_ADAPTIVE_FRAMES: "['concept_adaptive_frames_traits']"
 trait_egg_laying: "Đẻ Trứng"
 trait_egg_laying_desc: "Trẻ sơ sinh của giống loài này không phát triển trong bụng mẹ, mà được bảo bọc an toàn trong vỏ trứng. Đặc điểm này cho phép dân số của họ bùng nổ nhanh chóng trong những thời kỳ vật chất dư dả."
 trait_egg_laying_effect: "Tốc Độ Tăng Trưởng Dân Số: §G+15%§! khi cư trú trên hành tinh có mức sản xuất $r_food$ (hoặc tương đương) địa phương bị §GDư Thừa§!"
 trait_egg_laying_portrait_override_tt: "Hoặc bất kỳ giống loài đẻ trứng nào"
 trait_seasonal_dormancy: "Ngủ Đông Theo Mùa"
 trait_seasonal_dormancy_desc: "Giống loài này tiến hóa trên một hành tinh có chu kỳ phân mùa rõ rệt, đủ khắc nghiệt để buộc chúng phải ngủ đông. Trong thời hiện đại, nhịp điệu tự nhiên này có thể được mô phỏng nhân tạo, tạo ra một phương thức hiệu quả để cất giữ những thành viên kém năng suất trong xã hội."
 trait_seasonal_dormancy_effect: "Phí Bảo Trì Dân Số Có Việc Làm: §G-15%§!\n    —Phí Bảo Trì Dân Số Thất Nghiệp & ['concept_denizen']: §G-75%§!"
 trait_seasonal_dormancy_portrait_override_tt: "Hoặc bất kỳ giống loài nào có khả năng ngủ đông"
 trait_hollow_bones: "Xương Rỗng"
 trait_hollow_bones_desc: "Giống loài này sở hữu cấu trúc xương mỏng manh, giúp chúng di chuyển vô cùng nhẹ nhàng. Tuy nhiên, điều này cũng khiến chúng dễ bị tổn thương hơn trước những tác động từ trọng lực của hành tinh."
 trait_hollow_bones_effect: "$worker_and_simple_drone_cat_bonus_workforce_mult$ từ mỗi Quy Mô Hành Tinh: §R-0.67%§!"
 trait_rooted: "Cắm Rễ"
 trait_rooted_desc: "Giống loài này sinh sống bằng cách bám rễ sâu vào hầu hết mọi loại môi trường, khiến việc di dời đối với chúng trở thành một trải nghiệm vô cùng đau đớn."
 AUTO_MIGRATE_ROOTED: "§RDân số Cắm Rễ không thể bị di dời cưỡng chế.§!"
 trait_rooted_effect: "§RKhông Tự Động Di Cư§!\n    —Chi Phí Di Dời Cưỡng Chế: §R+200%§!"
 trait_rooted_portrait_override_tt: "Hoặc bất kỳ giống loài cố định nào"
 trait_acidic_vascularity: "Huyết Mạch Axit"
 trait_acidic_vascularity_desc: "Thể dịch của giống loài này chính là thứ vũ khí phòng vệ lợi hại nhất. Những chất lỏng ăn mòn cực mạnh và chết người này đảm bảo bất kỳ kẻ thù nào cả gan xuyên thủng cơ thể chúng đều sẽ phải trả giá đắt."
 trait_acidic_vascularity_effect: "Lục Quân sẽ §YCái Chết Bùng Nổ§! gây §G250§! sát thương cho quân địch\n    —Sản Lượng Tài Nguyên Dân Số Bị Thanh Trừng: §R-75%§!"
 DAMAGE_ARMY: "Sát Thương $ARMY|Y$"
 trait_shelled: "Có Mai"
 trait_shelled_desc: "Giống loài này luôn mang theo nhà bên mình, bất kể đó là cấu trúc tự nhiên, đồ vật nhặt được hay là thiết kế nhân tạo. Chiếc vỏ cứng cáp này mang đến một nơi trú ẩn an toàn, đảm bảo chúng luôn có chốn ngả lưng yên bình mỗi khi đêm về."
 trait_shelled_portrait_override_tt: "Hoặc bất kỳ giống loài có mai nào"
 trait_camouflage: "Màu Ngụy Trang"
 trait_camouflage_desc: "Giống loài này là những bậc thầy ngụy trang, có khả năng hòa mình hoàn hảo vào môi trường xung quanh, khiến chúng gần như tàng hình trước cả kẻ săn mồi lẫn con mồi. Bản năng bẩm sinh về quang học này mang lại cho chúng lợi thế vượt trội trong chiến tranh du kích."
 trait_camouflage_portrait_override_tt: "Hoặc bất kỳ giống loài nào có khả năng ngụy trang"
 trait_chromalogs: "Ngôn Ngữ Sắc Màu"
 trait_chromalogs_desc: "Với việc sử dụng màu sắc đầy tính nghệ thuật, giống loài này đã vượt xa khả năng ngụy trang đơn thuần, tiến hóa khả năng giao tiếp thông qua những hoa văn sặc sỡ và phức tạp hiển thị trên cơ thể chúng."
 trait_chromalogs_portrait_override_tt: "Hoặc bất kỳ giống loài nào giao tiếp bằng cách thay đổi màu sắc cơ thể"
 trait_brittle: "Mỏng Manh"
 trait_brittle_desc: "Giống loài này sinh ra đã mỏng manh dễ vỡ, ngay cả trong những hoạt động thường ngày nhất cũng phải vô cùng cẩn trọng để tránh bị dập nát."
 trait_familial: "Quần Cư"
 trait_familial_desc: "Giống loài này duy trì mối liên kết sâu sắc và bền chặt với những người thân ruột thịt của mình, từ đó hình thành nên những cộng đồng đoàn kết và làm việc với hiệu suất cao."
 trait_familial_effect: "Hạnh Phúc từ mỗi §Y100§! £pop£ Dân Số có cùng đặc điểm trên cùng một hành tinh: §G0.1%§! (Tối đa: §G+20%§!)"
 trait_familial_portrait_override_tt: "Hoặc bất kỳ giống loài nào sống theo chế độ gia đình"
 trait_permeable_skin: "Da Thẩm Thấu"
 trait_permeable_skin_desc: "Giống loài này được bao phủ bởi một lớp da tiến hóa đặc biệt, đòi hỏi những điều kiện môi trường vô cùng lý tưởng. Chừng nào chúng không rời xa khí hậu quê hương của mình, thì đây sẽ không phải là vấn đề."
 trait_permeable_skin_effect: "Độ Thích Nghi trên các hành tinh thuộc ['concept_climate_category'] khác với Sở Thích: §R-20%§!"
 concept_climate_category: "Danh Mục Khí Hậu"
 concept_climate_category_desc: "Các hành tinh có thể sinh sống được chia thành ba danh mục khí hậu:\n—Ẩm ướt:\n$t$—Lục Địa\n$t$—Đại Dương\n$t$—Nhiệt Đới\n—Lạnh Giá:\n$t$—Núi Rừng\n$t$—Băng Tuyết\n$t$—Lãnh Nguyên\n—Khô Hạn:\n$t$—Khô Cằn\n$t$—Sa Mạc\n$t$—Thảo Nguyên"
 trait_genetic_memory: "Ký Ức Di Truyền"
 trait_genetic_memory_desc: "Truyền đạt tri thức và kinh nghiệm cho thế hệ sau là khởi nguồn của nhiều nền văn minh. Nhưng giống loài này còn tiến xa hơn thế, chúng mã hóa thẳng những bí quyết sinh tồn vào gen của mình, đảm bảo mỗi thế hệ sinh ra đều được thừa hưởng trí tuệ tích lũy từ tổ tiên."
 trait_genetic_memory_effect: "Độ Thích Nghi tăng theo Tuổi Của Thuộc Địa: §G+0.5%§! mỗi năm (Tối đa §G+25%§!)"
 trait_genetic_memory_portrait_override_tt: "Hoặc bất kỳ giống loài nào có bản năng sinh tồn di truyền"
 trait_nascent_stage: "Sinh Non"
 trait_nascent_stage_desc: "Giống loài này được sinh ra khi vẫn còn ở giai đoạn phát triển sơ khai, dẫn đến việc các cá thể non nớt không thể cống hiến cho xã hội trong một khoảng thời gian dài. Bù lại, trong giai đoạn này, chúng hoàn toàn không phải bận tâm đến những trách nhiệm và gánh nặng đi kèm với trí tuệ."
 trait_nascent_stage_effect: "Dân số mang đặc điểm này sẽ ở trạng thái Tiền Nhân Tính trong §Y5§! năm đầu đời."
 trait_nascent_stage_portrait_override_tt: "Hoặc bất kỳ giống loài nào có giai đoạn ấu thơ kéo dài"
 trait_presapient_stage: "Tiền Nhân Tính"
 trait_presapient_stage_desc: "Sau một giai đoạn vô thức ngắn ngủi, giống loài này sẽ nhanh chóng trưởng thành và trở thành một thực thể sở hữu trí tuệ hoàn thiện."
 trait_flight: "Biết Bay"
 trait_flight_desc: "Vượt qua những giới hạn của mặt đất, giống loài này tự do sải cánh giữa bầu trời bao la. Những thành phố của chúng sở hữu cấu trúc dày đặc vô cùng độc đáo, được thiết kế tối ưu cho những cư dân trên không. Trong chiến đấu, khả năng bay lượn khiến chúng trở thành những mục tiêu cực kỳ khó bị phát hiện và nắm bắt."
 trait_flight_portrait_override_tt: "Hoặc bất kỳ giống loài nào thích nghi với cuộc sống trên không"
 trait_spatial_mastery: "Thích Nghi Không Gian"
 trait_spatial_mastery_desc: "Không chỉ sở hữu khả năng bay lượn, giống loài này còn có cấu trúc não bộ độc nhất vô nhị, cho phép chúng định vị và xử lý không gian ba chiều theo bản năng. Nhờ đó, chúng thể hiện sự xuất chúng không gì sánh được trong việc dàn trận, khảo sát hành tinh và quy hoạch đô thị."
 trait_spatial_mastery_portrait_override_tt: "Hoặc bất kỳ giống loài nào có thiên phú định vị không gian ba chiều"
 trait_spare_organs: "Cơ Quan Dự Phòng"
 trait_spare_organs_desc: "Giống loài này đã tiến hóa ra hệ thống cơ quan dự phòng, giúp chúng có cơ hội sống sót ngay cả khi phải hứng chịu những tổn thương tàn khốc nhất — xét đến việc chúng vẫn còn tồn tại đến ngày nay, thì đây quả là một sự thích nghi cực kỳ thành công."
 trait_spare_organs_effect: "Lãnh đạo có thể sống sót sau lần tử vong đầu tiên\n    —Khi Lục Quân Tấn Công bị tiêu diệt: §G20%§! cơ hội sinh ra Lục Quân thay thế\n    —£job_livestock£ §Y$job_livestock$§! Sản Lượng: §G+50%§!"
 mod_planet_livestock_produces_mult: "Sản Lượng £job_livestock£ §Y$job_livestock$§!"
 trait_leader_second_chanced: "Hồi Sinh"
 trait_leader_second_chanced_desc: "Đặc điểm sinh lý độc đáo đã cứu mạng vị lãnh đạo này một lần, nhưng sẽ không có phép màu nào xảy ra lần thứ hai đâu."
 #################################
 # Nguồn Gốc Săn Mồi Tiến Hóa #
 #Được viết bởi Victor Haeggman  #
 #################################
 #Nguồn Gốc và Bắt Đầu Trò Chơi
 origin_evolutionary_predators: "Thợ Săn Tiến Hóa"
 origin_evolutionary_predators_desc: "§RCảnh báo: Vô hiệu hóa tất cả các Tuyến Đường Thăng Thiên ngoại trừ ['concept_mutation_ascension'].§!\n\n Bị chi phối bởi những bản năng mà ngay cả chính họ cũng chẳng thể hiểu thấu, giống loài này không ngừng săn lùng những sinh vật độc đáo nhất. Nhờ năng lực thiên bẩm có thể dung hợp gen của con mồi, chúng đã vươn lên thành những kẻ săn mồi tối thượng trên thế giới quê hương, hấp thu mọi gen ưu việt của những kẻ bại trận. Giờ đây, cơn khát khao không đáy đó lại đang thôi thúc chúng hướng ánh mắt về phía những vì sao."
 origin_tooltip_evolutionary_predators_effects: "—$SPECIES_TRAITS$ ['concept_malleable_genes']\n—Tình Huống: ['concept_adaptive_evolution']\n—Hành Tinh Quê Hương: ['concept_genetic_soup']"
 START_SCREEN_EVOLUTIONARY_PREDATORS_BASE: "[GetSpeciesNamePlural] sinh ra đã là những thợ săn. Chúng ta không ngừng tìm kiếm con mồi, sẵn sàng dấn thân vào những môi trường khắc nghiệt nhất để săn lùng những sinh vật kỳ dị nhất. Chỉ cần con mồi có thể hóa thành máu thịt của chúng ta, thì mọi nỗ lực đều xứng đáng.\n\n"
 START_SCREEN_EVOLUTIONARY_PREDATORS_REGULAR: "$START_SCREEN_EVOLUTIONARY_PREDATORS_BASE$Chúng ta luôn thấu hiểu một chân lý, chính xương máu của con mồi đã nhào nặn nên hình hài của chúng ta ngày hôm nay — mỗi cuộc đi săn, mỗi một mạng sống bị tước đoạt đều đưa chúng ta lên một tầm cao mới.\n\nLịch sử đẫm máu của chúng ta không phải là gánh nặng, mà là tinh hoa của cả giống loài. Với sự trợ giúp của công nghệ hiện đại, chúng ta không còn phải nuốt sống kẻ thù để tiến hóa nữa; giờ đây, chỉ cần một vài sợi vật chất di truyền bé nhỏ cũng đủ để đan dệt vào cấu trúc sinh học của chúng ta.\n\nNgọn lửa khát khao tiến hóa đang rực cháy trong huyết quản, dưới ánh bình minh do [GetStartingDrive] mang lại, chúng ta đã sẵn sàng lao vào bãi săn thiên hà rộng lớn, để gặt hái tất thảy những gì tồn tại trong đó."
 START_SCREEN_EVOLUTIONARY_PREDATORS_HIVE: "$START_SCREEN_EVOLUTIONARY_PREDATORS_BASE$Tiềm thức tập thể của chúng ta luôn thấu hiểu tiềm năng di truyền của chính mình — chúng ta có thể hấp thu và thích ứng với những tinh hoa của con mồi, dung hợp những ưu điểm của chúng vào trong tổ ấm của chúng ta.\n\nBản năng săn mồi cổ xưa này đã được bảo tồn và duy trì ở một trạng thái cân bằng có kiểm soát cho đến tận ngày nay. Chúng ta không còn phụ thuộc vào việc đi săn để tiến hóa nữa, thay vào đó, chúng ta có thể tổng hợp bất kỳ vật chất di truyền nào trong phòng thí nghiệm và phân phối nó một cách hoàn hảo đến toàn bộ tổ ấm.\n\nVới sự ra đời của [GetStartingDrive], chúng ta đã sẵn sàng sải bước khắp thiên hà, gặt hái mọi thứ tồn tại trong đó."
 START_SCREEN_EVOLUTIONARY_PREDATORS_DEVOURING_SWARM: "$START_SCREEN_EVOLUTIONARY_PREDATORS_BASE$Chỉ đến khi ngấu nghiến toàn bộ sự sống trên [GetHomeWorldName], chúng ta mới nhận ra sự ngu xuẩn của chính mình. Giờ thì chúng ta biết tìm kiếm những năng lực thích nghi mới ở đâu đây? Và thế là, chúng ta ngước nhìn lên bầu trời.\n\nNhững kẻ săn mồi bình thường đi săn để sinh tồn, còn chúng ta, những kẻ săn mồi hoàn mỹ, đi săn để vươn tới sự hoàn hảo tuyệt đối của chính bản thân.\n\nVới sự ra đời của [GetStartingDrive], một lần nữa, chúng ta lại nín thở chờ đợi. Thiên hà bao la vô tận kia, chẳng khác nào một bữa đại tiệc đang vẫy gọi."
 #Đặc Điểm
 trait_malleable_genes: "Gen Dễ Uốn"
 trait_malleable_genes_desc: "§LGiống loài này không bị trói buộc vào một đặc điểm hay cơ quan cố định nào, chúng sẽ tự động phát triển ra những bộ phận thích hợp nhất cho từng nhiệm vụ cụ thể. Tuy nhiên, sự thiếu ổn định này cũng đi kèm với một số bất lợi nhất định.§!"
 trait_malleable_genes_cant_modify: "§RGiống loài sở hữu đặc điểm này không thể tiến hành chỉnh sửa gen.§!\n$automodding_trait_tooltip_all$§Y$trait_malleable_genes$§! sẽ chọn sửa đổi từ ['concept_automodding_malleable']"
 CANNOT_MODIFY_MALLEABLE_GENES_SPECIES: "$TRIGGER_FAIL$Vật chất di truyền không ổn định khiến giống loài này không thể tiến hành chỉnh sửa gen."
 concept_malleable_genes: "$trait_malleable_genes$"
 concept_malleable_genes_desc: "$trait_malleable_genes_cant_modify$"
 concept_automodding_malleable: "Danh Sách Đặc Điểm Tự Động Sửa Đổi Của Gen Dễ Uốn"
