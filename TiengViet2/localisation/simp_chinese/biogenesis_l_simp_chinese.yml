 SHIP_BEHEMOTH_RAGE: "Tuyến Xâm Lược"
 SHIP_BEHEMOTH_RAGE_DESC: "Behemoth Nuốt Chửng Bầu Trời vốn bản tính ngoan cố và kiêu ngạo, sẽ không bao giờ chịu khuất phục trước sự kìm kẹp lâu dài. Không chóng thì chày, ngọn lửa phẫn nộ trong chúng sẽ bùng lên, biến thành một cơn bão vũ trụ không thể nào kiềm chế. Có lẽ sự khôn ngoan không nằm ở việc thụ động chờ đợi, mà là tự tay chúng ta châm ngòi cho mồi lửa ấy. Hãy để chúng ta chủ động giải phóng cơn bão, thay vì để nó giáng xuống đầu mình một cách bất ngờ."
 behemoth_rage_ship_button: "§HKích Nộ§!\n\nGiải phóng §YBehemoth Nuốt Chửng Bầu Trời§!.\nBehemoth Nuốt Chửng Bầu Trời trong cơn cuồng nộ sẽ lao về phía §YThuộc Địa§! hoặc §YTrứng Behemoth Nuốt Chửng Bầu Trời§! gần nhất và cố gắng tiêu diệt nó.\nTrạng thái cuồng nộ thường kéo dài §Y180 ngày§!, nhưng có nhiều yếu tố có thể ảnh hưởng đến khoảng thời gian này. $TABBED_NEW_LINE$—Trong khi đang §RChiến Đấu§! hoặc §ROanh Tạc§!, Behemoth sẽ không thể bình tĩnh lại được.$TABBED_NEW_LINE$—Nếu chúng ta §GĐánh Bại§! Behemoth Nuốt Chửng Bầu Trời đang cuồng nộ trong trận chiến, nó sẽ trở lại dưới sự kiểm soát của chúng ta."
 behemoth_rage_activity_key: "Cuồng Nộ"
 behemoth_rage_menu_title: "Kích Nộ"
 behemoth_rage_progress_activity_key: "Cuồng Nộ"
 MESSAGE_BEHEMOTH_RAGE_TITLE: "Behemoth Nuốt Chửng Bầu Trời Bị Kích Nộ"
 MESSAGE_BEHEMOTH_RAGE_DESC: "Một con Behemoth Nuốt Chửng Bầu Trời đã rơi vào trạng thái điên loạn! Chúng ta hy vọng nó sẽ bình tĩnh lại trong vài tháng tới."
 MESSAGE_BEHEMOTH_CALM_TITLE: "Cơn Giận Đã Nguôi"
 MESSAGE_BEHEMOTH_CALM_DESC: "Một con Behemoth Nuốt Chửng Bầu Trời đã bình tĩnh lại và một lần nữa nằm dưới sự kiểm soát của chúng ta."
 SHIP_BEHEMOTH_COCOON: "Người Kết Kén Biến Thái Hoàn Toàn"
 SHIP_BEHEMOTH_COCOON_DESC: "§YBehemoth Nuốt Chửng Bầu Trời§! có khả năng tự neo mình trong các tầng nhiễu loạn của những hành tinh khí khổng lồ, hấp thụ dưỡng chất từ bầu khí quyển dày đặc, dồi dào các nguyên tố nặng và hợp chất phân tử phức tạp. Qua thời gian, nguồn dinh dưỡng dồi dào này không chỉ thúc đẩy sự phát triển của chúng mà còn tiếp thêm sức mạnh cho nguồn sức mạnh vốn đã khổng lồ của chúng."
