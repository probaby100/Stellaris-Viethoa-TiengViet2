 concept_adaptive_evolution: "Tiến Hóa Thích Nghi"
 concept_adaptive_evolution_desc: "Việc ngấu nghiến gen của các dạng sống khác sẽ thúc đẩy tiến độ của Tình Huống này.\n§GKhi Hoàn Thành:§!\n$t$—Chọn một Đặc Điểm Loài mới dựa trên những loài vừa bị ngấu nghiến\n§YCách Thúc Đẩy:§!\n$t$—Thuộc địa hóa hành tinh mới\n$t$—Thanh trừng các loài khác hoặc thuần hóa chúng làm Gia Súc\n$t$—Duy trì các loài khác trong đế chế với tư cách Nô Lệ hoặc cao hơn\n$t$—Tuyển dụng Lãnh Đạo người ngoài hành tinh vào Hội Đồng\n$t$—Sở hữu Phi Thuyền Sinh Học\n$t$—Ký kết Hiệp Định Thương Mại với tư cách là Siêu Tập Đoàn\n$t$—Chạm trán sự sống ngoài hành tinh thông qua các Sự Kiện đa dạng"
 concept_genetic_soup: "$genetic_soup$"
 concept_genetic_soup_desc: "$fresh_biosphere_tt$\n\n§L$genetic_soup_desc$§!"
 trait_malleable_minerals: "Móng Vuốt Dễ Uốn"
 trait_malleable_minerals_desc: "§LSự thích nghi này tạo ra những bộ móng vuốt cứng như kim cương, giúp việc khai thác khoáng sản trở nên dễ dàng hơn bao giờ hết.§!"
 trait_malleable_energy: "Lớp Cách Nhiệt Dễ Uốn"
 trait_malleable_energy_desc: "§L Một lớp cách nhiệt dày dặn, có khả năng phòng ngừa đủ loại tai nạn, đặc biệt hữu hiệu trong các môi trường năng lượng cao.§!"
 trait_malleable_food: "Chi Máy Cày Dễ Uốn"
 trait_malleable_food_desc: "§LNhững chi phụ được trang bị móng vuốt dạng xẻng có thể đẩy nhanh quá trình xới đất và gieo hạt. Nhờ khả năng thích nghi với đa dạng các loại địa hình, những chi máy cày này luôn là công cụ đắc lực cho những công việc tương ứng.§!"
 trait_malleable_research: "Vỏ Não Dễ Uốn"
 trait_malleable_research_desc: "§LMặc dù việc dồn máu lên vùng vỏ não trung tâm có thể gây ra đôi chút khó chịu, nhưng nó lại giúp tăng tốc đáng kể quá trình xử lý vấn đề và tư duy sáng tạo.§!"
 trait_malleable_unity: "Cơ Quan Cảm Giác Dễ Uốn"
 trait_malleable_unity_desc: "§LViệc cường hóa các cơ quan cảm giác giúp chúng ta thấu hiểu và trân trọng hơn những góc nhìn đa dạng. Quan sát tỉ mỉ chính là chìa khóa dẫn đến thành công.§!"
 trait_malleable_forge: "Vết Chai Dễ Uốn"
 trait_malleable_forge_desc: "§LKhi thao tác với những chất ăn mòn hay nóng rực, một lớp da chai sần dày cộm chỉ mang lại lợi ích chứ không hề có tác hại.§!"
 trait_malleable_trade: "Pheromone Dễ Uốn"
 trait_malleable_trade_desc: "§LNhững loại Pheromone có khả năng thích nghi cao này có thể nâng cao sức thuyết phục một cách khó tin trên bàn đàm phán.§!"
 trait_malleable_ameneties: "Cộng Hưởng Dễ Uốn"
 trait_malleable_ameneties_desc: "§LMột chuỗi các lỗ nhỏ có độ chính xác cao giúp giống loài này có thể tạo ra những âm thanh êm dịu và hài hòa chỉ bằng những chuyển động cơ thể.§!"
