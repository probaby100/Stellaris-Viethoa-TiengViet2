 #Tình Báo
 operation_evolutionary_predator_procure_dna: "Thu Thập Gen"
 operation_evolutionary_predator_procure_dna_desc: "Chúng ta có thể tiếp cận nguồn vật chất di truyền một cách trực diện hơn — bằng cách xâm nhập vào giống loài đó và âm thầm thu thập."
 operation_evolutionary_predator_procure_dna_on_success: "$IF_SUCCESSFUL|E$\nTình huống §Y$evolutionary_predators_situation$§! đạt được một bước tiến nhỏ và chúng ta sẽ thu được bộ gen của giống loài chủ thể đó."
 operation_evolutionary_predator_procure_dna_preftl: "$operation_evolutionary_predator_procure_dna$"
 operation_evolutionary_predator_procure_dna_preftl_on_success: "$operation_evolutionary_predator_procure_dna_on_success$"
 bio.1050.name: "Nằm Vùng"
 bio.1050.desc: "Các đặc vụ của chúng ta đang âm thầm hoạt động tại khu định cư của [Target.GetSpeciesName], và sẽ sớm có khả năng thâm nhập vào các công trình của họ. Chúng ta cần phải kiên nhẫn, và kiên nhẫn thì chúng ta có thừa — những thợ săn xuất chúng nhất luôn biết cách chờ đợi thời cơ."
 bio.1055.name: "Thỏa Hiệp"
 bio.1055.desc: "Con mồi đã ở ngay trước mắt. Các thợ săn được cử đi thâm nhập [Target.GetName] đang vô cùng tự tin. Họ sẽ sớm có thể lẻn vào khu dân cư của [Target.GetSpeciesName], và nguồn vật chất di truyền quý giá kia đã nằm gọn trong tầm tay."
 bio.1060.name: "Phục Kích"
 bio.1060.desc: "Các đặc vụ của chúng ta đã vào vị trí sẵn sàng. Họ đã giành được quyền truy cập vào khu nhà ở của [Target.GetSpeciesName], và chuẩn bị sẵn những lớp ngụy trang hoàn hảo. Đương nhiên, giống như bất kỳ một thợ săn lão luyện nào, họ đã vạch sẵn nhiều lối thoát hiểm, có đường thì đàng hoàng, có đường thì không được vẻ vang cho lắm. Thật tồi tệ nếu họ phải dùng đến đường cống ngầm để trốn thoát."
 bio.1065.name: "Đánh Cắp Gen"
 bio.1065.desc: "Thành công rồi! Các đặc vụ của chúng ta đã mang về một lượng lớn vật chất di truyền, nhờ vậy chúng ta có thể đảm bảo giành được lợi thế to lớn trong lần đột biến tiếp theo. Biết đâu chúng ta cũng nên phát triển thêm một vài sở thích khẩu vị đối với [From.Target.GetSpeciesName] thì sao nhỉ."
