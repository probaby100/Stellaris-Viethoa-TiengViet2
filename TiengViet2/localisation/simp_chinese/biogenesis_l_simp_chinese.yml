 #Sự Kiện Ngẫu Nhiên (Bầy Đàn)
 bio.110.name: "Tối Ưu Hóa Phân Công"
 bio.110.desc: "Khi bắt đầu tiến hành thăng thiên sinh học cho [target.GetGestaltEntityName], chúng ta phải ưu tiên thực hiện những dự án cường hóa có khả năng mang lại lợi ích lớn nhất cho nền văn minh của mình.\n\nViệc thao tác gen có chọn lọc cho phép chúng ta lai tạo ra những đặc điểm thể chất lý tưởng nhất, phù hợp với các lĩnh vực công nghiệp cụ thể.\n\nVới những năng lực mới sở hữu, chúng ta có thể lựa chọn cường hóa [target.GetIndividualNamePlural] trong lĩnh vực sản xuất năng lượng hoặc lĩnh vực phòng thủ."
 bio.110.a: "Năng lượng lúc nào cũng hữu ích."
 bio.110.b: "Chúng ta nên ưu tiên vấn đề phòng thủ."
 bio.115.name: "Sự Dư Thừa Thế Hệ"
 bio.115.desc: "Khi xây dựng các khuôn mẫu mới cho ong thợ, chúng ta phải quyết định xem sẽ xử lý thế nào với những kẻ không thể tương thích với những nâng cấp gen.\n\nMột số ong thợ lớn tuổi đã quá ốm yếu để có thể chịu đựng những cuộc điều chỉnh này. Chúng ta có thể giữ chúng lại làm lực lượng lao động trong phần đời còn lại, hoặc thu hoạch sinh khối của chúng để bổ sung dưỡng chất cho tổ ấm."
 bio.115.a: "Tái chế những ong thợ lớn tuổi."
 bio.115.b: "Chúng vẫn còn chỗ hữu dụng."
 bio.120.name: "Tốc Độ hay Sức Bền"
 bio.120.desc: "Một nghiên cứu gen mang tính đột phá đã phát hiện ra phương pháp tăng cường hiệu suất dẫn truyền thần kinh, giúp cải thiện đáng kể năng suất của [target.GetIndividualName].\n\nTuy nhiên, sự gia tăng công suất phát ra của não bộ này không thể duy trì trong thời gian dài, dẫn đến việc tuổi thọ bị sụt giảm.\n\nChúng ta phải quyết định xem sẽ duy trì tuổi thọ bình thường, hay đánh đổi tuổi thọ để đổi lấy năng lực vượt trội hơn."
 bio.120.a: "Tuổi thọ hiện tại của chúng ta quan trọng hơn."
 bio.120.b: "Kích thích [target.GetIndividualNamePlural] để gia tăng năng suất."
 bio.125.name: "Quá Tải Khớp Thần Kinh"
 bio.125.desc: "Một thế hệ [target.GetIndividualNamePlural] mới được nâng cấp đã được tích hợp vào [target.GetGestaltEntityName]. Chúng đã trải qua quá trình tinh chỉnh kỹ thuật sinh học, giúp gia tốc sự phát triển thần kinh và quy trình nhận thức. Các điểm kết nối thần kinh trọng yếu của [target.GetGestaltEntityName] đang hoạt động với tốc độ chưa từng có.\n\nTuy nhiên, sự gia tốc này đang phá vỡ sự ổn định của [target.GetIndividualName], có nguy cơ dẫn đến tình trạng quá tải khớp thần kinh vô cùng thảm khốc. Chúng ta có thể phân bổ thêm lượng lớn [target.GetIndividualNamePlural] để thực thi các nhiệm vụ điều phối."
 bio.125.a: "Hãy giảm tốc độ lại để duy trì sự ổn định."
 bio.125.b: "Hãy bùng cháy rực rỡ như đóa hoa mùa hạ."
 bio.130.name: "Hiện Tượng Tần Số"
 bio.130.desc: "Kể từ khi tích hợp nhóm bản sao mới vào Bầy Đàn, chúng ta đã phát hiện ra một vấn đề về rung động âm thanh cực kỳ khó chịu. Một lỗi nhỏ trong quy trình nhân bản có thể đã cản trở sự phát triển các chất dẫn truyền sinh học của chúng, tạo ra sự nhiễu loạn về tần số.\n\nMỗi khi những bản sao này giao tiếp với toàn bộ Bầy Đàn, tất cả các ong thợ xung quanh đều phải hứng chịu một cơn ù tai tâm linh ồn ào và vô cùng xáo trộn. Điều này gây ra sự xao nhãng và ảnh hưởng đến cả hiệu suất làm việc."
 bio.130.a: "Tuy khó chịu, nhưng có thể chịu đựng được."
 bio.130.b: "Tiêu diệt những ong thợ gây ra sự cố này."
 bio.135.name: "Nan Đề Hành Động Đồng Bộ"
 bio.135.desc: "Các cuộc thử nghiệm nhân bản gần đây đã thu được một kết quả bất thường. Một số bản sao dường như tồn tại một kết nối thần kinh với các mẫu gen gốc của chúng, dẫn đến việc chúng thực hiện các hành động đồng bộ trong vô thức.\n\nBất kể khoảng cách xa đến mức nào, hiện tượng này vẫn luôn tồn tại, và bản sao sẽ đồng bộ hóa hoàn toàn với mẫu gốc đang ở một nơi khác trong thiên hà. Khám phá này đã mở ra cho chúng ta những khả năng mới.\n\nChúng ta có thể khởi động một kế hoạch, đặt bản sao và mẫu gốc vào trong cùng một môi trường để làm việc cùng nhau; hoặc trích xuất các chất dẫn truyền thần kinh liên quan để nghiên cứu sâu hơn về hiện tượng này."
 bio.135.a: "Thiết lập môi trường làm việc hoàn toàn giống hệt nhau cho mẫu gốc và bản sao."
 bio.135.b: "Sử dụng các phương pháp phẫu thuật để cắt đứt liên kết thần kinh đồng bộ."
 bio.140.name: "Bản Sao Không Thích Thích"
 bio.140.desc: "Nhằm củng cố tổ ấm, chúng ta đã dùng vật liệu gốc để nuôi cấy một lứa bản sao và đẩy nhanh quá trình trưởng thành của chúng bằng các phương pháp nhân tạo. Dù những bản sao này là những mẫu vật sinh học xuất chúng, nhưng chúng lại không thể tương thích được.\n\nSự bất thường này tuy gây ra nhiều xáo trộn, nhưng cũng mang đến một cơ hội độc nhất vô nhị. Những ong thợ đặc biệt này sở hữu danh tính và tư duy độc lập, có thể mang lại những lợi ích to lớn khi giao tiếp với các thực thể nằm ngoài Bầy Đàn. Khả năng suy nghĩ tự chủ của chúng cũng có thể xóa nhòa ranh giới mà ý thức thống nhất của Bầy Đàn khó có thể vượt qua. Thế nhưng, những lợi ích này đi kèm với một cái giá đắt: ý thức cá nhân ngày càng lớn mạnh của chúng đã dẫn đến sự bất ổn, đe dọa sẽ ảnh hưởng đến một số chức năng nhận thức cao cấp của chúng ta."
 bio.140.a: "Cưỡng chế tích hợp."
 bio.140.b: "Tận dụng tiềm năng của chúng."
 bio.145.name: "Sự Lo Lắng Được Tạo Ra"
 bio.145.desc: "Ý thức tập thể của chúng ta đang rơi vào trạng thái hỗn loạn. Mặc dù đã làm chủ được khả năng tự sao chép, chúng ta vẫn chần chừ về tính hiệu quả (thậm chí là về mặt đạo đức) của hành động này.\n\nQuá trình nhân bản đòi hỏi một lượng tài nguyên khổng lồ. Đặc biệt khi quá trình sinh sản tự nhiên có thể mang lại nhiều sự đa dạng về gen hơn, liệu chúng ta có nên dành những tài nguyên này cho những việc khác hay không?\n\nTrong lịch sử, đây vốn không phải là phương thức sinh sản của chúng ta, và chúng ta không chắc liệu mình đã sẵn sàng chấp nhận sự thay đổi tận gốc rễ này đối với giống loài của mình hay chưa."
 bio.145.a: "Sự hiệu quả của nhân bản là không thể phủ nhận."
 bio.145.b: "Sự đa dạng di truyền mới là điều quan trọng nhất."
 bio.150.name: "Sự Sụp Đổ Của Bầy Đàn"
 bio.150.desc: "Các cuộc thí nghiệm đột biến của chúng ta đã dẫn đến sự xuất hiện của những điều bất thường bên trong tổ ấm. Những nhiệm vụ trước đây vốn được thực hiện một cách dễ dàng thì giờ lại đòi hỏi phải đắn đo suy nghĩ rất nhiều, và những mệnh lệnh mâu thuẫn lẫn nhau đang kéo căng tinh thần của tập thể.\n\nMặc dù gánh nặng kéo theo có thể thiêu rụi những ong thợ mẫn cán nhất của chúng ta, nhưng nó cũng mang đến một cơ hội.\n\nChúng ta phải quyết định: nên chậm lại để khôi phục, hay để bản thân vượt qua giới hạn?"
 bio.150.a: "Chúng ta có thể nghỉ ngơi một lát."
 bio.150.b: "Cớ chi tham ngủ khi còn sống, đằng nào thác đi cũng sẽ ngủ ngàn thu."
 bio.151.name: "Lột Xác Hoàn Toàn"
 bio.151.desc: "Quyết định nghỉ ngơi của chúng ta đã mang lại những lợi ích thiết thực. Những thôi thúc bất đồng trước đây dần lắng xuống, hội tụ thành một dòng tư tưởng hài hòa, một lần nữa thúc đẩy tập thể tiến bước với một sự mạch lạc sắc bén.\n\nNhững ong thợ từng chới với bên bờ vực kiệt sức giờ đây lại say sưa làm việc không biết mệt mỏi với độ chuẩn xác cao. Khoảng thời gian tự vấn này không chỉ xoa dịu sự mệt mỏi của tập thể, mà còn củng cố thêm quyết tâm của chúng ta trong việc đương đầu với những thách thức phía trước."
 bio.151.a: "Bây giờ chúng ta đang tỏa sáng rực rỡ!"
 bio.155.name: "Tranh Luận Về Chuyên Dụng Và Đa Dụng"
 bio.155.desc: "Sự đột biến mang lại vô vàn lợi ích, và tổ ấm của chúng ta có thể tận dụng sự nâng cấp có chọn lọc để đáp ứng thêm những nhu cầu khác. Chẳng hạn như, chúng ta có thể chuyên môn hóa sản lượng khoáng sản thông qua việc làm cứng các phần phụ bằng kitin.\n\nHoặc chúng ta có thể tiến hành sửa đổi gen nhiều hơn cho tất cả ong thợ, biến chúng thành những cá thể đa nhiệm."
 bio.155.a: "Đa nhiệm chính là hữu dụng."
 bio.155.b: "Hãy bắt đầu quá trình khám phá nào."
 bio.160.name: "Sự Lệch Của Kiểu Hình"
 bio.160.desc: "Những cuộc thử nghiệm không ngừng nghỉ đã mang đến cho tổ ấm một sự phức tạp ngoài ý muốn. Một số ong thợ bắt đầu phát triển những đặc điểm thể chất độc đáo: như bộ xương ngoài chi chít gai nhọn, các phần phụ quá khổ, hay các cơ quan cảm giác nhạy bén một cách bất thường.\n\nMặc dù những biến đổi này thực sự mang lại một vài lợi ích nhất định, nhưng đồng thời chúng cũng làm tăng thêm gánh nặng trao đổi chất. Tổ ấm đang phải đối mặt với bài toán hóc búa là làm sao để cân bằng áp lực ngày một gia tăng này. Vấn đề cốt lõi là, mức độ đột biến bao nhiêu thì được coi là phù hợp?"
 bio.160.a: "Đón nhận sự tràn đầy sức sống."
 bio.160.b: "Phải duy trì tính gắn kết."
 bio.165.name: "Hoài Niệm Quá Khứ"
 bio.165.desc: "Tổ ấm đang chuyển mình. Thông qua việc cải tạo bộ gen, chúng ta đã chứng kiến những cải thiện rõ rệt về mặt sức khỏe. Tuy nhiên, điều này cũng khiến chúng ta trở nên mỏng manh hơn khi phải đối mặt với những áp lực tâm lý.\n\nChúng ta không hề chán ghét con người trước đây của mình, mặc dù chúng ta đang ngày càng mạnh mẽ hơn, năng lực nhận thức cũng tân tiến hơn, nhưng chúng ta vẫn hoài niệm những lối mòn tư duy thân thuộc của quá khứ.\n\nMột cảm giác khó chịu sâu sắc đang bao trùm toàn bộ tổ ấm, tựa như thể xác và tinh thần bên trong không còn ăn khớp với nhau nữa. Liệu chúng ta đã vượt quá giới hạn của chính mình?"
 bio.165.a: "Sự sống là sự biến đổi."
 bio.165.b: "Chúng ta không thể đánh mất bản ngã của mình."
 #Các Công Cụ Sửa Đổi
 supremacy_denied: "Ưu Thế Bị Hạn Chế"
 supremacy_denied_desc: "Chính phủ đang áp dụng các biện pháp cứng rắn nhằm kiềm chế sự dị biệt về mặt di truyền."
 augment_appreciation: "Tôn Vinh Cường Hóa Gen"
 augment_appreciation_desc: "Các kỹ sư di truyền và những cá nhân đã trải qua quá trình cường hóa gen đều là những thành viên vô giá của xã hội chúng ta."
 conscious_evolution: "Tiến Hóa Tự Chủ"
 conscious_evolution_desc: "Chúng ta cùng nhau tiến bước."
 superior_individuals: "Cá Nhân Xuất Chúng"
 superior_individuals_desc: "Nhân tài tinh anh tạo ra thành quả tinh anh."
 welfare_state: "Quốc Gia Phúc Lợi"
 welfare_state_desc: "Các chương trình phúc lợi xã hội do chính phủ khởi xướng đang được triển khai."
 selective_survival: "Sinh Tồn Có Chọn Lọc"
 selective_survival_desc: "Những công nhân đã được cường hóa đang góp phần gia tăng hiệu suất công nghiệp của chúng ta."
 super_powered: "Sức Mạnh Siêu Phàm"
 super_powered_desc: "Những cá nhân sở hữu siêu năng lực đã tăng cường sức mạnh phòng thủ của chúng ta."
 deceitful_dismissal: "Sa Thải Kẻ Gian Trá"
 deceitful_dismissal_desc: "Chúng ta đang tìm kiếm những nhà lãnh đạo mới, có phẩm chất trung thực."
 harvesting_halt: "Lệnh Cấm Thu Hoạch Nội Tạng"
 harvesting_halt_desc: "Hành vi thu hoạch nội tạng từ người nhân bản đã bị liệt vào danh sách bất hợp pháp."
 clone_drivers: "Lao Động Nhân Bản"
 clone_drivers_desc: "Việc liên tục sử dụng người nhân bản cho phép chúng ta tập trung vào việc nâng cao hiệu suất công nghiệp."
 effective_surveillance: "Chế Độ Hiệu Quả"
 effective_surveillance_desc: "Xã hội của chúng ta vô cùng coi trọng quyền công dân. Ít nhất là trên lý thuyết."
 decriminalized_society: "Định Hình Lại Quyền Uy"
 decriminalized_society_desc: "Thông qua việc chủ động thực thi pháp luật, chúng ta đang thể hiện một lập trường cứng rắn hơn đối với tội phạm."
 mass_euthanasia: "Trợ Tử Hàng Loạt"
 mass_euthanasia_desc: "Những hành động kiên quyết sẽ được áp dụng đối với người nhân bản bất hợp pháp."
 duplicated_inheritance: "Gia Tài Sao Chép"
 duplicated_inheritance_desc: "Dòng tân binh không ngừng tuôn chảy đã nâng tầm các hoạt động quân sự của chúng ta."
 duplicated_inheritance_armies: "Quân Đoàn Nhân Bản Kế Thừa"
 mutant_crackdown: "Càn Quét Dị Nhân"
 mutant_crackdown_desc: "Chính phủ đã có hành động dứt khoát để chống lại hành vi bài xích."
 mutant_enclaves: "Khu Định Cư Dị Nhân"
 mutant_enclaves_desc: "Khu định cư của các dị nhân đã cung cấp những tư liệu vô giá cho nghiên cứu xã hội học."
 embracing_change: "Đón Nhận Sự Thay Đổi"
 embracing_change_desc: "Những cơ hội mới để thể hiện sự sáng tạo và sự mới mẻ đã thúc đẩy một sự phát triển đa dạng."
 biological_limitations: "Hạn Chế Sinh Học"
 biological_limitations_desc: "Công nghệ an ninh sinh học và thực thi pháp luật sẽ duy trì tính khả thi của các quy định hiện hành."
 societal_diversification: "Đa Dạng Hóa Xã Hội"
 societal_diversification_desc: "Cùng với việc người dân bắt đầu thử nghiệm những cải tạo sinh học độc đáo, các vấn đề về trách nhiệm liên quan cũng đã được giải quyết êm thấm."
 standardized_biology: "Sinh Học Chuẩn Hóa"
 standardized_biology_desc: "Thông qua các mẫu gen được chuẩn hóa, sự gắn kết xã hội đã được nâng cao."
 blob_neutralized: "Dọn Sạch Khối Sinh Khối"
 blob_neutralized_desc: "Hành động quyết đoán đối với khối sinh khối đã mang lại cảm giác an toàn hơn cho tất cả mọi người."
 globule_research: "Nghiên Cứu Khối Sinh Khối"
 globule_research_desc: "Các nhà khoa học đang tiến hành những thí nghiệm sinh học khép kín trên khu vực này."
 super_troopers: "Siêu Lực Lượng"
 super_troopers_desc: "Quân đoàn siêu anh hùng đang giúp chúng ta duy trì trật tự xã hội."
 watch_the_watchers: "Giám Sát Kẻ Giám Sát"
 watch_the_watchers_desc: "Ai sẽ là người giám sát những kẻ giám sát? Chính là chúng ta."
 hero_council: "Hội Đồng Anh Hùng"
 hero_council_desc: "Các cố vấn siêu anh hùng đang hỗ trợ cho quy trình ra quyết định của chính phủ."
 hero_restrictions: "Sắc Lệnh Hạn Chế Anh Hùng"
 hero_restrictions_desc: "Chính phủ của chúng ta sẽ không còn phụ thuộc vào sự trợ giúp của những người có siêu năng lực nữa."
 ethical_cloning: "Nhân Bản Đạo Đức"
 ethical_cloning_desc: "Các tiêu chuẩn khắt khe đã hạn chế việc lạm dụng công nghệ nhân bản quy mô lớn."
 nuisance_crackdown: "Dẹp Loạn Kẻ Gây Rối"
 nuisance_crackdown_desc: "Người nhân bản có quyền bình đẳng. Nhưng bản thể gốc thì còn bình đẳng hơn."
 artistic_integrity: "Sự Toàn Vẹn Nghệ Thuật"
 artistic_integrity_desc: "Những theo đuổi nghệ thuật sẽ dẫn dắt chúng ta đến với sự vĩ đại."
 logic_first: "Logic Lên Ngôi"
 logic_first_desc: "Chúng ta sẽ trở thành những nhà lãnh đạo trong lĩnh vực khoa học của thiên hà."
 practical_application: "Ứng Dụng Thực Tiễn"
 practical_application_desc: "Chúng ta sẽ ưu tiên phát triển việc sản xuất hàng hóa và dịch vụ."
 crack_downs: "Hành Động Trấn Áp"
 crack_downs_desc: "Dưới bàn tay sắt của luật pháp, sự ổn định sẽ được củng cố."
 performative_reformation: "Cải Cách Hình Thức"
 performative_reformation_desc: "Nếu điều đó làm họ vui, thì cứ để họ chìm đắm trong ảo mộng cách mạng của mình đi."
 ancestral_inheritance: "Di Sản Tổ Tiên"
 ancestral_inheritance_desc: "Trí tuệ của tổ tiên sẽ soi đường chỉ lối cho chúng ta tiến về tương lai."
 buried_secrets: "Bí Mật Chôn Vùi"
 buried_secrets_desc: "Những gì tổ tiên chúng ta đã làm tuyệt đối không được phép đưa ra ánh sáng trong thời đại này."
 specimen_study: "Nghiên Cứu Tiêu Bản"
 specimen_study_desc: "Các tài liệu nghiên cứu bị tịch thu sẽ góp phần bổ sung cho sự phát triển chính thức của chúng ta."
 purity_tests: "Kiểm Tra Độ Thuần Khiết"
 purity_tests_desc: "Mọi tuyên bố về độ thuần khiết của gen đều phải được xác minh thông qua các cuộc kiểm tra bộ gen nghiêm ngặt."
 clone_rights: "Quyền Lợi Người Nhân Bản"
 clone_rights_desc: "Chúng ta sẽ tôn trọng quyền tự chủ của các cá nhân nhân bản."
 class_system: "Hệ Thống Giai Cấp"
 class_system_desc: "Phải có sự phân định đẳng cấp rõ ràng giữa công dân và các bản sao của họ."
 thorough_inspections: "Hành Động Khám Xét Toàn Diện"
 thorough_inspections_desc: "Chúng ta phải đảm bảo sẽ không còn bất kỳ sự cố nào xảy ra trong quá trình sản xuất nhân bản nữa."
 swift_recovery: "Phục Hồi Thần Tốc"
 swift_recovery_desc: "Năng suất là ưu tiên hàng đầu của chúng ta."
 well_adjusted: "Điều Chỉnh Thỏa Đáng"
 well_adjusted_desc: "Các vấn đề về cảm xúc nên là thứ cuối cùng mà chúng ta phải bận tâm."
 strict_discipline: "Kỷ Luật Thép"
 strict_discipline_desc: "Làm việc chăm chỉ và kỷ luật nghiêm minh sẽ rèn giũa tất cả mọi người thành những công dân mẫu mực."
 infinite_growth: "Tăng Trưởng Vô Hạn"
 infinite_growth_desc: "Cho dù phải trả thêm một cái giá đắt, chúng ta cũng phải gia tăng sản lượng công nghiệp."
 clone_colonies: "Thuộc Địa Người Nhân Bản"
 clone_colonies_desc: "Các công dân nhân bản có thể đẩy nhanh tiến độ phát triển thuộc địa của chúng ta."
 mutant_studies: "Nghiên Cứu Dị Nhân"
 mutant_studies_desc: "Chúng ta sẽ giữ lại những dị nhân này làm đối tượng thử nghiệm, nhằm nâng cao hiểu biết về đột biến."
 aspirational_striving: "Mưu Cầu Lý Tưởng"
 aspirational_striving_desc: "Những cá nhân kiệt xuất nên được tạc tượng làm gương — một hình mẫu lý tưởng đáng để theo đuổi!"
 militaristic_fortitude: "Nghị Lực Quân Sự"
 militaristic_fortitude_desc: "Ưu thế về di truyền sẽ dẫn dắt chúng ta đến với vinh quang."
 replicated_success: "Nhân Bản Thành Công"
 replicated_success_desc: "Những khả năng phi thường này không thể chỉ là đặc quyền của một nhóm nhỏ. Nó phải được sẻ chia với toàn thể công dân."
 sewer_sweep: "Càn Quét Cống Ngầm"
 sewer_sweep_desc: "Bất kể thứ quái quỷ gì đang bò trườn dưới đó... chúng ta đều không muốn thấy nó."
 weaponized_plague: "Vũ Khí Hóa Dịch Bệnh"
 weaponized_plague_desc: "Dịch bệnh là một công cụ đắc lực, chúng ta có thể lợi dụng nó để thanh lọc những kẻ yếu kém."
 biohacker_haven: "Thiên Đường Cho Hacker Sinh Học"
 biohacker_haven_desc: "Chính phủ của chúng ta sẽ dốc sức gỡ bỏ mọi rào cản đối với việc chỉnh sửa gen."
 limited_autonomy: "Tự Trị Có Hạn"
 limited_autonomy_desc: "Chúng ta sẽ duy trì một mức độ trật tự nhất định, giới hạn việc sử dụng công nghệ hacker sinh học đã được chính phủ phê duyệt."
 proactive_management: "Quản Lý Chủ Động"
 proactive_management_desc: "Khoa học lý thuyết chỉ là những lời bàn tán sáo rỗng. Các nhà lãnh đạo của chúng ta nên tập trung vào nhiệm vụ được giao."
 really_proactive_management: "$proactive_management$"
 really_proactive_management_desc: "Đế chế của chúng ta không có chỗ cho những kẻ lười biếng."
 #Công Cụ Sửa Đổi Cho Bầy Đàn
 energetic_manipulation: "Thao Túng Năng Lượng"
 energetic_manipulation_desc: "Cường hóa sinh học giúp gia tăng hiệu suất."
 defensive_focus: "Trọng Tâm Phòng Thủ"
 defensive_focus_desc: "Phòng thủ là ưu tiên số một của chúng ta. Sức mạnh và độ dẻo dai chính là nền móng cho quân đội của chúng ta."
 grunt_retention: "Giữ Chân Ong Thợ"
 grunt_retention_desc: "Những ong thợ ở mọi độ tuổi đều đang cống hiến cho công cuộc nghiên cứu và phát triển công nghệ của chúng ta."
 assured_longevity: "Đảm Bảo Tuổi Thọ"
 assured_longevity_desc: "Cùng với việc tinh thần đoàn kết và sĩ khí tập thể được nâng cao, chúng ta luôn chủ động đặt sự phúc lợi của bản thân lên hàng đầu."
 hyper_charged: "Vận Hành Quá Tải"
 hyper_charged_desc: "Hiệu suất truyền dẫn thần kinh được cải thiện giúp chúng ta đạt được năng suất cao hơn trong thời gian ngắn hơn."
 hyper_charged_wilderness: "$hyper_charged$"
 hyper_charged_wilderness_desc: "$hyper_charged_desc$"
 vitality_conservation: "Bảo Tồn Sinh Lực"
 vitality_conservation_desc: "Cùng với những cải tiến trong quá trình cường hóa, chúng ta phải dành thời gian để chăm sóc cho sự phúc lợi của bản thân."
 accelerated_growth: "Tăng Trưởng Gia Tốc"
 accelerated_growth_desc: "Khi hiệu suất được nâng cao, năng suất cũng sẽ bứt phá mạnh mẽ."
 interference_perseverance: "Chịu Đựng Nhiễu Loạn"
 interference_perseverance_desc: "Tâm trí Bầy Đàn đang phải gồng mình gánh chịu sự nhiễu loạn thần kinh và không ngừng thích nghi. Ngay cả khi phải đối mặt với những rắc rối này, chúng ta vẫn duy trì được hiệu suất hoạt động."
 tandem_workers: "Làm Việc Phối Hợp"
 tandem_workers_desc: "Chúng ta đang tận dụng tối đa các vấn đề điều phối hiện tại."
 mandated_integration: "Tích Hợp Cưỡng Chế"
 mandated_integration_desc: "Việc cưỡng chế tích hợp những con ong thợ nổi loạn sẽ dập tắt mọi cuộc phản kháng."
 methodic_procreation: "Sinh Sản Có Hệ Thống"
 methodic_procreation_desc: "Chúng ta tập trung vào việc tối ưu hóa công nghệ nhân bản, đồng thời cũng quan tâm đến các tác động xã hội và đạo đức của nó."
 genetic_diversification: "Đa Dạng Hóa Di Truyền"
 genetic_diversification_desc: "Chúng ta đang cùng nhau thảo luận về tương lai của giống loài, áp dụng những phương án đối phó thận trọng và chu toàn."
 hive_spa_day: "Nghỉ Ngơi Dưỡng Sức"
 hive_spa_day_desc: "Chúng ta sẽ dành ra một năm để đặt sự phúc lợi của tập thể lên hàng đầu."
 cousin_of_death: "Không Thể Dừng, Sẽ Không Dừng."
 cousin_of_death_desc: "Không có thời gian để nghỉ ngơi. Chúng ta vẫn còn công việc phải làm."
 positively_glowing: "Lột Xác Hoàn Toàn"
 positively_glowing_desc: "Chúng ta đã nghỉ ngơi đủ rồi, giờ đây sinh lực đã căng tràn trở lại."
 multi_functionality: "Đa Chức Năng"
 multi_functionality_desc: "Hiệu suất sản xuất đang tăng lên, sự đa năng của ong thợ cũng đã đạt đến một tầm cao mới."
 optimized_workforce: "Tối Ưu Hóa Lực Lượng Lao Động"
 optimized_workforce_desc: "Tâm trí Bầy Đàn rất hài lòng với điều này, mọi ong thợ đều đang cống hiến hết mình theo đúng năng lực của chúng."
 change_is_growth: "Biến Đổi Là Trưởng Thành"
 change_is_growth_desc: "Trưởng thành đồng nghĩa với việc thay đổi, và thay đổi sẽ thúc đẩy sự trưởng thành. Chúng ta đang hấp thụ tri thức với tốc độ chóng mặt."
 maintain_the_essence: "Duy Trì Bản Ngã"
 maintain_the_essence_desc: "Trong quá trình không ngừng tiến hóa, chúng ta không thể đánh mất chính mình. Chúng ta vẫn vững vàng và kiên định."
 strengthened_focus: "Tăng Cường Tập Trung"
 strengthened_focus_desc: "Ong thợ trở nên khỏe mạnh hơn, tâm trí Bầy Đàn cũng trở nên vui vẻ hơn."
 evolutionary_diversion: "Chuyển Hướng Tiến Hóa"
 evolutionary_diversion_desc: "Một sự biến đổi to lớn đã làm rúng động Bầy Đàn. Giờ đây, chúng ta phải tập trung vào các biện pháp cải tạo sinh học an toàn."
 biological_corrections: "Hiệu Chỉnh Sinh Học"
 biological_corrections_desc: "Chúng ta không thể để những bất thường di truyền ác tính đe dọa đến hoài bão đột biến của mình."
 cellular_degradation: "Suy Thoái Tế Bào"
 cellular_degradation_desc: "Chúng ta phải cởi mở đón nhận những hướng tiến hóa mới."
 cellular_degradation_wilderness: "$cellular_degradation$"
 cellular_degradation_wilderness_desc: "$cellular_degradation_desc$"
 resilient_hive: "Tâm Trí Kiên Cường"
 resilient_hive_desc: "Chúng ta tập trung vào việc nâng cao các đặc điểm về thể lực và khả năng thích nghi, đảm bảo khả năng sinh tồn của [GetGestaltEntityName] trong những môi trường khắc nghiệt."
 cognizant_hive: "Tâm Trí Cảnh Giác"
 cognizant_hive_desc: "Chúng ta ưu tiên nâng cao năng lực trí tuệ và sự phối hợp giữa các [GetIndividualName], thúc đẩy khả năng ra quyết định và hiệu suất hoạt động."
 pristine_lineage: "Huyết Thống Thuần Khiết"
 pristine_lineage_desc: "Ưu tiên bồi dưỡng các [GetIndividualNamePlural] chuyên xử lý thông tin và các điểm nút lãnh đạo."
 breed_for_growth: "Lai Tạo Để Sinh Sôi"
 breed_for_growth_desc: "Chúng ta lựa chọn những đặc điểm mang lại lợi ích cao nhất cho khả năng sinh sản và nuôi dưỡng các [GetIndividualNamePlural] khỏe mạnh."
 breed_for_growth_wilderness: "$breed_for_growth$"
 breed_for_growth_wilderness_desc: "$breed_for_growth_desc$"
 relentless_focus: "Tập Trung Không Ngừng Nghỉ"
 relentless_focus_desc: "Chúng ta không thể để bản thân bị xao nhãng. Sự thuần khiết chính là mục tiêu tối thượng của chúng ta, mọi thứ khác đều phải gác sang một bên."
 infrastructural_bolstering: "Củng Cố Cơ Sở Hạ Tầng"
 infrastructural_bolstering_desc: "Trên con đường theo đuổi sự thuần khiết, hệ thống sản xuất của [GetGestaltEntityName] tuyệt đối không được phép bị tổn hại."
 anomaly_purging: "Thanh Trừng Dị Thường"
 anomaly_purging_desc: "Không thể để mặc cho sự may rủi tự do định đoạt. Bất kỳ tình huống nào ngoài dự kiến đều phải bị dập tắt ngay lập tức."
 anomaly_purging_wilderness: "$anomaly_purging$"
 anomaly_purging_wilderness_desc: "$anomaly_purging_desc$"
 rigorous_examination: "Kiểm Tra Khắt Khe"
 rigorous_examination_desc: "Những thứ được cho là tạp chất đó biết đâu lại có lợi cho [GetGestaltEntityName]. Chúng ta không nên vội vàng loại bỏ chúng."
 rigorous_examination_wilderness: "$rigorous_examination$"
 rigorous_examination_wilderness_desc: "$rigorous_examination_desc$"
 population_relocation: "Tái Định Cư Dân Số"
 population_relocation_desc: "Bằng cách tái định cư những công dân dư thừa, chúng ta có thể cân bằng lại những áp lực tiềm tàng mà sự tăng trưởng dân số liên quan đến nhân bản mang lại cho Bầy Đàn."
 factotum_reserves: "Kho Dự Trữ Thợ Đa Năng"
 factotum_reserves_desc: "Quá trình sản xuất năng lượng của Bầy Đàn sẽ được tăng cường nhờ vào các ong thợ nhân bản đa chức năng."
 simple_minds: "Tâm Trí Đơn Thuần"
 simple_minds_desc: "Bầy Đàn tìm thấy sự an ủi trong những đặc điểm xoa dịu của một bộ phận nhỏ có tâm trí đơn thuần."
 the_new_batch: "Nhân Bản: Thế Hệ Mới"
 the_new_batch_desc: "Thế hệ cũ lùi bước, nhường chỗ cho thế hệ mới."
 metaphysical_hive: "Bầy Đàn Siêu Hình"
 metaphysical_hive_desc: "Dù có thể dẫn đến sự bất đồng, chúng ta vẫn không ngừng suy ngẫm về bản chất của sự tồn tại và mục đích sống."
 metaphysics_rejected: "Chối Bỏ Siêu Hình Học"
 metaphysics_rejected_desc: "Những câu hỏi mang tính siêu hình chỉ là sự xao nhãng của ý thức độc lập; ý nghĩa của chúng ta không nằm ở việc trăn trở về sự tồn tại, mà là sống như một khối thống nhất."
 boosted_neurology: "Tăng Cường Thần Kinh"
 boosted_neurology_desc: "Chúng ta đã suy nghĩ quá lâu rồi. Bây giờ là lúc chúng ta phải tập trung vào việc biến đổi giống loài của mình, bất chấp mọi khiếm khuyết tiềm tàng."
 balanced_advancement: "Tiến Bộ Cân Bằng"
 balanced_advancement_desc: "Những thí nghiệm đột biến của chúng ta không cần phải thay đổi cách chúng ta kết nối với nhau."
 rage_quitting: "Đè Nén Cơn Giận"
 rage_quitting_desc: "Bầy Đàn không có chỗ cho sự liều lĩnh và bạo lực."
 fury_embracing: "Ôm Lấy Cơn Phẫn Nộ"
 fury_embracing_desc: "Chúng ta đón nhận sự hỗn loạn vô hình của tương lai."
 decisive_meditation: "Thiền Định Quyết Đoán"
 decisive_meditation_desc: "Trước tiên, chúng ta chọn cách chấp nhận bản chất đầy biến động của ý thức, cùng nhau hướng tới một thế giới quan cân bằng hơn."
 meteorological_adaptations: "Thích Nghi Khí Tượng"
 meteorological_adaptations_desc: "Chúng ta phải đầu tư thời gian và nguồn lực để nâng cao khả năng thích ứng với khí hậu của mình."
 body_builders: "Kẻ Kiến Tạo Thể Phách"
 body_builders_desc: "Sức mạnh thể chất chính là đỉnh cao của sự tiến hóa."
 deep_thinkers: "Nhà Tư Tưởng Sâu Sắc"
 deep_thinkers_desc: "Thứ gắn kết chúng ta lại với nhau chính là khả năng tư duy sâu sắc."
 sensible_supremacy: "Sự Uyên Bác Tối Cao"
 sensible_supremacy_desc: "Chúng ta hoàn toàn có thể vừa táo bạo vừa cẩn trọng cùng một lúc."
 decisive_termination: "Sự Chấm Dứt Quả Quyết"
 decisive_termination_desc: "Nhằm kiểm soát sự bùng phát của dịch bệnh, chúng ta sẽ xử tử những kẻ bị lây nhiễm."
 survival_study: "Nghiên Cứu Sinh Tồn"
 survival_study_desc: "Việc nghiên cứu cẩn trọng những [GetIndividualNamePlural] bị lây nhiễm sẽ chỉ dẫn chúng ta tìm ra phương thuốc chữa trị dịch bệnh."
 survival_study_wilderness: "$survival_study$"
 survival_study_wilderness_desc: "$survival_study_desc$"
 uncorrected_blunders: "Sai Lầm Chưa Sửa Chữa"
 uncorrected_blunders_desc: "Có thể chúng ta đã sơ suất không kiểm tra lại các tính toán của mình."
 maverick_citizens: "Cư Dân Lập Dị"
 maverick_citizens_desc: "Nếu bạn không làm gì sai, thì bạn chẳng có gì phải sợ cả."
 #Các Hình Thức Chính Phủ Tiên Tiến
 #Sự Thuần Khiết
 bio.170.name: "Sự Thuần Khiết: Cải Cách Chính Phủ?"
 bio.170.desc: "Giống loài của chúng ta đang đứng trước ranh giới của một chân trời vĩ đại tiếp theo. Bây giờ, chúng ta phải đưa ra một lựa chọn.\n\nChúng ta sẽ đón nhận sứ mệnh của mình, thanh tẩy huyết thống di truyền và nâng tầm nền văn minh lên những đỉnh cao mới của sự xuất chúng về gen? Hay chúng ta sẽ ghi nhớ những bài học từ quá khứ và tiếp tục tiến bước với hình hài chưa được mài giũa như hiện tại?"
 bio.170.a: "Hãy đón nhận sự thuần khiết, vươn tới những đỉnh cao mới!"
 bio.170.a.tt: "$change_auth_tt$[GetPurityAuthority]"
 bio.170.b: "Chúng ta không cần phải thay đổi cách thức tự quản lý."
 #Nhân Bản
 bio.175.name: "Nhân Bản: Cải Cách Chính Phủ?"
 bio.175.desc: "Giống loài của chúng ta đã bước đến một thời khắc mang tính quyết định. Đã đến lúc phải đưa ra quyết định.\n\nChúng ta sẽ đón nhận sứ mệnh, chế ngự sức mạnh của công nghệ nhân bản, và thay đổi nền văn minh của mình một cách không thể vãn hồi thành một xã hội sao chép hoàn hảo? Hay chúng ta sẽ chắt lọc những bài học từ chặng đường đã qua, và tiếp tục duy trì sự khác biệt không cần thiết của mình?"
 bio.175.a: "Chúng ta coi nhân bản là một phần thiết yếu của tương lai."
 bio.175.a.tt: "$change_auth_tt$[GetCloningAuthority]\n$LEADERS_GAIN_CLONES$"
 bio.175.b: "$bio.170.b$"
 #Đột Biến
 bio.180.name: "Đột Biến: Cải Cách Chính Phủ?"
 bio.180.desc: "Chúng ta đang đứng trước đỉnh sóng của một biên giới sinh học quan trọng. Một lựa chọn có ý nghĩa to lớn đang chờ đợi chúng ta.\n\nChúng ta có thể đón nhận sứ mệnh của mình bằng cách khai thác sức mạnh của sự đột biến sinh học cấp cao, thay đổi nền văn minh của mình một cách không thể vãn hồi thông qua việc chủ ý tiến hóa mã gen của chúng ta. Hoặc, chúng ta có thể ghi nhớ những bài học rút ra từ những cuộc khám phá trong quá khứ và tiếp tục duy trì hình hài bình thường như hiện tại."
 bio.180.a: "Chúng ta có thể trở thành bất kỳ ai và mọi thứ."
 bio.180.a.tt: "$change_auth_tt$[GetMutationAuthority]"
 bio.180.b: "$bio.170.b$"
 #Bầy Đàn
