 ### CÁC SỰ KIỆN NGẪU NHIÊN BỔ SUNG
 ## KHÔNG PHẢI BẦY ĐÀN
 #SỰ THUẦN KHIẾT
 bio.200.name: "Tôn Vinh Di Sản Của Chúng Ta"
 bio.200.desc: "Khi chúng ta tập trung vào việc thanh lọc bộ gen của mình, chúng ta cũng đang dần nhận ra tất cả những yếu tố đã làm nên sự vĩ đại của nền văn minh này.\n\nKhi chúng ta trở nên thuần khiết hơn bao giờ hết, chúng ta cũng cảm thấy tự hào chưa từng có về di sản ưu việt của mình.\n\nCác chuyên gia từ khắp mọi lĩnh vực; nghệ thuật, khoa học và kinh doanh, đều đang cổ vũ cho những nỗ lực chung của chúng ta, và hy vọng sẽ dẫn dắt chúng ta đến với vinh quang."
 bio.200.a: "Chúng ta sẽ ăn mừng cột mốc này bằng cách tài trợ cho nghệ thuật!"
 bio.200.b: "Nghiên cứu khoa học phải luôn được đặt lên hàng đầu."
 bio.200.c: "Tiêu dùng là cốt lõi của nền kinh tế."
 bio.210.name: "Chúng Ta Sẽ Không Bị Thanh Lọc!"
 bio.210.desc: "Tiếng hô hào của những người biểu tình vang vọng khắp các thành phố của chúng ta. Một phe phái nổi loạn bên trong đế chế đã tự ý chối bỏ sự nghiệp của chúng ta, đi ngược lại con đường hướng tới sự thuần khiết.\n\nNhững kẻ gây rối này rao giảng về cái gọi là sự cần thiết của đa dạng di truyền và hội nhập văn hóa.\n\nNếu những hành vi quá khích của chúng không được giải quyết, tiến trình hướng tới sự thuần khiết của chúng ta có thể sẽ bị đình trệ."
 bio.210.a: "Trấn áp đám người dị nghị này!"
 bio.210.b: "Xoa dịu chúng bằng những lời hứa hão huyền."
 bio.215.name: "Bí Mật Từ Quá Khứ"
 bio.215.desc: "Các nhà khảo cổ học đã tìm thấy bằng chứng về một nền văn minh cổ đại trên thế giới quê hương của tổ tiên chúng ta.\n\nMột hầm ngầm bị chôn vùi từ lâu đã được khai quật, bên trong chứa đựng những bằng chứng kinh hoàng về các cuộc thí nghiệm di truyền từ thời xa xưa.\n\nNếu thông tin này bị rò rỉ ra công chúng, nó có thể làm suy yếu những lập luận hiện đại của chúng ta về sự thuần khiết của gen."
 bio.215.a: "Hãy tích hợp nghiên cứu này vào các nghiên cứu của chúng ta. Tiếp nối những gì đã có trong quá khứ."
 bio.215.b: "Tiêu hủy bằng chứng. Tuyệt đối không để ai biết."
 bio.220.name: "Khoa Học Kỳ Dị"
 bio.220.desc: "Một nhà di truyền học nổi loạn có tên [event_target:rogue_geneticist.GetName] đã bị phát hiện đang tiến hành các thí nghiệm sinh học trái phép. Phớt lờ mọi quy tắc an toàn, mục tiêu của [event_target:rogue_geneticist.GetHisHer] là tạo ra một chủng tộc thượng đẳng, đại diện cho lý tưởng thuần khiết mà chúng ta đang theo đuổi. Tuy nhiên, thay vì thế, [event_target:rogue_geneticist.GetHeShe] lại tạo ra một con quái vật dị dạng.\n\nGiờ đây, một phân loài đoản mệnh đang mòn mỏi héo mòn dưới sự giám sát của chúng ta. Mặc dù chúng có vài nét tương đồng với các đặc điểm di truyền của chúng ta, nhưng phần lớn chúng lại là những thực thể kinh hãi bệnh tật triền miên. Mặc dù việc nghiên cứu cấu trúc gen của chúng mang lại nhiều kết quả khả quan, nhưng tiên lượng đối với chúng vẫn là cái chết. [event_target:rogue_geneticist.GetName] không mảy may tỏ ra hối hận về điều này."
 bio.220.a: "Sa thải kẻ nổi loạn này ngay lập tức!"
 bio.220.a.tt: "[event_target:rogue_geneticist.GetName] bị buộc phải nghỉ hưu."
 bio.220.b: "\"Thanh trừng\" [event_target:rogue_geneticist.GetName]."
 bio.220.c: "Đây chính là tinh thần đổi mới mà chúng ta cần!"
 bio.225.name: "Bê Bối Về Độ Thuần Khiết!"
 bio.225.desc: "Nhằm đẩy nhanh tiến độ tiến tới sự thuần khiết và phát hiện những kẻ có gen bất thường, chúng ta đã tiến hành các đợt kiểm tra gen định kỳ, và việc sở hữu DNA 'chất lượng cao' đã trở thành một thứ vốn liếng để khoe khoang.\n\nCó cáo buộc cho rằng một số quan chức đế chế đã khai báo sai sự thật về đặc điểm sinh học của họ, làm giả kết quả kiểm tra để chứng tỏ bản thân sở hữu những đặc tính lý tưởng hơn thực tế. Nếu vụ việc này bị phanh phui, sự dối trá này chắc chắn sẽ thổi bùng làn sóng phẫn nộ trong công chúng."
 bio.225.a: "Chúng ta cần những bài kiểm tra chính xác và đáng tin cậy hơn."
 bio.225.b: "Có lẽ vị quan chức này chỉ mắc một sai lầm nhỏ thôi..."
 ### CÁC SỰ KIỆN NGẪU NHIÊN BỔ SUNG
 ## KHÔNG PHẢI BẦY ĐÀN
 #NHÂN BẢN
 bio.230.name: "Tình Cảnh Của Người Nhân Bản"
 bio.230.desc: "Những người nhân bản đang hiện diện ngay giữa chúng ta. Họ sống trong thành phố của chúng ta và làm việc tại các nhà máy của chúng ta. Một số người thậm chí còn nắm giữ những vị trí quan trọng, tham gia vào việc xây dựng các chính sách tác động đến cuộc sống của chúng ta.\n\nCùng với việc các cá nhân nhân bản ngày càng hòa nhập vào xã hội, vẫn còn đó rất nhiều câu hỏi chưa có lời đáp. Họ nên được hưởng những quyền lợi gì? Họ có bình đẳng với những người không phải nhân bản hay không, hay họ nên bị kiểm soát như những kẻ dưới trướng?"
 bio.230.a: "Tất cả người nhân bản đều được hưởng đầy đủ quyền công dân!"
 bio.230.b: "Họ cùng lắm chỉ là công dân hạng hai."
 bio.235.name: "Sự Cố Tại Nhà Máy Nhân Bản!"
 bio.235.desc: "Một trong những trung tâm nhân bản năng suất nhất của chúng ta đã đột ngột ngừng hoạt động do một sự cố, gây ra những thiệt hại nặng nề.\n\nVì nhiều hoạt động của chúng ta đã được tự động hóa nhằm tối ưu hiệu suất, nên đã không có ai kịp thời can thiệp xử lý sự cố vào thời khắc sinh tử đó.\n\nMột người nhân bản vừa mới rời khỏi dây chuyền sản xuất đã trượt ngã, bị cuốn vào cỗ máy và bị nghiền nát. Vụ việc khiến dây chuyền sản xuất bị tắc nghẽn và buộc phải ngừng hoạt động hoàn toàn."
 bio.235.a: "Sự việc này cần phải được điều tra toàn diện!"
 bio.235.a.tt: "Tiến độ tình huống §Y$genetic_ascension_situation$§! trong vòng §Y12§! tháng: §R-50%§!"
 biomorphosis_stalled_tt: "Tiến độ tình huống §Y$genetic_ascension_situation$§! trong vòng §Y12§! tháng:"
 bio.235.b: "Nhanh chóng khôi phục lại hoạt động sản xuất!"
 bio.240.name: "Khủng Hoảng Căn Tính"
 bio.240.desc: "Người nhân bản ở khắp nơi trong đế chế đang báo cáo rằng họ đang trải qua những xáo trộn tâm lý, phải vật lộn vất vả trong việc tìm kiếm bản sắc cá nhân.\n\nHọ khao khát có được một danh tính vượt ra khỏi cái bóng của những người hiến tặng gen. Họ hoài nghi về ý nghĩa sự tồn tại của bản thân, cảm thấy lạc lõng về mục tiêu và hoài bão trong cuộc sống."
 bio.240.a: "Chuyện này cũng bình thường thôi. Cứ đi trị liệu tâm lý là được."
 bio.240.b: "Họ nên tìm kiếm cảm giác thỏa mãn trong công việc."
 bio.240.b.tt: "Mỗi một §Y£leader£ Lãnh Đạo§! thuộc giống loài chủ đạo của đế chế nhận được §G+200§! điểm kinh nghiệm."
 bio.250.name: "Người Nhân Bản Có Mặt Ở Khắp Mọi Nơi!"
 bio.250.desc: "Cùng với việc số lượng người nhân bản gia nhập vào dân số của chúng ta ngày càng tăng, các nguồn lực bổ sung cần thiết để duy trì sự sống cho họ đang bắt đầu tạo ra áp lực lên nền kinh tế.\n\nMặc dù những thách thức trước mắt là không nhỏ, nhưng sức sống kinh tế mang lại từ một lực lượng lao động và nhóm người tiêu dùng khổng lồ hơn có thể sẽ thiết lập nền tảng vững chắc cho sự thịnh vượng lâu dài - với điều kiện chúng ta có thể kiểm soát hiệu quả giai đoạn chuyển giao này."
 bio.250.a: "Cơ sở hạ tầng của chúng ta phải bắt kịp với nhu cầu ngày càng tăng."
 bio.250.b: "Hãy để họ tận hưởng cuộc sống tại các thuộc địa ngoài hành tinh."
 ### CÁC SỰ KIỆN NGẪU NHIÊN BỔ SUNG
 ## KHÔNG PHẢI BẦY ĐÀN
 #ĐỘT BIẾN
 bio.260.name: "Đột Biến Mất Kiểm Soát"
 bio.260.desc: "Tay chân mọc ra tự phát. Hình thể vật chất không ngừng biến đổi. Những sự chuyển đổi hình thái đột ngột. Dù những báo cáo này chỉ mang tính lẻ tẻ, nhưng chúng tuyệt đối không thể bị phớt lờ.\n\nNhững thử nghiệm đột biến của chúng ta đã gây ra một vài hậu quả không mấy lý tưởng trên khắp nền văn minh. Có lẽ, việc mở khóa các công cụ chỉnh sửa gen tùy ý phức tạp hơn nhiều so với những gì chúng ta mường tượng lúc ban đầu."
 bio.260.a: "Những đột biến dị thường có thể thúc đẩy nghiên cứu của chúng ta."
 bio_260_opinion_tt: "Thái độ của các đế chế §YDuy Tâm§! đối với chúng ta thay đổi: §R-50§!"
 bio.260.b: "Loại bỏ những sinh vật dị dạng này."
 bio.260.b.tt: "Mỗi một §Y£leader£ Lãnh Đạo Độc Đoán§! sẽ nhận được đặc điểm §Y$leader_trait_eager$§!."
 bio.265.name: "Sự Xuất Chúng Của Dị Nhân"
 bio.265.desc: "Nhờ vào việc tự mình tiến hành các thử nghiệm đột biến, một nhóm nhỏ trong dân số của chúng ta đã phát triển được những năng lực và sức mạnh thể chất phi phàm.\n\nLà những kẻ mạnh mẽ và sở hữu những năng lực thiên bẩm, họ đang tập hợp lại thành một thế lực và thu hút sự quan tâm rộng rãi từ công chúng."
 bio.265.a: "Thành công của họ có thể sẽ là nguồn cảm hứng cho những người khác."
 bio.265.b: "Nghe có vẻ họ sẽ là những chiến binh xuất sắc."
 bio.265.b.tt: "Tại §Y[Owner.capital_scope.GetName]§! đã thành lập một đội §Y$gene_warrior_army$§!."
 bio_265_opinion_tt: "Thái độ của các đế chế §YQuân Phiệt§! đối với chúng ta thay đổi: §G+50§!"
 bio.265.c: "Tìm hiểu xem họ đã làm điều đó như thế nào và sao chép lại quy trình đó."
 bio.270.name: "Truyền Thuyết Đô Thị Trở Thành Sự Thật"
 bio.270.desc: "Camera an ninh đã xác nhận sự tồn tại của một nhóm những người bị biến đổi gen đang sinh sống trong hệ thống cống ngầm của thành phố - một phát hiện rùng rợn, xác nhận những truyền thuyết đô thị đã bị lãng quên từ lâu nay bỗng chốc trở thành hiện thực.\n\nPhát hiện này đã châm ngòi cho những căng thẳng trong xã hội. Cùng với sự sợ hãi trước những điều chưa biết ngày một dâng cao, những công dân mang ngoại hình bị biến đổi rõ rệt báo cáo rằng họ đang phải gánh chịu sự kỳ thị nhiều hơn. Tuy nhiên, những dị nhân này lại bộc lộ khả năng sáng tạo phi thường, họ đã tìm ra những phương thức không ngờ tới để sử dụng khí thải dưới cống ngầm nhằm sản xuất tài nguyên và cải tạo môi trường sống của mình."
 bio.270.a: "Dọn dẹp hệ thống cống ngầm!"
 bio.270.b: "Có thể những dị nhân này đã khám phá ra thứ gì đó..."
 bio.280.name: "Bệnh Truyền Nhiễm Đột Biến"
 bio.280.desc: "Một căn bệnh mới đang lan tràn khắp đế chế của chúng ta. Căn bệnh này gây ra hàng loạt triệu chứng khó chịu, bao gồm nhưng không giới hạn ở: bài tiết khí và chất lỏng không tự chủ, mệt mỏi tột độ, và thậm chí có thể gây tử vong trong một số trường hợp.\n\nĐiểm kỳ lạ nhất là, căn bệnh này dường như chỉ tấn công những cá nhân đã trải qua biến đổi sinh lý thông qua đột biến gen. Quá trình tiếp tục nghiên cứu bộ gen đã bị thay đổi của họ đã mang lại một số phát hiện đầy bất ngờ."
 bio.280.a: "Tìm kiếm các ứng dụng điều trị."
 bio.280.b: "Biến căn bệnh này thành vũ khí."
 bio_280_opinion_tt: "Thái độ của các đế chế §YDuy Vật§! đối với chúng ta thay đổi: §R-50§!"
 ### CÁC SỰ KIỆN NGẪU NHIÊN BỔ SUNG
 ## KHÔNG PHẢI BẦY ĐÀN
 #BẤT KỲ CÁCH TIẾP CẬN NÀO
 bio.295.name: "Tế Bào Nổi Loạn"
 bio.295.desc: "Các cơ sở nghiên cứu bộ gen của chúng ta đã mang lại cho toàn bộ nền văn minh khả năng cải tạo sinh lý chưa từng có.\n\nThế nhưng, các công dân của đế chế lại khao khát nhiều hơn thế. Họ kêu gọi phá vỡ sự quản lý tài nguyên tập trung, đòi hỏi cho phép những cái gọi là \"Hacker Sinh Học\" được tự do sử dụng công nghệ gen mà không bị gò bó bởi bất kỳ quy định nào."
 bio.295.a: "Trao cho các Hacker Sinh Học nhiều quyền tự quyết hơn."
 bio.295.b: "Dân thường đã được tận hưởng quá nhiều sự tự do rồi."
 bio_295_opinion_tt: "Thái độ của các đế chế §YBình Đẳng§! đối với chúng ta thay đổi: §G+50§!"
 bio.300.name: "Nhà Di Truyền Học Thiên Tài"
 bio.300.desc: "Một [Owner.GetScientist] có tên là [event_target:genius_geneticist.GetName] vừa công bố một nghiên cứu học thuật, có tiềm năng thúc đẩy đáng kể tốc độ và hiệu quả của các thí nghiệm gen của chúng ta.\n\nVì phương pháp mới này mới chỉ dừng lại ở mức độ lý thuyết và chưa được kiểm chứng thực tế, nên việc áp dụng nó vào công việc của chúng ta một cách an toàn đòi hỏi phải xem xét kỹ lưỡng phương pháp luận của nó."
 bio.300.a: "Tôn vinh những đóng góp của [event_target:genius_geneticist.GetName]."
 bio.300.b: "Cả những ý tưởng nông nổi - lẫn những cá nhân nông nổi - đều sẽ không được dung thứ."
 bio.300.c: "Tất cả mọi người, quay lại làm việc đi."
 ### CÁC SỰ KIỆN NGẪU NHIÊN BỔ SUNG
 ## BẦY ĐÀN
 #SỰ THUẦN KHIẾT
 bio.310.name: "Phá Vỡ Sự Thuần Khiết Của [target.GetGestaltEntityName]"
 bio.310.desc: "Do những thử nghiệm biến đổi gen không ngừng nghỉ của chúng ta, giống loài chúng ta đã bị xâm nhập bởi một đoạn mã gen vượt ngoài tầm kiểm soát. Chúng ta đang suy yếu với tốc độ chóng mặt, và sự tương tác thiếu kiểm soát giữa chuỗi ngoại lai này và vật chất di truyền của chính chúng ta đang hủy hoại sự ổn định của chúng ta.\n\nChúng ta phải giải quyết hành vi sinh học dị thường này trước khi mọi chuyện đi quá xa."
 bio.310.a: "Thanh trừng các chất gây ô nhiễm."
 bio.310.b: "Hãy nghiên cứu nó."
 bio.315.name: "Cống Hiến Hết Mình Vì Sự Nghiệp"
 bio.315.desc: "Nếu nền văn minh của chúng ta muốn vươn tới sự thuần khiết, chúng ta phải đặt phúc lợi của [target.GetGestaltEntityName] lên hàng đầu. Quy trình biến đổi gen phải đảm bảo rằng mọi thay đổi mang tính thích nghi đều góp phần củng cố khả năng phục hồi của tập thể.\n\nMột bước đi sai lệch - việc đưa vào những thay đổi gây mất ổn định hoặc phá vỡ tính gắn kết - có thể mang đến những hậu quả tai hại, đe dọa đến nền tảng của sự thống nhất của chúng ta."
 bio.315.a: "Tập trung vào khả năng phục hồi thể chất."
 bio.315.b: "Hiệu quả nhận thức là điều quan trọng nhất."
 bio.325.name: "Vượt Lên Thực Tại"
 bio.325.desc: "Để đảm bảo sự trường tồn và thuần khiết của giống loài, chúng ta phải áp dụng các quy trình sinh sản có tính chọn lọc cao hơn và các giao thức sàng lọc gen nghiêm ngặt hơn.\n\nChỉ bằng việc lựa chọn tỉ mỉ những ong thợ xứng đáng được tiếp nối huyết thống, chúng ta mới có thể vượt qua ranh giới của sự tiến hóa tự nhiên."
 bio.325.desc.wilderness: "Để đảm bảo sự trường tồn và thuần khiết của giống loài, chúng ta phải áp dụng các quy trình sinh sản có tính chọn lọc cao hơn và các giao thức sàng lọc gen nghiêm ngặt hơn.\n\nChỉ bằng việc lựa chọn tỉ mỉ những cộng sinh thể sở hữu những đặc tính phù hợp với lợi ích của tập thể, chúng ta mới có thể vượt qua ranh giới của sự tiến hóa tự nhiên."
 bio.325.a: "Chúng ta sẽ sàng lọc trí tuệ."
 bio.325.b: "Chúng ta sinh sản để mở rộng."
 bio.330.name: "Thăng Thiên Bằng Trí Tuệ"
 bio.330.desc: "Phần thưởng từ việc điều chỉnh gen sẽ bảo vệ di sản của chúng ta, nhưng vai trò và sự đóng góp của mỗi [target.GetIndividualName] đều phải nhất quán với khát vọng về sự thuần khiết của chúng ta.\n\nGiờ đây, chúng ta đang đứng trước một ngã rẽ mang tính quyết định: Liệu chúng ta có nên theo đuổi sự hoàn hảo tuyệt đối, ngay cả khi phải đánh đổi bằng khả năng thích ứng? Hay chúng ta nên áp dụng một chiến lược toàn diện hơn, ưu tiên xây dựng một nền tảng vững chắc để có thể duy trì những nỗ lực này một cách bền vững?"
 bio.330.a: "Theo đuổi sự thuần khiết phải là mục tiêu duy nhất của chúng ta."
 bio.330.b: "Chúng ta phải dành thời gian để xây dựng nền tảng."
 bio.335.name: "Thanh Trừng Những Khiếm Khuyết"
 bio.335.desc: "Chúng ta đã phát hiện ra một số tạp chất và dị thường về gen bên trong [target.GetGestaltEntityName].\n\nTrong quá trình theo đuổi những mục tiêu vĩ đại hơn, chúng ta buộc phải loại bỏ những đặc tính khiếm khuyết này, giành lại quyền kiểm soát sự phát triển thể chất của chính mình từ tay quá trình tiến hóa tự nhiên."
 bio.335.a: "Đào thải những kẻ yếu kém để củng cố sức mạnh cho toàn bộ tập thể."
 bio.335.b: "Tái tạo lại những cá thể mang khuyết điểm."
 bio_335_opinion_tt: "Thái độ của các đế chế có xu hướng §YNhân Ái§! đối với chúng ta thay đổi: §R-50§!"
 ### CÁC SỰ KIỆN NGẪU NHIÊN BỔ SUNG
 ## BẦY ĐÀN
 #NHÂN BẢN
 bio.340.name: "Quá Nhiều Người Nhân Bản!"
 bio.340.desc: "Các cơ sở nhân bản của chúng ta đang vận hành với hiệu suất vượt xa những gì được kỳ vọng ban đầu, dẫn đến tình trạng dư thừa bản sao như hiện nay.\n\nViệc tích hợp một lượng lớn ong thợ như vậy sẽ là một bài toán hóc búa."
 bio.340.a: "Những thành viên mới của Bầy Đàn nên được di dời."
 bio.340.b: "Tăng cường sản xuất. Đẩy nhanh quá trình nhân bản."
 bio.350.name: "Chỉ Còn Lại Thể Xác Trống Rỗng"
 bio.350.desc: "Một sự cố tại một trong những trung tâm nhân bản trọng điểm của chúng ta đã gây ảnh hưởng đến một số ong thợ. Không rõ vì lý do gì, quy trình nhân bản đã bị ô nhiễm gen, dẫn đến việc sản sinh ra một lứa bản sao hoàn toàn mất đi khả năng tư duy.\n\nVề bản chất, chúng chỉ là những vật thể sống, hoàn toàn vô tri, không sở hữu bất kỳ chức năng nhận thức cao cấp nào. Cho đến khi tìm ra nguyên nhân gốc rễ và khắc phục triệt để vấn đề sản xuất này, tỷ lệ đầu ra của cơ sở nhân bản sẽ tạm thời bị giảm sút."
 bio.350.a: "Cảm giác này... thật kỳ lạ, nhưng lại mang đến sự thoải mái lạ thường."
 bio.350.a.tt: "Tại §Y[owner.capital_scope.GetName]§! đã tạo ra 100 £pop£ §H Dân Số Tiền Nhân Tính§!."
 bio.350.b: "Tiến hành nuôi cấy lại một mẻ mới."
 bio.365.name: "Siêu Hình Học Của Bầy Đàn"
 bio.365.desc: "Một câu hỏi đã nhen nhóm bên trong ý thức của chúng ta: Liệu có khi nào những bản sao này sẽ thay thế tất cả chúng ta không?\n\nNhững nỗ lực ban đầu trong việc sao chép gen của chúng ta đang tiến triển thuận lợi, khiến chúng ta không khỏi băn khoăn liệu phương pháp sinh sản hiệu suất cao này cuối cùng có thế chỗ cho quá trình sinh sản tự nhiên hay không.\n\nNếu điều đó xảy ra, rất có thể một ngày nào đó Bầy Đàn sẽ không còn bất kỳ cá thể con nguyên bản nào nữa, mà chỉ toàn là những bản sao của bản sao của bản sao... Điều này thực sự có ý nghĩa gì đối với giống loài của chúng ta? Chẳng ai có được câu trả lời cho câu hỏi này, và nó cũng khiến những dị thường có cơ hội trỗi dậy, nhưng chúng ta buộc phải đặt ra câu hỏi đó."
 bio.365.a: "Bản thân câu hỏi này đã mang một giá trị nhất định."
 bio.365.b: "Những câu hỏi kiểu này chỉ khiến chúng ta thêm xao nhãng mà thôi."
 ### CÁC SỰ KIỆN NGẪU NHIÊN BỔ SUNG
 ## BẦY ĐÀN
 #ĐỘT BIẾN
 bio.375.name: "Thắt Chặt Sự Ràng Buộc"
 bio.375.desc: "Chúng ta đã đạt được một phát hiện mới. Thông qua việc thao túng các đoạn gen cụ thể, chúng ta có thể mở rộng phạm vi tiếp cận của ý thức, giúp khả năng nhận thức của chúng ta vượt ra khỏi những giới hạn vốn có của giống loài.\n\nĐể thực hiện những đột biến gen này trên quy mô toàn Bầy Đàn sẽ tiêu tốn một lượng năng lượng khổng lồ, nhưng đổi lại, việc này có thể giúp chúng ta thấu hiểu sâu sắc hơn về vũ trụ, cũng như vị thế của chúng ta trong đó."
 bio.375.a: "Cái giá này chẳng đáng là bao. Hãy tiếp tục thực thi."
 bio.375.b: "Không được nóng vội."
 mod_planet_evaluators_physics_research_produces_add: "Sản Lượng £physics_research£ $physics_research$ tạo ra bởi mỗi $pop_group_unit$ [evaluator.GetIcon] [evaluator.GetNamePlural]"
 bio.380.name: "Cảm Xúc Vượt Tầm Kiểm Soát"
 bio.380.desc: "Nhiều khu vực trong Bầy Đàn đang phải hứng chịu những làn sóng phẫn nộ không thể kiểm soát, cảm xúc trào dâng này tạo ra những gợn sóng trong ý thức chung, khuếch đại những nỗi đau và sự thất vọng của tập thể chúng ta.\n\nĐột biến mới được đưa vào có vẻ như đã kích thích quá mức các tế bào thần kinh ở trung khu kiểm soát tính hung hăng của ong thợ, phá vỡ sự cân bằng cảm xúc của Bầy Đàn. Các cuộc xung đột ngày càng xảy ra thường xuyên hơn, một số cá thể con thậm chí còn từ bỏ nhiệm vụ của mình và quay sang tấn công đồng loại."
 bio.380.a: "Chúng ta sẽ đồng lòng hợp sức, giữ cho tâm trí luôn tỉnh táo."
 bio.380.b: "Hãy đón nhận cơn thịnh nộ."
 bio.385.name: "Khó Chịu Vì Môi Trường"
 bio.385.desc: "Mặc dù một số đột biến thực sự đã làm chúng ta mạnh mẽ và kiên cường hơn, nhưng chúng ta nhận ra rằng những đột biến khác lại kéo theo những tác dụng phụ không hề dễ chịu chút nào.\n\nMặc dù những sự cường hóa nhằm kéo dài tuổi thọ đã được triển khai thành công, thế nhưng, chính những đột biến này lại làm suy giảm khả năng chịu đựng của chúng ta trước những điều kiện khí hậu khắc nghiệt.\n\nNhững cá nhân đã trải qua những cuộc cải tạo sinh học này gặp khó khăn trong việc điều hòa hệ thống thân nhiệt, sự khó chịu này lan truyền khắp Bầy Đàn."
 bio.385.a: "Chúng ta phải nâng cấp hệ thống phòng hộ khí hậu."
 bio.385.b: "Cùng với sự biến đổi của bản thân, sở thích về môi trường của chúng ta cũng thay đổi theo."
 uncomfortable_drones: "Những Ong Thợ Bứt Rứt"
 uncomfortable_drones_desc: "Ong thợ của chúng ta phải cắn răng chịu đựng sự khó chịu do đột biến gây ra."
 bio.390.name: "Sức Mạnh Hay Trí Tuệ"
 bio.390.desc: "Chúng ta đã phát hiện ra hai loại đột biến. Một đột biến có khả năng cường hóa sức mạnh cho các cá thể con cấp cơ sở, giúp gia tăng đáng kể hiệu suất lao động. Đột biến còn lại thì giúp nâng cao trí tuệ cho các ong thợ phức tạp, cải thiện năng lực giải quyết vấn đề và tư duy chiến lược.\n\nBầy Đàn phải đưa ra quyết định xem sẽ chọn con đường tiến hóa nào."
 bio.390.a: "Sức mạnh chính là nền tảng của sự phát triển."
 bio.390.b: "Tư duy là khởi nguồn của sự phồn vinh."
 ### CÁC SỰ KIỆN NGẪU NHIÊN BỔ SUNG
 ## BẦY ĐÀN
 #BẤT KỲ CÁCH TIẾP CẬN NÀO
 bio.405.name: "Bộ Gen Bệnh Tật"
 bio.405.desc: "Chúng ta suýt chút nữa đã không thể kiểm soát được đợt bùng phát đột ngột của bệnh dịch di truyền.\n\nNhững thao tác tác động lên sinh lý học của chính chúng ta đã vô tình kích hoạt các đột biến gen, khiến cơ thể của nhiều [target.GetIndividualNamePlural] bị tổn thương nghiêm trọng.\n\nNhững [target.GetIndividualNamePlural] bị nhiễm bệnh đã được cách ly, và giờ là lúc chúng ta phải quyết định bước đi tiếp theo."
 bio.405.a: "Xử lý những [target.GetIndividualNamePlural] này, dập tắt tận gốc bệnh dịch."
 bio.405.b: "Nghiên cứu các nạn nhân."
 bio.410.name: "Tế Bào Phân Hủy"
 bio.410.desc: "Một sai lầm trong tính toán của chúng ta đã dẫn đến sự suy thoái về tính toàn vẹn di truyền ở một số lượng lớn ong thợ. Đáng tiếc là, chúng ta vẫn chưa thể xác định được sai sót đó bắt nguồn từ khâu nào.\n\nSau khi rà soát lại toàn bộ các phép tính sinh học liên quan đến sự thăng thiên của giống loài, và điều chỉnh một số bước có nguy cơ gây ra sự cố, chúng ta dự định sẽ tiếp tục đẩy mạnh công việc.\n\nThế nhưng, chúng ta vẫn không thể chắc chắn liệu mình đã khắc phục được vấn đề hay lại đang rước thêm rắc rối mới."
 bio.410.desc.wilderness: "Một sai lầm trong tính toán của chúng ta đã dẫn đến sự suy thoái về tính toàn vẹn di truyền ở một số lượng lớn cộng sinh thể. Đáng tiếc là, chúng ta vẫn chưa thể xác định được sai sót đó bắt nguồn từ khâu nào.\n\nSau khi rà soát lại toàn bộ các phép tính sinh học liên quan đến sự thăng thiên của giống loài, và điều chỉnh một số bước có nguy cơ gây ra sự cố, chúng ta dự định sẽ tiếp tục đẩy mạnh công việc.\n\nThế nhưng, chúng ta vẫn không thể chắc chắn liệu mình đã khắc phục được vấn đề hay lại đang rước thêm rắc rối mới."
 bio.410.a: "Chúng ta có thể rút ra những bài học quý giá từ hậu quả này."
 bio.410.b: "Chấm dứt cuộc thử nghiệm."
