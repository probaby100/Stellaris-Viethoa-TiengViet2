 ### TÌNH HUỐNG CHUYỂN HÓA SINH HỌC (THĂNG THIÊN DI TRUYỀN)
 ## TÌNH HUỐNG CỦA ĐẾ CHẾ THƯỜNG
 #THIẾT LẬP / MỞ ĐẦU
 genetic_ascension_situation: "Tái Tạo Gen"
 genetic_ascension_situation_type: "$genetic_ascension_situation$"
 genetic_ascension_situation_desc: "Chọn lọc tự nhiên và biến đổi gen không còn có thể cản bước chúng ta làm chủ quy luật sinh học nữa. Với tư cách là một nền văn minh, chúng ta đang đứng trước ngưỡng cửa định hình lại tương lai của giống loài. [Owner.Species.GetFleshTypeCyberCreed] mềm dẻo như đất sét, và chúng ta sẽ là những nhà điêu khắc cho chính mình."
 genetic_ascension_situation_monthly_change_tooltip: "Các nhà di truyền học của chúng ta đang không ngừng đẩy mạnh công tác nghiên cứu."
 genetic_ascension_situation_outcome: "Chúng ta sẽ giải phóng toàn bộ tiềm năng của kỹ thuật thao túng gen, đảm bảo ưu thế tuyệt đối cho giống loài của mình.\n\nChúng ta sẽ quyết định hình thái tối thượng của công cuộc tái tạo gen."
 genetic_ascension_situation_pause_desc: "Tạm Dừng Tình Huống"
 genetic_ascension_approach_selected: "$TRIGGER_FAIL$Chúng ta đã đưa ra lựa chọn cho giai đoạn này."
 situation_gene_tailoring_needed_desc: "$TRIGGER_FAIL$Thiếu công nghệ ['concept_gene_tailoring']"
 mod_biomorphosis_progress_mult: "Tiến Độ Hàng Tháng $genetic_ascension_situation$"
 #SỰ KIỆN THEO GIAI ĐOẠN
 bio.5.name: "Bản Tính Có Thể Dời Đổi" #GIAI ĐOẠN MỘT
 bio.5.desc.no_options: "Để đẩy nhanh quá trình tiến hóa, chúng ta phải dứt khoát chọn lấy một con đường để tự định nghĩa bản thân. Khi bắt đầu nhận ra toàn bộ tiềm năng của mình, chúng ta nhận thức sâu sắc rằng, những nỗ lực này có thể thay đổi tận gốc rễ bản chất của chúng ta.\n\nThiết kế quá trình tiến hóa là một nhiệm vụ mang ý nghĩa to lớn. Những thay đổi của ngày hôm nay sẽ định hình lại tương lai của chúng ta."
 bio.5.desc.has_options: "$bio.5.desc.no_options$\n\nĐể bắt đầu hành trình tự hoàn thiện, giờ đây chúng ta phải quyết định bước chân đầu tiên sẽ hướng về đâu."
 bio.5.a: "Con đường thuần khiết."
 bio.5.b: "Con đường nhân bản."
 bio.5.c: "Con đường đột biến."
 bio.10.name: "Bước Ngoặt" #GIAI ĐOẠN HAI
 bio.10.desc.no_options: "Thiết kế quá trình tiến hóa là một nhiệm vụ mang ý nghĩa to lớn. Giờ đây, chúng ta đã nắm giữ hiểu biết sâu sắc hơn về các đặc điểm di truyền, quá trình sinh sản và giải trình tự gen.\n\nĐỉnh cao của sự tiến bộ đang ở ngay trước mắt. Chỉ trong vài năm ngắn ngủi nữa, chúng ta sẽ hiện thực hóa trọn vẹn mọi tiềm năng của giống loài mình."
 bio.10.desc.has_options: "$bio.10.desc.no_options$\n\nTuy nhiên, vào lúc này, chúng ta sẽ tiếp tục vững bước trên con đường đã chọn, hoặc thay đổi trọng tâm cho giai đoạn phát triển tiếp theo."
 bio.10.a: "Tập trung vào sự thuần khiết."
 bio.10.b: "Tập trung vào sự nhân bản."
 bio.10.c: "Tập trung vào sự đột biến."
 bio.15.name: "Ngã Ba Tiến Hóa" #GIAI ĐOẠN BA
 bio.15.desc.no_options: "Những nỗ lực đã đưa chúng ta đến ranh giới của một cuộc cải tổ vĩ đại. Chúng ta sẽ sớm phải đưa ra những quyết định mang tính bước ngoặt về con đường phía trước, từ đó hiện thực hóa trọn vẹn tiềm năng tiến hóa của mình."
 bio.15.desc.has_options: "$bio.15.desc.no_options$\n\nLại một lần nữa, chúng ta cần phải xác định lại phương hướng trọng tâm."
 bio.15.a: "Chúng ta chọn sự thuần khiết."
 bio.15.b: "Chúng ta sẽ chế ngự công nghệ nhân bản."
 bio.15.c: "Đột biến sẽ dẫn lối chúng ta đến tương lai."
 genetic_ascension_approach_purity: "Thuần Khiết"
 genetic_ascension_approach_cloning: "Nhân Bản"
 genetic_ascension_approach_mutation: "Đột Biến"
 genetic_ascension_approach_purity_desc: "Chúng ta sẽ tập trung vào việc duy trì sự thuần khiết."
 genetic_ascension_approach_cloning_desc: "Nghiên cứu về công nghệ nhân bản có thể thúc đẩy sự phát triển của chúng ta."
 genetic_ascension_approach_mutation_desc: "Tương lai của chúng ta nằm ở những đột biến gen."
 bio.20.name: "Con Đường Đã Chọn" #GIAI ĐOẠN CUỐI - CHỌN NHÁNH TRUYỀN THỐNG
 bio.20.desc: "Dù là phấn đấu vươn tới hình thái thuần khiết nhất của bản thân, trải bước trên con đường thành công bằng công nghệ nhân bản, hay thông qua những đột biến gen có chủ đích để nâng cấp bản thân, sau thời khắc này, chúng ta sẽ dấn thân không ngần ngại vì những lựa chọn của chính mình."
 bio.20.desc.evopred: "Bản chất của chúng ta luôn mang tính dễ uốn nắn. Chúng ta là dạng sống phức tạp nhất trong vũ trụ, và nhờ vào những nghiên cứu của mình, chúng ta sẽ không ngừng thay đổi.\n\nTương lai luôn hỗn mang, và đó chính xác là những gì chúng ta cần."
 bio.20.a: "Chúng ta sẽ thấu hiểu chân lý của sự thuần khiết."
 bio.20.b: "Chúng ta sẽ dùng công nghệ nhân bản để tiến tới thành công."
 bio.20.c: "Chúng ta sẽ chế ngự sức mạnh của sự đột biến."
 #Sự Kiện Ngẫu Nhiên
 bio.50.name: "Một Số Kẻ Bình Đẳng Hơn Những Kẻ Khác"
 bio.50.desc: "Do chúng ta quá chú trọng vào sự thuần khiết của gen, những công dân nhận được buff đang bắt đầu coi bản thân sinh ra đã ưu việt hơn những người khác. Với tư tưởng bề trên này, họ yêu cầu thời gian làm việc ngắn hơn, nhiều tiện nghi hơn và nhiều quyền lực chính trị hơn. Những cuộc tụ tập ngày càng gay gắt của họ đang gây ra những rạn nứt xã hội nghiêm trọng."
 bio.50.a: "Đàn áp những kẻ biểu tình."
 bio.50.b: "Yêu cầu của họ cũng có lý."
 bio.55.name: "Phân Bào Xã Hội"
 bio.55.desc: "Các bản tin tức tràn ngập những lời lẽ gây chia rẽ, những bất đồng đang xé nát xã hội. Những cá nhân mang gen cải tiến có được nhiều cơ hội hơn, từ đó làm nảy sinh một cuộc đấu tranh giai cấp mới.\n\nNhững người ủng hộ việc cường hóa gen tin rằng họ đại diện cho tương lai của giống loài, trong khi phe truyền thống lại cho rằng chúng ta đã đi quá xa vào những lĩnh vực đi ngược lại với tự nhiên."
 bio.55.a: "Những cá nhân ưu việt sẽ tạo ra một thế giới ưu việt."
 bio.55.b: "Có lẽ nên để người dân của chúng ta bình tâm lại."
 bio.60.name: "Chênh Lệch Nồng Độ Axit"
 bio.60.desc: "Ở một vài ngành nghề, việc lạm dụng các bài kiểm tra độ thuần khiết ngày càng trở nên phổ biến. Những cá nhân được đánh giá là có cấu trúc gen ưu việt hơn sẽ nhận được sự ưu ái trong công việc, giáo dục, và được đặc cách giao cho những vị trí dễ dàng thăng tiến quyền lực.\n\nMặc dù một số người lập luận rằng các cá nhân được cường hóa sinh học thực sự mạnh khỏe hơn, nhưng những người khác lại cho rằng tư duy này đang gây ra sự phân biệt đối xử bất công đối với những người không muốn hoặc không thể thay đổi bộ gen của mình để theo đuổi sự hoàn hảo di truyền."
 bio.60.a: "Chúng ta phải đảm bảo cơ hội bình đẳng cho tất cả mọi người."
 bio.60.b: "Đây gọi là sự sinh tồn của kẻ thích nghi tốt nhất."
 bio.65.name: "Anh Hùng Và Kẻ Phản Diện"
 bio.65.desc: "Sự theo đuổi sự thuần khiết của chúng ta đã khích lệ một số người dám dấn thân đóng vai trò nổi bật trong việc bảo vệ an ninh công cộng. Nhờ sở hữu sức mạnh, sự nhanh nhẹn và sức bền vượt trội, một nhóm nhỏ những người hành hiệp trượng nghĩa đã tự phong mình thành những người hùng, tự thay mặt pháp luật hành đạo trong chính [owner.species.GetHandNamePlural] của mình.\n\nTuy nhiên, thứ lòng dũng cảm mới mẻ này không phải là không bị thách thức. Trong bóng tối, những đối thủ với sức mạnh ngang ngửa đang trỗi dậy, mang theo những mưu đồ đen tối nhằm thiết lập lại thế cân bằng sức mạnh. Cuộc đụng độ giữa hai phe phái đã gây ra những thiệt hại nghiêm trọng về tài sản, thậm chí còn đe dọa đến tính mạng của dân thường."
 bio.65.a: "Đường phố của chúng ta không cần những kẻ tự thi hành án."
 bio.65.b: "Cứ để mặc họ chém giết lẫn nhau."
 MAVERICK_CITIZENS_MOD: "Mỗi 100 [enforcer.GetIcon] §Y[enforcer.GetNamePlural]§! sản xuất §G+2§! $r_stability$ và §G+2§! $r_unity$."
 bio.66.name: "Giới Hạn Siêu Năng Lực"
 bio.66.desc: "Hoạt động của các cá nhân sở hữu siêu năng lực đã bị cấm đoán, giờ đây họ phải chịu sự quản lý của những quy định nghiêm ngặt. Chúng ta đang dốc sức giám sát và ngăn chặn những hoạt động này.\n\nTrong khi chúng ta nỗ lực đảm bảo họ chỉ dùng sức mạnh của mình để phục vụ đế chế, cả những người có siêu năng lực và những người không được cường hóa đều cảm nhận được nỗi sợ hãi và sự khinh miệt ngày càng gia tăng. Người dân của chúng ta đang bị chia rẽ sâu sắc về vấn đề này."
 bio.66.a: "Thành lập lực lượng siêu năng lực."
 bio.66.b: "Hỗ trợ các nhóm yếu thế tái hòa nhập cộng đồng."
 bio.67.name: "Phụ Thuộc Siêu Năng Lực"
 bio.67.desc: "Việc chúng ta ngày càng phụ thuộc vào những người hành hiệp trượng nghĩa được cường hóa gen đã trở thành một con dao hai lưỡi. Mặc dù những cá nhân này mang lại cảm giác an toàn và thịnh vượng, nhưng chúng ta cũng nhận thức rõ mức độ phụ thuộc của mình vào họ.\n\nDù người dân mang lòng biết ơn, nhưng giờ đây họ bắt đầu phớt lờ các quy trình tư pháp và quan chức hành chính, quay sang tìm kiếm sự chỉ dẫn và hỗ trợ từ những người có siêu năng lực này. Ranh giới giữa người hùng và chính phủ đã trở nên nhạt nhòa. Quyền lực đang đứng trên một điểm cân bằng vô cùng mong manh."
 bio.67.a: "Thành lập hội đồng những người có siêu năng lực!"
 bio.67.b: "Hạn chế sự can dự của những \"người hùng\" này vào việc nước."
 bio.70.name: "Một Hơi Thở, Hai Bản Thể"
 bio.70.desc: "Một nhà lãnh đạo kiệt xuất, nổi danh khắp thiên hà nhờ vào thái độ làm việc không biết mệt mỏi, vừa bị phanh phui sự thật: thực chất họ không phải là một người, mà là hai người.\n\nSự thật phơi bày rằng, vị lãnh đạo này đã tạo ra một bản sao hoàn hảo, cho phép cả hai luân phiên làm việc. Trong khi một bản sao bận rộn xử lý công vụ và giải quyết các thủ tục hành chính, thì bản sao còn lại có thể âm thầm nghỉ ngơi và hồi phục sức khỏe.\n\nTiết lộ này đã tạo nên một làn sóng chấn động trong giới chính trị, làm dấy lên những hoài nghi về bản chất của sự lãnh đạo và giới hạn đạo đức của công nghệ nhân bản."
 bio.70.a: "Đây là một cách ứng dụng công nghệ nhân bản hiệu quả."
 bio.70.b: "Cách chức cả hai vì hành vi gian dối."
 bio.75.name: "Bản Sao Nổi Dậy"
 bio.75.desc: "Việc ủy thác sản xuất bản sao với mục đích thu hoạch nội tạng đã làm nảy sinh vô vàn vấn đề. Một số bản sao đã bộc lộ khả năng nhận thức rõ rệt, và đang chống đối bằng cách tuyệt thực kéo dài.\n\nMặc dù nhiều người cho rằng sức khỏe và tuổi thọ của bản thể gốc phải được đặt lên hàng đầu, nhưng cũng có những người khác lên tiếng bảo vệ quan điểm rằng mọi thực thể có khả năng tư duy đều có quyền tự chủ cá nhân. Vấn đề gây tranh cãi này hiện đang là tâm điểm của những cuộc tranh luận vô cùng gay gắt."
 bio.75.a: "Chấm dứt việc cấy ghép nội tạng."
 bio.75.b: "Quyền lợi của bản thể gốc là tối thượng."
 bio.80.name: "Khó Khăn Trong Việc Chứng Minh"
 bio.80.desc: "Các cơ quan thực thi pháp luật đang rơi vào thế tiến thoái lưỡng nan. Dù tỷ lệ tội phạm ở thủ đô của chúng ta đang gia tăng, nhưng số lượng thủ phạm bị đưa ra ánh sáng công lý lại thấp hơn bao giờ hết. Ngày càng có nhiều nghi phạm bào chữa cho bản thân bằng cách đổ lỗi cho các bản sao của chúng.\n\nĐối với những vụ án không bị bắt quả tang tại trận, việc chứng minh tội trạng của thủ phạm gần như là bất khả thi. Một số quan chức tư pháp hiện đang kêu gọi bãi bỏ hầu hết các tội danh liên quan đến hành vi phạm pháp trên thực tế."
 bio.80.a: "Tăng cường hệ thống giám sát của chúng ta."
 bio.80.b: "Càng ít luật lệ, càng ít tội phạm."
 bio.85.name: "Giống Nhau Đến Kinh Ngạc"
 bio.85.desc: "Một cơ sở nhân bản quy mô lớn hoạt động trái phép vừa bị phát hiện bên trong biên giới của chúng ta. Nơi đây giam giữ hàng ngàn bản sao, và tất cả đều là khuôn đúc từ [Owner.Leader.GetTitle] [Owner.Leader.GetName] của chúng ta. Các nhà khoa học dân sự có mặt tại hiện trường đã bị bắt giữ, nhưng không một ai chịu hợp tác, tất cả đều phủ nhận việc biết được ai là người đứng sau ra lệnh tạo ra những bản sao này.\n\nNhững bằng chứng thưa thớt ám chỉ rằng chính [Owner.Leader.GetName] có thể là kẻ chủ mưu đằng sau toàn bộ hoạt động này. Thật không may, [Owner.Leader.GetSheHe] đã bốc hơi không để lại dấu vết."
 bio.85.a: "Thi hành trợ tử cho những bản sao này."
 bio.85.b: "Chúng ta đã thừa kế một quân đoàn nhân bản."
 bio.85.b.tt: "([owner.capital_scope.GetName]):\nĐã tạo ra một đội §Y$clone_army$§!."
 bio.85.c: "Trang bị tự do cho những bản sao này."
 bio.85.c.tt: "Chúng ta sẽ nhận được một nhóm §YDân Số§!."
 bio.86.name: "Phản Ứng Bất Ngờ"
 bio.86.desc: "Việc thi hành trợ tử cho một lượng lớn bản sao như vậy đã thổi bùng cơn thịnh nộ trong công chúng và làm nảy sinh một cuộc tranh luận vô cùng gay gắt. Những nhà hoạt động đấu tranh vì quyền lợi của người [Owner.GetSpeciesAdj] và các tổ chức tôn giáo bất mãn đang tổ chức những cuộc biểu tình với quy mô lớn.\n\nCùng lúc đó, có tin đồn lan truyền rằng một số bản sao đã trốn thoát và đang trà trộn vào trong những người dân bình thường."
 bio.86.a: "Có lẽ chúng ta có thể rút ra bài học từ chuyện này..."
 bio.86.b: "Triển khai lực lượng an ninh dẹp loạn."
 bio.86.b.tt: "([owner.capital_scope.GetName]):\nĐã tạo ra 3 đội §Y$assault_army_plural$§!."
 bio.90.name: "Quần Thể Đột Biến"
 bio.90.desc: "Rất nhiều cá nhân mang những đột biến gen khác biệt hoặc dị thường đã bị xã hội xa lánh. Buộc phải lui vào hoạt động ngầm, những người đột biến này đã tự xây dựng nên những khu định cư của riêng mình.\n\nNhững ai liều lĩnh bước vào những khu vực này hiếm khi có cơ hội quay trở về."
 bio.90.a: "Càn quét những khu định cư này."
 bio.90.b: "Giám sát sự phát triển của họ từ xa."
 bio.95.name: "Sự Nổi Loạn Chuyển Gen"
 bio.95.desc: "Một bộ phận thanh niên đang cảm thấy bất mãn bắt đầu thay đổi ngoại hình của mình một cách cực đoan như một hình thức giải trí điên rồ.\n\nTrào lưu mới nhất bao gồm việc cuồng nhiệt theo đuổi đôi mắt kép, cùng với việc thi thố xem ai có thể cấy ghép thêm nhiều chi nhất lên cơ thể mình — kỷ lục hiện tại đang dừng ở con số 156 chi.\n\nNhững tin tặc sinh học này đã thu hút sự chú ý của công chúng, dấy lên những lo ngại về mặt an ninh. Với làn sóng kêu gọi áp đặt các quy định nghiêm ngặt đối với việc đột biến gen ngày một dâng cao, chúng ta phải đưa ra lập trường chính thức."
 bio.95.a: "Đây chỉ là một trò giải trí vô hại mà thôi."
 bio.95.b: "156 cái chi quả thực là quá đà."
 bio.100.name: "Hệ Quả Không Lường Trước"
 bio.100.desc: "Việc áp dụng công nghệ thao túng gen một cách tràn lan trong nền văn minh của chúng ta đã làm nảy sinh một loạt các biến dị cơ thể đến mức hoa mắt chóng mặt.\n\nMột số quy trình sinh học trước đây vốn rất dễ dự đoán giờ lại xuất hiện những sai lệch nằm ngoài dự tính, khiến cho việc chuẩn hóa gần như trở thành một nhiệm vụ bất khả thi.\n\nSự đồng nhất về mặt thể chất từng gắn kết giống loài của chúng ta đang dần tan biến, thay vào đó là một lăng kính vạn hoa quy tụ đủ mọi hình thái và chức năng, điều này đang làm rung chuyển sự gắn kết của toàn xã hội."
 bio.100.a: "Cổ vũ sự đa dạng."
 bio.100.a.tt: "Ngẫu nhiên §Y400§! £pop£ §HDân Số§! sẽ nhận được một trong các đặc điểm ['trait:trait_bioadaptability'], ['trait:trait_social_pheromones'] hoặc ['trait:trait_limited_regeneration']."
 bio.100.b: "Bắt buộc tuân thủ khuôn mẫu gen tiêu chuẩn."
 bio.105.name: "Sự Vô Định Hình Tế Bào"
 bio.105.desc: "Một thí nghiệm chuyển gen đã thất bại thảm hại. Các nhà khoa học nỗ lực cấy ghép DNA của đối tượng thử nghiệm với DNA của các sinh vật đa bào khác, nhằm kích hoạt một phản ứng miễn dịch siêu việt, giúp chúng có khả năng miễn nhiễm với mọi loại virus.\n\nThế nhưng, kết quả là họ lại tạo ra một sinh vật có khả năng hòa tan màng tế bào của bất kỳ sinh vật nào mà nó chạm vào, dung hợp với nạn nhân để tạo thành một khối sinh khối khổng lồ và vô định hình.\n\nKhối sinh khối này đang cuộn trào về phía trước bên trong cơ sở thử nghiệm, ngấu nghiến mọi thứ ngáng đường nó. Hiện tại nó đã bị khống chế, nhưng nếu xổng ra ngoài, nó sẽ gây ra một mối đe dọa sức khỏe vô cùng tồi tệ. May mắn thay, có vẻ như nó có thể ăn được..."
 bio.105.a: "Tiêu diệt khối sinh khối này!"
 bio.105.b: "Giá trị nghiên cứu của nó xứng đáng để đánh đổi rủi ro."
 ## TÌNH HUỐNG ĐẾ CHẾ BẦY ĐÀN
