 bio.40.name: "Sự Khác Biệt Sinh Học" #GIAI ĐOẠN CUỐI - CHỌN NHÁNH TRUYỀN THỐNG
 bio.40.desc: "Dù là chúng ta đang theo đuổi hình thái thuần khiết nhất của bản thân, tiến đến thành công bằng công nghệ nhân bản, hay thông qua việc chủ ý đột biến để cường hóa gen, thì khoảnh khắc này cũng đánh dấu một bước ngoặt không thể vãn hồi."
