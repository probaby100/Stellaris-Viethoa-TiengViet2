 behemoth_cocoon_menu_title: "Trưởng Thành Và Phát Triển"
 behemoth_cocoon_effect: "Một §YBehemoth Nuốt Chửng Bầu Trời§! đã được nạp đủ năng lượng có thể làm tổ tại một hành tinh khí khổng lồ trong §Y3 năm§!, để lột xác thành một dạng sống thậm chí còn hùng mạnh hơn."
