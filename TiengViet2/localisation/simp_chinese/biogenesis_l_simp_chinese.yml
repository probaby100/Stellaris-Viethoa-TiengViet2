 genetic_ascension_situation_hive_type: "$genetic_ascension_situation$"
 genetic_ascension_situation_hive_desc: "$genetic_ascension_situation_desc$"
 genetic_ascension_situation_hive_monthly_change_tooltip: "Các ong thợ di truyền học đang từng bước thúc đẩy nghiên cứu của chúng ta."
 genetic_ascension_situation_hive_outcome: "$genetic_ascension_situation_outcome$"
 #SỰ KIỆN THEO GIAI ĐOẠN
 bio.25.name: "Sự Tiến Hóa Của Tập Thể" #GIAI ĐOẠN MỘT
 bio.25.desc.no_options: "[owner.GetGovernmentName] đang trải qua một cuộc chuyển mình. Chúng ta sắp sửa đánh thức trọn vẹn tiềm năng của bản thân, đồng thời cũng nhận thức rõ rằng nỗ lực này có thể sẽ thay đổi tận gốc rễ bản chất của chúng ta. Thiết kế quá trình tiến hóa cho chính mình là một nhiệm vụ mang tính trọng đại. Những thay đổi mà chúng ta đang thực hiện ngay lúc này sẽ để lại những tác động sâu rộng cho tương lai."
 bio.25.desc.has_options: "$bio.25.desc.no_options$\n\nBây giờ chúng ta phải chọn ra một trọng tâm phát triển cho giai đoạn tiến hóa đầu tiên này."
 bio.25.a: "$bio.5.a$"
 bio.25.b: "$bio.5.b$"
 bio.25.c: "$bio.5.c$"
 bio.30.name: "Sự Hội Tụ Bầy Đàn" #GIAI ĐOẠN HAI
 bio.30.desc.no_options: "Việc thiết kế quá trình tiến hóa cho chính chúng ta đã mang lại những thay đổi đáng kể. Giờ đây, chúng ta đã thấu hiểu sâu sắc hơn về các đặc điểm di truyền, quá trình sinh sản và trình tự DNA.\n\nCông việc của chúng ta đang tiến gần đến đỉnh cao.\n\nChẳng bao lâu nữa, chúng ta sẽ trở thành hình hài mà chúng ta được định sẵn phải trở thành."
 bio.30.desc.has_options: "$bio.30.desc.no_options$ Chúng ta có cơ hội lựa chọn tiếp tục đi theo con đường hiện tại, hoặc chuyển sang một hướng đi mới."
 bio.30.a: "$bio.10.a$"
 bio.30.b: "$bio.10.b$"
 bio.30.c: "$bio.10.c$"
 bio.35.name: "Liên Minh Tiến Hóa" #GIAI ĐOẠN BA
 bio.35.desc.no_options: "Chúng ta đang đứng trên bờ vực của một bước đột phá vĩ đại về mặt tiến hóa. Chúng ta sẽ sớm phải đối mặt với những quyết định mang tính sống còn để có thể phát huy tối đa tiềm năng tiến hóa của mình."
 bio.35.desc.has_options: "$bio.35.desc.no_options$\n\nMột lần nữa, chúng ta phải lựa chọn các ưu tiên."
 bio.35.a: "$bio.15.a$"
