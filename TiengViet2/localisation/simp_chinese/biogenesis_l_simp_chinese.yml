 ###Thành Trì Ánh Sao
 origin_starlit_citadel: "Thành Trì Ánh Sao"
 origin_starlit_citadel_desc: "Ở rìa hệ sao quê hương của nền văn minh này, một cánh cổng dịch chuyển bí ẩn sừng sững xuất hiện, và từ trong đó, những thực thể nguy hiểm không ngừng tuôn ra. Bị những kẻ xâm lược không mời mà tới này dồn vào chân tường, người dân nơi đây buộc phải trông cậy vào kiệt tác công nghệ vĩ đại nhất của họ — §H$dsc_name$§!."
 origin_tooltip_starlit_citadel_effects: "—$HOME_SYSTEM$$TABBED_NEW_LINE$—Sở hữu một ['concept_deep_space_bastion'] ở rìa giếng trọng lực$TABBED_NEW_LINE$—Một ['concept_wormhole', $BYPASS_STARLIT_WORMHOLE$] dẫn đến một hệ sao vô danh$NEW_LINE$—$HOMEWORLD$$TABBED_NEW_LINE$—£building£ ['building:building_citadel_uplink']$TABBED_NEW_LINE$—['concept_bioship_remains', £blocker£ $d_bioship_remains$]$TABBED_NEW_LINE$—['concept_invasion_site', £blocker£ $d_invasion_site$]: +2$NEW_LINE$—$ADDITIONAL_TECHNOLOGIES_STRING$['concept_deep_space_citadel_tech',£engineering_research£ $tech_deep_space_citadel$]"
 START_SCREEN_STARLIT_CITADEL: "Chúng ta vốn không sinh ra với bản tính cảnh giác cao độ đến vậy.\n\n[Capital.GetName] là một hành tinh trù phú, và chúng ta cũng từng là một dân tộc sống trong hòa bình và thịnh vượng. Nhưng rồi một ngày, cánh cổng dịch chuyển kia xuất hiện và thay đổi mọi thứ.\n\nLũ [GetInvadersLower] đó đến mà chẳng báo trước. Chúng càn quét thành phố, tàn phá đất đai của chúng ta, rồi lại biến mất dạng hệt như cái cách chúng thình lình xuất hiện. Ban đầu, chúng ta cứ ngỡ đó chỉ là một sự cố hi hữu, thế nhưng những cuộc xâm lăng cứ thế nối tiếp nhau không dứt. Hết lần này đến lần khác, chúng ập đến, ngày một hung hãn và tàn bạo hơn.\n\nGiờ đây, khi chúng ta sắp sửa tiến bước vào thiên hà, các $job_skywatcher_plural$ đã sẵn sàng cho mọi tình huống. Nơi vùng không gian sâu thẳm của hành tinh mẹ, $dsc_name$ hùng vĩ đang âm thầm canh gác. Đó là một bức tường thành bất khả xâm phạm, kiên cường chống lại [GetInvadersLower] hay bất cứ kẻ thù nào dám nhăm nhe tiêu diệt chúng ta."
