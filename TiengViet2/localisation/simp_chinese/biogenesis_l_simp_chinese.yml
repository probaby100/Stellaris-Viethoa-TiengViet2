 ### Khủng Hoảng Behemoth ###
 ap_behemoths: "Cơn Thịnh Nộ Của Behemoth"
 ap_behemoths_desc: "Những kẻ săn mồi ngự trị trên đỉnh cao của các vì sao không bao giờ để mình bị trói buộc bởi những điều vụn vặt. Đồng lòng hiệp lực, chúng ta sẽ rũ bỏ cái thân xác phàm trần mỏng manh này, hóa thân thành sức mạnh tối thượng của tự nhiên."
 must_use_bioships: "£trigger_no£ Bắt buộc phải sử dụng Bộ Phi Thuyền §YSinh Học§!."
 behemoth_crisis_chain_title: "Tai Ương Behemoth"
 behemoth_crisis_chain_desc: "Những vì sao kia chẳng qua chỉ là thứ nhiên liệu để chúng ta thỏa mãn cơn đói khát, còn những thảm họa cũng chỉ là thứ đất màu mỡ để dã tâm của chúng ta đâm chồi nảy lộc. Chúng ta sẽ đạp lên mọi quy luật của tự nhiên, để đúc nên một con Behemoth khổng lồ và không thể cản bước, đủ sức để định hình lại cả vũ trụ."
 crisis_behemoth_level_1: "§HĐáng Lo Ngại§!"
 crisis_behemoth_level_1_desc: "Mức Độ Khủng Hoảng Cấp 1"
 crisis_behemoth_level_2: "§HRủi Ro§!"
