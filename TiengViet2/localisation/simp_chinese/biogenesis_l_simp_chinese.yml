 unlocks_ship_2_bio: "Mở khóa công nghệ phi thuyền §YKiến Ngàm§! và §YNhện Dệt§! của Đế Chế Sụp Đổ.\n"
 menp_cosmo_ship_2_desc_bio: "Bằng cách uốn cong các liên kết không-thời gian, những phi thuyền này đã vượt qua mọi giới hạn thông thường. Dưới lớp vỏ nhỏ gọn của chúng là một nguồn sức mạnh khổng lồ mà những phi thuyền bình thường tuân theo các định luật vật lý chỉ có thể mơ ước."
 menp_cosmo_ship_3_desc_bio: "$tech_cosmogenesis_harbinger_desc$"
 unlocks_ship_3_bio: "Mở khóa công nghệ phi thuyền §YTrùng Mẫu§! của Đế Chế Sụp Đổ"
 menp_cosmo_ship_4_desc_bio: "$tech_cosmogenesis_stinger_desc$"
 unlocks_ship_4_bio: "Mở khóa công nghệ phi thuyền §YOng Độc Titan§! của Đế Chế Sụp Đổ"
 tech_cosmogenesis_mauler: "Kiến Ngàm Mật Mã"
 tech_cosmogenesis_mauler_desc: "Bằng cách vượt qua các định luật không-thời gian của sinh vật sống, không gian bên trong của loại Kiến Ngàm này lớn hơn nhiều so với vẻ ngoài nhỏ gọn của nó, cho phép chứa đựng một khối lượng mô cơ khổng lồ. Sức sát thương từ bộ hàm của nó hoàn toàn vượt xa mọi quy luật vật lý đã biết."
 TECH_UNLOCK_COSMO_MAULER_CONSTRUCTION_TITLE: "§HMở Khóa Loại Phi Thuyền:§! Kiến Ngàm Mật Mã"
 TECH_UNLOCK_COSMO_MAULER_CONSTRUCTION_DESC: "§HKiến Ngàm Mật Mã§!\n$tech_cosmogenesis_mauler_desc$"
 tech_cosmogenesis_weaver: "Nhện Dệt Bí Ẩn"
 tech_cosmogenesis_weaver_desc: "Mảng vũ khí hỗ trợ được trang bị trên Nhện Dệt Bí Ẩn đã che giấu hoàn toàn cấu trúc giải phẫu học thực sự của chúng, viết lại mọi kiến thức thông thường về không gian. Chỉ một chiếc Nhện Dệt Bí Ẩn cũng đủ sức xoay chuyển cục diện của toàn bộ trận chiến."
 TECH_UNLOCK_COSMO_WEAVER_CONSTRUCTION_TITLE: "§HMở Khóa Loại Phi Thuyền:§! Nhện Dệt Bí Ẩn"
 TECH_UNLOCK_COSMO_WEAVER_CONSTRUCTION_DESC: "§HNhện Dệt Bí Ẩn§!\n$tech_cosmogenesis_weaver_desc$"
 tech_cosmogenesis_harbinger: "Trùng Mẫu Mê Cung"
 tech_cosmogenesis_harbinger_desc: "Những Trùng Mẫu Mê Cung này cất giấu các máy bay chiến đấu bên trong những túi không gian đan xen chằng chịt, khiến mỗi phi thuyền trở thành một mê cung chứa máy bay bất khả thi, có khả năng triển khai một lượng hỏa lực sánh ngang với cả một hạm đội."
 TECH_UNLOCK_COSMO_HARBINGER_CONSTRUCTION_TITLE: "§HMở Khóa Loại Phi Thuyền:§! Trùng Mẫu Mê Cung"
