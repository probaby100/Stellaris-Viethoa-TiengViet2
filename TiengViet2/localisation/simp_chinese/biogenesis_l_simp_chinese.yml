 trait_ruler_apex_predator_desc: "Một dân tộc được định hình bởi \"Sự Cướp Đoạt Tiến Hóa\" sẽ chỉ cho phép những kẻ có khả năng thích ứng mạnh mẽ nhất dẫn dắt họ. Vị lãnh tụ tối cao này không chỉ cướp đi bộ gen của những kẻ bại trận, mà còn tước đoạt luôn cả trí tuệ và sự quyết tâm của chúng, biến mỗi chiến thắng thành một bậc thang dẫn đến sự cai trị hoàn hảo."
