 voidspawn_system_mod: "Bão Táp Hư Không"
 voidspawn_colony_mod: "Xung Đột Thuộc Địa"
 voidspawn_colony_mod_desc: "Hành tinh đang mục rữa dưới bóng ma của Voidspawn Cổ Đại."
 VOIDSPAWN_FORCE_DECLINE: "§R Dân Số Đang Suy Giảm §!"
 elder_voidspawn_chain_title: "Voidspawn Cổ Đại Nổi Điên"
 elder_voidspawn_chain_desc: "Một con Voidspawn khổng lồ đang càn quét khắp hệ sao. Kẻ mà nó nhắm đến là những sinh vật khổng lồ, nếu chúng ta ra tay tiêu diệt những mục tiêu đó thay nó, biết đâu nó sẽ buông tha cho chúng ta.\n\nMục Tiêu: Tìm kiếm và tiêu diệt toàn bộ Behemoth cấp 4 trong hệ sao."
 behemoth_victory_chain_title: "Chúa Tể Của Muôn Loài"
 behemoth_victory_chain_desc: "Với sự hoàn tất của quá trình Dung Hợp Tâm Trí, tham vọng của chúng ta đã ở ngay trước mắt. Chúng ta phải làm quen với cơ thể chung mới mẻ này, và không ngừng chuyển giao tâm trí của người dân vào đó, nhưng điều quan trọng hơn cả là chúng ta cần phải nghiền nát mọi kẻ có khả năng trở thành đối thủ, bất kể chúng là ai.\n\n§H Mục Tiêu §!:\n—Tìm kiếm và tiêu diệt tất cả các Behemoth Nuốt Chửng Bầu Trời cấp 4 khác trong hệ sao.\n—Hoàn thành Tình Huống Cơn Đau Tăng Trưởng\n—Tiêu diệt Voidspawn Cổ Đại"
 behemoth_transference: "Chuyển Đổi Thành Behemoth Nuốt Chửng Bầu Trời"
 behemoth_transference_desc: "Giờ đây, sự liên kết tồn tại giữa quái thú và quần thể dân cư của chúng ta đã rọi một ánh bình minh mới lên nền văn minh đang ngự trị trên hành tinh. So với việc được hòa nhập cùng dã thú, sự tồn tại hiện tại có vẻ như chỉ là một sự uổng phí vô ích. Lúc này đây, mỗi một cá nhân đều khao khát mãnh liệt được hòa làm một với dã thú, và cảm thấy... một cơn đói khát cồn cào."
