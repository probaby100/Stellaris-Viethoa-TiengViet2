 tech_cosmogenesis_stinger: "Ong Độc Bí Ẩn"
 tech_cosmogenesis_stinger_desc: "Hệ thống vũ khí được trang bị trên Ong Độc Bí Ẩn vượt xa giới hạn chịu đựng lý thuyết của nguồn cung cấp năng lượng. Đáng lý ra nó không thể hoạt động được, nhưng thực tế lại hoàn toàn trái ngược, nó không chỉ có thể khai hỏa mà còn có thể duy trì hỏa lực liên tục."
 TECH_UNLOCK_COSMO_STINGER_CONSTRUCTION_TITLE: "§HMở Khóa Loại Phi Thuyền:§! Ong Độc Bí Ẩn"
 TECH_UNLOCK_COSMO_STINGER_CONSTRUCTION_DESC: "§HOng Độc Bí Ẩn§!\n$tech_cosmogenesis_stinger_desc$"
