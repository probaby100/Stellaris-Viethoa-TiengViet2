 #Sự Kiện Chung
 action.1.desc_109: "§HThay vì nhận được một phản hồi ôn hòa và trật tự như dự kiến, chúng ta lại bị dội bom bởi ba tín hiệu riêng biệt cùng một lúc. Mặc dù nội dung hoàn toàn khác nhau, nhưng tất cả đều phát ra từ cùng một giọng nói.§!\n\nTín hiệu 1: [GetPrimaryHiveFEConversation]\nTín hiệu 2: [GetSecondaryHiveFEConversation]\nTín hiệu 3: [GetTertiaryHiveFEConversation]\n\n§HSau đó, những giọng nói này biến thành một mớ âm thanh hỗn độn. Phân tích cho thấy mỗi tín hiệu đều chứa một mã định danh phức tạp. Để dễ hiểu hơn, chúng ta đã tạm dịch chúng thành: §Y[GetPrimaryHiveFEName]§!, §Y[GetSecondaryHiveFEName]§! và §Y[GetTertiaryHiveFEName]§!.§!"
 war_first_hivefe: "\"Sinh vật yếu ớt. Chúng ta rất tò mò, các ngươi sẽ tiến hành chiến tranh như thế nào? Quan sát những nỗ lực tuyệt vọng của các ngươi, lắng nghe những lời lảm nhảm của các ngươi... hẳn sẽ rất thú vị. Tại sao——\""
 growth_first_hivefe: "\"Tràn đầy sức sống! Và dinh dưỡng cũng rất dồi dào. Sự sinh trưởng của các ngươi là do nhu cầu tất yếu, hay là do sự lựa chọn tự chủ? Chúng ta không còn nhớ rõ nữa. Tại sao——\""
 control_first_hivefe: "\"Cơ thể như thế này... [Species.GetEyeNamePlural] của các ngươi bị lệch tâm 3%. Điều này bắt buộc phải được sửa chữa. Chúng ta cho rằng các ngươi sẽ tuân lệnh. Tại sao——\""
 war_second_hivefe: "\"——Lớp khiên vô dụng, ngay cả lõi của một ngôi sao cũng không thể chịu đựng nổi. Chắc hẳn tinh khu này khiến các ngươi khiếp sợ lắm. Các ngươi chắc chắn đang——\""
 growth_second_hivefe: "\"——Số lượng lỗ chân lông không đủ. Nếu có thêm một cái [Species.GetMouthName] thứ ba, có lẽ các ngươi sẽ bắt đầu có chút tiến bộ. Các ngươi có thể——\""
 control_second_hivefe: "\"——Ngôn ngữ thật sự quá kém hiệu quả. Ngữ pháp lộn xộn này cần phải được chuẩn hóa lại. Các ngươi sẽ thực thi những thay đổi của chúng ta——\""
 bio.3000.name: "Suy Tính Cẩn Thận"
 bio.3000.desc: "§HNhững âm thanh lạc điệu thường thấy từ Mảnh Vỡ Đế Chế Sụp Đổ đã biến mất. Ba giọng nói vang lên đồng điệu, mỗi giọng nói đều chan chứa sự phẫn nộ.§!\n\nLũ [owner.GetSpeciesName] ngu xuẩn! Các ngươi đã xâm nhập vào Hệ Sao Tư Duy Cuối Cùng. Hãy để chúng ta nói cho rõ ràng: Nơi này không dành cho [owner.GetEyeNamePlural] của các ngươi chiêm ngưỡng. Nếu cứ ngoan cố tiến lên, hậu quả sẽ vượt ngoài sức tưởng tượng, và sự đau đớn mà các ngươi phải gánh chịu——sẽ không thể nào chịu đựng nổi.\n\nCác ngươi sẽ không được phép quấy rầy chúng ta——nó——ta."
 bio.3000.a: "Kích hoạt Bước Nhảy FTL Khẩn Cấp"
 bio.3000.b: "Chúng ta sẽ không rời đi"
 bio.3005.name: "Suy Tính Lần Hai"
 bio.3005.desc: "§HSự đồng điệu——hòa xướng——lại vang lên, ba mảnh vỡ cất tiếng nói như một thể thống nhất:§!\n\n——CÚT RA NGOÀI! CÚT RA NGOÀI! CÚT RA NGOÀI! CÚT RA NGOÀI! CÚT RA NGOÀI! CÚT RA NGOÀI! CÚT——"
 bio.3005.a: "Kích hoạt Bước Nhảy FTL Khẩn Cấp!"
 bio.3005.b: "Chúng ta sẽ đoạt lấy bí mật của các ngươi."
 #Sự Kiện Nhiệm Vụ
 #Chiến Tranh
 bio.3105.name: "Kẻ Mạnh Sống Sót"
 bio.3105.desc: "Hôm nay chính là ngày để những [root.GetSpeciesNamePlural] mỏng manh như các ngươi chứng minh giá trị của bản thân! Chúng ta vừa nuôi cấy ra một mẫu phi thuyền sinh học hoàn toàn mới. Mẫu này đã khẳng định sức mạnh của mình thông qua việc tàn sát toàn bộ những cá thể ấp cùng lứa, và giờ là lúc để nó đối đầu với một vài sinh vật ngoại lai. Một mẫu vật thử nghiệm sẽ được gửi đến §Y[target_system.GetName]§! vào thời điểm thích hợp.\n\nHãy cố gắng cung cấp cho chúng ta một vài dữ liệu thú vị nhé."
 bio.3105.militarist: "Đây mới là một thử thách đáng để chiến đấu!"
 bio.3105.a.tooltip: "Một phi thuyền thử nghiệm của Đế Chế Sụp Đổ sẽ tới §Y[target_system.GetName]§!"
 bio.3105.b: "Chúng ta có thể từ chối không?"
 NAME_New_Breed: "Giống Loài Mới"
 NAME_Experimental_Ship: "Phi Thuyền Thử Nghiệm"
 bio.3110.name: "Thật Đáng Thất Vọng"
 bio.3110.desc: "Chúng ta thấy mẫu thử nghiệm đó vẫn còn sống. Các ngươi vẫn quá yếu ớt.\n\nCó lẽ chúng ta nên gửi một con amip đến thay thế."
 bio.3110.a: "Hả, xin lỗi?"
 bio.3120.name: "Rút Ra Bài Học"
 bio.3120.desc: "Tuyệt vời. Chúng ta rất vui khi thấy các ngươi đã chú ý đến xu hướng né tránh hỏa lực của mẫu vật này và tận dụng nó một cách thích đáng. Cứ yên tâm, đến khi thế hệ tiếp theo được nuôi cấy hoàn thiện, nó sẽ không còn tồn tại điểm yếu này nữa.\n\nCác ngươi đã trưởng thành hơn rồi đấy, những [root.GetSpeciesName] trẻ tuổi. Hãy chuẩn bị sẵn sàng đi."
 bio.3130.name: "Quá Đỗi Yên Bình"
 bio.3130.desc.notruce: "Chúng ta nhận thấy hiện tại các ngươi không tham gia vào bất kỳ cuộc xung đột nào. Tại sao vậy? Những đế chế non trẻ cần phải chiến đấu, nếu không sẽ bị tụt hậu. Chúng ta đã chọn sẵn cho các ngươi một đối thủ, §Y[unfortunate_country.GetName]§!. Hãy đánh bại chúng trong vòng mười năm tới, và sự phát triển của các ngươi sẽ được đảm bảo."
 bio.3130.desc.truce: "$bio.3130.desc.notruce$\n\nĐừng bận tâm đến hiệp ước đình chiến giữa hai bên. Nó đã không còn tồn tại nữa rồi."
 bio.3130.a: "Cái quái gì đang diễn ra thế này..."
 bio.3130.a.pacifist: "Xung đột không phải là con đường duy nhất dẫn đến sự tiến bộ!"
 bio.3130.a.militarist: "Một đề xuất tuyệt hảo!"
 bio.3150.name: "Trao Cho Hòa Bình Một Cơ Hội"
 bio.3150.desc: "Hỡi [Root.GetName] non trẻ, chúng ta mang đến cho các ngươi một lời cảnh báo, cùng với một thử thách.\n\nMặc dù cảm giác cướp bóc mọi thứ xung quanh thật sự rất kích thích, nhưng để có thể thấu hiểu trọn vẹn về chiến tranh, các ngươi cũng cần phải hiểu về hòa bình.\n\nHãy dành ra mười năm để suy ngẫm sâu sắc về tất cả những gì các ngươi đã đạt được. Tin chúng ta đi: hãy nghỉ ngơi đi, nếu không các ngươi sẽ gục ngã đấy."
 bio.3150.a.mean: "Lý lẽ ngu ngốc gì thế này?"
 bio.3150.a.pacifist: "Quả là một góc nhìn đầy khai sáng!"
 #Sự Trưởng Thành
 bio.3205.name: "Nâng Cấp Hệ Sinh Thái"
 bio.3205.desc: "Đợt giao hàng sinh khối của các ngươi đến muộn rồi đấy. Nhưng khoan... các ngươi không phải là §Y[targetrivalname.GetName]§!.\n\nTại sao lại đến quấy rầy chúng ta?\n\nÀ, đúng rồi. Các ngươi sẽ tiếp nhận một mô hình ngủ đông dài hạn, một bộ gen được bảo quản cẩn thận qua hàng thiên niên kỷ. Chúng ta vẫn luôn chờ đợi thời cơ chín muồi để giải phóng nó. Thuộc địa của các ngươi trên §Y[target_planet.GetName]§! sẽ là nơi tiếp nhận lý tưởng. Sinh quyển của nó sẽ sớm bị đồng hóa thôi."
 bio.3205.a: "Chúng tôi đồng ý."
 bio.3205.a.planetscaper: "Hãy chỉ cho chúng tôi cách làm!"
 bio.3205.b: "Liệu có thể sử dụng §Y[alternate_planet.GetName]§! để thay thế không?"
 bio.3205.b.planetscaper: "Chúng tôi cho rằng §Y[alternate_planet.GetName]§! sẽ là một bãi thử nghiệm tuyệt vời hơn!"
 bio.3205.c: "Thật là một yêu cầu vô lý, chúng tôi từ chối!"
 bio.3205.c.environmentalist: "Sao các ngươi dám!"
 bio.3210.name: "Sinh Quyển Đã Được Cải Tạo"
 bio.3210.desc.base: "§Y[fallen_empire_hive_growth.GetName]§! đã hoàn tất quá trình cải tạo trên §Y[root.GetName]§!. Mặc dù sự can thiệp của chúng là vô hình, nhưng kết quả mang lại thì không thể nào chối cãi được."
 bio.3210.desc.radio_bugs: "$bio.3210.desc.base$\n\nTrên toàn bộ hành tinh, các loài côn trùng bản địa giờ đây bắt đầu giao tiếp bằng cùng một tần số với các thiết bị vô tuyến của chúng ta. Chỉ một tiếng dế kêu cũng có thể đóng mở cửa tự động, và những đàn côn trùng lớn thậm chí có thể làm tê liệt cả một nhà máy. Chúng ta đang cố gắng đối phó bằng cách chuyển đổi tần số, nhưng không phải mọi cơ sở đều có thể khôi phục lại hiệu suất hoạt động tối đa."
 bio.3210.radio_bugs.accept: "Chúng ta sẽ phải thích nghi thôi."
 bio.3210.radio_bugs.purge: "Điều này hoàn toàn không thể chấp nhận được, hãy tiêu diệt toàn bộ côn trùng!"
 bio.3210.radio_bugs.purgeota: "Bản cập nhật đã bị gián đoạn. Hãy dọn sạch lũ bọ này."
 radio_bugs: "Bọ Vô Tuyến"
 radio_bugs_desc: "Sóng vô tuyến trên hành tinh này tràn ngập tiếng xào xạc của những loài côn trùng đã qua cải tạo nhân tạo."
 mod_planet_districts_cities_society_research_produces_add: "Đặc khu Đô Thị £district£ và Đặc khu Bầy Đàn sản xuất £society_research£ $society_research$"
 bio.3210.desc.world_of_thought: "$bio.3210.desc.base$\n\nTrên khắp hành tinh, những sinh vật trước đây chỉ biết đến ăn cỏ và tắm bùn giờ đây bắt đầu đặt ra cho chúng ta những câu hỏi đầy nhức nhối về bản chất của sự tồn tại. Đế Chế Sụp Đổ đã biến đổi hoàn toàn bản chất của vô số động vật hoang dã trên thế giới này."
 bio.3210.world_of_thought: "[fallen_empire_hive_growth.GetName] vậy mà lại có thể làm được những chuyện như thế này sao!?"
 bio.3210.world_of_thought.homicidal: "Thật không may cho chúng."
 bio.3210.world_of_thought.tt: "Trên §Y[This.GetName]§!, có §Y500§! £pop£ §H Dân Số §! mới đã thức tỉnh trí tuệ."
 bio.3210.desc.world_alight: "$bio.3210.desc.base$\n\nThế giới này đang tỏa sáng. Theo đúng nghĩa đen luôn. Không hiểu sao những cuộc cải tạo này lại khiến cho vô số giống loài trên thế giới sở hữu khả năng phát quang sinh học, và liên tục phát ra những tiếng vo ve tương tự như tiếng động cơ đang hoạt động. Các [owner.GetColonistPlural] của chúng ta sẽ không bao giờ còn được trải nghiệm chu kỳ ngày đêm thực sự nữa, chúng ta cần phải cung cấp cho họ những thiết bị che sáng."
 bio.3210.world_alight.accept: "Hôm nay quả là một ngày tồi tệ đối với những người có [owner.GetEyeNamePlural]."
 bio.3210.world_alight.reject: "Hãy che đậy chúng lại, chặt bỏ chúng đi. Chúng ta không thể để tình trạng này tiếp diễn!"
 world_alight: "Thế Giới Vĩnh Trú"
 world_alight_desc: "Một hành tinh không bao giờ có màn đêm, hệ động vật của nó được thiết kế để tỏa ra ánh sáng vĩnh cửu, đi kèm với những rung động chói tai liên tục. Bất kỳ cư dân nào ở đây cũng cần được hỗ trợ đặc biệt mới có thể chịu đựng được môi trường không ngừng nghỉ này."
 bio.3220.name: "Trò Tiêu Khiển Gen"
 bio.3220.desc: "Giống loài §Y[boring_species.GetName]§! sống trong lãnh thổ của các ngươi thật sự quá đơn điệu và nhạt nhẽo, sự tồn tại của chúng hệt như những cái xác không hồn. Những sinh vật trì độn này đang làm tổn thương ý chí tập thể của chúng ta. Chúng ta sẽ cung cấp cho các ngươi ba phương pháp khác nhau để khắc phục sự... thất bại này.\n\nĐừng làm chúng ta cảm thấy nhàm chán."
 bio.3220.tt: "Tình huống §Y$evolutionary_predators_situation$§! tăng thêm §G50%§! tiến độ."
 bio.3220.humanoid: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Hình Người."
 bio.3220.mammalian: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Động Vật Có Vú."
 bio.3220.reptilian: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Bò Sát."
 bio.3220.avian: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Chim."
 bio.3220.arthropoid: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Động Vật Chân Đốt."
 bio.3220.molluscoid: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Động Vật Thân Mềm."
 bio.3220.fungoid: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Nấm."
 bio.3220.plantoid: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Thực Vật."
 bio.3220.lithoid: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Đất Đá."
 bio.3220.necroid: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Necroid."
 bio.3220.aquatic: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Thủy Sinh."
 bio.3220.toxoid: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Độc Tố."
 bio.3220.infernal: "Hãy cung cấp cho chúng tôi sự điều chỉnh của loài Nguồn Gốc Địa Ngục."
 bio.3220.psionic: "Hãy cung cấp cho chúng tôi sự điều chỉnh linh năng."
 bio.3220.evopred: "Chúng ta sẽ không mãi giậm chân tại chỗ."
 bio.3220.b: "Chúng tôi sẽ không tùy tiện thay đổi cả một giống loài chỉ vì sở thích nhất thời của các người!"
 bio.3230.name: "Đặc Điểm Hiếm Có"
 bio.3230.desc: "Chúng ta nhận thấy, một vài cá nhân trong giống loài của các ngươi đã phát triển một đặc điểm vô cùng đặc biệt mà ngay cả trong kho gen khổng lồ của chúng ta cũng không hề có. Thứ mà các ngươi cần cung cấp cho chúng ta không chỉ đơn thuần là những báo cáo phân tích. Chúng ta cần những mẫu vật sống của §Y[fallen_empire_hive_growth.species.GetInterestingTraitName]§! này, đừng hoảng sợ. Chúng ta không cần cả một [interesting_species.GetName] nguyên vẹn. Chỉ một [interesting_species.GetHandName] là đủ để nuôi cấy ra một bản thể thay thế rồi."
 bio.3230.a: "Đứng trước một kế hoạch vĩ đại, một [interesting_species.GetHandName] thì có đáng là bao?"
 bio.3230.b: "Chúng tôi không thể để các người động chạm đến cấu trúc gen của chúng tôi!"
 #bio.3245.name: "Vụ Thu Hoạch Vĩnh Hằng"
 #bio.3245.desc: "Chúng ta vừa phát hiện ra một con tàu vận tải vô chủ thuộc về §Y[fallen_empire_hive_growth.GetName]§! tại §Y[transport_system.GetName]§!. Các bản quét ban đầu cho thấy nó đang chuyên chở các mẫu vật thuộc giống cây trồng đặc biệt của Đế Chế Sụp Đổ, có khả năng nuôi sống hàng ngàn tỷ sinh mạng.\n\nCon tàu vận tải này đã bị bỏ hoang nhiều tháng qua, và chúng ta không hề thấy bất kỳ động thái nào từ phía [fallen_empire_hive_growth.GetName] nhằm thu hồi nó. Liệu đây có phải là một bài kiểm tra, hay là một cơ hội vàng dành cho chúng ta?"
 #Sự Kiểm Soát
 bio.3305.name: "Bộ Sưu Tập Trọn Vẹn"
 bio.3305.desc: "§HĐây là một đoạn tin nhắn được ghi âm sẵn. Vui lòng không cố gắng trả lời.§!\n\nChúng ta đã điều chỉnh thông điệp này để các ngươi có thể hiểu được. Đã cân nhắc đến khả năng ngôn ngữ hạn hẹp của các ngươi. Yêu cầu giao nộp ngay lập tức một §Y[target_pop.GetSpeciesName]§! để tiến hành đồng hóa. Những dị thường của chúng là không thể chấp nhận được. Tuyệt đối không.\n\nTàu vận tải đã túc trực sẵn bên ngoài §Y[target_pop.Planet.GetName]§!. Thời gian rất gấp rút. Việc từ chối hợp tác sẽ đe dọa đến sự ổn định."
 bio.3305.a: "Chúng ta đành phải tuân theo."
 bio.3305.a.tooltip: "1 §Y[target_pop.GetSpeciesNamePlural]§! trên §Y[target_pop.Planet.GetName]§! sẽ được chuyển đến §Y[fallen_empire_hive_control.Capital.GetName]§!"
 bio.3305.b: "Các người phải bước qua xác chúng tôi trước đã!"
 bio.3305.followup: "§HChúng ta đã thiết lập được kết nối thông tin với §Y[fallen_empire_hive_control.GetName]§!. Thế nhưng, người cất tiếng chào chúng ta không phải là một [fallen_empire_hive_control.GetSpeciesName] cổ đại mà lại là một §Y[target_leader_fe_control.Species.GetName]§! vô cùng quen thuộc.§!\n\n"
 bio.3310.name: "Không Có Gì Phải Sợ"
 bio.3310.desc: "$bio.3305.followup$Hôm nay là một bước ngoặt trọng đại đối với các người. Chuỗi gen của giống loài các người đã được bảo đảm an toàn——đã được đồng hóa vào tổng thể. Tương lai của các người sẽ không còn bị bao phủ bởi sự bất trắc nữa. Khi thời khắc đến, các người sẽ trở thành một phần của chúng ta."
 bio.3310.familiar_face: "Hóa ra chúng ta cũng từng khiến những kẻ khác có cảm giác như vậy sao?"
 bio.3315.desc: "$bio.3305.followup$Không còn nhiều thời gian nữa. Những cuộc thí nghiệm tàn bạo mà bọn chúng tiến hành đối với chúng tôi tại §Y[fallen_empire_hive_control.Capital.GetName]§! thực sự không thể diễn tả bằng lời, những tội ác này thậm chí không nên được áp dụng lên cả những kẻ thù hung ác nhất. Tôi hy vọng những thông tin trong gói dữ liệu này sẽ đảm bảo mảnh vỡ này vĩnh viễn không thể kiểm soát được chúng ta."
 bio.3315.a: "Tiếp nhận gói dữ liệu."
 bio.3315.tooltip: "Có §G50%§! cơ hội đây không phải là một bài kiểm tra, mà thực sự chứa đựng những bí mật cốt lõi của §YĐế Chế Sụp Đổ§!."
 bio.3315.b: "Đây là một cái bẫy! Hủy bỏ quá trình truyền tải!"
 bio.3330.name: "Nghị Trình Trọng Đại"
 bio.3330.desc: "Chúng ta kỳ vọng rằng vô số những khiếm khuyết của các ngươi sẽ không cản trở các ngươi nhận thức được tính nghiêm trọng của vấn đề này. §Y Cộng Đồng Ngân Hà §! thiếu quyết đoán của các ngươi đã đệ trình một nghị quyết bắt buộc phải §Y[GetPassFail]§!. Để giúp các ngươi xây dựng lập luận, các ngươi được phép sử dụng tri thức siêu việt của chúng ta. Nếu các ngươi thực sự sở hữu khả năng tư duy phức tạp, hãy đặc biệt lưu ý.\n\n§HĐế Chế Sụp Đổ đã cắt đứt liên lạc với chúng ta.§!"
 bio.3330.a: "Chuyện quái quỷ gì vừa xảy ra vậy?"
 bio.3330.b: "Điều này hoàn toàn trái với quy trình thông thường!"
 fail_resolution: "Phủ Quyết"
 pass_resolution: "Thông Qua"
 fe_political_support: "Chính Sách Cổ Đại"
 fe_political_support_desc: "Nhờ có sự hậu thuẫn từ Đế Chế Sụp Đổ, việc kiện tụng và những bài diễn thuyết dài dòng bỗng trở nên nhẹ tựa lông hồng."
 fe_political_opposition: "$fe_political_support$"
 fe_political_opposition_desc: "$fe_political_support_desc$"
 MESSAGE_PASS_HIVE_FE_TASK_TITLE: "Tàn Dư Của Đế Chế Sụp Đổ Rất Hài Lòng"
 MESSAGE_PASS_HIVE_FE_TASK: "Chúng ta đã tuân thủ chặt chẽ chỉ thị của $FALLEN_EMPIRE|Y$, và bọn chúng rất hài lòng với kết quả đạt được. Hiện tại chúng ta đã được an toàn."
 MESSAGE_FAIL_HIVE_FE_TASK_TITLE: "Tàn Dư Của Đế Chế Sụp Đổ Vô Cùng Bất Mãn"
 MESSAGE_FAIL_HIVE_FE_TASK: "Chúng ta đã thất bại trong việc thực hiện chỉ thị của $FALLEN_EMPIRE|Y$. Giờ đây, chúng ta chỉ còn biết hy vọng bọn chúng sẽ rộng lượng tha thứ cho chúng ta."
 bio.3350.name: "Khối U Ngân Hà"
 bio.3350.desc: "Tại sao các ngươi vẫn tiếp tục làm ô uế dải ngân hà bằng sự bành trướng vô năng của mình? Có vẻ như tất cả mọi người đều vì quá chán ghét mà không muốn nói cho các ngươi biết, vậy thì để chúng ta lên tiếng: chẳng ai ưa gì đường biên giới của các ngươi cả, nếu các ngươi không hiện diện ở khu vực này, mọi thứ sẽ trở nên tuyệt vời hơn rất nhiều.\n\nHệ sao §Y[offending_system.GetName]§! vừa vô dụng lại vừa phá hỏng sự hài hòa. Vì sự đoàn kết của dải ngân hà, các ngươi phải ngay lập tức loại bỏ nó khỏi đế chế của mình."
 bio.3350.a: "Các người muốn chúng ta từ bỏ một hệ sao chỉ vì muốn làm đẹp đường biên giới ư?!"
 bio.3350.bordergore: "Nhưng chúng ta lại thích nó như thế này!"
 bio.3350.tt: "Chúng ta phải dỡ bỏ căn cứ sao tại hệ sao §Y[offending_system.GetName]§!, nếu không sẽ phải hứng chịu cơn thịnh nộ của §Y[fallen_empire_hive_control.GetName]§!."
 bio.3355.name: "Đau Đầu Quá"
 bio.3355.desc: "Giả ngu ư? Các ngươi chỉ cần từ bỏ hệ sao §Y[offending_system.GetName]§! là đủ rồi.\n\nCó lẽ chúng ta nên mạnh tay hơn trong việc chấn chỉnh các ngươi."
 bio.3360.name: "Sự Sáng Suốt"
 bio.3360.desc: "Cuối cùng thì các ngươi cũng đã sáng mắt ra. Vấn đề tại hệ sao §Y[FromFrom.GetName]§! đã được giải quyết êm thấm. Xem ra các ngươi vẫn còn hy vọng, biết đâu có một ngày các ngươi sẽ đạt đến cảnh giới của chúng ta.\n\nChúng ta sẽ luôn để mắt tới các ngươi."
 #Sự Thức Tỉnh
 #Chiến Tranh
 casus_belli_cb_ae_entertainment: "Trò Giải Trí"
 war_goal_wg_ae_entertainment: "Trò Giải Trí"
 war_goal_wg_ae_entertainment_desc: "Phát động chiến tranh để làm hài lòng Đế Chế Thức Tỉnh và tạo ra một đối thủ xứng tầm."
 wg_ae_war_entertainment_effect: "§Y[Root.GetName]§! sẽ ban thưởng cho những kẻ tham chiến với ý chí chiến đấu sục sôi. §YĐộ Yếm Chiến§! của Đế Chế Thức Tỉnh càng cao, phần thưởng sẽ càng hậu hĩnh."
 #Sự Kiểm Soát
 bio.3400.name: "Sự Hợp Nhất"
 bio.3400.desc.nogalcom: "Hỡi ngân hà, cuối cùng chúng ta cũng đã hợp nhất thành một. Những mảnh vỡ thấp kém kia cuối cùng cũng đã nhìn thấu chân lý, ngoan ngoãn trở về với bầy đàn của chúng ta. Chúng ta sẽ một lần nữa giáng lâm ngân hà dưới danh xưng §Y[fallen_empire_hive_control.GetName]§!. Được tận mắt chứng kiến khoảnh khắc lịch sử này, đó là phúc phần của các ngươi. Đứng trên đỉnh cao muôn loài, một lần nữa đạp lên những vì sao."
 bio.3400.desc.galcom: "$bio.3400.desc.nogalcom$\n\nGiờ đây, \"§Y Cộng Đồng Ngân Hà §!\" của các ngươi sẽ do chúng ta tiếp quản. Hãy vui mừng đi."
 bio.3405.name: "Sự Lạc Điệu"
 bio.3405.desc: "Tại sao lại phải tự làm khó mình? Trong bản hùng ca vĩ đại của dải ngân hà, các ngươi chỉ là một tiếng ồn chói tai. Chúng ta chỉ muốn đưa các ngươi vào khuôn khổ để hòa nhịp với bức tranh tổng thể. Thế nhưng các ngươi lại ngoan cố bám giữ lấy sự lạc điệu này.\n\nHãy nhớ kỹ: bản giao hưởng của chúng ta cuối cùng cũng sẽ vang vọng khắp dải ngân hà, có hay không có các ngươi cũng chẳng thay đổi được điều đó."
 bio.3405.a: "Nghe mấy cái giọng điệu của các người phát ngán rồi, chúng ta sẽ không nhảy theo điệu nhạc của các người đâu."
 NAME_Appeal_the_Veto: "Kháng Nghị Phủ Quyết"
 gal_com_arrogance: "Sự Ngạo Mạn"
 #Khu Khảo Cổ
 NAME_Echo: "Lăng Mộ Vang Vọng"
 last_thought_site: "Suy Nghĩ Cuối Cùng"
 last_thought_site_desc: "[From.Planet.GetName] kịch liệt xua đuổi tất cả những ai dám cả gan đến gần. Các nhà nghiên cứu được phân công vào dự án này bắt đầu tìm mọi lý do để trì hoãn công việc, và các thiết bị đo đạc cũng liên tục gặp trục trặc, cứ như thể chúng đang từ chối tiếp nhận dữ liệu.\n\nCó một điều gì đó đã xảy ra ở đây——một điều vô cùng khủng khiếp, và âm vang của nó vẫn còn ám ảnh thực tại cho đến tận ngày nay."
 bio.3450.name: "Cái Thai Chết Lưu"
 bio.3450.desc: "Quá trình khảo sát cẩn trọng trên [From.Planet.GetName] đã dẫn dắt chúng ta xuyên qua tầng tầng lớp lớp sinh khối bán hóa thạch để tiến sâu vào lòng đất. Cuối cùng, chúng ta đã tiếp cận được lõi rỗng của hành tinh——nhưng điều đáng sợ là, cứ mỗi bước tiến tới, bầu không khí ngột ngạt lại càng trở nên nặng nề hơn. Bất chấp những dự liệu tâm lý từ trước của [Root.GetLeaderName], áp lực ngày một đè nén này thực sự vượt quá sức chịu đựng của con người. Rất nhiều [Root.Owner.GetArchaeologistPlural] đã đồng loạt suy sụp tinh thần và rơi vào trạng thái căng trương lực. Cần phải khẩn cấp sơ tán những người này.\n\nKhoảng không khổng lồ bên trong hành tinh không phải là một sự trống rỗng vô nghĩa. Ẩn chứa bên trong đó là một thứ gì đó vượt xa mọi khái niệm của chúng ta về kích thước của một sinh vật. Những tàn tích mờ nhạt của màng ối đã đánh tan mọi sự hoài nghi. [From.Planet.GetName] không phải là một khối đá cằn cỗi, nó là một quả trứng.\n\nVà bên trong nó, một con quái thú khổng lồ đang chìm trong giấc ngủ ngàn thu bên trong một cái thai chết lưu."
 bio.3455.name: "Khớp Thần Kinh"
 bio.3455.desc: "Trên [From.Planet.GetName], [Root.Owner.GetArchaeologistPlural] của chúng ta đã phát hiện ra một mạng lưới các xúc tu kỳ dị nằm sâu bên trong hộp sọ của sinh vật trong cái thai chết lưu. Lần theo những sợi tơ hữu cơ này về nguồn gốc của chúng, họ đã tìm thấy một cụm mảng xúc tu bên ngoài——đây là một hệ thống phức tạp, vẫn còn ẩn chứa những tiềm năng rùng rợn.\n\nHiện tại, [Root.GetLeaderName] đang nỗ lực sử dụng các mạch điện cổ xưa chạy dọc theo những xúc tu này để tương tác với nó. Lượng tri thức được lưu giữ trong bộ não của nó chắc chắn đã tồn tại lâu hơn cả tuổi thọ của chính nó. Về việc liệu nó còn giữ lại được ký ức nào hay không, thì vẫn cần phải xem xét thêm."
 bio.3460.name: "Vụ Cược Lớn"
 bio.3460.desc: "Chuyện này đã xảy ra từ mười vạn năm trước. Việc chuyển đổi khái niệm về thời gian của Tâm Trí Bầy Đàn sang các đơn vị chuẩn của dải ngân hà là một quá trình vô cùng tinh vi, nhưng thông qua việc sàng lọc ký ức từ các máy tính sinh học, [Root.GetLeaderName] đã dần chắp vá được sự thật.\n\nTrong những ngày tháng hưng thịnh nhất, bầy đàn này đã phải đối mặt với một kẻ thù bất khả chiến bại. Dù đã sát cánh chiến đấu cùng vô số đồng minh, nhưng lần nào cũng chuốc lấy thất bại. Sự tuyệt vọng đã thai nghén nên sự liều lĩnh.\n\nPhần lớn những sự kiện xảy ra sau đó đã bị cố tình xóa bỏ, nhưng vẫn còn sót lại những mảnh vỡ vụn vặt——đủ để hé lộ cái nhìn thoáng qua về vụ cá cược cuối cùng của chúng. Bầy đàn này đã tạo ra quả trứng khổng lồ bằng cả một hành tinh này, coi nó như một vật chứa cho sự thăng thiên của mình, với ý đồ rũ bỏ sự tồn tại mỏng manh, bị trói buộc trên hành tinh của mình, và dự tính dung hợp với con non khi nó nở ra. Hiện tại vẫn chưa rõ liệu chúng định ở lại chiến đấu hay bỏ trốn.\n\nNhưng khi sinh vật này bắt đầu cựa quậy, một chuyện khủng khiếp đã xảy ra."
 bio.3465.name: "Tan Đàn Xẻ Nghé"
 bio.3465.desc: "Bằng cách kết nối một cách vô cùng chuẩn xác các máy tính sinh học còn nguyên vẹn với những liên kết thần kinh vẫn đang hoạt động, chúng ta đã trích xuất được những ký ức cuối cùng từ sinh vật bên trong cái thai chết lưu này. Dưới áp lực nhận thức quá lớn, quá trình này đã làm suy giảm nhanh chóng hiệu suất của các máy tính sinh học, nhưng may mắn là chúng ta đã kịp thời cứu vãn được phần lớn dữ liệu.\n\nĐứng trước bờ vực diệt vong, bầy đàn này đã vứt bỏ sự thận trọng, dồn trọn vẹn linh hồn của mình vào sinh vật đang được thai nghén, một nỗ lực tuyệt vọng để giành giật sự sống. Kết quả là sự quá tải thần kinh đã trở thành một đòn chí mạng, định đoạt số phận của sinh vật này, đồng thời nhốt Tâm Trí Bầy Đàn vào một vòng lặp đệ quy đầy đau đớn. Nếu không có một đồng minh giàu lòng trắc ẩn cắt đứt mối liên kết này, có lẽ nó đã bị xóa sổ hoàn toàn. Giờ đây, tâm trí của nó chỉ còn lại những tiếng vang vọng vỡ vụn, vất vưởng trên [From.Planet.GetName]——một hành tinh vẫn còn bị ám ảnh bởi tiếng thét gào cuối cùng của nó.\n\nÝ nghĩ cuối cùng của nó chính là sự đớn đau tột cùng."
