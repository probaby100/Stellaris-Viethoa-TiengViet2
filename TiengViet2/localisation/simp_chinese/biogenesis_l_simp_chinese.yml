 MESSAGE_BEHEMOTH_GROWTH_DESC: "Chúng ta đã ấp nở và nuôi dưỡng thành công một §YBehemoth Nuốt Chửng Bầu Trời§! to lớn hơn và mạnh mẽ hơn."
 behemoth_incubation_poi_name: "Behemoth Khổng Lồ Đang Ấp Nở"
 behemoth_incubation_poi_desc: "Một trong những con Behemoth Nuốt Chửng Bầu Trời của chúng ta đang trong quá trình ấp nở tại hành tinh khí khổng lồ §H[incubation_planet.GetName]§!. Dự kiến nó sẽ trưởng thành hoàn toàn sau §H[incubation_planet.behemoth_incubation_timer]§! nữa."
