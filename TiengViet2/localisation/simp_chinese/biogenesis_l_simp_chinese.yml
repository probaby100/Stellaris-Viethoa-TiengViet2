 subject_dna: "Thuế Gen"
 subject_dna_desc: "Điều khoản này quy định việc chư hầu có phải nộp mẫu gen cho quốc gia bá chủ hay không."
 subject_gives_evopred_dna: "Thuế Gen"
 subject_gives_evopred_dna_desc: "Chư hầu này sẽ nộp thông tin di truyền cho bá chủ."
 subject_gives_no_evopred_dna: "Không Thu Thuế Gen"
 subject_gives_no_evopred_dna_desc: "Chư hầu này không phải nộp thông tin di truyền cho bá chủ."
 bio.1005.name: "Hấp Thu Năng Lực"
 bio.1005.desc: "Quá trình tiến hóa của giống loài chúng ta ngày càng trở nên phức tạp. Sau khi tìm được những vật chất di truyền mới giữa các vì sao, chúng ta đã sẵn sàng để hấp thu một phần trong số đó. Sự cống hiến không ngừng nghỉ của các [Owner.GetScientistPlural] đã mang đến cho chúng ta vài sự lựa chọn.\n\nBất kể quyết định nào được đưa ra cũng sẽ ảnh hưởng sâu sắc đến tương lai của các thế hệ [Owner.GetSpeciesName] mai sau."
 bio.1005.tt: "Thêm một Đặc Điểm Loài mới vào giống loài chính của chúng ta."
 bio.1005.pop_growth: "Giống loài của chúng ta cần phát triển nhanh hơn nữa!"
 bio.1005.pop_output: "Chúng ta có thể nâng cao năng suất không?"
 bio.1005.leader: "Lãnh đạo của chúng ta cần được trang bị mọi ưu thế."
 bio.1005.habitability: "Chúng ta cần thích nghi với những biến đổi của khí hậu."
 bio.1005.upkeep: "Cắt giảm chi phí bảo trì cần thiết để duy trì dân số của chúng ta."
 bio.1005.humanoid: "Những đặc điểm của loài Hình Người có thể nâng cao khả năng thích ứng của chúng ta."
 bio.1005.mammalian: "Vẫn còn nhiều bí ẩn ẩn giấu trong bộ gen Động Vật Có Vú."
 bio.1005.reptilian: "Bộ gen Bò Sát quả thực vô cùng độc đáo."
 bio.1005.avian: "Loài Chim có thể giúp chúng ta trở nên thanh thoát vô cùng."
 bio.1005.arthropoid: "Loài Động Vật Chân Đốt cũng khá là giòn rụm và ngon miệng đấy chứ."
 bio.1005.molluscoid: "Loài Động Vật Thân Mềm cũng có thể trở thành người thầy của chúng ta."
 bio.1005.fungoid: "Loài Nấm bành trướng rất nhanh — chúng ta cũng có thể làm được như thế."
 bio.1005.plantoid: "Hiệu suất năng lượng của loài Thực Vật sẽ mang lại lợi ích to lớn."
 bio.1005.lithoid: "Bộ gen Đất Đá tuy khó nuốt, nhưng biết đâu lại mang đến những tiềm năng hấp dẫn."
 bio.1005.necroid: "Dù sao thì thể xác của loài Necroid cũng vẫn là thể xác."
 bio.1005.aquatic: "Sức sống bền bỉ của loài Thủy Sinh có thể mang lại những chiến lược sinh tồn cả khi không ở dưới nước."
 bio.1005.toxoid: "Loài Độc Tố quả thực là một món ăn §Gchua cay kích thích vị giác§!."
 bio.1005.infernal: "Loài Nguồn Gốc Địa Ngục §Rcó thể bốc cháy§!, nhưng chúng ta sẽ có cách xử lý ổn thỏa."
 bio.1005.plasmic: "Sự ổn định của gen plasma sẽ là một bữa tiệc thịnh soạn."
 bio.1005.leviathan: "Những sinh vật khổng lồ trong thiên hà có thể dạy chúng ta điều gì?"
 bio.1005.psionic: "Rốt cuộc thì thứ gì trong bộ gen linh năng đã đánh thức khả năng nhận thức siêu phàm đến vậy?"
 bio.1005.random: "Hãy ôm lấy sự hỗn loạn — hãy để trực giác dẫn đường!"
 bio.1005.no_reward: "Chúng ta vốn đã đủ phức tạp rồi."
 bio.1005.unnatural_selection: "Hãy để sức mạnh của sự đột biến dẫn dắt chúng ta vượt qua những giới hạn của tự nhiên."
 has_tr_mutation_unnatural_selection_evo_pred_tt: "Tùy chọn này khả dụng nhờ việc đã chọn truyền thống §Y$tr_mutation_unnatural_selection$§!."
 has_tr_mutation_nucleotide_isolation_evo_pred_tt: "Tùy chọn này khả dụng nhờ việc đã chọn truyền thống §Y$tr_mutation_nucleotide_isolation$§!."
 #Công Cụ Sửa Đổi
 fresh_biosphere: "Sinh Quyển Mới Mẻ"
 fresh_biosphere_desc: "Một hành tinh mới tinh đang chờ chúng ta thưởng thức. Những người định cư đang bận rộn lập danh mục và tìm hiểu mọi thứ tồn tại trên hành tinh này."
 fresh_biosphere_tt: "Tiến Độ Tình Huống Hàng Tháng §Y$evolutionary_predators_situation$§!: §G+10§!"
 exhausted_biosphere: "Sinh Quyển Cạn Kiệt"
 exhausted_biosphere_desc: "Chẳng còn gì mới mẻ ở đây nữa; những người định cư từng lùng sục mọi ngóc ngách để tìm kiếm những đặc điểm sinh học độc đáo giờ đã cảm thấy mãn nguyện."
 exhausted_biosphere_tt: "Tiến Độ Tình Huống Hàng Tháng §Y$evolutionary_predators_situation$§!: §G+1§!"
 genetic_soup: "Món Súp Di Truyền"
 genetic_soup_desc: "Hành tinh này đã không ngừng sản sinh ra những dị thường di truyền từ thuở khai thiên lập địa. Cư dân trên những lục địa này vô cùng đa dạng và kỳ lạ."
 turtle_world_modifier_evopred: "Hành Tinh Nima: Bảng Danh Mục"
 turtle_world_modifier_evopred_desc: "Cư dân trên hành tinh này đã nhanh chóng bắt tay vào quan sát hệ động thực vật địa phương và thu thập các mã gen độc đáo của chúng."
 eat_the_titans_evopred: "$eat_the_titans$"
 eat_the_titans_evopred_desc: "$eat_the_titans_desc$"
 eat_the_titans_evopred_tt: "$fresh_biosphere_tt$\n$farmer_is_titan_hunter_tt$"
 #Nghề Nghiệp
