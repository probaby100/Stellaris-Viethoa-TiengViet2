 job_death_priest_icon: "£job_death_priest£"
 job_mortal_initiate: "Tín Đồ Hiến Tế"
 job_mortal_initiate_plural: "Tín Đồ Hiến Tế"
 job_mortal_initiate_desc: "Những sứ đồ ngoan đạo nhất sẽ cống hiến trọn vẹn phần đời còn lại cho con đường hành thiện của toàn xã hội —— cái đích của quá trình tu tập này chính là tự nguyện hiến dâng mạng sống của mình làm vật tế."
 job_mortal_initiate_effect_desc: "[mortal_initiate.GetIcon][mortal_initiate.GetNamePlural] tạo ra £unity£§Y$unity$§!, £society£§Y$society_research$§! và £mod_planet_amenities_add£§Y$PLANET_AMENITIES_TITLE$§!"
 mod_job_mortal_initiate_add: "Công việc [mortal_initiate.GetName]"
 mod_job_mortal_initiate_per_pop: "Mỗi $VALUE$ dân cung cấp §G+1§! công việc [mortal_initiate.GetName]"
 mod_job_mortal_initiate_per_pop_short: "\nMỗi $VALUE$£pop£ thêm §G1§!£mod_job_mortal_initiate_add£"
 jobs_death_priest_and_mortal_initiate_effect_desc: "$job_death_priest_effect_desc$\n$job_mortal_initiate_effect_desc$"
 edict_sacrifice_unity_boost: "\n\nTăng sản lượng £unity£đoàn kết của £job_death_priest£$job_death_priest_plural$ trong thời gian sắc lệnh có hiệu lực.\n"
 edict_sacrifice_dummy: "Hiến Tế"
 edict_sacrifice_dummy_desc: "Những tín đồ ngoan đạo nhất của chúng ta đã sẵn sàng đón nhận số phận của mình, họ luôn khao khát được hiến dâng mạng sống vì một xã hội tốt đẹp hơn. Với các nghi lễ hiến tế §HĐoàn Kết Một Lòng§!, §HHòa Thuận Ấm Êm§! và §HTiền Của Dồi Dào§!, họ sẽ không phải chờ đợi lâu thêm nữa."
 edict_sacrifice_dummy_tooltip: "§RToàn bộ [mortal_initiate.GetIcon][mortal_initiate.GetNamePlural] sẽ chết.§! Tùy vào nghi thức được chọn, mỗi người dân bị hiến tế sẽ mang lại một lượng điểm £unity£đoàn kết, độ hạnh phúc dân số, hay là sản lượng £minerals£khoáng sản và £energy£điểm năng lượng tăng thêm. $edict_sacrifice_unity_boost$"
 sacrifice_death_priest_mod: "Hiến Tế Trọng Đại"
 sacrifice_death_priest_mod_desc: "Một nhóm lớn các tín đồ thành tâm nhất đã đón nhận sứ mệnh của mình, để lại sức ảnh hưởng sâu sắc đến các giáo sĩ của chúng ta."
 edict_sacrifice_togetherness: "Hiến Tế: Đoàn Kết Một Lòng"
 edict_sacrifice_togetherness_desc: "Những tín đồ thành tâm nhất trong số chúng ta đã sẵn sàng đón nhận số phận của mình, qua đó bảo đảm xã hội của ta sẽ hòa làm một khối gắn kết bền chặt. Hãy để ánh sáng của tình đoàn kết soi rọi vùng không gian tăm tối và tĩnh mịch!"
 edict_sacrifice_togetherness_tooltip: "§RToàn bộ [mortal_initiate.GetIcon][mortal_initiate.GetNamePlural] sẽ chết.§! Mỗi người dân bị hiến tế sẽ làm tăng tỷ lệ nhận thêm điểm £unity£đoàn kết. $edict_sacrifice_unity_boost$"
 sacrifice_togetherness_mod: "Hiến Tế Bổ Sung: Đoàn Kết Một Lòng"
 sacrifice_togetherness_mod_desc: "Những tín đồ ngoan đạo nhất của chúng ta đã đi đến cái đích được định sẵn; sự hiến thân của họ là cột trụ chống đỡ cho lý tưởng đoàn kết một lòng của chúng ta. Hãy để ánh sáng của tình đoàn kết xua tan đi màn đêm cô độc ngoài không gian kia!"
 sacrifice_togetherness_1: "$sacrifice_togetherness_mod$"
 sacrifice_togetherness_1_desc: "$sacrifice_togetherness_mod_desc$"
 sacrifice_togetherness_2: "$sacrifice_togetherness_mod$"
 sacrifice_togetherness_2_desc: "$sacrifice_togetherness_mod_desc$"
 sacrifice_togetherness_3: "$sacrifice_togetherness_mod$"
 sacrifice_togetherness_3_desc: "$sacrifice_togetherness_mod_desc$"
 sacrifice_togetherness_4: "$sacrifice_togetherness_mod$"
 sacrifice_togetherness_4_desc: "$sacrifice_togetherness_mod_desc$"
 sacrifice_togetherness_5: "$sacrifice_togetherness_mod$"
 sacrifice_togetherness_5_desc: "$sacrifice_togetherness_mod_desc$"
 sacrifice_togetherness_mod_overlord: "$edict_sacrifice_togetherness$"
 sacrifice_togetherness_mod_overlord_desc: "Quốc gia bảo hộ đã cử hành một nghi lễ kỳ lạ, nhưng lại vô cùng đáng kính. Dù một số người trong chúng ta đã bị hiến tế, thế nhưng chúng ta lại cảm thấy mình được xích lại gần hơn với các bậc tông chủ."
 edict_sacrifice_harmony: "Hiến Tế: Hòa Thuận Ấm Êm"
 edict_sacrifice_harmony_desc: "Những tín đồ sùng đạo nhất của chúng ta đã sẵn sàng đón nhận số phận. Phút giây họ dâng hiến mạng sống đã được biến thành một ngày lễ hội hân hoan. Hãy để mỗi một ngày trôi qua đều là một lời chào tôn kính gửi tới cuộc sống tươi đẹp này!"
 edict_sacrifice_harmony_tooltip: "§RToàn bộ [mortal_initiate.GetIcon][mortal_initiate.GetNamePlural] sẽ chết.§! Mỗi người dân bị hiến tế sẽ làm tăng tỷ lệ nhận thêm độ hạnh phúc dân số. $edict_sacrifice_unity_boost$"
 sacrifice_harmony_mod: "Hiến Tế Bổ Sung: Hòa Thuận Ấm Êm"
 sacrifice_harmony_mod_desc: "Những tín đồ thành tâm nhất của ta đã đón nhận cái kết số mệnh của mình; sự hiến dâng của họ là bệ đỡ cho sự hòa thuận ấm êm của chúng ta. Hãy để mỗi ngày đều là một lời tán dương gửi đến một cuộc sống tuyệt vời!"
 sacrifice_harmony_1: "$sacrifice_harmony_mod$"
 sacrifice_harmony_1_desc: "$sacrifice_harmony_mod_desc$"
 sacrifice_harmony_2: "$sacrifice_harmony_mod$"
 sacrifice_harmony_2_desc: "$sacrifice_harmony_mod_desc$"
 sacrifice_harmony_3: "$sacrifice_harmony_mod$"
 sacrifice_harmony_3_desc: "$sacrifice_harmony_mod_desc$"
 sacrifice_harmony_4: "$sacrifice_harmony_mod$"
 sacrifice_harmony_4_desc: "$sacrifice_harmony_mod_desc$"
 sacrifice_harmony_5: "$sacrifice_harmony_mod$"
 sacrifice_harmony_5_desc: "$sacrifice_harmony_mod_desc$"
 sacrifice_harmony_mod_overlord: "$edict_sacrifice_harmony$"
 sacrifice_harmony_mod_overlord_desc: "Nước bảo hộ đã tổ chức một nghi lễ kỳ quặc nhưng lại vô cùng dung hòa. Dẫu một vài người trong số chúng ta đã bị hiến tế, nhưng những người ở lại lại càng cảm nhận rõ hơn bao giờ hết sự hài hòa của vạn vật."
 edict_sacrifice_bounty: "Hiến Tế: Tiền Của Dồi Dào"
 edict_sacrifice_bounty_desc: "Những con chiên sùng bái nhất đã sẵn sàng cho số phận của bản thân, lòng cống hiến tột bậc của họ sẽ đem đến sự sung túc cho xã hội này. Cái chết sẽ gột rửa những sinh linh bé nhỏ, và phủ lên ánh vinh quang cho tinh hoa của sự tồn tại!"
 edict_sacrifice_bounty_tooltip: "§RToàn bộ [mortal_initiate.GetIcon][mortal_initiate.GetNamePlural] sẽ chết.§! Mỗi người dân hiến tế sẽ làm tăng xác suất nhận được thêm sản lượng £minerals£khoáng sản và £energy£năng lượng. $edict_sacrifice_unity_boost$"
 sacrifice_bounty_mod: "Hiến Tế Bổ Sung: Tiền Của Dồi Dào"
 sacrifice_bounty_mod_desc: "Những môn đồ thành tâm nhất của ta đã đón nhận vận mệnh cuối cùng; sự hi sinh của họ là hòn đá tảng cho lời tuyên thệ về sự phồn vinh của ta. Hãy để cái chết mở đường cho sự sống mới, và để vinh quang tỏa sáng trên mình."
 sacrifice_bounty_1: "$sacrifice_bounty_mod$"
 sacrifice_bounty_1_desc: "$sacrifice_bounty_mod_desc$"
 sacrifice_bounty_2: "$sacrifice_bounty_mod$"
 sacrifice_bounty_2_desc: "$sacrifice_bounty_mod_desc$"
 sacrifice_bounty_3: "$sacrifice_bounty_mod$"
 sacrifice_bounty_3_desc: "$sacrifice_bounty_mod_desc$"
 sacrifice_bounty_4: "$sacrifice_bounty_mod$"
 sacrifice_bounty_4_desc: "$sacrifice_bounty_mod_desc$"
 sacrifice_bounty_5: "$sacrifice_bounty_mod$"
 sacrifice_bounty_5_desc: "$sacrifice_bounty_mod_desc$"
 sacrifice_bounty_mod_overlord: "$edict_sacrifice_bounty$"
 sacrifice_bounty_mod_overlord_desc: "Tông chủ đã thực hiện một nghi lễ kỳ lạ nhưng vô cùng rộng lượng. Một số trong chúng ta đã bị hiến tế, thế nhưng những người còn lại lại được lấp đầy bởi thứ sức mạnh vô song."
 MESSAGE_OVERLORD_SACRIFICE_TITLE: "Đã Hiến Tế Các Tín Đồ"
 MESSAGE_OVERLORD_SACRIFICE_DESC: "Những §YTín Đồ Hiến Tế§! đã cống hiến cho tông chủ của chúng ta tại §Y$holding_sacrificial_shrine$§! đã bị hiến tế trong nghi thức vừa rồi."
 necroids.200.name: "Buổi Lễ Kết Thúc: [root.GetAdj] Đoàn Kết Một Lòng"
 necroids.200.desc: "Một bầu không khí tĩnh lặng bao trùm khắp [root.GetName]. Những người hành hương từ khắp nơi đang lên đường đổ về những nơi thờ phụng được chỉ định; trên suốt dọc đường, họ kết giao thêm bạn mới và thăm hỏi những người bạn cũ.\n\nNhững [mortal_initiate.GetNamePlural] mới xuất hiện cũng tuân theo và tham gia vào nghi thức của xã hội ta, họ xếp hàng tiến bước trong im lặng, nghe đồn cảnh tượng đó đã khiến những người chứng kiến vừa buồn lại vừa vui. Vị $job_death_priest$ trưởng của [capital_scope.GetName] đã dẫn dắt buổi lễ bằng một bài thuyết giáo ấm áp lòng người, kêu gọi các tín đồ hãy bồi đắp và gìn giữ những mối quan hệ với nhau, cùng nhau hưng thịnh trong sự tương thân tương ái.\n\nKhi [mortal_initiate.GetName] tiến vào điện hiến tế, đám đông cùng cất tiếng thở dài tiễn biệt. Ngay lúc này họ đã chạm đến điểm cuối của mình, để lại một nét chấm phá chói lọi trong công cuộc nghiên cứu nhân học."
 necroids.200.tooltip.base: "Sự hiến mình của [mortal_initiate.GetIcon][mortal_initiate.GetNamePlural] đã đem lại §Hthêm§!"
 necroids.200.tooltip.1: "$necroids.200.tooltip.base$ §H+6% sản lượng £unity£đoàn kết§!."
 necroids.200.tooltip.2: "$necroids.200.tooltip.base$ §H+12% sản lượng £unity£đoàn kết§!."
 necroids.200.tooltip.3: "$necroids.200.tooltip.base$ §H+18% sản lượng £unity£đoàn kết§!."
 necroids.200.tooltip.4: "$necroids.200.tooltip.base$ §H+24% sản lượng £unity£đoàn kết§!."
 necroids.200.tooltip.5: "$necroids.200.tooltip.base$ §H+30% sản lượng £unity£đoàn kết§!."
 necroids.201.name: "Buổi Lễ Kết Thúc: [root.GetAdj] Hòa Thuận Ấm Êm"
 necroids.201.desc: "Những lời xì xầm phấn khích lan truyền khắp [root.GetName]. Các đoàn hành hương chờ đợi ở những địa điểm thờ phụng đã được chỉ định, dẫu đường xa mệt nhọc nhưng họ vẫn vô cùng xúc động.\n\nNhững [mortal_initiate.GetNamePlural] mới xuất hiện cũng đang tuân theo và tham dự vào nghi lễ của xã hội ta, họ nối đuôi nhau lẳng lặng bước lên, còn những người ngoài đứng xem thì lịch sự bày tỏ lòng biết ơn tới họ. Vị $job_death_priest$ trưởng của [capital_scope.GetName] đi đầu thực hiện một buổi thuyết giáo hân hoan, kêu gọi các tín đồ hãy nắm bắt những phút giây ngập tràn niềm vui. Khi nghi thức đạt đến thời khắc cao trào nhất, các [mortal_initiate.GetName] tiến vào điện hiến tế giữa những tràng pháo tay cuồng nhiệt. Ngay lúc này họ đã chạm đến điểm cuối của mình, để lại một nét chấm phá chói lọi trong công cuộc nghiên cứu nhân học."
 necroids.201.tooltip.1: "$necroids.200.tooltip.base$ §H+10% £happiness£độ hạnh phúc dân số§!."
 necroids.201.tooltip.2: "$necroids.200.tooltip.base$ §H+20% £happiness£độ hạnh phúc dân số§!."
 necroids.201.tooltip.3: "$necroids.200.tooltip.base$ §H+30% £happiness£độ hạnh phúc dân số§!."
 necroids.201.tooltip.4: "$necroids.200.tooltip.base$ §H+40% £happiness£độ hạnh phúc dân số§!."
 necroids.201.tooltip.5: "$necroids.200.tooltip.base$ §H+50% £happiness£độ hạnh phúc dân số§!."
 necroids.202.name: "Buổi Lễ Kết Thúc: [root.GetName] Tiền Của Dồi Dào"
 necroids.202.desc: "Sự sung túc tràn ngập khắp [root.GetName], những người đi hành hương tụ tập tại những chốn thờ cúng đã định. Thỉnh thoảng họ lại dâng đồ cúng tế; nhiều người tranh thủ kiếm lời từ vô số những sạp hàng và cửa tiệm ven đường chuyên phục vụ cho vùng đất thánh.\n\nNhững [mortal_initiate.GetNamePlural] đợt này đã tuân theo và tham gia vào đủ loại nghi thức khác nhau, họ khoác lên mình những vòng hoa rực rỡ và lẳng lặng nối đuôi nhau bước lên. Vị $job_death_priest$ trưởng của [capital_scope.GetName] đã đưa ra một bài thuyết giảng đầy ẩn ý, hứa hẹn rằng một kỷ nguyên sinh sôi nảy nở và tiện nghi sẽ đến với tất cả mọi người.\n\nSau khi bài thuyết giáo khép lại, các [mortal_initiate.GetName] hướng về phía điện hiến tế, nơi họ đón chào điểm cuối của bản thân, để lại một nét chấm phá chói lọi trong công cuộc nghiên cứu nhân học."
 necroids.202.tooltip.1: "$necroids.200.tooltip.base$ §H+6% sản lượng £minerals£khoáng sản và £energy£năng lượng§!."
 necroids.202.tooltip.2: "$necroids.200.tooltip.base$ §H+12% sản lượng £minerals£khoáng sản và £energy£năng lượng§!."
