 ### Việc Làm Trọn Đời bởi Victor Haeggman
 civic_permanent_employment: "Chế Độ Thuê Mướn Vĩnh Viễn"
 civic_permanent_employment_desc: "Các tập đoàn vũ trụ có thể bảo đảm cho nhân viên của mình sẽ "không bao giờ" rơi vào cảnh thất nghiệp. Mãi mãi không. Khi ngọn nến sinh mệnh của một người vụt tắt, cái xác của họ sẽ được tái phân bổ vào những vị trí đơn giản, nhờ thế mà họ vẫn tiếp tục chu cấp cho gia đình và trả nợ."
 civic_tooltip_permanent_employment_effects: "Có thể xây dựng £building£§Y$building_posthumous_employment_center$§!\n$job_reassigner_effect_desc$\n\nCho phép xây dựng bất động sản £building£§Y$holding_reemployment_center$§!\n\nMột số thực thể không gian hữu cơ bị tiêu diệt có thể được hồi sinh."
 civic_tooltip_corporate_permanent_employment_effects: "$civic_tooltip_permanent_employment_effects$\n£building£§Y$building_food_conglomerate$§!$megacorp_civic_branch_office_building_effect$"
 job_reassigner: "Nhân Viên Tái Bổ Nhiệm"
 job_reassigner_desc: "Hễ có công dân nào của tập đoàn vũ trụ qua đời, những Nhân Viên Tái Bổ Nhiệm này sẽ cam đoan rằng cái xác của họ vẫn sẽ tiếp tục lao động miệt mài cho đến khi hợp đồng được thanh lý trọn vẹn."
 job_reassigner_plural: "Nhân Viên Tái Bổ Nhiệm"
 job_reassigner_effect_desc: "£job_necromancer£[reassigner.GetNamePlural] sẽ chuyển hóa £consumer_goods£§Y$consumer_goods$§! cùng với £food£§Y$food$§! hoặc £minerals£§Y$minerals$§! thành £mod_logistic_growth_mult£§Y$MOD_BONUS_POP_GROWTH$§!. Tất cả £pop£dân số được lắp ráp sẽ đi kèm với đặc điểm §Y$trait_zombie$§!."
 planet_reassigners: "Công Việc Nhân Viên Tái Bổ Nhiệm"
 mod_job_reassigner_add: "Công việc [reassigner.GetName]"
 trait_zombie: "Thây Ma"
 trait_zombie_desc: "§LĐây là thi hài của một sinh mệnh có trí tuệ từng rất kiêu hãnh, nhưng cỗ xác khô này nay chỉ có thể gánh vác những nhiệm vụ cơ bản và giản đơn nhất.§!"
 TRAIT_ZOMBIE_EFFECT: "$MOD_POP_BONUS_WORKFORCE_MULT$: §R-25%§!\n$t$—$civilian_and_maintenance_drone_cat_bonus_workforce_mult$: §R-50%§!\n$t$—Phí duy trì dân số giảm: §G100%§!\n$t$—Không thể tạo ra §YLãnh Đạo§!\n$t$—Không thể làm những công việc §Y$pop_cat_ruler$§! hoặc §Y$pop_cat_specialist$§!"
 building_posthumous_employment_center: "Trung Tâm Việc Làm Sau Khi Chết"
 building_posthumous_employment_center_desc: "Tại Trung Tâm Việc Làm Sau Khi Chết, những thi thể bị tước đoạt ý thức có thể tìm thấy mục tiêu mới, cũng như có cơ hội để cày cuốc trả nợ."
 edict_sacrifice_bounty_zombie: "$edict_sacrifice_bounty$"
 edict_sacrifice_bounty_zombie_desc: "Một nhóm những người sùng đạo nhất của ta đã sẵn sàng gánh vác sứ mệnh đời mình, họ một lòng tin tưởng rằng sự hi sinh cuối cùng sẽ giúp cho cả xã hội này trở nên trù phú hơn. Cái chết của chúng ta sẽ mang lại một nguồn giá trị khổng lồ cho tập đoàn, trong khi thân xác ta vẫn sẽ tiếp tục phục vụ tập đoàn không ngừng nghỉ."
 edict_sacrifice_bounty_zombie_tooltip: "$edict_sacrifice_bounty_tooltip$\nTất cả £job_necromancer£[reassigner.GetNamePlural] tăng thêm §G1§!£mod_logistic_growth_mult£§Y$MOD_BONUS_POP_GROWTH$§!"
 necroids.260.name: "Kiến Thợ Mục Nát Cần Mẫn"
 necroids.260.desc: "Ban Giám Đốc của ta vừa mới tề tựu lại để tổ chức một buổi họp ba chiều nhằm thảo luận về doanh số bán các mặt hàng vệ sinh dành cho thây ma, thì bỗng nhiên, vị quản lý của chi nhánh Công Ty Tài Sản Cải Tử Hoàn Sinh đã xộc thẳng vào phòng họp. "Một thây ma trên §Y[debt_free_zombie.Planet.GetName]§! đã trả xong khoản nợ của hắn rồi!" Mọi người còn chưa kịp hiểu mô tê gì thì gã quản lý đã thốt lên. Cuộc họp lập tức bị ngưng lại và nhanh chóng nhường chỗ cho sự hỗn loạn bủa vây. Mọi giám đốc có mặt đều yêu cầu phải làm rõ chuyện này, bởi nó có thể sẽ ảnh hưởng trực tiếp đến nguồn cung ứng lao động thây ma của họ.\n\nSau khi phân tích kỹ càng hơn, kết luận đưa ra là đây chỉ là một sự cố hi hữu vô cùng hiếm gặp. Trừ phi cái xác của kẻ đó có thể trụ vững được đến trọn một thế kỷ thì may ra mới trả sạch nợ nần được —— nhìn chung thì tỉ lệ đó là vô cùng nhỏ giọt. Tập đoàn của ta sẽ chẳng hề hấn gì nếu quyết định cho đám đó yên nghỉ vĩnh viễn."
 necroids.260.a: "Chúng đã tự mình giành lấy sự tự do, hãy cho chúng yên nghỉ."
 necroids.260.b: "Viết thêm mấy số 0 vào tờ giấy ghi nợ là xong chuyện ấy mà."
 zombie_contract_manipulation: "Thao Túng Hợp Đồng Thây Ma"
 zombie_contract_manipulation_desc: "Đế chế này đã luồn lách để giở trò trong hợp đồng lao động thây ma, giờ đây thì đám thây ma có mơ mới thoát khỏi cảnh nợ nần."
 ### Ong Thợ Nấm Ký Sinh bởi Victor Haeggman
 civic_hive_cordyceptic_drones: "Ong Thợ Đông Trùng Hạ Thảo"
 civic_hive_cordyceptic_drones_desc: "Những con ong thợ được đặc tả chuyên môn cao, chuyên để lây nhiễm các vật chủ đơn giản rồi đưa ra một vài mệnh lệnh cơ bản, chúng tạo nên xương sống cho mạng lưới phòng thủ liên sao của tổ ong."
 civic_tooltip_cordyceptic_drones: "—Bắt đầu với §G3§! §HAmip Phục Sinh§!.\n—Các đàn quái thú không gian hữu cơ sẽ tự động hồi sinh sau khi bị đánh bại.\n—Một số thực thể không gian hữu cơ có thể được hồi sinh sau khi bị tiêu diệt.\n—$reanimator_effect_desc$\n—Có thể kiếm được £genetic_material£['concept_dna'] thông qua việc tiêu diệt đàn quái thú không gian.\n"
 civic_wilderness_cordyceptic_drones: "Cá Thể Cộng Sinh Đông Trùng Hạ Thảo"
 civic_wilderness_cordyceptic_drones_desc: "Các dạng cộng sinh nấm chuyên môn hóa cao có thể lây nhiễm vật chủ và đưa ra các chỉ lệnh giản đơn, ban cho vùng hoang dã khả năng tự vệ."
 MESSAGE_REANIMATION_COMPLETE_TITLE: "Hồi Sinh Hoàn Tất"
 MESSAGE_REANIMATION_COMPLETE_TIYANKI_DESC: "Một đàn Tiyanki mới toanh vừa được đánh thức ở $SYSTEM|Y$ đang trong tư thế sẵn sàng chờ lệnh. Lứa tiếp theo cũng sắp xong rồi."
 MESSAGE_REANIMATION_AMOEBA_TIYANKI_DESC: "Một đàn amip mới toanh vừa được hồi sinh ở $SYSTEM|Y$ đang trong tư thế sẵn sàng chờ lệnh. Lứa tiếp theo cũng sắp xong rồi."
 necroids.310.name: "Kháng Virus"
 necroids.310.desc: "Bầy Đàn Prethoryn đang tìm cách lẻn vào bên trong §Rchúng ta§!!\n\nNhững kẻ ngoại lai nham hiểm này đã ra tay chớp nhoáng bắt giữ các [root.GetNecromancersLower] của ta. Từ đó, những đàn sâu bọ khác bắt đầu túa ra gom góp thêm hàng loạt [root.GetIndividualNamePlural] quanh đó. Chúng ta cần quét sạch khu lây nhiễm này để chắc chắn [Root.GetName] sẽ được an toàn."
 necroids.310.a: "Phải tiêu diệt lũ này"
 sm_cordyceptic_reanimation_facility: "Cơ Sở Hồi Sinh Đông Trùng Hạ Thảo"
 sm_cordyceptic_reanimation_facility_desc: "§LThường thì ta cần tìm kiếm các cá thể mới chết để tiến hành phục sinh, nhưng một khi đã chiếm đóng các hệ sao nuôi dưỡng sinh mệnh, ta có thể xâm nhập chúng từ giai đoạn sớm hơn để duy trì nguồn cung vật chủ ổn định.§!\n"
 requires_tiyanki_spawning_system: "§RChỉ được xây dựng bên trong các hệ sao §Y Tổ Tiyana§!, §YTiyun Ort§! hoặc §YAmor Alveo§!.§!"
 sm_cordyceptic_reanimation_facility_desc_modifier: "Khi được xây dựng ở những hệ sao tràn ngập sự sống hữu cơ, cơ sở này sẽ tạo ra một §YHạm Đội Phục Sinh§! cứ sau mỗi §G5 năm§!."
