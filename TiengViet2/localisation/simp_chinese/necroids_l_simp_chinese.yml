 NECROIDS_TITLE: "Necroids Species Pack" #Do not translate
 DLC_NECROIDS_RECOMMENDATION_DESC: "§S《Necroids》§! là một gói loài cho phép bạn hóa thân thành một chủng tộc tôn thờ cái chết."
 DLC_NECROIDS_RECOMMENDATION_THEME_REC: "Chủ đề \"sinh tử tồn vong\" của §SNecroids§! cực kỳ phù hợp với bối cảnh cốt truyện đế chế của bạn, rất đáng để thử!"
 DLC_NECROIDS_RECOMMENDATION_NECROPHAGE_REC: "Khởi nguyên và tư tưởng quốc gia hoàn toàn mới của §SNecroids§! đã đi tiên phong cho lối chơi này, bạn rất đáng để sở hữu!"
 ### Necrophage Origin by Pierre du Plessis
 origin_necrophage: "Văn hóa ăn xác"
 origin_necrophage_desc: "Nền văn minh này đã tiến hóa thành một dạng ký sinh sống dựa vào các dạng sống có trí tuệ khác. Khi họ bước lên vũ đài ngân hà, các loài khác một là được xem như môn đồ và được kết nạp vào hàng ngũ của họ, hai là trở thành thức ăn cho họ. Trước những kẻ ăn xác, không có lựa chọn thứ ba."
 origin_tooltip_necrophage_effects: "—$HOMEWORLD$['concept_necrophage_elevation_chamber']$NEW_LINE$—$SPECIES_TRAITS$['concept_necrophage_trait']$NEW_LINE$—£pop£ §IDân số§! phụ: 1.2K$NEW_LINE$—['concept_guaranteed_colonies']: Thay thế bằng ['concept_preftl_civilizations']"
 origin_tooltip_necrophage_negative_effects: "—Chỉ có £pop£ §Idân số Tử linh§! mới có thể trở thành £pop_cat_ruler£ §INhà cai trị§! hoặc được thuê làm §ILãnh đạo§!"
 civic_necrophage_secondary_species: "Loài tiền tử linh"
 trait_necrophage: "Tử linh"
 trait_necrophage_desc: "§LLoài gần như bất tử này sinh sôi và phát triển dựa vào việc phân giải và tiêu hóa các loài khác.§!"
 trait_necrophage_gestalt_tooltip: "§PChỉ số hiệu chỉnh sản lượng dân số này không có tác dụng với dân số Ý thức Tổ đàn.§!"
 building_necrophage_elevation_chamber: "Phòng Thăng hoa"
 building_necrophage_elevation_chamber_desc: "Những người chờ đợi sự chuyển hóa sẽ dành cả ngày trong Phòng Thăng hoa, nghiên cứu các nghi thức và luật lệ của [This.Owner.GetSpeciesNamePlural]."
 building_necrophage_elevation_chamber_desc_hive: "Những sinh vật chờ đợi sự chuyển hóa sẽ dành cả ngày trong Phòng Thăng hoa, chuẩn bị sẵn sàng để hòa nhập vào ý thức tập thể của [This.Owner.GetAdj]."
 disables_necrophage_growth: "§P£building£ Công trình này vô hiệu hóa sự tăng trưởng dân số của loài §Y Tử linh§!!§!"
 necrophage_elevation_timer_tooltip: "Nghi thức Thăng hoa tiếp theo trên §Y[This.GetName]§! sẽ được tổ chức vào §Y[This.necrophage_elevation_timer]§!.\n\n"
 building_necrophage_elevation_chamber_scaling_tooltip: "Để đảm bảo nguồn cung cấp [necro_apprentice.GetIcon][necro_apprentice.GetNamePlural] dồi dào, số lượng công việc sẽ dao động từ §Y100§! đến §Y300§!, mức dao động tùy thuộc vào sự §YTăng trưởng dân số§!.\n\n"
 building_necrophage_house_of_apotheosis: "Tiên đường Thi giải"
 building_necrophage_house_of_apotheosis_desc: "Một tòa nhà vô cùng tráng lệ, nơi những cá thể chờ đợi được thăng hoa thành [This.Owner.GetSpeciesNamePlural] trải qua những ngày tháng cuối cùng trong hình hài nguyên thủy của họ."
 building_necrophage_house_of_apotheosis_desc_hive: "Một công trình vô cùng tráng lệ, nơi những sinh vật chờ đợi được chuyển hóa thành cá thể [This.Owner.GetAdj] có thể thoải mái trải qua khoảng thời gian cuối cùng bên ngoài tổ đàn."
 job_necro_apprentice_effect_desc_base: "Cứ mỗi §Y10§! năm, một §YNghi thức Thăng hoa§! sẽ chuyển hóa [necro_apprentice.GetIcon][necro_apprentice.GetNamePlural] thành §Y[This.Owner.GetSpeciesNamePlural]§!."
 job_necro_apprentice_effect_desc: "[necro_apprentice.GetIcon][necro_apprentice.GetNamePlural] chuyển hóa £consumer_goods£§Y$consumer_goods$§! và £food£§Y$food$§! thành £unity£§Y$unity$§! và £mod_planet_amenities_add£§Y$PLANET_AMENITIES_TITLE$§!.\n$job_necro_apprentice_effect_desc_base$"
 job_necro_apprentice_effect_lithoid_desc: "[necro_apprentice.GetIcon][necro_apprentice.GetNamePlural] chuyển hóa £consumer_goods£§Y$consumer_goods$§! và £minerals£§Y$minerals$§! thành £unity£§Y$unity$§! và £mod_planet_amenities_add£§Y$PLANET_AMENITIES_TITLE$§!.\n$job_necro_apprentice_effect_desc_base$"
 job_necro_apprentice_effect_hive_desc: "[necro_apprentice.GetIcon][necro_apprentice.GetNamePlural] chuyển hóa £food£§Y$food$§! thành £unity£§Y$unity$§! và £mod_planet_amenities_add£§Y$PLANET_AMENITIES_TITLE$§!.\n$job_necro_apprentice_effect_desc_base$"
 job_necro_apprentice_effect_hive_lithoid_desc: "[necro_apprentice.GetIcon][necro_apprentice.GetNamePlural] chuyển hóa £minerals£§Y$minerals$§! thành £unity£§Y$unity$§! và £mod_planet_amenities_add£§Y$PLANET_AMENITIES_TITLE$§!.\n$job_necro_apprentice_effect_desc_base$"
 NO_CULTURE_SHOCK: "$TRIGGER_FAIL$§RHành tinh không trải qua §Y$culture_shock_bronze_age$§!§!"
 job_necro_apprentice: "Môn đồ tử linh"
 job_necro_apprentice_plural: "Môn đồ tử linh"
 job_necro_apprentice_plural_with_icon: "[necro_apprentice.GetIcon][necro_apprentice.GetNamePlural]"
 job_necro_apprentice_desc: "Những năm tháng làm việc chăm chỉ cuối cùng cũng khép lại bằng một §YNghi thức Thăng hoa§! xa hoa, nơi những kẻ kém may mắn không sinh ra trong tầng lớp thống trị nay đã được kết nạp vào hàng ngũ của họ."
 job_necro_apprentice_desc_hive: "Sau bao năm tháng nỗ lực chăm chỉ, những sinh vật kém may mắn sinh ra bên ngoài ý thức tập thể cuối cùng cũng được tham gia Nghi thức Thăng hoa để hòa nhập vào chúng ta, trở thành một thành viên dưới sự kiểm soát của [Owner.GetGovernmentName] [Owner.GetSpeciesAdj]."
 NECRO_APPRENTICE_JOB_TRIGGER: "Công việc này chỉ có thể được đảm nhận bởi những dân số không phải máy móc và không thuộc loài chủ đạo."
 mod_job_necro_apprentice_add: "Công việc [necro_apprentice.GetName]"
 mod_job_necro_apprentice_per_pop: "Cứ $VALUE$ dân số cung cấp §G+1§! công việc [necro_apprentice.GetName]"
 mod_job_necro_apprentice_per_pop_short: "\n§GCứ $VALUE$ £pop£ +1§! £mod_job_necro_apprentice_add£"
 planet_necro_apprentices: "Công việc môn đồ tử linh"
 POP_ATTRACTION_NECROPHAGE_NEG: "§R—£pop£Người dân là Kẻ Ăn Xác, và sinh sản bằng cách cắn nuốt các loài khác§!"
 RULER_JOB_NECROPHAGE_TRIGGER: "Công việc này chỉ do những người Ăn Xác tự do, không bị thanh trừng đảm nhận."
 opinion_necrophage: "Mất Tích Bí Ẩn"
 opinion_necrophage_our_species: "Hóa Xác Loài Của Ta"
 disables_necrophage_features: "§RChọn điểm thăng thiên này sẽ làm vô hiệu hóa cơ chế Ăn Xác§!"
 MESSAGE_NECROPHAGE_POPS_NECROPHAGED_TITLE: "Dân Số Bị Hóa Xác"
 MESSAGE_NECROPHAGE_POPS_NECROPHAGED: "Chúng ta đã chuyển hóa $VALUE|Y$ £pop£§Hdân số§! trên $PLANET|Y$ thành loài của ta trong một nghi thức thăng hoa."
 START_SCREEN_NECROPHAGE_BASE: "Trong một quá khứ chưa xa, [GetHomeWorldName] từng bị thống trị bởi một loài khá tầm thường. Dưới góc nhìn của người ngoài, bọn chúng dường như đã trải qua những thăng trầm phát triển tiêu chuẩn, có những thời kỳ đổi mới chớp nhoáng ngẫu nhiên và cũng có vô số những nút thắt tưởng chừng dài đằng đẵng không thể vượt qua. Thế nhưng, bọn chúng đâu hề biết rằng, hành tinh của chúng đã trở thành cứ điểm của một loài thông minh khác —— chính là chúng ta.\n\nTrong hàng ngàn năm, chúng ta —— những [GetSpeciesNamePlural] —— vẫn chưa hề bị những kẻ làm chủ hành tinh này phát hiện. Chỉ có một vài lời đồn đại kinh dị mập mờ lưu truyền trong đêm tối, chúng ta chỉ được coi là những nhân vật hư cấu dùng để dọa trẻ con hư. Bọn chúng đã phạm sai lầm khi đánh giá thấp chúng ta.\n\nCùng với sự tăng tốc trong phát triển công nghệ của bọn chúng, chúng ta cũng đẩy nhanh tốc độ xâm nhập vào xã hội của chúng."
 START_SCREEN_NECROPHAGE: "$START_SCREEN_NECROPHAGE_BASE$Bọn chúng gục ngã một cách chóng vánh và đẫm máu. Chúng ta đã giành lấy quyền kiểm soát hành tinh của chúng một cách quyết liệt —— những chủ nhân cũ của hành tinh này buộc phải cúi đầu và dần trở thành một phần của [GetSpeciesName].\n\nGiờ đây, khi đã trang bị những bí mật vừa khám phá về du hành siêu quang tốc, chúng ta đã sẵn sàng bước ra vũ trụ bao la, biến mọi giống loài trong dải ngân hà trở nên giống như chúng ta!"
 START_SCREEN_NECROPHAGE_PEACEFUL: "$START_SCREEN_NECROPHAGE_BASE$Chúng ta dần thu tóm toàn bộ hành tinh này vào lòng bàn tay, những chủ nhân trước đây chỉ còn cách khuất phục và từ từ hòa nhập vào [GetSpeciesName].\n\nGiờ đây khi đã nắm giữ bí mật về du hành siêu quang tốc, chúng ta cuối cùng cũng có thể tự do ngao du giữa các vì sao, giành lấy một vị trí xứng đáng trong đế chế ngân hà tương lai!"
 START_SCREEN_NECROPHAGE_HIVE: "$START_SCREEN_NECROPHAGE_BASE$Cuối cùng, chúng ta đã sẵn sàng tỏa sáng. Khi chúng ta thâu tóm toàn bộ hành tinh một cách tàn nhẫn, sự ưu việt của ý thức tập thể ngày càng bộc lộ rõ —— chủ nhân cũ của hành tinh thoái hóa thành những kẻ ngoan ngoãn phục tùng, và dần bị tổ ong [GetSpeciesName] hấp thụ.\n\nGiờ đây, khi đã trang bị những bí mật vừa khám phá về du hành siêu quang tốc, chúng ta đã sẵn sàng bước ra vũ trụ bao la, biến mọi giống loài trong dải ngân hà trở nên giống như chúng ta."
 START_SCREEN_NECROPHAGE_NOMADS: "Trong một quá khứ không quá xa xôi, con tàu Ark vĩ đại nay thuộc về chúng ta từng được vận hành bởi một chủng loài khá đỗi tầm thường. Dưới góc nhìn của kẻ bàng quan, họ dường như đã trải qua một tiến trình phát triển thăng trầm điển hình, xen kẽ giữa những giai đoạn đổi mới đột phá ngẫu nhiên là vô số nút thắt tưởng chừng dài đằng đẵng và bất khả vượt qua. Tuy nhiên, điều họ không hề hay biết là ngay trong chính phi thuyền của mình vẫn luôn ẩn giấu một chủng loài có trí tuệ khác — chúng ta.\n\nSuốt hàng ngàn năm, chúng ta, [GetSpeciesNamePlural], luôn lẩn trốn nơi những hành lang bị lãng quên cùng các khoang tàu phong kín mà chưa từng bị phát giác. Chúng ta chỉ tồn tại như những lời đồn mơ hồ về nỗi kinh hoàng trong bóng tối, một câu chuyện rùng rợn chỉ dùng để dọa dẫm lũ trẻ bướng bỉnh. Thế nhưng, họ đã sai lầm khi đánh giá thấp chúng ta.\n\nKhi tốc độ phát triển công nghệ của họ ngày một gia tăng, chúng ta cũng đẩy nhanh sự thâm nhập vào xã hội của họ.\n\nThời khắc tận thế của họ giáng xuống, mọi chuyện diễn ra thật chớp nhoáng và đẫm máu. Chúng ta đã tàn nhẫn đoạt lấy quyền kiểm soát phi thuyền, những chủ nhân ban đầu của nó bị giáng xuống làm chư hầu và dần dần bị [GetSpeciesName] đồng hóa.\n\nGiờ đây, con tàu Ark đã nằm trọn trong tay chúng ta, và hải trình của nó do chính chúng ta định đoạt. Chúng ta sẽ đạp sao mà tiến, vượt qua cõi hư không. Vạn tộc nơi biển sao, rốt cuộc đều sẽ được tái tạo theo hình hài của chúng ta!"
 necroids.2.name: "Nghi Thức Thăng Hoa Trên [Root.Capital.GetName]"
 necroids.2.desc: "Kể từ khi người [Root.GetAdj] lên nắm quyền ở [Root.Capital.GetName], việc chuyển hóa [necrophage_species.GetNamePlural] thành [Root.GetSpeciesNamePlural] đã trở thành một phần của nghi thức tôn giáo. Cứ mỗi mười năm trôi qua cái vèo, các "tín đồ" sẽ tụ họp lại trong Buồng Thăng Hoa để thực hiện một nghi thức đặc biệt. Mặc dù một số ít những người biết rõ sự tình đều giữ kín bưng về chi tiết của nghi thức, thế nhưng khi những tín đồ ấy bước ra, hành vi và cử chỉ của họ chẳng khác gì những [Root.GetSpeciesNamePlural]."
 necroids.2.desc.gestalt: "Kể từ khi người [Root.GetAdj] lên nắm quyền ở [Root.Capital.GetName], việc chuyển hóa [necrophage_species.GetNamePlural] thành [Root.GetSpeciesNamePlural] đã trở thành một phần của các nghi thức. Cứ mỗi mười năm thoảng qua, các "tín đồ" sẽ tụ họp lại trong Buồng Thăng Hoa để thực hiện một nghi thức đặc biệt. Mặc dù ý thức tập thể không hé răng nửa lời về chi tiết của nghi thức, thế nhưng khi những người đó bước ra, hành vi và cử chỉ của họ chẳng khác gì các cá thể [Root.GetSpeciesAdj]."
 necroids.2.A: "Bắt đầu chuẩn bị thôi!"
 necroids.2.A.tooltip: "Đến cuối năm nay, toàn bộ §H[necro_apprentice.GetNamePlural]§! trên §H[Root.Capital.GetName]§! sẽ được chuyển hóa thành §H[Root.GetSpeciesNamePlural]§!.\n\nNghi thức này sẽ được tổ chức cứ mỗi §H10§! năm một lần trên mọi hành tinh [Root.GetAdj] có xây dựng §HBuồng Thăng Hoa§!."
 ### Đền Tế Lễ (Giáo Phái Tử Thần) bởi Gemma Thomson
 building_sacrificial_temple_1: "Điện Tế Lễ"
 building_sacrificial_temple_1_desc: "Các giáo sĩ trang nghiêm và những tín đồ thành kính sẽ cầu nguyện và làm việc tại vùng đất thánh này, trải qua hết chu kỳ này đến chu kỳ khác, thịnh vượng nhưng cũng đẫm máu."
 building_sacrificial_temple_2: "Đền Thờ Ảo Ảnh Đáng Sợ"
 building_sacrificial_temple_2_desc: "Những cải tiến kỹ thuật cho công trình linh thiêng này giúp mọi người có thể nghiên cứu sâu sát hơn, đồng thời mang lại cảm giác cống hiến thiết thực hơn đối với những thế lực khó lường bên ngoài kia."
 building_sacrificial_temple_3: "Đại Điện Tế Lễ"
 building_sacrificial_temple_3_desc: "Đây là một chốn cực kỳ thiêng liêng, nơi các tín đồ có thể đắm chìm vào trải nghiệm đa giác quan để tưởng nhớ từng vật hiến tế [This.Owner.GetAdj], dù vật tế đó đến từ quá khứ, hiện tại hay tương lai."
 job_death_priest: "Tư Tế Tử Thần"
 job_death_priest_plural: "Tư Tế Tử Thần"
 job_death_priest_desc: "Người đảm nhiệm trọng trách dẫn dắt tinh thần cho đám đông, họ sẵn sàng hiến tế những tín đồ thành tâm nhất khi có lệnh."
 job_death_priest_effect_desc: "£job_death_priest£$job_death_priest_plural$ sẽ biến £consumer_goods£§Y$consumer_goods$§! thành £unity£§Y$unity$§!, £society£§Y$society_research$§! và £mod_planet_amenities_add£§Y$PLANET_AMENITIES_TITLE$§!"
