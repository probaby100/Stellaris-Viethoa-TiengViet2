 galactic_features.385.reanimated: "Phái [Owner.GetNecromancersUpper] đi."
 distar.218.name: "Người Chết Sống Lại"
 distar.218.desc.regular: "Sau một nghi lễ kéo dài đằng đẵng, §YTiyanki Mẫu Trưởng§! đã trở về từ thế giới bên kia, và nay ả sẽ phục vụ cho mục đích của chúng ta."
 distar.218.desc.hive: "Việc hồi sinh §YTiyanki Mẫu Trưởng§! cực kỳ chông gai. Dù cho chúng ta đã quá quen với việc điều khiển lũ con nhỏ bé của ả, thế nhưng khả năng tái sinh của con Mẫu Trưởng này lại liên tục nuốt chửng đám [root.GetNecromancersLower] đông trùng hạ thảo của ta. Nhưng cuối cùng, phần thắng vẫn thuộc về chúng ta; những tế bào chết rục sẽ không đời nào có được khả năng thích nghi cao như ta.\n\nGiờ đây, chúng ta đã nắm quyền điều khiển Mẫu Trưởng, mấy cái xúc tu khổng lồ của ả đã sẵn sàng để chúng ta sử dụng."
 distar.218.desc.machine: "§YTiyanki Mẫu Trưởng§! đã được khởi động lại và thiết lập mục đích mới. Sinh vật khổng lồ này sẽ phục vụ cho chúng ta dưới dạng một đơn vị hữu cơ. Khi giao thức Mẫu Trưởng nguyên bản của ả bị vô hiệu hóa, thực thể không gian này nay đã nằm trong tầm kiểm soát của chúng ta."
 distar.5016.desc.regular: "Các Thầy Pháp Gọi Hồn của ta đã nhét cái xác vào lại quả trứng cũ của nó, qua đó ấp ra một con §YQuái Thai Hư Không§! mới để phục vụ cho mục đích của chúng ta."
 distar.5016.desc.hive: "Không ngờ thao tác nhét §YQuái Thai Hư Không§! trở lại vỏ trứng rồi đem ấp lại thêm lần nữa lại hiệu quả đến vậy. Bằng cách lợi dụng những vật chất hữu cơ gốc còn sót lại trong trứng, các [root.GetNecromancersLower] vong linh của ta có thể dễ dàng chỉnh sửa bộ hài cốt này để phục vụ chúng ta.\n\nSau khi biến sinh vật này thành một con rối gỗ, giờ chúng ta đã có thể sai khiến đôi cánh của nó đập phần phật rồi."
 distar.5016.desc.machine: "Bằng cách kích hoạt giao thức gọi hồn người máy, chúng ta có thể hồi sinh con §YQuái Thai Hư Không§! đã chết, bộ cánh thay thế của nó cũng đã được đúc thành từ hợp kim sinh hóa đang trong quá trình thử nghiệm."
 it_hungers: "Nó đói rồi."
 leviathans.675.desc.regular: "Sau một hồi hì hục, các Thầy Pháp Gọi Hồn của ta cuối cùng cũng bơm đầy năng lượng vào con §YThiên Long Cõi Ê-te§!. Quá trình dung hợp ý thức diễn ra hơi chệch choạc đôi chút, nhưng chúng ta vẫn cho rằng đây là một thành công, dù gì thì kỹ năng khạc lửa nhiệt độ cực cao của con quái thú này vẫn hoạt động bình thường."
 leviathans.675.desc.hive: "Cơ thể của con §YThiên Long Cõi Ê-te§! dường như rắn chắc không thể phá vỡ. Đành bỏ qua ý định cướp quyền hệ thần kinh trung ương và khống chế nó từ bên trong, chúng ta buộc phải dùng [root.GetIndividualName] mô phỏng sinh học để thay thế từng dây thần kinh của nó.\n\nCùng chờ xem liệu chúng ta có thể làm cho cái xác này gầm lên thêm lần nữa hay không."
 leviathans.675.desc.machine: "Theo tính toán thì xác con §YThiên Long Cõi Ê-te§! này đã có niên đại vượt quá 922337203685477580-\n\n§RLỗi: Vượt quá kích thước cho phép.§!\n\nDo chúng ta đã thay thế cấu trúc bên trong nó bằng một loại lò phản ứng thử nghiệm, các nghiên cứu chuyên sâu về sau sẽ trở nên dễ dàng hơn nhiều."
 ancrel.4026.desc.regular: "Ả đã tung cánh bay liệng lên trời thêm một lần nữa. Con §YRồng Vuốt Mảnh§! từng nổi thói tham lam vơ vét của cải ngày nào nay đã tiếp tục canh gác hệ sao [from.solar_system.GetName], có điều lần này ả bảo vệ khối Rubricator cho chúng ta."
 ancrel.4026.desc.hive: "Con §YRồng Vuốt Mảnh§! từng sống trong sự cô độc và lòng tham nay đã nằm bất động. Chúng ta đã chiếm đoạt cơ thể cứng ngắc của ả, phá hủy nhân cách cũng như trung khu ngôn ngữ đi. Khi những bộ phận thừa thãi đó bị dẹp bỏ, cuối cùng ta cũng có thể khống chế ngọn lửa siêu nóng do ả phun ra."
 ancrel.4026.desc.machine: "Chúng ta đã chạy giao thức pháp sư máy và hồi sinh thành công thực thể hữu cơ có tên §YRồng Vuốt Mảnh§!. Các xung kích synap đang phản hồi đúng như thông số dự đoán. Con rồng này đã sống dậy, và nằm dưới sự kiểm soát của ta."
 distar.340.desc: "Tin dữ về cái chết của [Root.Fleet.GetName] nhanh chóng lan truyền khắp [Root.Owner.GetName]. Con amip vũ trụ này trước giờ vẫn luôn là một người bạn đồng hành trung thành của nước ta. Tuy nhiên, các Thầy Pháp Gọi Hồn lại tỏ ra năng nổ lạ thường sau khi nhận được thông báo, họ vừa đưa ra một phương án giải quyết để vơi đi nỗi buồn của người dân. Dù không nói quá chi tiết, nhưng họ một mực khẳng định rằng chắc chắn có thể đưa [Root.Fleet.GetName] về lại bên chúng ta."
 distar.340.desc.science: "Cái chết của [Root.Fleet.GetName] loan nhanh khắp [Root.Owner.GetName], nhưng có lẽ người đau lòng nhất chính là Sĩ Quan Khoa Học [amoeba_finding_scientist.GetName]. Chính [amoeba_finding_scientist.GetSheHe] là người đầu tiên tìm thấy con amip nhỏ xíu đi lạc, và cũng chính [amoeba_finding_scientist.GetSheHe] đã chứng kiến nó từng bước trưởng thành nhờ sự tận tình dạy bảo của [amoeba_finding_scientist.GetHisHer].\n\nGiờ đây, khi không còn [Root.Fleet.GetName] lặng lẽ kề bên, Sĩ Quan Khoa Học [amoeba_finding_scientist.GetName] có lẽ sẽ chẳng bao giờ gượng dậy được như trước kia nữa."
 distar.340.a: "Hồi sinh đi, [Root.Fleet.GetName], hồi sinh đi!"
 distar.340.b: "Thôi cứ để [Root.Fleet.GetName] yên nghỉ."
 distar.59.desc: "§Y[reanimated_amoeba.Fleet.GetName]§! sống lại rồi sao? Ít nhất thì ả cũng nhúc nhích được rồi. Mặc dù quả thật ta không rõ đám [amoeba_finding_scientist.GetName] kia đã nghịch ngợm cái trò gì, nhưng may thay nhờ sự tuyệt vọng cùng tột cộng thêm máu điên khoa học của họ, ta lại có thể cùng bé côn trùng cưng kề vai cất cánh một lần nữa."
 distar.59.desc.science: "§Y[reanimated_amoeba.Fleet.GetName]§! sống lại rồi sao? Ít nhất thì ả cũng nhúc nhích được rồi. Mặc dù quả thật ta không biết đám Thầy Pháp Gọi Hồn kia đã tung bùa yểm chú kiểu gì, nhưng nhờ sự bế tắc cùng cực của họ với thứ khoa học ma quỷ kia mà giờ chúng ta lại có thể sát cánh bay lượn cùng cục cưng yêu dấu rồi."
 REANIMATE_TIYANKI_MATRIARCH: "Hồi Sinh Tiyanki Mẫu Trưởng"
 REANIMATE_TIYANKI_MATRIARCH_DESC: "Các [Owner.GetNecromancersLower] của ta vừa mới nảy ra một kế hoạch cực táo bạo để gọi Tiyanki Mẫu Trưởng sống lại, qua đó ả có thể phục vụ chúng ta, kề vai sát cánh chiến đấu cùng hạm đội."
 REANIMATE_VOIDSPAWN: "Hồi Sinh Quái Thai Hư Không Đã Chết"
 REANIMATE_VOIDSPAWN_DESC: "Các [Owner.GetNecromancersLower] khẳng định chắc nịch rằng họ có thể hồi sinh con §YQuái Thai Hư Không§! bằng một vài thủ thuật đen tối, đồng thời bắt nó phục vụ chúng ta, sát cánh chiến đấu với hạm đội."
 REANIMATE_ROCK_BRAIN: "Hồi Sinh Não Đá"
 REANIMATE_ROCK_BRAIN_DESC: "Bất luận thực tại trong thế giới ý thức của sinh vật cổ đại này là gì đi nữa, ít nhất thì cõi vũ trụ trần gian này vẫn đang tồn tại êm đẹp. Bằng cách kết hợp giữa một số cấm thuật với các công nghệ tối tân nhất, các Thầy Pháp Gọi Hồn của chúng ta tin rằng họ có thể một lần nữa tái tạo lại thế giới ảo ảnh cho cái xác không hồn này."
 REANIMATE_GUARDIAN_DRAGON: "Thổi Bùng Lại Hơi Thở Cõi Ê-te"
 REANIMATE_GUARDIAN_DRAGON_DESC: "Các [Owner.GetNecromancersLower] của ta tin rằng, thông qua sự giao thoa giữa các nghi lễ và khoa học tiên tiến, như hút plasma từ ngôi sao ở đây, hay là lắp thêm động cơ ký sinh vào cái xác rồng kia, họ có thể khiến con §YThiên Long Cõi Ê-te§! phun lửa thêm lần nữa."
 REANIMATE_SHARD_DRAGON: "Nhào Nặn Lại Rồng Vuốt Mảnh"
 REANIMATE_SHARD_DRAGON_DESC: "§YRồng Vuốt Mảnh§!, cơn ác mộng của bầy chuột, kẻ gìn giữ Rubricator, giờ đây chỉ còn là một cái xác vô hồn, im lìm trôi nổi xung quanh ngôi sao. [Owner.GetNecromancersLower] của chúng ta cho rằng, vì con Rồng Vuốt Mảnh này đã dùng cả mạng sống để bảo vệ khối Rubricator, ả hẳn cũng sẽ tận tụy cống hiến cho chủ nhân mới của nó ngay cả khi đã ngỏm củ tỏi."
 REANIMATE_LOST_AMOEBA: "Hồi Sinh Amip Đã Chết"
 REANIMATE_LOST_AMOEBA_DESC: "Dù chẳng biết mánh lới của họ là gì, nhưng các Thầy Pháp Gọi Hồn của ta đã xoay xở hồi sinh thành công con amip đã chết kia."
 REANIMATE_LOST_AMOEBA_DESC_SCIENCE: "Dù thật tình chúng ta chẳng rõ bí quyết của họ, nhưng dưới sự dẫn dắt của [amoeba_finding_scientist.GetName], các Thầy Pháp Gọi Hồn của ta đã xoay xở đưa con amip đã chết trở về với nhân thế."
 #Sự kiện Điểm thăng thiên Mechromancy
 necroids.20.name: "Đã Cài Đặt Bản Nâng Cấp Pháp Sư Máy"
 necroids.20.desc: "Việc cài đặt thành công Giao thức Pháp Sư Máy giúp chúng ta có khả năng hồi sinh một số thực thể không gian cụ thể đã bị tiêu diệt. So với các bản nâng cấp về mặt cơ khí, các bộ phận hữu cơ rõ ràng là thua kém hơn hẳn. Tuy vậy, ta có thể cải tạo lớp da thịt ấy để tạo ra những bản sao của sự sống hữu cơ."
 necroids.20.a: "Gọi hàm hồi sinh."
 ### Tưởng Niệm Ngân Hà (Chủ Nghĩa Tưởng Niệm) bởi Gemma Thomson
 building_galactic_memorial_1: "Khu Trú Ẩn An Giấc"
 building_galactic_memorial_1_desc: "Bia tưởng niệm mộc mạc này chủ yếu ghi chép lại những suy tư và nghiên cứu về muôn vàn sắc thái của cái chết cùng những điểm kết thúc."
 building_galactic_memorial_2: "Cột Trụ Tĩnh Lặng"
 building_galactic_memorial_2_desc: "Một chốn yên bình, dành riêng cho việc thiền định về cái chết, nơi đây đã lưu lại cái kết của biết bao sinh linh."
 building_galactic_memorial_3: "Nhà Tưởng Niệm Ngân Hà"
 building_galactic_memorial_3_desc: "Một thư viện bất hủ, lưu giữ toàn bộ kho tàng kiến thức về sự kết thúc, từ những điều cơ bản dễ hiểu cho đến những triết lý cao thâm bí hiểm, ghi chép lại tất cả để chuẩn bị cho một tương lai hãy còn đang bỏ ngỏ."
 building_galactic_memorial_regular_tooltip: "§HKhu Trú Ẩn An Giấc§! tăng cường §Hsức hút của hệ tư tưởng chủ đạo§! đối với §HHành Tinh Chết§! và §HHành Tinh Tàn Tích§!"
 building_galactic_memorial_gestalt_tooltip: "§HKhu Trú Ẩn An Giấc§! làm giảm đi §Hsự bất thường§! trên §HHành Tinh Chết§! và §HHành Tinh Tàn Tích§!."
 job_death_chronicler: "Ghi Chép Viên Tử Thần"
 job_death_chronicler_plural: "Ghi Chép Viên Tử Thần"
 job_death_chronicler_desc: "Entropy là lĩnh vực nghiên cứu của những học giả này, họ chuyên tâm ghi chép lại vô vàn các hình thức khác nhau của cái chết và đi sâu tìm hiểu các tác động do chúng gây ra."
 job_death_chronicler_effect_desc: "£job_death_chronicler£$job_death_chronicler_plural$ sẽ biến $r_consumer_goods$ thành $r_unity$, $r_stability$ cùng với [GetCivilianSpiMatOutput][GetCivilianEgalAuthOutput][GetCivilianMilPacOutput][GetCivilianXenoOutput].\n\nTác động của £job_death_chronicler£$job_death_chronicler_plural$ sẽ phụ thuộc vào tư tưởng của đế chế.\n\n"
 job_death_chronicler_simple_effect_desc: "£job_death_chronicler£$job_death_chronicler_plural$ biến $r_consumer_goods$ thành $r_unity$ và $r_stability$, cùng với những chỉ số điều chỉnh đối với [civilian.GetIcon][civilian.GetNamePlural] §Hdựa trên hệ tư tưởng§!."
 chronicle_drone: "$job_chronicle_drone$"
 job_chronicle_drone: "Cá Thể Ghi Chép"
 job_chronicle_drone_plural: "Cá Thể Ghi Chép"
 job_chronicle_drone_desc: "Những cá thể chuyên biệt hóa này sẽ chuyển hóa những dòng suy ngẫm của mình thành entropy, nghiên cứu sự lụi tàn ở giai đoạn cuối cùng, trái ngược hoàn toàn với chuỗi tồn tại liên miên không dứt của chúng ta."
 job_chronicle_drone_effect_desc: "£job_chronicle_drone£$job_chronicle_drone_plural$ sẽ biến $r_energy$ (hoặc $r_food$) thành $r_unity$ và $r_stability$"
