 ### Những Kẻ Hồi Sinh bởi Pierre du Plessis
 civic_reanimated_armies: "Quân Đoàn Cõi Chết"
 civic_reanimated_armies_desc: "Trong xã hội này, cái chết không còn là rào cản ngăn cấm việc tòng quân nữa. Những bậc thầy thông thạo ma thuật chiêu hồn có thể gọi những thi hài của kẻ đã khuất đứng dậy, tập hợp lại thành một binh đoàn thây ma, nhồi nhét nỗi sợ hãi tột cùng vào những kẻ còn sống hèn mọn kia."
 disabled_by_synthetic_ascension: "Xung đột với §YThăng Thiên Người Máy§!"
 civic_tooltip_reanimated_armies_effects: "—§Y$job_soldier_plural_with_icon$§! được thay bằng §Y$job_necromancer_plural_with_icon$§!\n—$AVAILABLE_BUILDINGS$['building:building_dread_encampment']\n—$AVAILABLE_HOLDINGS$['building:holding_dread_outpost']\n—Lục quân hữu cơ bị tiêu diệt có xác suất hồi sinh thành §YQuân Đoàn Bất Tử§!\n—§YThực thể không gian§! hữu cơ bị tiêu diệt thỉnh thoảng có thể được hồi sinh.\n—$reanimator_effect_desc$"
 building_dread_encampment: "Doanh Trại Khiếp Đảm"
 building_dread_encampment_desc: "Khi các Thầy Pháp Gọi Hồn của chúng ta triệu hồi quân đoàn thây ma gia nhập vào quân đội để chiến đấu, tốt nhất chúng ta nên che đậy hành tung của chúng để không làm công chúng vốn yếu bóng vía phải hoảng sợ."
 job_necromancer_effect_desc: "£job_necromancer£$job_necromancer_plural$ biến $r_consumer_goods$ thành $r_physics$, $r_society$ và £mod_country_naval_cap_add£§Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!, đồng thời tạo ra £defense_army£§YLực Lượng Phòng Thủ Bất Tử§!"
 building_dread_encampment_tt: "—$undead_army_recruitment_tt$\n—$undead_defense_army_recruitment$"
 undead_army_recruitment_tt: "Cho phép chiêu mộ §Y$undead_army_plural$§!"
 undead_army: "Quân Đoàn Bất Tử"
 undead_army_desc: "Những chiến binh bất tử được các Thầy Pháp Gọi Hồn đánh thức từ nghĩa trang. Vô cảm trước nỗi sợ, bọn chúng hung hăng lao vào chiến đấu và rít lên những tiếng thét chói tai nhằm tiêm nhiễm nỗi kinh hoàng vào sâu trong tâm can kẻ thù."
 undead_army_plural: "Quân Đoàn Bất Tử"
 giant_undead_army: "Binh Đoàn Cự Thú Bất Tử"
 giant_undead_army_desc: "Bộ hài cốt khổng lồ, luôn trong tư thế sẵn sàng trút cơn kinh hoàng xuống toàn vũ trụ. Một khi nó xâm chiếm hành tinh thì đừng hòng có chuyện thương hoa tiếc ngọc."
 giant_undead_army_plural: "Binh Đoàn Cự Thú Bất Tử"
 undead_defense_army_recruitment: "Thay thế §Y$defense_army_plural$ trên hành tinh§! bằng §Y$undead_defense_army_plural$§!"
 undead_defense_army: "Lực Lượng Phòng Thủ Bất Tử"
 undead_defense_army_plural: "Lực Lượng Phòng Thủ Bất Tử"
 undead_defense_army_desc: "Các Thầy Pháp Gọi Hồn đánh thức vô số vong linh từ dưới nấm mồ, đưa chúng trở về nhân thế để bảo vệ hành tinh của ta khỏi nanh vuốt kẻ thù."
 necromancer: "$job_necromancer$"
 job_necromancer: "Thầy Pháp Gọi Hồn"
 job_necromancer_plural: "Thầy Pháp Gọi Hồn"
 job_necromancer_plural_with_icon: "£job_necromancer£$job_necromancer_plural$"
 job_necromancer_desc: "Hồi sinh người chết và bắt chúng tham gia chiến đấu trong quân ngũ là một công việc cực kỳ khó nhằn. Chỉ có những kẻ thành thạo thuật chiêu hồn bậc nhất mới biết được môn nghệ thuật bí truyền này để rồi lập nên một kỳ tích như vậy!"
 planet_necromancers: "Công Việc Thầy Pháp Gọi Hồn"
 mod_job_necromancer_add: "Công việc $job_necromancer$"
