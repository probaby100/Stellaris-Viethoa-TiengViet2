 ####################################
 #Dự Án Đặc Biệt
 ####################################
 hallucinogen_removal: "Loại Bỏ Khí Gây Ảo Giác"
 hallucinogen_removal_DESC: "Cố gắng loại bỏ lớp khí gây ảo giác trên [Root.GetName]."
 impact_defence_system: "Hệ Thống Phòng Thủ Tiểu Hành Tinh"
 impact_defence_system_DESC: "Ta phải nghiên cứu cách tốt nhất để bảo vệ thuộc địa của mình trên [Root.GetName] khỏi sự bắn phá của các tiểu hành tinh."
 titanic_life_study_normal: "Nghiên Cứu Sinh Vật Titan"
 titanic_life_study_normal_DESC: "Thông qua việc nghiên cứu các sinh vật Titan trên [Root.GetName], ta hy vọng có thể hiểu rõ chúng, thậm chí là tìm ra cách giao tiếp với chúng."
 titanic_life_study_mean: "Giải Phẫu Sinh Vật Titan"
 titanic_life_study_mean_DESC: "Bằng cách bắt giữ những sinh vật Titan trên [Root.GetName], ta sẽ nghiên cứu cách để vắt kiệt giá trị của chúng!"
 titanic_life_study_nice: "Giám Sát Sinh Vật Titan"
 titanic_life_study_nice_DESC: "Thông qua việc cẩn trọng giám sát các sinh vật Titan trên [Root.GetName], ta hy vọng có thể chung sống hòa bình với chúng."
 retaliatory_genome_mapping: "Lập Bản Đồ Gen Trả Đũa"
 retaliatory_genome_mapping_DESC: "Phái một con tàu đến hành tinh mẹ của bọn ngoài hành tinh, ta sẽ thu thập lại chính xác những dữ liệu mà ta nghi ngờ bọn chúng đã đánh cắp từ cơ thể ta."
 woodwind_instrument_investigation: "Điều Tra Nhạc Cụ Thổi"
 woodwind_instrument_investigation_DESC: "Ta phải tìm ra chất liệu gốc tạo nên loại nhạc cụ bí ẩn có khả năng làm dịu tâm trí chúng ta."
 disappearing_pops_project: "Vụ Mất Tích Trên [missing_pops_planet.GetName]"
 disappearing_pops_project_DESC: "Lực lượng hành pháp trên [missing_pops_planet.GetName] đang cần quân đội hỗ trợ dẹp yên bạo loạn để có thể tiến hành điều tra suôn sẻ vụ mất tích dân số bí ẩn dạo gần đây."
 mystery_cream_project: "Kem Trường Sinh"
 mystery_cream_project_DESC: "Gần đây, một loại kem chống lão hóa mang tên Kem Trường Sinh đang làm mưa làm gió khắp cõi đế chế. Loại kem này đã được chứng minh là có khả năng kích thích tái tạo tế bào. Nếu ta có thể xác định được thành phần hoạt tính của nó, có lẽ ta sẽ kéo dài được thời gian tác dụng của thứ này."
 cream_origin_project: "Cuộc Truy Tìm Sự Bất Tử"
 cream_origin_project_DESC: "Ta phải tìm cho ra nguồn gốc của loại kem chống lão hóa này."
 MAGNETIC_PLANET_RESEARCH_PROJECT: "Điều Tra Bí Ẩn Từ Trường Trên [Root.GetName]"
 MAGNETIC_PLANET_RESEARCH_PROJECT_DESC: "Nhiều vụ nhiễu loạn từ trường kỳ lạ đã làm đảo lộn cuộc sống trên [Root.GetName]. Cho đến tận gần đây, nguyên nhân của những vụ nhiễu loạn này vẫn là một ẩn số, nhưng giờ ta đã gom đủ dữ liệu và chắc chắn sẽ phơi bày được sự thật."
 ROGUEMOON_PROJECT: "Điều Tra Mặt Trăng Bí Ẩn Của [Root.GetName]"
 ROGUEMOON_PROJECT_DESC: "Tiến hành khảo sát chi tiết [event_target:roguemoon.Planet.GetName] hòng làm rõ cội nguồn của nó."
 DPORTAL_PROJECT: "Thăm Dò Cổng Dịch Chuyển Không Gian Trên [Root.GetName]"
 DPORTAL_PROJECT_DESC: "Điều tra xem cổng dịch chuyển này dẫn tới đâu."
 DPORTAL_PROJECT_SCIENCE: "Đóng Cổng!"
 DPORTAL_PROJECT_SCIENCE_DESC: "Chắc chắn các nghiên cứu khoa học sẽ tìm ra cách đóng sập cái cổng này lại!"
 DPORTAL_PROJECT_PRAYER: "Đóng Cổng!"
 DPORTAL_PROJECT_PRAYER_DESC: "Cái cổng này chắc chắn có thể bị khắc chế bằng năng lượng tích cực!"
 DPORTAL_PROJECT_PSI_PRAYER: "Đóng Cổng!"
 DPORTAL_PROJECT_PSI_PRAYER_DESC: "Cái cổng này chắc chắn có thể bị khắc chế bằng sức mạnh tâm linh!"
 DPORTAL_PROJECT_ROCKS: "Đóng Cổng!"
 DPORTAL_PROJECT_ROCKS_DESC: "Cứ ném thật nhiều đá vào đó, biết đâu sẽ lấp kín được nó?"
 SNEK_SCIENCE_PROJECT: "Dùng Khoa Học"
 SNEK_SCIENCE_PROJECT_DESC: "Khoa học! Ta phải tin vào khoa học! Sau một loạt các quan sát tỉ mỉ và những cuộc họp bàn hiệu quả, ta dự định sẽ tìm ra quy luật hành vi của lũ rắn này, từ đó áp dụng một hệ thống bài bản để đối phó với chúng. Nếu tìm được công cụ phù hợp và chiến lược hiệu quả, ta thậm chí có thể tìm ra nguyên nhân đằng sau hiện tượng này! Ngay cả khi chúng có cắn xé cư dân hay bòn rút năng lượng của ta, ta vẫn phải đảm bảo không làm hỏng nguồn dữ liệu hành vi của chúng."
 SNEK_WAR_PROJECT: "Dùng Vũ Lực"
 SNEK_WAR_PROJECT_DESC: "Khai chiến! Ta muốn chiến tranh! Chẳng thèm quan tâm tại sao chúng lại mò đến đây. Ta cũng cóc cần biết chúng đang làm cái quái gì. Nhưng có một điều ta biết rất rõ: chúng căm ghét ta, vậy nên ta phải làm cho chúng biết sợ. Đã đến lúc dựng trạm gác, phái các đội tuần tra, và dùng súng phun lửa đốt rắn để mở đường cho người dân. Thiêu rụi bọn chúng thành tro đi! Bằng mọi giá, ta phải đập tan mấy thứ nhung nhúc này."
