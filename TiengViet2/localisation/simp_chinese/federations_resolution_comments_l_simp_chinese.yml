l_simp_chinese:
 ### BÌNH LUẬN NGHỊ QUYẾT - YÊU CẦU
 ### Yêu cầu - Chủ nghĩa Quân phiệt
 ethic_militarist_request_friendly: "Chúng ta đồng quan điểm trong chuyện này, đúng chứ?"
 ethic_militarist_request_friendly_0: "$GREETER$ đề nghị $COUNTRY$ hỗ trợ."
 ethic_militarist_request_friendly_1: "Các bạn sẽ là đồng minh vững chắc của $GREETER$ chứ?"
 ethic_militarist_request_friendly_2: "An ninh quốc phòng của cả hai đế chế chúng ta đều phụ thuộc vào kết quả của nghị quyết này."
 ethic_militarist_request_friendly_3: "$GREETER$ đang trông cậy vào sự giúp đỡ của các bạn."
 ethic_militarist_request_friendly_4: "Sẽ là một vinh dự lớn nếu những người bạn tại $COUNTRY$ sát cánh cùng chúng tôi."
 ethic_militarist_request_neutral: "Sự trợ giúp của $COUNTRY$ sẽ rất được trân trọng."
 ethic_militarist_request_neutral_0: "Gia nhập cùng chúng tôi——mang lại vinh quang cho các bạn."
 ethic_militarist_request_neutral_1: "Sự ủng hộ của các bạn sẽ thể hiện sức mạnh của chính các bạn."
 ethic_militarist_request_neutral_2: "Thời cơ đến rồi, chính là lúc này. Hãy mau chóng ủng hộ chúng tôi!"
 ethic_militarist_request_neutral_3: "Chúng tôi không bao giờ dùng những lời ngoại giao sáo rỗng với các bạn... Giá trị của nghị quyết này đã quá rõ ràng."
 ethic_militarist_request_neutral_4: "Nghị quyết này không chỉ chính đáng với chúng tôi mà còn với toàn ngân hà. Xin hãy ủng hộ."
 ethic_militarist_request_hostile: "Chúng tôi không trông mong sự ủng hộ của các người trong chuyện này, nhưng những điều kỳ diệu hơn vẫn từng xảy ra..."
 ethic_militarist_request_hostile_0: "Chúng tôi tuyệt đối không hạ mình van xin sự ủng hộ. Nhưng nếu các người tự nguyện, chúng tôi sẽ rất cảm kích..."
 ethic_militarist_request_hostile_1: "Cơ hội để $COUNTRY$ chứng minh danh dự của mình đến rồi——hay là các người vốn không có phẩm chất này."
 ethic_militarist_request_hostile_2: "Chỉ có những kẻ ngốc nghếch hoàn toàn mới phản đối nghị quyết này."
 ethic_militarist_request_hostile_3: "Thậm chí những kẻ thiểu năng của $COUNTRY$ cũng phải nhận ra giá trị của việc thông qua nghị quyết này chứ."
 ethic_militarist_request_hostile_4: "Nếu các người ủng hộ nghị quyết này, sự khinh bỉ của chúng tôi dành cho $COUNTRY$ có thể sẽ vơi đi đôi chút..."
 ### Yêu cầu - Chủ nghĩa Hòa bình
 ethic_pacifist_request_friendly: "$GREETER$ mong đợi những người bạn đáng kính tại $COUNTRY$ sẽ ủng hộ chúng tôi."
 ethic_pacifist_request_friendly_0: "Chúng tôi tin rằng $COUNTRY$ sẽ làm điều đúng đắn."
 ethic_pacifist_request_friendly_1: "$GREETER$ hoàn toàn tin tưởng vào quyết định của $COUNTRY$ trong cuộc bỏ phiếu sắp tới."
 ethic_pacifist_request_friendly_2: "Hãy cùng nắm tay nhau để biến ngân hà này trở nên hòa bình và an toàn hơn."
 ethic_pacifist_request_friendly_3: "Xin hãy giúp chúng tôi để những người khác cũng thấy được sự sáng suốt của nghị quyết này."
 ethic_pacifist_request_friendly_4: "Dù các bạn bỏ phiếu thế nào, $COUNTRY$ vẫn luôn là những người bạn thân thiết. Nhưng nếu được, xin hãy bỏ phiếu thuận."
 ethic_pacifist_request_neutral: "Chúng tôi chân thành thỉnh cầu sự ủng hộ của các bạn trong cuộc bỏ phiếu sắp tới."
 ethic_pacifist_request_neutral_0: "Cùng nhau tiến bước. Còn có cụm từ nào tươi đẹp hơn thế không?"
 ethic_pacifist_request_neutral_1: "$GREETER$ khiêm tốn thỉnh cầu sự trợ giúp của các bạn trong cuộc bỏ phiếu sắp tới."
 ethic_pacifist_request_neutral_2: "Chúng tôi tin rằng $COUNTRY$ sẽ thấy được lợi ích từ đề xuất này."
 ethic_pacifist_request_neutral_3: "Với sự trợ giúp của các bạn, chúng ta sẽ có thể biến [global_event_country.GetGalCommunityOrGalImperium] thành một nơi chung sống hài hòa."
 ethic_pacifist_request_neutral_4: "Ủng hộ nghị quyết của chúng tôi, chỉ cần chúng ta hợp tác, chiến tranh và những đau khổ khác sẽ chỉ còn là một trang sử man rợ của ngân hà được khép lại."
 ethic_pacifist_request_hostile: "Hãy làm điều đúng đắn. Ít nhất là trong việc này."
 ethic_pacifist_request_hostile_0: "Bây giờ thay đổi con đường sai lầm của các người vẫn chưa muộn."
 ethic_pacifist_request_hostile_1: "Hãy kìm nén bản năng hèn hạ của các người, ít nhất một lần hãy chọn đúng."
 ethic_pacifist_request_hostile_2: "Phản đối nghị quyết này chỉ chứng tỏ $COUNTRY$ có những mưu đồ đê tiện với phần còn lại của ngân hà."
 ethic_pacifist_request_hostile_3: "Bất kể $COUNTRY$ có ủng hộ hay không, chúng tôi vẫn sẽ thông qua nghị quyết này!"
 ethic_pacifist_request_hostile_4: "Nếu các người phản đối nghị quyết này, lịch sử sẽ không dễ dàng buông tha cho $COUNTRY$."
 ### Yêu cầu - Chủ nghĩa Độc đoán
 ethic_authoritarian_request_friendly: "Bạn và tôi, cứ thuận theo lẽ phải mà làm, đúng không?"
 ethic_authoritarian_request_friendly_0: "Giao tình khăng khít, không có kẽ hở, phải vậy không?"
 ethic_authoritarian_request_friendly_1: "$COUNTRY$ đã giành được sự tin tưởng của chúng tôi. Chúng tôi chắc chắn rằng các bạn sẽ đưa ra lựa chọn đúng đắn trong cuộc bỏ phiếu sắp tới."
 ethic_authoritarian_request_friendly_2: "Ngân hà cần sự lãnh đạo mạnh mẽ của $GREETER$ và $COUNTRY$. Hãy cùng nhau đảm bảo nghị quyết này được thông qua."
 ethic_authoritarian_request_friendly_3: "Mục tiêu của chúng tôi và $COUNTRY$ là đồng nhất. Hãy xua tan sự hỗn loạn đang bao trùm ngân hà, đưa mọi thứ trở lại trật tự."
 ethic_authoritarian_request_friendly_4: "Chúng tôi luôn ngưỡng mộ sự lãnh đạo của $COUNTRY$. Các bạn chắc chắn sẽ thấy được lợi ích từ nghị quyết của chúng tôi."
 ethic_authoritarian_request_neutral: "Hãy ủng hộ chúng tôi trong chuyện này. Ngay bây giờ."
 ethic_authoritarian_request_neutral_0: "Chúng tôi dẫn dắt, các bạn bước theo. Chuyện này là vậy, mọi chuyện đều là vậy."
 ethic_authoritarian_request_neutral_1: "Chống lại trật tự tự nhiên của vạn vật chỉ là phí công vô ích."
 ethic_authoritarian_request_neutral_2: "Để duy trì trật tự của ngân hà, nghị quyết này bắt buộc phải được thông qua."
 ethic_authoritarian_request_neutral_3: "Mục đích của chúng tôi là ngăn chặn biển sao tiếp tục trượt dài vào tình trạng vô chính phủ và hỗn loạn. Nghị quyết này chỉ là một bước trên chặng đường dài đó."
 ethic_authoritarian_request_neutral_4: "Chẳng bao lâu nữa toàn bộ biển sao sẽ khôi phục lại hòa bình và trật tự. Hãy làm tốt phần việc của mình, ủng hộ nghị quyết 34-X."
 ethic_authoritarian_request_hostile: "Các người phải ủng hộ chúng tôi trong chuyện này. Đúng vậy, đây không phải là một lời “thỉnh cầu”."
 ethic_authoritarian_request_hostile_0: "Hãy chấp nhận tôn ti trật tự vốn có của vạn vật đi, tuân theo sự lãnh đạo của chúng tôi trong chuyện này."
 ethic_authoritarian_request_hostile_1: "Các người phải ủng hộ chúng tôi trong cuộc bỏ phiếu sắp tới——chúng tôi yêu cầu các người làm điều đó."
 ethic_authoritarian_request_hostile_2: "Chúng tôi ra lệnh cho các người phải ủng hộ nghị quyết này."
 ethic_authoritarian_request_hostile_3: "$COUNTRY$ thuộc về phe phái mục nát trong [global_event_country.GetGalCommunityOrGalImperium]. Đừng truyền bá tư tưởng của các người để đầu độc các đặc phái viên của quốc gia thành viên khác nữa."
 ethic_authoritarian_request_hostile_4: "Cấm phản đối."
 ### Yêu cầu - Chủ nghĩa Bình đẳng
 ethic_egalitarian_request_friendly: "Cùng với $COUNTRY$, chúng ta có thể làm được việc này."
 ethic_egalitarian_request_friendly_0: "$GREETER$ tin rằng $COUNTRY$ sẽ ủng hộ chúng tôi trong việc này."
 ethic_egalitarian_request_friendly_1: "Dưới ánh sáng quang minh chính đại, chúng ta nên đứng lên bảo vệ công lý và sự bình đẳng, phải không?"
 ethic_egalitarian_request_friendly_2: "Các bạn, chúng ta sẽ cùng nhau bước vào một kỷ nguyên dân chủ mới... đến lúc đó, toàn bộ biển sao sẽ là một phần của nền chính trị ngân hà."
 ethic_egalitarian_request_friendly_3: "Trong tổ chức này có những dòng chảy ngầm không cùng mục tiêu với hai quốc gia vĩ đại của chúng ta. Chúng ta phải hỗ trợ lẫn nhau."
 ethic_egalitarian_request_friendly_4: "Ah, $COUNTRY$! Ít nhất chúng tôi vẫn còn sự ủng hộ của các bạn để làm chỗ dựa!"
 ethic_egalitarian_request_neutral: "Tại sao không sử dụng quyền tự do dân chủ của các bạn để ủng hộ chúng tôi nhỉ?"
 ethic_egalitarian_request_neutral_0: "Quyền lựa chọn cuối cùng vẫn nằm trong tay các bạn, nhưng xin hãy cân nhắc ủng hộ chúng tôi trong chuyện này."
 ethic_egalitarian_request_neutral_1: "Các đồng nghiệp đáng kính tại $COUNTRY$, chúng tôi kêu gọi các bạn hãy hành động theo ý thức công bằng của chính mình."
 ethic_egalitarian_request_neutral_2: "Hãy nhớ rằng, bỏ phiếu là trách nhiệm của công dân."
 ethic_egalitarian_request_neutral_3: "Chúng tôi khẩn cầu các bạn ủng hộ nghị quyết này... nó chắc chắn sẽ cải thiện điều kiện sống của vô số triệu sinh mệnh có trí tuệ."
 ethic_egalitarian_request_neutral_4: "Hãy giúp chúng tôi làm cho ngân hà này trở nên tốt đẹp hơn."
 ethic_egalitarian_request_hostile: "Tôi đoán việc trông chờ $COUNTRY$ nhận ra giá trị của sự đoàn kết đúng là một hành động ngớ ngẩn."
 ethic_egalitarian_request_hostile_0: "Hãy ủng hộ chúng tôi trong việc này. Ít nhất, bây giờ bắt đầu tìm kiếm sự đồng thuận trong một vài chuyện vẫn chưa quá muộn."
 ethic_egalitarian_request_hostile_1: "Mặc dù giữa chúng ta có nhiều khác biệt, $GREETER$ vẫn duy trì liên lạc với $COUNTRY$. Xin hãy đồng hành cùng chúng tôi trong chuyện này."
 ethic_egalitarian_request_hostile_2: "Chuyện này quan trọng hơn cả hai quốc gia $GREETER$ và $COUNTRY$ chúng ta. Hãy tạm gác lại những khác biệt giữa đôi bên."
 ethic_egalitarian_request_hostile_3: "Cho dù các người nghĩ gì về chúng tôi đi nữa, thì việc ủng hộ nghị quyết này vẫn là một hành động đúng đắn."
 ethic_egalitarian_request_hostile_4: "Chúng tôi có đánh giá sai về $COUNTRY$ không? Liệu quốc gia của các người có tốt hơn những gì chúng tôi nghĩ? Các người sẽ ủng hộ nghị quyết của chúng tôi chứ?"
 ### Yêu cầu - Chủ nghĩa Thân ngoại
 ethic_xenophile_request_friendly: "Hãy cùng sát cánh trong cuộc bỏ phiếu sắp tới, cho toàn ngân hà thấy ý nghĩa đích thực của sự đoàn kết!"
 ethic_xenophile_request_friendly_0: "$GREETER$ rất hân hạnh nếu có được sự ủng hộ của $COUNTRY$ trong vấn đề này."
 ethic_xenophile_request_friendly_1: "Hai đế chế vĩ đại của chúng ta lại phải đi thảo luận cho một cuộc bỏ phiếu cỏn con thế này thì thật đáng tiếc, phải không?"
 ethic_xenophile_request_friendly_2: "Bạn hiền, nếu chúng ta hỗ trợ lẫn nhau trong [global_event_country.GetGalCommunityOrGalImperium], những thành tựu mà chúng ta đạt được sẽ là vô hạn."
 ethic_xenophile_request_friendly_3: "Thật kỳ diệu phải không? Diễn đàn ngân hà này chứng minh rằng các giống loài khác nhau có thể hợp tác để cùng làm nên những điều vĩ đại."
 ethic_xenophile_request_friendly_4: "Kế hoạch tiếp theo của chúng tôi nhằm cải thiện ngân hà cho toàn thể các giống loài có trí tuệ sinh sống chính là nghị quyết này. Bạn hiền, xin hãy dang tay giúp đỡ!"
 ethic_xenophile_request_neutral: "Chào! $GREETER$ hy vọng các bạn sẽ sát cánh cùng chúng tôi trong cuộc bỏ phiếu sắp tới."
 ethic_xenophile_request_neutral_0: "Xin chào, người bạn tương lai! Bạn sẽ ủng hộ chúng tôi trong cuộc bỏ phiếu sắp tới chứ?"
 ethic_xenophile_request_neutral_1: "Đây có thể là khởi đầu cho một tình bạn đẹp."
 ethic_xenophile_request_neutral_2: "Hãy ủng hộ chúng tôi lần này đi, chúng tôi sẽ chứng minh cho toàn ngân hà thấy giá trị của sự hợp tác."
 ethic_xenophile_request_neutral_3: "$COUNTRY$ sẽ ủng hộ nỗ lực của chúng tôi trong việc biến biển sao thành một nơi tốt đẹp hơn cho tất cả sinh vật, bất kể giống loài nào chứ?"
 ethic_xenophile_request_neutral_4: "Không ủng hộ nghị quyết này là đi ngược lại với tinh thần của những nguyên tắc cơ bản nhất làm nền tảng cho [global_event_country.GetGalCommunityOrGalImperium]."
 ethic_xenophile_request_hostile: "Lẽ nào $COUNTRY$ không nhận ra giá trị của việc đoàn kết một lòng?"
 ethic_xenophile_request_hostile_0: "Ủng hộ nghị quyết này sẽ là bước đầu tiên để khôi phục mối quan hệ giữa hai quốc gia chúng ta."
 ethic_xenophile_request_hostile_1: "Dù sao đi nữa, $GREETER$ vẫn muốn duy trì giao tiếp với $COUNTRY$. Xin hãy ủng hộ chúng tôi trong chuyện này."
 ethic_xenophile_request_hostile_2: "Điều này sẽ mang lại lợi ích cho tất cả chúng ta... dù là $COUNTRY$ cũng phải hiểu điều đó."
 ethic_xenophile_request_hostile_3: "Diễn đàn này được lập ra để phá bỏ rào cản, nhằm thúc đẩy sự hợp tác giữa nhiều giống loài đang cùng chung sống trong biển sao."
 ethic_xenophile_request_hostile_4: "$COUNTRY$ đang lo lắng điều gì? Dù chỉ một lần thôi, các người không thể đi cùng hướng với chúng tôi sao?"
 ### Yêu cầu - Chủ nghĩa Bài ngoại
 ethic_xenophobe_request_friendly: "Sát cánh nỗ lực khi cần thiết sẽ mang lại lợi ích cho cả hai đế chế vĩ đại của chúng ta."
 ethic_xenophobe_request_friendly_0: "À, là $COUNTRY$! Trong cái hố phân của bọn người ngoài hành tinh này hiếm khi tìm được ai đáng để chúng tôi tôn trọng."
 ethic_xenophobe_request_friendly_1: "Xin xỏ sự ủng hộ từ người ngoài là một việc phiền phức đối với chúng tôi, nhưng $COUNTRY$ được chúng tôi coi là bạn."
 ethic_xenophobe_request_friendly_2: "Ở giữa đám dị chủng này thật phiền phức, nhưng bất kỳ đại diện nào đến từ $COUNTRY$ đều được coi là bạn của chúng tôi."
 ethic_xenophobe_request_friendly_3: "Cuối cùng cũng có người biết điều! Nơi này đầy rẫy những kẻ dị chủng độc ác nhất có thể tưởng tượng được, nhưng gặp được đại diện của $COUNTRY$ luôn khiến chúng tôi hài lòng."
 ethic_xenophobe_request_friendly_4: "Hãy cùng nỗ lực để đưa [global_event_country.GetGalCommunityOrGalImperium] trở lại quỹ đạo đúng đắn."
 ethic_xenophobe_request_neutral: "Chỉ cần ủng hộ chúng tôi lần này, rồi chúng tôi sẽ hài lòng để các bạn yên."
 ethic_xenophobe_request_neutral_0: "Đề nghị của chúng tôi là: Các bạn ủng hộ chúng tôi trong cuộc bỏ phiếu sắp tới, và chúng tôi sẽ để các bạn được yên. Đồng ý chứ?"
 ethic_xenophobe_request_neutral_1: "Bị bao vây bởi tất cả những... sinh vật này làm chúng tôi ngạt thở, nên xin đừng bắt chúng tôi phải cầu xin sự ủng hộ từ các bạn."
