 concept_modifier: "Chỉ số điều chỉnh"
 concept_modifiers: "Chỉ số điều chỉnh"
 concept_empire_modifier: "Chỉ số điều chỉnh đế chế"
 concept_empire_modifiers: "Chỉ số điều chỉnh đế chế"
 concept_planet_modifier: "Chỉ số điều chỉnh hành tinh"
 concept_planet_modifiers: "Chỉ số điều chỉnh hành tinh"
 concept_modifier_desc: "§H$concept_modifiers$§! là một loạt những bùa lợi hay hình phạt thường được phát sinh từ các quyết định được đưa ra trong xuyên suốt quá trình thực hiện £anomaly£['concept_anomalies'] hoặc ['concept_event_chains'].\n\nCác chỉ số này có thể mang tính chất tạm thời hoặc vĩnh viễn, chúng có thể áp dụng lên toàn bộ đế chế hoặc chỉ khoanh vùng tại một khu vực nhất định, ví dụ như trên một hành tinh nào đó.\n\nNhững §H$concept_modifiers$§! gây ảnh hưởng tới toàn bộ đế chế sẽ được hiển thị tại §H$empire_view_tab_empire$§! của £interface£['concept_empire_view'], còn những chỉ số chỉ tác động tới một hành tinh cụ thể sẽ xuất hiện tại £interface£['concept_colony_view']."
 #Số ít: ['concept_diplomacy'] hoặc §H$concept_diplomacy$§!
 #Số nhiều: -
 concept_diplomacy: "Ngoại giao"
 concept_diplomacy_desc: "§H$concept_diplomacy$§! đóng vai trò chi phối đối với các hình thức tương tác qua lại cùng với những đế chế khác, bao trùm lên mọi khía cạnh, bắt đầu từ những bản hiệp định giao thương, liên minh, ['concept_rivals'] cho tới ['concept_wars']. Các động thái ngoại giao sẽ phải chịu ảnh hưởng từ các vấn đề như ['concept_ethics'], ['concept_authorities'], tiềm lực tương quan giữa các bên cùng những lợi ích chung.\n\nĐế chế có khả năng cử các ['concept_envoys'] để thắt chặt mối quan hệ, ký kết ['concept_diplomatic_pacts'] hoặc thông qua ['concept_federation'] hay ['concept_galactic_community'] để trực tiếp tham gia vào nền chính trị của dải ngân hà."
 #Số ít: ['concept_subject_agreement'] hoặc §H$concept_subject_agreement$§!
 #Số nhiều: ['concept_subject_agreements'] hoặc §H$concept_subject_agreements$§!
 concept_subject_agreement: "Thỏa thuận chư hầu"
 concept_subject_agreements: "Thỏa thuận chư hầu"
 concept_subject_agreement_desc: "§H$concept_subject_agreements$§! mang tính chất quyết định đối với các điều khoản nhằm thiết lập nên một mối quan hệ lệ thuộc diễn ra giữa giới chủ nô cùng với bên chư hầu, nó định đoạt quyền tự trị, vấn đề bàn giao tài nguyên cũng như những trách nhiệm liên quan tới quân sự. Những thỏa thuận này có thể được sửa đổi để thắt chặt thêm sợi dây cương đối với phía chư hầu hay biến họ trở thành những người đồng minh mang tính chất bán tự trị.\n\nCó thể tiến hành thương lượng các §H$concept_subject_agreements$§! tại thẻ $contacts_view_tab_agreements$ của £interface£['concept_contacts_view']."
 #Số ít: ['concept_subject'] hoặc §H$concept_subject$§!
 #Số nhiều: ['concept_subjects'] hoặc §H$concept_subjects$§!
 concept_subject: "Chư hầu"
 concept_subjects: "Chư hầu"
 concept_subject_desc: "§H$concept_subjects$§! là các nước phụ thuộc chịu sự cai quản của một đế chế bề trên. Những chư hầu này sở hữu chính quyền và hạm đội riêng, nhưng hành động bị ràng buộc bởi ['concept_subject_agreement'] đã ký kết với bên cai trị."
 #Số ít: ['concept_relic'] hoặc §H$concept_relic$§!
 #Số nhiều: ['concept_relics'] hoặc §H$concept_relics$§!
 concept_relic: "Di vật"
 concept_relics: "Di vật"
 concept_relic_desc: "§H$concept_relics$§! là những cổ vật quyền năng từ các nền văn minh cổ xưa, mang lại lợi ích độc nhất cho người sở hữu.\n\nCó thể khai quật được chúng tại các £archaeology£['concept_archaeology_site'], nhận khi hoàn thành các ['concept_event_chains'] nhất định, hoặc đoạt lấy từ tay những đế chế bại trận.\n\n§H$concept_relics$§! mang lại hiệu ứng bị động vĩnh viễn và có thể kích hoạt để nhận thêm hiệu ứng cường hóa mạnh mẽ trong thời gian ngắn. Có thể quản lý tại thẻ $discoveries_view_tab_relics$ trong £interface£['concept_discoveries_view']."
 #Số ít: ['concept_astral_action'] hoặc §H$concept_astral_action$§!
 #Số nhiều: ['concept_astral_actions'] hoặc §H$concept_astral_actions$§!
 concept_astral_action: "Hành động cõi sao"
 concept_astral_actions: "Hành động cõi sao"
 concept_astral_action_desc: "§H$concept_astral_actions$§! là những năng lực cho phép đế chế tương tác với kết cấu không gian theo cách độc đáo, thường tận dụng các hiện tượng nơi cõi sao để giành ưu thế chiến lược.\n\n§H$concept_astral_actions$§! thường được mở khóa thông qua việc khám phá ['concept_astral_rifts']."
 #Số ít: ['concept_minor_artifact'] hoặc §H$concept_minor_artifact$§!
 #Số nhiều: ['concept_minor_artifacts'] hoặc §H$concept_minor_artifacts$§!
 concept_minor_artifact: "Cổ vật hiếm"
 concept_minor_artifacts: "Cổ vật hiếm"
 concept_minor_artifact_desc: "§H$concept_minor_artifacts$§! là những tàn dư sót lại từ các nền văn minh cổ đại, thường được phát hiện thông qua quá trình tiến hành khai quật tại các £archaeology£['concept_archaeology_site']. Mặc dù không sở hữu quyền năng to lớn như các §H$concept_relics$§!, nhưng chúng cũng có rất nhiều công dụng, ví dụ như kích hoạt những bùa lợi độc đáo dành cho đế chế hoặc sử dụng để trao đổi lấy các tài nguyên có giá trị.\n\nCông dụng của các cổ vật này sẽ được quyết định dựa trên tiến trình công nghệ cũng như các chính sách của đế chế, có thể dùng chúng để làm phong phú thêm cho nền văn hóa, các phát kiến khoa học, và thậm chí là ứng dụng cả vào trong quân sự. Có thể quản lý tại £interface£['concept_discoveries_view']."
 #Số ít: ['concept_crisis'] hoặc §H$concept_crisis$§!
 #Số nhiều: -
 concept_crisis: "Khủng hoảng"
 concept_crisis_desc: "§H$concept_crisis$§! đóng vai trò là một cột mốc đánh dấu sự trỗi dậy của một đế chế để trở thành một mối hiểm họa sở hữu quyền năng tối thượng, một lực lượng mang tính biểu tượng của sự diệt vong được thúc đẩy bởi những nguồn sức mạnh mang đầy tính cấm kỵ cùng những công nghệ hủy diệt thế giới.\n\nNhững ai dấn thân vào con đường này sẽ tự chuốc lấy sự chống đối chung từ toàn thể dải ngân hà, bởi vì con đường mà họ lựa chọn sẽ chỉ mang lại một sự hủy diệt không thể nào vãn hồi."
 #Số ít: ['concept_overlord_holding'] hoặc §H$concept_overlord_holding$§!
 #Số nhiều: ['concept_overlord_holdings'] hoặc §H$concept_overlord_holdings$§!
 concept_overlord_holding: "Tài sản của chủ nô"
 concept_overlord_holdings: "Tài sản của chủ nô"
 concept_overlord_holding_desc: "§H$concept_overlord_holdings$§! là các khu cơ sở đặc biệt do mẫu quốc thành lập trên những hành tinh thuộc quyền sở hữu từ phía chư hầu. Những công trình kiến trúc này có thể được ứng dụng để làm nơi phản chiếu tầm ảnh hưởng, khai thác tài nguyên, hay tiếp cận các dịch vụ, mỗi một hạng mục sẽ góp phần củng cố thêm sức mạnh quyền uy cho giới chủ nô dựa theo những phương thức không giống nhau.\n\nChủng loại cùng với số lượng của các §H$concept_overlord_holdings$§! sẽ do những điều khoản nằm bên trong ['concept_subject_agreement'] định đoạt, còn về phần hiệu ứng thì lại phụ thuộc hoàn toàn vào ['concept_civics'], ['concept_ethics'] và những mức độ ưu tiên mang tính chiến lược của bên chủ nô. Tuy nói rằng mang tới ích lợi cho mẫu quốc, thế nhưng một vài khu cơ sở có khả năng sẽ thổi bùng lên sự căm phẫn cho bên chư hầu, nhất là khi chúng bị xem như một công cụ bóc lột hay xâm phạm."
 #Số ít: ['concept_branch_office'] hoặc §H$concept_branch_office$§!
 #Số nhiều: ['concept_branch_offices'] hoặc §H$concept_branch_offices$§!
 concept_branch_office: "$BRANCH_OFFICE$"
 concept_branch_offices: "$BRANCH_OFFICES$"
 concept_branch_office_desc: "§H$BRANCH_OFFICES$§! sẽ trích một tỷ lệ nhất định từ lượng £trade_value£['concept_trade'] của hành tinh mục tiêu để chuyển hóa thành £energy£['concept_energy'] và cung cấp cho bên sở hữu tập đoàn.\n\nCó thể tiến hành xây dựng tối đa §Y4§! tòa nhà chi nhánh tại £interface£['concept_colony_view'] của hành tinh mục tiêu, các ô trống sẽ được mở khóa thông qua việc nâng cấp tòa thủ phủ trên hành tinh đó."
 #Số ít 1: ['concept_war'] hoặc §H$concept_war$§!
 #Số nhiều 1: ['concept_wars'] hoặc §H$concept_wars$§!
 #Số ít 2: ['concept_subjugation_war'] hoặc §H$concept_subjugation_war$§!
 #Số nhiều 2: -
 #Số ít 3: ['concept_total_war'] hoặc §H$concept_total_war$§!
 #Số nhiều 3: -
 concept_war: "Chiến tranh"
 concept_wars: "Chiến tranh"
 concept_subjugation_war: "Chiến tranh khuất phục"
 concept_total_war: "Chiến tranh tổng lực"
 concept_war_desc: "§H$concept_war$§! là một loại hình thức giao tranh vũ trang mang tính chính thức nổ ra giữa các đế chế, gắn liền với những mục tiêu cụ thể, ví dụ như đòi hỏi ['concept_claims'], xử lý các vấn đề gây bất mãn, hay thậm chí là nhằm mục đích đập đi xây lại cả trật tự của dải ngân hà. §HLý do tuyên chiến§! sẽ quyết định mục đích cũng như những kết quả khả thi của cuộc chiến.\n\nChiến tranh sẽ kết thúc bằng sự đầu hàng sau khi một phe đã chấp thuận những điều kiện do phe còn lại đưa ra, hoặc lựa chọn §HDuy trì hiện trạng§!['concept_peace'], trong tình huống này, những khoản lợi ích thu được sẽ bị giới hạn ở các hệ sao đã bị chiếm đóng ngay tại thời điểm bản thỏa thuận được thông qua. Đi cùng với sự kéo dài của những đợt xung đột, cùng sự tích lũy của §HĐộ chán ghét chiến tranh§!, áp lực nhằm chấm dứt các hành vi thù địch cũng theo đó mà leo thang dần. Mặc dù cái giá phải trả là vô cùng đắt đỏ, thế nhưng chiến tranh vẫn luôn là một thứ công cụ mang tính chất quyết định dùng để định hình nên vận mệnh của cả một đế chế."
 #Số ít: ['concept_peace'] hoặc §H$concept_peace$§!
 #Số nhiều: -
 concept_peace: "Hòa bình"
 concept_peace_desc: "§H$concept_peace$§! là một phương thức để các đế chế chính thức đình chỉ mọi hoạt động thù địch, điều này thông thường sẽ dẫn tới việc thực thi các mục tiêu chiến tranh, sự trao đổi về mặt lãnh thổ hay áp đặt lên những sự dàn xếp chính trị mới. Nền hòa bình có thể được thiết lập thông qua con đường đầu hàng, hoặc đạt được nhờ vào những nỗ lực được chia sẻ chung từ đôi bên.\n\nCác điều khoản hòa bình đã tạo nên trật tự thời hậu chiến, vẽ lại đường ranh giới, biến các đế chế thành những kẻ chư hầu, hoặc gieo rắc những hạt giống dẫn tới các cuộc xung đột trong tương lai."
 #Số ít: ['concept_galactic_community'] hoặc §H$concept_galactic_community$§!
 #Số nhiều: -
 concept_galactic_community: "Cộng đồng Ngân hà"
 concept_galactic_community_desc: "§H$concept_galactic_community$§! là một cơ quan lập pháp liên ngân hà được cấu thành bởi nhiều quốc gia thành viên, nhắm tới mục tiêu thúc đẩy sự hợp tác, kiến tạo nên các chuẩn mực liên sao, và xử lý những mối hiểm họa mang tính chất chung. Thông qua việc đề xuất và thông qua các nghị án, cộng đồng này sẽ gây ra những sự tác động về mặt quyền lực mềm lên các thành viên của mình, nhằm chuẩn hóa ['concept_war'], giao thương và các giá trị xã hội trên toàn quy mô của dải ngân hà.\n\nĐế chế có thể giành lấy tầm ảnh hưởng trong cộng đồng thông qua việc cắt cử các ['concept_envoys'] và tích lũy ['concept_diplomatic_weight']. Mặc dù vẻ bề ngoài là một diễn đàn đoàn kết, thế nhưng những hoạt động thường nhật của cộng đồng này lại là những màn đấu đá ăn miếng trả miếng, những cuộc thương thuyết mờ ám sau lưng cùng với việc biến nơi đây trở thành sàn diễn dành cho sự bạo quyền đến từ nhóm đa số."
 #Số ít: ['concept_galactic_council'] hoặc §H$concept_galactic_council$§!
 #Số nhiều: -
 concept_galactic_council: "Hội đồng Ngân hà"
 concept_galactic_council_desc: "§H$concept_galactic_council$§! là một cơ quan cai trị quy tụ giới tinh hoa nằm bên trong ['concept_galactic_community'], được lập nên bởi các quốc gia thành viên nắm giữ mức ['concept_diplomatic_weight'] uy lực nhất. Thành viên thuộc hội đồng nắm giữ rất nhiều đặc quyền, bao gồm khả năng đưa ra các giải pháp khẩn cấp, sử dụng một lá phiếu để phủ quyết nghị án, điều chỉnh nghị trình của dải ngân hà v.v.\n\nSố lượng ghế trong hội đồng là có giới hạn, và có nguy cơ xảy ra sự luân phiên, tư cách thành viên được định đoạt dựa trên thực lực ngoại giao tương quan. Mặc dù mục đích tồn tại của hội đồng là nhằm duy trì trật tự của dải ngân hà, thế nhưng nơi đây thường hay bị biến tướng thành một lò luyện chứa đựng đầy rẫy những dã tâm, nơi mà kẻ mạnh sẽ lợi dụng để củng cố thêm vị thế thống trị của bản thân, còn kẻ yếu lại âm thầm lập mưu hòng phá hoại nó."
 #Số ít: ['concept_favor'] hoặc §H$concept_favor$§!
 #Số nhiều: ['concept_favors'] hoặc §H$concept_favors$§!
 concept_favor: "Sự ủng hộ ngoại giao"
 concept_favors: "Sự ủng hộ ngoại giao"
 concept_favor_desc: "§H$concept_favors$§! là một dạng công cụ mang tính chất ngoại giao, đại diện cho tầm ảnh hưởng của một đế chế lên một đế chế khác, thông thường sẽ được thu thập thông qua việc tham dự vào những sự kiện thuộc dải ngân hà. Chúng đóng vai trò là một loại tiền tệ mang tính chính trị bên trong §H$concept_galactic_community$§! và được sử dụng rộng rãi hơn trong các lĩnh vực ngoại giao.\n\nCó thể sử dụng Sự ủng hộ ngoại giao để gây tác động tới các lá phiếu, tăng cường trọng lượng đối với các lời khuyên ngoại giao, hoặc là dùng làm con bài mặc cả trong các cuộc thương thuyết."
 #Số ít: ['concept_diplomatic_weight'] hoặc §H$concept_diplomatic_weight$§!
 #Số nhiều: -
 concept_diplomatic_weight: "Trọng lượng ngoại giao"
 concept_diplomatic_weight_desc: "§H$concept_diplomatic_weight$§! được dùng để đong đếm tầm ảnh hưởng của một đế chế bên trong ['concept_galactic_community'], có tác dụng định đoạt trọng lượng bỏ phiếu của nó đối với các nghị án cùng với việc liệu nó có đắc cử vào ['concept_galactic_council'] hay không. Mức trọng lượng này được tính toán từ các phương diện như kinh tế, công nghệ và tiềm lực quân sự của đế chế, đồng thời còn chịu tác động từ số lượng ['concept_envoys'] đã được cắt cử tới làm việc tại cộng đồng.\n\nTrọng lượng ngoại giao có thể bị dao động theo thời gian, vậy nên nó không chỉ đóng vai trò phản ánh vị thế của đế chế, mà còn là một thứ công cụ có chức năng thúc đẩy lợi ích cho phe mình."
 #Số ít: ['concept_first_contact'] hoặc §H$concept_first_contact$§!
 #Số nhiều: ['concept_first_contacts'] hoặc §H$concept_first_contacts$§!
 concept_first_contact: "Lần tiếp xúc đầu tiên"
 concept_first_contacts: "Lần tiếp xúc đầu tiên"
 concept_first_contact_desc: "§H$concept_first_contact$§! đại diện cho những sự kiện mang tính chất chạm trán đầu tiên diễn ra giữa hai nền văn minh trước đó hoàn toàn chưa có bất kỳ sự nhận biết nào về đối phương. Những khoảnh khắc khai sáng này có nguy cơ sẽ kéo theo ['concept_diplomacy'], những sự hồ nghi hoặc cả sự xung đột, tất cả sẽ phụ thuộc hoàn toàn vào bản chất cũng như tính cách của cả hai phe.\n\nTiến trình của §H$concept_first_contact$§! bao gồm việc tiến hành giải mã những phương thức liên lạc đến từ người ngoài hành tinh, quản lý các sự kiện tiềm ẩn rủi ro, cùng với việc định hình tư thế của một đế chế khi đối diện trước những hiện tượng chưa từng được biết tới."
 #Số ít: ['concept_workforce'] hoặc §H$concept_workforce$§!
 #Số nhiều: -
 concept_workforce: "Lực lượng lao động"
 concept_workforce_desc: "§H$concept_workforce$§! đại diện cho tổng lượng lao động đến từ dân cư sống trên hành tinh, nó phản ánh số lượng các cá thể sở hữu khả năng tham gia vào hàng loạt những chức năng mang ý nghĩa cốt tử đối với các cơ chế của đế chế trên £colony£['concept_colony'].\n\nCác £pop£['concept_pops'] sẽ được tổ chức thành những đội nhóm dựa vào những đặc điểm mang tính chất chung như ['concept_species'], tầng lớp xã hội và ['concept_ethics']. Mỗi một nhóm đều sẽ được cộng dồn vào §H$concept_workforce$§! của hành tinh, sau đó sẽ tiếp tục được phân bổ vào các £job£['concept_jobs'] đang chờ tuyển dụng."
 #Số ít: £zone£ ['concept_district_specialization'] hoặc £zone£ §H$concept_district_specialization$§!
 #Số nhiều: £zone£ ['concept_district_specializations'] hoặc £zone£ §H$concept_district_specializations$§!
 concept_district_specialization: "$planet_zone$"
 concept_district_specializations: "$planet_zones$"
 concept_district_specialization_desc: "Chuyên môn hóa khu vực sẽ đóng vai trò quyết định loại hình £job£['concept_jobs'] do mỗi một £district£['concept_district'] cung cấp, và phần lớn sẽ gia tăng thêm những ô trống £building£['concept_buildings']."
 concept_district_specializations_desc: "$concept_district_specialization_desc$"
