 concept_debris: "Mảnh vỡ"
 concept_debris_desc: "Những tàn tích trôi nổi và vỏ tàu vỡ nát, cùng với những âm vang tĩnh lặng của các cuộc đụng độ ngoài không gian, những tàn dư sót lại từ các trận chiến ngoài vũ trụ này là các §H$concept_debris$§! được hiển thị theo dõi dưới hình thức các ['concept_special_project'] có giới hạn thời gian.\n\nViệc phân công một chiếc £science_ship£['concept_science_ship'] để tiến hành điều tra các §H$concept_debris$§! có khả năng sẽ mang đến cho chúng ta những cái nhìn sâu sắc về các ['concept_technologies'] mới."
 #Số ít: ['concept_council'] hoặc §H$concept_council$§!
 #Số nhiều: -
 concept_council: "Hội đồng"
 concept_council_desc: "§H$concept_council$§! đóng vai trò là ban lãnh đạo tập thể của ['concept_empire'], bao gồm §HNgười cai trị§! và tối đa năm vị §HQuan chức hội đồng§!. Mỗi một vị trí trong hội đồng có thể được đảm nhận bởi một ['concept_leader'], trong đó một vài ['concept_leader_traits'] có khả năng cung cấp bùa lợi trên phạm vi toàn lãnh thổ.\n\n§H$concept_council$§! đồng thời cũng chịu trách nhiệm trong việc ban hành các ['concept_agendas'].\n\nQuá trình quản lý và bổ nhiệm vào hội đồng có thể được thực hiện bên trong thẻ §HHội đồng§! của £interface£['concept_government_view']."
 #Số ít: ['concept_agenda'] hoặc §H$concept_agenda$§!
 #Số nhiều: ['concept_agendas'] hoặc §H$concept_agendas$§!
 concept_agenda: "Nghị trình"
 concept_agendas: "Nghị trình"
 concept_agenda_desc: "§H$concept_agenda$§! đại diện cho trọng tâm mang tính chiến lược của ['concept_council'] hiện tại, nó quyết định các vấn đề ưu tiên cùng với những mục tiêu dài hạn của đế chế. Các nghị trình có khả năng cung cấp một lượng nhỏ bùa lợi trong suốt quá trình chuẩn bị, và khi được khởi động thì chúng sẽ mang tới những bùa lợi đầy uy lực hơn.\n\nNhững §H$concept_agendas$§! có thể sử dụng cùng các tác dụng của chúng sẽ được quyết định bởi ['concept_authority'] đang nắm quyền, các ['concept_traditions'] đã được thông qua và hàng loạt những nhân tố khác.\n\nCó thể quản lý các §H$concept_agendas$§! bên trong thẻ §HHội đồng§! của £interface£['concept_government_view']."
 #Số ít: £research£ ['concept_research'] hoặc £research£ §H$concept_research$§!
 #Số nhiều: -
 concept_research: "Nghiên cứu"
 concept_research_desc: "£research£§H$concept_research$§! là một quá trình nhằm tiếp thu các kiến thức khoa học trên ba phương diện trụ cột, bao gồm: £physics£['concept_physics_research'], £society£['concept_society_research'] và £engineering£['concept_engineering_research']. Mỗi một phương diện sẽ có bước phát triển độc lập, và đều sẽ sản sinh ra những ['concept_technologies'] mới.\n\nTốc độ nghiên cứu có nguy cơ sẽ phải gánh chịu ảnh hưởng từ các vấn đề mang tính nội bộ, các ['concept_leader_traits'] hoặc thông qua những nhân tố bên ngoài, chẳng hạn như ['concept_diplomatic_pacts', $concept_research_agreements$]."
 concept_research_tooltip: "$concept_research_desc$\n\n§GNhấn vào ['concept_research'] để mở cơ sở dữ liệu\nNhấn vào £research£ trong menu để mở rộng danh sách§!"
 #Số ít 1: ['concept_modifier'] hoặc §H$concept_modifier$§!
