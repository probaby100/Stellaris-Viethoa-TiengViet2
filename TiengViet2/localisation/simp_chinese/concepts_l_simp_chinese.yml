 concept_strategic_resources: "Tài nguyên chiến lược"
 concept_strategic_resources_desc: "£strategic_resource£§H$concept_strategic_resources$§! là những vật chất quý hiếm và có hiệu quả vượt trội, đóng vai trò tối quan trọng đối với các công nghệ tiên tiến, cơ sở hạ tầng và các hệ thống tàu vũ trụ.\n\nCác tài nguyên chiến lược điển hình bao gồm £volatile_motes£§H$volatile_motes$§!, £exotic_gases£§H$exotic_gases$§! cũng như £rare_crystals£§H$rare_crystals$§!.\n\n§HTài nguyên quý hiếm§! là những vật chất đặc biệt có giá trị cao hơn hoặc mang đặc tính khó lường hơn, phục vụ cho các mục đích sử dụng cực kỳ tân tiến. Ngoài các công dụng khác, tài nguyên quý hiếm và chiến lược có thể dùng để chế tạo ['concept_civilian_ships'], ['concept_military_ships'], ['concept_starbases'] và ['concept_megastructures'].$tt_gain$—Xây dựng £zone£ §H$zone_industrial_plural$§! hoặc £zone£ §H$zone_foundry_plural$§!\n—Xây dựng các công trình liên quan\n—$tt_market$"
 concept_strategic_resources_tooltip: "$concept_strategic_resources_desc$\n\n§GNhấp vào ['concept_strategic_resources'] để mở cơ sở dữ liệu\nNhấp vào £strategic_resource£ trong trình đơn để mở rộng danh sách§!"
