l_simp_chinese:
 ### CONCEPTS
 #Bên trên mỗi định nghĩa khái niệm là hướng dẫn sử dụng, bao gồm cả biểu tượng nếu có.
 #Lưu ý rằng giữa biểu tượng và thuật ngữ có một khoảng trắng không ngắt. Khi bạn sao chép ví dụ sử dụng, khoảng trắng này sẽ được giữ lại.
 #Điều này rất quan trọng để không bị ngắt dòng giữa biểu tượng và khái niệm.
 #Sử dụng liên kết khái niệm có biểu tượng cho lần đầu tiên nhắc đến một khái niệm mới, sau đó dùng §H không có biểu tượng cho những lần lặp lại.
 #Sử dụng §H kèm biểu tượng cho lần đầu tiên khái niệm được dùng trong chính phần mô tả của nó.
 #Sử dụng §H không kèm biểu tượng nếu khái niệm được dùng nhiều hơn một lần.
 GAME_CONCEPT_FORMAT: "§C$TEXT$§!"
 DATABANK_FILTER_DESC: "Danh mục đã chọn"
 databank_colony: "Thuộc địa"
 databank_conquest: "Chinh phạt"
 databank_development: "Phát triển"
 databank_empire: "Đế chế"
 databank_exploration: "Khám phá"
 databank_interface: "Giao diện"
 databank_resource: "Tài nguyên"
 dlc_requirement_string: "\n\n§PYêu cầu DLC:§!"
 requires_leviathans: "$dlc_requirement_string$ §ILeviathans§!"
 requires_apoc: "$dlc_requirement_string$ §IApocalypse§!"
 requires_syn_dawn: "$dlc_requirement_string$ §ISynthetic Dawn§!"
 requires_megacorp: "$dlc_requirement_string$§IMegaCorp§!"
 requires_dis_stars: "$dlc_requirement_string$ §YDistant Stars Story Pack§!"
 tt_gain: "\n\nCách nhận:\n"
 tt_use: "\n\nCông dụng:\n"
 tt_market: "Mua trên £market£['concept_market']."
 tt_no_need_hive: "§R$auth_hive_mind_plural$ không dùng tài nguyên này.§!"
 tt_some_need_machine: "§R$auth_machine_intelligence_plural$ thường không dùng tài nguyên này.§!"
 tt_some_need_infernal: "§R$trait_infernal_plural$ thường không dùng tài nguyên này.§!"
 concept_advanced_empire: "Đế chế AI Cấp cao"
 concept_advanced_empires: "Đế chế AI Cấp cao"
 concept_advanced_empires_desc: "Đế chế AI Cấp cao khởi đầu với nhiều tài nguyên, công nghệ và dân số hơn. Ngoài lợi thế ban đầu đó, họ không có thêm bất kỳ bùa lợi nào khác."
 concept_alien_zoo: "$building_xeno_zoo$"
 concept_alien_zoo_desc: "Công việc £mod_job_entertainer_add£[entertainer.GetName]: §G+100§!\nCông việc £mod_job_xeno_zoo_keeper_add£$job_xeno_zoo_keeper$: §G+100§!\nCông việc £mod_job_livestock_zoo_animal_add£$job_livestock_zoo_animal$: §G+300§!\n\n£job_xeno_zoo_keeper£$job_xeno_zoo_keeper_plural$ chuyển hóa $r_consumer_goods$ thành £society£§YĐiểm nghiên cứu§! và $r_amenities$\n$t$Sản lượng $r_amenities$ thay đổi theo số lượng công việc £job_livestock_zoo_animal£$job_livestock_zoo_animal$.\n$job_entertainer_effect_desc$\n$job_livestock_zoo_animal_effect_desc$\n\n§L$building_xeno_zoo_desc$§!"
 #Singular: ['concept_ascension_perk'] or §H$concept_ascension_perk$§!
 #Plural: ['concept_ascension_perks'] or §H$concept_ascension_perks$§!
 concept_ascension_perk: "Đặc quyền Thăng hoa"
 concept_ascension_perks: "Đặc quyền Thăng hoa"
 concept_ascension_perks_desc: "§H$concept_ascension_perks$§! mang lại những bùa lợi lớn cho toàn đế chế, định hình quá trình phát triển của nền văn minh, mở ra một chương mới mạnh mẽ, bền bỉ và siêu việt hơn.\n\nCó thể chọn và quản lý trong thẻ §H$traditions$§! của £interface£['concept_society_management_view']."
 #Singular: -
 #Plural: £alloys£ ['concept_alloys'] or £alloys£ §H$concept_alloys$§!
 concept_alloys: "Hợp kim"
 concept_alloys_desc: "£alloys£§H$concept_alloys$§! là một loại tài nguyên cao cấp có vai trò quân sự cực kỳ quan trọng.\n\nChủ yếu dùng để chế tạo ['concept_civilian_ships'], ['concept_military_ships'], ['concept_starbases'] và ['concept_megastructures'].$tt_gain$—Xây dựng £zone£§H$zone_industrial_plural$§! hoặc £zone£§H$zone_foundry_plural$§!\n—Xây dựng £building£ ['building:building_foundry_1']\n—$tt_market$"
 #Singular: £trade_value£ ['concept_trade'] or §H$concept_trade$§!
 #Plural: -
 concept_trade: "Thương mại"
 concept_trade_desc: "$r_trade$ đại diện cho các hoạt động kinh tế thường nhật, luân chuyển hàng hóa và năng lực hậu cần trong ['concept_empire'].\n\nCó thể dùng cho ['concept_ship_upkeep'], ['concept_colony_upkeep'] và mua sắm các tài nguyên khác.$tt_gain$—Xây dựng £building£['concept_buildings'] cung cấp £job£['concept_jobs'] tạo ra $r_trade$.\n—Xây dựng £mining_station£['concept_mining_stations'] trên các mỏ Giá trị Thương mại\n—Bán tài nguyên trên £market£['concept_market']"
 #Singular: £building£ ['concept_building'] or £building£ §H$concept_building$§!
 #Plural: £building£ ['concept_buildings'] or £building£ §H$concept_buildings$§!
 concept_building: "$buildable_building$"
 concept_buildings: "$planet_buildings$"
 concept_building_desc: "£building£§H$concept_buildings$§! dùng để chuyên biệt hóa sản lượng của £colony£['concept_colonies']. Ví dụ như ['building:building_foundry_1'] và ['building:building_research_lab_1'].\n\nViệc xây dựng §H$concept_building$§! cần có §HÔ công trình§! trống, thường được mở khóa bằng cách chọn £zone£['concept_district_specialization'].$tt_gain$—Xây dựng thêm §H$concept_buildings$§! trong £interface£['concept_colony_view']"
 #Singular: £mining_station£ £science_ship£ £shipclass_observation_station£ ['concept_civilian_space_station'] or £mining_station£ £science_ship£ £shipclass_observation_station£ §H$concept_civilian_space_station$§!
 #Plural: £mining_station£ £science_ship£ ['concept_civilian_space_stations'] or £mining_station£ §H$mining_station$§! £science_ship£ £shipclass_observation_station£ §H$concept_civilian_space_stations$§!
 concept_civilian_space_station: "$spacestation_1$ Dân sự"
 concept_civilian_space_stations: "$spacestation_1_plural$ Dân sự"
 concept_civilian_space_station_desc: "£mining_station£§H$mining_station_plural$§! và £science_ship£§H$research_station_plural$§! đều là các cơ sở quỹ đạo được xây dựng quanh thiên thể để khai thác tài nguyên hoặc nghiên cứu khoa học. $mining_station$ dùng để thu hoạch £minerals£['concept_minerals'], £energy£['concept_energy'] và các tài nguyên chiến lược khác, trong khi $research_station$ tạo ra £physics£ £society£ £engineering£['concept_research'] để thúc đẩy tiến bộ khoa học.\n\nNhững trạm không gian này cực kỳ quan trọng đối với sự phát triển kinh tế và công nghệ, chúng cần được £construction_ship£['concept_construction_ship'] xây dựng."
 #Singular: £colony£ ['concept_colony'] or £colony£ §H$concept_colony$§!
 #Plural: £colony£ ['concept_colonies'] or £colony£ §H$concept_colonies$§!
 concept_colony: "$COLONY$"
 concept_colonies: "$COLONIES$"
 concept_colony_desc: "£colony£§H$concept_colony$§! bao gồm các khu vực như nhà ở cho £pop£['concept_pops'], nơi làm việc là £district£['concept_districts'], £zone£['concept_district_specializations'] và £building£['concept_buildings'].\n\nVí dụ như §HHành tinh mẹ§! ban đầu, các £planet£['concept_planets'] được thuộc địa hóa bằng £colony_ship£['concept_colony_ships'] hoặc các ['concept_habitats'] đã hoàn thành.\n\nCó thể quản lý §H$concept_colonies$§! trong £interface£['concept_colony_view']."
 #Singular: £colony_ship£ ['concept_colony_ship'] or £colony_ship£ §H$concept_colony_ship$§!
 #Plural: £colony_ship£ ['concept_colony_ships'] or £colony_ship£ §H$concept_colony_ships$§!
 concept_colony_ship: "$colonizer$"
 concept_colony_ships: "$colonizer_plural$"
 concept_colony_ship_desc: "£colony_ship£§H$concept_colony_ships$§! được cử đến các £planet£['concept_planets'] để biến chúng thành £colony£['concept_colonies'].\n\nKhi hoạt động thuộc địa hóa được khởi xướng qua £interface£['concept_colony_view'] hoặc £interface£['concept_expansion_planner'], một chiếc §H$concept_colony_ship$§! sẽ tự động được chế tạo. Nó cũng có thể được chế tạo tại ['concept_shipyard']."
 #Singular: £construction_ship£ ['concept_construction_ship'] or £construction_ship£ §H$concept_construction_ship$§!
 #Plural: £construction_ship£ ['concept_construction_ships']
 concept_construction_ship: "$constructor$"
 concept_construction_ships: "$constructor_plural$"
 concept_construction_ship_desc: "£construction_ship£§H$concept_construction_ship$§! có thể được dùng để xây dựng nhiều loại trạm không gian khác nhau.$tt_use$—Xây dựng ['concept_outposts'] tại các £system£['concept_systems'] vô chủ để sáp nhập vào lãnh thổ của ['concept_empire']\n—Xây dựng £mining_station£['concept_mining_stations'] và £science_ship£['concept_research_stations'] quanh các £planet£['concept_planets'] và ['concept_stars'] đã khảo sát\n—Xây dựng ['concept_megastructures']\n—Nghiên cứu một số ['concept_special_projects'] nhất định$tt_gain$—Chế tạo §H$concept_construction_ships$§! tại ['concept_shipyard']!"
 #Singular: £science_ship£ ['concept_science_ship'] or £science_ship£ §H$concept_science_ship$§!
 #Plural: £science_ship£ ['concept_science_ships'] or £science_ship£ §H$concept_science_ships$§!
 concept_science_ship: "$science$"
 concept_science_ships: "$science_plural$"
 concept_science_ship_desc: "£science_ship£§H$concept_science_ships$§! là loại tàu chuyên dụng được thiết kế cho các hoạt động khám phá, khảo sát và nghiên cứu. Chúng được điều khiển bởi £scientist£['concept_scientist'], có khả năng khảo sát các hệ sao chưa được lập bản đồ, phân tích £anomaly£['concept_anomalies'] và khai quật £archaeology£['concept_archaeology_sites'].\n\nNhững con tàu này sẽ tự động được lắp đặt các ['concept_components'] tiên tiến nhất hiện có, và đóng vai trò sống còn trong giai đoạn khám phá mở rộng ban đầu.\n\n§H$concept_science_ships$§! cũng có thể được dùng để thám hiểm các hiện tượng không gian như ['concept_wormholes'], nghiên cứu ['concept_debris'] của tàu hoặc hỗ trợ các ['concept_special_projects'] cần phân tích chi tiết."
 #Singular: -
 #Plural: £consumer_goods£ ['concept_consumer_goods'] or £consumer_goods£ §H$concept_consumer_goods$§!
 concept_consumer_goods: "Hàng tiêu dùng"
 concept_consumer_goods_desc: "[GetConceptConsumerGoods]"
 concept_consumer_goods_desc_start: "£consumer_goods£§H$concept_consumer_goods$§! là một loại tài nguyên cao cấp, bao gồm các loại thiết bị, hàng xa xỉ phẩm và các loại hàng hóa mang lại mức sống chất lượng cho £pop£['concept_pops']."
 concept_consumer_goods_desc_end: "$tt_gain$—Xây dựng £zone£§H$zone_industrial_plural$§! hoặc £zone£§H$zone_factory_plural$§!\n—Xây dựng £building£['building:building_factory_1']\n—$tt_market$"
 concept_consumer_goods_desc_regular: "$concept_consumer_goods_desc_start$\n\nĐồng thời cũng dùng để duy trì một số £job£['concept_jobs'], chẳng hạn như £job_researcher£['concept_researcher'] hay £job_priest£['concept_priest'].$concept_consumer_goods_desc_end$"
 concept_consumer_goods_desc_hive: "$tt_no_need_hive$\n\n$concept_consumer_goods_desc_regular$"
 concept_consumer_goods_desc_machine: "$tt_some_need_machine$\n\n$concept_consumer_goods_desc_start$\n\n['concept_auth_machine_intelligence', $auth_machine_intelligence_plural$] mang chỉ thị §H$civic_machine_obsessional_directive$§! cũng sẽ tạo ra £consumer_goods£§H$concept_consumer_goods$§!, §H$civic_machine_servitor_plural$§! cũng sẽ cung cấp cho £pop£§HDân số $citizenship_organic_trophy$§! của họ.$concept_consumer_goods_desc_end$"
 #Singular: -
 #Plural: £biomass£ ['concept_biomass'] or £biomass£ §H$biomass$§!
 concept_biomass: "Sinh khối"
 concept_biomass_desc: "£biomass£§HSinh khối§! là tiềm năng hữu cơ tự nhiên được tạo ra bởi hoạt động sinh học trên các hành tinh trong ['concept_owned_systems'].\n\nNó có thể dùng để xây dựng £building£['concept_buildings'] trên hành tinh hoặc ['concept_terraforming'] cho các ['concept_colonies'] mới.$tt_gain$—Tăng trưởng £pop£['concept_pops']\n—Xây dựng £building£['building:building_cradle_of_rebirth']"
 #Singular: £genetic_material£ ['concept_dna'] or £genetic_material£ §H$concept_dna$§!
 #Plural: -
 concept_dna: "$genetic_material$"
 concept_dna_desc: "£genetic_material£§H$concept_dna$§! có thể được nhân bản thành các sinh vật không gian để tạo thành hạm đội quân sự. Vật chất di truyền cấp cao hơn có thể dùng trong ['concept_hatchery', Vườn ươm] để mở khóa các bản sao §YThú không gian§! cấp cao.\n\nVật chất di truyền có thể thu thập ngoài tự nhiên bằng £physics£['technology:tech_gravity_wells'] hoặc nuôi cấy trong ['concept_vivarium']."
 #Singular: £district£ ['concept_district'] or £district£ §H$concept_district$§!
 #Plural: £district£ ['concept_districts'] or £district£ §H$concept_districts$§!
 concept_district: "$DISTRICT$"
 concept_districts: "$DISTRICTS$"
 concept_district_desc: "£district£§H$concept_districts$§! là khu vực chuyên biệt trong một £colony£['concept_colony']. Ví dụ như ['concept_generator_districts'], ['concept_mining_districts'] hay ['concept_farming_districts'] v.v...\n\nThường được dùng để cung cấp £housing£['concept_housing'] và £job£['concept_jobs'].$tt_gain$—Xây dựng thêm §H$concept_districts$§! trong £interface£['concept_colony_view']"
 #Singular: ['concept_edict'] or §H$concept_edict$§!
 #Plural: ['concept_edicts'] or §H$concept_edicts$§!
 concept_edict: "Sắc lệnh"
 concept_edicts: "Sắc lệnh"
 concept_edicts_desc: "§H$concept_edicts$§! là quyết sách áp dụng trên quy mô toàn đế chế, có thể ban hành bằng cách tiêu hao tài nguyên hoặc trả phí bảo trì hàng tháng.\n\nPhần lớn trong số đó tiêu tốn $i_unity$ hoặc được chi trả bởi ['concept_edict_fund'], nhưng cũng có một số §H$concept_edicts$§! tiêu thụ các tài nguyên khác.\n\nCó thể quản lý §H$concept_edicts$§! trong thẻ §H$government_view_tab_policies_and_edicts$§! của £interface£['concept_government_view']."
 #Singular: ['concept_edict_fund'] or §H$concept_edict_fund$§!
 #Plural: -
 concept_edict_fund: "Quỹ Sắc lệnh"
 concept_edict_fund_desc: "§H$concept_edict_fund$§! là một quỹ £unity£['concept_unity'] cố định, chuyên dùng để trả phí bảo trì cho ['concept_edict']. Nếu tổng phí bảo trì của §H$concept_edict_fund$§! vượt quá giới hạn, hệ thống sẽ tự động tiêu hao thêm §H$concept_unity$§!."
 #Singular: -
 #Plural: £energy£ ['concept_energy'] or £energy£ §H$concept_energy$§!
 concept_energy: "Năng lượng"
 concept_energy_desc: "£energy£§HNăng lượng§! là đơn vị lưu trữ năng lượng có thể truyền tải được, đóng vai trò sống còn đối với mọi ['concept_empires'] trong không gian.\n\nNó được dùng làm phí bảo trì cho ['concept_ships'] và ['concept_buildings'], dọn dẹp £blocker£['concept_blockers'] trên hành tinh, cũng như giao thương với các đế chế khác.$tt_gain$—Xây dựng £district£['concept_generator_districts']\n—Xây dựng £mining_station£['concept_mining_stations'] trên các ['concept_celestial_objects'] có trữ lượng năng lượng.\n—$tt_market$."
 #Singular: ['concept_authority'] or §H$concept_authority$§!
 #Plural: ['concept_authorities'] or §H$concept_authorities$§!
 concept_authority: "Cơ cấu Quyền lực"
 concept_authorities: "Cơ cấu Quyền lực"
 concept_authority_desc: "§H$concept_authority$§! quyết định cách một đế chế chọn ra người lãnh đạo và quản lý người dân của mình. Các chế độ dân chủ và quả đầu có các cuộc ['concept_democratic_election'] định kỳ, trong khi chế độ độc tài và quân chủ tập trung toàn bộ quyền lực vào tay một người trị vì duy nhất.\n\nViệc lựa chọn §H$concept_authority$§! sẽ ảnh hưởng đến mức độ ủng hộ và tán thành của ['concept_factions'], việc kế vị lãnh đạo, các ['concept_civics'] khả dụng cũng như hoạt động ngoại giao.\n\n§H$concept_authority$§! của đế chế được xác lập ngay khi thành lập quốc gia, và có thể được cải tổ nếu đáp ứng đủ các điều kiện cần thiết."
 #Singular: ['concept_ethic'] or §H$concept_ethic$§!
 #Plural: ['concept_ethics'] or §H$concept_ethics$§!
 concept_ethic: "Triết lý"
 concept_ethics: "Triết lý"
 concept_ethic_desc: "§H$concept_ethics$§! đại diện cho hệ tư tưởng cốt lõi của một đế chế, định hình chính sách, cấu trúc xã hội và lập trường ngoại giao của nó. Nó quyết định xem giá trị của cá nhân nằm ở sự tự do hay sự kiểm soát dưới chế độ độc đoán, lựa chọn con đường chinh phạt quân sự hay chung sống hòa bình.\n\n§H$concept_ethics$§! của đế chế tác động đến các ['concept_civics'], ['concept_authorities'] khả dụng cũng như cách thức tương tác với các đế chế khác. Mặc dù §H$concept_ethics$§! được xác định lúc mới thành lập quốc gia, nó vẫn có thể dần thay đổi theo thời gian trước áp lực nội bộ, sức ảnh hưởng từ phe phái hoặc những cải cách có chủ đích hòng dịch chuyển tư tưởng."
 #Singular: ['concept_faction'] or §H$concept_faction$§!
 #Plural: ['concept_factions'] or §H$concept_factions$§!
 concept_faction: "Phe phái"
 concept_factions: "Phe phái"
 concept_faction_desc: "§H$concept_factions$§! là các nhóm £pop£['concept_pops'] có chung nguyện vọng về cách vận hành của ['concept_empire'].\n\n['concept_approval'] thể hiện mức độ hài lòng của §H$concept_faction$§! với hiện trạng quốc gia, ảnh hưởng trực tiếp đến £happiness£['concept_happiness'] của các §H$concept_pops$§! thuộc phe phái đó.\n\n§H$concept_approval$§! và ['concept_support'] càng cao, §H$concept_faction$§! đó sẽ tạo ra càng nhiều £unity£['concept_unity']."
 #Singular: ['concept_approval'] or §H$concept_approval$§!
 #Plural: -
 concept_approval: "Mức độ tán thành"
 concept_approval_desc: "§H$concept_approval$§! của ['concept_faction'] thể hiện sự hài lòng với thực trạng hiện tại, đồng thời có thể tác động lên £happiness£['concept_happiness'] và £pop£['concept_pops'] của phe phái đó.\n\n§H$concept_approval$§! và ['concept_support'] của phe phái càng cao, lượng £unity£['concept_unity'] thu được từ phe phái đó càng nhiều."
 #Singular: ['concept_support'] or §H$concept_support$§!
 #Plural: -
 concept_support: "Tỷ lệ ủng hộ"
 concept_support_desc: "§H$concept_support$§! biểu thị sức mạnh chính trị của một ['concept_faction']. §H$concept_support$§! sẽ tăng lên theo tổng số £pop£['concept_pops'] trong §H$concept_faction$§!.\n\nNhững §H$concept_pops$§! có §HQuyền Công dân Toàn diện§! sẽ đóng góp tỷ lệ ủng hộ cao hơn so với những người không có đặc quyền này."
 #Singular: ['concept_endgame_crisis'] or §H$concept_endgame_crisis$§!
 #Plural: ['concept_endgame_crises'] or §H$concept_endgame_crises$§!
 concept_endgame_crisis: "Khủng hoảng Hậu kỳ"
 concept_endgame_crises: "Khủng hoảng Hậu kỳ"
 concept_endgame_crisis_desc: "Khi một ván game Stellaris bước vào giai đoạn cuối, khủng hoảng dải ngân hà sẽ xuất hiện. Những cuộc Khủng hoảng Hậu kỳ này có thể là thử thách vô cùng khắc nghiệt ngay cả với các game thủ lão luyện.\n\nKhủng hoảng Hậu kỳ thường chỉ xảy ra khi đã đạt đến §INăm Cuối Game§!."
 #Singular: ['concept_fallen_empire'] or §H$concept_fallen_empire$§!
 #Plural: ['concept_fallen_empires'] or §H$concept_fallen_empires$§!
 concept_fallen_empire: "Đế chế Sa sút"
 concept_fallen_empires: "Đế chế Sa sút"
 concept_fallen_empires_desc: "Đế chế Sa sút là một nền văn minh tiền bối cổ đại, có sẵn công nghệ tiên tiến và hạm đội hùng hậu ngay từ đầu game, nhưng thường chọn cách sống khép kín. Đôi khi họ sẽ đưa ra yêu sách hoặc giao phó nhiệm vụ cho các đế chế yếu hơn.\n\nChọc giận một Đế chế Sa sút là cực kỳ rủi ro, trừ khi bạn nắm chắc phần thắng trước một kẻ thù đáng gờm như vậy."
 #Singular: ['concept_awakened_empire'] or §H$concept_awakened_empire$§!
 #Plural: ['concept_awakened_empires'] or §H$concept_awakened_empires$§!
 concept_fallen_empire_awakening: "Đế chế Sa sút Thức tỉnh"
 concept_awaken: "Thức tỉnh"
 concept_awakened_empire: "$COUNTRY_AWAKENED_FALLEN_EMPIRE$"
 concept_awakened_empires: "Đế chế Thức tỉnh"
 concept_awakened_empires_desc: "$COUNTRY_AWAKENED_FALLEN_EMPIRE_DESC$"
 #Singular: £food£ ['concept_food'] or £food£ §H$concept_food$§!
 #Plural: -
 concept_food: "Thức ăn"
 concept_food_desc: "[GetConceptFood]"
 concept_food_desc_end: "$tt_gain$§Y—§!Xây dựng £district£['concept_farming_districts'].\n—$tt_market$"
 concept_food_desc_regular: "£food£§H$concept_food$§! đại diện cho các dưỡng chất cần thiết để duy trì sự sống và phát triển £pop£['concept_pops'].$concept_food_desc_end$"
 concept_food_desc_machine: "$tt_some_need_machine$\n\n£food£§H$food$§! tượng trưng cho nguồn dinh dưỡng sinh học mà các sinh vật hữu cơ cần để duy trì cơ thể yếu ớt của chúng.\n\n§H$civic_machine_assimilator_plural$§! sẽ sản xuất £food£§H$concept_food$§! cho £pop£§HDân số Cơ thể máy§!, còn §H$civic_machine_servitor_plural$§! sẽ chu cấp cho £pop£§HDân số $citizenship_organic_trophy$§! của họ.$concept_food_desc_end$"
 concept_food_desc_infernal: "$tt_some_need_infernal$\n\n£food£§H$food$§! đại diện cho nguồn dinh dưỡng sinh học cần thiết cho £pop£['concept_pops'] sinh vật ngoại lai hữu cơ, nhằm duy trì sinh thể yếu ớt của chúng.$concept_food_desc_end$"
 concept_flexible_traditions: "Truyền thống Linh hoạt"
 concept_flexible_tradition: "Truyền thống Linh hoạt"
 concept_flexible_traditions_desc: "Truyền thống Linh hoạt là một dạng ['concept_traditions'] được quyết định bởi các lựa chọn trong quá trình chơi."
 #Singular: ['concept_gateway'] or §H$concept_gateway$§!
 #Plural: ['concept_gateways'] or §H$concept_gateways$§!
 concept_gateway: "Cổng Không gian"
 concept_gateways: "Cổng Không gian"
 concept_gateways_desc: "Cổng Không gian là một cấu trúc khổng lồ có khả năng tạo ra đường hầm không gian đa chiều, cho phép dịch chuyển gần như tức thời giữa tất cả các điểm trong mạng lưới Cổng Không gian đang kích hoạt."
 #Singular: ['concept_great_khan'] or §H$concept_great_khan$§!
 #Plural: -
 concept_great_khan: "Đại Hãn"
 concept_great_khan_desc: "Đại Hãn xuất hiện thông qua chuỗi sự kiện Giữa Game, khi các bộ lạc tản mác của một ['concept_marauder_empires', $concept_marauder_empire$] bất ngờ được thống nhất dưới tay một vị thủ lĩnh kiệt xuất. Họ sẽ thành lập Hãn quốc Đột kích, bắt đầu đi chinh phạt các đế chế khác và thu phục họ làm chư hầu.$requires_apoc$"
 #Singular: ['concept_grand_admiral'] or §H$concept_grand_admiral$§!
 #Plural: -
 concept_grand_admiral: "$DIFFICULTY_GRAND_ADMIRAL$"
 concept_grand_admiral_desc: "$DIFFICULTY_GRAND_ADMIRAL_DESC$"
 #Singular: ['concept_guaranteed_colonies'] or §H$concept_guaranteed_colonies$§!
 #Plural: -
 concept_guaranteed_colonies: "$FE_GUARANTEED_COLONIES$"
 concept_guaranteed_colonies_desc: "Tùy chọn này quy định có bao nhiêu hành tinh phù hợp sinh sống với cùng loại địa hình như Hành tinh mẹ sẽ được sinh ra ở gần hệ sao xuất phát. Tắt mục này có thể khiến bạn hoàn toàn không tìm thấy một hành tinh nào có thể định cư ở khu vực xung quanh."
 #Singular: ['concept_hyperlane'] or §H$concept_hyperlane$§!
 #Plural: ['concept_hyperlanes'] or §H$concept_hyperlanes$§!
 concept_hyperlane: "Tuyến Siêu không gian"
 concept_hyperlanes: "Tuyến Siêu không gian"
 concept_hyperlanes_desc: "§H$concept_hyperlanes$§! là một đường hầm siêu không gian hình thành tự nhiên giữa các giếng trọng lực của các ngôi sao. Việc sử dụng Động cơ Siêu không gian để di chuyển trên §H$concept_hyperlanes$§! là phương tiện du hành liên sao chính."
 #Singular: £job£ ['concept_job'] or §H$concept_job$§!
 #Plural: £job£ ['concept_jobs'] or §H$concept_jobs$§!
 concept_job: "Công việc"
 concept_jobs: "Công việc"
 concept_job_desc: "£job£§H$concept_jobs$§! đại diện cho chức năng và chuyên môn mà £pop£['concept_pops'] đảm nhiệm trong đế chế, quyết định đến việc sản xuất tài nguyên, sản lượng nghiên cứu và các chức năng xã hội.\n\nCông việc được tạo ra từ £district£['concept_districts'], £zone£['concept_district_specializations'], £building£['concept_buildings'] và các đặc điểm hành tinh khác; sự đa dạng về công việc giúp đáp ứng các nhu cầu khác nhau về kinh tế, nghiên cứu hay quân sự.\n\nViệc phân bổ §H$concept_jobs$§! ảnh hưởng trực tiếp đến độ ổn định kinh tế, định hướng chính trị và hiệu quả tổng thể của đế chế.\n\nCó thể quản lý §H$concept_jobs$§! trong £interface£['concept_colony_view']."
 #Singular: £job£ ['concept_job'] or §H$concept_job$§!
 #-
 concept_unemployment: "Thất nghiệp"
 concept_unemployment_desc: "£pop£ §HDân số thất nghiệp§! là những người không có £job£ ['concept_job'] để làm. Họ không những không tạo ra tài nguyên mà còn làm giảm £stability£ ['concept_stability'] của £colony£ ['concept_colony'] này."
 #Singular: ['concept_l_gate'] or §H$concept_l_gate$§!
 #Plural: ['concept_l_gates'] or §H$concept_l_gates$§!
 concept_l_gate: "Cổng L"
 concept_l_gates: "Cổng L"
 concept_l_gates_desc: "Một cánh cổng không gian bí ẩn kết nối với một mạng lưới không gian đa chiều biệt lập. Dường như chúng đã bị ai đó cố tình phong ấn."
 #Singular: ['concept_machine_uprising'] or §H$concept_machine_uprising$§!
 #Plural: -
 concept_machine_uprising: "Nổi loạn Máy móc"
 concept_machine_uprising_desc: "Nổi loạn Máy móc là một chuỗi sự kiện Giữa Game, khi những nô bộc người máy sở hữu trí tuệ nhân tạo có thể tìm cách nổi dậy chống lại đế chế đã tạo ra chúng. Kết cục có thể dẫn đến một thế lực ['authority:auth_machine_intelligence'] hoàn toàn mới bước lên sân khấu ngân hà.$requires_syn_dawn$"
 #Singular: ['concept_marauder_empire'] or §H$concept_marauder_empire$§!
 #Plural: ['concept_marauder_empires'] or §H$concept_marauder_empires$§!
 concept_marauder_empire: "Đế chế Đột kích"
 concept_marauder_empires: "Đế chế Đột kích"
 concept_marauder_empires_desc: "Đế chế Đột kích là một dạng văn minh sống du mục ngoài không gian, họ dành phần lớn thời gian để tàn sát lẫn nhau hoặc cướp bóc các quốc gia láng giềng. Đôi khi họ sẽ đòi các nước khác phải nộp cống phẩm."
 #Singular: £market£ ['concept_market'] or £market£ §H$concept_market$§!
 #Plural: -
 concept_market: "$MARKET_VIEW$"
 concept_market_desc: "§H$concept_market$§! là nơi các đế chế tiến hành mua bán tài nguyên, giúp điều tiết nền kinh tế, giải quyết tình thế cấp bách hoặc thực hiện các chiến lược dài hạn. Giao dịch có thể được thiết lập dưới dạng thanh toán một lần hoặc chi trả £trade_value£['concept_trade'] hàng tháng nhằm duy trì nguồn cung ổn định cho các vật tư thiết yếu.\n\nGiá cả hàng hóa sẽ biến động dựa trên cán cân cung cầu của toàn ngân hà, việc giao dịch với tần suất cao sẽ tác động lên lãi suất thị trường. Những đế chế sở hữu truyền thống ['tradition_category:tradition_mercantile'] hoặc cơ cấu quyền lực Doanh nghiệp có thể thu thêm nhiều lợi nhuận khi tham gia thương mại."
 #Singular: £megastructure£ ['concept_megastructure'] or £megastructure£ §H$concept_megastructure$§!
 #Plural: £megastructure£ ['concept_megastructures'] or £megastructure£ §H$concept_megastructures$§!
 concept_megastructure: "$MEGASTRUCTURE$"
 concept_megastructures: "$megastructures$"
 concept_megastructure_desc: "£megastructure£§H$concept_megastructures$§! là những công trình siêu vĩ mô minh chứng cho tiềm lực kinh tế và trình độ kỹ thuật của một đế chế hoàn thiện. Các đại dự án này thường được thi công qua nhiều giai đoạn, phục vụ cho những toan tính chiến lược, khoa học hoặc kinh tế nhất định.\n\nViệc xây cất một §H$concept_megastructure$§! đòi hỏi chi phí đầu tư khổng lồ, kỹ thuật tiên tiến và một hệ thống hậu cần vững mạnh. Chúng thường được £construction_ship£['concept_construction_ship'] thi công tại những tọa độ đã được ấn định ngoài không gian.\n\nMột khi những siêu kiến trúc uy nghi này được khánh thành, chúng sẽ vĩnh viễn định hình lại cục diện ngân hà, trở thành những đài kỷ niệm bất diệt cho tham vọng chinh phục vũ trụ bao la."
 #Singular: -
 #Plural: £minerals£ ['concept_minerals'] or £minerals£ §H$concept_minerals$§!
 concept_minerals: "Khoáng vật"
 concept_minerals_desc: "[GetConceptMinerals]"
 concept_minerals_desc_start: "£minerals£§HKhoáng vật§! là tên gọi chung cho mọi loại tài nguyên cơ bản dùng trong xây dựng.\n\nChúng thường được dùng để kiến thiết các £building£['concept_buildings'] trên hành tinh và £mining_station£ £science_ship£['concept_civilian_space_stations'] dân sự, bên cạnh đó, khoáng vật còn có thể được tinh luyện thành £alloys£['concept_alloys']."
 concept_minerals_desc_end: "$tt_gain$—Xây dựng £district£['concept_mining_districts'].\n—Xây dựng £mining_station£['concept_mining_stations'] quanh các ['concept_celestial_objects'] có trữ lượng khoáng vật.\n—$tt_market$"
 concept_minerals_desc_regular: "$concept_minerals_desc_start$ hoặc £consumer_goods£['concept_consumer_goods'].$concept_minerals_desc_end$"
 concept_minerals_desc_hive: "$concept_minerals_desc_start$.$concept_minerals_desc_end$"
 #Singular: £mining_station£ ['concept_mining_station'] or £mining_station£ §H$concept_mining_station$§!
 #Plural: £mining_station£ ['concept_mining_stations'] or £mining_station£ §H$concept_mining_stations$§!
 concept_mining_station: "$mining_station$"
 concept_mining_stations: "$mining_station_plural$"
 concept_mining_station_desc: "£mining_station£§H$concept_mining_station$§! là một cơ sở quỹ đạo, có chức năng khai thác các tài nguyên giá trị cao từ thiên thể, ví dụ như £energy£['concept_energy'], £minerals£['concept_minerals'] hoặc £alloys£['concept_alloys'] v.v...$tt_gain$—Điều động £construction_ship£['concept_construction_ships'] xây dựng §H$concept_mining_stations$§! quanh các ['concept_celestial_objects'] chứa dồi dào tài nguyên!"
 #Reusable snippets
 tt_build_research_stations: "Điều động £construction_ship£['concept_construction_ships'] thiết lập £science_ship£['concept_research_stations'] quanh các ['concept_celestial_objects'] có chứa Điểm nghiên cứu"
 tt_research_gain: "$tt_gain$—Tạo ra từ các £job£['concept_jobs'] cung cấp bởi £building£['building:building_research_lab_1'] chẳng hạn.\n—$tt_build_research_stations$"
 concept_research_shared: "\n\n§HĐiểm nghiên cứu dự trữ§! được tạo ra qua các sự kiện hoặc khi không có bất kỳ mục tiêu nghiên cứu nào được chọn. Mỗi tháng, một lượng §HĐiểm nghiên cứu dự trữ§! ngang bằng với mức §HSản lượng hàng tháng§! sẽ tự động bị tiêu hao để đẩy nhanh tiến độ khoa học.$tt_research_gain$"
 #Singular: £physics£ ['concept_physics_research'] or £physics£ §H$concept_physics_research$§!
 #Plural: -
 concept_physics_research: "Nghiên cứu Vật lý"
 concept_physics_research_desc: "£physics£§H$concept_physics_research$§! là một trong ba lĩnh vực nghiên cứu chính, bao trùm §HCông nghệ Máy tính§!, §HThao túng Trường lực§! và §HVật lý Hạt§! cùng nhiều mảng khác.$concept_research_shared$"
 #Singular: £society£ ['concept_society_research'] or £society£ §H$concept_society_research$§!
 #Plural: -
 concept_society_research: "Nghiên cứu Xã hội học"
 concept_society_research_desc: "£society£§H$concept_society_research$§! là một trong ba lĩnh vực nghiên cứu chính, bao trùm §HSinh học§!, §HThuật trị quốc§! và §HLý thuyết Tân thế giới§! cùng nhiều mảng khác,$concept_research_shared$"
 #Singular: £engineering£ ['concept_engineering_research'] or £engineering£ §H$concept_engineering_research$§!
 #Plural: -
 concept_engineering_research: "Nghiên cứu Kỹ thuật"
 concept_engineering_research_desc: "£engineering£§H$concept_engineering_research$§! là một trong ba lĩnh vực nghiên cứu chính, bao trùm §HCông nghiệp§!, §HCơ học Lực đẩy§! và §HKỹ thuật Hàng không Vũ trụ§! cùng nhiều mảng khác,$concept_research_shared$"
 #Singular: ['concept_policy'] or §H$concept_policy$§!
 #Plural: ['concept_policies'] or §H$concept_policies$§!
 concept_policies: "Chính sách"
 concept_policy: "Chính sách"
 concept_policies_desc: "§H$concept_policies$§! phác họa thái độ của một ['concept_empire'] đối với các đế chế khác và đối với £pop£['concept_pops'] của mình, cũng như các hành vi được cho phép.\n\nCó thể quản lý §H$concept_policies$§! trong thẻ §H$government_view_tab_policies_and_edicts$§! của £interface£['concept_government_view']."
 #Singular: £pop£ ['concept_pop'] or £pop£ §H$concept_pop$§!
 #Plural: £pop£ ['concept_pops'] or £pop£ §H$concept_pops$§!
 concept_pop: "Dân số"
 concept_pops: "Dân số"
 concept_pop_desc: "£pop£§H$concept_pop$§! là một quần thể các cá thể thuộc cùng một ['concept_species'], họ đảm nhận chung một £job£['concept_job'] và cùng chia sẻ một ['concept_ethic'].$tt_gain$—Tăng trưởng £pop£§HDân số§!, chế tạo £pop£§HDân số Người máy§!\n—Mua §H$concept_pops$§! trên £market£§HChợ Nô lệ§!\n—Thu thập §H$concept_pops$§! từ các sự kiện đặc thù"
 #Singular: -
 #Plural: ['concept_preftl_civilizations'] or §H$concept_preftl_civilizations$§!
 concept_preftl_civilizations: "Văn minh Tiền Siêu quang tốc"
 concept_preftl_civilizations_desc: "Văn minh Tiền Siêu quang tốc là những xã hội chưa nắm vững kỹ năng du hành vượt tốc độ ánh sáng. Trình độ khoa học kỹ thuật của họ trải dài từ Thời kỳ Đồ đá cho đến Kỷ nguyên Không gian sơ khai, và phần lớn đều hoàn toàn mù tịt về sự tồn tại của sự sống ngoài hành tinh."
 #Singular: ['concept_presapient_species'] or §H$concept_concept_presapient_speciespolicies$§!
 #Plural: ['concept_presapient_species'] or §H$concept_concept_presapient_speciespolicies$§!
 concept_presapient_species: "Loài Chưa khai trí"
 concept_presapient_species_desc: "Loài Chưa khai trí là những sinh vật cực kỳ khôn ngoan, chỉ còn cách sự thông tuệ một bước chân ngắn ngủi. Có thể sử dụng các công nghệ thuộc lĩnh vực ['concept_society_research', £society£$concept_society_research$] phù hợp để nâng tầm chúng thành sinh vật có tri giác, hoặc giữ chúng trong ['concept_alien_zoo', £building£Sở thú Ngoại lai]."
 #Singular: ['concept_galaxy_shape'] or §H$concept_galaxy_shape$§!
 #Plural: -
 concept_shape: "Hình dạng"
 concept_galaxy_shape: "Hình dạng Ngân hà"
 concept_galaxy_shape_desc: "—§I$elliptical$:§! Một thiên hà tròn đơn giản với các ngôi sao được phân bố đồng đều.\n—§I$ring$:§! Một thiên hà dạng vành khuyên với vùng trung tâm tương đối trống trải.\n—§I$spiral$:§! Những thiên hà này có từ hai đến sáu nhánh xoắn ốc uốn lượn vươn ra từ trung tâm.\n—§I$bar$:§! Thiên hà này chia thành hai nhánh lớn, đứt đoạn và ít có sự liên kết với nhau.\n—§I$starburst$:§! Vô số các nhánh song song tỏa ra từ tâm điểm của thiên hà.\n—§I$cartwheel$:§! Một thiên hà phức hợp vòng cung, cuộn xoắn từ nhiều nhánh nhỏ li ti.\n—§I$spoked$:§! Một thiên hà được cấu thành từ vô số các \"mảnh vỡ\" cô lập với nhau."
 #Singular: ['concept_ship'] or §H$concept_ship$§!
 #Plural: ['concept_ships'] or §H$concept_ships$§!
 concept_ship: "Phi thuyền"
 concept_ships: "Phi thuyền"
 concept_ship_desc: "§H$concept_ships$§! là các phương tiện du hành vũ trụ đủ mọi chủng loại, đáp ứng nhiều mục đích khác nhau từ khám phá thám hiểm cho đến giao tranh chiến đấu, bao gồm ['concept_civilian_ships'] và ['concept_military_ships']."
 #Singular: ['concept_civilian_ship'] or §H$concept_civilian_ship$§!
 #Plural: ['concept_civilian_ships'] or §H$concept_civilian_ships$§!
 concept_civilian_ship: "Phi thuyền Dân sự"
 concept_civilian_ships: "Phi thuyền Dân sự"
 concept_civilian_ship_desc: "§H$concept_civilian_ships$§! được đóng tại ['concept_starbases'], đảm nhiệm vai trò thi công các công trình không gian, thám hiểm miền chưa biết hay di cư đến hành tinh mới.\n\nVí dụ như £construction_ship£['concept_construction_ships'], £science_ship£['concept_science_ships'] hoặc £colony_ship£['concept_colony_ships']."
 #Singular: ['concept_military_ship'] or §H$concept_military_ship$§!
 #Plural: ['concept_military_ships'] or §H$concept_military_ships$§!
 concept_military_ship: "Phi thuyền Quân sự"
 concept_military_ships: "Phi thuyền Quân sự"
 concept_military_ship_desc: "§H$concept_military_ships$§! được đóng tại ['concept_starbases'], chuyên dùng cho các cuộc không chiến chống lại những ['concept_empires'] thù địch hoặc ['concept_space_fauna'] hung hãn.\n\nCó thể biên chế thành ['concept_fleets'], với đa dạng kích cỡ, mang trong mình những ưu thế riêng biệt và đem lại nhiều giá trị chiến thuật khác nhau trong §H$concept_fleet$§!.\n\n§H$concept_military_ships$§! có thể được thiết kế trong thẻ §H$SHIP_DESIGNER$§! của £interface£['concept_fleet_management_view']."
 #Singular: ['concept_fleet'] or §H$concept_fleet$§!
 #Plural: ['concept_fleets'] or §H$concept_fleets$§!
 concept_fleet: "Hạm đội"
 concept_fleets: "Hạm đội"
 concept_fleet_desc: "§H$concept_fleets$§! là một nhóm các ['concept_military_ships'] phối hợp tác chiến chặt chẽ, tổng kích thước của tất cả §H$concept_ships$§! gộp lại tạo thành ['concept_fleet_size'].\n\nĐược thống lĩnh bởi £commander£['concept_commander'], một §H$concept_fleet$§! có thể nhận được bùa lợi hoặc chịu phạt từ ['concept_leader_traits'].\n\n§H$concept_fleets$§! được tổ chức và sắp xếp trong thẻ §H$FLEET_MANAGER_VIEW$§! của £interface£['concept_fleet_management_view']."
 #Singular: ['concept_fleet_size'] or §H$concept_fleet_size$§!
 #Plural: -
 concept_fleet_size: "Quy mô Hạm đội"
 concept_fleet_size_desc: "§H$concept_fleet_size$§! là tổng kích cỡ của toàn bộ ['concept_military_ship'] trong một ['concept_fleet'].\n\nTổng §H$concept_fleet_size$§! mà mỗi §H$concept_fleet$§! có thể chỉ huy phụ thuộc vào ['concept_command_limit'].\n\nTổng §H$concept_fleet_size$§! của các §H$concept_fleets$§! mà một ['concept_empire'] đủ khả năng đài thọ hiệu quả lại bị giới hạn bởi ['concept_naval_capacity'] của quốc gia đó."
 #Singular: ['concept_command_limit'] or §H$concept_command_limit$§!
 #Plural: -
 concept_command_limit: "Giới hạn Chỉ huy"
 concept_command_limit_desc: "§H$concept_command_limit$§! quy định tổng kích cỡ tối đa của các ['concept_military_ship'] mà một ['concept_fleet'] đơn lẻ có thể chỉ huy.\n\n§H$concept_command_limit$§! có thể được cơi nới thông qua ['concept_technologies'], một số ['concept_traditions'] hoặc ['concept_civics'] nhất định."
 #Singular: ['concept_ship_upkeep'] or §H$concept_ship_upkeep$§!
 #Singular: ['concept_logistics_upkeep'] or §H$concept_logistics_upkeep$§!
 #Plural: -
 concept_ship_upkeep: "Phí bảo trì Phi thuyền"
 concept_logistics_upkeep: "Phí bảo trì Hậu cần"
 concept_ship_upkeep_desc: "§H$concept_ship_upkeep$§! đại diện cho các khoản chi phí tài nguyên không ngừng nghỉ nhằm duy trì hoạt động của mọi loại phi thuyền dân sự lẫn quân sự.\n\nPhần lớn phi thuyền đòi hỏi nhiều hơn một loại tài nguyên để bảo trì, chi phí cụ thể phụ thuộc vào lớp phi thuyền cũng như hệ thống linh kiện được lắp đặt trên đó. Nếu vượt quá ['concept_naval_capacity'] của đế chế, phí bảo trì cho mọi con tàu sẽ tăng vọt lên một cách khủng khiếp."
 #Singular: ['concept_colony_upkeep'] or §H$concept_colony_upkeep$§!
 #Plural: -
 concept_colony_upkeep: "Phí bảo trì Thuộc địa"
 concept_colony_upkeep_desc: "§H$concept_colony_upkeep$§! đại diện cho lượng tài nguyên phải tiêu hao liên tục để duy trì hạ tầng và nuôi sống dân cư tại một £colony£['concept_colony']. Trong đó bao gồm phí duy tu £district£['concept_districts'], £building£['concept_buildings'] và £job£['concept_jobs'], tất nhiên không thể thiếu nhu yếu phẩm hàng ngày cho dân cư trên thuộc địa. Kiểm soát tốt chi phí bảo trì là yếu tố sống còn để đảm bảo sự ổn định, ngăn ngừa rủi ro khan hiếm tài nguyên và giữ cho nền kinh tế quốc gia vận hành trơn tru. Có thể xem xét chi tiết phí bảo trì thuộc địa tại thẻ $colony_view_tab_planet_summary$ của £interface£['concept_colony_view']."
 #Singular: ['concept_species'] or §H$concept_species$§!
 #Plural: ['concept_species'] or §H$concept_species$§!
 concept_species: "Giống loài"
 concept_species_desc: "§H$concept_species$§! là một nhóm các cá thể hữu cơ hoặc máy móc với bản sắc rõ ràng, chia sẻ chung những đặc điểm ['concept_species_traits'], chung một cội nguồn và khả năng thích nghi sinh học.\n\nCác ['concept_technologies'] tối tân hay một vài ['concept_policies'] đặc biệt có thể cho phép đế chế chỉnh sửa bộ gen của một giống loài để đáp ứng các nhu cầu chuyên biệt hóa khắt khe hơn, hay thậm chí là lột xác chúng hoàn toàn. Có thể quản lý các giống loài của quốc gia trong £interface£['concept_species_view']."
 #Singular: ['concept_species_class'] or §H$concept_species_class$§!
 #Plural: -
 concept_species_class: "Nhóm Giống loài"
 concept_species_class_desc: "Nhóm Giống loài vẽ nên bức tranh tổng thể để phân loại các loại §IGiống loài§!. Có thể lấy ví dụ như họ Chim, họ Bò sát hay họ Nấm v.v..."
 #Singular: ['concept_species_trait'] or §H$concept_species_trait$§!
 #Plural: ['concept_species_traits'] or §H$concept_species_traits$§!
 concept_species_trait: "Đặc tính Giống loài"
 concept_species_traits: "Đặc tính Giống loài"
 concept_species_trait_desc: "§H$concept_species_traits$§! quyết định các thuộc tính sinh học hay cơ khí vốn có của một ['concept_species'], tác động mạnh mẽ đến hành vi, năng lực cốt lõi cũng như khả năng thích ứng của chúng với môi trường sống và các nhiệm vụ được giao phó.\n\nCó thể điều chỉnh các đặc tính này thông qua liệu pháp can thiệp di truyền hoặc ứng dụng các ['concept_technologies'] tiên tiến khác."
 #Singular 1: ['concept_starbase'] or §H$concept_starbase$§!
 #Plural 1: ['concept_starbases'] or §H$concept_starbases$§!
 #Singular 2: ['concept_military_space_station'] or §H$concept_military_space_station$§!
 #Plural 2: ['concept_military_space_stations'] or §H$concept_military_space_stations$§!
 concept_starbase: "$station_generic_01$"
 concept_starbases: "$station_generic_01_plural$"
 concept_military_space_station: "Trạm Không gian Quân sự"
 concept_military_space_stations: "Trạm Không gian Quân sự"
 concept_starbase_desc: "§H$concept_starbases$§! là các cứ điểm quân sự có khả năng nâng cấp, được dựng lên nhằm khẳng định và bảo vệ chủ quyền của một hệ sao.\n\nĐược nâng cấp từ ['concept_outposts'], căn cứ này có thể lắp đặt muôn vàn loại §HMô-đun§! và §HCông trình§! để chuyên môn hóa theo nhiều định hướng khác nhau, đơn cử như dùng mô-đun ['concept_shipyard'] để sản xuất ['concept_ships'].\n\nCó thể xây thêm ['concept_defense_platforms'] để củng cố sức chống chịu trước các đợt tấn công. Nơi đây đồng thời đóng vai trò làm trung tâm tuyển mộ lực lượng ['concept_armies'].\n\nSố lượng §H$concept_starbases$§! mà một đế chế được phép nâng cấp sẽ bị khống chế bởi ['concept_starbase_capacity'] của quốc gia đó.\n\nCó thể quản lý §H$concept_starbases$§! tại £interface£['concept_starbase_view']."
 #Singular: ['concept_technology'] or §H$concept_technology$§!
 #Plural: ['concept_technologies'] or §H$concept_technologies$§!
 concept_technology: "Công nghệ"
 concept_technologies: "Công nghệ"
 concept_technology_desc: "Mở khóa công nghệ thông qua việc dày công nghiên cứu là một trong những phương thức tối thượng để nâng tầm vị thế cho đế chế.\n\nChúng được chia nhỏ làm ba mảng nghiên cứu chính yếu:\n$t$£physics£['concept_physics_research']\n$t$£society£['concept_society_research']\n$t$£engineering£['concept_engineering_research']"
 #Singular: ['concept_tradition'] or §H$concept_tradition$§!
 #Plural: ['concept_traditions'] or §H$concept_traditions$§!
 concept_tradition: "Truyền thống"
 concept_traditions: "Truyền thống"
 concept_traditions_desc: "§H$concept_traditions$§! có thể cung cấp các bùa lợi lan tỏa trên phạm vi toàn đế chế, chúng được hệ thống hóa thành vô vàn §HCây Truyền thống§!.\n\nMột khi ['concept_empire'] đã tích lũy đủ lượng £unity£['concept_unity'], họ có quyền mở khóa một §H$concept_tradition$§! hoàn toàn mới. Hoàn thiện một §HCây Truyền thống§! sẽ giúp khai mở các ['concept_ascension_perks'] huyền bí.\n\nCó thể quản lý §H$concept_traditions$§! trong thẻ §H$traditions$§! của £interface£['concept_society_management_view']."
 #Singular: ['concept_vivarium'] or §H$concept_vivarium$§!
 #Plural: -
 concept_vivarium: "$vivarium$"
 concept_vivarium_desc: "§Y$vivarium$§! tạo điều kiện để ta quan sát các bầy §YThú không gian§! bắt được. Các sinh vật bị giam cầm có thể đem đi giải phẫu nghiên cứu nhằm khai thác tài nguyên, hay được nuôi ghép giống để sản sinh ra vô vàn cá thể mới."
 #Singular: ['concept_war_in_heaven'] or §H$concept_war_in_heaven$§!
 #Plural: -
 concept_war_in_heaven: "Chiến tranh Thiên đàng"
 concept_war_in_heaven_desc: "Hai ['concept_fallen_empires'] vốn là kẻ thù truyền kiếp tự xa xưa có khả năng cùng ['concept_awaken'], và dấy lên một cuộc đại chiến tranh giành bá quyền trên sân khấu ngân hà.$requires_leviathans$"
 #Singular: ['concept_wormhole'] or §H$concept_wormhole$§!
 #Plural: ['concept_wormholes'] or §H$concept_wormholes$§!
 concept_wormhole_pairs: "Cặp Lỗ sâu"
 concept_wormhole: "Lỗ sâu"
 concept_wormholes: "Lỗ sâu"
 concept_wormholes_desc: "Lỗ sâu là những vết rách không-thời gian hình thành trong tự nhiên. Lỗ sâu khi được ổn định hóa có thể tạo thành lối đi thông với một địa điểm cố định khác."
 #Singular: ['concept_xeno_compatibility'] or §H$concept_xeno_compatibility$§!
 #Plural: -
 concept_xeno_compatibility: "$ap_xeno_compatibility$"
 concept_xeno_compatibility_desc: "$allow_crossbreeding$\n\n§L$ap_xeno_compatibility_desc$§!"
 #Singular: -
 #Plural: ['concept_cutholoids'] or §H$concept_cutholoids$§!
 concept_cutholoids: "$cutholoids_plural$"
 concept_cutholoids_desc: "$cutholoid_desc$"
 #Singular: -
 #Plural: ['concept_voidworms'] or §H$concept_voidworms$§!
 concept_voidworms: "$voidworms_plural$"
 concept_voidworms_desc: "$voidworm_desc$"
 #Singular: £influence£ ['concept_influence'] or £influence£ §H$concept_influence$§!
 #Plural: -
 concept_influence: "Ảnh hưởng"
 concept_influence_desc: "[GetConceptInfluence]"
 concept_influence_desc_shared: "Nó có thể dùng trong các sách lược, đơn cử như thi công ['concept_outposts'], tạo ['concept_claims'], hay duy trì các ['concept_diplomatic_pacts']. Tốc độ thu thập §H$concept_influence$§! về cơ bản là rất khó thay đổi, nhưng vẫn có cách để làm được điều đó.$tt_gain$—Tuyên bố các đế chế khác là ['concept_rivals'].\n—Bằng cách khuếch trương ['concept_navy_size'] vượt lên trên £empire_sprawl£['concept_empire_size'] nhằm nâng cao vị thế ['concept_power_projection']."
 concept_influence_desc_regular: "£influence£§H$concept_influence$§! đại diện cho sức ảnh hưởng về mặt chính trị.\n\n$concept_influence_desc_shared$"
 concept_influence_desc_hive: "£influence£§H$concept_influence$§! đại diện cho uy quyền bao trùm của một ['authority:auth_hive_mind'] đối với ngân hà.\n\n$concept_influence_desc_shared$"
 concept_influence_desc_machine: "£influence£§H$concept_influence$§! đại diện cho sức mạnh phân bổ tài nguyên thuật toán của một ['authority:auth_machine_intelligence'] trung tâm, dùng để hoạch định âm mưu kiểm soát trực tiếp đối với ngân hà.\n\n$concept_influence_desc_shared$"
 #Singular: ['concept_outpost'] or §H$concept_outpost$§!
 #Plural: ['concept_outposts'] or §H$concept_outposts$§!
 concept_outpost: "$starbase_outpost$"
 concept_outposts: "$starbase_outpost_plural$"
 concept_outpost_desc: "§H$concept_outposts$§! là những ['concept_starbases'] cỡ nhỏ, được lập ra để bành trướng biên giới của ['concept_empire'] tới tận các £system£['concept_systems'] vô chủ.\n\nSố lượng §H$concept_outposts$§! sẽ không bị giới hạn bởi ['concept_starbase_capacity'] của đế chế.\n\nTại £interface£['concept_starbase_view'], ta có thể tiến hành nâng cấp một §H$concept_outpost$§! trở thành một §H$concept_starbase$§! mang nhiều công năng vượt trội."
 #Singular: ['concept_claim'] or §H$concept_claim$§!
 #Plural: ['concept_claims'] or §H$concept_claims$§!
 concept_claim: "Tuyên bố chủ quyền"
 concept_claims: "Tuyên bố chủ quyền"
 concept_claim_desc: "§H$concept_claims$§! thể hiện tham vọng lãnh thổ đối với một hệ sao do nước ngoài cai quản. Các tuyên bố này đóng vai trò sống còn trong việc tạo cớ chính đáng cho các cuộc ['concept_wars'] chinh phạt, tạo tiền đề để đế chế hợp thức hóa việc thâu tóm các vùng tinh vực đang có tranh chấp một khi giành được thắng lợi.\n\nQuá trình tạo lập các yêu sách này sẽ bòn rút một lượng £influence£['concept_influence'], mức tiêu hao sẽ đội lên tỉ lệ thuận theo khoảng cách hệ sao, tầm quan trọng về mặt chiến lược, cũng như số lượng §H$concept_claims$§! sẵn có của những cường quốc khác. Do cái giá để tuyên bố chủ quyền trong thời kỳ chiến tranh xâm lược đắt đỏ hơn gấp bội, nên những đế chế sừng sỏ thường đi trước một bước.\n\nCó thể quản lý các tuyên bố chủ quyền tại £interface£['concept_claims_view']."
 #Singular: ['concept_research_agreement'] or §H$concept_research_agreement$§!
 #Plural: ['concept_research_agreements'] or §H$concept_research_agreements$§!
 concept_research_agreement: "Thỏa thuận Nghiên cứu"
 concept_research_agreements: "Thỏa thuận Nghiên cứu"
 concept_research_agreement_desc: "§H$concept_research_agreements$§! là một hiệp ước ngoại giao có khả năng cung cấp bùa lợi về £physics£ £society£ £engineering£['concept_research'] khi nghiên cứu những ['concept_technologies'] mà quốc gia đối tác đã nắm giữ, một đòn bẩy vô giá để rút ngắn lộ trình khoa học kỹ thuật.\n\n§H$concept_research_agreements$§! có thể được ký kết qua con đường ngoại giao, và thường được lồng ghép trong các cấu trúc liên minh hợp tác toàn diện hay các điều khoản của một ['concept_federation']. Lời đề nghị có thể được đệ trình thông qua thẻ $contacts_view_tab_contacts$ của £interface£['concept_contacts_view']."
 #Singular: ['concept_rival'] or §H$concept_rival$§!
 #Plural: ['concept_rivals'] or §H$concept_rivals$§!
 concept_rival: "Kẻ thù truyền kiếp"
 concept_rivals: "Kẻ thù truyền kiếp"
 concept_rival_desc: "§H$concept_rivals$§! là đối thủ chính trị và chiến lược đã được thiết lập chính thức. Tuyên bố ai đó là §H$concept_rival$§! sẽ giúp bơm mạnh sản lượng £influence£['concept_influence'] và hàn gắn lại rạn nứt ngoại giao với những thế lực chung chung mối thù. Tuy vậy, động thái này cũng sẽ đầu độc bầu không khí giao bang với chính kẻ thù ấy, đun nóng nồi áp suất căng thẳng và có nguy cơ châm ngòi cho một cuộc chiến tranh toàn diện.\n\nTa chỉ có quyền tuyên bố một quốc gia làm kẻ thù truyền kiếp khi tương quan lực lượng giữa đôi bên là cân sức. Đây là chiêu bài sắc bén để giữ vững ngôi vương, gầy dựng liên minh và mượn cớ hợp pháp hóa cho các động thái thù địch. Lời tuyên chiến có thể được dõng dạc ban bố tại thẻ $contacts_view_tab_contacts$ của £interface£['concept_contacts_view']."
 #Singular: ['concept_power_projection'] or §H$concept_power_projection$§!
 #Plural: -
 concept_power_projection: "Phô trương sức mạnh"
 concept_power_projection_desc: "§H$concept_power_projection$§! là cán cân đo lường sức mạnh quân đội ảnh hưởng thế nào đến sự vững bền của thế đứng chính trị. Nó là tấm gương phản chiếu quy mô và phí tổn bảo trì từ hệ thống ['concept_fleets'], đóng vai trò như thước đo trực quan cho trọng lượng chiến lược trên bàn cờ quyền lực của đế chế.\n\nDuy trì một lực lượng hạm đội đồ sộ, tiệm cận hay thậm chí là lấn át §H$concept_naval_capacity$§! của đế chế sẽ giúp gia tăng uy lực răn đe, từ đó bơm mạnh sản lượng £influence£['concept_influence']."
 #Singular: ['concept_navy_size'] or §H$concept_navy_size$§!
 #Plural: -
 concept_navy_size: "Quy mô Hạm đội"
 concept_navy_size_desc: "§H$concept_navy_size$§! đại diện cho tổng quy mô của tất cả các ['concept_military_ships'] nằm dưới trướng hạm đội đế chế. Mặc dù sức chứa hải quân không mang ranh giới tuyệt đối, nhưng nếu vượt mặt ['concept_naval_capacity'] của quốc gia sẽ dẫn đến sự leo thang chóng mặt của ['concept_ship_upkeep'].\n\nDuy trì một lực lượng hải quân vừa túi tiền là chiếc chìa khóa vàng để che chắn cõi bờ và phóng rọi sức mạnh uy hiếp đến mọi ngóc ngách của ngân hà."
 #Singular: £empire_sprawl£ ['concept_empire_size'] or £empire_sprawl£ §H$concept_empire_size$§!
 #Plural: -
 concept_empire_size: "Quy mô Đế chế"
 concept_empire_size_desc: "£empire_sprawl£§H$concept_empire_size$§! là thước đo phản ánh độ phình to của lãnh thổ quốc gia, biểu hiện cụ thể qua số lượng £district£['concept_districts'], £system£['concept_systems'], £colony£['concept_colonies'] và £pop£['concept_pops'] đang được kiểm soát.\n\nSự bành trướng quá mức của §H$concept_empire_size$§! sẽ kéo lê bộ máy hành chính, đồng thời đội giá cắt cổ cho các khoản chi phí của ['concept_technologies'], ['concept_traditions'] và ['concept_edicts'].\n\nNó cũng sẽ tạo sơ hở cho['concept_empire'] dễ trở thành miếng mồi ngon cho các chiến dịch tình báo thâm nhập."
 #Singular: £unity£ ['concept_unity'] or £unity£ §H$concept_unity$§!
 #Plural: -
 concept_unity: "Thống nhất"
 concept_unity_desc: "[GetConceptUnity]"
 concept_unity_desc_regular: "£unity£§H$concept_unity$§! soi chiếu ý chí sắt đá và sự vững vàng trong hệ tư tưởng của toàn xã hội. Nó là sự kết tinh của những mục tiêu chung đang nung nấu lòng dân, soi đường chỉ lối cho các đoàn thể xã hội cũng như bộ máy nhà nước.$concept_unity_desc_end$\n—Gia tăng ['concept_approval'] và ['concept_support'] của các ['concept_factions']\n—Hấp thụ truyền thống ['tradition_category:tradition_mercantile'] ['tradition:tr_mercantile_adaptive_economic_policies'] và điều chỉnh ['concept_policy', $policy_trade_policy$]"
 concept_unity_desc_hive: "£unity£§H$concept_unity$§! phản chiếu quyết tâm và đích đến duy nhất của ['authority:auth_hive_mind']. Nó là ngọn hải đăng quy tụ ý chí của cả bầy đàn, thao túng các nút mạng xa xôi và điều khiển đám tay sai.$concept_unity_desc_end$"
 concept_unity_desc_machine: "£unity£§H$concept_unity$§! phản chiếu quyết tâm và tính đồng nhất trong xử lý thuật toán của ['authority:auth_machine_intelligence']. Nó định hình các mục tiêu tính toán để dắt lối cho cỗ máy, phát mệnh lệnh cho những nút mạng xa xôi và phi cơ không người lái.$concept_unity_desc_end$"
 concept_unity_desc_end: "\n\nĐóng vai trò chủ chốt trong các công việc nội bộ, điển hình như mở khóa ['concept_traditions'] mới, chiêu mộ ['concept_leaders'], thăng hoa £colony£['concept_colonies'], phê chuẩn ['concept_edicts'] cũng như quản lý các đợt ['concept_resettlement'].$tt_gain$—Xây dựng các £building£['concept_buildings'] có khả năng cung cấp £job£['concept_jobs'] tạo ra §H$concept_unity$§!."
 #Singular: ['concept_leader'] or §H$concept_leader$§!
 #Plural: ['concept_leaders'] or §H$concept_leaders$§!
 concept_leader: "Lãnh đạo"
 concept_leaders: "Lãnh đạo"
 concept_leader_desc: "Các §H$concept_leaders$§! có thể được cử làm ['concept_governors'], hoặc được phó thác chỉ huy ['concept_fleets'], hay lĩnh xướng các dự án ['concept_research'].\n\nCác §H$concept_leaders$§! sẽ ngày một lão luyện nhờ tích lũy kinh nghiệm, trau dồi bản lĩnh và khai mở những ['concept_leader_traits'] vô song. Dù vậy, họ cũng khó lòng tránh khỏi quy luật sinh lão bệnh tử, sẽ có ngày phải về hưu hoặc từ trần.\n\nCó thể mời chào cũng như sa thải các nhà lãnh đạo tại £interface£['concept_leaders_view']."
 #Singular: ['concept_leader_trait'] or §H$concept_leader_trait$§!
 #Plural: ['concept_leader_traits'] or §H$concept_leader_traits$§!
 concept_leader_trait: "Đặc tính Lãnh đạo"
 concept_leader_traits: "Đặc tính Lãnh đạo"
 concept_leader_trait_desc: "§H$concept_leader_traits$§! là những phẩm chất làm nên điểm mạnh, điểm yếu và lĩnh vực chuyên môn của một ['concept_leader']. Những đặc tính này sẽ thao túng năng lực của vị lãnh đạo đó trên cương vị mà họ gánh vác, đem đến những quyền lợi khi dấn thân vào ['concept_research'], điều hành bộ máy ['concept_governor'] hay chỉ huy ['concept_fleets'].\n\nMột số đặc điểm độc nhất chỉ linh nghiệm khi vị lãnh đạo đó tọa vị trong ['concept_council']. Sẽ có những đặc điểm tích cực rèn giũa năng lực, trong khi số khác lại bóp nghẹt tài năng của họ. Do đó, đãi cát tìm vàng và nhào nặn nên những bậc anh tài là một nghệ thuật tối thượng trong việc trị quốc."
 #Singular: ['concept_leader_class'] or §H$concept_leader_class$§!
 #Plural: -
 concept_leader_class: "Hệ Lãnh đạo"
 concept_leader_class_desc: "§H$concept_leader_class$§! quy định vai trò của ['concept_leader']:\n\n—£official£['concept_official']\n—£commander£['concept_commander']\n—£scientist£['concept_scientist']"
 #Singular: £official£ ['concept_official'] or £official£ §H$concept_official$§!
 #Plural: £official£ ['concept_officials'] or £official£ §H$concept_officials$§!
 concept_official: "$official$"
 concept_officials: "$official_plural$"
 concept_official_desc: "£official£§H$concept_officials$§! là những ['concept_leaders'] quán xuyến các công việc hành chính, đảm nhiệm trọng trách giám sát quá trình cai trị và thực thi các chính sách của đế chế. Họ sắm vai một bánh răng không thể thiếu trong guồng quay gìn giữ £stability£['concept_stability'], thiết quân luật, và với tư cách là một ['concept_governor'], họ góp phần tối ưu hóa một £colony£['concept_colony'] hay £sector£['concept_sector']. Họ cũng có thể tận hiến sức mình vào công cuộc thắt chặt khối đại đoàn kết của ['concept_federation'] liên sao.\n\nBản lĩnh của §H$concept_officials$§! chịu sự giật dây của các ['concept_leader_traits'] cũng như muôn vàn nhân tố khác, biến việc kiểm soát gắt gao những chức sắc này thành một rào chắn bất khả xâm phạm nhằm duy trì sự vững bền của quốc gia."
 #Singular: £commander£ ['concept_commander'] or £commander£ $concept_commander$§!
 #Plural: £commander£ ['concept_commanders'] or £commander£ $concept_commanders$§!
 concept_commander: "$commander$"
 concept_commanders: "$commander_plural$"
 concept_commander_desc: "£commander£§H$concept_commanders$§! là các ['concept_leaders'] trong quân đội, có trách nhiệm điều động ['concept_fleets'] và giám sát các hoạt động của hải quân. Họ là những con át chủ bài trên chiến trường không gian cũng như trong việc vạch ra các đối sách chiến lược.\n\nTài thao lược của §H$concept_commander$§! bị chi phối bởi ['concept_leader_traits'] cùng hàng loạt nguyên nhân khác. Trọng dụng và quản lý khéo léo các tư lệnh có thể trở thành đòn bẩy thần tốc để khuếch trương uy lực hạm đội và sức mạnh quân sự, đồng thời trên cương vị ['concept_governor'], họ cũng có khả năng cải thiện bộ máy quản lý trên hành tinh."
 #Singular: £scientist£ ['concept_scientist'] or £scientist£ $concept_scientist$§!
 #Plural: £scientist£ ['concept_scientists'] or £scientist£ $concept_scientists$§!
 concept_scientist: "$scientist$"
 concept_scientists: "$scientist_plural$"
 concept_scientist_desc: "£scientist£§H$concept_scientists$§! là các ['concept_leaders'] miệt mài với công tác nghiên cứu, gánh vác sứ mệnh thắp sáng ngọn hải đăng khoa học kỹ thuật, khám phá và cách tân công nghệ cho đế chế. Họ có quyền chỉ đạo các dự án ['concept_research'], cầm lái £science_ship£['concept_science_ships'], mổ xẻ £anomaly£['concept_anomalies'] khắp ngân hà hay đào xới các £archaeology£['concept_archaeology_site'].\n\nNăng lực của §H$concept_scientist$§! chịu sức nặng từ các ['concept_leader_traits'], thâm niên công tác cũng như lĩnh vực chuyên môn. Việc tung những sĩ quan khoa học cộm cán vào các chiến dịch thám hiểm sẽ đẩy nhanh tiến trình, và với tư cách ['concept_governor'], họ cũng có thể hoàn thiện cơ cấu hành chính trên các hành tinh."
 #Singular: ['concept_star'] or §H$concept_star$§!
 #Plural: ['concept_stars'] or §H$concept_stars$§!
 concept_star: "Ngôi sao"
 concept_stars: "Ngôi sao"
 concept_star_desc: "§H$concept_star$§! là một thiên thể khổng lồ, thường ở dạng khí, án ngữ tại vị trí trung tâm của £system£['concept_system'].\n\n§H$concept_star$§! có thể níu giữ các £planet£['concept_planets'] hay §HTiểu hành tinh§! trong quỹ đạo để ta khai thác. Nguồn tài nguyên trên chính bản thân §H$concept_star$§! cũng có thể được bòn rút bằng cách thiết lập £mining_station£['concept_mining_station'] hay £science_ship£['concept_research_station']."
 #Singular: £planet£ ['concept_planet'] or £planet£ §H$concept_planet$§!
 #Plural: £planet£ ['concept_planets'] or £planet£ §H$concept_planets$§!
 concept_planet: "Hành tinh"
 concept_planets: "Hành tinh"
 concept_planet_desc: "£planet£§H$concept_planet$§! là một thiên thể hình cầu khổng lồ xoay quanh một ['concept_star'], và có thể sở hữu các §HMặt trăng§! của riêng mình.\n\nCó chín chủng loại §HHành tinh có thể sống được§! cơ bản có khả năng được cải tạo thành các £colony£['concept_colonies'].\n\nMột vài §HHành tinh không thể sống được§! có nguy cơ lọt vào danh sách ứng viên ['concept_terraforming'], hay chứa đựng những mạch tài nguyên trù phú đang chờ được khai thác bằng £mining_station£['concept_mining_station'] hay £science_ship£['concept_research_station']."
 #Số ít: ['concept_habitable_world'] hoặc §H$concept_habitable_world$§!
 #Số nhiều: ['concept_habitable_worlds'] hoặc §H$concept_habitable_worlds$§!
 concept_habitable_world: "Hành tinh sống được"
 concept_habitable_worlds: "Các hành tinh sống được"
 concept_habitable_world_desc: "§H$concept_habitable_worlds$§! là các vật thể thiên văn có khả năng duy trì sự sống cho £pop£ ['concept_pops'], có thể phát triển thành £colony£ ['concept_colonies']. Nhóm này bao gồm các £planet£ ['concept_planets'] tự nhiên cũng như các ['concept_habitats'] và §HThế giới Vành đai§! nhân tạo.\n\nCác §H$concept_planets$§! sống được trong tự nhiên được chia thành chín kiểu khí hậu cơ bản.\n\nMột số hành tinh hiện chưa thể sinh sống có thể trở nên sống được thông qua ['concept_terraforming']."
 #Singular: £sector£ ['concept_sector'] or £sector£ §H$concept_sector$§!
 #Plural: £sector£ ['concept_sectors'] or £sector£ §H$concept_sectors$§!
 concept_sector: "Tinh vực"
 concept_sectors: "Tinh vực"
 concept_sector_desc: "§H$concept_sectors$§! là các đơn vị hành chính nằm gọn trong lòng đế chế, quy tụ vô số £colony£['concept_colonies'] về dưới một trướng để siết chặt khâu quản lý. Các Tinh vực có khả năng làm mượt mà quá trình điều hành hành tinh, phân bổ tài nguyên và tự động hóa guồng quay kinh tế địa phương.\n\nMỗi Tinh vực có thể được giao cho một ['concept_governor'] coi sóc, kinh nghiệm cùng các ['concept_leader_traits'] của họ sẽ quyết định hiệu quả của công tác giám sát. Một nghệ thuật quản lý tinh vực tài ba sẽ trở thành chiếc mỏ neo giữ vững nền kinh tế, đồng thời san sẻ gánh nặng cho bộ máy hành chính khi đế chế đang trên đà bành trướng như vũ bão."
 #Singular: ['concept_resettlement'] or §H$concept_resettlement$§!
 #Plural: -
 concept_resettlement: "Di cư cưỡng bức"
 concept_resettlement_desc: "§H$concept_resettlement$§! là quá trình dịch chuyển £pop£['concept_pops'] giữa các £colony£['concept_colony'], cho phép đế chế xáo trộn lại nguồn nhân lực hòng thắt chặt quyền kiểm soát tốc độ bùng nổ dân số một cách triệt để.\n\nCó thể nhúng tay điều chuyển dân số bằng thủ công, hay kích hoạt các chính sách di dời tự động dựa trên quỹ nhà ở dư thừa, công việc hay các điều kiện sinh tồn khác.\n\nHoạt động Di dời sẽ rút kiệt £energy£['concept_energy'], đồng thời có thể bị trói chân bởi các ['concept_ethics'], ['concept_policies'], ['concept_civics'] hay §HQuyền Giống loài§! của đế chế."
 #Singular: ['concept_diplomatic_pact'] or §H$concept_diplomatic_pact$§!
 #Plural: ['concept_diplomatic_pacts'] or §H$concept_diplomatic_pacts$§!
 concept_diplomatic_pact: "Hiệp ước Ngoại giao"
 concept_diplomatic_pacts: "Hiệp ước Ngoại giao"
 concept_diplomatic_pact_desc: "§H$concept_diplomatic_pacts$§! là các giao kèo chính thức nhằm thắt chặt sợi dây ngoại giao và tương tác chiến lược giữa các đế chế. Đơn cử, những hiệp ước này có thể ép các quốc gia đặt bút ký phải thề nguyền tử thủ cùng nhau, hay bắt tay chia sẻ tri thức để thổi bùng ngọn lửa khoa học kỹ thuật.\n\n§H$concept_diplomatic_pacts$§! có thể đóng vai trò như những viên gạch nền móng để xây đắp nên một liên minh hùng mạnh hay một ['concept_federation'], song việc lật lọng các điều khoản cũng có thể đập nát lòng tin và rước họa vào thân bằng những đòn thù ngoại giao tàn khốc. Các bản hiệp ước có thể được thảo ra trong thẻ $contacts_view_tab_contacts$ của £interface£['concept_contacts_view']."
 #Singular: £science_ship£ ['concept_research_station'] or £science_ship£ §H$concept_research_station$§!
 #Plural: £science_ship£ ['concept_research_stations'] or £science_ship£ §H$concept_research_stations$§!
 concept_research_station: "$research_station$"
 concept_research_stations: "$research_station_plural$"
 concept_research_station_desc: "£science_ship£§H$concept_research_station$§! là một cơ sở trạm không gian chuyên dụng để hút cạn £physics£ £society£ £engineering£§HĐiểm nghiên cứu§! từ các yết hầu trọng yếu trên toàn cõi ngân hà.$tt_gain$—$tt_build_research_stations$"
 #Singular: £system£ ['concept_system'] or £system£ §H$concept_system$§!
 #Plural: £system£ ['concept_systems'] or £system£ §H$concept_systems$§!
 concept_system: "Hệ sao"
 concept_systems: "Hệ sao"
 concept_system_desc: "£system£§H$concept_systems$§! được neo giữ bởi một thiên thể siêu khối lượng ở vị trí trung tâm (phần lớn là ['concept_star']), kéo theo vô vàn £planet£['concept_planet'], ['concept_celestial_objects'] cùng các dị tượng không gian khác cuộn xoay quanh nó. Một hệ sao có thể bị mổ xẻ bởi các £science_ship£['concept_science_ships'], và bị thâu tóm bởi các ['concept_outposts'].\n\nNhiều hệ sao đang ôm trong lòng những hành tinh có thể sinh sống, được dọn đường để làm £colony£['concept_colonies'], trong khi số khác lại là những pháo đài chiến lược, những kho báu tài nguyên hay thậm chí là những mồ chôn đẫm máu. Thống trị các yết hầu hệ sao là điều kiện tiên quyết để bành trướng lãnh thổ, củng cố quốc phòng và vực dậy nền kinh tế."
 #Singular: ['concept_envoy'] or §H$concept_envoy$§!
 #Plural: ['concept_envoys'] or §H$concept_envoys$§!
 concept_envoy: "Đặc phái viên"
 concept_envoys: "Đặc phái viên"
 concept_envoy_desc: "§HĐặc phái viên§! chịu trách nhiệm xử lý các phi vụ ['concept_first_contact'] với người ngoài hành tinh chưa từng chạm mặt, điều hành mạng lưới gián điệp, cùng mọi hoạt động ['concept_diplomacy'] với các ['concept_empires'] khác.$tt_gain$—Xây dựng £megastructure£['concept_megastructure'] §HHội đồng Liên sao§!\n—Tận dụng các £building£['concept_buildings'], ['concept_leader_traits'], cùng ['concept_civics'] đặc trưng\n—Mở khóa bùa lợi ['concept_federation'] §H$extra_envoy_1$§!"
 #Singular: ['concept_civic'] or §H$concept_civic$§!
 #Plural: ['concept_civics'] or §H$concept_civics$§!
 concept_civic: "Triết lý Quốc gia"
 concept_civics: "Triết lý Quốc gia"
 concept_civic_desc: "§H$concept_civics$§! tượng trưng cho những triết lý nền tảng và kết cấu xã hội nhào nặn nên một quốc gia. Chúng ban phát những bùa lợi vô tiền khoáng hậu, định đoạt các chính sách nội bộ, và thao túng mọi thủ đoạn ngoại giao với các nền văn minh ngoại bang.\n\nTriết lý Quốc gia có khả năng được định hình lại thông qua công cuộc cải cách bộ máy chính quyền ở £interface£['concept_empire_view'], song song với đó sẽ có vài trường hợp bị trói buộc bởi ['concept_authority'] hay ['concept_ethics']."
 #Singular: ['concept_starbase_capacity'] or §H$concept_starbase_capacity$§!
 #Plural: -
 concept_starbase_capacity: "Sức chứa Căn cứ sao"
 concept_starbase_capacity_desc: "§H$concept_starbase_capacity$§! hiển thị số lượng ['concept_starbases'] có khả năng chống đỡ đợt nâng cấp hiệu quả, không tính toán các ['concept_outposts'].\n\nViệc vượt quá giới hạn căn cứ sao §H$concept_starbase_capacity$§! sẽ làm tăng ['concept_starbase_upkeep'].$tt_gain$—Chiếm hữu thêm nhiều ['concept_owned_systems'].\n—Triệt để khai thác các ['concept_technologies'] và ['concept_traditions'] đặc biệt."
 concept_starbase_capacity_desc_settled: "§H$concept_starbase_capacity$§! hiển thị số lượng ['concept_starbases'] đã nâng cấp mà bạn có thể duy trì hiệu quả, ['concept_outposts'] không tính vào đây.\n\nVượt quá §H$concept_starbase_capacity$§! sẽ làm tăng ['concept_starbase_upkeep'].$tt_gain$— Nắm quyền kiểm soát thêm các ['concept_owned_systems'].\n— Tận dụng các ['concept_technologies'] và ['concept_traditions'] nhất định."
 concept_starbase_capacity_desc_nomadic: "§H$concept_starbase_capacity$§! hiển thị số lượng £waystation£ ['concept_waystations'] mà một £nomad£ ['concept_nomadic_empire'] có thể duy trì hiệu quả.\n\nVượt quá §H$concept_starbase_capacity$§! sẽ làm tăng ['concept_starbase_upkeep'].$tt_gain$— Tận dụng các ['concept_technologies'] và ['concept_traditions'] nhất định." #Singular: ['concept_starbase_upkeep'] or §H$concept_starbase_upkeep$§!
 #Số ít: ['concept_starbase_upkeep'] hoặc §H$concept_starbase_upkeep$§!
 #Plural: -
 concept_starbase_upkeep: "Phí bảo trì Căn cứ sao"
 concept_starbase_upkeep_desc: "§H$concept_starbase_upkeep$§! tiêu biểu cho khoản phí tài nguyên dài kỳ hòng nuôi sống một Căn cứ sao. Lượng phí này phần lớn bị hút vào dưới dạng £energy£['concept_energy'], những §HMô-đun§! hay §HCông trình§! xịn xò được đắp thêm vào có nguy cơ lôi kéo theo những khoản phí phát sinh tốn kém.\n\nChi phí duy tu sẽ nhảy múa tùy theo kích thước cũng như chức năng của căn cứ, việc nâng cấp lên một cấp độ cao hơn chắc chắn sẽ kéo theo những hóa đơn bảo trì đắt đỏ."
 #Singular: ['concept_owned_system'] or §H$concept_owned_system$§!
 #Plural: ['concept_owned_systems'] or §H$concept_owned_systems$§!
 concept_owned_system: "Hệ sao Sở hữu"
 concept_owned_systems: "Hệ sao Sở hữu"
 concept_owned_system_desc: "§H$concept_owned_systems$§! là các £system£['concept_systems'] bị thâu tóm hoàn toàn bởi một quốc gia, bất kể thông qua con đường bành trướng lãnh thổ hay chiến tranh xâm lược. Nắm trong tay quyền định đoạt, đế chế đó được phép dựng lên các ['concept_starbases'], hút sạch tài nguyên, và đặt những nền móng £colony£['concept_colonies'] đầu tiên.\n\nViệc bành trướng thế lực lên các hệ sao sẽ thổi phồng £empire_sprawl£['concept_empire_size'] của đế chế, trong khi những hệ sao bị bỏ hoang sẽ là một đòn giáng đau đớn vào bộ máy hành chính lẫn ngân khố quốc gia."
 #Singular: ['concept_naval_capacity'] or §H$concept_naval_capacity$§!
 #Plural: -
 concept_naval_capacity: "Sức chứa Hải quân"
 concept_naval_capacity_desc: "§H$concept_naval_capacity$§! thể hiện tổng ['concept_fleet_size'] có thể được hỗ trợ hiệu quả.\n\nVượt quá §H$concept_naval_capacity$§! sẽ làm tăng ['concept_ship_upkeep']. $tt_gain$—Xây dựng mô-đun §HĐiểm neo đậu§! trên ['concept_starbases']\n—Sử dụng các £job£['concept_jobs'] cụ thể, ví dụ như từ £building£['building:building_stronghold'] cung cấp\n—Sử dụng các ['concept_technologies'] và ['concept_traditions'] nhất định"
 #Số ít: ['concept_governor'] hoặc §H$concept_governor$§!
 #Số nhiều: ['concept_governors'] hoặc §H$concept_governors$§!
 concept_governor: "$governor$"
 concept_governors: "$governor_plural$"
 concept_governor_desc: "§H$concept_governor$§! là một ['concept_leader'] chịu trách nhiệm quản lý £colony£['concept_colony'] hoặc £sector£['concept_sector']. §H$concept_leader$§! được chỉ định làm thủ phủ phân khu cũng sẽ kiêm nhiệm vị trí §H$concept_governor$§! của toàn bộ phân khu đó.\n\n['concept_leader_class'] và ['concept_leader_traits'] sẽ quyết định các bùa lợi hoặc hình phạt được tạo ra.\n\nCó thể chỉ định §H$concept_governors$§! tại £interface£['concept_colony_view'] hoặc £interface£['concept_planets_and_sector_view']."
 #Số ít: ['concept_decision'] hoặc §H$concept_decision$§!
 #Số nhiều: ['concept_decisions'] hoặc §H$concept_decisions$§!
 concept_decision: "Quyết định"
 concept_decisions: "Quyết định"
 concept_decision_desc: "§H$concept_decision$§! là một sắc lệnh quy mô hành tinh dùng để đáp ứng các nhu cầu cụ thể của £colony£['concept_colony']. Có thể dùng để thêm £district£['concept_districts'], dọn dẹp £blocker£['concept_blockers'] hoặc thay đổi đặc điểm hành tinh.\n\nMột số quyết định cần tiêu hao tài nguyên kích hoạt hoặc yêu cầu điều kiện cụ thể để ban hành.\n\nCó thể quản lý §H$concept_decisions$§! tại giao diện £interface£['concept_colony_view']."
 #Số ít: ['concept_planetary_ascension'] hoặc §H$concept_planetary_ascension$§!
 #-
 concept_planetary_ascension: "Thăng thiên thuộc địa"
 concept_planetary_ascension_desc: "§HCấp độ thăng thiên thuộc địa§! của £colony£['concept_colony'] sẽ cường hóa hiệu ứng của ['concept_designation'], giảm ảnh hưởng lên £empire_sprawl£['concept_empire_size'].\n\nDựa trên số lượng ['concept_ascension_perks'] đã mở khóa, thuộc địa có thể thăng thiên nhiều lần, tùy thuộc vào tổng §HCấp độ thăng thiên§! tích lũy của toàn bộ ['concept_empire'], chi phí £unity£['concept_unity'] cho mỗi lần thăng thiên sẽ tăng lên.\n\nMở khóa tất cả §H$concept_ascension_perks$§! sẽ tăng thêm §G$COMPLETION_BONUS$§! cấp cho §HGiới hạn thăng thiên thuộc địa§!."
 #Số ít: ['concept_designation'] hoặc §H$concept_designation$§!
 #Số nhiều: -
 concept_designation: "Quy hoạch thuộc địa"
 concept_designation_desc: "§H$concept_designation$§! quyết định chức năng chính của £colony£['concept_colony'], ví dụ như tăng tốc độ xây dựng của một số khu vực nhất định hoặc tăng sản lượng của vài vị trí làm việc.\n\nNếu không thiết lập §H$concept_designation$§! theo cách thủ công, hệ thống sẽ tự động chỉ định dựa trên các khu vực và công trình hiện có."
 #Số ít: ['concept_planet_automation'] hoặc §H$concept_planet_automation$§!
 #Số nhiều: -
 concept_planet_automation: "Tự động hóa hành tinh"
 concept_planet_automation_desc: "§H$concept_planet_automation$§! cho phép £colony£['concept_colony'] tự động phát triển theo $COLONY_AUTOMATION_SETTINGS$ đã chọn."
 #Số ít: ['concept_devastation'] hoặc §H$concept_devastation$§!
 #Số nhiều: -
 concept_devastation: "Mức độ tàn phá"
 concept_devastation_desc: "§H$concept_devastation$§! là mức độ thiệt hại mà £colony£['concept_colony'] phải gánh chịu, thiệt hại này thường đến từ §HOanh tạc quỹ đạo§!. Hứng chịu §H$concept_devastation$§! quá lớn sẽ gây ra ảnh hưởng tiêu cực về nhiều mặt, ví dụ như £housing£['concept_housing'], £amenities£['concept_amenities'] và sản lượng £job£['concept_job'], v.v.\n\n§H$concept_devastation$§! sẽ giảm dần khi £colony£§H$concept_colony$§! được khôi phục.\n\n£interface£['concept_colony_view'] sẽ hiển thị cấp độ §H$concept_devastation$§! hiện tại."
 #Số ít: ['concept_shipyard'] hoặc §H$concept_shipyard$§!
 #Số nhiều: ['concept_shipyards'] hoặc §H$concept_shipyards$§!
 concept_shipyard: "Xưởng đóng tàu"
 concept_shipyards: "Xưởng đóng tàu"
 concept_shipyard_desc: "§H$concept_shipyard$§! là một ['concept_starbase'] được trang bị mô-đun §H$concept_shipyard$§!, có khả năng đóng cả ['concept_civilian_ships'] và ['concept_military_ships'].\n\nCó thể tiến hành đóng tàu tại £interface£['concept_starbase_view']."
 #Số ít: £anomaly£ ['concept_anomaly'] hoặc £anomaly£ §H$concept_anomaly$§!
 #Số nhiều: £anomaly£ ['concept_anomalies'] hoặc £anomaly£ §H$concept_anomalies$§!
 concept_anomaly: "Dị thường"
 concept_anomalies: "Dị thường"
 concept_anomaly_desc: "£anomaly£§H$concept_anomaly$§! là các hiện tượng bí ẩn do £science_ship£['concept_science_ships'] phát hiện trong quá trình khảo sát £system£['concept_systems']. Việc điều tra dị thường có thể mang lại phần thưởng hoặc nguy hiểm.\n\nCó thể phân công £scientist£§H$concept_scientist$§! để nghiên cứu §H$concept_anomalies$§!, thời gian điều tra phụ thuộc vào cấp độ kỹ năng của họ và độ khó của §H$concept_anomaly$§!.\n\nKhi chọn §H$concept_science_ship$§!, dị thường sẽ hiển thị trên £interface£['concept_galaxy_map'], ngoài ra chúng cũng được liệt kê trong thẻ $situation_log_view_tab_situation_log$ của £interface£['concept_situation_log_view']."
 #Số ít: £archaeology£ ['concept_archaeology_site'] hoặc £archaeology£ §H$concept_archaeology_site$§!
 #Số nhiều: £archaeology£ ['concept_archaeology_site'] hoặc £archaeology£ §H$concept_archaeology_site$§!
 concept_archaeology_site: "Khu khảo cổ"
 concept_archaeology_sites: "Các khu khảo cổ"
 concept_archaeology_site_desc: "£archaeology£§H$concept_archaeology_site$§! là tàn tích của các nền văn minh cổ đại hoặc tàn tích chiến trường cùng nhiều loại di chỉ có giá trị khai quật khác. £science_ship£['concept_science_ships'] dưới sự chỉ huy của một nhà khoa học có thể tiến hành khai quật để hé lộ những bí mật ẩn giấu."
 #Số ít: ['concept_empire'] hoặc §H$concept_empire$§!
 #Số nhiều: ['concept_empires'] hoặc §H$concept_empires$§!
 concept_empire: "Đế chế"
 concept_empires: "Đế chế"
 concept_empire_desc: "§H$concept_empire$§! là một thể chế thiên hà sở hữu ít nhất một £system£['concept_system'], thường tìm cách bành trướng tầm ảnh hưởng giữa các vì sao. Các yếu tố ['concept_ethics'], ['concept_authority'], và ['concept_civics'] của nó sẽ định hình các chính sách và hành vi của đế chế.\n\nSự tương tác giữa các §H$concept_empires$§! có thể mang hình thức ngoại giao, giao thương hoặc xung đột.\n\nSự bành trướng của các §H$concept_empires$§! được trực quan hóa trên £interface£['concept_galaxy_map'].\n\nCó thể liên lạc thông qua việc nhấn vào cờ đế chế hoặc tại thẻ $contacts_view_tab_contacts$ của £interface£['concept_contacts_view']."
 #Số ít: ['concept_defense_platform'] hoặc §H$concept_defense_platform$§!
 #Số nhiều: ['concept_defense_platforms'] hoặc §H$concept_defense_platforms$§!
 concept_defense_platform: "$military_station_small$"
 concept_defense_platforms: "$military_station_small_plural$"
 concept_defense_platform_desc: "§H$concept_defense_platforms$§! là một tổ hợp không gian sâu dùng để bảo vệ ['concept_starbases'], thường có khả năng làm chậm nhịp độ tấn công trước khi ['concept_fleet'] phòng thủ kịp thời kéo đến.\n\nLoại §H$concept_defense_platforms$§! lớn nhất là một cấu trúc khổng lồ có sức chứa hàng ngàn thủy thủ đoàn và được trang bị hỏa lực mạnh ngang ngửa một hạm đội. Có thể sửa đổi thiết kế trong thẻ §H$SHIP_DESIGNER$§! của £interface£['concept_fleet_management_view']."
 #Số ít: ['concept_army'] hoặc §H$concept_army$§!
 #Số nhiều: ['concept_armies'] hoặc §H$concept_armies$§!
 concept_army: "Lục quân"
 concept_armies: "Lục quân"
 concept_army_desc: "§H$concept_armies$§! là lực lượng mặt đất chịu trách nhiệm đồn trú tại £colony£['concept_colonies'] hoặc tấn công £planet£['concept_planets'] của thế lực thù địch.\n\nĐược chỉ huy bởi £commander£['concept_commander'], một §H$concept_army$§! có thể nhận bùa lợi hoặc hình phạt từ các ['concept_leader_traits'].\n\nCó thể thành lập §H$concept_armies$§! tại thẻ §H$MACRO_BUILDER_TAB$§! của ['concept_starbases'] hoặc thẻ §H$GROUND_COMBAT_TAB$§! của §H$concept_colonies$§!."
 #Số ít: ['concept_component'] hoặc §H$concept_component$§!
 #Số nhiều: ['concept_components'] hoặc §H$concept_components$§!
 concept_component: "Linh kiện"
 concept_components: "Linh kiện"
 concept_component_desc: "§H$concept_components$§! là các hệ thống và mô-đun độc lập quyết định hiệu năng của ['concept_ship'], bao gồm vũ khí, phòng thủ, động cơ siêu không gian và các hệ thống dùng chung v.v.\n\nChúng thường được mở khóa thông qua việc nghiên cứu ['concept_technologies'] mới, và được trang bị để sử dụng tại thẻ §H$SHIP_DESIGNER$§! của £interface£['concept_fleet_management_view'].\n\n£science_ship£['concept_science_ships'] sẽ tự động sử dụng các §H$concept_components$§! tân tiến nhất trong phạm vi cho phép."
 #Số ít: ['concept_habitat'] hoặc §H$concept_habitat$§!
 #Số nhiều: ['concept_habitats'] hoặc §H$concept_habitats$§!
 concept_habitat: "Trạm cư trú"
 concept_habitats: "Trạm cư trú"
 concept_habitat_desc: "§H$concept_habitats$§! là một dạng cấu trúc sinh thái không gian sâu.\n\nChúng được xây dựng dưới hình thức ['concept_megastructures'] thông qua việc sử dụng £construction_ship£['concept_construction_ship'], sau khi hoàn thành có thể chuyển đổi thành £colony£['concept_colonies'].\n\nSố lượng £district£['concept_districts'] khả dụng được quyết định bởi §HTrữ lượng tài nguyên§! bên trong £system£['concept_system']."
 #Số ít: £housing£ ['concept_housing'] hoặc £housing£ §H$concept_housing$§!
 #Số nhiều: -
 concept_housing: "Nhà ở"
 concept_housing_desc: "£housing£§H$concept_housing$§! đại diện cho hạ tầng cơ sở dùng để sắp xếp chỗ ở cho dân số trên £colony£['concept_colony']. Thiếu hụt §H$concept_housing$§! sẽ làm giảm £stability£['concept_stability'] và có thể gây ra hiện tượng §HDi cư§!.\n\nCó thể tăng §H$concept_housing$§! thông qua việc xây dựng £district£['concept_districts'] và các £building£['concept_buildings'] cụ thể. Lượng §H$concept_housing$§! cao cũng góp phần làm tăng ['concept_planet_capacity'], qua đó tác động đến tốc độ tăng trưởng của dân số sinh học.\n\nCác £zone£['concept_district_specializations'] chuyên biệt của §H$district_city_plural$§! có thể làm giảm lượng §H$concept_housing$§! do §H$district_city$§! cung cấp."
 #Số ít: ['concept_planet_size'] hoặc §H$concept_planet_size$§!
 #Số nhiều: -
 concept_planet_size: "Kích cỡ hành tinh"
 concept_planet_size_desc: "§H$concept_planet_size$§! quyết định số lượng £district£['concept_districts'] mà £colony£['concept_colony'] có thể chứa được. Các hành tinh lớn có thể chứa nhiều £district£['concept_districts'] hơn, đồng nghĩa với việc có nhiều không gian xây dựng và chuyên môn hóa hơn để cung cấp £job£['concept_jobs']."
 #Số ít: ['concept_planet_capacity'] hoặc §H$concept_planet_capacity$§!
 #Số nhiều: -
 concept_planet_capacity: "Sức chứa hành tinh"
 concept_planet_capacity_desc: "§H$concept_planet_capacity$§! được quyết định bởi £housing£['concept_housing'] cùng không gian dư thừa từ các £district£['concept_districts'] chưa phát triển, và cũng chịu ảnh hưởng bởi độ ở được của £planet£['concept_planet']. Dọn dẹp £blocker£['concept_blockers'] cũng có thể tăng thêm sức chứa.\n\n£pop£§HDân số sinh học§! sẽ nhận được bùa lợi tăng trưởng khi đạt mức một nửa sức chứa, tốc độ phát triển là nhanh nhất, nhưng sẽ chịu hình phạt khi sắp chạm ngưỡng giới hạn của £colony£['concept_colony']."
 #Số ít: £stability£ ['concept_stability'] hoặc £stability£ §H$concept_stability$§!
 #Số nhiều: -
 concept_stability: "Độ ổn định"
 concept_stability_desc: "£stability£§H$concept_stability$§! phản ánh sự ổn định chính trị của £colony£['concept_colony'], chịu ảnh hưởng chủ yếu bởi £happiness£['concept_pop_approval_rating'] của người dân.\n\n§H$concept_stability$§! thấp có thể do thiếu hụt £housing£['concept_housing'], lượng £amenities£['concept_amenities'] thấp hoặc £crime£['concept_crime'] ở mức cao. Tình trạng này sẽ tạo ra hình phạt và làm tăng nguy cơ xảy ra các sự kiện tiêu cực, thậm chí là §HNổi loạn§!.\n\n§H$concept_stability$§! cao sẽ mang lại bùa lợi cho sản lượng tài nguyên."
 #Số ít: -
 #Số nhiều 1: £amenities£ ['concept_amenities'] hoặc £amenities£ §H$concept_amenities$§!
 #Số nhiều 2: £amenities_no_happiness£ ['concept_amenities_gestalt'] hoặc £amenities_no_happiness£ §H$concept_amenities_gestalt$§!
 concept_amenities: "Độ tiện nghi"
 concept_amenities_desc: "[GetConceptAmenities]"
 concept_amenities_desc_regular: "£amenities£§H$concept_amenities$§! đại diện cho các cơ sở hạ tầng và vị trí làm việc có khả năng đáp ứng nhu cầu thiết yếu hàng ngày của dân cư.\n\nSự thiếu hụt §H$concept_amenities$§! trên £colony£['concept_colony'] sẽ làm giảm £happiness£['concept_happiness']. Có thể tăng §H$concept_amenities$§! bằng cách phân công £pop£['concept_pops'] vào các £job£['concept_jobs'], ví dụ như £job_entertainer£§H$job_entertainer_plural$§!."
 concept_amenities_desc_gestalt: "£amenities_no_happiness£§H$concept_amenities$§! đại diện cho các cơ sở hạ tầng và vị trí làm việc có khả năng đáp ứng nhu cầu cơ bản của dân số thực thể con.\n\nSự thiếu hụt §H$concept_amenities$§! sẽ làm giảm £stability£['concept_stability']. Có thể tăng mức này bằng cách phân công £pop£['concept_pops'] vào các £job£['concept_jobs'], ví dụ như £job_maintenance_drone£§H$job_maintenance_drone_plural$§!."
 #Số ít: £crime£ ['concept_crime'] hoặc £crime£ §H$concept_crime$§!
 #Số nhiều: -
 concept_crime: "Tội phạm"
 concept_crime_desc: "£crime£§H$concept_crime$§! phản ánh mức độ hoạt động phạm pháp và sự mất trật tự trên £colony£['concept_colony'].\n\n§H$concept_crime$§! cao có thể gây ra các sự kiện tiêu cực và làm giảm £stability£['concept_stability'].\n\nSố lượng dân số §H$concept_crime$§! đông đảo sẽ gây ảnh hưởng. Có thể giảm bớt mức này bằng cách tăng cường £happiness£['concept_happiness'] hoặc phân công £pop£['concept_pops'] vào các £job£['concept_jobs'], ví dụ như £job_enforcer£§H$job_enforcer_plural$§!."
 #Số ít: £happiness£ ['concept_happiness'] hoặc £happiness£ §H$concept_happiness$§!
 #Số nhiều: -
 concept_happiness: "Mức độ hạnh phúc"
 concept_happiness_desc: "£happiness£§H$concept_happiness$§! được dùng để đong đếm sự hài lòng tổng thể của £pop£['concept_pops'], nó chịu ảnh hưởng từ các yếu tố như ['concept_living_standards'], ['concept_edicts'] và hàng loạt các ['concept_planet_modifiers'].\n\n§H$concept_happiness$§! cao giúp gia tăng £stability£['concept_stability'], qua đó tiếp tục thúc đẩy sản lượng của £job£['concept_job'], ngược lại §H$concept_happiness$§! thấp sẽ làm giảm §H$concept_stability$§!.\n\n£political_power£['concept_political_power'] kết hợp cùng §H$concept_happiness$§! để xác định £happiness£['concept_pop_approval_rating'].\n\nNhững §H$concept_pops$§! không có hệ thống §H$concept_happiness$§! sẽ luôn được mặc định sở hữu §Y50%§! §H$concept_happiness$§!."
 #Số ít: £happiness£ ['concept_pop_approval_rating'] hoặc £happiness£ §H$concept_pop_approval_rating$§!
 #Số nhiều: -
 concept_pop_approval_rating: "Tỷ lệ tán thành của dân số"
 concept_pop_approval_rating_desc: "£happiness£§H$concept_pop_approval_rating$§! đại diện cho mức £happiness£['concept_happiness'] trung bình được tính theo trọng số của £political_power£['concept_political_power'] trên tất cả £pop£['concept_pops'] của £colony£['concept_colony'].\n\nCác §H$concept_pops$§! có mức §H$concept_political_power$§! cao hơn, chẳng hạn như £pop_cat_ruler£§H$pop_cat_ruler_plural$§! trong hầu hết các tiêu chuẩn sống, sẽ tác động đáng kể hơn đến kết quả tính toán.\n\n§H$concept_pop_approval_rating$§! ở mức thấp sẽ làm sụt giảm £stability£['concept_stability'] và khiến £crime£['concept_crime'] gia tăng."
 #Số ít: £political_power£ ['concept_political_power'] hoặc £political_power£ §H$concept_political_power$§!
 #Số nhiều: -
 concept_political_power: "Quyền lực chính trị"
 concept_political_power_desc: "£political_power£§H$concept_political_power$§! phản ánh sức ảnh hưởng mà một £pop£['concept_pops'] đơn lẻ nắm giữ bên trong đế chế. §H$concept_political_power$§! của dân số sẽ dao động dựa theo tầng lớp xã hội và £job£['concept_job'].\n\nMức §H$concept_political_power$§! càng cao thì họ càng có nhiều tiếng nói trong những tác động của ['concept_faction'] và ['concept_democratic_election'], điều này tạo điều kiện cho các nhóm dân cư cụ thể gây tác động mạnh hơn trong việc định hình đường lối chính sách. Các đế chế Chuyên chế thường tập trung quyền lực vào tay tầng lớp cai trị tinh hoa, trong khi các xã hội Dân chủ và Bình đẳng sẽ phân bổ quyền lực đó một cách hài hòa hơn cho cư dân của mình."
 #Số ít: ['concept_terraforming'] hoặc §H$concept_terraforming$§!
 #Số nhiều: -
 concept_terraforming: "Cải tạo môi trường"
 concept_terraforming_desc: "§H$concept_terraforming$§! là quá trình cải tạo môi trường của một £planet£['concept_planet'] nằm trong vùng lãnh thổ của ['concept_empire'] để trở nên thích hợp cho việc cư trú hơn.\n\nThông thường quá trình này đòi hỏi một số ['concept_technologies'] cụ thể cùng với việc tiêu hao một lượng lớn £energy£['concept_energy'].\n\nNhờ vào các §H$concept_technologies$§! tân tiến, ngay cả những hành tinh đã được khai phá cũng có thể trải qua cải tạo để mang lại một vùng khí hậu thân thiện hơn đối với các ['concept_species'] đang định cư trên đó."
 #Số ít: ['concept_space_fauna'] hoặc §H$concept_space_fauna$§!
 #Số nhiều: -
 concept_space_fauna: "Sinh vật không gian"
 concept_space_fauna_desc: "§H$concept_space_fauna$§! là các chủng loài hoang dã và thực thể bắt gặp trong không gian, không thuộc về bất kỳ một thế lực đế chế nào.\n\nMột số loài có bản tính khá ôn hòa chừng nào chúng chưa bị chọc giận, số khác thì luôn luôn giữ thái độ hung hăng."
 #Số ít: £blocker£ ['concept_blocker'] hoặc £blocker£ §H$concept_blocker$§!
 #Số nhiều: £blocker£ ['concept_blockers'] hoặc £blocker£ §H$concept_blockers$§!
 concept_blocker: "Vật cản địa hình"
 concept_blockers: "Vật cản địa hình"
 concept_blocker_desc: "£blocker£§H$concept_blocker$§! là một kiểu đặc điểm hành tinh trên £colony£['concept_colony'], đóng vai trò như một tác nhân cản trở đối với các đặc điểm hành tinh khác hoặc việc xây dựng các £district£['concept_districts'] cụ thể.\n\nMột số §H$concept_blockers$§! có thể được dọn dẹp sạch sẽ bằng cách tiêu tốn tài nguyên, và quy trình này thường yêu cầu những ['concept_technologies'] nhất định. Có thể tiến hành quản lý tại £interface£['concept_colony_view']."
 #Số ít: ['concept_event_chain'] hoặc §H$concept_event_chain$§!
 #Số nhiều: ['concept_event_chains'] hoặc §H$concept_event_chains$§!
 concept_event_chain: "Chuỗi sự kiện"
 concept_event_chains: "Chuỗi sự kiện"
 concept_event_chain_desc: "§H$concept_event_chains$§! là hàng loạt những sự kiện có mối liên hệ đan xen lẫn nhau, chúng sẽ dần mở ra theo tiến trình của từng sự kiện, thường bắt nguồn từ quá trình thám hiểm, các £anomaly£['concept_anomalies'] hoặc thông qua các quyết sách từ phía đế chế.\n\nCác chuỗi sự kiện có thể hé lộ cho chúng ta những phát kiến khoa học, âm mưu chính trị, sự bí ẩn của thiên hà, và đôi khi còn mang đến các phần thưởng đầy quyền lực hay những mối đe dọa mang tính nguy hiểm tột độ. Việc đưa ra quyết định một cách thận trọng là vô cùng quan trọng, mỗi một lựa chọn đều có khả năng để lại tác động tới vận mệnh trong tương lai của đế chế. Chuỗi sự kiện sẽ được liệt kê bên trong thẻ $situation_log_view_tab_situation_log$ của £interface£['concept_situation_log_view']."
 #Số ít: ['concept_special_project'] hoặc §H$concept_special_project$§!
 #Số nhiều: ['concept_special_projects'] hoặc §H$concept_special_projects$§!
 concept_situation: "Tình huống"
 concept_situations: "Tình huống"
 concept_situation_desc: "§H$concept_situations$§! là những vấn đề phức tạp, gồm nhiều giai đoạn mà đế chế có thể phải đối mặt.\n\nThông qua các cách xử lý khác nhau, ta có thể điều hướng tình huống để giành lấy phần thưởng lớn, hay chỉ đơn giản là giảm nhẹ tai họa. §HTình huống§! nằm ở thẻ $situation_log_view_tab_situation_log$ trong £interface£ ['concept_situation_log_view']."
 #Số ít: ['concept_special_project'] hoặc §H$concept_special_project$§!
 #Số nhiều: ['concept_special_projects'] hoặc §H$concept_special_projects$§!
 concept_special_project: "Dự án đặc biệt"
 concept_special_projects: "Dự án đặc biệt"
 concept_special_project_desc: "§H$concept_special_projects$§! là những đề xuất ['concept_research'] độc đáo, đòi hỏi nỗ lực chuyên biệt để hoàn thành, khiến tiến độ ở một lĩnh vực khoa học bị tạm ngưng.\n\nHoàn thành §H$concept_special_projects$§! có thể mang lại phần thưởng lớn, là một phần quan trọng trong việc khám phá và mở rộng."
 #Số ít: ['concept_milestone'] hoặc §H$concept_milestone$§!
 #Số nhiều: ['concept_milestones'] hoặc §H$concept_milestones$§!
 concept_milestone: "Cột mốc"
 concept_milestones: "Cột mốc"
 concept_milestone_desc: "§H$concept_milestones$§! là những sự kiện và thành tựu trọng đại, những thời khắc then chốt trong hành trình của đế chế, cũng như ghi chép lịch sử quan trọng về sự mở rộng, khám phá và xung đột.\n\nTheo dõi §H$concept_milestones$§! có thể mang lại cái nhìn sâu sắc về sự phát triển và quyết định chiến lược của đế chế. Có thể xem trong §HDòng thời gian§! tại thẻ $situation_log_view_tab_timeline$ của £interface£['concept_situation_log_view']."
 #Số ít: ['concept_empire_focus'] hoặc §H$concept_empire_focus$§!
 #Số nhiều: ['concept_empire_focuses'] hoặc §H$concept_empire_focuses$§!
 concept_empire_focus: "Trọng tâm đế chế"
 concept_empire_focuses: "Trọng tâm đế chế"
 concept_empire_focus_desc: "§H$concept_empire_focuses$§! đại diện cho các ưu tiên chiến lược cấp cao định hướng sự phát triển và quyết định của đế chế.\n\nĐế chế có thể theo đuổi các trọng tâm khác nhau, ví dụ như §HKhám phá§! khoa học và phát kiến tiên tiến, §HChinh phạt§! để giành ưu thế quân sự, hay §HPhát triển§! tăng trưởng kinh tế và ngoại giao. Hoàn thành §HNhiệm vụ trọng tâm§! sẽ thúc đẩy trọng tâm tương ứng, đồng thời mang đến các lựa chọn ['concept_technologies'] mới.\n\nNhiệm vụ và trọng tâm có thể xem tại thẻ $situation_log_view_tab_timeline$ trong £interface£['concept_situation_log_view']."
 #Số ít: ['concept_scoreboard'] hoặc §H$concept_scoreboard$§!
 #Số nhiều: -
 concept_scoreboard: "Bảng điểm"
 concept_scoreboard_desc: "§H$concept_scoreboard$§! dùng để đánh giá sơ bộ vị thế của đế chế trên vũ đài tầm cỡ thiên hà, phản ánh những thành tựu về công nghệ, kinh tế, quân sự và ảnh hưởng ngoại giao.\n\nDù không mang tính quyết định, nhưng nó là một bảng tổng sắp những tham vọng trong không gian, giúp ta nhìn thấu ai đang trỗi dậy mạnh mẽ, ai đang sống qua ngày, và ai đang thoi thóp. Nơi hành lang quyền lực tĩnh lặng, những so sánh như vậy luôn đi kèm với hậu quả."
 #Số ít: ['concept_living_standard'] hoặc §H$concept_living_standard$§!
 #Số nhiều: ['concept_living_standards'] hoặc §H$concept_living_standards$§!
 concept_living_standard: "Mức sống"
 concept_living_standards: "Mức sống"
 concept_living_standard_desc: "§H$concept_living_standards$§! quyết định chất lượng sống dành cho các £pop£['concept_pops'] khác nhau trong đế chế, ảnh hưởng đến £happiness£['concept_happiness'] của họ cũng như tổng thể £political_power£['concept_political_power']. §H$concept_living_standards$§! chịu ảnh hưởng từ ['concept_policies'] của chính quyền, có thể khác biệt rất lớn tùy theo phân loại ['concept_species'], ['concept_ethics'] và ưu tiên kinh tế.\n\nMức sống cao hơn đòi hỏi nhiều tài nguyên hơn, trong khi mức thấp hơn giúp giảm phí duy trì, nhưng bù lại phải trả giá bằng £stability£['concept_stability'] và mức độ hài lòng của người lao động. Có thể thiết lập trong £interface£['concept_species_view']."
