 SHARD_RAIL_ACCELERATOR: "Pháo Ray Mảnh Xương"
 SHARD_RAIL_ACCELERATOR_DESC: "Các phần phụ có cấu trúc như đường ray chuyển hóa hóa năng thành điện năng, tạo ra một từ trường mạnh mẽ để bắn ra những viên đạn chết người."
 SHARD_RAIL_ACCELERATOR_SMALL: "$SHARD_RAIL_ACCELERATOR$"
 SHARD_RAIL_ACCELERATOR_MEDIUM: "$SHARD_RAIL_ACCELERATOR$"
 SHARD_RAIL_ACCELERATOR_LARGE: "$SHARD_RAIL_ACCELERATOR$"
