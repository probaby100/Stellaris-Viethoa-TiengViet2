l_simp_chinese:
 RED_EYE_BEAM: "Tia Mắt Đỏ"
 RED_EYE_BEAM_DESC: "Thể thủy tinh của sinh vật đã được cường hóa để bắn ra một chùm tia laser màu đỏ cường độ cao. Việc tinh chỉnh kiểu gen sâu hơn có thể kích hoạt sự phát triển đồng bộ của nhiều nhãn cầu cùng lúc."
 RED_EYE_BEAM_SMALL: "$RED_EYE_BEAM$"
 RED_EYE_BEAM_MEDIUM: "$RED_EYE_BEAM$"
 RED_EYE_BEAM_LARGE: "$RED_EYE_BEAM$"
 RED_EYE_BEAM_EXTRA_LARGE: "$RED_EYE_BEAM$"
 BLUE_EYE_BEAM: "Tia Mắt Xanh"
 BLUE_EYE_BEAM_DESC: "Thông qua việc cải tạo gen ở võng mạc, các cơ quan mắt có thể phóng ra chùm năng lượng màu xanh lam mạnh mẽ hơn."
 BLUE_EYE_BEAM_SMALL: "$BLUE_EYE_BEAM$"
 BLUE_EYE_BEAM_MEDIUM: "$BLUE_EYE_BEAM$"
 BLUE_EYE_BEAM_LARGE: "$BLUE_EYE_BEAM$"
 BLUE_EYE_BEAM_EXTRA_LARGE: "$BLUE_EYE_BEAM$"
 UV_EYE_BEAM: "Tia Mắt Tử Ngoại"
 UV_EYE_BEAM_DESC: "Võng mạc được phủ một lớp màng phóng tia cực tím, giúp giải phóng những chùm tia laser chính xác và mang tính tàn phá cao hơn."
 UV_EYE_BEAM_SMALL: "$UV_EYE_BEAM$"
 UV_EYE_BEAM_MEDIUM: "$UV_EYE_BEAM$"
 UV_EYE_BEAM_LARGE: "$UV_EYE_BEAM$"
 UV_EYE_BEAM_EXTRA_LARGE: "$UV_EYE_BEAM$"
 XRAY_EYE_BEAM: "Tia Mắt X-quang"
 XRAY_EYE_BEAM_DESC: "Việc tinh chỉnh võng mạc sâu hơn giúp nó có thể phát ra tia laser với bước sóng ngắn hơn và sức tàn phá khủng khiếp hơn."
 XRAY_EYE_BEAM_SMALL: "$XRAY_EYE_BEAM$"
 XRAY_EYE_BEAM_MEDIUM: "$XRAY_EYE_BEAM$"
 XRAY_EYE_BEAM_LARGE: "$XRAY_EYE_BEAM$"
 XRAY_EYE_BEAM_EXTRA_LARGE: "$XRAY_EYE_BEAM$"
 GAMMA_EYE_BEAM: "Tia Mắt Gamma"
 GAMMA_EYE_BEAM_DESC: "Các cơ quan thị giác được tối ưu hóa gen đến mức cực hạn có thể bắn ra những chùm tia mang năng lượng vô song, sở hữu sức mạnh hủy diệt."
 GAMMA_EYE_BEAM_SMALL: "$GAMMA_EYE_BEAM$"
 GAMMA_EYE_BEAM_MEDIUM: "$GAMMA_EYE_BEAM$"
 GAMMA_EYE_BEAM_LARGE: "$GAMMA_EYE_BEAM$"
 GAMMA_EYE_BEAM_EXTRA_LARGE: "$GAMMA_EYE_BEAM$"
 BIO_PLASMA_THROWER: "Súng Phun Plasma Sinh Học"
 BIO_PLASMA_THROWER_DESC: "Sự biến đổi gen này kích thích sự phát triển của các tuyến tạo plasma và các cấu trúc dạng nòng súng, có thể phóng plasma ra khoảng cách rất xa."
 BIO_PLASMA_THROWER_SMALL: "$BIO_PLASMA_THROWER$"
 BIO_PLASMA_THROWER_MEDIUM: "$BIO_PLASMA_THROWER$"
 BIO_PLASMA_THROWER_LARGE: "$BIO_PLASMA_THROWER$"
 BIO_PLASMA_THROWER_EXTRA_LARGE: "$BIO_PLASMA_THROWER$"
 BIO_PLASMA_ACCELERATOR: "Pháo Gia Tốc Plasma Sinh Học"
 BIO_PLASMA_ACCELERATOR_DESC: "Các cơ quan gia tốc hữu cơ được cải tiến giúp tăng tầm bắn và ngăn rò rỉ plasma, cho phép nó bắn ra những phát đạn nhanh hơn và có sức phá hoại lớn hơn."
 BIO_PLASMA_ACCELERATOR_SMALL: "$BIO_PLASMA_ACCELERATOR$"
 BIO_PLASMA_ACCELERATOR_MEDIUM: "$BIO_PLASMA_ACCELERATOR$"
 BIO_PLASMA_ACCELERATOR_LARGE: "$BIO_PLASMA_ACCELERATOR$"
 BIO_PLASMA_ACCELERATOR_EXTRA_LARGE: "$BIO_PLASMA_ACCELERATOR$"
 BIO_PLASMA_CANNON: "Pháo Plasma Sinh Học"
 BIO_PLASMA_CANNON_DESC: "Việc tăng cường nồng độ plasma do sinh vật tự tạo ra giúp nó có thể bắn ra những phát đạn có sức tàn phá kinh hoàng."
 BIO_PLASMA_CANNON_SMALL: "$BIO_PLASMA_CANNON$"
 BIO_PLASMA_CANNON_MEDIUM: "$BIO_PLASMA_CANNON$"
 BIO_PLASMA_CANNON_LARGE: "$BIO_PLASMA_CANNON$"
 BIO_PLASMA_CANNON_EXTRA_LARGE: "$BIO_PLASMA_CANNON$"
 PARTICLE_BEAM: "Tia Hạt"
 PARTICLE_BEAM_DESC: "Một dạng đột biến xâm lấn tạo ra các cơ quan phóng năng lượng hữu cơ, hy sinh một phần khả năng cơ động để đổi lấy sức sát thương hủy diệt ở khoảng cách cực xa."
 PARTICLE_BEAM_SMALL: "$PARTICLE_BEAM$"
 PARTICLE_BEAM_MEDIUM: "$PARTICLE_BEAM$"
 PARTICLE_BEAM_LARGE: "$PARTICLE_BEAM$"
 PARTICLE_BEAM_EXTRA_LARGE: "$PARTICLE_BEAM$"
 TACHYON_BEAM: "Tia Tachyon"
 TACHYON_BEAM_DESC: "Các cơ quan phóng năng lượng hữu cơ có thể được cô đặc thành một ngọn giáo ánh sáng sinh học duy nhất, cho phép sinh vật bắn ra chùm tia tachyon cực kỳ mạnh mẽ."
 TACHYON_BEAM_SMALL: "$TACHYON_BEAM$"
 TACHYON_BEAM_MEDIUM: "$TACHYON_BEAM$"
 TACHYON_BEAM_LARGE: "$TACHYON_BEAM$"
 TACHYON_BEAM_EXTRA_LARGE: "$TACHYON_BEAM$"
 SHARP_EYE_LASER: "Laser Mắt Cắt"
 SHARP_EYE_LASER_DESC: "Lấy cảm hứng từ laser cắt của máy bay không người lái khai khoáng, đột biến này tạo ra một loại tia mắt chuyên dùng để chọc thủng vỏ thân tàu ở cự ly gần."
 SHARP_EYE_LASER_SMALL: "$SHARP_EYE_LASER$"
 SHARP_EYE_LASER_MEDIUM: "$SHARP_EYE_LASER$"
 SHARP_EYE_LASER_LARGE: "$SHARP_EYE_LASER$"
 SHARP_EYE_LASER_EXTRA_LARGE: "$SHARP_EYE_LASER$"
 PROTON_THROWER: "Súng Phun Proton"
 PROTON_THROWER_DESC: "Đột biến này cho phép sinh vật tạo ra lượng proton đậm đặc làm đạn bắn có sức công phá lớn. Tuy nhiên, quá trình tích tụ năng lượng có thể hơi lâu."
 PROTON_THROWER_SMALL: "$PROTON_THROWER$"
 PROTON_THROWER_MEDIUM: "$PROTON_THROWER$"
 PROTON_THROWER_LARGE: "$PROTON_THROWER$"
 PROTON_THROWER_EXTRA_LARGE: "$PROTON_THROWER$"
 NEUTRON_THROWER: "Súng Phun Neutron"
 NEUTRON_THROWER_DESC: "Nhờ khả năng sử dụng neutron nặng hơn để thay thế proton, loại đạn đậm đặc này trở nên có sức tàn phá khủng khiếp hơn."
 NEUTRON_THROWER_SMALL: "$NEUTRON_THROWER$"
 NEUTRON_THROWER_MEDIUM: "$NEUTRON_THROWER$"
 NEUTRON_THROWER_LARGE: "$NEUTRON_THROWER$"
 NEUTRON_THROWER_EXTRA_LARGE: "$NEUTRON_THROWER$"
 BIO_DISINTEGRATOR: "Máy Phân Rã Sinh Học"
 BIO_DISINTEGRATOR_DESC: "Mô phỏng lại sức mạnh của Máy Phân Rã Vật Chất của phe Kẻ Xuyên Không, sinh vật được trang bị loại vũ khí này có thể dễ dàng nghiền nát kẻ thù thành các nguyên tử cơ bản."
 BIO_DISINTEGRATOR_SMALL: "$BIO_DISINTEGRATOR$"
 BIO_DISINTEGRATOR_MEDIUM: "$BIO_DISINTEGRATOR$"
 BIO_DISINTEGRATOR_LARGE: "$BIO_DISINTEGRATOR$"
 BIO_DISINTEGRATOR_EXTRA_LARGE: "$BIO_DISINTEGRATOR$"
 MOLECULAR_DISRUPTOR: "Pháo Nhiễu Loạn Phân Tử"
 MOLECULAR_DISRUPTOR_DESC: "Vũ khí sinh học này có thể bỏ qua các lớp phòng thủ thông thường để tấn công thẳng vào các nguyên tử cấu tạo nên mục tiêu, phá vỡ các liên kết hóa học và gây ra sát thương chí mạng cho thân tàu."
 MOLECULAR_DISRUPTOR_SMALL: "$MOLECULAR_DISRUPTOR$"
 MOLECULAR_DISRUPTOR_MEDIUM: "$MOLECULAR_DISRUPTOR$"
 MOLECULAR_DISRUPTOR_LARGE: "$MOLECULAR_DISRUPTOR$"
 MOLECULAR_DISRUPTOR_EXTRA_LARGE: "$MOLECULAR_DISRUPTOR$"
 ION_MOLECULAR_DISRUPTOR: "Pháo Nhiễu Loạn Phân Tử Ion"
 ION_MOLECULAR_DISRUPTOR_DESC: "Vũ khí sinh học này phát ra một luồng ion dữ dội, gia tăng lượng sát thương đầu ra mà không phải hy sinh tốc độ bắn."
 ION_MOLECULAR_DISRUPTOR_SMALL: "$ION_MOLECULAR_DISRUPTOR$"
 ION_MOLECULAR_DISRUPTOR_MEDIUM: "$ION_MOLECULAR_DISRUPTOR$"
 ION_MOLECULAR_DISRUPTOR_LARGE: "$ION_MOLECULAR_DISRUPTOR$"
 ION_MOLECULAR_DISRUPTOR_EXTRA_LARGE: "$ION_MOLECULAR_DISRUPTOR$"
 PHASED_MOLECULAR_DISRUPTOR: "Pháo Nhiễu Loạn Phân Tử Pha"
 PHASED_MOLECULAR_DISRUPTOR_DESC: "Vũ khí sinh học cực kỳ tiên tiến này có thể bắn ra một luồng năng lượng lượng tử không thể cản phá, sở hữu khả năng vô song trong việc xé toạc các liên kết hóa học trên mục tiêu xấu số."
 PHASED_MOLECULAR_DISRUPTOR_SMALL: "$PHASED_MOLECULAR_DISRUPTOR$"
 PHASED_MOLECULAR_DISRUPTOR_MEDIUM: "$PHASED_MOLECULAR_DISRUPTOR$"
 PHASED_MOLECULAR_DISRUPTOR_LARGE: "$PHASED_MOLECULAR_DISRUPTOR$"
 PHASED_MOLECULAR_DISRUPTOR_EXTRA_LARGE: "$PHASED_MOLECULAR_DISRUPTOR$"
 LIGHTNING_BREATH: "Hơi Thở Sấm Sét"
 LIGHTNING_BREATH_DESC: "Việc sử dụng các ống dẫn điện sinh học để biến đổi hệ hô hấp hiện tại cho phép sinh vật có khả năng \"thở\" ra những tia hồ quang điện có sức xuyên thấu."
 LIGHTNING_BREATH_SMALL: "$LIGHTNING_BREATH$"
 LIGHTNING_BREATH_MEDIUM: "$LIGHTNING_BREATH$"
 LIGHTNING_BREATH_LARGE: "$LIGHTNING_BREATH$"
 LIGHTNING_BREATH_EXTRA_LARGE: "$LIGHTNING_BREATH$"
 LIGHTNING_EMITTER: "Nguồn Phát Sấm Sét"
 LIGHTNING_EMITTER_DESC: "Việc tích hợp thêm nhiều ống dẫn điện sinh học cho phép sinh vật điều khiển những luồng hồ quang điện cực kỳ hung bạo."
 LIGHTNING_EMITTER_SMALL: "$LIGHTNING_EMITTER$"
 LIGHTNING_EMITTER_MEDIUM: "$LIGHTNING_EMITTER$"
 LIGHTNING_EMITTER_LARGE: "$LIGHTNING_EMITTER$"
 LIGHTNING_EMITTER_EXTRA_LARGE: "$LIGHTNING_EMITTER$"
 FOCUSED_LIGHTNING_EMITTER: "Tia Sấm Sét Tập Trung"
 FOCUSED_LIGHTNING_EMITTER_DESC: "Việc ổn định các cơ quan phát điện đột biến giúp tăng độ chính xác và cường độ, biến những tia sét hoang dại thành những chùm tia điện phá hoại cực kỳ chuẩn xác."
 FOCUSED_LIGHTNING_EMITTER_SMALL: "$FOCUSED_LIGHTNING_EMITTER$"
 FOCUSED_LIGHTNING_EMITTER_MEDIUM: "$FOCUSED_LIGHTNING_EMITTER$"
 FOCUSED_LIGHTNING_EMITTER_LARGE: "$FOCUSED_LIGHTNING_EMITTER$"
