 ADVANCED_SHARD_RAIL_ACCELERATOR_DESC: "Các phần phụ tạo điện được bổ sung giúp tăng cường điện tích cho pháo ray, đẩy nhanh tốc độ đạn và nâng cao sức sát thương."
 ADVANCED_SHARD_RAIL_ACCELERATOR_SMALL: "$ADVANCED_SHARD_RAIL_ACCELERATOR$"
 ADVANCED_SHARD_RAIL_ACCELERATOR_MEDIUM: "$ADVANCED_SHARD_RAIL_ACCELERATOR$"
