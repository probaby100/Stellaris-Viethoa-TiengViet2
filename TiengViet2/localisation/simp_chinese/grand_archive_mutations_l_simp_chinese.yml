 SHARD_GAUSS_ACCELERATOR: "Pháo Gauss Mảnh Xương"
 SHARD_GAUSS_ACCELERATOR_DESC: "Những phần phụ cuộn xoắn phức tạp có thể tích tụ một lượng điện sinh học khổng lồ, dùng để bắn đạn với tốc độ không gì sánh kịp."
 SHARD_GAUSS_ACCELERATOR_SMALL: "$SHARD_GAUSS_ACCELERATOR$"
 SHARD_GAUSS_ACCELERATOR_MEDIUM: "$SHARD_GAUSS_ACCELERATOR$"
 SHARD_GAUSS_ACCELERATOR_LARGE: "$SHARD_GAUSS_ACCELERATOR$"
 SHARD_GAUSS_ACCELERATOR_EXTRA_LARGE: "$SHARD_GAUSS_ACCELERATOR$"
 THORN_CANNON: "Pháo Gai"
 THORN_CANNON_DESC: "Các lỗ chân lông được bổ sung có thể phun ra những mảnh xương cứng bọc trong chất lỏng dễ cháy nổ với tốc độ bắn đáng kinh ngạc."
 THORN_CANNON_SMALL: "$THORN_CANNON$"
