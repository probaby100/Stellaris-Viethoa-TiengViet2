 CHITIN_BATTERY: "Khẩu Đội Kitin"
 CHITIN_BATTERY_DESC: "Đột biến này tuy cồng kềnh nhưng có khả năng hình thành những thanh kitin đặc và bắn chúng với tốc độ cao từ khoảng cách rất xa."
