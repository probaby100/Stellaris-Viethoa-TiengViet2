 NANITE_INFUSED_THORN_CANNON_DESC: "Những khẩu pháo gai này sử dụng các nanite có khả năng tự nhân bản thay cho đạn hữu cơ, có thể giải phóng một xung điện từ tầm ngắn và xuyên thủng mọi loại vật liệu."
