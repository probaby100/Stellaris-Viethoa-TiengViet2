 RIPPER_THORN_CANNON_LARGE: "$RIPPER_THORN_CANNON$"
 RIPPER_THORN_CANNON_EXTRA_LARGE: "$RIPPER_THORN_CANNON$"
 ACIDSTORM_THORN_CANNON: "Pháo Gai Bão Axit"
 ACIDSTORM_THORN_CANNON_DESC: "Việc gia tăng mạnh nồng độ của chất lỏng dễ nổ cho phép cơn mưa mảnh xương có thể xuyên thủng lớp khiên, ăn mòn kim loại và xé nát xác thịt với hiệu suất kinh hoàng."
