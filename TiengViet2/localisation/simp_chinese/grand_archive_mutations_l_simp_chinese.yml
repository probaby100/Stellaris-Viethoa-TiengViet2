 CHITIN_BATTERY_LARGE: "$CHITIN_BATTERY$"
 CHITIN_BATTERY_EXTRA_LARGE: "$CHITIN_BATTERY$"
 CHITIN_ARTILLERY: "Pháo Binh Kitin"
 CHITIN_ARTILLERY_DESC: "Các phần phụ hỗ trợ bổ sung giúp tăng sơ tốc đầu nòng và độ ổn định, qua đó tăng cường sức mạnh cho khẩu pháo hữu cơ."
