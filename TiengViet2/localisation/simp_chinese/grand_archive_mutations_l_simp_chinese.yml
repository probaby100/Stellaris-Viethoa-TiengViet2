 BIO_COIL_SHARD_ACCELERATOR_DESC: "Cấu trúc cuộn của các nơ-ron thần kinh điện giúp tăng cường khả năng phóng tĩnh điện, cho phép sinh vật bắn ra các mảnh xương nhiễm từ với sơ tốc đầu nòng nhanh hơn."
