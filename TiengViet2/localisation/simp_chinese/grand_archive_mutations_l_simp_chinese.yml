 THORN_CANNON_LARGE: "$THORN_CANNON$"
 THORN_CANNON_EXTRA_LARGE: "$THORN_CANNON$"
 RIPPER_THORN_CANNON: "Pháo Gai Xé Xác"
 RIPPER_THORN_CANNON_DESC: "Việc kéo dài các vòi phun và cải tiến cấu trúc mảnh xương giúp cho những khẩu pháo gai này bắn ra một cơn mưa đạn dễ nổ và chí mạng hơn."
 RIPPER_THORN_CANNON_SMALL: "$RIPPER_THORN_CANNON$"
