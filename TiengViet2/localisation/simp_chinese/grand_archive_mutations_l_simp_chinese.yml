 ENERGY_SIPHON: "Ống Hút Năng Lượng"
 ENERGY_SIPHON_DESC: "Bắt nguồn từ vũ khí tự nhiên của Tiyanki, biến dị này có thể phát triển thêm một cơ quan có khả năng hút cạn năng lượng của kẻ địch xung quanh."
 ENERGY_SIPHON_SMALL: "$ENERGY_SIPHON$"
 ENERGY_SIPHON_MEDIUM: "$ENERGY_SIPHON$"
 ENERGY_SIPHON_LARGE: "$ENERGY_SIPHON$"
 ENERGY_SIPHON_EXTRA_LARGE: "$ENERGY_SIPHON$"
 NULL_VOID_SIPHON: "Ống Hút Hư Vô"
 NULL_VOID_SIPHON_DESC: "Là một dạng tiến hóa từ vũ khí tự nhiên của Amip Không Gian, cơ quan này có thể bắn ra tia sáng hư vô, sở hữu khả năng độc đáo dùng entropy để triệt tiêu một lượng năng lượng tương đương."
 NULL_VOID_SIPHON_SMALL: "$NULL_VOID_SIPHON$"
 NULL_VOID_SIPHON_MEDIUM: "$NULL_VOID_SIPHON$"
 NULL_VOID_SIPHON_LARGE: "$NULL_VOID_SIPHON$"
 NULL_VOID_SIPHON_EXTRA_LARGE: "$null_void_siphon$"
 SHARD_ACCELERATOR: "Pháo Gia Tốc Mảnh Xương"
 SHARD_ACCELERATOR_DESC: "Pháo Gia Tốc Mảnh Xương vũ khí hóa thế năng tĩnh điện, bắn ra những mảnh xương nhiễm từ với tốc độ cực nhanh."
 SHARD_ACCELERATOR_SMALL: "$SHARD_ACCELERATOR$"
 SHARD_ACCELERATOR_MEDIUM: "$SHARD_ACCELERATOR$"
 SHARD_ACCELERATOR_LARGE: "$SHARD_ACCELERATOR$"
 SHARD_ACCELERATOR_EXTRA_LARGE: "$SHARD_ACCELERATOR$"
