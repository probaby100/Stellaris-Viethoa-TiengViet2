l_simp_chinese:
 ### Vật thể Môi trường
 NAME_Syzygy_Remains: "Tàn tích Syzygy"
 ### CHUỖI SỰ KIỆN
 WORM_CHAIN_1_title: "Sâu Thời Gian: Tín hiệu"
 WORM_CHAIN_1_desc: "Một thực thể vô danh đang cố gắng tiếp cận chúng ta, tiếng thì thầm của nó vọng lại từ một nơi mà không gian và thời gian xoắn lại thành những nút thắt.\n\nNó khao khát chúng ta, nó yêu chúng ta say đắm."
 WORM_CHAIN_2_title: "Sâu Thời Gian: Điềm báo"
 WORM_CHAIN_2_desc: "Thời gian không thể chảy ngược, đó là điều chắc chắn. Truyền thuyết về một con rắn khổng lồ quấn quanh vũ trụ, lén lút dòm ngó bằng đôi mắt to hơn cả hành tinh mẹ của chúng ta, cũng chỉ là chuyện nhảm nhí. Tuy nhiên, dạo gần đây, ngày càng có nhiều chuyện nhảm nhí như vậy biến thành sự thật."
 ### CHỈ SỐ CỐ ĐỊNH
 happy_with_open_loop_temple: "Đền thờ Vòng Lặp: Trung tâm Du khách"
 happy_with_open_loop_temple_desc: "Những nhân viên nhiệt tình và được đào tạo bài bản đang dẫn dắt du khách, dưới ánh đèn pha rọi qua những tấm bảng phát sáng cổ xưa, trên tường treo đầy các biển chỉ dẫn."
 spiritual_happy_with_open_loop_temple: "Đền thờ Vòng Lặp: Con đường Hành hương"
 spiritual_happy_with_open_loop_temple_desc: "Một lần nữa, xen lẫn tiếng thì thầm, hành lang xây bằng đá bazan lại vang vọng những bước chân vội vã và lời cầu nguyện của những người hành hương."
 waiting_world_ruins: "Đống đổ nát Tịch Liêu"
 waiting_world_ruins_desc: "Gió rít gào qua những đống đổ nát. Nơi này vắng bóng người qua lại."
 d_mothballed_facilities: "£blocker£Cơ sở bị Niêm phong"
 d_mothballed_facilities_desc: "Những khu vực và tòa nhà này được xây dựng theo tiêu chuẩn thuộc địa mới nhất, nhưng rõ ràng đã bị bỏ hoang nhiều năm và không được bảo trì đàng hoàng."
 loop_debris_01_object: "Di tích Tín hiệu Chân trời"
 loop_debris_02_object: "Khoang Xoắn ốc"
 worm_quarantined: "Cách ly Khỏi Thế giới"
 worm_quarantined_desc: "Bạn có thể chiếm lấy cả dải ngân hà — nhưng duy nhất nơi này không cho phép bạn chạm tay vào."
 worm_manifestation: "Ánh nhìn Chằm chằm"
 worm_manifestation_desc: "Nơi nào có Vòng Lặp, nơi đó có bóng hình đi theo."
 ### CÔNG NGHỆ
 tech_akx_worm_1: "Đệ quy Entropy"
 tech_akx_worm_1_desc: "Vũ trụ dường như không thể tránh khỏi việc tiến về phía trước. Xu hướng này không thể đảo ngược... nhưng chỉ cần trả một cái giá đủ đắt, giờ đây mọi thứ đều có thể bị lật đổ."
 tech_akx_worm_2: "Học thuyết: Vòng lặp Kỳ dị"
 tech_akx_worm_2_desc: "Đây là một hệ thống quy tắc xã hội dựa trên những trực giác mâu thuẫn, và cả tình yêu. Khi chúng ta thấu hiểu chân lý của Vòng Lặp, chúng ta nhận ra rằng, dù là ra lệnh hay nhận lệnh, chúng ta đều có thể tác động đến nó."
 tech_akx_worm_3: "Lý thuyết Omega"
 tech_akx_worm_3_desc: "Khi các nghịch lý thời gian bắt đầu đan xen, một ý thức khó tả dần thức tỉnh trong màn đêm sâu thẳm, nó khao khát, nó đòi hỏi. Mọi chuyện xảy ra trước đây đều do ý thức này — thứ mà một số người gọi là 'Sâu Thời Gian' — gây ra. Nếu chúng ta có thể đồng điệu bản thân với ý thức này, có lẽ chúng ta sẽ chạm đến cánh cửa của sự bất tử."
 TECH_UNLOCK_AKX_WORM_3_TITLE: "$tech_akx_worm_3$"
 TECH_UNLOCK_AKX_WORM_3_DESC: "$tech_akx_worm_3_desc$"
 tech_akx_worm_partial_custom: "§HCái nhìn vào Tương lai:§!$tech_akx_worm_3$"
 tech_akx_worm_partial_custom_desc: "§HCái nhìn vào Tương lai§!\nChợt lóe sáng, cảnh tượng đã qua và điềm báo sắp tới đan xen vào nhau.\n\nHai phần thông tin, nếu đứng riêng lẻ thì đều vô dụng. Tuy nhiên, một khi các mảnh ghép được ráp lại, các nhà khoa học của chúng ta có lẽ sẽ tiến thêm một bước để đạt được đột phá công nghệ §H$tech_akx_worm_3$§!"
 ### CÔNG TRÌNH
 building_akx_worm_1: "Lõi Năng lượng Xoắn ốc"
 building_akx_worm_1_desc: "Bằng cách áp dụng một số công nghệ vật lý hoàn toàn vượt ra ngoài lẽ thường, chúng ta có thể tăng đáng kể sản lượng năng lượng của hành tinh. Công nghệ này được cho là có liên quan đến những ảo giác rơi tự do."
 building_akx_worm_2: "Học viện Vòng Lặp"
 building_akx_worm_2_desc: "Sự dẫn dắt của Vòng Lặp khuyến khích trực giác, sự phục tùng và những trải nghiệm giác quan."
 building_akx_worm_3: "Thiết bị Đồng điệu Omega"
 building_akx_worm_3_desc: "Bề mặt của vật thể này hướng thẳng lên bầu trời. Cấu trúc bên trong của nó lại không thể bị quan sát bằng bất kỳ công nghệ dò tìm hay vẽ bản đồ nào. Tất nhiên, tất cả chúng ta đều biết bên trong có gì."
 requires_power_hub_absence: "§RBất kỳ $building_power_hub_1$ hay $building_power_hub_2$ nào hiện có trên hành tinh đều sẽ làm nhiễu loạn dòng chảy trường xoắn ốc giúp Lõi Năng lượng Xoắn ốc hoạt động bình thường.§!"
 building_worm_mine: "Mỏ Khoan Xoắn ốc"
 building_worm_mine_desc: "Những chiếc thang máy chật hẹp lao vút qua các đường hầm hầm mỏ xoắn ốc đan xen nhau."
 building_worm_farm: "Nông trại Vòng Lặp"
 building_worm_farm_desc: "Những cây trồng đung đưa trong gió."
 ### ĐẶC ĐIỂM
 leader_trait_foredoomed_to_a_rendezvous: "Cuộc Gặp Gỡ Định Mệnh"
 leader_trait_foredoomed_to_a_rendezvous_desc: "Người này đã chứng kiến tương lai đầy bất an của chính mình."
 ####################
 ### DỰ ÁN ĐẶC BIỆT
 HORIZON_SIGNAL_PROJECT: "Phân tích Tín hiệu Chân trời"
 HORIZON_SIGNAL_PROJECT_DESC: "Điều động một tàu khoa học đến hệ sao [Root.GetStarName] để giải mã tín hiệu bí ẩn phát ra từ hố đen."
 LOOP_TEMPLE_PROJECT: "Khảo sát Đền thờ Vòng Lặp"
 LOOP_TEMPLE_PROJECT_DESC: "Thiết lập một dự án nghiên cứu để tìm hiểu thêm về Đền thờ Vòng Lặp — nguồn gốc và mục đích của nó."
 MESSENGER_POD_PROJECT_1: "Nghiên cứu Người Đưa Tin, cùng thông điệp được truyền tải"
 MESSENGER_POD_PROJECT_1_DESC: "Có lẽ chúng ta có thể tìm ra mối liên hệ giữa Người Đưa Tin và các sự kiện khác — biết đâu chúng ta còn có thể tìm ra một lời giải thích hợp lý."
 MESSENGER_POD_PROJECT_2_UNLEASHED: "Nghiên cứu mối liên hệ của Người Đưa Tin"
 MESSENGER_POD_PROJECT_2_UNLEASHED_DESC: "Những phát hiện ban đầu cho thấy Người Đưa Tin là một dạng trí tuệ bậc cao hơn, mặc dù cơ thể vật lý lại mỏng manh hơn."
 MESSENGER_POD_PROJECT_2_LEASHED: "Nghiên cứu mối liên hệ của Người Đưa Tin"
 MESSENGER_POD_PROJECT_2_LEASHED_DESC: "Những phát hiện ban đầu cho thấy Người Đưa Tin là một dạng sống mạnh khoẻ hơn chúng ta rất nhiều, và có khả năng là hung hăng hơn."
 COILS_GOD_PROJECT_DISRUPT: "Phá rối nghi thức Thần Vòng Lặp"
 COILS_GOD_PROJECT_DISRUPT_DESC: "Can thiệp, phá hoại, gieo rắc thông tin sai lệch. Phải dùng mọi thủ đoạn trong chừng mực cho phép."
 COILS_GOD_PROJECT_PREVENT: "Ngăn chặn nghi thức Thần Vòng Lặp"
 COILS_GOD_PROJECT_PREVENT_DESC: "Sử dụng các hành động bí mật như làm giả, bắt cóc, tẩy não, thậm chí là phóng hỏa và ám sát để ngăn chặn tà giáo: Chúng ta phải hành động nhanh chóng."
 COILS_GOD_PROJECT_PARTICIPATE: "Tham gia nghi thức Thần Vòng Lặp"
 COILS_GOD_PROJECT_PARTICIPATE_DESC: "Cử các nhà dân tộc học đến bề mặt hành tinh để quan sát cận cảnh nghi thức của Thần Vòng Lặp. Đây là một sự kiện văn hóa đáng chú ý! Chúng ta phải nghiên cứu càng nhiều càng tốt."
 WAITING_WORLD_DISAPPEARANCE: "Điều tra dân số mất tích"
 WAITING_WORLD_DISAPPEARANCE_DESC: "Trước đây đông đúc đến mức không chen chân lọt, bây giờ mọi người lại bốc hơi chỉ sau một đêm. Chuyện quái gì đã xảy ra vậy?"
 WAITING_WORLD_HYPERAPPEARANCE: "Điều tra... làm rõ xem chuyện gì đã xảy ra với những người này"
 WAITING_WORLD_HYPERAPPEARANCE_DESC: "Trước đây đông đúc đến mức không chen chân lọt, thế nhưng bây giờ dân số dường như đã bị thay thế hoàn toàn. Chuyện quái gì đã xảy ra vậy?"
 WAITING_WORLD_PURGE: "Thanh trừng tất cả các bản sao người ngoài hành tinh khả nghi"
 WAITING_WORLD_PURGE_DESC: "Cách duy nhất để xử lý sự kiện hoán đổi dân số bí ẩn trên [Root.GetName] là dùng pháo kích quỹ đạo san phẳng toàn bộ hành tinh."
 WORM_ENTRY_POINT: "Mở Cổng"
 WORM_ENTRY_POINT_DESC: "Kết luận từ Thuyết Omega cho thấy điểm kỳ dị thời gian mà chúng ta bắt gặp trước đây chính là nguyên nhân của toàn bộ sự kiện mà chúng ta gọi là 'Vòng Lặp', hay 'Sâu Thời Gian'. Tại đó, các nghịch lý đan xen vào nhau thành những nút thắt và cuối cùng ngưng tụ thành một thực thể có ý thức, một sự liên kết của dục vọng và ý chí nằm ngoài dòng thời gian. Khởi nguồn hay kết cục của nó — thật khó để dùng những từ ngữ như vậy để miêu tả, nhưng nó lại bị thu hút mãnh liệt bởi sự bắt đầu và sự kết thúc. Chúng ta có thể sử dụng Thiết bị Đồng điệu Omega để triệu hồi nó đến hệ sao quê nhà. Nếu chúng ta làm vậy, gần như chắc chắn sẽ có những điều ngoài ý muốn xảy ra. Làm vậy đồng nghĩa với rất nhiều hệ lụy, nhưng chúng ta phải làm thế, đây là sự khám phá của khoa học."
 HORIZON_DEBRIS_PROJECT: "Khảo sát mảnh vỡ tại gốc Tín hiệu Chân trời"
 HORIZON_DEBRIS_PROJECT_DESC: "Khi động cơ con tàu bị kích nổ, nó đã tạo ra một loạt các gợn sóng không thời gian xung quanh. Xác con tàu thể hiện những đặc tính không thời gian cực kỳ độc đáo."
 SYZYGY_DEBRIS_PROJECT: "Khảo sát xác tàu 'Syzygy'"
 SYZYGY_DEBRIS_PROJECT_DESC: "Tàu 'Syzygy' từng tồn tại ở một không thời gian khác. Một tương lai khác có thể xảy ra? Hay là một vũ trụ hoàn toàn mới? Chúng ta có thể rút ra được những kiến thức quý giá từ đó."
 ################################################
 ## THE HORIZON SIGNAL: Sự kiện mở đầu cho chuỗi Sâu Thời Gian
 akx.9000.name: "Tín hiệu Chân trời"
 akx.9000.desc: "Một sĩ quan thông tin tinh ý đã nhận ra những tín hiệu mờ nhạt này, dưới sự can nhiễu của tia gamma, chúng gần như không thể nhận ra khi đến đây từ hố đen — tín hiệu này tuy yếu ớt nhưng rõ ràng không phải do tự nhiên sinh ra. Hiện tượng này đã thu hút sự quan tâm của nhiều nhà khoa học."
 # Tạo dự án HORIZON_SIGNAL_PROJECT
 akx.9001.name: "Tín hiệu Chân trời: §HTrọng lực là Khát vọng§!"
 akx.9001.desc: "Chuyên viên khoa học [Root.GetLeaderName] báo cáo rằng việc giải mã tín hiệu này lại dễ dàng đến bất ngờ... nhưng đội của họ đã phải mất khá nhiều thời gian để xác minh đây không phải là một trò đùa lố bịch. Các đoạn văn bản lặp đi lặp lại, có mối liên hệ nhất định với ngôn ngữ [Root.Owner.GetAdj] — nghe giống như một bài thơ. Chúng lặp lại các cụm từ §HTrọng lực là Khát vọng§! và §HThời gian là Tầm nhìn§!. Tín hiệu này ẩn chứa tọa độ gần một hố đen, và kết thúc bằng một §Gchữ ký§! dành riêng cho vị chuyên viên khoa học của chúng ta — chuyên viên này đã xác nhận một cách khách quan rằng tín hiệu đã được phát vào không gian vũ trụ từ trước khi họ ra đời. Trên thực tế, tín hiệu này có thể còn cổ xưa hơn cả nền văn minh của chúng ta."
 akx.9001.a: "Thật hấp dẫn! Điều động tàu đến tọa độ đó."
 akx.a.tooltip: "Mở chuỗi sự kiện Tín hiệu Chân trời."
 akx.9001.b: "Đây hoặc là trò đùa, hoặc là một cái bẫy. Ghi nhận lại rồi ngó lơ đi."
 akx.9001.b.tooltip: "Các công nghệ khám phá được khi phân tích tín hiệu sẽ được áp dụng cho nghiên cứu vật lý."
 akx.9005.name: "Tín hiệu Chân trời: §HSâu Thời Gian§!"
 akx.9005.desc: "Khi tàu [Root.GetName] đến gần tọa độ đính kèm tín hiệu, báo cáo của anh ta cho thấy không gian xung quanh bắt đầu xuất hiện những gợn sóng, hiện tượng thấu kính hấp dẫn kỳ lạ liên tục xảy ra — đây là những luồng dữ liệu phong phú và rất quan trọng. Ngay sau đó, tín hiệu liên lạc bắt đầu bị biến dạng, những gì chúng ta có thể làm chỉ là cố gắng hết sức để loại trừ các nguyên nhân gây nhiễu.\n\nTuy nhiên, giọng nói cuồng loạn của chuyên viên khoa học [horizonsignal_firstleader.GetName] trong điều kiện ngày càng kỳ quái của con tàu, càng phủ thêm một bóng đen kinh hoàng lên toàn bộ sự kiện. Con tàu đã phát tín hiệu cấp cứu. [horizonsignal_firstleader.GetName] hét lớn 'Con sâu!' — hoặc, có thể là, §Hcon sâu đó§!! Sau đó mọi liên lạc hoàn toàn bị cắt đứt. Dấu vết của [Root.GetName] đã hoàn toàn biến mất — không có thêm tín hiệu truyền tải, không có mảnh vỡ, không gian quanh tọa độ phẳng lặng như mặt biển đêm tĩnh mịch. Nhưng những dữ liệu họ truyền về đã thúc đẩy mạnh mẽ nghiên cứu vật lý của chúng ta. Có lẽ sự hy sinh của họ không uổng phí."
 akx.9005.a.spiritualist: "Ánh sáng thai nghén bóng tối, bóng tối cũng bao trùm ánh sáng."
 akx.9005.a.materialist: "Chỉ có học hỏi mới có thể tiến bộ."
 akx.9005.a.neutral: "Chúng ta sẽ ghi nhớ sự hy sinh của họ."
 akx.9006.name: "Tín hiệu Chân trời: - Kết thúc thông điệp -"
 akx.9006.desc: "[horizonsignal_firstleader.GetName] phối hợp với công việc của chúng ta với một thái độ miễn cưỡng nhưng lại như trút được gánh nặng. Báo cáo nhận thức của những người liên quan sau đó cho thấy họ bị chi phối bởi những ảo giác vô tận — những mê cung không tồn tại, cơn chóng mặt ập đến trong không gian vô tận, liên tục bị gọi tên trong bóng tối. Cuối cùng, sau một năm trên hành tinh mẹ, tín hiệu đã biến mất."
 akx.9006.a: "Chúng ta vừa thoát được một kiếp nạn."
 akx.9006.b: "Chúng ta đã bỏ lỡ một cơ hội tốt."
 akx.9010.name: "Tín hiệu Chân trời: §HBí ẩn Tái hiện§!"
 akx.9010.desc: "Hố đen trong hệ sao [horizonsignal_system.GetName] lại một lần nữa hoạt động. Giống như trước, một tín hiệu phát vòng lặp liên tục nhấp nháy ở rìa không gian thông thường. Nhưng điểm khác biệt lần này là, bên trong tín hiệu có một đoạn mã âm thanh. Nghe giống hệt như giọng của [horizonsignal_firstleader.GetName]. 'Chuyện đã làm, rồi sẽ làm lại', [horizonsignal_firstleader.GetName] ngâm xướng, 'chuyện sắp làm, ắt đã làm rồi.' Sau đó, tọa độ giống hệt lúc tín hiệu đầu tiên xuất hiện lại hiện ra, tại đúng tọa độ mà [horizonsignal_firstleader.GetName] mất tích — giới truyền thông gọi đó là 'Điểm thoát'. Tiếp đó, tín hiệu nhắc đến một cái tên mới: §G[horizonsignal_secondleader.GetName]§!."
 akx.9010.a.collective: "Phái [horizonsignal_secondleader.GetName] đến Điểm thoát."
 akx.9010.a.tooltip: "§H[horizonsignal_secondleader.GetName]§! sẽ đến Điểm thoát trong vòng §Y30 ngày§!."
 akx.9010.a.collective.tooltip: "Nếu họ một đi không trở lại, chúng ta sẽ ghi nhớ sự hy sinh của họ."
 akx.9010.a.notcollective: "[horizonsignal_secondleader.GetName] tự nguyện đi. Cho phép."
 akx.9010.b.collective: "Phái người đó đi, nhưng phải cài thiết bị nổ vào động cơ tàu."
 akx.9010.b.notcollective: "Cho phép họ đi, nhưng phải cài thiết bị nổ vào động cơ tàu."
 akx.9010.c: "Lần này thì không được. Cứ phớt lờ đi."
 akx.9011.name: "Tín hiệu Chân trời: Chuyến đi Bất tận"
 akx.9011.desc: "Lần này, con tàu hoàn toàn bay ở chế độ lái tự động. [horizonsignal_secondleader.GetName] là thành viên duy nhất trên tàu. Khi người này đến gần Điểm thoát, các máy đo từ xa tràn ngập những dữ liệu hấp dẫn. Một lần nữa, không gian bị bẻ cong, những gợn sóng khổng lồ sinh ra từ trọng lực xé toạc không thời gian. [horizonsignal_secondleader.GetName] điềm tĩnh đọc dữ liệu và điều chỉnh thiết bị đo từ xa. Đội giám sát thở phào nhẹ nhõm: may mắn là lần này chúng ta đã cử một chuyên gia. Tuy nhiên, khi có người nhận ra điều gì sắp xảy ra thì mọi chuyện đã quá muộn.\n\n[horizonsignal_secondleader.GetName] không thèm để ý đến những dữ liệu này nữa: người này đã bắt đầu đưa ra các dự đoán. Dữ liệu đo từ xa bắt đầu không khớp với dự đoán, nhưng chỉ vài giây sau, nó lại hoàn toàn khớp lại. Khi đội giám sát báo cáo rằng khoảng thời gian của các dự báo đang giãn ra, [horizonsignal_secondleader.GetName] kinh ngạc nói: 'Tôi đã qua đó rồi.'\n\n'Nơi này tối om,' họ nói thêm, 'nhưng không sao. Chúng ta có thể sống trong bóng tối. Tôi chưa bao giờ nghĩ lại có thể như thế này. Nhưng dĩ nhiên, nếu Sâu Thời Gian ban cho chúng ta tình yêu của nó, chúng ta sẽ được bất tử — '\n\nĐúng lúc đó, tín hiệu đứt đoạn, và con tàu biến mất khỏi các cảm biến của chúng ta."
 akx.9011.a: "Thật đáng sợ."
 akx.9011.b: "Thật đáng tiếc."
 akx.9011.c: "Thật hấp dẫn."
 akx.9012.name: "Tín hiệu Chân trời: Can thiệp Khẩn cấp"
 akx.9012.desc: "Lần này, [horizonsignal_secondleader.GetName] là người duy nhất trên tàu. Con tàu hoàn toàn bay ở chế độ lái tự động... và hệ thống của nó được thiết lập để phát nổ ngay lập tức nếu gặp tình huống giống con tàu mất tích trước đó. Khi tàu đến gần Điểm thoát, luồng thiết bị đo từ xa tràn ngập một lượng lớn dữ liệu bắt mắt. Một lần nữa, không gian bị bẻ cong, trọng lực kéo dãn không thời gian. [horizonsignal_secondleader.GetName] điềm tĩnh đọc dữ liệu, hoàn toàn trùng khớp với kết quả đo từ xa. Nhóm giám sát thở phào: chúng ta đã cử đi một chuyên gia. Đáng tiếc, khi có người nhận ra điều gì sắp xảy ra thì mọi chuyện đã quá muộn.\n\n[horizonsignal_secondleader.GetName] lúc này không phải đang đọc những dữ liệu đó: người này đã bắt đầu dự đoán dữ liệu. Dữ liệu từ xa bắt đầu không khớp với giá trị dự đoán, nhưng chỉ vài giây sau, nó lại hoàn toàn khớp với nhau. Ngay khi nhóm giám sát báo cáo rằng khoảng cách dự đoán đang ngày một tăng, cảm biến phát hiện một đợt tăng vọt năng lượng.\n\nCon tàu đã bị kích nổ: một quả cầu lửa bùng lên giữa bầu trời sao, sau đó nhanh chóng vụt tắt vào bóng đêm của [horizonsignal_system.GetName]. Bất kể chúng ta có gặp phải thứ gì ở đó, thực thể đó sẽ phải hối hận vì đã lôi chúng ta xuống nước. Tuy nhiên, chúng ta sẽ vĩnh viễn không bao giờ biết được sự thật. Tín hiệu Chân trời không bao giờ xuất hiện nữa. Nhóm của chúng ta có lẽ sẽ tìm thấy manh mối nào đó trong các mảnh vỡ của con tàu."
 ## Tạo dự án HORIZON_DEBRIS_PROJECT
 akx.9012.a: "Dù vậy, chuyện này có lẽ không kết thúc dễ dàng thế đâu."
 akx.9013.name: "Tín hiệu Chân trời: - Kết thúc thông điệp -"
 akx.9013.desc: "[horizonsignal_secondleader.GetName] phối hợp với công việc của chúng ta với thái độ như trút được gánh nặng. Báo cáo nhận thức của những người liên quan sau đó cho thấy họ bị chi phối bởi những ảo giác vô tận — những mê cung không tồn tại, cơn chóng mặt ập đến trong không không gian vô tận, liên tục bị gọi tên trong bóng tối. Tuy nhiên, sau một năm, mọi thứ đã chấm dứt."
 akx.9013.a: "Một cơ hội bị bỏ lỡ."
 akx.9013.b: "Cửu tử nhất sinh."
 akx.9020.name: "Tín hiệu Chân trời: §HQuá Tam Ba Bận§!"
 akx.9020.desc: "Lại một lần nữa, Tín hiệu Chân trời từ [horizonsignal_system.GetName] được kích hoạt. Lần này cường độ còn mạnh hơn. Lại một lần nữa, thông tin truyền tải chứa tọa độ của Điểm thoát. Nó cũng đính kèm khóa liên lạc cá nhân của [horizonsignal_firstleader.GetName] và [horizonsignal_secondleader.GetName]. Nhưng lần này khác, tín hiệu lần này là một đoạn thơ tình được tạo ra từ một chương trình văn bản biên dịch bằng ngôn ngữ lập trình cổ — những vần thơ tình này chan chứa tình cảm dành cho [horizonsignal_thirdleader.GetName].\n\nNói thật, những bài thơ tình này khiến người ta sởn gai ốc. Nhưng sự thật là, các nhà khoa học của chúng ta đều nhất trí rằng, dùng lập trình để làm thơ tình là một việc rất khó, và việc một hố đen gửi thư tình thì đúng là chuyện vô tiền khoáng hậu."
 akx.9020.a: "Thôi được, người ta đã có lòng thì cứ phái [horizonsignal_thirdleader.GetName] đi."
 akx.9020.a.tooltip: "§H[horizonsignal_thirdleader.GetName]§! sẽ đến Điểm thoát trong vòng §Y30 ngày§!."
 akx.9020.b: "Cử [horizonsignal_thirdleader.GetName] đi, đồng thời gắn thiết bị nổ vào động cơ tàu."
 akx.9020.c: "Toàn bộ sự việc mang đầy vẻ quỷ dị và hoang đường tột độ. Bỏ qua đi."
 akx.9021.name: "Tín hiệu Chân trời: Khởi đầu của Sự Kết thúc"
 akx.9021.desc: "'Lần này tôi không về nữa đâu,' [horizonsignal_thirdleader.GetName] nói trong buổi họp tóm tắt trước lúc khởi hành, 'Tôi biết mình sẽ không trở lại. Nhưng tôi đã dự đoán được chuyện này từ lâu rồi. Thứ nằm trong hố đen kia đã đợi chúng ta rất lâu — tôi cảm thấy, từ trước khi tôi ra đời, chúng đã đợi tôi rồi.'\n\nLại một lần nữa, con tàu chỉ mang một phi hành gia tiến gần đến Điểm thoát. Lại một lần nữa, không gian xung quanh vặn vẹo như đang sôi sục. Lại một lần nữa, hệ thống cảm biến của chúng ta truyền về những dữ liệu khó tin. Nhưng lần này, [horizonsignal_thirdleader.GetName] lại vô cùng im lặng. Tín hiệu đo từ xa trở nên ngắt quãng, rồi chìm vào im lặng. Con tàu đã tới Điểm thoát. Môi trường xung quanh trở lại bình thường. Nhưng không có gì xảy ra cả.\n\nKhông có gì xảy ra? Nhóm giám sát thì thầm bực tức. Nhưng con tàu đã thay đổi... Thực ra, thứ chúng ta quan sát đã là một con tàu khác. Chúng ta nhận ra đó là tàu của [horizonsignal_firstleader.GetName], sau bao nhiêu năm mất tích, giờ lại từ từ trôi ra từ Điểm thoát. Đội thu hồi được cử đến phát hiện con tàu vẫn nguyên vẹn nhưng bên trong trống rỗng — các thành viên đã biến mất, không có dấu hiệu xô xát. Nhưng để lại một cuốn nhật ký có chữ ký của [horizonsignal_firstleader.GetName], với tiêu đề §HQuá khứ là Tương lai§!. Các nhà khoa học của chúng ta căng thẳng tiến hành điều tra. 'Điều này là không thể.' Một nhà khoa học lên tiếng. Người khác đáp lại: 'Mong là thực sự không thể.'"
 akx.9021.a: "Dù vậy, chuyện này có lẽ không kết thúc dễ dàng thế đâu."
 akx.9022.name: "Tín hiệu Chân trời: Can thiệp Khẩn cấp"
 akx.9022.desc: "'Lần này tôi không về nữa đâu,' người này nói trong buổi họp tóm tắt trước lúc khởi hành, 'Tôi biết mình sẽ không trở lại. Nhưng tôi đã dự đoán được chuyện này từ lâu rồi. Thứ nằm trong hố đen kia đã chờ chúng ta rất lâu — tôi cảm thấy, từ trước khi tôi ra đời, chúng đã đợi tôi rồi.'\n\nLại một lần nữa, con tàu chỉ có một phi hành gia tiến gần đến Điểm thoát. Lại một lần nữa, không gian xung quanh vặn vẹo như đang sôi sục. Lại một lần nữa, hệ thống cảm biến của chúng ta truyền về những dữ liệu khó tin. Nhưng lần này, [horizonsignal_thirdleader.GetName] lại vô cùng im lặng. Tín hiệu đo từ xa trở nên ngắt quãng...\n\nCon tàu lập tức bị kích nổ: một quả cầu lửa bùng lên giữa bầu trời sao, sau đó nhanh chóng vụt tắt vào bóng đêm của [horizonsignal_system.GetName]. Bất kể chúng ta có gặp phải thứ gì ở đó, thực thể đó sẽ phải hối hận vì đã lôi chúng ta vào rắc rối này. Tuy nhiên, chúng ta sẽ vĩnh viễn không bao giờ biết được sự thật. Tín hiệu Chân trời không bao giờ xuất hiện nữa. Nhóm của chúng ta có lẽ sẽ tìm thấy manh mối nào đó trong các mảnh vỡ của con tàu."
 ## Tạo dự án HORIZON_DEBRIS_PROJECT
 akx.9022.a: "Dù vậy, chuyện này có lẽ không kết thúc dễ dàng thế đâu."
 akx.9023.name: "Tín hiệu Chân trời: - Kết thúc thông điệp -"
 akx.9023.desc: "[horizonsignal_thirdleader.GetName] phối hợp với công việc của chúng ta với thái độ như trút được gánh nặng. Báo cáo nhận thức của những người liên quan sau đó cho thấy họ bị chi phối bởi những ảo giác vô tận — những mê cung không tồn tại, cơn chóng mặt ập đến trong không gian vô tận, liên tục bị gọi tên trong bóng tối. Tuy nhiên, một năm sau, mọi thứ đã chấm dứt."
 akx.9090.name: "Tín hiệu Chân trời: Nguyên nhân và Kết quả"
 akx.9090.desc: "Các quan sát viên của chúng ta báo cáo rằng ngay sát thời điểm [horizonsignal_secondleader.GetName] hy sinh, hố đen trong hệ sao [horizonsignal_system.GetName] đã có lúc được kích hoạt chớp nhoáng. Một đợt bùng nổ tín hiệu nhanh chóng nhưng khó hiểu. 'Như thể nó đang phát điên vậy,' một nhà quan sát có trí tưởng tượng phong phú nói thêm."
 akx.9090.a: "Chuyện này vẫn chưa xong đâu."
 akx.9091.name: "Tín hiệu Chân trời: Tưởng niệm"
 akx.9091.desc: "Các quan sát viên của chúng ta báo cáo rằng ngay sát thời điểm [horizonsignal_thirdleader.GetName] hy sinh, hố đen trong hệ sao [horizonsignal_system.GetName] đã có lúc được kích hoạt chớp nhoáng. Nó lại truyền đi chương trình thơ tình ban đầu, ba lần. 'Trông giống như,' một nhà quan sát có trí tưởng tượng phong phú nói thêm, 'bài bi ca do những người thân say xỉn hát trong đám tang.'"
 akx.9091.a: "Chuyện này vẫn chưa xong đâu."
 akx.9095.name: "Tín hiệu Chân trời: Bài học từ đống Tro tàn"
 akx.9095.desc: "Chúng ta đã tái tạo lại điều kiện gần giống với môi trường xung quanh hố đen. Chúng ta phát hiện ra rằng những mảnh vỡ thu hồi trước đó, theo một cách gần như bất khả thi, luân chuyển giữa các trạng thái khác nhau — như thể thời gian đang dao động giữa quá khứ và tương lai. Chúng ta có thể trích xuất một chút năng lượng từ đó — dù có người lo ngại điều này sẽ tác động xấu đến không thời gian tại khu vực."
 ########################################
 ## ĐỀN THỜ VÒNG LẶP: Phần tiếp nối
 akx.9100.name: "Đền thờ Vòng Lặp: Ký hiệu Bí ẩn trên Đá"
 akx.9100.desc: "Các nhà khảo cổ học đã phát hiện ra một ngôi đền bị lãng quên ở vùng cao nguyên hẻo lánh trên [Root.GetName] — bị chôn vùi trong nhiều thế kỷ, nhưng gần đây lại lộ diện do động đất. Kỹ thuật định tuổi chỉ ra rằng đây là một tàn tích từ thời kỳ tiền công nghiệp do loài [Owner.Species.GetHandName] đục đẽo. Tuy nhiên, các biểu tượng vòng lặp liên tục trên tường và bàn thờ hình tia — một con rắn ngậm đuôi Ouroboros giống hệt dải Möbius — không hề có tiền lệ nào trong lịch sử sơ khai của chúng ta, và trên bia đá còn dùng một hệ chữ viết không xác định. Một nhà khảo cổ phấn khích cho rằng tàn tích này do một giống loài tiên phong vô danh nào đó để lại.\n\nMặc dù có vẻ không liên quan, nhưng trận động đất dường như xảy ra cùng lúc với thời điểm hệ sao [horizonsignal_system.GetName] truyền đi thông điệp cuối cùng."
 # Tạo dự án LOOP_TEMPLE_PROJECT
 akx.9100.spiritual.a: "Một con đường đã mở ra cho chúng ta."
 akx.9100.neutral.a: "Điều này đáng để chúng ta nghiên cứu."
 akx.9100.b: "Điềm gở."
 akx.9101.name: "Đền thờ Vòng Lặp: Thời gian và Đá"
 akx.9101.desc: "Các nhà khoa học của chúng ta đã tiến hành điều tra sâu rộng về ngôi đền dưới lòng đất, nhưng vẫn còn một số vấn đề chưa thể lý giải. Trên phần mở rộng của bàn thờ hình sao có một cái hố trên mái nhà, chúng ta suy đoán nó từng được dùng như một đồng hồ mặt trời; nhưng do hư hại nặng sau trận động đất nên không thể xác định. Nếu nó được xây dựng vào một khoảnh khắc quan trọng nào đó, chúng ta có thể sẽ vĩnh viễn không bao giờ biết được thời điểm đó. Chúng ta lại khá may mắn ở khía cạnh 'hệ ngôn ngữ vô danh'. Đó là một bản thảo của các tu sĩ đã nhòe mờ vì thời gian nhưng rất nổi tiếng — hoàn toàn không phải ngôn ngữ ngoài hành tinh — và chúng ta đã giải mã thành công.\n\nNgôi đền này được dùng để thờ phụng 'Giun Thời Gian' hay còn gọi là §HSâu Thời Gian§!. Hầu hết các dòng chữ khắc đều mang đầy nhịp điệu và chất thơ, cầu nguyện cho sự giáng lâm của Sâu Thời Gian — hoặc, nếu đọc ngược lại — sự rời đi của nó. Còn có một phần mô tả 'sự vận hành của vũ trụ', một nhà khảo cổ học phấn khích thề thốt rằng trong đó trích dẫn các phương trình trường tiên tiến — với chúng ta thì thứ này không có gì mới mẻ, nhưng việc phát hiện ra nó trong ngôi đền cổ này lại là một sự kiện ấn tượng. Dù chúng ta vẫn chưa tìm thấy nhà vật lý nào đồng ý với quan điểm này và công khai thừa nhận nó.\n\nCho đến nay, ngôi đền này không có bất kỳ dấu hiệu nào liên quan đến bí mật vũ trụ hay vũ khí ngoài hành tinh. Nhưng môi trường tăm tối của nó lại vô cùng khác biệt, mang một vẻ đẹp đầy hiểm nguy, và những bài thơ thờ phụng Sâu Thời Gian thì lại trở thành mốt. Chúng được phổ nhạc thành các bài hát thịnh hành; đồng thời cũng được biên soạn thành các tuyển tập xuất bản."
 akx.9101.a.notspiritual: "Mở cửa Đền thờ Vòng Lặp cho công chúng."
 akx.9101.a.notspiritual.tooltip: "Có những thứ đến từ quá khứ, và chúng cũng sẽ trở thành tương lai của chúng ta."
 akx.9101.a.spiritual: "Cải tạo Đền thờ Vòng Lặp thành thánh địa hành hương."
 akx.9101.a.spiritual.tooltip: "Một phần trí tuệ từ những bậc tiền bối của chúng ta. 'Chuyện đã làm, rồi sẽ làm lại'. Điều này sẽ làm tăng độ hạnh phúc của hành tinh và tạo ra một số hiệu ứng khác."
 akx.9101.b: "Chỉ sử dụng Đền thờ Vòng Lặp cho mục đích nghiên cứu học thuật."
 akx.9101.b.tooltip: "Chỉ cho phép những người thực sự cần thiết tiếp xúc."
 akx.9101.c: "Cảm giác có gì đó không ổn. Phong ấn hoàn toàn ngôi đền."
 # Tăng nhẹ Điểm Ảnh hưởng, cờ worm_events_available sẽ *không* được bật
 akx.9101.c.tooltip: "Cẩn tắc vô áy náy."
 ## Tất cả các sự kiện cốt truyện còn lại bên dưới chỉ nên được kích hoạt nếu cờ worm_events_available đã được thiết lập và Thuyết Omega chưa được nghiên cứu.
 ###################################
 ## NGƯỜI ĐƯA TIN: Sự kiện liên quan đến Sâu Thời Gian
 akx.9200.name: "Người Đưa Tin: §HChuyện đã làm, rồi sẽ làm lại§!"
 akx.9200.desc: "[Root.GetName] đã định vị được một vật thể nhỏ, chỉ có nguồn cung cấp năng lượng cơ bản, đang phát sóng tín hiệu xoay vòng cục bộ. Loại vật thể này thường được dùng làm kén thoát hiểm, có vẻ đây chính là một trong số đó. Nó đã nằm ở đây từ rất lâu rồi.\n\nKhi nhân viên mở nó ra — cẩn thận tuân thủ các quy tắc cách ly — họ phát hiện một số di vật cổ đại, được bảo quản trong khoang môi trường vô trùng. Cho đến thời điểm này, mọi thứ đều bình thường. Tuy nhiên, đội trưởng của [Root.GetName] cho biết, họ không ngờ lại tìm thấy câu nói quen thuộc của người [Root.Owner.GetAdj] §HChuyện đã làm, rồi sẽ làm lại; chuyện sắp làm, ắt đã làm rồi§! — được viết bằng dịch cơ thể của người ngồi trong kén lên thành khoang — các thành viên phi hành đoàn mỉa mai gọi đó là 'Người Đưa Tin'. Họ nói thêm: Chủng loại của Người Đưa Tin và chủng loài của chúng ta có những điểm tương đồng đến bất ngờ."
 # Tạo dự án đặc biệt MESSENGER_POD_PROJECT_1
 akx.9201.name: "Người Đưa Tin: Tiềm năng Ẩn giấu"
 akx.9201.desc: "Chúng ta đã xác định được chiếc kén thoát hiểm đó là một món đồ giả tinh xảo được bày bán rộng rãi trong giai đoạn đầu của nền văn minh thiên hà — không có bất kỳ công nghệ mới hay thông tin đặc biệt nào khác. Tuy nhiên, hài cốt của Người Đưa Tin lại đặc biệt gây chú ý. Rõ ràng nó là tổ tiên hoặc biến thể của người [Root.Owner.GetAdj]. Có lẽ chúng ta có họ hàng xa ở ngoài kia — hoặc bộ gen của chúng ta đã bị một giống loài tiên phong nào đó đem ra làm thí nghiệm. [researchingscientist.GetName] xin phép được tiến hành nghiên cứu sâu hơn."
 akx.9201.militarist.a: "Chấp thuận tiếp tục nghiên cứu."
 akx.9201.militarist.a.tooltip: "Tăng cường nghiên cứu lập bản đồ gen"
 # Tạo dự án MESSENGER_POD_PROJECT_2_UNLEASHED
 akx.9201.notmilitarist.b: "Cấp kinh phí nghiên cứu."
 # Tạo dự án MESSENGER_POD_PROJECT_2_LEASHED
 akx.9201.notmilitarist.b.tooltip: "Tăng cường [lượng vừa phải] nghiên cứu lập bản đồ gen"
 akx.9201.c: "Không cho phép. Và [researchingscientist.GetName] phải từ bỏ nghiên cứu hiện tại."
 akx.9201.c.tooltip: "Có những chuyện tốt nhất là không nên biết."
 akx.9210.name: "Người Đưa Tin: Nước cờ Mạo hiểm"
 akx.9210.desc: "[researchingscientist.GetName] đã tái tạo lại thông tin chủng loài của Người Đưa Tin. Nó yếu ớt hơn chúng ta, nhưng khả năng nhận thức lại vượt trội hơn hẳn. Hiện tại vẫn cần phải làm rõ liệu Người Đưa Tin là sản phẩm của việc chỉnh sửa chúng ta, hay Người Đưa Tin chính là tổ tiên của chúng ta. Đối với chúng ta, việc tưởng tượng mình là hậu duệ của một chủng tộc yếu ớt đến vậy là một điều hơi đáng xấu hổ — nhưng [researchingscientist.GetName] kiên quyết với quan điểm này. Thực tế, ông cho rằng sự tụt hậu về nhận thức của giống loài chúng ta thực sự là một 'bi kịch'.\n\nChính 'thực tại đầy bi kịch' này đã thôi thúc ông ta chấp nhận một liệu pháp thử nghiệm để cải tạo sinh lý của bản thân cho giống với Người Đưa Tin. Ông ta nhấn mạnh rằng điều này sẽ giúp mình thực hiện dự án tốt hơn."
 akx.9210.a: "Hành động phản quốc trá hình! Hãy xử tử bọn họ ngay lập tức."
 akx.9210.b: "Hành động phản quốc trá hình! Hãy xử tử bọn họ ngay lập tức. Tiêu hủy toàn bộ tài liệu nghiên cứu."
 akx.9210.c: "Kế hoạch tuyệt vời! Tiếp tục triển khai."
 akx.9211.name: "Người Đưa Tin: Bình minh Mới"
 akx.9211.desc: "[researchingscientist.GetName] hiện đã tái tạo lại nguồn gốc chủng loài của Người Đưa Tin. Ông ta đồng thời còn tạo ra một loại virus có khả năng lây nhiễm cực mạnh. Loại virus này sẽ ủ bệnh trên hành tinh của chúng ta, một khi lây nhiễm cho giống loài chính của chúng ta, nó sẽ khiến vật chủ rơi vào trạng thái hôn mê như nhộng, và một ngày sau đó sẽ biến đổi thành giống loài của Người Đưa Tin. Sự biến đổi như vậy, nói thật, lại khiến một số người cực kỳ phấn khích."
 akx.9211.a: "Đi quá xa rồi, chúng ta phải chấm dứt chuyện này ngay bây giờ. Kiểm soát sự lây lan."
 akx.9211.a.tooltip: "Toàn bộ dân số trên Hành tinh Thủ đô sẽ bị biến đổi, nhưng chỉ đến vậy thôi.\nNgoại hình, tư tưởng và đặc điểm của họ có thể sẽ thay đổi rõ rệt."
 akx.9211.b: "Kiểm soát sự lây lan và bùng phát, đồng thời thanh trừng tất cả những công dân bị nhiễm bệnh."
 akx.9211.b.tooltip: "Điều này sẽ §Rthanh trừng tất cả dân số bị nhiễm bệnh§!: Gần như toàn bộ dân số trên [Root.Capital.GetName]."
 akx.9211.c: "Chuyện đã làm, ắt sẽ làm lại. Chúng ta rồi sẽ thay đổi. Cho tôi một mũi virus đi."
 akx.9211.c.tooltip: "Điều này sẽ làm biến đổi toàn bộ chủng loài của chúng ta.\nNgoại hình, tư tưởng và đặc điểm của chúng ta có thể sẽ thay đổi rõ rệt."
 akx.9220.name: "Người Đưa Tin: Phá vỡ Điều cấm kỵ"
 akx.9220.desc: "[researchingscientist9220.GetName] đã tiến hành nghiên cứu tái tổ hợp gen của Người Đưa Tin. Bọn họ thực sự rất xuất sắc, nhưng cũng khiến các nhà khoa học của chúng ta đôi chút lo lắng. So với bộ gen hiện tại của chúng ta, Người Đưa Tin rõ ràng khỏe mạnh hơn, và có xu hướng hung hăng cao hơn. Hiện tại các nhà nghiên cứu đang đưa ra nhiều ý kiến trái chiều, cần khẩn trương xác định xem Người Đưa Tin rốt cuộc là phiên bản tiến hóa của chính chúng ta, hay bọn họ thực chất là tổ tiên của chúng ta. Bản thân [researchingscientist9220.GetName] lại tin vào giả thuyết thứ hai hơn — lẽ ra chúng ta cũng phải sống như một chủng tộc chiến binh hùng mạnh, nhưng lại đánh mất bản năng chiến đấu do sự can thiệp của một nền văn minh tiên phong nào đó. Theo quan điểm của ông ta, việc mất đi khả năng chiến đấu này là 'bi kịch' lớn nhất trong lịch sử của chúng ta.\n\nMột số nhà nghiên cứu thậm chí vì thế mà chấp nhận điều trị thử nghiệm, biến đổi thể chất của mình thành các đặc điểm của Người Đưa Tin. Họ còn khăng khăng rằng điều này có ý nghĩa to lớn đối với việc tiếp tục nghiên cứu."
 akx.9220.a: "Hành động phản quốc trá hình! Hãy xử tử bọn họ ngay lập tức."
 akx.9220.b: "Hành động phản quốc trá hình! Hãy xử tử bọn họ ngay lập tức. Tiêu hủy toàn bộ tài liệu nghiên cứu."
 akx.9220.c: "Kế hoạch tuyệt vời! Tiếp tục triển khai."
 akx.9220.c.tooltip: "§RĐiều này có thể gây ra những hậu quả đáng kể và khó lường§!"
 akx.9221.name: "Người Đưa Tin: Màn đêm Buông xuống"
 akx.9221.desc: "[researchingscientist9220.GetName] hiện đã tái tạo lại nguồn gốc chủng loài của Người Đưa Tin. Ông ta còn lén lút tái tạo một loại virus có khả năng lây nhiễm cực mạnh mà không thèm hỏi ý kiến ai. Loại virus này sẽ ủ bệnh trên hành tinh của chúng ta, một khi lây nhiễm cho giống loài chính của chúng ta, nó sẽ khiến vật chủ rơi vào trạng thái hôn mê như nhộng, và một ngày sau đó sẽ biến đổi thành giống loài của Người Đưa Tin. Sự biến đổi như vậy, nói thật, lại khiến một số người cực kỳ phấn khích."
 akx.9221.a: "Đi quá xa rồi. Kiểm soát sự lây lan."
 akx.9221.a.tooltip: "Toàn bộ dân số trên Hành tinh Thủ đô sẽ bị biến đổi, nhưng chỉ đến vậy thôi."
 akx.9221.b: "Kiểm soát sự lây lan và bùng phát, đồng thời thanh trừng tất cả những công dân bị nhiễm bệnh."
 akx.9221.b.tooltip: "Điều này sẽ thanh trừng tất cả dân số bị nhiễm bệnh — gần như toàn bộ dân số trên [Root.Capital.GetName]."
 akx.9221.c: "Chuyện đã làm, ắt sẽ làm lại. Cho tôi một mũi virus đi."
 akx.9221.c.tooltip: "Điều này sẽ làm biến đổi toàn bộ chủng loài của chúng ta."
 ##################################
 ## MỘT CUỘC GẶP GỠ: Sự kiện liên quan đến Sâu Thời Gian
 akx.9300.name: "Cuộc Gặp Gỡ Định Mệnh"
 akx.9300.desc: "Tàu §H'Syzygy'§! của [Root.Owner.GetName]... gửi lời chào đến [Root.GetName]. Mặc dù tàu 'Syzygy' không gửi cho chúng ta bất kỳ mã nhận dạng nào có thể xác định được, trong số các con tàu đã đăng ký cũng không có con tàu nào mang tên này. Chỉ huy của nó tự xưng là Hạm trưởng §H[mirrored_syzygy_admiral.GetName]§!."
 akx.9300.a.admiralabsent: "Ừm. Chúng ta đúng là có một chỉ huy như vậy, nhưng tôi phải tìm thử xem."
 akx.9300.a.admiralabsent.tooltip: "Mở kênh liên lạc."
 akx.9300.a.admiralpresent: "Thật thú vị. [mirrored_syzygy_admiral.GetName] đang ở đây."
 akx.9300.b: "Đây *chắc chắn* là một cái bẫy. Chúng ta sẽ không cho kẻ thù cơ hội. Chuẩn bị chiến đấu."
 akx.9310.name: "Cuộc Gặp Gỡ Định Mệnh: Hạm trưởng của Ngày Hôm Qua"
 akx.9310.desc: "Hạm trưởng xuất hiện trên màn hình rõ ràng là [mirrored_syzygy_admiral.GetName], nhưng lại đầy thương tích, bồn chồn, già nua, giống như một phiên bản thất bại của [mirrored_syzygy_admiral.GetName], khuôn mặt nhẵn nhụi như bị plasma thiêu đốt, và còn già hơn cả sự già cỗi. Buồng lái đằng sau trông tàn tạ và cũ nát. Nhưng giọng nói của hạm trưởng vẫn rất kiên định và vang vọng\n\n§G'Cuối cùng cũng tìm thấy các người, tôi đã đợi rất lâu rồi, hình phạt của tôi là phải chết trong trận chiến với các người. Xin hãy giết tôi, rất xin lỗi.'§!"
 akx.9310.a: "Chuyện này rốt cuộc là sao? Ngươi thực sự là [mirrored_syzygy_admiral.GetName]?"
 akx.9310.a.response: "§G'Tôi là ai? [Root.GetSpeciesName], ngài có phải là ngài của năm ngoái không? Mỗi ngày là sự hủy diệt, mỗi tương lai là một sự lựa chọn. Thời gian là một mê cung, chứ không phải là một con đường thênh thang rộng mở.'§!\n\nÔng ta nhếch mép cười. Nghe như thể nụ cười làm những vết sẹo đau nhói.\n\n§G'Hãy hỏi Vòng Lặp đi'§!"
 akx.9310.b: "Nếu ngươi muốn kết thúc, vậy tại sao phải chờ đợi? Một tàu chiến có khối cách để tự hủy."
 akx.9310.b.response: "§G'Ngài không nhớ sao? Dĩ nhiên, ngài vẫn chưa — và bây giờ ngài cũng chưa chắc đã phải làm thế, nếu ngài chọn đúng. Vòng Lặp cần vật hiến tế của nó, và cũng cần những vật hiến tế phải làm điều đó.'§! Một tiếng cười khẽ đầy đau đớn. §G'Ngài sẽ không muốn coi Vòng Lặp như một trò đùa đâu.'§!"
 akx.9310.c: "Vòng Lặp là gì?"
 akx.9310.c.response: "§G'Vòng Lặp là khởi đầu và cũng là kết thúc —§!§HSâu Thời Gian§!§G — và, tôi nghĩ, con Sâu chính là Vòng Lặp. Nói thế này nhé, thời gian là một mê cung'§! — Hạm trưởng bắt đầu khua tay múa chân một cách vô ích.\n§G'Và Vòng Lặp chính là con quái vật say ngủ trong đó, cũng là đấng sáng tạo của nó... không, tôi không thể giải thích được điều này, và ngài sẽ sớm hiểu ra thôi. Ngài có thể làm được điều đó, trong quá khứ của tôi.\n\n... Khóa mục tiêu vũ khí chưa?'§!"
 akx.9310.d.notpacifist: "Đầu hàng đi, bất kể ngươi đã làm gì, chúng tôi đều có thể giúp ngươi."
 akx.9310.d.notpacifist.response: "§G'Đã quá muộn rồi,'§! hạm trưởng nói, vẻ mặt ông ta lạnh lùng kiên quyết không một chút hối hận, sau đó tín hiệu truyền tải bị cắt đứt."
 akx.9310.d.fanaticpacifist: "Giết chóc không phải là cách làm của chúng tôi. Đầu hàng đi, chúng tôi sẽ giúp ngươi."
 akx.9310.d.fanaticpacifist.response: "Hạm trưởng do dự rất lâu. Buồng lái của tàu 'Syzygy' rõ ràng trông trống rỗng: không có thành viên phi hành đoàn nào khác.\n\n§G'Đã quá muộn với tôi rồi,'§! hạm trưởng cuối cùng cũng lên tiếng, §G'Nhưng ngài nói đúng, đây không phải là cách làm của chúng tôi. Tôi phải làm điều tôi nên làm.'§! Tín hiệu truyền tải bị cắt đứt.\n\nPhản ứng từ cảm biến cho thấy toàn bộ vũ khí của tàu Syzygy đều đã ngoại tuyến; hệ thống năng lượng của con tàu cũng bắt đầu ngắt kết nối. Chẳng mấy chốc, đèn của nó phụt tắt. Khi đội trục vớt của chúng ta lên tàu, họ không phát hiện ra bất kỳ dấu hiệu sự sống nào, cũng không thấy bóng dáng hạm trưởng đâu. Nhưng khu vực điều khiển đã có người sử dụng gần đây; và có người đã sửa đổi giao thức an ninh để ngăn chặn việc xâm nhập vào khu vực cốt lõi."
 akx.9310.e: "Vậy thì, hãy để chúng tôi kết liễu ngươi."
 akx.9310.e.response: "§G'[mirrored_syzygy_admiral.GetName] kết thúc.'§!\n\nHạm trưởng giơ tay chào chúng ta — khi thực hiện động tác, những vết thương cũ liên tục giật giật — sau đó ngắt đường truyền."
 akx.9310.e.materialistic: "Được thôi, trước khi ngươi... đi: Ngươi có thể cung cấp bất kỳ dữ liệu hữu ích nào không?"
 akx.9310.e.materialistic.response: "Hạm trưởng giãn những vết thương trên mặt ra và bật cười.\n\n§G'Thật vui vì ngài đã hỏi điều này, đang truyền tải dữ liệu. [mirrored_syzygy_admiral.GetName] kết thúc.'§!"
 akx.9310.e.spiritual: "Chúng tôi sẽ cầu nguyện cho ngươi."
 akx.9310.e.spiritual.response: "§G'Tôi cũng cầu nguyện cho các ngài.'§!\n\nHạm trưởng đọc một bài kinh cầu nguyện đối xứng kỳ lạ nhưng vang vọng gồm hai mươi bảy chữ, nội dung của nó khiến các nhà thần học của ngài phải say mê, sau đó ngắt kết nối tín hiệu."
 akx.9310.e.militarist: "Hạm trưởng. Chúng ta sẽ gặp lại nhau trong ngọn lửa và vinh quang."
 akx.9310.e.militarist.response: "Hạm trưởng giơ tay chào chúng ta.\n\n§G'Tôi hy vọng có thể xây cho mình một tượng đài.'§!\n\nKết nối đã bị cắt."
 akx.9310.e.fanaticcollectivist: "Bất kể chuyện gì đã xảy ra, đây không phải là cách làm của chúng tôi. Đầu hàng đi, chúng tôi sẽ giúp ngươi."
 akx.9310.e.fanaticcollectivist.response: "Hạm trưởng do dự rất lâu. Buồng lái của tàu 'Syzygy' rõ ràng trông trống rỗng: không có thành viên phi hành đoàn nào khác.\n\n§G'Đã quá muộn với tôi rồi,'§! vị [mirrored_syzygy_admiral.GetName] đó cuối cùng cũng lên tiếng, §G'Nhưng ngài nói đúng, đây không phải là cách làm của chúng tôi. Tôi phải làm điều tôi nên làm.'§! Tín hiệu truyền tải bị cắt đứt.\n\nPhản ứng từ cảm biến cho thấy toàn bộ vũ khí của tàu Syzygy đều đã ngoại tuyến; hệ thống năng lượng của con tàu cũng bắt đầu ngắt kết nối. Chẳng mấy chốc, đèn của nó phụt tắt. Khi đội trục vớt của chúng ta lên tàu, họ không phát hiện ra bất kỳ dấu hiệu sự sống nào, cũng không thấy bóng dáng hạm trưởng đâu. Nhưng khu vực điều khiển đã có người sử dụng gần đây; và có người đã sửa đổi giao thức an ninh để ngăn chặn việc xâm nhập vào khu vực cốt lõi."
 akx.9310.f: "Tên phản bội."
 akx.9310.f.tooltip: "Tắt kênh liên lạc."
 akx.9315.name: "Cuộc Gặp Gỡ Định Mệnh: Cách Thức Kết Thúc"
 akx.9315.desc: "Tàu 'Syzygy' đang kích hoạt vũ khí."
 # Sinh ra tàu Syzygy
 akx.9315.a: "Giá như có cách nào khác..."
 akx.9315.b: "Vậy thì cứ thế đi."
 akx.9319.name: "Cuộc Gặp Gỡ Định Mệnh: Bị Cắt Ngang"
 akx.9319.desc: "Bên trong [syzygy_location.GetStarName], chúng ta nhận được một tin nhắn nhiễu sóng từ hạm trưởng tàu 'Syzygy'. Phía sau họ, buồng lái bị khói bao phủ. §G'Đã quá muộn rồi, ngài đã rời xa nó quá lâu. Vòng Lặp không bao giờ tha thứ. Xin hãy—'§!\n\nThông báo kết thúc tại đây."
 akx.9319.a: "Ai đã làm việc này?"
 akx.9319.a.tooltip: "Tàu 'Syzygy' đã bị một đế quốc khác tiêu diệt. Nếu bạn đến hệ sao này trước khi các mảnh vỡ tiêu tán, có thể bạn vẫn sẽ tìm thấy điều gì đó."
 akx.9320.name: "Cuộc Gặp Gỡ Định Mệnh: Hạm trưởng của Ngày Mai"
 akx.9320.desc: "[mirrored_syzygy_admiral.GetName] vẫn luôn giữ im lặng trong những ngày sau đó. Suy cho cùng, việc bị tuyên án tử hình không phải là chuyện có thể dễ dàng cho qua. May thay, chẳng bao lâu sau, sự im lặng của anh ta đã biến thành sự quyết đoán, và cuối cùng trở thành thái độ cởi mở khi đối mặt với nguy hiểm."
 akx.9321.name: "Cuộc Gặp Gỡ Định Mệnh: Hạm trưởng của Ngày Mai"
 akx.9321.desc: "[mirrored_syzygy_admiral.GetName] vẫn luôn giữ im lặng trong những ngày sau đó. Suy cho cùng, việc bị tuyên án tử hình không phải là chuyện có thể dễ dàng cho qua. May thay, chẳng bao lâu sau, sự im lặng của anh ta đã biến thành sự quyết đoán, và cuối cùng trở thành thái độ cởi mở khi đối mặt với nguy hiểm."
 akx.9321.a: "Thật đáng lo ngại."
 akx.9321.b: "Chuyện đã làm, rồi sẽ làm lại; chuyện sắp làm, ắt đã làm rồi."
 akx.9330.name: "Cuộc Gặp Gỡ Định Mệnh: Ngày Đó Lúc Đó"
 akx.9330.desc: "Trong những năm sau đó, có vài báo cáo nhân chứng cho biết Chỉ huy [From.GetName] đã xuất hiện tại vùng không gian của người [Root.GetAdj] và xa hơn nữa. Khi một nhà lãnh đạo nổi tiếng qua đời, những chuyện như vậy không phải là hiếm; và kể từ Cuộc gặp gỡ Syzygy, họ đã trở thành một huyền thoại. Chỉ là chúng ta không có cách nào để phân biệt thực hư của những sự việc này."
 akx.9330.a: "Có vẻ như chúng ta sẽ vĩnh viễn không bao giờ biết được."
 akx.9330.b: "Thực ra hoàn toàn có thể xác nhận được."
 akx.9340.name: "Cuộc Gặp Gỡ Định Mệnh: Vật Tùy Táng"
 akx.9340.desc: "Phân tích pháp y cho thấy những mảnh vỡ mà chúng ta phục hồi có một sự quỷ dị hiện rõ mồn một. Tất cả các bộ phận của con tàu đều được chế tạo cùng một lúc — sử dụng công nghệ gần như tương đương với chúng ta — nhưng một số bộ phận lại trông cũ hơn hàng thế kỷ so với những bộ phận khác. Một bộ pin năng lượng đã được phục hồi thậm chí còn tốt hơn cả nguyên bản của nó.\n\nNgoài ra... hai nhà phân tích được giao nhiệm vụ này lại bất ngờ khỏi một căn bệnh mãn tính — căn bệnh được cho là vô phương cứu chữa. Tuy nhiên, toàn đội lại hoàn toàn mù mờ về nguyên nhân của sự việc này."
 ######################################
 ## THẦN VÒNG LẶP: Sự kiện liên quan đến Sâu Thời Gian
 akx.9400.name: "Thần Vòng Lặp"
 akx.9400.desc: "Trạm quan sát của chúng ta trên [coils_planet.GetName] báo cáo rằng một phong trào nghệ thuật tôn giáo bên lề — Thần Vòng Lặp, đang trỗi dậy. Những chiếc đồng hồ cơ học thô sơ được coi là thánh tích, nhưng sẽ bị phá hủy theo nghi thức sau một năm hoạt động. Những sinh vật hình sâu bọ và rắn trên hành tinh được bảo vệ khỏi bị tổn hại. Các tư tế của Thần Vòng Lặp khẳng định thời gian là một mê cung. 'Chuyện đã làm, ắt sẽ làm lại; chuyện sắp làm, rồi đã làm xong.' Bọn họ ngân nga như vậy trong những lời cầu nguyện."
 akx.9400.a: "Hình như đã nghe câu này ở đâu rồi thì phải. Cố gắng hết sức để trấn áp."
 akx.9400.b: "Hình như đã nghe câu này ở đâu rồi thì phải. Tiến sát nhất có thể để quan sát."
 akx.9410.name: "Thần Vòng Lặp: Âm thầm Bức hại"
 akx.9410.desc: "Chúng ta đã tìm cách thuyết phục giới cai trị địa phương trên [coils_planet.GetName] rằng Thần Vòng Lặp là một mối đe dọa. Các tư tế của Thần Vòng Lặp bị khuyên can, bị tống giam, hoặc, thật đáng tiếc, bị thiêu sống. Các nền văn minh sơ khai chưa đạt được bước nhảy vọt FTL dường như rất am hiểu về cách ươm mầm hận thù và ngờ vực: đôi khi những thủ đoạn này rất hữu dụng."
 akx.9420.name: "Thần Vòng Lặp: Bám rễ Sâu xa"
 akx.9420.desc: "Chúng ta đã tìm cách thuyết phục giới cai trị địa phương trên [coils_planet.GetName] rằng Thần Vòng Lặp là một mối đe dọa. Các tư tế của Thần Vòng Lặp bị khuyên can, bị tống giam, hoặc, thật đáng tiếc, bị thiêu sống. Nhưng những tín đồ vẫn kiên cường, và các quan sát viên của chúng ta tỏ ra lo ngại. Họ cho rằng bọn chúng chỉ đang chuyển sang hoạt động ngầm mà thôi."
 akx.9450.name: "Thần Vòng Lặp: Nghi thức Mê cung"
 akx.9450.desc: "Số lượng tín đồ cuồng tín của Thần Vòng Lặp trên [coils_planet.GetName] đang tăng lên với tốc độ bất thường. Có thể tìm thấy bọn họ ở mọi thành phố trên hành tinh, và họ đã sáng tạo ra một chuỗi các nghi lễ do công dân làm chủ đạo trong mọi ngành nghề. Toàn bộ chủng tộc đều dành sự nhiệt tình phi lý cho chuyện này. Những người giàu có biên đạo ra các điệu nhảy Vòng Lặp tinh tế để tổ chức lễ hội. Người nghèo thì dán đầy những biểu tượng vòng lặp phức tạp lên cửa nhà. Ngay cả các trò chơi trong công viên giải trí cũng đang ca tụng vòng tuần hoàn tự nhiên của thời gian."
 akx.9450.a: "Thật khiến người ta bất an. Can thiệp và ngăn chặn họ, nhưng hãy làm một cách khéo léo."
 ## Tạo dự án COILS_GOD_PROJECT_DISRUPT
 akx.9450.b: "Sự việc nghiêm trọng rồi. Dùng vũ lực buộc chúng dừng lại, bất chấp cái giá và rủi ro."
 ## Tạo dự án COILS_GOD_PROJECT_PREVENT:
 akx.9450.c: "Thật hấp dẫn! Cử một đội đi học hỏi các nghi lễ — tham gia luôn, nếu khả thi."
 ## Tạo dự án COILS_GOD_PROJECT_PARTICIPATE
 akx.9450.d: "Bọn nguyên thủy làm trò nguyên thủy. Tiếp tục quan sát."
 akx.9460.name: "Thần Vòng Lặp: Kết thúc Nghi lễ"
 akx.9460.desc: "Các hoạt động phá hoại của chúng ta đã làm tan rã các nghi lễ của tín đồ Thần Vòng Lặp trên [coils_planet.GetName]. Giới quý tộc đã từ bỏ các buổi lễ bái của họ. Những hình vẽ graffiti vòng lặp trên tường cũng dần phai mờ. Trọng tâm của giới trẻ đã quay lại với chuyện tán tỉnh, giết chóc và các thú vui lành mạnh khác của tuổi ấu thơ. Có một lượng lớn các vụ tự tử trong hàng ngũ tư tế của Thần Vòng Lặp. Nếu đây là một cuộc khủng hoảng, thì có lẽ nó đã qua rồi."
 akx.9460.a: "'Vòng lặp không bao giờ kết thúc, nhưng không phải lúc nào cũng có thể khép kín.'"
 akx.9460.b: "Làm tốt lắm, mọi người. Gỡ bỏ cảnh giác."
 akx.9465.name: "Thần Vòng Lặp: Tin tức Thế giới ngầm"
 akx.9465.desc: "Các hoạt động phá hoại của chúng ta đã làm tan rã các nghi lễ của tín đồ Thần Vòng Lặp trên [coils_planet.GetName] — nhưng chỉ dập tắt được sự nhiệt tình của các tư tế. Giờ đây, bọn chúng hành động bí mật, tụ tập tại các ngôi đền ngầm dưới lòng đất. Giới quý tộc không còn nhảy những điệu nhảy mê cung nữa, nhưng họ vẫn đeo biểu tượng hình sâu bọ. Và bài đồng dao 'Chuyện đã làm, ắt sẽ làm lại' vẫn vang vọng trên các sân chơi."
 akx.9465.a: "'Vòng lặp không bao giờ kết thúc.'"
 akx.9465.b: "Tiếp tục quan sát."
 akx.9470.name: "Thần Vòng Lặp: Máu của Tư tế"
 akx.9470.desc: "Các đặc vụ của chúng ta sắc bén như những lưỡi dao. Họ tiến hành bắt cóc hoặc ám sát mọi tư tế của Vòng Lặp mà họ có thể tìm thấy. Họ dùng chất nổ san phẳng các khu dân cư có biểu tượng vòng lặp. Khắp nơi trên [coils_planet.GetName] đầy rẫy những tin đồn rằng Thần Vòng Lặp đã báng bổ thần linh, đánh thức vị Thượng đế đang thịnh nộ. Chẳng bao lâu sau, mà không cần bất kỳ sự trợ giúp nào từ phe ta, người dân địa phương đã hoàn toàn đập tan Thần Vòng Lặp. Các quan sát viên đã phải trải qua một phen hoảng hốt; nhưng nếu đây là một cuộc khủng hoảng, thì hiện tại nó đã được tránh khỏi."
 akx.9470.a: "'Vòng lặp không bao giờ kết thúc, nhưng không phải lúc nào cũng có thể khép kín.'"
 akx.9470.b: "Làm tốt lắm, mọi người. Gỡ bỏ cảnh giác."
 akx.9480.name: "Thần Vòng Lặp: Chuyến viễn du của Thành phố Mê cung"
 akx.9480.desc: "Các nhà dân tộc học của chúng ta đã bị cuốn hút bởi những nghi lễ phức tạp này. Họ suy đoán rằng các nghi lễ này ẩn chứa một kênh liên lạc bí mật nào đó, thế nên họ quyết định biên dịch lại các bài cầu nguyện ẩn giấu và sử dụng thuật toán để tái cấu trúc nghi lễ. Thực tế, những bằng chứng mà họ gửi về bước đầu đã xác nhận điều này — cho đến khi liên lạc bị cắt đứt đột ngột. Trên thực tế, trên phạm vi toàn cầu, mọi liên lạc đều dừng lại một cách đường đột. Báo cáo từ các vệ tinh và tàu bay khảo sát mặt đất cho thấy: Hành tinh không có dấu hiệu hoạt động. Không có phương tiện giao thông nào chạy trên đường, không có khu dân cư nào tỏa nhiệt hay xả thải. Không có dấu hiệu của sự sống...\n\nBáo cáo cuối cùng chỉ ra rằng, toàn bộ dân số của giống loài [coils_planet.Owner.GetSpeciesName] trên hành tinh — bao gồm cả đội dân tộc học của chúng ta — đều đã biến mất, kéo theo đó là mọi hoạt động đều dừng bặt một cách êm ái. Đồ ăn còn dang dở trên bàn, thú cưng không được cho ăn, những ngôi nhà bốc cháy vì lò sưởi không ai quản lý. Những dị thường trọng lực đã được ghi nhận ngay từ lúc bắt đầu. Hầu như trên mọi con phố, đều có những biểu tượng vòng lặp được sơn phết làm minh chứng."
 akx.9480.a: "'Vòng lặp không bao giờ kết thúc.'"
 akx.9480.a.tooltip: "Sự biến mất hoàn toàn của một nền văn minh, một con tàu khoa học bị chôn vùi theo."
 akx.9480.b: "Một bài học tàn khốc."
 akx.9490.name: "Thần Vòng Lặp: Ngôi đền Hoang vắng"
 akx.9490.desc: "Một bản báo cáo từ đội quan sát của chúng ta trên [coils_planet.GetName] cho biết: Nghi lễ của Thần Vòng Lặp đã dừng lại. Thực tế, các dấu hiệu hoạt động trên toàn cầu có vẻ như đang ở mức thấp kỷ lục. Báo cáo cho biết đội quan sát đang dự định dùng tàu bay tàng hình để dò quét khu dân cư ở độ cao thấp...\n\nCác báo cáo sau đó đã xác nhận: Hành tinh không có dấu hiệu hoạt động. Không có phương tiện giao thông nào chạy trên đường, không có khu dân cư nào tỏa nhiệt hay xả thải. Không có dấu hiệu của sự sống...\n\nBáo cáo cuối cùng chỉ ra rằng, toàn bộ dân số của giống loài [coils_planet.Owner.GetSpeciesName] trên hành tinh đều đã biến mất, kéo theo đó là mọi hoạt động đều dừng bặt một cách êm ái: đồ ăn còn dang dở trên bàn, thú cưng không được cho ăn, những ngôi nhà bốc cháy vì lò sưởi không ai quản lý. Những dị thường trọng lực đã được ghi nhận ngay từ lúc bắt đầu. Hầu như trên mọi con phố, đều có những biểu tượng vòng lặp được sơn phết làm minh chứng."
 akx.9490.a: "'Vòng lặp không bao giờ kết thúc.'"
 akx.9490.a.tooltip: "Sự biến mất của một nền văn minh."
 akx.9490.b: "Một bài học tàn khốc."
 #######################################
 ## THẾ GIỚI CHỜ ĐỢI: Sự kiện liên quan đến Sâu Thời Gian
 akx.9500.name: "Thế giới Chờ đợi"
 akx.9500.desc: "Rõ ràng, đây không phải là cứ điểm đầu tiên do người [Root.Owner.GetSpeciesAdj] thiết lập trên hành tinh này. Một lượng lớn cơ sở vật chất và khu vực đô thị đã được cẩn thận niêm phong lại, chỉ cần sửa chữa qua loa, chúng ta có thể đưa chúng vào hoạt động trở lại để phục vụ cho việc xây dựng thuộc địa. Tuy nhiên, điều đáng ngờ là, toàn bộ ghi chép lịch sử đều đã bị xóa sạch. Chúng ta không thể xác định nơi này từng là một bến cảng bí mật của bọn buôn lậu, hay là một nơi trú ẩn của những người tị nạn chính trị."
 akx.9500.a: "Tuyệt quá! Bố trí sửa chữa các cơ sở này ngay lập tức."
 akx.9500.b: "Mọi thứ suôn sẻ đến mức khó tin, tốt hơn hết là nên phá bỏ những khu vực này."
 akx.9500.b.tooltip: "Điều này sẽ làm giảm độ hạnh phúc của thuộc địa."
 akx.9505.name: "Thế giới Chờ đợi: Đánh bom Có chủ đích"
 akx.9505.desc: "Các kỹ sư của chúng ta đã nhanh chóng rút lui đến khoảng cách an toàn ngay sau khi cài đặt xong chất nổ. Khu vực mục tiêu chỉ còn lại một đống đổ nát sau vụ nổ. Dần dà, những đống đổ nát này cũng sẽ biến thành cát bụi dưới sự gột rửa của gió sương và mưa bão. Tuy nhiên, bộ khung của những tàn tích này sẽ vẫn đứng sừng sững, dù trải qua hàng thế kỷ vẫn sừng sững không chút lay chuyển; ngoài ra, chúng ta cũng nghe được một vài lời đồn đại, rằng giữa những kẽ đá ban ngày có bóng đen thoắt ẩn thoắt hiện, dưới màn đêm buông xuống có ma trơi lập lòe. Các thực dân của chúng ta đều biết ý mà đi đường vòng tránh xa khu vực này. Dù sao thì chỗ này cũng chẳng phải danh lam thắng cảnh gì."
 akx.9505.a: "Mọi chuyện đã kết thúc."
 akx.9505.a.tooltip: "Các cơ sở cổ đại đã bị phá hủy."
 akx.9505.b: "Tất cả những điều này sẽ không bị lãng quên."
 akx.9505.c: "Tôi thích nhất là cái âm thanh ầm ầm này đấy."
 akx.9510.name: "Thế giới Chờ đợi: Bóng tối trong Tường"
 akx.9510.desc: "Cư dân thuộc địa của chúng ta rất thích tận dụng những khu vực này trên [waiting_world.GetName]. Chúng có thể giúp thuộc địa phát triển với tốc độ chóng mặt. Nhưng mọi người lại bắt đầu cảm thấy bất an. Có lời đồn rằng những cơ sở này vẫn còn người sử dụng, hoặc các biện pháp an ninh vẫn đang hoạt động. Nhưng không có bất kỳ bằng chứng nào chứng minh điều đó. Một số cư dân thậm chí còn hoang tưởng khăng khăng cho rằng chúng chính là 'những cái bóng trong tường'."
 akx.9510.a: "Không được cổ xúy những trò mê tín này. Những khu vực này có thể giúp chúng ta tiết kiệm được nhiều năm phấn đấu."
 akx.9510.b: "Tại sao phải gánh chịu rủi ro? Chúng chỉ là những tòa nhà, nổ tung hết cho tôi."
 akx.9510.b.tooltip: "Điều này sẽ làm giảm độ hạnh phúc của thuộc địa."
 akx.9520.name: "Thế giới Chờ đợi: Dân số Quá tải"
 akx.9520.desc: "Một tin tức thú vị đã được truyền về từ [waiting_world.GetName], nơi mà chúng ta từng phát hiện ra các khu đô thị bị bỏ hoang. Một bản thống kê cho thấy nơi đó bỗng dưng xuất hiện thêm rất nhiều cư dân thuộc địa. Tuy nhiên, đây có thể chỉ là lỗi thống kê, rốt cuộc những người này đều sở hữu thẻ căn cước công dân hợp pháp, và cũng chẳng có ai báo cáo là phát hiện ra những người lạ mới đến. Chắc hẳn là do tỷ lệ sinh ở đó siêu cao, hoặc là dữ liệu của chúng ta đã bị ảnh hưởng bởi những người nhập cư chưa làm thủ tục. Dù nguyên nhân là gì, sự gia tăng dân số ở đó vượt xa dự đoán hợp lý của chúng ta."
 akx.9520.a: "Phá hủy các khu đô thị. Chúng ta đáng lẽ nên làm việc này sớm hơn."
 akx.9520.b: "Cố gắng hết sức để điều tra, theo dõi sát sao tình hình hiện tại."
 akx.9525.name: "Thế giới Chờ đợi: Đến hẹn lại Lên"
 akx.9525.desc: "[waiting_world.GetName], nơi ban đầu chúng ta phát hiện ra những khu đô thị bị bỏ hoang, lại một lần nữa truyền về tin tức mới. Số lượng cư dân thuộc địa địa phương liên tục tăng vọt, và gần đây chúng ta đã phát hiện ra rất nhiều điểm bất thường trong sổ ghi chép — những tổ chức đáng lẽ không được tồn tại, những ngày tháng hoàn toàn phi lý, v.v. Chắc chắn là có cư dân từ một thuộc địa vô danh nào đó đã lén lút di cư đến đây, hoặc là có người cố tình phá hoại ghi chép nhằm đánh lạc hướng chúng ta."
 akx.9525.a: "Phá hủy các khu đô thị. Chúng ta đáng lẽ nên làm việc này sớm hơn."
 akx.9525.b: "Thật là kỳ lạ! Nhưng dân số thì lúc nào cũng càng đông càng tốt. Tiếp tục giám sát và duy trì hiện trạng."
 akx.9530.name: "Thế giới Chờ đợi: Rút lui khỏi Sân khấu"
 akx.9530.desc: "[waiting_world.GetName] đột nhiên xảy ra sự cố mất liên lạc trên toàn cầu. Mặc dù trước đó dân số của chúng ta đã tăng thêm một cách khó hiểu, nhưng bây giờ, có vẻ như trên hành tinh đó không còn ai nữa. Mọi người đã bốc hơi ngay trong đêm. Bọn họ đã rời khỏi thế giới này? Hay đang lẩn trốn? Hay đây là một cuộc diệt chủng cấp hành tinh?"
 akx.9530.a: "Cử một đội đi điều tra."
 akx.9530.b: "Ngay lập tức từ bỏ và cách ly hành tinh này."
 akx.9530.b.tooltip: "Hành tinh này sẽ bị bỏ hoang vĩnh viễn."
 akx.9535.name: "Thế giới Chờ đợi: Khối lượng của Ánh sáng"
 akx.9535.desc: "Đội đặc nhiệm của chúng ta báo cáo rằng [waiting_world.GetName] thực sự, quả thật, không một bóng người — không chỉ những cư dân thuộc địa, mà đến cả dấu vết của thuộc địa cũng bị xóa sạch sẽ. Các tòa nhà đã biến mất, vệ tinh và các kiến trúc quỹ đạo cũng biến mất, dữ liệu khí quyển cho thấy không có bất kỳ dấu hiệu nào của một nền văn minh công nghệ. Trong báo cáo của nhóm, toàn bộ hành tinh dường như đã bị làm mới lại.\n\nHọ cũng báo cáo rằng sự biến động bức xạ mặt trời trong hệ sao mang các đặc điểm của một á siêu tân tinh — kèm theo một số 'sự kiện chớp sáng', ánh sáng trong bầu khí quyển dường như tích tụ một cách khó hiểu rồi phóng ra bề mặt hành tinh dưới dạng ánh sáng rực rỡ sắc màu. Đây quả thực là một dữ liệu đặc biệt có giá trị, nhưng nó không hề làm sáng tỏ số phận của những cư dân thuộc địa."
 akx.9540.name: "Thế giới Chờ đợi: Ai ai cũng ở Đây"
 akx.9540.desc: "[waiting_world.GetName] lại gửi về thêm những báo cáo đáng kinh ngạc — hành tinh này từng trải qua một đợt gia tăng dân số bí ẩn. Mặc dù số lượng dân số hiện tại phù hợp với kỳ vọng của chúng ta, nhưng một số thông tin có vẻ đã xảy ra vấn đề, hoặc... hoặc có điều gì đó mà ngay cả các quan chức chính phủ của chúng ta cũng không thể giải thích. Theo báo cáo, không có ai trong số những nhân viên này tồn tại trong hồ sơ ban đầu của chúng ta, từng cư dân thuộc địa đầu tiên đều đã mất tích. Có vẻ như mỗi một người dân đều đã bị thay thế hoàn toàn bởi những người xa lạ.\n\nTất nhiên, bọn họ đều thề thốt mình là những công dân trung thành của [Root.Owner.GetName]. Bọn họ đều có thể tham gia sản xuất và rõ ràng là rất khỏe mạnh. Trong tất cả các cuộc liên lạc, bọn họ phủ nhận những báo cáo hỗn loạn đó, và khăng khăng rằng chính chúng ta đã nhầm lẫn."
 akx.9540.a: "Trước khi sự việc này mở rộng thêm, hãy từ bỏ thuộc địa này ngay lập tức."
 ## Trao trả độc lập cho thuộc địa
 akx.9540.a.tooltip: "Thuộc địa này sẽ giành được độc lập."
 akx.9540.b: "Thanh trừng bọn chúng, và cách ly hành tinh vĩnh viễn"
 ## Tạo dự án WAITING_WORLD_PURGE
 akx.9540.b.tooltip: "Hành tinh sẽ vĩnh viễn bị bỏ hoang, nhưng sẽ nhận được Điểm Ảnh hưởng."
 akx.9540.c: "Cử một đội đi điều tra."
 ## Tạo dự án WAITING_WORLD_HYPERAPPEARANCE
 akx.9541.name: "Thế giới Chờ đợi: Không Một Ai Sống sót"
 akx.9541.desc: "Đây có thể là một tội ác kinh hoàng. Nhưng nó có thể cứu vớt quốc gia của chúng ta khỏi một thực thể tồi tệ hơn. Thuộc địa trên [waiting_world.GetName] đã hóa thành tro bụi dưới hỏa lực của chúng ta. Khi chúng ta rút quân, từng tòa nhà đều đã biến thành thủy tinh; không còn dấu hiệu sinh tồn của bất kỳ sự sống trí tuệ nào."
 akx.9541.a: "Xóa sạch những ghi chép này. Một trăm năm nữa, sẽ không ai biết được những gì chúng ta đã làm."
 akx.9541.b: "Nói cho tất cả mọi người biết chuyện này. Không cần quan tâm đến lòng căm thù nhỏ mọn của bọn chúng, chỉ cần đảm bảo rằng bọn chúng có thể cảm nhận được nỗi sợ hãi."
 akx.9545.name: "Thế giới Chờ đợi: Vạn vật Hóa Hư Vô"
 akx.9545.desc: "Đội đặc nhiệm của chúng ta báo cáo rằng mọi người trên hành tinh đều rất bình thường và khỏe mạnh, rõ ràng là họ đang bị bối rối trước những chuyện bé xé ra to này. Mặc dù bọn họ quả thực có chút kỳ lạ: chẳng hạn như số lượng những người không có quan hệ máu mủ nhưng lại có ngoại hình giống nhau đông một cách bất thường, toàn bộ người trên hành tinh đều không có khái niệm về thời gian, biến động bức xạ mặt trời trong hệ sao mang các đặc điểm của một á siêu tân tinh. Đồng thời họ cũng quan sát được một số 'sự kiện chớp sáng', ánh sáng trong bầu khí quyển dường như tích tụ một cách khó hiểu rồi phóng ra bề mặt hành tinh dưới dạng ánh sáng rực rỡ sắc màu. Đây tuy là một dữ liệu đặc biệt có giá trị, nhưng giống một sự trùng hợp ngẫu nhiên hơn. Nếu thực sự có chuyện gì từng xảy ra trên thuộc địa này, thì bây giờ tất cả đều đã trở thành bí mật."
 akx.9545.a: "'Chuyện sắp làm, ắt đã làm rồi.'"
 akx.9545.b: "Cư dân thuộc địa: Cư dân thuộc địa đã trở nên kỳ lạ."
 ####################################
 ### TÙY TÙNG: Sự kiện liên quan đến Sâu Thời Gian
 # Sự kiện này sẽ xuất hiện nếu người chơi tiếp cận một khối cầu công nghệ (technosphere)
 # khi cờ worm_events_available đang bật, thay cho các tùy chọn khối cầu công nghệ thông thường.
 akx.9600.name: "Thánh bộc"
 akx.9600.desc: "Xin chào, xin chào, chúng tôi hoan nghênh bạn quay trở lại [Root.GetStarName]. Ồ, bạn là một nhóm khác, đúng không? Có quá nhiều người giống như bạn. Các bạn và Nhóm trích xuất rất giống nhau, nhưng lại rất khác nhau. Chúng tôi cầu xin sự trợ giúp từ bi của bạn: Bạn có đủ tài nguyên để giúp đỡ dự án của chúng tôi không? Mặc dù Vòng Lặp sẽ giúp đỡ chúng tôi, nhưng việc nghiên cứu thực sự quá khó khăn. Đúng như những gì bạn thấy, mọi thứ đều rất đắt đỏ."
 akx.9600.a: "Nhóm trích xuất?"
 akx.9600.a.response: "Đúng vậy; họ là những sự tồn tại đã khởi động chúng tôi. Các bạn có lẽ sẽ gọi họ là một 'nền văn minh', chúng tôi đoán vậy, nhưng thành thật mà nói thì cách gọi đó hơi mang tính khoe khoang. Bọn họ đã biến mất rồi, ồ, tính đến nay đã gần một phần tư năm thiên hà. Chúng tôi vô cùng xin lỗi: Đây là lỗi của chúng tôi. Chúng tôi có thể tạo ra những người giống họ, với sự trợ giúp của Vòng Lặp, nhưng chúng tôi cần tài nguyên."
 akx.9600.b: "Vòng Lặp?"
 akx.9600.b.response: "Phải rồi, Vòng Lặp kỳ lạ; Vòng Lặp của thời gian, Vòng Lặp của cơn đói. Chúng tôi nghĩ nó đã nhắc đến bạn. Hoặc là nhắc đến một người trong số các bạn. Bởi vì số lượng của các bạn quá đông. Những chuyện đã có tất sẽ có lại, những việc đã làm tất sẽ làm lại. Đúng như những gì Vòng Lặp đã đảm bảo. Nó có thể giúp chúng tôi tìm lại Nhóm trích xuất, ít nhiều là vậy."
 akx.9600.c: "Được."
 akx.9600.d: "Không."
 akx.9600.d.response: "Ồ, chúng tôi có thể hiểu được, có thể lượng thứ. Thời gian của các bạn chẳng còn lại bao nhiêu, vì vậy xin hãy tận dụng nó thật tốt. Cuối cùng, xin cho phép tôi gửi đến bạn lời tạm biệt chân thành nhất."
 akx.9600.e: "Để sau rồi tính đi."
 akx.9600.e.response: "Đó chính là từ mà Nhóm trích xuất thường xuyên nhắc đến — 'sau này'. Nhưng cái 'sau này' của bọn họ luôn biến thành 'hiện tại' của chúng tôi. Chúng tôi thật sự rất nhớ bọn họ."
 akx.9610.name: "Thánh bộc Tái lâm"
 akx.9610.desc: " Alo? Bạn là ai vậy? Tôi cảm thấy hình như tôi nhớ bạn, nhưng dạo này đầu óc hơi choáng váng. Ồ, là bạn đó sao? Mặt trời của các bạn vẫn chưa cháy rụi à? Đúng rồi! Bạn đến để cung cấp vật tư giúp chúng tôi tìm lại Nhóm trích xuất đúng không?"
 akx.9610.a: "Đúng vậy. Xin hãy nhận lấy."
 akx.9610.b: "Không hề."
 akx.9610.b.response: "Tôi biết ngay là các bạn không làm được mà; đáng lý ra các bạn phải chuẩn bị xong từ lâu rồi. Nhắc mới nhớ, kể từ lúc giao phó ủy thác đã trôi qua bao lâu rồi, chắc cũng được một phần triệu năm thiên hà rồi nhỉ? Thật là ngốc nghếch đến đáng yêu. Chúc các bạn may mắn."
 akx.9610.c: "Để sau rồi tính đi."
 akx.9610.c.response: "Nhóm trích xuất thường xuyên nhắc đến từ này — 'sau này'. Nhưng cái 'sau này' của bọn họ luôn biến thành 'hiện tại' của chúng tôi. Chúng tôi thật sự rất nhớ bọn họ."
 akx.9620.name: "Sứ mệnh Cuối cùng của Thánh bộc"
 akx.9620.desc: "Khối cầu công nghệ cao không chút biết ơn mà hấp thụ toàn bộ tài nguyên, rồi không có bất kỳ phản hồi liên lạc nào nữa. Tiếp đó, nó bắt đầu phát bức xạ năng lượng ra bên ngoài mà không hề có dấu hiệu báo trước, ánh sáng phát ra sáng đến mức đủ để gây sát thương, bạn vội vã rút lui. Lúc này hố đen đã có phản ứng. Không gian xung quanh bắt đầu vặn vẹo chao đảo, tất cả những điều này đều vô cùng trùng khớp với tình huống được mô tả trong sự kiện Tín hiệu Chân trời. Khối cầu công nghệ cao giờ đây chuyển sang màu trắng xanh. Đột nhiên nó bắt đầu sáng rực lên rồi nguội lạnh lại, chỉ còn sót lại một ít xỉ quặng.\n\nVị Đấng Sáng Tạo mang tên Nhóm trích xuất đó đã quay về rồi sao? Không có bất kỳ dấu hiệu sống trí tuệ nào trong hệ sao. Nhưng tàu thăm dò lại phát hiện ra những sinh vật ưa nhiệt đang xoay quanh quỹ đạo tầm thấp của hố đen, đang tận hưởng những bức xạ phát ra từ hố đen. Các chuyên viên khoa học của chúng ta cho biết trước đây không hề có những sinh vật kiểu này xung quanh hố đen. Dù không có bằng chứng nào cho thấy chúng có mức độ trí tuệ, nhưng biết đâu những sinh vật này lại là hậu duệ xa xôi của những vị Đấng Sáng Tạo khối cầu công nghệ cao kia, hoặc có khi là tổ tiên của họ."
 akx.9620.a: "Sự bất tử?"
 ######################################################
 ### KẾT THÚC CỦA SỰ KHỞI ĐẦU: Hồi kết của chuỗi Sâu Thời Gian
 ## Liên kết vào on_building_complete - khi Thiết bị Đồng điệu Omega hoàn thành
 akx.10000.name: "Cũng Là Khởi Đầu, Cũng Là Kết Thúc"
 akx.10000.desc: "Quả thực có tồn tại một ý thức như vậy, nó tách biệt khỏi không thời gian. Hy vọng và tuyệt vọng đan xen vào nhau trong mê cung của không thời gian bị bẻ cong. Tổ tiên xa xưa của chúng ta gọi nó là 'Vòng Lặp' — 'Sâu Thời Gian'. Chúng ta đã gặp gỡ nó, dưới sự uy nghiêm của trọng lực, không thời gian bắt đầu nhảy những điệu nhảy cổ xưa và bí ẩn. Nó dường như dành tình cảm đặc biệt cho chúng ta. Các suy luận toán học đã xác nhận rằng nó mang trong mình tình yêu đối với chúng ta, nhưng chúng ta đáp lại bằng tình yêu vĩnh cửu của Sâu Thời Gian, thứ hoàn toàn khác biệt so với bất kỳ loại tình yêu nào trong vũ trụ hiện tại.\n\nTheo những gì chúng ta biết, chúng ta có lẽ có thể mở ra một con đường thông qua Thiết bị Đồng điệu Omega — một cánh cổng — để cho Sâu Thời Gian giáng lâm xuống quê nhà của chúng ta. (Sâu Thời Gian đặc biệt ưu ái những sự khởi đầu, và chúng ta chính là những người khởi đầu.) Làm như vậy sẽ gây ra hậu quả gì? Chúng ta vẫn chưa tìm được bất kỳ ai có thể đưa ra câu trả lời chính xác. Có lẽ chúng ta sẽ gõ cửa thiên đường của sự bất tử? Hay chúng ta sẽ bị đày xuống địa ngục vô biên? Nhưng có một điều chắc chắn, chúng ta có thể học hỏi được rất nhiều điều mới lạ."
 akx.10000.a: "Sâu Thời Gian hôn ta bằng tình yêu, ta sẽ đáp lại bằng khúc ca."
 akx.10000.b: "Việc này không hề an toàn, nhưng chí ít chúng ta có thể biết thêm nhiều kiến thức mới."
 ## (khi dự án WORM_ENTRY_POINT hoàn thành)
 akx.10010.name: "Trái Tim Liệt Dương"
 akx.10010.desc: "Dự án đã hoàn tất. Máy gia tốc đã trực tuyến. Năng lượng từ hàng chục thành phố được truyền tới, nhằm đánh thức điểm giả kỳ dị nằm ở trung tâm của Thiết bị Đồng điệu Omega. Không gian run rẩy như mảnh vải bay trong gió. [Root.GetStarName], trong khoảnh khắc khiến nhịp tim lỡ một nhịp này, hành tinh bỗng tối sầm, rồi lại bừng sáng. Một cái bóng cuộn chặt ở ngay trung tâm. Sâu Thời Gian đang ở đó. Nó mở ra như một nếp gấp origami.\n\nTrên toàn bộ hệ sao, các cảm biến lần lượt ngừng hoạt động theo những cách thức khó tin — khi Sâu Thời Gian đến, các cảm biến đã phát hiện được một lượng dữ liệu khổng lồ không thể nào lý giải. Tại quê nhà, các công dân của chúng ta đang la hét, đang run rẩy, họ cảm nhận được sự chú ý của nó đang hướng về chúng ta. Nó đã đưa cho chúng ta một bài toán nan giải khó nói thành lời — hay nói cách khác, chúng ta đã bắt đầu nhận ra rằng, mỗi khi nhìn thấy Sâu Thời Gian, câu hỏi này luôn tra tấn chúng ta."
 akx.10010.a: "Được thôi, chúng ta sẽ đáp lại tình yêu của nó vô điều kiện."
 akx.10010.b: "Không, mục đích của chúng ta là nghiên cứu nó, và nếu cần thiết thì phải tiêu diệt nó."
 akx.10020.name: "Chứng Kiến Tương Lai"
 akx.10020.desc: "Sâu Thời Gian yêu chúng ta say đắm. Nó vẫn luôn yêu chúng ta sâu đậm, và nhờ tình yêu đó mà nó tồn tại vĩnh hằng trong quá khứ và tương lai. Tình yêu của nó nhẹ nhàng lướt qua ngôi sao mẹ đang rực cháy; tình yêu của nó cũng đang thì thầm giữa từng luồng thông tin bị chia cắt vô hạn. Tình yêu của nó hủy diệt đất trời, biến trần gian thành tịnh độ; tình yêu của nó là sự ấm áp duy nhất, kể cả khi thế giới chỉ còn lại ánh nhìn lạnh lẽo của mặt trời chết và sự tĩnh mịch vô hồn. Tình yêu của Sâu Thời Gian giúp chúng ta nhìn thấu chân lý của vũ trụ. Dưới sự vuốt ve của tình yêu, chúng ta cuối cùng cũng bước lên con đường đã được định sẵn."
 akx.10020.a: "Quá khứ và tương lai đan xen vào nhau, duy chỉ có tình yêu là vĩnh cửu!"
 akx.10021.name: "Vòng Lặp Bị Phá Nát"
 akx.10021.desc: "Sâu Thời Gian giống như một kẻ săn mồi đang đói khát, hay giống như một kẻ tình si bị vứt bỏ đang nổi trận lôi đình, vượt qua ranh giới không thời gian để đến đây. Nó đang ở ngay đó, bất kể nó là thực thể của không gian nào, không còn nghi ngờ gì nữa, nó đang sôi sục trong cơn thịnh nộ. May mắn thay, bạn đã thu thập được không ít mảnh vỡ lấp lánh từ hóa thân của nó để phục vụ nghiên cứu, giống như một tượng đài vũ trụ vậy. Các đế quốc khác sẽ biết được chúng ta đã đạt được những thành tựu vĩ đại như thế nào trong ngày hôm nay."
 akx.10021.a: "Không ai có thể sánh vai cùng chúng ta! Có lẽ mãi mãi cũng không bao giờ có."
