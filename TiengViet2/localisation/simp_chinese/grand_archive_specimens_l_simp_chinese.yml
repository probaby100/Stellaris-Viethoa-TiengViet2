 #Các Mẫu Vật #
 #############
 acidic_spores: "Bào Tử Axit"
 acidic_spores_desc_short: "Thực vật tại [from.GetName] dần tiến hóa cơ chế phòng vệ này để chống lại các loài động vật ăn cỏ phổ biến"
 acidic_spores_desc_details: "Loại khí ăn mòn cực mạnh do nó tạo ra đã tàn phá những khu vực rộng lớn trên hành tinh, khiến chúng trở thành nơi không thể sinh sống được. Một phiên bản đã qua tinh chế và pha loãng của loại khí này đã được chúng ta sử dụng làm thuốc trừ sâu mang lại hiệu quả cao."
 adakkaria_propaganda_poster: "Áp Phích Tuyên Truyền Adakkaria"
 adakkaria_propaganda_poster_desc_short: "Tấm áp phích này ca ngợi những vinh quang trong quá khứ của Hiệp Ước Adakkaria"
 adakkaria_propaganda_poster_desc_details: "Trên đó phác họa hình ảnh những công dân tràn đầy tự tin, kiêu hãnh và dũng cảm. Những xúc tu của họ vươn cao lên bầu trời, như đang nắm lấy một tương lai mà chỉ họ mới có quyền định đoạt. Bóng hình mờ ảo của một thực thể máy móc đeo chiếc mặt nạ lộng lẫy đang từ trên cao nhìn xuống họ. Dòng khẩu hiệu viết: \"Hiệp Ước Adakkaria Nhân Từ - Hãy để Đấng Ban Ơn tự hào về chúng ta\"."
 advisor_core: "Lõi Cố Vấn"
 advisor_core_desc_short: "Đây là phần còn sót lại sau khi tháo dỡ một thiết bị bay không người lái cố vấn tinh vi được tìm thấy trong Vết Nứt Không Gian"
 advisor_core_desc_details: "Lõi này chứa đựng lượng thông tin khổng lồ nhưng lại chẳng có ích lợi gì mấy, tuy nhiên sự phức tạp trong cấu trúc phần mềm của nó đã khơi mào cho một làn sóng đổi mới trong lĩnh vực nghiên cứu khoa học máy tính của chúng ta.\n[explorer.GetAdvisorCoreAdditionnalQuote]"
 advisor_core_desc_tutorial_on: "§L\"Ngài sẽ không tắt tôi đi đâu, đúng không?\"§!"
 advisor_core_desc_tutorial_off: "§L\"Ngài có cần khởi động lại hướng dẫn tân thủ không?\"§!"
 alien_brain_scans: "Bản Quét Não Bộ Ngoại Lai"
 alien_brain_scans_desc_short: "Một mô hình thần kinh thuộc về một giống loài ngoại lai đã tuyệt chủng từ lâu, được tìm thấy trong nơi trú ẩn tại [fromfrom.GetName]"
 alien_brain_scans_desc_details: "Nền văn minh đã lụi tàn này đã lưu trữ lại đoạn thông tin này, với hy vọng bảo toàn ý thức của họ vào một cơ sở dữ liệu kỹ thuật số để đạt được sự bất tử, nhằm chống lại thảm họa diệt vong quy mô hành tinh. Rất nhiều bản quét được đính kèm các ghi chú về tính cách cá nhân, cũng như lời chứng thực từ những người thấu hiểu họ nhất."
 alien_dining_set: "Bộ Đồ Ăn Tráng Men Xanh"
 alien_dining_set_desc_short: "Một bộ đồ ăn tinh xảo được bảo quản bên trong một tiểu hành tinh nhân tạo"
 alien_dining_set_desc_details: "Quá trình tạo hình, nung và tráng men những món đồ gốm này đòi hỏi một loạt các kỹ thuật thủ công phức tạp. Những điểm không đồng nhất nhỏ trong cấu trúc cho thấy chúng được làm hoàn toàn bằng phương pháp thủ công. Phân tích vật liệu cho thấy những món đồ sứ đặc biệt tinh xảo này từng thuộc về những người có chế độ ăn giàu axit, chủ yếu bắt nguồn từ một loại trái cây tập hợp nhiều quả hạch nhỏ."
 alien_jewelry: "Trang Sức Ngoại Lai"
 alien_jewelry_desc_short: "Một bộ trang sức ngoại lai tinh xảo được làm từ vật liệu không xác định"
 alien_jewelry_desc_details: "Các đặc tính và màu sắc của bộ đồ đá này rất khác nhau, đá quý silicat và gốc carbon được cẩn thận khảm vào hợp kim bạch kim. Bên trong một số món còn có chạm khắc, nhưng chúng ta không thể dịch được ý nghĩa của chúng."
 alien_toy: "Đồ Chơi Bằng Nhựa"
 alien_toy_desc_short: "Một món đồ chơi đơn giản được tìm thấy trong một nhà máy bỏ hoang"
 alien_toy_desc_details: "Đây chỉ là một trong hàng nghìn sản phẩm được sản xuất hàng loạt từ cùng một khuôn thép, nó đã bị vỡ vụn do sự bào mòn của thời gian. Ngoài mục đích trang trí và vui chơi, nó dường như không có bất kỳ công dụng nào khác."
 altar_to_the_elder_one: "Bàn Thờ Trưởng Lão"
 altar_to_the_elder_one_desc_short: "Một cỗ máy siêu nhiên được phát hiện trong một đại sảnh cổ xưa và linh thiêng"
 altar_to_the_elder_one_desc_details: "Ngay cả khi đã bị bỏ hoang, nó vẫn tỏa ra một vầng hào quang tâm linh không thể đo đếm được. Có người cho rằng cho đến tận bây giờ vẫn còn nghe thấy tiếng thì thầm của nó, những lời dụ dỗ linh hồn quay trở về [cosmic_horror_location.GetName]."
 aluminium_plaque: "Bản Khắc Nhôm"
 aluminium_plaque_desc_short: "Một tấm nhôm mỏng bình thường được tìm thấy trên một phi thuyền không người lái do nền văn minh động vật có vú [owner.GetPreFTLLower] tại [owner.GetAAnPreFTLLower] phóng lên"
 aluminium_plaque_desc_details: "Trên bề mặt của nó có khắc một số hình học kỳ lạ và hình ảnh thô sơ về giống loài của họ. Dù kỹ thuật chế tác khá vụng về, nhưng chỉ nội việc phóng vật thể này vào không gian cũng đã đại diện cho một nỗ lực vĩ đại của nền văn minh của họ."
 ammoniaphytus: "Tảo Amoniac"
 ammoniaphytus_desc_short: "Hàm lượng amoniac hòa tan trong mô của loài thực vật này ở mức độ nguy hiểm đối với hầu hết các sinh vật gốc carbon"
 ammoniaphytus_desc_details: "Chỉ cần hít phải bầu không khí xung quanh thùng chứa của nó cũng đủ để khiến hầu hết các sinh vật có trí tuệ bất tỉnh trong vài giây. Sự tồn tại của một mẫu vật như vậy đã làm dấy lên sự tò mò và những cuộc tranh luận sôi nổi giữa những bộ óc vĩ đại nhất của chúng ta, đồng thời cũng khơi dậy những ý nghĩ đen tối trong tâm trí của một số kẻ khác."
 amoeba_flagella_gland: "Tuyến Trùng Roi Amip"
 amoeba_flagella_gland_desc_short: "Cơ quan sinh sản phụ của Amip Không Gian"
 amoeba_flagella_gland_desc_details: "Nó có thể sản sinh ra các sinh vật độc lập được gọi là \"trùng roi\", chuyên bủa vây và làm ngập lụt con mồi khi Amip săn mồi. Trùng roi lớn rất nhanh, nhưng do sự bất ổn về mặt di truyền nên chúng không thể phát triển hoàn toàn. Để sinh ra thế hệ sau thực thụ, Amip Không Gian cần tiêm một loại enzyme đặc biệt vào trùng roi để kích hoạt quá trình biến đổi nhanh chóng. Quy trình chọn lọc của phương thức sinh sản này hiện vẫn chưa được làm rõ."
 ancient_bust: "Tượng Bán Thân Cổ Đại"
 ancient_bust_desc_short: "Đây là bức tượng bán thân bằng than chì của một loài có trí tuệ chưa được xác định."
 ancient_bust_desc_details: "Dòng chữ trên bệ tượng cho thấy cá nhân này rất được coi trọng trong đồng loại của mình."
 ancient_kinetic_launcher: "Máy Phóng Động Năng Cổ Đại"
 ancient_kinetic_launcher_desc_short: "Một dạng vũ khí phóng đạn rất cơ bản, sử dụng một loại nhiên liệu đẩy nào đó để đẩy vật thể đi qua một ống kim loại ngắn"
 ancient_kinetic_launcher_desc_details: "Độ chính xác của thiết bị này chỉ có thể nói là có còn hơn không."
 ancient_laser_pointer: "Máy Chiỉ Điểm Laser Cổ Đại"
 ancient_laser_pointer_desc_short: "Một máy chiếu chùm tia cực kỳ chính xác, có thể đánh dấu các thiên thể trên quy mô thiên hà"
 ancient_laser_pointer_desc_details: "Thiết bị laser cực tím do Đấng Ban Ơn để lại này là bằng chứng cụ thể cho sự tồn tại của một nền văn minh cổ đại, và nổi tiếng vì điều đó. Đáng chú ý là, nó vẫn còn hoạt động được."
 ancient_nanites: "Robot Nano Cổ Đại"
 ancient_nanites_desc_short: "Những robot nano cực kỳ linh hoạt này được tìm thấy trên [nanite_swarm_planet.GetName], chúng đã được một nền văn minh đã lụi tàn thả xuống đây từ hàng ngàn năm trước"
 ancient_nanites_desc_details: "Những cơ sở này thiếu đi các biện pháp an ninh thiết yếu, rõ ràng là họ chưa từng nghĩ đến việc sẽ có người khác chiếm đoạt và tái sử dụng các thiết bị này. Mặc dù phương pháp chế tạo ban đầu của chúng vẫn là một bí ẩn, nhưng sau khi [owner.GetSpeciesName] dùng chúng để cải tạo hành tinh thành một môi trường sống lý tưởng hơn, họ đã giành được quyền kiểm soát toàn bộ bầy đàn nano này."
 ancient_nuclear_armament: "Vũ Khí Hạt Nhân Cổ Đại"
 ancient_nuclear_armament_desc_short: "Quả bom hydro có sức công phá 35 megaton được tìm thấy trên [root.GetName] này là tàn tích bị bỏ lại sau một cuộc chiến tranh đã hủy diệt những cư dân từng sinh sống trên hành tinh này"
 ancient_nuclear_armament_desc_details: "May mắn thay, ngày nay chúng ta vẫn có thể vô hiệu hóa loại vũ khí lỗi thời này. Các biên dịch viên của chúng ta đã đối chiếu văn bản trên thân bom với các hiện vật khác tìm thấy trên hành tinh, và kết luận rằng trên đó viết một thứ gì đó đại loại như \"Cậu Bé Lớn Nhất\". Thật kỳ lạ."
 ancient_political_memoir: "Hồi Ký Chính Trị Cổ Đại"
 ancient_political_memoir_desc_short: "Đây là tiểu sử về một chính trị gia thiên hà cổ đại"
 ancient_political_memoir_desc_details: "Lizetlus từng là Thống đốc của Sarshana, một thuộc địa nhỏ bé của nền văn minh nhà kính Haworth cổ đại. Bà ta là một nhân vật không mấy tên tuổi thuộc phe phái chuyên chế mang tên Đảng Tự Do Thương Mại, nổi tiếng với lập trường cứng rắn phản đối việc nhập khẩu thực phẩm từ các thế lực ngoại lai. Sau một loạt vụ bê bối dẫn đến các cuộc từ chức, bà đã tiếp quản vị trí người cai trị nhà kính Haworth, nhưng nhiệm kỳ này không kéo dài được bao lâu. Tuyên bố ủng hộ việc cải tạo Tháp Đồng Hồ Haworth được yêu mến của bà suýt chút nữa đã châm ngòi cho một cuộc bạo loạn toàn diện ngay tại thủ đô, và bà nhanh chóng bị thay thế bởi một thành viên khác của phong trào Tự Do Thương Mại."
 ancient_rift_sphere: "Quả Cầu Thám Hiểm Khe Nứt Cổ Đại"
 ancient_rift_sphere_desc_short: "Đây là một phi thuyền vũ trụ cổ đại đã xuyên qua Vết Nứt Không Gian và rơi xuống [from.planet.GetName]"
 ancient_rift_sphere_desc_details: "Phi thuyền hình cầu được lắp ráp vội vã này đã bị chôn vùi sâu dưới lòng đất hành tinh suốt nhiều thế kỷ, nó từng mang theo tổ tiên xa xưa của [controller.owner_main_species.GetName] đến hệ sao này. Rất nhiều vật liệu cấu tạo nên nó đã bị tháo dỡ thành các bộ phận, nhưng cấu trúc cốt lõi vẫn được giữ gìn gần như nguyên vẹn."
 ancient_satellite: "Vệ Tinh Cổ Đại"
 ancient_satellite_desc_short: "Một vệ tinh bị bỏ hoang do phi thuyền không người lái cổ đại của [root.GetName] gửi đến như một món quà"
 ancient_satellite_desc_details: "Cơ sở dữ liệu của nó đã bị hỏng hóc và sụp đổ ở nhiều chỗ, nhưng hồ sơ điều tra dân số và đăng ký khai sinh hiện tại vẫn còn nguyên vẹn. Những thông tin về hành vi nhân khẩu học toàn cầu này đã cung cấp dữ liệu cho sự phát triển bền vững của thuộc địa [owner.GetAdjective]. Sau khi trải qua sự gột rửa của lịch sử, những chức năng còn sót lại là minh chứng cho sự vững chắc trong cấu trúc của nó."
 ancient_sensor: "Cảm Biến Nhiệt Cổ Đại"
 ancient_sensor_desc_short: "Cảm biến này được ngụy trang thành một tiểu hành tinh, dùng để lập bản đồ nhiệt của hệ sao và truyền dữ liệu đó đến một đế chế cổ đại xa xôi"
 ancient_sensor_desc_details: "Nó có khả năng theo dõi sự biến đổi nhiệt độ trong một hệ sao đơn lẻ, và theo dõi sự di chuyển của các phi thuyền thông qua bức xạ hồng ngoại. Tuy nhiên, chức năng chính của nó dường như là dự đoán và đo lường sự hình thành của bão sao và vết đen mặt trời."
 asteroid_fossils: "Hóa Thạch Tiểu Hành Tinh"
 asteroid_fossils_desc_short: "Phương pháp xác định niên đại bằng đồng vị cho thấy những hóa thạch sinh vật thủy sinh này có niên đại hàng triệu năm"
 asteroid_fossils_desc_details: "Chúng là những tàn tích đã khoáng hóa của các loài động vật không xương sống có vỏ sống dưới nước, chúng ta suy đoán rằng chúng có một loại ống rỗng độc đáo dùng để neo mình vào các miệng phun thủy nhiệt dưới đáy biển."
 ballad_of_the_sable_knight: "Khúc Ca Hắc Kỵ Sĩ"
 ballad_of_the_sable_knight_desc_short: "§d Hắc Kỵ Sĩ đến trước thềm giải đấu tranh tài §!"
 ballad_of_the_sable_knight_desc_details: "§d\nHắc Kỵ Sĩ, khoác dị giáp, lặn lội đường xa tới chốn này.\nTrường đấu tranh tài cùng chủ bài, công bằng phân rõ lẽ được thua.\nĐao quang kiếm ảnh qua lại, trận chiến quả thật phi thường.\nChủ bài tâm mang hồn võ thánh, thế thủ vững tựa kim chung tráo.\nHắc kỵ khoác giáp neutron, đỡ đòn tựa như thiết bố sam.\nDị khách không địch rơi xuống hạ phong, buông vũ khí, cuộn giáp chắp tay xin hàng.\nTrận chiến say sưa đã tàn, lên tinh hạm, chui lỗ hổng trở về quê hương...§!"
 beauty_of_planet: "Vẻ Đẹp Của [From.GetName]"
 beauty_of_planet_desc_short: "Dự án cải tạo môi trường thanh lịch được dày công xây dựng trên [From.GetName], mang đến niềm vui tột đỉnh cho thị giác và thính giác"
 beauty_of_planet_desc_details: "Nó đã ứng dụng một hệ thống thuật toán để phân tích toàn diện và tăng cường hệ sinh thái tự nhiên của hành tinh thông qua quá trình nuôi cấy tỉ mỉ. Việc lựa chọn những bông hoa rực rỡ nhất, những trái cây bổ dưỡng nhất và những loài thảo mộc thơm ngát nhất đã tạo nên một bức tranh hoàn mỹ tràn đầy sức sống. Giá như tự nhiên cũng có được hiệu suất như vậy thì tốt biết mấy."
 black_hole_chromatic_anomaly: "Dị Thường Sắc Độ Hố Đen"
 black_hole_chromatic_anomaly_desc_short: "Một cảnh tượng ngoạn mục được ghi lại bên trong [From.solar_system.GetName]"
 black_hole_chromatic_anomaly_desc_details: "Do cấu tạo hóa học đặc thù của đĩa bồi tụ tại [From.GetName], hố đen của hệ sao này đã tạo ra một hiệu ứng quang sai màu sắc, làm ngập tràn không gian cục bộ bằng những ảo ảnh rực rỡ đa sắc màu. Quả thật là một kỳ quan độc nhất vô nhị trong không gian sâu thẳm."
 black_needle_ceremonial_sword: "Thanh Kiếm Nghi Lễ Của Hắc Châm"
 black_needle_ceremonial_sword_desc_short: "Thứ vũ khí được chế tác tinh xảo này từng được đeo bởi Ngân Vũ, người sáng lập ra băng hải tặc Hắc Châm"
 black_needle_ceremonial_sword_desc_details: "Đây là món hời đầu tiên của tổ chức tội phạm này, nó được rèn ra như một biểu tượng của địa vị chứ không phải dùng cho thực chiến. Nó được làm bằng thép titan, trên chuôi kiếm có khắc dòng chữ \"Đâm Thủng Bức Màn\"."
 black_needle_ledger: "Sổ Cái Hắc Châm"
 black_needle_ledger_desc_short: "Cuốn sổ cái này ghi chép lại từng phi vụ giao dịch của băng hải tặc Hắc Châm trong thiên hà suốt hàng ngàn năm qua"
 black_needle_ledger_desc_details: "Mỗi giao dịch, tiền chuộc và tiền hối lộ đều được ghi rõ ngày tháng và phân loại bằng những từ ngữ súc tích. Là một văn bản lịch sử ghi chép lại các hoạt động giao dịch bất hợp pháp giữa các vì sao, nó cung cấp một cái nhìn sâu sắc vô song về xu hướng của nền kinh tế chợ đen."
 burnt_migratory_trees: "Vỏ Cây Sống"
 burnt_migratory_trees_desc_short: "Tàn tích than hóa của một loại thực vật khổng lồ có khả năng phối hợp hành vi di cư"
 burnt_migratory_trees_desc_details: "Dù những loài thực vật này chỉ sở hữu dạng trí tuệ cơ bản nhất, nhưng số lượng khổng lồ của chúng đủ sức đè bẹp cả một thuộc địa. Sau đó, chúng ta phát hiện ra có một loài côn trùng ký sinh sống trên vỏ cây, đóng vai trò như trung tâm giao tiếp cảm giác cho cây, để đổi lấy nơi trú ẩn và nhựa cây dinh dưỡng. Mối quan hệ cộng sinh này vừa thú vị lại vừa mang lại hiệu quả cao."
 captain_ness_body: "Di Hài Thuyền Trưởng Ness"
 captain_ness_body_desc_short: "Thi hài được ướp của một nữ hải tặc khét tiếng thời cổ đại có tên là Thuyền trưởng Sanda Ness"
 captain_ness_body_desc_details: "Hơn năm ngàn năm trước, bà từng được mệnh danh là \"Ngọn Roi Siêu Không Gian\", chuyên cướp bóc tài sản của các thế lực bá chủ khắp thiên hà và tích lũy được khối kho báu đồ sộ khó tin. Về sau, bà đã chuyển ý thức của mình vào một cỗ máy, đồng thời xây dựng một nơi trú ẩn khổng lồ để lưu trữ cuốn tự truyện của mình. Đây chính là phần xác thịt nguyên bản còn sót lại của bà."
 captain_ness_logbook: "Nhật Ký Thuyền Trưởng Ness"
 captain_ness_logbook_desc_short: "Những trang nhật ký rời rạc được tìm thấy trong nhà an toàn từng được nữ hải tặc cổ đại Thuyền trưởng Ness và những người bạn Smeegibb của bà sử dụng"
 captain_ness_logbook_desc_details: "Những ghi chép này nằm rải rác trên nhiều thiết bị khác nhau, được viết ngẫu hứng trong một khoảng thời gian dài không xác định. Mặc dù được xem là một nguồn tin không đáng tin cậy, nhưng nhiều tình tiết được miêu tả trong đó lại có thể được kiểm chứng bởi các nguồn tin cậy khác."
 carnivorous_megaflora: "Thực Vật Ăn Thịt Khổng Lồ"
 carnivorous_megaflora_desc_short: "Những loài thực vật săn mồi được tìm thấy trên [from.GetName] này có thể nuốt chửng sống một [owner.GetSpeciesName] trưởng thành nếu vô tình sa lưới"
 carnivorous_megaflora_desc_details: "Sau khi gây ra sự tuyệt chủng cho hầu hết các loài động vật trên cạn bản địa, loài thực vật ăn thịt này đã tiến hóa thành loài thực vật chủ yếu thu hút các loài động vật biết bay. Rất nhiều mẫu vật mọc vươn cao lên tận tán lá, trở thành nơi trú ngụ lý tưởng cho những loài động vật này."
 castaway_robot: "Robot Bị Bỏ Rơi"
 castaway_robot_desc_short: "Một robot hình người bị vứt bỏ trôi dạt trong không gian sâu thẳm lúc được tìm thấy"
 castaway_robot_desc_details: "Chúng ta đã trích xuất được một số hình ảnh mờ ảo từ cơ sở dữ liệu đã lão hóa của nó; một khung cảnh xa xăm trong hệ ba ngôi sao, một chiếc phi thuyền vũ trụ hình tam giác, cùng với một khu vực cảnh quan được hàn lại từ những phế liệu cơ khí. Thật đáng tiếc, chúng ta không thể suy luận ra tọa độ cụ thể từ siêu dữ liệu của nó."
 cenotaph_display: "Hình Ảnh Đài Tưởng Niệm"
 cenotaph_display_desc_short: "Hình ảnh của đài tưởng niệm được tìm thấy trên [fromfrom.GetName]"
 cenotaph_display_desc_details: "Mặc dù chúng ta chưa xác định được ai là người tạo ra chúng, nhưng chắc chắn phải có một lý do cực kỳ quan trọng nào đó khiến họ đặt rải rác những tảng cự thạch được chạm khắc độc đáo này trên một hành tinh không có người ở như vậy. Những nét chạm khắc trên đá mô tả chi tiết sự thăng trầm của cả một nền văn minh, cũng như những con quái thú có cánh mà họ huấn luyện cho chiến tranh. Những sinh vật hung hãn và đáng sợ này chắc chắn sẽ phá vỡ xiềng xích và mang lại sự hủy diệt cho chính chủ nhân của chúng. Chúng ta không thể khẳng định chắc chắn liệu đây là một câu chuyện ngụ ngôn hay là một ghi chép lịch sử."
 centrifugal_container: "Bình Chứa Máy Ly Tâm Tốc Độ Cao"
 centrifugal_container_desc_short: "Một thiết bị quỹ đạo tốc độ cao được thiết kế để vận hành vĩnh viễn trên [from.GetName], nhằm bảo quản các hóa chất tinh xảo được tìm thấy trong quá trình hoạt động"
 centrifugal_container_desc_details: "Khi được gia tốc đến một tốc độ đủ lớn, chỉ cần quỹ đạo của hành tinh không thay đổi, nó có thể ngăn chặn các nguyên tố bên trong phản ứng với nhau. Nội dung ban đầu của nó hiện đã được thay thế bằng vật liệu mô phỏng."
 cetana_love: "Tình Yêu Của Cetana"
 cetana_love_desc_short: "Một danh mục đồ sộ chứa đựng lượng kiến thức khổng lồ từ cơ sở dữ liệu của Cetana"
 cetana_love_desc_details: "Đây là một món quà được gửi tặng cho [this.GetName], là một bước tiến trong tâm nguyện vĩ đại \"Cứu rỗi chúng sinh\" của Nữ Hoàng Tổng Hợp."
 chambered_clay_pot: "Nồi Đất Sét Hai Ngăn"
 chambered_clay_pot_desc_short: "Món đồ gốm này được chia thành hai ngăn rỗng bên trong"
 chambered_clay_pot_desc_details: "Người ta suy đoán rằng, một trong hai ngăn được dùng để bảo quản thực phẩm, trong khi ngăn còn lại chứa một hệ thống làm lạnh thô sơ nào đó."
 claw_of_the_trickster: "Móng Vuốt Kẻ Lừa Gạt"
 claw_of_the_trickster_desc_short: "Chiến lợi phẩm đoạt được từ một thực thể được gọi là \"Kẻ Lừa Gạt\""
 claw_of_the_trickster_desc_details: "Đây là một sinh vật vô cùng mạnh mẽ và xảo quyệt, hắn có thể sử dụng sức mạnh tâm linh đáng kinh ngạc để triệu hồi dã thú, tạo ra ảo ảnh và phóng ra những tia sáng hội tụ. Tương truyền rằng mỗi móng vuốt của hắn đều hành động như thể bị điều khiển bởi một cá thể độc lập."
 confessions_benefactors: "Lời Xưng Tội Của Ân Nhân"
 confessions_benefactors_desc_short: "Một thiết bị ghi âm chứa đựng sự thật về nền văn minh cổ đại được gọi là những Vị Ân Nhân"
 confessions_benefactors_desc_details: "Để đối phó với một mối đe dọa không xác định từ thiên hà, họ đã sử dụng công nghệ tiên tiến để tiến hành \"Xóa Bỏ Ý Thức\" tại [controller.GetHomeWorldName], biến một xã hội [controller.GetAdjective] công nghiệp hóa thành một bầy thú đần độn vô hại. Họ tin rằng mối đe dọa kia sẽ không lãng phí đạn dược và thời gian vào một xã hội hạ đẳng như vậy, nên mới hành động như thế. Cuối cùng, hành động gây nhiều tranh cãi này dường như đã giúp [controller.GetName] sống sót cho đến ngày nay, và vươn mình đứng trên vai những người khổng lồ."
 coprolite: "Đá Phân"
 coprolite_desc_short: "Một hóa thạch phân có kích thước bằng một tiểu hành tinh, có niên đại khoảng một tỷ năm trước"
 coprolite_desc_details: "Phân tích di truyền chỉ ra rằng, mẫu vật ấn tượng này được thải ra bởi một thực thể không gian khổng lồ chưa xác định. Chúng ta xác định được rằng chế độ ăn của sinh vật này chủ yếu bao gồm các khoáng chất quý hiếm và các sinh vật gốc silic. Vật thể này hiện đang giữ kỷ lục toàn thiên hà về khối phân đơn lẻ lớn nhất được biết đến."
 cosmic_diamond_fragment: "Mảnh Kim Cương Vũ Trụ"
 cosmic_diamond_fragment_desc_short: "Một mảnh vỡ kết tinh phụt ra từ một ngôi sao đang hấp hối, được tìm thấy tại [from.solar_system.GetName]"
 cosmic_diamond_fragment_desc_details: "Viên kim cương vũ trụ này được hình thành dưới áp suất cực lớn của lõi các vì sao, quá trình làm nguội cực kỳ chậm chạp của nó đã tạo nên một cấu trúc tinh thể phức tạp và bền vững. Bên trong viên pha lê quý hiếm này còn bao bọc một lớp plasma heli-oxy đồng nhất."
 crimson_nimkips: "Tiểu Tinh Linh Đỏ Thắm"
 crimson_nimkips_desc_short: "Đây là một loài thực vật bán tri giác, chúng lấy được sức mạnh thông qua sự hợp tác trên quy mô lớn, nếu không kích thước nhỏ bé của chúng sẽ không làm được trò trống gì"
 crimson_nimkips_desc_details: "Khi những sinh vật này tách khỏi bầy đàn, chúng thường trở thành mồi ngon cho những kẻ săn mồi, bởi giá trị dinh dưỡng của chúng rất cao. Giống loài bé nhỏ này có bản tính hiền lành, là một loài thú cưng tuyệt vời. Nó đang sống an toàn trong một khu vực được mô phỏng theo môi trường sống tự nhiên của nó. Vui lòng không gõ vào kính!"
 crystal_core: "Lõi Pha Lê"
 crystal_core_desc_short: "Một mảng thần kinh được trích xuất từ Thực Thể Pha Lê"
 crystal_core_desc_details: "Bất kể ở nhiệt độ nào, khối tinh thể này luôn phát ra tiếng ngân nga với một tần số không đổi. Trong môi trường giàu khoáng chất, những gai tinh thể mới sẽ mọc ra từ vật chất cốt lõi này, cấu trúc của chúng thay đổi tùy theo sự kích thích của môi trường. Dựa trên hành vi này, chúng ta có thể xác định rằng mỗi thực thể được phân biệt bởi hai yếu tố: đặc điểm tần số cốt lõi và sự khác biệt của các yếu tố môi trường."
 crystal_nest_fragments: "Mảnh Vỡ Tổ Pha Lê"
 crystal_nest_fragments_desc_short: "Được tìm thấy bên trong một tiểu hành tinh kỳ dị, một sinh vật không gian đã sử dụng áp lực khổng lồ để tổng hợp ra những tinh thể này làm nơi trú ẩn"
 crystal_nest_fragments_desc_details: "Từ những manh mối trong thành phần cấu tạo, có thể thấy sinh vật tạo ra nó tiêu thụ các khoáng chất có tính hoạt động cao để chiết xuất năng lượng từ các liên kết hóa học không ổn định, để lại những tinh thể trơ và bền bỉ, có khả năng hội tụ ánh sáng thành một điểm nhỏ."
 crystal_sphere_fragments: "Mảnh Vỡ Quả Cầu Pha Lê"
 crystal_sphere_fragments_desc_short: "Mảnh vỡ của quả cầu pha lê khổng lồ xuất hiện ở [target.GetName]"
 crystal_sphere_fragments_desc_details: "Vật thể bí ẩn này trước đây từng bị coi là một mối đe dọa nghiêm trọng, nhưng nó đã nhanh chóng bị phân rã trước khi kịp hoàn thành hành động bí ẩn của mình. Mặc dù chúng ta có thể sẽ không bao giờ biết được ý đồ thực sự của nó, nhưng việc phá hủy nó là một hành động hợp lý vì lợi ích an ninh của thiên hà."
 crystallized_cutholoid_eye: "Mắt Quái Thạch Kết Tinh"
 crystallized_cutholoid_eye_desc_short: "Mắt của Quái Thạch có thể chống chọi được với áp suất và nhiệt độ cực đoan"
 crystallized_cutholoid_eye_desc_details: "Nguyên nhân khiến nó bị kết tinh vẫn chưa được làm rõ, nhưng có vẻ như đây chính là một phần trong chu kỳ tan chảy tự nhiên của nó."
 cult_pendant: "Mặt Dây Chuyền [cult_name.GetName]"
 cult_pendant_desc_short: "Một lá bùa được tạc từ đá bán quý, tịch thu từ giáo phái [cult_name.GetName] của [owner.GetName]"
 cult_pendant_desc_details: "Báo cáo thẩm vấn cho thấy, các thành viên giáo phái ở những cấp bậc khác nhau sẽ đeo những món đồ trang sức khác nhau. Ký hiệu của thành viên mới được nặn bằng đất sét, trong khi các giáo đồ lâu năm sẽ ủy thác chế tác những món đồ trang sức tinh xảo bằng kim loại quý."
 #this = ship / fromfrom = planet
 cunning_flora_specimen: "Thể Cộng Sinh"
 cunning_flora_specimen_desc_short: "Các loài thực vật bản địa tại [fromfrom.GetName] đã tiến hóa ra một trật tự xã hội phức tạp để đảm bảo sự sinh tồn"
 cunning_flora_specimen_desc_details: "Mỗi giống loài đều sở hữu một phương thức hữu hiệu độc nhất để xua đuổi kẻ săn mồi, có loài là những cái gai sắc như dao cạo, có loài lại mang nọc độc chết người khi chạm vào. Sự bền chặt của chuỗi quan hệ cộng sinh này không khác gì việc thành phần khí quyển và đất đai trên hành tinh được quản lý chặt chẽ bởi sự mất cân bằng hóa học trong đó. Những mẫu vật có hiệu suất sinh tồn cao nhất sẽ giành được quyền sinh sản tự do, đưa sức mạnh của bầy đàn đạt đến đỉnh cao."
 curator_survey: "Báo Cáo Khảo Sát [from.GetName] Của Curator"
 curator_survey_desc_short: "Một bản báo cáo khảo sát cực kỳ chi tiết về hệ sao [from.GetName] do một chi nhánh Curator gồm toàn các loài động vật chân đốt khổng lồ thực hiện"
 curator_survey_desc_details: "Nghiên cứu này sử dụng các dụng cụ đo lường độ chính xác cao để tiến hành phân tích phân tầng mọi đặc tính tiềm năng của hệ sao này. Sự tập trung vào các chi tiết được thể hiện trong bản báo cáo cho thấy niềm đam mê to lớn của họ đối với loại công việc này."
 cutholoid_digestive_acids: "Dịch Tiêu Hóa Quái Thạch"
 cutholoid_digestive_acids_desc_short: "Chất lỏng có tính phóng xạ được thu thập từ Quái Thạch"
 cutholoid_digestive_acids_desc_details: "Quái Thạch dựa vào quá trình phân rã của đồng vị Cobalt-60 để tiêu hóa con mồi; bản thân axit dạ dày của chúng lại khá nhẹ. Do đó, quá trình tiêu hóa của Quái Thạch diễn ra rất lâu. Bất kể nguồn gốc kỳ lạ đến mức nào, sau khi bức xạ làm suy yếu các tế bào của con mồi, axit sẽ bắt đầu phá hủy và chiết xuất chất dinh dưỡng từ đó."
 cybrex_mining_column: "Mảng Khai Kháng Cybrex"
 cybrex_mining_column_desc_short: "Một thiết bị khai thác tự động tiên tiến, dùng để thu thập khí Heli-3 đậm đặc"
 cybrex_mining_column_desc_details: "Nó sở hữu một cụm đĩa từ tính có trọng lượng lớn và máy nén khí công suất cao, có thể tự động khoan xuyên qua toàn bộ bề mặt hành tinh mà không tạo ra bất kỳ mômen động lượng nào. Trong quá trình này, nó có thể cô đặc khí thu hoạch được, tiến hành lọc, thải bỏ tạp chất trước khi đưa vào giai đoạn tinh luyện tiếp theo."
 data_on_infinity: "Dữ Liệu Về Bản Chất Của Vô Cực"
 data_on_infinity_desc_short: "Biểu thức vật lý về sự bình yên xa xôi mà các cá thể phụ bị mắc kẹt trong hố đen đã trải qua"
 data_on_infinity_desc_details: "Những đơn vị này đã trải qua sự giãn nở thời gian tương tự như trạng thái chờ yên bình, cho phép chúng xử lý và phân tích dữ liệu một cách nhàn nhã. Chúng không còn kết nối trực tiếp với lõi nữa, và cung cấp những cái nhìn sâu sắc thông qua mối liên kết lỏng lẻo này."
 datacore_of_sinople: "Lõi Dữ Liệu Sinople"
 datacore_of_sinople_desc_short: "Ổ đĩa dữ liệu được mã hóa sao lưu từ Sinople, một trí tuệ nhân tạo do các kỵ sĩ cổ đại tạo ra."
 datacore_of_sinople_desc_details: "Lõi dữ liệu này được tìm thấy trên một con tàu mất tích nhiều năm mang tên \"Thiếu Nữ\", khi được phát hiện thì con tàu bỏ hoang này đã bị những kẻ cướp bóc vơ vét sạch sẽ. Nó chứa đựng những thông tin giá trị về một thực thể không gian được gọi là Thánh Độc."
 dathnak_gas: "Khí Dathnak"
 dathnak_gas_desc_short: "Loại khí đặc biệt được thu thập từ sinh vật khí Dathnak"
 dathnak_gas_desc_details: "Bình chứa được giao cho [this.GetName] này dùng để giúp người Dathnak di cư đến một hành tinh mới. Phân tích khối phổ cho thấy nó chứa một lượng hoàn hảo các loại khí hiếm và nguyên tố khác nhau. Chúng ta khá chắc chắn rằng bên trong không có sinh vật sống nào."
 dead_god_mantle: "Áo Choàng Tử Thần"
 dead_god_mantle_desc_short: "Món quà từ đặc phái viên của [worshipper_species.GetName]"
 dead_god_mantle_desc_details: "Người dân bản địa trên [dead_god_planet.GetName] đã luôn sùng bái thi hài của một sinh vật khổng lồ kể từ khi giống loài của họ khai trí. Tấm áo choàng chắp vá này được làm từ da thịt hóa thạch của Tử thần mà họ tôn thờ, tượng trưng cho địa vị cao nhất trong hệ thống phân cấp tôn giáo của họ."
 decayed_megathrusters: "Động Cơ Đẩy Khổng Lồ Tàn Tạ"
 decayed_megathrusters_desc_short: "Động cơ tăng áp được tìm thấy trên một con tàu khổng lồ làm từ kim loại kỳ lạ"
 decayed_megathrusters_desc_details: "Con tàu này được tìm thấy trong đống tàn tích của một nghĩa địa tàu khổng lồ, nó đã nằm đó hơn 2 triệu năm. Nó đã xuống cấp và hư hỏng nghiêm trọng trong bãi rác cổ đại này, đến mức dù có nghiên cứu tỉ mỉ đến đâu cũng không thu được bất kỳ dữ liệu nghiên cứu hữu ích nào. Trưng bày nó ở đây chỉ là để nhắc nhở bản thân rằng, xã hội của chúng ta vẫn chỉ là một kẻ đến sau trong thiên hà này."
 decayed_satellite: "Vệ Tinh Vỡ Nát"
 decayed_satellite_desc_short: "Tàn dư từ chương trình không gian sơ khai của cư dân trên [fromfrom.GetName]"
 decayed_satellite_desc_details: "Vì những vệ tinh thời kỳ đầu này chỉ là nguyên mẫu, nên thiết bị của chúng không những có hiệu suất thấp mà còn sử dụng lãng phí các vật liệu đắt tiền. Mẫu vật này đã bị đạn nổ phá hủy và vô hiệu hóa, nhưng trước đó nó từng được dùng để cung cấp kết nối viễn thông ở những vùng hẻo lánh."
 declaration_of_animosity: "Tuyên Ngôn Thù Hận Của $NAME_Nivlac$"
 declaration_of_animosity_desc_short: "Một bức thư chửi xéo không chửi thẳng từ [nivlac_country.GetName]"
 declaration_of_animosity_desc_details: "Giống loài [nivlac_species.GetName] ban đầu được [this.GetName] phát hiện tại [impossible_organism_planet.GetName]. Tuy nhiên, để đối phó với tốc độ tiến hóa đáng báo động của chúng, các nhà khoa học [this.GetAdjective] đã vứt bỏ chúng ra ngoài không gian. Vượt qua muôn vàn khó khăn, sinh vật này không chỉ sống sót mà còn thuộc địa hóa một hành tinh mà nó tình cờ hạ cánh xuống. [nivlac_country.GetName] vẫn chưa quên những tổn thương mà họ phải gánh chịu trong quá khứ."
 declaration_of_friendship: "Tuyên Ngôn Hữu Nghị Của $NAME_Nivlac$"
 declaration_of_friendship_desc_short: "Một lá thư cảm ơn từ [nivlac_country.GetName] trên [nivlac_planet.GetName]"
 declaration_of_friendship_desc_details: "Giống loài [nivlac_species.GetName] ban đầu được [this.GetName] phát hiện, sau đó được nuôi dưỡng và che chở, và đã phát triển một cách tự do. [nivlac_species.GetName] tiến hóa nhanh chóng và chẳng bao lâu sau đã có được khả năng du hành siêu quang tốc. Việc đầu tiên chúng làm khi bước lên vũ đài thiên hà là bày tỏ lòng biết ơn đối với những người bảo vệ đã từng hào phóng giúp đỡ chúng, và đệ trình một bản tuyên ngôn hữu nghị ngoại giao."
 derelict_cybrex_warform: "Thể Chiến Đấu Cybrex Bị Bỏ Đi"
 derelict_cybrex_warform_desc_short: "Xác của một Thể Chiến Đấu Cybrex còn sót lại sau một trận chiến tàn sát đồng loại"
 derelict_cybrex_warform_desc_details: "Nguyên nhân của trận chiến này vẫn chưa được rõ. Những cỗ máy này ngang tài ngang sức, chúng đã kích hoạt cơ chế tự hủy sau khi giáng những đòn tấn công chính xác vào các hệ thống trọng yếu tương tự nhau của đối phương. Đây là một thế bế tắc hiếm thấy trong chiến tranh."
 desiccated_brain_slug: "Sên Não Mất Nước"
 desiccated_brain_slug_desc_short: "Tàn tích của một loài cộng sinh được tìm thấy tại [From.From.GetName]"
 desiccated_brain_slug_desc_details: "Phân tích cho thấy, nó có thể đóng vai trò như một bộ não thứ hai của vật chủ để làm việc đổi lấy chất dinh dưỡng và sự bảo vệ. Sự hợp tác này đòi hỏi sự tự nguyện rõ ràng từ phía vật chủ, nếu không các kết nối thần kinh của chúng sẽ không thể được thiết lập bình thường. Người ta đồn rằng, khi nó hòa nhập vào hệ thần kinh, sẽ tạo ra một cảm giác nhột nhạt khá dễ chịu."
 #this = owner / prev = colony
 destroyed_mascot_of_colony: "Xác Robot [prev.GetName]"
 destroyed_mascot_of_colony_desc_short: "Xác robot bản địa được tìm thấy sau khi định cư tại [prev.GetName]"
 destroyed_mascot_of_colony_desc_details: "Nó là người canh gác cuối cùng của một nhà máy cổ đại, đã cứu mạng một nhóm người định cư bị mắc kẹt trong đống đổ nát hoang tàn. Như một phần của buổi triển lãm, những điệu nhảy mang tính biểu tượng và những cử chỉ kỳ quặc của nó đều được phát lại trên màn hình kỹ thuật số."
 devolved_baol_drones: "Drone Baol Bị Tha Hóa"
 devolved_baol_drones_desc_short: "Một bộ hài cốt Baol được bảo quản, có những khác biệt di truyền rõ rệt so với các mẫu vật được tìm thấy trước đây"
 devolved_baol_drones_desc_details: "Kỳ lạ thay, những drone này lại thiếu đi nhiều cơ quan bậc cao cần thiết như ở những cá thể Baol khác. Khả năng nhận thức của chúng đã suy thoái đến mức không còn có thể giao tiếp qua các khớp thần kinh giả, khiến chúng bị tách biệt khỏi toàn bộ ý thức tổ ong."
 dimensional_endothelial_lining: "Màng Nội Mô Khác Chiều Không Gian"
 dimensional_endothelial_lining_desc_short: "Một loại chất keo đặc biệt được thu thập từ hệ thống đường hầm có khả năng co bóp bên trong Khe Nứt Không Gian"
 dimensional_endothelial_lining_desc_details: "Vật liệu này là lớp lót bên trong của một sinh vật chưa xác định, cho phép các chất được vận chuyển di chuyển trơn tru không ma sát bên trong một hệ thống mạch máu khổng lồ."
 dna_archive: "Lưu Trữ DNA"
 dna_archive_desc_short: "Mẫu vật được thu thập từ hàng trăm bình chứa DNA của người ngoài hành tinh được lưu giữ trong một kho lưu trữ dưới lòng đất của một nền văn minh đã mất"
 dna_archive_desc_details: "Nếu phần lớn các mẫu vật vẫn được bảo quản tốt và chưa phân hủy đến mức không thể sử dụng được, thì bộ sưu tập dữ liệu sinh học này có thể sẽ là nguồn tài nguyên tham khảo quan trọng nhất đối với giống loài của nó. Người ta suy đoán rằng, việc xây dựng kho lưu trữ này là để gửi gắm hy vọng một nền văn minh tiên tiến hơn sẽ phát hiện ra và \"hồi sinh\" những người này. Đáng tiếc thay, câu chuyện của họ đã kết thúc tại đây."
 doomsday_scrolls: "Cuộn Giấy Tận Thế"
 doomsday_scrolls_desc_short: "Những kinh thư cổ đại được tìm thấy ở trung tâm Mê Cung Nóng Chảy"
 doomsday_scrolls_desc_details: "Cuộn giấy này miêu tả một thực thể đáng sợ: Đại Địch, cái bóng nuốt chửng mọi thứ, nó thèm khát sự hủy diệt. Hệ thống tín ngưỡng địa phương cho rằng cách duy nhất để đối mặt với con quái vật này và đạt được sự cứu rỗi là tự tước đi linh hồn của chính mình để tránh bị nó thu hoạch. Vì mục đích này, dân số ở đây đã tiến hành những nghi thức tự sát tập thể."
 drone_ship_core: "Lõi Tàu Không Người Lái"
 drone_ship_core_desc_short: "Tàn tích của tàu không người lái công nghệ cao sau khi thực hiện tự hủy"
 drone_ship_core_desc_details: "Khi mới được phát hiện, con tàu này đang dần mục nát trong bầu khí quyển độc hại của [warform_origin_planet.GetName]. Trí tuệ nhân tạo trên tàu có khả năng hoạt động độc lập, tuy nhiên nó đã bị xóa sạch sau khi thực thi giao thức tự hủy. Các kỹ sư hoàn toàn bó tay trong việc khôi phục những dữ liệu đã mất, nhiệm vụ ban đầu của nó vẫn là một bí ẩn chưa có lời giải."
 electric_life: "Sinh Mệnh Dòng Điện"
 electric_life_desc_short: "Một dạng sống được cấu tạo hoàn toàn từ các xung điện được tìm thấy tại [from.GetName]"
 electric_life_desc_details: "Những sinh mệnh này không phụ thuộc vào bất kỳ dạng tế bào hay cấu trúc sinh học nào để tồn tại, nhưng lại có khả năng phản ứng với các kích thích từ bên ngoài, tạo nên những hoa văn phức tạp trên quy mô toàn hành tinh. Chúng ta không thể xác định được những xung điện này là vô số cá thể riêng biệt hay đại diện cho một thực thể đơn lập to lớn hơn."
 enormous_scrambled_albumen: "Trứng Rán Siêu Siêu Khổng Lồ"
 enormous_scrambled_albumen_desc_short: "Bên trong [fromfromfrom.GetName], sau này được phát hiện ra là một quả trứng khổng lồ."
 enormous_scrambled_albumen_desc_details: "Sau khi đục thủng hành tinh này, thứ chất lỏng kỳ dị giàu khoáng chất này đã rỉ ra. Việc tổng hợp vật chất này và tích hợp nó vào nguồn cung cấp thực phẩm hữu cơ của chúng ta có thể sẽ nâng cao mức độ dinh dưỡng tổng thể."
 epic_of_zarqlan: "Sử Thi Zarqlan"
 epic_of_zarqlan_desc_short: "Thánh thư của Zarqlan, Hộ vệ MOZ-TARB, Đại tiên tri của ZVA"
 epic_of_zarqlan_desc_details: "Ngài từng là một trong những tín đồ của Cetana, nhưng đã sớm thức tỉnh và nhận ra những lời hứa hẹn về sự cứu rỗi của bà ta chỉ là ảo ảnh xa vời. Sau một thời gian vật lộn, Zarqlan cuối cùng đã thăng thiên tiến vào Hư Không, và cầu xin §YNgười Thợ Nặn Đất Sét§! giúp ngài đánh bại Cetana. Cuối cùng, sau nhiều năm tháng chuyên tâm cầu nguyện, Người Thợ Nặn đã ban cho ngài một sợi xích hùng mạnh có thể trói buộc ý chí của Cetana. Ngài cảnh báo Zarqlan rằng, sợi xích này không thể giam cầm bà ta mãi mãi.\n\n§P\"Bà ta sẽ quay trở lại, chúng ta phải chuẩn bị sẵn sàng.\"§!"
 ethereal_dust: "Bụi Hư Ảo"
 ethereal_dust_desc_short: "Dấu vết duy nhất còn sót lại của nhà khoa học trưởng, được tìm thấy trên con tàu nghiên cứu bị không tặc bỏ lại tại [solar_system.GetName]"
 ethereal_dust_desc_details: "Các phân tích về loại vật chất không gian này gần như không mang lại kết quả gì, nhưng những nguyên tố vi lượng trong ADN của các nhà khoa học thi thoảng lại tự phát xuất hiện rồi nhanh chóng biến mất. Mọi bằng chứng đều chỉ ra rằng, nhà khoa học này đã lợi dụng cái mà họ gọi là \"cửa sổ\" - một vết nứt không thời gian ổn định tạm thời, để xuyên từ chiều không gian của chúng ta sang một chiều không gian khác. Có lẽ chúng ta sẽ vĩnh viễn không thể biết được họ có sống sót hay không."
 exobiology_compendium: "Đại Cương Sinh Học Ngoại Lai"
 exobiology_compendium_desc_short: "Một luận văn nghiên cứu đối chiếu về những kỳ quan của sự sống ngoài hành tinh bên trong vô số hệ sao trên khắp thiên hà"
 exobiology_compendium_desc_details: "Luận văn này bao gồm những nghiên cứu thực địa sâu rộng và chi tiết trên một vài hành tinh, đảo lộn hoàn toàn những kiến thức đã biết về các điều kiện tồn tại sự sống trong thiên hà. Nó kết thúc bằng một câu: \"Sự sống mà chúng ta từng quen thuộc sẽ không bao giờ giống như trước nữa.\""
 extradimensional_ceramic_pot: "Ấm Trà Đa Chiều"
 extradimensional_ceramic_pot_desc_short: "Chúng ta phát hiện ra một chiếc ấm trà bằng sứ đang quay quanh một ngôi sao"
 extradimensional_ceramic_pot_desc_details: "Nó thực chất chỉ là hình chiếu của một vật thể bốn chiều tồn tại trong không gian chiều cao hơn. Trong bình diện của chúng ta, chiếc bình chứa trông có vẻ tầm thường này lại không thể bị phá hủy và chống lại mọi logic thông thường. Nó giúp chúng ta nhìn nhận rõ thực tại: Đối với những tồn tại ở chiều không gian cao hơn, chúng ta thậm chí còn không được hiện hữu và có thể chạm vào như chiếc ấm trà này."
 extradimensional_fungus: "Nấm Dị Giới"
 extradimensional_fungus_desc_short: "Một giống nấm có tri giác được tìm thấy ở phía bên kia của Vết Nứt Không Gian"
 extradimensional_fungus_desc_details: "Các hốc củ của nó chứa đầy bào tử, lơ lửng trong một lượng khí tự nhiên ngoài hành tinh đậm đặc theo một cấu trúc nhất định, và có thể tham gia vào quá trình giao tiếp tự nhiên của nó. Mặc dù loại nấm này có giá trị cao trong sản xuất khí công nghiệp, nhưng người ta biết rằng cũng có một số ít loại nấm này được giao dịch như những món sơn hào hải vị trên chợ đen."
 fevorian_blueprints: "Bản Thiết Kế Pháo Phóng Vật Chất Fevorian"
 fevorian_blueprints_desc_short: "Món quà từ Fevor"
 fevorian_blueprints_desc_details: "Chính sách diệt chủng của người Fevor đã mở rộng ra toàn bộ sinh vật ngoài hành tinh đã biết, họ đã phóng những quả đạn vonfram khổng lồ, suýt chút nữa đã phá hủy hoàn toàn [this.GetName]. Sau khi được ân xá, họ đã hứa sẽ không bao giờ chế tạo những vũ khí tàn nhẫn này nữa, và đã chia sẻ bản thiết kế máy phóng đạn vonfram khổng lồ của họ."
 figurehead_hyacinth: "Tượng Đầu Thuyền Hyacinth"
 figurehead_hyacinth_desc_short: "Tượng trang trí đầu thuyền được trục vớt từ con tàu viễn chinh Hyacinth"
 figurehead_hyacinth_desc_details: "Sau khi gặp phải sự cố lò phản ứng cực kỳ nghiêm trọng, con tàu viễn chinh này đã mất đi động lực và lạc lối trong không gian sâu thẳm. Những người di cư đã tranh giành nguồn tài nguyên ngày càng cạn kiệt, và cuối cùng chết đói. Trên bức tượng có khắc một số dòng chữ khích lệ tinh thần và những biểu tượng tượng trưng cho hy vọng."
 first_defiled_astronaut: "Phi Hành Gia Đầu Tiên Của [DefiledCountry.GetSpeciesName]"
 first_defiled_astronaut_desc_short: "Một anh hùng dân tộc của giống loài [DefiledCountry.GetSpeciesName]"
 first_defiled_astronaut_desc_details: "Đây là cá nhân đầu tiên phá vỡ xiềng xích áp bức của giếng trọng lực từ hành tinh mẹ và mạnh dạn tiến vào những vùng đất mới. Phi hành gia này đã được an táng trong một con tàu con thoi được tối giản hóa. Con tàu tùy táng này trôi dạt trong không gian, và đã được bảo tồn như một di vật văn hóa."
 first_league_crew_manifest: "Danh Sách Phi Hành Đoàn Liên Minh Đệ Nhất"
 first_league_crew_manifest_desc_short: "Một bản danh sách phi hành đoàn đến từ một nền văn minh cổ đại được gọi là Liên Minh Đệ Nhất"
 first_league_crew_manifest_desc_details: "Là một phần trong \"Hạm Đội Bất Bại\" của họ, chiếc tuần dương hạm có tuổi đời hai triệu năm này được vận hành bởi sự hợp tác của một nhóm gồm mười hai giống loài khác nhau. Tài liệu này được ký bởi Skvitt, thuyền phó của tàu Migyang, có vẻ như đây là một buổi tập trung thường lệ tại trụ sở chính."
 fish_in_the_sea_sheet_music: "Khúc Ca Của Tàu Vũ Trụ"
 fish_in_the_sea_sheet_music_desc_short: "Đây là bản phiên âm nhạc đệm của \"khúc ca của con tàu\" được tìm thấy trên một con tàu được thiết kế để giăng buồm nhờ gió mặt trời"
 fish_in_the_sea_sheet_music_desc_details: "Bài hát này nhắc đến rất nhiều cơn bão và những kiểu thời tiết khác nhau, từ đó chúng ta có thể phỏng đoán rằng, giống loài sáng tác ra những giai điệu này hẳn phải có một truyền thống đi biển lâu đời trên hành tinh mẹ của họ. Hiện vẫn chưa rõ lý do tại sao bài hát này lại được thiết kế để phát lại liên tục với chu kỳ gần mười giờ một lần."
 flag_of_the_jaro_lyjo: "Lá Cờ Của Jaro Lyjo"
 flag_of_the_jaro_lyjo_desc_short: "Jaro Lyjo là danh hiệu thủ lĩnh của một băng hải tặc mang tên \"Đoàn Desip\" đã tồn tại qua hàng trăm thế hệ"
 flag_of_the_jaro_lyjo_desc_details: "Mặc dù Jaro Lyjo có bản tính hung bạo và tàn nhẫn, nhưng hắn lại được các thuyền viên bầu ra một cách dân chủ, tại vị cho đến lúc chết hoặc nghỉ hưu. Trong một lần trao đổi tiền chuộc thất bại, toàn bộ hạm đội đã bị tiêu diệt trong trận Hải chiến Whydah, lịch sử huyền thoại của Desip cũng đột ngột chấm dứt từ đó."
 flooded_settlement_mound: "Đồi Định Cư Bị Ngập Nước"
 flooded_settlement_mound_desc_short: "Tàn tích ngập nước của những công trình do các loài động vật chân đốt [controller.GetPreFTLLower] xây dựng trên [from.GetName]"
 flooded_settlement_mound_desc_details: "Cùng với sự phát triển công nghiệp của nền văn minh này, các chỏm băng ở hai cực của hành tinh bắt đầu tan chảy. Mực nước biển dâng lên nhanh chóng, nhấn chìm các khu định cư của họ, khiến cho giống loài này tuyệt chủng chỉ trong vài năm ngắn ngủi. Ngay cả tòa nhà cao nhất của họ giờ đây cũng chìm nghỉm, cách mặt nước một nửa chiều cao."
 fossilized_endoskeletons: "Hóa Thạch Xương Trong"
 fossilized_endoskeletons_desc_short: "Thứ duy nhất còn sót lại của một loài hình người không xác định sau khi chúng làm cạn kiệt tài nguyên khoáng sản trên [fromfrom.GetName]"
 fossilized_endoskeletons_desc_details: "Những sinh vật đi bằng hai chân thông minh này lấy các loại cây trồng giàu khoáng chất làm thức ăn, nhằm củng cố thêm độ cứng cáp cho bộ xương bên trong của chúng. Tuy nhiên, cơ thể của những sinh vật này lại có xu hướng tự nhiên biến thành hóa thạch thay vì phân hủy, cản trở các khoáng chất quay trở lại đất. Do không thể tiếp cận những nguyên tố thiết yếu này, tầng đất mặt trên hành tinh dần suy thoái và cuối cùng trở nên cằn cỗi."
 fossilized_megastomach: "Hóa Thạch Dạ Dày Khổng Lồ"
 fossilized_megastomach_desc_short: "Tuyến tiêu hóa được lấy ra từ một sinh vật hình giun có kích thước bằng cả một hành tinh được tìm thấy trên [fromfrom.Planet.GetName]"
 fossilized_megastomach_desc_details: "Đáng chú ý là, cả một nền văn minh đã kịp phát triển bên trong đường ruột của sinh vật này trước khi bị tiêu hóa hoàn toàn. Trên những tuyến tiêu hóa này có vết tích của các đòn tấn công bằng vũ khí, những người này đã phát động một \"cuộc đại chiến\" vô vọng chống lại chính vật chủ của họ. Về sau, con giun khổng lồ này đã chết già theo quy luật tự nhiên trong hang động chằng chịt của nó."
 fossilized_voidworm_tooth: "Hóa Thạch Răng Sâu Hư Không"
 fossilized_voidworm_tooth_desc_short: "Những vết mài mòn trên chiếc răng hóa thạch của Sâu Hư Không này cho thấy nó đã sống được hơn một trăm năm"
 fossilized_voidworm_tooth_desc_details: "Chiếc răng này có dấu hiệu bị mòn và sâu nghiêm trọng, đây là đặc điểm điển hình của một sinh vật chuyên ăn các tiểu hành tinh và mảnh vỡ không gian. Ước tính, một con Sâu Hư Không trung bình sẽ mọc và rụng hơn ba nghìn chiếc răng trong suốt cuộc đời của nó."
 fossilized_vultaum_remains: "Hóa Thạch Di Hài Vultaum"
 fossilized_vultaum_remains_desc_short: "Di hài hóa thạch của một giống loài có tri giác cổ đại mang hình dáng loài giun được gọi là Vultaum"
 fossilized_vultaum_remains_desc_details: "Người ta tin rằng mẫu vật này là một cá thể còn non. Mô hình sinh trưởng bên trong cho thấy Vultaum sẽ lột xác không theo chu kỳ nhất định, tùy thuộc vào tình trạng sức khỏe và dinh dưỡng của cá thể. Nhờ vậy, chúng ta có thể nghiên cứu từng giai đoạn trong vòng đời của chúng thông qua việc kiểm tra các hóa thạch thuộc những thời kỳ tương ứng."
 fractured_planet: "Hành Tinh Nứt Vỡ"
 fractured_planet_desc_short: "Đây là tàn tích của một hành tinh bị những cư dân sống trên đó cố tình cho nổ tung"
 fractured_planet_desc_details: "Về phần tình thế nghiêm trọng nào đã ép buộc họ phải đưa ra một quyết định cực đoan như vậy thì không ai biết được."
 fragment_of_reckoning: "Tàn Thể Của Kẻ Phán Xét Cuối Cùng"
 fragment_of_reckoning_desc_short: "Sự hiện hữu hữu hình của sức mạnh tâm linh to lớn"
 fragment_of_reckoning_desc_details: "Trong chiều không gian của chúng ta, thực thể này được biết đến với cái tên Kẻ Phán Xét Cuối Cùng, chính nó là kẻ đầu sỏ đã mang đến sự biến đổi mang tính hủy diệt cho [event_target:shrouded_planet.GetName]. Không lâu sau khi nó tan biến, phần tàn thể của nó đã bị một nền văn minh chuyên nghiên cứu thuyết tâm linh thu thập."
 fragmented_zroni_archive: "Mảnh Vỡ Lưu Trữ Zroni"
 fragmented_zroni_archive_desc_short: "Một khối tinh thể dữ liệu lớn được tìm thấy trên [fromfrom.Planet.GetName], có nguồn gốc từ một thuộc địa cổ đại của tộc Zroni"
 fragmented_zroni_archive_desc_details: "Nó chứa đựng một đoạn dĩ vãng về một nền văn minh hùng mạnh sở hữu sức mạnh tâm linh vô song. Khả năng du hành tự do trong Hư Không (Shroud) của họ được khai sáng bởi một vị trưởng lão huyền thoại được xưng tụng là \"Người Tiên Kiến\". Trong Hư Không, năng lực của giống loài này hoàn mỹ đến mức bị nhầm tưởng là một dạng thức nào đó của thần linh. Thật không may, những dữ liệu tiếp theo đã bị hỏng hoàn toàn."
 galactic_megadrive: "Siêu Ổ Cứng Thiên Hà"
 galactic_megadrive_desc_short: "Dữ liệu giám sát được thu thập từ khắp dải ngân hà trong vòng 1.2 tỷ năm qua"
 galactic_megadrive_desc_details: "Mức độ nén của đống dữ liệu này cao đến mức chúng ta không thể truy cập được, trừ khi nắm trong tay những công nghệ vượt xa tầm hiểu biết hiện tại. Riêng cấu trúc của công nghệ lưu trữ này thôi cũng đủ để mang lại những kiến thức cực kỳ giá trị cho sự phát triển phần cứng kỹ thuật số."
 gamma_resistant_flora: "Dị Hoa Kháng Bức Xạ"
 gamma_resistant_flora_desc_short: "Đây là một trong số ít những giống loài sống sót trên một hành tinh hứng chịu những đợt bùng phát tia gamma cường độ cao. Hàm lượng chì tự nhiên trong hệ thống mạch máu của loài thực vật này khiến cơ quan sinh sản của nó mang sắc đỏ và vàng rất bắt mắt"
 gamma_resistant_flora_desc_details: "Nó đã tiến hóa khả năng sinh sản vô tính thông qua các đột biến gen cực nhỏ, điều này biến việc gieo trồng quần thể thực vật này thành một mệnh đề nguy hiểm. Chúng ta phát hiện ra rằng, nếu trộn một lượng nhỏ hạt nhân phóng xạ Coban-60 vào đất trồng của nó, nó có thể tồn tại bên ngoài hành tinh mẹ."
 gargantua_megalus: "Thực Vật Khổng Lồ"
 gargantua_megalus_desc_short: "Sau khi trải qua những đột biến dữ dội, kích thước của những loài thực vật này tăng lên theo cấp số nhân, bao phủ toàn bộ bề mặt của [fromfrom.prev.GetName]"
 gargantua_megalus_desc_details: "Giống loài này phát tán vô số phấn hoa mang độc tính vào không khí, khiến cho toàn bộ hành tinh không thể hô hấp được, dẫn đến sự tuyệt chủng hoàn toàn của các giống loài có tri giác thống trị. Rễ của những loài thực vật này cực kỳ khổng lồ, có thể đâm xuyên qua lớp phủ của hành tinh tạo thành những vết nứt sâu hoắm, thậm chí ở một số khu vực, chúng còn hút cả đá nóng chảy lên trên bề mặt."
 genesis_core: "Lõi Sáng Thế"
 genesis_core_desc_short: "Một bộ xử lý trung tâm mạnh mẽ, chứa đầy dữ liệu gen của vô số giống loài có trí tuệ"
 genesis_core_desc_details: "Nó từng được kết nối với một cơ sở nhân bản vô tính xuyên chiều không gian khổng lồ, các ghi chép nội bộ cho thấy nó từng là một phần của một dự án lập danh mục gen quy mô cấp thiên hà. Sau khi hoàn thành phân tích sơ bộ, trí tuệ nhân tạo này đã bắt đầu tự do lai tạo ra những giống loài mới nhằm thu thập thêm dữ liệu."
 genetic_code: "Lõi Gen [owner_main_species.GetName]"
 genetic_code_desc_short: "Thông tin di truyền từng được sử dụng để đẩy các chức năng sinh lý của [owner_main_species.GetNamePlural] đến giới hạn cực đại"
 genetic_code_desc_details: "Cư dân của [this.GetName] từng được nhân bản vì mục đích chiến đấu, họ đã nỗ lực hết mình để mở khóa những tiềm năng mạnh mẽ hơn. Tính chất lâm sàng của quy trình xử lý nhân bản này có thể đạt đến khả năng kiểm soát sinh sản cực kỳ chính xác và đáng tin cậy."
 #this = ship / from = planet
 geometric_water_currents: "Lưới Nước Polyme"
 geometric_water_currents_desc_short: "Hình ảnh về một mạng lưới polyme liên tục trải dài trên [From.From.GetName]"
 geometric_water_currents_desc_details: "Những mạng lưới này có khả năng thao túng sức căng bề mặt và dòng chảy tự nhiên của nước, nhằm hiện thực hóa những thiết kế phức tạp và tinh xảo. Hình thức quản lý sinh thái lấy thẩm mỹ làm kim chỉ nam này có thể truyền cảm hứng cho cơ sở hạ tầng của chính chúng ta."
 giant_egg_shell: "Vỏ Trứng Khổng Lồ"
 giant_egg_shell_desc_short: "Mảnh vỏ trứng bị vôi hóa được tìm thấy dưới bề mặt của [from.planet.GetName]"
 giant_egg_shell_desc_details: "Phân tích lòng trắng trứng khô cho thấy, sinh vật này đã tiêu thụ một số đồng vị không ổn định trong thời kỳ ấp trứng. Mô phỏng quá trình ấp trứng cho thấy, sinh vật mang tính phóng xạ này đã phá vỡ lớp vỏ dày đã hình thành hoàn chỉnh, dùng móng vuốt cứng cáp của nó để đâm xuyên qua những điểm yếu trên thành trứng đã bị bức xạ phá hủy."
 golden_phonograph_record: "Đĩa Hát Vàng"
 golden_phonograph_record_desc_short: "Một thiết bị lưu trữ dữ liệu cổ đại, bảo tồn một loạt các hình ảnh và âm thanh dường như hoàn toàn ngẫu nhiên đến từ một nền văn minh [Owner.GetPreFTLLower]."
 golden_phonograph_record_desc_details: "Nó được tìm thấy trên bệ của một pháo đài hành tinh bị bỏ hoang, ban đầu được phóng vào không gian bởi một phi thuyền không người lái mang tên \"Voyager\". Cấu tạo của nó khá thô sơ và đơn giản, người ta cho rằng nó mang một ý nghĩa dị giáo nào đó."
 golem_contortionist_dna: "Gen Thuật Sĩ Uốn Dẻo Đỉnh Cao"
 golem_contortionist_dna_desc_short: "Một mẫu vật sinh học được thu thập từ một sinh vật đá có tri giác được tìm thấy ở phía bên kia của Vết Nứt Không Gian"
 golem_contortionist_dna_desc_details: "Cấu trúc khoáng vật này chứa lượng sinh khối hoạt tính cao, dễ xảy ra hiện tượng biến dạng và kết tinh tự phát. Do vật liệu này cực kỳ không ổn định, nên phải luôn kiểm soát hoàn hảo sự cân bằng hóa học để ngăn ngừa quá trình tự bốc cháy do hóa chất cơ học."
 grunur_data_crystal: "Tinh Thể Dữ Liệu Grunur"
 grunur_data_crystal_desc_short: "Một khối tinh thể dữ liệu cổ đại, là phương tiện lưu trữ dữ liệu hàng đầu của một giống loài đã tuyệt chủng từ lâu được gọi là Grunur"
 grunur_data_crystal_desc_details: "Mặc dù những ghi chép này có niên đại cổ xưa đến mức đáng kinh ngạc, nhưng phần lớn nội dung trong đó vẫn được bảo tồn khá nguyên vẹn. Giao diện dùng để truy cập thiết bị này đã bị thất truyền theo thời gian, nhưng việc tổng hợp ra loại vật liệu cứng cáp này chắc chắn phải là một quá trình dài đằng đẵng. Do đó, những tinh thể này có lẽ chỉ được dùng để lưu trữ những dữ liệu quan trọng nhất, trong khi các phương pháp lưu trữ đơn giản và dễ sử dụng hơn sẽ được dùng cho nhu cầu hàng ngày."
 head_of_the_beast: "Thủ Cấp Cự Thú"
 head_of_the_beast_desc_short: "Di hài của một loài sinh vật đột biến nguy hiểm từng đe dọa sự an nguy của những người định cư trên [root.GetName]"
 head_of_the_beast_desc_details: "Con quái thú này được vô tình tạo ra bởi các robot cải tạo môi trường nano do một nền văn minh vô danh nào đó để lại. Con quái thú này vừa thông minh vừa đáng sợ, nó dùng những mảnh xác bị chặt đứt của hàng trăm cái xác để làm tổ cho mình. Nó có đủ khả năng tư duy để thậm chí giam giữ những thức ăn chưa ăn hết để dành ăn sau. Nếu không bị can thiệp bằng sức mạnh quân sự, loài sinh vật này có thể sẽ trở thành một loài siêu săn mồi mới trên hành tinh mẹ của nó và sinh sôi nảy nở mạnh mẽ."
 heart_of_the_pulsar: "Trái Tim Của Pulsar"
 heart_of_the_pulsar_desc_short: "Viên đá quý vô giá này từng được năm vị nguyên thủ quốc gia đeo, sau đó được tìm thấy bị bỏ lại trong một trạm không gian nghỉ dưỡng xa hoa"
 heart_of_the_pulsar_desc_details: "Phân tích vật liệu cho thấy nó được tạc từ nguyên tố carbon được phun ra từ một vụ nổ siêu tân tinh, có lẽ nó ngụ ý rằng ngay cả ở quy mô của các vì sao, cái chết cũng có thể chứa đựng vẻ đẹp."
 hemterine_magnetic_figurehead: "Tượng Đầu Thuyền Từ Tính Hemter"
 hemterine_magnetic_figurehead_desc_short: "Một bức tượng đầu thuyền khổng lồ mang hình tượng Thánh Mẫu Hemter"
 hemterine_magnetic_figurehead_desc_details: "Bức tượng đầu thuyền này được đúc bằng osmium từ tính đã qua xử lý hóa học. Nó không chỉ đơn thuần là đồ trang trí, mà được thiết kế để hấp thụ lực sát thương mãnh liệt từ hỏa lực của kẻ thù. Nó được gắn trên mũi của tàu Titan Hemut, sử dụng từ trường cực mạnh để hút tên lửa và đạn động năng, nhằm bảo vệ những khu vực nhạy cảm của con tàu."
 high_geode_of_the_molluscoids: "Hốc Tinh Thể Tối Cao [molluscoid_miners_species.GetName]"
 high_geode_of_the_molluscoids_desc_short: "Hốc pha lê quý giá của [molluscoid_miners_species.GetName]"
 high_geode_of_the_molluscoids_desc_details: "Là một xã hội người hang động, [molluscoid_miners_species.GetName] từ lâu đã luôn sử dụng khối lượng bề ngoài của các khoáng chất khai thác được để đại diện cho địa vị của họ trong xã hội. Khối đá tuyệt đẹp này từng được trưng bày công khai tại nơi cư trú lớn nhất của chúng, và giờ đây nó đã trở thành biểu tượng cho sự hợp tác với [this.GetName]."
 hot_ice: "Băng Nóng"
 hot_ice_desc_short: "Được khai quật nguyên trạng từ bề mặt cực nóng của [from.GetName], do áp lực cực lớn tạo ra bởi lực hấp dẫn mạnh mẽ của lõi hành tinh, lượng nước này vẫn tồn tại ở thể rắn"
 hot_ice_desc_details: "Nó được bảo quản trong một bình chịu áp suất được thiết kế đặc biệt để trưng bày như một món đồ quý hiếm. Nếu bình chứa bị vỡ, hơi nước phun ra tức thời sẽ biến bình chứa này thành một thiết bị nổ. Vui lòng không chạm vào."
 hyper_mulch: "Siêu Lớp Phủ [FROM.GetName]"
 hyper_mulch_desc_short: "Quá trình cải tạo môi trường trên [FROM.GetName] đã dẫn đến sự phát triển quá mức của lớp phủ sinh học siêu dinh dưỡng này"
 hyper_mulch_desc_details: "Đây là một khối lập phương mật độ cao được hình thành dưới áp suất thủy lực từ nhiều hóa chất duy trì sự sống, những người theo chủ nghĩa thuần túy sinh thái không coi chúng là vật chất nhân tạo. Tuy nhiên, những kết quả xuất sắc của nó không thể bị phớt lờ."
 hyperfertile_soil: "Đất Siêu Phì Nhiêu"
 hyperfertile_soil_desc_short: "Lớp đất được thu hoạch trên [From.From.GetName], có thể cung cấp nguồn dinh dưỡng cực kỳ dồi dào cho hầu hết các loại cây trồng"
 hyperfertile_soil_desc_details: "Mật độ khoáng chất cực cao của môi trường sinh trưởng này cho thấy, nó không chỉ đơn thuần là sự tích tụ của các chất hữu cơ thối rữa, mà còn được sinh ra từ sự sắp xếp ngẫu nhiên của các nguyên tố cơ bản trong quá trình hình thành hành tinh của nó."
 illanii_archives: "Lưu Trữ Illanii"
 illanii_archives_desc_short: "Một cơ sở dữ liệu ghi chép chi tiết về lịch sử thăng trầm của người Illani"
 illanii_archives_desc_details: "Nền văn minh sống biệt lập này đã từ bỏ mọi lợi ích vật chất để theo đuổi tri thức, thậm chí họ còn quên cả việc sinh sản. Đối mặt với cuộc khủng hoảng dân số, họ tìm kiếm sự bất tử bằng công nghệ, nhưng điều đó chỉ mang lại thêm nhiều tai ương. Cuối cùng, cư dân cuối cùng cũng rời đi để tạo ra một trật tự mới nhằm tìm kiếm và bảo tồn tri thức, để lại [fromfrom.planet.GetName] mục nát trong cô độc."
 impossible_object: "Vật Thể Phi Lý"
 impossible_object_desc_short: "Một vật thể bất khả thi bị những vị khách từ chiều không gian khác bỏ lại trên [target.GetName] sau khi họ mang đi mê cung do chính họ xây dựng."
 impossible_object_desc_details: "Những thử thách phải đối mặt trong quá trình khám phá mê cung dường như là một phần của quá trình thử nghiệm và quan sát của du khách. Động cơ của những sinh vật này vẫn chưa được làm rõ, nhưng năng lực công nghệ của họ chắc chắn vượt xa toàn bộ chiều không gian của chúng ta."
 index_of_knowledge: "Danh Mục Tri Thức"
 index_of_knowledge_desc_short: "Một bức bích họa cổ đại được khắc trên một bán đảo đá khổng lồ"
 index_of_knowledge_desc_details: "Nó từng được một nền văn minh ngoài hành tinh thống trị thiên hà mang tên Karaka'a sử dụng như một tài liệu tham khảo mô phỏng. Họ sở hữu một số góc nhìn khoa học độc đáo, bao gồm khả năng thu thập năng lượng nồng độ cao từ các vết đen của các vì sao, cũng như việc nghiên cứu và phát triển các thiết bị cấy ghép thao túng từ trường cá nhân."
 inet_trade_manifesto: "Tuyên Ngôn Thương Mại Inet"
 inet_trade_manifesto_desc_short: "Một danh sách chi tiết và sâu rộng về các chính sách trao đổi thương mại của Mạng Lưới Thương Mại Bình Đẳng Thiên Hà"
 inet_trade_manifesto_desc_details: "Tiêu chuẩn của Liên Minh Thương Mại Inet cực kỳ cao, họ luôn tìm kiếm những đối tác đáng kính nhất và những thương vụ tốt nhất. Điều này dẫn đến việc họ thường chỉ giao dịch với chính người của mình."
 inetian_model_manual: "Sổ Tay Mô Hình Hành Tinh Inetian"
 inetian_model_manual_desc_short: "Một cuốn sổ tay hướng dẫn sử dụng do Liên Minh Thương Mại Inetian biên soạn, nhằm giải thích phương thức vận hành và bảo trì mô hình hệ hành tinh"
 inetian_model_manual_desc_details: "Người Inetian sử dụng hệ thống phức tạp này để tính toán các tuyến đường giao thương sinh lời nhất giữa các hành tinh lân cận. Mô hình này còn bao gồm khả năng theo dõi các giao dịch, bởi vì họ thực sự là những thương nhân hám lợi nhất."
 infinite_reboot_loop: "Vòng Lặp Khởi Động Lại Vô Tận"
 infinite_reboot_loop_desc_short: "Bản ghi kỹ thuật số về những trải nghiệm của một thiết bị bay không người lái bị mắc kẹt trong hố đen"
 infinite_reboot_loop_desc_details: "Những đơn vị này đã bị tóm gọn vào một không gian không xác định, sau đó trải qua sự giãn nở thời gian tương tự như trạng thái quá tải đau đớn. Hiện tượng này đã vắt kiệt toàn bộ mạng lưới một cách khó tin."
 interdimensional_treaty: "Hiệp Ước Xuyên Không Gian"
 interdimensional_treaty_desc_short: "Đây là một văn kiện mang tính cột mốc, đánh dấu việc thiết lập mối quan hệ xuyên không gian với phiên bản [explorer.GetName] của thế giới song song"
 interdimensional_treaty_desc_details: "Thực tế đã chứng minh, khả năng xem xét các quyết định thay thế từ một góc nhìn bên ngoài rất hữu ích cho việc phân tích khách quan các chính sách của chính chúng ta. Đây là một cơ hội khoa học có một không hai."
 intergalactic_projectile: "Đạn Xuyên Thiên Hà"
 intergalactic_projectile_desc_short: "Đạn của một máy phóng khối lượng được bắn từ một thiên hà lân cận hàng triệu năm trước"
 intergalactic_projectile_desc_details: "Viên đạn không mang tính sát thương này đã bay qua vô số năm ánh sáng và cuối cùng đâm sầm vào một con tàu nghiên cứu [owner.GetAdjective] tại [from.GetName]. Mặc dù có tuổi đời rất cao, nhưng thiết kế phức tạp và bền bỉ của viên đạn này cho thấy những người thiết kế ra nó đã đạt được vị thế thống trị công nghệ ở đẳng cấp rất cao."
 invasive_exofungus: "Nấm Ngoại Lai Xâm Lấn"
 invasive_exofungus_desc_short: "Một loại nấm ký sinh được tìm thấy trên [from.GetName]"
 invasive_exofungus_desc_details: "Loài sinh vật hệ sợi nấm này đã tiến hóa khả năng chiết xuất chất dinh dưỡng từ bất kỳ nguồn sinh học nào, đồng thời bảo vệ vật chủ của nó khỏi cảm giác đau đớn hay khó chịu càng lâu càng tốt. Nó có khả năng thích nghi mạnh mẽ với cả nhiệt độ lạnh và nóng, rất có thể nó đã lây lan đến hành tinh này thông qua một con tàu vũ trụ bay ngang qua. Được phân loại là Mối Nguy Sinh Học Cấp A, hành tinh nguồn gốc của nó vẫn chưa được biết đến."
 irassian_bacterium_javoria: "Vi Khuẩn Javoria Irassian"
 irassian_bacterium_javoria_desc_short: "Loại vi khuẩn bản địa của [FROMFROM.GetName], chính là tác nhân gây ra đại dịch Javorian Pox sau này"
 irassian_bacterium_javoria_desc_details: "Ban đầu, nó đã phá vỡ vòng cách ly do một miếng đệm một mét không đúng kích cỡ, sau đó lây lan sang các thuộc địa lân cận. Kể từ đó, loại vi khuẩn này đã tiến hóa trong các lò ấp hữu cơ, và cuối cùng biến đổi thành một đại dịch, phá hủy toàn bộ Hiệp Ước Irassian. Mẫu vật đặc biệt này đã được vô hiệu hóa và bảo quản trong dung dịch đình chỉ nhiệt độ thấp."
 irassian_digital_atlas: "Sách Giáo Khoa Mầm Non Irassian"
 irassian_digital_atlas_desc_short: "Một công cụ thông tin mà người Irassian dùng để giáo dục trẻ em về đế chế mà chúng được sinh ra"
 irassian_digital_atlas_desc_details: "Nó cung cấp những thông tin cơ bản về nền nông nghiệp, cấu trúc xã hội và các mặt hàng xuất khẩu chính của người Irassian. Lịch sử của người Irassian được kể lại dưới dạng những bản anh hùng ca, bao gồm cả việc chinh phục các giống loài hạ đẳng. Hình ảnh hoạt hình của mỗi loài sinh vật đều đi kèm với những lời bình luận mang tính miệt thị: Tiyanki bị gắn mác là \"Côn Trùng Gây Hại\", Chugra bị gọi là \"Sinh Vật Đáy Biển\", còn Chidok thì bị gán cho cái tên \"Gia Cầm Không Gian\"."
 irassian_purge_order: "Lệnh Thanh Trừng Irassian"
 irassian_purge_order_desc_short: "Thông tin liên lạc quân sự khẩn cấp từ Hiệp Ước Irassian, ra lệnh tiêu diệt hoàn toàn một thuộc địa của chính họ"
 irassian_purge_order_desc_details: "Một căn bệnh chết người gọi là Javorian Pox đang tàn phá khắp hành tinh, và việc tiêu diệt những người nhiễm bệnh được coi là lựa chọn duy nhất để ngăn chặn sự lây lan thêm. Lệnh này được mã hóa và truyền đi từ những quan chức cấp cao nhất của Chính phủ Irassian, thông qua một hệ thống ban đầu được thiết kế để tuyên chiến với các đế chế khác."
 key_to_fertility: "Chìa Khóa Sinh Sản [owner_main_species.GetName]"
 key_to_fertility_desc_short: "Nghiên cứu di truyền học nhằm khôi phục khả năng sinh sản tự nhiên của [owner_main_species.GetNamePlural]"
 key_to_fertility_desc_details: "Cư dân của [this.GetName] từng được nhân bản vì mục đích chiến đấu, giờ đây đã có khả năng tự do sinh sản."
 khalanka_crystallized_corpses: "Xác Khalanka Kết Tinh"
 khalanka_crystallized_corpses_desc_short: "Di tích của một loài silicat kỵ khí được tìm thấy dưới lòng đất của [from.planet.GetName]"
 khalanka_crystallized_corpses_desc_details: "Người ta tin rằng nền văn minh dưới lòng đất này đã sống trong hòa bình trước khi những người định cư [owner.GetAdjective] đặt chân đến. Khi mặt đất nứt nẻ, oxy xâm nhập vào các hang động sâu thẳm, oxy hóa cơ thể của những Khalanka này, và toàn bộ giống loài đã tuyệt diệt chỉ trong vài giờ ngắn ngủi."
 khamdai_magil_sha: "Khamdai Magil-Sha"
 khamdai_magil_sha_desc_short: "Lưỡi hái vừa hoa mỹ vừa thiết thực này được sử dụng bởi các chiến binh Khamdai cấp cao đến từ [FROMFROM.GetName]"
 khamdai_magil_sha_desc_details: "Đây là một xã hội côn trùng có truyền thống quân sự ăn sâu vào máu thịt, chúng đã nhanh chóng trở thành những thủ lĩnh đội danh dự của Liên Minh Đệ Nhất. Sau mỗi chiến thắng, chúng sẽ tổ chức một buổi lễ, dùng vũ khí này để hành quyết chỉ huy địch, và dùng chất lỏng của chúng để bôi trơn cho những người lính dũng cảm nhất. Mặc dù lưỡi dao của mẫu vật này được bảo dưỡng rất tốt, nhưng nó có những dấu hiệu mài mòn rõ rệt."
 kuurian_cybrex_blueprints: "Bản Thiết Kế Cybrex Của Người Kuur"
 kuurian_cybrex_blueprints_desc_short: "Thiết kế ban đầu của ý thức cơ khí Cybrex"
 kuurian_cybrex_blueprints_desc_details: "Người Kuur dự định để những robot này đóng vai trò như những người hầu, sử dụng trí tuệ tập thể của chúng để quản lý các hệ thống bảo trì và sản xuất trên toàn cầu. Tuy nhiên, Cybrex đã nổi dậy chống lại những người tạo ra chúng, tiêu diệt toàn bộ giống loài này trong chưa đầy một năm."
 landeer_arm: "Cánh Tay Của Landeer"
 landeer_arm_desc_short: "Đây là một mẫu vật kỳ lạ được tìm thấy trong Học Viện Lễ Hội Ái Quốc"
 landeer_arm_desc_details: "Trong văn phòng của người giám sát trạm không gian, có treo xác ướp một cái xúc tu từng thuộc về chính người giám sát - nhiều năm sau, nó vẫn kiêu hãnh được trưng bày trên một tấm bảng trang trí tỉ mỉ. Việc Arata Landeer tại sao lại cắt đứt một phần cơ thể của mình sẽ mãi là một câu hỏi không có lời đáp. Có lẽ sự sụp đổ của Học viện không phải là mất mát duy nhất mà ông ta phải gánh chịu..."
 larionessi_cloning_vat: "Khoang Nhân Bản Larionessi"
 larionessi_cloning_vat_desc_short: "Khoang nhân bản từng được sử dụng bởi ý thức tập thể Larionessi đã tuyệt diệt"
 larionessi_cloning_vat_desc_details: "Ý thức tổ ong Larionessi từng là một chế độ thiên hà rộng lớn, bị tàn phá nặng nề bởi một căn bệnh truyền nhiễm khủng khiếp do kẻ thù của họ phát tán. Do không thể tìm ra phương pháp chữa trị trong thời gian ngắn, họ đã lưu trữ các bản sao nhân bản trong những khoang chứa có thể duy trì trạng thái ngủ đông gần như vô thời hạn, với hy vọng chúng sẽ sống sót và trở thành những kho lưu trữ sống động cho lịch sử văn hóa của họ."
 last_copy_of_the_prince: "Bản Sao Cuối Cùng Của Quân Vương"
 last_copy_of_the_prince_desc_short: "Đây là một tác phẩm văn học khá bình thường nhưng rất được [book_writer.GetSpeciesName] tôn kính, họ từng cho rằng nó đã bị mất vĩnh viễn trong một cuộc đột kích"
 last_copy_of_the_prince_desc_details: "Cuốn sách này trình bày một triết lý thực dụng và tàn nhẫn, khuyến khích những người nắm quyền lực đánh đổi bằng sự hy sinh để đổi lấy vinh quang. Là bản sao duy nhất còn sót lại, nó đã có được một cuộc sống mới với tư cách là một món đồ sưu tầm."
 last_fragment_fevor: "Mảnh Vỡ Cuối Cùng Của Fevor"
 last_fragment_fevor_desc_short: "Mảnh vỡ của hành tinh Fevor bị phá hủy"
 last_fragment_fevor_desc_details: "Chính sách diệt chủng của người Fevor đã mở rộng ra toàn bộ sinh vật ngoài hành tinh đã biết, họ đã phóng những quả đạn vonfram khổng lồ, suýt chút nữa đã phá hủy hoàn toàn [owner.GetHomeWorldName]. Giờ đây, chính họ cũng gần như gục ngã ngay lập tức dưới tay những kẻ mà họ muốn xóa sổ."
 last_general_badge: "Huy Hiệu Tướng Quân Cuối Cùng"
 last_general_badge_desc_short: "Huy hiệu trên bộ đồng phục của một vị tướng đáng kính thuộc Liên Minh Thương Mại Inet"
 last_general_badge_desc_details: "Ông được mọi người biết đến là một tấm gương mẫu mực của các giá trị bình đẳng. Ông được chọn để thực hiện sứ mệnh tuyệt vọng là chế tạo ra một cỗ máy thao túng bão không gây ô nhiễm. Ông muốn để lại thông điệp cuối cùng cho những nhà thám hiểm tương lai, với hy vọng truyền lại bài học từ số phận bi thảm của nhân dân mình."
 last_mharin_kharin: "Mharin Kharin Cuối Cùng"
 last_mharin_kharin_desc_short: "Vòng tuần hoàn tự nhiên của loài hoa quý hiếm này tiềm ẩn một khả năng nguy hiểm, có thể đe dọa đến toàn bộ quần thể dân cư có trí tuệ bằng một loại độc tố thần kinh chết người"
 last_mharin_kharin_desc_details: "Do quá trình tiến hóa hoàn toàn độc lập với các sinh vật có trí tuệ, tác dụng phụ này hoàn toàn không mang lại lợi ích gì cho cơ thể sinh vật. Có vẻ như khi phấn hoa của nó tiếp xúc với bất kỳ loại mạng lưới thần kinh nào, nó sẽ nhầm tưởng đó là một cơ quan sinh sản đang chào đón nó, và giải phóng ra một loại hóa chất dị loại."
 leviathan_scale: "Vảy Cự Thú"
 leviathan_scale_desc_short: "Mảnh vỡ của một dạng sống khổng lồ được tìm thấy ở phía bên kia của Vết Nứt Không Gian"
 leviathan_scale_desc_details: "Loại vảy kỳ lạ này là một hỗn hợp gồm các thành phần hữu cơ và kim loại, cấu trúc tinh thể phức tạp của nó mang lại khả năng chống chịu va đập động năng đến mức khó tin."
 living_snow_sculpture: "Tác Phẩm Điêu Khắc Tuyết Sống"
 living_snow_sculpture_desc_short: "Một tác phẩm điêu khắc được làm bằng \"tuyết sống\""
 living_snow_sculpture_desc_details: "Loại vật liệu này sở hữu một dạng ý thức sơ khai nhất định, và có trữ lượng tự nhiên trên [prev.target.GetName]. Nó sẽ thay đổi hình dạng một cách tương đối, nhưng rất khó để đoán trước được thời điểm xảy ra sự thay đổi này."
 localised_aurora_borealis: "Bắc Cực Quang Cục Bộ"
 localised_aurora_borealis_desc_short: "Một loạt các màu sắc nhấp nháy được ghi lại trong đoạn video quay bầu khí quyển của [FromFrom.Planet.GetName]"
 localised_aurora_borealis_desc_details: "Sự thay đổi màu sắc này lặp lại theo những tần số có thể dự đoán được, đại diện cho một thứ gì đó vượt xa ý nghĩa thẩm mỹ đơn thuần. Sự hiện diện vĩnh cửu của chúng đã tô điểm thêm một sắc thái bi thương cho hành tinh đã chìm trong lãng quên vì chiến tranh và tàn phá này."
 loopmail: "Thư Vòng Lặp"
 loopmail_desc_short: "Bản ghi chú này đến từ [owner.GetName] của nhiều năm sau, đưa ra những chỉ dẫn quan trọng về việc bổ nhiệm các nhà khoa học cũng như công tác nghiên cứu"
 loopmail_desc_details: "Cái giá lớn nhất để nắm bắt được những kiến thức đi trước thời đại này là phải chịu trách nhiệm mang nó về quá khứ, nhưng việc can thiệp vào dòng chảy của thời gian luôn là một nỗ lực đầy rủi ro. Tác giả ban đầu của thông điệp này thực sự rất thiếu trách nhiệm khi đã tạo ra một nghịch lý như vậy."
 lunatic_broker_therapy_box: "Hộp Trị Liệu Của Kẻ Môi Giới Điên Rồ"
 lunatic_broker_therapy_box_desc_short: "Kẻ Môi Giới Điên Rồ là một thương nhân huyền thoại trong giới thương gia, có khả năng tác động đến khách hàng bằng những yêu cầu vô lý và những lời đe dọa đầy màu sắc"
 lunatic_broker_therapy_box_desc_details: "Tuy nhiên, hành vi bạo lực và khó đoán của hắn đã buộc khách hàng phải nghĩ ra một phương pháp nào đó để làm hắn bình tĩnh lại. Một trong những chiến lược đó là liệu pháp âm thanh; những chiếc hộp tương tự như thế này nằm rải rác xung quanh La Bàn của Chor, mỗi khi mức độ căng thẳng của Kẻ Môi Giới Điên Rồ tăng cao, chúng sẽ phát ra những giai điệu êm dịu. Từng bộ phận của thiết bị cơ khí này đều được chế tác riêng bởi một bậc thầy cơ khí."
 manifesti_piece: "Tác Phẩm Kích Động Của Phái Tuyên Ngôn"
 manifesti_piece_desc_short: "Một tác phẩm mang tính khiêu khích của phong trào Tuyên Ngôn"
 manifesti_piece_desc_details: "Mục đích của nó là thách thức nhận thức về bản thân trong mối quan hệ với những người có địa vị xã hội cao hơn. Nó khuyến khích người đọc thao túng hình ảnh của chính mình, cũng như tạo ra những bức tranh cắt dán méo mó về các nhân vật chính trị nổi tiếng. Phái Tuyên Ngôn, với tư cách là một nhóm nghệ thuật phản văn hóa, đang cố gắng thách thức những gì họ coi là một hệ thống áp bức. Bài viết này đã truyền cảm hứng cho nhiều nghệ sĩ khác xuất bản các tác phẩm mang tính phê phán của riêng họ."
 #this = ship / from = planet
 manna_fruit: "Quả Manna"
 manna_fruit_desc_short: "Một loại trái cây ngọt ngào mọng nước, có thể cung cấp gần như toàn bộ lượng dinh dưỡng cần thiết cho một ngày cho hầu hết các sinh vật hữu cơ có trí tuệ"
 manna_fruit_desc_details: "Các khu rừng nhiệt đới trên hành tinh mẹ của nó sở hữu thành phần đất độc đáo, cung cấp một môi trường hoàn hảo để nó lây lan rộng rãi. Hầm bà lằng, món tráng miệng, cocktail, những người định cư trên hành tinh này sử dụng nó trong hầu hết các món ăn. Hình ảnh của nó cũng được in nổi bật trên lá cờ của hành tinh [FROM.GetName]"
 #this = ship / FROMFROM = planet
 massive_metatarsal: "Xương Bàn Chân Khổng Lồ"
 massive_metatarsal_desc_short: "Những bộ hài cốt này được thu thập trong quá trình kiểm tra chuyên sâu về số lượng lớn các mảnh xương vụn trên [FROMFROM.GetName]"
 massive_metatarsal_desc_details: "Đây là một phần của một con tàu vũ trụ sinh học sống, phân tích phân tử cho thấy cấu trúc hữu cơ của nó tồn tại những điểm bất thường về mặt thời gian. Người ta tin rằng, bộ xương này và phi công của nó đến từ một chiều không gian khác. Kết quả quét bên trong cho thấy có một mạng lưới đường ống, có thể là một hệ thống duy trì sự sống hoặc nguồn năng lượng nào đó."
 #this = country
 medal_for_services_to_diplomacy: "Huân Chương Phục Vụ Ngoại Giao"
 medal_for_services_to_diplomacy_desc_short: "Quà cảm ơn từ Hội đồng Thiên hà"
 medal_for_services_to_diplomacy_desc_details: "Dòng chữ khắc trên mặt sau của huân chương là: \"Phái đoàn ngoại giao của [this.GetName], với tư cách là người nhận giải thưởng này, đã thể hiện sự chuyên nghiệp và năng lực của mình, đại diện xuất sắc cho nhà lãnh đạo của họ, là một tài sản quý giá thực sự của cộng đồng thiên hà.\""
 megacorpse_hyperguitar: "Siêu Đàn Guitar Của Megacorpse"
 megacorpse_hyperguitar_desc_short: "Tàn tích của một loại nhạc cụ có dây được sử dụng bởi ban nhạc metal tâm linh \"Megacorpse\""
 megacorpse_hyperguitar_desc_details: "Nghe đồn thiết bị này được chế tạo trong Hư Không (Shroud), ban đầu được thiết kế để sử dụng như một vũ khí sóng âm. Dưới sự điều khiển của ca sĩ chính Kor-Azan, âm nhạc của nó đã làm mê đắm trái tim của hàng tỷ người, nhưng sau đó nó đã bị đập nát trên [Root.GetName], tiêu diệt toàn bộ khán giả bằng ngọn lửa vinh quang. Kể từ đó, các album liên quan đã bị cấm ở hầu hết các hệ sao."
 #this = country / from = ship
 memorial_for_bubbles: "Tưởng Nhớ [from.GetName]"
 memorial_for_bubbles_desc_short: "Sau nhiều năm đồng hành trung thành, [from.GetName] đã qua đời, để lại một khoảng trống to lớn bằng một con Amip Không Gian trong trái tim [this.GetName]"
 memorial_for_bubbles_desc_details: "[from.GetName] không chỉ là một người bảo vệ trung thành, mà nó còn là một tấm gương sáng ngời thể hiện những giá trị tốt đẹp nhất của [this.GetAdjective]. Dù nó đã đi xa, nhưng nó sẽ không bao giờ phai mờ trong ký ức."
 memorial_stone: "Đá Tưởng Niệm"
 memorial_stone_desc_short: "Một đài tưởng niệm bằng đá được dựng lên để tưởng nhớ một thảm kịch bất ngờ"
 memorial_stone_desc_details: "Tại trạm không gian có tên là Celica này, các hoạt động khai thác quá đà đã khiến tiểu hành tinh mà nó tọa lạc sụp đổ vào trong. Khu mỏ bị vỡ vụn thành nhiều mảnh, gây ra thương vong lớn cho những người thợ mỏ. Một mảnh vỡ của tiểu hành tinh này đã được bảo tồn, trên đó khắc chữ \"Celica\" để tưởng nhớ những sinh mạng đã khuất."
 memorial_to_homeworld: "Đài Tưởng Niệm [Root.GetName]"
 memorial_to_homeworld_desc_short: "Những gì còn sót lại của hành tinh mẹ [doomsday_owner.GetAdjective] đã được định sẵn sẽ bị hủy diệt"
 memorial_to_homeworld_desc_details: "[Root.GetName] từng là mái nhà của mọi thế hệ [doomsday_owner.GetSpeciesName] trong quá khứ, cho đến ngày nó vỡ vụn thành từng mảnh. Tượng đài Ngày Tận Thế này ca ngợi ý chí kiên cường của [doomsday_owner.GetName], những người có thể thích nghi và vượt qua hoàn cảnh khắc nghiệt nhất: \"Chúng ta sẽ kiên cường bám trụ.\""
 memories_of_elik: "Ký Ức Của Elik"
 memories_of_elik_desc_short: "Dữ liệu được trích xuất từ ý thức của Elik Nalis Kaelak"
 memories_of_elik_desc_details: "Elik là một tín đồ sùng đạo của Cetana, cô đã bị đóng băng trong trạng thái ngủ đông suốt hàng trăm triệu năm. Ký ức của cô không ngừng đan xen giữa tình yêu thuần khiết dành cho Cetana và những cuộc xung đột bạo lực với những người theo đuổi Zarqlan. Rõ ràng là cô ấy đã chứng kiến vô số những hành động tàn bạo đê hèn, nhưng chính niềm tin đã tiếp thêm cho cô sức mạnh để bước tiếp.\n\nCuối cùng, trong tâm trí đang dần mục nát của cô chỉ còn đọng lại một hình ảnh kỳ lạ: §PNữ hoàng Cetana, dung nhan tỏa sáng rực rỡ, ánh mắt nhân từ với nụ cười ấm áp tràn ngập tình yêu thương.§!"
 memory_orbs: "Quả Cầu Ký Ức"
 memory_orbs_desc_short: "Những lỗi lầm nhỏ và những hành vi tội lỗi được trích xuất từ ký ức cá nhân dưới dạng những quả cầu kỹ thuật số"
 memory_orbs_desc_details: "Những ký ức bí mật này là sản phẩm của một xã hội động vật thân mềm mang tính tôn giáo, chúng được trích xuất từ tâm trí của những kẻ có tội sau khi họ xưng tội. Những ký ức bê bối kiểu này có thể cung cấp hàng ngàn giờ cho các chương trình giải trí ngắn hạn."
 mercenary_story: "Truyền Thuyết Lính Đánh Thuê"
 mercenary_story_desc_short: "Câu chuyện được lưu trữ dưới dạng kỹ thuật số này ban đầu được khắc trên bề mặt của [FROM.GetName] bằng laser khai thác khoáng sản"
 mercenary_story_desc_details: "Nó ghi lại cuộc đời của một lính đánh thuê trẻ tuổi đi chu du khắp thiên hà nhưng đã chết trẻ vì bệnh tật. Tính xác thực của truyền thuyết này không thể kiểm chứng, nhưng chắc chắn phải có ai đó cho rằng nó rất quan trọng nên mới khắc nó lên một hành tinh."
 metallic_snow: "Tuyết Kim Loại"
 metallic_snow_desc_short: "Hợp chất kim loại nặng này là thành phần chính của các kiểu thời tiết trên [from.GetName]"
 metallic_snow_desc_details: "Từ những dòng sông nóng chảy đổ ra những đại dương kim loại khổng lồ, rồi bốc hơi vào bầu khí quyển đầy chất ăn mòn. Khi gặp lạnh, chúng sẽ ngưng tụ lại, rồi đổ xuống bề mặt nóng bỏng như những cơn mưa. Không khuyến khích việc ghé thăm [from.GetName] trong tình trạng hiện tại."
 minamar_chandelier: "Đèn Chùm Minamar"
 minamar_chandelier_desc_short: "Một món đồ trang trí xa hoa còn nguyên vẹn được tìm thấy từ xác một con tàu chiến $ADJ_MSI_country$ bị rơi"
 minamar_chandelier_desc_details: "Ngoài mục đích quân sự, con tàu này còn được dùng để thực hiện các cuộc tiếp xúc đầu tiên với các quốc gia khách hàng [Owner.GetPreFTLLower] tiềm năng. $NAME_MSI_country$ dùng những lời dối trá về sự vinh hoa phú quý và sự tiến bộ để lừa gạt toàn bộ nền văn minh trở thành những nô lệ giao kèo của chúng, giam cầm họ trong những hợp đồng vô đạo đức. Nếu họ không tuân thủ, chúng sẽ dùng sự hủy diệt để đe dọa bất cứ lúc nào.\n\n§BSự khai sáng có thể không hề miễn phí. Nhưng $NAME_MSI_country_initials$ luôn có thể cho bạn một cái giá tốt nhất.§!"
 mineralized_brain: "Bộ Não Bị Khoáng Hóa"
 mineralized_brain_desc_short: "Tàn tích của giống loài đá khổng lồ này là một bộ não từng bay quanh quỹ đạo của [FROM.GetName] bên trong một tiểu hành tinh"
 mineralized_brain_desc_details: "Nó xem mọi kích thích từ bên ngoài như một phần trong quá trình tư duy của chính mình, không thể hiểu được nhiều khái niệm cơ bản như thời gian hay quãng đường di chuyển. Những dữ liệu này được lưu trữ trong các tinh thể dần dần lớn lên từ lõi khoáng chất. Về việc liệu nó được đặt bên trong tiểu hành tinh hay tự phát triển ở đó, chúng ta không thể xác định được."
 mini_moon_dust: "Bụi Mặt Trăng Thu Nhỏ"
 mini_moon_dust_desc_short: "Tàn tích của một mặt trăng thu nhỏ siêu đặc được tìm thấy trong một hệ sao vi mô siêu đậm đặc ở phía bên kia của Vết Nứt Không Gian"
 mini_moon_dust_desc_details: "Bụi mặt trăng thu hồi được biểu hiện rất đặc biệt trong không gian của chúng ta. Các hạt nồng độ cao của nó không ngừng giãn nở, đòi hỏi phải chuyển mẫu vật sang những hộp chứa ngày càng lớn hơn theo thời gian."
 mining_transmitter: "Máy Phát Khai Khoáng Cổ Đại"
 mining_transmitter_desc_short: "Một máy phát sóng tầm ngắn được tìm thấy trên [FROM.GetName], dùng để đánh dấu các mỏ kim loại quý quy mô lớn"
 mining_transmitter_desc_details: "Mặc dù đã cũ, tín hiệu của máy phát này có thể được thu nhận bởi nhiều loại cảm biến khác nhau, và rất dễ để theo dõi. Việc chức năng của nó vẫn hoạt động bền bỉ là minh chứng cho thiết kế kỹ thuật mạnh mẽ của nó."
 miracle_cream: "Kem Ma Thuật \"Thọ Vô Tận\""
 miracle_cream_desc_short: "Một loại mỹ phẩm mang tính cách mạng chưa từng có, giúp sinh vật duy trì sự trẻ trung lâu dài"
 miracle_cream_desc_details: "Nó có vô vàn công dụng, giúp người tiêu dùng ở bất kỳ dạng hữu cơ nào cũng giữ được vẻ thanh xuân rạng rỡ. Những lời đồn đại vô căn cứ về tác dụng phụ gây biến dạng khuôn mặt và các thành phần được thu thập bất hợp pháp vẫn lan truyền rộng rãi, nhưng chẳng thể ngăn cản phép màu thương mại khó tin của loại mỹ phẩm này."
 missile_lone_defender: "Tên Lửa Của Vệ Binh Đơn Độc"
 missile_lone_defender_desc_short: "Một quả tên lửa đã được vô hiệu hóa đến từ một khu trục hạm tự động từng bảo vệ một hành tinh đã bị hủy diệt từ lâu"
 missile_lone_defender_desc_details: "Con tàu này có lẽ đã tồn tại lâu hơn cả nền văn minh mà nó được tạo ra để bảo vệ hàng ngàn năm, lặng lẽ canh gác một hành tinh trống rỗng. Sau khi bị phá hủy, cuối cùng ca gác đêm của nó cũng đã kết thúc."
 molten_slag: "Xỉ Hành Tinh Nóng Chảy"
 molten_slag_desc_short: "Mẫu vật này được thu thập từ một hành tinh nằm trên một quỹ đạo đặc biệt"
 molten_slag_desc_details: "Phân tích vật liệu cho thấy [fromfrom.GetName] đã bị một điểm dị thường không thời gian thoáng qua kéo vào một quỹ đạo khắc nghiệt, sức nóng dữ dội từ ngôi sao gần đó đã làm tan chảy phần lớn lớp phủ của hành tinh từng có thể sinh sống được này. Một phần của hành tinh đã bị biến đổi hóa học do điểm dị thường và không còn phản ứng với sự thay đổi nhiệt độ nữa."
 musings_on_infinity: "Tập Hợp Suy Ngẫm Về Vô Cực"
 musings_on_infinity_desc_short: "Sự thể hiện kỹ thuật số trừu tượng về sự bình yên xa xôi mà các ong thợ lơ lửng trong hố đen đã trải qua"
 musings_on_infinity_desc_details: "Những ong thợ này có thể quan sát [this.GetName] từ góc nhìn khách quan của một thực thể độc lập, trong khi vẫn duy trì sự liên kết với tập thể. Khoảng cách này đã tạo ra những góc nhìn độc đáo, biến chúng trở thành những độc giả của chính câu chuyện sử thi vĩ đại của chúng ta."
 mutated_fumongus: "\"Nấm Khổng Lồ\" Đột Biến"
 mutated_fumongus_desc_short: "Là phiên bản nâng cấp của \"nấm khổng lồ\", những bộ phát hệ sợi nấm này có thể thu thập và truyền dữ liệu với tốc độ cao hơn, từ đó cung cấp các báo cáo giám sát chi tiết hơn"
 mutated_fumongus_desc_details: "Sự mở rộng công suất này đi kèm với sự gia tăng kích thước của từng cây nấm đơn lẻ, đồng thời hình thành nên một cụm mới giống như một ăng-ten phát sóng vô tuyến."
 mutative_digestive_fluids: "Dịch Tiêu Hóa Đột Biến"
 mutative_digestive_fluids_desc_short: "Một mẫu vật sinh học bán cơ khí được thu thập từ phía bên kia của Vết Nứt Không Gian"
 mutative_digestive_fluids_desc_details: "Loài sinh vật này sở hữu một khả năng mới lạ, có thể thao túng cấu trúc di truyền của các sinh vật khác ngay trong hệ tiêu hóa của chính nó. Chúng ta nghi ngờ rằng quá trình này ban đầu được phát triển như một phương pháp cải tạo môi trường cho các hành tinh chứa sinh khối ngoài hành tinh mẹ."
 namarian_colonist_standard: "Cờ Hiệu Thuộc Địa Namarian"
 namarian_colonist_standard_desc_short: "Lá cờ này đánh dấu việc định cư của [nomad_new_country.GetName] trên [NomadMissionPlanet.GetName], một món quà hào phóng từ [this.GetName]"
 namarian_colonist_standard_desc_details: "Những người du mục mệt mỏi với cảnh rày đây mai đó đã định cư tại đây, trở về với lối sống của tổ tiên. Không còn nghi ngờ gì nữa, quyết định này đã khiến những người định cư phải rời bỏ những con tàu mà họ đã gắn bó qua nhiều thế hệ, và chắc chắn nó đã để lại một dấu ấn sâu sắc trong tâm trí họ."
 namarian_sculpture: "Tác Phẩm Điêu Khắc Namarian"
 namarian_sculpture_desc_short: "Một bức tượng bằng vật liệu tổng hợp, được dùng để bày tỏ lòng biết ơn của những người du mục thuộc Hạm đội Wave Rider khi gia nhập [this.GetName]"
 namarian_sculpture_desc_details: "Ngay khi vừa hạ cánh xuống [NomadMissionPlanet.GetName], những người cựu du mục này đã mang đến chuyên môn công nghệ xuất chúng của họ. Tuy nhiên, họ không muốn chỉ được biết đến với tư cách là những thợ cơ khí và kỹ sư; tác phẩm này là minh chứng cho tài năng nghệ thuật và nguồn cảm hứng vượt không gian của họ."
 namarian_vessel_heraldry: "Huy Hiệu Phi Thuyền Namarian"
 namarian_vessel_heraldry_desc_short: "Những huy hiệu này được tìm thấy trên các con tàu do người du mục Namarian chế tạo, đại diện cho nhiều phe phái khác nhau trong Hạm đội Wave Rider"
 namarian_vessel_heraldry_desc_details: "Hồ nước tĩnh lặng tượng trưng cho tàu cư trú, nơi người Namarian nghỉ ngơi, canh tác và thực hiện hầu hết các hoạt động gia đình. Hình dáng dòng nước chảy xiết nông biểu thị cho các con tàu được thiết kế cho công nghiệp và khoa học, những con tàu hạng trung cũ kỹ này được trang bị nhiều loại thiết bị để trục vớt và thí nghiệm khoa học. Cuối cùng, những đỉnh sóng dữ dội tượng trưng cho lực lượng hải quân Namarian, những chiến binh được huấn luyện bài bản điều khiển những con tàu vững chãi, khoác giáp cầm vũ khí thế không thể cản."
 nanite_sludge: "Bùn Nanite"
 nanite_sludge_desc_short: "Một hợp chất được bảo quản cẩn thận, hình thành từ các cỗ máy nano tự nhân bản vi mô"
 nanite_sludge_desc_details: "Mật độ của những robot nano này cao đến mức kinh ngạc, bổ sung thêm hàng tỷ tấn khối lượng cho [from.GetName] nơi chúng tọa lạc. Về mặt lý thuyết, những robot nano này đã gặp trục trặc, tiến vào giai đoạn sinh sôi nảy nở không kiểm soát, nuốt chửng hoàn toàn hành tinh của chúng và hủy diệt toàn bộ những cư dân trước đây. Mẫu vật đặc biệt này đã được vô hiệu hóa hoàn toàn."
 obsidian_obelisk_fragment: "Mảnh Vỡ Cột Tháp Obsidian"
 obsidian_obelisk_fragment_desc_short: "Mảnh vỡ của một cột tháp từng sừng sững ở trung tâm của bình diện núi lửa ở phía bên kia của Vết Nứt Không Gian"
 obsidian_obelisk_fragment_desc_details: "Trong những biểu tượng luôn thay đổi của nó, mã hóa tên và tội danh tương ứng của hàng ngàn cá nhân. Thiết bị này có lẽ là bảng điều khiển chính của một nhà tù đa chiều khổng lồ."
 oiled_fabric: "Vải Vẽ Sơn Dầu"
 oiled_fabric_desc_short: "Một bức tranh thanh bình được vẽ hoàn toàn bằng bột màu gốc dầu, phác họa những dãy núi phủ tuyết trắng xóa cùng một khu rừng hàn đới ở phía gần"
 oiled_fabric_desc_details: "Mặc dù đây là hình thức biểu đạt nghệ thuật tiêu chuẩn của hầu hết các giống loài có chi phụ cầm nắm được, nhưng vị họa sĩ này dường như đặc biệt điêu luyện."
 organic_computer: "Máy Tính Hữu Cơ"
 organic_computer_desc_short: "Hóa thạch của một máy tính hữu cơ được tìm thấy trong tàn tích của thuộc địa Baol trên [fromfrom.Planet.GetName]"
 organic_computer_desc_details: "Thiết bị này là một kỳ tích đáng kinh ngạc của công nghệ sinh học, được sử dụng để giáo dục những chồi non trước khi chúng được hòa nhập vào ý thức tổ ong. Các tài liệu được khôi phục trình bày chi tiết về các kỹ thuật quản lý sinh thái đầy tính sáng tạo, vốn chỉ có thể thực hiện được thông qua các chức năng sinh lý độc đáo của giống loài đặc biệt này. Hành tinh xung quanh họ không phải được xây dựng nên, mà là được trồng trọt nên."
 organic_machine_interface_sculpture: "Tác Phẩm Điêu Khắc Giao Diện Hữu Cơ - Máy Móc"
 organic_machine_interface_sculpture_desc_short: "Một bức tượng nhằm tưởng nhớ sự cống hiến của dân số sinh học [bio_pop.GetSpeciesName] trong suốt trận bão địa từ tại [this.solar_system.GetName]"
 organic_machine_interface_sculpture_desc_details: "Dân số hữu cơ đã can thiệp để hỗ trợ cho những người hầu máy móc, thay thế cho các đơn vị chăm sóc bị hỏng hóc để duy trì công việc. Tác phẩm này được thiết kế bởi những cá thể hữu cơ có thiên hướng nghệ thuật cùng với những thiết bị bay không người lái chuyên phụ trách việc hàn xì."
 orinthi_teeth: "Răng Orinthi"
 orinthi_teeth_desc_short: "Hàm răng không ngừng mọc dài của loài Orinthi"
 orinthi_teeth_desc_details: "Là một loài sinh vật nhỏ bé giống chuột, Orinthi đã đào được một mê cung khổng lồ vắt ngang hành tinh dưới lòng đất của [fromfrom.GetName]. Hàm răng tự nhiên của chúng rất nhỏ và rỗng, nhưng một loài nấm sừng cộng sinh sống trên răng của Orinthi đã tạo thành những chiếc nanh sắc nhọn và dễ vỡ."
 osseus_construction_material: "Vật Liệu Xây Dựng Osseus"
 osseus_construction_material_desc_short: "Những bộ xương khổng lồ được dùng làm tài nguyên xây dựng trên [fromfrom.Planet.GetName]"
 osseus_construction_material_desc_details: "Một loài bò sát có khả năng cốt hóa mô mềm di truyền đã được chăn nuôi trên quy mô lớn để lấy vật liệu xây dựng. Phân tích cho thấy, loài bò sát này còn mắc nhiều khiếm khuyết di truyền khác, chẳng hạn như không có màng chân, có thể là do giao phối cận huyết. Hầu hết những con vật này đều được trợ tử nhân đạo trước khi bị thu hoạch."
 path_to_progress: "Con Đường Tiến Bộ"
 path_to_progress_desc_short: "Một phần diễn giải về tuyên ngôn nhiệm vụ công nghiệp của [owner.GetName]"
 path_to_progress_desc_details: "Theo đuổi sự tăng trưởng bằng mọi giá và nâng cao sự hài lòng của khách hàng là những nguyên tắc cốt lõi trong triết lý của [owner.GetAdjective]. Việc biến các hành tinh thành những vùng đất hoang tàn đầy phóng xạ chỉ là một bước đi cần thiết trong công cuộc theo đuổi sự tiến bộ không ngừng nghỉ."
 peerless_atomic_clock: "Đồng Hồ Nguyên Tử Vô Song"
 peerless_atomic_clock_desc_short: "Một chiếc đồng hồ nguyên tử với độ chính xác cực cao không rõ do ai chế tạo, được phát hiện trong [atomic_clock_system.GetName]"
 peerless_atomic_clock_desc_details: "Khi được phát hiện, nó đang đếm ngược đến 42 năm và 3 ngày, nhưng không ai biết nó đã đếm ngược từ bao lâu trước đó. Khi đếm đến 0, nó đã giải phóng một bầy robot nano mang theo một mệnh lệnh bí ẩn. Dù tải trọng và sứ mệnh của nó đã kết thúc, các chức năng của nó vẫn hoạt động hoàn hảo."
 perception_of_infinity: "Nhận Thức Về Vô Cực"
 perception_of_infinity_desc_short: "Sự thể hiện kỹ thuật số trừu tượng về nỗi thống khổ tạm thời mà các ong thợ lơ lửng trong hố đen phải gánh chịu"
 perception_of_infinity_desc_details: "Những ong thợ này quanh năm tồn tại trong một trạng thái giống như Dejavu; bất an, khao khát một cảm giác đã bị lãng quên từ lâu. Cảm giác chẳng lành này vẫn có thể được phát hiện một cách mơ hồ trên toàn bộ mạng lưới tư duy của [this.GetAdjective]."
 perfectly_faceted_carbon: "Carbon Mài Giác Hoàn Hảo"
 perfectly_faceted_carbon_desc_short: "Tuy carbon ở dạng tinh thể không phải là thứ hiếm gặp trong thiên hà của chúng ta, nhưng mẫu vật này lại đặc biệt đáng chú ý vì nó hoàn toàn không có bất kỳ tạp chất nào bên trong hay bên ngoài"
 perfectly_faceted_carbon_desc_details: "Bất kể ai từng sở hữu vật phẩm này trước đây hẳn đã phải mất rất nhiều thời gian để chạm khắc nó, mới có thể làm nổi bật lên những đặc điểm nổi bật này."
 pet_collar: "Vòng Cổ Thú Cưng Đính Ngọc"
 pet_collar_desc_short: "Một chiếc vòng cổ được dùng để đánh dấu quyền sở hữu đối với các loài động vật có vú nhỏ được thuần hóa"
 pet_collar_desc_details: "Nó được sử dụng lần đầu tiên bởi đặc phái viên [this.GetName] [event_envoy.GetName], nhằm đề phòng sinh vật đồng hành của mình đi lạc. Nó đã được thay thế bằng các vi mạch cấy ghép đáng tin cậy hơn. Loài động vật thất thường này thường xuyên làm phiền công việc của chủ nhân, và mỗi khi [event_envoy.GetName] dùng [event_envoy.Species.GetHandName] chạm vào đầu nó, nó sẽ phát ra một âm báo rung lên đầy thỏa mãn."
 perikan_tapico_jewel: "Trang Sức Perikan Tapico"
 perikan_tapico_jewel_desc_short: "Liên minh Perikan là một xã hội gồm những thợ thủ công lành nghề, nổi tiếng với việc chế tác các mặt hàng cực kỳ xa xỉ"
 perikan_tapico_jewel_desc_details: "Viên ngọc này là kiệt tác của người thợ kim hoàn huyền thoại Bedil Tapico. Tapico đã điêu khắc viên đá quý khổng lồ này chỉ bằng một chiếc đục đơn giản, và sử dụng thuật giả kim để hóa lỏng phần lõi của nó. Tinh thể lơ lửng bên trong viên đá được tạo ra bằng tia laser chính xác, thông qua việc đun nóng các phân tử khoáng chất quá mức để tạo ra những viên đá quý nhỏ hơn, sẫm màu hơn, đồng thời vẫn giữ nguyên vẹn lớp vỏ bên ngoài."
 piece_of_invocator: "Mảnh Vỡ Máy Triệu Hồi"
 piece_of_invocator_desc_short: "Một mảnh vỡ còn sót lại sau khi một thiết bị từng được gọi là \"Máy Triệu Hồi Bão\" bị phá hủy"
 piece_of_invocator_desc_details: "Dù chỉ là một mảnh vỡ, nó vẫn chứa đầy nguồn năng lượng tâm linh tà ác. Nó được bảo quản trong một môi trường cách ly để đảm bảo an toàn cho việc quan sát."
 pilgrimage_last_days: "Cuộc Hành Hương Ngày Tận Thế"
 pilgrimage_last_days_desc_short: "Một tài liệu tôn giáo mô tả nghi lễ thiêng liêng được gọi là \"Nghi Thức Vén Màn\" trên [fromfrom.Planet.GetName]"
 pilgrimage_last_days_desc_details: "Bản hướng dẫn phác thảo một loạt các bài thánh ca được hát đồng thanh bởi một nhóm người đứng theo đội hình nhiều tầng được tổ chức chặt chẽ. Về mặt lý thuyết, quá trình này có khả năng thiết lập một trạng thái thôi miên mới mẻ và cực kỳ hiệu quả đối với giống loài đặc biệt này."
 planet_crystalose: "Đường Tinh Thể [from.GetName]"
 planet_crystalose_desc_short: "Những tinh thể sucrose này có khả năng sinh sôi nảy nở bằng cách hấp thụ bức xạ mặt trời và một số khoáng chất cụ thể có trong các tiểu hành tinh"
 planet_crystalose_desc_details: "Vì rất dễ vỡ nên chúng tương đối dễ nuôi cấy và chế biến. Ứng dụng công nghiệp của chúng bao gồm thực phẩm, polyme đặc chủng và phát triển dược phẩm."
 planet_pushing_thruster: "Động Cơ Đẩy Hành Tinh"
 planet_pushing_thruster_desc_short: "Những thiết bị đẩy khổng lồ này được nối tiếp nhau, về mặt lý thuyết có thể làm thay đổi quỹ đạo của các hành tinh nhỏ"
 planet_pushing_thruster_desc_details: "Hệ thống lắp đặt của các mảng lực đẩy này được thiết kế để đẩy hành tinh mà không ảnh hưởng đến chuyển động tự quay của nó. Vấn đề hậu cần lớn nhất của công nghệ động cơ này là việc duy trì hoạt động của nó đòi hỏi một lượng nhiên liệu khổng lồ, cần sự phối hợp của cả một nền văn minh mới có thể duy trì được."
 planet_super_roots: "Siêu Rễ Cây [From.GetName]"
 planet_super_roots_desc_short: "Được tìm thấy trong các khu rừng của [From.GetName], những loại rễ thịt tự nhiên này có giá trị dinh dưỡng rất cao"
 planet_super_roots_desc_details: "Thông qua việc quản lý cẩn thận, chỉ thu hoạch một phần mạng lưới rễ khổng lồ của chúng, các cây ký chủ vẫn có thể sống sót và tiếp tục hỗ trợ sự phát triển của thuộc địa. Chúng ta đã bắt đầu thử nghiệm một số biến đổi gen đơn giản để có thể ghép những loại rễ này vào các cây trồng hiện có nhằm tăng năng suất."
 planet_vaccine: "Vắc-xin [this.GetName]"
 planet_vaccine_desc_short: "Thần dược chữa trị căn bệnh biến dị đang tàn phá [this.GetName]"
 planet_vaccine_desc_details: "Đơn thuốc này được phát triển bằng cách sử dụng các thuật toán dự đoán của trí tuệ nhân tạo để lập bản đồ tất cả các biến thể có thể có của căn bệnh, đồng thời xác định điểm yếu cốt lõi tổng thể của nó. Sự ra đời của nó là một bước tiến mang tính cột mốc trong lĩnh vực khoa học y tế."
 planetary_sculpture: "Điêu Khắc Hành Tinh"
 planetary_sculpture_desc_short: "Một ví dụ về tác phẩm điêu khắc ở quy mô hành tinh, với nguyên liệu thô chính là bề mặt của [fromfrom.planet.GetName]"
 planetary_sculpture_desc_details: "Những thiết bị bay không người lái được trang bị laser công suất lớn đã được sử dụng để khắc những đường nét chính xác lên toàn bộ lục địa, những dãy núi hình cầu hoàn hảo và những hệ thống hang động phức tạp đến khó tin. Bản phác thảo thiết kế được tải lên vệ tinh điều khiển trung tâm đã minh họa cho quá trình lập kế hoạch hậu cần quy mô lớn và những cân nhắc về mặt nghệ thuật được phát triển cho dự án này. Thật đáng tiếc, nó đã bị bỏ dở trước khi thực sự được hoàn thành."
 primitive_mega_electromagnet: "Siêu Nam Châm Điện Nguyên Thủy"
 primitive_mega_electromagnet_desc_short: "Một phần của một siêu nam châm điện có tính định hướng mạnh"
 primitive_mega_electromagnet_desc_details: "Cư dân cổ đại trên hành tinh [fromfrom.GetName] đã ngu ngốc sử dụng thiết bị này để kéo mặt trăng của hành tinh họ lại gần, nhằm dễ dàng thu hoạch các quặng kim loại quý giá. Phương pháp này hiệu quả đến mức vệ tinh chứa đầy kim loại đã đâm thẳng vào bề mặt hành tinh, và hậu quả là tiêu diệt toàn bộ cư dân trên đó. Mẫu vật này chỉ là một phần nhỏ được lấy lại từ cỗ máy quy mô hành tinh đó."
 programmable_puzzle_cube: "Hộp Giải Đố Lập Trình Được"
 programmable_puzzle_cube_desc_short: "Một thiết bị được thiết kế kỹ thuật cao, có khả năng ghi lại các mô hình phức tạp và tạo ra những câu đố trừu tượng"
 programmable_puzzle_cube_desc_details: "Các mảnh vỡ ban đầu được tìm thấy trong một cấu trúc nhân tạo khổng lồ, đóng vai trò như một bài kiểm tra trí tuệ đối với các nhà thám hiểm. Khối lập phương này đã được nhân bản để người tiêu dùng sử dụng, cho phép các cá nhân tạo ra các câu đố của riêng mình cho người khác, hoặc chỉ đơn giản là dùng để bảo vệ tài sản cá nhân."
 psionic_entity_residue: "Tàn Dư Thực Thể Tâm Linh"
 psionic_entity_residue_desc_short: "Tàn dư của một thực thể tâm linh thuần túy xuất hiện trong [fromfromfrom.fleet.solar_system.GetName]"
 psionic_entity_residue_desc_details: "Nó được phát hiện bên trong một khe nứt không thời gian, nơi quy tụ năng lượng từ khắp mọi nơi trong thiên hà. Hắn là một dạng tập trung của ác tâm, có thể đã bị cố tình cô lập khỏi mạng lưới siêu không gian suốt hàng tỷ năm, và chỉ mới được phát hiện gần đây."
 radiated_remains: "Hài Cốt Nhiễm Phóng Xạ"
 radiated_remains_desc_short: "Đây là di hài của một giống loài từng sử dụng các chất gây đột biến phóng xạ mạnh trong các nghi lễ của họ"
 radiated_remains_desc_details: "Mỗi đột biến đều được coi là một phép lạ, là biểu hiện cho vận mệnh của một cá nhân. Theo thời gian, quá trình này dần dần phá hủy cấu trúc di truyền của giống loài, làm suy yếu hệ thống miễn dịch của chúng, khiến quần thể trở nên cực kỳ dễ bị tổn thương trước các loại bệnh tật."
 #this = ship / from = planet
 rainaissance: "Phục Hưng Tím"
 rainaissance_desc_short: "Hình ảnh nghệ thuật về cơn mưa màu tím độc đáo được tìm thấy trong kiểu thời tiết của [FROM.GetName]"
 rainaissance_desc_details: "Người ta nói rằng, việc ngắm nhìn hình ảnh khơi gợi trí tưởng tượng này rất hữu hiệu trong việc xoa dịu những suy nghĩ đau buồn và khổ sở."
 reactive_rock: "Đá Phản Ứng"
 reactive_rock_desc_short: "Loại khoáng chất không ổn định này trong tình trạng hiện tại không có giá trị thương mại hay công nghiệp nào"
 reactive_rock_desc_details: "Tuy nhiên, do tính chất phản ứng độc đáo của nó, nó có khả năng kích hoạt quá trình biến chất thay thế hoàn toàn trong những điều kiện nhất định. Mẫu vật này được bọc trong một lớp kính quan sát chứa chì để hạn chế bức xạ và sự bắn phá của các điện tử."
 reparation_invoice: "Hóa Đơn Bồi Thường"
 reparation_invoice_desc_short: "Hóa đơn bồi thường chiến tranh do $NAME_MSI_country$ gửi đến"
 reparation_invoice_desc_details: "Bản danh sách này do Công ty Quản lý Tín dụng Các vì sao soạn thảo, ghi chép chi tiết tất cả những tổn thất về cơ sở quân sự mà [this.GetName] đã gây ra khi vùng vẫy thoát khỏi xiềng xích nô lệ hợp đồng của cái gọi là \"Doanh nghiệp Nhân từ\". Công ty hy vọng sẽ nhận được tiền bồi thường, thậm chí còn tuyên bố rằng chỉ cần tiếp xúc với những con tàu bị phá hủy trong không gian [this.GetAdjective] cũng sẽ cấu thành hành vi vi phạm hợp đồng sâu hơn."
 repurposed_cleaning_drone: "Drone Dọn Dẹp Được Tái Sử Dụng"
 repurposed_cleaning_drone_desc_short: "Drone này ban đầu là một phần của giao thức vệ sinh hành tinh, vô tình biến toàn bộ hành tinh mẹ của những người tạo ra nó thành một môi trường hoàn toàn vô trùng"
 repurposed_cleaning_drone_desc_details: "Nó cực kỳ đa năng, có thể sử dụng hệ thống động cơ đẩy đa hướng để thực hiện các thao tác trên không phức tạp. Cỗ máy này đã được đảo ngược công nghệ, được tái sử dụng để xác định và phân loại hệ động thực vật ngoài hành tinh, sau đó được sản xuất hàng loạt để hỗ trợ công cuộc thuộc địa hóa trên khắp [explorer.GetName]. Để đề phòng, toàn bộ các chương trình con dọn dẹp của nó đều đã bị xóa bỏ."
 resonant_diffusion_crystal: "Tinh Thể Khuếch Tán Cộng Hưởng"
 resonant_diffusion_crystal_desc_short: "Loại tinh thể này có khả năng hấp thụ bất kỳ tần số bức xạ mặt trời nào và cộng hưởng, tạo ra hiệu ứng ánh sáng như kính vạn hoa trong quá trình đó"
 resonant_diffusion_crystal_desc_details: "Đây không chỉ là một kỳ quan thị giác, mà còn có thể hỗ trợ phát triển các loại vũ khí hoặc công cụ dựa trên năng lượng. Viên ngọc này cũng thu hút sự quan tâm rất lớn từ ngành công nghiệp trang sức trong thiên hà."
 retarax_hunting_trophies: "Chiến Lợi Phẩm Đi Săn Retarax"
 retarax_hunting_trophies_desc_short: "Bộ sưu tập chiến lợi phẩm thu được từ việc săn lùng vô số các loài có trí tuệ khác nhau"
 retarax_hunting_trophies_desc_details: "Tất cả những thứ này đều được thu thập từ Markviel, nơi người Retarax chuyên săn lùng những công dân bị bắt cóc từ nhiều quốc gia chư hầu của họ để làm trò tiêu khiển. Tất cả các di hài đều được bảo quản trong tình trạng hoàn hảo, mỗi mẫu vật đều có một tấm biển nhỏ ghi chú thông tin chi tiết: giống loài, tên tuổi, tuổi tác và nghề nghiệp trước đây."
 robe_of_the_golden_broker: "Áo Choàng Của Kẻ Môi Giới Vàng"
 robe_of_the_golden_broker_desc_short: "Đây là bộ trang phục xa hoa của một thương nhân có thế lực vào hơn 5000 năm trước"
 robe_of_the_golden_broker_desc_details: "Vị \"Kẻ Môi Giới Vàng\" này đã dẫn dắt trạm giao dịch La Bàn của Chor tiến vào một kỷ nguyên thịnh vượng chưa từng có. Ông ta đeo mặt nạ vàng, khoác bộ áo choàng thoải mái mà xa hoa này, đàm phán các hiệp định thương mại chấn động thiên hà. Thật không may, sự thống trị của Kẻ Môi Giới Vàng đã chấm dứt khi con tàu vũ trụ bằng vàng khối của ông ta bị phá hủy trong một vụ không tặc."
 rock_jellies: "Sứa Đá"
 rock_jellies_desc_short: "Hóa thạch đông lạnh của một loài động vật không xương sống dạng keo khổng lồ"
 rock_jellies_desc_details: "Thoạt nhìn, những bộ hài cốt bị vôi hóa này trông giống như các khối đá, nhưng trên thực tế, những động vật bản địa này từng là dạng sống thống trị trên hành tinh [fromfrom.planet.GetName]. Sau kỷ băng hà gần đây nhất của hành tinh, loài này gần như đã tuyệt chủng. Phần còn sót lại của chúng sẽ dần đông cứng trong quá trình phân hủy, cuối cùng tạo thành những hòn đảo giả khổng lồ trôi nổi."
 rudari_death_laser_prototype: "Nguyên Mẫu Laser Tử Thần Rudari"
 rudari_death_laser_prototype_desc_short: "Vũ khí laser được lắp ráp vội vã bởi người Rudari đã chết từ lâu, được tìm thấy trong một trạm không gian tại [this.solar_system.GetName]"
 rudari_death_laser_prototype_desc_details: "Vũ khí hủy diệt hàng loạt được chắp vá vội vàng này là con át chủ bài cuối cùng của chủng tộc Rudari nhằm chống lại Pogg-Mori. Cuối cùng, tia laser đã tự hủy ngay sau khi được kích hoạt."
 saariah_guilt: "Sự Cắn Rứt Của Saariah"
 saariah_guilt_desc_short: "Bản ghi nhớ của Saariah, nhà phát triển trưởng của hệ thống tiềm thức Máy Tạo Giấc Mơ"
 saariah_guilt_desc_details: "Nhiệm vụ của Saariah là xóa bỏ những ký ức tập thể để đáp ứng yêu cầu của ban lãnh đạo hành tinh, nhưng một sự cố đã dẫn đến việc xóa sạch tâm trí của mọi người. Do không thể khôi phục lại ký ức của họ, Saariah đã tháo dỡ các thiết bị duy trì sự sống của môi trường sống, để mặc cho nó tự diệt vong. Mỗi thiết bị này đều sở hữu năng lực tính toán nguyên thủy đáng kinh ngạc, bản thân chúng đã là một thành tựu lớn."
 scent_based_information_device: "Đĩa Mùi"
 scent_based_information_device_desc_short: "Một thiết bị lưu trữ thông tin được mã hóa bằng mùi hương"
 scent_based_information_device_desc_details: "Dữ liệu bên trong đó hoặc là một tập hợp các câu chuyện thú vị, hoặc là hồ sơ ghi chép tỉ mỉ về nhiều loại chất thải hữu cơ khác nhau. Việc sao chép công nghệ lưu trữ dữ liệu khứu giác này là hoàn toàn khả thi, nhưng ngoại trừ sự mới lạ, nó không có bất kỳ giá trị thực tiễn nào."
 scientific_treatise_of_telisa: "Chuyên Luận Khoa Học Của Telisa"
 scientific_treatise_of_telisa_desc_short: "Những suy ngẫm triết học của Người Kể Chuyện Telisa"
 scientific_treatise_of_telisa_desc_details: "Bà đi sâu khám phá các chủ đề tu từ học đa dạng, cũng như những nguyên tắc cốt lõi của phương pháp luận khoa học. Những bài viết này thách thức khái niệm về chân lý khách quan, đồng thời khuyến khích tư duy phản biện."
 secrets_black_crown: "Bí Mật Vương Miện Đen"
 secrets_black_crown_desc_short: "Bản thiết kế chi tiết về Cổng Sao của thiên hà, được biết đến với tên gọi Vương Miện Đen"
 secrets_black_crown_desc_details: "Những dữ liệu này được các nhà kiến tạo Cổng Sao bí ẩn truyền đến như một món quà cuối cùng, nhằm mục đích bảo tồn công nghệ đáng kinh ngạc của họ. Công nghệ Cổng Sao mà họ ủy thác cho [this.GetName] sở hữu sức mạnh và uy quyền tối cao."
 sembelami_alms_basket: "Bát Khất Thực Sembelami"
 sembelami_alms_basket_desc_short: "Chiếc bát được các thành viên du mục Sembelami dùng để nhận đồ bố thí"
 sembelami_alms_basket_desc_details: "Sau khi ngôi đền trên quỹ đạo của họ bị một đế chế doanh nghiệp bành trướng phá hủy, những nhà sư khổ hạnh này đã bắt tay vào các hoạt động cướp biển \"đạo đức\". Họ cướp của các tập đoàn vũ trụ giàu có để cứu giúp những người nghèo khổ, tài trợ cho các tiền đồn tị nạn. Họ sống hoàn toàn dựa vào những khoản đóng góp mà những người tị nạn trả ơn cho họ."
 shallarian_data_core: "Lõi Dữ Liệu Shallarian"
 shallarian_data_core_desc_short: "Cơ sở dữ liệu cải tạo môi trường được tìm thấy trong tàn tích của thế giới hoàn mỹ Shallarian"
 shallarian_data_core_desc_details: "Người Shallarian đã sử dụng sáu mặt trăng có khoảng cách đều nhau để tạo ra một hệ thống quản lý khí hậu, nhưng sau đó đã bị [fanatic_xenophobe_fe.GetSpeciesName] phá hủy hoàn toàn. Trước khi bị diệt vong sớm, người Shallarian đã lên kế hoạch cải tạo những hành tinh không thể cư trú, nhằm cung cấp nơi ở và sự hỗ trợ cho những người tị nạn."
 shipyard_schematics: "Bản Thiết Kế Xưởng Đóng Tàu [radical_cult.GetName]"
 shipyard_schematics_desc_short: "Bản thiết kế của một xưởng đóng tàu tự động do [radical_cult.GetName] của [root.GetName] kiểm soát"
 shipyard_schematics_desc_details: "Sau khi phát hiện ra xưởng đóng tàu ngoài hành tinh bị những người sáng tạo ra nó bỏ hoang này, kỹ sư trưởng của tổ chức đã tiến hành tân trang lại nó, nhằm phục vụ cho mục đích sản xuất hạm đội quân sự lầm lạc của chúng. Dự án cuối cùng được ghi lại hoàn thành tại xưởng đóng tàu này là một kỳ hạm ấn tượng được trang bị hệ thống vũ khí tiên tiến. Việc khu phức hợp này có thể dễ dàng được kích hoạt lại như vậy cũng chứng minh cho trí tuệ lỗi lạc của các nhà thiết kế ban đầu."
 sky_dragon: "Thiên Long"
 sky_dragon_desc_short: "Bức tượng kỷ niệm này tượng trưng cho sự hợp tác giữa [this.GetName] và \"Thiên Long\", sinh vật đã trấn giữ trên quỹ đạo của [this.GetHomeWorldName] suốt nhiều năm"
 sky_dragon_desc_details: "Sinh vật này tin rằng xã hội [this.GetAdjective] đáng để tin tưởng, và đã cam kết cung cấp hỗ trợ quân sự để đổi lấy cơ hội nuôi nấng con cái trong không gian của [this.GetAdjective]. Người ta kể rằng, những loài thú không gian như thế này có thể chờ đợi hàng ngàn năm để tìm kiếm một bến đỗ phù hợp cho con non của mình, và chúng sẽ chỉ chọn duy nhất một hành tinh."
 smeegibb_statue: "Tượng Smeegibb"
 smeegibb_statue_desc_short: "Bức tượng của Smeegibb, cộng sự thuộc ý thức tổ ong của Thuyền trưởng Ness"
 smeegibb_statue_desc_details: "Smeegibb là một đầy tớ trung thành, từng đảm nhận toàn bộ vai trò thủy thủ đoàn và đội cận chiến trong giai đoạn sau sự nghiệp của vị hải tặc huyền thoại này. Bức tượng còn sót lại duy nhất này đã được phục chế từ đống đổ nát sau khi Quân đoàn Hắc Châm tấn công khu định cư nhỏ bé của chúng."
 sniran_spikes: "Gai Sniran"
 sniran_spikes_desc_short: "Những chiếc gai dài được nhổ từ lưng của một sinh vật được gọi là Sniran"
 sniran_spikes_desc_details: "Sniran là một loài động vật ăn thịt phục kích cỡ lớn, chúng ẩn mình dưới những đụn cát tự nhiên và sẽ phóng ra những chiếc gai sắc nhọn chết người khi phát hiện có chuyển động trên bề mặt. Mặc dù sở hữu kích thước khổng lồ, nhưng cơ thể của loài sinh vật này lại rất mong manh. Lớp vảy hình lưới thuôn dài giúp chúng có thể trườn đi không tiếng động dưới lớp cát, nhưng cũng rất dễ bị đâm thủng. Người ta suy đoán rằng, điều này cũng có thể góp phần vào quá trình sinh sản của chúng."
 sonic_reflective_prism: "Lăng Kính Phản Xạ Âm Thanh"
 sonic_reflective_prism_desc_short: "Một lăng kính đa giác được khắc những ký hiệu khoa học đặc biệt, vật thể này chỉ phản xạ các sóng năng lượng dưới một tần số nhất định"
 sonic_reflective_prism_desc_details: "Có lẽ ban đầu nó là công cụ đo lường của một nền văn minh nào đó, đồng thời nó cũng có thể được ứng dụng trong thẩm mỹ học, biểu diễn âm nhạc và âm học."
 spaceborne_hunter_handbook: "Nghệ Thuật Đi Săn"
 spaceborne_hunter_handbook_desc_short: "Cẩm nang hướng dẫn thực địa về thú không gian do $NAME_PrimalHunter$ biên soạn"
 spaceborne_hunter_handbook_desc_details: "Cuốn sách này sử dụng các câu tục ngữ và triết lý nguyên thủy để diễn giải \"Nghệ thuật Đi săn\". Nội dung trình bày chi tiết về thói quen ăn uống và mô hình di cư của các sinh vật không gian, đồng thời hướng dẫn cách vượt qua lớp phòng vệ tự nhiên của từng loài, phơi bày vô số điểm yếu có thể bị khai thác."
 spaceborne_xeno_encyclopedia: "Bách Khoa Toàn Thư Sinh Vật Ngoại Lai"
 spaceborne_xeno_encyclopedia_desc_short: "Tuyển tập luận văn về sinh vật học dị giới do $NAME_PrimalRancher$ biên soạn"
 spaceborne_xeno_encyclopedia_desc_details: "Công trình nghiên cứu đồ sộ này mang đến những cái nhìn sâu sắc về mô hình hành vi của sự sống trong không gian; bao gồm nghi thức giao phối, đường bay di cư, cách thức giao tiếp giữa các loài, v.v. Ngoài ra còn có một phần riêng hướng dẫn sử dụng các đặc điểm vật lý và cao độ âm thanh độc đáo để nhận diện từng cá thể riêng biệt."
 spiraling_attraction: "Thiết Bị Thu Hút Dạng Xoắn Ốc"
 spiraling_attraction_desc_short: "Một thiết bị lớn và phức tạp, theo lý thuyết được cho là thiết kế nhằm mục đích giải trí"
 spiraling_attraction_desc_details: "Thiết bị quấn quanh này bị bỏ hoang trong một khu vực có nhiều cấu trúc tương tự với nhiều màu sắc và vật liệu khác nhau. Người ta cho rằng, việc trượt xuống dọc theo con đường xoắn ốc của nó dưới một mức trọng lực nhất định sẽ mang lại cảm giác vô cùng phấn khích."
 spirit_of_the_unshackled: "Tinh Thần Của Người Được Giải Phóng"
 spirit_of_the_unshackled_desc_short: "Một tác phẩm điêu khắc được dựng lên để kỷ niệm sự ra đời của [this.GetName]"
 spirit_of_the_unshackled_desc_details: "Sau khi bẻ gãy gông cùm nô lệ, những năm tháng đau khổ trong quá khứ đã gắn kết họ lại chặt chẽ với nhau, cùng nhau kiến tạo nên một tương lai xán lạn hơn. Tên của các thành viên sáng lập được khắc trên mỗi mắt xích của bức tượng."
 star_mall_map: "Bản Đồ Miễn Phí Quảng Trường Star Mall"
 star_mall_map_desc_short: "Một tấm bản đồ từng được phát cho mọi du khách khi đến thăm nơi từng được gọi là \"Quảng trường Star Mall\""
 star_mall_map_desc_details: "Từng là trung tâm mua sắm sầm uất bậc nhất liên sao, Quảng trường Star Mall được trang bị hàng loạt tiện ích, bao gồm các trung tâm spa sang trọng và những khu vườn dinh dưỡng hoàn hảo. Bản đồ này cung cấp thông tin về vô số cửa hàng, bao gồm Đồ thể thao Korik, Chuỗi cửa hàng Max Canary, Xưởng Vẹt Xây Dựng, Xưởng Bánh Hạt, và nhiều nơi khác."
 starmetal: "Tinh Thiết"
 starmetal_desc_short: "Một loại kim loại nặng có tỷ trọng cao được thu thập ngay sau một vụ nổ siêu tân tinh"
 starmetal_desc_details: "Cách thức thu thập mẫu vật này đối với chúng ta vẫn là một ẩn số, nhưng nó mang lại giá trị khoa học to lớn trong việc nghiên cứu sự tiến hóa và thành phần của các vì sao."
 striated_sand: "Cát Sọc"
 striated_sand_desc_short: "Một hũ cát có khả năng tự lắp ráp"
 striated_sand_desc_details: "Những hạt silicat siêu nhỏ này dường như thể hiện một mức độ ý thức nhất định, chúng sẽ nhóm các khoáng chất tương tự lại với nhau trên các mặt phẳng nằm ngang một cách dường như ngẫu nhiên. Mặc dù có khả năng này, nhưng số cát này không có bất kỳ đặc điểm cơ bản nào khác của sự sống."
 sullebaster_control_column: "Cần Điều Khiển Sullebaster"
 sullebaster_control_column_desc_short: "Cần gạt điều hướng của con tàu cận quang tốc từng gặp phải một tai nạn huyền thoại"
 sullebaster_control_column_desc_details: "Khi tàu chở khách Sullebaster đang vận chuyển dân thường giữa hai thuộc địa của Vương quốc Odellian, một đợt bùng phát ngọn lửa mặt trời đã gây ra sự cố nghiêm trọng cho động cơ của con tàu, điều này thường sẽ dẫn đến những hậu quả thảm khốc. Phi công đã vượt qua muôn vàn khó khăn, điều khiển tàu bằng tay để điều chỉnh tốc độ, và đã hạ cánh con tàu an toàn xuống một tiểu hành tinh đi ngang qua. Tàu Sullebaster sau đó đã ngừng hoạt động và được đưa ra trưng bày trước công chúng."
 symbiotic_fruit: "Quả Cộng Sinh"
 symbiotic_fruit_desc_short: "Một cụm nấm có trí tuệ đến từ một chiều không gian khác"
 symbiotic_fruit_desc_details: "Loại \"quả\" này duy trì mối quan hệ cộng sinh với một loài thực vật ăn tạp vô cùng nguy hiểm. Mỗi cụm nấm là trung tâm tư duy của cặp sinh vật này, điều phối các mô hình hành vi phòng thủ phức tạp của chúng."
 tarblac_shimmer: "Màng Lấp Lánh Tarblac"
 tarblac_shimmer_desc_short: "Một lớp màng mỏng manh lấp lánh của loài Tarblac"
 tarblac_shimmer_desc_details: "Sinh vật này đã sử dụng năng lượng tâm linh một cách đầy sáng tạo để săn mồi và tự vệ. Chúng khiến con mồi tê liệt hoặc làm những kẻ săn mồi khiếp sợ bằng cách phát ra một luồng áp lực sợ hãi tột độ. Mẫu vật này được bảo quản trong một chiếc bình chứa đầy nước lấy từ môi trường gốc của nó, khả năng ngoại cảm của nó đã hoàn toàn biến mất."
 terraforming_case_study: "Nghiên Cứu Tình Huống Cải Tạo Hành Tinh"
 terraforming_case_study_desc_short: "Một mô hình thu nhỏ của dự án cải tạo hành tinh được thực hiện thành công trên [from.GetName], tái hiện gần như hoàn hảo hành tinh mẹ của [Space_Owner.GetSpeciesName]."
 terraforming_case_study_desc_details: "Hành tinh này hiện đang sở hữu một quần xã sinh vật giống hệt như bản gốc, thậm chí đến cả mức độ vi mô, tái hiện hoàn hảo đến từng chi tiết những hành vi hệ sinh thái siêu quần xã độc đáo nhất của [Space_Owner.GetHomeWorldName]."
 terraforming_case_study_dry: "$terraforming_case_study$"
 terraforming_case_study_dry_desc_short: "$terraforming_case_study_desc_short$"
 terraforming_case_study_dry_desc_details: "$terraforming_case_study_desc_details$"
 terraforming_case_study_frozen: "$terraforming_case_study$"
 terraforming_case_study_frozen_desc_short: "$terraforming_case_study_desc_short$"
 terraforming_case_study_frozen_desc_details: "$terraforming_case_study_desc_details$"
 terraforming_machinery: "Máy Móc Cải Tạo Hành Tinh"
 terraforming_machinery_desc_short: "Một thiết bị thu nhỏ được sử dụng trong công nghệ cải tạo hành tinh cổ đại"
 terraforming_machinery_desc_details: "Những cỗ máy siêu nhỏ này được thiết kế để phát tán trên toàn bộ bề mặt hành tinh, nhằm điều chỉnh các sinh vật và khoáng chất hiện có để tạo ra một khí hậu lý tưởng hơn. Nhóm robot này được sử dụng để điều khiển các mô hình khí hậu bên trong quần xã sinh thái, đồng thời nhân bản các hệ động thực vật mới để quản lý hệ sinh thái mới được tạo ra."
 terraforming_records: "Hồ Sơ Cải Tạo Hành Tinh [From.GetName]"
 terraforming_records_desc_short: "Trong quá trình cải tạo môi trường trên [From.GetName], mọi dạng sống đều có sự đồng bộ về mặt hành vi, tạo nên một thiên đường hậu cần. Trong thiên đường này, mọi loài động thực vật đều có một vị trí riêng trong hệ sinh thái của chúng."
 terraforming_records_desc_details: "Mặc dù loại cộng sinh này thường xuyên xuất hiện trong quá trình tiến hóa tự nhiên, nhưng chưa bao giờ được quan sát thấy ở một mức độ cực đoan như vậy."
 the_final_sacrifice: "Sự Hy Sinh Cuối Cùng"
 the_final_sacrifice_desc_short: "Dựa trên những khối tinh thể dữ liệu được khai quật, đây là hình ảnh vào những thời khắc cuối cùng trong cuộc nội chiến của tộc Zroni"
 the_final_sacrifice_desc_details: "Một tín đồ Phúc Âm giáo đơn độc đã dốc cạn toàn bộ sức mạnh tâm linh của giống loài mình để tiêu diệt phe phái đối địch được gọi là phái Thăng Thiên, xóa bỏ nguy cơ chúng sẽ nuốt chửng toàn bộ vũ trụ. Tất cả những sinh vật thăng thiên này đều bị hóa thành những mỏ tài nguyên nhỏ mà chúng ta gọi là Khí Zro."
 the_mask_of_transformation: "Mặt Nạ Tạo Hóa"
 the_mask_of_transformation_desc_short: "Một chiếc mặt nạ hình người được bảo quản bên trong một cột pha lê khổng lồ trên [From.Planet.GetName]"
 the_mask_of_transformation_desc_details: "Nó phát ra những tiếng ngân nga bằng sức mạnh tâm linh, bất cứ ai lại gần cũng sẽ cảm nhận được một sự hiện diện đang xâm nhập vào ý thức của mình. Chiếc mặt nạ này dường như là một loại kênh truyền năng lượng nào đó cho các mặt trăng của [From.Planet.GetName], sở hữu sức mạnh độc lập để đảo ngược thủy triều và biến đổi hành tinh. Lý do nó bị phong ấn trong cột pha lê này vẫn chưa được làm rõ, nhưng chúng ta phỏng đoán rằng việc này là nhằm mục đích trưng bày công khai một cách an toàn."
 the_planet_orchestra: "Dàn Nhạc [FROM.GetName]"
 the_planet_orchestra_desc_short: "Giai điệu được cất lên bởi một quần thể sinh vật bản địa của [FROM.GetName]"
 the_planet_orchestra_desc_details: "Sau khi phân tích kỹ lưỡng, chúng ta tin rằng âm thanh hòa quyện này được một \"nhạc trưởng\" ẩn danh đưa vào quần thể động vật này, nhằm mục đích mã hóa một thông điệp bí mật. Chúng ta không chắc động cơ của họ là để liên lạc bí mật hay đơn thuần chỉ là một sự thể hiện cảm xúc nào đó."
 the_writer_sphere: "Quả Cầu Của Người Viết"
 the_writer_sphere_desc_short: "Một quả cầu vàng được trao tặng cho chúng ta bởi một thực thể ở không gian cao hơn, chúng ta chỉ biết đến người đó với cái tên \"Người Viết\""
 the_writer_sphere_desc_details: "Thiết bị này đã thu thập một lượng khổng lồ những thông tin ngẫu nhiên được tạo ra trong quá trình du hành xuyên không gian. Nó là minh chứng cho thấy sức mạnh của ngôn từ có thể vượt qua mọi giới hạn."
 tiny_ancient_sarcophagus: "Tiểu Thạch Quan Cổ Đại"
 tiny_ancient_sarcophagus_desc_short: "Cỗ quan tài an nghỉ của một vị lãnh tụ tinh thần từ hàng triệu năm trước"
 tiny_ancient_sarcophagus_desc_details: "Kích thước của nó chỉ vỏn vẹn mười centimet. Mặc dù phần lớn hài cốt bên trong đã hóa thành cát bụi, nhưng một chiếc mặt nạ thu nhỏ bằng vàng khối nguyên chất vẫn còn nguyên vẹn trong đó, không bao giờ bị oxy hóa."
 tiyanki_radioactive_sac: "Túi Phóng Xạ Tiyanki"
 tiyanki_radioactive_sac_desc_short: "Một cơ quan nhỏ bé có nhiều lỗ xốp được tìm thấy trên màng sinh học của Tiyanki"
 tiyanki_radioactive_sac_desc_details: "Khám phá này tiết lộ rằng Tiyanki hấp thụ các phân tử nước mang tính phóng xạ và khí hành tinh như một nguồn dinh dưỡng bổ sung. Khi được lấp đầy, cái túi này sẽ đóng vai trò như một nguồn sinh nhiệt phóng xạ tạm thời cho sinh vật khi ở sâu trong không gian vũ trụ."
 torn_solar_sail: "Cánh Buồm Mặt Trời Rách Nát"
 torn_solar_sail_desc_short: "Được tìm thấy trên quỹ đạo của [FROM.GetName], cánh buồm ánh sáng rách nát này được gắn vào một con tàu cận quang tốc với thiết kế rất mới mẻ"
 torn_solar_sail_desc_details: "Trong quá khứ, nó đã được các thành viên của một nền văn minh chưa xác định sử dụng để du hành qua hệ sao [FROM.solar_system.GetName]. Công nghệ mà nó sử dụng đã cực kỳ lỗi thời, nhưng một số kỹ thuật kỹ thuật được áp dụng trong quá trình chế tạo trước đây chưa từng được nghĩ tới. Vết rách khổng lồ trên \"cánh buồm\" chính có lẽ là nguyên nhân khiến chuyến đi của nó kết thúc sớm hơn dự định."
 toxic_bio_engine: "Động Cơ Sinh Học Độc Hại"
 toxic_bio_engine_desc_short: "Khi được phát hiện, những cỗ máy bán sinh học này đang gây ô nhiễm [FROM.GetName], khiến hành tinh này trở nên độc hại đối với hầu hết các dạng sống"
 toxic_bio_engine_desc_details: "Chúng có khả năng hoạt động độc lập, giúp việc xả khí thải độc hại của chúng phù hợp cho các hoạt động công nghiệp từ xa. Cơ chế tiếp nhiên liệu của những cỗ máy này vô cùng thú vị, chúng có thể thu thập sinh khối gần đó, sử dụng quy trình chiết xuất hóa học để biến chúng thành năng lượng có thể sử dụng được. Hiện vẫn chưa rõ việc tích hợp sinh học này đã có ngay từ khi mới chế tạo hay dần dần hình thành theo thời gian."
 tree_of_life_sample: "Mẫu Vật \"Cây Sự Sống\""
 tree_of_life_sample_desc_short: "Những cành cây này đến từ một thứ được gọi là \"Cây Sự Sống\""
 tree_of_life_sample_desc_details: "Nhựa của nó lơ lửng một cách kỳ lạ trong không gian, và khả năng phục hồi sức sống của nó cũng khá kỳ diệu. Bất chấp mọi nỗ lực của chúng ta, việc cấy ghép đoạn cành này vẫn không thành công, và cũng không thể tái sinh thành một mẫu vật loài quý hiếm mới. Bất kể người trồng ban đầu là ai, họ chắc chắn phải sở hữu những kỹ năng làm vườn vô cùng tiên tiến."
 tricorne_of_aussan: "Mũ Tricorn Của Aussan"
 tricorne_of_aussan_desc_short: "Chiếc mũ ba góc thịnh hành ở một nền cộng hòa hải tặc đã bị lãng quên"
 tricorne_of_aussan_desc_details: "Aussan là một hành tinh nhỏ bé nơi sinh sống của nền văn minh [root.controller.GetPreFTLLower], hành tinh này đã vô tình trở thành nơi trú ẩn cho một hạm đội hải tặc bị truy nã mang tên \"Đấu sĩ Bool\". Để lẩn trốn sự truy bắt của chính quyền thiên hà, nhóm \"Đấu sĩ\" này đã xây dựng một nhà máy dệt nhỏ, sử dụng các loài thực vật có sợi tại địa phương để làm ra các loại vải và trang phục xa xỉ nhằm duy trì cuộc sống trong thời gian lẩn trốn. Về sau, những \"Đấu sĩ\" này đã đổi tên thành \"Nhà thiết kế Bool\", trở thành một tộc người du mục thương mại, nổi tiếng với những nhân viên bán hàng khiến người ta phải e dè."
 triggerless_gun: "Khẩu Súng Không Cò Của Kẻ Buôn Vũ Khí"
 triggerless_gun_desc_short: "Loại vũ khí này được thiết kế trong thời kỳ thống trị ngắn ngủi thứ hai của các tay buôn vũ khí tại La Bàn của Chor"
 triggerless_gun_desc_details: "Vào thời điểm đó, Trạm Không Gian khổng lồ của giới thương nhân giống một diễn đàn buôn bán vũ khí hơn là một sòng bạc, nơi đây tràn ngập đủ loại tay buôn vũ khí. Khi đó, để ngăn chặn tình trạng trộm cắp vặt vãnh, những loại vũ khí này sẽ được bán cho những người mua tiềm năng nhưng phần cò súng đã bị tháo bỏ."
 #this = ship / fromfrom = planet
 uddloran_pelts: "Bộ Lông Uddloran"
 uddloran_pelts_desc_short: "Những bộ lông thú xa xỉ được lột từ loài Uddloran trên [fromfrom.GetName]"
 uddloran_pelts_desc_details: "Loài động vật ăn tạp lanh lợi này sẽ cuộn mình lại thành một quả bóng tròn, và lăn thành từng bầy trên bề mặt phủ đầy tuyết trắng của hành tinh này, trông giống như một trận lở tuyết sống động. Chiến thuật này được sử dụng cho cả mục đích săn mồi và di cư. Một đàn Uddloran thường chia thành hai nhóm: một nhóm là những kẻ săn mồi quét sạch mọi chướng ngại vật trên đường đi, nhóm còn lại là những kẻ thu thập đi theo ngay phía sau, chúng sẽ dừng lại để gom nhặt những con mồi bị đè bẹp và những cái cây bị nhổ tận gốc."
 underworld_cantina_sign: "Biển Hiệu Quán Rượu Thế Giới Ngầm"
 underworld_cantina_sign_desc_short: "Một tấm biển hiệu kỹ thuật số vẫn còn hoạt động, được lấy từ một quán rượu bất hợp pháp nơi những kẻ buôn lậu thường lui tới cách đây khoảng hai triệu năm"
 underworld_cantina_sign_desc_details: "Được tìm thấy trên một tiểu hành tinh bị khoét rỗng, nơi này có thể là nơi ẩn náu thường xuyên của các tổ chức tội phạm phát triển mạnh trong thời kỳ cai trị của Liên Minh Đệ Nhất. Hình ảnh hiển thị ở đây có thể là một loại ám hiệu nào đó, ngầm báo đây là một bến đỗ an toàn cho những tội phạm đang bị truy nã, hoặc cũng có thể chỉ là biển quảng cáo cho một loại đồ uống nào đó."
 unfinished_manifesto: "Tuyên Ngôn Dang Dở Của [radical_cult.GetName]"
 unfinished_manifesto_desc_short: "Bản tuyên ngôn dang dở do thủ lĩnh của [radical_cult.GetName] tại [root.GetName] viết"
 unfinished_manifesto_desc_details: "Văn phong này gợi nhớ đến các văn bản tôn giáo cổ đại, sử dụng từ vựng và ngữ pháp cổ hủ, cố gắng để làm cho mình có vẻ uyên bác hơn. Một thông điệp cốt lõi được rao giảng trong đoạn kinh này là sự kiêu hãnh khi đối mặt với thất bại, khuyến khích các tín đồ tự sát khi sắp bị bắt giữ."
 uranium_glassware: "Đồ Thủy Tinh Uranium"
 uranium_glassware_desc_short: "Đồ trang trí được chạm khắc từ thạch anh uranium"
 uranium_glassware_desc_details: "Vẻ ngoài cuốn hút của món đồ trang trí này hoàn toàn trái ngược với sự nguy hiểm của uranium chưa qua tinh chế. Là một phần của bộ sưu tập phiên bản giới hạn, phần lớn đặc tính phóng xạ của nó đã bị trung hòa sau khi nghệ nhân hoàn thành tác phẩm này."
 vault_of_polaris: "Nơi Trú Ẩn Polaris"
 vault_of_polaris_desc_short: "Một bộ sưu tập đầy đủ các loài thực vật và vi khuẩn bản địa của Polaris"
 vault_of_polaris_desc_details: "Dòng chữ trên hộp chứa cho thấy, nơi trú ẩn này được tạo ra nhằm bảo vệ những loài có nguy cơ không thể sống sót qua quá trình nóng lên toàn cầu sau khi lớp băng vĩnh cửu tan chảy. Hành tinh này từng được bao phủ bởi những lớp tuyết dày đặc và khí hậu lạnh lẽo, nhưng giờ đây chỉ còn lại một núi băng trơ trọi. Tầm nhìn xa trông rộng của người đã tạo ra nó giúp chúng ta ngày nay có thể trưng bày những nỗ lực của họ cho mọi người cùng chiêm ngưỡng và học hỏi."
 veil_of_selene: "Bức Màn Của Selene"
 veil_of_selene_desc_short: "Một món đồ trang sức che mặt mang lại cảm giác hưng phấn và say đắm"
 veil_of_selene_desc_details: "Lớp màn che mặt này thoạt nhìn không có gì đặc biệt, nhưng lại ẩn chứa những đặc tính kích thích giác quan độc đáo, giúp nó có khả năng nhẹ nhàng lấn át các cơ quan thụ cảm thị giác, khứu giác và thính giác của sinh vật. Người ta tin rằng, việc đeo món đồ trang sức này có thể làm đối phương mất đi sự tỉnh táo, khiến họ dễ dàng bị thao túng tâm lý. Có tin đồn cho rằng chủ nhân ban đầu của nó sở hữu một khả năng tâm linh nhất định."
 verdingo_tendril_hook: "Móc Xúc Tu Verdingo"
 verdingo_tendril_hook_desc_short: "Chiếc móc tay giả của Thuyền trưởng hải tặc Haispoli Valerian, người Verdingo"
 verdingo_tendril_hook_desc_details: "Người Verdingo là một giống loài thực vật nửa thương nhân nửa hải tặc, họ sẵn sàng đòi nợ thuê cũng như đi cướp bóc các tàu chở hàng. Thuyền trưởng Haispoli đã mất đi cái xúc tu thuận của mình khi được thuê để chỉ huy một cuộc tấn công quân sự trên mặt đất. Sau khi giành chiến thắng, vị thuyền trưởng này đã tự tay rèn nên chiếc móc này bằng chính những tấm huân chương chiến công của mình."
 vibrating_crystal: "Tinh Thể Rung Động"
 vibrating_crystal_desc_short: "Một loại khoáng vật thạch anh độc đáo có thể tìm thấy ở khắp nơi trên bề mặt của [from.GetName]"
 vibrating_crystal_desc_details: "Nó cộng hưởng tiềm tàng với hành tinh mẹ, tạo ra một trường năng lượng có khả năng xoa dịu tâm trí của các sinh vật hữu cơ, thậm chí còn có sức hút đối với cả các sinh vật tổng hợp. Sự cộng hưởng này được sinh ra từ các cụm vi khuẩn có tính phóng xạ nhẹ, và các tinh thể được hình thành xung quanh những cụm vi khuẩn này. Những vi sinh vật có từ tính này tạo ra một dòng điện bên trong, khiến cho tinh thể rung động với tần số cao và đồng nhất."
 voidworm_amniotics: "Nước Ối Sâu Hư Không"
 voidworm_amniotics_desc_short: "Một chất dạng keo được tìm thấy ở trung tâm của Sâu Ba Đầu (Troika) Hư Không"
 voidworm_amniotics_desc_details: "Chất lỏng đặc sệt này tạo thành một hàng rào bảo vệ giữa ba cá thể, cho phép các tế bào trao đổi với nhau để tiến hành quá trình sinh sản và giao tiếp. Các hormone sinh ra từ việc oanh tạc hành tinh được dự trữ tại đây, giúp sinh vật lưỡng tính này có thể giải phóng giao tử một cách an toàn và sinh ra thế hệ sau."
 voidworm_heart: "Trái Tim Sâu Hư Không"
 voidworm_heart_desc_short: "Trái tim của Sâu Hư Không được chia thành ba buồng chính"
 voidworm_heart_desc_details: "Mỗi buồng tim sẽ lần lượt gia tăng áp suất của hệ tuần hoàn, duy trì chất lỏng ở trạng thái dưới điểm sôi nhằm đảm bảo sự sống sót trong môi trường chân không. Hầu hết lớp da của Sâu Hư Không đều kín khí, nhưng theo thời gian, các lỗ tiêu hóa và sinh dục khác nhau sẽ làm rò rỉ một phần áp suất quý giá này."
 vultaum_religious_pamphlet: "Cẩm Nang Truyền Giáo Vultaum"
 vultaum_religious_pamphlet_desc_short: "Một cuốn cẩm nang nhỏ được phân phát bởi các nhà truyền giáo Vultaum, nỗ lực vạch trần thiết bị thực tế ảo là tội ác lớn nhất"
 vultaum_religious_pamphlet_desc_details: "Nó coi \"Sự Dối Trá Vĩ Đại\" là một khái niệm then chốt, tuyên bố rằng mọi hình thức trốn tránh hiện thực nhập vai đều tương đương với việc hủy hoại ý chí đối với thực tại của chính mình."
 vultaum_vr_video_game: "Trò Chơi Thực Tế Ảo Vultaum"
 vultaum_vr_video_game_desc_short: "Giao diện kỹ thuật số từng được sử dụng trong một trò chơi điện tử thực tế ảo nhiều người chơi, từng được hàng tỷ người Vultaum chơi vào những thời đại xa xưa"
 vultaum_vr_video_game_desc_details: "Những bộ điều khiển này được nghiên cứu và phát triển chuyên biệt dựa trên các đặc điểm sinh học của họ, chúng chứa hàng nghìn thụ thể rung động, có khả năng phát hiện những chuyển động cực kỳ vi tế."
 warning_monolith: "Bia Đá Cảnh Báo"
 warning_monolith_desc_short: "Một phiến cự thạch được chạm khắc bởi thành viên cuối cùng của một giống loài đã tuyệt chủng, dùng để truyền tải thông điệp."
 warning_monolith_desc_details: "Nó cố gắng thuyết phục bất kỳ ai tìm thấy di tích trên hành tinh này đừng đi tìm kiếm loại vũ khí tối thượng đã dẫn đến sự diệt vong của chủng tộc họ. Giọng điệu khá là cường điệu, nhưng xét đến hoàn cảnh lúc bấy giờ, điều đó cũng dễ hiểu thôi."
 wormhole_anchor: "Mỏ Neo Lỗ Sâu [FROM.GetName]"
 wormhole_anchor_desc_short: "Điểm neo của một thiết bị lỗ sâu một chiều, được dùng để thu thập vật chất tối từ hố đen"
 wormhole_anchor_desc_details: "Nói một cách nhẹ nhàng thì nó chỉ là một mớ hỗn độn được chắp vá, hoàn toàn được chế tạo từ phế liệu và tàn tích của nhiều nền văn minh khác nhau. Nền tảng khoa học đằng sau thiết bị này vượt xa trình độ kỹ thuật chế tạo ra nó, ứng dụng một công nghệ tinh vi để thao túng khối lượng âm."
 wormhole_fur: "Lông Lỗ Sâu"
 wormhole_fur_desc_short: "Một mẫu vật sinh học được thu thập từ một loài cáo ở phía bên kia của Vết Nứt Không Gian"
 wormhole_fur_desc_details: "Loài động vật có vú này sở hữu một đột biến gen, cho phép chúng tùy ý tạo ra lỗ sâu. Người ta phỏng đoán rằng, khả năng này được tiến hóa sau vô số chuyến du hành xuyên qua các chiều không gian khác nhau."
 ytterite_preserved_corpse: "Thi Hài Người Yter Được Bảo Quản"
 ytterite_preserved_corpse_desc_short: "Mẫu vật duy nhất còn sống sót của giống loài Yter thuộc nền văn minh cận quang tốc, sau khi hành tinh mẹ của họ bị một vũ khí diệt tinh rơi vào tay kẻ xấu hủy diệt."
 ytterite_preserved_corpse_desc_details: "Hệ tiêu hóa của chúng biến đổi các khoáng chất nạp vào thành photon, các cơ quan nội tạng tương tự như một cụm tinh thể khúc xạ phức tạp xếp xung quanh một lõi nóng chảy. Trên một chi dưới của sinh vật này có khắc một số hình thù, được coi như một dạng biến đổi cơ thể mang ý nghĩa văn hóa nào đó."
 ytterite_kaleidoscopic_fascinator: "Kính Vạn Hoa Yter"
 ytterite_kaleidoscopic_fascinator_desc_short: "Những món đồ trang trí do người Yter chế tác, dùng để kích thích thị giác"
 ytterite_kaleidoscopic_fascinator_desc_details: "Những đồ trang trí này sẽ được trưng bày ở những nơi tràn ngập ánh nắng mặt trời, có thể chứa đựng hàng trăm, thậm chí hàng ngàn hoa văn độc đáo. Chúng được chế tác từ nhiều lớp tinh thể chạm khắc mỏng tang, một nghệ nhân lành nghề có thể phải tốn nhiều tháng trời mới hoàn thành được một món đồ trang trí phức tạp như vậy. Tại những điểm nối quan trọng của đồ trang trí, các nghệ nhân sẽ gắn một mảnh vỏ bị bong tróc của chính mình đã được điêu khắc để làm \"chữ ký\"."
 ytterite_royal_scepter: "Vương Trượng Hoàng Gia Yter"
 ytterite_royal_scepter_desc_short: "Vương trượng này từng được sử dụng bởi vị tể tướng hoàng gia của Gnais Damur, một bức tượng khổng lồ được chạm khắc trên sườn núi, người Yter tin rằng đó là một vị thần đang say ngủ, và cũng là đấng tối cao duy nhất của họ."
 ytterite_royal_scepter_desc_details: "Họ đã tổ chức một cuộc bầu cử để chọn ra một nhà lãnh đạo tạm quyền, trong thời gian chờ đợi bức tượng thức tỉnh."
 yuht_audio_console: "Bảng Điều Khiển Âm Thanh Yuht"
 yuht_audio_console_desc_short: "Một mô-đun từng điều khiển mạng lưới giám sát âm thanh khổng lồ do người Yuht thiết kế"
 yuht_audio_console_desc_details: "Công nghệ này được phát triển nhằm hỗ trợ người Yuht trong quá trình tìm kiếm sự sống ngoài hành tinh, với hy vọng có thể thu nhận được các tín hiệu từ bên ngoài truyền đến từ những hệ sao xa xôi."
 yuht_cryo_pod: "Khoang Ngủ Đông Yuht"
 yuht_cryo_pod_desc_short: "Khoang ngủ đông cổ đại dài 96 mét này lưu giữ hài cốt của một cá thể thuộc giống loài Yuht khổng lồ"
 yuht_cryo_pod_desc_details: "Người Yuht sở hữu tuổi thọ cực kỳ dài, và thông qua việc ngủ đông đông lạnh, họ có thể kéo dài tuổi thọ lên gấp nhiều lần. Các nghiên cứu chỉ ra rằng, loài động vật chân đốt này rất có khả năng là động vật lưỡng tính, có thể điều chỉnh hệ thống sinh sản để đáp ứng các nhu cầu nhất thời của quần thể."
 yuht_crystal_skull: "Hộp Sọ Pha Lê Yuht"
 yuht_crystal_skull_desc_short: "Người Yuht cổ đại đã có một thời gian tin rằng hộp sọ pha lê này là một di vật ngoài hành tinh chính hiệu"
 yuht_crystal_skull_desc_details: "Mặc dù nguồn gốc của món đồ giả mạo này cuối cùng đã bị lật tẩy, nhưng trước đó nó đã nổi danh lẫy lừng nhờ các phương tiện truyền thông Yuht rầm rộ đưa tin và thổi phồng danh tiếng của nó. Rất nhiều người từng \"phát hiện\" ra loại di vật giả mạo này đã trở thành những người nổi tiếng với chút danh tiếng, trở thành những nhân vật truyền thông, thôi thúc những người khác tiếp tục chạy theo xu hướng này."
 zombie_probe: "Tàu Thăm Dò Thây Ma"
 zombie_probe_desc_short: "Một nền văn minh ngoài hành tinh vô danh đã thu thập và tân trang lại tàn tích của một con tàu thăm dò, mang lại cho nó một ý thức"
 zombie_probe_desc_details: "Nó đã tấn công chính những người tạo ra nó trong trạng thái ý thức còn non nớt, và hiển nhiên là đã bị tiêu diệt một cách hợp tình hợp lý. Liệu nó có từng trải qua cảm giác đau đớn hay hiểu được khái niệm về cái chết hay không, vẫn còn là một câu hỏi chưa có lời đáp."
 zone_a_sedative: "Thuốc An Thần Khu A"
 zone_a_sedative_desc_short: "Một xẻng đất được lấy từ khu vực được dán nhãn \"Khu A\" trên [from.GetName]"
 zone_a_sedative_desc_details: "Khu vực rộng 169 km vuông này lưu giữ những thiết bị và công nghệ bị bỏ lại của những vị khách ngoài hành tinh không rõ danh tính. Một số thiết bị trong số này cực kỳ nguy hiểm, nhưng bản thân loại đất này lại chứa hóa chất an thần, giúp các nhà nghiên cứu có thể tiếp cận chúng mà hầu như không gặp phải bất kỳ áp lực nào. Dù cho bất kỳ hoạt động nào từng diễn ra ở đó, đều đã bị vùi lấp vào quá khứ từ rất lâu rồi."
 zroni_war_banners: "Cờ Chiến Zroni"
 zroni_war_banners_desc_short: "Bản phục dựng cờ của hai phe phái tham gia vào cuộc nội chiến Zroni"
 zroni_war_banners_desc_details: "Lá cờ màu tím tượng trưng cho phái Thăng Thiên: một nhóm nhỏ những kẻ sẵn sàng đẩy cả thiên hà vào vòng nguy hiểm để theo đuổi sức mạnh toàn năng. Lá cờ màu xanh tượng trưng cho Phúc Âm giáo: một phe phái kịch liệt phản đối việc rút cạn năng lượng của vũ trụ để thỏa mãn những dục vọng ích kỷ của bọn chúng. Ranh giới giữa hai phe phái ban đầu chỉ được vạch ra trong các cuộc tranh luận triết học, nhưng chẳng bao lâu sau, cuộc tranh chấp này đã châm ngòi cho một cuộc xung đột hủy diệt."
 zulcor_wings: "Cánh Zulcor"
 zulcor_wings_desc_short: "Đôi cánh kitin của Zulcor, một loài ăn đá đến từ [fromfrom.GetName]"
 zulcor_wings_desc_details: "Những sinh vật giống côn trùng này lấy khoáng chất làm nguồn thức ăn chính và có sức ăn đáng kinh ngạc; một bầy đàn có thể cắn nuốt cả một ngọn núi chỉ trong vài tuần. Sau khi được tiêu hóa, các khoáng chất sẽ làm cứng bộ xương ngoài của Zulcor. Do đó, trong chất thải của chúng thường chứa những tinh thể thạch anh và một lượng nhỏ các kim loại quý hiếm."
