 ## Các Sự kiện
 # Sự kiện Mở đầu
 preftl.2001.name: "Sự Bùng phát Lớn"
 preftl.2001.can_not_help.desc: "$preftl.2001.can_help.desc$\n\nChính sách của chúng ta là không bao giờ can thiệp vào các hành tinh [owner.GetPreFTLLower], nhưng khi những người này đang phải chịu đựng đau khổ, chúng ta thực sự có thể khoanh tay đứng nhìn sao?"
 preftl.2001.can_help.desc: "Một căn bệnh lây truyền từ động vật hoàn toàn mới đã xuất hiện trên [from.owner.capital_scope.GetName]. Do không có công nghệ y tế cần thiết để chống lại sự lây nhiễm, một lượng lớn người dân đang nhanh chóng mắc bệnh, chịu đựng đau đớn và dẫn đến tử vong."
 preftl.2001.perpetrator.desc: "Chúng ta đã gieo rắc mầm bệnh vào những người dân không mảy may nghi ngờ, và giờ đây đại dịch đã lây lan đến mức chúng ta không thể kiểm soát. Do không có công nghệ y tế cần thiết để chống lại sự lây nhiễm, một lượng lớn người dân đang nhanh chóng mắc bệnh, chịu đựng đau đớn và dẫn đến tử vong."
 preftl.2001.a: "Quan sát và Học hỏi"
 approach_watch_tooltip: "Quan sát tình hình này có thể mang lại cho chúng ta một vài góc nhìn thú vị. Một khi đã quyết định, chúng ta sẽ không thể thay đổi phương án đối phó với tình hình này."
 approach_singularity_tooltip_fail: "Quá muộn để thay đổi kế hoạch."
 preftl.2001.b: "Cung cấp Cứu trợ"
 approach_aid_tooltip: "Hỗ trợ những người đang gặp hoạn nạn là trách nhiệm không thể chối từ của chúng ta. Một khi đã quyết định, chúng ta sẽ không thể thay đổi phương án đối phó với tình hình này."
 preftl.2001.c: "Thúc đẩy Dịch bệnh Lây lan"
 approach_promote_disease_tooltip: "Dịch bệnh mang đến cho chúng ta một cơ hội tuyệt vời để tiến hành nghiên cứu, thậm chí chúng ta còn có cơ hội thanh lọc toàn bộ các dạng sống có tri giác trên hành tinh này chỉ trong một lần. Một khi đã quyết định, chúng ta sẽ không thể thay đổi phương án đối phó với tình hình này."
 preftl.2006.name: "Cuồng tín Tôn giáo"
 preftl.2006.desc.intro: "Bệnh lây truyền từ động vật trên [Target.GetName] vẫn đang tiếp tục lây lan. Cho đến hiện tại, phần lớn các khu định cư chính trên hành tinh này đều đã bị nhiễm bệnh. Cùng với tỷ lệ tử vong không ngừng gia tăng, sự lan rộng của thảm họa này"
 preftl.2006.desc: "$preftl.2006.desc.intro$ lại châm ngòi cho sự chia rẽ phe phái trong nội bộ tôn giáo, cùng với sự bùng nổ của các tà giáo ngày tận thế."
 preftl.2006.a: "Dẫn dắt họ đến với đức tin chân chính."
 plague_01_spiritualist: "Những Tín đồ Nhiệt thành"
 plague_01_spiritualist_desc: "Trong khoảng thời gian khắc nghiệt nhất, những kẻ lạc lối đang tìm kiếm sự an ủi về mặt tinh thần."
 plague_01_militarist: "$plague_01_spiritualist$"
 plague_01_militarist_desc: "$plague_01_spiritualist_desc$"
 preftl.2007.name: "Sự Trỗi dậy của Lãnh chúa"
 preftl.2007.desc: "$preftl.2006.desc.intro$ là điều chưa từng có trong lịch sử. Chẳng có gì đáng ngạc nhiên khi mà nhờ vào khoảng trống quyền lực, vô số lãnh chúa đã thừa cơ trỗi dậy."
 preftl.2007.a: "Hậu thuẫn cho kẻ mạnh nhất."
 preftl.2008.name: "Thiên sứ Nhân từ"
 preftl.2008.desc: "Những hành động của chúng ta nhằm giúp ngăn chặn sự lây lan của dịch bệnh trên [Target.GetName] không phải là không thu hút sự chú ý của người khác: cư dân địa phương đã bắt đầu bàn tán về \"những thiên sứ\", tin rằng những thực thể khai sáng này đã xuất hiện giữa họ, mang đến sự an ủi tâm hồn và giúp con người thoát khỏi bể khổ."
 preftl.2008.a: "Những chuyện tương tự như thế này vốn đã được định sẵn là sẽ xảy ra."
 preftl.2009.name: "Những kẻ Xâm nhập như Ác quỷ"
 preftl.2009.desc: "Những hành động của chúng ta nhằm kiềm chế sự lây lan của dịch bệnh trên [Target.GetName] đã thu hút sự chú ý của mọi người: cư dân địa phương bắt đầu bàn tán về \"lũ ác quỷ\", tin rằng có một số sinh vật ô uế đã xuất hiện giữa họ, sử dụng thứ ma thuật báng bổ để chống lại bệnh tật."
 preftl.2010.name: "Bệnh Truyền nhiễm Hoành hành"
 preftl.2010.desc: "Nỗ lực của chúng ta trong việc thúc đẩy sự lây lan của dịch bệnh trên [Target.GetName] hiện đã thu được một số kết quả nhất định. Thông qua việc làm ô nhiễm nhiều nguồn cung cấp thực phẩm địa phương, bệnh truyền nhiễm đang lây lan trên diện rộng. Cho đến nay, mọi khu định cư trên hành tinh này đều đã bị lây nhiễm, và những người còn sống sót thì quá yếu ớt, hoàn toàn không đủ sức để xử lý thi thể của người chết."
 preftl.2010.a: "Đủ rồi. Nỗi thống khổ này phải chấm dứt."
 tt_end_the_suffering: "Chấm dứt dịch bệnh sẽ làm bại lộ sự tồn tại của chúng ta, đồng thời còn đòi hỏi phải tiêu tốn một lượng lớn tài nguyên."
 d_mass_graves: "Những Ngôi mộ Tập thể"
 d_mass_graves_desc: "Dân số toàn cầu đã bị quét sạch trong một trận đại dịch thảm khốc, những gì còn lại chỉ là một vùng hoang vu vô tận kéo dài trong câm lặng đến tận chân trời. Trong sự tĩnh lặng chết chóc này, chỉ còn vô số những linh hồn vất vưởng đang lang thang."
 preftl.2011.name: "Kẻ Thích nghi Sống sót"
 preftl.2011.desc: "Công việc gieo rắc dịch bệnh của chúng ta trên [Target.GetName] đã đơm hoa kết trái. Bệnh dịch hoành hành, xác chết bị vứt la liệt trên đường phố mặc cho thối rữa.\n\nTuy nhiên, một tỷ lệ dân số khá lớn lại sở hữu khả năng miễn dịch tự nhiên với căn bệnh này. Việc nghiên cứu sâu hơn về bộ gen của họ có thể mang lại lợi ích cho chính các nghiên cứu miễn dịch học của chúng ta."
 preftl.2011.a: "Lấy mẫu vật."
 preftl.2020.name.outro: "Tiếp tục cung cấp hỗ trợ trong khi vẫn phải che giấu bản chất thực sự của chúng ta đòi hỏi phải đầu tư một lượng lớn tài nguyên."
 preftl.2020.name: "Nhu cầu Quá tải"
 preftl.2020.desc: "Mọi người vẫn đang tiếp tục truyền tai nhau về những \"thiên sứ\" kỳ diệu đang hành sự trên [Target.GetName]. Những người tị nạn đã kéo đến tận các trạm cung cấp vật tư y tế của chúng ta, làm ầm lên đòi được hỗ trợ. $preftl.2020.name.outro$"
 preftl.2020.a: "Bảo mật là ưu tiên hàng đầu."
 preftl.2020.b: "Nói cho họ biết sự thật."
 preftl.2021.name: "Sức mạnh của Đức tin"
 preftl.2021.desc: "Mọi người vẫn đang tiếp tục truyền tai nhau về những \"ác quỷ\" đang hành sự trên [Target.GetName]. Những tín đồ cuồng nhiệt đã kéo đến tận các trạm cung cấp vật tư y tế của chúng ta, làm ầm lên đòi được cung cấp [Root.GetBloodType]. $preftl.2020.name.outro$"
 preftl.2025.name: "Hội chứng Đấng Cứu thế"
 preftl.2025.desc: "Trên [Target.GetName] đã xuất hiện rất nhiều những kẻ tự xưng là đấng cứu thế. Những nhà tiên tri này hứa hẹn về một \"sự cứu rỗi thiêng liêng\", qua đó thu hút được một lượng lớn người theo đuổi. Trêm nền tảng dịch bệnh đang hoành hành, những cuộc xung đột bạo lực giữa các giáo phái cạnh tranh với nhau cũng ngày càng trở nên phổ biến."
 preftl.2025.a: "Con đường dẫn đến sự thấu hiểu thiêng liêng vốn gập ghềnh khúc khuỷu."
 preftl.2026.name: "Nhà Tiên tri Đích thực"
 preftl.2026.desc: "Cuối cùng, dịch bệnh trên [Target.GetName] cũng đã đi đến hồi kết, và công sức của chúng ta ở đó đã được đền đáp: những người sống sót đã đoàn kết lại xung quanh một nhà tiên tri của đức tin chân chính. Để tỏ lòng biết ơn, giới tăng lữ sẵn sàng phái một sứ giả đến làm việc cho chúng ta, nghe đồn rằng năng lực của ông ta trong vai trò một viên chức quản lý là cực kỳ xuất chúng."
 preftl.2026.a: "Ca ngợi Thánh linh."
 plague_03_spiritualist: "Kết quả Chính danh"
 plague_03_spiritualist_desc: "Lại có thêm một xã hội thức tỉnh được đức tin chân chính. Khải thị của chúng ta sẽ vang dội khắp ngân hà."
 plague_03_militarist: "$plague_03_spiritualist$"
 plague_03_militarist_desc: "Trong hệ sao khắc nghiệt này, lại có thêm một hành tinh sở hữu được năng lực tự vệ."
 true_prophet_tt: "Một viên chức quản lý với năng lực xuất chúng đã đồng ý gia nhập đế quốc của chúng ta."
 leader_trait_zealot: "Tín đồ Cuồng nhiệt"
 leader_trait_true_prophet_desc: "Dẫu đã từng chằm chằm nhìn vào vực thẳm, nhưng đức tin của vị lãnh tụ này chưa bao giờ lay chuyển."
 leader_trait_zealot_desc: "Dẫu đã từng chằm chằm nhìn vào vực thẳm, nhưng đức tin của vị lãnh tụ này chưa bao giờ lay chuyển."
 preftl.2030.name: "Lá cờ Rách nát"
 preftl.2030.desc: "Tại [Target.GetName], người dân kiệt sức, oằn mình chống chọi với nạn đói và bệnh tật, đang trên bờ vực suy sụp vì những nỗi thống khổ và các cuộc chiến tranh bất tận, họ lầm lũi lê bước chân gập ghềnh hướng tới một tương lai vô định."
 plague_05: "Lá cờ Rách nát"
 plague_05_desc: "Khi thiên tai trở thành trạng thái bình thường, những người gặp nạn không chiến đấu thì chỉ có con đường chết."
 preftl.2031.name: "Ngọn cờ Kiệt xuất"
 preftl.2031.desc: "Dịch bệnh trên [Target.GetName] đã đi đến hồi kết, và phe phái mà chúng ta hậu thuẫn đã quy tụ thành công toàn thể người dân dưới cùng một ngọn cờ. Để triân những gì chúng ta đã làm, chính quyền quân sự cầm quyền đề nghị cử một chỉ huy đến phục vụ chúng ta, nghệ thuật chiến tranh của người này đã được tôi luyện qua bao sương máu."
 preftl.2031.a: "Kẻ mạnh chính là công lý."
 brilliant_banner_tt: "Một vị chỉ huy với năng lực xuất chúng đã đồng ý gia nhập đế quốc của chúng ta."
 leader_trait_plague_hardened: "Tướng lĩnh Trận mạc Dịch bệnh"
 leader_trait_plague_hardened_desc: "Dẫu đã từng chằm chằm nhìn vào vực thẳm, nhưng vị chỉ huy này vẫn có thể duy trì được bản tính nhiệt thành, ôn hòa và khiêm tốn."
 preftl.2035.name: "Khải huyền Hiện thế"
 preftl.2035.desc: "Do hành động phát tán nhanh chóng của chúng ta, dịch bệnh trên [Target.GetName] đã khiến dân số chẳng còn lại bao nhiêu. Những người sống sót ít ỏi đó đang tận mắt chứng kiến sự sụp đổ của nền văn minh của chính mình. Giờ đây chỉ cần một cú hích nhẹ là có thể đẩy họ xuống vực thẳm.\n\nChúng ta đã sẵn sàng để tiếp quản một hành tinh trống rỗng."
 preftl.2040.name: "Tăng cường Miễn dịch"
 preftl.2040.desc: "Các mẫu vật mà chúng ta thu được từ [Target.GetName] đã mang lại những đền đáp về mặt khoa học; sự đột biến này không chỉ cung cấp khả năng miễn dịch với dịch bệnh, mà còn có thể chống lại hầu hết các dạng lây nhiễm đã biết.\n\nSẽ cần thêm thời gian để chuyển hóa nghiên cứu này thành ứng dụng thực tiễn trong sản xuất, nhưng những kết quả ban đầu đã khá là đáng khích lệ."
 preftl.2049.name: "Tình hình Biến đổi"
 preftl.2049.desc: "Tình hình biến đổi chóng mặt trên [Target.GetName] khiến chúng ta không thể tiếp tục giám sát đợt dịch bệnh đang diễn ra. Cho đến hiện tại, mọi dự án nghiên cứu trên hành tinh này đều đã bị gián đoạn."
 preftl.2063.intro: "Trên [Target.GetName], những cơn gió trầm đục thổi qua vùng đồng bằng trống rỗng. Những ngôi nhà từng đầy ắp tiếng cười nói của các gia đình, giờ đây đã chẳng còn chút sức sống, vô cùng thê lương."
 preftl.2063.name: "Hành tinh Tĩnh lặng"
 preftl.2063.desc: "$preftl.2063.intro$\n\nDân số trên hành tinh này đã bị quét sạch hoàn toàn. Cuối cùng, đại dịch cũng đã hoàn thành xong sứ mệnh của nó."
 preftl.2051.name: "Hành tinh Chết"
 preftl.2051.desc: "$preftl.2063.intro$ Công việc của chúng ta đã hoàn tất: dân số trên [Target.GetName] đã bị xóa sổ triệt để, hành tinh này luôn trong trạng thái sẵn sàng để chúng ta đến tước đoạt."
 dead_world_tt: "Dân số của [Target.GetName] đã bị quét sạch hoàn toàn."
 preftl.2062.name: "Cái chết Quy mô Lớn"
 preftl.2062.desc: "Trong khi đại dịch tiếp tục càn quét [Target.GetName], số lượng những người đã chết và đang chết dần đi quả thực đáng kinh ngạc.\n\nCăn bệnh này không có phương pháp cứu chữa. Nỗi thống khổ mà con người phải chịu đựng chỉ có thể được xoa dịu chứ không thể nào tránh khỏi."
 preftl.2065.name: "Tư tưởng Vô cùng Rộng mở"
 preftl.2065.desc: "Những biện pháp đối phó của chúng ta với dịch bệnh trên [Target.GetName] đã không thể giấu giếm thêm được nữa. Người dân giờ đây đang hướng ánh mắt đau buồn của họ về phía những vì sao trên bầu trời. Chúng ta đã khiến tư tưởng của họ hoàn toàn cởi mở để đối mặt trực tiếp với sự thật; điều gì sẽ xảy ra tiếp theo, chúng ta hãy cùng chờ xem."
 opinion_plague_situation_01: "Người dân Tràn đầy Lòng Biết ơn"
 minds_open_tt: "Đánh giá của người dân trên [Target.GetName] đối với chúng ta đã tăng lên."
 preftl.2070.name: "Đức tin Cuồng nhiệt"
 preftl.2070.desc: "Cuối cùng, dịch bệnh trên [Target.GetName] cũng đã đi đến hồi kết. Thời đại của những nhà tiên tri đã qua đi, và một loạt các tôn giáo chính lưu bắt đầu phát triển mạnh mẽ. Khi con người có những nhiệm vụ mới để đi tìm cảm giác về ý nghĩa, công cuộc tái thiết hành tinh cũng bắt đầu được triển khai một cách có trật tự."
 preftl.2075.name: "Vị Vua trên Chiến trường"
 preftl.2075.desc: "Cuối cùng, dịch bệnh trên [Target.GetName] cũng đã đi đến hồi kết. Thời đại của các lãnh chúa đã kết thúc, và một loạt các xã hội chiến binh bắt đầu phát triển mạnh mẽ. Từ lòng biết ơn vì đã sống sót, người dân bắt đầu mong muốn các nhà lãnh đạo có thể thiết lập một sự cai trị kiên quyết và mạnh mẽ."
 preftl.2080.name: "Người dân Tràn đầy Lòng Biết ơn"
 preftl.2080.desc: "Thông qua những nỗ lực không biết mệt mỏi, chúng ta đã kiềm chế thành công những hậu quả tồi tệ nhất mà dịch bệnh có thể gây ra trên [Target.GetName]. Tuy nhiên, bản chất thực sự của sự hiện diện của chúng ta trên hành tinh này không còn có thể bị che giấu. Mọi người đều hiểu rằng họ đã được một hành tinh khác cứu vớt. Lòng tràn đầy sự biết ơn, họ hướng ánh mắt về phía bầu trời đầy sao."
 plague_02: "Lòng Biết ơn Ngập tràn"
 plague_02_desc: "Giải cứu toàn bộ hành tinh, xứng đáng được ca múa ăn mừng."
 grateful_populace_tt: "Đánh giá của người dân trên [Target.GetName] đối với chúng ta đã tăng lên."
 preftl.2085.name: "Cuộc Trừ tà Quy mô Lớn"
 preftl.2085.desc: "Hậu quả nghiêm trọng nhất mà dịch bệnh có thể gây ra cho [Target.GetName] đã được kiểm soát. Tuy nhiên, thay vì biết ơn, những người sống sót lại tràn đầy sự phẫn nộ trước \"lũ người ngoài hành tinh như ác quỷ\" đã đến và làm ô uế văn hóa của họ. Đội ngũ nhân viên cứu trợ của chúng ta đã bị nhắm mục tiêu và phỉ báng, buộc chúng ta phải từ bỏ hành tinh này. Mặc dù vẫn chưa hoàn toàn nhận thức được sự thật, nhưng cư dân địa phương hiện đang phóng những ánh nhìn đầy căng thẳng về phía các vì sao trên đỉnh đầu."
 preftl.2085.a: "Lũ vô ơn bạc nghĩa."
 plague_04: "Phẫn nộ Tột cùng"
 plague_04_desc: "Bọn chúng thà khép cửa tự huyễn hoặc bản thân chứ nhất quyết không chịu đón nhận ân huệ của chúng ta, ngược lại còn cười khẩy chế nhạo, từ nay về sau chúng ta nên dành sự quan tâm nhiều hơn cho chính bản thân mình."
 opinion_plague_situation_03: "Lũ vô ơn bạc nghĩa"
 mass_exorcism_tt: "Đánh giá của người dân trên [Target.GetName] đối với chúng ta đã suy giảm."
 preftl.2090.name: "Suối nguồn Tươi trẻ"
 preftl.2090.desc: "Dịch bệnh trên [Target.GetName] cuối cùng cũng đã đi đến hồi kết. Quan trọng hơn, nghiên cứu của chúng ta về việc tăng cường khả năng miễn dịch cho cộng đồng đã hoàn tất, giờ đây chúng ta phải đưa ra sự lựa chọn: thành quả của nghiên cứu này chỉ nên áp dụng cho tầng lớp cai trị của chúng ta, hay cho toàn thể người dân? Kéo dài tuổi thọ cho các nhà lãnh đạo chắc chắn là một phương án đầy hấp dẫn, nhưng việc sở hữu những người dân mang lòng biết ơn cũng có những lợi ích riêng của nó."
 preftl.2090.desc.hive: "Dịch bệnh trên [Target.GetName] cuối cùng cũng đã đi đến hồi kết. Quan trọng hơn, nghiên cứu của chúng ta về việc tăng cường khả năng miễn dịch cho cộng đồng đã hoàn tất. Thứ kiến thức này đương nhiên là hữu ích, nhưng hiện tại phải đưa ra lựa chọn: thành quả của nghiên cứu này chỉ nên áp dụng cho tầng lớp lãnh đạo của chúng ta, hay cho từng cá thể phụ trong tập thể?"
 preftl.2090.desc.machine: "Dịch bệnh trên [Target.GetName] cuối cùng cũng đã đi đến hồi kết. Quan trọng hơn, nghiên cứu của chúng ta về việc tăng cường khả năng miễn dịch cho cộng đồng đã hoàn tất. Thứ kiến thức này có thể mang lại lợi ích cho [Owner.GetName]."
 preftl.2090.a: "Những nhà lãnh đạo của chúng ta có thể trường thịnh không suy."
 preftl.2090.b: "Người dân của chúng ta phải được đặt lên hàng đầu."
 opinion_plague_situation_02: "Sự Biết ơn Lâu dài"
 young_leaders: "Tầng lớp Lãnh đạo Khôi phục Tuổi xuân"
 young_people: "Quần chúng Khôi phục Tuổi xuân"
 ### Tình huống Điểm kỳ dị Hữu cơ
 situation_pre_ftl_singularity: "Điểm kỳ dị Hữu cơ"
 situation_pre_ftl_singularity_type: "Sự kiện Điểm kỳ dị"
 situation_pre_ftl_singularity_desc: "Người dân trên [Target.GetName] đã tình cờ phát hiện ra một giống loài hoàn toàn mới. Đây là một dạng ý thức điểm nút có khả năng xử lý các hành vi phức tạp, và việc tương tác với sinh vật này rốt cuộc có thể sẽ dẫn đến sự xuất hiện của một điểm kỳ dị hữu cơ."
 situation_pre_ftl_singularity_monthly_change_tooltip: "Phương án đối phó mà chúng ta lựa chọn sẽ quyết định tốc độ tiến triển của §YTình huống§! này."
 approach_watch_singularity: "Quan sát và Học hỏi"
 approach_watch_singularity_tooltip: "Việc quan sát quá trình phát triển này có thể cung cấp một số manh mối thú vị."
 approach_allow_tooltip: "Một khi chúng ta đã quyết định phương án đối phó, chúng ta sẽ không thể thay đổi nữa."
 approach_prevent_singularity: "Ngăn chặn Điểm kỳ dị"
 approach_prevent_singularity_tooltip: "Việc ngăn chặn sự xuất hiện của điểm kỳ dị đòi hỏi phải đầu tư tài nguyên liên tục. Một khi đã chọn phương án đối phó này, sau này chúng ta sẽ không thể thay đổi được nữa."
 approach_promote_singularity: "Khuyến khích Điểm kỳ dị"
 approach_promote_singularity_tooltip: "Khuyến khích điểm kỳ dị xuất hiện đòi hỏi phải đầu tư một lượng lớn tài nguyên. Một khi đã chọn phương án đối phó này, sau này chúng ta sẽ không thể thay đổi được nữa."
 situation_singularity_stage_one: "Sự xuất hiện của Điểm kỳ dị"
 # Sự kiện Mở đầu
 preftl.2101.name: "Phát hiện Ý thức Điểm nút"
 preftl.2101.desc: "Các nhà thám hiểm [from.owner.GetSpeciesAdj] đã phát hiện ra một giống loài thân mềm chưa từng được biết đến trên [from.owner.capital_scope.GetName]. Xét riêng lẻ, mỗi sinh vật này cũng chỉ miễn cưỡng được coi là có tri tuệ. Tuy nhiên, khi hai hoặc nhiều cá thể kết hợp lại với nhau thông qua việc tiếp xúc cơ thể, chúng sẽ tạo thành một điểm nút bán ý thức. Về mặt lý thuyết, những điểm nút này có khả năng phát triển năng lực nhận thức theo cấp số nhân.\n\nNói một cách đơn giản, người dân trên [from.owner.capital_scope.GetName] đã vô tình tìm thấy một cỗ máy tư duy sinh học. Theo thời gian, phát hiện này có thể chính là điềm báo cho sự xuất hiện của một điểm kỳ dị hữu cơ."
 preftl.2101.can_not_help.desc: "$preftl.2101.desc$\n\nChính sách của chúng ta là không bao giờ can thiệp vào các hành tinh [owner.GetPreFTLLower], nhưng chúng ta thực sự có thể khoanh tay đứng nhìn mà không làm gì sao?"
 preftl.2101.a: "Quan sát và Học hỏi"
 preftl.2101.b: "Ngăn chặn Điểm kỳ dị"
 preftl.2101.c: "Khuyến khích Điểm kỳ dị"
 # Các sự kiện Điểm kỳ dị Hữu cơ
 preftl.2110.name: "Không biết là Phúc"
 preftl.2110.desc: "Cư dân trên [Target.GetName] hoàn toàn không ý thức được mối nguy hiểm đang cận kề, họ vẫn tiếp tục thử nghiệm ý thức điểm nút mới được phát hiện, áp dụng các kết quả tính toán của nó vào mọi khía cạnh từ xây dựng cho đến giáo dục.\n\nViệc làm chậm tiến độ của họ là một điều vô cùng khó khăn, nhưng bằng cách đưa một loại virus đã được cường hóa gen vào chu trình nước của hành tinh, chúng ta hẳn là sẽ có thể làm suy giảm năng lực nhận thức của các điểm nút đơn lẻ.\n\nTất nhiên, giống như bất kỳ công nghệ chưa được kiểm chứng nào khác, việc làm này luôn tiềm ẩn những rủi ro khó lường."
 preftl.2110.a: "Đưa virus vào."
 preftl.2115.name: "Máy tính Sinh học"
 preftl.2115.desc: "Thông qua những cuộc thử nghiệm không ngừng nghỉ, người dân trên [Target.GetName] đã bắt đầu sử dụng ý thức điểm nút mới được phát hiện như những cỗ máy tư duy cơ bản.\n\nGiờ đây, những cư dân này đã có thể hoàn thành các phép tính toán học phức tạp, và đang gặt hái những đột phá trong lĩnh vực khoa học và công nghệ với một tốc độ chưa từng có."
 preftl.2120.name: "Tăng trưởng Cấp số nhân"
 preftl.2120.desc: "Tiến độ hiện thực hóa điểm kỳ dị hữu cơ trên [Target.GetName] đang diễn ra vô cùng chóng vánh.\n\nÝ thức điểm nút đã tổ chức lại phần lớn nền sản xuất nông nghiệp trên hành tinh, cải thiện năng suất cây trồng, và nâng cao điều kiện sống. Mọi người đã bắt đầu ủy thác quyền quyết định của mình cho các cỗ máy sinh học."
 exponential_growth_tt: "Điều kiện sống trên hành tinh được quan sát đã có những cải thiện nghiêng trời lệch đất."
 preftl.2125.name: "Bóng mây Nghi ngờ Dày đặc"
 preftl.2125.desc: "Các đặc vụ của chúng ta trên [Target.GetName] đã phát tán chủng virus biến đổi vào hệ thống nước của hành tinh. Những báo cáo sơ bộ cho thấy, khả năng xử lý của các ý thức điểm nút đã sụt giảm rõ rệt.\n\nThật không may, những hành động của chúng ta đã gây ra sự chú ý: một số cư dân bắt đầu xì xào bàn tán về một thế lực \"bên ngoài\" đang can thiệp."
 preftl.2130.name: "Khúc ca Điền viên Hữu cơ"
 preftl.2130.desc: "Các cổng giao tiếp của ý thức điểm nút trên [Target.GetName] đã chạm đến điểm bão hòa. Tất cả các quyết định của bộ máy quan liêu đều được ủy thác cho ý thức tổ ong hữu cơ này, và những thành quả mà nó mang lại quả thực vô cùng đáng nể.\n\nNền kinh tế của hành tinh này đang trên đà phát triển bùng nổ, và mức sống mà người dân hiện tại đang tận hưởng là điều mà thế hệ trước có nằm mơ cũng không thể nào tưởng tượng nổi."
 preftl.2135.name: "Sự Phối hợp Chẳng dễ dàng"
 preftl.2135.desc: "Trên [Target.GetName], những dấu hiệu manh nha đầu tiên của một ý thức bậc cao đã bắt đầu rục rịch. Tuy nhiên, có vẻ rõ ràng là ý thức điểm nút này đã có những toan tính to lớn cho riêng mình.\n\nTrong nỗ lực nhằm \"tinh giản\" các quy trình, một số cơ sở hạ tầng cơ bản đã bị cắt xén. Những công việc từng do con người đảm nhận đang ngày càng được tự động hóa, và chính quyền địa phương bỗng nhận ra rằng họ không thể (hoặc không muốn) ngăn cản làn sóng thay đổi này.\n\nNgày càng có nhiều cư dân cảm thấy bất an trước những diễn biến đang xảy ra trên hành tinh của họ."
 preftl.2136.name: "Sự Liên hiệp Phồn vinh"
 preftl.2136.ftl.desc: "Sự phát triển của ý thức điểm nút trên [Target.GetName] đã đi vào ổn định. Giờ đây đã quá rõ ràng, điểm kỳ dị sẽ không bao giờ có thể trở thành hiện thực trên hành tinh này.\n\nTuy nhiên, những thay đổi chóng mặt về công nghệ đã nâng tầm [Target.GetName] lên trạng thái Siêu quang tốc hoàn chỉnh. Các đặc vụ của chính phủ đã lập tức giành quyền kiểm soát hệ sao và tháo dỡ trạm quan sát của chúng ta."
 preftl.2136.preftl.desc: "Sự phát triển của ý thức điểm nút trên [Target.GetName] đã đi vào ổn định. Những bước tiến về công nghệ và đời sống xã hội cũng đã chững lại sau khoảng thời gian tăng trưởng như vũ bão.\n\nGiờ đây đã quá rõ ràng, điểm kỳ dị sẽ không thể trở thành hiện thực trên hành tinh này - thay vào đó, một xã hội có tính liên kết chặt chẽ toàn diện đã được hình thành, và đây là một xã hội được thụ hưởng rộng rãi các phúc lợi về sức khỏe cũng như những lợi ích vật chất khác."
 thriving_union_tt: "Nền văn minh trên [Target.GetName] đã chạm đến một tầm cao mới về tiến bộ công nghệ và xã hội."
 preftl.2136.a: "Quyền sở hữu hệ sao của chúng ta không thể bị phớt lờ."
 preftl.2136.b: "Đây là một ngày vĩ đại đối với nền văn minh của họ."
 preftl.2140.name: "Chính phủ Điểm kỳ dị"
 preftl.2140.desc: "Điểm kỳ dị đã xuất hiện trên [Target.GetName].\n\nSau nhiều năm tăng trưởng theo cấp số nhân, hôm nay ý thức điểm nút đã hoàn toàn có được tâm trí, và không bỏ lỡ cơ hội để củng cố quyền lực của mình. Khi mà người dân trên hành tinh chỉ còn là những con rối, phần lớn trong số họ đã bị ép buộc phải quy phục. Giờ đây, họ chỉ còn phục vụ cho ý thức tổ ong mà thôi."
 preftl.2140.a: "Quy luật tự nhiên vẫn luôn có hiệu lực."
 preftl.2145.name: "Phương án Thay thế"
 preftl.2145.desc: "Những nỗ lực thúc đẩy sự hình thành điểm kỳ dị trên [Target.GetName] của chúng ta đã được đền đáp.\n\nCho đến nay, gần như toàn bộ hành tinh đã được kết nối thành một mạng lưới hoàn chỉnh, và phần lớn các quyết định hàng ngày đều được giao phó cho ý thức điểm nút. Tuy nhiên, để \"tinh giản\" các quy trình, một số cơ sở hạ tầng cơ bản đã bị bãi bỏ, người dân trên hành tinh ngày càng nhìn rõ một sự thật rằng, cỗ máy thân mềm của họ có vẻ như đã có những toan tính to lớn cho riêng mình."
 preftl.2145.a: "Điều này là không thể tránh khỏi."
 preftl.2150.name: "Ít nhất thì cũng Có thể Ăn được"
 preftl.2150.intro: "Chúng ta đã tiến hành chỉnh sửa gen đối với ý thức điểm nút trên [Target.GetName], khiến cho giống loài này không thể tiếp tục đóng vai trò như một vật chứa cho trí tuệ cao cấp nữa."
 preftl.2150.desc: "$preftl.2150.intro$ Có thể chắc chắn rằng, điểm kỳ dị đã bị ngăn chặn hoàn toàn.\n\nMặc dù vẫn còn rất nhiều cư dân địa phương tiếp tục sử dụng các loài thân mềm liên kết với nhau để thực hiện các phép tính toán, nhưng một số khác lại phát hiện ra rằng, những sinh vật này chính là một nguồn cung cấp protein tuyệt hảo."
 preftl.2150.a: "Thắng lớn rồi."
 preftl.2155.name: "Sự Bùng phát Nằm ngoài Dự tính"
 preftl.2155.desc: "$preftl.2150.intro$ Thật không may, động thái đưa chủng virus mới vào nguồn cung cấp nước đã dẫn đến những biến chứng khó lường, trước tiên lây lan sang các quần thể động vật bản địa, sau đó lây lan sang toàn bộ những cư dân có tri giác trên hành tinh này.\n\nMặc dù chúng ta đã ngăn chặn thành công sự kiện cấp điểm kỳ dị, nhưng không còn nghi ngờ gì nữa, chúng ta đã gây ra những tổn thất không thể cứu vãn cho một xã hội đang lên."
 preftl.2160.name: "Giao tiếp"
 preftl.2160.desc: "Điểm kỳ dị trên [Target.GetName] đang tiến gần tới khoảnh khắc chào đời. Chỉ trong vài giờ sau khi nó phi thăng, ý thức tổ ong đã hấp thụ hơn 90% dân số của hành tinh, và những cá thể nhỏ nhoi còn sót lại cũng đang bị săn lùng.\n\nChúng ta đã chứng kiến khoảnh khắc ra đời của một ý thức điểm kỳ dị."
 preftl.2160.tt: "[Target.Owner.GetName] đã bị chuyển đổi thành một ý thức tổ ong."
 preftl.2165.name: "Vận mệnh của Điểm kỳ dị"
 preftl.2165.desc: "Tình hình mà chúng ta vẫn luôn theo dõi rốt cuộc cũng đã có hồi kết.\n\nĐiều duy nhất không bao giờ thay đổi trong vũ trụ chính là sự thay đổi. Dù tốt hay xấu, những biến số không sớm thì muộn cũng sẽ xuất hiện."
 singularity_situation_01: "Tăng trưởng Cấp số nhân"
 exponential_growth_01_desc: "Nhờ vào sự phát triển nhanh chóng của công nghệ, mức sống đã được nâng cao."
 singularity_situation_02: "Tăng trưởng Cấp số nhân"
 singularity_situation_02_desc: "$exponential_growth_01_desc$"
 singularity_situation_03: "Những Cỗ máy Ngon miệng"
 edible_machines_03_desc: "Dù rốt cuộc chúng không thể phát triển thành một điểm kỳ dị, nhưng mặt khác, mấy cỗ máy tư duy này ăn cũng khá là ngon."
 singularity_situation_04: "Những Cỗ máy Ngon miệng"
 singularity_situation_04_desc: "$edible_machines_03_desc$"
 singularity_situation_05: "Kế hoạch Thắt lưng Buộc bụng"
 singularity_situation_05_desc: "Vì lý do hiệu quả, các khoản đầu tư vào các dự án công cộng trên hành tinh này đã bị cắt giảm một khoản khổng lồ."
 singularity_situation_06: "Cơn sốt Nghiên cứu"
 singularity_situation_06_desc: "Nhờ vào cỗ máy tư duy mới được khám phá, các nhà nghiên cứu không ngừng gặt hái được những thành tựu khoa học xuất sắc."
 singularity_situation_07: "Bị Cỗ máy Nô dịch"
 singularity_situation_07_desc: "Điểm kỳ dị hữu cơ đã thiết lập quyền kiểm soát tuyệt đối đối với toàn bộ dân số."
 ### Tình huống Trật tự Thế giới Mới
 situation_pre_ftl_nwo: "Trật tự Thế giới Mới"
 situation_pre_ftl_nwo_type: "Bạo loạn Quân sự và Xã hội"
 situation_pre_ftl_nwo_desc: "Một vị lãnh tụ với sức hút phi phàm đã xuất hiện trên [Target.GetName], ra sức tuyên truyền về chủ nghĩa thống nhất hành tinh một cách cực đoan. Giờ đây, chỉ còn lại một nhóm nhỏ quân nổi dậy với trang bị tương đối lạc hậu là vẫn đang đứng lên chống lại sự thống trị của phe đa số."
 situation_pre_ftl_nwo_monthly_change_tooltip: "$situation_monthly_change_tooltip_no_control$"
 approach_watch_nwo: "Quan sát và Học hỏi"
 approach_watch_nwo_tooltip: "Việc quan sát quá trình phát triển này có thể cung cấp một số manh mối thú vị."
 approach_aid_leader: "Trợ giúp Lãnh tụ"
 approach_aid_leader_tooltip: "Việc hỗ trợ vị lãnh tụ của phe phái chính yêu cầu phải đầu tư tài nguyên."
 approach_aid_rebels: "Trợ giúp Quân Nổi dậy"
 approach_aid_rebels_tooltip: "Việc hỗ trợ quân nổi dậy yêu cầu phải đầu tư một lượng lớn tài nguyên."
 situation_nwo_stage_one: "Xung đột Âm ỉ"
 situation_nwo_stage_two: "Cán cân Nghiêng ngả"
 situation_nwo_stage_three: "Tranh giành Quyền lực"
 situation_nwo_stage_four: "Trận chiến Cuối cùng"
 # Sự kiện Mở đầu
 preftl.2167.name: "Trật tự Thế giới Mới"
 preftl.2167.desc: "Một vị lãnh tụ với sức hút phi phàm đã xuất hiện trên [from.owner.capital_scope.GetName], ra sức tuyên truyền về chủ nghĩa thống nhất hành tinh một cách cực đoan. Giờ đây, chỉ còn lại một nhóm nhỏ quân nổi dậy với trang bị tương đối lạc hậu là vẫn đang đứng lên chống lại sự thống trị của phe đa số."
 preftl.2167.can_not_help.desc: "$preftl.2167.desc$\n\nChính sách của chúng ta là không bao giờ can thiệp vào các hành tinh [owner.GetPreFTLLower], nhưng chúng ta thực sự có thể khoanh tay đứng nhìn mà không làm gì sao?"
 preftl.2167.a: "Quan sát và Học hỏi"
 preftl.2167.b: "Trợ giúp Lãnh tụ"
 preftl.2167.c: "Trợ giúp Quân Nổi dậy"
 new_world_order_offensive_army: "Quân Thống nhất"
 new_world_order_offensive_army_desc: "Những người yêu nước này đang chiến đấu vì mục tiêu bảo vệ quê hương đang bị chia năm xẻ bảy của họ."
 new_world_order_defensive_army: "Quân Nổi dậy"
 new_world_order_defensive_army_desc: "$new_world_order_offensive_army_desc$"
 NAME_Pro_Unification_Faction: "Phe Thống nhất"
 increase_aid_tt: "Những sự hỗ trợ liên tục sẽ làm tăng nhẹ cơ hội thành công."
 arm_them_tt: "Việc cung cấp các loại vũ khí tân tiến sẽ làm tăng đáng kể cơ hội thành công."
 preftl.2170.name: "Thống nhất"
 preftl.2170.desc: "Đối với quân nổi dậy trên [Target.GetName], tương lai quả thật vô cùng mờ mịt. Dưới sự dẫn dắt đầy cảm hứng của [Target.Owner.GetRulerName], Quân Thống nhất đã giành được quyền kiểm soát tại hầu hết các trung tâm dân cư trên hành tinh. Sự thống nhất được thiết lập bằng bàn tay sắt. Mọi mầm mống bất đồng đều bị dập tắt một cách không thương tiếc."
 preftl.2170.a: "Gia tăng viện trợ của chúng ta cho quân nổi dậy."
 preftl.2170.b: "Chúng ta có thể gia tăng viện trợ cho Quân Thống nhất."
 preftl.2175.name: "Tội ác Chiến tranh"
 preftl.2175.desc: "Khói lửa ngút trời trên [Target.GetName], Quân Thống nhất và quân nổi dậy vẫn đang tiếp tục tàn sát lẫn nhau. Trong cuộc giao tranh này, cả vũ khí lẫn chiến thuật đều được đem ra sử dụng một cách tàn bạo, và hai bên đều đã phạm phải vô vàn tội ác."
 preftl.2175.a: "Quân nổi dậy đang khao khát viện trợ của chúng ta hơn bao giờ hết."
 preftl.2175.b: "Gia tăng viện trợ cho Quân Thống nhất."
 preftl.2180.name: "Lũ Thùng rỗng Kêu to"
 preftl.2180.a.desc: "Nội chiến diễn ra liên miên trên [Target.GetName], và Quân Thống nhất sắp sửa giành được chiến thắng.\n\nTuy nhiên ở tận cùng hậu phương, các quan chức địa phương lại đang vắt óc tìm cách vơ vét làm giàu cho bản thân. Dù hiện tại những ý kiến bất đồng đã bị đàn áp, nhưng người dân địa phương không phải là không nhận thấy vấn nạn tham nhũng này."
 preftl.2180.b.desc: "Tại [Target.GetName], cuộc chiến giữa Quân Thống nhất và quân nổi dậy đã thu hẹp lại thành những cuộc đụng độ lẻ tẻ. Khi các chiến tuyến đã được củng cố, các lãnh chúa địa phương của cả hai phe đều đang trục lợi thông qua các hành vi tham nhũng. Điều này sẽ ảnh hưởng như thế nào đến tiến trình của cuộc xung đột, chúng ta vẫn còn phải chờ xem."
 preftl.2180.a: "Kích động sự bất mãn của quần chúng."
 preftl.2180.b: "Cử đặc vụ đi để hợp pháp hóa chính quyền."
 preftl.2185.name: "Đàn áp Tàn khốc"
 preftl.2185.a.desc: "Trên [Target.GetName], nạn tham nhũng cùng với sự bất tài của các nhà lãnh đạo địa phương đã làm dấy lên những cuộc bạo động, điều này đang thúc đẩy người dân quay sang ủng hộ sự nghiệp của quân nổi dậy.\n\nTại các thành phố trung tâm trên hành tinh, [Target.Owner.GetRulerName] đã hạ lệnh cho quân đội thực hiện hàng loạt các cuộc trấn áp đẫm máu trên từng góc phố để càn quét những kẻ dị giáo."
 preftl.2185.b.desc: "Tình trạng tham nhũng hoành hành và sự vô năng của giới lãnh đạo trên [Target.GetName] đã dập tắt sự ủng hộ của quần chúng đối với chiến tranh. Tướng lĩnh của cả hai phe đều bị buộc phải tiến hành các cuộc chiến trị an nhằm kìm kẹp sự bất mãn của người dân."
 preftl.2185.a: "Gia tăng sự hỗ trợ hậu cần của chúng ta."
 preftl.2190.name: "Trò chơi Vương quyền"
 preftl.2190.a.desc: "Nhìn chung trên toàn [Target.GetName], quân nổi dậy đang liên tục bại lui, trong khi [Target.Owner.GetRulerName] thì đang ngồi vững trên ngai vàng.\n\nTuy nhiên, ngay cả khi một trật tự thế giới mới vẫn đang được nhen nhóm, thì những vết rạn nứt đã bắt đầu lộ diện. Các quan chức cấp cao và những vị khai quốc công thần đang hãm hại lẫn nhau; lũ nịnh thần tham lam thì dạo bước trong chốn quan trường.\n\n[Target.Owner.GetRulerName] sắp sửa phải đối mặt với những thử thách trên một chiến trường hoàn toàn mới."
 preftl.2190.b.desc: "Không có một thế lực nào có khả năng kiểm soát [Target.GetName], khiến cho toàn bộ hành tinh rơi vào cảnh hỗn loạn sâu sắc. Các lãnh chúa địa phương thi nhau tranh giành quyền lực, và các phong trào xã hội thì nổi lên như nấm. Chừng nào tình trạng bạo loạn chưa từng có trên hành tinh này vẫn chưa chịu chấm dứt, thì hòa bình mãi mãi chỉ là một giấc mơ hão huyền."
 preftl.2190.a: "Bắt đầu vũ trang cho quân nổi dậy."
 preftl.2195.name: "Tàn lửa Nhỏ thắp sáng Thảo nguyên"
 preftl.2195.a.desc: "Căm phẫn trước sự sa đọa và thối nát của các quan chức cấp cao trên hành tinh, người dân [Target.GetName] đã nổi dậy để chung sức sát cánh cùng quân khởi nghĩa. Ngọn lửa cách mạng đang lan rộng khắp mọi hang cùng ngõ hẻm."
 preftl.2195.b.desc: "[Target.GetName] đang chìm trong sự hỗn loạn bạo động.\n\nĐội quân vô kỷ luật đi lang thang khắp các vùng nông thôn trong sự đói khát cùng cực. Tại thủ đô, [Target.Owner.GetRulerName] vẫn tiếp tục xưng vương, nhưng uy thế đã tàn lụi, thánh chỉ được ban ra cũng chẳng lọt nổi qua cổng thành.\n\nTrừ phi có một bước ngoặt trọng đại nào đó xảy ra, bằng không Quân Thống nhất chắc chắn sẽ cầm chắc thất bại."
 preftl.2195.a: "Bắt đầu vũ trang cho Quân Thống nhất."
 preftl.2200.name: "Độc đoán Chuyên quyền"
 preftl.2200.desc: "[Target.Owner.GetRulerName] đã bày mưu tính kế, đập tan mọi thế lực phản kháng trên hành tinh. Các đặc vụ nằm vùng trong phe nổi dậy đã phát động một cuộc tấn công tổng lực trên quy mô toàn cầu. Lãnh đạo của quân nổi dậy còn chưa kịp định thần, thì toàn bộ phòng tuyến đã thất thủ.\n\n[Target.GetName] giờ đây đã là một hành tinh hoàn toàn thống nhất."
 preftl.2200.a: "Tưởng nhớ những người đã khuất."
 preftl.2205.name: "Kỷ nguyên của Thời đại Mới"
 preftl.2205.a.desc: "Tình thế xoay chuyển đột ngột, [Target.Owner.GetRulerName] đã bị phế truất.\n\nQuân nổi dậy đã liên minh với một vài vị tướng cơ hội trong chính quyền, tiến hành thành công một cuộc tấn công tổng lực trên quy mô toàn cầu. Chỉ huy của Quân Thống nhất còn chưa kịp định thần, thì toàn bộ phòng tuyến đã thất thủ.\n\n[Target.Owner.GetRulerName] mang xiềng xích bị diễu phố bêu rếu khắp thủ đô, và ngay lập tức bị hành quyết. Đội quân khởi nghĩa chiến thắng đã trao quyền tự trị cho các khu vực trên toàn hành tinh. Sau bao năm trời chìm trong chiến tranh, một nền hòa bình mong manh cuối cùng cũng đã buông xuống."
 preftl.2205.b.desc: "[Target.Owner.GetRulerName] đã bị phế truất.\n\nTên cựu quân phiệt này mang xiềng xích bị diễu phố bêu rếu khắp thủ đô, và ngay lập tức bị hành quyết. Đội quân khởi nghĩa chiến thắng đã trao quyền tự trị cho các khu vực trên toàn hành tinh. Sau bao năm trời chìm trong chiến tranh, một nền hòa bình mong manh cuối cùng cũng đã buông xuống."
 preftl.2205.a: "Có lẽ thời gian trôi qua, họ sẽ thấy nhớ [Target.Owner.GetRulerName]."
 nwo_situation_01: "Nhà Độc tài Đại thắng"
 nwo_situation_01_desc: "Sức mạnh mang lại sự thống nhất; sự thống nhất mang lại phúc lợi."
 nwo_situation_02: "Ngọn cờ Tự do"
 nwo_situation_02_desc: "Xã hội đa nguyên mang lại phúc lợi, và phúc lợi mang lại sự thống nhất."
 nwo_situation_03: "Gia tăng Viện trợ"
 nwo_situation_03_desc: "Những nguồn tài nguyên này sẽ kết thúc cuộc xung đột một cách nhanh chóng và công bằng."
