 ### Tình huống Dịch bệnh
 situation_pre_ftl_plague: "Bệnh Truyền nhiễm từ Động vật"
 situation_pre_ftl_plague_type: "Bệnh Truyền nhiễm từ Động vật"
 situation_pre_ftl_plague_desc: "Một căn bệnh lây truyền từ động vật hoàn toàn mới đã xuất hiện trên [Target.GetName]. Do không có khả năng miễn dịch tự nhiên, cũng không có công nghệ y tế cần thiết để chống lại sự lây nhiễm, một lượng lớn người dân đang nhanh chóng mắc bệnh, chịu đựng đau đớn và dẫn đến tử vong."
 situation_pre_ftl_plague_monthly_change_tooltip: "$situation_monthly_change_tooltip_no_control$"
 situation_pre_ftl_plague_outcome_tooltip: "Dù thế nào đi nữa, đại dịch này rồi cũng sẽ kết thúc. Nhưng tàn dư sau cơn đại dịch ra sao, đều phụ thuộc vào sự lựa chọn của chúng ta."
