l_simp_chinese:
 #Phía trên mỗi định nghĩa khái niệm là hướng dẫn sử dụng, bao gồm cả biểu tượng nếu có.
 #Lưu ý rằng giữa biểu tượng và thuật ngữ có một khoảng trắng không ngắt (non-breaking space). Khi bạn sao chép ví dụ sử dụng, khoảng trắng này sẽ được giữ lại.
 #Điều này rất quan trọng để tránh việc xuống dòng giữa biểu tượng và khái niệm.
 #Sử dụng liên kết khái niệm có biểu tượng trong lần đầu tiên nhắc đến một khái niệm mới, sau đó sử dụng §H không có biểu tượng cho những lần lặp lại.
 #Sử dụng §H kèm biểu tượng trong lần đầu tiên một khái niệm được sử dụng trong chính mô tả của nó.
 #Sử dụng §H không kèm biểu tượng nếu khái niệm được sử dụng nhiều hơn một lần.
 #Số ít: £mod_job_technician_add£ ['concept_technician'] hoặc £mod_job_technician_add£ §H$concept_technician$§!
