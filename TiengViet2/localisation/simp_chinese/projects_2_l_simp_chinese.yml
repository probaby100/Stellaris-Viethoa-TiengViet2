 ####################################
 #Dự Án Đặc Biệt
 ####################################
 ### Sự Kiện Cốt Truyện
 AMOEBAS_1_PROJECT: "Quan Sát Amip Không Gian"
 AMOEBAS_1_PROJECT_DESC: "Bố trí một ban khoa học để thu thập và đối chiếu dữ liệu về Amip Không Gian."
 CRYSTALS_1_PROJECT: "Quan Sát Thực Thể Pha Lê"
 CRYSTALS_1_PROJECT_DESC: "Bố trí một ban khoa học để thu thập và đối chiếu dữ liệu về Thực thể Pha lê."
 DRONES_1_PROJECT: "Quan Sát Drone Khai Khoáng"
 DRONES_1_PROJECT_DESC: "Bố trí một ban khoa học để thu thập và đối chiếu dữ liệu về Drone Khai khoáng Cổ đại."
 CLOUDS_1_PROJECT: "Quan Sát Đám Mây Hư Không"
 CLOUDS_1_PROJECT_DESC: "Chỉ định một ban khoa học để thu thập và đối chiếu dữ liệu về Đám mây Hư không."
 CRYSTAL_CONSTRUCT_PROJECT: "Cấu Trúc Pha Lê"
 CRYSTAL_CONSTRUCT_PROJECT_DESC: "Thành lập một ban khoa học để thu thập và đối chiếu dữ liệu liên quan đến Cấu trúc Thực thể Pha lê."
 MINING_BASE_PROJECT: "Trung Tâm Xử Lý Drone Cổ Đại"
 MINING_BASE_PROJECT_DESC: "Thành lập một ban khoa học để nghiên cứu từ xa trung tâm xử lý drone cổ đại vừa được phát hiện."
 ### Sự Kiện Dị Thường
 DEAL_WITH_FLORA: "Thực Vật Xâm Lấn"
 DEAL_WITH_FLORA_DESC: "Hệ thực vật trên hành tinh này cực kỳ nhạy bén và có tính xâm lấn đáng kinh ngạc, hoàn toàn xứng đáng để nghiên cứu cận cảnh."
 OLD_GODS_BENEFACTRESS_PROJECT: "Cựu Thần: Nữ Thần Ban Phước"
 OLD_GODS_BENEFACTRESS_PROJECT_DESC: "Mỗi mặt của điện thờ Nữ thần Ban phước đều được phủ kín bởi một mạng lưới chữ tượng hình phức tạp, dường như đang kể lại một câu chuyện còn hoành tráng hơn cả những truyền thuyết cổ xưa nhất trên [Root.Owner.Capital.GetName].\n\nDù chỉ có đôi chút liên hệ với ngôn ngữ cổ của người [Root.Owner.GetSpeciesName], nhưng nếu có đủ thời gian và nguồn lực, cộng thêm sự trợ giúp của công nghệ hiện đại, ta vẫn có thể giải mã được những chữ tượng hình này."
 OLD_GODS_UNDAUNTED_PROJECT: "Cựu Thần: Thần Quả Cảm"
 OLD_GODS_UNDAUNTED_PROJECT_DESC: "Đúng như những giai thoại bao quanh Ngài, ngôi đền thờ Thần Quả cảm chứa đầy những thiết bị không rõ nguồn gốc lẫn công dụng. Khác xa với những hộp giải đố đơn thuần, ngôi đền của Ngài trên [Root.Owner.Capital.GetName] giăng đầy những phép thử sức mạnh, tương truyền chỉ có những bậc hiền triết thực thụ mới thấu hiểu được thánh ngôn của Ngài.\n\nCác công cụ phân tích tối tân của ta hẳn sẽ nhanh chóng phá vỡ được những mật mã này."
 OLD_GODS_PERCIPIENT_PROJECT: "Cựu Thần: Nữ Thần Thông Thái"
 OLD_GODS_PERCIPIENT_PROJECT_DESC: "Căn hầm đặt bức tượng Nữ thần Thông thái có những bức tường bên ngoài được phủ từng lớp sơn kim loại dày đặc, nhưng bản thân bức tượng lại hoàn toàn trần trụi.\n\nNhững truyền thuyết về Nữ thần Thông thái chỉ hé mở cho những ai đủ sức thấu hiểu chúng — chỉ những kẻ thực sự nhạy bén mới phân biệt được đâu là điều thực sự cần lĩnh hội."
 LIMBO_1_PROJECT: "Lửng Lơ Ranh Giới Tử Sinh"
 LIMBO_1_PROJECT_DESC: "Một hầm trú ẩn ngoài hành tinh nhét đầy các thiết bị lưu trữ dữ liệu, đang rất cần các nhà khảo cổ học khôi phục lại."
 PROJECTING_MOON_PROJECT: "Vô Cùng Kỳ Lạ"
 PROJECTING_MOON_PROJECT_DESC: "Một hành tinh dị thường cùng vệ tinh cũng dị thường không kém của nó; các công nghệ thông thường không thể đưa ra kết quả dò tìm thỏa đáng, cần phải tiến hành khảo sát thực địa kỹ càng hơn."
 GRIMACING_PLANET_PROJECT: "Hành Tinh Mặt Quỷ"
 GRIMACING_PLANET_PROJECT_DESC: "Nếu ta hành động đủ nhanh, những biến động dữ dội trên hành tinh này có thể được bình ổn lại, và biến nó thành một nơi có tiềm năng định cư."
 OLFACTORY_PROJECT: "Nghiên Cứu Khứu Giác"
 OLFACTORY_PROJECT_DESC: "Một món cổ vật ngoài hành tinh bị tình nghi là đang truyền phát thông tin thông qua các hợp chất tạo mùi dạng sương."
 ULTIMATE_WEAPON_PROJECT: "Vũ Khí Tối Thượng"
 ULTIMATE_WEAPON_PROJECT_DESC: "Đâu đó trên hành tinh này đang cất giấu một hòm vũ khí. Nếu có thể tìm ra nó, đế chế của ta có cơ may sẽ nắm được những công nghệ vũ khí mới."
 REFINE_ROCK_PROJECT: "Bắn Phá Positron"
 REFINE_ROCK_PROJECT_DESC: "Phương pháp khuếch tán positron có kiểm soát từ quỹ đạo có lẽ sẽ giúp biến đổi các khoáng chất nguyên thủy trên hành tinh thành một dạng vật chất hữu dụng hơn."
 CRYSTAL_CODEX_PROJECT: "Cổ Thư Pha Lê"
 CRYSTAL_CODEX_PROJECT_DESC: "Một cấu trúc tinh thể khoáng thạch đang lưu trữ một đoạn thông tin mã hóa ba chiều. Cấu trúc của nó thì khá phổ biến, nhưng mật độ dữ liệu nhồi nhét bên trong lại khiến việc giải mã trở nên vô cùng gian nan."
 ALIEN_BARRACKS_PROJECT: "Doanh Trại Ngoài Hành Tinh"
 ALIEN_BARRACKS_PROJECT_DESC: "Một dự án nghiên cứu khảo cổ học xã hội ngoài hành tinh nhắm vào đống phế tích này có lẽ sẽ giúp ta hiểu rõ hơn về những cỗ máy chiến tranh cổ đại kia."
 ROBOT_MINERALS_PROJECT: "Trở Về Với Tự Nhiên"
 ROBOT_MINERALS_PROJECT_DESC: "Một cơ sở hoang tàn cỏ mọc um tùm có lẽ đang che giấu những bí mật trọng đại."
 BALANCE_ECOSYSTEM_PROJECT: "Cân Bằng Hệ Sinh Thái"
 BALANCE_ECOSYSTEM_PROJECT_DESC: "Một phương án sử dụng trang thiết bị tiêu chuẩn trên tàu khoa học để khôi phục trạng thái cân bằng cho hệ sinh thái đang hỗn loạn trên hành tinh đã được lập ra.\n\nNhưng có thể nó sẽ kéo theo những hậu quả không lường trước được."
 HEAD_IN_SAND_PROJECT: "Tàu Vùi Trong Cát"
 HEAD_IN_SAND_PROJECT_DESC: "Có thể phái một hạm đội quân sự đến thử trục vớt con tàu đang bị vùi lấp này."
 THE_PRINCE_PROJECT: "Quân Vương"
 THE_PRINCE_PROJECT_DESC: "Một cơ sở dữ liệu trôi dạt trong không gian, bên trong chỉ lưu trữ độc một bài viết dài ngoằng được viết bằng thứ chữ ngoài hành tinh vừa lạ lẫm lại vừa quen thuộc."
 EMERGENCY_BUOY_PROJECT: "Phao Cứu Khẩn"
 EMERGENCY_BUOY_PROJECT_DESC: "Ta đã phát hiện một vật thể bị hư hại nặng nề, có vẻ như đây là một phao tín hiệu liên lạc."
 WRECKED_FLEET_1: "Thông Điệp Từ Tượng Đài"
 WRECKED_FLEET_1_DESC: "Giải mã thông điệp trên đài tưởng niệm."
 WRECKED_FLEET_2: "Hạm Đội Liên Minh Cổ Đại"
 WRECKED_FLEET_2_DESC: "Triển khai đội kỹ sư sửa chữa con tàu để đưa nó hoạt động trở lại."
 MANUFACTORY_PROJECT: "Khôi Phục Mỏ Khoáng Sản"
 MANUFACTORY_PROJECT_DESC: "Triển khai đội kỹ sư sửa chữa trạm khai thác quỹ đạo cổ đại để đưa nó hoạt động trở lại."
 ### Sự Kiện Thuộc Địa
 HELPFUL_DRONES_1_PROJECT: "Vật Bị Bỏ Quên"
 HELPFUL_DRONES_1_PROJECT_DESC: "Một tín hiệu kỳ lạ đang phát ra từ mặt trăng. Có thể chẳng là gì cả.\n\nNhưng cũng có thể là một thứ gì đó quan trọng. Tận dụng con tàu trên quỹ đạo làm trạm chuyển tiếp liên lạc, các nhà khoa học thuộc địa đã quét kỹ bề mặt mặt trăng để truy tìm chân tướng sự việc."
 POLLEN_1_PROJECT: "Nghiên Cứu Thực Vật"
 POLLEN_1_PROJECT_DESC: "Vài loại thực vật bản địa trên hành tinh đang cho thấy nhiều đặc tính tiềm năng rất đáng chú ý."
 POLLEN_2_PROJECT: "Nghiên Cứu Lao Động"
 POLLEN_2_PROJECT_DESC: "Gần đây, các trung tâm học thuật danh tiếng của người [Root.Owner.GetSpeciesName] đã đề xuất một số phương pháp khả thi để tổ chức lực lượng lao động quy mô lớn. Một cuộc nghiên cứu thấu đáo về những phương pháp mới này có thể giải quyết được bài toán sụt giảm năng suất trong môi trường thuộc địa đầy thách thức."
 POLLEN_3_PROJECT: "Điềm Báo Tận Thế"
 POLLEN_3_PROJECT_DESC: "Tình trạng lây nhiễm phấn hoa trên hành tinh đang dần biến thành một mối đe dọa tiềm tàng. Việc tiến hành đánh giá thần tốc tình hình thuộc địa, đặc biệt là các yếu tố môi trường đang ngày một bất ổn, là điều vô cùng cấp thiết.\n\nMột khi đã nắm rõ mọi nguy cơ, ta có thể phác thảo và thi hành một phương án đối phó chỉ trong vài giờ."
 ### Sự Kiện Khởi Đầu
 #Chứng Khát Khao Xê Dịch
 ROGUE_SCIENTIST_1_PROJECT: "Chứng Khát Khao Xê Dịch: Dấu Vết Mờ Nhạt"
 ROGUE_SCIENTIST_1_PROJECT_DESC: "Cùng với sự biến mất không một lời từ biệt của Trưởng quan Khoa học khỏi hệ sao này, một lượng lớn tín hiệu năng lượng tàn dư đầy khó hiểu đã bị phóng ra theo gió mặt trời.\n\nHy vọng rằng việc mổ xẻ mớ năng lượng này sẽ giúp ta tìm ra điểm đến tiếp theo của vị Trưởng quan kia, hoặc thậm chí, nếu cần thiết, giúp ta tóm đuôi ông ta dễ dàng hơn."
 #Đại Tuyệt Chủng
 MASSEX_1_PROJECT: "Kết Quả Phân Tích: Sụp Đổ"
 MASSEX_1_PROJECT_DESC: "Tái hiện lại quá khứ bi thảm của thiên thể này."
 MASSEX_2_PROJECT: "Kết Quả Phân Tích: Thiêu Rụi"
 MASSEX_2_PROJECT_DESC: "Tái hiện lại quá khứ bi thảm của thiên thể này."
 MASSEX_3_PROJECT: "Kết Quả Phân Tích: Hoang Tàn"
 MASSEX_3_PROJECT_DESC: "Tái hiện lại quá khứ bi thảm của thiên thể này."
 MASSEX_4_PROJECT: "Kết Quả Phân Tích: Độc Hại"
 MASSEX_4_PROJECT_DESC: "Tái hiện lại quá khứ bi thảm của thiên thể này."
 MASSEX_5_PROJECT: "Kết Quả Phân Tích: Đóng Băng"
 MASSEX_5_PROJECT_DESC: "Tái hiện lại quá khứ bi thảm của thiên thể này."
