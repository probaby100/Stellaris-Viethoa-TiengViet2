l_simp_chinese:
 ### KHÁI NIỆM
 # Phía trên định nghĩa của mỗi khái niệm là hướng dẫn sử dụng, bao gồm cả biểu tượng nếu có.
 #   Lưu ý rằng giữa biểu tượng và thuật ngữ có một khoảng trắng không ngắt dòng. Khi bạn sao chép ví dụ sử dụng, khoảng trắng này sẽ được giữ nguyên.
 #   Điều này rất quan trọng để tránh việc ngắt dòng giữa biểu tượng và khái niệm.
 # Sử dụng liên kết khái niệm kèm biểu tượng trong lần đầu tiên nhắc đến một khái niệm mới, sau đó dùng §H không kèm biểu tượng cho những lần lặp lại.
 # Dùng §H kèm biểu tượng lần đầu tiên khái niệm được sử dụng bên trong phần mô tả của chính nó.
 # Dùng §H không biểu tượng nếu khái niệm được sử dụng nhiều hơn một lần.
 ui_available_tabs: "\n\nCác thẻ hiện có:\n"
 # Giao diện: £interface£ ['concept_empire_view'] hoặc £interface£ §H$concept_empire_view$§!
 concept_empire_view: "Giao diện Đế chế"
 concept_empire_view_desc: "Nắm bắt tổng quan về đế chế. $ui_available_tabs$[GetConceptEmpireAdvisor]"
 empire_view_tab_empire: "§H$EMPIRE$§!"
 empire_view_tab_demographics: "§H$DEMOGRAPHICS_TITLE$§!"
 empire_view_tab_advisor: "§H$GOVERNMENT_ADVISOR_TAB$§!"
 concept_empire_view_tabs_advisor: "$concept_empire_view_tabs_no_advisor$\n—$empire_view_tab_advisor$: Chọn giọng nói cố vấn"
 concept_empire_view_tabs_no_advisor: "—$empire_view_tab_empire$: Liệt kê ['concept_authority'], ['concept_civics'] và ['concept_empire_modifiers']\n—$empire_view_tab_demographics$: Xem ['concept_pops'] và các tác động lên chúng"
 # Giao diện: £interface£ ['concept_situation_log_view'] hoặc £interface£ §H$concept_situation_log_view$§!
 concept_situation_log_view: "Giao diện $MENU_PANEL__SITUATION_LOG_TITLE$"
 concept_situation_log_view_desc: "£interface£§H$concept_situation_log_view$§! xem tổng quan các sự kiện đang diễn ra. $ui_available_tabs$$concept_situation_log_view_tabs$"
 situation_log_view_tab_situation_log: "§H$topbar_button_situation_name$§!"
 situation_log_view_tab_timeline: "§H$TIMELINE$§!"
 situation_log_view_tab_anomilies: "§H$ANOMALIES$§!"
 situation_log_view_tab_victory: "§H$VICTORIES$§!"
 concept_situation_log_view_tabs: "—$situation_log_view_tab_situation_log$: Liệt kê ['concept_event_chains'], ['concept_special_projects'] và ['concept_first_contacts']\n—$situation_log_view_tab_timeline$: Xem ['concept_milestones']['concept_empire_focuses']\n—$situation_log_view_tab_anomilies$: Hiển thị ['concept_anomalies']\n—$situation_log_view_tab_victory$: Xem ['concept_scoreboard']"
 concept_sidebar_special_project: "và ['concept_special_projects']"
 concept_sidebar_special_project_and_contract: "['concept_special_projects'] và ['concept_contracts']"
 # Giao diện: £interface£ ['concept_government_view'] hoặc £interface£ §H$concept_government_view$§!
 concept_government_view: "Giao diện $topbar_button_council_name$"
 concept_government_view_desc: "§H$concept_government_view$§! cho phép quản lý chính quyền. $ui_available_tabs$$concept_government_view_tabs$"
 government_view_tab_council: "§H$COUNCIL$§!"
 government_view_tab_factions: "§H$FACTIONS$§!"
 government_view_tab_policies_and_edicts: "§H$EDICTS_AND_POLICIES$§!"
 concept_government_view_tabs: "—$government_view_tab_council$: Quản lý ['concept_council'] và ['concept_agendas']\n—$government_view_tab_factions$: Xem ['concept_factions']\n—$government_view_tab_policies_and_edicts$: Chọn ['concept_policies'] và ['concept_edicts']"
 # Giao diện: £interface£ ['concept_society_management_view'] hoặc £interface£ §H$concept_society_management_view$§!
 concept_society_management_view: "Giao diện $TRADITION_VIEW_TITLE$" # Sử dụng bí danh này khi nhắc đến khái niệm
 concept_society_management: "$TRADITION_VIEW_TITLE$" # Bỏ từ 'Giao diện' để vừa với giao diện Ngân hàng Dữ liệu
 concept_society_management_desc: "§H$concept_society_management_view$§! cho phép quản lý các truyền thống. $ui_available_tabs$[GetConceptSocietyManagement]"
 society_management_view_tab_traditions: "§H$TRADITIONS$§!"
 society_management_view_tab_crisis: "§H$CRISIS_TAB$§!"
 concept_society_management_view_crisis: "$concept_society_management_view_no_crisis$\n—$society_management_view_tab_crisis$: Theo dõi tiến độ của ['concept_crisis']"
 concept_society_management_view_no_crisis: "—$society_management_view_tab_traditions$: Chọn ['concept_traditions'] và ['concept_ascension_perks']"
 # Giao diện: £interface£ ['concept_technology_view'] hoặc £interface£ §H$concept_technology_view$§!
 concept_technology_view: "Giao diện $TECHNOLOGY$"
 concept_technology_view_desc: "£interface£§H$concept_technology_view$§! cho thấy tiến độ nghiên cứu của đế chế trong các lĩnh vực £physics£ ['concept_physics_research'], £society£ ['concept_society_research'], và £engineering£ ['concept_engineering_research']. Qua giao diện này có thể chọn dự án nghiên cứu và quản lý ưu tiên công nghệ.\n\nCác ['concept_technologies'] mới sẽ xuất hiện bán ngẫu nhiên từ những lựa chọn hiện có, phản ánh sự khó đoán của quá trình khám phá khoa học."
 # Giao diện: £interface£ ['concept_leaders_view'] hoặc £interface£ §H$concept_leaders_view$§!
 concept_leaders_view: "Giao diện $topbar_button_leaders_name$"
 concept_leaders_view_desc: "£interface£§H$concept_leaders_view$§! cung cấp cái nhìn tổng quan về tất cả ['concept_leaders'] đang hoạt động trong đế chế, bao gồm vai trò, ['concept_leader_traits'], cấp độ kinh nghiệm và nhiệm vụ hiện tại của họ. Qua giao diện này, có thể chiêu mộ lãnh đạo mới, phân công lại lãnh đạo hiện tại, hoặc cho họ nghỉ hưu."
 # Giao diện: £interface£ ['concept_species_view'] hoặc £interface£ §H$concept_species_view$§!
 concept_species_view: "Giao diện $topbar_button_species_name$"
 concept_species_view_desc: "£interface£§H$concept_species_view$§! liệt kê toàn bộ các ['concept_species'] đã biết trong đế chế. Từ đây, có thể xem xét và chỉnh sửa ['concept_species_traits'], cũng như quản lý quyền lợi của người dân, như quyền công dân, nghĩa vụ quân sự và ['concept_living_standards'].\n\nGiao diện này đóng vai trò then chốt để lèo lái sự phức tạp của một đế chế đa loài, nơi chính sách, sinh học và hệ tư tưởng đan xen vào nhau, định hình nên xã hội giữa các vì sao."
 # Giao diện: £interface£ ['concept_planets_and_sector_view'] hoặc £interface£ §H$concept_planets_and_sector_view$§!
 concept_planets_and_sector_view: "Giao diện $PLANET_LIST$" # Sử dụng bí danh này khi nhắc đến khái niệm
 concept_planets_and_sector: "$PLANET_LIST$" # Bỏ từ 'Giao diện' để vừa với giao diện Ngân hàng Dữ liệu
 concept_planets_and_sector_desc: "Giao diện £interface£§H$concept_planets_and_sector$§! mang lại cái nhìn tổng quan tập trung về mọi £colony£ ['concept_colonies'] và £sector£ ['concept_sector'] trong đế chế.\n\nTừ góc nhìn này, bạn cũng có thể phân công các ['concept_governors']."
 # Giao diện: £interface£ ['concept_expansion_planner'] hoặc
 concept_expansion_planner: "$MENU_PANEL__EXPANSION_PLANNER_TITLE$"
 concept_expansion_planner_desc: "£interface£§H$concept_expansion_planner$§! liệt kê các £planet£['concept_planets'] có thể định cư. Bạn có thể tiến hành định cư trực tiếp từ cửa sổ này, và hệ thống sẽ tự động đóng một £colony_ship£['concept_colony_ship'].\n\nCác £planet£§H$concept_planets$§! phải được khảo sát trước bằng £science_ship£['concept_science_ship'], và mọi £anomaly£['concept_anomalies'] được phát hiện trên đó phải được nghiên cứu xong mới có thể định cư.\n\nNgoài ra, cần phải xây dựng một ['concept_starbase'] trong hệ sao chứa hành tinh đó để sáp nhập nó vào lãnh thổ đế chế."
 # Giao diện: £interface£ ['concept_fleet_management_view'] hoặc £interface£ §H$concept_fleet_management_view$§!
 concept_fleet_management_view: "Giao diện $topbar_button_fleet_manager_name$" # Sử dụng bí danh này khi nhắc đến khái niệm
 concept_fleet_management: "$topbar_button_fleet_manager_name$" # Bỏ từ 'Giao diện' để vừa với giao diện Ngân hàng Dữ liệu
 concept_fleet_management_desc: "Thiết kế tàu, lập hạm đội. Các §HKích cỡ tàu§! và ['concept_components'] mới cần được mở khóa bằng cách nghiên cứu các ['concept_technologies'] tương ứng. $ui_available_tabs$[GetConceptFleetManagement]"
 fleet_management_view_tab_fleet_manager: "§H$FLEET_MANAGER_VIEW$§!"
 fleet_management_view_tab_ship_designer: "§H$SHIP_DESIGNER$§!"
 concept_fleet_management_view_space_fauna: "$concept_fleet_management_view_no_space_fauna$\n—§H$CREATURE_DESIGNER$§!: Tạo hình ['concept_space_fauna']"
 concept_fleet_management_view_no_space_fauna: "—$fleet_management_view_tab_fleet_manager$: Tổ chức ['concept_fleets']\n—$fleet_management_view_tab_ship_designer$: Thiết kế ['concept_military_ships']"
 # Giao diện: £interface£ ['concept_contacts_view'] hoặc £interface£ §H$concept_contacts_view$§!
 concept_contacts_view: "Giao diện Liên lạc"
 concept_contacts_view_desc: "£interface£§H$concept_contacts_view$§! liệt kê tất cả các đế chế, vùng lãnh thổ độc lập và thực thể ngoài hành tinh đã biết. Thông qua giao diện này, bạn có thể bắt đầu ['concept_diplomacy'], và đánh giá các mối quan hệ. Đây là trung tâm đầu não cho việc liên lạc giữa các vì sao và tình báo nước ngoài."
 contacts_view_tab_contacts: "§H$topbar_button_contacts_name$§!"
 contacts_view_tab_agreements: "§H$AGREEMENTS_LIST_TITLE$§!"
 contacts_view_tab_shroud: "§H$THE_SHROUD_TITLE$§!"
 concept_contacts_view_tabs: "—$contacts_view_tab_contacts$: Tiến hành ['concept_diplomacy']\n—$contacts_view_tab_agreements$: Xem xét ['concept_subject_agreements']\n—$contacts_view_tab_shroud$: Thực hiện ['concept_psionic_ascension']"
 # Giao diện: £interface£ ['concept_discoveries_view'] hoặc £interface£ §H$concept_discoveries_view$§!
 concept_discoveries_view: "Giao diện $topbar_button_discoveries_name$"
 concept_discoveries_view_desc: "Danh mục £interface£§H$concept_discoveries_view$§! lưu trữ các vật thể và hiện tượng quan trọng được tìm thấy trong dải ngân hà, bao gồm ['concept_relics'], cổ vật và các bảo vật ngân hà khác mang ý nghĩa lâu dài. $ui_available_tabs$[GetConceptDiscovery]"
 discoveries_view_tab_relics: "§H$relics$§!"
 discoveries_view_tab_collection: "§H$COLLECTION$§!"
 discoveries_view_tab_vivarium: "§H$VIVARIUM$§!"
 discoveries_view_tab_astral_actions: "§H$ASTRAL_ACTIONS$§!"
 concept_discovery_view_base: "—$discoveries_view_tab_relics$: Quản lý ['concept_relics']"
 concept_discovery_view_base_ancrel: "$concept_discovery_view_base$ và ['concept_minor_artifacts']"
 concept_discovery_view_base_archive: "$concept_discovery_view_base$\n—$discoveries_view_tab_collection$: Trưng bày ['concept_specimens']\n—$discoveries_view_tab_vivarium$: Nuôi giống ['concept_space_fauna']"
 concept_discovery_view_base_ancrel_archive: "$concept_discovery_view_base$\n—$discoveries_view_tab_collection$: Trưng bày ['concept_specimens'] và ['concept_minor_artifacts']\n—$discoveries_view_tab_vivarium$: Nuôi giống ['concept_space_fauna']"
 concept_discovery_view_base_astral: "$concept_discovery_view_base$\n$concept_discovery_view_astral$"
 concept_discovery_view_base_ancrel_astral: "$concept_discovery_view_base_ancrel$\n$concept_discovery_view_astral$"
 concept_discovery_view_base_archive_astral: "$concept_discovery_view_base_archive$\n$concept_discovery_view_astral$"
 concept_discovery_view_base_ancrel_archive_astral: "$concept_discovery_view_base_ancrel_archive$\n$concept_discovery_view_astral$"
 concept_discovery_view_astral: "—$discoveries_view_tab_astral_actions$: Kích hoạt ['concept_astral_actions']"
 # Giao diện: £interface£ ['concept_claims_view'] hoặc £interface£ §H$concept_claims_view$§!
 concept_claims_view: "Giao diện $CLAIMS_VIEW$"
 concept_claims_view_desc: "£interface£§H$concept_claims_view$§! hiển thị toàn bộ lãnh thổ ['concept_claims'] mà đế chế sở hữu. Chế độ ngoại giao trên ['concept_galaxy_map'] cho thấy rõ các hệ sao đang tranh chấp cũng như những điểm nóng xung đột tiềm tàng trong tương lai."
 # Giao diện: £interface£ ['concept_market_view'] hoặc £interface£ §H$concept_market_view$§!
 concept_market_view: "Giao diện $MARKET_VIEW$"
 concept_market_view_desc: "£interface£§H$concept_market_view$§! mang lại cái nhìn tổng quan về thương mại giữa các vì sao, bao gồm việc mua bán tài nguyên hay thiết lập các giao dịch định kỳ hàng tháng."
 # Giao diện: £interface£ ['concept_colony_view'] hoặc £interface£ §H$concept_colony_view$§!
 concept_colony_view: "Giao diện Thuộc địa"
 concept_colony_view_desc: "£interface£§H$concept_colony_view$§! cho phép quản lý một £colony£['concept_colony']. Trên các £planet£['concept_planets'] hoặc ['concept_habitats'] phù hợp chưa được định cư, giao diện này có thể dùng để khởi động quá trình §HĐịnh cư§!. $ui_available_tabs$$concept_colony_view_tabs$"
 colony_view_tab_planet_summary: "§H$PLANET_TAB$§!"
 colony_view_tab_management: "§H$MANAGEMENT_TAB$§!"
 colony_view_tab_population: "§H$POPULATION_TAB$§!"
 colony_view_tab_armies: "§H$GROUND_COMBAT_TAB$§!"
 colony_view_tab_holdings: "§H$CORPORATE_TAB$§!"
 concept_colony_view_tabs: "—$colony_view_tab_planet_summary$: Hiển thị tổng quan về các £district£['concept_districts'], £building£['concept_buildings'] của thuộc địa và ['concept_governor'] được bổ nhiệm. Có thể thiết lập ['concept_designation'] hoặc bật ['concept_planet_automation'] tại đây.\n—$colony_view_tab_management$: Cho thấy tất cả đặc điểm hành tinh và biến động dân số. Tại đây có thể ban hành ['concept_decisions'], ['concept_planetary_ascension'] hoặc tiến hành ['concept_terraforming'].\n—$colony_view_tab_population$: Hiển thị dân số thuộc địa theo các tầng lớp £job£['concept_job'] khác nhau.\n—$colony_view_tab_armies$: Hiển thị lực lượng lục quân hiện diện trên thuộc địa, cũng như mức độ ['concept_devastation'] mà thuộc địa đang gánh chịu.\n—$colony_view_tab_holdings$: Tổng quan về mọi ['concept_overlord_holdings'] của thuộc địa."
 # Giao diện: £interface£ ['concept_starbase_view'] hoặc £interface£ §H$concept_starbase_view$§!
 concept_starbase_view: "Giao diện Căn cứ Sao"
 concept_starbase_view_desc: "£interface£§H$concept_starbase_view$§! cho phép quản lý một ['concept_starbase']. $ui_available_tabs$$concept_starbase_view_tabs$"
 starbase_view_tab_command: "§H$STARBASE_STARBASE_TAB$§!"
 starbase_view_tab_defenses: "§H$STARBASE_DEFENSES_TAB$§!"
 starbase_view_tab_armies: "§H$MACRO_BUILDER_TAB$§!"
 starbase_view_tab_shipyard: "§H$STARBASE_SHIPYARD_TAB$§!"
 concept_starbase_view_tabs: "—$starbase_view_tab_command$: Tổng quan về các §HMô-đun§! và §HCông trình§! của căn cứ sao. Sau khi nghiên cứu ['concept_technology'] cần thiết, bạn có thể nâng cấp căn cứ sao lên cấp độ tiếp theo\n—$starbase_view_tab_defenses$: Hiển thị các ['concept_defense_platforms'] hiện có, có thể nhấp vào từng loại để chế tạo thêm\n—$starbase_view_tab_armies$: Cung cấp phương thức để tập hợp số lượng lớn §H$assault_army_plural$§!. Quân đội sẽ được thành lập trên các £colony£['concept_colonies'] có sẵn trong £sector£['concept_sector'] và sẽ tập kết tại căn cứ sao này hoặc tại một §HLục quân§! đã bật tùy chọn §HTập kết Lục quân§!\n—$starbase_view_tab_shipyard$: Dùng để chế tạo ['concept_civilian_ships'] và ['concept_military_ships']"
 # Giao diện: £interface£ ['concept_system_map'] hoặc £interface£ §H$concept_system_map$§!
 concept_waystation_view: "Giao Diện Trạm Dừng"
 concept_waystation_view_desc: "£interface£ §H$concept_waystation_view$§! cho phép quản lý £waystation£ ['concept_waystation'].$ui_available_tabs$$concept_waystation_view_tabs$"
 waystation_view_tab_waystation: "§H$waystation_starbase_tab$§!"
 concept_waystation_view_tabs: "— $waystation_view_tab_waystation$: Cung cấp giao diện tổng quan về §HMô-đun§! và §HKho dự trữ§! của Trạm Dừng. Sau khi nghiên cứu ['concept_technology'] liên quan, có thể nâng cấp Trạm Dừng tại đây."
 # View: £interface£ ['concept_system_map'] or £interface£ §H$concept_system_map$§!
 concept_system_map: "Bản Đồ Hệ Sao"
 concept_system_map_desc: "£interface£§H$concept_system_map$§! cung cấp góc nhìn chi tiết về một hệ sao, bao gồm ['concept_celestial_objects'], ['concept_civilian_space_stations'], ['concept_fleets'] cùng cơ sở hạ tầng quỹ đạo. Nó cho phép quản lý chính xác việc xây dựng, thuộc địa hóa, chiến dịch tác chiến và hoạt động khoa học bên trong hệ sao."
 # View: £interface£ ['concept_galaxy_map'] or £interface£ §H$concept_galaxy_map$§!
 concept_galaxy_map: "Bản Đồ Ngân Hà"
 concept_galaxy_map_desc: "£interface£§H$concept_galaxy_map$§! cung cấp cái nhìn tổng quan chiến lược về ngân hà đã biết, hiển thị £system£ ['concept_systems'], biên giới ['concept_empire'] cùng ['concept_hyperlanes']. Đây là giao diện chính cho việc khám phá, mở rộng và điều phối liên sao."
 # Giao diện: £interface£ ['concept_navigation_bar'] hoặc £interface£ §H$concept_navigation_bar$§!
 concept_navigation_bar: "Thanh điều hướng"
 concept_navigation_bar_desc: "£interface£§H$concept_navigation_bar$§! nằm ở bên trái màn hình.\n\nNó có thể được mở rộng khi tương tác hoặc khóa ở chế độ thu nhỏ.\n\nỞ trạng thái mở rộng, bạn có thể truy cập cài đặt và sắp xếp lại các mục menu. Thao tác này cũng sẽ thay đổi các phím tắt dùng để mở nhanh từng mục menu."
 # Giao diện: £interface£ ['concept_resource_bar'] hoặc £interface£ §H$concept_resource_bar$§!
 concept_resource_bar: "Thanh tài nguyên"
 concept_resource_bar_desc: "£interface£§H$concept_resource_bar$§! nằm ở trên cùng màn hình.\n\nNơi đây hiển thị nhiều loại §HTài nguyên§! khác nhau như £energy£['concept_energy'], cũng như các chỉ số như £trade_value£['concept_trade'], ['concept_research'], ['concept_starbase_capacity'] và cả ['concept_naval_capacity'].\n\nỞ góc ngoài cùng bên phải là §HĐiều khiển thời gian§! dùng để điều chỉnh tốc độ trò chơi, tạm dừng và tiếp tục.\n\nBên dưới §HĐiều khiển thời gian§! là §HTrình phát nhạc§!."
 # Giao diện: £interface£ ['concept_outliner'] hoặc £interface£ §H$concept_outliner$§!
 concept_outliner: "Bảng tổng quan"
 concept_outliner_desc: "£interface£§H$concept_outliner$§! cung cấp quyền truy cập nhanh vào các thông tin và yếu tố then chốt của đế chế, bao gồm £colony£ ['concept_colonies'], ['concept_fleets'] và ['concept_civilian_space_stations']. Là một giao diện có thể tùy chỉnh, nó cho phép điều hướng và theo dõi thông tin nhanh chóng, mang lại các cập nhật trạng thái theo thời gian thực và có thể trực tiếp kiểm soát các hành động quan trọng."
