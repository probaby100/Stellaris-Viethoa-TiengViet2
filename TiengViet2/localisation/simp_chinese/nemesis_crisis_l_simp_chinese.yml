 #Tên Thiên phú Thăng thiên
 ap_become_the_crisis: "Hiểm Họa Ngân Hà"
 ap_become_the_crisis_desc: "Mọi kiệt tác vĩ đại đều cần được đánh đổi bằng sự hy sinh. Những sinh vật khác trong thiên hà có thể không hiểu, nhưng chúng chắc chắn sẽ phải phục tùng."
 #Tên Uy Hiếp
 menace_name: "$menace$:"
 #Tên Con Đường Thảm Họa
 crisis_path_destruction_name: "Con Đường Hủy Diệt"
 crisis_path_destruction_desc: "Trật tự là đi ngược lại tự nhiên. Bản chất thực sự của tự nhiên vốn là sự hỗn mang.\n\nChúng ta không hề phá hủy vũ trụ, mà đang sửa chữa nó."
 crisis_path_supremacy_name: "Con Đường Thống Trị"
 crisis_path_supremacy_desc: "Quyền thống trị chỉ thuộc về kẻ chiến thắng. Đối với chúng ta, đây là chân lý tối cao, và hoan nghênh bất cứ ai dám cố gắng chứng minh điều ngược lại."
 crisis_path_deception_name: "Con Đường Lừa Lọc"
 crisis_path_deception_desc: "Nếu mọi ánh nhìn đều đổ dồn vào tên hề đang nhảy múa giữa sân khấu, thì ngươi có thể dễ dàng ra tay hành động hơn trong bóng tối."
