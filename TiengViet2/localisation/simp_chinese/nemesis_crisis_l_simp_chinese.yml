 menace_value: "£menace£ $VAL|0$"
 menace_gaining: "Hoàn thành §HMục tiêu Thảm họa§! để nhận được §YUy hiếp§!."
 menace_desc: "Uy hiếp là một chỉ số dùng để đong đếm mức độ cộng hưởng của chúng ta với những nguồn năng lượng tai ương bên trong Vùng Mù mịt."
 menace_crisis_objective: "Mục tiêu Thảm họa"
 menace_crisis_objective_gained: "Đã nhận được Uy hiếp"
