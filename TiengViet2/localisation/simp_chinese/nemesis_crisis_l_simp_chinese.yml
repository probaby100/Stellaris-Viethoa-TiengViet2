 crisis_mean_destroy_starbase_name: "Phá Hủy Căn Cứ Sao"
 crisis_mean_destroy_starbase_desc: "Phá hủy một căn cứ sao của kẻ thù sẽ nhận được §H5§!£menace£ Uy hiếp."
 crisis_mean_conquer_colony_name: "Chinh Phục Thuộc Địa"
 crisis_mean_conquer_colony_desc: "Chinh phục một thuộc địa của kẻ thù sẽ nhận được §H10§!£menace£ Uy hiếp."
 crisis_mean_destroy_empire_name: "Tiêu Diệt Đế Chế"
 crisis_mean_destroy_empire_desc: "Xóa sổ hoàn toàn một đế chế sẽ nhận được §H100§!£menace£ Uy hiếp."
 crisis_mean_defeat_fleet_name: "Đánh Bại Hạm Đội Địch"
 crisis_mean_defeat_fleet_desc: "Mỗi điểm sức chứa hải quân từ hạm đội địch bị đánh bại sẽ mang lại cho bạn §H1§!£menace£ Uy hiếp."
 menacing_actions_destruction_destroy_enclave_title: "Tiêu Diệt Thế Lực Độc Lập"
 menacing_actions_destruction_destroy_enclave_desc: "Tiêu diệt một trạm không gian độc lập sẽ nhận được §H100§!£menace£ Uy hiếp."
 #Hành Động Uy Hiếp - Thống Trị
 menacing_actions_supremacy_enslave_species_title: "Nô Dịch Cả Một Chủng Tộc"
 menacing_actions_supremacy_enslave_species_desc: "Nô dịch hoàn toàn một chủng tộc sẽ mang lại §H5§!£menace£ Uy hiếp mỗi năm."
 menacing_actions_supremacy_have_vassal_title: "Sở Hữu Chư Hầu"
 menacing_actions_supremacy_have_vassal_desc: "Sở hữu chư hầu sẽ mang lại §H10§!£menace£ Uy hiếp mỗi năm."
 menacing_actions_supremacy_vassalize_empire_title: "Thu Phục Đế Chế Làm Chư Hầu"
 menacing_actions_supremacy_vassalize_empire_desc: "Thu phục một đế chế làm chư hầu sẽ nhận được §H100§!£menace£ Uy hiếp."
 menacing_actions_supremacy_invade_primitives_title: "Xâm Lược Văn Minh Nguyên Thủy"
 menacing_actions_supremacy_invade_primitives_desc: "Mỗi £pop£ dân số trên hành tinh nguyên thủy bị xâm lược sẽ mang lại §H1§!£menace£ Uy hiếp."
 menacing_actions_supremacy_sent_marauders_title: "Phát Động Chiến Dịch Cướp Phá"
 menacing_actions_supremacy_sent_marauders_desc: "Mỗi £pop£ dân số bị bắt cóc trong đợt oanh tạc cướp phá từ quỹ đạo sẽ mang lại cho bạn §H50§!£menace£ Uy hiếp."
 #Hành Động Uy Hiếp - Lừa Lọc
 menacing_actions_deception_force_resolution_title: "Cưỡng Chế Phủ Quyết"
 menacing_actions_deception_force_resolution_desc: "Phủ quyết một nghị án được đa số các quốc gia ủng hộ sẽ nhận được §H5§!£menace£ Uy hiếp."
 menacing_actions_deception_council_position_title: "Chiếm Ghế Hội Đồng Ngân Hà"
 menacing_actions_deception_council_position_desc: "Nắm giữ một ghế trong Hội đồng Ngân hà sẽ mang lại §H10§!£menace£ Uy hiếp mỗi năm."
 menacing_actions_deception_veto_resolution_title: "Một Phiếu Phủ Quyết"
 menacing_actions_deception_veto_resolution_desc: "Sử dụng quyền phủ quyết của Hội đồng để bác bỏ nghị án sẽ nhận được §H100§!£menace£ Uy hiếp."
 menacing_actions_deception_call_in_favor_title: "Kêu Gọi Ủng Hộ Ngoại Giao"
 menacing_actions_deception_call_in_favor_desc: "Mỗi điểm £favor£ ủng hộ ngoại giao kêu gọi được sẽ mang lại cho bạn §H1§!£menace£ Uy hiếp."
 menacing_actions_deception_win_humiliation_war_title: "Chiến Thắng Trong Cuộc Chiến Sỉ Nhục"
 menacing_actions_deception_win_humiliation_war_desc: "Giành chiến thắng trong một cuộc chiến sỉ nhục sẽ nhận được §H200§!£menace£ Uy hiếp."
