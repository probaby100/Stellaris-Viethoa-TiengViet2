 menace_crisis_objective_progress: "Chúng ta đã nhận được $AMOUNT$£menace£ từ Mục tiêu Thảm họa này."
 menace_crisis_level_locked: "Để mở khóa cấp độ này cần có:\n"
 menace_crisis_level_unlocked: "Ở $LEVEL$, bạn sẽ nhận được một dự án đặc biệt và các phần thưởng sau:\n"
 menace_crisis_level_desc: "Để thăng cấp Thảm họa, bạn cần hoàn thành các mục tiêu Thảm họa cũng như các dự án đặc biệt của Thảm họa trong Nhật ký Tình báo"
 menace_crisis_level_unlock: "Sở hữu £menace£§Y$CURRENCY$§! Uy hiếp"
 menace_current_value: "Chỉ số hiện tại: §Y$VALUE|0$§!"
 menace_crisis_description_title: "Hiểm Họa Ngân Hà"
 menace_crisis_description_intro: "Những kẻ trong Cộng đồng Ngân hà luôn cố gắng soi bóng tương lai qua lăng kính lịch sử từ lâu đã mường tượng về một §RThảm họa§! sắp giáng xuống — một cuộc khủng hoảng sinh tử đối với mọi sinh vật có trí tuệ, thứ chỉ có thể vượt qua bằng sự đồng tâm hiệp lực và sự hy sinh quên mình chưa từng có — đó là trong trường hợp có thể vượt qua được.\n\nCó khá nhiều suy đoán viển vông về bản chất của thảm họa này, chẳng hạn như sự xâm lược của những kẻ săn mồi ngoài thiên hà, hay sự trỗi dậy của trí tuệ máy móc càn quét khắp các vì sao, hoặc là một cuộc chiến tranh kế vị từ một chiều không gian khác lan tới, thế nhưng...\n\nĐến hôm nay, sự thật đã quá rõ ràng, thảm họa đó luôn luôn là §Rchúng ta§!."
 menace_crisis_description: "$menace_crisis_description_intro$\n\nMỗi nhất cử nhất động của chúng ta đều tạo ra những gợn sóng, vang vọng trong một chiều không gian chứa đựng nguồn năng lượng vô tận. Chúng ta chỉ cần tìm ra cách để thao túng nguồn năng lượng này là có thể buộc cả thiên hà phải quỳ gối dưới chân mình."
 menace_crisis_howto_title: "Uy Hiếp và Động Cơ"
 menace_crisis_howto: "Với tư cách là Thảm họa, hãy hoàn thành các §HMục tiêu Thảm họa§! để tạo ra £menace£§HUy hiếp§!, từ đó mở khóa tiềm năng hủy diệt của đế chế, giúp bạn hoàn thành nhiệm vụ chế tạo Siêu Cấu trúc Động cơ Aetherophasic và đưa thiên hà bước vào một kỷ nguyên mới."
