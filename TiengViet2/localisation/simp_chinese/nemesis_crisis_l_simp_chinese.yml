 ### menp_undertaker: "Kẻ Đưa Tang"
 ### menp_undertaker_desc: "'Cái chết' nghe có vẻ nặng nề quá. Chúng ta chỉ đơn thuần là đưa vật chất của chúng trở về trạng thái nguyên sơ thôi mà."
 ### crisis_perks_destruction_undertaker_unlock: "Thanh trừng §Y50§! £pop£ dân số để mở khóa $crisis_perk$ này."
 ### undertaker_passive: "Việc thanh trừng sẽ tạo ra £menace£ Uy hiếp."
 ### undertaker_active: "Tốc độ thanh trừng tăng lên đáng kể và tạo ra £alloy£ Hợp kim."
 ### menp_ship-chipper: "Máy Nghiền Tàu"
 ### menp_ship-chipper_desc: "Tất cả những cỗ máy bằng kim loại cứ di chuyển một cách trật tự này... Đã đến lúc phải bắt chúng dừng lại."
 ### crisis_perks_destruction_ship-chipper_unlock: "Phá hủy 100 phi thuyền để mở khóa $crisis_perk$ này."
 ### menp_ship-chipper_passive: "Hạm đội của bạn chịu ít hơn -25% sát thương trong chiến đấu."
 ### menp_ship-chipper_active: "Hạm đội của bạn được tăng +50% sát thương vũ khí."
 ### menp_death_from_above: "Cái Chết Từ Trên Cao"
 ### menp_death_from_above_desc: "Không có chỗ để chạy, không có chỗ để trốn. Trên thực tế, chẳng còn 'chỗ' nào cả."
 ### crisis_perks_destruction_death_from_above_unlock: "Phá hủy 10 công trình thông qua oanh tạc quỹ đạo để mở khóa $crisis_perk$ này."
 ### menp_death_from_above_passive: "Khi oanh tạc quỹ đạo, Mức độ Tàn phá Hành tinh tăng nhanh hơn 20%."
 ### menp_death_from_above_active: "Mở khóa tư thế Oanh tạc Tận thế."
 crisis_perks_supremacy_privateering_title: "Giấy Phép Cướp Bóc"
 crisis_perks_supremacy_privateering_desc: "Đích thân ra trận đánh kẻ thù sao?! Ôi thôi nào, sẽ có người giúp chúng ta lo liệu mấy việc vặt vãnh đó."
 crisis_perks_supremacy_privateering_unlock: "Để mở khóa $crisis_perk$ này, trước tiên cần phải thuê cùng lúc 4 hạm đội lính đánh thuê."
 crisis_perks_supremacy_privateering_passive: "Thời gian thuê hạm đội đánh thuê được gia hạn thêm 30%."
 crisis_perks_supremacy_privateering_active: "Giá thuê hạm đội đánh thuê giảm 50%."
 crisis_perks_supremacy_primus_inter_pares_title: "Lãnh Đạo Tối Cao"
 crisis_perks_supremacy_primus_inter_pares_desc: "Bọn chúng ngang hàng với chúng ta. Và chính bọn chúng cũng sẽ đồng tình với câu nói đó, nếu không thì..."
 crisis_perks_supremacy_primus_inter_pares_unlock: "Trở thành người lãnh đạo của một Liên bang Bá quyền có ít nhất bốn thành viên."
 crisis_perks_supremacy_primus_inter_pares_passive: "Mỗi thành viên liên bang cung cấp §G+5 sức chứa hải quân liên bang§!."
 crisis_perks_supremacy_primus_inter_pares_active: "Tốc độ tăng điểm đoàn kết liên bang +3."
 crisis_perks_supremacy_support_is_mandatory_title: "Chi Viện Ép Buộc"
 crisis_perks_supremacy_support_is_mandatory_desc: "Các ngươi, tất nhiên rồi, có thể không tuân lệnh chúng ta. Nhưng mà này, nếu các ngươi to gan như vậy, chúng ta đành phải xóa sổ các ngươi thôi."
 crisis_perks_supremacy_support_is_mandatory_unlock: "Để mở khóa $crisis_perk$ này, cần phải sở hữu ít nhất 4 chư hầu."
 crisis_perks_supremacy_support_is_mandatory_passive: "Lượng £energy£ Năng lượng và £mineral£ Khoáng sản mà mỗi chư hầu cống nạp hàng tháng tăng 10%."
 crisis_perks_supremacy_support_is_mandatory_active: "Đế chế cứ có thêm một chư hầu sẽ tăng 20 sức chứa hải quân."
 crisis_perks_deception_lord_of_red_tape_title: "Vua Quan Liêu"
 crisis_perks_deception_lord_of_red_tape_desc: "Dễ thôi mà! Đầu tiên cứ điền đầy đủ vào mẫu đơn liên bang số 68-XM, sau đó nộp cho phòng 11-B trước ngày 21, tiếp theo lại yêu cầu phòng này cấp cho 3 bản sao của tài liệu, lần lượt là..."
 crisis_perks_deception_lord_of_red_tape_unlock: "Để mở khóa $crisis_perk$ này, trước tiên cần phải đề xuất 3 biện pháp trừng phạt trong Cộng đồng Ngân hà."
 crisis_perks_deception_lord_of_red_tape_passive: "Lượng £influence£ Ảnh hưởng tiêu tốn khi đệ trình nghị án giảm 20%."
 crisis_perks_deception_lord_of_red_tape_active: "Nhận được quyền miễn trừ đối với việc §Pvi phạm§! luật ngân hà."
 crisis_perks_deception_dance_puppets_title: "Nhảy múa đi, hỡi những con rối!"
 crisis_perks_deception_dance_puppets_desc: "Ngươi thừa hiểu chuyện này diễn ra thế nào rồi đấy: Ngươi giữ thể diện cho ta, ta sẽ không tiêu diệt ngươi."
 crisis_perks_deception_dance_puppets_unlock: "Để mở khóa $crisis_perk$ này, trước tiên cần phải kêu gọi được 20 £favor£ ủng hộ ngoại giao."
 crisis_perks_deception_dance_puppets_passive: "§RMỗi £favor£ ủng hộ ngoại giao sẽ bị -10% trọng lượng ngoại giao§!"
 crisis_perks_deception_dance_puppets_active: "Kêu gọi £favor£ ủng hộ ngoại giao không còn tiêu tốn £influence£ Ảnh hưởng nữa."
 crisis_perks_deception_shadowplay_title: "Khiêu Vũ Trong Bóng Tối"
 crisis_perks_deception_shadowplay_desc: "Những gì ngươi biết về chúng ta, chính là những gì chúng ta muốn cho ngươi biết. Còn về việc chúng ta biết bao nhiêu về các ngươi á? Câu trả lời là, tất cả mọi thứ."
 crisis_perks_deception_shadowplay_unlock: "Để mở khóa $crisis_perk$ này, trước tiên cần phải hoàn thành §H10 chiến dịch tình báo§!."
 crisis_perks_deception_shadowplay_passive: "Tốc độ chiến dịch tình báo tăng +20%, đồng thời chi phí giảm -20%."
 crisis_perks_deception_shadowplay_active: "Nhận §G+20 mức độ tình báo§! về các đế chế khác."
