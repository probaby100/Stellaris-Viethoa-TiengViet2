 mod_tradition_purity_the_chosen: "Truyền thống §Y$tr_purity_the_chosen$§! tạo ra:"
 faith_in_science: "Tín Ngưỡng Khoa Học"
 faith_in_science_desc: "Người dân trên hành tinh này được tiếp thêm động lực nhờ có một tàu nghiên cứu chủ động hỗ trợ công việc nghiên cứu."
 colonization_fever: "Cơn Sốt Lập Thuộc Địa"
 ms_build_speed_mult: "Điều Kiện Thuận Lợi"
 lower_build_speed_mult: "Trì Hoãn Việc Xây Dựng"
 ring_world_halted: "Đình Trệ Việc Xây Dựng"
 unity_reduction_diplomatic_18: "Bản Sắc Văn Hoá Bị Tổn Hại"
 unity_reduction_diplomatic_18_desc: "Bản sắc văn hóa của người dân bị tổn hại nặng nề khi truyền thuyết mà họ luôn trân trọng bấy lâu nay bị vạch trần."
 unity_reduction_akx_9541: "Thế Giới Của Giun Bị Thanh Trừng"
 unity_reduction_akx_9541_desc: "Người dân đã mất niềm tin vào các nhà lãnh đạo và sống trong nơm nớp lo sợ rằng mình cũng sẽ chịu chung số phận."
 unity_reduction_observation_47: "Con Tin Bị Hành Quyết"
 unity_reduction_observation_47_desc: "Việc một số nhà khoa học của ta bị nước khác xử tử công khai đã làm lung lay lòng dân."
 unity_reduction_crisis_2204: "Người Nhân Tạo Đánh Bom"
 unity_reduction_crisis_2204_desc: "Người dân đang dần mất niềm tin vào khả năng bảo vệ an toàn công cộng của chính phủ."
 opinion_dysonsphere_terms_denied: "Kẻ Lang Thang Mù Lòa"
 opinion_dysonsphere_terms_denied_desc: "Chúng ta đã phá hủy chòm sao của họ."
 opinion_dysonsphere_apology_rejected: "Từ Chối Lời Xin Lỗi"
 opinion_dysonsphere_apology_rejected_desc: "Chúng ta từ chối chấp nhận lời xin lỗi của họ."
 unity_reduction_utopia_30: "Mù Lòa"
 unity_reduction_utopia_30_desc: "Công dân rất thất vọng trước sự thờ ơ của chúng ta khi nhắm mắt làm ngơ để Kẻ Lang Thang Độc Nhãn bị các đế chế khác làm cho mù lòa."
 unity_increase_utopia_30: "Làm Vừa Lòng Dân"
 unity_increase_utopia_30_desc: "Chúng ta đã bảo vệ lợi ích của người dân và buộc quốc gia kia phải bồi thường vì đã phá hủy chòm sao Kẻ Lang Thang Độc Nhãn của chúng ta."
 opinion_dysonsphere_insult: "Mỉa Mai Châm Biếm"
 opinion_dysonsphere_insult_desc: "Họ đã buông lời lăng mạ vóc dáng của chúng ta."
 energy_utopia_57: "Suối Nguồn Của Cải"
 energy_utopia_57_desc: "Loại kem chống lão hóa thần kỳ này đang trong tình trạng cung không đủ cầu."
 research_utopia_60: "Ngân Hàng Thần Kinh"
 research_utopia_60_desc: "Sự ra đời của ngân hàng thần kinh có thể đẩy nhanh đáng kể tốc độ nghiên cứu các công nghệ kỹ thuật của chúng ta."
 adding_unrest_slaves: "Nô Lệ Quá Khích"
 adding_unrest_slaves_desc: "Những nô lệ quá khích đang tụ tập lại, gieo rắc một bầu không khí đầy bất ổn."
 withdrawal_symptoms: "Hội Chứng Cai Nghiện"
 withdrawal_symptoms_desc: "Việc dứt khỏi thế giới hạnh phúc vô âu vô lo, tách biệt hoàn toàn với thực tại do §YCực Lạc Hoá Học§! tạo ra thường đi kèm với những cơn đau đớn, nhưng nỗi đau đó sẽ qua đi rất nhanh. Nỗi đau giằng xé nhất là khi người ta nhận ra những cảnh tượng sặc sỡ đầy mê hoặc trước mắt mình chỉ là ảo ảnh, và có lẽ họ sẽ không bao giờ thoát khỏi nỗi u sầu này."
 slave_riots: "Nô Lệ Bạo Động"
 slave_riots_desc: "Các cuộc bạo động của nô lệ đã làm kìm hãm sự gia tăng dân số."
 slave_hunger_strike: "Tuyệt Thực Đình Công"
 slave_hunger_strike_desc: "Rất khó để tập trung làm việc khi cái đói đang cào xé ruột gan."
 revolt_suppressed: "Đàn Áp Nô Lệ Nổi Loạn"
 slaves_defected: "Cuối Cùng Cũng Tự Do"
 slaves_defected_desc: "Những cựu nô lệ đang rất hân hoan khi nay đã được trở thành một phần của đất nước."
 revolt_suppressed_desc: "Tạm thời lũ nô lệ sẽ không dám tụ tập quấy rối nữa."
 free_at_last: "Cuối Cùng Cũng Tự Do"
 free_at_last_desc: "Những người từng là nô lệ cuối cùng cũng thoát khỏi ách gông cùm của những kẻ áp bức."
 insurgents_free: "$free_at_last$"
 insurgents_free_desc: "Cuối cùng, quân nổi dậy đã thoát khỏi ách bạo chúa của quốc gia chiếm đóng."
 revolt_suppressed_2: "Cuộc Nổi Loạn Bị Dập Tắt"
 revolt_suppressed_2_desc: "Lực lượng phiến quân tạm thời không dám lộng hành nữa."
 ageless: "Trường Sinh Bất Lão"
 ageless_desc: "Trường sinh bất lão, mang lại cho bạn một tuổi thọ không giới hạn..."
 pop_disappearances: "Nguy Hiểm Rình Rập"
 pop_disappearances_desc: "Hàng loạt vụ mất tích bí ẩn đang gieo rắc sự bất an cho toàn bộ cư dân trên hành tinh này."
 opinion_stole_our_glands: "Kẻ Trộm Tuyến Nội Tiết"
 opinion_stole_our_glands_desc: "Bọn chúng đã đánh cắp các tuyến nội tiết của chúng ta."
