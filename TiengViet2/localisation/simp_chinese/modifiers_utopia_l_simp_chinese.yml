 megastructure_demands_rejected_desc: "Người dân vô cùng thất vọng vì những lo âu và ý kiến của họ không được ai lắng nghe."
 opinion_ringworld_terms_denied: "Từ Chối Yêu Cầu"
 opinion_ringworld_terms_accepted: "Chấp Nhận Yêu Cầu"
