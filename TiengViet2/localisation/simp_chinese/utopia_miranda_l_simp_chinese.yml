# l_simp_chinese:
#
# utopia.1.name: "Yêu cầu gửi đến [ringworld_builder.GetName]"
# utopia.1.desc.v1: "Bộ phận tình báo của chúng ta phát hiện Thế giới Vành đai của [ringworld_builder.GetName] có thể đang giấu các bệ phóng vũ khí hủy diệt hàng loạt. Dù độ tin cậy của nguồn tin này vẫn cần được xác minh, nhưng dư luận đang nghiêng về việc phải hành động ngay lập tức. Nếu [ringworld_builder.GetName] không có gì phải giấu giếm, họ nên cho phép đội chuyên gia vũ khí của chúng ta đến kiểm tra."
# utopia.1.desc.v2: "[ringworld_builder.GetName] đang dốc sức xây dựng một Thế giới Vành đai, các kỹ sư trưởng của chúng ta đã theo dõi dự án này từ xa và vô cùng kinh ngạc trước tiến độ của họ. Các kỹ sư tin rằng việc quan sát trực tiếp công trình này sẽ mang lại rất nhiều lợi ích, do đó mong muốn chúng ta gửi yêu cầu cử một đoàn khảo sát đến đó."
# utopia.1.desc.v4: "Gần đây, các nhà tiên tri trên khắp đế chế đều nhìn thấy ảo ảnh kinh hoàng về cái chết và sự hủy diệt liên quan đến một vật thể hình tròn trên bầu trời. Các lãnh đạo tôn giáo lo ngại rằng tham vọng xây dựng Thế giới Vành đai của [ringworld_builder.GetName] đã chọc giận thần linh. Họ đề nghị cử một đại diện đến ban phước cho công trình này để ngăn những viễn cảnh kia trở thành sự thật."
# utopia.1.a: "Gửi yêu cầu của chúng ta đến [ringworld_builder.GetName]."
# utopia.1.b: "Không đời nào, chuyện này không có gì để bàn cả."
# utopia.1.b.tooltip: "Dân số bị ảnh hưởng sẽ nhận một thay đổi §YTừ chối yêu cầu về Siêu kiến trúc§!:\n\n£happinessMức độ hạnh phúc §R-20%§!"
# utopia.2.name: "Yêu cầu từ [From.From.GetName]"
# utopia.2.a: "Chấp nhận yêu cầu."
# utopia.2.b: "Từ chối yêu cầu."
# utopia.2.c: "Đó là vinh dự của chúng ta."
# utopia.2.desc.v1: "[From.From.GetName] nói rằng họ phát hiện chúng ta đang bí mật xây các bệ phóng vũ khí hủy diệt hàng loạt trên Thế giới Vành đai, và xin phép được đến đó điều tra. Các cố vấn quân sự của chúng ta hiện chưa rõ đây là sự hiểu lầm vô tình hay là một âm mưu nào đó của họ. Dù sao đi nữa, chúng ta cũng phải xử lý cẩn thận."
# utopia.2.desc.v2: "Các kỹ sư của [From.From.GetName] đang theo dõi sát sao quá trình xây dựng Thế giới Vành đai của chúng ta từ xa và họ tỏ ra rất ấn tượng với tiến độ này. Họ mong chúng ta cho phép một đội kỹ sư của họ đến tận nơi để quan sát quá trình thi công."
# utopia.2.desc.v4: "Gần đây, các nhà tiên tri của [From.From.GetName] đều nhìn thấy ảo ảnh kinh hoàng về cái chết và sự hủy diệt liên quan đến một vật thể hình tròn trên bầu trời. Họ e ngại rằng việc đế chế xây dựng Thế giới Vành đai khi chưa được cho phép có thể chọc giận thần linh. Vì vậy, họ muốn đến ban phước cho công trình trước khi nó hoàn thành, và hy vọng chúng ta sẽ đồng ý."
# utopia.3.name: "Yêu cầu đã được chấp thuận"
# utopia.3.desc.v1: "Để duy trì quan hệ hữu hảo, [From.GetName] đã đồng ý cho chúng ta cử một đội chuyên gia vũ khí đến Thế giới Vành đai của họ để điều tra xem có bệ phóng vũ khí bí mật nào không. Chúng ta đã phái những chuyên gia giỏi nhất đến hiện trường và sẽ sớm biết được sự thật."
# utopia.3.desc.v2: "[From.GetName] vừa ra tuyên bố rất sẵn lòng để chúng ta cử một nhóm nghiên cứu đến khảo sát Thế giới Vành đai. Giới khoa học đang rất hào hứng với tin này. Kỹ sư trưởng đã sắp xếp một phái đoàn gồm những kỹ sư xuất sắc nhất đến tìm hiểu tiến độ của công trình."
# utopia.3.desc.v4: "[From.GetName] rất coi trọng yêu cầu của chúng ta. Họ hứa sẽ lập tức tạm dừng mọi công đoạn xây dựng Thế giới Vành đai cho đến khi các lãnh đạo tôn giáo của chúng ta xác nhận công trình này không đi ngược lại ý trời. Một nhóm đại diện tôn giáo được tuyển chọn kỹ lưỡng đang trên đường đến hiện trường để đảm bảo lời tiên tri thảm họa kia sẽ không thành hiện thực."
# utopia.3.a: "Tuyệt vời."
# utopia.4.name: "Yêu cầu bị từ chối."
# utopia.4.desc: "[From.GetName] đã không chấp nhận yêu cầu của chúng ta, hành động này khiến quan hệ giữa hai bên trở nên xấu đi."
# utopia.4.a: "Thật đáng tiếc."
# utopia.5.name: "Nhiệm vụ hoàn thành"
# utopia.5.desc.v1: "Đội chuyên gia vũ khí được phái đến điều tra Thế giới Vành đai của loài [From.GetSpeciesName] đã lùng sục khắp nơi tìm kiếm bệ phóng vũ khí bí mật nhưng không thu được gì. Chuyện này chỉ có thể kết luận là do nguồn tình báo của chúng ta có vấn đề. Lần sau cần phải phân tích thông tin cẩn thận hơn."
# utopia.5.desc.v2: "Nhóm nghiên cứu được cử đến Thế giới Vành đai của loài [From.GetSpeciesName] đã học hỏi thêm được một số kiến thức mới về kỹ thuật. Dù ban đầu hai bên gặp chút khó khăn trong việc giao tiếp do khác biệt văn hóa, nhưng cuối cùng họ đã trao đổi rất cởi mở và cả hai đều thu hoạch được nhiều điều."
# utopia.5.desc.v4: "Đoàn tôn giáo được cử đến ban phước cho Thế giới Vành đai của [From.GetName] nay đã trở về, nhưng lại mang theo nhiều thắc mắc hơn. Khi ngồi thiền tại công trường, họ đã giao tiếp sâu sắc với thần linh và nhận ra rằng Thế giới Vành đai không phải là mầm mống của lời tiên tri thảm họa kia. Dù chưa thể hiểu rõ ý nghĩa thực sự của thông điệp này, nhưng có một điều chắc chắn là 'Chuyện có thể xảy ra, cũng có thể sẽ chẳng bao giờ xảy ra...'"
# utopia.5.b: "Tuyệt vời."
# utopia.6.name: "Yêu cầu về Thế giới Vành đai: Kết luận"
# utopia.6.desc.v1: "Đội chuyên gia vũ khí từ [From.From.GetName] đã lật tung quá nửa công trường Thế giới Vành đai và cuối cùng kết luận: Thế giới Vành đai của chúng ta hoàn toàn không có bệ phóng vũ khí bí mật nào cả. Thực ra, nếu họ tin tưởng chúng ta thì đã chẳng phải nhọc công đến thế..."
# utopia.6.desc.v2: "Các kỹ sư do [From.From.GetName] phái đến đã rời đi sau vài tuần lưu lại Thế giới Vành đai. Dù có nhiều khác biệt về văn hóa, nhưng hai bên đã giao lưu rất sôi nổi. Cuối cùng ai nấy đều học hỏi được nhiều điều và ra về trong sự hài lòng."
# utopia.6.desc.v4: "Các nhà lãnh đạo tôn giáo từ [From.From.GetName] đã tiến hành thiền định trên các bệ đỡ của công trình Thế giới Vành đai. Theo lời họ kể, họ đã có một cuộc giao tiếp sâu sắc với thần linh và nhận ra rằng Thế giới Vành đai không phải là nguyên nhân của lời tiên tri thảm họa trước đó. Dù họ không chịu tiết lộ ý nghĩa thật sự của thông điệp này, nhưng họ đảm bảo với chúng ta rằng 'Chuyện có thể xảy ra, cũng có thể sẽ chẳng bao giờ xảy ra...' Ơn trời, cuối cùng thì công trình cũng có thể tiếp tục."
# utopia.21.name: "Điều kiện thuận lợi"
# utopia.21.desc: "Dưới sự lãnh đạo tài ba của giám đốc thi công Thế giới Vành đai, chúng ta đã huy động tối đa nguồn nhân lực cần thiết, giúp đẩy nhanh tiến độ xây dựng lên rất nhiều."
# utopia.22.name: "Khoáng sản dự trữ"
# utopia.22.desc: "Đội xây dựng Thế giới Vành đai đã phát hiện một lượng lớn khoáng sản nằm trong một tảng đá xốp khổng lồ. Nếu tiếp tục thi công, tảng đá này sẽ vỡ nát. Vì vậy, chúng ta cần tạm dừng công trình để khai thác chỗ khoáng sản quý giá bên trong trước."
# utopia.22.a: "Khai thác khoáng sản quý giá."
# utopia.22.b: "Chúng ta không thể để công trình bị đình trệ."
# utopia.27.name: "Công nhân mất tích"
# utopia.27.desc: "Kể từ khi dự án Thế giới Vành đai khởi công, nhiều công nhân đã mất tích một cách khó hiểu. Mặc dù rất có thể họ đã lén lên tàu vũ trụ rời đi mà không báo cho quản lý, nhưng chúng ta vẫn tiến hành điều tra vụ việc này. Sự vắng mặt không báo trước của họ đã làm tiến độ công trình bị chậm lại đôi chút."
# utopia.27.a: "Thật đáng tiếc."
# utopia.28.name: "Công nhân mất tích"
# utopia.28.desc: "Các công nhân thay thế đã đến công trường, việc xây dựng Thế giới Vành đai đã có thể trở lại đúng quỹ đạo. Đáng tiếc là chúng ta vẫn chưa tìm thấy những người mất tích, chúng ta đã gửi thông báo cho gia đình của họ."
# utopia.28.a: "Mặc niệm cho họ."
# utopia.23.name: "Thú cưng trên Thế giới Vành đai"
# utopia.23.desc: "Hóa ra một trong những hành tinh được dùng làm vật liệu xây dựng Thế giới Vành đai không hề tĩnh lặng như chúng ta tưởng. Một loài sâu không gian khổng lồ chưa từng được biết đến nhưng bề ngoài có vẻ vô hại, mang biệt danh \"Kuku\", đã bám theo các mảnh vỡ từ hành tinh đó để di cư sang Thế giới Vành đai. Chúng có bộ lông mềm mại, tính tình hiền lành nên nhanh chóng trở thành người bạn của các công nhân. Những người thợ xây xa nhà vốn rất cô đơn, và bầy sâu không gian này đã phần nào bù đắp khoảng trống do những đồng nghiệp mất tích để lại.\n\nChúng ta có thể để mặc bầy sâu sống yên ổn, hoặc chọn cách tiêu diệt chúng, nhưng quá trình dọn dẹp sẽ làm chậm tiến độ thi công đôi chút."
# utopia.23.a: "Tiêu diệt chúng."
# utopia.23.b: "Tốt nhất là đừng làm phiền chúng."
# utopia.25.name: "Một phát hiện gây sốc"
# utopia.25.desc: "Một điều ngoài sức tưởng tượng của tất cả mọi người là hàng ngàn con sâu không gian trên Thế giới Vành đai bỗng chốc hóa thành bướm bay rợp trời, phủ lên công trình muôn vàn màu sắc rực rỡ. Sự lột xác này có thể là do việc hình thành bầu khí quyển tạo ra. Nhưng chưa kịp ăn mừng, mọi người lại phát hiện ra một sự thật kinh hoàng hơn: trong mạng lưới đường hầm dưới lòng đất, có người nhìn thấy bầy Kuku đang cắn nuốt di hài của những công nhân mất tích. Việc thi công lập tức bị đình chỉ, tất cả mọi người đều xắn tay áo vào việc tiêu diệt đám sinh vật này. Để trả thù cho đồng nghiệp, các công nhân đã làm việc cực kỳ hăng say. Đám sinh vật nguy hiểm này chắc sẽ sớm bị xóa sổ thôi. Đúng là không thể nhìn mặt mà bắt hình dong, cuối cùng mọi người cũng nhận ra bản chất thật sự của lũ Kuku hiền lành."
# utopia.25.a: "Cuối cùng cũng tống khứ được rắc rối này."
# utopia.26.name: "Một phát hiện gây sốc"
# utopia.26.desc: "Để tiêu diệt toàn bộ loài sâu không gian mang tên \"Kuku\" trên Thế giới Vành đai, chúng ta đã thành lập một đội dọn dẹp chuyên trách, nhưng công việc của họ lại vấp phải sự cản trở từ các công nhân. Để bảo vệ thú cưng của mình, một thanh niên thậm chí đã chạy ra tận khu vực rìa ngoài công trường. Tại đó, anh ta vô tình phát hiện một đường hầm mới đào, bên trong là vài con Kuku đang cắn nuốt di hài của các công nhân mất tích. Bị bầy Kuku phát hiện và phun axit tấn công, chàng trai đã may mắn thoát chết và lập tức báo cho đội dọn dẹp. Nhờ đó, việc tiêu diệt bầy Kuku mới diễn ra suôn sẻ. Đến đây thì tất cả mọi người mới nhận ra bản chất thật sự của đám Kuku hiền lành kia."
# utopia.26.a: "Cú lừa này thật quá bất ngờ."
# utopia.30.name: "Kẻ Lang Thang Độc Nhãn"
# utopia.30.desc.v1: "Gần đây nước ta phát hiện [dysonsphere_builder.GetName] đang xây dựng một Cầu Dyson quanh ngôi sao trung tâm [dyson_system.GetName]. Đây là một trong những ngôi sao thuộc chòm \"Kẻ Lang Thang Độc Nhãn\" mà chúng ta trân quý nhất, và nay nó đã bị Cầu Dyson che khuất ánh sáng hoàn toàn. Hành động này khiến cả đế chế bàng hoàng. Chòm sao Kẻ Lang Thang Độc Nhãn vẫn luôn che chở chúng ta, tương truyền ánh sáng của nó không chỉ dẫn đường cho hạm đội mà còn định hướng cho các vì sao di chuyển trong dải ngân hà. Không ngờ [dysonsphere_builder.GetName] lại to gan dùng Cầu Dyson để che đi tầm nhìn của Kẻ Lang Thang. Dù phải nhiều năm nữa ánh sáng của ngài mới hoàn toàn lụi tắt trong mắt người dân chúng ta, nhưng khi biết ngài sẽ không thể tiếp tục bảo vệ các thế hệ mai sau, ai nấy đều vô cùng đau xót."
# utopia.30.a: "Họ phải chính thức xin lỗi chúng ta."
# utopia.30.b: "Quyên góp 1000 năng lượng chắc sẽ giúp xoa dịu nỗi đau của nhân dân ta."
# utopia.30.c: "Quan hệ hữu nghị với láng giềng mới là điều quan trọng hơn."
# utopia.31.name: "Kẻ Lang Thang Độc Nhãn"
# utopia.31.intro: "Chúng tôi phát hiện các vị đang xây Cầu Dyson quanh ngôi sao trung tâm của chòm sao \"Kẻ Lang Thang Độc Nhãn\" mà chúng tôi trân quý nhất. Kẻ Lang Thang Độc Nhãn vẫn luôn che chở chúng tôi, ánh sáng của ngài không chỉ dẫn lối cho hạm đội mà còn định hướng cho biết bao vì sao trong thiên hà. Vậy mà các vị lại dựng Cầu Dyson quanh ngài, chặn đứng hoàn toàn ánh sáng đó."
# utopia.31.desc: "$utopia.31.intro$Dù phải nhiều năm nữa nhân dân chúng tôi mới hoàn toàn không còn nhìn thấy ánh sáng của Kẻ Lang Thang, nhưng khi biết ngài sẽ không thể tiếp tục bảo vệ thế hệ mai sau, mọi người đều vô cùng đau đớn. Các vị nợ chúng tôi một lời xin lỗi chính thức."
# utopia.31.a: "Đưa ra lời xin lỗi chính thức."
# utopia.31.b: "Chia sẻ cho họ một chút năng lượng của chúng ta."
# utopia.31.c: "Nhưng chúng tôi chẳng thấy có lỗi gì sất..."
# utopia.32.name: "Kẻ Lang Thang Độc Nhãn"
# utopia.32.desc: "$utopia.31.intro$Dù phải nhiều năm nữa nhân dân chúng tôi mới hoàn toàn không còn nhìn thấy ánh sáng của Kẻ Lang Thang, nhưng khi biết ngài sẽ không thể tiếp tục bảo vệ thế hệ mai sau, mọi người đều vô cùng đau đớn. Trong khi đó, các vị lại chuẩn bị thu về một lượng năng lượng khổng lồ. Tuy nhiên, nếu các vị chịu quyên góp 1000 năng lượng cho chúng tôi, điều đó chắc hẳn sẽ giúp xoa dịu nỗi đau mà các vị đã gây ra cho dân chúng."
# utopia.32.a: "Thực hiện \"quyên góp\" 1000 năng lượng."
# utopia.32.b: "Chúng tôi không có năng lượng dư thừa để cho các vị, nhưng chúng tôi có thể đưa ra một lời xin lỗi chính thức."
# utopia.32.c: "Họ không có quyền can thiệp vào chuyện nội bộ của chúng ta."
# utopia.33.name: "Kẻ Lang Thang Mù Lòa"
# utopia.33.desc: "Hôm nay, [dysonsphere_builder.GetRulerTitle] của [dysonsphere_builder.GetName] là [dysonsphere_builder.GetRulerName] đã hội kiến với [dyson_sphere_neighbor.GetRulerTitle] [dyson_sphere_neighbor.GetRulerName], để chính thức xin lỗi đế chế chúng ta vì đã che khuất ánh sáng của Kẻ Lang Thang Độc Nhãn. Họ bày tỏ sự hối hận chân thành và hứa với chúng ta rằng, dù Kẻ Lang Thang mất đi ánh sáng, ngài vẫn sẽ dùng niềm tin và sự công chính để tiếp tục dẫn dắt dân tộc chúng ta."
# utopia.33.a: "Niềm tin của Kẻ Lang Thang sẽ dẫn lối cho chúng ta."
# utopia.33.b: "Lời xin lỗi của họ không đủ chân thành."
# utopia.34.name: "Kẻ Lang Thang Mù Lòa"
# utopia.34.desc: "Chúng tôi đã nhận được yêu cầu của các vị, nhưng có vẻ như các vị đang hiểu lầm đôi chút về mối quan hệ giữa hai ta. Hãy để chúng tôi làm rõ. [dyson_system.GetName] là ngôi sao nằm trong lãnh thổ của chúng tôi. Dù khái niệm lãnh thổ có thể hơi khó hiểu với các vị, nhưng xin hãy nhớ rằng chuyện nội bộ của chúng tôi không mướn các vị can thiệp, giống như việc các vị dỗ dành dân chúng của mình cũng chẳng liên quan gì đến chúng tôi vậy. Để tránh hiểu lầm về sau, tốt nhất các vị nên khắc cốt ghi tâm điều này."
# utopia.34.a: "Họ hoàn toàn không đáng để chúng ta phải lên tiếng."
# utopia.34.b: "Sỉ nhục họ."
# utopia.34.b.tooltip: "\"Cái đế chế thảm hại của các vị sẽ sớm hiểu được mùi vị bị cô lập giữa vũ trụ là thế nào...\""
# utopia.34.c: "Sẽ có ngày chúng ta bắt họ phải trả giá..."
# utopia.35.name: "Kẻ Lang Thang Mù Lòa"
# utopia.35.desc: "Hôm nay, [dysonsphere_builder.GetRulerTitle] của [dysonsphere_builder.GetName] là [dysonsphere_builder.GetRulerName] đã gặp gỡ [dyson_sphere_neighbor.GetRulerTitle] [dyson_sphere_neighbor.GetRulerName] để chính thức xin lỗi vì đã che khuất ánh sáng của Kẻ Lang Thang Độc Nhãn. Họ cũng đã gửi 1000 năng lượng như một cách bù đắp tổn thương tinh thần cho người dân của chúng ta, đồng thời cam kết rằng dù Kẻ Lang Thang có tắt sáng, ngài vẫn sẽ dùng đức tin và sự công bình để tiếp bước dẫn đường cho dân tộc ta."
# utopia.35.a: "Niềm tin của Kẻ Lang Thang sẽ dẫn lối cho chúng ta."
# utopia.35.b: "Lời xin lỗi của họ không đủ chân thành."
# utopia.36.desc: "Hôm nay, [dysonsphere_builder.GetRulerTitle] của [dysonsphere_builder.GetName] là [dysonsphere_builder.GetRulerName] đã gặp mặt [dyson_sphere_neighbor.GetRulerTitle] [dyson_sphere_neighbor.GetRulerName] để chính thức xin lỗi vì vụ việc che mất ánh sáng của Kẻ Lang Thang Độc Nhãn. Mặc dù lời xin lỗi nghe có vẻ thật lòng, nhưng họ lại cự tuyệt bồi thường năng lượng với lý do không có năng lượng dư thừa để chia sẻ."
# utopia.36.a: "Họ cũng đã cố gắng bù đắp rồi."
# utopia.36.b: "Lũ keo kiệt!"
# utopia.37.desc: "Do chúng ta vô tình xây Cầu Dyson quanh ngôi sao mà người dân [dyson_sphere_neighbor.GetName] yêu kính nhất, chúng ta đã làm tổn thương tình cảm của họ. Để chuộc lỗi, [dysonsphere_builder.GetRulerTitle] của chúng ta đã đích thân sang nước họ để gửi lời xin lỗi chân thành đến người dân. Đáng tiếc là, họ cho rằng chỉ xin lỗi suông thì chưa đủ."
# utopia.37.a: "Thật đáng tiếc."
# utopia.37.b: "Đúng là được nước làm tới."
# utopia.38.desc: "Do chúng ta vô tình xây Cầu Dyson quanh ngôi sao mà người dân [dyson_sphere_neighbor.GetName] sùng bái nhất, chúng ta đã làm tổn thương tình cảm của họ. Nhằm hàn gắn quan hệ hai nước, [dysonsphere_builder.GetRulerTitle] của chúng ta đã cất công sang tận nơi để bày tỏ sự hối lỗi sâu sắc. Dù họ vẫn cần thời gian để xoa dịu nỗi đau, nhưng họ tỏ ra rất hài lòng với thái độ của chúng ta, hy vọng quan hệ đôi bên nhờ vậy mà sẽ tiến thêm một bước."
# utopia.38.a: "Thật là một tin tốt."
# utopia.39.desc: "Chúng tôi rất cảm kích vì các vị đã cất công đến thông báo. Xem ra trước đây chúng tôi có nhiều chuyện chưa tỏ tường, một trong số đó chính là bản tính của người dân bên các vị. Cái đế chế thảm hại của các vị sẽ sớm hiểu được mùi vị bị cô lập giữa vũ trụ là thế nào."
# utopia.39.a: "Chúng ta sẽ đợi đến ngày đó."
# utopia.39.b: "Họ sẽ phải trả giá cho sự hỗn xược của mình!"
# utopia.39.c: "Đúng là chỉ giỏi võ mồm."
# utopia.40.desc: "Nguồn tin của chúng ta báo lại rằng [dyson_sphere_neighbor.GetName] đang vô cùng phẫn nộ trước việc chúng ta từ chối xin lỗi vì đã che lấp ngôi sao trung tâm chòm sao của họ. Dù chưa chính thức liên hệ với chúng ta về vấn đề này, [dysonsphere_builder.GetRulerTitle] vẫn bóng gió bày tỏ sự thất vọng của nhân dân nước họ trong một bài phát biểu."
# utopia.40.a: "Thật đáng tiếc."
# utopia.40.b: "Chẳng liên quan đến chúng ta."
# utopia.51.name: "Suối nguồn tươi trẻ"
# utopia.51.desc: "Ban giám đốc Viện Liên hiệp Khoa học vô cùng hân hoan thông báo họ đã có cơ hội chiêu mộ được vị nghiên cứu viên lừng danh, Tiến sĩ Haxoli, người có nhiều thành tựu lớn trong lĩnh vực kéo dài tuổi thọ tự nhiên. Ông cùng đội ngũ của mình đang bào chế một loại huyết thanh giúp kéo dài tuổi thọ và hiện đã bước vào giai đoạn cuối, nhưng kinh phí nghiên cứu của họ đã cạn kiệt. Nếu thuê Tiến sĩ Haxoli lúc này, chúng ta sẽ không còn dư kinh phí để tiếp tục dự án nghiên cứu công nghệ sinh học do Tiến sĩ Gloric dẫn dắt, người đang định dùng siêu máy tính sinh học để tự động hóa quá trình nghiên cứu kỹ thuật."
# utopia.51.a: "Dùng 1000 điểm để chiêu mộ Tiến sĩ Haxoli."
# utopia.51.b: "Ưu tiên hoàn thành nghiên cứu của Tiến sĩ Gloric."
# utopia.51.c: "Hiện tại chúng ta không đủ khả năng thuê Tiến sĩ Haxoli."
# utopia.54.name: "Nảy sinh nghi ngờ"
# utopia.54.desc: "Tiến sĩ Haxoli và đội ngũ của ông tuần này đã trình bày kết quả nghiên cứu. Loại huyết thanh họ chế tạo, nếu bôi lên da, sẽ kích thích tái tạo tế bào ở mức chưa từng thấy. Tất cả là nhờ một thành phần kỳ diệu được chiết xuất từ [ointment_name.GetName]. Tuy nhiên, thật đáng tiếc là một số nhân viên đã phàn nàn về việc Tiến sĩ Haxoli nhận thêm kinh phí, Tiến sĩ Gloric thậm chí còn tức giận gọi Haxoli là kẻ lừa đảo. Tiến sĩ Gloric muốn tiến hành điều tra ngầm Haxoli và xin cấp 500 điểm làm kinh phí điều tra. Nếu Haxoli phát hiện Gloric đang điều tra mình, ông ta có thể tức giận mà bỏ đi."
# utopia.54.a: "Cáo buộc của Tiến sĩ Gloric thật vô căn cứ."
# utopia.54.b: "Để an toàn, cứ điều tra thử xem sao."
# utopia.54.c: "Chúng ta làm gì có ngân sách dư dả để bày trò điều tra ngầm cơ chứ."
# utopia.55.name: "Tinh chất [ointment_name.GetName]"
# utopia.55.desc: "Tiến sĩ Gloric đã điều tra Haxoli và phát hiện ra một số chuyện rất thú vị. Hóa ra Tiến sĩ Haxoli không chỉ phóng đại tác dụng thực tế của huyết thanh, mà còn giấu giếm sự thật rằng huyết thanh này chỉ có tác dụng ngắn hạn. Hơn nữa, nếu lạm dụng sẽ gây ra tác dụng phụ vĩnh viễn không thể đảo ngược. Thành phần kỳ diệu để chế tạo huyết thanh được chiết xuất từ tuyến nội tiết của một sinh vật trong hệ sao [ointment_name.GetName], và sinh vật này lại chính là [target_country.GetSpeciesName] của [target_country.GetName]. Haxoli đã đem đông lạnh ngủ đông vài người [target_country.GetSpeciesAdj] để đảm bảo nguồn cung cấp nguyên liệu cần thiết cho huyết thanh. Nếu chuyện này bị vỡ lở, quan hệ ngoại giao giữa nước ta và quốc gia của sinh vật đó sẽ trở nên tồi tệ."
# utopia.55.a: "Đình chỉ nghiên cứu và bắt giữ Haxoli, không được để ai khác biết chuyện này."
# utopia.55.b: "Ra lệnh cho Gloric không được tiết lộ chuyện này, và đặt tên sản phẩm nghiên cứu là kem chống lão hóa."
# utopia.55.b.tooltip: "Chỉ cần quảng bá đủ mạnh, sản phẩm này có thể mang lại lợi nhuận khổng lồ trong thời gian ngắn."
# utopia.56.name: "Suối nguồn tươi trẻ"
# utopia.56.desc: "Thật đáng tiếc, gã Tiến sĩ Haxoli bí ẩn đó đã trốn thoát khỏi tay chúng ta, bỏ lại toàn bộ đội ngũ và mẫu vật thử nghiệm. Những người [target_country.GetSpeciesNamePlural] đã được đánh thức, họ hoàn toàn không nhớ gì về những chuyện đã trải qua. Về phần Haxoli, rất có thể hắn đã tẩu thoát đến một hệ sao xa xôi nào đó, thay tên đổi họ và định tiếp tục đi lừa đảo. Hy vọng lần sau chúng ta sẽ tóm được hắn trước khi hắn chuồn mất. Đội ngũ nghiên cứu dưới quyền Haxoli cũng bị hắn lừa gạt như chúng ta, để chuộc lại lỗi lầm, nhiều người trong số họ mong muốn được gia nhập Viện Liên hiệp Khoa học."
# utopia.56.a: "Không thể tin tưởng bọn họ được."
# utopia.56.b: "Chào mừng họ gia nhập cùng chúng ta."
# utopia.56.c: "Rõ ràng họ không phải là những nghiên cứu viên thông minh nhất dải ngân hà..."
# utopia.57.name: "Suối nguồn của cải"
# utopia.57.desc: "Với cái tên 'Mãi mãi thanh xuân' khi tung ra thị trường, tinh chất [ointment_name.GetName] đã nhanh chóng càn quét khắp dải ngân hà. Nhờ nhà phát minh đầy sức hút và chiến dịch quảng bá rầm rộ, giờ đây loại kem kỳ diệu 'sinh học' mới nhất này đã xuất hiện ở mọi ngóc ngách của ngân hà. Giới thượng lưu ở mọi hệ sao đều đang dùng 'Mãi mãi thanh xuân' để làm chậm quá trình lão hóa. Còn về việc làm sao để có đủ tuyến nội tiết của người [target_country.GetSpeciesAdj] nhằm sản xuất huyết thanh quy mô lớn, thì chẳng ai hay biết..."
# utopia.57.a: "Không biết gì lại là một niềm hạnh phúc."
# utopia.58.name: "Tinh chất vô dụng"
# utopia.58.desc: "Haxoli đã biến mất, hắn ta mang theo toàn bộ kết quả nghiên cứu và chỉ để lại đám nhân viên đang ngơ ngác chẳng hiểu chuyện gì. Đội ngũ của Haxoli cũng bị hắn lừa như chúng ta. Dù tất cả đều cho rằng Haxoli là một thiên tài với nhân cách tuyệt vời, một lãnh đạo vô tư sẵn sàng cống hiến mọi thứ cho đội, nhưng họ lại chẳng đưa ra được bằng chứng nào về thành tựu thực sự của hắn. Cáo buộc của Tiến sĩ Gloric rằng Haxoli là kẻ lừa đảo rốt cuộc có đúng hay không thì chẳng ai rõ. Chúng ta cũng không biết liệu Haxoli có đem bán kết quả nghiên cứu cho quốc gia nào trả giá cao hơn không. Tất nhiên, nếu hắn dám giở trò tương tự ở các hệ sao khác, chúng ta nhất định sẽ tóm được hắn."
# utopia.58.a: "Tên khốn này!"
# utopia.59.intro: "Tiến sĩ Gloric và đội ngũ của cô đã phát minh ra một ngân hàng mạng nơ-ron — một máy tính sinh học có thể tận dụng tối đa ý thức tập thể của tất cả bộ não được tải lên bộ nhớ của nó, giúp đẩy nhanh đáng kể tiến độ nghiên cứu của chúng ta. Nhưng có một nhược điểm: để hoạt động bình thường, mọi bộ não tải lên ngân hàng mạng nơ-ron phải được tách khỏi cơ thể và đặt trong bình dung dịch dẫn điện. Vì cơ thể chúng ta không thể sống thiếu não, nên những ai muốn gia nhập ngân hàng mạng nơ-ron buộc phải từ bỏ hoàn toàn thể xác của mình."
# utopia.59.name: "Ngân hàng mạng nơ-ron"
# utopia.59.desc: "$utopia.59.intro$Đúng như dự đoán, rất hiếm người tình nguyện tham gia vào ngân hàng mạng nơ-ron. Hiện tại chỉ có một tình nguyện viên duy nhất — đó chính là trưởng ban khoa học [volunteer_leader.GetName]."
# utopia.59.a: "Tải bộ não của [volunteer_leader.GetName] lên Viện Liên hiệp Khoa học."
# utopia.59.a.tooltip: "Viện Liên hiệp Khoa học từ nay sẽ sản xuất thêm §Y5§!£physics §Y5§!£society §Y5§!£engineering."
# utopia.59.b: "Làm vậy thì quá vô đạo đức."
# utopia.59.c: "Không được, [volunteer_leader.GetName] còn có những trọng trách khác phải làm."
# utopia.60.name: "Ngân hàng mạng nơ-ron"
# utopia.60.desc: "$utopia.59.intro$Đúng như dự đoán, rất hiếm người tình nguyện tham gia vào ngân hàng mạng nơ-ron. Hiện tại chỉ có một tình nguyện viên duy nhất — đó là một nữ nghiên cứu viên trẻ xuất sắc trong đội của Gloric. Nhưng cô ấy đã có gia đình, nên yêu cầu khoản tiền đền bù 1000 năng lượng cho người thân."
# utopia.60.a: "Thật không may là chúng ta không đủ ngân sách để trả cho gia đình cô ấy."
# utopia.60.b: "Yêu cầu này rất hợp lý."
# utopia.60.c: "Làm vậy thì quá vô đạo đức."
# utopia.62.name: "[abducted_leader.GetName]"
# utopia.62.desc: "Vừa nãy, toàn bộ nghiên cứu viên ở bộ phận vật lý của Viện Liên hiệp Khoa học đã ngất đi trong vòng 15 phút. Khi tỉnh lại, họ phát hiện trưởng ban nghiên cứu vật lý [abducted_leader.GetName] đã mất tích. Văn phòng của [abducted_leader.GetHerHis] bị lục tung, kho lưu trữ bị dọn sạch và thiết bị lưu trữ cũng bị phá hủy. Các đồng nghiệp cho rằng đó là nơi [abducted_leader.GetSheHe] cất giữ dữ liệu dự án nghiên cứu cá nhân. Dù [abducted_leader.GetHerHis] luôn kín tiếng về dự án này, nhưng ai cũng tin rằng [abducted_leader.GetSheHe] sắp đạt được một bước đột phá lớn. Vài nghiên cứu viên kể lại rằng trước khi ngất xỉu, họ thấy một tia sáng tím chói lóa, ngoài ra không có thêm thông tin hữu ích nào, và chúng ta không có cách nào biết được vị trí hiện tại của [abducted_leader.GetHerHis]."
# utopia.62.a: "Tiếp tục tìm kiếm"
# utopia.63.name: "[abducted_leader.GetName]"
# utopia.63.desc: "Sáng nay, các nghiên cứu viên của Viện Liên hiệp Khoa học đã tìm thấy trưởng ban vật lý mất tích [abducted_leader.GetName] ở nhà ăn, lúc đó [abducted_leader.GetSheHe] đang ăn sáng như thể chưa có chuyện gì xảy ra. [abducted_leader.GetSheHeCap] nói rằng mình vừa thức dậy trên giường và không hề nhớ chuyện từng rời khỏi Viện Khoa học. Nhưng một số đồng nghiệp lại tỏ ra lo lắng, họ nói [abducted_leader.GetSheHe] khiến những người xung quanh cảm thấy rất khó chịu và cho rằng [abducted_leader.GetSheHe] đang giả vờ mất trí nhớ. Từ lúc quay lại, [abducted_leader.GetSheHeCap] dường như có hiểu biết cực kỳ sâu sắc về những lĩnh vực mà trước đây [abducted_leader.GetHerHim] không rành, và hiện đang chờ được phân công nhiệm vụ."
# utopia.63.a: "[abducted_leader.GetSheHeCap] có thể trở thành một trợ thủ đắc lực cho chúng ta."
# utopia.63.b: "[abducted_leader.GetSheHeCap] có thể mang lại nguy hiểm cho người khác."
# utopia.64.desc: "$utopia.59.intro$Đúng như dự đoán, rất hiếm người tình nguyện tham gia vào ngân hàng mạng nơ-ron. Hiện tại chỉ có một tình nguyện viên duy nhất — đó chính là trưởng ban khoa học [volunteer_leader.GetName]."
# utopia.80.name: "Xây dựng Viện Liên hiệp Khoa học"
# utopia.80.desc: "Chúng ta hiện đang khởi công đại dự án Viện Liên hiệp Khoa học. Nền móng đã được đóng xong, bước tiếp theo là chuẩn bị lắp đặt các khu nhà chính. Những công nghệ tối tân mang tính thời đại và những phát minh chưa từng có đang chờ đón chúng ta phía trước. Dù con đường sẽ chông gai, nhưng chúng ta đã bước đi những bước vững chắc đầu tiên. Phải chăng những bí ẩn vô tận của vũ trụ rồi sẽ nằm gọn trong lòng bàn tay chúng ta?"
# utopia.80.a: "Tương lai thuộc về chúng ta."
# utopia.82.name: "Siêu kiến trúc ngoài hành tinh"
# utopia.82.desc.a: "[From.GetName] đã chấp nhận thử thách xây dựng Viện Liên hiệp Khoa học, một trung tâm nghiên cứu tiên tiến đủ sức làm nên một cuộc cách mạng trong lĩnh vực khoa học.\n\nTại hệ sao [think_tank_system.GetName], các kỹ sư đang tất bật lắp ráp khu vực thi công ban đầu. Dù thành hay bại, nỗ lực này cũng đủ để họ ghi tên mình vào hàng ngũ những người mở đường cho một kỷ nguyên vĩ đại."
# utopia.82.desc.b: "[From.GetName] lại bắt tay vào việc xây dựng một Viện Liên hiệp Khoa học khác, lần này là ở hệ sao [think_tank_system.GetName]."
# utopia.82.a: "Đó chính là sự tài hoa của sinh vật có trí tuệ."
# utopia.82.b: "Vẫn như mọi khi, họ lại với tay quá xa rồi."
# utopia.82.c: "Hủy diệt hoàn toàn [From.GetSpeciesNamePlural]..."
# utopia.83.name: "Khu vực chính của Viện Liên hiệp Khoa học đã hoàn thành"
# utopia.83.desc: "Khu vực chính của Viện Liên hiệp Khoa học đã xây xong và được trang bị lò phản ứng điểm kỳ dị với công nghệ hiện đại nhất. Các kỹ sư đang chuẩn bị cho bước tiếp theo, đó là xây dựng bốn phòng nghiên cứu – phần khó khăn nhất của toàn bộ cơ sở. Chúng sẽ được trang bị những công nghệ tiên tiến nhất để chống lại nhiệt độ cao, áp suất lớn và các mầm bệnh ngoại lai. Những phòng nghiên cứu này cũng sẽ là nơi sinh sống của rất nhiều nghiên cứu viên của chúng ta."
# utopia.83.a: "Chúng ta đã bỏ ra công sức khổng lồ và vô số thời gian để cuối cùng đạt được bước tiến này."
# utopia.85.name: "Phòng nghiên cứu Viện Liên hiệp Khoa học"
# utopia.85.desc: "Mô-đun đầu tiên của bốn phòng nghiên cứu đã được vào vị trí. Nghiên cứu viên và nhân viên đã dọn vào khu vực sinh hoạt của họ. Bước thi công tiếp theo sẽ mở rộng các phòng này, bổ sung thêm bốn khu thí nghiệm chuyên dùng cho các nghiên cứu nguy hiểm nhất. Để đảm bảo an toàn cho nhân viên, chúng ta áp dụng các biện pháp an ninh vô cùng nghiêm ngặt."
# utopia.85.a: "Sẽ sớm hoàn thành thôi..."
# utopia.84.name: "Xây dựng Viện Liên hiệp Khoa học hoàn tất"
# utopia.84.desc.a: "Hôm nay, chúng ta ăn mừng Viện Liên hiệp Khoa học chính thức khánh thành. Với cơ sở vật chất nghiên cứu vô song cùng những công nghệ cực kỳ tân tiến, chúng ta có thể tập hợp những bộ óc xuất chúng nhất trên toàn đế chế, thậm chí là toàn vũ trụ, về Viện khoa học này. Ngày hôm nay sẽ đánh dấu sự khởi đầu của một kỷ nguyên khai sáng khoa học mới. Đây là một ngày trọng đại, xứng đáng được ghi vào biên niên sử của giống loài chúng ta."
# utopia.84.desc.b: "Hôm nay chúng ta ăn mừng một Viện Liên hiệp Khoa học nữa được khánh thành. Việc xây dựng thành công Viện Liên hiệp Khoa học thứ hai này chắc chắn sẽ mang lại cho chúng ta danh hiệu người đi đầu trong giới khoa học vũ trụ. Công nghệ khoa học đỉnh cao sẽ giúp chúng ta viết nên một tương lai tươi sáng hơn."
# utopia.84.a: "Đúng là như vậy."
# utopia.86.name: "Siêu kiến trúc ngoài hành tinh đã hoàn thành"
# utopia.86.desc: "[From.GetName] đã xây xong Viện Liên hiệp Khoa học. Bọn họ coi mình là những người đi tiên phong trong lĩnh vực khoa học công nghệ vũ trụ và tỏ ra khinh khỉnh với tất cả những ai dám nghi ngờ. Chúng ta cần phải cảnh giác cao độ với họ. Có sự trợ giúp của Viện Liên hiệp Khoa học, công nghệ của họ chắc chắn sẽ thăng tiến vượt bậc, mang lại cho họ lợi thế khổng lồ so với các nền văn minh khác."
# utopia.86.a: "Chúng ta tuyệt đối không thể để họ bỏ lại phía sau."
# utopia.155.name: "Tụ tập nô lệ trên [event_target:revolt_planet.GetName]"
# utopia.155.desc: "Những cuộc gặp gỡ bí mật trong đêm, sự phản kháng ngày càng leo thang đối với quản đốc, hay lượng hàng hóa thường xuyên thất thoát... tất cả đều chỉ ra một điểm: Nô lệ trên [event_target:revolt_planet.GetName] đang ngày càng quá khích. Họ không ngừng lan truyền sự bất mãn và tư tưởng phản loạn cho đồng bào của mình, khiến người dân nước ta thêm phần hoang mang và sợ hãi. Bất luận mục đích thực sự của họ là gì, chắc chắn chuyện này sẽ mang lại bất lợi cực lớn cho chúng ta."
# utopia.155.a: "Phải hành động ngay lập tức."
# utopia.156.name: "Phá hoại trên [event_target:revolt_planet.GetName]"
# utopia.156.desc: "Trong một đợt nổi loạn quá khích, các nô lệ trên [event_target:revolt_planet.GetName] đã dùng chất nổ tự chế để phá hủy nhà máy. Dù vụ nổ xảy ra vào ban đêm, nhưng bọn chúng đã kích hoạt báo động để dụ các quản đốc đến nhà máy rồi kích nổ tiêu diệt. Cuộc tấn công này được dàn xếp rất công phu và thực hiện một cách hoàn hảo. Không rõ kẻ chủ mưu là ai, nhưng chắc chắn hắn đã tốn nhiều tháng trời để chuẩn bị cẩn thận cho vụ tấn công này."
# utopia.156.a: "Phải trừng trị hành vi phản nghịch của chúng."
# utopia.156.b: "Chúng ta phải giải quyết các tranh chấp giữa hai bên."
# utopia.159.name: "Tuyệt thực bãi công trên [event_target:revolt_planet.GetName]"
# utopia.159.desc: "Nô lệ trên [event_target:revolt_planet.GetName] không thể chịu đựng thêm nữa, bọn họ bắt đầu tuyệt thực để phản đối. Theo thông tin nhận được, một lượng lớn nô lệ từ chối ăn uống và yêu cầu chúng ta phải xóa bỏ chế độ nô lệ trên toàn hành tinh. Chúng ta đã cố ép họ ăn nhưng không thành. Hành động tuyệt thực của nô lệ sẽ gây ra hậu quả vô cùng tiêu cực, vì thiếu dinh dưỡng sẽ làm giảm năng suất làm việc của họ nghiêm trọng."
# utopia.159.a: "Vậy thì cứ để chúng chết đói đi."
# utopia.159.b: "Chúng ta phải giải quyết vấn đề này."
# utopia.157.name: "Bạo động nô lệ trên [event_target:revolt_planet.GetName]"
# utopia.157.desc: "Nô lệ trên [event_target:revolt_planet.GetName] đã làm phản! Bọn chúng lên kế hoạch tấn công tỉ mỉ và quân khởi nghĩa đã hoàn toàn đánh bại chính quyền địa phương. Hiện tại hành tinh đang chìm trong bạo loạn. Đám nô lệ chia bè kết phái, mang theo đủ loại vũ khí nguy hiểm tràn ra đường đập phá, cướp bóc và tấn công bất cứ ai dám cản đường chúng."
# utopia.157.a: "Bọn chúng thật sự quá quắt rồi."
# utopia.157.b: "Có vẻ như chúng ta nên thay đổi chiến lược."
# utopia.160.name: "Khởi nghĩa nô lệ trên [event_target:revolt_planet.Planet.GetName]"
# utopia.160.desc: "Toàn bộ nô lệ trên [event_target:revolt_planet.Planet.GetName] đã đoàn kết lại và công khai khởi nghĩa chống lại chính quyền địa phương. Tình hình leo thang nhanh chóng, đám nô lệ đồng loạt tấn công và phá hủy thành công nhiều mục tiêu quan trọng. Giờ chỉ còn xem quân đội của chúng ta có đánh bại được đám nô lệ này không, nếu thất bại, chúng ta sẽ mất hoàn toàn [event_target:revolt_planet.Planet.GetName]."
# utopia.160.a: "Nghiền nát cuộc nổi loạn của chúng!"
# utopia.160.a.tooltip: "Lực lượng nô lệ nổi loạn đang âm mưu chiếm đóng toàn bộ hành tinh."
# utopia.161.name: "Trấn áp khởi nghĩa"
# utopia.161.desc: "Chúng ta đã dập tắt thành công cuộc nổi loạn trên [event_target:revolt_planet.Planet.GetName]. Những binh sĩ dũng cảm của chúng ta đã thiết lập lại cứ điểm tại các cơ sở then chốt và vãn hồi trật tự địa phương. Việc tiếp theo là xây dựng lại những cơ sở bị nô lệ phá hủy. Chắc chắn trong thời gian ngắn sắp tới, bọn chúng sẽ không dám chống lại chúng ta nữa."
# utopia.161.a: "Từ nay chúng sẽ an phận giữ mình thôi."
# utopia.161.b: "Mọi việc lại đi đến bước đường này, thật đáng tiếc."
# utopia.161.a.tooltip: "Chừng nào chỉ số thay đổi của việc trấn áp nổi loạn còn tồn tại, ký ức về cuộc cách mạng thất bại sẽ kìm hãm ý định phản kháng của chúng."
# utopia.163.name: "Chấm dứt chế độ nô lệ"
# utopia.163.desc: "Sau khi xóa bỏ chế độ nô lệ trên [event_target:revolt_planet.Planet.GetName], tình hình bạo loạn đã dần lắng xuống. Giờ đây người dân đã có thể quay lại cuộc sống bình yên."
# utopia.165.name: "Nô lệ đã bị trấn áp"
# utopia.165.desc: "Những phần tử quá khích trên [event_target:revolt_planet.Planet.GetName] đã bị trấn áp, các nô lệ cũng đã quay lại làm việc."
# utopia.165.a: "Quay lại làm việc đi..."
# utopia.167.name: "[event_target:revolt_planet.Planet.GetName] thất thủ"
# utopia.167.desc: "Chuyện không lường trước đã xảy ra. Quân đội của chúng ta trên [event_target:revolt_planet.Planet.GetName] đã bị phiến quân nô lệ đánh bại. Bọn chúng đã tuyên bố độc lập và tàn nhẫn hành quyết những công dân trung thành với chúng ta. Đây là ngày đen tối nhất trong lịch sử của người [From.GetSpeciesName]."
# utopia.167.a: "Ngày đại quân đế chế giáng lâm sẽ là lúc quét sạch quân phản loạn."
# utopia.167.b: "Có lẽ đây là ý trời..."
# utopia.168.name: "[rebel_country.GetName]"
# utopia.168.desc: "Xin chào, những người [Root.GetSpeciesName]. Chúng tôi từng là nô lệ trên [event_target:old_owner.GetName], nhưng giờ đây đã trở thành những chiến binh tự do. Chúng tôi đã chịu đủ mọi đắng cay và áp bức từ [event_target:old_owner.GetRulerTitle] [event_target:old_owner.GetRulerName], nên vô cùng ngưỡng mộ sự bình đẳng của [event_target:new_owner.GetSpeciesAdj] các vị. Thú thật với các vị, ngay từ lúc còn ở quê nhà, chúng tôi đã rất tôn sùng và khao khát những giá trị đó. Hiện tại, chúng tôi đã thoát khỏi ách bạo tàn và giành được độc lập, rất mong được gia nhập đất nước của các vị, xin hãy đồng ý!"
# utopia.168.a: "Tiếp nhận các bạn. Ở nơi chúng tôi, mọi người đều bình đẳng."
# utopia.168.a.tooltip: "Thông báo cho [event_target:old_owner.GetName] rằng những cựu nô lệ này từ nay sẽ là công dân của chúng ta."
# utopia.168.b: "Chúng ta không cần thêm hành tinh nào khác."
# utopia.169.desc: "Truyền đi một thông báo: Các chiến binh tự do của [event_target:revolt_planet.GetName] đã gia nhập quốc tịch của chúng ta và được hưởng đầy đủ quyền công dân, bao gồm cả sự bảo hộ. Tuyệt đối không cho phép các người chà đạp họ thêm nữa."
# utopia.169.a: "Cút đi."
# utopia.169.b: "Chúng ta sẽ chà đạp luôn cả các người."
# utopia.169.c: "Xin chúc mừng. Cục nợ này nay thuộc về các vị rồi."
