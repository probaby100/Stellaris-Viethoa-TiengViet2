l_simp_chinese:
 # Tên và mô tả đặc điểm của Ý thức Chung
 leader_trait_fallible_hive: "Liên Tục Mắc Lỗi"
 leader_trait_fallible_hive_desc: "[GetIndividualName] này thường xuyên mắc những sai sót nhỏ, về sau có thể dẫn đến hậu quả nghiêm trọng."
 leader_trait_fallible_machine: "Lỗi Hệ Thống"
 leader_trait_fallible_machine_desc: "Đơn vị này có một vài khiếm khuyết nhỏ, về sau có thể dẫn đến hậu quả nghiêm trọng."
 leader_trait_stubborn_machine: "Lập Trình Cứng Nhắc"
 leader_trait_stubborn_machine_desc: "Chương trình của đơn vị này vô cùng cứng nhắc, rất khó để tự động tối ưu hóa hành vi."
 leader_trait_stubborn_hive: "Khớp Thần Kinh Cứng Nhắc"
 leader_trait_stubborn_hive_desc: "Cách suy nghĩ của [owner.GetIndividualName] này cực kỳ cứng nhắc, không thể tiếp thu bất kỳ thay đổi hành vi nào."
 leader_trait_destructive_hive_desc: "[owner.GetIndividualName] này đã bỏ qua việc bảo trì thiết bị định kỳ, từ đó gây ra nhiều sự cố nghiêm trọng."
 leader_trait_destructive_machine_desc: "Đơn vị này dường như không nhận ra thiết bị cần được bảo trì định kỳ để hoạt động bình thường, từ đó gây ra nhiều sự cố nghiêm trọng."
 leader_trait_lavish_lifestyle_hive: "Tiêu Tốn Dưỡng Chất"
 leader_trait_lavish_lifestyle_hive_desc: "Hành vi của [owner.GetIndividualName] này rất rối loạn, khiến chi phí nuôi dưỡng hàng ngày tăng vọt."
 leader_trait_lavish_lifestyle_machine: "Chi Phí Bảo Trì Cao"
 leader_trait_lavish_lifestyle_machine_desc: "Chương trình của đơn vị này có vài lỗi, khiến chi phí bảo trì đội lên rất nhiều."
 leader_trait_tyrannical_hive: "Phân Phát Khắc Khe"
 leader_trait_tyrannical_hive_desc: "Điểm nút này quá ám ảnh với việc phân bổ tài nguyên."
 leader_trait_tyrannical_machine: "Phân Phát Khắc Khe"
 leader_trait_tyrannical_machine_desc: "Đơn vị này quá ám ảnh với việc phân bổ tài nguyên."
 leader_trait_righteous_hive: "Thanh Lọc Lỗi"
 leader_trait_righteous_hive_desc: "[owner.GetIndividualName] này có khả năng chống lại sự tha hóa, giúp hạn chế các hành vi bất thường bên trong [owner.GetGestaltEntityName]."
 leader_trait_righteous_machine: "Vá Lỗi Định Kỳ"
 leader_trait_righteous_machine_desc: "Đơn vị này thường xuyên cập nhật bản vá lỗi cho các đơn vị khác."
 leader_trait_embezzler_hive: "Lãng Phí Năng Lượng"
 leader_trait_embezzler_hive_desc: "[owner.GetIndividualName] này có những bất thường về mặt sinh lý, dẫn đến tiêu hao năng lượng không cần thiết."
 leader_trait_embezzler_machine: "Tiêu Hao Năng Lượng"
 leader_trait_embezzler_machine_desc: "Hệ thống của đơn vị này bị lỗi, khiến nó ngốn nhiều năng lượng hơn so với mức bình thường."
 leader_trait_gullible_hive: "Rò Rỉ Thông Tin"
 leader_trait_gullible_hive_desc: "Bản tính quá dễ dãi của điểm nút này đã tạo ra lỗ hổng an ninh nghiêm trọng."
 leader_trait_gullible_machine: "Rò Rỉ Dữ Liệu"
 leader_trait_gullible_machine_desc: "Hệ điều hành của điểm nút này có nhiều lỗ hổng an ninh lớn."
 leader_trait_bureaucratic_hive: "Nhiễu Sóng Giao Tiếp"
 leader_trait_bureaucratic_hive_desc: "Điểm nút này rất dễ bị rớt mạng khi kết nối với các [owner.GetIndividualNamePlural] thuộc ý thức chung của toàn quốc gia."
 leader_trait_bureaucratic_machine: "Lỗi Truyền Tải"
 leader_trait_bureaucratic_machine_desc: "Điểm nút này hay gặp lỗi truyền dữ liệu khi kết nối với các drone khác trong đế quốc."
 leader_trait_micromanager_hive: "Kém Điều Phối"
 leader_trait_micromanager_hive_desc: "[owner.GetIndividualName] này tỏ ra quá sức khi phải điều phối các hoạt động cơ động phức tạp của hạm đội."
 leader_trait_micromanager_machine: "Mô-đun Điều Phối Kém"
 leader_trait_micromanager_machine_desc: "Đơn vị này tỏ ra quá sức khi phải điều phối các hoạt động cơ động phức tạp của hạm đội."
 leader_trait_reckless_hive: "Tính Toán Sai Lầm"
 leader_trait_reckless_hive_desc: "[owner.GetIndividualName] này thường đánh giá sai rủi ro khi hạm đội giao chiến, thay vì rút lui, sửa chữa và tập hợp lại như thông thường, nó lại chọn tiếp tục đâm đầu vào đánh."
 leader_trait_reckless_machine: "Lỗi Phân Tích Rủi Ro"
 leader_trait_reckless_machine_desc: "Đơn vị này thường đánh giá sai rủi ro khi hạm đội giao chiến. Thay vì làm theo lệnh rút lui, sửa chữa và tập hợp lại một cách có tính toán, nó lại chọn tiếp tục đâm đầu vào đánh."
 leader_trait_slipshod_hive: "Phòng Thủ Kém"
 leader_trait_slipshod_hive_desc: "[owner.GetIndividualName] này đã phát triển một kiểu tư duy chiến đấu thiếu ổn định và kém cỏi, làm suy yếu khả năng phòng ngự của hạm đội."
 leader_trait_slipshod_machine: "Phòng Thủ Kém"
 leader_trait_slipshod_machine_desc: "Đơn vị này đã sinh ra một chương trình chiến đấu thiếu ổn định và kém cỏi, làm suy yếu khả năng phòng ngự của hạm đội."
 leader_trait_slothful_hive: "Chiến Thuật Thụ Động"
 leader_trait_slothful_hive_desc: "[owner.GetIndividualName] này hành động chậm chạp và thiếu logic, thường xuyên đẩy quân đội vào những hiểm nguy không đáng có."
 leader_trait_slothful_machine: "Thuật Toán Chiến Đấu Lỗi"
 leader_trait_slothful_machine_desc: "Thuật toán của đơn vị này vừa lỗi vừa vô lý, thường xuyên đẩy đội quân cơ khí vào những hiểm nguy không đáng có."
 leader_trait_victory_or_death_hive: "Chiến Đấu Tới Cùng"
 leader_trait_victory_or_death_hive_desc: "[owner.GetIndividualName] này không bận tâm đến sống chết của bản thân, thề chiến đấu đến giọt máu cuối cùng."
 leader_trait_victory_or_death_machine: "Giao Thức Tử Chiến"
 leader_trait_victory_or_death_machine_desc: "Đơn vị này đang chạy một giao thức chiến đấu không được phép rút lui đã bị lỗi, sẽ chiến đấu đến bộ phận cơ khí cuối cùng."
 leader_trait_disorganized_hive: "Mệnh Lệnh Hỗn Loạn"
 leader_trait_disorganized_hive_desc: "Hành vi kỳ quái của [owner.GetIndividualName] này khiến các chỉ thị chiến thuật được đưa ra thiếu đi sự rõ ràng."
 leader_trait_disorganized_machine: "Lỗi Logic"
 leader_trait_disorganized_machine_desc: "Đơn vị này đang thực hiện các phép tính logic sai lầm, làm đội chi phí cho quân đội của chúng ta."
 leader_trait_paranoid_hive: "Chỉ Thị Mã Hóa"
 leader_trait_paranoid_hive_desc: "Điểm nút này dùng các kiểu mã hóa phức tạp để bảo mật thông tin, làm giảm tốc độ nghiên cứu."
 leader_trait_paranoid_machine: "Giao Thức Bảo Mật Thái Quá"
 leader_trait_paranoid_machine_desc: "Đơn vị này dùng các kiểu mã hóa phức tạp để bảo mật thông tin, làm giảm tốc độ nghiên cứu."
 leader_trait_narrow_minded_hive: "Tầm Nhìn Hạn Hẹp"
 leader_trait_narrow_minded_hive_desc: "[owner.GetIndividualName] này quá cắm cúi vào nhiệm vụ nghiên cứu hiện tại, bỏ qua luôn những lựa chọn mà nó cho là vô bổ."
 leader_trait_narrow_minded_machine: "Lỗi Máy Chủ"
 leader_trait_narrow_minded_machine_desc: "Máy chủ trung tâm hiện đang chạy cô lập một mình, khiến việc đưa ra quyết định trở nên rập khuôn."
 leader_trait_neurotic_hive: "Khám Phá Hỗn Loạn"
 leader_trait_neurotic_hive_desc: "Ý thức của [owner.GetIndividualName] này đang mất tập trung và khá bất ổn."
 leader_trait_neurotic_machine: "Giao Thức Khám Phá Lỗi"
 leader_trait_neurotic_machine_desc: "Giao thức khám phá của đơn vị này quá mức lộn xộn."
 leader_trait_opinionated_hive: "Xung Đột Khớp Thần Kinh"
 leader_trait_opinionated_hive_desc: "Khớp thần kinh của [owner.GetIndividualName] này đã bị đột biến, khiến nó gặp khó khăn trong việc tổng hợp và sắp xếp kiến thức."
 leader_trait_opinionated_machine: "Xung Đột Dữ Liệu"
 leader_trait_opinionated_machine_desc: "Hiệu suất tổng hợp dữ liệu của đơn vị này quá mức nghèo nàn."
 leader_trait_profligate_hive: "Đội Phí Nuôi Dưỡng"
 leader_trait_profligate_hive_desc: "Khuyết tật tiềm ẩn của [owner.GetIndividualName] này làm tăng chi phí nuôi dưỡng cho các [owner.GetIndividualNamePlural] khác trên hành tinh."
 leader_trait_profligate_machine: "Đội Phí Bảo Trì Drone"
 leader_trait_profligate_machine_desc: "Đơn vị này mắc một lỗi lập trình cố hữu, làm đội chi phí bảo trì cho các drone khác trên hành tinh."
 leader_trait_procrastinator_hive: "Quy Hoạch Chậm Chạp"
 leader_trait_procrastinator_hive_desc: "[owner.GetIndividualName] này làm việc rất kém hiệu quả khi lên kế hoạch xây dựng trên hành tinh."
 leader_trait_procrastinator_machine: "Quy Hoạch Chậm Chạp"
 leader_trait_procrastinator_machine_desc: "Đơn vị này xử lý rất kém cỏi khi lên kế hoạch xây dựng trên hành tinh."
 leader_trait_insider_trading_hive: "Sản Lượng Kém"
 leader_trait_insider_trading_hive_desc: "[owner.GetIndividualName] này cực kỳ yếu kém trong việc quản lý các [owner.GetIndividualNamePlural] khác trên hành tinh."
 leader_trait_insider_trading_machine: "Sản Lượng Drone Kém"
 leader_trait_insider_trading_machine_desc: "Đơn vị này quản lý drone trên hành tinh rất kém hiệu quả."
 leader_trait_eager_machine: "Cỗ Máy Bền Bỉ"
 leader_trait_eager_machine_desc: "Cấu tạo của đơn vị này rất chắc chắn, không cần bảo trì nhiều vẫn chạy êm ru."
 leader_trait_eager_hive: "Cá Thể Bền Bỉ"
 leader_trait_eager_hive_desc: "[owner.GetIndividualName] này cực kỳ khỏe mạnh, không cần nuôi dưỡng nhiều vẫn làm việc hăng say."
 leader_trait_martinet_hive: " Trung Tâm Giám Sát"
 leader_trait_martinet_hive_desc: "Một [owner.GetIndividualName] có tư duy nhạy bén, hiếm khi để lọt lỗi trong việc ép tuân thủ mệnh lệnh và hạn chế các hành vi lệch chuẩn."
 leader_trait_martinet_machine: "Mô-đun Giám Sát"
 leader_trait_martinet_machine_desc: "Nhờ vào năng lực theo dõi vượt trội, drone này hiếm khi để lọt lỗi trong việc ép tuân thủ mệnh lệnh và hạn chế các hành vi lệch chuẩn."
 trait_ruler_charismatic_hive: "Nơ-ron Khuyếch Đại Tín Hiệu"
