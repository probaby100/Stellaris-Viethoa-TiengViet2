 opinion_mirrored_empire: "Họ Hàng Gần"
 personality_mirrored_empire_default: "Đế Chế Phản Chiếu"
 personality_mirrored_empire_default_desc: "Chúng ta đã chạm trán với đế chế này ở phía bên kia của một nứt gãy không gian. Đó là một phiên bản không gian khác của chính quốc gia chúng ta, và cũng là một hồi chuông cảnh báo về tương lai mà chúng ta có thể phải đối mặt."
