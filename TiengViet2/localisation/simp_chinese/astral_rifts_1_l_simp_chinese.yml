 personality_mirrored_empire_spiritualist_desc: "$personality_mirrored_empire_default_desc$"
 fractured_ambassadors_modifier: "Đại Sứ Mảnh Vỡ"
 fractured_ambassadors_modifier_desc: "Tập thể phản chiếu mà chúng ta gặp trong chiều không gian tồn tại trong một trạng thái ý thức bị phân mảnh, nhưng có thể giúp chúng ta đàm phán với các dạng sống tương tự khác."
 fractured_ambassadors_modifier_tt: "§G+20§! phần thưởng đánh giá ngoại giao từ các Đế chế phi định dạng"
 triggered_opinion_fractured_ambassadors: "$fractured_ambassadors_modifier$"
 triggered_opinion_fractured_ambassadors_desc: "$fractured_ambassadors_modifier_desc$"
 astral_rift.1600.name: "Bóng Trong Gương"
 astral_rift.1600.desc.1: "Ở đầu bên kia của nứt gãy, chúng ta phát hiện một cấu trúc giống với căn cứ sao của mình. Khi §Y$tech_rift_sphere$§! vừa đến gần, chúng ta đã nhận được vô số lời chào hỏi bằng nhiều ngôn ngữ và trên nhiều băng tần. Đáng ngạc nhiên là, đó lại là ngôn ngữ của chính chúng ta.\n\nNgười tiếp đón chúng ta cũng ngạc nhiên không kém khi chúng ta nói ngôn ngữ của họ. Nhưng sau một cuộc trò chuyện lịch sự ngắn gọn, chúng ta phát hiện khu vực không gian này là một nền văn minh du hành vũ trụ khá giống chúng ta. Họ tự xưng là [mirrored_empire.GetName]."
 astral_rift.1600.desc.2: "Những người này mang lại một cảm giác vừa quen thuộc vừa xa lạ, khiến người ta có chút bất an. Chúng ta có lẽ có thể hợp tác với họ, nhưng liệu chúng ta có thể tin tưởng những người phản chiếu này không?"
 astral_rift.1600.desc.authoritarian: "$astral_rift.1600.desc.1$Họ chia sẻ nhiều triết lý giống chúng ta, ngoại trừ một điểm: chúng ta tin rằng nhu cầu của xã hội cao hơn nhiều so với ham muốn cá nhân, còn họ lại dung túng cho hành vi hỗn loạn của đám đông ích kỷ.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.egalitarian: "$astral_rift.1600.desc.1$Họ chia sẻ nhiều triết lý giống chúng ta, ngoại trừ một điểm: chúng ta biết rằng công bằng xã hội là nền tảng của sự thịnh vượng, còn họ lại cho phép nhà nước kiểm soát mọi mặt đời sống của người dân.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.materialist: "$astral_rift.1600.desc.1$Họ chia sẻ nhiều triết lý giống chúng ta, ngoại trừ một điểm: chúng ta đã rũ bỏ mê tín, nhưng họ vẫn giữ lấy hệ thống đức tin ngây thơ của mình.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.spiritualist: "$astral_rift.1600.desc.1$Họ chia sẻ nhiều triết lý giống chúng ta, ngoại trừ một điểm: chúng ta đã nhìn thấu hồng trần, còn họ vẫn còn u mê không chịu tỉnh ngộ.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.militarist: "$astral_rift.1600.desc.1$Họ chia sẻ nhiều triết lý giống chúng ta, ngoại trừ một điểm: chúng ta hiểu được sự quý giá của lòng dũng cảm và tính kỷ luật, còn họ lại cho rằng sự anh dũng mạnh mẽ đã là dĩ vãng.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.pacifist: "$astral_rift.1600.desc.1$Họ chia sẻ nhiều triết lý giống chúng ta, ngoại trừ một điểm: chúng ta đã từ bỏ chiến tranh, còn họ vẫn đắm chìm trong kỷ luật mang tính phá hoại của bá quyền quân sự.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.xenophile: "$astral_rift.1600.desc.1$Họ chia sẻ nhiều triết lý giống chúng ta, ngoại trừ một điểm: chúng ta tìm kiếm sự hợp tác, còn họ lại tự cô lập mình với toàn bộ thiên hà.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.xenophobe: "$astral_rift.1600.desc.1$Họ chia sẻ nhiều triết lý giống chúng ta, ngoại trừ một điểm: chúng ta đặt ưu tiên cho người dân của mình lên hàng đầu, còn họ lại có sự ngây thơ đến nực cười về việc thân cận với nền văn minh ngoài hành tinh.\n\n$astral_rift.1600.desc.2$"
 astral_rift.1600.desc.gestalt: "Ngay khi §Y$tech_rift_sphere$§! của chúng ta vừa tới căn cứ sao, đã nhận được vô số lời chào hỏi bằng nhiều ngôn ngữ trên các băng tần khác nhau.\n\nChủ nhân của trạm không gian này đã dịch ngôn ngữ của chúng ta chỉ trong tích tắc, và mời chúng ta lên trạm để trao đổi thông tin.\n\nChúng ta mới phát hiện ra khu vực không gian này là quê nhà của một nền văn minh chủ yếu bao gồm [mirrored_empire.GetSpeciesNamePlural], họ tự xưng là [mirrored_empire.GetName]."
 astral_rift.1600.a: "Nghiên cứu người dân của họ."
 astral_rift.1600.b: "Nghiên cứu hạm đội của họ."
 astral_rift.1605.name: "Bài Học Lịch Sử"
 astral_rift.1605.desc.1: "Trong vài tháng qua, chúng ta đã tiến hành trao đổi văn hóa với [mirrored_empire.GetName].\nLịch sử của họ giống hệt chúng ta cho đến khi phát hiện ra công nghệ FTL, nhưng sau đó họ đã chạm trán với một con tàu ngoài hành tinh vô danh mạnh mẽ không tưởng. Con tàu này tiếp tục hành trình một cách ngạo mạn, không ai biết mục đích của nó là gì, nhưng cuộc chạm trán này đã làm rung chuyển sâu sắc nền tảng xã hội của họ."
 astral_rift.1605.desc.2: "Đối với chúng ta, họ rõ ràng đã đưa ra những lựa chọn sai lầm, nhưng điều này cũng đặt ra một câu hỏi thú vị. Nếu xã hội của chúng ta cũng gặp phải điều tương tự ở giai đoạn sơ khai đó, liệu chúng ta có đi vào con đường sai lầm như vậy không?\n\nHọ thật không may khi gặp phải chuyện này ở giai đoạn tiền FTL có ảnh hưởng to lớn. Sự thay đổi trong hệ tư tưởng nền tảng đã làm chậm đáng kể sự phát triển của đế chế."
 astral_rift.1605.desc.gestalt: "$astral_rift.1605.desc.1$\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.authoritarian: "$astral_rift.1605.desc.1$Việc chứng kiến sự bất lực của mình trước những vị khách có công nghệ tiên tiến đã mang đến sự thay đổi long trời lở đất trong hệ tư tưởng của họ, nghiêng về phía chủ nghĩa bình đẳng.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.egalitarian: "$astral_rift.1605.desc.1$Việc chứng kiến sự bất lực của mình khi muốn chống lại một con tàu có công nghệ tiên tiến như vậy đã mang đến sự thay đổi long trời lở đất trong hệ tư tưởng của họ, họ đã ngả sang chủ nghĩa độc tài trong quá trình chuẩn bị đối phó với những cuộc chạm trán trong tương lai.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.materialist: "$astral_rift.1605.desc.1$Việc chứng kiến sự bất lực của mình khi đối đầu với con tàu này đã mang đến sự thay đổi long trời lở đất trong hệ tư tưởng của họ, nghiêng về chủ nghĩa duy tâm.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.spiritualist: "$astral_rift.1605.desc.1$Việc chứng kiến sự bất lực của mình khi đối đầu với con tàu này đã mang đến sự thay đổi long trời lở đất trong hệ tư tưởng của họ, nghiêng về chủ nghĩa duy vật.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.militarist: "$astral_rift.1605.desc.1$Việc chứng kiến sự bất lực của mình khi đối đầu với con tàu này đã mang đến sự thay đổi long trời lở đất trong hệ tư tưởng của họ, họ tin rằng nên áp dụng các giải pháp hòa bình trong những cuộc chạm trán tương lai, từ đó nghiêng về chủ nghĩa hòa bình.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.pacifist: "$astral_rift.1605.desc.1$Việc chứng kiến sự bất lực của mình khi đối đầu với con tàu này đã mang đến sự thay đổi long trời lở đất trong hệ tư tưởng của họ, họ cảm thấy cần phải chuẩn bị cho những cuộc chạm trán trong tương lai, từ đó nghiêng về chủ nghĩa quân phiệt.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.xenophile: "$astral_rift.1605.desc.1$Việc chứng kiến sự bất lực của mình khi đối đầu với con tàu này đã mang đến sự thay đổi long trời lở đất trong hệ tư tưởng của họ, họ cảm thấy cần phải chuẩn bị cho những cuộc chạm trán trong tương lai, từ đó nghiêng về chủ nghĩa bài ngoại.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.desc.xenophobe: "$astral_rift.1605.desc.1$Việc chứng kiến sự bất lực của mình khi đối đầu với con tàu này đã mang đến sự thay đổi long trời lở đất trong hệ tư tưởng của họ, họ tin rằng nên áp dụng các giải pháp hòa bình trong những cuộc chạm trán tương lai, từ đó nghiêng về chủ nghĩa ái ngoại.\n\n$astral_rift.1605.desc.2$"
 astral_rift.1605.a: "Sự bất hạnh của họ"
 astral_rift.1610.name: "Nghiên Cứu Hạm Đội Của Họ"
 astral_rift.1610.desc.common: "Bề ngoài chúng ta đang tiến hành trao đổi văn hóa thông tin với [mirrored_empire.GetName], nhưng âm thầm điều tra năng lực quân sự của họ.\n\nMáy tính của [mirrored_empire.GetName] sử dụng hệ thống mã hóa tương tự chúng ta, việc thâm nhập vào cơ sở dữ liệu của họ dễ như trở bàn tay.\n\nCông nghệ quân sự của nền văn minh này gần giống với chúng ta, nhưng cũng có những điểm khác biệt đủ lớn khiến sơ đồ tàu của họ trở nên đủ thú vị đối với các kỹ sư."
 astral_rift.1610.desc.gestalt: "Dù chúng ta rất giống nhau, nhưng thật khó để tin tưởng họ. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.authoritarian: "Dù chúng ta có nhiều điểm tương đồng, nhưng chúng ta khó có thể tin tưởng những người ngây thơ chấp nhận sự bình đẳng này. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.egalitarian: "Dù chúng ta có nhiều điểm tương đồng, nhưng chúng ta khó có thể tin tưởng những người chấp nhận chủ nghĩa độc tài này. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.materialist: "Dù chúng ta có nhiều điểm tương đồng, nhưng chúng ta khó có thể tin tưởng những người chấp nhận chủ nghĩa duy tâm này. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.spiritualist: "Dù chúng ta có nhiều điểm tương đồng, nhưng chúng ta khó có thể tin tưởng những người chấp nhận chủ nghĩa duy vật này. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.militarist: "Dù chúng ta có nhiều điểm tương đồng, nhưng chúng ta khó có thể tin tưởng những người chấp nhận chủ nghĩa hòa bình này. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.pacifist: "Dù chúng ta có nhiều điểm tương đồng, nhưng chúng ta khó có thể tin tưởng những người chấp nhận chủ nghĩa quân phiệt này. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.xenophile: "Dù chúng ta có nhiều điểm tương đồng, nhưng chúng ta khó có thể tin tưởng những người chấp nhận chủ nghĩa bài ngoại này. $astral_rift.1610.desc.common$"
 astral_rift.1610.desc.xenophobe: "Dù chúng ta có nhiều điểm tương đồng, nhưng chúng ta khó có thể tin tưởng những người chấp nhận chủ nghĩa ái ngoại này. $astral_rift.1610.desc.common$"
 astral_rift.1610.a: "Rất tốt."
 astral_rift.1611.name: "Tâm Trí Vỡ Nát"
 astral_rift.1611.desc: "Chúng ta đã dành cả tuần qua để trao đổi văn hóa với [mirrored_empire.GetName].\n\nSự hứng thú của chúng ta nhanh chóng chuyển thành cảnh giác khi phát hiện ra những sinh vật này là tàn dư phá hoại của ý thức tập thể. Tại một thời điểm nào đó trong sự phát triển của nền văn minh, ý thức của họ đã bị đầu độc bởi khái niệm cá nhân. Họ đã chia cắt bản thân một cách có chủ đích, và dần dần mỗi cá thể không còn tuân theo tập thể nữa, mà chỉ trung thành với chính mình."
 astral_rift.1615.name: "Cơ Hội Ngoại Giao."
 astral_rift.1615.desc.common: "Có vẻ sự hiện diện của chúng ta trên trạm không gian đã khơi dậy sự cảnh giác từ chuỗi chỉ huy của họ. Một phái viên của [mirrored_empire.GetName] đã được cử đến căn cứ sao để thảo luận về tương lai của nhân dân chúng ta."
 astral_rift.1615.desc.common.2: "Chúng ta sẽ phản hồi thế nào đây?"
 astral_rift.1615.desc.xenophobe: "$astral_rift.1615.desc.common$\n\nHọ không những bài xích chúng ta mà còn không hiểu chúng ta. Họ lập luận rằng sự phối hợp nhịp nhàng giữa nhân dân hai bên sẽ mang lại lợi ích cho cả hai.\n\n$astral_rift.1615.desc.common.2$"
 astral_rift.1615.desc.common.gestalt: "$astral_rift.1615.desc.common$\n\nHọ say sưa trình bày rằng những điểm tương đồng của chúng ta lớn hơn nhiều so với những điểm khác biệt, và lập luận rằng sự phối hợp nhịp nhàng giữa nhân dân hai bên sẽ mang lại lợi ích cho cả hai."
 astral_rift.1615.desc.gestalt: "$astral_rift.1615.desc.common.gestalt$\n\nQuả thực chúng ta có rất nhiều điểm chung. $astral_rift.1615.desc.common.2$"
 astral_rift.1615.desc.common.default: "$astral_rift.1615.desc.common$\n\nHọ say sưa trình bày rằng ngoài cái tên ra, chúng ta đều là những người giống hệt nhau."
 astral_rift.1615.desc.default: "$astral_rift.1615.desc.common.default$Trong một thiên hà đầy rẫy những thế lực vô danh, tình bạn giữa chúng ta chắc chắn sẽ mang lại lợi ích cho cả đôi bên.\n\n$astral_rift.1615.desc.common.2$"
 astral_rift.1615.a: "Hoan nghênh tình hữu nghị giữa hai đế chế."
 astral_rift.1615.b: "Từ chối đề nghị của họ."
 astral_rift.1615.c: "Nắm lấy cơ hội này."
 astral_rift.1615.d: "Chúng ta hoàn toàn không hứng thú với chuyện này."
 astral_rift.1616.name: "Đến Đây Là Đủ"
 astral_rift.1616.desc.common: "Trò hề này đã diễn ra đủ lâu rồi. Chúng ta đã lấy đi tất cả những gì có thể từ họ, và chẳng có chút hứng thú nào với việc ngoại giao đa không gian xa hơn nữa."
 astral_rift.1616.desc.gestalt: "$astral_rift.1615.desc.common.gestalt$\n\n$astral_rift.1616.desc.common$"
 astral_rift.1616.desc.default: "$astral_rift.1615.desc.common.default$\n\n$astral_rift.1616.desc.common$"
 astral_rift.1616.a: "$astral_rift.1615.b$"
 astral_rift.1620.name: "Tình Bạn Mới"
 astral_rift.1620.desc.common_1: "Chúng ta đưa ra phản hồi tích cực cho ngài đại sứ.\n\nKênh liên lạc dài hạn nhằm thúc đẩy giao tiếp giữa hai vũ trụ đang được thiết lập."
 astral_rift.1620.desc.common_2: "Dù chưa có gì được chốt, nhưng đại sứ chỉ ra rằng [final_mirrored_empire.GetName] sẽ quan tâm nhiều hơn đến một hiệp định thương mại."
 astral_rift.1620.desc.default: "$astral_rift.1620.desc.common_1$$astral_rift.1620.desc.common_2$\n\nChúng ta rất mong đợi được hợp tác toàn diện với những người mà chúng ta có thể coi là anh em họ."
 astral_rift.1620.desc.xeno: "$astral_rift.1620.desc.common_1$$astral_rift.1620.desc.common_2$"
 astral_rift.1620.desc.gestalt: "$astral_rift.1620.desc.common_1$Tuy tư duy phân tán của họ không hiệu quả bằng chúng ta, nhưng chúng có thể đóng vai trò như “chất bôi trơn” giữa chúng ta và các nhóm cá thể phân tán khác."
 astral_rift.1625.name: "Thù Địch"
 astral_rift.1625.desc.common: "Chúng ta đưa ra phản hồi tiêu cực cho ngài đại sứ."
 astral_rift.1625.desc.default: "$astral_rift.1625.desc.common$\n\nMặc dù [final_mirrored_empire.GetName] hùng hồn nói về những điểm tương đồng được gọi là chung và tương lai chung, nhưng lại tỏ thái độ khinh miệt đối với những khái niệm cốt lõi mang lại sự phồn vinh cho nhân dân ta.\n\nSau khi để lại lời nhắn, trước khi quyền miễn trừ ngoại giao của chúng ta đối với họ đạt đến giới hạn, chúng ta đã nhanh chóng quay trở lại §Y$tech_rift_sphere$§!.\n\nMặc dù chúng ta không có ý định duy trì liên lạc với nhóm người này, nhưng việc nghiên cứu sự khác biệt giữa hai xã hội đã giúp chúng ta hiểu biết sâu sắc hơn về chính mình."
 astral_rift.1625.desc.gestalt: "$astral_rift.1625.desc.common$\n\nMặc dù họ khua môi múa mép về những điểm gọi là tương đồng, nhưng chúng ta cảm thấy không có gì đáng tởm hơn việc từ bỏ tập thể.\n\nSau khi làm rõ lập trường của chúng ta, các [explorer.GetIndividualNamePlural] đã nhanh chóng quay lại §Y$tech_rift_sphere$§! để tránh tình hình xảy ra những biến cố ngoài ý muốn."
 astral_rift.1625.desc.common.homicidal: "Họ nên cảm thấy may mắn vì khoảng cách xa xôi của mình."
 astral_rift.1625.desc.gestalt.homicidal: "$astral_rift.1625.desc.gestalt$\n\n$astral_rift.1625.desc.common.homicidal$"
 astral_rift.1625.desc.default.homicidal: "$astral_rift.1625.desc.gestalt$\n\n$astral_rift.1625.desc.common.homicidal$"
 ###############
 # Vật Thể Đơn Độc #
 ###############
 astral_rift_tomb: "Vật Thể Đơn Độc"
 lone_object_swarm_unleashed: "Một đàn Lính Canh Mộ đã lao thẳng về phía chúng ta. Không biết bằng cách nào chúng đã theo chân chúng ta xuyên qua nứt gãy!"
 NAME_Grave_Guardian: "Lính Canh Mộ"
 NAME_Grave_Guardians: "Lính Canh Mộ"
 astral_rift.1700.name: "Bí Ẩn Trôi Nổi"
 astral_rift.1700.desc: "Ở đây không có sao, cũng chẳng có hành tinh. Chỉ có một chùm ánh sáng khuếch tán từ một nguồn bí ẩn chiếu sáng vật thể khổng lồ này, mờ ảo hiện ra trước mắt chúng ta.\n\nHình dạng của nó xấp xỉ hình chữ nhật, và ở trạng thái hoàn toàn tĩnh lặng - không phát hiện được hệ thống đẩy hay bất kỳ dạng năng lượng đặc trưng nào. Kích thước của nó tương đương với một căn cứ sao nhỏ, trông có vẻ chết chóc. Không ai biết nó đã trôi nổi trong chiều không gian túi ẩn giấu này bao lâu, hay nó đến từ đâu.\n\nVô số ký tự và biểu tượng trang trí được chạm khắc tinh xảo trên bề mặt của nó. Từ đó chúng ta đã loại trừ khả năng đây là một hiện tượng tự nhiên."
 astral_rift.1700.a: "Cố gắng dịch văn tự."
 astral_rift.1700.b: "Quét toàn bộ bề ngoài của nó."
 astral_rift.1705.name: "Muôn Vàn Lời Nói"
 astral_rift.1705.desc: "Các chữ tượng hình bao phủ vật thể khổng lồ này chủ yếu là chữ tượng ý.\n\nDựa trên phương pháp xác định niên đại bằng đồng vị, chúng ta xác định được rằng những nét chạm khắc sớm nhất ra đời trước những nét mới nhất hàng thiên niên kỷ. Những chữ tượng hình này rất sống động, vì vậy chúng ta sẽ sớm có thể đưa ra một bản dịch sơ bộ.\n\nVật thể này thực chất là một lăng mộ khổng lồ, người được chôn cất bên trong từng cai trị toàn bộ thiên hà. Một số chữ tượng hình ra đời sớm nhất đã tiết lộ nguồn gốc của sinh vật hùng mạnh này.\n\nCó hai chủng loài được nuôi dưỡng bởi một giống loài sinh vật không gian khổng lồ (Space Amoeba/Leviathan), và đã phát triển một mối quan hệ cộng sinh độc đáo. Họ đã hình thành một mối liên kết linh năng mạnh mẽ, cùng nhau chinh phục vô số hệ sao.\n\nCòn một số biểu tượng khác dường như là một loại “lời nguyền”. Việc cố gắng mở vật thể này - hay thậm chí đến quá gần nó - đều có thể nguy hiểm."
 astral_rift.1705.a: "Quét toàn bộ bề ngoài của nó."
 astral_rift.1705.b: "Cho nổ tung nó."
 astral_rift.1710.name: "Phong Ấn Cổ Đại"
 astral_rift.1710.desc: "Chúng ta hiện đã hoàn toàn đi vào quỹ đạo quanh vật thể này.\n\nNó được hàn lại từ hai nửa. Ở một số chỗ, mối hàn bị ăn mòn nghiêm trọng - xét đến việc xung quanh chẳng có khí quyển gì, điều này khá là bất ngờ. Nó cũng cho thấy nguồn gốc của sự ăn mòn chắc chắn xuất phát từ bên trong vật thể này.\n\nSự ăn mòn rất nghiêm trọng, thậm chí một số chỗ xuất hiện những vết nứt đủ lớn để một chiếc máy bay không người lái của chúng ta đi lọt.\n\nHoặc là, chúng ta có thể dùng thuốc nổ mang theo để phá tung phong ấn."
 astral_rift.1710.a: "Cử một máy bay không người lái qua vết nứt."
 astral_rift.1710.b: "Cho nổ tung nó."
 astral_rift.1715.name: "Lối Đi Mờ Sương"
 astral_rift.1715.desc: "Máy bay không người lái của chúng ta đã gửi về một báo cáo từ bên trong vật thể.\n\nThật không may, phần lớn khoang chứa bị che khuất bởi những đám mây bụi carbon dày đặc, rất khó để xoay xở bên trong.\n\nPhân tích sơ bộ cho thấy một lượng lớn sợi không gian đan xen với các hạt carbon. Nếu chúng ta sẵn sàng dành chút thời gian, hoàn toàn có khả năng thu hoạch được những vật liệu này.\n\nQua một vết nứt nằm sâu trong cấu trúc, chúng ta phát hiện dấu vết của một buồng trong. Nếu muốn khám phá sâu hơn, có thể cần phải dùng đến các thao tác mang tính phá hoại mạnh hơn."
 astral_rift.1715.a: "Lấy một ít mẫu vật rồi quay lại."
 astral_rift.1715.b: "Tiến hành phá dỡ mang tính hủy diệt."
 astral_rift.1720.name: "Trộm Mộ"
 astral_rift.1720.desc.outside: "Bằng cách sử dụng chất nổ tiêu chuẩn, chúng ta đã thành công mở được một cái lỗ không nhỏ trên vật thể này."
 astral_rift.1720.desc.drones: "Bằng cách sử dụng chất nổ tiêu chuẩn, chúng ta đã thành công mở được một lối đi vào bên trong vật thể này."
 astral_rift.1720.desc.common.1: "Bên trong nó chứa đầy đủ loại cổ vật vô cùng giá trị. Những bức điêu khắc phức tạp đúc từ hợp kim quý hiếm đứng sừng sững xung quanh. Ở giữa gian phòng trong này là một bộ xương pha lê khổng lồ, trên trán điểm xuyết bằng những viên ngọc tinh xảo."
 astral_rift.1720.desc.no_glyphs: "Bây giờ có thể tự tin nói rằng, toàn bộ cấu trúc này được thiết kế và xây dựng như một lăng mộ."
 astral_rift.1720.desc.glyphs: "Theo văn tự ghi chép bao phủ bên ngoài đài tưởng niệm này, mọi đồ vật xung quanh bộ xương đều là đồ cống nạp. Mặc dù ông ta là một kẻ chinh phục tàn nhẫn, nền văn minh mà ông ta để lại rõ ràng là vô cùng tôn kính ông ta."
 astral_rift.1720.desc.psionic: "Mỗi viên ngọc trang trí trên xương chân mày của ông ta đều có sự cộng hưởng linh năng tiềm ẩn. Đây chắc chắn là cách người khổng lồ này và dạng cộng sinh của mình giao tiếp với nhau. Chúng ta có thể học hỏi được rất nhiều điều từ các thiết bị này."
 astral_rift.1720.desc.common.2: "Dù hài cốt này có kích thước quá lớn không thể mang ra khỏi nứt gãy, nhưng chúng ta có thể mang theo những cổ vật giá trị nhất."
 astral_rift.1720.desc.outside.no_glyphs: "$astral_rift.1720.desc.outside$\n\n$astral_rift.1720.desc.common.1$\n\n$astral_rift.1720.desc.no_glyphs$\n\n$astral_rift.1720.desc.common.2$"
 astral_rift.1720.desc.outside.glyphs: "$astral_rift.1720.desc.outside$\n\n$astral_rift.1720.desc.common.1$\n\n$astral_rift.1720.desc.glyphs$\n\n$astral_rift.1720.desc.common.2$"
 astral_rift.1720.desc.outside.glyphs.psionic: "$astral_rift.1720.desc.outside$\n\n$astral_rift.1720.desc.common.1$\n\n$astral_rift.1720.desc.glyphs$\n\n$astral_rift.1720.desc.psionic$\n\n$astral_rift.1720.desc.common.2$"
 astral_rift.1720.desc.drones.no_glyphs: "$astral_rift.1720.desc.drones$\n\n$astral_rift.1720.desc.common.1$\n\n$astral_rift.1720.desc.no_glyphs$\n\n$astral_rift.1720.desc.common.2$"
 astral_rift.1720.desc.drones.glyphs: "$astral_rift.1720.desc.drones$\n\n$astral_rift.1720.desc.common.1$\n\n$astral_rift.1720.desc.glyphs$\n\n$astral_rift.1720.desc.common.2$"
 astral_rift.1720.desc.drones.glyphs.psionic: "$astral_rift.1720.desc.drones$\n\n$astral_rift.1720.desc.common.1$\n\n$astral_rift.1720.desc.glyphs$\n\n$astral_rift.1720.desc.psionic$\n\n$astral_rift.1720.desc.common.2$"
 astral_rift.1725.name: "Lính Canh Mộ"
 astral_rift.1725.desc: "Vụ nổ định hướng của chúng ta đã mở ra một lối đi dẫn đến một lăng mộ mà chúng ta chưa phát hiện ra trước đó. Không gian này được giấu sâu phía sau phong ấn, rõ ràng đã có những thiết kế để chống lại bọn trộm mộ. Nơi đây còn chứa đầy những thực thể hung hãn.\n\nQuả cầu đã ngay lập tức thu dây neo, nhưng vẫn có nhiều lính canh bám theo đuôi chúng ta lao ra khỏi nứt gãy."
 astral_rift.1725.a: "Bây giờ chúng ta có vài rắc rối cần giải quyết rồi."
 #############
 # Sâu Đá #
 #############
 astral_rift_rockworms: "Sâu Đá"
 decision_breed_rockworm_hive: "Tổ Sâu Đá"
 decision_breed_rockworm_hive_desc: "Những con Sâu Đá non được mang về từ đầu bên kia nứt gãy không gian, sau khi được huấn luyện kỹ lưỡng có thể đào ra vô số đường hầm khoáng sản. Có thể xảy ra chuyện gì rắc rối cơ chứ?"
 d_rockworm_hive: "$decision_breed_rockworm_hive$"
 d_rockworm_hive_desc: "$decision_breed_rockworm_hive_desc$"
 can_breed_rockworm_hives_tt: "Mở khóa §YQuyết nghị Hành tinh§! Tổ Sâu Đá."
 astral_rift.1800.name: "Biển Đá Vô Tận"
 astral_rift.1800.desc: "Một dải sỏi đá lỏng lẻo khổng lồ trải dài trước mắt chúng ta, bên trên là một bầu trời nhợt nhạt, trống rỗng.\n\nỞ đây không thấy hành tinh hay ngôi sao nào. Có vẻ như nó không thuộc hệ sao hay bất kỳ hệ thống nào đã biết. Trong phạm vi cảm biến của chúng ta có thể phát hiện được, cảnh quan này trải dài vô tận về mọi hướng. Bề mặt đầy những hố sâu to như tiểu hành tinh.\n\nỞ phía xa đường chân trời, hàng chục sinh vật hình giun khổng lồ đang trồi lên khỏi mặt đất, dùng một đôi vây khỏe lướt đi trong bầu khí quyển đặc quánh. Chúng chắc chắn phải có một khu định cư nào đó dưới lòng đất."
 astral_rift.1800.a: "Tiếp tục quan sát bề mặt."
 astral_rift.1800.b: "Khám phá các đường hầm."
 astral_rift.1805.name: "Vi Sinh Vật Trên Trời"
 astral_rift.1805.desc: "Ở đây cũng không chỉ có mỗi sâu.\n\nMột quần thể sinh vật siêu nhỏ đã hình thành cấu trúc giống như đám mây ở tầng khí quyển thấp. Chúng hoạt động chung như một đàn lớn, tạo thành các hoa văn phức tạp trên bầu trời.\n\nNhững con sâu khổng lồ đó lao lên khỏi mặt đất từ các đường hầm, rồi vọt lên không trung lướt đi, há miệng rộng nuốt chửng những đám mây tạo thành từ các sinh mệnh nhỏ bé này. Chúng ta cũng quan sát thấy nhiều con sâu phối hợp với nhau, dồn những đám mây vi sinh vật này lại với nhau. Mức độ hợp tác của chúng khá là phức tạp."
 astral_rift.1805.a: "Lấy mẫu vi sinh vật."
 astral_rift.1805.b: "Khám phá đường hầm của lũ sâu."
 astral_rift.1810.name: "Đường Hầm"
 astral_rift.1810.desc: "Dưới lòng đất là một mạng lưới hang động khổng lồ, được kết nối với nhau bởi hàng loạt các đường hầm phức tạp. Có vài đoạn bị sập dường như không còn được lũ sâu sử dụng nữa. Chúng ta đang điều khiển §Y$tech_rift_sphere$§! tiến vào khu vực yên tĩnh nhất.\n\nCác vách đá ở đây được phủ một lớp vật chất dạng lưới, giúp cố định đá phiến và sỏi đá lỏng lẻo. Chúng ta suy đoán đây là dịch tiết của lũ sâu.\n\nHầu hết các hang động đều trống rỗng, nhưng vài hang có những vũng nước đục ngầu. Trong một căn phòng bằng đá, chúng ta phát hiện một đống kén khoáng hóa khổng lồ ngập một nửa trong nước."
 astral_rift.1810.a: "Lấy những quả trứng này đi."
 astral_rift.1810.b: "Tiếp tục tiến lên."
 astral_rift.1815.name: "Nuốt Chửng"
 astral_rift.1815.desc.common.1: "Mọi chuyện đều bình thường.\n\nNgoại trừ việc chúng ta đã bị ăn thịt."
 astral_rift.1815.desc.common.2: "§Y$tech_rift_sphere$§! của chúng ta đã bị mắc kẹt trong hệ thống tiêu hóa của nó. Chúng ta không biết đây là hành vi thù địch hay đơn thuần chỉ là nó đang kiếm ăn.\n\nDịch tiêu hóa do con sâu tiết ra không mạnh, nhưng chúng ta cũng không thể ở lại đây mãi mãi. Chúng ta có thể dùng dây neo để kéo mình thoát ra khỏi khe hở trong miệng con sâu."
 astral_rift.1815.desc.common.gas: "Hoặc là, bên trong con sâu có vẻ khá mềm, hẳn là có thể dùng chất nổ để phá tung ra."
 astral_rift.1815.desc: "$astral_rift.1815.desc.common.1$\n\nTrong lúc thu thập mẫu đám mây vi sinh vật, một con sâu đang kiếm ăn đã nuốt chửng chúng ta.\n\n$astral_rift.1815.desc.common.2$"
 astral_rift.1815.desc.gas: "$astral_rift.1815.desc$\n\n$astral_rift.1815.desc.common.gas$"
 astral_rift.1815.a: "Đặt chất nổ."
 astral_rift.1815.b: "Kéo dây neo khẩn cấp."
 astral_rift.1816.name: "$astral_rift.1815.name$"
 astral_rift.1816.desc.harvest: "$astral_rift.1815.desc.common.1$\n\nLúc chúng ta đang thu nhặt số trứng này, một con sâu đột nhiên xuất hiện, và nuốt chửng chúng ta.\n\n$astral_rift.1815.desc.common.2$"
 astral_rift.1816.desc.harvest.gas: "$astral_rift.1816.desc.harvest$\n\n$astral_rift.1815.desc.common.gas$"
 astral_rift.1816.desc.capture: "$astral_rift.1815.desc.common.1$\n\nLúc chúng ta đang cố bắt bầy ấu trùng của chúng, một con sâu đột nhiên xuất hiện, và nuốt chửng chúng ta.\n\n$astral_rift.1815.desc.common.2$"
 astral_rift.1816.desc.capture.gas: "$astral_rift.1816.desc.capture$\n\n$astral_rift.1815.desc.common.gas$"
 astral_rift.1816.a: "$astral_rift.1815.a$"
 astral_rift.1816.b: "$astral_rift.1815.b$"
 astral_rift.1820.name: "Phòng Ấp Dục"
 astral_rift.1820.desc: "Chúng ta phát hiện ra một hồ nước cạn sâu trong hệ thống hầm.\n\nNhững bức tường ở đây đang nhung nhúc. Những con ấu trùng lớn bằng cỡ §Y$tech_rift_sphere$§! của chúng ta đang bận rộn gặm nhấm những dịch tiết hóa thạch dùng để liên kết các bức tường đá với nhau. Mặc dù kích thước nhỏ hơn nhiều, nhưng gần như có thể khẳng định chúng chính là con non của lũ sâu lướt trên mặt đất mà chúng ta đã thấy.\n\nNơi đây hẳn là một kiểu phòng ấp dục nào đó."
 astral_rift.1820.a: "Bắt sống vài tiêu bản."
 astral_rift.1820.b: "Có cảm giác nếu không đi ngay thì vận may sẽ cạn sạch mất. Quay về nhanh."
 astral_rift.1820.b.evopred: "Lấy một ít mẫu vật rồi quay lại."
 astral_rift.1825.name: "Thoát Hiểm"
 astral_rift.1825.desc: "Dây neo của chúng ta thực sự là dây sinh mạng đấy.\n\nGiống hệt như miếng mồi câu trên dây cước, chúng ta đã được lôi tuột ra khỏi đường tiêu hóa của con sâu."
 astral_rift.1830.name: "Bị Tiêu Hóa"
 astral_rift.1830.desc: "Chúng ta đã mất liên lạc với [explorer.GetTeamMemberPlural] trên §Y$tech_rift_sphere$§!.\n\nKhi thu hồi, ở đầu dây cáp kéo về chỉ còn lại một nửa vỏ tàu bằng kim loại đã bị tiêu hóa dở.\n\nChúng ta đã nhân cơ hội này để nghiên cứu đặc tính của lớp dịch tiêu hóa bám trên dây cáp."
 astral_rift.1835.name: "Mổ Bụng"
 astral_rift.1835.desc.common: "Quá trình nổ mìn đã thành công.\n\nThịt của con sâu đã vỡ vụn thành một vũng thịt đá và nội tạng nát nhừ ngay bên dưới chúng ta."
 astral_rift.1835.desc.recover: "$astral_rift.1835.desc.common$\n\nChúng ta nhận thấy mình đang ở trong một căn phòng bằng đá, chúng ta phát hiện một đống kén khoáng hóa khổng lồ ngập một nửa trong nước. Chúng ta có thể lấy về vô số các cụm trứng."
 astral_rift.1835.desc.capture: "$astral_rift.1835.desc.common$\n\nSau khi thoát khốn, chúng ta đã có thể bắt được vài con ấu trùng, chuẩn bị đem chúng đi xuyên qua nứt gãy.\n\nChúng ta hoàn toàn có thể đem những sinh vật nhỏ dẻo dai này về hành tinh mà mình muốn, sau đó huấn luyện chúng đào hầm mỏ cho chúng ta."
 astral_rift.1835.desc.harvest: "$astral_rift.1835.desc.common$\n\nSau khi trật quỹ đạo, chúng ta đã có thể đem về vô số các cụm trứng từ vũng nước trong căn phòng bằng đá này.\n\nChúng ta chứa chúng trong vỏ tinh thể, đem những sinh vật nhỏ dẻo dai này về hành tinh mà mình muốn, sau đó huấn luyện chúng đào hầm mỏ cho chúng ta."
 astral_rift.1835.a: "Nghe có vẻ hơi nguy hiểm đấy."
 astral_rift.1835.b.evopred: "Đập vỡ vỏ của nó trước rồi hẵng về."
 astral_rift.1890.name: "Thoát Khỏi Miệng Thú"
 astral_rift.1890.desc: "[From.GetName] đã trở về từ đầu bên kia nứt gãy không gian, [From.GetHeShe] trông có vẻ kiệt sức.\n\nVì đã ở trong bụng Sâu Đá nhiều năm, chức năng cơ thể của [From.GetHisHer] đã trở nên vô cùng hạn chế. Dù sao thì, chúng ta cũng đã để [From.GetHimHer] trở về trong vòng tay của chúng ta."
 astral_rift.1890.a: "Thế đó... vẫn được coi là may mắn phải không?"
 ##################
 # Cõi Núi Lửa #
 ##################
 restoring_the_balance_modifier: "Khôi Phục Cân Bằng"
 restoring_the_balance_tt: "Dân số trên một hành tinh của chúng ta sẽ bị đưa trở lại nứt gãy không gian $astral_rift_volcano$, với hy vọng có thể khôi phục lại trạng thái cân bằng đã bị chúng ta phá vỡ."
 obelisks_curse_modifier: "Lời Nguyền Của Tháp Nhọn"
 obelisks_curse_machine_modifier: "$obelisks_curse_modifier$"
 leader_trait_obelisk_curse: "$obelisks_curse_modifier$"
 leader_trait_obelisk_curse_tt: "Miễn là nhà lãnh đạo này vẫn còn là quan chức trong nội các, mỗi năm họ sẽ phải hiến tế một lượng dân số cho Tháp Obelisk đen."
 leader_trait_obelisk_curse_desc: "Nhà lãnh đạo này là bề tôi của Tháp Obelisk đen, ông ta yêu cầu chúng ta phải khôi phục trạng thái cân bằng đã bị phá vỡ."
 astral_rift_volcano: "Không Gian Núi Lửa"
 astral_rift.1900.name: "Cảnh Quan Nóng Bỏng"
 astral_rift.1900.desc: "Nhiệt độ ở đây cao đến mức khó tin. Nếu không có lớp khiên cách nhiệt được chuẩn bị từ trước, chúng ta có lẽ đã phải táng thân trong biển lửa rồi.\n\nỞ phía xa, có một tòa tháp Obelisk màu đen đang lẳng lặng sừng sững đứng đó. Hàng loạt kênh rạch do con người đục khoét tụ hội về đài tưởng niệm khổng lồ này, chia cắt địa hình đất đá một cách ngay ngắn.\n\nTrên bầu trời lơ lửng những sinh vật hình cầu phát sáng một cách lặng lẽ. Những tua cuốn của chúng buông thõng xuống từ cơ thể tinh xảo. Từ khoảng cách này, chúng ta vẫn chưa thể nhìn ra liệu chúng có mang ý đồ thù địch hay không, nhưng ít nhất hiện tại, chúng có vẻ không chú ý đến chúng ta.\n\nTháp Obelisk có vẻ là đối tượng cần điều tra nhất, nhưng vô số các sinh vật lơ lửng bay sát đó, khiến người ta có chút bất an. Có lẽ quan sát môi trường xung quanh trước khi tiến đến quá gần sẽ an toàn hơn."
 astral_rift.1900.a: "Khám phá xung quanh."
 astral_rift.1900.b: "Bay thẳng về phía tháp Obelisk."
 astral_rift.1905.name: "Săn Lùng"
 astral_rift.1905.desc: "Cái nơi quái quỷ này nguy hiểm hơn nhiều so với những gì chúng ta nghĩ ban đầu.\n\nDọc theo các bức tường ở đây xếp thành nhiều ngăn nhỏ. Bên trong nhung nhúc đủ loại sinh vật sống. Vừa nhìn thấy chúng ta, chúng đã lay hàng rào và kêu gào thảm thiết bằng đủ thứ ngôn ngữ không rõ nguồn gốc. Đôi lúc, chúng ta thấy những sinh vật hình cầu lơ lửng đi vào các ngăn này, dùng sốc điện sinh học để khuất phục các tù nhân.\n\nThật không may, một trong những quả cầu lơ lửng đó đã chú ý đến chúng ta, và đang tiến về phía §Y$tech_rift_sphere$§!. Cho dù chúng ta đã mở động cơ lên mức tối đa, nó vẫn đang dần đuổi kịp chúng ta. Nó kéo lê những chiếc tua cuốn dài phía sau, đúng nghĩa là dọc đường tia lửa điện xẹt không ngừng.\n\nNgay bên dưới chúng ta, một dòng sông dung nham khổng lồ nhấn chìm toàn bộ cảnh quan hắc diện thạch. Lớp cách nhiệt mà chúng ta chuẩn bị hẳn có thể giúp chúng ta sống sót trong dung nham một thời gian."
 astral_rift.1905.a: "Kéo dây neo khẩn cấp."
 astral_rift.1905.b: "Lẩn trốn vào trong dung nham."
 astral_rift.1910.name: "Bị Bắt"
 astral_rift.1910.desc: "Chúng ta không thể tránh khỏi sự truy quét. Trong lúc đang bay về phía tháp Obelisk, một bầy nhỏ những sinh vật lơ lửng quái dị đã nhanh chóng đuổi kịp chúng ta.\n\nBây giờ chúng ta đang bị mắc kẹt bởi những chiếc tua cuốn phát sáng của chúng, bị kéo lê đi một cách thô bạo. Nỗ lực giao tiếp với chúng hoàn toàn vô hiệu.\n\nChúng kiên quyết kéo chúng ta về phía một cái lồng được đục khoét sâu trong bức tường gần đó. Những sợi xích và hàng rào mở ra cho chúng ta một lối đi. Dọc đường, vô số các dạng sống có tri giác khác nhau bị nhốt trong những buồng giam tương tự.\n\nCác xúc tu của những sinh vật này bám chặt vào tàu của chúng ta. Tuy nhiên, bằng cách tiếp thêm cho động cơ một liều vật chất không gian, có thể tạo ra một lực đẩy đột phá, giúp chúng ta thoát khỏi sự kiểm soát của chúng."
 astral_rift.1910.a: "Cố gắng chạy thoát."
 astral_rift.1910.b: "Như vậy quá nguy hiểm. Kéo dây neo khẩn cấp."
 astral_rift.1915.name: "Tháp Obelisk Đen"
 astral_rift.1915.desc.common: "Chúng ta âm thầm tiến lên, và đã đến gần được tháp Obelisk khổng lồ.\n\nNó có màu đen như hắc diện thạch, kéo dài lên đến tận trần của cái không gian núi lửa này. Nếu nói nó có từ thời cổ đại, thì vẻ bề ngoài của nó lại quá hoàn hảo không tì vết. Thứ ban đầu chúng ta tưởng là họa tiết trang trí thực chất là một dạng hoa văn. Dù tạm thời khó mà nhận diện được, nhưng những chữ rune nung chảy đang xoay chuyển trên bề mặt của nó theo một trật tự được sắp đặt tỉ mỉ. Nếu có đủ thời gian, hoàn toàn có khả năng dịch được chúng.\n\nMáy tính theo dõi mục tiêu của chúng ta phát hiện ra rằng, các sinh vật tuần tra trong khu vực này càng đến gần vật thể này thì di chuyển càng nhanh. Chúng ta suy luận rằng, bất kể cấu trúc này là gì, các sinh vật này đều gắn liền với nó theo một cách nào đó. Phá hủy nó bằng vụ nổ khí nén hẳn sẽ áp chế được chức năng của chúng."
 astral_rift.1915.desc.lava_hide: "Để tránh bị theo dõi, chúng ta đã tự dìm mình vào dòng sông dung nham bên dưới.\n\nLớp màng bảo vệ mà chúng ta phủ lên như một biện pháp phòng ngừa giúp chúng ta có thể sống sót dưới đó đủ lâu, bơi được một quãng, nhằm trốn tránh sự chú ý của các sinh vật lơ lửng.\n\n$astral_rift.1915.desc.common$"
 astral_rift.1915.desc.lava_escape: "Các sinh vật lơ lửng đã không kịp trở tay trước hành động của chúng ta.\n\nLực bùng nổ của động cơ đã giúp chúng ta thoát khỏi tua cuốn của chúng, đẩy chúng ta lao thẳng xuống dòng sông dung nham bên dưới. Rõ ràng, chúng vẫn chưa kịp thích ứng với việc con mồi sẽ phản ứng theo cách này.\n\nLớp màng bảo vệ mà chúng ta phủ lên như một biện pháp phòng ngừa giúp chúng ta có thể sống sót dưới đó đủ lâu, bơi được một quãng, nhằm trốn tránh sự chú ý của các sinh vật lơ lửng.\n\n$astral_rift.1915.desc.common$"
 astral_rift.1915.a: "Giải mã các chữ rune."
 astral_rift.1915.b: "Phá hủy tháp Obelisk"
 astral_rift.1920.name: "Lấy Lại"
 astral_rift.1920.desc: "Chúng ta đã kéo dây neo lại, để thoát khỏi chốn nguy hiểm này.\n\nRất nhiều sinh vật lơ lửng đã bị kéo lê theo khi chúng ta lôi §Y$tech_rift_sphere$§! về, thậm chí có một con còn bị kéo sang chiều không gian của chúng ta, nhưng ngay sau đó phân rã thành một lượng vật chất không gian tinh khiết.\n\nChúng ta đã lấy đi xác của chúng để phục vụ cho các nghiên cứu chuyên sâu hơn."
 astral_rift.1925.name: "Danh Sách"
 astral_rift.1925.desc: "Đây là một bản danh sách\n\nTrên tháp Obelisk khắc đầy hàng nghìn tỷ cái tên, được sắp xếp theo một mô hình toán học phức tạp, và khi chúng ta vừa quan sát thì nó vừa không ngừng biến hóa.\n\nMỗi mặt của tháp Obelisk có một cách sắp xếp độc đáo riêng, khiến cho mỗi cái tên có thể hiển thị chính xác ở một hốc nào đó dọc theo các bức tường.\n\nChạm máy dò vào bất kỳ một cái tên nào sẽ khiến một buồng giam tương ứng lóe lên một thứ ánh sáng năng lượng nguy hiểm, đồng thời phát ra những tiếng kêu gào thảm thương.\n\nThật không may, trong lúc làm việc đó, chúng ta đã một lần nữa thu hút sự chú ý của các sinh vật lơ lửng."
 astral_rift.1925.a: "Đủ rồi. Kéo dây neo khẩn cấp."
 astral_rift.1925.b: "Phá hủy thiết bị tồi tệ này."
 astral_rift.1930.name: "Tháp Obelisk Vỡ Nát"
 astral_rift.1930.desc: "Những khối thuốc nổ được đặt theo chiến thuật dọc theo các khớp nối của tòa tháp hắc diện thạch đã tạc nó ra làm đôi hoàn toàn.\n\nNửa trên của tháp Obelisk dần dần trượt xuống, màn đêm bao phủ toàn bộ hang động. Những sinh vật lơ lửng mà chúng ta chú ý trước đây đã đánh mất ánh sáng, và rơi phịch xuống mặt đất với một tiếng bịch nặng nề, ẩm ướt.\n\nCánh cửa của các buồng giam xếp dọc hai bên tường đã lần lượt mở ra. Vô số bầy sinh vật túa ra từ những cái lỗ này, tràn vào hệ thống đường hầm gần nhất. Chúng ta không biết những đường hầm này dẫn đi đâu, nhưng ít nhất giờ đây chúng đã được tự do.\n\nVật liệu vỡ nát từ tháp Obelisk mang trong mình một đặc tính thú vị và độc nhất. Chúng ta đã mang càng nhiều càng tốt lên tàu để nghiên cứu sâu thêm."
 astral_rift.1935.name: "Thất Bại"
 astral_rift.1935.desc: "Chúng ta đã mất liên lạc với [Leader.GetName].\n\nKhi thu hồi §Y$tech_rift_sphere$§!, chúng ta phát hiện bên trong ngập ngụa khói và tro bụi. Không tìm thấy xác của [Explorer.GetCrew].\n\nCó vẻ như họ đã mãi mãi lạc mất ở phía bên kia nứt gãy rồi."
 astral_rift.1940.name: "Vị Khách Bất Tường"
 astral_rift.1940.desc: "Một sinh vật cấu tạo từ dung nham yêu cầu được gặp chúng ta. Hắn tự xưng là chủ nhân của tòa tháp Obelisk đen mà chúng ta đã làm nổ tung sáu năm trước."
 astral_rift.1941.desc: "Các người hoàn toàn mù mờ về những gì mình đã làm.\n\nCác người đã thả nhầm tù nhân của chúng ta. Nếu không thể khôi phục trạng thái cân bằng, sẽ có những hậu quả nghiêm trọng.\n\nTrong vòng sáu năm tới, mỗi năm các người phải cung cấp tù nhân thay thế từ hành tinh của các người cho chúng ta. Đổi lại, chúng ta sẽ thực hiện một vụ giao dịch công bằng.\n\nNếu từ chối, chúng ta sẽ rất sẵn lòng tra tấn người của các người bằng mọi giá."
 astral_rift.1941.a: "Được. Thế thì khôi phục sự cân bằng đi."
 astral_rift.1941.b: "Cút đi."
 astral_rift.1950.name: "Sĩ Quan Khoa Học Trở Về"
 astral_rift.1950.desc: "[from.GetName] đã trở về từ nứt gãy không gian $astral_rift_volcano$…… nhưng có vẻ không giống lắm với những gì chúng ta nhớ về họ.\n\nViệc lấy mẫu đồng vị cho thấy tuổi của [from.GetHisHer] đã vượt quá 600 tuổi."
 astral_rift.1950.a: "Giám sát chặt chẽ cá nhân này."
 astral_rift.1955.name: "Hiến Tế"
 astral_rift.1955.desc: "Sự tình đang diễn biến theo một chiều hướng bất an.\n\n[from.GetName] đang bí mật dùng dịch chuyển tức thời đưa người dân của chúng ta vượt qua $astral_rift_volcano$.\n\nHọ gọi đây là những nỗ lực “khôi phục trạng thái cân bằng”."
 astral_rift.1955.a: "Xử lý [from.GetHimHer] đi."
 astral_rift.1955.b: "Mặc kệ [from.GetHimHer] tiếp tục."
