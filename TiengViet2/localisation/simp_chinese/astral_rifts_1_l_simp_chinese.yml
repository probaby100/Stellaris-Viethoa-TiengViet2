 astral_rift.1560.name: "Lũ Lụt"
 astral_rift.1560.desc.default: "Sai nút.\n\nLời trăng trối cuối cùng của [Leader.GetName] cho thấy, nhấn nút bốn chấm khiến căn phòng ngập tràn nước.\n\nNếu họ quay ngược thời gian một lần nữa, chúng ta sẽ có cơ hội thử một nút bấm khác."
 astral_rift.1560.desc.gestalt: "Sai nút.\n\nNút bốn chấm sẽ làm căn phòng bị ngập nước. Các [explorer.GetIndividualNamePlural] của chúng ta đã chết.\n\nNếu họ quay ngược thời gian một lần nữa, chúng ta sẽ có cơ hội thử một nút bấm khác."
 astral_rift.1560.desc.aquatic: "Nhấn nút bốn chấm khiến khoang chứa đầy nước. May mắn là [Leader.GetName] của chúng ta bơi lội rất giỏi, việc này giống như trở về nhà vậy. Họ dự định đợi nước rút rồi mới nhấn nút khác."
 astral_rift.1560.desc.aquatic_gestalt: "$astral_rift.1560.desc.aquatic$"
 astral_rift.1560.b: "$astral_rift.1545.b$"
 astral_rift.1565.name: "Pha Lê Thời Gian"
 astral_rift.1565.desc.common: "Một bệ đỡ chứa một viên pha lê khổng lồ mọc lên từ mặt đất. Tất cả các cửa trong tòa nhà đều đã mở.\n\nKhi đồng hồ đo thời gian chính xác đến gần viên pha lê, nó dao động dữ dội giữa các giá trị cực hạn. Đây chắc chắn là nguồn gốc của vòng lặp thời gian, và cũng là phần cốt lõi của tòa nhà này."
 astral_rift.1565.desc.default: "$astral_rift.1565.desc.common$\n\nSự lựa chọn trong căn phòng này dường như được thiết lập hoàn toàn ngẫu nhiên. Có lẽ mục đích của chúng là để kiểm tra khả năng truyền tải thông tin giữa các vòng lặp?\n\nDù sao đi nữa, sống sót là chúng ta có thể mang viên pha lê rời đi. Khả năng ảnh hưởng đến dòng thời gian của nó sẽ cực kỳ hữu ích."
 astral_rift.1565.desc.latent_psionic: "$astral_rift.1555.desc.common$\nTrải nghiệm này đã thay đổi [Leader.GetName]. Có vẻ như trải nghiệm vòng lặp thời gian này đã khiến tiềm năng linh năng của [Leader.GetHisHer] thức tỉnh hoàn toàn!\n\nCó lẽ đây chính là mục đích cuối cùng của tàn tích này, một chuỗi các lựa chọn có vẻ ngẫu nhiên chỉ có thể được dẫn dắt bởi sức mạnh vượt qua dòng thời gian, chẳng hạn như linh năng.\n\nDù sao thì, chúng ta hiện đã an toàn mang viên pha lê rời đi. Khả năng ảnh hưởng đến dòng thời gian của nó sẽ cực kỳ hữu ích."
 astral_rift.1565.desc.latent_psionic_robot: "$astral_rift.1555.desc.common$\n\nBộ xử lý linh năng ngủ đông trong [Leader.GetName] đã được đánh thức sau khi trải qua vòng lặp thời gian, môi trường này đã cung cấp những điều kiện thử nghiệm khắc nghiệt để kích hoạt khả năng này.\n\nHiện vẫn chưa chắc chắn liệu đây có phải là mục đích ban đầu của tàn tích này hay không, nhưng dù sao chúng ta hiện đã có thể mang viên pha lê rời đi an toàn để tiến hành phân tích thời gian sâu hơn."
 astral_rift.1565.desc.psionic: "$astral_rift.1565.desc.common$\n\nTrong những vòng luân hồi này, trực giác của [Leader.GetName] đã giúp [Leader.GetHimHer] đưa ra lựa chọn chính xác.\n\nCó lẽ đây chính là mục đích của những căn phòng này, thiết kế một chuỗi các lựa chọn có vẻ ngẫu nhiên để khai mở tiềm năng linh năng.\n\nDù sao đi nữa, chúng ta hiện đã có thể an toàn mang viên pha lê rời đi. Khả năng ảnh hưởng đến dòng thời gian của nó sẽ cực kỳ hữu ích."
 astral_rift.1565.desc.psionic_robot: "$astral_rift.1565.desc.common$\n\n[Leader.GetName] đã có được kết quả tối ưu nhờ sự trợ giúp của bộ xử lý linh năng, vượt qua những vòng luân hồi này.\n\nCó lẽ đây chính là mục đích của những căn phòng này, thiết kế một chuỗi các lựa chọn có vẻ ngẫu nhiên để khai mở tiềm năng linh năng.\n\nDù sao đi nữa, chúng ta hiện đã có thể an toàn mang viên pha lê rời đi để phân tích thời gian sâu hơn."
 astral_rift.1565.a: "Rất tốt, thật sự nhẹ nhàng và vui vẻ."
