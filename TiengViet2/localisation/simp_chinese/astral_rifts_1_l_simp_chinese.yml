l_simp_chinese:
 ####################
 #The Crystal Rift #
 ####################
 astral_rift_crystal: "Nứt Gãy Pha Lê"
 astral_rift.1000.name: "Thấu Hiểu"
 astral_rift.1000.desc: "Có thứ gì đó ở phía bên kia nứt gãy đã khống chế quả cầu, làm vô hiệu hóa thiết bị thu hồi của chúng ta.\n\nDữ liệu đầu tiên chúng ta nhận được rất khó hiểu, nhưng các đoạn truyền tin sau đó đã giúp chắp vá thông tin lại. Chúng ta suy đoán rằng, ở phía bên kia nứt gãy, thời gian trôi nhanh hơn rất nhiều, thực tế là chúng ta đang nhận được liên lạc thời gian thực từ phía bên kia.\n\nKết quả là mỗi ngày chỉ xử lý được khoảng một từ. Dưới đây là các báo cáo hiện tại chúng ta nhận được.\n\n§E“Chúng tôi quan sát…”§!\n\n§E“Xin lỗi… phương pháp… tồi tệ…”§!\n\n§E“Khẩn cấp…”§!\n\n§E“Thấu hiểu…”§!\n\nNhững thông điệp ngắn ngủi này gần như bị nhấn chìm bởi nhiễu sóng nghiêm trọng và dữ liệu không thể giải mã.\n\nKhông ai biết [Explorer.GetCrew] của §Y$tech_rift_sphere$§! đang gặp phải nguy hiểm gì.\n\nCó thể thử gửi một xung điện từ qua dây neo để thiết lập lại liên lạc và giành lại quyền kiểm soát hệ thống."
 astral_rift.1000.desc.gestalt: "$astral_rift.1000.desc$"
 astral_rift.1000.desc.default: "Báo cáo do §Y$tech_rift_sphere$§! gửi về không chứa tín hiệu [Leader.GetMechanicalBiological] của [Explorer.GetScientistPlural] chúng ta.\n\n$astral_rift.1000.desc$"
 astral_rift.1000.a: "Dùng AI để dò tìm các quy luật ẩn."
 astral_rift.1000.b: "Phóng xung điện từ vào dây neo."
 astral_rift.1005.name: "Quê Nhà"
 astral_rift.1005.desc.common: "Từ những hình ảnh này có thể chắp vá lại hình dáng toàn bộ thiên hà của chúng ta, cùng với một thiên hà khác nhỏ hơn nhiều nhưng có mật độ đặc bất thường. Ở giữa hai thiên hà là một loạt các nứt gãy không gian. Chúng ta hiểu rằng đây là bản đồ chỉ đường từ chiều không gian của chúng ta đến một nơi khác.\n\nTrong hình ảnh thiên hà của chúng ta, có một đốm sáng nhỏ nổi bật một cách bất thường. Các phân tích sau đó xác nhận đây là quê nhà của chúng ta, [Explorer.GetHomeWorldName], đang tỏa sáng lấp lánh. Một luồng sáng tương tự cũng được tìm thấy ở vũ trụ lân cận.\n\nHọ đang nói cho chúng ta biết phải đi đâu.\n\nĐể tránh hỏng hóc hoặc thất thoát dữ liệu, lượng dữ liệu chúng ta nhận được đã vượt quá khả năng xử lý của máy tính. Chúng ta nên ưu tiên chọn loại thông tin muốn giữ lại."
 astral_rift.1005.desc: "Hai từ tiếp theo chúng ta giải mã được là §E“Quê nhà”§! và §E“Chứng kiến”§!. Đáng ngạc nhiên là khi hiểu sâu hơn về những dữ liệu kỳ lạ này, chúng ta còn phát hiện ra dữ liệu hình ảnh được nhúng lẫn trong nhiễu sóng.\n\n$astral_rift.1005.desc.common$"
 astral_rift.1005.a: "Lưu trữ hạt."
 astral_rift.1005.b: "Lưu trữ dữ liệu điều khiển trường."
 astral_rift.1006.name: "$astral_rift.1005.name$"
 astral_rift.1006.desc: "Với sự hỗ trợ tính toán bổ sung, chúng ta đã xử lý xong dữ liệu họ truyền về. Những dữ liệu này thực chất là thông tin liên lạc, không phải một dạng tấn công hay gì khác. Dữ liệu chúng ta nhận được là một câu chuyện được kể bằng chuỗi hình ảnh động.\n\n$astral_rift.1005.desc.common$"
 astral_rift.1006.a: "$astral_rift.1005.a$"
 astral_rift.1006.b: "$astral_rift.1005.b$"
 astral_rift.1010.name: "Giành Lại Quyền Kiểm Soát"
 astral_rift.1010.desc.common.1: "Xung điện từ truyền qua dây neo đã giúp quả cầu thoát khỏi thứ đang trói buộc nó."
 astral_rift.1010.desc.common.2: "Cảm biến đã khôi phục hoạt động hoàn toàn, phi hành đoàn quan sát thấy một thực thể dạng khí ở gần vị trí của họ; có vẻ đây chính là thứ đã khống chế con tàu. Có vẻ như cú sốc điện từ đã làm nó mất khả năng hoạt động, ít nhất là tạm thời.\n\nQuả cầu bị kẹt trong một chiều không gian bỏ túi. Chúng ta bị bao quanh bởi những đám mây xoáy của một tinh vân đặc. Thực thể duy nhất khác được phát hiện chính là sinh vật gần đó.\n\nSau khi hồi phục từ cú sốc, nó bắt đầu oanh tạc quả cầu bằng một loạt các tín hiệu và liên lạc dồn dập.\n\nMáy tính và cảm biến của chúng ta bị quá tải thông tin, việc điều hướng trở nên khó khăn. Chúng ta cần một chút hỗ trợ tính toán để hiểu được những thông tin đang nhận.\n\nChúng ta vẫn chưa rõ liệu mình có được chào đón ở đây hay không."
 astral_rift.1010.desc.gestalt: "$astral_rift.1010.desc.common.1$\n\n$astral_rift.1010.desc.common.2$"
 astral_rift.1010.desc.default: "$astral_rift.1010.desc.common.1$\n\nPhi hành đoàn đều bình an vô sự, nhưng không ai nhớ gì về việc quả cầu mất kiểm soát.\n\n$astral_rift.1010.desc.common.2$"
 astral_rift.1010.a: "Cung cấp hỗ trợ AI."
 astral_rift.1010.b: "Rút lui mau! Chúng ta chỉ làm nó choáng tạm thời thôi."
 astral_rift.1015.name: "Vươn Lên"
 astral_rift.1015.desc: "Thêm nhiều hình ảnh nữa.\n\nChúng ta đã thấy biên niên sử của quê nhà sinh vật ngoài hành tinh này một cách vô cùng chi tiết.\n\nNhững sinh vật này được hình thành từ hàng ngàn năm trước nhờ sự kết hợp tình cờ của khí và năng lượng hội tụ gần một nứt gãy không gian khổng lồ. Chúng có thể tự do ra vào hành tinh của mình như một phần của bầu khí quyển.\n\nKhi kết thúc mỗi chu kỳ sống, tinh hoa của chúng sẽ phân tán khắp hành tinh và tái sinh. Những thành phố trên bầu trời trỗi dậy, sụp đổ, rồi lại phục hưng. Nền văn minh này được xây dựng dựa trên nền tảng của nền văn minh trước đó, kiến thức của chúng được duy trì bằng các hạt tổ tiên này. Khoảng thời gian trôi qua ước tính còn lớn hơn cả lịch sử vũ trụ mà chúng ta đã biết.\n\nCuối cùng, chúng ta chứng kiến nền văn minh của một dạng sống bậc cao đã thức tỉnh. Cấu tạo sinh lý của chúng vượt trội hơn bất kỳ công nghệ nào mà chúng ta có thể tưởng tượng.\n\nChúng ta đã ghi nhận loài mới này vào cơ sở dữ liệu và đặt tên là Kẻ Vô Hình.\n\n§E“Thịnh vượng…”§!\n\nMột lần nữa, lượng dữ liệu chúng ta nhận được lại nhiều hơn khả năng xử lý của máy tính trước khi bị hỏng hoặc thất thoát. Chúng ta nên ưu tiên loại thông tin muốn lưu lại."
 astral_rift.1015.a: "Lưu dữ liệu Vật lý."
 astral_rift.1015.b: "Lưu dữ liệu Xã hội học."
 astral_rift.1020.name: "Vỡ Nát"
 astral_rift.1020.desc: "Hành tinh mẹ dạng khí của chúng ngày càng hiển thị nhiều chi tiết hơn. Lần này, chúng ta nhìn thấy từng cư dân của nó. Những thực thể cấu thành từ ánh sáng, khí và vật chất không gian rò rỉ ra từ nứt gãy gần đó, sống ở một nơi có thể gọi là không tưởng.\n\nCuối cùng, một công trình vĩ đại được dựng lên. Dự án khó tin này kéo dài trực tiếp từ hành tinh của chúng đến nứt gãy, giúp chúng dễ dàng du hành giữa chiều không gian này và vô số chiều không gian khác. Một đường ống không gian tồn tại giữa hai thực tại này quá lâu, chúng đã tạo hình nhiều nứt gãy để đáp ứng các nhu cầu đặc biệt của mình. Xã hội của chúng mở rộng qua nhiều chiều không gian, xâm chiếm toàn bộ vũ trụ hệt như cách chúng ta khai phá các hành tinh mới.\n\nTuy nhiên, thành tựu lớn nhất cũng chính là thảm họa lớn nhất của chúng. Đế chế của chúng bành trướng vượt quá khả năng duy trì của đường ống không gian. Siêu cấu trúc này ngày càng sáng rực đến chói lòa, và cuối cùng phát nổ dữ dội trong một thảm họa liên không gian, hủy diệt hoàn toàn nền văn minh của chúng.\n\n§E“Đồng loại tan vỡ…”§!\n\n§E“Chiến tranh…”§!\n\n§E“Giúp chúng tôi…”§!\n\n§Y$tech_rift_sphere$§! của chúng ta bị ép văng ra khỏi nứt gãy. Một cổng không gian đang từ từ mở ra trong hệ sao [solar_system.GetName]."
 astral_rift.1020.a: "Chúng ta đã mở một cổng không gian..."
 astral_rift.1020.b: "Đóng nó lại! Nhanh lên!"
 astral_rift.1025.name: "Chạy Trốn"
 astral_rift.1025.desc: "Sau khi hệ thống hoạt động trở lại, chúng ta có thể kéo dây neo để thoát khỏi sinh vật trong Nứt Gãy Pha Lê đó.\n\nChúng ta không rõ liệu chúng có thể tung ra sức mạnh thao túng nào nữa không, nhưng tốt nhất là không nên tìm hiểu làm gì.\n\nMay mắn là, những tàn dư nó để lại trên vỏ tàu của chúng ta lại là vật chất không gian cực kỳ đậm đặc."
 astral_rift.1030.name: "Niêm Phong"
 astral_rift.1030.desc: "Một cổng sao vừa được xây dựng trong hệ sao thủ đô đang đặt người dân của chúng ta vào tình thế cực kỳ nguy hiểm.\n\nMay mắn thay, công nghệ thu được từ việc nghiên cứu nứt gãy không gian có thể được dùng để niêm phong vĩnh viễn mối nguy này.\n\nRốt cuộc thứ gì đang muốn thoát ra từ đó vẫn còn là một bí ẩn.\n\nNgười dân của chúng ta coi đây là một chiến thắng vĩ đại trước một kẻ thù hùng mạnh không thể đo lường."
 ###################
 # Khu Vực Ấp Trứng #
 ###################
 lonely_planet_propulsion_modifier: "Thấu Hiểu Cánh Buồm Ánh Sao"
 astral_rift_lonely_planet: "Vùng Đất Ấp Trứng"
 astral_rift.1100.name: "Trứng Khổng Lồ"
 astral_rift.1100.desc: "Tàu thăm dò của chúng ta phát hiện ra một ổ trứng khổng lồ, mỗi quả lớn bằng cả §Y$tech_rift_sphere$§!. Những quả trứng này dự kiến sẽ sớm nở, và chẳng mấy chốc loài sinh vật mà chúng ta còn chưa biết họ hàng của chúng trông ra sao sẽ bò lổm ngổm khắp hành tinh. Chúng ta không phát hiện được sinh vật nào khác sống trên hành tinh này, nên vòng đời của loài này vẫn còn là một bí ẩn.\n\nTrên hành tinh gần như cằn cỗi này, hệ sinh thái không có vẻ gì là đủ để duy trì một quần thể lớn như vậy. Giả thuyết chính của chúng ta là loài này tuân theo một mô hình di cư liên sao nào đó. Bởi vì con trưởng thành của loài này hiện tại chắc chắn đang ở ngoài hành tinh."
 astral_rift.1105.name: "Kẻ Uống Ánh Sao"
 astral_rift.1105.desc: "Trứng đang nở.\n\nNhững sinh vật khổng lồ có cánh lần lượt phá vỏ chui ra. Chúng bẩm sinh đã có khả năng bay lượn, bơi lội giữa không trung theo từng đàn lớn, đôi cánh khổng lồ của chúng phủ bóng râm xuống cả lục địa. Chúng vút bay trên tầng khí quyển, dường như đang đuổi theo ánh sao.\n\nChúng ta vẫn chưa quan sát thấy hành vi kiếm ăn của chúng, điều này có thể cho thấy chúng hấp thụ năng lượng qua một hình thức quang hợp nào đó. Đặc điểm sinh lý của chúng mang lại rất nhiều câu hỏi."
 astral_rift.1105.a: "Tiến lại gần."
 astral_rift.1105.b: "Giữ khoảng cách an toàn."
 astral_rift.1110.name: "Con Non Thân Thiện"
 astral_rift.1110.desc: "Khi chúng ta đến gần, những sinh vật này không tỏ ra sợ hãi, có lẽ do môi trường sống biệt lập của chúng không có kẻ săn mồi nào.\n\nChúng tò mò bay lượn quanh chúng ta, nhờ đó chúng ta dễ dàng lấy mẫu từ tàn dư của trứng và các sinh vật này. Chúng có lớp vảy quang điện, giúp hấp thụ toàn bộ dưỡng chất cần thiết từ các ngôi sao. Cơ thể chúng cũng chịu áp lực rất tốt, cho thấy chúng có thể chống chịu chân không vũ trụ trong thời gian dài. Khả năng cao là những sinh vật này đã tiến hóa để bay lượn lâu dài trong không gian."
 astral_rift.1110.a: "Thật phi thường."
 astral_rift.1110.b.evopred: "Chẳng phải chim cũng chẳng phải động vật chân đốt. Thật kỳ lạ."
 astral_rift.1110.c.bio: "Thứ này khá giống tàu của chúng ta đấy!"
 astral_rift.1115.name: "Cánh Buồm Ánh Sao"
 astral_rift.1115.desc: "Quan sát chuyến bay đầu tiên của những con non này mang lại rất nhiều cảm hứng.\n\nChúng vỗ đôi cánh tựa như những cánh buồm hấp thụ ánh sao, điêu luyện tăng tốc độ đến mức cực nhanh, lướt qua lại và nhào lộn đùa nghịch ở tầng khí quyển trên cao.\n\nChúng không bị trọng lực trói buộc, có thể vượt qua không gian vũ trụ dễ như leo lên thượng tầng khí quyển vậy."
 astral_rift.1115.a: "Thật ấn tượng."
 astral_rift.1120.name: "Di Cư Không Gian"
 astral_rift.1120.desc: "Trong quá trình nghiên cứu sâu hơn về mô hình hành vi của những con non này, một cá thể to hơn cả thiết giáp hạm đột nhiên xuất hiện. Bầy sinh vật bay vây quanh, tranh nhau lại gần con thú khổng lồ này. Có vẻ đây là một con trưởng thành của cùng loài.\n\nHành tinh ẩn giấu này có vẻ là khu vực làm tổ an toàn của những sinh vật liên không gian này. Dưới sự quan sát của chúng ta, con trưởng thành dẫn đàn con bay về phía một nứt gãy mới hình thành ở thượng tầng khí quyển.\n\nKhi xuyên qua nứt gãy, chúng để lại một làn sóng nhiễu loạn không gian, cùng với rất nhiều $astral_threads$."
 astral_rift.1120.a: "Quả là sinh vật phi thường."
 astral_rift.1125.name: "Ấp Trứng Không Gian"
 astral_rift.1125.desc: "$astral_rift.1120.desc$"
 astral_rift.1125.a: "$astral_rift.1120.a$"
 ##################
 # Vũ Trụ Vi Mô #
 ##################
 microverse_knownledge_modifier: "Ngôi Sao Mới Ra Đời"
 astral_rift_microverse: "Vũ Trụ Vi Mô"
 astral_rift.1200.name: "Gia Tốc"
 astral_rift.1200.desc: "Khi quả cầu xuyên qua nứt gãy, chúng ta đã trải qua một đợt gia tốc dữ dội.\n\nLực hấp dẫn khổng lồ của vũ trụ này đã kéo chúng ta vào. Sau một chuyến đi tồi tệ và đầy nguy hiểm, chúng ta thấy mình đang trôi nổi giữa một cụm thiên hà dày đặc, mỗi thiên hà đều nằm trong phạm vi cảm biến giới hạn của quả cầu. Theo như chúng ta biết, đây có vẻ như là toàn bộ vũ trụ này.\n\nBáo cáo sơ bộ còn cho thấy lượng vật chất tối ở đây rất cao; quan trọng hơn, khối lượng vẫn đang tiếp tục tăng. Kết quả trực tiếp là, theo thời gian, lực hấp dẫn đang ngày càng mạnh lên."
 astral_rift.1205.name: "Không Gian Co Rút"
 astral_rift.1205.desc: "Kích thước của vũ trụ này đang co rút lại, và chúng ta dự đoán nó sẽ sụp đổ hoàn toàn vào một thời điểm nào đó.\n\nVấn đề là chúng ta không thể tính toán chính xác khi nào điều đó sẽ xảy ra. Kể từ khi chúng ta đến, hệ thống của quả cầu hoạt động rất kỳ lạ, nhiều điểm dữ liệu trên lõi máy tính đã biến mất, như thể chưa từng được ghi vào.\n\nỞ một nơi khác, người ta quan sát thấy một chậu cây thu rễ lại và biến về thành hạt giống. Thời gian ở đây rõ ràng là không ổn định."
 astral_rift.1210.name: "Thời Gian Rò Rỉ"
 astral_rift.1210.desc.common: "Bên ngoài quả cầu, hậu quả còn kịch tính hơn: quỹ đạo của các tiểu hành tinh hoàn toàn đảo ngược, các hành tinh phân rã thành bụi và khí, toàn bộ thiên hà ngưng tụ ngược lại thành những quả cầu vật chất dễ bay hơi. Thời gian rõ ràng đang chảy ngược, còn chúng ta bị kẹt đâu đó ở giữa.\n\nCuối cùng, thời gian sẽ chạm đến “điểm 0”, và vũ trụ này sẽ thu nhỏ lại bằng đầu đinh ghim.\n\nMặc dù chúng ta có vẻ hơi miễn nhiễm với các hiệu ứng thời gian, quả cầu rõ ràng không kín gió hoàn toàn. Bằng cách đồng bộ máy tính của chúng ta với [Fleet.GetName] bên ngoài nứt gãy, chúng ta có thể cứu vãn những dữ liệu đang tan biến nhanh chóng. Như một biện pháp quyết liệt hơn, chúng ta có thể dùng đặc tính độc đáo của sợi không gian để phân cực lại vỏ tàu và phong ấn lỗ hổng thời gian."
 astral_rift.1210.desc.default: "Những hành tinh co rút và dữ liệu thất thoát mới chỉ là khởi đầu của vấn đề. Những rắc rối này dần ảnh hưởng đến trí nhớ của phi hành đoàn, nhiều người bắt đầu cảm thấy bối rối, quên mất mình đang nghiên cứu gì hoặc thậm chí quên luôn việc mình đã vào nứt gãy.\n\n$astral_rift.1210.desc.common$"
 astral_rift.1210.desc.gestalt: "Những hành tinh co rút và dữ liệu thất thoát mới chỉ là khởi đầu của vấn đề. Các [explorer.GetIndividualNamePlural] ở đầu bên kia nứt gãy cũng gặp phải một vài sự cố bất thường. Trải nghiệm tập thể trở nên bối rối, và chúng ta thấy việc đồng bộ là vô cùng khó khăn.\n\n$astral_rift.1210.desc.common$"
 astral_rift.1210.a: "Đồng bộ với [Fleet.GetName]."
 astral_rift.1210.b: "Phân cực lại vỏ tàu."
 astral_rift.1215.name: "Tình Trạng Khẩn Cấp"
 astral_rift.1215.desc: "[fleet.ship.GetName] đã phản ứng nhanh chóng; chúng ta hiện đang gửi các bản cập nhật định kỳ và bảo lưu thành công các dữ liệu đã thu thập được cho đến nay.\n\nKhông may là chúng ta vẫn bị phơi nhiễm với dòng thời gian dị thường, và ảnh hưởng ngày càng mạnh mẽ...\n\nKhi các phi hành gia của chúng ta lộ rõ dấu hiệu lão hóa, chúng ta phải rút lui chiến lược khỏi vũ trụ này để không bị quá muộn."
 astral_rift.1220.name: "Sinh Đảo Ngược"
 astral_rift.1220.desc: "Vỏ của §Y$tech_rift_sphere$§! đã phân cực lại thành công. Chúng ta giờ đây có thể cách ly khỏi những hiệu ứng giãn nở thời gian cực đoan nhất. Các kiểu mẫu suy nghĩ của chúng ta đã trở lại bình thường và nhiệm vụ có thể tiếp tục.\n\nChúng ta đã sẵn sàng để nghiên cứu đầy đủ về đặc tính vật lý độc đáo của vũ trụ này.\n\nChúng ta có thể bay gần đến một trong những ngôi sao để trực tiếp quan sát “sự sinh đảo ngược” của nó."
 astral_rift.1220.a: "Tiến lại gần hệ sao gần nhất."
 astral_rift.1220.b: "Quan sát vũ trụ này từ rìa."
 astral_rift.1225.name: "Bụi Sao"
 astral_rift.1225.desc.common: "Chúng ta tiến gần một ngôi sao dãy chính loại G đang mờ dần. Khi ánh sáng yếu đi, lẽ ra lượng khí xả ra phải thu lại. Để quan sát được hiện tượng này ở vũ trụ của chúng ta cần đến hàng triệu năm. Đây là cơ hội độc nhất để chứng kiến sự kiện này trong một khoảng thời gian hợp lý."
 astral_rift.1225.desc.default: "$astral_rift.1225.desc.common$\n\nSự phấn khích của phi hành đoàn khi chứng kiến hiện tượng kỳ diệu này hiện rõ trên mặt."
 astral_rift.1225.desc.gestalt: "$astral_rift.1225.desc.common$"
 astral_rift.1225.a: "Cơ hội này qua rồi sẽ không trở lại đâu."
 astral_rift.1230.name: "Khởi Đầu Của Kết Thúc"
 astral_rift.1230.desc: "Chúng ta đã vượt qua ranh giới tầm nhìn của vũ trụ, một kỳ tích thường không thể thực hiện được.\n\nỞ rìa của vũ trụ, là một sự hư vô tuyệt đối vượt qua mọi lý trí.\n\nNhìn về phía tâm, chúng ta thấy mọi thứ hội tụ vào một điểm không gian duy nhất. Lượng dữ liệu vật lý chúng ta thu thập được thật sự khổng lồ.\n\nTuy nhiên, nán lại thêm sẽ là một sai lầm chí mạng, chúng ta phải quay về ngay."
 astral_rift.1230.a: "Thật tuyệt vời."
 astral_rift.1235.name: "Khởi Đầu Của Kết Thúc"
 astral_rift.1235.desc: "Sẽ chẳng còn ngôi sao nào nữa.\n\nChúng ta đã ghi lại thành công mọi chi tiết của sự khai sinh, từ điểm cuối về điểm đầu. Vật chất cấu thành lõi rực cháy giờ chỉ còn là một vòng xoáy sương mù nguyên tử. Kiến thức vật lý lấy được từ đây là vô giá.\n\nTuy nhiên, nán lại thêm sẽ là một sai lầm chí mạng, chúng ta phải quay về ngay."
 astral_rift.1235.a: "Thật tuyệt vời."
 #############
 # Chất Lỏng #
 #############
 astral_rift_fluid: "Chất Lỏng"
 astral_rift.1300.name: "Chất Lỏng"
 astral_rift.1300.desc: "§Y$tech_rift_sphere$§! của chúng ta bị ngập trong một chất lỏng nhớt màu đỏ. Quanh chúng ta trôi nổi những khối vật chất rắn hình đĩa khổng lồ, nhưng đến nay, chúng ta chưa va chạm với bất kỳ khối nào. Một bức tường vật chất rắn bán gel bao quanh chúng ta ở cả bốn phía. Chúng ta trượt đi nhẹ nhàng.\n\nNhịp đập nhịp nhàng mà chúng ta cảm nhận được từ nứt gãy đồng bộ với tần số dao động điều hòa của chất lỏng xung quanh. Cứ mỗi ba giây, chúng ta bị đẩy về phía trước bởi một áp lực, buộc chúng ta tiến sâu hơn vào hệ thống dạng ống. Động cơ của chúng ta rất vất vả để chống lại dòng chảy.\n\nĐây là cơ hội tốt để thu thập mẫu vật, nhưng thiết bị này có thể làm cản trở quá trình di chuyển trong đường hầm ngoằn ngoèo."
 astral_rift.1300.a: "Triển khai lưới thu thập mẫu vật."
 astral_rift.1300.b: "Cứ yên tâm tiến lên."
 astral_rift.1305.name: "Bị Cản Trở"
 astral_rift.1305.desc.common: "Sau khi vào nứt gãy một thời gian, chúng ta đột ngột dừng lại, thiết bị lấy mẫu kéo phía sau đã bị kẹt ở đoạn hẹp của hệ thống hầm.\n\nChúng ta đã cố gắng dùng lực đẩy đứt quãng để thoát ra, nhưng sức mạnh của dòng chảy khiến chúng ta không thể tạo ra tiến triển nào đáng kể."
 astral_rift.1305.desc.no_gases: "$astral_rift.1305.desc.common$\n\nChúng ta không còn cách nào khác ngoài việc cắt bỏ thiết bị lấy mẫu để tiếp tục di chuyển."
 astral_rift.1305.desc.gases: "$astral_rift.1305.desc.common$\n\nLựa chọn an toàn nhất là cắt bỏ thiết bị lấy mẫu và đi tiếp. Tuy nhiên, nếu bơm một lượng khí ngoại lai vào động cơ đẩy, chúng ta vẫn có thể giữ lại được mẫu vật."
 astral_rift.1305.a: "Cắt nó đi. Không đáng để mạo hiểm thế đâu."
 astral_rift.1305.b: "Sử dụng khí đốt khẩn cấp."
 astral_rift.1310.name: "Khoang Chứa"
 astral_rift.1310.desc.common: "Dòng chảy tầng dọc theo thành hầm giúp chúng ta giữ thăng bằng rất tốt ở giữa hầm trong suốt hành trình. Vài ngày trôi qua mà không có sự cố lớn nào. Các dị vật hình đĩa xung quanh chúng ta cũng bị kẹt trong dòng chảy; chúng lướt qua quả cầu một cách nhẹ nhàng.\n\nChúng ta không thấy bất kỳ bằng chứng nào về sự sống có tri giác. Thực tế, đến lúc này, giả thuyết mạnh nhất là chúng ta đang ở trong một siêu sinh vật khổng lồ và vô danh nào đó. Nếu hệ thống phòng ngự tự nhiên của nó phát hiện ra chúng ta, thì chúng ta vẫn chưa thấy.\n\nChúng ta hiện đang ở trong một khoang khổng lồ. Dọc các bức tường là những phần nhô ra giống như tĩnh mạch. Thành khoang phình ra và co lại đều đặn, ép hàng triệu lít chất lỏng qua một lối ra.\n\nKhi cố gắng giữ vững vị trí, chúng ta phát hiện một lối vào thứ hai của khoang. Dấu vết vật chất tinh thể lơ lửng trong chất lỏng chảy ra từ đường hầm. Áp lực dòng chảy rất thấp, chỉ cần một chút khéo léo trong điều hướng, chúng ta có thể khám phá được cái lỗ này."
 astral_rift.1310.desc: "Chúng ta đã cắt lưới lấy mẫu, sau đó nhận thấy khu vực xung quanh thiết bị dường như đang dần tối đen và bị nuốt chửng.\n\n$astral_rift.1310.desc.common$"
 astral_rift.1310.a: "Ra ngoài theo dòng chất lỏng."
 astral_rift.1310.b: "Khám phá lỗ tinh thể."
 astral_rift.1311.name: "$astral_rift.1310.name$"
 astral_rift.1311.desc: "Nhờ bơm khí ngoại lai vào động cơ, cuối cùng chúng ta đã giật được thiết bị lấy mẫu khỏi thành ống, từ đó có thể lấy lại những mẫu vật quý giá này.\n\n$astral_rift.1310.desc.common$"
 astral_rift.1311.a: "$astral_rift.1310.a$"
 astral_rift.1311.b: "$astral_rift.1310.b$"
 astral_rift.1315.name: "Khối Dị Hình"
 astral_rift.1315.desc.common: "Đột nhiên, ở cách đó vài trăm mét xuất hiện một khối dị hình có kích thước bằng cả con tàu không gian. Chúng ta cố gắng quan sát nó từ xa nhưng lại thu hút sự chú ý của nó.\n\nThực thể này đang nhanh chóng hấp thụ §Y$tech_rift_sphere$§! qua lớp màng của nó. Bên trong nó chủ yếu là một loại enzyme ăn mòn; ngay lúc chúng ta đang nói đây, lớp vỏ quả cầu đang bị tiêu hóa."
 astral_rift.1315.desc_no_gestalt: "Chỉ huy chiến thuật của chúng ta đề nghị rút lui ngay lập tức, nhưng nhà sinh học của chúng ta cho rằng có thể vô hiệu hóa enzyme bằng cách kết hợp các loại khí và chất lỏng mà chúng ta đang có."
 astral_rift.1315.desc_gestalt: "Có lẽ cần phải rút lui khẩn cấp, nhưng chúng ta cũng suy đoán rằng có thể vô hiệu hóa enzyme bằng sự kết hợp khí và chất lỏng thích hợp."
 astral_rift.1315.desc.default: "Ở phía bên kia lỗ hổng, chúng ta đi vào một khoang khác. Quy mô của khoang này khiến tất cả những cái chúng ta từng thấy trở nên nhỏ bé. Ở đây, những xúc tu phân nhánh tinh xảo mỏng manh vươn ra mọi hướng. Chúng đan xen vào nhau phức tạp đến mức chúng ta khó lòng tiến lên thêm bước nào. Chất lỏng trong môi trường này đầy khí, rất dễ để chúng ta thu thập.\n\n$astral_rift.1315.desc.common$"
 astral_rift.1315.desc.gases.default: "$astral_rift.1315.desc.default$\n\n$astral_rift.1315.desc_no_gestalt$"
 astral_rift.1315.desc.gases.gestalt: "$astral_rift.1315.desc.default$\n\n$astral_rift.1315.desc_gestalt$"
 astral_rift.1315.a: "Kéo neo về ngay lập tức."
 astral_rift.1315.b: "Bơm khí ngoại lai vào, giết chết con quái thú này."
 astral_rift.1316.name: "$astral_rift.1315.name$"
 astral_rift.1316.desc.default: "Suốt chặng đường vật lộn với chất lỏng, cuối cùng chúng ta cũng lách được vào một nhánh của căn phòng trước. Chúng ta bước vào một hang động cấu tạo từ những viên pha lê lấp lánh, các bức tường xung quanh lọc chất lỏng từ mọi hướng, để lại lớp cặn kết tinh.\n\n$astral_rift.1315.desc.common$"
 astral_rift.1316.desc.gases.default: "$astral_rift.1316.desc.default$\n\n$astral_rift.1315.desc_no_gestalt$"
 astral_rift.1316.desc.gases.gestalt: "$astral_rift.1316.desc.default$\n\n$astral_rift.1315.desc_gestalt$"
 astral_rift.1316.a: "$astral_rift.1315.a$"
 astral_rift.1316.b: "$astral_rift.1315.b$"
 astral_rift.1320.name: "Trích Xuất"
 astral_rift.1320.desc.common: "Mặc dù enzyme axit của sinh vật này rất nguy hiểm cho vỏ tàu, nhưng chúng ta có thừa thời gian để kích hoạt neo khẩn cấp và chạy thoát về đầu bên kia của nứt gãy."
 astral_rift.1320.desc.no_rig: "$astral_rift.1320.desc.common$\n\nTuy nhiên, chuyến đi của chúng ta cũng không hoàn toàn vô ích. Có một lượng lớn vật chất từ con thú đó dính trên vỏ tàu. Các nhà sinh học của chúng ta hy vọng có thể điều tra những bí mật chứa bên trong."
 astral_rift.1320.desc.rig: "$astral_rift.1320.desc.common$\n\nTuy nhiên, chuyến đi của chúng ta cũng không hoàn toàn vô ích. Lưới lấy mẫu của chúng ta đã vớt được một lượng lớn vật chất từ con thú đó. Các nhà sinh học hy vọng có thể điều tra những bí mật chứa bên trong."
 astral_rift.1320.b.evopred: "Trung hòa axit đi, rồi cho chúng tôi một ly."
 astral_rift.1325.name: "Hòa Tan"
 astral_rift.1325.desc.common.1: "Mặc dù có kích thước khổng lồ, cấu trúc sinh học của sinh vật này lại cực kỳ nguyên thủy.\n\nKhông lâu sau khi xả hỗn hợp khí đặc biệt của chúng ta, màng của nó đã bị hòa tan. Tính toàn vẹn của tế bào bị phá vỡ, chất chứa bên trong thoát ra dòng chảy xung quanh, cho đến khi chỉ còn lại cái lõi khổng lồ.\n\nChúng ta vui mừng báo cáo về việc thu hồi thành công vật thể này, nó hoàn toàn không khác gì nhân tế bào của nhiều loài sinh vật đơn bào trong chiều không gian của chúng ta."
 astral_rift.1325.desc.common.2: "Chúng ta suy đoán rằng sinh vật này là một dạng kháng thể trong hệ thống chất lỏng và đường ống khổng lồ này, và nó coi chúng ta như một mối đe dọa ngoại lai. Chúng ta mang chiến lợi phẩm trở về với đầy thương tích."
 astral_rift.1325.desc.no_rig: "$astral_rift.1325.desc.common.1$\n\n$astral_rift.1325.desc.common.2$"
 astral_rift.1325.desc.rig: "$astral_rift.1325.desc.common.1$\n\nNgoài ra, chiếc lưới lấy mẫu cứu được trước đó có thể mang lại lượng lớn vật chất từ con quái thú này. Các nhà sinh học của chúng ta nóng lòng muốn nghiên cứu những bí ẩn ẩn giấu trong đó.\n\n$astral_rift.1325.desc.common.2$"
 astral_rift.1330.name: "Hòa Tan"
 astral_rift.1330.desc.gestalt: "Chúng ta đã mất liên lạc với [explorer.GetTeamMemberPlural].\n\nTheo quy trình tiêu chuẩn, chúng ta đã kéo dây neo và thu hồi những gì còn lại của §Y$tech_rift_sphere$§!.\n\nNó gần như bị hòa tan hoàn toàn, một lượng lớn sinh khối nồng độ cao bao bọc lấy từng tấc tàn tích. Chúng ta tin chắc rằng điều này có thể mang lại những bước đột phá mới về công nghệ."
 astral_rift.1330.desc.default: "Chúng ta đã mất liên lạc với nhóm nghiên cứu.\n\nTheo quy trình tiêu chuẩn, chúng ta đã kéo dây neo và thu hồi những gì còn lại của §Y$tech_rift_sphere$§!.\n\nNó gần như bị hòa tan hoàn toàn, một lượng lớn sinh khối nồng độ cao bao bọc lấy từng tấc tàn tích. Các nhà sinh học của chúng ta tin chắc rằng điều này có thể mang lại những bước đột phá mới về công nghệ.\n\nChúng ta biểu dương lòng dũng cảm của toàn bộ phi hành đoàn. Tên tuổi của họ sẽ được khắc ghi."
 ##############
 # Khu Vườn #
 ##############
 infinity_root_leader_desc: "§Y[Root.GetName]§! được sinh ra từ hạt giống của $r_infinity_root$. [Root.GetSheHeCap] vừa bước vào thế giới này, nhưng đã sở hữu trí tuệ đáng nể."
 garden_astral_rift_resurrected_leader_desc: "§Y[Root.GetName]§! không hiểu sao lại sống sót trở về từ một chuyến thám hiểm nứt gãy không gian thất bại, nơi tràn ngập các loài thực vật. Dù [Root.GetHeShe] không còn trông giống như trước nữa, nhưng [Root.GetHeShe] vẫn giữ được những nét tính cách đặc trưng."
 astral_rift_garden: "Khu Vườn"
 astral_rift.1400.name: "Bụi Gai"
 astral_rift.1400.desc: "Chúng ta đến một căn phòng mọc đầy dây leo xanh ngắt.\n\nNhững bụi gai nhọn hoắt chìa ra ở gần như mọi khúc quanh.\n\nChúng ta nhanh chóng nhận ra các sinh vật này có ý thức nào đó, hoặc ít nhất là một bản năng phòng vệ.\n\nChúng ta nhận thấy nồng độ oxy trong khí quyển cao bất thường. Chúng ta đoán rằng việc đốt trụi đám gai góc phiền phức này sẽ rất dễ dàng.\n\nMặt khác, làm vậy chắc chắn sẽ phá hủy những mẫu vật mà chúng ta có thể thu thập được. Chúng ta quan sát thấy một lượng lớn quả đầy lông bám trên thân cây, thứ có thể mang lại cái nhìn sâu sắc về hệ thực vật này."
 astral_rift.1400.a: "Đốt sạch đám cỏ dại này đi."
 astral_rift.1400.b: "Hái quả."
 astral_rift.1405.name: "Sa Lưới"
 astral_rift.1405.desc: "Chúng ta bị mắc kẹt.\n\nBề mặt nhẵn bóng của §Y$tech_rift_sphere$§! khiến những cái cây này không có chỗ để bám vào, nhưng dây neo của chúng ta lại bị những sợi dây leo quấn chặt từ mọi phía.\n\nMặc dù có những chướng ngại vật này, nếu chúng ta muốn trở về an toàn và rời khỏi nứt gãy, thì không một loài thực vật nào có thể cản đường lui của chúng ta. Lượng sinh khối chúng ta mang theo có lẽ sẽ có chút tác dụng.\n\nTuy nhiên, nếu muốn tiếp tục khám phá, lựa chọn thực tế duy nhất sẽ là đốt trụi lá cây. Ngọn lửa tạo ra sẽ rất dữ dội. Ở cự ly gần như thế, tàu của chúng ta có nguy cơ bị hư hỏng."
 astral_rift.1405.a: "Đốt đống dây leo rườm rà này."
 astral_rift.1405.b: "Kéo neo về ngay."
 astral_rift.1410.name: "Thung Lũng Trống"
 astral_rift.1410.desc.common: "Sau khi giải quyết mối nguy trước mắt, chúng ta khám phá kỹ lưỡng hơn môi trường xung quanh.\n\nChúng ta đang ở sâu trong một chuỗi hang động.\n\nXuyên qua một đường hầm gần đó, chúng ta đi vào một thung lũng rộng lớn hơn. Những cụm thực vật dạng rễ cây rủ xuống từ trần nhà, nhỏ từng giọt chất lỏng dính lên lá bên dưới, sau đó bị hấp thụ bởi nhiều loại cây khác. Nơi này có một hệ sinh thái thịnh vượng của riêng mình. Chắc chắn phải mất hàng nghìn năm mới hình thành được một môi trường vững chãi như thế này.\n\nCác tua cuốn ở khu vực này còn dày đặc hơn cả chỗ chúng ta mới đến."
 astral_rift.1410.desc.burn: "Đúng như dự đoán, nồng độ oxy cao trong không khí đã tạo ra một ngọn lửa nhanh chóng nuốt chửng những loài cây gai góc này.\n\nThoát khỏi trở ngại, chúng ta tiếp tục khám phá. Chúng ta có thể thu gom được lượng lớn tro trộn lẫn với vật chất không gian từ rìa nứt gãy.\n\n$astral_rift.1410.desc.common$"
 astral_rift.1410.desc.extract: "Vừa luồn lách qua những dây leo, chúng ta vừa dùng công cụ thu thập mẫu để cắt vài quả từ cành. Mỗi lần bứt một rễ, phần còn lại sẽ rũ xuống một bên. Cuối cùng, chúng ta cũng hái đủ lượng quả và thiết lập được một khu vực an toàn diện rộng.\n\nThứ “quả” của các loài cây này thực chất mang đặc tính giống nấm hơn, có vẻ chúng sống cộng sinh với toàn bộ hệ rễ cây. Chúng ta mang một ít mẫu lên tàu để nghiên cứu thêm.\n\nChúng ta suy đoán loại nấm này là một dạng cụm rễ thần kinh của loài thực vật mà chúng ký sinh.\n\n$astral_rift.1410.desc.common$"
 astral_rift.1410.a: "Đốt sạch hết."
 astral_rift.1410.b: "Nghiên cứu nơi này."
 astral_rift.1415.name: "Lửa Cháy Dữ Dội"
 astral_rift.1415.desc: "Rất tiếc, chúng ta đã mất liên lạc với đội khoa học trên §Y$tech_rift_sphere$§!.\n\nKhi thu hồi, hơn một nửa quả cầu đã hoàn toàn tan chảy thành cặn bã. Toàn bộ phi hành đoàn đã hy sinh dũng cảm.\n\nChúng ta lắp lại §Y$tech_rift_sphere$§! vào tàu nghiên cứu để tiếp tục tiến hành các hoạt động khám phá không gian khác."
 astral_rift.1420.name: "Chạy Trốn"
 astral_rift.1420.desc: "Hiểm nguy tiềm ẩn ở nơi này không đáng để đánh cược.\n\nChúng ta đã kéo neo và đưa [explorer.GetTeamMemberPlural] về nơi an toàn.\n\nCác mẫu vật chúng ta thu được có một vài đặc tính khá thú vị."
 astral_rift.1420.b.evopred: "Phân loại các khám phá."
 astral_rift.1425.name: "Sinh Vật Chưa Rõ"
 astral_rift.1425.desc.common.1: "Chúng ta dùng lửa dọn sạch phần lớn hang động này."
 astral_rift.1425.desc.common.2: "Môi trường sống ở đây không hề có những hiện tượng như giông bão, những sinh vật này có thể đã hoàn toàn thích nghi với một môi trường không có nguy cơ cháy nổ.\n\nNgay sau khi ngọn lửa cuối cùng tắt ngấm, một sinh vật kỳ lạ từ trong đống tro tàn bước ra. Nó có hàng trăm chi, bò lổm ngổm một cách hoảng loạn giữa đám than hồng. Các chi phụ giống như móng vuốt miệt mài sàng lọc trong đống tro. Một âm thanh trầm thấp, mềm mại phát ra từ vài màng trên cơ thể nó.\n\nSau đó nó chuyển sự chú ý sang chúng ta. Đầu nghiêng sang một bên, một hàng gai vảy mọc ra từ cổ nó. Con vật lấp lánh này đang phát ra những âm thanh gấp gáp, nhịp nhàng về phía chúng ta."
 astral_rift.1425.desc.previousburn: "$astral_rift.1425.desc.common.1$\n\nGiống như lúc trước, đám cây cối này nhanh chóng tan tành trong ngọn lửa lớn. Chúng ta cũng quan sát thấy chất lỏng phủ trên bề mặt các cây này đóng vai trò như chất xúc tác cháy.\n\n$astral_rift.1425.desc.common.2$"
 astral_rift.1425.desc.nopreviousburn: "$astral_rift.1425.desc.common.1$\n\nĐúng như dự đoán, nồng độ oxy cao trong không khí đã châm ngòi cho ngọn lửa dữ dội, chớp mắt đã nuốt chửng những bụi gai này.\n\n$astral_rift.1425.desc.common.2$"
 astral_rift.1425.a: "Chạy mau."
 astral_rift.1425.b: "Đừng hành động thiếu suy nghĩ."
 astral_rift.1425.c: "Đốt luôn cả nó."
 astral_rift.1430.name: "Sinh Vật Chưa Rõ"
 astral_rift.1430.desc: "Dù đã cố gắng hết sức để nghiên cứu mật thất, nhưng chúng ta vẫn bị một sinh vật nguy hiểm tiềm ẩn phát hiện.\n\nBan đầu chúng ta thấy nó ở trong bụi gai, bò chính xác bằng hàng trăm chiếc chân của mình. Khi nó tìm trái cây trên từng gốc cây và tiến hành chăm bón, một âm thanh mềm mại nhưng sắc nhọn phát ra từ vài lớp màng trên cơ thể nó.\n\nThật không may, vỏ tàu của chúng ta va vào một lùm lá rộng và giòn. Nghe thấy tiếng động, nó nhanh chóng chuyển sự chú ý sang chúng ta. Đầu nghiêng sang một bên, một hàng gai vảy vươn ra từ cổ. Con vật lấp lánh này phát ra những âm thanh dồn dập, nhịp nhàng về phía chúng ta."
 astral_rift.1430.a: "Chạy mau."
 astral_rift.1430.b: "Đốt luôn cả nó."
 astral_rift.1435.name: "Bị Phát Hiện"
 astral_rift.1435.desc: "Thật không may, chúng ta đã thu hút sự chú ý của sinh vật này. Đầu nó nghiêng sang một bên, một hàng gai vảy vươn ra từ cổ. Con vật lấp lánh này phát ra những âm thanh dồn dập, nhịp nhàng về phía chúng ta.\n\nChúng ta không cách nào tiếp tục nghiên cứu nó được nữa.\n\nChúng ta dự đoán nếu phải đối mặt với ngọn lửa dữ dội, nó hẳn cũng yếu ớt như hầu hết các loài sinh vật ở đây. Dù sao thì, bây giờ tốt nhất vẫn là bỏ chạy để giảm thiểu tổn thất."
 astral_rift.1435.a: "Chạy mau."
 astral_rift.1435.b: "Đốt luôn cả nó."
 astral_rift.1440.name: "Sinh Vật Chưa Rõ"
 astral_rift.1440.desc: "Có thứ gì đó đang rình rập trong khu rừng rậm.\n\nKhi chúng ta tìm được một vị trí ẩn nấp để nghiên cứu không gian này, một sinh vật kỳ lạ nhanh chóng xuất hiện từ đám lá. Ban đầu chúng ta thấy nó ở trong bụi gai, bò chính xác bằng hàng trăm chiếc chân của mình. Khi nó tìm trái cây trên từng gốc cây và tiến hành chăm bón, một âm thanh mềm mại nhưng sắc nhọn phát ra từ vài lớp màng trên cơ thể nó.\n\nChúng ta đã quan sát một lúc và tin rằng việc tiếp tục theo dõi chắc chắn có thể mang lại cơ hội nghiên cứu giá trị.\n\nChúng ta dự đoán nếu phải đối mặt với ngọn lửa dữ dội, nó hẳn cũng yếu ớt như hầu hết các loài sinh vật ở đây. Nếu có cơ hội, có lẽ tốt nhất là nên kết liễu nó."
 astral_rift.1440.a: "Đốt luôn cả nó."
 astral_rift.1440.b: "Tiếp tục nghiên cứu."
 astral_rift.1445.name: "Vật Chất Hành Tinh"
 astral_rift.1445.desc: "Chúng ta đã mất liên lạc với §Y$tech_rift_sphere$§!.\n\nTheo quy trình tiêu chuẩn, chúng ta đã kéo dây neo và thu hồi lại con tàu.\n\nBên trong không có bất kỳ tàn tích nào của [explorer.GetTeamMemberPlural]. Tuy nhiên, thành phần đặc trưng của họ có thể được phát hiện trong một hệ rễ khổng lồ hiện đang chiếm cứ toàn bộ không gian bên trong khoang máy.\n\nBản thân quả cầu đã được mang đến nơi khác để nghiên cứu thêm. Có lẽ chúng ta có thể trồng những cây này ở đâu đó."
 astral_rift.1445.b.evopred: "Sự hy sinh của họ sẽ không vô ích. Có thể giải phẫu được rồi."
 astral_rift.1450.name: "Rễ Cây Vô Tận"
 astral_rift.1450.desc: "Gã này có vẻ lạ lẫm với lửa.\n\nNgay khi chúng ta thắp lên đốm lửa đầu tiên, nó đã hoảng loạn chạy trốn - động tác nhanh lẹ này hẳn là một loại bản năng.\n\nCó lẽ nó đã nhận ra đặc tính dễ cháy của môi trường này từ lâu. Bất kể lý do là gì, nó đã tẩu thoát vào cái xó xỉnh nào đó mà chúng ta không thể tìm thấy bất kỳ dấu vết nào của nó trong phạm vi cảm biến.\n\nSau khi nó rời đi, chúng ta tìm thấy một thứ nó làm rơi lúc tháo chạy. Chắc do quá nặng không mang theo được nên nó đã vứt lại.\n\nCác thí nghiệm đơn giản của chúng ta cho thấy, dù đặt vật thể này ở đâu, nó cũng lập tức mọc ra những chiếc tua cuốn nhỏ, tìm kiếm nơi ở mới để định cư và sinh sôi. Chỉ cần có độ ẩm, những tua cuốn này sẽ tập trung lại và phát triển mạnh mẽ.\n\nĐáng kinh ngạc là, loài thực vật mọc ra từ đó cho thấy những dấu hiệu trí tuệ độc đáo, ngay cả khi còn là chồi non.\n\nChúng ta tin rằng nó thậm chí có thể trở thành tài sản quý giá cho đế chế của chúng ta."
 astral_rift.1450.b.evopred: "Hoàn hảo. Bất kể lấy mẫu thế nào nó cũng sẽ tái sinh."
 astral_rift.1455.name: "Nghiên Cứu Chuyên Sâu"
 astral_rift.1455.desc.common: "Chúng ta đã lén lút quan sát công việc khó nhọc của sinh vật này trong khu vườn ẩn giấu suốt một khoảng thời gian dài, không biết chúng ta còn ở đây được bao lâu mà không bị phát hiện."
 astral_rift.1455.desc: "$astral_rift.1455.desc.common$\n\nMỗi đốt trên cơ thể sinh vật này đều mọc một cặp xúc tu. Những xúc tu này giúp nó phát hiện và loại bỏ sâu bọ trên các lông mao của loài cây mà nó trồng. Cấu trúc giải phẫu của những xúc tu này vượt ngoài sự hiểu biết của chúng ta về chức năng cơ quan sinh học."
 astral_rift.1455.a: "Tiếp tục nghiên cứu."
 astral_rift.1456.name: "Nghiên Cứu Chuyên Sâu"
 astral_rift.1456.desc: "$astral_rift.1455.desc.common$\n\nChúng ta nhận thấy nó dùng một cặp chân trước khổng lồ giữ chặt một khối hữu cơ trông giống như “trái cây” trước ngực. Vài lần, chúng ta quan sát thấy nó dùng xương hàm đào vào vật thể này, rồi cấy một phần nhỏ của nó sang các cây lân cận. Nó rõ ràng đang nhân giống các loài thực vật này. Điều này giải thích tại sao các cây này không có loài thụ phấn hay phương thức sinh sản nào có thể nhận diện được."
 astral_rift.1457.name: "Rễ Cây Vô Tận"
 astral_rift.1457.desc: "$astral_rift.1455.desc.common$\n\nSinh vật này đào một cái hố nhỏ rồi đặt thứ nó đang cầm vào. Cùng lúc chạy lao đi, nó dùng hàng trăm cái chân để lấp thứ đó xuống lớp đất nông.\n\nSau khi chắc chắn sinh vật này không sớm quay lại, chúng ta đã đào thứ đó đi.\n\nCác thí nghiệm đơn giản của chúng ta cho thấy, dù đặt ở đâu, loại vật chất này cũng lập tức mọc ra những chiếc tua cuốn nhỏ, tìm kiếm nơi ở mới để cắm rễ và phát triển. Chỉ cần có độ ẩm, những tua cuốn này sẽ tập trung lại và phát triển mạnh mẽ.\n\nĐáng kinh ngạc là, loài thực vật mọc ra từ đó cho thấy những dấu hiệu trí tuệ độc đáo, ngay cả khi còn là chồi non.\n\nChúng ta tin rằng nó thậm chí có thể trở thành tài sản quý giá cho đế chế của chúng ta."
 astral_rift.1465.name: "Gieo Hạt"
 astral_rift.1465.desc: "Vài năm trước, §Y[from.GetName]§! đã bị dị hóa thành một búi rễ và lá cây trong một chuyến thám hiểm tới nứt gãy không gian đầy thực vật. Hôm nay, một đồng nghiệp của người này tuyên bố đã đạt được bước đột phá lớn, người này đã khôi phục lại tâm trí cho §Y[from.GetName]§!!\n\nMặc dù [From.GetHeShe] không còn nhớ về bản thân mình trước đây nữa, nhưng [From.GetHeShe] vẫn giữ được những nét tính cách tương tự. Một trang đời hoàn toàn mới đang mở ra trước mắt [From.GetHimHer]."
 astral_rift.1465.tt: "§Y[from.GetName]§! đã trở lại để phục vụ cho chúng ta!"
 ################
 # Tàn Tích Sa Mạc #
 ################
 astral_rift_desert_ruins: "Tàn Tích Sa Mạc"
 astral_rift.1500.name: "Bảng Điều Khiển Kỳ Lạ"
 astral_rift.1500.desc: "Các tòa nhà bỏ hoang nằm rải rác lộn xộn trên sa mạc.\n\nTừ bên trong mái vòm khổng lồ lớn nhất trong số đó, tỏa ra một ánh sáng vàng yếu ớt. Từ sàn lên đến trần nhà, các bức tường cong bên trong được bao phủ bởi một loại văn tự chưa từng biết đến.\n\nỞ trung tâm của căn phòng chính là một bảng điều khiển với hai nút bấm lớn: một nút §Bmàu xanh lam§! đậm, một nút §Gmàu xanh lục§! sáng. Chúng ta đang giải mã văn tự trên tường để xem liệu nó có thể cung cấp gợi ý về chức năng của bảng điều khiển này hay không."
 astral_rift.1505.name: "Mắc Kẹt Trong Thời Gian"
 astral_rift.1505.desc: "Đã một thời gian dài trôi qua kể từ lần cuối nhận được tin tức từ [Leader.GetName]. Tiếp tục chờ đợi họ quay lại cũng chẳng còn ý nghĩa gì nữa.\n\nChúng ta thu lại dây neo, kéo quả cầu trống rỗng trở về chiều không gian của chúng ta."
 astral_rift.1505.a: "Tỷ lệ sống sót là bao nhiêu?"
 astral_rift.1510.name: "Tàn Tích Vòng Ngoài"
 astral_rift.1510.desc.common: "……Mặt đất bên trong mái vòm tỏa ra ánh sáng vàng mờ ảo. Một loại văn tự chưa từng thấy phủ kín từ trên xuống dưới các bức tường.\n\nỞ trung tâm căn phòng chính là một bảng điều khiển với hai nút bấm lớn, một §Bmàu xanh lam§! đậm, một §Gmàu xanh lục§! sáng. Chúng ta đã bắt đầu giải mã văn tự trên tường để xem liệu nó có cung cấp gợi ý nào về chức năng của bảng điều khiển này hay không."
 astral_rift.1510.desc.default: "$astral_rift.1510.desc.common$"
 astral_rift.1510.desc.psionic_or_latent: "$astral_rift.1510.desc.common$\n\n[Leader.GetName] báo cáo về sự khó khăn khi bước vào mái vòm này. Rõ ràng ở đây có thứ gì đó rất kỳ lạ."
 astral_rift.1510.desc.psionic_or_latent_robot: "$astral_rift.1510.desc.common$\n\n[Leader.GetName] đã báo cáo lỗi cảm biến khi tiến vào mái vòm. Khuyến cáo nên hành động thận trọng."
 astral_rift.1510.b.default: "Rốt cuộc chuyện gì đã xảy ra? Họ đã bị lạc sao?"
 astral_rift.1510.b.hive: "Điều này không hợp lý, chẳng phải họ đã bị lạc rồi sao?"
 astral_rift.1510.b.robot: "Ngừng tính toán. Họ đã bị lạc. Mặc dù vậy, đã hiểu."
 astral_rift.1515.name: "Mất Liên Lạc"
 astral_rift.1515.desc.default: "Chúng tôi rất tiếc phải thông báo rằng, chúng ta đã hoàn toàn mất liên lạc với đội ngoại phái.\n\nBáo cáo cuối cùng nhận được là một đoạn tiếng la hét không rõ ràng, tiếp theo là sự im lặng.\n\nNhững nỗ lực thiết lập lại liên lạc đều không thành công.\n\nChúng ta vẫn chưa kéo neo khẩn cấp, hy vọng đội ngũ này vẫn có thể quay lại, nhưng hy vọng có vẻ khá mong manh."
 astral_rift.1515.desc.gestalt: "Chúng ta đột ngột mất liên lạc với [explorer.GetIndividualNamePlural]. Nhưng tạm thời chúng ta vẫn chưa kéo dây neo khẩn cấp, hy vọng đó chỉ là mất liên lạc tạm thời. Vì không có cách nào để tiến vào nứt gãy, đây là điều duy nhất chúng ta có thể làm."
 astral_rift.1515.a: "Hãy hy vọng vào điều tốt đẹp nhất."
 astral_rift.1520.name: "Lựa Chọn"
 astral_rift.1520.desc.default: "Chúng ta đã đồng bộ thành công với đội ngũ khoa học đang vô cùng bối rối.\n\nHọ hoàn toàn không có ký ức gì về việc gửi hai báo cáo hay bất kỳ thảm họa nào. Dấu thời gian của hai báo cáo trùng lặp hoàn toàn khớp nhau. Điều này có nghĩa là dòng thời gian ở đây chắc chắn đã bị nhiễu loạn theo một cách nào đó.\n\nCác nhà khoa học của chúng ta đã bị mắc kẹt. Một mái vòm bao phủ chặt chẽ lên họ, và việc liên lạc với §Y$tech_rift_sphere$§! cũng chỉ giới hạn ở tín hiệu vô tuyến.\n\nQua việc tính toán chênh lệch thời gian giữa báo cáo này và báo cáo trước, trong vòng 3 giờ thời gian tương đối, đội ngoại phái này sẽ đạt đến thời điểm mà tiếng hét lặp lại. Trong khoảng thời gian ngắn ngủi như vậy, việc dịch các văn tự trên tường là không khả thi, giải pháp khả dĩ duy nhất cho đội ngũ khoa học là nhấn một trong các nút trên bảng điều khiển, với hy vọng cải thiện tình trạng hiện tại.\n\nCho dù là nút §Bmàu xanh lam§! hay §Gmàu xanh lục§!, hoàn toàn không có bất kỳ gợi ý nào về sự khác biệt trong chức năng của chúng.\n\nChúng ta chỉ có thể trông chờ vào may mắn thôi."
 astral_rift.1520.desc.gestalt: "Chúng ta đã thiết lập lại đồng bộ thành công với [explorer.GetIndividualNamePlural] bị mất liên lạc.\n\nĐã xuất hiện một số điểm không nhất quán: họ không nhớ đã gửi hai báo cáo, cũng không nhớ sự kiện khiến họ đột ngột im lặng.\n\nTính toán dấu thời gian giữa báo cáo này và báo cáo trước, các [explorer.GetIndividualNamePlural] của chúng ta còn 3 giờ thời gian tương đối trước khi bị ngắt kết nối một lần nữa. Dịch các văn tự trên tường trong thời hạn này là không khả thi. Mặc dù không có giải thích về chức năng của nút §Bmàu xanh lam§! hay §Gmàu xanh lục§!, điều khả thi duy nhất là nhấn một trong hai nút, hy vọng nó sẽ cải thiện tình hình."
 astral_rift.1520.a: "Nhấn nút §Bmàu xanh lam§!."
 astral_rift.1520.b: "Nhấn nút §Gmàu xanh lục§!."
 astral_rift.1525.name: "Nút Màu Xanh Lam"
 astral_rift.1525.desc.common: "Đội ngũ khoa học của chúng ta đã trở lại, chúng ta đã thiết lập liên lạc thành công. Theo giờ địa phương, chúng ta còn 2 giờ để giải cứu họ.\n\nSau khi đã thử nút §Gmàu xanh lục§!, giờ chúng ta chỉ còn lại lựa chọn §Bmàu xanh lam§!."
 astral_rift.1525.desc.default: "$astral_rift.1525.desc.common$"
 astral_rift.1525.desc.psionic_or_latent: "$astral_rift.1525.desc.common$\n\nChúng ta chưa kịp ra lệnh, [Leader.GetName] đã nói với chúng ta rằng, khi [Leader.GetHeShe] nhìn chằm chằm vào nút §Gmàu xanh lục§!, một nỗi sợ hãi sâu sắc đã bao trùm lấy họ. [Leader.GetHeSheCap] cực kỳ khuyến nghị vẫn nên thử nút §Bmàu xanh lam§!."
 astral_rift.1525.desc.psionic_or_latent_robot: "$astral_rift.1525.desc.common$\n\nBộ xử lý linh năng của [Leader.GetName] tính toán ra giải pháp tối ưu là nhấn nút §Bmàu xanh lam§!."
 astral_rift.1525.a: "$astral_rift.1520.a$"
 astral_rift.1530.name: "Căn Phòng Thứ Hai"
 astral_rift.1530.desc: "Đội ngũ khoa học của chúng ta báo cáo rằng họ đã nhấn nút §Bmàu xanh lam§!, toàn bộ căn phòng rung lên trong một tiếng nghiến ồn ào. Một cánh cửa ẩn từ từ mở ra, để lộ căn phòng thứ hai.\n\nTường của căn phòng phát ra ánh sáng tím nhạt, thắp sáng vô số chữ tượng hình phủ kín mọi bức tường.\n\nỞ đây còn có một bảng điều khiển thứ hai. Giống như cái trước, nó cũng chỉ có hai nút bấm. Lần này, một nút khắc hình tam giác cân, và nút kia là hình ngũ giác đều.\n\nĐã đến lúc phải đưa ra một lựa chọn khác."
 astral_rift.1530.a: "Nhấn nút hình tam giác."
 astral_rift.1530.b: "Nhấn nút hình ngũ giác."
 astral_rift.1535.name: "Sai Nút"
 astral_rift.1535.desc.common: "Chắc chắn là đã bấm sai nút rồi.\n\nTuy nhiên, có thể tin rằng thời gian sẽ lặp lại một lần nữa, để đội ngoại phái đưa ra một lựa chọn khác."
 astral_rift.1535.desc.default: "Chúng ta lại một lần nữa mất liên lạc với đội ngoại phái. Bản ghi âm cuối cùng của họ là thêm nhiều tiếng la hét và tiếng lửa nổ lách tách.\n\n$astral_rift.1535.desc.common$"
 astral_rift.1535.desc.gestalt: "Các [explorer.GetIndividualNamePlural] của chúng ta đã bị thiêu rụi.\n\n$astral_rift.1535.desc.common$"
 astral_rift.1535.a: "§Gmàu xanh lục§! là một lựa chọn sai lầm……"
 astral_rift.1540.name: "Căn Phòng Thứ Hai"
 astral_rift.1540.desc.common: "Đội ngũ khoa học của chúng ta đã trở lại, chúng ta đã thiết lập liên lạc thành công. Theo giờ địa phương, chúng ta còn [This.freeze_time_left_1540] giờ để giải cứu họ.\n\nRút kinh nghiệm từ vòng lặp thời gian trước, đội ngũ khoa học đã vượt qua căn phòng đầu tiên một cách an toàn. Họ hiện đang chuẩn bị đưa ra một lựa chọn khác."
 astral_rift.1540.desc.default: "$astral_rift.1540.desc.common$"
 astral_rift.1540.desc.psionic_or_latent: "$astral_rift.1540.desc.common$\n\n[Leader.GetName] nói rằng ngay từ đầu chúng ta nên nhấn hình ngũ giác, hình tam giác không phải là một hình dạng mang lại điềm báo tốt lành gì."
 astral_rift.1540.desc.psionic_or_latent_robot: "$astral_rift.1540.desc.common$\n\nBộ xử lý linh năng của [Leader.GetName] cho thấy, khi đối mặt với những lựa chọn như vậy, hành động tối ưu luôn là ngũ giác đều. Tam giác là một mô hình tương đối kém tối ưu."
 astral_rift.1540.b: "$astral_rift.1530.b$"
 astral_rift.1545.name: "Sai Nút"
 astral_rift.1545.desc.default: "Bấm sai nút rồi.\n\nĐội ngũ hầu như không có thời gian để gửi một báo cáo ngắn gọn, liên lạc của họ đã bị cắt đứt. Việc nhấn nút hình tam giác đã khiến căn phòng chứa đầy khí ăn mòn.\n\nNếu họ quay ngược thời gian một lần nữa, chúng ta sẽ có cơ hội thử một nút bấm khác."
 astral_rift.1545.desc.gestalt: "Chọn hình tam giác khiến căn phòng ngập tràn khí ăn mòn, chỉ trong chốc lát đã làm tan chảy các [explorer.GetIndividualNamePlural] của chúng ta.\n\nNếu họ quay ngược thời gian một lần nữa, chúng ta sẽ có cơ hội thử một nút bấm khác."
 astral_rift.1545.desc.toxoid: "Chọn hình tam giác khiến căn phòng ngập tràn khí ăn mòn. Mặc dù nhiều thiết bị của chúng ta đã bị phá hủy, nhưng cơ thể dẻo dai của đội ngũ khoa học vẫn bình an vô sự. Sau khi xác nhận an toàn, họ gửi cho chúng ta một tin nhắn nói rằng sẽ thử nút hình ngũ giác, sau đó sẽ quay lại báo cáo."
 astral_rift.1545.desc.toxoid_gestalt: "Chọn hình tam giác khiến căn phòng ngập tràn khí ăn mòn. Mặc dù nhiều thiết bị của chúng ta đã bị phá hủy, nhưng cơ thể dẻo dai của [explorer.GetScientistPlural] vẫn bình an vô sự. Khi khí tan hết, họ sẽ thử một nút bấm khác."
 astral_rift.1545.b: "Thật may mắn."
 astral_rift.1550.name: "Căn Phòng Thứ Ba"
 astral_rift.1550.desc: "Sau khi nhấn nút hình ngũ giác, mặt đất vỡ vụn, lộ ra một cầu thang xoắn ốc dẫn sâu xuống lòng đất.\n\nDưới cùng của cầu thang là căn phòng thứ ba. Dưới ánh sáng xanh lam dịu nhẹ, các bức tường hoàn toàn trống trơn. Giống như trước, căn phòng này chủ yếu là một bảng điều khiển độc lập với hai nút bấm. Một nút có bốn chấm, và nút kia có sáu chấm.\n\nLại đến lúc phải đưa ra quyết định rồi."
 astral_rift.1550.a: "Nhấn nút bốn chấm."
 astral_rift.1550.b: "Nhấn nút sáu chấm."
 astral_rift.1555.name: "Căn Phòng Thứ Ba"
 astral_rift.1555.desc.time_singular: "Đội ngũ khoa học của chúng ta đã trở lại, chúng ta đã thiết lập liên lạc thành công. Theo giờ địa phương, chúng ta còn 1 giờ để giải cứu họ."
 astral_rift.1555.desc.time_plural: "Đội ngũ khoa học của chúng ta đã trở lại, chúng ta đã thiết lập liên lạc thành công. Theo giờ địa phương, chúng ta còn [This.freeze_time_left_1555] giờ để giải cứu họ."
 astral_rift.1555.desc.default: "……Theo kinh nghiệm từ vòng lặp trước, chúng ta đã thuận lợi vượt qua căn phòng thứ nhất và thứ hai. Bây giờ hy vọng rằng nút sáu chấm sẽ ít chết chóc hơn so với nút còn lại."
 astral_rift.1555.desc.robot: "……Theo kinh nghiệm từ vòng lặp trước, chúng ta đã thuận lợi vượt qua căn phòng thứ nhất và thứ hai. Dựa trên dữ liệu dự đoán, nút sáu chấm về mặt thống kê an toàn hơn một chút so với các nút khác."
 astral_rift.1555.desc.psionic_or_latent: "[Leader.GetName] đã tự tin dẫn dắt đội ngũ vượt qua căn phòng thứ nhất và thứ hai. Họ đã đưa ra lựa chọn đúng đắn mà không cần lệnh của chúng ta."
 astral_rift.1555.desc.psionic_or_latent_robot: "[Leader.GetName] đã dẫn dắt đội ngũ vượt qua căn phòng thứ nhất và thứ hai một cách hiệu quả, họ dựa vào sự hướng dẫn của bộ xử lý linh năng để đưa ra lựa chọn đúng đắn mà không cần lệnh của chúng ta."
 astral_rift.1555.desc.default_end: "Ngay khi bước vào căn phòng thứ ba, họ đã đi nhấn nút sáu chấm. Hy vọng họ không chọn sai."
 astral_rift.1555.desc.robot_end: "Ngay khi bước vào căn phòng thứ ba, họ đã đi nhấn nút sáu chấm."
 astral_rift.1555.desc.default_singular: "$astral_rift.1555.desc.time_singular$\n\n$astral_rift.1555.desc.default$\n\n$astral_rift.1555.desc.default_end$"
 astral_rift.1555.desc.default_plural: "$astral_rift.1555.desc.time_plural$\n\n$astral_rift.1555.desc.default$\n\n$astral_rift.1555.desc.default_end$"
 astral_rift.1555.desc.robot_singular: "$astral_rift.1555.desc.time_singular$\n\n$astral_rift.1555.desc.robot$\n\n$astral_rift.1555.desc.robot_end$"
 astral_rift.1555.desc.robot_plural: "$astral_rift.1555.desc.time_plural$\n\n$astral_rift.1555.desc.robot$\n\n$astral_rift.1555.desc.robot_end$"
