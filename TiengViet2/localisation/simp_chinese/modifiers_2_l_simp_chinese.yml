l_simp_chinese:
 rock_brain: "Não Đá"
 rock_brain_desc: "Những hòn đá này có vẻ như... biết suy nghĩ. Chuyện này có thể xảy ra sao?"
 cunning_flora: "Thực Vật Tinh Ranh"
 cunning_flora_desc: "Thực vật trên hành tinh này không chỉ hung hăng mà còn có một trật tự xã hội khá phức tạp."
 genetic_library: "Ngân Hàng Gen Bị Bỏ Hoang"
 genetic_library_desc: "Ngân hàng gen bị bỏ hoang này rất đáng để nghiên cứu, từ cấu trúc tòa nhà cho đến những mẫu vật bên trong."
 drone_space_elevator: "Thang Máy Vũ Trụ Cản Đường"
 drone_space_elevator_desc: "Do bận rộn phá hủy chiếc thang máy vũ trụ khổng lồ, năng suất của hành tinh này đã bị sụt giảm."
 drone_fl_satellite: "Vệ Tinh Liên Minh Thứ Nhất Rơi"
 drone_fl_satellite_desc: "Một vệ tinh nhân tạo cổ đại đang phát ra những thông điệp từ thời tiền sử vào vũ trụ."
 drone_mineral_gift: "Món Quà Của Phi Thuyền Khai Khoáng"
 drone_mineral_gift_desc: "Những phi thuyền khai khoáng từ vô số kỷ nguyên trước đã cất giữ một đống khoáng sản ở đây. Đúng là người trước trồng cây, người sau hóng mát."
 old_genetic_library: "Ngân Hàng Gen Cổ Đại"
 old_genetic_library_desc: "Tiểu hành tinh này có một cơ sở lưu trữ gen từ thời cổ đại."
 fascinating_flora: "Thực Vật Kỳ Diệu"
 fascinating_flora_desc: "Hành tinh này mọc đầy những bông hoa Marenkarin tuyệt đẹp."
 pheromoned_1: "Pheromone, Giai Đoạn Một"
 pheromoned_1_desc: "Phấn hoa trong không khí phản ứng hóa học với thụ thể pheromone của người dân, khiến họ cảm thấy rất vui vẻ."
 pheromoned_2: "Pheromone, Giai Đoạn Hai"
 pheromoned_2_desc: "Phấn hoa trong không khí phản ứng hóa học với thụ thể pheromone của người dân, khiến họ bỏ bễ việc làm."
 pheromoned_3: "Pheromone, Giai Đoạn Ba"
 pheromoned_3_desc: "Phấn hoa trong không khí phản ứng hóa học với thụ thể pheromone của người dân, khiến họ chẳng còn thiết tha việc khai hoang."
 pheromoned_4: "Pheromone, Giai Đoạn Bốn"
 pheromoned_4_desc: "Phấn hoa trong không khí phản ứng hóa học với thụ thể pheromone của người dân, khiến họ cắm cúi làm việc nhưng rất ghét bị bên ngoài quấy rầy."
 depheromoned_1: "Pheromone, Cách Giải Quyết"
 depheromoned_1_desc: "Những tấm gương do giới lãnh đạo đặt ra đã phản ứng hóa học với năng lực và ý chí làm việc của người dân, giúp năng suất làm việc của họ tăng cao."
 pheromoned_detox: "Giải Độc Pheromone"
 pheromoned_detox_desc: "Hoa Marenkarin nở rộ đã xóa sổ toàn bộ hệ sinh thái trên hành tinh cùng mọi sinh vật trong đó. Một vòng lặp mới đã bắt đầu."
 pheromoned_grief: "Bi Kịch Pheromone"
 pheromoned_grief_desc: "Nỗi đau không thể nguôi ngoai."
 zro_ice: "Băng Tinh Zro"
 zro_ice_desc: "Có một lượng nhỏ Zro giấu trong cơn bão tuyết đang gào thét."
 dark_matter_funnel: "Cái Phễu Vật Chất Tối"
 dark_matter_funnel_desc: "Một lỗ sâu tí hon giúp bạn lấy vật chất tối dễ dàng hơn."
 inspired_arts: "Nghệ Thuật Truyền Cảm Hứng"
 inspired_arts_desc: "Một nguồn cảm hứng mới mẻ và táo bạo đang khích lệ cả đế chế của bạn, từ góc độ văn hóa cho đến thương mại."
 uplift_rocky: "Khởi Đầu Gian Nan"
 uplift_rocky_desc: "Các loài được khai sáng trên hành tinh này có chút không quen với trật tự xã hội mới."
 unhappy_with_experiments: "Thí Nghiệm Khó Chịu"
 unhappy_with_experiments_desc: "Những người thuộc phe §YChuộng Ngoại§! trên hành tinh đang bất mãn với việc những người cai trị thực hiện các thí nghiệm vô nhân đạo lên các loài sinh vật bản địa nguyên thủy."
 unproductive_without_experiments: "Năng Suất Kém Vì Không Thí Nghiệm"
 unproductive_without_experiments_desc: "Sản lượng £society_research£§Y$society_research$§! trên hành tinh bị sụt giảm vì các nhà khoa học đã bỏ lỡ cơ hội làm thí nghiệm và thử nghiệm lâm sàng ngàn năm có một."
 massex_happy: "Tin Vào Tương Lai"
 massex_happy_desc: "Người dân của bạn khá tự tin rằng họ sẽ có một cuộc sống tươi sáng trong tương lai."
 stellar_salt: "Mằn Mặn"
 stellar_salt_desc: "Một cuộc cách mạng ẩm thực đã nổ ra trong đế chế của chúng ta."
 projecting_moon: "Mặt Trăng Ảo Ảnh"
 projecting_moon_desc: "Trên vệ tinh này có một thiết bị liên lạc mạnh mẽ, có thể tạo ra các kết quả quét sai lệch y như thật."
 cornucopia: "Trù Phú"
 cornucopia_desc: "Hành tinh này có nguồn tài nguyên thức ăn dồi dào để khai thác."
 raw_materials: "Quặng Thô"
 raw_materials_desc: "Hành tinh này có nguồn tài nguyên khoáng chất và quặng rất phong phú, lại dễ khai thác."
 shadow_play: "Múa Rối Bóng"
 shadow_play_desc: "Một cái bóng lướt qua bề mặt hành tinh trong tĩnh lặng, để lại những dấu vết có chủ đích rõ ràng nhưng lại không rõ ý nghĩa."
 grimacing: "Biến Đổi Khôn Lường"
 grimacing_desc: "Những biến động dữ dội bên trong hành tinh này rất đáng để mang ra nghiên cứu."
 comet_sighted_negative: "Nhìn Thấy Sao Chổi"
 comet_sighted_negative_desc: "Sao chổi mang đầy điềm dữ này đã tạo ra tác động tiêu cực đến người dân ở thủ đô của bạn."
 comet_sighted_positive: "Nhìn Thấy Sao Chổi"
 comet_sighted_positive_desc: "Một ngôi sao chổi khổng lồ đã tạo động lực to lớn cho người dân ở thủ đô của bạn."
 skid_marks: "Vết Phanh Cọ Xát"
 skid_marks_desc: "Những vết tích này cho thấy từng có những cuộc đua xe khốc liệt diễn ra trên tiểu hành tinh này."
 dust_circuits: "Đường Đua Chết Chóc"
 dust_circuits_desc: "Một công trình trên quỹ đạo khổng lồ nào đó đã đâm sầm vào tiểu hành tinh này từ rất lâu trước đây, để lại những vết hằn không còn nguyên vẹn nhưng vẫn cực kỳ rõ nét."
 unusual_tectonics: "Vỏ Hành Tinh Bất Thường"
 unusual_tectonics_desc: "Lớp vỏ của hành tinh này có những tính chất vật lý kiến tạo cực kỳ bất thường."
 flagellating_movement: "Chuyển Động Quất Roi"
 flagellating_movement_desc: "Nhờ quan sát roi của loài Amip Vũ Trụ, chúng ta đã cập nhật phương án xoay trở khi né đòn cho hạm đội."
 cosmic_ray_catalysis: "Chất Xúc Tác Tia Vũ Trụ"
 cosmic_ray_catalysis_desc: "Nhà máy điện của chúng ta hiện đã có thể biến đổi một số loại tia vũ trụ thành nguồn năng lượng sử dụng được."
 grand_design: "Thiết Kế Vĩ Đại"
 grand_design_desc: "Những ai chịu làm những con ốc vít nhỏ bé của xã hội thật có phúc, những sự nghiệp vĩ đại thường bắt nguồn từ những điều bình dị."
 malefaction: "Tội Ác"
 malefaction_desc: "Làm ơn mắc oán."
 prismatic_lenses: "Thấu Kính Lăng Trụ"
 prismatic_lenses_desc: "Thấu kính được chế tạo mô phỏng theo tính chất lăng trụ độc đáo của các thực thể pha lê mang lại những đóng góp khổng lồ cho việc nghiên cứu vật lý."
 crystal_sonar: "Sóng Âm Pha Lê"
 crystal_sonar_desc: "Hạm đội của bạn có thể dùng một công nghệ đặc biệt liên quan đến thực thể pha lê để ngay lập tức quét xong hệ sao mà họ đang ở."
 greater_crystal_bounty: "Tiền Thưởng Pha Lê Lớn"
 greater_crystal_bounty_desc: "§LRa lệnh cho hạm đội thu gom khoáng sản từ xác của các thực thể pha lê đã bị tiêu diệt.§!\nKhoáng sản nhận được khi đánh bại một hạm đội: §G500§!"
 crystal_bounty: "Tiền Thưởng Pha Lê"
 crystal_bounty_desc: "§LRa lệnh cho hạm đội thu gom khoáng sản từ xác của các thực thể pha lê đã bị tiêu diệt.§!\nKhoáng sản nhận được khi đánh bại một hạm đội: §G250§!"
 amoeba_extirpator: "Kẻ Diệt Amip"
 amoeba_extirpator_desc: "Hạm đội của chúng ta rất giỏi nhắm vào những điểm yếu của bọn Amip Vũ Trụ."
 crystal_breaker: "Kẻ Phá Pha Lê"
 crystal_breaker_desc: "Hệ thống ngắm bắn của hạm đội ta đã được tinh chỉnh riêng để đối phó với hình thù góc cạnh của các thực thể pha lê, nhờ vậy gây ra lượng sát thương cao nhất."
 drone_destroyer: "Sát Thủ Phi Thuyền"
 drone_destroyer_desc: "Thuật toán dự đoán đã được cập nhật giúp tàu chiến của ta bám đuôi và tấn công bọn phi thuyền khai khoáng cổ đại thoắt ẩn thoắt hiện tốt hơn."
 tiyanki_butcher: "Đồ Tể Tiyanki"
 tiyanki_butcher_desc: "Sự hiểu biết tường tận về giải phẫu học Tiyanki giúp chúng ta tung ra những đòn tấn công chuẩn xác như mổ xẻ, đẩy sát thương lên mức tối đa."
 droning_optimizations: "Tối Ưu Hoá Phi Thuyền"
 droning_optimizations_desc: "Việc điều chỉnh các quy chuẩn khai khoáng tiêu chuẩn giúp giảm lượng năng lượng tiêu hao một cách rõ rệt."
 cloudbuster: "Kẻ Phá Mây"
 cloudbuster_desc: "Chúng ta đã điều chỉnh lại kho vũ khí của mình để làm rối loạn từ trường của lũ Quái Mây Hư Vô, từ đó gia tăng khả năng phá hoại lâu dài."
 drone_bounty: "Tiền Thưởng Phi Thuyền Khai Khoáng"
 drone_bounty_desc: "§LRa lệnh cho hạm đội thu gom pin năng lượng từ xác của lũ phi thuyền khai khoáng cổ đại đã bị đánh tan.§!\nĐiểm năng lượng nhận được khi đánh bại một hạm đội: §G500§!"
 unbalanced_ecosystem: "Hệ Sinh Thái Mất Cân Bằng"
 unbalanced_ecosystem_desc: "Sự đồng nhất đến mức cực đoan của đời sống thực vật trong hệ sinh thái làm cho hành tinh này không còn hợp để làm nông nghiệp."
 ruler_failed_savior: "Vị Cứu Tinh Thất Bại"
 ruler_failed_savior_desc: "Một chiến dịch giải cứu thất bại đã khiến người dân của chúng ta ngập trong đau khổ."
 ruler_savior: "Vị Cứu Tinh"
 ruler_savior_desc: "Chiến dịch giải cứu thành công này đã gieo rắc niềm vui cho tất cả mọi người."
 missing_scientist: "Tổn Thất Nhân Sự"
 missing_scientist_desc: "Một nhà khoa học làm việc trên trạm quan sát đã mất tích, gây ra sóng gió trong giới nghiên cứu."
 humiliated: "Bị Làm Nhục"
 humiliated_desc: "§LChúng ta đã bị các quốc gia khác sỉ nhục công khai.§!"
 raided: "Bị Cướp Phá"
 raided_desc: "§LChúng ta không thể tự vệ trước lũ cướp bóc này.§!"
 TOOLTIP_HAPPINESS_GOV_ETHOS: "Thể chế $ETHIC$: $VAL$"
 TOOLTIP_HAPPINESS_XENO_OVERLORDS: "Chủ Tể Ngoài Hành Tinh: $VAL$"
 swarm_border: ""
 swarm_border_desc: ""
 drone_processing: "Gia công thiết bị tự hành"
 drone_processing_desc: "Những kiến thức học được từ các thiết bị khai khoáng tự hành cổ đại đang không ngừng giúp cải thiện sản lượng khai thác và hiệu suất xử lý khoáng sản của chúng ta."
 spiritualist_attraction: "Sức hút của chủ nghĩa duy tâm"
 spiritualist_attraction_desc: "Một bộ phận những người duy tâm lên tiếng phản đối thế giới quan duy vật, họ cho rằng những tư tưởng như vậy đang kìm hãm sự phát triển văn hóa của chúng ta."
 materialist_attraction: "Sức hút của chủ nghĩa duy vật"
 materialist_attraction_desc: "Một bộ phận những người duy vật đang tìm kiếm những lời giải đáp thực tế và tiến bộ hơn, từ đó thúc đẩy nền văn hóa của chúng ta tiến về phía trước."
 from_extra_federation_members: "Tạo ra từ các quốc gia thành viên:"
 empire_size_mods: "Quy mô đế chế"
 taste_the_stars: "Hương vị của những vì sao"
 taste_the_stars_desc: "Loại đồ uống ngoại lai cổ đại này giúp người dân của chúng ta nếm thử hương vị của những điều chưa biết."
 game_start: "Giai đoạn đầu game"
 game_start_desc: "Sản lượng của phe phái bị giảm sút trong mười năm đầu tiên."
 rock_brain_decoding: "Ngôn ngữ học não đá"
