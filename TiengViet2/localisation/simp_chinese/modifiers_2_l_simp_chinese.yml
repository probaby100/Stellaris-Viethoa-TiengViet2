 6_hour_workday: "Chế độ làm việc 6 tiếng"
 6_hour_workday_desc: "Lao động không lương trong một môi trường làm việc tốt hơn."
 validated: "Được công nhận"
 validated_desc: "Gần đây đã giành được một thắng lợi chính trị."
 hunger_strike: "Người tuyệt thực đình công"
 hunger_strike_desc: "Những người này không chịu nạp đủ lượng dinh dưỡng cần thiết để duy trì năng suất làm việc tối ưu."
 peace_strike: "Người phản chiến"
 peace_strike_desc: "Những người này dành một phần thời gian của mình để biểu tình phản đối chiến tranh, dẫn đến việc suy giảm năng suất."
 culture_shock_bronze_age: "Sốc văn hóa liên sao"
 culture_shock_bronze_age_desc: "Những người này vẫn đang phải cố gắng thích nghi với sự cai trị của bá chủ ngoại lai mới."
