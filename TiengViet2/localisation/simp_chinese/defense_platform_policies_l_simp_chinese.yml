l_simp_chinese:
 # Chính sách Giao thức Nền tảng Phòng thủ
 policy_defense_platform_protocols: "Giao thức nền tảng phòng thủ"
 policy_defense_platform_protocols_desc: "Các mệnh lệnh thường quy quy định việc trang bị giáp trụ, cấp năng lượng và phương thức thu hồi các nền tảng phòng thủ của phe ta."
 defense_platform_standard: "Cấu hình tiêu chuẩn"
 defense_platform_standard_name: "$defense_platform_standard$"
 defense_platform_standard_desc: "Các nền tảng phòng thủ vận hành theo thông số chuẩn mực.\n\n§EKhông có hiệu ứng bổ sung hoặc chi phí duy trì.§!"
 defense_platform_synchronized_shielding: "Lá chắn đồng bộ"
 defense_platform_synchronized_shielding_name: "$defense_platform_synchronized_shielding$"
 defense_platform_synchronized_shielding_desc: "Hài hòa lá chắn phân tán bảo vệ các nền tảng phòng thủ của chúng ta trước những đợt oanh kích ác liệt nhất.\n\n§EGiảm sát thương từ pháo sao mà các nền tảng phòng thủ phải gánh chịu.§!"
 defense_platform_synchronized_shielding_effect: "Giảm trừ sát thương pháo sao: §G+60%§!"
 defense_platform_reinforced_plating: "Tấm giáp gia cố"
 defense_platform_reinforced_plating_name: "$defense_platform_reinforced_plating$"
 defense_platform_reinforced_plating_desc: "Lớp giáp triệt tiêu xếp lớp tăng cường khả năng chống đỡ hỏa lực địch ập tới của trạm sao cùng các nền tảng phòng thủ.\n\n§EGiảm toàn bộ sát thương vũ khí tác động lên trạm sao và các nền tảng phòng thủ của nó.§!"
 defense_platform_reinforced_plating_effect: "Giảm trừ sát thương trạm sao và nền tảng phòng thủ: §G+15%§!"
 defense_platform_resilient_frames: "Khung kiên cố"
 defense_platform_resilient_frames_name: "$defense_platform_resilient_frames$"
 defense_platform_resilient_frames_desc: "Lõi năng lượng dự phòng cùng khung dạng mô-đun cho phép các nền tảng chịu hư hại nghiêm trọng có thể ngắt nguồn và tái khởi động thay vì bị vỡ vụn hoàn toàn.\n\n§ENền tảng phòng thủ trong chiến đấu sẽ chỉ bị vô hiệu hóa chứ không bị phá hủy, và sẽ tái kích hoạt sau khi trận chiến kết thúc.§!"
 defense_platform_provocation_arrays: "Mảng khiêu khích"
 defense_platform_provocation_arrays_name: "$defense_platform_provocation_arrays$"
 defense_platform_provocation_arrays_desc: "Chủ động khóa cảm biến và duy trì tư thế sẵn sàng khai hỏa vũ khí có thể dẫn dụ hỏa lực đối phương tập trung vào các nền tảng của ta, tránh xa hạm đội.\n\n§ETàu chiến địch trong chiến đấu sẽ có nhiều khả năng nhắm mục tiêu vào nền tảng phòng thủ của ta hơn.§!"
 # Hệ số hạm đội từ học thuyết Tấm giáp gia cố
 defense_platform_reinforced_field: "Tấm giáp gia cố"
