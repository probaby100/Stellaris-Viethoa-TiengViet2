l_simp_chinese:
 ####################################
 #Dự Án Nghiên Cứu Đặc Biệt
 ####################################
 MIGRATING_FORESTS_1_PROJECT: "Nghiên Cứu Rừng Di Cư"
 MIGRATING_FORESTS_1_PROJECT_DESC: "Một nhóm nhà khoa học của ta hy vọng có thể nghiên cứu sâu hơn về thảm thực vật ngoài hành tinh này để tìm ra cách giải quyết vấn đề mà không cần phải tàn phá khu rừng."
 MIGRATING_FORESTS_2_PROJECT: "Thiêu Rụi Rừng Di Cư"
 MIGRATING_FORESTS_2_PROJECT_DESC: "Ta không thể dung thứ cho sự tồn tại của những khu rừng này, phải quét sạch chúng khỏi bề mặt [Root.GetPlanetMoon]."
 SEISMIC_DISTURBANCE_1_PROJECT: "Thiết Lập Liên Lạc"
 SEISMIC_DISTURBANCE_1_PROJECT_DESC: "Ta nên thử thiết lập liên lạc với những người ngoài hành tinh [Root.Owner.GetSubMantleLower] này. Biết đâu ta có thể tìm ra cách chung sống hòa bình với nền văn minh của họ."
 SEISMIC_DISTURBANCE_2_PROJECT: "Đánh Phủ Đầu"
 SEISMIC_DISTURBANCE_2_PROJECT_DESC: "Đám người ngoài hành tinh dưới lòng đất đang đào đường ngoi lên mặt đất, đây là một mối đe dọa cần phải xử lý ngay lập tức. Ta phải đánh phủ đầu và tấn công các thành phố ngầm của chúng."
 SEISMIC_DISTURBANCE_3_PROJECT: "Hủy Diệt Văn Minh Lòng Đất"
 SEISMIC_DISTURBANCE_3_PROJECT_DESC: "Nền văn minh ngoài hành tinh dưới lòng đất trên [From.From.GetName] là một mối đe dọa đối với thuộc địa của ta, ta buộc phải tiêu diệt chúng bằng cách tấn công vào các thành phố ngầm."
 UNDERGROUND_VAULT_PROJECT: "Mở Kho Báu Ngầm"
 UNDERGROUND_VAULT_PROJECT_DESC: "Ta đã phát hiện một hầm ngầm khổng lồ trên [From.GetName]. Các nhà khoa học đang dốc sức tìm cách mở cánh cửa gia cố để xem rốt cuộc có thứ gì bên trong."
 NUCLEAR_BOMB_PROJECT: "Vô Hiệu Hóa Bom Hạt Nhân"
 NUCLEAR_BOMB_PROJECT_DESC: "Cư dân thuộc địa của ta trên [From.GetName] đã vô tình kích hoạt một quả bom nhiệt hạch bị bỏ hoang. Ta cần vô hiệu hóa nó trước khi đồng hồ đếm ngược kết thúc!"
 GAS_GIANT_BODIES_PROJECT: "Phân Tích Xác Sinh Vật Không Gian"
 GAS_GIANT_BODIES_PROJECT_DESC: "Ta đã tìm thấy xác của một vài sinh vật khổng lồ trên quỹ đạo của hành tinh khí khổng lồ [From.GetName]. Các nhà khoa học muốn phân tích chúng để tìm hiểu nguồn gốc."
 SEA_EXPEDITION_PROJECT: "Tổ Chức Thám Hiểm Biển Sâu"
 SEA_EXPEDITION_PROJECT_DESC: "Có một đại dương ẩn mình dưới lớp băng của [From.GetName]. Các nhà khoa học hy vọng có thể tổ chức một chuyến thám hiểm biển sâu để nghiên cứu các dạng sống đặc biệt tại đây."
 GIGANTIC_SKELETON_PROJECT: "Điều Tra Bộ Xương Khổng Lồ"
 GIGANTIC_SKELETON_PROJECT_DESC: "Một bộ xương khổng lồ được tìm thấy trên bề mặt cằn cỗi của [From.GetName], niên đại có thể lên tới ba triệu năm. Những [Root.Owner.GetScientistPlural] của ta đang nóng lòng muốn giải mã bí ẩn này."
 GIGANTIC_SKELETON_RESURRECTION_PROJECT: "Hồi Sinh Bộ Xương Khổng Lồ"
 GIGANTIC_SKELETON_RESURRECTION_PROJECT_DESC: "Một bộ xương khổng lồ được tìm thấy trên bề mặt cằn cỗi của [From.GetName], niên đại có thể lên tới ba triệu năm. Các pháp sư gọi hồn của ta đang rục rịch muốn ra tay rồi."
 BATTLE_WRECKAGE_PROJECT: "Khảo Sát Nghĩa Địa Tàu Vũ Trụ"
 BATTLE_WRECKAGE_PROJECT_DESC: "Ta tình cờ phát hiện một nghĩa địa tàu vũ trụ trên bề mặt [From.GetName], có vẻ như đây là tàn tích từ một trận chiến quy mô lớn trên quỹ đạo thấp từ hàng ngàn năm trước. Kế hoạch thám hiểm khoa học để thu hồi những mảnh vỡ cổ đại này đã chính thức được đưa lên bàn nghị sự."
 ROCK_FACE_PROJECT: "Phân Tích Cấu Trúc Đá Hình Mặt Người"
 ROCK_FACE_PROJECT_DESC: "Trên bề mặt [From.GetName], ta đã phát hiện những cấu trúc đá có hình dáng giống hệt khuôn mặt của người [Root.Owner.GetSpeciesName]. Ta phải xác minh xem đây rốt cuộc chỉ là trùng hợp ngẫu nhiên, hay còn ẩn chứa bí mật nào khác."
 TRANSLATE_MURAL_PROJECT: "Giải Mã Bích Họa Ngoài Hành Tinh"
 TRANSLATE_MURAL_PROJECT_DESC: "Ta đã tìm thấy một bức bích họa cổ đại chi chít chữ ngoài hành tinh trên [From.GetName]. Chỉ cần chịu khó đổ công sức vào, chắc chắn ta có thể dịch được những nội dung này."
 MUTANT_SURVIVORS_PROJECT: "Điều Tra Dị Nhân"
 MUTANT_SURVIVORS_PROJECT_DESC: "Phát hiện dị nhân trên [From.GetName] — có thể là hậu duệ của những cư dân bản địa trên [From.GetPlanetMoon], ta cần tìm hiểu thêm về chúng để biết rõ mình đang phải đối mặt với thứ gì."
 UNDERGROUND_FACILITY_PROJECT: "Điều Tra Cơ Sở Ngầm"
 UNDERGROUND_FACILITY_PROJECT_DESC: "Bên dưới một thành phố bỏ hoang trên [From.GetName], một cơ sở khổng lồ đang phát ra những xung năng lượng dị thường. Ta cần phải điều tra nguyên nhân."
 GHOSTLY_SIGHTINGS_PROJECT: "Điều Tra Hiện Tượng Siêu Nhiên"
 GHOSTLY_SIGHTINGS_PROJECT_DESC: "Cư dân thuộc địa trên [From.GetName] đã ghi nhận nhiều hiện tượng kỳ bí xuất hiện quanh một thành phố ngoài hành tinh bỏ hoang trên [From.GetPlanetMoon]. Các nhà khoa học của ta đang nóng lòng muốn làm rõ ngọn nguồn của hiện tượng này."
 AUTOMATED_SHIPYARD_PROJECT: "Sửa Chữa Xưởng Tàu Tự Động"
 AUTOMATED_SHIPYARD_PROJECT_DESC: "Tàn tích của một xưởng đóng tàu tự động cũ kỹ được phát hiện trên quỹ đạo [From.GetName]. Các kỹ sư tin rằng họ có thể khôi phục nguồn điện cho một trạm chế tạo vẫn còn nguyên vẹn trong đó."
 GAS_GIANT_SHIP_PROJECT: "Trục Vớt Tàu Hành Tinh Khí"
 GAS_GIANT_SHIP_PROJECT_DESC: "Một con tàu bị bỏ hoang được phát hiện nằm sâu trong lớp khí quyển của hành tinh khí khổng lồ [From.GetName]. Một nhóm nhà khoa học và kỹ sư đã đề xuất kế hoạch kéo nó lên tầng khí quyển cao hơn để thu hồi."
 GAS_GIANT_SIGNAL: "Tách Tín Hiệu"
 GAS_GIANT_SIGNAL_DESC: "Ta bắt được một tín hiệu mờ nhạt phát ra từ sâu bên trong hành tinh khí khổng lồ [From.GetName]. Đây có thể là một dạng thông điệp liên lạc, nhưng ta vẫn chưa thể tách được tín hiệu này ra."
 GAS_GIANT_RELOCATION: "Di Dời Người Dathnak"
 GAS_GIANT_RELOCATION_DESC: "Ta đã đồng ý giúp di dời người Dathnak khỏi hành tinh mẹ sắp bị hủy diệt của họ đến hành tinh khí khổng lồ [baldarak_planet.GetName]. Tại đó, họ sẽ xây dựng một mái nhà mới. Thời gian đang rất gấp rút."
 GAS_GIANT_COLONY: "Thành Lập Thuộc Địa Dathnak"
 GAS_GIANT_COLONY_DESC: "Người Dathnak muốn thành lập một thuộc địa mới trên hành tinh khí khổng lồ [NewBaldarak.GetName], nơi có bầu khí quyển rất thích hợp cho họ sinh tồn. Ta đã đồng ý giúp họ."
 GAS_GIANT_LOST_CONTACT: "Điều Tra New Baldarak"
 GAS_GIANT_LOST_CONTACT_DESC: "Chính quyền Dathnak trên Baldarak đã mất liên lạc với thuộc địa của họ trên New Baldarak, họ đang lo sợ một viễn cảnh tồi tệ nhất. Ta đã đồng ý giúp điều tra hành tinh này."
 GAS_GIANT_REVOLT: "Đặc Nhiệm Thâm Nhập"
 GAS_GIANT_REVOLT_DESC: "Lực lượng cách mạng Dathnak trên New Baldarak hy vọng ta có thể giúp vận chuyển đội đặc nhiệm của họ đến Baldarak, để họ có thể kích động khởi nghĩa tại đó."
 GAS_GIANT_OCCUPATION: "Đội Quân Viễn Chinh"
 GAS_GIANT_OCCUPATION_DESC: "Chính quyền Dathnak quyết tâm giành lại quyền kiểm soát những khu vực đang bị quân phản loạn chiếm đóng trên New Baldarak. Ta đã đồng ý chở đội quân viễn chinh của họ đến đó."
 GAS_GIANT_LOST_CHABKY: "Đưa Chabky Về Nhà"
 GAS_GIANT_LOST_CHABKY_DESC: "Cư dân Dathnak tên Chabky Leydi đang nhớ quê hương da diết và mong mỏi được trở về Baldarak. Ta đã miễn cưỡng đồng ý với thỉnh cầu này."
 ABANDONED_TERRAFORMING_1_PROJECT: "Kế Hoạch Tái Khởi Động"
 ABANDONED_TERRAFORMING_1_PROJECT_DESC: "[From.GetName] đã bị một thế lực vô danh tiến hành cải tạo môi trường dang dở từ hàng ngàn năm trước. Hiện tại, máy móc vẫn còn nằm lại trên [From.GetPlanetMoon], và các nhà khoa học của ta đang tìm cách khởi động lại chúng."
 ABANDONED_TERRAFORMING_2_PROJECT: "Tháo Dỡ Thiết Bị"
 ABANDONED_TERRAFORMING_2_PROJECT_DESC: "Dù đã trải qua bao năm tháng, đống thiết bị cải tạo môi trường trên [From.GetName] trông vẫn vô cùng tân tiến. Các kỹ sư của ta xin phép được tháo dỡ và nghiên cứu chúng, để xem liệu ta có mót được chút kiến thức nào từ thứ công nghệ đã chế tạo ra chúng hay không."
 MUTANT_STALKER_PROJECT: "Tiêu Diệt Quái Vật Khát Máu"
 MUTANT_STALKER_PROJECT_DESC: "Một sinh vật đột biến đang đe dọa đến tính mạng cư dân thuộc địa của ta trên [From.GetName], đã có rất nhiều người phải bỏ mạng, họ đang khẩn thiết cầu xin ta truy lùng và triệt hạ con quái vật này."
 ORBITAL_DEBRIS_PROJECT: "Dọn Dẹp Mảnh Vỡ Quỹ Đạo"
 ORBITAL_DEBRIS_PROJECT_DESC: "Không gian quỹ đạo quanh [Root.GetName] ngập ngụa những mảnh vỡ hỗn độn, cản trở nghiêm trọng quá trình phát triển thuộc địa trên [Root.GetPlanetMoon]. Cần huy động cảm biến công suất cao trên tàu khoa học để quét và lập bản đồ bãi rác không gian này."
 TERMINAL_ORBIT_PROJECT: "Quan Sát Va Chạm Vệ Tinh"
 TERMINAL_ORBIT_PROJECT_DESC: "Một trong các vệ tinh xoay quanh [From.GetName] sắp sửa đâm sầm xuống bề mặt hành tinh khí khổng lồ này. Cảnh tượng vô cùng hiếm gặp này sẽ được ghi hình lại để lưu truyền cho hậu thế."
 VULTAUM_ARCHEOLOGY_1: "Căn Cứ Khai Thác"
 VULTAUM_ARCHEOLOGY_1_DESC: "Miệng núi lửa trên [From.GetName] từng là một căn cứ khai thác mỏ cổ đại của người Vultaum. Ta sẽ thiết lập một khu khảo cổ quanh đó để sục sạo tìm kiếm những món đồ hữu dụng trong tàn tích."
 VULTAUM_ARCHEOLOGY_2: "Đài Thiên Văn"
 VULTAUM_ARCHEOLOGY_2_DESC: "[From.GetName] trước đây từng là một đài thiên văn của Vultaum, một [From.GetPlanetMoon] nằm cách xa đế chế cổ đại của họ. Các nhà khảo cổ đang rất hứng thú với việc phân tích tàn tích của đài thiên văn này."
 VULTAUM_ARCHEOLOGY_3: "Thang Máy Không Gian"
 VULTAUM_ARCHEOLOGY_3_DESC: "Một thang máy không gian đổ nát của người Vultaum vẫn đang lơ lửng trên quỹ đạo xích đạo của [From.GetName]. Nơi đây rõ ràng cất giấu một lượng lớn cổ vật, dựng một trạm khảo sát trên bề mặt [From.GetPlanetMoon] chắc chắn là một nước đi khôn ngoan."
 VULTAUM_ARCHEOLOGY_4: "Đại Đô Thị"
 VULTAUM_ARCHEOLOGY_4_DESC: "Khu tàn tích đại đô thị nằm gọn trong một cụm hố thiên thạch trên [From.GetName] từng là một đô thị đầu não của người Vultaum. Việc cử đoàn khảo sát tới đây khai quật rõ ràng là điều vô cùng cần thiết."
 VULTAUM_ARCHEOLOGY_5: "Mạng Lưới Đường Hầm"
 VULTAUM_ARCHEOLOGY_5_DESC: "Trước khi thuộc địa trung tâm của người Vultaum trên [From.GetName] sụp đổ, nơi này từng là một mạng lưới đường hầm khổng lồ. Việc cử đoàn khảo sát tới đây khai quật rõ ràng là điều vô cùng cần thiết."
 VULTAUM_ARCHEOLOGY_6: "Cơ Sở Khai Thác Khí Đốt"
 VULTAUM_ARCHEOLOGY_6_DESC: "Một phần của trạm khai thác khí đốt Vultaum vẫn đang lượn quanh [From.GetName]. Dù mọi dấu vết đều cho thấy nơi này đã bị cướp bóc, nhưng các chuyên gia khảo cổ của ta vẫn đinh ninh rằng tại đây vẫn còn những món đồ giá trị chờ được khai quật."
 VULTAUM_ARCHEOLOGY_7: "Trạm Giao Thương"
 VULTAUM_ARCHEOLOGY_7_DESC: "Trên [From.GetName] từng có một trạm giao thương của Vultaum. Việc khai quật tàn tích này sẽ tốn không ít công sức, nhưng các nhà khảo cổ tin rằng điều đó là hoàn toàn xứng đáng."
 VULTAUM_ARCHEOLOGY_8: "Vệ Tinh Nhân Tạo"
 VULTAUM_ARCHEOLOGY_8_DESC: "Một vệ tinh nhân tạo cổ đại của Vultaum đang xoay quanh quỹ đạo lực hấp dẫn của [From.GetName] một cách ì ạch. Trạm ăng ten của nó đã được trục vớt, và các kỹ sư dữ liệu của ta đang thèm khát phân tích thiết bị này."
 VULTAUM_ARCHEOLOGY_9: "Thuộc Địa Của Phe Ly Khai"
 VULTAUM_ARCHEOLOGY_9_DESC: "Ta đã tìm thấy một khu định cư của phe ly khai Vultaum trên [From.GetName]. Một khi cuộc khảo sát bắt đầu, ta chắc chắn sẽ vớ được rất nhiều cổ vật có giá trị."
 VULTAUM_ARCHEOLOGY_10: "Tổ Hợp Quỹ Đạo"
 VULTAUM_ARCHEOLOGY_10_DESC: "Một bộ khung kim loại trống trơn của tổ hợp quỹ đạo đang trôi dạt ở vùng không gian ngoài [From.GetName]. Có vẻ như mục đích xây dựng của nó là để phục vụ cho các nghiên cứu về thực tế ảo, nhưng nếu muốn moi thêm thông tin, ta cần tiến hành một cuộc khảo cổ đàng hoàng."
 VULTAUM_ARCHEOLOGY_11: "Căn Cứ Tiểu Hành Tinh"
 VULTAUM_ARCHEOLOGY_11_DESC: "Căn cứ khai thác khoáng sản nằm trên tiểu hành tinh [From.GetName] giờ đây chỉ còn là một hố thiên thạch khổng lồ. Thế nhưng, kết quả quét địa chất sơ bộ cho thấy một vài hầm mỏ của họ có thể vẫn còn nguyên vẹn nằm sâu dưới bề mặt."
 VULTAUM_HOMEWORLD_PROJECT: "$vultaum_1_poi$"
 VULTAUM_HOMEWORLD_PROJECT_DESC: "$vultaum_1_poi_desc$"
 YUHT_ARCHEOLOGY_1: "Hành Tinh Vườn Ươm"
 YUHT_ARCHEOLOGY_1_DESC: "[From.GetName] đã được xác định là hành tinh từng làm vườn ươm của người Yuht, nơi con non của họ bị bỏ lại tự sinh tự diệt. Một chuyến thám hiểm chắc chắn sẽ giúp ta thu thập được vô số hóa thạch có giá trị."
 YUHT_ARCHEOLOGY_2: "Hệ Thống Trạm Nghe Lén"
 YUHT_ARCHEOLOGY_2_DESC: "Hàng triệu năm trước, người Yuht đã dựng lên một mạng lưới nghe lén khổng lồ tại đây. Dù chúng đã rỉ sét từ lâu, nhưng việc đào bới khảo cổ quanh khu vực này vẫn hứa hẹn những khám phá lớn."
 YUHT_ARCHEOLOGY_3: "Tàn Tích Bảo Tàng"
 YUHT_ARCHEOLOGY_3_DESC: "Tàn tích của một bảo tàng Yuht mang chủ đề \"Trò lừa gạt ngoài hành tinh\" được tìm thấy trên bề mặt [From.GetName]. Nơi đây từng trưng bày hàng chục món đồ bị coi là cổ vật ngoài hành tinh, và các chuyên gia khảo cổ của ta vẫn đang rất tò mò về những hiện vật còn sót lại."
 YUHT_ARCHEOLOGY_4: "Nghĩa Địa Cổ Đại"
 YUHT_ARCHEOLOGY_4_DESC: "[From.GetName] từng là một thuộc địa phồn vinh của người Yuht, và ta đã xác định được khu vực có vẻ như là một nghĩa trang khổng lồ thực chất là một khu riêng biệt trên [From.GetPlanetMoon]. Rõ ràng việc triển khai khảo cổ tại địa điểm này sẽ mang lại giá trị không nhỏ."
 YUHT_ARCHEOLOGY_5: "Cựu Chiến Trường"
 YUHT_ARCHEOLOGY_5_DESC: "Hàng triệu năm trước, trên [From.GetName] đã nổ ra một cuộc chiến trên bộ thảm khốc giữa người Yuht và một giống loài khác. Các nhà khảo cổ học của ta rất sẵn lòng lùng sục bãi chiến trường này để khai quật những cổ vật giá trị."
 YUHT_ARCHEOLOGY_6: "Vệ Tinh Nhân Tạo Cổ Đại"
 YUHT_ARCHEOLOGY_6_DESC: "Người Yuht đã cắm một vệ tinh trên quỹ đạo [From.GetName] để kỷ niệm lần đầu chạm trán với sinh vật có trí tuệ ngoài hành tinh. Một nhóm các nhà khảo cổ đã đệ đơn xin cấp kinh phí để mổ xẻ toàn diện thứ này."
 YUHT_ARCHEOLOGY_7: "Tuần Dương Hạm Bỏ Hoang"
 YUHT_ARCHEOLOGY_7_DESC: "Một tuần dương hạm của người Yuht sau trận chiến đã bị vứt xó trên quỹ đạo [From.GetName]. Các nhà khảo cổ của ta rất muốn nhảy lên tàu để khám nghiệm cỗ chiến hạm cổ lỗ sĩ này."
 YUHT_ARCHEOLOGY_8: "Tàu Thực Dân Bỏ Hoang"
 YUHT_ARCHEOLOGY_8_DESC: "Phát hiện xác một chiếc tàu thực dân của người Yuht trên quỹ đạo [From.GetName]. Nếu cử một nhóm khoa học gia đến đó thăm dò, chắc chắn sẽ vớ bở."
 YUHT_ARCHEOLOGY_9: "Nơi Ở Trên Tiểu Hành Tinh"
 YUHT_ARCHEOLOGY_9_DESC: "Có vẻ như trên tiểu hành tinh [From.GetName] vẫn còn sót lại tàn tích nơi cư trú cổ đại của người Yuht. Ta nên lập một đoàn viễn chinh xông vào mấy cái hang trên đó để moi thêm thông tin."
 YUHT_HOMEWORLD_PROJECT: "$yuht_1_poi$"
 YUHT_HOMEWORLD_PROJECT_DESC: "$yuht_1_poi_desc$"
 FIRST_LEAGUE_ARCHEOLOGY_1: "Căn Cứ Hạm Đội"
 FIRST_LEAGUE_ARCHEOLOGY_1_DESC: "Bên trên [From.GetName] là phế tích căn cứ hạm đội của Liên Minh Thứ Nhất. Một vài mảnh vỡ có vẻ còn đủ vững chãi để cho phép ta tiến hành các hoạt động khảo cổ."
 FIRST_LEAGUE_ARCHEOLOGY_2: "Tuần Dương Hạm Bỏ Hoang"
 FIRST_LEAGUE_ARCHEOLOGY_2_DESC: "Ta đã dò ra mảnh vỡ mũi tàu tuần dương của Liên Minh Thứ Nhất đang lượn lờ quanh [From.GetName]. Một đội đổ bộ sẽ lên đó để nghiên cứu tàn tích nhằm hiểu thêm về chúng."
 FIRST_LEAGUE_ARCHEOLOGY_3: "Hành Tinh Mẹ Khamdai"
 FIRST_LEAGUE_ARCHEOLOGY_3_DESC: "[From.GetName] hẳn là hành tinh mẹ của giống loài Khamdai đã tuyệt diệt, một trong những thành viên sáng lập Liên Minh Thứ Nhất cổ đại. [From.GetPlanetMoon] đang chìm trong biển phế tích, mòn mỏi chờ được đưa ra ánh sáng."
 FIRST_LEAGUE_ARCHEOLOGY_4: "Hành Tinh Mẹ Chassago"
 FIRST_LEAGUE_ARCHEOLOGY_4_DESC: "Ta phát hiện ra [From.GetName] là quê nhà của loài Chassago đã tuyệt chủng, cũng là một trong các thành viên cộm cán sáng lập Liên Minh Thứ Nhất. Ngay trên mặt [From.GetPlanetMoon], tàn tích của những thành phố ngầm vẫn lồ lộ ra đó."
 FIRST_LEAGUE_ARCHEOLOGY_5: "Hành Tinh Mẹ Migar"
 FIRST_LEAGUE_ARCHEOLOGY_5_DESC: "Hàng triệu năm trước, loài Migar là những người đặt nền móng cho Liên Minh Thứ Nhất, và ta đoán chắc [From.GetName] chính là hành tinh mẹ của chúng. Mặc kệ bao thăng trầm của thời gian, những tàn tích chọc trời của chúng vẫn đứng sừng sững."
 FIRST_LEAGUE_ARCHEOLOGY_6: "Hành Tinh Mẹ Vutaum"
 FIRST_LEAGUE_ARCHEOLOGY_6_DESC: "Loài Vutaum cổ đại là một phần của ban sáng lập Liên Minh Thứ Nhất, mọi bằng chứng đều chỉ ra [From.GetName] từng là quê nhà của chúng. Giống chim này đã khoét rỗng những ngọn núi để nhét vào đó cả một đô thị khổng lồ, và các nhà khảo cổ của ta đang cực kỳ ngứa nghề muốn đâm đầu vào cái đống đổ nát đó."
 FIRST_LEAGUE_ARCHEOLOGY_7: "Cơ Sở Nghiên Cứu"
 FIRST_LEAGUE_ARCHEOLOGY_7_DESC: "Tàn tích của một thiết bị khổng lồ nằm trơ trọi trên bề mặt [From.GetName]. Ta đồ rằng đây chính là cơ sở nghiên cứu của Liên Minh Thứ Nhất thời cổ đại, nhưng phải áp sát để kiểm tra thì mới chốt hạ được."
 FIRST_LEAGUE_ARCHEOLOGY_8: "Tàn Tích Thuộc Địa"
 FIRST_LEAGUE_ARCHEOLOGY_8_DESC: "Liên Minh Thứ Nhất đã rải thuộc địa khắp hang cùng ngõ hẻm trên [From.GetName], trước đây chỗ nào cũng lúc nhúc đủ các giống loài thành viên. Thuộc địa này có vẻ như đã suy tàn, nhưng ta phải xới tung đống hoang tàn này lên để tìm ra nguyên nhân diệt vong của nó."
 FIRST_LEAGUE_ARCHEOLOGY_9: "Trung Tâm Giao Thương"
 FIRST_LEAGUE_ARCHEOLOGY_9_DESC: "[From.GetName] từng là trung tâm giao thương sầm uất nhất của Liên Minh Thứ Nhất. [From.GetPlanetMoon] đã từng là một siêu đô thị sầm uất, nay để lại vô khối phế tích chờ các nhà khảo cổ vào xâu xé."
 FIRST_LEAGUE_ARCHEOLOGY_10: "Tàn Tích Trận Chiến"
 FIRST_LEAGUE_ARCHEOLOGY_10_DESC: "Hai triệu năm trước, một trận không chiến nảy lửa quy mô lớn của Liên Minh Thứ Nhất đã diễn ra ngay sát [From.GetName]. Dọc theo đường bay xuống [From.GetPlanetMoon], xác tàu vẫn còn lềnh bềnh, các chuyên gia khảo cổ của ta khuyên nên dựng ngay một cái lán trại quanh đó để làm việc."
 FIRST_LEAGUE_ARCHEOLOGY_11: "Chốn Lưu Đày"
 FIRST_LEAGUE_ARCHEOLOGY_11_DESC: "Với điều kiện khí hậu chó ngáp phải ruồi, [From.GetPlanetMoon] [From.GetName] từng là nhà tù đày ải bọn tội phạm của Liên Minh Thứ Nhất cổ đại, nơi này tuy đe dọa sinh mạng nhưng nếu vác xẻng tới đây lập bãi đào bới, kiểu gì cũng tòi ra được vài nhà giam thú vị."
 FIRST_LEAGUE_ARCHEOLOGY_12: "Trạm Quan Trắc"
 FIRST_LEAGUE_ARCHEOLOGY_12_DESC: "[From.GetName] là quê nhà của một nền văn minh mông muội mới chập chững bước vào thời đại đồ đồng, và đen cho chúng là bị Liên Minh Thứ Nhất cắm chốt theo dõi sát sao. Một vài hố đào bới hứa hẹn có kèo thơm đã được nhắm sẵn."
 FIRST_LEAGUE_ARCHEOLOGY_13: "Phong Tỏa Quỹ Đạo"
 FIRST_LEAGUE_ARCHEOLOGY_13_DESC: "[From.GetName] là quê hương của một giống loài lạ hoắc, đám này có vẻ đã bị dàn tàu chiến của Liên Minh Thứ Nhất phong tỏa không cho ló mặt ra khỏi quỹ đạo. Ném một đội khảo cổ vào đó hy vọng sẽ moi móc được thêm vài mảnh thông tin."
 FIRST_LEAGUE_ARCHEOLOGY_14: "Tiểu Hành Tinh Buôn Lậu"
 FIRST_LEAGUE_ARCHEOLOGY_14_DESC: "Tiểu hành tinh [From.GetName] hiển nhiên từng là hang ổ trú ngụ của bọn buôn lậu, cướp biển và đủ thứ cặn bã xã hội trong Liên Minh Thứ Nhất. Ta phải lật tung cái ruột của hòn đá này lên để moi cho bằng được mấy món cổ vật của Liên Minh Thứ Nhất có thể giấu trong đó."
 FIRST_LEAGUE_HOMEWORLD_PROJECT: "$first_league_1_poi$"
 FIRST_LEAGUE_HOMEWORLD_PROJECT_DESC: "$first_league_1_poi_desc$"
 IRASSIAN_ARCHEOLOGY_1: "Phong Tỏa Quỹ Đạo"
 IRASSIAN_ARCHEOLOGY_1_DESC: "Thuộc địa của người Irassian trên [From.GetName] đã bị dịch bệnh Javorian quét sạch, nhưng dấu vết để lại cho thấy [From.GetPlanetMoon] từng bị phong tỏa nghiêm ngặt trước khi thảm kịch xảy ra. Ta cần phải săm soi đám rác quỹ đạo này cẩn thận hơn để tìm kiếm thêm thông tin."
 IRASSIAN_ARCHEOLOGY_2: "Thuộc Địa Bị Oanh Tạc"
 IRASSIAN_ARCHEOLOGY_2_DESC: "Một triệu hai trăm nghìn năm trước, [From.GetName] đã ăn trọn một trận oanh tạc quỹ đạo khốc liệt, trước cơn mưa bom bão đạn đó, [From.GetPlanetMoon] vốn là một thuộc địa Irassian cực kỳ trù phú. Cứ tiến hành một chuyến khảo cổ đi, biết đâu lại thu nhặt được thêm vài tình tiết hay ho."
 IRASSIAN_ARCHEOLOGY_3: "Hành Tinh Mẹ Tiqaan"
 IRASSIAN_ARCHEOLOGY_3_DESC: "Giống loài thân mềm Tiqaan có gốc gác từ [From.GetName], đây là một giống loài đã bị Hiệp Ước Irassian đè đầu cưỡi cổ. Ta chả có tí thông tin rách nào về bọn chúng, nhưng một chuyến đào bới khảo cổ biết đâu sẽ lấp đầy chỗ trống đó."
 IRASSIAN_ARCHEOLOGY_4: "Hành Tinh Mẹ Xidqe"
 IRASSIAN_ARCHEOLOGY_4_DESC: "[From.GetName] là quê nhà xa xưa của người Xidqe, nhưng chừng một triệu hai trăm ngàn năm trước, nó đã lãnh đủ một trận oanh tạc quỹ đạo tổng lực. Ta thừa biết Xidqe là một trong số những giống loài thân phận chư hầu của Irassian, nhưng nguyên cớ sâu xa đằng sau trận mưa bom này vẫn còn là một dấu hỏi lớn."
 IRASSIAN_ARCHEOLOGY_5: "Tàn Tích Thuộc Địa"
 IRASSIAN_ARCHEOLOGY_5_DESC: "Tàn dư thuộc địa Irassian trên [From.GetName] giờ chỉ còn sót lại mấy mảnh hóa thạch và đống gạch vụn. Trông có vẻ nó lại là một nạn nhân xấu số nữa của dịch bệnh Javorian, nhưng biết đâu một đợt khai quật khảo cổ sẽ giúp ta tỏ tường hơn về số phận bi đát của thuộc địa này."
 IRASSIAN_ARCHEOLOGY_6: "Căn Cứ Khai Thác"
 IRASSIAN_ARCHEOLOGY_6_DESC: "Những hầm mỏ sâu hoắm trên [From.GetName] rành rành tố cáo nơi đây từng là sào huyệt khai khoáng của bọn Irassian. Các chuyên gia khảo cổ của ta đang ngứa ngáy muốn thọc sâu vào điều tra."
 IRASSIAN_ARCHEOLOGY_7: "Tàn Dư Thuộc Địa"
 IRASSIAN_ARCHEOLOGY_7_DESC: "[From.GetName] là một trong những nạn nhân bị dịch Javorian tát vào mặt sớm nhất, các chuyên gia khảo cổ của ta muốn mổ xẻ thuộc địa Irassian này để mò mẫm dấu vết, hòng truy lùng gốc rễ mầm bệnh."
 IRASSIAN_ARCHEOLOGY_8: "Tuần Dương Hạm Bỏ Hoang"
 IRASSIAN_ARCHEOLOGY_8_DESC: "Ta đã tóm được một chiếc tuần dương hạm Irassian trôi dạt vô chủ trên quỹ đạo [From.GetName]. Một tổ khảo cổ đã lên đồ sẵn sàng xuất kích."
 IRASSIAN_ARCHEOLOGY_9: "Trạm Quỹ Đạo"
 IRASSIAN_ARCHEOLOGY_9_DESC: "Phát hiện la liệt mảnh vụn trạm không gian quỹ đạo Irassian trên [From.GetName], nhiều khả năng đây từng là đầu não của cục phòng chống dịch bệnh của chúng, nếu muốn moi thêm tin tức, ta phải xới tung toàn bộ đống phế tích này lên."
 IRASSIAN_ARCHEOLOGY_10: "Tiền Đồn Nghe Lén Tiểu Hành Tinh"
 IRASSIAN_ARCHEOLOGY_10_DESC: "Tìm thấy một trạm nghe lén quân sự bị vứt xó trên tiểu hành tinh [From.GetName]. Ta đồ rằng đây là tác phẩm của Hiệp Ước Irassian từ đời nảo đời nào."
 IRASSIAN_ARCHEOLOGY_11: "Trạm Nghiên Cứu Hành Tinh Khí Khổng Lồ"
 IRASSIAN_ARCHEOLOGY_11_DESC: "Ta phát hiện tàn tích của một trạm nghiên cứu Irassian cổ đại nằm vật vờ trên quỹ đạo quanh [From.GetName]. Có vẻ vì một lý do mờ ám nào đó, bọn Irassian luôn cắm rễ theo dõi hành tinh khí khổng lồ này."
 IRASSIAN_HOMEWORLD_PROJECT: "$irassian_1_poi$"
 IRASSIAN_HOMEWORLD_PROJECT_DESC: "$irassian_1_poi_desc$"
 CYBREX_ARCHEOLOGY_1: "Hành Tinh Mẹ Kuur"
 CYBREX_ARCHEOLOGY_1_DESC: "[From.GetName] từng là quê nhà của người Kuur, cũng bị dính chưởng tàn bạo từ lũ Cybrex. Văn minh Kuur giờ chỉ còn trơ lại dăm ba đống gạch vụn, nhưng dù sao vẫn đáng để móc mác nghiên cứu."
 CYBREX_ARCHEOLOGY_2: "Hành Tinh Mẹ Indimak"
 CYBREX_ARCHEOLOGY_2_DESC: "Trước khi thực thể cơ khí Cybrex xua đạo quân chiến đấu của chúng giáng lâm và nghiền nát mọi thứ, [From.GetName] từng là tổ ấm của nền văn minh Indimak cổ đại. Nơi đây hứa hẹn sẽ mang đến những phát hiện khảo cổ động trời."
 CYBREX_ARCHEOLOGY_3: "Vỏ Bọc Chiến Đấu Cybrex Bị Hư Hại"
 CYBREX_ARCHEOLOGY_3_DESC: "Phát hiện xác hai vỏ bọc chiến đấu Cybrex trôi dạt trên quỹ đạo gần [From.GetName]. Cần phải thọc sâu điều tra."
 CYBREX_ARCHEOLOGY_4: "Cuộc Xâm Lăng Cybrex"
 CYBREX_ARCHEOLOGY_4_DESC: "Rất lâu về trước, [From.GetName] từng chứng kiến một cuộc huyết chiến trên bộ kinh thiên động địa, khi lũ Cybrex đang hung hãn xé xác thổ dân trên [From.GetPlanetMoon]. Ngay lúc này, ta vẫn còn cơ may mò được cổ vật từ bãi chiến trường năm xưa."
 CYBREX_ARCHEOLOGY_5: "Tàn Tích Cybrex"
 CYBREX_ARCHEOLOGY_5_DESC: "[From.GetName] từng bị lũ Cybrex vắt kiệt để phát triển kịch kim, nhưng chả hiểu sao lại chừa ra một mảng hình chữ nhật nguyên thủy ngay vùng xích đạo. Các bộ óc vĩ đại của ta phải lật tung ngọn ngành vụ này."
 CYBREX_ARCHEOLOGY_6: "Tiền Đồn Nghe Lén Cybrex"
 CYBREX_ARCHEOLOGY_6_DESC: "Thực chất tiểu hành tinh [From.GetName] đếch phải là tiểu hành tinh, mà là một con tàu vũ trụ do Cybrex tạo ra. Khoảng 600.000 năm trước, bọn Cybrex đã dùng nó làm một trạm nghe lén ngầm."
 CYBREX_ARCHEOLOGY_7: "Nhà Máy Tinh Chế Cybrex"
 CYBREX_ARCHEOLOGY_7_DESC: "Dọc theo quỹ đạo quanh [From.GetName] đang rập rờn vài mảnh rác từ nhà máy tinh chế của Cybrex. Có vẻ đám máy móc này từng hì hục cày cuốc khai khoáng tại đây."
 CYBREX_ARCHEOLOGY_8: "Tàn Tích Trận Chiến"
 CYBREX_ARCHEOLOGY_8_DESC: "Khoảng sáu trăm ngàn năm trước, một màn đọ súng không gian hoành tráng đã nổ ra sát sạt [From.GetName], thu hút ít nhất năm hạm đội lao vào choảng nhau. Một trong số đó là đồ của bọn Cybrex."
 CYBREX_ARCHEOLOGY_9: "Căn Cứ Cybrex Cổ Đại"
 CYBREX_ARCHEOLOGY_9_DESC: "Xưa kia trên mặt [From.GetName] từng mọc lên một căn cứ của quân Cybrex, nhưng giờ chỗ này chỉ còn là một hố bom toang hoác. Ta phải xắn tay vào điều tra xem chuyện quỷ quái gì đã xảy ra."
 CYBREX_ARCHEOLOGY_10: "Hài Cốt Hữu Cơ"
 CYBREX_ARCHEOLOGY_10_DESC: "Tầm một ngàn xác chết ngoài hành tinh được vớt lên từ quỹ đạo quanh [From.GetName]. Thời điểm chết của chúng khá trùng khớp với khoảng thời gian bọn Cybrex đang xưng bá ở xó này của thiên hà."
 CYBREX_ARCHEOLOGY_11: "Trạm Nghiên Cứu Cybrex"
 CYBREX_ARCHEOLOGY_11_DESC: "Trong một khoang làm việc thuộc trạm nghiên cứu Cybrex lơ lửng gần [From.GetName], ta lượm lặt được vài thứ vụn vặt còn sót lại của tộc Cybrex."
 CYBREX_HOMEWORLD_PROJECT: "$cybrex_1_poi$"
 CYBREX_HOMEWORLD_PROJECT_DESC: "$cybrex_1_poi_desc$"
 TARBLAC_PROCUREMENT: "Ảo Ảnh Tarblac"
 TARBLAC_PROCUREMENT_DESC: "Bắt gặp loài Tarblac lặn ngụp dưới làn nước của hành tinh đại dương [This.GetName]."
 TASSARGOID_PROCUREMENT: "Tassargoid Lực Lưỡng"
 TASSARGOID_PROCUREMENT_DESC: "Loài Tassargoid lởn vởn trong những khu rừng rậm nhầy nhụa ẩm ướt trên [This.GetName]."
 ORINTHI_PROCUREMENT: "Orinthi Đê Tiện"
 ORINTHI_PROCUREMENT_DESC: "Loài Orinthi nhung nhúc khắp mọi ngóc ngách trên [This.GetName]."
 SNIRAN_PROCUREMENT: "Sniran Xảo Trá"
 SNIRAN_PROCUREMENT_DESC: "Loài Sniran chỉ chui rúc dưới biển cát trên [This.GetName]."
 GOOLANTHA_PROCUREMENT: "Goolantha Dẻo Dai"
 GOOLANTHA_PROCUREMENT_DESC: "Đàn thú Goolantha họa chăng chỉ tung hoành trên vùng thảo nguyên bát ngát của [This.GetName]."
 UDDLORAN_PROCUREMENT: "Uddloran Gian Xảo"
 UDDLORAN_PROCUREMENT_DESC: "Dấu vết của loài Uddloran chỉ le lói hiện diện trên vùng đất hoang phủ đầy tuyết trắng của [This.GetName]."
 ZULCOR_PROCUREMENT: "Zulcor Tham Lam"
 ZULCOR_PROCUREMENT_DESC: "Bầy bọ Zulcor là thổ dân định cư trong khe núi khô hạn của [This.GetName]."
 SUBLIGHT_PROBE_PROJECT: "Thu Hồi Tàu Thăm Dò"
 SUBLIGHT_PROBE_PROJECT_DESC: "Trong hệ [space_probe.GetStarName], ta đã bắt được tung tích con tàu thăm dò tốc độ dưới ánh sáng có tuổi đời già nua của mình. Chắc chắn phải cẩu nó về càng sớm càng tốt."
 BOARD_CULT_SHIP_1: "Đột Kích Tàu Tà Giáo"
 BOARD_CULT_SHIP_1_DESC: "Lực lượng vũ trang của ta đã phế võ công một con tàu tà giáo. Ta nên ập lên tàu để thu gom tin tức tình báo và tù binh có giá trị."
 BOARD_CULT_SHIP_2: "Đột Kích Kỳ Hạm Tà Giáo"
 BOARD_CULT_SHIP_2_DESC: "Ta đã đấm gục kỳ hạm của bọn tà giáo! Nhưng muốn đổ bộ và cướp trọn con tàu thì phải xua quân số lượng lớn mới ăn thua."
 CULTIST_DEBRIS: "Tàn Xác Chiến Hạm Tà Giáo"
 CULTIST_DEBRIS_DESC: "Bọn tà đạo này có vẻ đã táy máy chế ra được loại vũ khí mới, cuộc truy lùng căn cứ của chúng coi như đứt đoạn tại đây. Nếu ta cạy được công nghệ của chúng, họa chăng mới đánh hơi ra sào huyệt tên cầm đầu."
 SMUGGLER_RAID_PROJECT: "Tập Kích Hang Ổ Buôn Lậu"
 SMUGGLER_RAID_PROJECT_DESC: "Lũ buôn lậu đã đóng rễ một tiền đồn trái phép trên bề mặt [From.GetName], một hành tinh tị nạn của dân bản địa đang rúc dưới trướng bảo kê của ta. Phải nhổ cỏ tận gốc cái mầm tai họa này trước khi chúng kịp gieo rắc thêm mầm mống hủy hoại cho nền văn minh bản địa trên [From.GetPlanetMoon]."
 ROGUE_BOMBARDMENT_PROJECT: "Trừ Khử Đặc Vụ Phản Bội"
 ROGUE_BOMBARDMENT_PROJECT_DESC: "Cuối cùng thì ta cũng túm được cái đuôi của tên phản bội đang chui lủi trong sào huyệt ngoại ô thành phố trên [From.GetName]. Quăng cho hạm đội cái lệnh nã pháo từ không gian thổi tung chỗ đó đi."
 AVERT_PRIMITIVE_WAR_PROJECT: "Ngăn Chặn Chiến Tranh Trên [prelude_to_war_planet.GetName]"
 AVERT_PRIMITIVE_WAR_PROJECT_DESC: "Màn đi đêm của ta trên [prelude_to_war_planet.GetName] vừa dính sạn, đám người [prelude_to_war_country.GetSpeciesNamePlural] đang chực chờ quăng bom hạt nhân vào nhau đến nơi rồi. Điệp viên nằm vùng của ta trên [prelude_to_war_planet.GetPlanetMoon] đang cầu viện một tàu khoa học cắm chốt trên quỹ đạo dập tắt đám cháy này."
 FALLEN_SHIELD_PROJECT: "Làm Suy Yếu Khiên Chắn Của [shielded_planet.GetName]"
 FALLEN_SHIELD_PROJECT_DESC: "Mắc chứng gì không biết mà có kẻ rảnh rỗi bọc trọn [shielded_planet.GetName] vào một cái khiên năng lượng kín như bưng. Xung nhịp năng lượng của nó cứ trồi sụt thất thường, chứng tỏ cái của nợ này đã ngâm ở đây hàng thiên niên kỷ rồi. Bằng mọi giá ta phải xé toạc cái khiên này để lôi tuột những bí ẩn giấu diếm bên trong ra ánh sáng."
 BOARD_HYACINTH: "Đổ Bộ Tàu Hyacinth"
 BOARD_HYACINTH_DESC: "Con tàu Hyacinth lù lù nằm trên [hyacinth_planet.GetName], trông ngoại hình thì chả sứt mẻ tí nào. Phải lùa một toán quân đổ bộ lên đó xem rốt cuộc chuyện quái quỷ gì đã xảy ra với cái con tàu viễn chinh này."
 SYNTH_INFILTRATION_PROJECT: "Phương Pháp Dò Tìm Tổng Hợp Nhân"
 SYNTH_INFILTRATION_PROJECT_DESC: "Bọn điệp viên tổng hợp nhân đang thọc sâu vào hàng ngũ người [Root.GetSpeciesNamePlural] ngay trong lãnh thổ [Root.GetName]. Ta phải vắt óc nặn ra một ngón nghề chắc cốp để lật tẩy bọn chúng."
 CAPTURE_QUEEN: "Bắt Sống Trùng Hậu"
 CAPTURE_QUEEN_DESC: "Hệ sao [queen_system.GetName] vừa hứng chịu một trận đại chiến không gian, một con Trùng hậu Prethoryn đang thoi thóp nhưng vẫn còn thở. Gông cổ được nó sẽ là một cú ăn đậm của giới tình báo."
 ESTABLISH_COMMUNICATIONS: "Điều Tra [Prev.From.GetName]"
 ESTABLISH_COMMUNICATIONS_DESC: "Ta cần moi móc thêm thông tin về cái giống loài ngoài hành tinh bí ẩn mang bí danh §Y[Prev.From.GetName]§!. Nếu chúng biết há mỏ nói chuyện, ta phải bóc tách thứ ngôn ngữ đó rồi kết nối đường dây giao tiếp.\n\nPhần thưởng: £influence£ §GẢnh Hưởng§! hoặc §SDự án đặc biệt§!"
