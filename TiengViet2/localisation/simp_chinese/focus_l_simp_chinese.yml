 development.520.desc: ""
 development.520.hint: "Xây §HViện Khảo cứu Bệ Gen§! trên một ô ['concept_building'] còn trống tại một trong số các hành tinh của bạn."
 development.520.lore: "§L“Mã gen mà sinh ra không phải để người ta vọc vạch, thì tại sao nó lại dễ thọc gậy bánh xe thế hả?”§!"
