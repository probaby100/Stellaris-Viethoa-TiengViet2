 core.100.name: "Lập Thuộc địa"
 core.100.desc: ""
 core.100.hint: "Dùng £colony_ship£['concept_colony_ship'] để định cư trên một £planet£['concept_planet'] sống được."
 core.100.lore: "§L“Một hành tinh mới không chỉ là việc lớn của quốc gia, mà còn là trách nhiệm không thể chối từ.” —— Sổ tay Vận hành Thuộc địa, bản thứ 223.§!"
 core.100.req: "Đã lập một thuộc địa"
 core.100.fail: "£trigger_no£$core.100.req$"
 core.100.success: "£trigger_yes£$core.100.req$"
 core.102.name: "Thiết lập Loại hình Thuộc địa"
 core.102.desc: "(Ngoài thủ đô)"
 core.102.hint: "Tại một thuộc địa không phải thủ đô, hãy mở thẻ $colony_view_tab_planet_summary$ trong £interface£['concept_colony_view'] và đổi ['concept_designation']."
 core.102.lore: "§L“Nói theo kiểu nhà nước thì phân loại thuộc địa giúp tăng hiệu suất. Nhưng xui thay, đây chỉ là cách nói hoa mỹ để biến việc ‘tùy cơ ứng biến’ trông giống một chiến lược kinh tế nào đó.”§!"
 core.102.req: "Đã đổi phân loại thuộc địa cho một hành tinh"
 core.102.fail: "£trigger_no£$core.102.req$"
 core.102.success: "£trigger_yes£$core.102.req$"
 core.104.name: "Xây Trạm Khai thác"
 core.104.desc: ""
 core.104.hint: "Dùng £construction_ship£['concept_construction_ship'] xây một £mining_station£['concept_mining_station'] trên một ['concept_celestial_object'] phù hợp."
 core.104.lore: "§L“Nhiều người chỉ thấy một cục đá trôi nổi. Còn trong mắt chúng tôi, đó là một đống tiền với hình thù hơi cồng kềnh.”§!"
