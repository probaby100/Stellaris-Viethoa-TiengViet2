 development.505.name: "Sản lượng Hàng Tiêu dùng +3000/tháng"
 development.505.desc: ""
 development.505.hint: "Để chế tạo £consumer_goods£['concept_consumer_goods'], hãy xây £district£['concept_industrial_districts'] và £building£['building:building_factory_1'] ở thẻ $colony_view_tab_planet_summary$ trong £interface£['concept_colony_view']. Bạn cũng có thể mua £consumer_goods£§H$concept_consumer_goods$§! trên £market£['concept_market'] hoặc từ các ['concept_empires'] khác."
 development.505.lore: "§L“Đám đó chả nhét cái của nợ này vào bụng, cũng chả đắp vào cỗ máy chiến tranh. Có thứ lại chỉ mang về... để ngắm. Sự cồng kềnh thảm hại của từng cá thể thực sự làm người ta phát điên.”§!"
 development.505.req: "Sản lượng hàng tiêu dùng hàng tháng đạt +3000"
 development.505.fail: "£trigger_no£$development.505.req$"
 development.505.success: "£trigger_yes£$development.505.req$"
 development.510.name: "Có Quan hệ +200 với 10 Đế chế"
 development.510.desc: ""
 development.510.hint: "$development.100.hint$"
 development.510.lore: "§L“Nhân duyên rộng quá đâm ra cũng hao tâm tổn trí phết đấy.”§!"
