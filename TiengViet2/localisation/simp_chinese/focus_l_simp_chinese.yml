 exploration.205.name: "Thăng cấp Nhà khoa học"
 exploration.205.desc: ""
 exploration.205.hint: "Phân công một £science_ship£['concept_science_ship'] do £scientist£['concept_scientist'] chỉ huy đi khảo sát £system£['concept_systems'], nghiên cứu £anomaly£['concept_anomalies']. Cũng có thể bổ nhiệm làm ['concept_governor'] hoặc vào ['concept_council'].\n\nMỗi nhiệm vụ đều giúp tích lũy kinh nghiệm, giúp họ thăng cấp và nhận các ['concept_leader_traits'] mới."
 exploration.205.lore: "§L“Tri thức không phải là đích đến, mà là một cây cầu — nó chỉ vươn dài ra khi ta có gan bước lên.” —— Con đường Học giả: Thấu hiểu sinh Trưởng thành.§!"
