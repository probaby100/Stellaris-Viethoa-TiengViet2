 development.500.name: "Xây Hội trường Vĩ mô"
 development.500.desc: ""
 development.500.hint: "Sau khi nghiên cứu công nghệ £society£§H$tech_interstellar_assembly$§!, tìm một ['concept_star'] phù hợp và phái £construction_ship£['concept_construction_ship'] tới xây £megastructure£['concept_megastructure'] §H$tech_interstellar_assembly$§!.$focus_other$"
 development.500.lore: "§L“Nắm được cái loa liên lạc là nắm luôn cả guồng quay lịch sử.” —— Ái nữ của Tối cao Tổng lý Sagu Subu.§!"
