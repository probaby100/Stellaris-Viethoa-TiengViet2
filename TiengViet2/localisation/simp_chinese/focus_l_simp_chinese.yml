 development.405.lore: "§L“Nền văn minh chóp bu chả rảnh đi giành giật tài nguyên, tụi nó ngồi kẻ vạch xem tài nguyên là cái khỉ gì cơ.” —— Bước ngoặt của Tầng thứ Ba.§!"
