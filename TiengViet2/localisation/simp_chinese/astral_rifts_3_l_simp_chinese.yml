 astral_rift.3060.b: "Chia sẻ dữ liệu nghiên cứu về Baol cho Grunur."
 astral_rift.3060.c: "Từ chối hợp tác."
 astral_rift.3065.name: "Màn Giới Thiệu Nhẹ Nhàng"
 astral_rift.3065.desc: "Chúng ta giải thích rằng mình là những nhà nghiên cứu đến từ một chiều không gian khác, với sứ mệnh khám phá những biến đổi của vũ trụ cùng muôn vàn hiện tượng tồn tại trong đó.\n\nKhi chúng ta nói rõ ý định của mình, tên đô đốc khịt mũi khinh bỉ. Lính tráng quanh chúng ta bắt đầu kích động và huyên náo, phát ra những tiếng la hét và kêu quác quác inh ỏi.\n§E\"Thấy, rồi sao? Chuyện chứng kiến đã xong. Giờ là lúc bắt đầu van xin.\"§!"
 astral_rift.3065.a: "Ra vẻ phô trương thanh thế. Không được để bị đe dọa."
 astral_rift.3065.b: "Cố gắng nói lý lẽ với chúng."
 astral_rift.3070.name: "Chia Sẻ Tri Thức"
 astral_rift.3070.desc.common_1: "Chúng ta đã chia sẻ cho vị tư lệnh hạm đội Grunur dữ liệu nghiên cứu về "
 astral_rift.3070.desc.common_2: ". Gần như ngay lập tức, bầu không khí thù địch dịu bớt. Grunur rõ ràng rất ấn tượng trước những hứa hẹn của chúng ta về chiến tranh công nghệ cao.\n\nBọn chúng lên kế hoạch sử dụng công nghệ này trong chiến dịch diệt chủng sắp tới. Để bày tỏ sự cảm tạ, vị tư lệnh hạm đội đã tặng chúng ta một viên tinh thể dữ liệu. Từ những lời giải thích đi kèm, chúng ta hiểu rằng nó chứa đựng những bí mật quân sự vô giá, bao gồm các chiến lược và công nghệ mà trước đây chúng ta chưa hề biết đến. Nó cũng bao gồm những miêu tả tường tận về lịch sử quân sự của Grunur - một bản ghi chép dài hàng trăm cuốn - dù có lẽ cũng chẳng giúp ích gì nhiều cho chúng ta."
