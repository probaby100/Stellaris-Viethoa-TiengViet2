 astral_rift.3070.a: "Một cuộc trao đổi đầy ý nghĩa."
 astral_rift.3075.name: "Làm Chứng Nhân"
 astral_rift.3075.desc: "Grunur vô cùng cảm kích vì chúng ta đã chia sẻ thông tin về Baol. Xét tới việc chủng tộc của chúng chẳng mấy hứng thú với hoạt động gián điệp hay các phương thức chiến tranh gián tiếp khác, thông tin của chúng ta chắc chắn sẽ giúp chúng hoàn thiện chiến lược trong cuộc đại diệt chủng sắp tới.\n\nMặc dù vậy, tên đô đốc của chúng vẫn giữ thái độ cảnh giác:\n\n§E\"Hiểu biết thì tốt, nhưng được chứng kiến tận mắt còn tuyệt hơn. Tận mắt nhìn thấy cảnh tuyệt diệt, mới hay biển học là vô bờ.\"§!"
 astral_rift.3075.a: "Quan sát hành động diệt chủng."
 astral_rift.3075.b: "Từ chối."
 astral_rift.3076.name: "Bày Tỏ Lập Trường"
 astral_rift.3076.desc: "Đó là một nước đi mạo hiểm, nhưng sự can đảm của chúng ta đã được đền đáp. Tên chỉ huy Grunur đặc biệt ấn tượng với câu chuyện chúng ta du hành giữa các vũ trụ thông qua quả cầu thám hiểm rạn nứt. Có vẻ như, việc phô diễn lòng dũng cảm và sự oai hùng là đặc trưng tiêu biểu của người Grunur. Đối với chúng, một cuộc đối thoại luôn có kẻ thắng người thua - và cuộc trò chuyện lần này rõ ràng đã mang về cho chúng ta chút điểm cộng. Chúng ta thậm chí còn tận mắt chứng kiến những tiếng lách cách từ càng của chúng nhằm biểu thị sự tán thành.\n\nCuối cùng, kẻ lãnh đạo đứng dậy khỏi trạm điều khiển cùng một loạt tiếng kêu lạch cạch nhịp nhàng.\n\n§E\"Dũng cảm là tốt, nhưng hành động mới là trên hết. Thời khắc đã đến, hãy giành lấy sự tôn trọng.\"§!\n\nMột cột tinh thể sừng sững trước mặt chúng ta, tương tự như các cột dựng quanh bệ điều khiển chỉ huy.\n\n§E\"Quá trình khai hỏa bắt đầu. Đợi lệnh.\"§!"
 astral_rift.3076.a: "Nhấn vào tinh thể. Ra lệnh khai hỏa."
 astral_rift.3076.b: "$astral_rift.3075.b$"
 astral_rift.3080.name: "Trừng Phạt"
 astral_rift.3080.desc.default: "Grunur hoàn toàn chẳng mảy may hứng thú nghe chúng ta giải thích.\n\nVị tư lệnh hạm đội đứng dậy khỏi trạm điều khiển, phát ra một tràng tiếng kêu lạch cạch xen lẫn những tiếng bẻ gãy chói tai từ những chiếc càng.\n\n§E\"Phiên xử kết thúc. Bắt đầu trừng phạt.\"§!\n\nChúng ta bị giải đến một phòng giam. Nghe tiếng \"cười\" của bọn lính canh, số phận của chúng ta hẳn là lành ít dữ nhiều. Thiết bị của chúng ta đang bị tịch thu. Đây sẽ là tín hiệu truyền tải cuối cùng của chúng ta."
 astral_rift.3080.desc.organic: "$astral_rift.3080.desc.default$\n\nCầu mong gia đình chúng ta luôn bình an hạnh phúc."
 astral_rift.3080.a: "Hãy kiên cường lên. Chúng tôi sẽ tìm cách đưa các bạn trở về."
 astral_rift.3085.name: "Giao Diện Vũ Khí Grunur"
 astral_rift.3085.desc.common_1: "Kho lưu trữ của Grunur đã được phân tích toàn diện.\n\nNội dung bên trong thật sự khiến người ta bất an. Những chiến công quân sự của chúng mang đậm tính tàn bạo không thể bàn cãi."
 astral_rift.3085.desc.common_homicidal: "Chúng ta đánh giá cao tinh thần của Grunur, coi việc tiêu diệt các giống loài hạ đẳng là một thú vui."
 astral_rift.3085.desc.common_2: "Tuy nhiên, chúng ta đã khám phá ra một khía cạnh công nghệ vũ trụ tiên tiến độc đáo của chúng, thứ có thể thay đổi hoàn toàn hệ thống vũ khí hiện tại của chúng ta. Dù được thiết kế theo đặc điểm sinh lý của Grunur, chúng ta vẫn có thể điều chỉnh lại giao diện này, giúp cải thiện đáng kể độ chính xác khi nhắm bắn."
 astral_rift.3085.desc.common_militarist: "Giao diện mới này sẽ mang lại cho chúng ta lợi thế chiến đấu quyết định, cho phép chúng ta áp đảo kẻ thù một cách triệt để hơn."
 astral_rift.3085.desc.pacifist: "$astral_rift.3085.desc.common_1$\n\n$astral_rift.3085.desc.common_2$\n\nMặc dù chúng ta hy vọng sẽ không bao giờ phải sử dụng đến, nhưng nó sẽ giúp ích cho việc tự vệ của chúng ta."
 astral_rift.3085.desc.homicidal: "$astral_rift.3085.desc.common_1$$astral_rift.3085.desc.common_homicidal$\n\n$astral_rift.3085.desc.common_2$"
 astral_rift.3085.desc.militarist: "$astral_rift.3085.desc.common_1$\n\n$astral_rift.3085.desc.common_2$\n\n$astral_rift.3085.desc.common_militarist$"
 astral_rift.3085.desc.homicidal_militarist: "$astral_rift.3085.desc.common_1$$astral_rift.3085.desc.common_homicidal$\n\n$astral_rift.3085.desc.common_2$\n\n$astral_rift.3085.desc.common_militarist$"
 astral_rift.3085.desc.default: "$astral_rift.3085.desc.common_1$\n\n$astral_rift.3085.desc.common_2$"
 astral_rift.3090.name: "Ngắm Nhìn Hành Tinh Bốc Cháy"
 astral_rift.3090.desc.common_1: "Chúng ta trơ mắt nhìn Grunur bắt đầu bắn phá thuộc địa "
 astral_rift.3090.desc.common_2: ". Sức mạnh áp đảo từ hạm đội của chúng nhanh chóng nghiền nát tuyến phòng thủ mỏng manh của Baol.\n\nKhi lục quân Grunur càn quét bề mặt hành tinh, mọi thứ đều chìm trong biển lửa. Các đơn vị được trang bị súng phun lửa thiêu rụi thảm thực vật địa phương với hiệu suất đáng sợ.\n\nChiến thắng nắm chắc trong tay làm dịu đi giọng điệu khàn khàn của đô đốc Grunur.\n\n§E\"Ta thấy. Ta đốt. Ngươi đã biết chưa?\"§!\n\nMột mẫu vũ khí hỏa công dùng trong cuộc tấn công đã được mang ra cho chúng ta kiểm tra.\n\n§E\"Lửa gột rửa mọi thứ. Ngươi có thể mang đi. Kẻ thù của ngươi sẽ phải khiếp sợ.\"§!"
 astral_rift.3090.desc.baol: "$astral_rift.3090.desc.common_1$Baol$astral_rift.3090.desc.common_2$"
 astral_rift.3090.desc.default: "$astral_rift.3090.desc.common_1$$astral_rift.3090.desc.common_2$"
 astral_rift.3090.tt: "Có thể xây dựng lực lượng tấn công kiểu mới: §H$flamestorm_troopers_army$§!"
 astral_rift.3095.name: "Chuyến Viễn Chinh Kết Thúc"
 astral_rift.3095.desc.gestalt: "Sĩ quan khoa học của chúng ta ở đầu bên kia rạn nứt [solar_system.GetName] đang bị Grunur bắt giữ làm tù binh.\n\nDây neo Tinh thể đã được thu hồi, §Y$tech_rift_sphere$§! đã trở về. Quá trình tải xuống nhật ký dữ liệu cuối cùng đang được tiến hành."
 astral_rift.3095.desc.default: "$astral_rift.3095.desc.gestalt$\n\nChúng ta chỉ có thể hy vọng Grunur sẽ thương xót các thuyền viên trên quả cầu thám hiểm. Ai mà biết được chứ? Những kẽ hở giữa các thế giới vẫn còn chứa đựng quá nhiều ẩn số... nếu may mắn, biết đâu họ thậm chí có thể tìm được đường về."
 astral_rift.3099.name: "[Leader.GetName] Trở Về"
 astral_rift.3099.desc: "§Y[Leader.GetName]§! đã bất ngờ trở về từ khu trại giam bên trong hạm đội Grunur ở đầu bên kia Rạn nứt Tinh thể §Y[From.solar_system.GetName]§!. Không thể xác định được tuổi tác của [Leader.GetHisHer], chỉ có thể đoán là ở khoảng giữa hai mốc thời gian. Trong thân phận một nô lệ của Grunur, [Leader.GetHeShe] đã trở nên vô cùng lão luyện trong việc thiết kế các loại vũ khí mới phục vụ cho chiến tranh giữa các vì sao."
 ####################
 # Môi Trường Sống Nhiệt Đới #
 ####################
 formula_pink_armies: "Đội Hình Màu Hồng"
 opinion_formula_pink: "$formula_pink_armies$"
 formula_pink_opinion_modifier_tt: "Thêm sửa đổi quan điểm §Y$opinion_formula_pink$§! cho tất cả đế chế không thuộc dạng Máy móc, Thạch dạng hoặc Độc Tố."
 astral_rift_tropical_habitat: "Môi Trường Sống Nhiệt Đới"
 astral_rift.3100.name: "$astral_rift_tropical_habitat$"
 astral_rift.3100.desc: "Chúng ta đã tiến vào bầu khí quyển của một hành tinh nhiệt đới tươi tốt. Hệ thực vật ở đây mang đậm sắc tố, những loài nhuyễn thể phình to đang trườn qua những cây sai trĩu quả.\n\nThỉnh thoảng, một làn sương mù màu hồng kỳ lạ lại tạt qua tán cây rực rỡ như kính vạn hoa.\n\nXét độ rậm rạp của tán lá, chúng ta cần tiến hành quan sát kỹ hơn từ mặt đất."
 astral_rift.3100.a: "Tìm một bãi đáp thích hợp."
 astral_rift.3105.name: "Hạ Cánh Thô Bạo"
 astral_rift.3105.desc: "Sau khi hạ cánh, chúng ta phát hiện một vết nứt trên địa hình, ẩn dưới lớp đất phù sa mỏng manh. Lớp khí màu hổ phách mà chúng ta quan sát từ trên cao trở nên đặc quánh hơn ở dưới này. Chúng ta suy đoán rằng miệng hở này là một lỗ thông khí từng hoạt động trước đây, nối sâu xuống lõi hành tinh.\n\nBắt đầu từ đây, thảm thực vật trở nên cực kỳ đa dạng, cây cối rậm rạp, trái ngọt trĩu cành. Từng đàn sên mập mạp dạng cầu chầm chậm bò qua khu rừng, mãn nguyện đánh chén, hoặc nằm ườn ra ngủ trên lớp đất giàu dinh dưỡng, vây quanh là lũ con của chúng."
 astral_rift.3105.a: "Kiểm tra hệ động vật."
 astral_rift.3105.b: "Lấy mẫu khí màu hồng."
 astral_rift.3110.name: "Hệ Sinh Thái Động Vật Ăn Cỏ"
 astral_rift.3110.desc: "Chúng ta đã thu thập đủ loại mẫu vật từ hệ động vật trên hành tinh. Sự sống ở đây hoàn toàn không có tính hung hăng; mọi sinh vật chúng ta bắt gặp đều là động vật ăn cỏ. Loại nhuyễn thể giống ốc sên này tiêu thụ một lượng lớn thực vật, và có thể tích trữ những lớp mỡ dày đặc bên dưới lớp vỏ ngoài xanh đốm của nó.\n\nSự đa dạng của hệ động vật vô cùng độc đáo; trong một hệ sinh thái thông thường, rất dễ để tiến hóa ra một giống loài đi săn những con mồi đơn giản này. Chúng ta tin rằng, bản tính hiền lành của những loài động vật này là kết quả từ các hợp chất hữu cơ kỳ lạ có trong làn khí màu hồng ở khắp nơi. Việc điều tra nguồn gốc của những nguyên tố này hứa hẹn sẽ hé lộ thêm nhiều thông tin."
 astral_rift.3110.a: "Tìm kiếm nguồn gốc."
 astral_rift.3111.name: "Khí Gây Ảo Giác"
 astral_rift.3111.desc: "Loại khí chúng ta phát hiện trên hành tinh này được chứng minh là có đặc tính gây ảo giác nguy hiểm. Ký ức về quãng thời gian chúng ta ở bên ngoài khối cầu lúc tuyệt nhất cũng chỉ là những mảng ký ức mơ hồ. Tuy nhiên, nhờ kiểm tra lại bản ghi từ camera trên bộ đồ bảo hộ, chúng ta đã chắp vá thành công những trải nghiệm trong chuyến thám hiểm của mình.\n\nChúng ta đã lang thang vô định một lúc lâu trên những bình nguyên tràn đầy sức sống của thế giới ngoại hành tinh mờ ảo. Chúng ta cảm thấy mỗi bước đi đều là một khám phá vĩ đại; những loài thực vật kiều diễm, những con nhuyễn thể thỏa mãn tản bộ trên những khoảng đất trống, những trái cây thơm ngon - chúng ta đã ngấu nghiến thưởng thức tất cả những thứ đó. Vật chất gây say trong không khí đã mang lại cho chúng ta cảm giác thành tựu to lớn về chuyến thám hiểm, dù thu hoạch chẳng được là bao.\n\nBộ lọc trong bộ đồ bảo hộ không đủ sức bảo vệ chúng ta khỏi loại khí này. May thay, một vài người trong chúng ta đã loạng choạng quay lại được nơi trú ẩn của §Y$tech_rift_sphere$§!, tại đây chúng ta mới có thể khôi phục lại nhận thức. Mặc dù có cảm giác như chúng ta mới chỉ vừa rời đi, nhưng thực tế chúng ta đã thám hiểm suốt mấy ngày liền.\n\nKhông cần phải nhắc nhở thêm, chúng ta sẽ dốc sức nâng cấp thiết bị hô hấp để hoàn thành nốt phần điều tra còn lại."
 astral_rift.3111.a: "Tìm nguồn gốc của khí này."
 astral_rift.3115.name: "Phân Tích Khí Quyển"
 astral_rift.3115.desc.common: "Chúng ta đã lấy mẫu lớp sương mù màu hồng lơ lửng trên bề mặt hành tinh, và tiến hành phân tích ở cấp độ phân tử.\n\nLoại khí này có tác dụng gây ảo giác cực mạnh, có thể khiến nhiều dạng sống sinh học trở nên ngoan ngoãn và tự mãn. Dưới tác động của nó, một cá thể có trí tuệ dễ bị ảnh hưởng sẽ chỉ cố gắng thỏa mãn những nhu cầu cơ bản nhất, đồng thời vẫn cảm nhận được cảm giác thành tựu lớn lao.\n\nHơn nữa, các hợp chất trong không khí của nó kích thích sự hình thành mỡ bằng cách tác động lên năng suất sinh sản hormone tự nhiên trong cơ thể người hít phải. Do khả năng kiểm soát phân bổ dinh dưỡng và phản ứng miễn dịch tự thân bị suy yếu, điều này lại càng làm tăng sự thèm ăn của các sinh vật bị ảnh hưởng. Về lâu dài, kết quả sẽ là một vòng lặp tuần hoàn vô tận của việc tiêu hóa quá mức. Dựa vào các dấu vết enzyme, chúng ta có thể khẳng định loại khí này được tạo ra bởi sinh vật, nhưng lại không thể tìm thấy con vật nào thải ra thứ khí này."
 astral_rift.3115.desc.toxoid_or_lithoid: "$astral_rift.3115.desc.common$\n\nChất an thần này sẽ không gây ra bất kỳ rủi ro nào cho đặc tính sinh học của chúng ta. Dù ở nồng độ cực cao, nó cũng chỉ ảnh hưởng nhẹ đến chúng ta."
 astral_rift.3115.desc.mechanical: "$astral_rift.3115.desc.common$\n\nChất an thần này sẽ không có tác dụng với các drone của chúng ta. Chúng ta có thể tự do khám phá sâu hơn trong trạng thái an toàn."
 astral_rift.3115.desc.default: "$astral_rift.3115.desc.common$\n\nĐể tiếp tục khám phá, chúng ta sẽ cần trang bị hô hấp toàn diện để tránh bị trúng độc."
 astral_rift.3115.a: "$astral_rift.3111.a$"
 astral_rift.3115.b: "Đeo thiết bị hô hấp và tiếp tục."
 astral_rift.3120.name: "Khe Nứt Lớn"
 astral_rift.3120.desc: "Nhờ sử dụng cảm biến chất lượng không khí, chúng ta đã lùng sục khắp những vùng đất rậm rạp để tìm nơi có nồng độ khí độc tập trung cao nhất. Vượt qua một bụi cây chi chít quả mọng, chúng ta được dẫn đến trước cửa một vết nứt khổng lồ giữa khoảng đất trống. Làn sương mù màu hồng đặc quánh không ngừng bốc ra từ trong đó.\n\nChúng ta tin rằng loại khí này do một sinh vật ngầm ở dưới đáy vết nứt này tạo ra. Tìm thấy nó, tốt nhất là khi còn sống, có thể mở ra những cơ hội nghiên cứu độc nhất vô nhị."
 astral_rift.3120.a: "Cẩn thận một chút. Đào bới xung quanh miệng nứt."
 astral_rift.3120.b: "Trực tiếp khám phá khe nứt."
 astral_rift.3125.name: "Đào Bới Khe Nứt"
 astral_rift.3125.desc: "Chúng ta đã hoán cải thiết bị thu thập mẫu vật của §Y$tech_rift_sphere$§! thành công cụ đào xới, và dùng nó để đào mở lối vào vết nứt. Sau khi cắt qua một lớp phủ màu vàng ẩm ướt và dày đặc, chúng ta phát hiện một lớp đất mới. Nó có màu đất son, khi bị đào bới sẽ vỡ vụn thành từng mảnh vụn dạng vảy lớp, và chỉ cần một rung động cơ học nhẹ nhất cũng sẽ giải phóng ra một lượng nhỏ khí màu hồng.\n\nMặc dù lớp đất này chứa nồng độ hợp chất hữu cơ rất cao, nhưng vẫn chưa đủ để trở thành nguồn gốc tạo ra loại hợp chất đó.\n\nCàng đào sâu, công cụ thu hoạch càng đâm xuyên qua những tầng đất sẫm màu và đỏ au hơn. Ngay lúc này, mặt đất rung chuyển dữ dội. Một đám mây khí màu hồng đặc quánh phun trào từ rãnh do chúng ta đục khoét. Kế đó, vùng đất tối tăm này chuyển động hệt như một sinh vật sống.\n\nCông cụ thu hoạch của chúng ta nhanh chóng bị lớp bùn đỏ như máu nuốt chửng và nghiền nát thành từng mảnh. Sự chấn động của bề mặt xung quanh ngày càng dữ dội, ép chúng ta phải rút lui lên tầng khí quyển cao hơn.\n\nNơi này không còn chào đón chúng ta nữa."
 astral_rift.3125.a: "Nghiên cứu mẫu đất."
 astral_rift.3130.name: "Khám Phá Khe Nứt"
 astral_rift.3130.desc: "Chúng ta mang theo thiết bị leo núi đơn giản bước vào khe nứt, tìm kiếm sinh vật ẩn mình bên dưới. Khi leo dần xuống, lớp vách khoáng hóa cũng chuyển từ loại đất vàng ẩm ướt sang đất vảy màu hồng đậm. Xa hơn xuống dưới, mọi thứ đều biến thành một màu đỏ thẫm phập phồng như đang thở.\n\nKhi tiếp tục hạ độ cao, chúng ta bị bao trùm bởi những luồng khí màu hồng đặc quánh phun trào. Sau khi chạm đáy, chúng ta đã phát hiện ra ngọn nguồn của nó: một tấm màng lưới giăng ngang đường kính của vết nứt, treo lủng lẳng một khoang miệng, ở trung tâm miệng là một cái mỏ bằng kitin. Từ sinh vật này, một mạch máu lớn ngoằn ngoèo cắm sâu vào trong đá.\n\nChúng ta đã tìm thấy một sinh mệnh ăn thịt, và rất có thể nó chính là cả cái hành tinh này."
 astral_rift.3130.a: "Bóc tách khoang miệng."
 astral_rift.3130.b: "Thu thập đất từ sâu trong vách đá."
 astral_rift.3135.name: "Bóc Tách"
 astral_rift.3135-3140.desc.common: "Chúng ta đã cắt đứt khoang miệng từ cái ống trung tâm nhô ra khỏi lớp đá đỏ thẫm, và bắt đầu ngoi lên lại mặt đất."
 astral_rift.3135.desc.common.1: "$astral_rift.3135-3140.desc.common$\n\nNhư một phản ứng đáp trả, vách của khe nứt rung chuyển dữ dội, khí sinh học nồng nặc tràn ngập đường hầm. Chúng ta cảm thấy cả buồng kín đang lắc lư, khi tiến gần mặt đất thì lối ra cũng ngày càng nhỏ lại. Nó - dù \"nó\" là cái quái gì đi nữa - đang cố nuốt chửng chúng ta."
 astral_rift.3135.desc.common.2: "Nơi này không còn hoan nghênh chúng ta nữa."
 astral_rift.3135.desc.toxoid: "$astral_rift.3135.desc.common.1$\n\nMay mắn thay, khi cọ xát vào cơ thể có độc tính bẩm sinh của chúng ta, những vách tường màu đỏ thẫm như da thịt đã phản xạ rụt lại. Chúng ta trốn thoát mà không hề sứt mẻ gì. Vừa lên tới mặt đất, khe nứt liền khép lại, chỉ để lại một vết sẹo nhỏ trên bãi đất trống. Mặt đất xung quanh rung chuyển ngày một dữ dội, hối thúc chúng ta nhanh chóng quay lại tầng khí quyển cao hơn.\n\n$astral_rift.3135.desc.common.2$"
 astral_rift.3135.desc.default: "$astral_rift.3135.desc.common.1$\n\nNgay khi miệng nứt sắp sửa áp sát ngay sau lưng, chúng ta đã kịp thoát ra ngoài, bỏ lại một vết lõm phía sau. Bề mặt quanh ta rung chuyển ngày càng dữ dội, chúng ta rút lui lên tầng khí quyển cao hơn.\n\n$astral_rift.3135.desc.common.2$"
 astral_rift.3135.a: "Phân tích cơ quan bị cắt đứt."
 astral_rift.3140.name: "Bóc Tách Khốc Liệt"
 astral_rift.3140.desc.common: "$astral_rift.3135-3140.desc.common$\n\nVách của khe nứt rung chuyển dữ dội, khí sinh học cô đặc tràn ngập đường hầm, che khuất mọi tầm nhìn. Chúng ta tranh nhau leo lên mặt đất, nhưng lối thoát xung quanh ngày một thu hẹp lại.\n\nThật không may, [Leader.GetName] đã không kịp thoát hẳn khỏi đường hầm trước khi nó khép lại. Nửa thân dưới của họ bị vách nứt kẹp chặt, rồi bị nghiền nát bởi một sức mạnh địa chấn khủng khiếp."
 astral_rift.3140.desc.robot: "$astral_rift.3140.desc.common$\n\nMay mắn là, tất cả các linh kiện đều có thể thay thế."
 astral_rift.3140.desc.default: "$astral_rift.3140.desc.common$\n\nChúng ta đã tìm thấy thân xác tàn tạ của [Leader.GetName] và trốn thoát về tầng khí quyển cao hơn. [Leader.GetHeShe] đã gánh chịu những tổn thương không thể vãn hồi, nhưng vẫn có thể duy trì trạng thái ổn định nhờ hệ thống hỗ trợ sự sống."
 astral_rift.3140.a: "$astral_rift.3135.a$"
 astral_rift.3145.name: "Kỳ Quan Địa Chất"
 astral_rift.3145.desc: "Chúng ta phân tích mẫu đất màu hồng kỳ lạ vừa thu thập, và xác nhận sự tồn tại của một hệ sinh vật khoáng hóa có quy mô rộng lớn hơn. Chúng ta tin rằng, loại vật chất này cùng với chất liệu đỏ thẫm từng nghiền nát công cụ của chúng ta đều là những bộ phận của cùng một sinh vật - chính là hành tinh này. Giả thuyết của chúng ta là, hành tinh có tri giác này đã tự sáng tạo ra một hệ sinh thái riêng, nhằm cung cấp cho nó một nguồn gia súc ngoan ngoãn và giàu dinh dưỡng không ngớt.\n\nĐất đai mang đặc tính màu mỡ đáng kể, giải thích lý do tại sao thảm thực vật trên bề mặt hành tinh lại rậm rạp đến vậy. Chúng ta đã có thể áp dụng một vài nguyên lý từ đó vào trong các phương thức canh tác của riêng mình."
 astral_rift.3150.name: "$astral_rift.3145.name$"
 astral_rift.3150.desc: "Để tránh kinh động sinh vật này, chúng ta đã nhanh chóng thu thập mẫu vật của ba loại đất từ vách tường phập phồng trong khe nứt, rồi rời khỏi hành tinh mà không xảy ra sự cố gì thêm.\n\nChúng ta đã phân tích các mẫu vật thu thập được và xác nhận suy đoán của mình - bản thân hành tinh này là một sinh thể sống.\n\nLớp đất mặt màu vàng rất giàu dinh dưỡng, có thể làm phân bón thúc đẩy thực vật phát triển thần tốc. Lớp khoáng chất vảy màu hồng là một vật trung gian giúp phân tán hiệu quả khí độc trên toàn bộ bề mặt hành tinh. Cuối cùng, vật chất đỏ thẫm đóng vai trò như hệ tuần hoàn của hành tinh, có khả năng phân bổ lại khoáng chất và tài nguyên hữu cơ đến những nơi cần thiết nhất.\n\nKhe nứt mà chúng ta chạm trán chắc chắn là một đường tiêu hóa, chúng ta thật may mắn vì đã không bị xơi tái.\n\nDù sao đi nữa, chúng ta đã có thể ứng dụng đặc tính màu mỡ vượt trội của lớp đất mặt vào phương pháp canh tác của chính mình. Dạng sống độc đáo mà chúng ta bắt gặp trong không gian Tinh thể này sẽ tiếp tục được nghiên cứu trong nhiều năm tới."
 astral_rift.3155.name: "Giải Phẫu Hành Tinh"
 astral_rift.3155.desc.common: "Trải qua vô số thí nghiệm trên cơ quan tiêu hóa bị cắt rời, chúng ta đã hiểu sâu hơn về hệ sinh thái của hành tinh này. Đầu tiên, toàn bộ hành tinh này đều là một sinh thể sống - từ đất đai cho đến mọi thứ khác.\n\nBên trong đường tiêu hóa khoang miệng là các túi chứa vật liệu sinh học cô đặc cao, có thể bốc hơi vào tầng khí quyển thấp hơn. Mục đích của loại khí này là vỗ béo các loài động vật sống trên bề mặt, và ngăn chặn sự tiến hóa của những kẻ săn mồi khác. Kế đó, con mồi đang trong trạng thái mê mẩn sẽ bị hành tinh nuốt chửng thông qua một cái miệng khổng lồ tương tự như cái mà chúng ta đã gặp. Cái miệng mà chúng ta phục hồi được chỉ là một trong số hàng ngàn khoang miệng như thế."
 astral_rift.3155.desc.robotic_or_pacifist: "$astral_rift.3155.desc.common$\n\nChúng ta đã học được cách tổng hợp nhân bản loại khí màu hồng này, cũng như thay đổi các đặc tính của nó để ứng dụng trong thực tế, dùng làm pheromone cho các nhà ngoại giao của chúng ta. Dù nồng độ đã giảm đi rất nhiều, nó vẫn duy trì được tác dụng an thần mạnh mẽ đối với hầu hết các dạng sống sinh học tự nhiên."
 astral_rift.3155.desc.default: "$astral_rift.3155.desc.common$\n\nChúng ta đã học được cách tổng hợp nhân bản và thay đổi các đặc tính của khí màu hồng, biến nó thành thuốc giảm đau trên chiến trường ứng dụng vào thực tế. Chúng ta đã tăng cường hiệu ứng gây tê của khí và loại bỏ chất ức chế tính hung hăng, nhờ vậy những binh lính bị thương có thể phớt lờ nỗi đau thể xác và tiếp tục chiến đấu."
 astral_rift.3155.a: "Đúng là một sinh vật phi thường."
 ####################
 # Người Lạ Tâm Linh #
 ####################
 zroni_insight_modifier: "Thấu Hiểu Zroni"
 zroni_insight_space_storm_reduction_modifier: "Biện Pháp Bảo Vệ Bão Táp Thấu Hiểu Zroni"
 zroni_insight_space_storm_reduction_modifier_tt: "Biện pháp phòng ngự chống lại tác động tiêu cực của §IBão Vũ Trụ§!: §G-50%§!"
 astral_rift_psionic_stranger: "Kẻ Lạ Mặt Linh Năng"
 astral_rift.3200.name: "Kẻ Lạ Mặt Linh Năng"
 astral_rift.3200.desc.common: "Chúng ta đã đến một hành tinh băng giá nhiều đồi núi."
 astral_rift.3200.desc.common.non_robot: "Gần như ngay tức khắc, chúng ta bị chấn động bởi một sự giao tiếp bằng thần giao cách cảm vô cùng mạnh mẽ:\n\n§E\"Xin chào, hỡi những lữ khách phương xa. Từ sâu thẳm trong tiềm thức thiền định, ta đã cảm nhận được chuyến hành trình của các người băng qua cõi Tinh thể. Đến đây nào, hãy để chúng ta gặp mặt. Có lẽ sự xuất hiện của các người chính là bước đột phá mà ta hằng mong đợi.\"\n\n§!Hình ảnh về một hang động đơn độc biệt lập hiện ra trước mắt chúng ta."
 astral_rift.3200.desc.common.psionic: "Dù kẻ này là ai đi chăng nữa, năng lực linh năng của họ cũng vượt xa khả năng của chúng ta."
 astral_rift.3200.desc.common.robot: "Không lâu sau đó, mạch điện của chúng ta bị giật trúng bởi một đoạn truyền phát sóng ngoại lai:\n\n§E\"Xin chào, hỡi những lữ khách phương xa. Từ sâu thẳm trong tiềm thức thiền định, ta đã cảm nhận được chuyến hành trình của các người băng qua cõi Tinh thể. Đến đây nào, hãy để chúng ta gặp mặt. Có lẽ sự xuất hiện của các người chính là bước đột phá mà ta hằng mong đợi.\"\n\n§!Chúng ta nhận được một bộ tọa độ dẫn đến một nơi xa xôi trên hành tinh."
 astral_rift.3200.desc.common.non_psionic: "Việc phát hiện ra sự tồn tại của chúng ta nhanh đến vậy, lại còn phát tín hiệu từ một khoảng cách xa như thế, chứng tỏ kẻ lạ mặt bí ẩn này sở hữu sức mạnh tinh thần cực kỳ khó tin."
 astral_rift.3200.desc.robot_psionic: "$astral_rift.3200.desc.common$\n\n$astral_rift.3200.desc.common.robot$\n\n$astral_rift.3200.desc.common.psionic$"
 astral_rift.3200.desc.robot: "$astral_rift.3200.desc.common$\n\n$astral_rift.3200.desc.common.robot$\n\n$astral_rift.3200.desc.common.non_psionic$"
 astral_rift.3200.desc.psionic: "$astral_rift.3200.desc.common$\n\n$astral_rift.3200.desc.common.non_robot$\n\n$astral_rift.3200.desc.common.psionic$"
 astral_rift.3200.desc.default: "$astral_rift.3200.desc.common$\n\n$astral_rift.3200.desc.common.non_robot$\n\n$astral_rift.3200.desc.common.non_psionic$"
 astral_rift.3200.a: "Tìm kiếm sự tồn tại này."
 astral_rift.3205.name: "Tiên Tri"
 astral_rift.3205.desc.intro: "Chúng ta khóa tầm nhìn vào một điểm trên một trong những dãy núi cao nhất hành tinh.\n\nMột người đeo mặt nạ đang ngồi thiền trong một hang động hẻo lánh. Cô là một sinh vật hình người có làn da xám xịt, được bao bọc bởi một quầng sáng năng lượng màu tím nhạt đang nhịp nhàng dao động."
 astral_rift.3205.desc.outro: "§E\"Cảm ơn vì đã nhận lời mời, chúng ta có rất nhiều điều cần bàn.\"\n\n\"Ta được gọi là Tiên Tri. Đã bao năm qua, ta luôn ngồi thiền giữa vùng đất hoang vu băng giá này, chờ đợi một tia khai sáng. Sự xuất hiện của các người ở đây tuyệt nhiên không phải sự tình cờ.\"§!"
 astral_rift.3205.desc.common.completed_zroni: "Chúng ta nhận ra người ngoài hành tinh này chính là người Zroni. Hàng triệu năm trước, chủng tộc có thiên phú linh năng này từng sống trong vũ trụ của chúng ta, cho đến khi một cuộc nội chiến đã dẫn đến sự tuyệt diệt hoàn toàn giống loài của họ. Có lẽ rạn nứt này là cánh cửa dẫn đến một dòng thời gian song song, nơi mà người Zroni vẫn chưa thăng thiên vào trong Hư Không (Shroud)."
 astral_rift.3205.desc.common.started_zroni: "Chúng ta nhận ra người ngoài hành tinh này chính là người Zroni, một thành viên của chủng tộc có thiên phú linh năng từng sống trong vũ trụ của chúng ta hàng triệu năm trước. Có lẽ rạn nứt này là cánh cửa dẫn tới một dòng thời gian song song, và người Zroni vẫn còn tồn tại sống sót trong đó."
 astral_rift.3205.desc.common.not_started_zroni: "Những chiếc sừng phát sáng mọc ra từ trên đầu người ngoài hành tinh, và những chiếc gai tương tự nhưng phát triển kém hơn cũng đâm ra từ trên lưng cô. Chúng ta không hề quen thuộc với giống loài này, nhưng chắc chắn họ phải có khả năng đồng điệu cao độ với các luồng sóng linh năng."
 astral_rift.3205.desc.common.gestalt: "Chúng ta nhận được một thông tin liên lạc khác:"
 astral_rift.3205.desc.common.default: "Người ngoài hành tinh lại cất tiếng nói trong tâm trí chúng ta:"
 astral_rift.3205.desc.gestalt_started_zroni: "$astral_rift.3205.desc.intro$\n\n$astral_rift.3205.desc.common.started_zroni$\n\n$astral_rift.3205.desc.common.gestalt$\n\n$astral_rift.3205.desc.outro$"
 astral_rift.3205.desc.gestalt_completed_zroni: "$astral_rift.3205.desc.intro$\n\n$astral_rift.3205.desc.common.completed_zroni$\n\n$astral_rift.3205.desc.common.gestalt$\n\n$astral_rift.3205.desc.outro$"
 astral_rift.3205.desc.gestalt_not_started_zroni: "$astral_rift.3205.desc.intro$\n\n$astral_rift.3205.desc.common.not_started_zroni$\n\n$astral_rift.3205.desc.common.gestalt$\n\n$astral_rift.3205.desc.outro$"
 astral_rift.3205.desc.default_started_zroni: "$astral_rift.3205.desc.intro$\n\n$astral_rift.3205.desc.common.started_zroni$\n\n$astral_rift.3205.desc.common.default$\n\n$astral_rift.3205.desc.outro$"
 astral_rift.3205.desc.default_completed_zroni: "$astral_rift.3205.desc.intro$\n\n$astral_rift.3205.desc.common.completed_zroni$\n\n$astral_rift.3205.desc.common.default$\n\n$astral_rift.3205.desc.outro$"
 astral_rift.3205.desc.default_not_started_zroni: "$astral_rift.3205.desc.intro$\n\n$astral_rift.3205.desc.common.not_started_zroni$\n\n$astral_rift.3205.desc.common.default$\n\n$astral_rift.3205.desc.outro$"
 astral_rift.3205.a: "Lắng nghe những lời của Tiên Tri."
 astral_rift.3210.name: "Gánh Nặng Của Tiên Tri"
 astral_rift.3210.desc: "Vị Tiên Tri tiếp lời:\n\n§E\"Ta vẫn luôn nỗ lực thâm nhập vào chiều không gian tâm linh. Người dân của các người gọi nơi này là 'Hư Không' (Shroud). Gần đây, ta cảm nhận được một tiếng gọi xa lạ, ta tin rằng nó vọng tới từ tận sâu trong Hư Không. Ta hiện đang đứng ngay trước ngưỡng cửa của lần đầu tiên đặt chân vào thế giới thần bí này.\"§!\n\nVị Tiên Tri thở dài.\n\n§E\"Người dân đã phó thác trọng trách này cho ta. Tiến vào Hư Không quả thực có thể ban cho chúng ta sức mạnh vô biên, nhưng trong lòng ta lại ngập tràn hoài nghi. Càng đến gần, lực kéo của Hư Không tác động lên ta càng mạnh. Những lời thì thầm vang vọng trong những góc khuất tăm tối thẳm sâu. Nguồn sức mạnh như thế, liệu có thực sự kiểm soát được chăng? Và rồi, ngay tại thời khắc quyết định này, các người lại xuất hiện. Việc này tuyệt nhiên không phải sự tình cờ.\"§!"
 astral_rift.3210.a: "Hé lộ định mệnh cho người Zroni."
 astral_rift.3210.b: "Nói cho người Zroni này biết tất cả những gì chúng ta biết."
 astral_rift.3210.c: "Chúng tôi chỉ có thể đưa ra góc nhìn của mình."
 astral_rift.3210.d: "Chúng tôi không có quyền can dự."
 astral_rift.3210.e: "Những mưu cầu tâm linh như vậy thật vô bổ."
 astral_rift.3215.name: "Điềm Báo Ngày Tàn"
 astral_rift.3215.desc: "Chúng ta đã giải thích cho vị Tiên Tri về những gì mà nghiên cứu khảo cổ học về nền văn minh Zroni dạy cho chúng ta.\n\nChúng ta miêu tả chi tiết về cái giá của sự toàn năng, việc nó đã châm ngòi cho sự chia rẽ giữa những người Zroni trong chiều không gian của chúng ta như thế nào, và phác họa bức tranh về cuộc nội chiến khốc liệt cuối cùng đã dẫn đến sự diệt vong của họ.\n\nVị Tiên Tri trầm ngâm suy ngẫm về những lời nói của chúng ta.\n\n§E\"Liệu những nỗ lực của ta ở đây có thực sự đẩy chúng ta vào chỗ chết? Nếu việc thâm nhập vào Hư Không sẽ rước lấy tai họa, vậy thì việc tiếp tục theo đuổi nó quả là điều xuẩn ngốc. Người dân đặt trọn niềm tin vào ta. Nếu ta lên án Hư Không là ngọn nguồn của sự thối nát, khao khát thăng thiên của chúng ta có lẽ sẽ bị dập tắt. Nhưng biết đâu vẫn còn một lối thoát... Với vốn tri thức các người vừa ban tặng, ta có thể tiếp cận những sức mạnh thượng đẳng bên trong Hư Không bằng một phương thức khác, ra tay ngặn chặn trước thảm kịch từng giáng xuống người dân của ta trong chiều không gian của các người.\"§!"
 astral_rift.3215.a: "Đây là một nỗ lực nắm chắc thất bại."
 astral_rift.3215.b: "Lần này, có lẽ mọi chuyện sẽ khác..."
 astral_rift.3220.name: "Định Mệnh Đã An Bài"
 astral_rift.3220.desc: "Chúng ta giải thích người Zroni đã lợi dụng Hư Không để thăng thiên lên một cõi tồn tại cao cấp hơn ra sao, vượt thoát khỏi những nhu cầu vật chất và đắm mình trong một thế giới không tưởng gần như toàn năng. Lần thăng thiên này đem lại vô vàn thử thách khắc nghiệt, nhưng nhìn từ góc độ vật chất và xã hội học, đó quả là một thành tựu vĩ đại. Chúng ta cũng lưu ý rằng, các học giả của chúng ta vẫn chưa thể tường tận hoàn toàn về số phận cuối cùng của người Zroni.\n\nVị Tiên Tri hồi đáp:\n\n§E\"Cứ như thể người Zroni ở bất kỳ chiều không gian nào cũng đều bị định mệnh sắp đặt phải bước vào Hư Không; số mệnh này vượt xa mọi giới hạn của một dòng thời gian đơn lẻ. Biết đâu chừng, ngay từ đầu, sự lựa chọn này vốn đã không nằm trong tầm tay của chúng ta.\"§!"
 astral_rift.3220.a: "Khuyên can đừng can thiệp vào Hư Không."
 astral_rift.3220.b: "Khuyến khích Tiên Tri đột phá vào Hư Không."
 astral_rift.3225.name: "Góc Nhìn Của Chúng Ta"
 astral_rift.3225.desc.gestalt: "Chúng ta giải thích rằng, [Explorer.GetName] tồn tại như một ý thức tập thể, một quyết định mang ý nghĩa lớn lao như vậy không nên giao cho một cá nhân đơn lẻ lựa chọn. Phàm là chuyện mang lại lợi ích cho toàn thể xã hội Zroni thì chắc chắn đó là một quyết định đúng đắn, và sự khó chịu của cá nhân không nên được coi là một yếu tố để cân nhắc.\n\nVị Tiên Tri đáp lời:\n\n§E\"Có lẽ việc nhìn nhận tình huống nan giải này từ một góc độ mang tính tập thể rộng lớn hơn như các người mới là khôn ngoan. Các người khuyên chúng ta nên tiếp bước thế nào?\"§!"
 astral_rift.3225.desc.non_gestalt_spiritualist: "Chúng ta đã chia sẻ chi tiết về mối quan hệ của chính chúng ta với các đấng thiêng liêng. Khát vọng khai sáng chính là lý do chúng ta khám phá, tìm kiếm những ý nghĩa siêu việt vượt lên trên bản thân và thắt chặt mối liên kết giữa chúng ta với vũ trụ.\n\nVị Tiên Tri đáp lời:\n\n§E\"Về điểm này, các người rất giống chúng ta. Người Zroni từ lâu đã khao khát vươn ra khỏi thế giới vật chất, vậy ta lấy quyền gì để cự tuyệt sự thăng thiên của người dân ta đây? Với tư cách là những kẻ đi tìm chân lý, các người khuyên chúng ta nên tiếp bước thế nào?\"§!"
 astral_rift.3225.desc.non_gestalt_materialist: "Chúng ta giải thích rằng chân lý khoa học khách quan là cách chúng ta định vị bản thân trong vũ trụ. Quá trình theo đuổi tri thức đã đưa chúng ta đến những ranh giới mới và thậm chí còn xa hơn nữa. Nó thậm chí còn cho phép hai giống loài chúng ta gặp gỡ nhau giữa các chiều không gian.\n\nVị Tiên Tri đáp lời:\n\n§E\"Chúng ta hoàn toàn khác biệt, người dân của ta cũng vậy. Tuy nhiên, dù niềm tin của các người đi ngược lại với đức tin của chúng ta, các người vẫn tràn đầy sự tôn trọng và trí tuệ. Biết đâu trong tình cảnh này, góc nhìn của các người lại ẩn chứa sự anh minh. Với tư cách là những kẻ phàm tục, các người khuyên chúng ta nên bước tiếp thế nào?\"§!"
 astral_rift.3225.desc.default: "Chúng ta giải thích rằng, chúng ta tin mục tiêu của xã hội là phát triển và thịnh vượng dựa theo các nguyên tắc của nó. Việc thể hiện các giá trị cá nhân trên vũ đài ngân hà, đó mới là bài kiểm tra đích thực đối với một nền văn minh. Nếu bước vào Hư Không thực sự là ý nguyện của người dân các bạn, vậy thì các bạn có trách nhiệm phải tiếp tục tiến lên.\n\nVị Tiên Tri đáp lời:\n\n§E\"Ta hiểu, nhưng ý chí của người dân đang bị chia rẽ. Hỡi những lữ khách phương xa, các người có thể đưa ra lời chỉ dẫn nào không? Gánh nặng quyết định quáỗi nặng nề, một mình ta chẳng thể gánh vác nổi.\"§!"
 astral_rift.3225.a: "Khuyên can đừng can thiệp vào Hư Không."
 astral_rift.3225.b: "Khuyến khích Tiên Tri đột phá vào Hư Không."
 astral_rift.3230.name: "Cứ Để Định Mệnh An Bài"
 astral_rift.3230.desc.intro: "Chúng ta giải thích rằng mình chẳng hề có hứng thú đưa ra góc nhìn của bản thân, và đây cũng chẳng phải một cuộc viếng thăm do định mệnh sắp đặt. Chúng ta chỉ là những lữ khách thám hiểm, tình cờ đi ngang qua chốn này mà thôi.\n\n§E\"Tốt thôi. Có lẽ quyết định không can dự của các người lại chính là một tín hiệu khác mà ta cần phải giải mã. Vậy thì hãy đi đi, và nhớ mở to đôi mắt ra.\"§!"
 astral_rift.3230.desc.outro: "Để mặc vị Tiên Tri đắm chìm trong suy tư, chúng ta đi khám phá địa hình xung quanh, thầm mong chuyến hành trình của chúng ta ở đây có thể mang lại chút lợi ích thiết thực. Chẳng bao lâu sau, chúng ta đã phát hiện ra một mỏ khoáng quý giá nằm lọt thỏm giữa hai đỉnh núi."
 astral_rift.3230.desc.completed_zroni: "$astral_rift.3230.desc.intro$\n\nRất có thể lịch sử của người Zroni sẽ lại tái diễn trong chiều không gian này, nhưng số phận của họ không phải là thứ chúng ta có quyền thao túng.\n\n$astral_rift.3230.desc.outro$"
 astral_rift.3230.desc.started_zroni: "$astral_rift.3230.desc.intro$\n\nNgười Zroni có con đường riêng phải đi, việc can thiệp vào các dòng thời gian khác là điều thiếu khôn ngoan.\n\n$astral_rift.3230.desc.outro$"
 astral_rift.3230.desc.default: "$astral_rift.3230.desc.intro$\n\n$astral_rift.3230.desc.outro$"
 astral_rift.3230.a: "Khám phá mỏ khoáng vật."
 astral_rift.3235.name: "Lời Khuyên Tiên Tri"
 astral_rift.3235.desc.intro: "Lần này chúng ta đã ngăn cản Tiên Tri bước vào Hư Không, và cô ấy đã đón nhận lời khuyên của chúng ta như một lời sấm truyền. Để thay lời cảm tạ, cô đưa cho chúng ta một viên tinh thể dữ liệu nhỏ nhắn nhưng nặng trịch. Chúng ta nhận lấy nó rồi rời đi.\n\nPhân tích viên tinh thể dữ liệu tiết lộ một ma trận biến đổi tinh vi; đó là một kho lưu trữ khổng lồ được mã hóa dưới dạng linh năng."
 astral_rift.3235.desc.gestalt: "$astral_rift.3235.desc.intro$\n\nMặc dù viên tinh thể là một mẫu vật kỹ thuật kỳ lạ, chúng ta đã chuyển đổi cơ sở dữ liệu của nó thành một dạng năng lượng hữu ích hơn."
 astral_rift.3235.desc.materialist: "$astral_rift.3235.desc.gestalt$"
 astral_rift.3235.desc.default: "$astral_rift.3235.desc.intro$\n\nNhững thông tin bên trong đó mang đến những hiểu biết sâu sắc về lý thuyết linh năng."
 astral_rift.3235.a: "Biết đâu chúng ta sẽ còn gặp lại."
 astral_rift.3240.name: "$astral_rift.3235.name$"
 astral_rift.3240.desc.intro: "Chúng ta khuyến khích Tiên Tri mạo hiểm thâm nhập vào Hư Không để thăng thiên lên một cõi tồn tại cao hơn, cô ấy đã đón nhận lời khuyên của chúng ta như một lời sấm truyền. Để thay lời cảm tạ, cô đưa cho chúng ta một viên tinh thể dữ liệu nhỏ nhắn nhưng nặng trịch. Chúng ta cáo từ.\n\nPhân tích viên tinh thể dữ liệu tiết lộ một ma trận biến đổi tinh vi; đó là một kho lưu trữ khổng lồ được mã hóa dưới dạng linh năng."
 astral_rift.3240.desc.completed_zroni: "Biết đâu lần này, giống loài của cô ấy sẽ đón nhận một kết cục tươi sáng hơn."
 astral_rift.3240.desc.gestalt: "$astral_rift.3240.desc.intro$\n\nMặc dù viên tinh thể là một mẫu vật kỹ thuật kỳ lạ, chúng ta đã chuyển đổi cơ sở dữ liệu của nó thành một dạng năng lượng hữu ích hơn."
 astral_rift.3240.desc.gestalt_completed_zroni: "$astral_rift.3240.desc.gestalt$\n\n$astral_rift.3240.desc.completed_zroni$"
 astral_rift.3240.desc.materialist: "$astral_rift.3240.desc.gestalt$"
 astral_rift.3240.desc.materialist_completed_zroni: "$astral_rift.3240.desc.gestalt_completed_zroni$"
 astral_rift.3240.desc.default: "$astral_rift.3240.desc.intro$\n\nNhững thông tin bên trong đó mang đến những hiểu biết sâu sắc về lý thuyết linh năng."
 astral_rift.3240.desc.default_completed_zroni: "$astral_rift.3240.desc.default$\n\n$astral_rift.3240.desc.completed_zroni$"
 astral_rift.3240.a: "$astral_rift.3235.a$"
 astral_rift.3245.name: "Cơ Hội Gõ Cửa"
 astral_rift.3245.desc: "Chúng ta đã phát hiện ra một mỏ khoáng khổng lồ trong thung lũng giữa hai ngọn núi, chôn vùi dưới lớp đá tinh thể sạt lở. Nền đất quá bất ổn để tiến hành chiến dịch khai thác quy mô lớn, nhưng chúng ta vẫn dùng những thiết bị hạn hẹp để khai thác những gì có thể trên bề mặt mỏ.\n\nNhờ số lượng lớn tài nguyên quý giá thu về, chuyến thám hiểm lần này đã thành công rực rỡ."
 astral_rift.3245.a: "$FASCINATING$"
 astral_rift.3280.name: "Thông Điệp Từ Phía Bên Kia"
 astral_rift.3280.a: "Một nước đi chín chắn."
 astral_rift.3280.desc.intro: "Trong lúc thám hiểm tại §Y[From.System.GetName]§!, chúng ta đã dò thấy một khoang tàu vũ trụ nhẵn bóng bất ngờ trồi ra từ rạn nứt."
 astral_rift.3280.desc.encountered_priestess: "Nữ tư tế Zroni mà chúng ta chạm trán ở đó đã gửi cho chúng ta một thông điệp."
 astral_rift.3280.desc.common: "§E\"Đa tạ những lời sấm truyền từ [From.Leader.GetName] trên tàu [From.Explorer.GetName]. Kể từ lúc đó, ta đã tránh xa mọi cám dỗ của Hư Không. Lấy các người làm tấm gương sáng, chúng ta đã tự học cách du hành giữa các chiều không gian Tinh thể để tìm kiếm thêm nhiều đáp án. Chúng ta xin chia sẻ một vài phát kiến của mình để bày tỏ lòng biết ơn.\"§!\n\nBên trong khoang tàu chứa một lượng lớn dữ liệu nghiên cứu thu thập được từ các chiều không gian song song khác."
 astral_rift.3280.desc.started_zroni: "$astral_rift.3280.desc.intro$\n\n$astral_rift.3280.desc.encountered_priestess$\n\n$astral_rift.3280.desc.common$"
 astral_rift.3280.desc.completed_zroni.common: "Có vẻ như ít nhất giống loài này đã tìm được một không gian để sinh tồn."
 astral_rift.3280.desc.completed_zroni: "$astral_rift.3280.desc.started_zroni$\n\n$astral_rift.3280.desc.completed_zroni.common$"
 astral_rift.3280.desc.default.common: "Nó chứa một thông điệp đơn giản:"
 astral_rift.3280.desc.default: "$astral_rift.3280.desc.intro$\n\n$astral_rift.3280.desc.default.common$\n\n$astral_rift.3280.desc.common$"
 astral_rift.3285.name: "Lời Hứa Hư Không"
 astral_rift.3285.a: "$astral_rift.3280.a$"
 astral_rift.3285.desc.common: "§E\"Đa tạ chuyến viếng thăm do định mệnh xui khiến của [From.Leader.GetName] trên con tàu [From.Explorer.GetName]. Chúng ta không chỉ đột phá vào Hư Không, mà người dân Zroni cũng đã bắt đầu di cư vĩnh viễn vào đó. Nơi đây ban cho chúng ta sức mạnh và sự hòa hợp phi thường đến nhường nào, chúng ta đang sống trong một xã hội không tưởng mà bản thân chưa từng dám mơ tới!\n\nTrước khi hoàn toàn dứt áo rời khỏi thế giới vật chất, chúng ta muốn chia sẻ chút của cải vật chất của mình với các người.\"§!"
 astral_rift.3285.desc.started_zroni: "$astral_rift.3280.desc.intro$\n\n$astral_rift.3280.desc.encountered_priestess$\n\n$astral_rift.3285.desc.common$"
 astral_rift.3285.desc.completed_zroni: "$astral_rift.3285.desc.started_zroni$\n\n$astral_rift.3280.desc.completed_zroni.common$"
 astral_rift.3285.desc.default: "$astral_rift.3280.desc.intro$\n\n$astral_rift.3280.desc.default.common$\n\n$astral_rift.3285.desc.common$"
