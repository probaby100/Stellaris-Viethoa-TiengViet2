l_simp_chinese:
 #####################
 #Siege on Paradise #
 #####################
 astral_rift_siege_on_paradise: "Cuộc Vây Hãm Thiên Đường"
 astral_rift.3000.name: "$astral_rift_siege_on_paradise$"
 astral_rift.3000.desc: "Chúng ta đã đến một hành tinh trù phú. Từ những khu rừng rậm rạp đến những đồng bằng xanh mướt, cảnh quan nơi đây từng vô cùng đa dạng, được giữ gìn sạch sẽ không tì vết, một khu vườn hành tinh tràn đầy sức sống.\n\nMột giống loài thực vật chưa rõ danh tính đã xây dựng hàng loạt công trình phòng thủ quanh các thành phố bán hữu cơ của họ. Quét hệ sao địa phương cho thấy nơi này đang bị phong tỏa bởi những chiến hạm được trang bị tối tân. Dù chưa có giao tranh nào xảy ra, nhưng rõ ràng một cuộc xung đột đang âm ỉ."
 astral_rift.3000.a: "Liên lạc với khu dân cư trên hành tinh."
 astral_rift.3000.b: "Liên lạc với hạm đội trên quỹ đạo."
 ######################
 # Nhánh Sự Kiện Baol #
 ######################
 NAME_Baol: "Baol"
 NAME_Baol_leader: "Thân Sồi"
 baol_leader_desc: "§Y[Root.GetName]§! được tìm thấy trong một Rạn nứt Tinh thể. Ông là một vị tướng lục quân đáng kính trong cuộc chiến chống lại Grunur."
 baol_leader_catch_phrase: "Tôi sẽ hỗ trợ nếu cần thiết."
 edict_astral_cloaking: "Tàng Hình Tinh Thể"
 edict_astral_cloaking_desc: "Sợi Tinh Thể dùng cho máy tạo trường tàng hình sẽ \"phản chiếu\" một phần phi thuyền của chúng ta sang các chiều không gian khác, khiến chúng khó bị phát hiện hơn trong chiều không gian này."
 astral_cloaking_available_tt: "Sắc lệnh §Y$edict_astral_cloaking$§! hiện đã khả dụng."
 astral_shield_experimentation: "Thử Nghiệm Khiên Tinh Thể"
 astral_rift.3005.desc.intro: "Trên bề mặt hành tinh, chúng ta bắt gặp một sinh vật khổng lồ với cơ thể cấu tạo từ một mạng lưới rễ cây chằng chịt."
 astral_rift.3005.desc.common.1: "Chúng ta nhận ra đây là một thành viên của loài Baol, giống loài từng sống trong vũ trụ của chúng ta hàng trăm ngàn năm trước."
 astral_rift.3005.desc.baol_started: "Chúng ta giả định rạn nứt này là cánh cửa dẫn tới một vũ trụ song song, nơi người Baol đang điên cuồng bảo vệ thuộc địa của họ."
 astral_rift.3005.desc.baol_completed: "Chúng ta giả định rạn nứt này là cánh cửa dẫn tới một vũ trụ song song, nơi người Baol vẫn chưa bị tuyệt diệt."
 astral_rift.3005.desc.common.2: "Nhờ thu thập được lượng lớn dữ liệu khảo cổ về giống loài này, chúng ta đã sẵn sàng để giao tiếp trực tiếp."
 astral_rift.3005_3006.desc.common.plantoid: "§E\"Xin chào, người anh em cùng chung nòi giống. Hãy giải thích làm thế nào các bạn vượt qua được vòng phong tỏa, và mục đích các bạn đến đây là gì?\"§!"
 astral_rift.3005_3006.desc.common.default: "§E\"Dừng lại, giống loài có trí tuệ chưa rõ danh tính. Hãy giải thích làm thế nào các người vượt qua được vòng phong tỏa. Các người đến đây để đàm phán sao?\"§!"
 astral_rift.3005.name: "Cuộc Gặp Gỡ Với Baol"
 astral_rift.3005.desc.baol_started_plantoid: "$astral_rift.3005.desc.intro$$astral_rift.3005.desc.know_baol.1$$astral_rift.3005.desc.baol_started$$astral_rift.3005.desc.know_baol.2$\n\n$astral_rift.3005_3006.desc.common.plantoid$"
 astral_rift.3005.desc.baol_completed_plantoid: "$astral_rift.3005.desc.intro$$astral_rift.3005.desc.know_baol.1$$astral_rift.3005.desc.baol_completed$$astral_rift.3005.desc.know_baol.2$\n\n$astral_rift.3005_3006.desc.common.plantoid$"
 astral_rift.3005.desc.baol_started_default: "$astral_rift.3005.desc.intro$$astral_rift.3005.desc.know_baol.1$$astral_rift.3005.desc.baol_started$$astral_rift.3005.desc.know_baol.2$\n\n$astral_rift.3005_3006.desc.common.default$"
 astral_rift.3005.desc.baol_completed_default: "$astral_rift.3005.desc.intro$$astral_rift.3005.desc.know_baol.1$$astral_rift.3005.desc.baol_completed$$astral_rift.3005.desc.know_baol.2$\n\n$astral_rift.3005_3006.desc.common.default$"
 astral_rift.3005.a: "Kể cho họ nghe mọi thứ chúng ta biết về Baol."
 astral_rift.3006.name: "Chạm Trán Loài Thực Vật"
 astral_rift.3006.desc.common: "$astral_rift.3005.desc.intro$ Nó phát ra những âm vang trầm mặc và mộc mạc bằng một ngôn ngữ mà chúng ta không thể hiểu. Sau đó, nó đưa cho chúng ta một cây non, cây non này nhẹ nhàng bám chặt vào [Explorer.GetSpeciesHandName] của [Leader.GetName]. Rễ bám của nó được làm từ một loại vật liệu kỳ lạ. Khi chạm vào [Explorer.GetNetworkName], có một khoảnh khắc nhận thức lóe lên; thông qua sự hòa quyện giữa tâm trí và cội rễ, một con đường giao tiếp trực tiếp đã được thiết lập."
 astral_rift.3006.desc.plantoid: "$astral_rift.3006.desc.common$\n\n$astral_rift.3005_3006.desc.common.plantoid$"
 astral_rift.3006.desc.default: "$astral_rift.3006.desc.common$\n\n$astral_rift.3005_3006.desc.common.default$"
 astral_rift.3006.a: "Chúng tôi là những nhà thám hiểm."
 astral_rift.3010.name: "Ngày Tàn Sắp Đến"
 astral_rift.3010.desc.common.1: "Chúng ta giải thích rằng chúng ta biết về giống loài của họ: người Baol trong vũ trụ của chúng ta là những người theo chủ nghĩa hòa bình, có tâm trí tập thể. Họ là những người làm vườn với kỹ năng vô song, nhưng lại bị một bọn có tên là "
 astral_rift.3010.desc.common.2: "Người Baol tỏ ra kinh ngạc. Họ giải thích rằng người Grunur mới chỉ xuất hiện gần đây và đã thiết lập vòng phong tỏa quân sự quanh thuộc địa này. Mọi chi tiết chúng ta cung cấp đều trùng khớp với những gì họ đã trải qua với Grunur cho đến nay.\n\nHọ chính thức thỉnh cầu chúng ta hỗ trợ đẩy lùi mối đe dọa ngoại lai này trước khi quá muộn."
 astral_rift.3010.desc.baol_started: "$astral_rift.3010.desc.common.1$giống loài quân phiệt Grunur tấn công và cuối cùng bị tuyệt diệt.\n\nNhìn vào tình hình hiện tại, thuộc địa này đang đối mặt với nguy cơ bị thiêu rụi hoàn toàn.\n\n$astral_rift.3010.desc.common.2$"
 astral_rift.3010.desc.baol_completed: "$astral_rift.3010.desc.common.1$đế chế quân phiệt Grunur tấn công và cuối cùng bị tuyệt diệt.\n\nMọi hành tinh và thuộc địa của Baol đều bị phá hủy. Cuối cùng, chỉ còn lại một cá thể Baol duy nhất, bị mắc kẹt trong một trạm nghiên cứu bỏ hoang suốt hàng ngàn năm.\n\n$astral_rift.3010.desc.common.2$"
 astral_rift.3010.a: "Chúng tôi sẽ cố gắng hết sức để giúp đỡ."
 astral_rift.3010.b: "Chúng tôi không có quyền can thiệp."
 astral_rift.3015.name: "Lời Thỉnh Cầu Viện Trợ"
 astral_rift.3015.desc: "§E\"Chúng tôi đang chuẩn bị cho trận chiến sắp tới. Đáng tiếc là, chuyến thám hiểm của các bạn có thể nguy hiểm hơn nhiều so với dự tính ban đầu.\"§!\n\nGiống loài thực vật tiếp tục nói: §E\"Chúng tôi là §YBaol§!, các bạn đã hạ cánh xuống một trong những thuộc địa vòng ngoài của chúng tôi. Chúng tôi đang bị bao vây, tài nguyên ngày một cạn kiệt. Ngoại giao hoàn toàn vô ích. Kẻ xâm lược công khai chế nhạo những nỗ lực giao tiếp của chúng tôi. Bọn chúng tự xưng là §YGrunur§!.\"§!\n\n§E\"Chúng tôi tin rằng mục tiêu của chúng không phải là chinh phục hành tinh này, mà là hủy diệt nó. Chúng dường như không hề khoan nhượng. Chúng tôi sẽ trân trọng đón nhận bất kỳ sự hỗ trợ nào từ các bạn.\"§!"
 astral_rift.3015.a: "$astral_rift.3010.a$"
 astral_rift.3015.b: "$astral_rift.3010.b$"
 astral_rift.3020.name: "Giải Cứu Baol"
 astral_rift.3020.desc.baol_started: "Chúng ta biết Grunur sẽ san phẳng thuộc địa này. $astral_rift.3020.desc.common.baol$"
 astral_rift.3020.desc.baol_completed: "Chúng ta biết Grunur sẽ không dừng tay cho đến khi tiêu diệt hoàn toàn Baol. $astral_rift.3020.desc.common.baol$"
 astral_rift.3020.desc.common.baol: "Hơn nữa, không có bất kỳ cơ hội nào để giải quyết vấn đề thông qua con đường ngoại giao."
 astral_rift.3020.desc.common.1: "Chúng ta đã thảo luận với Baol để xác định các phương án hỗ trợ thiết thực.\n\n"
 astral_rift.3020.desc.option_gene_tailoring: "Baol có thể cố gắng tự vệ, nhưng năng lực quân sự của họ rất hạn chế. Họ có thể hưởng lợi từ các nâng cấp cơ khí hoặc di truyền để tăng tốc độ, sức mạnh cho lục quân, cũng như khả năng chống chịu trước vũ khí hỏa công.\n\n"
 astral_rift.3020.desc.option_cloaking: "Chúng ta có thể dùng thiết bị tàng hình tạm thời để che giấu thế giới quê hương của họ, giúp người Baol trốn khỏi tầm mắt của Grunur. Thuộc địa này vẫn sẽ sụp đổ, nhưng ít nhất cái nôi của nền văn minh của họ sẽ sống sót.\n\n"
 astral_rift.3020.desc.option_astral_shield: "Chúng ta có thể thử dùng Sợi Tinh Thể để cường hóa công nghệ hữu cơ tiên tiến của người Baol. Đáng lý sẽ tạo ra được một lớp khiên bảo vệ vững chắc bao quanh thuộc địa này. Dĩ nhiên, việc này sẽ khiến họ không thể rời khỏi hành tinh, nhưng ít nhất họ cũng được an toàn trước quân xâm lược.\n\n"
 astral_rift.3020.desc.common.2: "Như một giải pháp cuối cùng, chúng ta có thể mang những cây non Baol về qua rạn nứt, bất kể chuyện gì xảy ra ở chiều không gian này, giống loài này vẫn sẽ tiếp tục tồn tại."
 astral_rift.3020.a: "Tiến hành biến đổi gen cho Baol."
 astral_rift.3020.b: "Triển khai công nghệ tàng hình hành tinh thử nghiệm."
 astral_rift.3020.c: "Bảo vệ cây non."
 astral_rift.3020.d: "Tạo ra khiên Tinh thể."
 astral_rift.3021.name: "Cân nhắc các lựa chọn của chúng ta"
 astral_rift.3021.desc.common: "Vì ngoại giao không phải là một lựa chọn khả thi, chúng ta cần những phương án sáng tạo hơn để hỗ trợ.\n\n$astral_rift.3020.desc.common.1$"
 astral_rift.3025.name: "Khoanh Tay Đứng Nhìn"
 astral_rift.3025.desc: "Vấn đề của Baol, dù là về quân sự hay bất cứ chuyện gì khác, không phải là việc của chúng ta. Chúng ta nên quan sát và khám phá từ một góc độ khác; chúng ta cũng không muốn rước thêm một kẻ thù hùng mạnh mới.\n\nTâm trí tập thể rõ ràng rất thất vọng trước quyết định này nhưng đành chấp nhận, và để chúng ta tiếp tục nghiên cứu."
 astral_rift.3025.a: "Chuẩn bị vệ tinh quan sát."
 astral_rift.3030.name: "Cường Hóa Gen"
 astral_rift.3030.desc: "Chúng ta tận dụng kiến thức về công nghệ cắt tỉa gen để cường hóa giống loài Baol, giúp họ chuẩn bị sẵn sàng cho cuộc chiến phòng thủ sắp tới. Vì gần như chẳng còn lựa chọn nào khác, họ miễn cưỡng chấp nhận những thay đổi sinh học này. Đế chế Baol vốn chuộng hòa bình, lấy nông nghiệp và quản lý hệ sinh thái làm gốc, giờ đây đã sở hữu một lực lượng dân quân thường trực gồm những cá thể phụ có sức phục hồi cao và thể lực phi thường.\n\nLúc này, người Baol đã được chuẩn bị tốt hơn nhiều cho các trận chiến trên mặt đất. Để bày tỏ lòng biết ơn, họ đã tặng chúng ta một cá thể phòng thủ. Sinh vật chuyên biệt và bán tự trị này giờ đây sẽ phục vụ cho chúng ta."
 astral_rift.3031.name: "$NAME_Baol_leader$"
 astral_rift.3031.desc: "§HCá thể của giống loài thực vật này di chuyển khá chậm chạp, nhưng nếu cho rằng sự chậm chạp đó là do thiếu trí tuệ thì bạn đã lầm to. Cá thể này được lai tạo chuyên biệt để bảo vệ tập thể, đại diện cho đỉnh cao của sự thích nghi tỉ mỉ qua nhiều thế hệ. Chúng lạnh lùng nhưng lịch sự chào hỏi chúng ta, một lòng muốn báo đáp ân huệ mà chúng ta đã dành cho bầy đàn của chúng.§!\n\nLà một phần của Baol, chúng tôi không có tên. Bạn có thể gọi chúng tôi là $NAME_Baol_leader$."
 astral_rift.3031.a: "Ngươi là chuyên gia phòng thủ của Baol sao?"
 astral_rift.3031.a.response: "Nhiệm vụ của cá thể này là chuẩn bị sẵn sàng cho các thuộc địa trước chiến tranh phòng thủ. Việc này bao gồm quản lý nguồn tài nguyên hạn hẹp trong thời gian bị bao vây, cũng như thiết kế và bảo trì các công trình phòng thủ quân sự. Bất chấp lệnh phong tỏa, khu vực này vẫn duy trì được mức dân số ổn định. Công việc này được đánh giá là hữu ích."
 astral_rift.3031.b: "Gia nhập với chúng tôi có cảm giác thế nào?"
 astral_rift.3031.b.response: "Cá thể này đã làm tất cả những gì có thể cho Baol. Ở vị trí này, không còn không gian để phát triển thêm; khi một hệ thống sống không thể sinh trưởng, nó sẽ bắt đầu héo úa. Ở chiều không gian này vẫn còn những cơ hội phục vụ khác. Vẫn còn hy vọng về sự phục hưng."
 astral_rift.3031.c: "Tách khỏi tập thể có cảm giác thế nào?"
 astral_rift.3031.c.response: "Cảm thấy bị gò bó. Thật đáng buồn... nhưng đồng thời cũng rất thú vị. Cảm giác này không giống bất kỳ điều gì mà cá thể này từng trải qua trước đây. Tuy nhiên, càng sớm hòa nhập cá thể này vào công việc của [Explorer.GetName] thì càng tốt. Được phục vụ cho một thực thể lớn lao hơn là một việc khiến chúng tôi vui sướng hơn."
 astral_rift.3031.d: "Ngươi muốn chọn một cái tên như thế nào?"
 astral_rift.3031.d.response: "Một trong những nhà nghiên cứu Rạn nứt Tinh thể của các bạn đã cung cấp cho cá thể này một chương trình tạo văn bản AI. Dựa trên đặc điểm của cá thể này để truy vấn, kết quả trả về là: §Y$NAME_Baol_leader$§!. Cảm thấy... cũng khá phù hợp."
 astral_rift.3035.name: "Lẩn Tránh Rada"
 astral_rift.3035.desc: "Sau khi chia sẻ bí mật về trường tàng hình với Baol, họ đã có thể tạo ra mạng lưới vệ tinh tàng hình hữu cơ. Những nhánh thử nghiệm này có tuổi thọ khá ngắn và cần một lượng nhỏ Sợi Tinh Thể để duy trì, nhưng chúng có thể tồn tại đủ lâu để che giấu thế giới quê hương của Baol khỏi tầm mắt của Grunur. Đáng tiếc là, thuộc địa này đã bị Grunur phát hiện, và khả năng cao là sẽ chịu số mệnh diệt vong.\n\nMột khi đã tàng hình, Baol sẽ phải tạm gác lại tham vọng du hành giữa các vì sao, bởi vì bất kỳ phi thuyền nào cất cánh từ thế giới quê hương đều có nguy cơ làm lộ vị trí của họ. Dĩ nhiên, sự bất tiện này vẫn tốt hơn vạn lần so với sự diệt vong."
 astral_rift.3035.a: "Đây là một sự thỏa hiệp đích đáng."
 astral_rift.3040.name: "Sự Sống Sẽ Luôn Tự Tìm Lối Thoát."
 astral_rift.3040.desc.common: "Khi rời khỏi thuộc địa Baol, chúng ta được ủy thác một bó cây non vô giá."
 astral_rift.3040.desc.baol_started: "$astral_rift.3040.desc.common$\n\nNếu xung đột giữa Baol và Grunur tiếp tục leo thang, ít nhất chúng ta cũng cứu được một phần giống loài của họ khỏi sự tàn phá của chiến tranh."
 astral_rift.3040.desc.baol_completed: "$astral_rift.3040.desc.common$\n\nKhi người Baol không thể tránh khỏi sự hủy diệt, có lẽ họ sẽ cảm thấy được an ủi phần nào khi biết giống loài của mình vẫn sinh tồn ở một chiều không gian khác."
 astral_rift.3040.desc.default: "$astral_rift.3040.desc.common$\n\nChúng ta hy vọng xung đột của họ sẽ sớm kết thúc, và Baol có thể phát triển rực rỡ ở cả hai bên bờ rạn nứt."
 astral_rift.3045.name: "Cát Bụi Lại Trở Về Cát Bụi"
 astral_rift.3045_3046.desc.common: "Chúng ta đã chuẩn bị các vệ tinh quan sát và phóng chúng vào quỹ đạo hành tinh, điều này sẽ cho phép chúng ta truyền dữ liệu xuyên qua rạn nứt."
 astral_rift.3045.desc: "$astral_rift.3045_3046.desc.common$\n\nBây giờ, chúng ta sẽ nghiên cứu công nghệ nông nghiệp và quản lý hệ sinh thái tiên tiến của Baol. Và nếu ngày đó thực sự đến, chúng ta cũng sẽ ghi lại được những thước phim quan trọng về quá trình Grunur hủy diệt hành tinh."
 astral_rift.3045.a: "Đây là một cơ hội nghiên cứu độc nhất vô nhị."
 astral_rift.3046.name: "Cơ Hội Nghiên Cứu"
 astral_rift.3046.desc: "$astral_rift.3045_3046.desc.common$\n\nTrước khi cuộc xung đột của họ bùng nổ, chúng ta có thể nghiên cứu hành tinh của Baol cùng phương pháp quản lý hệ sinh thái của họ. Đồng thời, cuộc chiến này cũng sẽ cung cấp những dữ liệu thú vị cho các nghiên cứu trong tương lai."
 astral_rift.3046.a: "$astral_rift.3045.a$"
 astral_rift.3047.name: "Trở Về Cát Bụi"
 astral_rift.3047.desc: "Xa xa ở đầu bên kia rạn nứt, thuộc địa Baol tại [From.solar_system.GetName] đã bị Grunur tàn phá. Chúng ta thu thập được dữ liệu nghiên cứu chi tiết từ cuộc chiến, nhưng mục tiêu của dự án quan sát này cũng đã bị xóa sổ."
 astral_rift.3049.name: "Khiên Tinh Thể"
 astral_rift.3049.desc: "Bằng cách tích hợp Sợi Tinh Thể vào công nghệ phòng thủ của Baol, chúng ta đã phóng ra một lớp khiên hành tinh phản ứng nhanh, nhưng vô cùng vững chắc bao quanh thuộc địa đang bị vây hãm của họ. Lớp khiên này sẽ bao bọc hành tinh và bảo vệ người Baol, chừng nào nó còn tồn tại.\n\nHy vọng nó sẽ trụ đủ lâu để lũ Grunur bỏ cuộc và chuyển hướng sang những mục tiêu dễ nhằn hơn."
 astral_rift.3049.a: "Công nghệ xuất chúng."
 ########################
 # Nhánh Sự Kiện Grunur #
 ########################
 grunur_weapon_interface_modifier: "Giao Diện Vũ Khí Grunur"
 astral_rift.3050.name: "Hộ Tống Kỳ Hạm"
 astral_rift.3050.desc.default: "Chúng ta tiến vào quỹ đạo của hành tinh Gaia và lập tức chạm trán các chiến hạm tuần tra. Chúng ta đã nỗ lực liên lạc, nhưng đáp lại chỉ là sự im lặng.\n\nMột đội tuần tra đã hộ tống chúng ta đến kỳ hạm của họ, một con tàu Juggernaut được trang bị tận răng, xung quanh là hàng chục phi thuyền hỗ trợ. Khi chiếc §Y$tech_rift_sphere$§! của chúng ta vừa hạ cánh xuống một nhà chứa máy bay khổng lồ, chúng ta lập tức bị một toán lính giam giữ. Lớp mai và những chiếc càng răng cưa của chúng gợi nhớ đến vài giống loài giáp xác đã biết. Bọn chúng hành quân tiến lên đều nhịp một cách hoàn hảo, phô diễn một hình ảnh đầy khiếp sợ, nhưng đôi mắt tròn xoe nhô ra từ chiếc đầu bọc thép lại lộ rõ vẻ cảnh giác và tinh ranh."
 astral_rift.3050.desc.baol: "$astral_rift.3050.desc.default$\n\nChúng ta nhận định giống loài này chính là §YGrunur§!, một chủng tộc có tính hiếu chiến cực cao từng sống trong vũ trụ của chúng ta hàng trăm ngàn năm trước. Mọi người đều biết giống loài này đã tuyệt diệt một giống loài có tâm trí tập thể dạng thực vật tên là §YBaol§!. Chúng ta giả định rằng rạn nứt này đã đưa chúng ta đến một vũ trụ song song, nơi mà Grunur vẫn đang hoạt động quân sự mạnh mẽ."
 astral_rift.3050.a: "Grunur rất nguy hiểm. Phải cẩn thận."
 astral_rift.3050.b: "Cùng chờ xem chuyện này sẽ đi đến đâu..."
 astral_rift.3055.name: "Một Cuộc Trò Chuyện Độc Đáo"
 astral_rift.3055.desc.common_1: "Chúng ta bị dẫn đến một căn phòng trung tâm. Một bảng điều khiển phức tạp là nơi làm việc của vài con quái vật giáp xác khổng lồ, những chiếc càng của chúng chèn vào một giao diện chuyên biệt với độ chính xác đáng kinh ngạc. Mỗi trạm cuối chứa vô số tinh thể, rõ ràng được điều khiển bằng âm thanh phát ra từ sâu trong lồng ngực của các nhân viên. Đứng giữa phòng là một vị tư lệnh hạm đội mặc bộ quân phục rách rưới. Nó phát ra một mệnh lệnh, và đám thuộc hạ lập tức hành động."
 astral_rift.3055.desc.organic_common_1: "Một trong các trợ lý nghiên cứu của chúng ta ngay lập tức bị trói chặt và đem đi quét. Trong sự kinh hoàng tột độ của chúng ta, một thiết bị dò tìm đã đâm xuyên qua"
 astral_rift.3055.desc.organic_common_2: "[leader.species.GetSkinType] của họ một cách chí mạng, rút trọn toàn bộ não bộ của họ ra. Nội tạng này nhanh chóng được chuyển cho tên thủ lĩnh giáp xác, kẻ đã ghim phập nó vào một viên tinh thể trên bệ chỉ huy."
 astral_rift.3055.desc.common_2: "Một giọng nói trong trẻo vang lên từ viên tinh thể, nói bằng ngôn ngữ mẹ đẻ của chúng ta: §E\"Đã đến lúc đàm đạo. Các ngươi là ai?\"§!"
 astral_rift.3055.desc.organic: "$astral_rift.3055.desc.common_1$\n\n$astral_rift.3055.desc.organic_common_1$ đâm thủng $astral_rift.3055.desc.organic_common_2$\n\n$astral_rift.3055.desc.common_2$"
 astral_rift.3055.desc.lithoid: "$astral_rift.3055.desc.common_1$\n\n$astral_rift.3055.desc.organic_common_1$ khoan thủng $astral_rift.3055.desc.organic_common_2$\n\n$astral_rift.3055.desc.common_2$"
 astral_rift.3055.desc.mechanical: "$astral_rift.3055.desc.common_1$\n\nMột trong các drone của chúng ta ngay lập tức bị giam giữ và quét dữ liệu. Một dụng cụ sắc nhọn đâm thẳng vào bộ xử lý trung tâm của nó, làm nó ngừng hoạt động hoàn toàn. Bộ xử lý này nhanh chóng được đưa cho thủ lĩnh giáp xác, kẻ đã cắm nó vào một viên tinh thể trên bảng điều khiển chỉ huy.\n\n$astral_rift.3055.desc.common_2$"
 astral_rift.3055.desc.default: "$astral_rift.3055.desc.common_1$\n\n$astral_rift.3055.desc.common_2$"
 astral_rift.3055.a: "Chúng tôi là những nhà thám hiểm, và chúng tôi đã nhìn thấy tương lai của các người."
 astral_rift.3055.b: "Chúng tôi là những nhà thám hiểm."
 astral_rift.3060.name: "Grunur Khét Tiếng"
 astral_rift.3060.desc: "Chúng ta tự giới thiệu là những nhà khoa học đến từ vũ trụ song song.\n\nỞ thế giới của chúng ta, Grunur đã biến mất từ lâu. Theo ghi chép khảo cổ, họ là một chủng tộc chinh phạt, sở hữu kho vũ khí tiên tiến đồ sộ... cùng xu hướng tàn bạo. Chiến dịch tiêu diệt Baol của họ đã trở thành huyền thoại xét về cả độ hiệu quả lẫn quy mô hoành tráng. Định mệnh của họ là phá hủy thuộc địa Baol trong hệ sao này.\n\nKhi lời nói của chúng ta được dịch ra, đám lính Grunur phát ra một loạt tiếng thở dốc. Chúng ta cho rằng đó là tiếng cười của chúng. Tuy nhiên, sự im lặng đầy ngoan cố của vị tư lệnh hạm đội nhanh chóng khôi phục lại nghi thức. Thông qua tinh thể phiên dịch, nó nói:\n\n§E\"Biết, rồi sao? Nếu đã biết, thì phải cống nạp.\"§!"
 astral_rift.3060.a.tech_dragon_armor: "Chia sẻ $tech_dragon_armor$ cho Grunur."
 astral_rift.3060.a.tech_crystal_armor_2: "Chia sẻ $tech_crystal_armor_2$ cho Grunur."
